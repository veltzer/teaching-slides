<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="312" height="170.5882" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="196.0001" y="108.2353" text-anchor="middle" font-size="28.0416" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">1. Steady State</text>
  <text x="196.0001" y="159.4118" text-anchor="middle" font-size="25.4923" font-family="Arial, sans-serif" fill="var(--ok-text)">Define normal behavior</text>
  <rect x="472" y="40" width="312" height="170.5882" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="628" y="108.2353" text-anchor="middle" font-size="28.0416" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">2. Hypothesis</text>
  <text x="628" y="159.4118" text-anchor="middle" font-size="25.4923" font-family="Arial, sans-serif" fill="var(--warn-text)">Predict system response</text>
  <rect x="904" y="40" width="336" height="170.5882" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1072" y="108.2353" text-anchor="middle" font-size="28.0416" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">3. Inject Fault</text>
  <text x="1072" y="159.4118" text-anchor="middle" font-size="25.4923" font-family="Arial, sans-serif" fill="var(--warn-text)">Kill pod, add latency</text>
  <rect x="256" y="449.4118" width="336" height="170.5882" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="424" y="517.6471" text-anchor="middle" font-size="28.0416" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">4. Observe</text>
  <text x="424" y="568.8235" text-anchor="middle" font-size="25.4923" font-family="Arial, sans-serif" fill="var(--danger-text)">Compare to hypothesis</text>
  <rect x="712" y="449.4118" width="336" height="170.5882" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="880" y="517.6471" text-anchor="middle" font-size="28.0416" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">5. Learn / Fix</text>
  <text x="880" y="568.8235" text-anchor="middle" font-size="25.4923" font-family="Arial, sans-serif" fill="var(--primary-text)">Improve resilience</text>
  <line x1="352" y1="125.2941" x2="472" y2="125.2941" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="784" y1="125.2941" x2="904" y2="125.2941" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1072" y1="210.5882" x2="1072" y2="312.9412" stroke="var(--text)" stroke-width="2"/>
  <line x1="1072" y1="312.9412" x2="592" y2="449.4118" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="592" y1="534.7059" x2="712" y2="534.7059" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow_cs" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 18 L 19.8621 9 z" fill="#333" />
    </marker>
  </defs>
  <text x="635.0388" y="59.5349" text-anchor="middle" font-size="28.4673" font-weight="bold">Testing Strategy Across the Pipeline</text>
  <rect x="43.7957" y="104.186" width="218.9789" height="386.9767" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="153.2853" y="163.7209" text-anchor="middle" font-size="24.0877" font-weight="bold">Pre-commit</text>
  <text x="153.2853" y="223.2558" text-anchor="middle" font-size="21.8979">Lint</text>
  <text x="153.2853" y="267.907" text-anchor="middle" font-size="21.8979">Type check</text>
  <text x="153.2853" y="312.5581" text-anchor="middle" font-size="21.8979">Secrets scan</text>
  <rect x="295.6215" y="104.186" width="218.9789" height="386.9767" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="405.111" y="163.7209" text-anchor="middle" font-size="24.0877" font-weight="bold">CI Build</text>
  <text x="405.111" y="223.2558" text-anchor="middle" font-size="21.8979">Unit tests</text>
  <text x="405.111" y="267.907" text-anchor="middle" font-size="21.8979">SAST</text>
  <text x="405.111" y="312.5581" text-anchor="middle" font-size="21.8979">Contract tests</text>
  <rect x="547.4472" y="104.186" width="218.9789" height="386.9767" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="656.9367" y="163.7209" text-anchor="middle" font-size="24.0877" font-weight="bold">CI Test</text>
  <text x="656.9367" y="223.2558" text-anchor="middle" font-size="21.8979">Integration</text>
  <text x="656.9367" y="267.907" text-anchor="middle" font-size="21.8979">API tests</text>
  <text x="656.9367" y="312.5581" text-anchor="middle" font-size="21.8979">DAST</text>
  <rect x="799.2729" y="104.186" width="218.9789" height="386.9767" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="908.7624" y="163.7209" text-anchor="middle" font-size="24.0877" font-weight="bold">Staging</text>
  <text x="908.7624" y="223.2558" text-anchor="middle" font-size="21.8979">E2E tests</text>
  <text x="908.7624" y="267.907" text-anchor="middle" font-size="21.8979">Perf tests</text>
  <text x="908.7624" y="312.5581" text-anchor="middle" font-size="21.8979">Chaos tests</text>
  <rect x="1051.0986" y="104.186" width="218.9789" height="386.9767" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="1160.5881" y="163.7209" text-anchor="middle" font-size="24.0877" font-weight="bold">Production</text>
  <text x="1160.5881" y="223.2558" text-anchor="middle" font-size="21.8979">Synthetics</text>
  <text x="1160.5881" y="267.907" text-anchor="middle" font-size="21.8979">Canary analysis</text>
  <text x="1160.5881" y="312.5581" text-anchor="middle" font-size="21.8979">Observability</text>
  <line x1="262.7747" y1="297.6744" x2="295.6215" y2="297.6744" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_cs)" />
  <line x1="514.6004" y1="297.6744" x2="547.4472" y2="297.6744" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_cs)" />
  <line x1="766.4261" y1="297.6744" x2="799.2729" y2="297.6744" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_cs)" />
  <line x1="1018.2518" y1="297.6744" x2="1051.0986" y2="297.6744" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_cs)" />
  <text x="635.0388" y="580.4651" text-anchor="middle" font-size="21.8979" fill="var(--text)">Confidence increases ----&gt;</text>
  <text x="635.0388" y="640" text-anchor="middle" font-size="21.8979" fill="var(--text)">&lt;--- Speed decreases</text>
</svg>
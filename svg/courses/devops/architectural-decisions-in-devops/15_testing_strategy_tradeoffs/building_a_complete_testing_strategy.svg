<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <text x="618.5715" y="40" text-anchor="middle" font-size="28.1493" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Testing Strategy Across the Pipeline</text>
  <rect x="40" y="84.6153" width="214.2857" height="386.6666" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="147.143" y="144.1025" text-anchor="middle" font-size="23.8186" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Pre-commit</text>
  <text x="147.143" y="203.5897" text-anchor="middle" font-size="21.6533" font-family="Arial, sans-serif" fill="var(--ok-text)">Lint</text>
  <text x="147.143" y="248.2051" text-anchor="middle" font-size="21.6533" font-family="Arial, sans-serif" fill="var(--ok-text)">Type check</text>
  <text x="147.143" y="292.8205" text-anchor="middle" font-size="21.6533" font-family="Arial, sans-serif" fill="var(--ok-text)">Secrets scan</text>
  <rect x="286.4286" y="84.6153" width="214.2857" height="386.6666" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="393.5716" y="144.1025" text-anchor="middle" font-size="23.8186" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">CI Build</text>
  <text x="393.5716" y="203.5897" text-anchor="middle" font-size="21.6533" font-family="Arial, sans-serif" fill="var(--primary-text)">Unit tests</text>
  <text x="393.5716" y="248.2051" text-anchor="middle" font-size="21.6533" font-family="Arial, sans-serif" fill="var(--primary-text)">SAST</text>
  <text x="393.5716" y="292.8205" text-anchor="middle" font-size="21.6533" font-family="Arial, sans-serif" fill="var(--primary-text)">Contract tests</text>
  <rect x="532.8572" y="84.6153" width="214.2857" height="386.6666" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640.0001" y="144.1025" text-anchor="middle" font-size="23.8186" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">CI Test</text>
  <text x="640.0001" y="203.5897" text-anchor="middle" font-size="21.6533" font-family="Arial, sans-serif" fill="var(--warn-text)">Integration</text>
  <text x="640.0001" y="248.2051" text-anchor="middle" font-size="21.6533" font-family="Arial, sans-serif" fill="var(--warn-text)">API tests</text>
  <text x="640.0001" y="292.8205" text-anchor="middle" font-size="21.6533" font-family="Arial, sans-serif" fill="var(--warn-text)">DAST</text>
  <rect x="779.2857" y="84.6153" width="214.2857" height="386.6666" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="886.4286" y="144.1025" text-anchor="middle" font-size="23.8186" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Staging</text>
  <text x="886.4286" y="203.5897" text-anchor="middle" font-size="21.6533" font-family="Arial, sans-serif" fill="var(--warn-text)">E2E tests</text>
  <text x="886.4286" y="248.2051" text-anchor="middle" font-size="21.6533" font-family="Arial, sans-serif" fill="var(--warn-text)">Perf tests</text>
  <text x="886.4286" y="292.8205" text-anchor="middle" font-size="21.6533" font-family="Arial, sans-serif" fill="var(--warn-text)">Chaos tests</text>
  <rect x="1025.7143" y="84.6153" width="214.2857" height="386.6666" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1132.8572" y="144.1025" text-anchor="middle" font-size="23.8186" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Production</text>
  <text x="1132.8572" y="203.5897" text-anchor="middle" font-size="21.6533" font-family="Arial, sans-serif" fill="var(--danger-text)">Synthetics</text>
  <text x="1132.8572" y="248.2051" text-anchor="middle" font-size="21.6533" font-family="Arial, sans-serif" fill="var(--danger-text)">Canary analysis</text>
  <text x="1132.8572" y="292.8205" text-anchor="middle" font-size="21.6533" font-family="Arial, sans-serif" fill="var(--danger-text)">Observability</text>
  <line x1="254.2858" y1="277.9487" x2="286.4286" y2="277.9487" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="500.7144" y1="277.9487" x2="532.8572" y2="277.9487" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="747.1429" y1="277.9487" x2="779.2857" y2="277.9487" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="993.5715" y1="277.9487" x2="1025.7143" y2="277.9487" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="618.5715" y="560.5128" text-anchor="middle" font-size="21.6533" fill="var(--text)" font-family="Arial, sans-serif">Confidence increases ----&gt;</text>
  <text x="618.5715" y="620" text-anchor="middle" font-size="21.6533" fill="var(--text)" font-family="Arial, sans-serif">&lt;--- Speed decreases</text>
</svg>
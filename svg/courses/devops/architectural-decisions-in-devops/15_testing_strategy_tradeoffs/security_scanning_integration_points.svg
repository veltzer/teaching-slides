<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow_sec" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 30.8571 L 19.8621 15.4286 z" fill="#333" />
    </marker>
  </defs>
  <rect x="80" y="103.6224" width="228.5715" height="239.6939" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6.2143" />
  <text x="194.2858" y="247.4388" text-anchor="middle" font-size="25.1429">Pre-commit</text>
  <rect x="377.1429" y="103.6224" width="228.5715" height="239.6939" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6.2143" />
  <text x="491.4286" y="247.4388" text-anchor="middle" font-size="25.1429">PR / Build</text>
  <rect x="674.2857" y="103.6224" width="228.5715" height="239.6939" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6.2143" />
  <text x="788.5714" y="247.4388" text-anchor="middle" font-size="25.1429">Registry</text>
  <rect x="971.4285" y="103.6224" width="228.5715" height="239.6939" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6.2143" />
  <text x="1085.7142" y="247.4388" text-anchor="middle" font-size="25.1429">Runtime</text>
  <line x1="308.5715" y1="220.8062" x2="377.1429" y2="220.8062" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_sec)" />
  <line x1="605.7142" y1="220.8062" x2="674.2857" y2="220.8062" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_sec)" />
  <line x1="902.8571" y1="220.8062" x2="971.4285" y2="220.8062" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_sec)" />
  <text x="194.2858" y="476.4796" text-anchor="middle" font-size="22.8572" fill="var(--text-muted)">Secrets scan</text>
  <text x="194.2858" y="556.3776" text-anchor="middle" font-size="22.8572" fill="var(--text-muted)">Lint rules</text>
  <text x="491.4286" y="476.4796" text-anchor="middle" font-size="22.8572" fill="var(--text-muted)">SAST</text>
  <text x="491.4286" y="556.3776" text-anchor="middle" font-size="22.8572" fill="var(--text-muted)">Dependency audit</text>
  <text x="788.5714" y="476.4796" text-anchor="middle" font-size="22.8572" fill="var(--text-muted)">Image scan</text>
  <text x="788.5714" y="556.3776" text-anchor="middle" font-size="22.8572" fill="var(--text-muted)">SBOM check</text>
  <text x="1085.7142" y="476.4796" text-anchor="middle" font-size="22.8572" fill="var(--text-muted)">DAST</text>
  <text x="1085.7142" y="556.3776" text-anchor="middle" font-size="22.8572" fill="var(--text-muted)">RASP</text>
</svg>
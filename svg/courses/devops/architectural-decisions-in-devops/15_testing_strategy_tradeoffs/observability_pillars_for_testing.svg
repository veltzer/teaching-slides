<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <ellipse cx="640.0001" cy="305.8064" rx="169.2308" ry="84.301" fill="var(--info-fill)" stroke="var(--text)" stroke-width="4.722" />
  <text x="640.0001" y="298.5484" text-anchor="middle" font-size="29.9456" fill="var(--bg)" font-family="Arial, sans-serif">Observability</text>
  <text x="640.0001" y="334.8386" text-anchor="middle" font-size="29.9456" fill="var(--bg)" font-family="Arial, sans-serif">-Driven</text>
  <ellipse cx="240" cy="112.258" rx="200" ry="72.258" fill="var(--primary-fill)" stroke="var(--text)" stroke-width="3.5415" />
  <text x="240" y="104.9999" text-anchor="middle" font-size="32.6679" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Metrics</text>
  <text x="240" y="141.2903" text-anchor="middle" font-size="27.2233" font-family="Arial, sans-serif" fill="var(--text)">SLIs, latency, errors</text>
  <ellipse cx="1040" cy="112.258" rx="200" ry="72.258" fill="var(--ok-fill)" stroke="var(--text)" stroke-width="3.5415" />
  <text x="1040" y="104.9999" text-anchor="middle" font-size="32.6679" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Logs</text>
  <text x="1040" y="141.2903" text-anchor="middle" font-size="27.2233" font-family="Arial, sans-serif" fill="var(--text)">Events, exceptions</text>
  <ellipse cx="640.0001" cy="547.742" rx="200" ry="72.258" fill="var(--warn-fill)" stroke="var(--text)" stroke-width="3.5415" />
  <text x="640.0001" y="540.4838" text-anchor="middle" font-size="32.6679" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Traces</text>
  <text x="640.0001" y="576.7741" text-anchor="middle" font-size="27.2233" font-family="Arial, sans-serif" fill="var(--text)">Request flow, spans</text>
  <line x1="486.1539" y1="245.3226" x2="347.6924" y2="172.7419" stroke="var(--text)" stroke-width="2" />
  <line x1="793.8463" y1="245.3226" x2="932.3077" y2="172.7419" stroke="var(--text)" stroke-width="2" />
  <line x1="640.0001" y1="390.4838" x2="640.0001" y2="475.1613" stroke="var(--text)" stroke-width="2" />
</svg>
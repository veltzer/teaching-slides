<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="300.5451" y="48.3019" text-anchor="middle" font-size="26.9455" font-weight="bold" fill="var(--text)">Contract Testing</text>
  <text x="901.6352" y="48.3019" text-anchor="middle" font-size="26.9455" font-weight="bold" fill="var(--text)">Integration Testing</text>
  <rect x="103.6362" y="84.5283" width="393.8176" height="555.4717" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <rect x="704.7263" y="84.5283" width="393.8176" height="555.4717" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="300.5451" y="156.9812" text-anchor="middle" font-size="22.8">Consumer defines</text>
  <text x="300.5451" y="193.2076" text-anchor="middle" font-size="22.8">expected contract</text>
  <text x="300.5451" y="265.6603" text-anchor="middle" font-size="22.8">Provider verifies</text>
  <text x="300.5451" y="301.8868" text-anchor="middle" font-size="22.8">it meets contract</text>
  <text x="300.5451" y="374.3396" text-anchor="middle" font-size="22.8">No real service</text>
  <text x="300.5451" y="410.5661" text-anchor="middle" font-size="22.8">needed at test time</text>
  <text x="300.5451" y="483.0188" text-anchor="middle" font-size="22.8">Fast, isolated</text>
  <text x="300.5451" y="555.4717" text-anchor="middle" font-size="22.8">Independent deploys</text>
  <text x="901.6352" y="156.9812" text-anchor="middle" font-size="22.8">Tests real service</text>
  <text x="901.6352" y="193.2076" text-anchor="middle" font-size="22.8">interactions</text>
  <text x="901.6352" y="265.6603" text-anchor="middle" font-size="22.8">Requires running</text>
  <text x="901.6352" y="301.8868" text-anchor="middle" font-size="22.8">instances of services</text>
  <text x="901.6352" y="374.3396" text-anchor="middle" font-size="22.8">Catches runtime</text>
  <text x="901.6352" y="410.5661" text-anchor="middle" font-size="22.8">environment issues</text>
  <text x="901.6352" y="483.0188" text-anchor="middle" font-size="22.8">Slower, flakier</text>
  <text x="901.6352" y="555.4717" text-anchor="middle" font-size="22.8">Coupled deployments</text>
</svg>
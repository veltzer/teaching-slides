<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:text x="300.5451" y="48.3019" text-anchor="middle" font-size="26.9455" font-weight="bold" fill="#333">Contract Testing</ns0:text>
  <ns0:text x="901.6352" y="48.3019" text-anchor="middle" font-size="26.9455" font-weight="bold" fill="#333">Integration Testing</ns0:text>
  <ns0:rect x="103.6362" y="84.5283" width="393.8176" height="555.4717" fill="#e8f5e9" stroke="#333" stroke-width="3.109" rx="10.3636" />
  <ns0:rect x="704.7263" y="84.5283" width="393.8176" height="555.4717" fill="#e3f2fd" stroke="#333" stroke-width="3.109" rx="10.3636" />
  <ns0:text x="300.5451" y="156.9812" text-anchor="middle" font-size="22.8">Consumer defines</ns0:text>
  <ns0:text x="300.5451" y="193.2076" text-anchor="middle" font-size="22.8">expected contract</ns0:text>
  <ns0:text x="300.5451" y="265.6603" text-anchor="middle" font-size="22.8">Provider verifies</ns0:text>
  <ns0:text x="300.5451" y="301.8868" text-anchor="middle" font-size="22.8">it meets contract</ns0:text>
  <ns0:text x="300.5451" y="374.3396" text-anchor="middle" font-size="22.8">No real service</ns0:text>
  <ns0:text x="300.5451" y="410.5661" text-anchor="middle" font-size="22.8">needed at test time</ns0:text>
  <ns0:text x="300.5451" y="483.0188" text-anchor="middle" font-size="22.8">Fast, isolated</ns0:text>
  <ns0:text x="300.5451" y="555.4717" text-anchor="middle" font-size="22.8">Independent deploys</ns0:text>
  <ns0:text x="901.6352" y="156.9812" text-anchor="middle" font-size="22.8">Tests real service</ns0:text>
  <ns0:text x="901.6352" y="193.2076" text-anchor="middle" font-size="22.8">interactions</ns0:text>
  <ns0:text x="901.6352" y="265.6603" text-anchor="middle" font-size="22.8">Requires running</ns0:text>
  <ns0:text x="901.6352" y="301.8868" text-anchor="middle" font-size="22.8">instances of services</ns0:text>
  <ns0:text x="901.6352" y="374.3396" text-anchor="middle" font-size="22.8">Catches runtime</ns0:text>
  <ns0:text x="901.6352" y="410.5661" text-anchor="middle" font-size="22.8">environment issues</ns0:text>
  <ns0:text x="901.6352" y="483.0188" text-anchor="middle" font-size="22.8">Slower, flakier</ns0:text>
  <ns0:text x="901.6352" y="555.4717" text-anchor="middle" font-size="22.8">Coupled deployments</ns0:text>
</ns0:svg>
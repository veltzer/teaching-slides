<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="320" y="51.4286" text-anchor="middle" font-size="28.6897" font-weight="bold" fill="#333">Contract Testing</text>
  <text x="960" y="51.4286" text-anchor="middle" font-size="28.6897" font-weight="bold" fill="#333">Integration Testing</text>
  <rect x="110.3448" y="90" width="419.3103" height="591.4286" fill="#e8f5e9" stroke="#333" stroke-width="3.3103" rx="11.0345" />
  <rect x="750.3448" y="90" width="419.3103" height="591.4286" fill="#e3f2fd" stroke="#333" stroke-width="3.3103" rx="11.0345" />
  <text x="320" y="167.1429" text-anchor="middle" font-size="24.2759">Consumer defines</text>
  <text x="320" y="205.7143" text-anchor="middle" font-size="24.2759">expected contract</text>
  <text x="320" y="282.8571" text-anchor="middle" font-size="24.2759">Provider verifies</text>
  <text x="320" y="321.4286" text-anchor="middle" font-size="24.2759">it meets contract</text>
  <text x="320" y="398.5714" text-anchor="middle" font-size="24.2759">No real service</text>
  <text x="320" y="437.1429" text-anchor="middle" font-size="24.2759">needed at test time</text>
  <text x="320" y="514.2857" text-anchor="middle" font-size="24.2759">Fast, isolated</text>
  <text x="320" y="591.4286" text-anchor="middle" font-size="24.2759">Independent deploys</text>
  <text x="960" y="167.1429" text-anchor="middle" font-size="24.2759">Tests real service</text>
  <text x="960" y="205.7143" text-anchor="middle" font-size="24.2759">interactions</text>
  <text x="960" y="282.8571" text-anchor="middle" font-size="24.2759">Requires running</text>
  <text x="960" y="321.4286" text-anchor="middle" font-size="24.2759">instances of services</text>
  <text x="960" y="398.5714" text-anchor="middle" font-size="24.2759">Catches runtime</text>
  <text x="960" y="437.1429" text-anchor="middle" font-size="24.2759">environment issues</text>
  <text x="960" y="514.2857" text-anchor="middle" font-size="24.2759">Slower, flakier</text>
  <text x="960" y="591.4286" text-anchor="middle" font-size="24.2759">Coupled deployments</text>
</svg>
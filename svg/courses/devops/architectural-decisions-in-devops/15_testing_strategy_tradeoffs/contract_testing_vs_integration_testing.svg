<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="277.5001" y="40" text-anchor="middle" font-size="29.2988" font-weight="bold" fill="var(--text)">Contract Testing</text>
  <text x="1002.5001" y="40" text-anchor="middle" font-size="29.2988" font-weight="bold" fill="var(--text)">Integration Testing</text>
  <rect x="40" y="75.5102" width="475" height="544.4898" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <rect x="765" y="75.5102" width="475" height="544.4898" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="277.5001" y="146.5307" text-anchor="middle" font-size="24.7912">Consumer defines</text>
  <text x="277.5001" y="182.0409" text-anchor="middle" font-size="24.7912">expected contract</text>
  <text x="277.5001" y="253.0611" text-anchor="middle" font-size="24.7912">Provider verifies</text>
  <text x="277.5001" y="288.5714" text-anchor="middle" font-size="24.7912">it meets contract</text>
  <text x="277.5001" y="359.5918" text-anchor="middle" font-size="24.7912">No real service</text>
  <text x="277.5001" y="395.1021" text-anchor="middle" font-size="24.7912">needed at test time</text>
  <text x="277.5001" y="466.1224" text-anchor="middle" font-size="24.7912">Fast, isolated</text>
  <text x="277.5001" y="537.1429" text-anchor="middle" font-size="24.7912">Independent deploys</text>
  <text x="1002.5001" y="146.5307" text-anchor="middle" font-size="24.7912">Tests real service</text>
  <text x="1002.5001" y="182.0409" text-anchor="middle" font-size="24.7912">interactions</text>
  <text x="1002.5001" y="253.0611" text-anchor="middle" font-size="24.7912">Requires running</text>
  <text x="1002.5001" y="288.5714" text-anchor="middle" font-size="24.7912">instances of services</text>
  <text x="1002.5001" y="359.5918" text-anchor="middle" font-size="24.7912">Catches runtime</text>
  <text x="1002.5001" y="395.1021" text-anchor="middle" font-size="24.7912">environment issues</text>
  <text x="1002.5001" y="466.1224" text-anchor="middle" font-size="24.7912">Slower, flakier</text>
  <text x="1002.5001" y="537.1429" text-anchor="middle" font-size="24.7912">Coupled deployments</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow_env" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 16.6154 L 20.5714 8.3077 z" fill="#333" />
    </marker>
  </defs>
  <text x="626.666612" y="40" text-anchor="middle" font-size="36.160173" font-weight="bold">Test Environment Landscape</text>
  <rect x="40" y="92.727285" width="346.666746" height="175.757618" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.467099" filter="url(#shadow)"/>
  <text x="213.333317" y="198.181717" text-anchor="middle" font-size="30.597184">Dev / Local</text>
  <rect x="466.666516" y="92.727285" width="346.666746" height="175.757618" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="7.467099" filter="url(#shadow)"/>
  <text x="639.999944" y="198.181717" text-anchor="middle" font-size="30.597184">CI Ephemeral</text>
  <rect x="893.333254" y="92.727285" width="346.666746" height="175.757618" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="7.467099" filter="url(#shadow)"/>
  <text x="1066.666683" y="198.181717" text-anchor="middle" font-size="30.597184">Staging</text>
  <rect x="253.333314" y="444.242382" width="346.666746" height="175.757618" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="7.467099" filter="url(#shadow)"/>
  <text x="426.66652" y="549.696953" text-anchor="middle" font-size="30.597184">Shared QA</text>
  <rect x="680.000052" y="444.242382" width="346.666746" height="175.757618" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="7.467099" filter="url(#shadow)"/>
  <text x="853.333258" y="549.696953" text-anchor="middle" font-size="30.597184">Production</text>
  <line x1="386.666635" y1="268.484764" x2="466.666516" y2="180.605955" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_env)" />
  <line x1="813.333151" y1="180.605955" x2="893.333254" y2="180.605955" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_env)" />
  <line x1="639.999944" y1="268.484764" x2="519.999956" y2="444.242382" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_env)" />
  <line x1="1066.666683" y1="268.484764" x2="946.666583" y2="444.242382" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_env)" />
</svg>
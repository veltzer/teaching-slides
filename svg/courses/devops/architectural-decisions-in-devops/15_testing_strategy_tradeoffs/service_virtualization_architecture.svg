<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow_sv" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 19.6364 L 20.9455 9.8182 z" fill="#333" />
    </marker>
  </defs>
  <rect x="40" y="223.1579" width="287.9999" height="183.1578" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="184" y="329.9999" text-anchor="middle" font-size="27.3901" font-weight="bold">Your Service</text>
  <rect x="496" y="70.5263" width="287.9999" height="152.6316" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="640.0001" y="131.5791" text-anchor="middle" font-size="25.1076">Virtual: Payment</text>
  <text x="640.0001" y="177.3684" text-anchor="middle" font-size="25.1076">API Stub</text>
  <rect x="496" y="268.9474" width="287.9999" height="152.6316" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="640.0001" y="329.9999" text-anchor="middle" font-size="25.1076">Virtual: Auth</text>
  <text x="640.0001" y="375.7894" text-anchor="middle" font-size="25.1076">API Stub</text>
  <rect x="496" y="467.3684" width="287.9999" height="152.6316" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="640.0001" y="528.421" text-anchor="middle" font-size="25.1076">Virtual: Email</text>
  <text x="640.0001" y="574.2104" text-anchor="middle" font-size="25.1076">API Stub</text>
  <rect x="952.0001" y="223.1579" width="287.9999" height="183.1578" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="1096" y="299.4737" text-anchor="middle" font-size="25.1076">Real External</text>
  <text x="1096" y="345.2632" text-anchor="middle" font-size="25.1076">Services</text>
  <line x1="327.9999" y1="284.2105" x2="496" y2="146.8421" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_sv)" />
  <line x1="327.9999" y1="314.7369" x2="496" y2="345.2632" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_sv)" />
  <line x1="327.9999" y1="345.2632" x2="496" y2="543.6841" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_sv)" />
  <line x1="784" y1="146.8421" x2="952.0001" y2="284.2105" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="10.836" marker-end="url(#arrow_sv)" />
  <line x1="784" y1="345.2632" x2="952.0001" y2="314.7369" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="10.836" marker-end="url(#arrow_sv)" />
  <line x1="784" y1="543.6841" x2="952.0001" y2="345.2632" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="10.836" marker-end="url(#arrow_sv)" />
  <text x="868.0001" y="40" text-anchor="middle" font-size="22.825" fill="var(--text-faint)">Recorded from real traffic</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow_sv" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 19.6364 L 20.9455 9.8182 z" fill="#333" />
    </marker>
  </defs>
  <rect x="65.0159" y="243.8095" width="260.0634" height="182.8571" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="195.0476" y="350.4761" text-anchor="middle" font-size="26.0064" font-weight="bold">Your Service</text>
  <rect x="476.783" y="91.4285" width="260.0634" height="152.381" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="606.8148" y="152.381" text-anchor="middle" font-size="23.8392">Virtual: Payment</text>
  <text x="606.8148" y="198.0952" text-anchor="middle" font-size="23.8392">API Stub</text>
  <rect x="476.783" y="289.5238" width="260.0634" height="152.381" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="606.8148" y="350.4761" text-anchor="middle" font-size="23.8392">Virtual: Auth</text>
  <text x="606.8148" y="396.1904" text-anchor="middle" font-size="23.8392">API Stub</text>
  <rect x="476.783" y="487.619" width="260.0634" height="152.381" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="606.8148" y="548.5714" text-anchor="middle" font-size="23.8392">Virtual: Email</text>
  <text x="606.8148" y="594.2856" text-anchor="middle" font-size="23.8392">API Stub</text>
  <rect x="888.5502" y="243.8095" width="260.0634" height="182.8571" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="1018.5819" y="320" text-anchor="middle" font-size="23.8392">Real External</text>
  <text x="1018.5819" y="365.7143" text-anchor="middle" font-size="23.8392">Services</text>
  <line x1="325.0793" y1="304.7618" x2="476.783" y2="167.619" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_sv)" />
  <line x1="325.0793" y1="335.2381" x2="476.783" y2="365.7143" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_sv)" />
  <line x1="325.0793" y1="365.7143" x2="476.783" y2="563.8094" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_sv)" />
  <line x1="736.8465" y1="167.619" x2="888.5502" y2="304.7618" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="10.836" marker-end="url(#arrow_sv)" />
  <line x1="736.8465" y1="365.7143" x2="888.5502" y2="335.2381" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="10.836" marker-end="url(#arrow_sv)" />
  <line x1="736.8465" y1="563.8094" x2="888.5502" y2="365.7143" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="10.836" marker-end="url(#arrow_sv)" />
  <text x="812.6984" y="60.9523" text-anchor="middle" font-size="21.6719" fill="var(--text-faint)">Recorded from real traffic</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow4" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,25.7143 6.4,0" fill="#333" />
    </marker>
  </defs>
  <rect x="96.7901" y="80" width="197.5308" height="111.1111" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6.4815" />
  <text x="195.5555" y="149.4445" text-anchor="middle" font-size="23.7038">User A</text>
  <rect x="96.7901" y="468.8889" width="197.5308" height="111.1111" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6.4815" />
  <text x="195.5555" y="538.3335" text-anchor="middle" font-size="23.7038">User B</text>
  <rect x="551.1112" y="80" width="237.0371" height="111.1111" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6.4815" />
  <text x="669.6296" y="149.4445" text-anchor="middle" font-size="23.7038">Acquire Lock</text>
  <rect x="551.1112" y="468.8889" width="237.0371" height="111.1111" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6.4815" />
  <text x="669.6296" y="538.3335" text-anchor="middle" font-size="23.7038">Lock Denied</text>
  <rect x="946.1728" y="80" width="237.0371" height="111.1111" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6.4815" />
  <text x="1064.6914" y="121.6667" text-anchor="middle" font-size="23.7038">Apply +</text>
  <text x="1064.6914" y="168.889" text-anchor="middle" font-size="23.7038">Release Lock</text>
  <rect x="946.1728" y="468.8889" width="237.0371" height="111.1111" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6.4815" />
  <text x="1064.6914" y="538.3335" text-anchor="middle" font-size="23.7038">Retry: OK</text>
  <line x1="294.321" y1="135.5556" x2="551.1112" y2="135.5556" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="294.321" y1="524.4445" x2="551.1112" y2="524.4445" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="788.1482" y1="135.5556" x2="946.1728" y2="135.5556" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="788.1482" y1="524.4445" x2="946.1728" y2="524.4445" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1064.6914" y1="191.1112" x2="1064.6914" y2="357.7778" stroke="var(--text-faint)" stroke-width="1.8286" stroke-dasharray="9.1429 9.1429" />
  <text x="1123.9507" y="316.1112" font-size="21.7284" fill="var(--text-faint)">lock released</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="260" height="580" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="170" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Who owns it</text>
  <text x="170" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Developers</text>
  <text x="170" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Platform team</text>
  <text x="170" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Platform team</text>
  <text x="170" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">IaC engine</text>
  <text x="170" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Cloud provider</text>

  <rect x="320" y="100" width="920" height="85" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="780" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Developer Self-Service Portal</text>
  <text x="780" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">forms, catalogs, golden paths — Backstage, Port, custom UIs</text>

  <rect x="320" y="220" width="920" height="85" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="780" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Abstraction Layer</text>
  <text x="780" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Terragrunt, custom CLI, Crossplane compositions — opinionated wrappers</text>

  <rect x="320" y="340" width="920" height="85" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="780" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Validated Module Library</text>
  <text x="780" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">vetted, versioned, tested modules — the platform product</text>

  <rect x="320" y="460" width="920" height="85" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="780" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">IaC Engine</text>
  <text x="780" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Terraform, OpenTofu, Pulumi — plans, applies, tracks state</text>

  <rect x="320" y="580" width="920" height="40" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="780" y="607" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--info-text)">Cloud Provider APIs  —  AWS / GCP / Azure</text>

  <line x1="780" y1="185" x2="780" y2="220" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="780" y1="305" x2="780" y2="340" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="780" y1="425" x2="780" y2="460" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="780" y1="545" x2="780" y2="580" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

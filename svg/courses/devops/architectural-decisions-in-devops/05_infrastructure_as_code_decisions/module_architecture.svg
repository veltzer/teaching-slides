  <line x1="640" y1="132" x2="640" y2="240" stroke="var(--text-dark)" stroke-width="3.6571" marker-end="url(#arrow)" />
  <line x1="768" y1="132" x2="1024" y2="240" stroke="var(--text-dark)" stroke-width="3.6571" marker-end="url(#arrow)" />
  <rect x="91.4286" y="240" width="310.8571" height="108" fill="var(--ok-lt)" stroke="var(--ok-dk)" stroke-width="3.6571" rx="9.1429" />

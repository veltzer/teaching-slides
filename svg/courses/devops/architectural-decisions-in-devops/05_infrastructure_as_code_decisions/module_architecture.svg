<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow5" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,24 6.4,0" fill="#333" />
    </marker>
  </defs>
  <rect x="420.5714" y="24" width="438.8571" height="108" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="640" y="91.2" text-anchor="middle" font-size="25.6" font-weight="bold">Root Module (main.tf)</text>
  <line x1="512" y1="132" x2="256" y2="240" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="640" y1="132" x2="640" y2="240" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="768" y1="132" x2="1024" y2="240" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="91.4286" y="240" width="310.8571" height="108" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="246.8571" y="307.2" text-anchor="middle" font-size="21.9429">module "network"</text>
  <rect x="484.5714" y="240" width="310.8571" height="108" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="640" y="307.2" text-anchor="middle" font-size="21.9429">module "compute"</text>
  <rect x="877.7143" y="240" width="310.8571" height="108" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="1033.1429" y="307.2" text-anchor="middle" font-size="21.9429">module "database"</text>
  <line x1="246.8571" y1="348" x2="246.8571" y2="444" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="640" y1="348" x2="640" y2="444" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1033.1429" y1="348" x2="1033.1429" y2="444" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="91.4286" y="444" width="310.8571" height="84" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="246.8571" y="496.8" text-anchor="middle" font-size="20.1143">VPC, Subnets, SGs</text>
  <rect x="484.5714" y="444" width="310.8571" height="84" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="640" y="496.8" text-anchor="middle" font-size="20.1143">EC2, ASG, ALB</text>
  <rect x="877.7143" y="444" width="310.8571" height="84" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="1033.1429" y="496.8" text-anchor="middle" font-size="20.1143">RDS, ElastiCache</text>
  <text x="640" y="636" text-anchor="middle" font-size="21.9429" fill="var(--text-muted)">Modules pass outputs to each other via the root module</text>
</svg>
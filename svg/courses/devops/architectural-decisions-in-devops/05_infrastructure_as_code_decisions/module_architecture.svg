  <text x="1033.1429" y="307.2" text-anchor="middle" font-size="21.9429">module "database"</text>
  <line x1="246.8571" y1="348" x2="246.8571" y2="444" stroke="var(--text-dark)" stroke-width="3.6571" marker-end="url(#arrow)" />
  <line x1="640" y1="348" x2="640" y2="444" stroke="var(--text-dark)" stroke-width="3.6571" marker-end="url(#arrow)" />
  <line x1="1033.1429" y1="348" x2="1033.1429" y2="444" stroke="var(--text-dark)" stroke-width="3.6571" marker-end="url(#arrow)" />
  <rect x="91.4286" y="444" width="310.8571" height="84" fill="var(--surface)" stroke="var(--text-faint)" stroke-width="1.8286" rx="5.4857" />
  <text x="246.8571" y="496.8" text-anchor="middle" font-size="20.1143">VPC, Subnets, SGs</text>
  <rect x="484.5714" y="444" width="310.8571" height="84" fill="var(--surface)" stroke="var(--text-faint)" stroke-width="1.8286" rx="5.4857" />
  <text x="640" y="496.8" text-anchor="middle" font-size="20.1143">EC2, ASG, ALB</text>
  <rect x="877.7143" y="444" width="310.8571" height="84" fill="var(--surface)" stroke="var(--text-faint)" stroke-width="1.8286" rx="5.4857" />
  <text x="1033.1429" y="496.8" text-anchor="middle" font-size="20.1143">RDS, ElastiCache</text>
  <text x="640" y="636" text-anchor="middle" font-size="21.9429" fill="var(--text-muted)">Modules pass outputs to each other via the root module</text>

  <line x1="640" y1="180" x2="640" y2="257.1429" stroke="#333" stroke-width="3.6571" marker-end="url(#arrow)" />
  <line x1="822.8571" y1="115.7143" x2="1005.7143" y2="257.1429" stroke="#333" stroke-width="3.6571" marker-end="url(#arrow)" />
  <rect x="91.4286" y="257.1429" width="329.1429" height="115.7143" fill="#e3f2fd" stroke="#1565c0" stroke-width="3.6571" rx="9.1429" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <rect x="40" y="40" width="1200" height="80" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="90" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">IaC Drift Detection Cycle</text>

  <rect x="40" y="150" width="220" height="330" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="220" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">1. Scan</text>
  <text x="150" y="270" text-anchor="middle" font-size="18" fill="var(--primary-text)" font-family="Arial, sans-serif">read live</text>
  <text x="150" y="295" text-anchor="middle" font-size="18" fill="var(--primary-text)" font-family="Arial, sans-serif">infrastructure</text>
  <text x="150" y="345" text-anchor="middle" font-size="16" fill="var(--primary-text)" font-family="Arial, sans-serif">terraform plan</text>
  <text x="150" y="370" text-anchor="middle" font-size="16" fill="var(--primary-text)" font-family="Arial, sans-serif">pulumi preview</text>
  <text x="150" y="420" text-anchor="middle" font-size="15" fill="var(--primary-text)" font-family="Arial, sans-serif">nightly or</text>
  <text x="150" y="445" text-anchor="middle" font-size="15" fill="var(--primary-text)" font-family="Arial, sans-serif">on each commit</text>

  <line x1="270" y1="315" x2="330" y2="315" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="340" y="150" width="220" height="330" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="220" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">2. Compare</text>
  <text x="450" y="270" text-anchor="middle" font-size="18" fill="var(--warn-text)" font-family="Arial, sans-serif">declared vs</text>
  <text x="450" y="295" text-anchor="middle" font-size="18" fill="var(--warn-text)" font-family="Arial, sans-serif">actual state</text>
  <text x="450" y="345" text-anchor="middle" font-size="16" fill="var(--warn-text)" font-family="Arial, sans-serif">diff resources,</text>
  <text x="450" y="370" text-anchor="middle" font-size="16" fill="var(--warn-text)" font-family="Arial, sans-serif">tags, policies</text>
  <text x="450" y="420" text-anchor="middle" font-size="15" fill="var(--warn-text)" font-family="Arial, sans-serif">state file is</text>
  <text x="450" y="445" text-anchor="middle" font-size="15" fill="var(--warn-text)" font-family="Arial, sans-serif">the source of truth</text>

  <line x1="570" y1="315" x2="630" y2="315" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="640" y="150" width="220" height="330" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="750" y="220" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">3. Detect</text>
  <text x="750" y="270" text-anchor="middle" font-size="18" fill="var(--danger-text)" font-family="Arial, sans-serif">drift found?</text>
  <text x="750" y="345" text-anchor="middle" font-size="16" fill="var(--danger-text)" font-family="Arial, sans-serif">alert on-call,</text>
  <text x="750" y="370" text-anchor="middle" font-size="16" fill="var(--danger-text)" font-family="Arial, sans-serif">open ticket</text>
  <text x="750" y="420" text-anchor="middle" font-size="15" fill="var(--danger-text)" font-family="Arial, sans-serif">classify cause:</text>
  <text x="750" y="445" text-anchor="middle" font-size="15" fill="var(--danger-text)" font-family="Arial, sans-serif">manual or expected</text>

  <line x1="870" y1="315" x2="930" y2="315" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="940" y="150" width="300" height="330" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="220" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">4. Reconcile</text>
  <text x="1090" y="270" text-anchor="middle" font-size="18" fill="var(--ok-text)" font-family="Arial, sans-serif">bring back into alignment</text>
  <text x="1090" y="345" text-anchor="middle" font-size="16" fill="var(--ok-text)" font-family="Arial, sans-serif">update IaC to match reality, OR</text>
  <text x="1090" y="370" text-anchor="middle" font-size="16" fill="var(--ok-text)" font-family="Arial, sans-serif">apply IaC to overwrite reality</text>
  <text x="1090" y="420" text-anchor="middle" font-size="15" fill="var(--ok-text)" font-family="Arial, sans-serif">commit fix, then rerun the scan</text>
  <text x="1090" y="445" text-anchor="middle" font-size="15" fill="var(--ok-text)" font-family="Arial, sans-serif">loop closes and restarts</text>

  <rect x="40" y="510" width="1200" height="110" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="555" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Goal: no silent divergence</text>
  <text x="640" y="590" text-anchor="middle" font-size="17" fill="var(--text-muted)" font-family="Arial, sans-serif">Drift compounds. Detect early, reconcile often — a continuous loop keeps infrastructure honest.</text>

</svg>

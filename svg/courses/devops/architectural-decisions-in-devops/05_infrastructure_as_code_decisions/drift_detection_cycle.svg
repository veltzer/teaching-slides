<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="80" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="90" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--text)">IaC Drift Detection Cycle</text>

  <rect x="40" y="150" width="220" height="330" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="150" y="220" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--primary-text)">1. Scan</text>
  <text x="150" y="270" text-anchor="middle" font-size="18" fill="var(--primary-text)">read live</text>
  <text x="150" y="295" text-anchor="middle" font-size="18" fill="var(--primary-text)">infrastructure</text>
  <text x="150" y="345" text-anchor="middle" font-size="16" fill="var(--primary-text)">terraform plan</text>
  <text x="150" y="370" text-anchor="middle" font-size="16" fill="var(--primary-text)">pulumi preview</text>
  <text x="150" y="420" text-anchor="middle" font-size="15" fill="var(--primary-text)">nightly or</text>
  <text x="150" y="445" text-anchor="middle" font-size="15" fill="var(--primary-text)">on each commit</text>

  <line x1="270" y1="315" x2="330" y2="315" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="340" y="150" width="220" height="330" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="450" y="220" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--warn-text)">2. Compare</text>
  <text x="450" y="270" text-anchor="middle" font-size="18" fill="var(--warn-text)">declared vs</text>
  <text x="450" y="295" text-anchor="middle" font-size="18" fill="var(--warn-text)">actual state</text>
  <text x="450" y="345" text-anchor="middle" font-size="16" fill="var(--warn-text)">diff resources,</text>
  <text x="450" y="370" text-anchor="middle" font-size="16" fill="var(--warn-text)">tags, policies</text>
  <text x="450" y="420" text-anchor="middle" font-size="15" fill="var(--warn-text)">state file is</text>
  <text x="450" y="445" text-anchor="middle" font-size="15" fill="var(--warn-text)">the source of truth</text>

  <line x1="570" y1="315" x2="630" y2="315" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="640" y="150" width="220" height="330" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="750" y="220" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--danger-text)">3. Detect</text>
  <text x="750" y="270" text-anchor="middle" font-size="18" fill="var(--danger-text)">drift found?</text>
  <text x="750" y="345" text-anchor="middle" font-size="16" fill="var(--danger-text)">alert on-call,</text>
  <text x="750" y="370" text-anchor="middle" font-size="16" fill="var(--danger-text)">open ticket</text>
  <text x="750" y="420" text-anchor="middle" font-size="15" fill="var(--danger-text)">classify cause:</text>
  <text x="750" y="445" text-anchor="middle" font-size="15" fill="var(--danger-text)">manual or expected</text>

  <line x1="870" y1="315" x2="930" y2="315" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="940" y="150" width="300" height="330" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1090" y="220" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--ok-text)">4. Reconcile</text>
  <text x="1090" y="270" text-anchor="middle" font-size="18" fill="var(--ok-text)">bring back into alignment</text>
  <text x="1090" y="345" text-anchor="middle" font-size="16" fill="var(--ok-text)">update IaC to match reality, OR</text>
  <text x="1090" y="370" text-anchor="middle" font-size="16" fill="var(--ok-text)">apply IaC to overwrite reality</text>
  <text x="1090" y="420" text-anchor="middle" font-size="15" fill="var(--ok-text)">commit fix, then rerun the scan</text>
  <text x="1090" y="445" text-anchor="middle" font-size="15" fill="var(--ok-text)">loop closes and restarts</text>

  <rect x="40" y="510" width="1200" height="110" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="555" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--text)">Goal: no silent divergence</text>
  <text x="640" y="590" text-anchor="middle" font-size="17" fill="var(--text-muted)">Drift compounds. Detect early, reconcile often — a continuous loop keeps infrastructure honest.</text>

</svg>

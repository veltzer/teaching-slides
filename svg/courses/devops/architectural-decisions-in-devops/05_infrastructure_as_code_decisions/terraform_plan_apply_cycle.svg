<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="210" height="325.233645" rx="6.247242" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="145" y="126.728972" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.153798" font-weight="bold" fill="var(--warn-text)">Write</text>
  <text x="145" y="191.775701" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.741727" fill="var(--warn-text)">.tf files</text>
  <text x="145" y="235.140187" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.741727" fill="var(--warn-text)">HCL syntax</text>
  <text x="145" y="278.504673" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.741727" fill="var(--warn-text)">declarative</text>

  <rect x="280" y="40" width="210" height="325.233645" rx="6.247242" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="385" y="126.728972" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.153798" font-weight="bold" fill="var(--info-text)">Init</text>
  <text x="385" y="191.775701" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.741727" fill="var(--info-text)">providers</text>
  <text x="385" y="235.140187" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.741727" fill="var(--info-text)">modules</text>
  <text x="385" y="278.504673" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.741727" fill="var(--info-text)">backend</text>

  <rect x="520" y="40" width="210" height="325.233645" rx="6.247242" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="625" y="126.728972" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.153798" font-weight="bold" fill="var(--primary-text)">Plan</text>
  <text x="625" y="191.775701" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.741727" fill="var(--primary-text)">diff vs state</text>
  <text x="625" y="235.140187" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.741727" fill="var(--primary-text)">preview</text>
  <text x="625" y="278.504673" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.741727" fill="var(--primary-text)">no changes yet</text>

  <rect x="760" y="40" width="210" height="325.233645" rx="6.247242" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="865" y="126.728972" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.153798" font-weight="bold" fill="var(--danger-text)">Apply</text>
  <text x="865" y="191.775701" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.741727" fill="var(--danger-text)">execute plan</text>
  <text x="865" y="235.140187" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.741727" fill="var(--danger-text)">call APIs</text>
  <text x="865" y="278.504673" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.741727" fill="var(--danger-text)">mutate infra</text>

  <rect x="1000" y="40" width="240" height="325.233645" rx="6.247242" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="126.728972" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.153798" font-weight="bold" fill="var(--ok-text)">State</text>
  <text x="1120" y="191.775701" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.741727" fill="var(--ok-text)">terraform.tfstate</text>
  <text x="1120" y="235.140187" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.741727" fill="var(--ok-text)">remote backend</text>
  <text x="1120" y="278.504673" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.741727" fill="var(--ok-text)">source of truth</text>

  <line x1="250" y1="202.616822" x2="278" y2="202.616822" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="490" y1="202.616822" x2="518" y2="202.616822" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="730" y1="202.616822" x2="758" y2="202.616822" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="970" y1="202.616822" x2="998" y2="202.616822" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M 1120 365.233645 Q 1120 495.327103 640 495.327103 Q 145 495.327103 145 365.233645" fill="none" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <rect x="440" y="462.803738" width="400" height="75.88785" rx="6.247242" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="495.327103" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.741727" font-weight="bold" fill="var(--text)">Iterate</text>
  <text x="640" y="522.429907" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.659313" fill="var(--text-muted)">Edit code, re-plan, re-apply</text>

  <text x="640" y="592.897196" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.741727" fill="var(--text-muted)">State file is updated after every successful apply</text>
  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.659313" fill="var(--text-faint)">Never edit state by hand - use `terraform state` subcommands</text>
</svg>

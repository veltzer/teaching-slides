  <text x="411.4286" y="339.84" text-anchor="middle" font-size="20.1143">providers</text>
  <line x1="512" y1="302.4" x2="585.1429" y2="302.4" stroke="var(--text-dark)" stroke-width="3.6571" marker-end="url(#arrow)" />
  <rect x="585.1429" y="230.4" width="201.1429" height="144" fill="var(--primary-lt)" stroke="var(--primary-dk)" stroke-width="3.6571" rx="9.1429" />

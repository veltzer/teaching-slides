  <line x1="786.2857" y1="302.4" x2="859.4286" y2="302.4" stroke="var(--text-dark)" stroke-width="3.6571" marker-end="url(#arrow)" />
  <rect x="859.4286" y="230.4" width="201.1429" height="144" fill="var(--danger-lt)" stroke="var(--warn-dk)" stroke-width="3.6571" rx="9.1429" />
  <text x="960" y="288" text-anchor="middle" font-size="21.9429" font-weight="bold">Apply</text>
  <text x="960" y="339.84" text-anchor="middle" font-size="20.1143">execute</text>
  <line x1="1060.5714" y1="302.4" x2="1133.7143" y2="302.4" stroke="var(--text-dark)" stroke-width="3.6571" marker-end="url(#arrow)" />
  <rect x="1133.7143" y="230.4" width="109.7143" height="144" fill="var(--ok-lt)" stroke="var(--ok-dk)" stroke-width="3.6571" rx="9.1429" />
  <text x="1188.5714" y="316.8" text-anchor="middle" font-size="21.9429" font-weight="bold">Done</text>
  <text x="685.7143" y="518.4" text-anchor="middle" font-size="23.7714" fill="var(--text-muted)">State file updated after successful apply</text>

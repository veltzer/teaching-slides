<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="34.1333" y="45" width="546.1333" height="630" fill="#e3f2fd" stroke="#1565c0" stroke-width="3.4133" rx="17.0667" />
  <text x="307.2" y="123.75" text-anchor="middle" font-size="30.72" font-weight="bold" fill="#1565c0">Declarative</text>
  <text x="307.2" y="202.5" text-anchor="middle" font-size="22.1867">"What" the desired state is</text>
  <text x="307.2" y="270" text-anchor="middle" font-size="22.1867">Tool figures out "how"</text>
  <text x="307.2" y="360" text-anchor="middle" font-size="22.1867" font-weight="bold">Examples:</text>
  <text x="307.2" y="416.25" text-anchor="middle" font-size="22.1867">Terraform, CloudFormation</text>
  <text x="307.2" y="472.5" text-anchor="middle" font-size="22.1867">Kubernetes manifests</text>
  <text x="307.2" y="562.5" text-anchor="middle" font-size="20.48" fill="#555">Idempotent by design</text>
  <text x="307.2" y="618.75" text-anchor="middle" font-size="20.48" fill="#555">Convergent behavior</text>
  <rect x="699.7333" y="45" width="546.1333" height="630" fill="#fce4ec" stroke="#c62828" stroke-width="3.4133" rx="17.0667" />
  <text x="972.8" y="123.75" text-anchor="middle" font-size="30.72" font-weight="bold" fill="#c62828">Imperative</text>
  <text x="972.8" y="202.5" text-anchor="middle" font-size="22.1867">"How" to reach the state</text>
  <text x="972.8" y="270" text-anchor="middle" font-size="22.1867">Step-by-step instructions</text>
  <text x="972.8" y="360" text-anchor="middle" font-size="22.1867" font-weight="bold">Examples:</text>
  <text x="972.8" y="416.25" text-anchor="middle" font-size="22.1867">Pulumi, AWS CDK</text>
  <text x="972.8" y="472.5" text-anchor="middle" font-size="22.1867">Shell scripts, Ansible playbooks</text>
  <text x="972.8" y="562.5" text-anchor="middle" font-size="20.48" fill="#555">Full programming control</text>
  <text x="972.8" y="618.75" text-anchor="middle" font-size="20.48" fill="#555">Order-dependent execution</text>
</svg>
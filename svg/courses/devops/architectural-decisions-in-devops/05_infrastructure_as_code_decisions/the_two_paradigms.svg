<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:rect x="32.3634" y="42.6667" width="517.8153" height="597.3333" fill="#e3f2fd" stroke="#1565c0" stroke-width="3.2363" rx="16.1818" />
  <ns0:text x="291.2711" y="117.3333" text-anchor="middle" font-size="29.1271" font-weight="bold" fill="#1565c0">Declarative</ns0:text>
  <ns0:text x="291.2711" y="192" text-anchor="middle" font-size="21.0363">"What" the desired state is</ns0:text>
  <ns0:text x="291.2711" y="256" text-anchor="middle" font-size="21.0363">Tool figures out "how"</ns0:text>
  <ns0:text x="291.2711" y="341.3333" text-anchor="middle" font-size="21.0363" font-weight="bold">Examples:</ns0:text>
  <ns0:text x="291.2711" y="394.6667" text-anchor="middle" font-size="21.0363">Terraform, CloudFormation</ns0:text>
  <ns0:text x="291.2711" y="448" text-anchor="middle" font-size="21.0363">Kubernetes manifests</ns0:text>
  <ns0:text x="291.2711" y="533.3333" text-anchor="middle" font-size="19.4181" fill="#555">Idempotent by design</ns0:text>
  <ns0:text x="291.2711" y="586.6667" text-anchor="middle" font-size="19.4181" fill="#555">Convergent behavior</ns0:text>
  <ns0:rect x="663.4508" y="42.6667" width="517.8153" height="597.3333" fill="#fce4ec" stroke="#c62828" stroke-width="3.2363" rx="16.1818" />
  <ns0:text x="922.3585" y="117.3333" text-anchor="middle" font-size="29.1271" font-weight="bold" fill="#c62828">Imperative</ns0:text>
  <ns0:text x="922.3585" y="192" text-anchor="middle" font-size="21.0363">"How" to reach the state</ns0:text>
  <ns0:text x="922.3585" y="256" text-anchor="middle" font-size="21.0363">Step-by-step instructions</ns0:text>
  <ns0:text x="922.3585" y="341.3333" text-anchor="middle" font-size="21.0363" font-weight="bold">Examples:</ns0:text>
  <ns0:text x="922.3585" y="394.6667" text-anchor="middle" font-size="21.0363">Pulumi, AWS CDK</ns0:text>
  <ns0:text x="922.3585" y="448" text-anchor="middle" font-size="21.0363">Shell scripts, Ansible playbooks</ns0:text>
  <ns0:text x="922.3585" y="533.3333" text-anchor="middle" font-size="19.4181" fill="#555">Full programming control</ns0:text>
  <ns0:text x="922.3585" y="586.6667" text-anchor="middle" font-size="19.4181" fill="#555">Order-dependent execution</ns0:text>
</ns0:svg>
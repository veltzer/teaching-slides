<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="32.3634" y="42.6667" width="517.8153" height="597.3333" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="291.2711" y="117.3333" text-anchor="middle" font-size="29.1271" font-weight="bold" fill="var(--primary-accent)">Declarative</text>
  <text x="291.2711" y="192" text-anchor="middle" font-size="21.0363">"What" the desired state is</text>
  <text x="291.2711" y="256" text-anchor="middle" font-size="21.0363">Tool figures out "how"</text>
  <text x="291.2711" y="341.3333" text-anchor="middle" font-size="21.0363" font-weight="bold">Examples:</text>
  <text x="291.2711" y="394.6667" text-anchor="middle" font-size="21.0363">Terraform, CloudFormation</text>
  <text x="291.2711" y="448" text-anchor="middle" font-size="21.0363">Kubernetes manifests</text>
  <text x="291.2711" y="533.3333" text-anchor="middle" font-size="19.4181" fill="var(--text-muted)">Idempotent by design</text>
  <text x="291.2711" y="586.6667" text-anchor="middle" font-size="19.4181" fill="var(--text-muted)">Convergent behavior</text>
  <rect x="663.4508" y="42.6667" width="517.8153" height="597.3333" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="922.3585" y="117.3333" text-anchor="middle" font-size="29.1271" font-weight="bold" fill="var(--danger-accent)">Imperative</text>
  <text x="922.3585" y="192" text-anchor="middle" font-size="21.0363">"How" to reach the state</text>
  <text x="922.3585" y="256" text-anchor="middle" font-size="21.0363">Step-by-step instructions</text>
  <text x="922.3585" y="341.3333" text-anchor="middle" font-size="21.0363" font-weight="bold">Examples:</text>
  <text x="922.3585" y="394.6667" text-anchor="middle" font-size="21.0363">Pulumi, AWS CDK</text>
  <text x="922.3585" y="448" text-anchor="middle" font-size="21.0363">Shell scripts, Ansible playbooks</text>
  <text x="922.3585" y="533.3333" text-anchor="middle" font-size="19.4181" fill="var(--text-muted)">Full programming control</text>
  <text x="922.3585" y="586.6667" text-anchor="middle" font-size="19.4181" fill="var(--text-muted)">Order-dependent execution</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow1" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,24 5.9733,0" fill="#333" />
    </marker>
  </defs>
  <text x="34.1333" y="72" font-size="25.6" font-weight="bold" fill="var(--primary-accent)">Declarative</text>
  <rect x="34.1333" y="108" width="221.8667" height="96" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="145.0667" y="168" text-anchor="middle" font-size="20.48">Desired State</text>
  <line x1="256" y1="156" x2="341.3333" y2="156" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="341.3333" y="108" width="221.8667" height="96" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="452.2667" y="168" text-anchor="middle" font-size="20.48">Diff Engine</text>
  <line x1="563.2" y1="156" x2="648.5333" y2="156" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="648.5333" y="108" width="221.8667" height="96" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="759.4667" y="168" text-anchor="middle" font-size="20.48">Execution Plan</text>
  <line x1="870.4" y1="156" x2="955.7333" y2="156" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="955.7333" y="108" width="256" height="96" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1083.7333" y="168" text-anchor="middle" font-size="20.48">Infrastructure</text>
  <text x="34.1333" y="360" font-size="25.6" font-weight="bold" fill="var(--danger-accent)">Imperative</text>
  <rect x="34.1333" y="396" width="221.8667" height="96" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="145.0667" y="456" text-anchor="middle" font-size="20.48">Step 1: Create</text>
  <line x1="256" y1="444" x2="341.3333" y2="444" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="341.3333" y="396" width="221.8667" height="96" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="452.2667" y="456" text-anchor="middle" font-size="20.48">Step 2: Configure</text>
  <line x1="563.2" y1="444" x2="648.5333" y2="444" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="648.5333" y="396" width="221.8667" height="96" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="759.4667" y="456" text-anchor="middle" font-size="20.48">Step 3: Validate</text>
  <line x1="870.4" y1="444" x2="955.7333" y2="444" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="955.7333" y="396" width="256" height="96" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1083.7333" y="456" text-anchor="middle" font-size="20.48">Infrastructure</text>
  <text x="640" y="624" text-anchor="middle" font-size="22.1867" fill="var(--text-muted)">Both paths reach the same goal; different mental models</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="40" y="40" font-size="26.4896" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Declarative</text>
  <rect x="40" y="77.8261" width="226.087" height="100.8696" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="153.0435" y="140.8696" text-anchor="middle" font-size="21.1917" font-family="Arial, sans-serif" fill="var(--primary-text)">Desired State</text>
  <line x1="266.087" y1="128.2609" x2="353.0435" y2="128.2609" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="353.0435" y="77.8261" width="226.087" height="100.8696" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="466.087" y="140.8696" text-anchor="middle" font-size="21.1917" font-family="Arial, sans-serif" fill="var(--primary-text)">Diff Engine</text>
  <line x1="579.1305" y1="128.2609" x2="666.087" y2="128.2609" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="666.087" y="77.8261" width="226.087" height="100.8696" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="779.1305" y="140.8696" text-anchor="middle" font-size="21.1917" font-family="Arial, sans-serif" fill="var(--primary-text)">Execution Plan</text>
  <line x1="892.1739" y1="128.2609" x2="979.1304" y2="128.2609" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="979.1304" y="77.8261" width="260.8696" height="100.8696" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1109.5652" y="140.8696" text-anchor="middle" font-size="21.1917" font-family="Arial, sans-serif" fill="var(--ok-text)">Infrastructure</text>
  <text x="40" y="342.6087" font-size="26.4896" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Imperative</text>
  <rect x="40" y="380.4348" width="226.087" height="100.8696" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="153.0435" y="443.4783" text-anchor="middle" font-size="21.1917" font-family="Arial, sans-serif" fill="var(--danger-text)">Step 1: Create</text>
  <line x1="266.087" y1="430.8696" x2="353.0435" y2="430.8696" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="353.0435" y="380.4348" width="226.087" height="100.8696" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="466.087" y="443.4783" text-anchor="middle" font-size="21.1917" font-family="Arial, sans-serif" fill="var(--danger-text)">Step 2: Configure</text>
  <line x1="579.1305" y1="430.8696" x2="666.087" y2="430.8696" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="666.087" y="380.4348" width="226.087" height="100.8696" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="779.1305" y="443.4783" text-anchor="middle" font-size="21.1917" font-family="Arial, sans-serif" fill="var(--danger-text)">Step 3: Validate</text>
  <line x1="892.1739" y1="430.8696" x2="979.1304" y2="430.8696" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="979.1304" y="380.4348" width="260.8696" height="100.8696" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1109.5652" y="443.4783" text-anchor="middle" font-size="21.1917" font-family="Arial, sans-serif" fill="var(--ok-text)">Infrastructure</text>
  <text x="657.3913" y="620" text-anchor="middle" font-size="22.9577" fill="var(--text-muted)" font-family="Arial, sans-serif">Both paths reach the same goal; different mental models</text>
</svg>

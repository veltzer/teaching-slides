<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="35.8708" y="44.1379" width="555.9978" height="132.4138" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="313.8697" y="99.3103" text-anchor="middle" font-size="23.316" font-weight="bold" fill="var(--primary-accent)">1. Paradigm</text>
  <text x="313.8697" y="143.4483" text-anchor="middle" font-size="19.729">Declarative vs Imperative</text>
  <rect x="663.6103" y="44.1379" width="555.9978" height="132.4138" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="941.6092" y="99.3103" text-anchor="middle" font-size="23.316" font-weight="bold" fill="var(--ok-accent)">2. Tool</text>
  <text x="941.6092" y="143.4483" text-anchor="middle" font-size="19.729">Terraform vs Pulumi vs CloudFormation</text>
  <rect x="35.8708" y="220.6897" width="555.9978" height="132.4138" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="313.8697" y="275.8621" text-anchor="middle" font-size="23.316" font-weight="bold" fill="var(--warn-accent)">3. State Strategy</text>
  <text x="313.8697" y="320" text-anchor="middle" font-size="19.729">Backend, locking, per-env split</text>
  <rect x="663.6103" y="220.6897" width="555.9978" height="132.4138" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="941.6092" y="275.8621" text-anchor="middle" font-size="23.316" font-weight="bold" fill="var(--danger-accent)">4. Modularity</text>
  <text x="941.6092" y="320" text-anchor="middle" font-size="19.729">Reusable modules vs inline</text>
  <rect x="35.8708" y="397.2414" width="555.9978" height="132.4138" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="313.8697" y="452.4138" text-anchor="middle" font-size="23.316" font-weight="bold" fill="var(--primary-accent)">5. Drift Management</text>
  <text x="313.8697" y="496.5517" text-anchor="middle" font-size="19.729">Continuous vs on-demand detection</text>
  <rect x="663.6103" y="397.2414" width="555.9978" height="132.4138" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="941.6092" y="452.4138" text-anchor="middle" font-size="23.316" font-weight="bold" fill="var(--ok-accent)">6. Governance</text>
  <text x="941.6092" y="496.5517" text-anchor="middle" font-size="19.729">Policy as code, testing, CI/CD</text>
  <text x="627.7395" y="640" text-anchor="middle" font-size="23.316" fill="var(--text-muted)">Each decision shapes your IaC maturity and team velocity</text>
</svg>
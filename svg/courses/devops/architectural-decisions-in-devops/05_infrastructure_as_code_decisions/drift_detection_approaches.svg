<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <text x="329.1429" y="66.6667" text-anchor="middle" font-size="27.4286" font-weight="bold" fill="#1565c0">Continuous</text>
  <rect x="146.2857" y="106.6667" width="365.7143" height="106.6667" fill="#e3f2fd" stroke="#1565c0" stroke-width="3.6571" rx="9.1429" />
  <text x="329.1429" y="173.3333" text-anchor="middle" font-size="21.9429">Scheduled plan runs</text>
  <rect x="146.2857" y="253.3333" width="365.7143" height="106.6667" fill="#e3f2fd" stroke="#1565c0" stroke-width="3.6571" rx="9.1429" />
  <text x="329.1429" y="320" text-anchor="middle" font-size="21.9429">Alert on any diff</text>
  <rect x="146.2857" y="400" width="365.7143" height="106.6667" fill="#e3f2fd" stroke="#1565c0" stroke-width="3.6571" rx="9.1429" />
  <text x="329.1429" y="466.6667" text-anchor="middle" font-size="21.9429">Auto or manual remediate</text>
  <text x="950.8571" y="66.6667" text-anchor="middle" font-size="27.4286" font-weight="bold" fill="#c62828">On-Demand</text>
  <rect x="768" y="106.6667" width="365.7143" height="106.6667" fill="#fce4ec" stroke="#c62828" stroke-width="3.6571" rx="9.1429" />
  <text x="950.8571" y="173.3333" text-anchor="middle" font-size="21.9429">Manual plan before deploy</text>
  <rect x="768" y="253.3333" width="365.7143" height="106.6667" fill="#fce4ec" stroke="#c62828" stroke-width="3.6571" rx="9.1429" />
  <text x="950.8571" y="320" text-anchor="middle" font-size="21.9429">Drift found at apply time</text>
  <rect x="768" y="400" width="365.7143" height="106.6667" fill="#fce4ec" stroke="#c62828" stroke-width="3.6571" rx="9.1429" />
  <text x="950.8571" y="466.6667" text-anchor="middle" font-size="21.9429">Requires human judgment</text>
  <text x="640" y="640" text-anchor="middle" font-size="21.9429" fill="#555">Continuous catches drift early; on-demand is simpler to operate</text>
</svg>
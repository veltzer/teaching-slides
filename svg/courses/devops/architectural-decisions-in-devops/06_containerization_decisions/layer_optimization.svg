<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="553.8461" height="580" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.279217524774" filter="url(#shadow)"/>
  <text x="316.9232" y="95.238116099774" text-anchor="middle" font-size="24.754245287042" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Before (5 layers, 450 MB)</text>
  <rect x="76.9232" y="136.666593650791" width="480.0001" height="82.857283673474" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.279217524774" filter="url(#shadow)"/>
  <text x="316.9232" y="191.904709750565" text-anchor="middle" font-size="19.041727143878" font-family="Arial, sans-serif" fill="var(--warn-text)">RUN apt-get update</text>
  <rect x="76.9232" y="233.333406349209" width="480.0001" height="82.857283673474" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.279217524774" filter="url(#shadow)"/>
  <text x="316.9232" y="288.571522448983" text-anchor="middle" font-size="19.041727143878" font-family="Arial, sans-serif" fill="var(--warn-text)">RUN apt-get install gcc</text>
  <rect x="76.9232" y="330" width="480.0001" height="82.857283673474" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.279217524774" filter="url(#shadow)"/>
  <text x="316.9232" y="385.238116099774" text-anchor="middle" font-size="19.041727143878" font-family="Arial, sans-serif" fill="var(--warn-text)">RUN pip install deps</text>
  <rect x="76.9232" y="426.666593650791" width="480.0001" height="82.857283673474" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.279217524774" filter="url(#shadow)"/>
  <text x="316.9232" y="481.904709750565" text-anchor="middle" font-size="19.041727143878" font-family="Arial, sans-serif" fill="var(--warn-text)">RUN apt-get remove gcc</text>
  <rect x="76.9232" y="523.333406349209" width="480.0001" height="69.047645124717" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.279217524774" filter="url(#shadow)"/>
  <text x="316.9232" y="570.285717414966" text-anchor="middle" font-size="19.041727143878" font-family="Arial, sans-serif" fill="var(--warn-text)">gcc still in earlier layer!</text>
  <rect x="686.1539" y="40" width="553.8461" height="580" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.279217524774" filter="url(#shadow)"/>
  <text x="963.077" y="95.238116099774" text-anchor="middle" font-size="24.754245287042" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">After (2 layers, 120 MB)</text>
  <rect x="723.0771" y="136.666593650791" width="480.0001" height="220.952354875283" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.279217524774" filter="url(#shadow)"/>
  <text x="963.077" y="219.523767800452" text-anchor="middle" font-size="19.041727143878" font-family="Arial, sans-serif" fill="var(--ok-text)">RUN apt-get update &amp;&amp;</text>
  <text x="963.077" y="260.952354875283" text-anchor="middle" font-size="19.041727143878" font-family="Arial, sans-serif" fill="var(--ok-text)">apt-get install gcc &amp;&amp;</text>
  <text x="963.077" y="302.3808324263" text-anchor="middle" font-size="19.041727143878" font-family="Arial, sans-serif" fill="var(--ok-text)">pip install deps &amp;&amp; apt-get remove gcc</text>
  <rect x="723.0771" y="385.238116099774" width="480.0001" height="96.666593650791" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.279217524774" filter="url(#shadow)"/>
  <text x="963.077" y="446.000065714288" text-anchor="middle" font-size="19.041727143878" font-family="Arial, sans-serif" fill="var(--ok-text)">COPY app /app</text>
  <text x="963.077" y="550.952354875283" text-anchor="middle" font-size="22.850072572654" fill="var(--ok-accent)" font-family="Arial, sans-serif">gcc removed in same layer = gone</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="624.6623" y="62.7451" text-anchor="middle" font-size="28.5559" font-weight="bold">Layer Optimization: Before vs After</text>
  <rect x="53.5424" y="112.9412" width="535.4248" height="527.0588" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="321.2549" y="163.1373" text-anchor="middle" font-size="23.2017" font-weight="bold" fill="var(--danger-accent)">Before (5 layers, 450 MB)</text>
  <rect x="89.2375" y="200.7843" width="464.0349" height="75.2942" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="321.2549" y="250.9804" text-anchor="middle" font-size="17.8475">RUN apt-get update</text>
  <rect x="89.2375" y="288.6275" width="464.0349" height="75.2942" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="321.2549" y="338.8236" text-anchor="middle" font-size="17.8475">RUN apt-get install gcc</text>
  <rect x="89.2375" y="376.4706" width="464.0349" height="75.2942" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="321.2549" y="426.6667" text-anchor="middle" font-size="17.8475">RUN pip install deps</text>
  <rect x="89.2375" y="464.3137" width="464.0349" height="75.2942" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="321.2549" y="514.5098" text-anchor="middle" font-size="17.8475">RUN apt-get remove gcc</text>
  <rect x="89.2375" y="552.1569" width="464.0349" height="62.7451" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="321.2549" y="594.8235" text-anchor="middle" font-size="17.8475">gcc still in earlier layer!</text>
  <rect x="678.2047" y="112.9412" width="535.4248" height="527.0588" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="945.9172" y="163.1373" text-anchor="middle" font-size="23.2017" font-weight="bold" fill="var(--ok-accent)">After (2 layers, 120 MB)</text>
  <rect x="713.8998" y="200.7843" width="464.0349" height="200.7843" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="945.9172" y="276.0784" text-anchor="middle" font-size="17.8475">RUN apt-get update &amp;&amp;</text>
  <text x="945.9172" y="313.7255" text-anchor="middle" font-size="17.8475">apt-get install gcc &amp;&amp;</text>
  <text x="945.9172" y="351.3725" text-anchor="middle" font-size="17.8475">pip install deps &amp;&amp; apt-get remove gcc</text>
  <rect x="713.8998" y="426.6667" width="464.0349" height="87.8431" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="945.9172" y="481.8824" text-anchor="middle" font-size="17.8475">COPY app /app</text>
  <text x="945.9172" y="577.2549" text-anchor="middle" font-size="21.417" fill="var(--ok-accent)">gcc removed in same layer = gone</text>
</svg>
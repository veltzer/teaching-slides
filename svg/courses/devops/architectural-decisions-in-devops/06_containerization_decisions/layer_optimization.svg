<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="64.2857" text-anchor="middle" font-size="29.2571" font-weight="bold">Layer Optimization: Before vs After</text>
  <rect x="54.8571" y="115.7143" width="548.5714" height="540" fill="#ffebee" stroke="#c62828" stroke-width="1.8286" rx="9.1429" />
  <text x="329.1429" y="167.1429" text-anchor="middle" font-size="23.7714" font-weight="bold" fill="#c62828">Before (5 layers, 450 MB)</text>
  <rect x="91.4286" y="205.7143" width="475.4286" height="77.1429" fill="#ef9a9a" stroke="#c62828" stroke-width="1.8286" rx="5.4857" />
  <text x="329.1429" y="257.1429" text-anchor="middle" font-size="18.2857">RUN apt-get update</text>
  <rect x="91.4286" y="295.7143" width="475.4286" height="77.1429" fill="#ef9a9a" stroke="#c62828" stroke-width="1.8286" rx="5.4857" />
  <text x="329.1429" y="347.1429" text-anchor="middle" font-size="18.2857">RUN apt-get install gcc</text>
  <rect x="91.4286" y="385.7143" width="475.4286" height="77.1429" fill="#ef9a9a" stroke="#c62828" stroke-width="1.8286" rx="5.4857" />
  <text x="329.1429" y="437.1429" text-anchor="middle" font-size="18.2857">RUN pip install deps</text>
  <rect x="91.4286" y="475.7143" width="475.4286" height="77.1429" fill="#ef9a9a" stroke="#c62828" stroke-width="1.8286" rx="5.4857" />
  <text x="329.1429" y="527.1429" text-anchor="middle" font-size="18.2857">RUN apt-get remove gcc</text>
  <rect x="91.4286" y="565.7143" width="475.4286" height="64.2857" fill="#ef9a9a" stroke="#c62828" stroke-width="1.8286" rx="5.4857" />
  <text x="329.1429" y="609.4286" text-anchor="middle" font-size="18.2857">gcc still in earlier layer!</text>
  <rect x="694.8571" y="115.7143" width="548.5714" height="540" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.8286" rx="9.1429" />
  <text x="969.1429" y="167.1429" text-anchor="middle" font-size="23.7714" font-weight="bold" fill="#2e7d32">After (2 layers, 120 MB)</text>
  <rect x="731.4286" y="205.7143" width="475.4286" height="205.7143" fill="#a5d6a7" stroke="#2e7d32" stroke-width="1.8286" rx="5.4857" />
  <text x="969.1429" y="282.8571" text-anchor="middle" font-size="18.2857">RUN apt-get update &amp;&amp;</text>
  <text x="969.1429" y="321.4286" text-anchor="middle" font-size="18.2857">apt-get install gcc &amp;&amp;</text>
  <text x="969.1429" y="360" text-anchor="middle" font-size="18.2857">pip install deps &amp;&amp; apt-get remove gcc</text>
  <rect x="731.4286" y="437.1429" width="475.4286" height="90" fill="#a5d6a7" stroke="#2e7d32" stroke-width="1.8286" rx="5.4857" />
  <text x="969.1429" y="493.7143" text-anchor="middle" font-size="18.2857">COPY app /app</text>
  <text x="969.1429" y="591.4286" text-anchor="middle" font-size="21.9429" fill="#2e7d32">gcc removed in same layer = gone</text>
</svg>
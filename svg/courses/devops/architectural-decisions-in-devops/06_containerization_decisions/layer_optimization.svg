<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:text x="624.6623" y="62.7451" text-anchor="middle" font-size="28.5559" font-weight="bold">Layer Optimization: Before vs After</ns0:text>
  <ns0:rect x="53.5424" y="112.9412" width="535.4248" height="527.0588" fill="#ffebee" stroke="#c62828" stroke-width="1.7848" rx="8.9238" />
  <ns0:text x="321.2549" y="163.1373" text-anchor="middle" font-size="23.2017" font-weight="bold" fill="#c62828">Before (5 layers, 450 MB)</ns0:text>
  <ns0:rect x="89.2375" y="200.7843" width="464.0349" height="75.2942" fill="#ffcc80" stroke="#c62828" stroke-width="1.7848" rx="5.3542" />
  <ns0:text x="321.2549" y="250.9804" text-anchor="middle" font-size="17.8475">RUN apt-get update</ns0:text>
  <ns0:rect x="89.2375" y="288.6275" width="464.0349" height="75.2942" fill="#ffcc80" stroke="#c62828" stroke-width="1.7848" rx="5.3542" />
  <ns0:text x="321.2549" y="338.8236" text-anchor="middle" font-size="17.8475">RUN apt-get install gcc</ns0:text>
  <ns0:rect x="89.2375" y="376.4706" width="464.0349" height="75.2942" fill="#ffcc80" stroke="#c62828" stroke-width="1.7848" rx="5.3542" />
  <ns0:text x="321.2549" y="426.6667" text-anchor="middle" font-size="17.8475">RUN pip install deps</ns0:text>
  <ns0:rect x="89.2375" y="464.3137" width="464.0349" height="75.2942" fill="#ffcc80" stroke="#c62828" stroke-width="1.7848" rx="5.3542" />
  <ns0:text x="321.2549" y="514.5098" text-anchor="middle" font-size="17.8475">RUN apt-get remove gcc</ns0:text>
  <ns0:rect x="89.2375" y="552.1569" width="464.0349" height="62.7451" fill="#ffcc80" stroke="#c62828" stroke-width="1.7848" rx="5.3542" />
  <ns0:text x="321.2549" y="594.8235" text-anchor="middle" font-size="17.8475">gcc still in earlier layer!</ns0:text>
  <ns0:rect x="678.2047" y="112.9412" width="535.4248" height="527.0588" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.7848" rx="8.9238" />
  <ns0:text x="945.9172" y="163.1373" text-anchor="middle" font-size="23.2017" font-weight="bold" fill="#2e7d32">After (2 layers, 120 MB)</ns0:text>
  <ns0:rect x="713.8998" y="200.7843" width="464.0349" height="200.7843" fill="#a5d6a7" stroke="#2e7d32" stroke-width="1.7848" rx="5.3542" />
  <ns0:text x="945.9172" y="276.0784" text-anchor="middle" font-size="17.8475">RUN apt-get update &amp;&amp;</ns0:text>
  <ns0:text x="945.9172" y="313.7255" text-anchor="middle" font-size="17.8475">apt-get install gcc &amp;&amp;</ns0:text>
  <ns0:text x="945.9172" y="351.3725" text-anchor="middle" font-size="17.8475">pip install deps &amp;&amp; apt-get remove gcc</ns0:text>
  <ns0:rect x="713.8998" y="426.6667" width="464.0349" height="87.8431" fill="#a5d6a7" stroke="#2e7d32" stroke-width="1.7848" rx="5.3542" />
  <ns0:text x="945.9172" y="481.8824" text-anchor="middle" font-size="17.8475">COPY app /app</ns0:text>
  <ns0:text x="945.9172" y="577.2549" text-anchor="middle" font-size="21.417" fill="#2e7d32">gcc removed in same layer = gone</ns0:text>
</ns0:svg>
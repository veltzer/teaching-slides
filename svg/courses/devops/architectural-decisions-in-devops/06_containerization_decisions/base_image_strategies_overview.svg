<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <text x="140" y="65.663717" text-anchor="end" font-size="18.237373" fill="var(--text)" font-family="Arial, sans-serif">Scratch</text>
  <rect x="160" y="40" width="30" height="41.061947" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.079124" filter="url(#shadow)"/>
  <text x="200" y="65.663717" font-size="16.210998" fill="var(--text)" font-family="Arial, sans-serif">0 MB</text>

  <text x="140" y="158.053097" text-anchor="end" font-size="18.237373" fill="var(--text)" font-family="Arial, sans-serif">Distroless</text>
  <rect x="160" y="132.389381" width="90" height="41.061947" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.079124" filter="url(#shadow)"/>
  <text x="260" y="158.053097" font-size="16.210998" fill="var(--text)" font-family="Arial, sans-serif">~2 MB</text>

  <text x="140" y="250.442478" text-anchor="end" font-size="18.237373" fill="var(--text)" font-family="Arial, sans-serif">Alpine</text>
  <rect x="160" y="224.778761" width="130" height="41.061947" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.079124" filter="url(#shadow)"/>
  <text x="300" y="250.442478" font-size="16.210998" fill="var(--text)" font-family="Arial, sans-serif">~7 MB</text>

  <text x="140" y="342.831858" text-anchor="end" font-size="18.237373" fill="var(--text)" font-family="Arial, sans-serif">Debian slim</text>
  <rect x="160" y="317.168142" width="440" height="41.061947" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.079124" filter="url(#shadow)"/>
  <text x="610" y="342.831858" font-size="16.210998" fill="var(--text)" font-family="Arial, sans-serif">~80 MB</text>

  <text x="140" y="435.221239" text-anchor="end" font-size="18.237373" fill="var(--text)" font-family="Arial, sans-serif">Ubuntu</text>
  <rect x="160" y="409.557522" width="660" height="41.061947" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.079124" filter="url(#shadow)"/>
  <text x="830" y="435.221239" font-size="16.210998" fill="var(--text)" font-family="Arial, sans-serif">~120 MB</text>

  <text x="140" y="527.610619" text-anchor="end" font-size="18.237373" fill="var(--text)" font-family="Arial, sans-serif">Full Debian</text>
  <rect x="160" y="501.946903" width="990" height="41.061947" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.079124" filter="url(#shadow)"/>
  <text x="1160" y="527.610619" font-size="16.210998" fill="var(--text)" font-family="Arial, sans-serif">~180 MB</text>

  <rect x="40" y="578.938053" width="1200" height="41.061947" rx="6.079124" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="606.654867" text-anchor="middle" font-size="15.197811" fill="var(--text-muted)" font-family="Arial, sans-serif">Smaller images pull faster, ship fewer CVEs, and start sooner.</text>
</svg>

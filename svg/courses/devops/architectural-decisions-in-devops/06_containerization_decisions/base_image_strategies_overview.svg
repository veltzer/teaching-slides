<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
  </defs>

  <text x="140" y="65.663717" text-anchor="end" font-size="18.237373" fill="var(--text)">Scratch</text>
  <rect x="160" y="40" width="30" height="41.061947" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6.079124" filter="url(#shadow)"/>
  <text x="200" y="65.663717" font-size="16.210998" fill="var(--text)">0 MB</text>

  <text x="140" y="158.053097" text-anchor="end" font-size="18.237373" fill="var(--text)">Distroless</text>
  <rect x="160" y="132.389381" width="90" height="41.061947" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6.079124" filter="url(#shadow)"/>
  <text x="260" y="158.053097" font-size="16.210998" fill="var(--text)">~2 MB</text>

  <text x="140" y="250.442478" text-anchor="end" font-size="18.237373" fill="var(--text)">Alpine</text>
  <rect x="160" y="224.778761" width="130" height="41.061947" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6.079124" filter="url(#shadow)"/>
  <text x="300" y="250.442478" font-size="16.210998" fill="var(--text)">~7 MB</text>

  <text x="140" y="342.831858" text-anchor="end" font-size="18.237373" fill="var(--text)">Debian slim</text>
  <rect x="160" y="317.168142" width="440" height="41.061947" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6.079124" filter="url(#shadow)"/>
  <text x="610" y="342.831858" font-size="16.210998" fill="var(--text)">~80 MB</text>

  <text x="140" y="435.221239" text-anchor="end" font-size="18.237373" fill="var(--text)">Ubuntu</text>
  <rect x="160" y="409.557522" width="660" height="41.061947" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6.079124" filter="url(#shadow)"/>
  <text x="830" y="435.221239" font-size="16.210998" fill="var(--text)">~120 MB</text>

  <text x="140" y="527.610619" text-anchor="end" font-size="18.237373" fill="var(--text)">Full Debian</text>
  <rect x="160" y="501.946903" width="990" height="41.061947" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6.079124" filter="url(#shadow)"/>
  <text x="1160" y="527.610619" font-size="16.210998" fill="var(--text)">~180 MB</text>

  <rect x="40" y="578.938053" width="1200" height="41.061947" rx="6.079124" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="606.654867" text-anchor="middle" font-size="15.197811" fill="var(--text-muted)">Smaller images pull faster, ship fewer CVEs, and start sooner.</text>
</svg>

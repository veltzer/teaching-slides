<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="360" height="305.26313407202" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.38254222449" filter="url(#shadow)"/>
  <text x="220" y="116.315726939053" text-anchor="middle" font-size="28.037869737962" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Development</text>
  <text x="220" y="192.63156703601" text-anchor="middle" font-size="23.724441326948" font-family="Arial, sans-serif" fill="var(--primary-text)">Docker Desktop</text>
  <text x="220" y="247.578894958445" text-anchor="middle" font-size="23.724441326948" font-family="Arial, sans-serif" fill="var(--primary-text)">or Podman</text>
  <text x="220" y="308.63154440443" text-anchor="middle" font-size="23.724441326948" font-family="Arial, sans-serif" fill="var(--primary-text)">Build + Run + Debug</text>
  <rect x="460" y="40" width="360" height="305.26313407202" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.38254222449" filter="url(#shadow)"/>
  <text x="639.9999" y="116.315726939053" text-anchor="middle" font-size="28.037869737962" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Production K8s</text>
  <text x="639.9999" y="192.63156703601" text-anchor="middle" font-size="23.724441326948" font-family="Arial, sans-serif" fill="var(--ok-text)">containerd</text>
  <text x="639.9999" y="247.578894958445" text-anchor="middle" font-size="23.724441326948" font-family="Arial, sans-serif" fill="var(--ok-text)">or CRI-O</text>
  <text x="639.9999" y="308.63154440443" text-anchor="middle" font-size="23.724441326948" font-family="Arial, sans-serif" fill="var(--ok-text)">Lean + Standard</text>
  <rect x="880" y="40" width="360" height="305.26313407202" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.38254222449" filter="url(#shadow)"/>
  <text x="1059.9999" y="116.315726939053" text-anchor="middle" font-size="28.037869737962" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">High Security</text>
  <text x="1059.9999" y="192.63156703601" text-anchor="middle" font-size="23.724441326948" font-family="Arial, sans-serif" fill="var(--warn-text)">gVisor or Kata</text>
  <text x="1059.9999" y="247.578894958445" text-anchor="middle" font-size="23.724441326948" font-family="Arial, sans-serif" fill="var(--warn-text)">with containerd</text>
  <text x="1059.9999" y="308.63154440443" text-anchor="middle" font-size="23.724441326948" font-family="Arial, sans-serif" fill="var(--warn-text)">Isolation + Safety</text>
  <rect x="40" y="467.36843296399" width="1200" height="152.63156703601" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.38254222449"/>
  <text x="639.9999" y="528.421082409975" text-anchor="middle" font-size="25.881208720307" font-family="Arial, sans-serif" fill="var(--text)">All runtimes use the same OCI images.</text>
  <text x="639.9999" y="583.368410332409" text-anchor="middle" font-size="25.881208720307" font-family="Arial, sans-serif" fill="var(--text)">Your Dockerfiles work everywhere.</text>
</svg>

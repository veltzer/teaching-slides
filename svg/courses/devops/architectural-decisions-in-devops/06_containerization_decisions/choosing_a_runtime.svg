<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <text x="640" y="60" text-anchor="middle" font-size="29.2571" font-weight="bold">Runtime Selection Guide</text>
  <rect x="91.4286" y="120" width="329.1429" height="240" fill="#e3f2fd" stroke="#1565c0" stroke-width="3.6571" rx="9.1429" />
  <text x="256" y="180" text-anchor="middle" font-size="23.7714" font-weight="bold" fill="#1565c0">Development</text>
  <text x="256" y="240" text-anchor="middle" font-size="20.1143">Docker Desktop</text>
  <text x="256" y="283.2" text-anchor="middle" font-size="20.1143">or Podman</text>
  <text x="256" y="331.2" text-anchor="middle" font-size="20.1143">Build + Run + Debug</text>
  <rect x="475.4286" y="120" width="329.1429" height="240" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3.6571" rx="9.1429" />
  <text x="640" y="180" text-anchor="middle" font-size="23.7714" font-weight="bold" fill="#2e7d32">Production K8s</text>
  <text x="640" y="240" text-anchor="middle" font-size="20.1143">containerd</text>
  <text x="640" y="283.2" text-anchor="middle" font-size="20.1143">or CRI-O</text>
  <text x="640" y="331.2" text-anchor="middle" font-size="20.1143">Lean + Standard</text>
  <rect x="859.4286" y="120" width="329.1429" height="240" fill="#fff3e0" stroke="#e65100" stroke-width="3.6571" rx="9.1429" />
  <text x="1024" y="180" text-anchor="middle" font-size="23.7714" font-weight="bold" fill="#e65100">High Security</text>
  <text x="1024" y="240" text-anchor="middle" font-size="20.1143">gVisor or Kata</text>
  <text x="1024" y="283.2" text-anchor="middle" font-size="20.1143">with containerd</text>
  <text x="1024" y="331.2" text-anchor="middle" font-size="20.1143">Isolation + Safety</text>
  <rect x="91.4286" y="456" width="1097.1429" height="120" fill="#f5f5f5" stroke="#333" stroke-width="1.8286" rx="9.1429" />
  <text x="640" y="504" text-anchor="middle" font-size="21.9429">All runtimes use the same OCI images.</text>
  <text x="640" y="547.2" text-anchor="middle" font-size="21.9429">Your Dockerfiles work everywhere.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="169.014" height="207.142875" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.708203932499" filter="url(#shadow)"/>
  <text x="124.507" y="131.142875" text-anchor="middle" font-size="23.193391489819" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Code</text>
  <text x="124.507" y="197.4285" text-anchor="middle" font-size="21.084779387037" font-family="Arial, sans-serif" fill="var(--primary-text)">Commit</text>
  <line x1="209.0141" y1="143.571375" x2="259.7183" y2="143.571375" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="268.1691" y="40" width="169.014" height="207.142875" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.708203932499" filter="url(#shadow)"/>
  <text x="352.676" y="131.142875" text-anchor="middle" font-size="23.193391489819" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Build</text>
  <text x="352.676" y="197.4285" text-anchor="middle" font-size="21.084779387037" font-family="Arial, sans-serif" fill="var(--warn-text)">Multi-stage</text>
  <line x1="437.1831" y1="143.571375" x2="487.8874" y2="143.571375" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="496.3381" y="40" width="169.014" height="207.142875" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.708203932499" filter="url(#shadow)"/>
  <text x="580.8451" y="131.142875" text-anchor="middle" font-size="23.193391489819" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Scan</text>
  <text x="580.8451" y="197.4285" text-anchor="middle" font-size="21.084779387037" font-family="Arial, sans-serif" fill="var(--danger-text)">Trivy/Grype</text>
  <line x1="665.3522" y1="143.571375" x2="716.0564" y2="143.571375" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="724.5071" y="40" width="169.014" height="207.142875" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.708203932499" filter="url(#shadow)"/>
  <text x="809.0141" y="131.142875" text-anchor="middle" font-size="23.193391489819" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Sign</text>
  <text x="809.0141" y="197.4285" text-anchor="middle" font-size="21.084779387037" font-family="Arial, sans-serif" fill="var(--info-text)">Cosign</text>
  <line x1="893.5212" y1="143.571375" x2="944.2254" y2="143.571375" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="952.676" y="40" width="185.9156" height="207.142875" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.708203932499" filter="url(#shadow)"/>
  <text x="1045.6338" y="131.142875" text-anchor="middle" font-size="23.193391489819" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Registry</text>
  <text x="1045.6338" y="197.4285" text-anchor="middle" font-size="21.084779387037" font-family="Arial, sans-serif" fill="var(--ok-text)">Push + Tag</text>
  <line x1="1045.6338" y1="247.14275" x2="1045.6338" y2="392.142875" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="851.2676" y="412.857125" width="388.7324" height="207.142875" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.708203932499" filter="url(#shadow)"/>
  <text x="1045.6338" y="504" text-anchor="middle" font-size="23.193391489819" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Deploy</text>
  <text x="1045.6338" y="570.28575" text-anchor="middle" font-size="21.084779387037" font-family="Arial, sans-serif" fill="var(--primary-text)">K8s / ECS / Nomad</text>
</svg>

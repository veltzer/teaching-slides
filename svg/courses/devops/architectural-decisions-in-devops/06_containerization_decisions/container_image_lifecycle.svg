<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="613.6986" y="69.0411" text-anchor="middle" font-size="28.0548" font-weight="bold">Image Lifecycle Pipeline</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow_lc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 17.28 L 16.4571 8.64 z" fill="#333" />
    </marker>
  </defs>
  <rect x="35.0685" y="165.6986" width="175.3424" height="138.0822" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="122.7397" y="226.4548" text-anchor="middle" font-size="19.2877" font-weight="bold">Code</text>
  <text x="122.7397" y="270.6411" text-anchor="middle" font-size="17.5342">Commit</text>
  <line x1="210.411" y1="234.7397" x2="263.0137" y2="234.7397" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_lc)" />
  <rect x="271.7809" y="165.6986" width="175.3424" height="138.0822" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="359.452" y="226.4548" text-anchor="middle" font-size="19.2877" font-weight="bold">Build</text>
  <text x="359.452" y="270.6411" text-anchor="middle" font-size="17.5342">Multi-stage</text>
  <line x1="447.1233" y1="234.7397" x2="499.7261" y2="234.7397" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_lc)" />
  <rect x="508.4932" y="165.6986" width="175.3424" height="138.0822" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="596.1644" y="226.4548" text-anchor="middle" font-size="19.2877" font-weight="bold">Scan</text>
  <text x="596.1644" y="270.6411" text-anchor="middle" font-size="17.5342">Trivy/Grype</text>
  <line x1="683.8357" y1="234.7397" x2="736.4384" y2="234.7397" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_lc)" />
  <rect x="745.2055" y="165.6986" width="175.3424" height="138.0822" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="832.8767" y="226.4548" text-anchor="middle" font-size="19.2877" font-weight="bold">Sign</text>
  <text x="832.8767" y="270.6411" text-anchor="middle" font-size="17.5342">Cosign</text>
  <line x1="920.548" y1="234.7397" x2="973.1507" y2="234.7397" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_lc)" />
  <rect x="981.9178" y="165.6986" width="192.8768" height="138.0822" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1078.3562" y="226.4548" text-anchor="middle" font-size="19.2877" font-weight="bold">Registry</text>
  <text x="1078.3562" y="270.6411" text-anchor="middle" font-size="17.5342">Push + Tag</text>
  <line x1="1078.3562" y1="303.7808" x2="1078.3562" y2="400.4384" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_lc)" />
  <rect x="876.7123" y="414.2466" width="403.2877" height="138.0822" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="1078.3562" y="475.0028" text-anchor="middle" font-size="19.2877" font-weight="bold">Deploy</text>
  <text x="1078.3562" y="519.1891" text-anchor="middle" font-size="17.5342">K8s / ECS / Nomad</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="463.5295" y="40" width="352.9412" height="118.974353451677" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.226493847056" filter="url(#shadow)"/>
  <text x="640" y="114.359051676518" text-anchor="middle" font-size="25.920271235909" font-family="Arial, sans-serif" fill="var(--warn-text)">New workload?</text>
  <line x1="551.7647" y1="158.974353451677" x2="287.0588" y2="277.948706903355" stroke="var(--text)" stroke-width="2"/>
  <line x1="728.2354" y1="158.974353451677" x2="992.9413" y2="277.948706903355" stroke="var(--text)" stroke-width="2"/>
  <text x="392.9412" y="218.461530177516" font-size="23.760196745467" fill="var(--text)" font-family="Arial, sans-serif">No</text>
  <text x="851.7648" y="218.461530177516" font-size="23.760196745467" fill="var(--text)" font-family="Arial, sans-serif">Yes</text>
  <rect x="110.5883" y="277.948706903355" width="352.9412" height="118.974353451677" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.226493847056" filter="url(#shadow)"/>
  <text x="287.0588" y="352.307650887579" text-anchor="middle" font-size="25.920271235909" font-family="Arial, sans-serif" fill="var(--warn-text)">Worth refactoring?</text>
  <rect x="816.4706" y="277.948706903355" width="352.9412" height="118.974353451677" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.226493847056" filter="url(#shadow)"/>
  <text x="992.9413" y="352.307650887579" text-anchor="middle" font-size="25.920271235909" font-family="Arial, sans-serif" fill="var(--warn-text)">Needs bare metal?</text>
  <line x1="198.8235" y1="396.923168047325" x2="128.2353" y2="515.897413806709" stroke="var(--text)" stroke-width="2"/>
  <line x1="375.2942" y1="396.923168047325" x2="445.8823" y2="515.897413806709" stroke="var(--text)" stroke-width="2"/>
  <text x="137.0588" y="471.282004339257" font-size="23.760196745467" fill="var(--text)" font-family="Arial, sans-serif">No</text>
  <text x="410.5883" y="471.282004339257" font-size="23.760196745467" fill="var(--text)" font-family="Arial, sans-serif">Yes</text>
  <line x1="904.7059" y1="396.923168047325" x2="834.1177" y2="515.897413806709" stroke="var(--text)" stroke-width="2"/>
  <line x1="1081.1766" y1="396.923168047325" x2="1151.7648" y2="515.897413806709" stroke="var(--text)" stroke-width="2"/>
  <text x="842.9412" y="471.282004339257" font-size="23.760196745467" fill="var(--text)" font-family="Arial, sans-serif">No</text>
  <text x="1116.4707" y="471.282004339257" font-size="23.760196745467" fill="var(--text)" font-family="Arial, sans-serif">Yes</text>
  <rect x="40" y="515.897413806709" width="176.4706" height="104.102586193291" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.226493847056" filter="url(#shadow)"/>
  <text x="128.2353" y="581.333297435902" text-anchor="middle" font-size="23.760196745467" fill="var(--bg)" font-family="Arial, sans-serif">Keep as-is</text>
  <rect x="357.6471" y="515.897413806709" width="176.4706" height="104.102586193291" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.226493847056" filter="url(#shadow)"/>
  <text x="445.8823" y="581.333297435902" text-anchor="middle" font-size="23.760196745467" fill="var(--bg)" font-family="Arial, sans-serif">Containerize</text>
  <rect x="745.8824" y="515.897413806709" width="176.4706" height="104.102586193291" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.226493847056" filter="url(#shadow)"/>
  <text x="834.1177" y="581.333297435902" text-anchor="middle" font-size="23.760196745467" fill="var(--bg)" font-family="Arial, sans-serif">Containerize</text>
  <rect x="1063.5294" y="515.897413806709" width="176.4706" height="104.102586193291" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.226493847056" filter="url(#shadow)"/>
  <text x="1151.7648" y="581.333297435902" text-anchor="middle" font-size="23.760196745467" fill="var(--bg)" font-family="Arial, sans-serif">Run on host</text>
</svg>

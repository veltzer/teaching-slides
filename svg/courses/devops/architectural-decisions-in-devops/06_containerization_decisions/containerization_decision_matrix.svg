<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="33.303" font-weight="bold">Should You Containerize?</text>
  <rect x="463.5295" y="81.4285" width="352.9412" height="110.4762" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="640" y="150.4762" text-anchor="middle" font-size="24.9774">New workload?</text>
  <line x1="551.7647" y1="191.9047" x2="287.0588" y2="302.3809" stroke="var(--text)" stroke-width="2" />
  <line x1="728.2354" y1="191.9047" x2="992.9413" y2="302.3809" stroke="var(--text)" stroke-width="2" />
  <text x="392.9412" y="247.1428" font-size="22.8959" fill="var(--text)">No</text>
  <text x="851.7648" y="247.1428" font-size="22.8959" fill="var(--text)">Yes</text>
  <rect x="110.5883" y="302.3809" width="352.9412" height="110.4762" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="287.0588" y="371.4285" text-anchor="middle" font-size="24.9774">Worth refactoring?</text>
  <rect x="816.4706" y="302.3809" width="352.9412" height="110.4762" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="992.9413" y="371.4285" text-anchor="middle" font-size="24.9774">Needs bare metal?</text>
  <line x1="198.8235" y1="412.8572" x2="128.2353" y2="523.3333" stroke="var(--text)" stroke-width="2" />
  <line x1="375.2942" y1="412.8572" x2="445.8823" y2="523.3333" stroke="var(--text)" stroke-width="2" />
  <text x="137.0588" y="481.9047" font-size="22.8959" fill="var(--text)">No</text>
  <text x="410.5883" y="481.9047" font-size="22.8959" fill="var(--text)">Yes</text>
  <line x1="904.7059" y1="412.8572" x2="834.1177" y2="523.3333" stroke="var(--text)" stroke-width="2" />
  <line x1="1081.1766" y1="412.8572" x2="1151.7648" y2="523.3333" stroke="var(--text)" stroke-width="2" />
  <text x="842.9412" y="481.9047" font-size="22.8959" fill="var(--text)">No</text>
  <text x="1116.4707" y="481.9047" font-size="22.8959" fill="var(--text)">Yes</text>
  <rect x="40" y="523.3333" width="176.4706" height="96.6667" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="128.2353" y="584.0952" text-anchor="middle" font-size="22.8959" fill="var(--bg)">Keep as-is</text>
  <rect x="357.6471" y="523.3333" width="176.4706" height="96.6667" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="445.8823" y="584.0952" text-anchor="middle" font-size="22.8959" fill="var(--bg)">Containerize</text>
  <rect x="745.8824" y="523.3333" width="176.4706" height="96.6667" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="834.1177" y="584.0952" text-anchor="middle" font-size="22.8959" fill="var(--bg)">Containerize</text>
  <rect x="1063.5294" y="523.3333" width="176.4706" height="96.6667" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="1151.7648" y="584.0952" text-anchor="middle" font-size="22.8959" fill="var(--bg)">Run on host</text>
</svg>
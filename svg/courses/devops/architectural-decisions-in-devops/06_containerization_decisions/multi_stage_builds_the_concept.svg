<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="60" text-anchor="middle" font-size="29.2571" font-weight="bold">Multi-Stage Build Flow</text>
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arrow_ms" markerWidth="18.2857" markerHeight="24" refX="16.4571" refY="7.2" orient="auto">
      <path d="M 0 0 L 0 14.4 L 16.4571 7.2 z" fill="#333" />
    </marker>
  </defs>
  <rect x="54.8571" y="120" width="365.7143" height="480" fill="#fff3e0" stroke="#e65100" stroke-width="3.6571" rx="9.1429" />
  <text x="237.7143" y="180" text-anchor="middle" font-size="23.7714" font-weight="bold" fill="#e65100">Stage 1: Build</text>
  <rect x="91.4286" y="216" width="292.5714" height="60" fill="#ffe0b2" stroke="#e65100" stroke-width="1.8286" rx="5.4857" />
  <text x="237.7143" y="256.8" text-anchor="middle" font-size="20.1143">Full OS + compilers</text>
  <rect x="91.4286" y="300" width="292.5714" height="60" fill="#ffe0b2" stroke="#e65100" stroke-width="1.8286" rx="5.4857" />
  <text x="237.7143" y="340.8" text-anchor="middle" font-size="20.1143">Source code</text>
  <rect x="91.4286" y="384" width="292.5714" height="60" fill="#ffe0b2" stroke="#e65100" stroke-width="1.8286" rx="5.4857" />
  <text x="237.7143" y="424.8" text-anchor="middle" font-size="20.1143">Build dependencies</text>
  <rect x="91.4286" y="468" width="292.5714" height="60" fill="#ffcc80" stroke="#e65100" stroke-width="1.8286" rx="5.4857" />
  <text x="237.7143" y="508.8" text-anchor="middle" font-size="20.1143" font-weight="bold">Compiled artifact</text>
  <line x1="420.5714" y1="496.8" x2="530.2857" y2="360" stroke="#333" stroke-width="3.6571" marker-end="url(#arrow_ms)" />
  <text x="493.7143" y="396" font-size="20.1143" fill="#333">COPY</text>
  <rect x="548.5714" y="192" width="329.1429" height="360" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3.6571" rx="9.1429" />
  <text x="713.1429" y="252" text-anchor="middle" font-size="23.7714" font-weight="bold" fill="#2e7d32">Stage 2: Runtime</text>
  <rect x="585.1429" y="288" width="256" height="60" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.8286" rx="5.4857" />
  <text x="713.1429" y="328.8" text-anchor="middle" font-size="20.1143">Minimal base image</text>
  <rect x="585.1429" y="372" width="256" height="60" fill="#a5d6a7" stroke="#2e7d32" stroke-width="1.8286" rx="5.4857" />
  <text x="713.1429" y="412.8" text-anchor="middle" font-size="20.1143" font-weight="bold">Compiled artifact</text>
  <line x1="877.7143" y1="372" x2="987.4286" y2="372" stroke="#333" stroke-width="3.6571" marker-end="url(#arrow_ms)" />
  <rect x="1005.7143" y="264" width="219.4286" height="216" fill="#e3f2fd" stroke="#1565c0" stroke-width="3.6571" rx="9.1429" />
  <text x="1115.4286" y="336" text-anchor="middle" font-size="23.7714" font-weight="bold" fill="#1565c0">Final Image</text>
  <text x="1115.4286" y="396" text-anchor="middle" font-size="20.1143">Small</text>
  <text x="1115.4286" y="432" text-anchor="middle" font-size="20.1143">Secure</text>
</svg>
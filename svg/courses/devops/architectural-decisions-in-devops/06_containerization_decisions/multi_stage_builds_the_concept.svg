<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="375" height="580" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.36396075637" filter="url(#shadow)"/>
  <text x="227.5" y="112.500056249995" text-anchor="middle" font-size="26.460182098849" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Stage 1: Build</text>
  <rect x="77.5001" y="156.000089999992" width="299.9999" height="72.499943750005" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.36396075637" filter="url(#shadow)"/>
  <text x="227.5" y="205.300060749995" text-anchor="middle" font-size="22.389474601037" font-family="Arial, sans-serif" fill="var(--warn-text)">Full OS + compilers</text>
  <rect x="77.5001" y="257.500056249995" width="299.9999" height="72.499943750005" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.36396075637" filter="url(#shadow)"/>
  <text x="227.5" y="306.800026999998" text-anchor="middle" font-size="22.389474601037" font-family="Arial, sans-serif" fill="var(--warn-text)">Source code</text>
  <rect x="77.5001" y="359.000022499998" width="299.9999" height="72.499943750005" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.36396075637" filter="url(#shadow)"/>
  <text x="227.5" y="408.299993250001" text-anchor="middle" font-size="22.389474601037" font-family="Arial, sans-serif" fill="var(--warn-text)">Build dependencies</text>
  <rect x="77.5001" y="460.499988750001" width="299.9999" height="72.499943750005" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.36396075637" filter="url(#shadow)"/>
  <text x="227.5" y="509.799959500003" text-anchor="middle" font-size="22.389474601037" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Compiled artifact</text>
  <line x1="415" y1="495.300060749995" x2="527.5" y2="330" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="490" y="373.500033749997" font-size="22.389474601037" fill="var(--text)" font-family="Arial, sans-serif">COPY</text>
  <rect x="546.25" y="127.000067499994" width="337.5" height="435" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.36396075637" filter="url(#shadow)"/>
  <text x="715" y="199.500011249999" text-anchor="middle" font-size="26.460182098849" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Stage 2: Runtime</text>
  <rect x="583.75" y="243.000044999996" width="262.5" height="72.499943750005" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.36396075637" filter="url(#shadow)"/>
  <text x="715" y="292.300015749999" text-anchor="middle" font-size="22.389474601037" font-family="Arial, sans-serif" fill="var(--ok-text)">Minimal base image</text>
  <rect x="583.75" y="344.500011249999" width="262.5" height="72.499943750005" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.36396075637" filter="url(#shadow)"/>
  <text x="715" y="393.799982000002" text-anchor="middle" font-size="22.389474601037" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Compiled artifact</text>
  <line x1="883.75" y1="344.500011249999" x2="996.25" y2="344.500011249999" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1015" y="214.000022499998" width="225" height="260.999977500002" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.36396075637" filter="url(#shadow)"/>
  <text x="1127.5" y="300.999977500002" text-anchor="middle" font-size="26.460182098849" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Final Image</text>
  <text x="1127.5" y="373.500033749997" text-anchor="middle" font-size="22.389474601037" font-family="Arial, sans-serif" fill="var(--primary-text)">Small</text>
  <text x="1127.5" y="417.000067499994" text-anchor="middle" font-size="22.389474601037" font-family="Arial, sans-serif" fill="var(--primary-text)">Secure</text>
</svg>

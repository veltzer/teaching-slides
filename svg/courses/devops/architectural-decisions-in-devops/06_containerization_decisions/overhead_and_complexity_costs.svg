<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="632.0988" y="59.2593" text-anchor="middle" font-size="28.8959" font-weight="bold">Container Overhead Spectrum</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad_overhead" x1="0%" y1="0%" x2="182.8571%" y2="0%">
      <stop offset="0%" style="stop-color:#4caf50" />
      <stop offset="50%" style="stop-color:#ffcc80" />
      <stop offset="100%" style="stop-color:#e74c3c" />
    </linearGradient>
  </defs>
  <rect x="90.2999" y="118.5185" width="1083.5979" height="71.1111" fill="url(#grad_overhead)" stroke="var(--text)" stroke-width="1.806" rx="6" />
  <text x="90.2999" y="237.037" font-size="21.672" fill="var(--text)">Low overhead</text>
  <text x="1047.4779" y="237.037" font-size="21.672" fill="var(--text)">High overhead</text>
  <line x1="180.5996" y1="284.4444" x2="180.5996" y2="343.7037" stroke="var(--text)" stroke-width="2" />
  <text x="180.5996" y="379.2593" text-anchor="middle" font-size="19.866">Stateless API</text>
  <line x1="451.4992" y1="284.4444" x2="451.4992" y2="343.7037" stroke="var(--text)" stroke-width="2" />
  <text x="451.4992" y="379.2593" text-anchor="middle" font-size="19.866">Web App</text>
  <line x1="722.3986" y1="284.4444" x2="722.3986" y2="343.7037" stroke="var(--text)" stroke-width="2" />
  <text x="722.3986" y="379.2593" text-anchor="middle" font-size="19.866">Database</text>
  <line x1="939.1181" y1="284.4444" x2="939.1181" y2="343.7037" stroke="var(--text)" stroke-width="2" />
  <text x="939.1181" y="379.2593" text-anchor="middle" font-size="19.866">GPU workload</text>
  <line x1="1119.7178" y1="284.4444" x2="1119.7178" y2="343.7037" stroke="var(--text)" stroke-width="2" />
  <text x="1119.7178" y="379.2593" text-anchor="middle" font-size="19.866">Real-time sys</text>
  <rect x="90.2999" y="450.3704" width="505.679" height="189.6296" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="343.1394" y="509.6296" text-anchor="middle" font-size="21.672" font-weight="bold">Worth containerizing</text>
  <text x="343.1394" y="557.037" text-anchor="middle" font-size="19.866">Benefits outweigh costs</text>
  <text x="343.1394" y="604.4444" text-anchor="middle" font-size="19.866">Scaling, portability, isolation</text>
  <rect x="668.2187" y="450.3704" width="505.679" height="189.6296" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="921.0582" y="509.6296" text-anchor="middle" font-size="21.672" font-weight="bold">Evaluate carefully</text>
  <text x="921.0582" y="557.037" text-anchor="middle" font-size="19.866">Complexity may not justify</text>
  <text x="921.0582" y="604.4444" text-anchor="middle" font-size="19.866">Consider alternatives</text>
</svg>
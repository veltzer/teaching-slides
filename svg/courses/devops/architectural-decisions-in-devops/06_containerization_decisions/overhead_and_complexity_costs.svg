<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="639.9999" y="40" text-anchor="middle" font-size="30.3889" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Container Overhead Spectrum</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad_overhead" x1="0%" y1="0%" x2="182.8571%" y2="0%">
      <stop offset="0%" style="stop-color:#4caf50" />
      <stop offset="50%" style="stop-color:#ffcc80" />
      <stop offset="100%" style="stop-color:#e74c3c" />
    </linearGradient>
  </defs>
  <rect x="40" y="99.1836" width="1200" height="71.0204" fill="url(#grad_overhead)" stroke="var(--text)" stroke-width="1.806" rx="6" />
  <text x="40" y="217.551" font-size="22.7918" fill="var(--text)" font-family="Arial, sans-serif">Low overhead</text>
  <text x="1099.9998" y="217.551" font-size="22.7918" fill="var(--text)" font-family="Arial, sans-serif">High overhead</text>
  <line x1="139.9999" y1="264.8979" x2="139.9999" y2="324.0816" stroke="var(--text)" stroke-width="2" />
  <text x="139.9999" y="359.5919" text-anchor="middle" font-size="20.8925" font-family="Arial, sans-serif" fill="var(--text)">Stateless API</text>
  <line x1="440" y1="264.8979" x2="440" y2="324.0816" stroke="var(--text)" stroke-width="2" />
  <text x="440" y="359.5919" text-anchor="middle" font-size="20.8925" font-family="Arial, sans-serif" fill="var(--text)">Web App</text>
  <line x1="739.9999" y1="264.8979" x2="739.9999" y2="324.0816" stroke="var(--text)" stroke-width="2" />
  <text x="739.9999" y="359.5919" text-anchor="middle" font-size="20.8925" font-family="Arial, sans-serif" fill="var(--text)">Database</text>
  <line x1="979.9998" y1="264.8979" x2="979.9998" y2="324.0816" stroke="var(--text)" stroke-width="2" />
  <text x="979.9998" y="359.5919" text-anchor="middle" font-size="20.8925" font-family="Arial, sans-serif" fill="var(--text)">GPU workload</text>
  <line x1="1179.9999" y1="264.8979" x2="1179.9999" y2="324.0816" stroke="var(--text)" stroke-width="2" />
  <text x="1179.9999" y="359.5919" text-anchor="middle" font-size="20.8925" font-family="Arial, sans-serif" fill="var(--text)">Real-time sys</text>
  <rect x="40" y="430.6123" width="560" height="189.3877" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="320" y="489.7959" text-anchor="middle" font-size="22.7918" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Worth containerizing</text>
  <text x="320" y="537.1428" text-anchor="middle" font-size="20.8925" font-family="Arial, sans-serif" fill="var(--ok-text)">Benefits outweigh costs</text>
  <text x="320" y="584.4897" text-anchor="middle" font-size="20.8925" font-family="Arial, sans-serif" fill="var(--ok-text)">Scaling, portability, isolation</text>
  <rect x="679.9999" y="430.6123" width="560" height="189.3877" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="959.9999" y="489.7959" text-anchor="middle" font-size="22.7918" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Evaluate carefully</text>
  <text x="959.9999" y="537.1428" text-anchor="middle" font-size="20.8925" font-family="Arial, sans-serif" fill="var(--danger-text)">Complexity may not justify</text>
  <text x="959.9999" y="584.4897" text-anchor="middle" font-size="20.8925" font-family="Arial, sans-serif" fill="var(--danger-text)">Consider alternatives</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="639.9999" y="40" text-anchor="middle" font-size="30.3889" font-weight="bold">Container Overhead Spectrum</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad_overhead" x1="0%" y1="0%" x2="182.8571%" y2="0%">
      <stop offset="0%" style="stop-color:#4caf50" />
      <stop offset="50%" style="stop-color:#ffcc80" />
      <stop offset="100%" style="stop-color:#e74c3c" />
    </linearGradient>
  </defs>
  <rect x="40" y="99.1836" width="1200" height="71.0204" fill="url(#grad_overhead)" stroke="var(--text)" stroke-width="1.806" rx="6" />
  <text x="40" y="217.551" font-size="22.7918" fill="var(--text)">Low overhead</text>
  <text x="1099.9998" y="217.551" font-size="22.7918" fill="var(--text)">High overhead</text>
  <line x1="139.9999" y1="264.8979" x2="139.9999" y2="324.0816" stroke="var(--text)" stroke-width="2" />
  <text x="139.9999" y="359.5919" text-anchor="middle" font-size="20.8925">Stateless API</text>
  <line x1="440" y1="264.8979" x2="440" y2="324.0816" stroke="var(--text)" stroke-width="2" />
  <text x="440" y="359.5919" text-anchor="middle" font-size="20.8925">Web App</text>
  <line x1="739.9999" y1="264.8979" x2="739.9999" y2="324.0816" stroke="var(--text)" stroke-width="2" />
  <text x="739.9999" y="359.5919" text-anchor="middle" font-size="20.8925">Database</text>
  <line x1="979.9998" y1="264.8979" x2="979.9998" y2="324.0816" stroke="var(--text)" stroke-width="2" />
  <text x="979.9998" y="359.5919" text-anchor="middle" font-size="20.8925">GPU workload</text>
  <line x1="1179.9999" y1="264.8979" x2="1179.9999" y2="324.0816" stroke="var(--text)" stroke-width="2" />
  <text x="1179.9999" y="359.5919" text-anchor="middle" font-size="20.8925">Real-time sys</text>
  <rect x="40" y="430.6123" width="560" height="189.3877" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="320" y="489.7959" text-anchor="middle" font-size="22.7918" font-weight="bold">Worth containerizing</text>
  <text x="320" y="537.1428" text-anchor="middle" font-size="20.8925">Benefits outweigh costs</text>
  <text x="320" y="584.4897" text-anchor="middle" font-size="20.8925">Scaling, portability, isolation</text>
  <rect x="679.9999" y="430.6123" width="560" height="189.3877" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="959.9999" y="489.7959" text-anchor="middle" font-size="22.7918" font-weight="bold">Evaluate carefully</text>
  <text x="959.9999" y="537.1428" text-anchor="middle" font-size="20.8925">Complexity may not justify</text>
  <text x="959.9999" y="584.4897" text-anchor="middle" font-size="20.8925">Consider alternatives</text>
</svg>
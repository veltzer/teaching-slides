<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="34.7573" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Container Image Layers</text>
  <rect x="118.2608" y="538.5965" width="1043.4784" height="81.4035" fill="var(--text-faint)" stroke="var(--text)" stroke-width="3.6571" rx="6" />
  <text x="640" y="589.4736" text-anchor="middle" font-size="26.0681" fill="var(--bg)" font-family="Arial, sans-serif">Base OS Layer (read-only)</text>
  <rect x="118.2608" y="436.8421" width="1043.4784" height="81.4035" fill="var(--text-faint)" stroke="var(--text)" stroke-width="3.6571" rx="6" />
  <text x="640" y="487.7193" text-anchor="middle" font-size="26.0681" fill="var(--bg)" font-family="Arial, sans-serif">Runtime Dependencies (read-only)</text>
  <rect x="118.2608" y="335.0877" width="1043.4784" height="81.4035" fill="var(--border)" stroke="var(--text)" stroke-width="3.6571" rx="6" />
  <text x="640" y="385.9649" text-anchor="middle" font-size="26.0681" font-family="Arial, sans-serif" fill="var(--text)">Application Libraries (read-only)</text>
  <rect x="118.2608" y="233.3333" width="1043.4784" height="81.4035" fill="var(--border)" stroke="var(--text)" stroke-width="3.6571" rx="6" />
  <text x="640" y="284.2105" text-anchor="middle" font-size="26.0681" font-family="Arial, sans-serif" fill="var(--text)">Application Code (read-only)</text>
  <rect x="118.2608" y="111.2281" width="1043.4784" height="81.4035" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" stroke-dasharray="9.1429 5.4857" filter="url(#shadow)"/>
  <text x="640" y="162.1052" text-anchor="middle" font-size="26.0681" fill="var(--ok-accent)" font-family="Arial, sans-serif">Container Writable Layer</text>
  <text x="40" y="162.1052" text-anchor="end" font-size="23.8957" fill="var(--ok-accent)" font-family="Arial, sans-serif">R/W</text>
  <text x="40" y="284.2105" text-anchor="end" font-size="23.8957" fill="var(--text-muted)" font-family="Arial, sans-serif">R/O</text>
  <text x="40" y="385.9649" text-anchor="end" font-size="23.8957" fill="var(--text-muted)" font-family="Arial, sans-serif">R/O</text>
  <text x="40" y="487.7193" text-anchor="end" font-size="23.8957" fill="var(--text-muted)" font-family="Arial, sans-serif">R/O</text>
  <text x="40" y="589.4736" text-anchor="end" font-size="23.8957" fill="var(--text-muted)" font-family="Arial, sans-serif">R/O</text>
  <text x="1240" y="579.2982" font-size="23.8957" fill="var(--text-muted)" font-family="Arial, sans-serif">Shared</text>
  <text x="1240" y="477.5439" font-size="23.8957" fill="var(--text-muted)" font-family="Arial, sans-serif">Shared</text>
  <text x="1240" y="284.2105" font-size="23.8957" fill="var(--text-muted)" font-family="Arial, sans-serif">Per-image</text>
  <text x="1240" y="162.1052" font-size="23.8957" fill="var(--ok-accent)" font-family="Arial, sans-serif">Per-container</text>
</svg>
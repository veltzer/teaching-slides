<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="51.4286" text-anchor="middle" font-size="29.2571" font-weight="bold">Container Image Layers</text>
  <rect x="274.2857" y="555.4286" width="731.4286" height="82.2857" fill="var(--text-faint)" stroke="var(--text)" stroke-width="3.6571" rx="6" />
  <text x="640" y="606.8571" text-anchor="middle" font-size="21.9429" fill="var(--bg)">Base OS Layer (read-only)</text>
  <rect x="274.2857" y="452.5714" width="731.4286" height="82.2857" fill="var(--text-faint)" stroke="var(--text)" stroke-width="3.6571" rx="6" />
  <text x="640" y="504" text-anchor="middle" font-size="21.9429" fill="var(--bg)">Runtime Dependencies (read-only)</text>
  <rect x="274.2857" y="349.7143" width="731.4286" height="82.2857" fill="var(--border)" stroke="var(--text)" stroke-width="3.6571" rx="6" />
  <text x="640" y="401.1429" text-anchor="middle" font-size="21.9429">Application Libraries (read-only)</text>
  <rect x="274.2857" y="246.8571" width="731.4286" height="82.2857" fill="var(--border)" stroke="var(--text)" stroke-width="3.6571" rx="6" />
  <text x="640" y="298.2857" text-anchor="middle" font-size="21.9429">Application Code (read-only)</text>
  <rect x="274.2857" y="123.4286" width="731.4286" height="82.2857" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" stroke-dasharray="9.1429 5.4857" />
  <text x="640" y="174.8571" text-anchor="middle" font-size="21.9429" fill="var(--ok-accent)">Container Writable Layer</text>
  <text x="219.4286" y="174.8571" text-anchor="end" font-size="20.1143" fill="var(--ok-accent)">R/W</text>
  <text x="219.4286" y="298.2857" text-anchor="end" font-size="20.1143" fill="var(--text-muted)">R/O</text>
  <text x="219.4286" y="401.1429" text-anchor="end" font-size="20.1143" fill="var(--text-muted)">R/O</text>
  <text x="219.4286" y="504" text-anchor="end" font-size="20.1143" fill="var(--text-muted)">R/O</text>
  <text x="219.4286" y="606.8571" text-anchor="end" font-size="20.1143" fill="var(--text-muted)">R/O</text>
  <text x="1060.5714" y="596.5714" font-size="20.1143" fill="var(--text-muted)">Shared</text>
  <text x="1060.5714" y="493.7143" font-size="20.1143" fill="var(--text-muted)">Shared</text>
  <text x="1060.5714" y="298.2857" font-size="20.1143" fill="var(--text-muted)">Per-image</text>
  <text x="1060.5714" y="174.8571" font-size="20.1143" fill="var(--ok-accent)">Per-container</text>
</svg>
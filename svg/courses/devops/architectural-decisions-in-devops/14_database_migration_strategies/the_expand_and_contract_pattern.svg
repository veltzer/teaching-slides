<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowec" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 15.4286 L 16.4571 7.7143 z" fill="#333" />
    </marker>
  </defs>
  <rect x="35.0085" y="49.2308" width="350.0855" height="196.9231" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="210.0513" y="123.0769" text-anchor="middle" font-size="22.7555" font-weight="bold">Phase 1: Expand</text>
  <text x="210.0513" y="184.6154" text-anchor="middle" font-size="19.2547">Add new structure</text>
  <rect x="437.6069" y="49.2308" width="350.0855" height="196.9231" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="612.6496" y="123.0769" text-anchor="middle" font-size="22.7555" font-weight="bold">Phase 2: Migrate</text>
  <text x="612.6496" y="184.6154" text-anchor="middle" font-size="19.2547">Move data + update code</text>
  <rect x="840.2052" y="49.2308" width="350.0855" height="196.9231" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1015.2479" y="123.0769" text-anchor="middle" font-size="22.7555" font-weight="bold">Phase 3: Contract</text>
  <text x="1015.2479" y="184.6154" text-anchor="middle" font-size="19.2547">Remove old structure</text>
  <line x1="385.094" y1="147.6923" x2="437.6069" y2="147.6923" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowec)" />
  <line x1="787.6923" y1="147.6923" x2="840.2052" y2="147.6923" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowec)" />
  <rect x="35.0085" y="344.6154" width="1155.2821" height="295.3846" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="612.6496" y="406.1538" text-anchor="middle" font-size="21.0052" font-weight="bold">Example: Renaming a Column</text>
  <text x="612.6496" y="467.6923" text-anchor="middle" font-size="19.2547">1. Expand: Add new column, trigger to sync data</text>
  <text x="612.6496" y="516.9231" text-anchor="middle" font-size="19.2547">2. Migrate: Update app to use new column, backfill data</text>
  <text x="612.6496" y="566.1539" text-anchor="middle" font-size="19.2547">3. Contract: Drop old column and trigger</text>
</svg>
  <rect x="36.5714" y="51.4286" width="365.7143" height="205.7143" fill="#e3f2fd" stroke="#1565c0" stroke-width="3.6571" rx="14.6286" />
  <text x="219.4286" y="128.5714" text-anchor="middle" font-size="23.7714" font-weight="bold">Phase 1: Expand</text>
  <text x="219.4286" y="192.8571" text-anchor="middle" font-size="20.1143">Add new structure</text>
  <rect x="457.1429" y="51.4286" width="365.7143" height="205.7143" fill="#fff3e0" stroke="#e65100" stroke-width="3.6571" rx="14.6286" />

  <text x="640" y="424.2857" text-anchor="middle" font-size="21.9429" font-weight="bold">Example: Renaming a Column</text>
  <text x="640" y="488.5714" text-anchor="middle" font-size="20.1143">1. Expand: Add new column, trigger to sync data</text>
  <text x="640" y="540" text-anchor="middle" font-size="20.1143">2. Migrate: Update app to use new column, backfill data</text>
  <text x="640" y="591.4286" text-anchor="middle" font-size="20.1143">3. Contract: Drop old column and trigger</text>

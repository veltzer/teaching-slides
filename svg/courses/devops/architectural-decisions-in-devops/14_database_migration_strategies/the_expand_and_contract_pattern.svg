<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="363.6363" height="193.3334" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="221.8182" y="112.5" text-anchor="middle" font-size="22.9794" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Phase 1: Expand</text>
  <text x="221.8182" y="172.9167" text-anchor="middle" font-size="19.4441" font-family="Arial, sans-serif" fill="var(--primary-text)">Add new structure</text>
  <rect x="458.1819" y="40" width="363.6363" height="193.3334" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="112.5" text-anchor="middle" font-size="22.9794" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Phase 2: Migrate</text>
  <text x="640" y="172.9167" text-anchor="middle" font-size="19.4441" font-family="Arial, sans-serif" fill="var(--warn-text)">Move data + update code</text>
  <rect x="876.3637" y="40" width="363.6363" height="193.3334" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1058.1818" y="112.5" text-anchor="middle" font-size="22.9794" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Phase 3: Contract</text>
  <text x="1058.1818" y="172.9167" text-anchor="middle" font-size="19.4441" font-family="Arial, sans-serif" fill="var(--ok-text)">Remove old structure</text>
  <line x1="403.6363" y1="136.6666" x2="458.1819" y2="136.6666" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="821.8181" y1="136.6666" x2="876.3637" y2="136.6666" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="330" width="1199.9999" height="290" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="640" y="390.4166" text-anchor="middle" font-size="21.2118" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Example: Renaming a Column</text>
  <text x="640" y="450.8333" text-anchor="middle" font-size="19.4441" font-family="Arial, sans-serif" fill="var(--text)">1. Expand: Add new column, trigger to sync data</text>
  <text x="640" y="499.1667" text-anchor="middle" font-size="19.4441" font-family="Arial, sans-serif" fill="var(--text)">2. Migrate: Update app to use new column, backfill data</text>
  <text x="640" y="547.5" text-anchor="middle" font-size="19.4441" font-family="Arial, sans-serif" fill="var(--text)">3. Contract: Drop old column and trigger</text>
</svg>

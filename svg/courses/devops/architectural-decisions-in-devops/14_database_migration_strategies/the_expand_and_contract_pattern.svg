<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arrowec" markerWidth="18.2857" markerHeight="25.7143" refX="16.4571" refY="7.7143" orient="auto">
      <ns0:path d="M 0 0 L 0 15.4286 L 16.4571 7.7143 z" fill="#333" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect x="35.0085" y="49.2308" width="350.0855" height="196.9231" fill="#e3f2fd" stroke="#1565c0" stroke-width="3.5008" rx="14.0034" />
  <ns0:text x="210.0513" y="123.0769" text-anchor="middle" font-size="22.7555" font-weight="bold">Phase 1: Expand</ns0:text>
  <ns0:text x="210.0513" y="184.6154" text-anchor="middle" font-size="19.2547">Add new structure</ns0:text>
  <ns0:rect x="437.6069" y="49.2308" width="350.0855" height="196.9231" fill="#fff3e0" stroke="#e65100" stroke-width="3.5008" rx="14.0034" />
  <ns0:text x="612.6496" y="123.0769" text-anchor="middle" font-size="22.7555" font-weight="bold">Phase 2: Migrate</ns0:text>
  <ns0:text x="612.6496" y="184.6154" text-anchor="middle" font-size="19.2547">Move data + update code</ns0:text>
  <ns0:rect x="840.2052" y="49.2308" width="350.0855" height="196.9231" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3.5008" rx="14.0034" />
  <ns0:text x="1015.2479" y="123.0769" text-anchor="middle" font-size="22.7555" font-weight="bold">Phase 3: Contract</ns0:text>
  <ns0:text x="1015.2479" y="184.6154" text-anchor="middle" font-size="19.2547">Remove old structure</ns0:text>
  <ns0:line x1="385.094" y1="147.6923" x2="437.6069" y2="147.6923" stroke="#333" stroke-width="3.5008" marker-end="url(#arrowec)" />
  <ns0:line x1="787.6923" y1="147.6923" x2="840.2052" y2="147.6923" stroke="#333" stroke-width="3.5008" marker-end="url(#arrowec)" />
  <ns0:rect x="35.0085" y="344.6154" width="1155.2821" height="295.3846" fill="#f5f5f5" stroke="#999" stroke-width="1.7505" rx="8.7522" />
  <ns0:text x="612.6496" y="406.1538" text-anchor="middle" font-size="21.0052" font-weight="bold">Example: Renaming a Column</ns0:text>
  <ns0:text x="612.6496" y="467.6923" text-anchor="middle" font-size="19.2547">1. Expand: Add new column, trigger to sync data</ns0:text>
  <ns0:text x="612.6496" y="516.9231" text-anchor="middle" font-size="19.2547">2. Migrate: Update app to use new column, backfill data</ns0:text>
  <ns0:text x="612.6496" y="566.1539" text-anchor="middle" font-size="19.2547">3. Contract: Drop old column and trigger</ns0:text>
</ns0:svg>
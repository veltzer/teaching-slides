<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arrowcdc" markerWidth="18.2857" markerHeight="28.8" refX="16.4571" refY="8.64" orient="auto">
      <path d="M 0 0 L 0 17.28 L 16.4571 8.64 z" fill="#333" />
    </marker>
  </defs>
  <rect x="54.8571" y="259.2" width="256" height="144" fill="#e3f2fd" stroke="#1565c0" stroke-width="3.6571" rx="14.6286" />
  <text x="182.8571" y="345.6" text-anchor="middle" font-size="23.7714">Application</text>
  <rect x="384" y="259.2" width="256" height="144" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3.6571" rx="14.6286" />
  <text x="512" y="345.6" text-anchor="middle" font-size="23.7714">Source DB</text>
  <rect x="713.1429" y="259.2" width="256" height="144" fill="#fff3e0" stroke="#e65100" stroke-width="3.6571" rx="14.6286" />
  <text x="841.1429" y="345.6" text-anchor="middle" font-size="23.7714">CDC Stream</text>
  <rect x="1042.2857" y="259.2" width="219.4286" height="144" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="3.6571" rx="14.6286" />
  <text x="1152" y="345.6" text-anchor="middle" font-size="23.7714">Target DB</text>
  <line x1="310.8571" y1="331.2" x2="384" y2="331.2" stroke="#333" stroke-width="3.6571" marker-end="url(#arrowcdc)" />
  <line x1="640" y1="331.2" x2="713.1429" y2="331.2" stroke="#333" stroke-width="3.6571" marker-end="url(#arrowcdc)" />
  <line x1="969.1429" y1="331.2" x2="1042.2857" y2="331.2" stroke="#333" stroke-width="3.6571" marker-end="url(#arrowcdc)" />
  <text x="640" y="86.4" text-anchor="middle" font-size="21.9429" font-weight="bold">CDC avoids dual-write complexity</text>
  <text x="640" y="158.4" text-anchor="middle" font-size="20.1143">App writes once; CDC replicates changes to target</text>
  <text x="640" y="547.2" text-anchor="middle" font-size="20.1143">Tools: Debezium, AWS DMS, Oracle GoldenGate</text>
</svg>
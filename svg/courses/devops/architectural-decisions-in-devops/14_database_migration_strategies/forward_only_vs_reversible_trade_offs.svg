<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:rect x="54.1799" y="71.1111" width="541.7989" height="568.8889" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3.612" rx="14.448" />
  <ns0:text x="325.0794" y="177.7778" text-anchor="middle" font-size="25.284" font-weight="bold" fill="#2e7d32">Forward-Only</ns0:text>
  <ns0:text x="325.0794" y="284.4444" text-anchor="middle" font-size="19.866">+ Simpler to maintain</ns0:text>
  <ns0:text x="325.0794" y="355.5556" text-anchor="middle" font-size="19.866">+ No untested rollback code</ns0:text>
  <ns0:text x="325.0794" y="426.6667" text-anchor="middle" font-size="19.866">+ Faster development</ns0:text>
  <ns0:text x="325.0794" y="515.5556" text-anchor="middle" font-size="19.866">- Requires corrective migrations</ns0:text>
  <ns0:rect x="668.2187" y="71.1111" width="541.7989" height="568.8889" fill="#fff3e0" stroke="#e65100" stroke-width="3.612" rx="14.448" />
  <ns0:text x="939.1181" y="177.7778" text-anchor="middle" font-size="25.284" font-weight="bold" fill="#e65100">Reversible</ns0:text>
  <ns0:text x="939.1181" y="284.4444" text-anchor="middle" font-size="19.866">+ Quick rollback capability</ns0:text>
  <ns0:text x="939.1181" y="355.5556" text-anchor="middle" font-size="19.866">+ Useful in development</ns0:text>
  <ns0:text x="939.1181" y="426.6667" text-anchor="middle" font-size="19.866">- Double the code to write</ns0:text>
  <ns0:text x="939.1181" y="515.5556" text-anchor="middle" font-size="19.866">- Down scripts often untested</ns0:text>
</ns0:svg>
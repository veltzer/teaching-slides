<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowpipe" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 15.4286 L 16.4571 7.7143 z" fill="#333" />
    </marker>
  </defs>
  <rect x="53.5424" y="75.2942" width="214.17" height="125.4902" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="160.6274" y="150.5882" text-anchor="middle" font-size="19.6323">Code Commit</text>
  <rect x="321.2549" y="75.2942" width="214.17" height="125.4902" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="428.3398" y="138.0392" text-anchor="middle" font-size="19.6323">Lint Migration</text>
  <rect x="588.9673" y="75.2942" width="214.17" height="125.4902" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="696.0523" y="138.0392" text-anchor="middle" font-size="19.6323">Test on Clone</text>
  <rect x="856.6797" y="75.2942" width="214.17" height="125.4902" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="963.7647" y="138.0392" text-anchor="middle" font-size="19.6323">Apply Staging</text>
  <rect x="455.1111" y="326.2745" width="214.17" height="125.4902" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="562.1961" y="389.0196" text-anchor="middle" font-size="19.6323">Approval Gate</text>
  <rect x="722.8235" y="326.2745" width="214.17" height="125.4902" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="829.9085" y="389.0196" text-anchor="middle" font-size="19.6323">Apply Production</text>
  <rect x="990.5359" y="326.2745" width="214.17" height="125.4902" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="1097.6209" y="389.0196" text-anchor="middle" font-size="19.6323">Verify + Monitor</text>
  <line x1="267.7124" y1="138.0392" x2="321.2549" y2="138.0392" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowpipe)" />
  <line x1="535.4248" y1="138.0392" x2="588.9673" y2="138.0392" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowpipe)" />
  <line x1="803.1372" y1="138.0392" x2="856.6797" y2="138.0392" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowpipe)" />
  <line x1="963.7647" y1="200.7843" x2="713.8998" y2="326.2745" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowpipe)" />
  <line x1="669.281" y1="389.0196" x2="722.8235" y2="389.0196" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowpipe)" />
  <line x1="936.9934" y1="389.0196" x2="990.5359" y2="389.0196" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowpipe)" />
  <text x="624.6623" y="577.2549" text-anchor="middle" font-size="21.417" font-weight="bold">Every migration passes through this pipeline</text>
  <text x="624.6623" y="640" text-anchor="middle" font-size="19.6323">Automated linting, testing, and approval before production</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="223.2559" height="128.8889" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="151.6279" y="117.3332" text-anchor="middle" font-size="20.314" font-family="Arial, sans-serif" fill="var(--primary-text)">Code Commit</text>
  <rect x="319.0698" y="40" width="223.2559" height="128.8889" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="430.6977" y="104.4444" text-anchor="middle" font-size="20.314" font-family="Arial, sans-serif" fill="var(--ok-text)">Lint Migration</text>
  <rect x="598.1396" y="40" width="223.2559" height="128.8889" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="709.7675" y="104.4444" text-anchor="middle" font-size="20.314" font-family="Arial, sans-serif" fill="var(--warn-text)">Test on Clone</text>
  <rect x="877.2093" y="40" width="223.2559" height="128.8889" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="988.8372" y="104.4444" text-anchor="middle" font-size="20.314" font-family="Arial, sans-serif" fill="var(--info-text)">Apply Staging</text>
  <rect x="458.6047" y="297.7777" width="223.2559" height="128.8889" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="570.2326" y="362.2222" text-anchor="middle" font-size="20.314" font-family="Arial, sans-serif" fill="var(--danger-text)">Approval Gate</text>
  <rect x="737.6744" y="297.7777" width="223.2559" height="128.8889" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="849.3023" y="362.2222" text-anchor="middle" font-size="20.314" font-family="Arial, sans-serif" fill="var(--info-text)">Apply Production</text>
  <rect x="1016.7441" y="297.7777" width="223.2559" height="128.8889" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1128.3721" y="362.2222" text-anchor="middle" font-size="20.314" font-family="Arial, sans-serif" fill="var(--primary-text)">Verify + Monitor</text>
  <line x1="263.2559" y1="104.4444" x2="319.0698" y2="104.4444" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="542.3256" y1="104.4444" x2="598.1396" y2="104.4444" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="821.3953" y1="104.4444" x2="877.2093" y2="104.4444" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="988.8372" y1="168.8888" x2="728.3721" y2="297.7777" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="681.8604" y1="362.2222" x2="737.6744" y2="362.2222" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="960.9302" y1="362.2222" x2="1016.7441" y2="362.2222" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="635.3489" y="555.5555" text-anchor="middle" font-size="22.1607" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Every migration passes through this pipeline</text>
  <text x="635.3489" y="620" text-anchor="middle" font-size="20.314" font-family="Arial, sans-serif" fill="var(--text)">Automated linting, testing, and approval before production</text>
</svg>

  <text x="1133.7143" y="249.2308" text-anchor="middle" font-size="18.2857">| email |</text>
  <line x1="310.8571" y1="193.8462" x2="365.7143" y2="193.8462" stroke="#333" stroke-width="3.6571" marker-end="url(#arrowren)" />
  <line x1="640" y1="193.8462" x2="694.8571" y2="193.8462" stroke="#333" stroke-width="3.6571" marker-end="url(#arrowren)" />
  <line x1="969.1429" y1="193.8462" x2="1024" y2="193.8462" stroke="#333" stroke-width="3.6571" marker-end="url(#arrowren)" />
  <text x="640" y="443.0769" text-anchor="middle" font-size="21.9429" font-weight="bold">Each phase is a separate deployment</text>
  <text x="640" y="512.3077" text-anchor="middle" font-size="20.1143">Old app reads email_addr, new app reads email</text>
  <text x="640" y="567.6923" text-anchor="middle" font-size="20.1143">Both work during the transition window</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="272.7272" height="313.5135" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="176.3637" y="118.3784" text-anchor="middle" font-size="23.2812" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Original</text>
  <text x="176.3637" y="196.7568" text-anchor="middle" font-size="19.4009" font-family="Arial, sans-serif" fill="var(--primary-text)">users</text>
  <text x="176.3637" y="259.4595" text-anchor="middle" font-size="19.4009" font-family="Arial, sans-serif" fill="var(--primary-text)">| email_addr |</text>
  <rect x="367.2728" y="40" width="272.7272" height="313.5135" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="503.6363" y="118.3784" text-anchor="middle" font-size="23.2812" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Expanded</text>
  <text x="503.6363" y="196.7568" text-anchor="middle" font-size="19.4009" font-family="Arial, sans-serif" fill="var(--warn-text)">users</text>
  <text x="503.6363" y="259.4595" text-anchor="middle" font-size="19.4009" font-family="Arial, sans-serif" fill="var(--warn-text)">| email_addr | email |</text>
  <rect x="694.5454" y="40" width="272.7272" height="313.5135" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="830.9091" y="118.3784" text-anchor="middle" font-size="23.2812" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Migrated</text>
  <text x="830.9091" y="196.7568" text-anchor="middle" font-size="19.4009" font-family="Arial, sans-serif" fill="var(--ok-text)">users</text>
  <text x="830.9091" y="259.4595" text-anchor="middle" font-size="19.4009" font-family="Arial, sans-serif" fill="var(--ok-text)">| email_addr | email |</text>
  <rect x="1021.8182" y="40" width="218.1818" height="313.5135" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1130.9091" y="118.3784" text-anchor="middle" font-size="23.2812" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Contracted</text>
  <text x="1130.9091" y="196.7568" text-anchor="middle" font-size="19.4009" font-family="Arial, sans-serif" fill="var(--danger-text)">users</text>
  <text x="1130.9091" y="259.4595" text-anchor="middle" font-size="19.4009" font-family="Arial, sans-serif" fill="var(--danger-text)">| email |</text>
  <line x1="312.7272" y1="196.7568" x2="367.2728" y2="196.7568" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="196.7568" x2="694.5454" y2="196.7568" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="967.2728" y1="196.7568" x2="1021.8182" y2="196.7568" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="478.9189" text-anchor="middle" font-size="23.2812" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Each phase is a separate deployment</text>
  <text x="640" y="557.2973" text-anchor="middle" font-size="21.3411" font-family="Arial, sans-serif" fill="var(--text)">Old app reads email_addr, new app reads email</text>
  <text x="640" y="620" text-anchor="middle" font-size="21.3411" font-family="Arial, sans-serif" fill="var(--text)">Both work during the transition window</text>
</svg>

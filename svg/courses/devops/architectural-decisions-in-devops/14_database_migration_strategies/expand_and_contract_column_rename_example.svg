  <text x="502.8571" y="249.2308" text-anchor="middle" font-size="18.2857">| email_addr | email |</text>
  <rect x="694.8571" y="55.3846" width="274.2857" height="276.9231" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3.6571" rx="9.1429" />
  <text x="832" y="124.6154" text-anchor="middle" font-size="21.9429" font-weight="bold">Migrated</text>

  <text x="832" y="249.2308" text-anchor="middle" font-size="18.2857">| email_addr | email |</text>
  <rect x="1024" y="55.3846" width="219.4286" height="276.9231" fill="#fce4ec" stroke="#c62828" stroke-width="3.6571" rx="9.1429" />
  <text x="1133.7143" y="124.6154" text-anchor="middle" font-size="21.9429" font-weight="bold">Contracted</text>

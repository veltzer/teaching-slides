<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowren" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 16.6154 L 16.4571 8.3077 z" fill="#333" />
    </marker>
  </defs>
  <rect x="40" y="40" width="272.7272" height="313.5135" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="176.3637" y="118.3784" text-anchor="middle" font-size="23.2812" font-weight="bold">Original</text>
  <text x="176.3637" y="196.7568" text-anchor="middle" font-size="19.4009">users</text>
  <text x="176.3637" y="259.4595" text-anchor="middle" font-size="19.4009">| email_addr |</text>
  <rect x="367.2728" y="40" width="272.7272" height="313.5135" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="503.6363" y="118.3784" text-anchor="middle" font-size="23.2812" font-weight="bold">Expanded</text>
  <text x="503.6363" y="196.7568" text-anchor="middle" font-size="19.4009">users</text>
  <text x="503.6363" y="259.4595" text-anchor="middle" font-size="19.4009">| email_addr | email |</text>
  <rect x="694.5454" y="40" width="272.7272" height="313.5135" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="830.9091" y="118.3784" text-anchor="middle" font-size="23.2812" font-weight="bold">Migrated</text>
  <text x="830.9091" y="196.7568" text-anchor="middle" font-size="19.4009">users</text>
  <text x="830.9091" y="259.4595" text-anchor="middle" font-size="19.4009">| email_addr | email |</text>
  <rect x="1021.8182" y="40" width="218.1818" height="313.5135" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1130.9091" y="118.3784" text-anchor="middle" font-size="23.2812" font-weight="bold">Contracted</text>
  <text x="1130.9091" y="196.7568" text-anchor="middle" font-size="19.4009">users</text>
  <text x="1130.9091" y="259.4595" text-anchor="middle" font-size="19.4009">| email |</text>
  <line x1="312.7272" y1="196.7568" x2="367.2728" y2="196.7568" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowren)" />
  <line x1="640" y1="196.7568" x2="694.5454" y2="196.7568" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowren)" />
  <line x1="967.2728" y1="196.7568" x2="1021.8182" y2="196.7568" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowren)" />
  <text x="640" y="478.9189" text-anchor="middle" font-size="23.2812" font-weight="bold">Each phase is a separate deployment</text>
  <text x="640" y="557.2973" text-anchor="middle" font-size="21.3411">Old app reads email_addr, new app reads email</text>
  <text x="640" y="620" text-anchor="middle" font-size="21.3411">Both work during the transition window</text>
</svg>
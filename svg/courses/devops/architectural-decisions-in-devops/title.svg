<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="url(#bg)" rx="6" x="40" y="40"/>
  <rect x="310.0001" y="272" width="60" height="261" rx="6" fill="url(#grad-warn)" opacity="0.3" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="460" y="228.5" width="60" height="304.4999" rx="6" fill="url(#grad-warn)" opacity="0.4" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="610" y="185" width="60" height="348" rx="6" fill="url(#grad-warn)" opacity="0.5" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="760" y="228.5" width="60" height="304.4999" rx="6" fill="url(#grad-warn)" opacity="0.4" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="910.0001" y="272" width="60" height="261" rx="6" fill="url(#grad-warn)" opacity="0.3" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="295" y="257.5" width="90" height="21.75" rx="6" fill="url(#grad-warn)" opacity="0.5" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="445" y="214.0001" width="90" height="21.75" rx="6" fill="url(#grad-warn)" opacity="0.6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="595.0001" y="170.5001" width="90" height="21.75" rx="6" fill="url(#grad-warn)" opacity="0.7" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="745" y="214.0001" width="90" height="21.75" rx="6" fill="url(#grad-warn)" opacity="0.6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="895" y="257.5" width="90" height="21.75" rx="6" fill="url(#grad-warn)" opacity="0.5" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="265" y="533" width="750" height="17.4" rx="6" fill="url(#accent)" opacity="0.5"/>
  <path d="M 339.9999 264.7501 Q 640.0001 83.5 940.0001 264.7501" fill="none" stroke="var(--warn-border)" stroke-width="2.6667" opacity="0.5"/>
  <g transform="translate(250,70) rotate(45)" opacity="0.6">
    <rect x="22" y="22.6001" width="36" height="34.8" rx="6" fill="none" stroke="var(--border)" stroke-width="1"/>
  </g>
  <g transform="translate(400,45) rotate(45)" opacity="0.7">
    <rect x="19" y="19.7001" width="42" height="40.6" rx="6" fill="none" stroke="var(--border)" stroke-width="1"/>
  </g>
  <g transform="translate(550,70) rotate(45)" opacity="0.6">
    <rect x="22" y="22.6001" width="36" height="34.8" rx="6" fill="none" stroke="var(--border)" stroke-width="1"/>
  </g>
  <line x1="640.0001" y1="127" x2="429.9999" y2="134.25" stroke="var(--warn-border)" stroke-width="1.6" opacity="0.4"/>
  <line x1="640.0001" y1="127" x2="850.0001" y2="134.25" stroke="var(--warn-border)" stroke-width="1.6" opacity="0.4"/>
  <g transform="translate(400,290)" opacity="0.35">
    <path d="M -20 40 C -20 3.7501 24.9999 3.7501 40 40 C 55.0001 76.2501 100 76.2501 100 40 C 100 3.7501 55.0001 3.7501 40 40 C 24.9999 76.2501 -20 76.2501 -20 40 Z" fill="none" stroke="var(--warn-border)" stroke-width="3.2"/>
  </g>
  <circle cx="160" cy="112.5" r="2.7808" fill="var(--warn-fill)" opacity="0.3"/>
  <circle cx="1120" cy="127" r="4.1714" fill="var(--warn-fill)" opacity="0.3"/>
  <circle cx="190.0001" cy="576.5" r="2.7808" fill="var(--warn-fill)" opacity="0.25"/>
  <circle cx="1090" cy="576.5" r="2.7808" fill="var(--warn-fill)" opacity="0.25"/>
  <rect x="490" y="591" width="299.9999" height="4.35" rx="6" fill="url(#accent)" opacity="0.4"/>
</svg>

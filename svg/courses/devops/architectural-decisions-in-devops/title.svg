<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#eab308"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Architecture columns / pillars -->
  <rect x="180" y="160" width="40" height="180" rx="2" fill="#f97316" opacity="0.3"/>
  <rect x="280" y="130" width="40" height="210" rx="2" fill="#f97316" opacity="0.4"/>
  <rect x="380" y="100" width="40" height="240" rx="2" fill="#f97316" opacity="0.5"/>
  <rect x="480" y="130" width="40" height="210" rx="2" fill="#f97316" opacity="0.4"/>
  <rect x="580" y="160" width="40" height="180" rx="2" fill="#f97316" opacity="0.3"/>
  <!-- Pillar tops (capitals) -->
  <rect x="170" y="150" width="60" height="15" rx="3" fill="#f97316" opacity="0.5"/>
  <rect x="270" y="120" width="60" height="15" rx="3" fill="#f97316" opacity="0.6"/>
  <rect x="370" y="90" width="60" height="15" rx="3" fill="#f97316" opacity="0.7"/>
  <rect x="470" y="120" width="60" height="15" rx="3" fill="#f97316" opacity="0.6"/>
  <rect x="570" y="150" width="60" height="15" rx="3" fill="#f97316" opacity="0.5"/>
  <!-- Base / foundation -->
  <rect x="150" y="340" width="500" height="12" rx="3" fill="url(#accent)" opacity="0.5"/>
  <!-- Connecting arch -->
  <path d="M 200 155 Q 400 30 600 155" fill="none" stroke="#eab308" stroke-width="2.5" opacity="0.5"/>
  <!-- Decision nodes / diamonds -->
  <g transform="translate(250,70) rotate(45)" opacity="0.6">
    <rect x="-12" y="-12" width="24" height="24" rx="3" fill="none" stroke="#eab308" stroke-width="2"/>
  </g>
  <g transform="translate(400,45) rotate(45)" opacity="0.7">
    <rect x="-14" y="-14" width="28" height="28" rx="3" fill="none" stroke="#eab308" stroke-width="2.5"/>
  </g>
  <g transform="translate(550,70) rotate(45)" opacity="0.6">
    <rect x="-12" y="-12" width="24" height="24" rx="3" fill="none" stroke="#eab308" stroke-width="2"/>
  </g>
  <!-- Decision arrows branching from center diamond -->
  <line x1="400" y1="60" x2="260" y2="65" stroke="#eab308" stroke-width="1.5" opacity="0.4"/>
  <line x1="400" y1="60" x2="540" y2="65" stroke="#eab308" stroke-width="1.5" opacity="0.4"/>
  <!-- Infinity / loop symbol representing CI/CD -->
  <g transform="translate(400,290)" opacity="0.35">
    <path d="M -40 0 C -40 -25 -10 -25 0 0 C 10 25 40 25 40 0 C 40 -25 10 -25 0 0 C -10 25 -40 25 -40 0 Z" fill="none" stroke="#f97316" stroke-width="3"/>
  </g>
  <!-- Decorative dots -->
  <circle cx="80" cy="50" r="2" fill="#f97316" opacity="0.3"/>
  <circle cx="720" cy="60" r="3" fill="#eab308" opacity="0.3"/>
  <circle cx="100" cy="370" r="2" fill="#f97316" opacity="0.25"/>
  <circle cx="700" cy="370" r="2" fill="#eab308" opacity="0.25"/>
  <!-- Bottom accent -->
  <rect x="300" y="380" width="200" height="3" rx="1.5" fill="url(#accent)" opacity="0.4"/>
</svg>

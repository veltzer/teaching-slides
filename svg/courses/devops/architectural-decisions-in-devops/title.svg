<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="bg" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#212121" />
      <stop offset="100%" style="stop-color:#1a1a2e" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="160%" y2="0%">
      <stop offset="0%" style="stop-color:#f57c00" />
      <stop offset="100%" style="stop-color:#fbbc04" />
    </linearGradient>
  </defs>
  <rect width="853.3333" height="480" fill="url(#bg)" rx="6"/>
  <rect x="192" y="192" width="42.6667" height="216" rx="6" fill="var(--warn-fill)" opacity="0.3" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="298.6667" y="156" width="42.6667" height="252" rx="6" fill="var(--warn-fill)" opacity="0.4" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="405.3333" y="120" width="42.6667" height="288" rx="6" fill="var(--warn-fill)" opacity="0.5" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="512" y="156" width="42.6667" height="252" rx="6" fill="var(--warn-fill)" opacity="0.4" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="618.6667" y="192" width="42.6667" height="216" rx="6" fill="var(--warn-fill)" opacity="0.3" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="181.3333" y="180" width="64" height="18" rx="6" fill="var(--warn-fill)" opacity="0.5" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="288" y="144" width="64" height="18" rx="6" fill="var(--warn-fill)" opacity="0.6" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="394.6667" y="108" width="64" height="18" rx="6" fill="var(--warn-fill)" opacity="0.7" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="501.3333" y="144" width="64" height="18" rx="6" fill="var(--warn-fill)" opacity="0.6" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="608" y="180" width="64" height="18" rx="6" fill="var(--warn-fill)" opacity="0.5" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="160" y="408" width="533.3333" height="14.4" rx="6" fill="url(#accent)" opacity="0.5" />
  <path d="M 213.3333 186 Q 426.6667 36 640 186" fill="none" stroke="var(--warn-border)" stroke-width="2.6667" opacity="0.5" />
  <g transform="translate(250,70) rotate(45)" opacity="0.6">
    <rect x="-12.8" y="-14.4" width="25.6" height="28.8" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
  </g>
  <g transform="translate(400,45) rotate(45)" opacity="0.7">
    <rect x="-14.9333" y="-16.8" width="29.8667" height="33.6" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
  </g>
  <g transform="translate(550,70) rotate(45)" opacity="0.6">
    <rect x="-12.8" y="-14.4" width="25.6" height="28.8" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
  </g>
  <line x1="426.6667" y1="72" x2="277.3333" y2="78" stroke="var(--warn-border)" stroke-width="1.6" opacity="0.4" />
  <line x1="426.6667" y1="72" x2="576" y2="78" stroke="var(--warn-border)" stroke-width="1.6" opacity="0.4" />
  <g transform="translate(400,290)" opacity="0.35">
    <path d="M -42.6667 0 C -42.6667 -30 -10.6667 -30 0 0 C 10.6667 30 42.6667 30 42.6667 0 C 42.6667 -30 10.6667 -30 0 0 C -10.6667 30 -42.6667 30 -42.6667 0 Z" fill="none" stroke="var(--warn-border)" stroke-width="3.2" />
  </g>
  <circle cx="85.3333" cy="60" r="2.1333" fill="var(--warn-fill)" opacity="0.3" />
  <circle cx="768" cy="72" r="3.2" fill="var(--warn-fill)" opacity="0.3" />
  <circle cx="106.6667" cy="444" r="2.1333" fill="var(--warn-fill)" opacity="0.25" />
  <circle cx="746.6667" cy="444" r="2.1333" fill="var(--warn-fill)" opacity="0.25" />
  <rect x="320" y="456" width="213.3333" height="3.6" rx="6" fill="url(#accent)" opacity="0.4" />
</svg>
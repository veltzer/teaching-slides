  <line x1="668.5715" y1="156" x2="468.5714" y2="162.8235" stroke="var(--warn-border)" stroke-width="1.6" opacity="0.4" />
  <line x1="668.5715" y1="156" x2="868.5715" y2="162.8235" stroke="var(--warn-border)" stroke-width="1.6" opacity="0.4" />
  <g transform="translate(400,290)" opacity="0.35">
    <path d="M 40 74.1176 C 40 40 82.8571 40 97.1429 74.1176 C 111.4287 108.2353 154.2858 108.2353 154.2858 74.1176 C 154.2858 40 111.4287 40 97.1429 74.1176 C 82.8571 108.2353 40 108.2353 40 74.1176 Z" fill="none" stroke="var(--warn-border)" stroke-width="3.2" />
  </g>
  <circle cx="211.4286" cy="142.3529" r="2.6328" fill="var(--warn-fill)" opacity="0.3" />
  <circle cx="1125.7143" cy="156" r="3.9493" fill="var(--warn-fill)" opacity="0.3" />
  <circle cx="240.0001" cy="579.0588" r="2.6328" fill="var(--warn-fill)" opacity="0.25" />
  <circle cx="1097.1429" cy="579.0588" r="2.6328" fill="var(--warn-fill)" opacity="0.25" />
  <rect x="525.7143" y="592.7059" width="285.7142" height="4.0941" rx="6" fill="url(#accent)" opacity="0.4" />
</svg>
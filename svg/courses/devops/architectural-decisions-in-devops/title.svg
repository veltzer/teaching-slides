  <rect x="768.5714" y="237.8824" width="85.7143" height="20.4706" rx="6" fill="var(--warn-fill)" opacity="0.6" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="911.4286" y="278.8235" width="85.7143" height="20.4706" rx="6" fill="var(--warn-fill)" opacity="0.5" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="311.4286" y="538.1176" width="714.2857" height="16.3765" rx="6" fill="url(#accent)" opacity="0.5" />
  <path d="M 382.8571 285.6471 Q 668.5715 115.0588 954.2858 285.6471" fill="none" stroke="var(--warn-border)" stroke-width="2.6667" opacity="0.5" />
  <g transform="translate(250,70) rotate(45)" opacity="0.6">
    <rect x="80" y="57.7412" width="34.2857" height="32.7529" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
  </g>
  <g transform="translate(400,45) rotate(45)" opacity="0.7">
    <rect x="77.1429" y="55.0118" width="40" height="38.2118" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />

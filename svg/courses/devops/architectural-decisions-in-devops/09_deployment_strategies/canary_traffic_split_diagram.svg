<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr3" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.4857,0" fill="#333" />
    </marker>
  </defs>
  <rect x="40" y="205.7144" width="174.1935" height="82.8571" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="127.0969" y="257.4999" text-anchor="middle" font-size="24.5412" font-weight="bold">Users</text>
  <rect x="349.6775" y="184.9999" width="251.6129" height="124.2858" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="475.4839" y="243" text-anchor="middle" font-size="22.6535" font-weight="bold">Traffic Router</text>
  <text x="475.4839" y="280.2857" text-anchor="middle" font-size="18.8778">Weight-based</text>
  <rect x="814.1936" y="40" width="425.8064" height="124.2858" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1027.0968" y="98" text-anchor="middle" font-size="24.5412" font-weight="bold" fill="var(--ok-accent)">Stable (v1)</text>
  <text x="1027.0968" y="135.2857" text-anchor="middle" font-size="20.7657">95% of traffic</text>
  <rect x="814.1936" y="350.7143" width="425.8064" height="124.2858" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1027.0968" y="408.7144" text-anchor="middle" font-size="24.5412" font-weight="bold" fill="var(--danger-accent)">Canary (v2)</text>
  <text x="1027.0968" y="446" text-anchor="middle" font-size="20.7657">5% of traffic</text>
  <line x1="214.1936" y1="247.1429" x2="340.0001" y2="247.1429" stroke="var(--text)" stroke-width="2" marker-end="url(#arr3)" />
  <line x1="601.2904" y1="226.4286" x2="804.5162" y2="102.1428" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arr3)" />
  <line x1="601.2904" y1="267.8572" x2="804.5162" y2="412.8572" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arr3)" />
  <text x="698.0645" y="143.5714" text-anchor="middle" font-size="20.7657" fill="var(--ok-accent)" font-weight="bold">95%</text>
  <text x="698.0645" y="371.4286" text-anchor="middle" font-size="20.7657" fill="var(--danger-accent)" font-weight="bold">5%</text>
  <rect x="814.1936" y="537.1429" width="425.8064" height="82.8571" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1027.0968" y="588.9286" text-anchor="middle" font-size="22.6535" font-weight="bold" fill="var(--info-accent)">Monitoring &amp; Alerting</text>
  <line x1="1027.0968" y1="475" x2="1027.0968" y2="526.7857" stroke="var(--info-border)" stroke-width="2" stroke-dasharray="6.8956 5.1717" marker-end="url(#arr3)" />
</svg>
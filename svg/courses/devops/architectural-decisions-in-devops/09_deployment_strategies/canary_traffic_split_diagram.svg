<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="205.7144" width="174.1935" height="82.8571" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="127.0969" y="257.4999" text-anchor="middle" font-size="24.5412" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Users</text>
  <rect x="349.6775" y="184.9999" width="251.6129" height="124.2858" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="475.4839" y="243" text-anchor="middle" font-size="22.6535" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Traffic Router</text>
  <text x="475.4839" y="280.2857" text-anchor="middle" font-size="18.8778" font-family="Arial, sans-serif" fill="var(--warn-text)">Weight-based</text>
  <rect x="814.1936" y="40" width="425.8064" height="124.2858" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1027.0968" y="98" text-anchor="middle" font-size="24.5412" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Stable (v1)</text>
  <text x="1027.0968" y="135.2857" text-anchor="middle" font-size="20.7657" font-family="Arial, sans-serif" fill="var(--ok-text)">95% of traffic</text>
  <rect x="814.1936" y="350.7143" width="425.8064" height="124.2858" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1027.0968" y="408.7144" text-anchor="middle" font-size="24.5412" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Canary (v2)</text>
  <text x="1027.0968" y="446" text-anchor="middle" font-size="20.7657" font-family="Arial, sans-serif" fill="var(--danger-text)">5% of traffic</text>
  <line x1="214.1936" y1="247.1429" x2="340.0001" y2="247.1429" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="601.2904" y1="226.4286" x2="804.5162" y2="102.1428" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="601.2904" y1="267.8572" x2="804.5162" y2="412.8572" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="698.0645" y="143.5714" text-anchor="middle" font-size="20.7657" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">95%</text>
  <text x="698.0645" y="371.4286" text-anchor="middle" font-size="20.7657" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">5%</text>
  <rect x="814.1936" y="537.1429" width="425.8064" height="82.8571" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1027.0968" y="588.9286" text-anchor="middle" font-size="22.6535" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Monitoring &amp; Alerting</text>
  <line x1="1027.0968" y1="475" x2="1027.0968" y2="526.7857" stroke="var(--info-border)" stroke-width="2" stroke-dasharray="6.8956 5.1717" marker-end="url(#arrow)"/>
</svg>

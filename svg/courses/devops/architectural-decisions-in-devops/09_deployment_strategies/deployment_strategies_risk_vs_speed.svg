<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <line x1="40" y1="540.0001" x2="1240" y2="540.0001" stroke="var(--text)" stroke-width="2" />
  <line x1="40" y1="540.0001" x2="40" y2="40" stroke="var(--text)" stroke-width="2" />
  <text x="650.5262" y="620" text-anchor="middle" font-size="25.1497" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Deployment Speed</text>
  <text x="40" y="300.0001" text-anchor="middle" font-size="24.1143" font-weight="bold" transform="rotate(-90, 30, 170)" font-family="Arial, sans-serif" fill="var(--text)">Safety</text>
  <rect x="234.594" y="381.962" width="116.076" height="116.076" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="3.4478" opacity="0.8" filter="url(#shadow)"/>
  <text x="292.6316" y="448.0001" text-anchor="middle" font-size="19.346" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Blue/</text>
  <text x="292.6316" y="472.0001" text-anchor="middle" font-size="19.346" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Green</text>
  <rect x="550.383" y="161.962" width="116.076" height="116.076" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="3.4478" opacity="0.8" filter="url(#shadow)"/>
  <text x="608.4209" y="228.0001" text-anchor="middle" font-size="19.346" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Progressive</text>
  <text x="608.4209" y="252.0001" text-anchor="middle" font-size="19.346" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Delivery</text>
  <rect x="866.173" y="301.962" width="116.076" height="116.076" rx="14" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="3.4478" opacity="0.8" filter="url(#shadow)"/>
  <text x="924.2105" y="368" text-anchor="middle" font-size="19.346" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Rolling</text>
  <rect x="445.12" y="101.962" width="116.076" height="116.076" rx="14" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="3.4478" opacity="0.8" filter="url(#shadow)"/>
  <text x="503.1578" y="168.0001" text-anchor="middle" font-size="19.346" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Canary</text>
  <rect x="971.436" y="141.962" width="116.076" height="116.076" rx="14" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="3.4478" opacity="0.8" filter="url(#shadow)"/>
  <text x="1029.4736" y="196.0001" text-anchor="middle" font-size="19.346" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Feature</text>
  <text x="1029.4736" y="220.0001" text-anchor="middle" font-size="19.346" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Flags</text>
  <text x="1218.9473" y="520" font-size="21.2806" fill="var(--text-muted)" font-family="Arial, sans-serif">Fast</text>
  <text x="50.5263" y="70.0001" font-size="21.2806" fill="var(--text-muted)" font-family="Arial, sans-serif">Safe</text>
</svg>
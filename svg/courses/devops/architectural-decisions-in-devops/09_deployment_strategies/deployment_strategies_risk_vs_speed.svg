<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <line x1="40" y1="540.0001" x2="1240" y2="540.0001" stroke="var(--text)" stroke-width="2" />
  <line x1="40" y1="540.0001" x2="40" y2="40" stroke="var(--text)" stroke-width="2" />
  <text x="650.5262" y="620" text-anchor="middle" font-size="25.1497" font-weight="bold">Deployment Speed</text>
  <text x="40" y="300.0001" text-anchor="middle" font-size="24.1143" font-weight="bold" transform="rotate(-90, 30, 170)">Safety</text>
  <rect x="234.594" y="381.962" width="116.076" height="116.076" rx="14" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="3.4478" opacity="0.8"/>
  <text x="292.6316" y="448.0001" text-anchor="middle" font-size="19.346" font-weight="bold">Blue/</text>
  <text x="292.6316" y="472.0001" text-anchor="middle" font-size="19.346" font-weight="bold">Green</text>
  <rect x="550.383" y="161.962" width="116.076" height="116.076" rx="14" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="3.4478" opacity="0.8"/>
  <text x="608.4209" y="228.0001" text-anchor="middle" font-size="19.346" font-weight="bold">Progressive</text>
  <text x="608.4209" y="252.0001" text-anchor="middle" font-size="19.346" font-weight="bold">Delivery</text>
  <rect x="866.173" y="301.962" width="116.076" height="116.076" rx="14" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="3.4478" opacity="0.8"/>
  <text x="924.2105" y="368" text-anchor="middle" font-size="19.346" font-weight="bold">Rolling</text>
  <rect x="445.12" y="101.962" width="116.076" height="116.076" rx="14" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="3.4478" opacity="0.8"/>
  <text x="503.1578" y="168.0001" text-anchor="middle" font-size="19.346" font-weight="bold">Canary</text>
  <rect x="971.436" y="141.962" width="116.076" height="116.076" rx="14" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="3.4478" opacity="0.8"/>
  <text x="1029.4736" y="196.0001" text-anchor="middle" font-size="19.346" font-weight="bold">Feature</text>
  <text x="1029.4736" y="220.0001" text-anchor="middle" font-size="19.346" font-weight="bold">Flags</text>
  <text x="1218.9473" y="520" font-size="21.2806" fill="var(--text-muted)">Fast</text>
  <text x="50.5263" y="70.0001" font-size="21.2806" fill="var(--text-muted)">Safe</text>
</svg>
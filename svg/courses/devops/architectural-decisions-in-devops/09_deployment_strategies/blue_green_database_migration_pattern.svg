<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr2" markerWidth="18.2857" markerHeight="24" refX="16.4571" refY="7.2" orient="auto">
      <polygon points="0,24 5.4857,0" fill="#333" />
    </marker>
  </defs>
  <text x="18.2857" y="72" font-size="23.7714" font-weight="bold" fill="var(--text-dark)">Expand-and-Contract Migration:</text>
  <rect x="36.5714" y="120" width="274.2857" height="120" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="3.6571" rx="9.1429" />
  <text x="173.7143" y="172.8" text-anchor="middle" font-size="20.1143" font-weight="bold">Phase 1: Expand</text>
  <text x="173.7143" y="211.2" text-anchor="middle" font-size="18.2857">Add new columns</text>
  <rect x="356.5714" y="120" width="274.2857" height="120" fill="var(--warn-pale4)" stroke="var(--warn-amber)" stroke-width="3.6571" rx="9.1429" />
  <text x="493.7143" y="172.8" text-anchor="middle" font-size="20.1143" font-weight="bold">Phase 2: Dual Write</text>
  <text x="493.7143" y="211.2" text-anchor="middle" font-size="18.2857">Both schemas active</text>
  <rect x="676.5714" y="120" width="274.2857" height="120" fill="var(--ok-lt)" stroke="var(--ok-dk)" stroke-width="3.6571" rx="9.1429" />
  <text x="813.7143" y="172.8" text-anchor="middle" font-size="20.1143" font-weight="bold">Phase 3: Migrate</text>
  <text x="813.7143" y="211.2" text-anchor="middle" font-size="18.2857">Backfill data</text>
  <rect x="996.5714" y="120" width="274.2857" height="120" fill="var(--info-pale)" stroke="var(--info-mid)" stroke-width="3.6571" rx="9.1429" />
  <text x="1133.7143" y="172.8" text-anchor="middle" font-size="20.1143" font-weight="bold">Phase 4: Contract</text>
  <text x="1133.7143" y="211.2" text-anchor="middle" font-size="18.2857">Drop old columns</text>
  <line x1="310.8571" y1="180" x2="347.4286" y2="180" stroke="var(--text-dark)" stroke-width="3.6571" marker-end="url(#arr2)" />
  <line x1="630.8571" y1="180" x2="667.4286" y2="180" stroke="var(--text-dark)" stroke-width="3.6571" marker-end="url(#arr2)" />
  <line x1="950.8571" y1="180" x2="987.4286" y2="180" stroke="var(--text-dark)" stroke-width="3.6571" marker-end="url(#arr2)" />
  <rect x="457.1429" y="384" width="365.7143" height="120" fill="var(--warn-lt)" stroke="var(--warn-mid)" stroke-width="3.6571" rx="9.1429" />
  <text x="640" y="444" text-anchor="middle" font-size="23.7714" font-weight="bold">Shared Database</text>
  <text x="640" y="480" text-anchor="middle" font-size="18.2857">Must remain compatible</text>
  <line x1="173.7143" y1="240" x2="530.2857" y2="384" stroke="var(--text-faintest)" stroke-width="1.8286" stroke-dasharray="7.3143 5.4857" />
  <line x1="813.7143" y1="240" x2="713.1429" y2="384" stroke="var(--text-faintest)" stroke-width="1.8286" stroke-dasharray="7.3143 5.4857" />
</svg>
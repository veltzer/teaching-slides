<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,24 5.4857,0" fill="#333" />
    </marker>
  </defs>
  <text x="40" y="40" font-size="26.9598" font-weight="bold" fill="var(--text)">Expand-and-Contract Migration:</text>
  <rect x="57.5182" y="104.4444" width="262.7737" height="161.1111" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="188.9051" y="175.3333" text-anchor="middle" font-size="22.8122" font-weight="bold">Phase 1: Expand</text>
  <text x="188.9051" y="226.8889" text-anchor="middle" font-size="20.7383">Add new columns</text>
  <rect x="364.0876" y="104.4444" width="262.7737" height="161.1111" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="495.4745" y="175.3333" text-anchor="middle" font-size="22.8122" font-weight="bold">Phase 2: Dual Write</text>
  <text x="495.4745" y="226.8889" text-anchor="middle" font-size="20.7383">Both schemas active</text>
  <rect x="670.6569" y="104.4444" width="262.7737" height="161.1111" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="802.0438" y="175.3333" text-anchor="middle" font-size="22.8122" font-weight="bold">Phase 3: Migrate</text>
  <text x="802.0438" y="226.8889" text-anchor="middle" font-size="20.7383">Backfill data</text>
  <rect x="977.2263" y="104.4444" width="262.7737" height="161.1111" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="1108.6132" y="175.3333" text-anchor="middle" font-size="22.8122" font-weight="bold">Phase 4: Contract</text>
  <text x="1108.6132" y="226.8889" text-anchor="middle" font-size="20.7383">Drop old columns</text>
  <line x1="320.2919" y1="185" x2="355.3285" y2="185" stroke="var(--text)" stroke-width="2" marker-end="url(#arr2)" />
  <line x1="626.8613" y1="185" x2="661.8979" y2="185" stroke="var(--text)" stroke-width="2" marker-end="url(#arr2)" />
  <line x1="933.4306" y1="185" x2="968.4672" y2="185" stroke="var(--text)" stroke-width="2" marker-end="url(#arr2)" />
  <rect x="460.438" y="458.8889" width="350.365" height="161.1111" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="635.6205" y="539.4444" text-anchor="middle" font-size="26.9598" font-weight="bold">Shared Database</text>
  <text x="635.6205" y="587.7778" text-anchor="middle" font-size="20.7383">Must remain compatible</text>
  <line x1="188.9051" y1="265.5556" x2="530.511" y2="458.8889" stroke="var(--text-faint)" stroke-width="1.8286" stroke-dasharray="7.3143 5.4857" />
  <line x1="802.0438" y1="265.5556" x2="705.6935" y2="458.8889" stroke="var(--text-faint)" stroke-width="1.8286" stroke-dasharray="7.3143 5.4857" />
</svg>
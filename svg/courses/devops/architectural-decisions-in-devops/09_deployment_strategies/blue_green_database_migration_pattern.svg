<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,24 5.4857,0" fill="#333" />
    </marker>
  </defs>
  <text x="18.2857" y="72" font-size="23.7714" font-weight="bold" fill="var(--text)">Expand-and-Contract Migration:</text>
  <rect x="36.5714" y="120" width="274.2857" height="120" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="173.7143" y="172.8" text-anchor="middle" font-size="20.1143" font-weight="bold">Phase 1: Expand</text>
  <text x="173.7143" y="211.2" text-anchor="middle" font-size="18.2857">Add new columns</text>
  <rect x="356.5714" y="120" width="274.2857" height="120" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="493.7143" y="172.8" text-anchor="middle" font-size="20.1143" font-weight="bold">Phase 2: Dual Write</text>
  <text x="493.7143" y="211.2" text-anchor="middle" font-size="18.2857">Both schemas active</text>
  <rect x="676.5714" y="120" width="274.2857" height="120" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="813.7143" y="172.8" text-anchor="middle" font-size="20.1143" font-weight="bold">Phase 3: Migrate</text>
  <text x="813.7143" y="211.2" text-anchor="middle" font-size="18.2857">Backfill data</text>
  <rect x="996.5714" y="120" width="274.2857" height="120" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="1133.7143" y="172.8" text-anchor="middle" font-size="20.1143" font-weight="bold">Phase 4: Contract</text>
  <text x="1133.7143" y="211.2" text-anchor="middle" font-size="18.2857">Drop old columns</text>
  <line x1="310.8571" y1="180" x2="347.4286" y2="180" stroke="var(--text)" stroke-width="2" marker-end="url(#arr2)" />
  <line x1="630.8571" y1="180" x2="667.4286" y2="180" stroke="var(--text)" stroke-width="2" marker-end="url(#arr2)" />
  <line x1="950.8571" y1="180" x2="987.4286" y2="180" stroke="var(--text)" stroke-width="2" marker-end="url(#arr2)" />
  <rect x="457.1429" y="384" width="365.7143" height="120" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="640" y="444" text-anchor="middle" font-size="23.7714" font-weight="bold">Shared Database</text>
  <text x="640" y="480" text-anchor="middle" font-size="18.2857">Must remain compatible</text>
  <line x1="173.7143" y1="240" x2="530.2857" y2="384" stroke="var(--text-faint)" stroke-width="1.8286" stroke-dasharray="7.3143 5.4857" />
  <line x1="813.7143" y1="240" x2="713.1429" y2="384" stroke="var(--text-faint)" stroke-width="1.8286" stroke-dasharray="7.3143 5.4857" />
</svg>
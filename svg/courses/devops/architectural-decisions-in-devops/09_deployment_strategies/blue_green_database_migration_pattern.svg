<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="40" y="40" font-size="26.9598" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Expand-and-Contract Migration:</text>
  <rect x="57.5182" y="104.4444" width="262.7737" height="161.1111" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="188.9051" y="175.3333" text-anchor="middle" font-size="22.8122" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Phase 1: Expand</text>
  <text x="188.9051" y="226.8889" text-anchor="middle" font-size="20.7383" font-family="Arial, sans-serif" fill="var(--primary-text)">Add new columns</text>
  <rect x="364.0876" y="104.4444" width="262.7737" height="161.1111" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="495.4745" y="175.3333" text-anchor="middle" font-size="22.8122" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Phase 2: Dual Write</text>
  <text x="495.4745" y="226.8889" text-anchor="middle" font-size="20.7383" font-family="Arial, sans-serif" fill="var(--warn-text)">Both schemas active</text>
  <rect x="670.6569" y="104.4444" width="262.7737" height="161.1111" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="802.0438" y="175.3333" text-anchor="middle" font-size="22.8122" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Phase 3: Migrate</text>
  <text x="802.0438" y="226.8889" text-anchor="middle" font-size="20.7383" font-family="Arial, sans-serif" fill="var(--ok-text)">Backfill data</text>
  <rect x="977.2263" y="104.4444" width="262.7737" height="161.1111" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1108.6132" y="175.3333" text-anchor="middle" font-size="22.8122" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Phase 4: Contract</text>
  <text x="1108.6132" y="226.8889" text-anchor="middle" font-size="20.7383" font-family="Arial, sans-serif" fill="var(--info-text)">Drop old columns</text>
  <line x1="320.2919" y1="185" x2="355.3285" y2="185" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="626.8613" y1="185" x2="661.8979" y2="185" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="933.4306" y1="185" x2="968.4672" y2="185" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="460.438" y="458.8889" width="350.365" height="161.1111" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="635.6205" y="539.4444" text-anchor="middle" font-size="26.9598" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Shared Database</text>
  <text x="635.6205" y="587.7778" text-anchor="middle" font-size="20.7383" font-family="Arial, sans-serif" fill="var(--warn-text)">Must remain compatible</text>
  <line x1="188.9051" y1="265.5556" x2="530.511" y2="458.8889" stroke="var(--text-faint)" stroke-width="1.8286" stroke-dasharray="7.3143 5.4857"/>
  <line x1="802.0438" y1="265.5556" x2="705.6935" y2="458.8889" stroke="var(--text-faint)" stroke-width="1.8286" stroke-dasharray="7.3143 5.4857"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="184.6153" height="261" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="132.3077" y="156" text-anchor="middle" font-size="24.337" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Create</text>
  <text x="132.3077" y="243" text-anchor="middle" font-size="22.1245" font-family="Arial, sans-serif" fill="var(--primary-text)">Set owner</text>
  <rect x="289.2308" y="40" width="184.6153" height="261" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="381.5384" y="156" text-anchor="middle" font-size="24.337" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Develop</text>
  <text x="381.5384" y="243" text-anchor="middle" font-size="22.1245" font-family="Arial, sans-serif" fill="var(--warn-text)">Code + test</text>
  <rect x="538.4615" y="40" width="184.6153" height="261" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="630.7692" y="156" text-anchor="middle" font-size="24.337" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Roll Out</text>
  <text x="630.7692" y="243" text-anchor="middle" font-size="22.1245" font-family="Arial, sans-serif" fill="var(--ok-text)">Gradual enable</text>
  <rect x="787.6923" y="40" width="184.6153" height="261" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="879.9999" y="156" text-anchor="middle" font-size="24.337" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Evaluate</text>
  <text x="879.9999" y="243" text-anchor="middle" font-size="22.1245" font-family="Arial, sans-serif" fill="var(--info-text)">Analyze data</text>
  <rect x="1036.923" y="40" width="203.077" height="261" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1138.4615" y="156" text-anchor="middle" font-size="24.337" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Clean Up</text>
  <text x="1138.4615" y="243" text-anchor="middle" font-size="22.1245" font-family="Arial, sans-serif" fill="var(--danger-text)">Remove flag</text>
  <line x1="224.6154" y1="167.6" x2="280" y2="167.6" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="473.8461" y1="167.6" x2="529.2308" y2="167.6" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="723.077" y1="167.6" x2="778.4615" y2="167.6" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="972.3077" y1="167.6" x2="1027.6922" y2="167.6" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="40" y1="504" x2="1240" y2="504" stroke="var(--text-faint)" stroke-width="2"/>
  <text x="132.3077" y="620" text-anchor="middle" font-size="22.1245" fill="var(--text-muted)" font-family="Arial, sans-serif">Day 0</text>
  <text x="630.7692" y="620" text-anchor="middle" font-size="22.1245" fill="var(--text-muted)" font-family="Arial, sans-serif">Week 2-4</text>
  <text x="1138.4615" y="620" text-anchor="middle" font-size="22.1245" fill="var(--text-muted)" font-family="Arial, sans-serif">Remove by deadline</text>
</svg>

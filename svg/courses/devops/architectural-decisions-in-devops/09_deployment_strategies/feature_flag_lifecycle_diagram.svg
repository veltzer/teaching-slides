<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr6" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,40 5.4857,0" fill="#333" />
    </marker>
  </defs>
  <rect x="40" y="40" width="184.6153" height="261" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="132.3077" y="156" text-anchor="middle" font-size="24.337" font-weight="bold">Create</text>
  <text x="132.3077" y="243" text-anchor="middle" font-size="22.1245">Set owner</text>
  <rect x="289.2308" y="40" width="184.6153" height="261" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="381.5384" y="156" text-anchor="middle" font-size="24.337" font-weight="bold">Develop</text>
  <text x="381.5384" y="243" text-anchor="middle" font-size="22.1245">Code + test</text>
  <rect x="538.4615" y="40" width="184.6153" height="261" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="630.7692" y="156" text-anchor="middle" font-size="24.337" font-weight="bold">Roll Out</text>
  <text x="630.7692" y="243" text-anchor="middle" font-size="22.1245">Gradual enable</text>
  <rect x="787.6923" y="40" width="184.6153" height="261" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="879.9999" y="156" text-anchor="middle" font-size="24.337" font-weight="bold">Evaluate</text>
  <text x="879.9999" y="243" text-anchor="middle" font-size="22.1245">Analyze data</text>
  <rect x="1036.923" y="40" width="203.077" height="261" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1138.4615" y="156" text-anchor="middle" font-size="24.337" font-weight="bold">Clean Up</text>
  <text x="1138.4615" y="243" text-anchor="middle" font-size="22.1245">Remove flag</text>
  <line x1="224.6154" y1="167.6" x2="280" y2="167.6" stroke="var(--text)" stroke-width="2" marker-end="url(#arr6)" />
  <line x1="473.8461" y1="167.6" x2="529.2308" y2="167.6" stroke="var(--text)" stroke-width="2" marker-end="url(#arr6)" />
  <line x1="723.077" y1="167.6" x2="778.4615" y2="167.6" stroke="var(--text)" stroke-width="2" marker-end="url(#arr6)" />
  <line x1="972.3077" y1="167.6" x2="1027.6922" y2="167.6" stroke="var(--text)" stroke-width="2" marker-end="url(#arr6)" />
  <line x1="40" y1="504" x2="1240" y2="504" stroke="var(--text-faint)" stroke-width="2" />
  <text x="132.3077" y="620" text-anchor="middle" font-size="22.1245" fill="var(--text-muted)">Day 0</text>
  <text x="630.7692" y="620" text-anchor="middle" font-size="22.1245" fill="var(--text-muted)">Week 2-4</text>
  <text x="1138.4615" y="620" text-anchor="middle" font-size="22.1245" fill="var(--text-muted)">Remove by deadline</text>
</svg>
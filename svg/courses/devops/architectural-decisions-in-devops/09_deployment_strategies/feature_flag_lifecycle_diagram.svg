<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr6" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,40 5.4857,0" fill="#333" />
    </marker>
  </defs>
  <rect x="36.5714" y="240" width="182.8571" height="180" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="128" y="320" text-anchor="middle" font-size="20.1143" font-weight="bold">Create</text>
  <text x="128" y="380" text-anchor="middle" font-size="18.2857">Set owner</text>
  <rect x="283.4286" y="240" width="182.8571" height="180" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="374.8571" y="320" text-anchor="middle" font-size="20.1143" font-weight="bold">Develop</text>
  <text x="374.8571" y="380" text-anchor="middle" font-size="18.2857">Code + test</text>
  <rect x="530.2857" y="240" width="182.8571" height="180" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="621.7143" y="320" text-anchor="middle" font-size="20.1143" font-weight="bold">Roll Out</text>
  <text x="621.7143" y="380" text-anchor="middle" font-size="18.2857">Gradual enable</text>
  <rect x="777.1429" y="240" width="182.8571" height="180" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="868.5714" y="320" text-anchor="middle" font-size="20.1143" font-weight="bold">Evaluate</text>
  <text x="868.5714" y="380" text-anchor="middle" font-size="18.2857">Analyze data</text>
  <rect x="1024" y="240" width="201.1429" height="180" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="1124.5714" y="320" text-anchor="middle" font-size="20.1143" font-weight="bold">Clean Up</text>
  <text x="1124.5714" y="380" text-anchor="middle" font-size="18.2857">Remove flag</text>
  <line x1="219.4286" y1="328" x2="274.2857" y2="328" stroke="var(--text)" stroke-width="2" marker-end="url(#arr6)" />
  <line x1="466.2857" y1="328" x2="521.1429" y2="328" stroke="var(--text)" stroke-width="2" marker-end="url(#arr6)" />
  <line x1="713.1429" y1="328" x2="768" y2="328" stroke="var(--text)" stroke-width="2" marker-end="url(#arr6)" />
  <line x1="960" y1="328" x2="1014.8571" y2="328" stroke="var(--text)" stroke-width="2" marker-end="url(#arr6)" />
  <line x1="36.5714" y1="560" x2="1225.1429" y2="560" stroke="var(--text-faint)" stroke-width="2" />
  <text x="128" y="640" text-anchor="middle" font-size="18.2857" fill="var(--text-muted)">Day 0</text>
  <text x="621.7143" y="640" text-anchor="middle" font-size="18.2857" fill="var(--text-muted)">Week 2-4</text>
  <text x="1124.5714" y="640" text-anchor="middle" font-size="18.2857" fill="var(--text-muted)">Remove by deadline</text>
</svg>
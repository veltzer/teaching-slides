  <text x="292.3655" y="96.3455" text-anchor="middle" font-size="12.3354" font-weight="bold">Deploy Canary</text>
  <text x="292.3655" y="121.5771" text-anchor="middle" font-size="11.214">1-5% traffic</text>
  <rect x="398.8987" y="61.6521" width="134.5683" height="78.8485" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.2816" rx="5.7297" />
  <text x="466.1828" y="96.3455" text-anchor="middle" font-size="12.3354" font-weight="bold">Analyze</text>
  <text x="466.1828" y="121.5771" text-anchor="middle" font-size="11.214">Auto metrics check</text>
  <rect x="572.7159" y="61.6521" width="134.5683" height="78.8485" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="1.2816" rx="5.7297" />
  <text x="640" y="96.3455" text-anchor="middle" font-size="12.3354" font-weight="bold">Promote</text>
  <text x="640" y="121.5771" text-anchor="middle" font-size="11.214">Increase traffic</text>
  <line x1="185.8324" y1="101.0764" x2="219.4744" y2="101.0764" stroke="var(--text)" stroke-width="1.2816" marker-end="url(#arr7)" />
  <line x1="359.6495" y1="101.0764" x2="393.2917" y2="101.0764" stroke="var(--text)" stroke-width="1.2816" marker-end="url(#arr7)" />
  <line x1="533.4668" y1="101.0764" x2="567.1089" y2="101.0764" stroke="var(--text)" stroke-width="1.2816" marker-end="url(#arr7)" />
  <path d="M 640 140.5007 L 640 219.3492 L 292.3655 219.3492 L 292.3655 148.3856" stroke="var(--warn-border)" stroke-width="1.505" fill="none" stroke-dasharray="4.515 2.2575" marker-end="url(#arr7)" />
  <text x="466.1828" y="247.7347" text-anchor="middle" font-size="11.214" fill="var(--warn-accent)" font-weight="bold">Repeat until 100% or rollback</text>

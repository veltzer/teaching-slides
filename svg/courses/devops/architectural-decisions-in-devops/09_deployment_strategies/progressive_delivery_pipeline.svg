  <text x="494.2177" y="235.1189" font-size="11.214" fill="var(--danger-accent)">Metrics fail</text>
  <rect x="623.179" y="203.5795" width="145.7822" height="63.0788" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.2816" rx="5.7297" />
  <text x="696.07" y="243.0037" text-anchor="middle" font-size="12.3354" font-weight="bold" fill="var(--ok-accent)">Full Rollout</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <marker id="arr7" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,25.7143 5.4857,0" fill="#333" />
    </marker>
  </defs>
  <rect x="40" y="40" width="225.0002" height="152.6315" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="152.5" y="107.158" text-anchor="middle" font-size="22.1921" font-weight="bold">Build &amp; Test</text>
  <text x="152.5" y="156.0002" text-anchor="middle" font-size="20.1746">CI pipeline</text>
  <rect x="330.6251" y="40" width="225.0002" height="152.6315" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="443.1251" y="107.158" text-anchor="middle" font-size="22.1921" font-weight="bold">Deploy Canary</text>
  <text x="443.1251" y="156.0002" text-anchor="middle" font-size="20.1746">1-5% traffic</text>
  <rect x="621.2501" y="40" width="225.0002" height="152.6315" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="733.7501" y="107.158" text-anchor="middle" font-size="22.1921" font-weight="bold">Analyze</text>
  <text x="733.7501" y="156.0002" text-anchor="middle" font-size="20.1746">Auto metrics check</text>
  <rect x="911.875" y="40" width="225.0002" height="152.6315" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1024.375" y="107.158" text-anchor="middle" font-size="22.1921" font-weight="bold">Promote</text>
  <text x="1024.375" y="156.0002" text-anchor="middle" font-size="20.1746">Increase traffic</text>
  <line x1="265.0002" y1="116.3158" x2="321.2501" y2="116.3158" stroke="var(--text)" stroke-width="0.8213" marker-end="url(#arr7)" />
  <line x1="555.6249" y1="116.3158" x2="611.8751" y2="116.3158" stroke="var(--text)" stroke-width="0.8213" marker-end="url(#arr7)" />
  <line x1="846.2499" y1="116.3158" x2="902.5" y2="116.3158" stroke="var(--text)" stroke-width="0.8213" marker-end="url(#arr7)" />
  <path d="M 1024.375 192.6317 L 1024.375 345.2631 L 443.1251 345.2631 L 443.1251 207.8949" stroke="var(--warn-border)" stroke-width="0.9644" fill="none" stroke-dasharray="2.8932 1.4466" marker-end="url(#arr7)" />
  <text x="733.7501" y="400.2106" text-anchor="middle" font-size="20.1746" fill="var(--warn-accent)" font-weight="bold">Repeat until 100% or rollback</text>
  <rect x="621.2501" y="497.8948" width="225.0002" height="122.1052" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="733.7501" y="574.2107" text-anchor="middle" font-size="22.1921" font-weight="bold" fill="var(--danger-accent)">Rollback</text>
  <line x1="733.7501" y1="192.6317" x2="733.7501" y2="482.6316" stroke="var(--danger-border)" stroke-width="0.7233" stroke-dasharray="1.9288 1.4466" marker-end="url(#arr7)" />
  <text x="780.6249" y="375.7894" font-size="20.1746" fill="var(--danger-accent)">Metrics fail</text>
  <rect x="996.25" y="314.7369" width="243.75" height="122.1052" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1118.1249" y="391.0525" text-anchor="middle" font-size="22.1921" font-weight="bold" fill="var(--ok-accent)">Full Rollout</text>
  <line x1="1071.2499" y1="192.6317" x2="1099.375" y2="299.4738" stroke="var(--ok-border)" stroke-width="0.8213" marker-end="url(#arr7)" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <rect x="40" y="40" width="225.0002" height="152.6315" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="152.5" y="107.158" text-anchor="middle" font-size="22.1921" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Build &amp; Test</text>
  <text x="152.5" y="156.0002" text-anchor="middle" font-size="20.1746" font-family="Arial, sans-serif" fill="var(--primary-text)">CI pipeline</text>
  <rect x="330.6251" y="40" width="225.0002" height="152.6315" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="443.1251" y="107.158" text-anchor="middle" font-size="22.1921" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Deploy Canary</text>
  <text x="443.1251" y="156.0002" text-anchor="middle" font-size="20.1746" font-family="Arial, sans-serif" fill="var(--warn-text)">1-5% traffic</text>
  <rect x="621.2501" y="40" width="225.0002" height="152.6315" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="733.7501" y="107.158" text-anchor="middle" font-size="22.1921" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Analyze</text>
  <text x="733.7501" y="156.0002" text-anchor="middle" font-size="20.1746" font-family="Arial, sans-serif" fill="var(--ok-text)">Auto metrics check</text>
  <rect x="911.875" y="40" width="225.0002" height="152.6315" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1024.375" y="107.158" text-anchor="middle" font-size="22.1921" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Promote</text>
  <text x="1024.375" y="156.0002" text-anchor="middle" font-size="20.1746" font-family="Arial, sans-serif" fill="var(--info-text)">Increase traffic</text>
  <line x1="265.0002" y1="116.3158" x2="321.2501" y2="116.3158" stroke="var(--text)" stroke-width="0.8213" marker-end="url(#arrow)" />
  <line x1="555.6249" y1="116.3158" x2="611.8751" y2="116.3158" stroke="var(--text)" stroke-width="0.8213" marker-end="url(#arrow)" />
  <line x1="846.2499" y1="116.3158" x2="902.5" y2="116.3158" stroke="var(--text)" stroke-width="0.8213" marker-end="url(#arrow)" />
  <path d="M 1024.375 192.6317 L 1024.375 345.2631 L 443.1251 345.2631 L 443.1251 207.8949" stroke="var(--warn-border)" stroke-width="0.9644" fill="none" stroke-dasharray="2.8932 1.4466" marker-end="url(#arrow)" />
  <text x="733.7501" y="400.2106" text-anchor="middle" font-size="20.1746" fill="var(--warn-accent)" font-weight="bold" font-family="Arial, sans-serif">Repeat until 100% or rollback</text>
  <rect x="621.2501" y="497.8948" width="225.0002" height="122.1052" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="733.7501" y="574.2107" text-anchor="middle" font-size="22.1921" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Rollback</text>
  <line x1="733.7501" y1="192.6317" x2="733.7501" y2="482.6316" stroke="var(--danger-border)" stroke-width="0.7233" stroke-dasharray="1.9288 1.4466" marker-end="url(#arrow)" />
  <text x="780.6249" y="375.7894" font-size="20.1746" fill="var(--danger-accent)" font-family="Arial, sans-serif">Metrics fail</text>
  <rect x="996.25" y="314.7369" width="243.75" height="122.1052" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1118.1249" y="391.0525" text-anchor="middle" font-size="22.1921" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Full Rollout</text>
  <line x1="1071.2499" y1="192.6317" x2="1099.375" y2="299.4738" stroke="var(--ok-border)" stroke-width="0.8213" marker-end="url(#arrow)" />
</svg>
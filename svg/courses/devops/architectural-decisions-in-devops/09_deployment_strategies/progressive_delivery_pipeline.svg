<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr7" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,25.7143 5.4857,0" fill="#333" />
    </marker>
  </defs>
  <rect x="23.4862" y="49.5413" width="140.9175" height="82.5688" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="93.9449" y="85.8716" text-anchor="middle" font-size="12.9174" font-weight="bold">Build &amp; Test</text>
  <text x="93.9449" y="112.2936" text-anchor="middle" font-size="11.7431">CI pipeline</text>
  <rect x="205.5046" y="49.5413" width="140.9175" height="82.5688" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="275.9633" y="85.8716" text-anchor="middle" font-size="12.9174" font-weight="bold">Deploy Canary</text>
  <text x="275.9633" y="112.2936" text-anchor="middle" font-size="11.7431">1-5% traffic</text>
  <rect x="387.523" y="49.5413" width="140.9175" height="82.5688" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="457.9817" y="85.8716" text-anchor="middle" font-size="12.9174" font-weight="bold">Analyze</text>
  <text x="457.9817" y="112.2936" text-anchor="middle" font-size="11.7431">Auto metrics check</text>
  <rect x="569.5413" y="49.5413" width="140.9175" height="82.5688" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="640" y="85.8716" text-anchor="middle" font-size="12.9174" font-weight="bold">Promote</text>
  <text x="640" y="112.2936" text-anchor="middle" font-size="11.7431">Increase traffic</text>
  <line x1="164.4037" y1="90.8257" x2="199.633" y2="90.8257" stroke="var(--text)" stroke-width="2" marker-end="url(#arr7)" />
  <line x1="346.422" y1="90.8257" x2="381.6514" y2="90.8257" stroke="var(--text)" stroke-width="2" marker-end="url(#arr7)" />
  <line x1="528.4404" y1="90.8257" x2="563.6698" y2="90.8257" stroke="var(--text)" stroke-width="2" marker-end="url(#arr7)" />
  <path d="M 640 132.1101 L 640 214.6789 L 275.9633 214.6789 L 275.9633 140.367" stroke="var(--warn-border)" stroke-width="2.3486" fill="none" stroke-dasharray="7.0459 3.5229" marker-end="url(#arr7)" />
  <text x="457.9817" y="244.4037" text-anchor="middle" font-size="11.7431" fill="var(--warn-accent)" font-weight="bold">Repeat until 100% or rollback</text>
  <rect x="387.523" y="297.2477" width="140.9175" height="66.055" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="457.9817" y="338.5321" text-anchor="middle" font-size="12.9174" font-weight="bold" fill="var(--danger-accent)">Rollback</text>
  <line x1="457.9817" y1="132.1101" x2="457.9817" y2="288.9908" stroke="var(--danger-border)" stroke-width="1.7615" stroke-dasharray="4.6973 3.5229" marker-end="url(#arr7)" />
  <text x="487.3394" y="231.1927" font-size="11.7431" fill="var(--danger-accent)">Metrics fail</text>
  <rect x="622.3854" y="198.1651" width="152.6606" height="66.055" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="698.7156" y="239.4495" text-anchor="middle" font-size="12.9174" font-weight="bold" fill="var(--ok-accent)">Full Rollout</text>
  <line x1="669.3578" y1="132.1101" x2="686.9725" y2="189.9083" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arr7)" />
</svg>
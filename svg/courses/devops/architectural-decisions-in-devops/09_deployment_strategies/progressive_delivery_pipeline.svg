<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr7" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,25.7143 5.4857,0" fill="#333" />
    </marker>
  </defs>
  <rect x="80" y="96.211" width="210.0001" height="123.0468" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="8.9414" />
  <text x="185" y="150.3517" text-anchor="middle" font-size="19.2499" font-weight="bold">Build &amp; Test</text>
  <text x="185" y="189.7267" text-anchor="middle" font-size="17.5">CI pipeline</text>
  <rect x="351.25" y="96.211" width="210.0001" height="123.0468" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="8.9414" />
  <text x="456.25" y="150.3517" text-anchor="middle" font-size="19.2499" font-weight="bold">Deploy Canary</text>
  <text x="456.25" y="189.7267" text-anchor="middle" font-size="17.5">1-5% traffic</text>
  <rect x="622.5" y="96.211" width="210.0001" height="123.0468" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="8.9414" />
  <text x="727.5" y="150.3517" text-anchor="middle" font-size="19.2499" font-weight="bold">Analyze</text>
  <text x="727.5" y="189.7267" text-anchor="middle" font-size="17.5">Auto metrics check</text>
  <rect x="893.7499" y="96.211" width="210.0001" height="123.0468" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="8.9414" />
  <text x="998.7499" y="150.3517" text-anchor="middle" font-size="19.2499" font-weight="bold">Promote</text>
  <text x="998.7499" y="189.7267" text-anchor="middle" font-size="17.5">Increase traffic</text>
  <line x1="290.0001" y1="157.7345" x2="342.5" y2="157.7345" stroke="var(--text)" stroke-width="2" marker-end="url(#arr7)" />
  <line x1="561.2499" y1="157.7345" x2="613.75" y2="157.7345" stroke="var(--text)" stroke-width="2" marker-end="url(#arr7)" />
  <line x1="832.4999" y1="157.7345" x2="885" y2="157.7345" stroke="var(--text)" stroke-width="2" marker-end="url(#arr7)" />
  <path d="M 998.7499 219.2579 L 998.7499 342.3047 L 456.25 342.3047 L 456.25 231.5626" stroke="var(--warn-border)" stroke-width="2.3486" fill="none" stroke-dasharray="7.0459 3.5229" marker-end="url(#arr7)" />
  <text x="727.5" y="386.6016" text-anchor="middle" font-size="17.5" fill="var(--warn-accent)" font-weight="bold">Repeat until 100% or rollback</text>
  <rect x="622.5" y="465.3516" width="210.0001" height="98.4374" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="8.9414" />
  <text x="727.5" y="526.875" text-anchor="middle" font-size="19.2499" font-weight="bold" fill="var(--danger-accent)">Rollback</text>
  <line x1="727.5" y1="219.2579" x2="727.5" y2="453.0468" stroke="var(--danger-border)" stroke-width="1.7615" stroke-dasharray="4.6973 3.5229" marker-end="url(#arr7)" />
  <text x="771.2498" y="366.9141" font-size="17.5" fill="var(--danger-accent)">Metrics fail</text>
  <rect x="972.5" y="317.6953" width="227.5" height="98.4374" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="8.9414" />
  <text x="1086.2498" y="379.2187" text-anchor="middle" font-size="19.2499" font-weight="bold" fill="var(--ok-accent)">Full Rollout</text>
  <line x1="1042.4998" y1="219.2579" x2="1068.7499" y2="305.3907" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arr7)" />
</svg>
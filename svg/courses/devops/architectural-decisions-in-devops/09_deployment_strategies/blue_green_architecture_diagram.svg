<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
  </defs>
  <rect x="54.8571" y="288" width="164.5714" height="82.2857" fill="#e3f2fd" stroke="#1565c0" stroke-width="3.6571" rx="9.1429" />
  <text x="137.1429" y="339.4286" text-anchor="middle" font-size="23.7714" font-weight="bold">Users</text>
  <rect x="365.7143" y="288" width="219.4286" height="82.2857" fill="#fff9c4" stroke="#f9a825" stroke-width="3.6571" rx="9.1429" />
  <text x="475.4286" y="339.4286" text-anchor="middle" font-size="23.7714" font-weight="bold">Load Balancer</text>
  <rect x="786.2857" y="102.8571" width="402.2857" height="144" fill="#bbdefb" stroke="#1565c0" stroke-width="3.6571" rx="14.6286" />
  <text x="987.4286" y="160.4571" text-anchor="middle" font-size="25.6" font-weight="bold" fill="#1565c0">Blue (v1 - Active)</text>
  <text x="987.4286" y="205.7143" text-anchor="middle" font-size="20.1143" fill="#333">Serving live traffic</text>
  <rect x="786.2857" y="411.4286" width="402.2857" height="144" fill="#c8e6c9" stroke="#2e7d32" stroke-width="3.6571" rx="14.6286" />
  <text x="987.4286" y="469.0286" text-anchor="middle" font-size="25.6" font-weight="bold" fill="#2e7d32">Green (v2 - Idle)</text>
  <text x="987.4286" y="514.2857" text-anchor="middle" font-size="20.1143" fill="#333">Deploy &amp; verify here</text>
  <line x1="219.4286" y1="329.1429" x2="356.5714" y2="329.1429" stroke="#333" stroke-width="3.6571" marker-end="url(#arrow)" />
  <line x1="585.1429" y1="318.8571" x2="777.1429" y2="174.8571" stroke="#1565c0" stroke-width="5.4857" marker-end="url(#arrow)" />
  <line x1="585.1429" y1="339.4286" x2="777.1429" y2="483.4286" stroke="#aaa" stroke-width="2.7429" stroke-dasharray="10.9714 7.3143" marker-end="url(#arrow)" />
  <text x="676.5714" y="370.2857" text-anchor="middle" font-size="20.1143" fill="#666">Switch</text>
</svg>
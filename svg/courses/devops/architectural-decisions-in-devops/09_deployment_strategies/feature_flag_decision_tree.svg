<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <rect x="385.7627" y="40" width="406.7796" height="105.4545" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="589.1526" y="105.9089" text-anchor="middle" font-size="26.1983" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Incoming Request</text>
  <rect x="365.4237" y="250.9091" width="447.4576" height="105.4545" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="589.1526" y="316.8181" text-anchor="middle" font-size="26.1983" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Feature Flag ON?</text>
  <rect x="40" y="514.5455" width="366.1017" height="105.4545" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="223.0508" y="580.4545" text-anchor="middle" font-size="26.1983" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">New Code Path (v2)</text>
  <rect x="772.2034" y="514.5455" width="366.1017" height="105.4545" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="955.2543" y="580.4545" text-anchor="middle" font-size="26.1983" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Old Code Path (v1)</text>
  <line x1="589.1526" y1="145.4545" x2="589.1526" y2="237.7272" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="467.1186" y1="356.3636" x2="284.0678" y2="501.3637" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="711.1865" y1="356.3636" x2="894.2373" y2="501.3637" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="324.7457" y="422.2728" text-anchor="middle" font-size="26.1983" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">Yes</text>
  <text x="853.5593" y="422.2728" text-anchor="middle" font-size="26.1983" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">No</text>
  <rect x="955.2543" y="237.7272" width="284.7457" height="131.8181" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1097.6272" y="290.4544" text-anchor="middle" font-size="24.0151" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Flag Service</text>
  <text x="1097.6272" y="335.2727" text-anchor="middle" font-size="21.8318" fill="var(--text-muted)" font-family="Arial, sans-serif">LaunchDarkly, etc.</text>
  <line x1="812.8814" y1="303.6363" x2="945.0847" y2="303.6363" stroke="var(--info-border)" stroke-width="2" stroke-dasharray="7.3143 5.4857" marker-end="url(#arrow)" />
</svg>
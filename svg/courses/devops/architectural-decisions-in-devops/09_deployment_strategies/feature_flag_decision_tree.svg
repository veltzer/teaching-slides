<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr5" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.4857,0" fill="#333" />
    </marker>
  </defs>
  <rect x="402.7119" y="95.0848" width="379.661" height="85.4237" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="592.5424" y="148.4745" text-anchor="middle" font-size="22.7797" font-weight="bold">Incoming Request</text>
  <rect x="383.7288" y="265.9322" width="417.6271" height="85.4237" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="592.5424" y="319.322" text-anchor="middle" font-size="22.7797" font-weight="bold">Feature Flag ON?</text>
  <rect x="80" y="479.4915" width="341.6949" height="85.4237" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="250.8474" y="532.8813" text-anchor="middle" font-size="22.7797" font-weight="bold" fill="var(--ok-accent)">New Code Path (v2)</text>
  <rect x="763.3898" y="479.4915" width="341.6949" height="85.4237" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="934.2373" y="532.8813" text-anchor="middle" font-size="22.7797" font-weight="bold" fill="var(--danger-accent)">Old Code Path (v1)</text>
  <line x1="592.5424" y1="180.5085" x2="592.5424" y2="255.2542" stroke="var(--text)" stroke-width="2" marker-end="url(#arr5)" />
  <line x1="478.644" y1="351.3559" x2="307.7966" y2="468.8136" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arr5)" />
  <line x1="706.4407" y1="351.3559" x2="877.2881" y2="468.8136" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arr5)" />
  <text x="345.7627" y="404.7458" text-anchor="middle" font-size="22.7797" fill="var(--ok-accent)" font-weight="bold">Yes</text>
  <text x="839.322" y="404.7458" text-anchor="middle" font-size="22.7797" fill="var(--danger-accent)" font-weight="bold">No</text>
  <rect x="934.2373" y="255.2542" width="265.7627" height="106.7796" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="1067.1187" y="297.966" text-anchor="middle" font-size="20.8814" font-weight="bold" fill="var(--info-accent)">Flag Service</text>
  <text x="1067.1187" y="334.2712" text-anchor="middle" font-size="18.983" fill="var(--text-muted)">LaunchDarkly, etc.</text>
  <line x1="801.356" y1="308.644" x2="924.7457" y2="308.644" stroke="var(--info-border)" stroke-width="2" stroke-dasharray="7.3143 5.4857" marker-end="url(#arr5)" />
</svg>
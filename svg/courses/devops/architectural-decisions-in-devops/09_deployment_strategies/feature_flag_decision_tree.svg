<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr5" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.4857,0" fill="#333" />
    </marker>
  </defs>
  <rect x="385.7627" y="40" width="406.7796" height="105.4545" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="589.1526" y="105.9089" text-anchor="middle" font-size="26.1983" font-weight="bold">Incoming Request</text>
  <rect x="365.4237" y="250.9091" width="447.4576" height="105.4545" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="589.1526" y="316.8181" text-anchor="middle" font-size="26.1983" font-weight="bold">Feature Flag ON?</text>
  <rect x="40" y="514.5455" width="366.1017" height="105.4545" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="223.0508" y="580.4545" text-anchor="middle" font-size="26.1983" font-weight="bold" fill="var(--ok-accent)">New Code Path (v2)</text>
  <rect x="772.2034" y="514.5455" width="366.1017" height="105.4545" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="955.2543" y="580.4545" text-anchor="middle" font-size="26.1983" font-weight="bold" fill="var(--danger-accent)">Old Code Path (v1)</text>
  <line x1="589.1526" y1="145.4545" x2="589.1526" y2="237.7272" stroke="var(--text)" stroke-width="2" marker-end="url(#arr5)" />
  <line x1="467.1186" y1="356.3636" x2="284.0678" y2="501.3637" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arr5)" />
  <line x1="711.1865" y1="356.3636" x2="894.2373" y2="501.3637" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arr5)" />
  <text x="324.7457" y="422.2728" text-anchor="middle" font-size="26.1983" fill="var(--ok-accent)" font-weight="bold">Yes</text>
  <text x="853.5593" y="422.2728" text-anchor="middle" font-size="26.1983" fill="var(--danger-accent)" font-weight="bold">No</text>
  <rect x="955.2543" y="237.7272" width="284.7457" height="131.8181" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1097.6272" y="290.4544" text-anchor="middle" font-size="24.0151" font-weight="bold" fill="var(--info-accent)">Flag Service</text>
  <text x="1097.6272" y="335.2727" text-anchor="middle" font-size="21.8318" fill="var(--text-muted)">LaunchDarkly, etc.</text>
  <line x1="812.8814" y1="303.6363" x2="945.0847" y2="303.6363" stroke="var(--info-border)" stroke-width="2" stroke-dasharray="7.3143 5.4857" marker-end="url(#arr5)" />
</svg>
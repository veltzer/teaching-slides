<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <line x1="75.8209" y1="290.0598" x2="1240" y2="290.0598" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="40" y="307.4252" text-anchor="end" font-size="21.6127" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">main</text>
  <rect x="152.766" y="277.452" width="25.215" height="25.215" rx="12.6075" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <rect x="510.975" y="277.452" width="25.215" height="25.215" rx="12.6075" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <rect x="869.184" y="277.452" width="25.215" height="25.215" rx="12.6075" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <rect x="1191.57" y="277.452" width="25.215" height="25.215" rx="12.6075" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <line x1="165.3732" y1="290.0598" x2="237.0149" y2="81.6766" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="237.0149" y1="81.6766" x2="344.4776" y2="81.6766" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="344.4776" y1="81.6766" x2="451.9403" y2="81.6766" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="451.9403" y1="81.6766" x2="523.5821" y2="290.0598" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="228.01" y="72.6713" width="18.0106" height="18.0106" rx="9.0053" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <rect x="335.472" y="72.6713" width="18.0106" height="18.0106" rx="9.0053" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <rect x="442.935" y="72.6713" width="18.0106" height="18.0106" rx="9.0053" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="344.4776" y="40" text-anchor="middle" font-size="18.0106" fill="var(--primary-accent)" font-family="Arial, sans-serif">feature/login</text>
  <line x1="523.5821" y1="290.0598" x2="631.0448" y2="533.1736" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="631.0448" y1="533.1736" x2="774.3283" y2="533.1736" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="774.3283" y1="533.1736" x2="881.791" y2="290.0598" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="622.039" y="524.168" width="18.0106" height="18.0106" rx="9.0053" fill="var(--warn-accent)"/>
  <rect x="765.323" y="524.168" width="18.0106" height="18.0106" rx="9.0053" fill="var(--warn-accent)"/>
  <text x="702.6866" y="620" text-anchor="middle" font-size="18.0106" fill="var(--warn-accent)" font-family="Arial, sans-serif">feature/search</text>
  <text x="505.6716" y="237.964" font-size="18.0106" fill="var(--ok-accent)" font-family="Arial, sans-serif">PR merge</text>
  <text x="863.8806" y="237.964" font-size="18.0106" fill="var(--ok-accent)" font-family="Arial, sans-serif">PR merge</text>
</svg>

  <line x1="170.6667" y1="327.2727" x2="238.9333" y2="130.9091" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="238.9333" y1="130.9091" x2="341.3333" y2="130.9091" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="341.3333" y1="130.9091" x2="443.7333" y2="130.9091" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="443.7333" y1="130.9091" x2="512" y2="327.2727" stroke="var(--primary-border)" stroke-width="2" />
  <circle cx="238.9333" cy="130.9091" r="8.5333" fill="var(--primary-fill)" />
  <circle cx="341.3333" cy="130.9091" r="8.5333" fill="var(--primary-fill)" />
  <circle cx="443.7333" cy="130.9091" r="8.5333" fill="var(--primary-fill)" />
  <text x="341.3333" y="91.6364" text-anchor="middle" font-size="17.0667" fill="var(--primary-accent)">feature/login</text>
  <line x1="512" y1="327.2727" x2="614.4" y2="556.3636" stroke="var(--warn-border)" stroke-width="2" />
  <line x1="614.4" y1="556.3636" x2="750.9333" y2="556.3636" stroke="var(--warn-border)" stroke-width="2" />
  <line x1="750.9333" y1="556.3636" x2="853.3333" y2="327.2727" stroke="var(--warn-border)" stroke-width="2" />
  <circle cx="614.4" cy="556.3636" r="8.5333" fill="var(--warn-accent)" />
  <circle cx="750.9333" cy="556.3636" r="8.5333" fill="var(--warn-accent)" />
  <text x="682.6667" y="638.1818" text-anchor="middle" font-size="17.0667" fill="var(--warn-accent)">feature/search</text>
  <text x="494.9333" y="278.1818" font-size="17.0667" fill="var(--ok-accent)">PR merge</text>
  <text x="836.2667" y="278.1818" font-size="17.0667" fill="var(--ok-accent)">PR merge</text>
</svg>
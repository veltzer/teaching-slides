  <line x1="451.9403" y1="81.6766" x2="523.5821" y2="290.0598" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="228.01" y="72.6713" width="18.0106" height="18.0106" rx="9.0053" fill="var(--primary-fill)" filter="url(#shadow)"/>
  <rect x="335.472" y="72.6713" width="18.0106" height="18.0106" rx="9.0053" fill="var(--primary-fill)" filter="url(#shadow)"/>
  <rect x="442.935" y="72.6713" width="18.0106" height="18.0106" rx="9.0053" fill="var(--primary-fill)" filter="url(#shadow)"/>

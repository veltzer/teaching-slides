<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="366.6667" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="223.3334" y="119.0909" text-anchor="middle" font-weight="bold" font-size="21.3927" font-family="Arial, sans-serif" fill="var(--primary-text)">Repository Structure</text>
  <text x="223.3334" y="198.1819" text-anchor="middle" font-size="18.1015" font-family="Arial, sans-serif" fill="var(--primary-text)">Monorepo / Polyrepo</text>
  <text x="223.3334" y="250.9091" text-anchor="middle" font-size="18.1015" font-family="Arial, sans-serif" fill="var(--primary-text)">Hybrid</text>
  <rect x="456.6667" y="40" width="366.6667" height="580" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="119.0909" text-anchor="middle" font-weight="bold" font-size="21.3927" font-family="Arial, sans-serif" fill="var(--danger-text)">Branching Model</text>
  <text x="639.9999" y="198.1819" text-anchor="middle" font-size="18.1015" font-family="Arial, sans-serif" fill="var(--danger-text)">Trunk-based</text>
  <text x="639.9999" y="250.9091" text-anchor="middle" font-size="18.1015" font-family="Arial, sans-serif" fill="var(--danger-text)">Feature branching</text>
  <text x="639.9999" y="303.6364" text-anchor="middle" font-size="18.1015" font-family="Arial, sans-serif" fill="var(--danger-text)">Git Flow</text>
  <rect x="873.3333" y="40" width="366.6667" height="580" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1056.6667" y="119.0909" text-anchor="middle" font-weight="bold" font-size="21.3927" font-family="Arial, sans-serif" fill="var(--ok-text)">Ownership Model</text>
  <text x="1056.6667" y="198.1819" text-anchor="middle" font-size="18.1015" font-family="Arial, sans-serif" fill="var(--ok-text)">CODEOWNERS</text>
  <text x="1056.6667" y="250.9091" text-anchor="middle" font-size="18.1015" font-family="Arial, sans-serif" fill="var(--ok-text)">Review policies</text>
  <text x="1056.6667" y="303.6364" text-anchor="middle" font-size="18.1015" font-family="Arial, sans-serif" fill="var(--ok-text)">Merge policies</text>
  <line x1="406.6667" y1="330" x2="456.6667" y2="330" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="823.3333" y1="330" x2="873.3333" y2="330" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <text x="223.3334" y="488.1818" text-anchor="middle" font-size="16.4559" fill="var(--text-muted)" font-family="Arial, sans-serif">Shapes CI/CD</text>
  <text x="223.3334" y="540.9091" text-anchor="middle" font-size="16.4559" fill="var(--text-muted)" font-family="Arial, sans-serif">and dependencies</text>
  <text x="639.9999" y="488.1818" text-anchor="middle" font-size="16.4559" fill="var(--text-muted)" font-family="Arial, sans-serif">Shapes release</text>
  <text x="639.9999" y="540.9091" text-anchor="middle" font-size="16.4559" fill="var(--text-muted)" font-family="Arial, sans-serif">cadence</text>
  <text x="1056.6667" y="488.1818" text-anchor="middle" font-size="16.4559" fill="var(--text-muted)" font-family="Arial, sans-serif">Shapes quality</text>
  <text x="1056.6667" y="540.9091" text-anchor="middle" font-size="16.4559" fill="var(--text-muted)" font-family="Arial, sans-serif">and accountability</text>
</svg>
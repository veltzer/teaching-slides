<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="32.8691" y="53.3333" width="361.5605" height="586.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="213.6494" y="133.3333" text-anchor="middle" font-weight="bold" font-size="21.365">Repository Structure</text>
  <text x="213.6494" y="213.3334" text-anchor="middle" font-size="18.078">Monorepo / Polyrepo</text>
  <text x="213.6494" y="266.6667" text-anchor="middle" font-size="18.078">Hybrid</text>
  <rect x="443.7333" y="53.3333" width="361.5605" height="586.6667" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="624.5135" y="133.3333" text-anchor="middle" font-weight="bold" font-size="21.365">Branching Model</text>
  <text x="624.5135" y="213.3334" text-anchor="middle" font-size="18.078">Trunk-based</text>
  <text x="624.5135" y="266.6667" text-anchor="middle" font-size="18.078">Feature branching</text>
  <text x="624.5135" y="320" text-anchor="middle" font-size="18.078">Git Flow</text>
  <rect x="854.5975" y="53.3333" width="361.5605" height="586.6667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1035.3778" y="133.3333" text-anchor="middle" font-weight="bold" font-size="21.365">Ownership Model</text>
  <text x="1035.3778" y="213.3334" text-anchor="middle" font-size="18.078">CODEOWNERS</text>
  <text x="1035.3778" y="266.6667" text-anchor="middle" font-size="18.078">Review policies</text>
  <text x="1035.3778" y="320" text-anchor="middle" font-size="18.078">Merge policies</text>
  <line x1="394.4296" y1="346.6667" x2="443.7333" y2="346.6667" stroke="var(--text)" stroke-width="2" marker-end="url(#arr2)" />
  <line x1="805.2938" y1="346.6667" x2="854.5975" y2="346.6667" stroke="var(--text)" stroke-width="2" marker-end="url(#arr2)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 17.0667 13.8462 L 0 27.6923 z" fill="#333" />
    </marker>
  </defs>
  <text x="213.6494" y="506.6666" text-anchor="middle" font-size="16.4346" fill="var(--text-muted)">Shapes CI/CD</text>
  <text x="213.6494" y="560" text-anchor="middle" font-size="16.4346" fill="var(--text-muted)">and dependencies</text>
  <text x="624.5135" y="506.6666" text-anchor="middle" font-size="16.4346" fill="var(--text-muted)">Shapes release</text>
  <text x="624.5135" y="560" text-anchor="middle" font-size="16.4346" fill="var(--text-muted)">cadence</text>
  <text x="1035.3778" y="506.6666" text-anchor="middle" font-size="16.4346" fill="var(--text-muted)">Shapes quality</text>
  <text x="1035.3778" y="560" text-anchor="middle" font-size="16.4346" fill="var(--text-muted)">and accountability</text>
</svg>
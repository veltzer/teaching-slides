<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="310.4225" y="151.7429" text-anchor="middle" font-size="21.9718" font-weight="bold">Release Branch</text>
  <line x1="56.9015" y1="265.8274" x2="597.7465" y2="265.8274" stroke="var(--ok-border)" stroke-width="2" />
  <text x="40" y="280.088" text-anchor="end" font-size="16.9015" fill="var(--ok-accent)">main</text>
  <circle cx="141.4085" cy="265.8274" r="8.4507" fill="var(--ok-fill)" />
  <circle cx="310.4225" cy="265.8274" r="8.4507" fill="var(--ok-fill)" />
  <circle cx="479.4367" cy="265.8274" r="8.4507" fill="var(--ok-fill)" />
  <line x1="225.9155" y1="265.8274" x2="259.7184" y2="436.9542" stroke="var(--danger-border)" stroke-width="2" />
  <line x1="259.7184" y1="436.9542" x2="445.6339" y2="436.9542" stroke="var(--danger-border)" stroke-width="2" />
  <circle cx="259.7184" cy="436.9542" r="6.7606" fill="var(--danger-fill)" />
  <circle cx="344.2253" cy="436.9542" r="6.7606" fill="var(--danger-fill)" />
  <circle cx="445.6339" cy="436.9542" r="6.7606" fill="var(--danger-fill)" />
  <text x="352.6761" y="508.2571" text-anchor="middle" font-size="16.9015" fill="var(--danger-accent)">release/1.0</text>
  <text x="344.2253" y="402.7288" text-anchor="middle" font-size="16.9015" fill="var(--text-faint)">bugfixes only</text>
  <text x="969.5775" y="151.7429" text-anchor="middle" font-size="21.9718" font-weight="bold">Release from Trunk</text>
  <line x1="699.1549" y1="265.8274" x2="1240" y2="265.8274" stroke="var(--ok-border)" stroke-width="2" />
  <text x="682.2536" y="280.088" text-anchor="end" font-size="16.9015" fill="var(--ok-accent)">main</text>
  <circle cx="783.662" cy="265.8274" r="8.4507" fill="var(--ok-fill)" />
  <circle cx="918.8733" cy="265.8274" r="8.4507" fill="var(--ok-fill)" />
  <circle cx="1054.0845" cy="265.8274" r="8.4507" fill="var(--ok-fill)" />
  <circle cx="1189.2958" cy="265.8274" r="8.4507" fill="var(--ok-fill)" />
  <rect x="893.5212" y="308.6091" width="50.7043" height="51.3381" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="918.8733" y="345.6866" text-anchor="middle" font-size="16.9015" fill="var(--text)">tag</text>
  <text x="918.8733" y="408.4331" text-anchor="middle" font-size="16.9015" fill="var(--warn-accent)">v1.0</text>
  <rect x="1163.9437" y="308.6091" width="50.7043" height="51.3381" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1189.2958" y="345.6866" text-anchor="middle" font-size="16.9015" fill="var(--text)">tag</text>
  <text x="1189.2958" y="408.4331" text-anchor="middle" font-size="16.9015" fill="var(--warn-accent)">v1.1</text>
  <text x="969.5775" y="508.2571" text-anchor="middle" font-size="16.9015" fill="var(--text-muted)">Tag commits on main for releases</text>
</svg>
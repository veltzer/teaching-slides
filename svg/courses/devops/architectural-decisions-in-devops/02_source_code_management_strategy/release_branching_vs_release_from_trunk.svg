<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="590" height="580" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="335" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--text)">Release Branch</text>

  <line x1="80" y1="200" x2="600" y2="200" stroke="var(--ok-border)" stroke-width="3"/>
  <text x="50" y="205" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-accent)">main</text>
  <rect x="129" y="189" width="22" height="22" rx="11" fill="url(#grad-ok)"/>
  <rect x="249" y="189" width="22" height="22" rx="11" fill="url(#grad-ok)"/>
  <rect x="369" y="189" width="22" height="22" rx="11" fill="url(#grad-ok)"/>
  <rect x="489" y="189" width="22" height="22" rx="11" fill="url(#grad-ok)"/>

  <line x1="260" y1="200" x2="290" y2="350" stroke="var(--danger-border)" stroke-width="2"/>
  <line x1="290" y1="350" x2="560" y2="350" stroke="var(--danger-border)" stroke-width="3"/>
  <rect x="281" y="341" width="18" height="18" rx="9" fill="url(#grad-danger)"/>
  <rect x="391" y="341" width="18" height="18" rx="9" fill="url(#grad-danger)"/>
  <rect x="491" y="341" width="18" height="18" rx="9" fill="url(#grad-danger)"/>
  <rect x="551" y="341" width="18" height="18" rx="9" fill="url(#grad-danger)"/>
  <text x="335" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">release/1.0 — bugfixes only, backport or cherry-pick</text>

  <text x="335" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Stabilize in isolation</text>
  <text x="335" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Long-lived branch, patch releases without blocking main</text>
  <text x="335" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Cost: merge/cherry-pick overhead, divergence risk</text>
  <text x="335" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Common in shipped software and firmware</text>
  <text x="335" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)">Every release line needs active maintenance</text>

  <rect x="660" y="40" width="580" height="580" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="950" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--text)">Release from Trunk</text>

  <line x1="700" y1="250" x2="1220" y2="250" stroke="var(--ok-border)" stroke-width="3"/>
  <text x="670" y="255" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-accent)">main</text>
  <rect x="749" y="239" width="22" height="22" rx="11" fill="url(#grad-ok)"/>
  <rect x="879" y="239" width="22" height="22" rx="11" fill="url(#grad-ok)"/>
  <rect x="1009" y="239" width="22" height="22" rx="11" fill="url(#grad-ok)"/>
  <rect x="1139" y="239" width="22" height="22" rx="11" fill="url(#grad-ok)"/>

  <rect x="865" y="290" width="50" height="50" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="890" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">tag</text>
  <text x="890" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-accent)">v1.0</text>

  <rect x="1125" y="290" width="50" height="50" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1150" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">tag</text>
  <text x="1150" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-accent)">v1.1</text>

  <text x="950" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Ship from main, tag the release</text>
  <text x="950" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Roll forward with feature flags instead of backporting</text>
  <text x="950" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Requires strong CI, fast rollback, gradual rollout</text>
  <text x="950" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Common in web and SaaS</text>
  <text x="950" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)">Only one line to maintain; less branch hygiene work</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
  </defs>

  <rect x="40" y="40" width="590" height="580" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="335" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--text)">Release Branch</text>

  <line x1="80" y1="200" x2="600" y2="200" stroke="var(--ok-border)" stroke-width="3"/>
  <text x="50" y="205" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-accent)">main</text>
  <circle cx="140" cy="200" r="11" fill="var(--ok-fill)"/>
  <circle cx="260" cy="200" r="11" fill="var(--ok-fill)"/>
  <circle cx="380" cy="200" r="11" fill="var(--ok-fill)"/>
  <circle cx="500" cy="200" r="11" fill="var(--ok-fill)"/>

  <line x1="260" y1="200" x2="290" y2="350" stroke="var(--danger-border)" stroke-width="2"/>
  <line x1="290" y1="350" x2="560" y2="350" stroke="var(--danger-border)" stroke-width="3"/>
  <circle cx="290" cy="350" r="9" fill="var(--danger-fill)"/>
  <circle cx="400" cy="350" r="9" fill="var(--danger-fill)"/>
  <circle cx="500" cy="350" r="9" fill="var(--danger-fill)"/>
  <circle cx="560" cy="350" r="9" fill="var(--danger-fill)"/>
  <text x="335" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">release/1.0 — bugfixes only, backport or cherry-pick</text>

  <text x="335" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Stabilize in isolation</text>
  <text x="335" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Long-lived branch, patch releases without blocking main</text>
  <text x="335" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Cost: merge/cherry-pick overhead, divergence risk</text>
  <text x="335" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Common in shipped software and firmware</text>
  <text x="335" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)">Every release line needs active maintenance</text>

  <rect x="660" y="40" width="580" height="580" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="950" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--text)">Release from Trunk</text>

  <line x1="700" y1="250" x2="1220" y2="250" stroke="var(--ok-border)" stroke-width="3"/>
  <text x="670" y="255" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-accent)">main</text>
  <circle cx="760" cy="250" r="11" fill="var(--ok-fill)"/>
  <circle cx="890" cy="250" r="11" fill="var(--ok-fill)"/>
  <circle cx="1020" cy="250" r="11" fill="var(--ok-fill)"/>
  <circle cx="1150" cy="250" r="11" fill="var(--ok-fill)"/>

  <rect x="865" y="290" width="50" height="50" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="890" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">tag</text>
  <text x="890" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-accent)">v1.0</text>

  <rect x="1125" y="290" width="50" height="50" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1150" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">tag</text>
  <text x="1150" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-accent)">v1.1</text>

  <text x="950" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Ship from main, tag the release</text>
  <text x="950" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Roll forward with feature flags instead of backporting</text>
  <text x="950" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Requires strong CI, fast rollback, gradual rollout</text>
  <text x="950" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Common in web and SaaS</text>
  <text x="950" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)">Only one line to maintain; less branch hygiene work</text>
</svg>

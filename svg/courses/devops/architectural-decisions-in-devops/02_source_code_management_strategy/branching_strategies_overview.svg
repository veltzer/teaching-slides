<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="70" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--text)">Branching Strategies: Spectrum of Complexity</text>
  <rect x="40" y="100" width="285" height="440" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="182" y="150" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--ok-text)">Trunk-Based</text>
  <text x="182" y="185" text-anchor="middle" font-size="15" fill="var(--ok-text)">Simplest</text>
  <text x="182" y="250" text-anchor="middle" font-size="15" fill="var(--ok-text)">One main branch</text>
  <text x="182" y="295" text-anchor="middle" font-size="15" fill="var(--ok-text)">Short-lived branches</text>
  <text x="182" y="340" text-anchor="middle" font-size="15" fill="var(--ok-text)">Strong CI/CD</text>
  <text x="182" y="410" text-anchor="middle" font-size="14" fill="var(--ok-text)">Fast feedback</text>
  <rect x="345" y="100" width="285" height="440" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="487" y="150" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--primary-text)">GitHub Flow</text>
  <text x="487" y="185" text-anchor="middle" font-size="15" fill="var(--primary-text)">Lightweight</text>
  <text x="487" y="250" text-anchor="middle" font-size="15" fill="var(--primary-text)">main + features</text>
  <text x="487" y="295" text-anchor="middle" font-size="15" fill="var(--primary-text)">PR then merge</text>
  <text x="487" y="340" text-anchor="middle" font-size="15" fill="var(--primary-text)">Continuous deploy</text>
  <text x="487" y="410" text-anchor="middle" font-size="14" fill="var(--primary-text)">Small web teams</text>
  <rect x="650" y="100" width="285" height="440" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="792" y="150" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--warn-text)">GitLab Flow</text>
  <text x="792" y="185" text-anchor="middle" font-size="15" fill="var(--warn-text)">Env-aware</text>
  <text x="792" y="250" text-anchor="middle" font-size="15" fill="var(--warn-text)">main + staging + prod</text>
  <text x="792" y="295" text-anchor="middle" font-size="15" fill="var(--warn-text)">Upstream merges</text>
  <text x="792" y="340" text-anchor="middle" font-size="15" fill="var(--warn-text)">Release trains</text>
  <text x="792" y="410" text-anchor="middle" font-size="14" fill="var(--warn-text)">Medium teams</text>
  <rect x="955" y="100" width="285" height="440" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1097" y="150" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--danger-text)">Git Flow</text>
  <text x="1097" y="185" text-anchor="middle" font-size="15" fill="var(--danger-text)">Most complex</text>
  <text x="1097" y="250" text-anchor="middle" font-size="15" fill="var(--danger-text)">main + develop + ...</text>
  <text x="1097" y="295" text-anchor="middle" font-size="15" fill="var(--danger-text)">release, hotfix</text>
  <text x="1097" y="340" text-anchor="middle" font-size="15" fill="var(--danger-text)">Versioned releases</text>
  <text x="1097" y="410" text-anchor="middle" font-size="14" fill="var(--danger-text)">Large or regulated</text>
  <line x1="40" y1="580" x2="1240" y2="580" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="100" y="615" text-anchor="middle" font-size="15" fill="var(--text-muted)">High CI/CD maturity</text>
  <text x="1180" y="615" text-anchor="middle" font-size="15" fill="var(--text-muted)">Heavier process</text>
</svg>

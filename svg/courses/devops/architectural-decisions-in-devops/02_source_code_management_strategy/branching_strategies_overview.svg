<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="285" height="495.533981311999" rx="6.367392785863" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="182" y="96.310679478085" text-anchor="middle" font-size="23.347106881496" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Trunk-Based</text>
  <text x="182" y="135.728154795268" text-anchor="middle" font-size="15.918481450299" fill="var(--ok-text)" font-family="Arial, sans-serif">Simplest</text>
  <text x="182" y="208.932038434254" text-anchor="middle" font-size="15.918481450299" fill="var(--ok-text)" font-family="Arial, sans-serif">One main branch</text>
  <text x="182" y="259.611649858705" text-anchor="middle" font-size="15.918481450299" fill="var(--ok-text)" font-family="Arial, sans-serif">Short-lived branches</text>
  <text x="182" y="310.291262341408" text-anchor="middle" font-size="15.918481450299" fill="var(--ok-text)" font-family="Arial, sans-serif">Strong CI/CD</text>
  <text x="182" y="389.126212975775" text-anchor="middle" font-size="14.857249833679" fill="var(--ok-text)" font-family="Arial, sans-serif">Fast feedback</text>
  <rect x="345" y="40" width="285" height="495.533981311999" rx="6.367392785863" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="487" y="96.310679478085" text-anchor="middle" font-size="23.347106881496" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">GitHub Flow</text>
  <text x="487" y="135.728154795268" text-anchor="middle" font-size="15.918481450299" fill="var(--primary-text)" font-family="Arial, sans-serif">Lightweight</text>
  <text x="487" y="208.932038434254" text-anchor="middle" font-size="15.918481450299" fill="var(--primary-text)" font-family="Arial, sans-serif">main + features</text>
  <text x="487" y="259.611649858705" text-anchor="middle" font-size="15.918481450299" fill="var(--primary-text)" font-family="Arial, sans-serif">PR then merge</text>
  <text x="487" y="310.291262341408" text-anchor="middle" font-size="15.918481450299" fill="var(--primary-text)" font-family="Arial, sans-serif">Continuous deploy</text>
  <text x="487" y="389.126212975775" text-anchor="middle" font-size="14.857249833679" fill="var(--primary-text)" font-family="Arial, sans-serif">Small web teams</text>
  <rect x="650" y="40" width="285" height="495.533981311999" rx="6.367392785863" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="792" y="96.310679478085" text-anchor="middle" font-size="23.347106881496" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">GitLab Flow</text>
  <text x="792" y="135.728154795268" text-anchor="middle" font-size="15.918481450299" fill="var(--warn-text)" font-family="Arial, sans-serif">Env-aware</text>
  <text x="792" y="208.932038434254" text-anchor="middle" font-size="15.918481450299" fill="var(--warn-text)" font-family="Arial, sans-serif">main + staging + prod</text>
  <text x="792" y="259.611649858705" text-anchor="middle" font-size="15.918481450299" fill="var(--warn-text)" font-family="Arial, sans-serif">Upstream merges</text>
  <text x="792" y="310.291262341408" text-anchor="middle" font-size="15.918481450299" fill="var(--warn-text)" font-family="Arial, sans-serif">Release trains</text>
  <text x="792" y="389.126212975775" text-anchor="middle" font-size="14.857249833679" fill="var(--warn-text)" font-family="Arial, sans-serif">Medium teams</text>
  <rect x="955" y="40" width="285" height="495.533981311999" rx="6.367392785863" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097" y="96.310679478085" text-anchor="middle" font-size="23.347106881496" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Git Flow</text>
  <text x="1097" y="135.728154795268" text-anchor="middle" font-size="15.918481450299" fill="var(--danger-text)" font-family="Arial, sans-serif">Most complex</text>
  <text x="1097" y="208.932038434254" text-anchor="middle" font-size="15.918481450299" fill="var(--danger-text)" font-family="Arial, sans-serif">main + develop + ...</text>
  <text x="1097" y="259.611649858705" text-anchor="middle" font-size="15.918481450299" fill="var(--danger-text)" font-family="Arial, sans-serif">release, hotfix</text>
  <text x="1097" y="310.291262341408" text-anchor="middle" font-size="15.918481450299" fill="var(--danger-text)" font-family="Arial, sans-serif">Versioned releases</text>
  <text x="1097" y="389.126212975775" text-anchor="middle" font-size="14.857249833679" fill="var(--danger-text)" font-family="Arial, sans-serif">Large or regulated</text>
  <line x1="40" y1="580.582524682816" x2="1240" y2="580.582524682816" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="100" y="620" text-anchor="middle" font-size="15.918481450299" fill="var(--text-muted)" font-family="Arial, sans-serif">High CI/CD maturity</text>
  <text x="1180" y="620" text-anchor="middle" font-size="15.918481450299" fill="var(--text-muted)" font-family="Arial, sans-serif">Heavier process</text>
</svg>

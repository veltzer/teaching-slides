  <rect x="686.1539" y="40" width="553.8461" height="580" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="963.0769" y="102.1429" text-anchor="middle" font-weight="bold" font-size="23.3213">Polyrepo</text>

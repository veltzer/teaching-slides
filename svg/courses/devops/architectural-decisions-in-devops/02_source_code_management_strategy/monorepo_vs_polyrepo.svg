<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="538.4615" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="309.2308" y="102.1429" text-anchor="middle" font-weight="bold" font-size="23.3213" font-family="Arial, sans-serif" fill="var(--primary-text)">Monorepo</text>
  <rect x="86.1539" y="143.5714" width="446.1538" height="103.5714" rx="6" fill="var(--bg)" stroke="var(--text-muted)" stroke-width="1.4713" />
  <text x="309.2308" y="205.7143" text-anchor="middle" font-size="18.9485" font-family="Arial, sans-serif" fill="var(--primary-text)">Single Repository</text>
  <rect x="101.5385" y="288.5715" width="123.0769" height="82.8572" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="163.077" y="340.3572" text-anchor="middle" font-size="16.0334" font-family="Arial, sans-serif" fill="var(--primary-text)">Service A</text>
  <rect x="247.6923" y="288.5715" width="123.0769" height="82.8572" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="309.2308" y="340.3572" text-anchor="middle" font-size="16.0334" font-family="Arial, sans-serif" fill="var(--primary-text)">Service B</text>
  <rect x="393.8461" y="288.5715" width="123.0769" height="82.8572" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="455.3846" y="340.3572" text-anchor="middle" font-size="16.0334" font-family="Arial, sans-serif" fill="var(--primary-text)">Lib C</text>
  <rect x="101.5385" y="412.8571" width="415.3846" height="82.8572" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="309.2308" y="464.6429" text-anchor="middle" font-size="16.0334" font-family="Arial, sans-serif" fill="var(--ok-text)">Shared tooling &amp; config</text>
  <rect x="686.1539" y="40" width="553.8461" height="580" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="963.0769" y="102.1429" text-anchor="middle" font-weight="bold" font-size="23.3213" font-family="Arial, sans-serif" fill="var(--danger-text)">Polyrepo</text>
  <rect x="716.9231" y="143.5714" width="153.8461" height="145" rx="6" fill="var(--bg)" stroke="var(--text-muted)" stroke-width="1.4713" />
  <text x="793.8462" y="205.7143" text-anchor="middle" font-size="16.0334" font-family="Arial, sans-serif" fill="var(--danger-text)">repo-</text>
  <text x="793.8462" y="236.7857" text-anchor="middle" font-size="16.0334" font-family="Arial, sans-serif" fill="var(--danger-text)">service-a</text>
  <rect x="901.5384" y="143.5714" width="153.8461" height="145" rx="6" fill="var(--bg)" stroke="var(--text-muted)" stroke-width="1.4713" />
  <text x="978.4615" y="205.7143" text-anchor="middle" font-size="16.0334" font-family="Arial, sans-serif" fill="var(--danger-text)">repo-</text>
  <text x="978.4615" y="236.7857" text-anchor="middle" font-size="16.0334" font-family="Arial, sans-serif" fill="var(--danger-text)">service-b</text>
  <rect x="716.9231" y="330" width="153.8461" height="145" rx="6" fill="var(--bg)" stroke="var(--text-muted)" stroke-width="1.4713" />
  <text x="793.8462" y="392.1429" text-anchor="middle" font-size="16.0334" font-family="Arial, sans-serif" fill="var(--danger-text)">repo-</text>
  <text x="793.8462" y="423.2142" text-anchor="middle" font-size="16.0334" font-family="Arial, sans-serif" fill="var(--danger-text)">lib-c</text>
  <rect x="901.5384" y="330" width="153.8461" height="145" rx="6" fill="var(--bg)" stroke="var(--text-muted)" stroke-width="1.4713" />
  <text x="978.4615" y="392.1429" text-anchor="middle" font-size="16.0334" font-family="Arial, sans-serif" fill="var(--danger-text)">repo-</text>
  <text x="978.4615" y="423.2142" text-anchor="middle" font-size="16.0334" font-family="Arial, sans-serif" fill="var(--danger-text)">infra</text>
</svg>
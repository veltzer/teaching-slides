  <rect x="393.8461" y="288.5715" width="123.0769" height="82.8572" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="455.3846" y="340.3572" text-anchor="middle" font-size="16.0334">Lib C</text>

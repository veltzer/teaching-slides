<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <line x1="75.8209" y1="288.5714" x2="1240" y2="288.5714" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="40" y="309.2857" text-anchor="end" font-size="21.3515" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">main</text>
  <rect x="188.739" y="276.116" width="24.9102" height="24.9102" rx="12.4551" fill="url(#grad-ok)"/>
  <rect x="385.754" y="276.116" width="24.9102" height="24.9102" rx="12.4551" fill="url(#grad-ok)"/>
  <rect x="582.769" y="276.116" width="24.9102" height="24.9102" rx="12.4551" fill="url(#grad-ok)"/>
  <rect x="779.784" y="276.116" width="24.9102" height="24.9102" rx="12.4551" fill="url(#grad-ok)"/>
  <rect x="976.799" y="276.116" width="24.9102" height="24.9102" rx="12.4551" fill="url(#grad-ok)"/>
  <rect x="1173.81" y="276.116" width="24.9102" height="24.9102" rx="12.4551" fill="url(#grad-ok)"/>
  <line x1="398.2089" y1="288.5714" x2="451.9402" y2="81.4285" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="443.044" y="72.5321" width="17.7928" height="17.7928" rx="8.8964" fill="url(#grad-primary)"/>
  <rect x="514.686" y="72.5321" width="17.7928" height="17.7928" rx="8.8964" fill="url(#grad-primary)"/>
  <line x1="451.9402" y1="81.4285" x2="523.5821" y2="81.4285" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="523.5821" y1="81.4285" x2="595.224" y2="288.5714" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="487.7612" y="40" text-anchor="middle" font-size="17.793" fill="var(--primary-accent)" font-family="Arial, sans-serif">short branch</text>
  <text x="201.194" y="412.8571" text-anchor="middle" font-size="17.793" font-family="Arial, sans-serif" fill="var(--text)">commit</text>
  <text x="792.2388" y="412.8571" text-anchor="middle" font-size="17.793" font-family="Arial, sans-serif" fill="var(--text)">commit</text>
  <text x="1186.2687" y="412.8571" text-anchor="middle" font-size="17.793" font-family="Arial, sans-serif" fill="var(--text)">commit</text>
  <text x="657.9104" y="620" text-anchor="middle" font-size="21.3515" fill="var(--text-muted)" font-family="Arial, sans-serif">Developers commit directly or merge very short branches</text>
</svg>

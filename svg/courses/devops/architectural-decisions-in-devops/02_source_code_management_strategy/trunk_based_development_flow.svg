<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <line x1="75.8209" y1="288.5714" x2="1240" y2="288.5714" stroke="var(--ok-border)" stroke-width="2" />
  <text x="40" y="309.2857" text-anchor="end" font-size="21.3515" font-weight="bold" fill="var(--ok-accent)">main</text>
  <rect x="188.739" y="276.116" width="24.9102" height="24.9102" rx="12.4551" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <rect x="385.754" y="276.116" width="24.9102" height="24.9102" rx="12.4551" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <rect x="582.769" y="276.116" width="24.9102" height="24.9102" rx="12.4551" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <rect x="779.784" y="276.116" width="24.9102" height="24.9102" rx="12.4551" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <rect x="976.799" y="276.116" width="24.9102" height="24.9102" rx="12.4551" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <rect x="1173.81" y="276.116" width="24.9102" height="24.9102" rx="12.4551" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <line x1="398.2089" y1="288.5714" x2="451.9402" y2="81.4285" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="443.044" y="72.5321" width="17.7928" height="17.7928" rx="8.8964" fill="var(--primary-fill)" filter="url(#shadow)"/>
  <rect x="514.686" y="72.5321" width="17.7928" height="17.7928" rx="8.8964" fill="var(--primary-fill)" filter="url(#shadow)"/>
  <line x1="451.9402" y1="81.4285" x2="523.5821" y2="81.4285" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="523.5821" y1="81.4285" x2="595.224" y2="288.5714" stroke="var(--primary-border)" stroke-width="2" />
  <text x="487.7612" y="40" text-anchor="middle" font-size="17.793" fill="var(--primary-accent)">short branch</text>
  <text x="201.194" y="412.8571" text-anchor="middle" font-size="17.793">commit</text>
  <text x="792.2388" y="412.8571" text-anchor="middle" font-size="17.793">commit</text>
  <text x="1186.2687" y="412.8571" text-anchor="middle" font-size="17.793">commit</text>
  <text x="657.9104" y="620" text-anchor="middle" font-size="21.3515" fill="var(--text-muted)">Developers commit directly or merge very short branches</text>
</svg>
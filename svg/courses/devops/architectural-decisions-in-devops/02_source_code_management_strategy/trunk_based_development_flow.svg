<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <line x1="80.3137" y1="338.8235" x2="1124.3922" y2="338.8235" stroke="var(--ok-border)" stroke-width="2" />
  <text x="48.1882" y="357.6471" text-anchor="end" font-size="19.2753" font-weight="bold" fill="var(--ok-accent)">main</text>
  <circle cx="192.7529" cy="338.8235" r="11.244" fill="var(--ok-fill)" />
  <circle cx="369.4431" cy="338.8235" r="11.244" fill="var(--ok-fill)" />
  <circle cx="546.1334" cy="338.8235" r="11.244" fill="var(--ok-fill)" />
  <circle cx="722.8235" cy="338.8235" r="11.244" fill="var(--ok-fill)" />
  <circle cx="899.5137" cy="338.8235" r="11.244" fill="var(--ok-fill)" />
  <circle cx="1076.204" cy="338.8235" r="11.244" fill="var(--ok-fill)" />
  <line x1="369.4431" y1="338.8235" x2="417.6313" y2="150.5882" stroke="var(--primary-border)" stroke-width="2" />
  <circle cx="417.6313" cy="150.5882" r="8.0313" fill="var(--primary-fill)" />
  <circle cx="481.8824" cy="150.5882" r="8.0313" fill="var(--primary-fill)" />
  <line x1="417.6313" y1="150.5882" x2="481.8824" y2="150.5882" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="481.8824" y1="150.5882" x2="546.1334" y2="338.8235" stroke="var(--primary-border)" stroke-width="2" />
  <text x="449.7569" y="112.9412" text-anchor="middle" font-size="16.0628" fill="var(--primary-accent)">short branch</text>
  <text x="192.7529" y="451.7647" text-anchor="middle" font-size="16.0628">commit</text>
  <text x="722.8235" y="451.7647" text-anchor="middle" font-size="16.0628">commit</text>
  <text x="1076.204" y="451.7647" text-anchor="middle" font-size="16.0628">commit</text>
  <text x="602.3529" y="640" text-anchor="middle" font-size="19.2753" fill="var(--text-muted)">Developers commit directly or merge very short branches</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="173.913" height="118.974276988821" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.300183217152" filter="url(#shadow)"/>
  <text x="126.9565" y="114.359019592374" text-anchor="middle" font-size="21.097213533169" font-family="Arial, sans-serif" fill="var(--primary-text)">Dev (Team A)</text>
  <rect x="40" y="218.461470611438" width="173.913" height="118.974276988821" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.300183217152" filter="url(#shadow)"/>
  <text x="126.9565" y="292.820490203813" text-anchor="middle" font-size="21.097213533169" font-family="Arial, sans-serif" fill="var(--primary-text)">Dev (Team B)</text>
  <line x1="213.9131" y1="99.487193622617" x2="326.9565" y2="218.461470611438" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="213.9131" y1="277.948774490468" x2="326.9565" y2="218.461470611438" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="335.6522" y="158.974276988821" width="173.913" height="118.974276988821" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.300183217152" filter="url(#shadow)"/>
  <text x="422.6087" y="233.333296581196" text-anchor="middle" font-size="21.097213533169" font-family="Arial, sans-serif" fill="var(--ok-text)">QA</text>
  <line x1="509.5652" y1="218.461470611438" x2="622.6087" y2="218.461470611438" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="631.3044" y="158.974276988821" width="173.913" height="118.974276988821" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.300183217152" filter="url(#shadow)"/>
  <text x="718.2609" y="233.333296581196" text-anchor="middle" font-size="21.097213533169" font-family="Arial, sans-serif" fill="var(--warn-text)">Staging</text>
  <line x1="805.2174" y1="188.717928928336" x2="918.2609" y2="129.230735305719" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="805.2174" y1="248.205122550953" x2="918.2609" y2="307.69231617357" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="926.9565" y="69.743651939515" width="173.913" height="118.974276988821" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.300183217152" filter="url(#shadow)"/>
  <text x="1013.913" y="144.102561275477" text-anchor="middle" font-size="21.097213533169" font-family="Arial, sans-serif" fill="var(--warn-text)">UAT</text>
  <rect x="926.9565" y="248.205122550953" width="173.913" height="118.974276988821" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.300183217152" filter="url(#shadow)"/>
  <text x="1013.913" y="322.564031886915" text-anchor="middle" font-size="21.097213533169" font-family="Arial, sans-serif" fill="var(--warn-text)">Perf Test</text>
  <line x1="1100.8696" y1="129.230735305719" x2="1135.6522" y2="501.025612754766" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="1100.8696" y1="307.69231617357" x2="1135.6522" y2="501.025612754766" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="1031.3043" y="486.153786785008" width="208.6957" height="133.846213214991" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.300183217152" filter="url(#shadow)"/>
  <text x="1135.6522" y="566.461470611438" text-anchor="middle" font-size="23.015094307523" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Production</text>
</svg>

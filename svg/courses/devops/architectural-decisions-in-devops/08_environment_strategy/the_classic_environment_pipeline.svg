<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
  </defs>
<text x="640" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--text)">The Classic Environment Pipeline</text>
<rect x="40" y="100" width="290" height="520" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
<text x="185" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="var(--primary-text)">Dev</text>
<text x="185" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="var(--primary-text)">local iteration</text>
<text x="185" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="var(--primary-text)">unit tests</text>
<text x="185" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="var(--primary-text)">fast feedback</text>
<line x1="325" y1="360" x2="345" y2="360" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="340" y="100" width="290" height="520" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
<text x="485" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="var(--ok-text)">QA</text>
<text x="485" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="var(--ok-text)">integration tests</text>
<text x="485" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="var(--ok-text)">manual exploration</text>
<text x="485" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="var(--ok-text)">bug fixing</text>
<line x1="625" y1="360" x2="645" y2="360" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="640" y="100" width="290" height="520" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
<text x="785" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="var(--warn-text)">Staging</text>
<text x="785" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="var(--warn-text)">production-like</text>
<text x="785" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="var(--warn-text)">performance checks</text>
<text x="785" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="var(--warn-text)">final gates</text>
<line x1="925" y1="360" x2="945" y2="360" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="940" y="100" width="290" height="520" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
<text x="1085" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="var(--danger-text)">Production</text>
<text x="1085" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="var(--danger-text)">live users</text>
<text x="1085" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="var(--danger-text)">monitoring</text>
<text x="1085" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="var(--danger-text)">incident response</text>
</svg>

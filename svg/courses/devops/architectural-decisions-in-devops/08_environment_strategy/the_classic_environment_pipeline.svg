<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
<rect x="40" y="40" width="292.436975" height="580" rx="6.363274968264" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
<text x="186.218487" y="118.076922974297" text-anchor="middle" font-family="Arial, sans-serif" font-size="33.93746821925" font-weight="bold" fill="var(--primary-text)">Dev</text>
<text x="186.218487" y="218.461538379438" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.332009594442" fill="var(--primary-text)">local iteration</text>
<text x="186.218487" y="307.692307035503" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.332009594442" fill="var(--primary-text)">unit tests</text>
<text x="186.218487" y="396.923076758876" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.332009594442" fill="var(--primary-text)">fast feedback</text>
<line x1="327.394958" y1="329.999999466346" x2="347.563025" y2="329.999999466346" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="342.521008" y="40" width="292.436975" height="580" rx="6.363274968264" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
<text x="488.739496" y="118.076922974297" text-anchor="middle" font-family="Arial, sans-serif" font-size="33.93746821925" font-weight="bold" fill="var(--ok-text)">QA</text>
<text x="488.739496" y="218.461538379438" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.332009594442" fill="var(--ok-text)">integration tests</text>
<text x="488.739496" y="307.692307035503" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.332009594442" fill="var(--ok-text)">manual exploration</text>
<text x="488.739496" y="396.923076758876" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.332009594442" fill="var(--ok-text)">bug fixing</text>
<line x1="629.915966" y1="329.999999466346" x2="650.084034" y2="329.999999466346" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="645.042017" y="40" width="292.436975" height="580" rx="6.363274968264" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
<text x="791.260504" y="118.076922974297" text-anchor="middle" font-family="Arial, sans-serif" font-size="33.93746821925" font-weight="bold" fill="var(--warn-text)">Staging</text>
<text x="791.260504" y="218.461538379438" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.332009594442" fill="var(--warn-text)">production-like</text>
<text x="791.260504" y="307.692307035503" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.332009594442" fill="var(--warn-text)">performance checks</text>
<text x="791.260504" y="396.923076758876" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.332009594442" fill="var(--warn-text)">final gates</text>
<line x1="932.436975" y1="329.999999466346" x2="952.605042" y2="329.999999466346" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="947.563025" y="40" width="292.436975" height="580" rx="6.363274968264" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
<text x="1093.781513" y="118.076922974297" text-anchor="middle" font-family="Arial, sans-serif" font-size="33.93746821925" font-weight="bold" fill="var(--danger-text)">Production</text>
<text x="1093.781513" y="218.461538379438" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.332009594442" fill="var(--danger-text)">live users</text>
<text x="1093.781513" y="307.692307035503" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.332009594442" fill="var(--danger-text)">monitoring</text>
<text x="1093.781513" y="396.923076758876" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.332009594442" fill="var(--danger-text)">incident response</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow4" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 17.28 L 16.4571 8.64 z" fill="#333" />
    </marker>
  </defs>
  <rect x="36.1199" y="56.8889" width="216.7196" height="128" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="144.4797" y="133.6889" text-anchor="middle" font-size="21.672" font-weight="bold">GitHub PR</text>
  <line x1="252.8395" y1="119.4667" x2="352.1693" y2="119.4667" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="361.1993" y="56.8889" width="216.7196" height="128" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="469.5591" y="133.6889" text-anchor="middle" font-size="21.672" font-weight="bold">CI Pipeline</text>
  <line x1="577.9189" y1="119.4667" x2="677.2487" y2="119.4667" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="686.2786" y="56.8889" width="252.8395" height="128" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="812.6984" y="133.6889" text-anchor="middle" font-size="21.672" font-weight="bold">Provision Env</text>
  <line x1="812.6984" y1="184.8889" x2="812.6984" y2="284.4444" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="559.8589" y="298.6667" width="505.679" height="341.3333" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" stroke-dasharray="9.03 5.418" />
  <text x="812.6984" y="355.5556" text-anchor="middle" font-size="19.866" fill="var(--text-muted)">Ephemeral Namespace</text>
  <rect x="586.9488" y="384" width="144.4797" height="99.5556" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="659.1887" y="446.5778" text-anchor="middle" font-size="18.06">App Pod</text>
  <rect x="758.5185" y="384" width="144.4797" height="99.5556" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="830.7584" y="446.5778" text-anchor="middle" font-size="18.06">DB Pod</text>
  <rect x="930.0882" y="384" width="108.3598" height="99.5556" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="984.268" y="446.5778" text-anchor="middle" font-size="18.06">Cache</text>
  <rect x="586.9488" y="512" width="451.4992" height="85.3333" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="812.6984" y="568.8889" text-anchor="middle" font-size="18.06">Ingress: pr-42.preview.example.com</text>
  <line x1="469.5591" y1="184.8889" x2="144.4797" y2="284.4444" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="36.1199" y="298.6667" width="216.7196" height="99.5556" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="144.4797" y="361.2444" text-anchor="middle" font-size="18.06">Post URL to PR</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <rect x="40" y="40" width="252.6316" height="127.3171" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="166.3158" y="116.3902" text-anchor="middle" font-size="23.3363" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">GitHub PR</text>
  <line x1="292.6316" y1="102.2439" x2="408.4211" y2="102.2439" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="418.9474" y="40" width="252.6316" height="127.3171" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="545.2632" y="116.3902" text-anchor="middle" font-size="23.3363" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">CI Pipeline</text>
  <line x1="671.579" y1="102.2439" x2="787.3685" y2="102.2439" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="797.8947" y="40" width="294.7368" height="127.3171" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="945.2632" y="116.3902" text-anchor="middle" font-size="23.3363" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Provision Env</text>
  <line x1="945.2632" y1="167.3171" x2="945.2632" y2="266.3414" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="650.5263" y="280.4878" width="589.4737" height="339.5122" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" stroke-dasharray="9.03 5.418" />
  <text x="945.2632" y="337.0732" text-anchor="middle" font-size="21.3916" fill="var(--text-muted)" font-family="Arial, sans-serif">Ephemeral Namespace</text>
  <rect x="682.1052" y="365.3658" width="168.421" height="99.0244" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="766.3158" y="427.6098" text-anchor="middle" font-size="19.4469" font-family="Arial, sans-serif" fill="var(--primary-text)">App Pod</text>
  <rect x="882.1053" y="365.3658" width="168.421" height="99.0244" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="966.3158" y="427.6098" text-anchor="middle" font-size="19.4469" font-family="Arial, sans-serif" fill="var(--ok-text)">DB Pod</text>
  <rect x="1082.1053" y="365.3658" width="126.3158" height="99.0244" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1145.2631" y="427.6098" text-anchor="middle" font-size="19.4469" font-family="Arial, sans-serif" fill="var(--warn-text)">Cache</text>
  <rect x="682.1052" y="492.6829" width="526.3159" height="84.878" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="945.2632" y="549.2683" text-anchor="middle" font-size="19.4469" font-family="Arial, sans-serif" fill="var(--info-text)">Ingress: pr-42.preview.example.com</text>
  <line x1="545.2632" y1="167.3171" x2="166.3158" y2="266.3414" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="280.4878" width="252.6316" height="99.0244" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="166.3158" y="342.7317" text-anchor="middle" font-size="19.4469" font-family="Arial, sans-serif" fill="var(--ok-text)">Post URL to PR</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow4" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 17.28 L 16.4571 8.64 z" fill="#333" />
    </marker>
  </defs>
  <rect x="40" y="40" width="252.6316" height="127.3171" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="166.3158" y="116.3902" text-anchor="middle" font-size="23.3363" font-weight="bold">GitHub PR</text>
  <line x1="292.6316" y1="102.2439" x2="408.4211" y2="102.2439" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="418.9474" y="40" width="252.6316" height="127.3171" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="545.2632" y="116.3902" text-anchor="middle" font-size="23.3363" font-weight="bold">CI Pipeline</text>
  <line x1="671.579" y1="102.2439" x2="787.3685" y2="102.2439" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="797.8947" y="40" width="294.7368" height="127.3171" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="945.2632" y="116.3902" text-anchor="middle" font-size="23.3363" font-weight="bold">Provision Env</text>
  <line x1="945.2632" y1="167.3171" x2="945.2632" y2="266.3414" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="650.5263" y="280.4878" width="589.4737" height="339.5122" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" stroke-dasharray="9.03 5.418" />
  <text x="945.2632" y="337.0732" text-anchor="middle" font-size="21.3916" fill="var(--text-muted)">Ephemeral Namespace</text>
  <rect x="682.1052" y="365.3658" width="168.421" height="99.0244" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="766.3158" y="427.6098" text-anchor="middle" font-size="19.4469">App Pod</text>
  <rect x="882.1053" y="365.3658" width="168.421" height="99.0244" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="966.3158" y="427.6098" text-anchor="middle" font-size="19.4469">DB Pod</text>
  <rect x="1082.1053" y="365.3658" width="126.3158" height="99.0244" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="1145.2631" y="427.6098" text-anchor="middle" font-size="19.4469">Cache</text>
  <rect x="682.1052" y="492.6829" width="526.3159" height="84.878" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="945.2632" y="549.2683" text-anchor="middle" font-size="19.4469">Ingress: pr-42.preview.example.com</text>
  <line x1="545.2632" y1="167.3171" x2="166.3158" y2="266.3414" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="280.4878" width="252.6316" height="99.0244" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="166.3158" y="342.7317" text-anchor="middle" font-size="19.4469">Post URL to PR</text>
</svg>
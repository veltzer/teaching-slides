<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="630.7692" y="40" text-anchor="middle" font-size="25.2258" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Artifact Promotion (Not Code Promotion)</text>
  <rect x="40" y="129.2308" width="240" height="245.3846" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="160.0001" y="227.3846" text-anchor="middle" font-size="21.345" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Build</text>
  <text x="160.0001" y="307.6923" text-anchor="middle" font-size="19.4045" fill="var(--text-muted)" font-family="Arial, sans-serif">image:abc123</text>
  <line x1="280" y1="249.6923" x2="363.0769" y2="249.6923" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="372.3077" y="129.2308" width="240" height="245.3846" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="492.3077" y="227.3846" text-anchor="middle" font-size="21.345" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Dev Tests</text>
  <text x="492.3077" y="307.6923" text-anchor="middle" font-size="19.4045" fill="var(--ok-accent)" font-family="Arial, sans-serif">PASS</text>
  <line x1="612.3077" y1="249.6923" x2="695.3846" y2="249.6923" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="704.6154" y="129.2308" width="240" height="245.3846" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="824.6154" y="227.3846" text-anchor="middle" font-size="21.345" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Staging Tests</text>
  <text x="824.6154" y="307.6923" text-anchor="middle" font-size="19.4045" fill="var(--ok-accent)" font-family="Arial, sans-serif">PASS</text>
  <line x1="944.6153" y1="249.6923" x2="1027.6923" y2="249.6923" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1036.923" y="129.2308" width="203.077" height="245.3846" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1138.4615" y="227.3846" text-anchor="middle" font-size="21.345" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Production</text>
  <text x="1138.4615" y="307.6923" text-anchor="middle" font-size="19.4045" fill="var(--text-muted)" font-family="Arial, sans-serif">Deploy</text>
  <text x="630.7692" y="530.7692" text-anchor="middle" font-size="21.345" fill="var(--text-muted)" font-family="Arial, sans-serif">Same artifact promoted through each stage</text>
  <text x="630.7692" y="620" text-anchor="middle" font-size="21.345" fill="var(--text-muted)" font-family="Arial, sans-serif">Only configuration differs between environments</text>
</svg>

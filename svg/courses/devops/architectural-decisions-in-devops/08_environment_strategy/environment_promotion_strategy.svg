<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow7" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 24 L 16.4571 12 z" fill="#333" />
    </marker>
  </defs>
  <text x="630.7692" y="40" text-anchor="middle" font-size="25.2258" font-weight="bold" fill="var(--text)">Artifact Promotion (Not Code Promotion)</text>
  <rect x="40" y="129.2308" width="240" height="245.3846" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="160.0001" y="227.3846" text-anchor="middle" font-size="21.345" font-weight="bold">Build</text>
  <text x="160.0001" y="307.6923" text-anchor="middle" font-size="19.4045" fill="var(--text-muted)">image:abc123</text>
  <line x1="280" y1="249.6923" x2="363.0769" y2="249.6923" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow7)" />
  <rect x="372.3077" y="129.2308" width="240" height="245.3846" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="492.3077" y="227.3846" text-anchor="middle" font-size="21.345" font-weight="bold">Dev Tests</text>
  <text x="492.3077" y="307.6923" text-anchor="middle" font-size="19.4045" fill="var(--ok-accent)">PASS</text>
  <line x1="612.3077" y1="249.6923" x2="695.3846" y2="249.6923" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow7)" />
  <rect x="704.6154" y="129.2308" width="240" height="245.3846" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="824.6154" y="227.3846" text-anchor="middle" font-size="21.345" font-weight="bold">Staging Tests</text>
  <text x="824.6154" y="307.6923" text-anchor="middle" font-size="19.4045" fill="var(--ok-accent)">PASS</text>
  <line x1="944.6153" y1="249.6923" x2="1027.6923" y2="249.6923" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow7)" />
  <rect x="1036.923" y="129.2308" width="203.077" height="245.3846" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1138.4615" y="227.3846" text-anchor="middle" font-size="21.345" font-weight="bold">Production</text>
  <text x="1138.4615" y="307.6923" text-anchor="middle" font-size="19.4045" fill="var(--text-muted)">Deploy</text>
  <text x="630.7692" y="530.7692" text-anchor="middle" font-size="21.345" fill="var(--text-muted)">Same artifact promoted through each stage</text>
  <text x="630.7692" y="620" text-anchor="middle" font-size="21.345" fill="var(--text-muted)">Only configuration differs between environments</text>
</svg>
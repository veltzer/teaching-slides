<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="615.2066" y="40" text-anchor="middle" font-size="23.6022" font-weight="bold" fill="var(--text)">Configuration Drift Over Time</text>
  <line x1="40" y1="545.641" x2="1230.0827" y2="545.641" stroke="var(--text)" stroke-width="2" />
  <line x1="40" y1="545.641" x2="40" y2="69.7436" stroke="var(--text)" stroke-width="2" />
  <text x="635.0413" y="620" text-anchor="middle" font-size="19.9712" fill="var(--text-muted)">Time</text>
  <text x="40" y="307.6923" text-anchor="middle" font-size="19.4937" fill="var(--text-muted)" transform="rotate(-90 30 110)">Divergence</text>
  <polyline points="40,515.8974 238.347,501.0256 436.6943,456.4103 635.0413,367.1795 833.3885,277.9487 1031.7354,158.9744 1230.0827,84.6155" fill="none" stroke="var(--danger-border)" stroke-width="4.158" />
  <text x="1240" y="69.7436" font-size="18.1557" fill="var(--danger-accent)">Dev</text>
  <polyline points="40,515.8974 238.347,509.9488 436.6943,486.1539 635.0413,441.5384 833.3885,396.923 1031.7354,352.3077 1230.0827,307.6923" fill="none" stroke="var(--warn-border)" stroke-width="4.158" />
  <text x="1240" y="292.8206" font-size="18.1557" fill="var(--warn-accent)">QA</text>
  <polyline points="40,515.8974 238.347,515.8974 436.6943,512.9231 635.0413,506.9744 833.3885,501.0256 1031.7354,495.0769 1230.0827,486.1539" fill="none" stroke="var(--ok-border)" stroke-width="4.158" />
  <text x="1240" y="471.2821" font-size="18.1557" fill="var(--ok-accent)">Staging</text>
  <polyline points="40,515.8974 238.347,515.8974 436.6943,515.8974 635.0413,515.8974 833.3885,515.8974 1031.7354,515.8974 1230.0827,515.8974" fill="none" stroke="var(--primary-border)" stroke-width="4.158" stroke-dasharray="8.316 4.9896" />
  <text x="1240" y="521.8461" font-size="18.1557" fill="var(--primary-accent)">Prod (baseline)</text>
</svg>
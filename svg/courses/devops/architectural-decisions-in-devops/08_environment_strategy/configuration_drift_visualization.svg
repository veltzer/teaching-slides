<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="582.1188" y="59.5348" text-anchor="middle" font-size="21.6215" font-weight="bold" fill="var(--text)">Configuration Drift Over Time</text>
  <line x1="99.7918" y1="565.5814" x2="1097.7098" y2="565.5814" stroke="var(--text)" stroke-width="2" />
  <line x1="99.7918" y1="565.5814" x2="99.7918" y2="89.3023" stroke="var(--text)" stroke-width="2" />
  <text x="598.7508" y="640" text-anchor="middle" font-size="18.2952" fill="var(--text-muted)">Time</text>
  <text x="49.8959" y="327.4418" text-anchor="middle" font-size="18.2952" fill="var(--text-muted)" transform="rotate(-90 30 110)">Divergence</text>
  <polyline points="99.7918,535.8139 266.1114,520.9302 432.4312,476.2791 598.7508,386.9767 765.0705,297.6744 931.3901,178.6046 1097.7098,104.1861" fill="none" stroke="var(--danger-border)" stroke-width="4.158" />
  <text x="1106.0258" y="89.3023" font-size="16.632" fill="var(--danger-accent)">Dev</text>
  <polyline points="99.7918,535.8139 266.1114,529.8605 432.4312,506.0465 598.7508,461.3953 765.0705,416.7441 931.3901,372.093 1097.7098,327.4418" fill="none" stroke="var(--warn-border)" stroke-width="4.158" />
  <text x="1106.0258" y="312.5582" font-size="16.632" fill="var(--warn-accent)">QA</text>
  <polyline points="99.7918,535.8139 266.1114,535.8139 432.4312,532.8372 598.7508,526.8837 765.0705,520.9302 931.3901,514.9767 1097.7098,506.0465" fill="none" stroke="var(--ok-border)" stroke-width="4.158" />
  <text x="1106.0258" y="491.1628" font-size="16.632" fill="var(--ok-accent)">Staging</text>
  <polyline points="99.7918,535.8139 266.1114,535.8139 432.4312,535.8139 598.7508,535.8139 765.0705,535.8139 931.3901,535.8139 1097.7098,535.8139" fill="none" stroke="var(--primary-border)" stroke-width="4.158" stroke-dasharray="8.316 4.9896" />
  <text x="1106.0258" y="541.7674" font-size="16.632" fill="var(--primary-accent)">Prod (baseline)</text>
</svg>
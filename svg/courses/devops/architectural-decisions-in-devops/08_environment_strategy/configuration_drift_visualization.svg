<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <line x1="40" y1="541.621593133674" x2="1230.0827" y2="541.621593133674" stroke="var(--text)" stroke-width="2"/>
  <line x1="40" y1="541.621593133674" x2="40" y2="40" stroke="var(--text)" stroke-width="2"/>
  <text x="635.0413" y="620" text-anchor="middle" font-size="20.503858989519" fill="var(--text-muted)" font-family="Arial, sans-serif">Time</text>
  <text x="40" y="307.6923" text-anchor="middle" font-size="19.4937" fill="var(--text-muted)" transform="rotate(-90 30 110)" font-family="Arial, sans-serif">Divergence</text>
  <polyline points="40,510.270230387143 238.347,494.594549013878 436.6943,447.56761029949 635.0413,353.513522059898 833.3885,259.459433820306 1031.7354,134.054088239592 1230.0827,55.675786778673" fill="none" stroke="var(--danger-border)" stroke-width="4.158"/>
  <text x="1240" y="40" font-size="18.639937142285" fill="var(--danger-accent)" font-family="Arial, sans-serif">Dev</text>
  <polyline points="40,510.270230387143 238.347,504.000084324326 436.6943,478.91897304602 635.0413,431.891823520817 833.3885,384.864779401021 1031.7354,337.837840686633 1230.0827,290.810796566837" fill="none" stroke="var(--warn-border)" stroke-width="4.158"/>
  <text x="1240" y="275.135220598979" font-size="18.639937142285" fill="var(--warn-accent)" font-family="Arial, sans-serif">QA</text>
  <polyline points="40,510.270230387143 238.347,510.270230387143 436.6943,507.135157355735 635.0413,500.86490588751 833.3885,494.594549013878 1031.7354,488.324297545653 1230.0827,478.91897304602" fill="none" stroke="var(--ok-border)" stroke-width="4.158"/>
  <text x="1240" y="463.243291672755" font-size="18.639937142285" fill="var(--ok-accent)" font-family="Arial, sans-serif">Staging</text>
  <polyline points="40,510.270230387143 238.347,510.270230387143 436.6943,510.270230387143 635.0413,510.270230387143 833.3885,510.270230387143 1031.7354,510.270230387143 1230.0827,510.270230387143" fill="none" stroke="var(--primary-border)" stroke-width="4.158" stroke-dasharray="8.316 4.9896"/>
  <text x="1240" y="516.540481855368" font-size="18.639937142285" fill="var(--primary-accent)" font-family="Arial, sans-serif">Prod (baseline)</text>
</svg>

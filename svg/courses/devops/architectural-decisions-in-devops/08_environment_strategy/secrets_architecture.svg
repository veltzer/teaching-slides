<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow6" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 19.6364 L 16.4571 9.8182 z" fill="#333" />
    </marker>
  </defs>
  <rect x="425.6992" y="30.4762" width="340.5594" height="152.381" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="595.9789" y="121.9048" text-anchor="middle" font-size="22.1363" font-weight="bold">Secrets Manager</text>
  <line x1="493.811" y1="182.8571" x2="204.3356" y2="304.7619" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow6)" />
  <line x1="595.9789" y1="182.8571" x2="595.9789" y2="304.7619" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow6)" />
  <line x1="698.1467" y1="182.8571" x2="987.6221" y2="304.7619" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow6)" />
  <rect x="85.1399" y="320" width="238.3915" height="121.9048" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="204.3356" y="396.1904" text-anchor="middle" font-size="18.7308">secret/dev/*</text>
  <rect x="476.7831" y="320" width="238.3915" height="121.9048" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="595.9789" y="396.1904" text-anchor="middle" font-size="18.7308">secret/staging/*</text>
  <rect x="868.4263" y="320" width="238.3915" height="121.9048" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="987.6221" y="396.1904" text-anchor="middle" font-size="18.7308">secret/prod/*</text>
  <line x1="204.3356" y1="441.9048" x2="204.3356" y2="533.3334" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow6)" />
  <line x1="595.9789" y1="441.9048" x2="595.9789" y2="533.3334" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow6)" />
  <line x1="987.6221" y1="441.9048" x2="987.6221" y2="533.3334" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow6)" />
  <rect x="85.1399" y="548.5714" width="238.3915" height="91.4286" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="204.3356" y="609.5239" text-anchor="middle" font-size="17.028">Dev Workloads</text>
  <rect x="476.7831" y="548.5714" width="238.3915" height="91.4286" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="595.9789" y="609.5239" text-anchor="middle" font-size="17.028">Staging Workloads</text>
  <rect x="868.4263" y="548.5714" width="238.3915" height="91.4286" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="987.6221" y="609.5239" text-anchor="middle" font-size="17.028">Prod Workloads</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="275" height="400" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="177" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--danger-text)">Prod DB</text>
  <text x="177" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--danger-text)">Real PII</text>
  <text x="177" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">emails, SSNs,</text>
  <text x="177" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">payment cards</text>
  <text x="177" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">access: on-call</text>
  <text x="177" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">engineers only</text>
  <text x="177" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">audited, encrypted</text>

  <rect x="345" y="40" width="275" height="400" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="482" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--warn-text)">Export</text>
  <text x="482" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--warn-text)">Snapshot</text>
  <text x="482" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">read-replica dump</text>
  <text x="482" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">nightly cron</text>
  <text x="482" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">still contains PII</text>
  <text x="482" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">treat as sensitive</text>

  <rect x="650" y="40" width="275" height="400" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="787" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--ok-text)">Anonymize</text>
  <text x="787" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--ok-text)">Mask / Hash / Fake</text>
  <text x="787" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">names to Faker</text>
  <text x="787" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">emails hashed</text>
  <text x="787" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">cards tokenized</text>
  <text x="787" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">preserves shape,</text>
  <text x="787" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">stats, referential keys</text>

  <rect x="955" y="40" width="285" height="400" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--primary-text)">Non-prod DB</text>
  <text x="1097" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">Safe data</text>
  <text x="1097" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">staging, QA, dev</text>
  <text x="1097" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">load tests, demos</text>
  <text x="1097" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">access: all engineers</text>
  <text x="1097" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">no compliance scope</text>

  <line x1="316" y1="240" x2="343" y2="240" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="621" y1="240" x2="648" y2="240" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="926" y1="240" x2="953" y2="240" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="460" width="1200" height="160" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Why a pipeline, not a one-off script</text>
  <text x="640" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Repeatable, audited, reversible. Prod schema changes automatically flow through.</text>
  <text x="640" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Consistent tokens across tables keep joins working in non-prod.</text>
  <text x="640" y="598" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">GDPR / HIPAA: only the anonymize step needs compliance review.</text>
</svg>

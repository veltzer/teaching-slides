<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="225" height="259.619047619048" rx="6.306459273747" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="152" y="89.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.02153091249" font-weight="bold" fill="var(--primary-text)">1. PR Opened</text>
  <text x="152" y="144.952380952382" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--primary-text)">Push branch</text>
  <text x="152" y="183.619047619048" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--primary-text)">CI trigger</text>
  <text x="152" y="222.285714285715" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--primary-text)">Request preview</text>

  <rect x="285" y="40" width="225" height="259.619047619048" rx="6.306459273747" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="397" y="89.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.02153091249" font-weight="bold" fill="var(--warn-text)">2. Provision</text>
  <text x="397" y="144.952380952382" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--warn-text)">Terraform/Helm</text>
  <text x="397" y="183.619047619048" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--warn-text)">Namespace per PR</text>
  <text x="397" y="222.285714285715" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--warn-text)">Seed data, DNS</text>

  <rect x="530" y="40" width="225" height="259.619047619048" rx="6.306459273747" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="642" y="89.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.02153091249" font-weight="bold" fill="var(--info-text)">3. Validate</text>
  <text x="642" y="144.952380952382" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--info-text)">Integration tests</text>
  <text x="642" y="183.619047619048" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--info-text)">Reviewer demo</text>
  <text x="642" y="222.285714285715" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--info-text)">Status on PR</text>

  <rect x="775" y="40" width="225" height="259.619047619048" rx="6.306459273747" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="887" y="89.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.02153091249" font-weight="bold" fill="var(--ok-text)">4. Merge</text>
  <text x="887" y="144.952380952382" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--ok-text)">Approved</text>
  <text x="887" y="183.619047619048" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--ok-text)">Merge to main</text>
  <text x="887" y="222.285714285715" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--ok-text)">Promote to staging</text>

  <rect x="1020" y="40" width="220" height="259.619047619048" rx="6.306459273747" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1130" y="89.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.02153091249" font-weight="bold" fill="var(--danger-text)">5. Destroy</text>
  <text x="1130" y="144.952380952382" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--danger-text)">Close triggers</text>
  <text x="1130" y="183.619047619048" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--danger-text)">teardown job</text>
  <text x="1130" y="222.285714285715" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--danger-text)">Delete all</text>

  <line x1="265" y1="169.257142857144" x2="285" y2="169.257142857144" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="510" y1="169.257142857144" x2="530" y2="169.257142857144" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="755" y1="169.257142857144" x2="775" y2="169.257142857144" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="1000" y1="169.257142857144" x2="1020" y2="169.257142857144" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- Why -->
  <text x="640" y="360.380952380952" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.123684003738" font-weight="bold" fill="var(--text)">Why Ephemeral Wins</text>

  <rect x="80" y="388.000000000001" width="360" height="231.999999999999" rx="6.306459273747" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="260" y="437.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.02153091249" font-weight="bold" fill="var(--ok-text)">Isolated</text>
  <text x="260" y="492.952380952381" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--ok-text)">Own sandbox per PR</text>
  <text x="260" y="531.619047619047" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--ok-text)">No collisions</text>

  <rect x="460" y="388.000000000001" width="360" height="231.999999999999" rx="6.306459273747" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="437.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.02153091249" font-weight="bold" fill="var(--primary-text)">Cheap</text>
  <text x="640" y="492.952380952381" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--primary-text)">Alive only when needed</text>
  <text x="640" y="531.619047619047" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--primary-text)">No snowflake staging</text>

  <rect x="840" y="388.000000000001" width="360" height="231.999999999999" rx="6.306459273747" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1020" y="437.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.02153091249" font-weight="bold" fill="var(--info-text)">Confidence</text>
  <text x="1020" y="492.952380952381" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--info-text)">Real system testing</text>
  <text x="1020" y="531.619047619047" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--info-text)">Before merge</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 27 L 16.4571 13.5 z" fill="#333" />
    </marker>
  </defs>
  <rect x="40" y="221.4292" width="194.1177" height="217.1415" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="137.0588" y="308.2858" text-anchor="middle" font-size="19.4118" font-weight="bold">PR Created</text>
  <text x="137.0588" y="373.4283" text-anchor="middle" font-size="17.647" fill="var(--text-muted)">Trigger</text>
  <line x1="234.1177" y1="330" x2="295.8824" y2="330" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="304.7059" y="221.4292" width="194.1177" height="217.1415" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="401.7648" y="308.2858" text-anchor="middle" font-size="19.4118" font-weight="bold">Provision</text>
  <text x="401.7648" y="373.4283" text-anchor="middle" font-size="17.647" fill="var(--text-muted)">Infra + App</text>
  <line x1="498.8235" y1="330" x2="560.5883" y2="330" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="569.4117" y="221.4292" width="194.1177" height="217.1415" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="666.4706" y="308.2858" text-anchor="middle" font-size="19.4118" font-weight="bold">Active</text>
  <text x="666.4706" y="373.4283" text-anchor="middle" font-size="17.647" fill="var(--text-muted)">Test + Review</text>
  <line x1="763.5294" y1="330" x2="825.2941" y2="330" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="834.1177" y="221.4292" width="194.1177" height="217.1415" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="931.1765" y="308.2858" text-anchor="middle" font-size="19.4118" font-weight="bold">PR Merged</text>
  <text x="931.1765" y="373.4283" text-anchor="middle" font-size="17.647" fill="var(--text-muted)">Trigger</text>
  <line x1="1028.2353" y1="330" x2="1090" y2="330" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="1098.8235" y="221.4292" width="141.1765" height="217.1415" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="1169.4117" y="308.2858" text-anchor="middle" font-size="19.4118" font-weight="bold">Destroy</text>
  <text x="1169.4117" y="373.4283" text-anchor="middle" font-size="17.647" fill="var(--text-muted)">Cleanup</text>
</svg>
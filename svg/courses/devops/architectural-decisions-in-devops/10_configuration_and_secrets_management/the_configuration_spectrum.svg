<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="285" height="473.469387777176" rx="6.527805174226" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="182" y="116.938775013536" text-anchor="middle" font-size="26.11122173692" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Hardcoded</text>
  <text x="182" y="211.632652785298" text-anchor="middle" font-size="18.495448860321" fill="var(--primary-text)" font-family="Arial, sans-serif">Literal values</text>
  <text x="182" y="258.979591671179" text-anchor="middle" font-size="18.495448860321" fill="var(--primary-text)" font-family="Arial, sans-serif">in source code</text>
  <text x="182" y="377.346938345065" text-anchor="middle" font-size="17.407481157947" fill="var(--primary-text)" font-family="Arial, sans-serif">Rebuild to change</text>
  <rect x="345" y="40" width="285" height="473.469387777176" rx="6.527805174226" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="487" y="116.938775013536" text-anchor="middle" font-size="26.11122173692" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Baked-in</text>
  <text x="487" y="211.632652785298" text-anchor="middle" font-size="18.495448860321" fill="var(--ok-text)" font-family="Arial, sans-serif">Config file</text>
  <text x="487" y="258.979591671179" text-anchor="middle" font-size="18.495448860321" fill="var(--ok-text)" font-family="Arial, sans-serif">bundled in image</text>
  <text x="487" y="377.346938345065" text-anchor="middle" font-size="17.407481157947" fill="var(--ok-text)" font-family="Arial, sans-serif">Rebuild image</text>
  <rect x="650" y="40" width="285" height="473.469387777176" rx="6.527805174226" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="792" y="116.938775013536" text-anchor="middle" font-size="26.11122173692" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Env Vars</text>
  <text x="792" y="211.632652785298" text-anchor="middle" font-size="18.495448860321" fill="var(--warn-text)" font-family="Arial, sans-serif">Injected at</text>
  <text x="792" y="258.979591671179" text-anchor="middle" font-size="18.495448860321" fill="var(--warn-text)" font-family="Arial, sans-serif">container start</text>
  <text x="792" y="377.346938345065" text-anchor="middle" font-size="17.407481157947" fill="var(--warn-text)" font-family="Arial, sans-serif">Restart to change</text>
  <rect x="955" y="40" width="285" height="473.469387777176" rx="6.527805174226" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097" y="116.938775013536" text-anchor="middle" font-size="26.11122173692" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Config Service</text>
  <text x="1097" y="211.632652785298" text-anchor="middle" font-size="18.495448860321" fill="var(--danger-text)" font-family="Arial, sans-serif">Vault, Consul,</text>
  <text x="1097" y="258.979591671179" text-anchor="middle" font-size="18.495448860321" fill="var(--danger-text)" font-family="Arial, sans-serif">Parameter Store</text>
  <text x="1097" y="377.346938345065" text-anchor="middle" font-size="17.407481157947" fill="var(--danger-text)" font-family="Arial, sans-serif">Live reload, audited</text>
  <line x1="40" y1="572.653061114119" x2="1240" y2="572.653061114119" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="110" y="620" text-anchor="middle" font-size="16.319513455573" fill="var(--text-muted)" font-family="Arial, sans-serif">Least flexible</text>
  <text x="1170" y="620" text-anchor="middle" font-size="16.319513455573" fill="var(--text-muted)" font-family="Arial, sans-serif">Most flexible</text>
  <text x="640" y="620" text-anchor="middle" font-size="16.319513455573" fill="var(--text-muted)" font-family="Arial, sans-serif">flexibility, complexity, and operational cost grow toward the right</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="70" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--text)">The Configuration Spectrum</text>
  <rect x="40" y="110" width="285" height="400" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="182" y="175" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--primary-text)">Hardcoded</text>
  <text x="182" y="255" text-anchor="middle" font-size="17" fill="var(--primary-text)">Literal values</text>
  <text x="182" y="295" text-anchor="middle" font-size="17" fill="var(--primary-text)">in source code</text>
  <text x="182" y="395" text-anchor="middle" font-size="16" fill="var(--primary-text)">Rebuild to change</text>
  <rect x="345" y="110" width="285" height="400" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="487" y="175" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--ok-text)">Baked-in</text>
  <text x="487" y="255" text-anchor="middle" font-size="17" fill="var(--ok-text)">Config file</text>
  <text x="487" y="295" text-anchor="middle" font-size="17" fill="var(--ok-text)">bundled in image</text>
  <text x="487" y="395" text-anchor="middle" font-size="16" fill="var(--ok-text)">Rebuild image</text>
  <rect x="650" y="110" width="285" height="400" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="792" y="175" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--warn-text)">Env Vars</text>
  <text x="792" y="255" text-anchor="middle" font-size="17" fill="var(--warn-text)">Injected at</text>
  <text x="792" y="295" text-anchor="middle" font-size="17" fill="var(--warn-text)">container start</text>
  <text x="792" y="395" text-anchor="middle" font-size="16" fill="var(--warn-text)">Restart to change</text>
  <rect x="955" y="110" width="285" height="400" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1097" y="175" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--danger-text)">Config Service</text>
  <text x="1097" y="255" text-anchor="middle" font-size="17" fill="var(--danger-text)">Vault, Consul,</text>
  <text x="1097" y="295" text-anchor="middle" font-size="17" fill="var(--danger-text)">Parameter Store</text>
  <text x="1097" y="395" text-anchor="middle" font-size="16" fill="var(--danger-text)">Live reload, audited</text>
  <line x1="40" y1="560" x2="1240" y2="560" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="110" y="600" text-anchor="middle" font-size="15" fill="var(--text-muted)">Least flexible</text>
  <text x="1170" y="600" text-anchor="middle" font-size="15" fill="var(--text-muted)">Most flexible</text>
  <text x="640" y="600" text-anchor="middle" font-size="15" fill="var(--text-muted)">flexibility, complexity, and operational cost grow toward the right</text>
</svg>

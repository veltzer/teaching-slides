<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="27.198779" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">The Configuration Spectrum</text>
  <rect x="40" y="83.773585" width="285" height="437.735849" rx="6.276641" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="182" y="154.90566" text-anchor="middle" font-size="25.106565" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Hardcoded</text>
  <text x="182" y="242.45283" text-anchor="middle" font-size="17.783817" fill="var(--primary-text)" font-family="Arial, sans-serif">Literal values</text>
  <text x="182" y="286.226415" text-anchor="middle" font-size="17.783817" fill="var(--primary-text)" font-family="Arial, sans-serif">in source code</text>
  <text x="182" y="395.660377" text-anchor="middle" font-size="16.73771" fill="var(--primary-text)" font-family="Arial, sans-serif">Rebuild to change</text>
  <rect x="345" y="83.773585" width="285" height="437.735849" rx="6.276641" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="487" y="154.90566" text-anchor="middle" font-size="25.106565" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Baked-in</text>
  <text x="487" y="242.45283" text-anchor="middle" font-size="17.783817" fill="var(--ok-text)" font-family="Arial, sans-serif">Config file</text>
  <text x="487" y="286.226415" text-anchor="middle" font-size="17.783817" fill="var(--ok-text)" font-family="Arial, sans-serif">bundled in image</text>
  <text x="487" y="395.660377" text-anchor="middle" font-size="16.73771" fill="var(--ok-text)" font-family="Arial, sans-serif">Rebuild image</text>
  <rect x="650" y="83.773585" width="285" height="437.735849" rx="6.276641" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="792" y="154.90566" text-anchor="middle" font-size="25.106565" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Env Vars</text>
  <text x="792" y="242.45283" text-anchor="middle" font-size="17.783817" fill="var(--warn-text)" font-family="Arial, sans-serif">Injected at</text>
  <text x="792" y="286.226415" text-anchor="middle" font-size="17.783817" fill="var(--warn-text)" font-family="Arial, sans-serif">container start</text>
  <text x="792" y="395.660377" text-anchor="middle" font-size="16.73771" fill="var(--warn-text)" font-family="Arial, sans-serif">Restart to change</text>
  <rect x="955" y="83.773585" width="285" height="437.735849" rx="6.276641" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097" y="154.90566" text-anchor="middle" font-size="25.106565" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Config Service</text>
  <text x="1097" y="242.45283" text-anchor="middle" font-size="17.783817" fill="var(--danger-text)" font-family="Arial, sans-serif">Vault, Consul,</text>
  <text x="1097" y="286.226415" text-anchor="middle" font-size="17.783817" fill="var(--danger-text)" font-family="Arial, sans-serif">Parameter Store</text>
  <text x="1097" y="395.660377" text-anchor="middle" font-size="16.73771" fill="var(--danger-text)" font-family="Arial, sans-serif">Live reload, audited</text>
  <line x1="40" y1="576.226415" x2="1240" y2="576.226415" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="110" y="620" text-anchor="middle" font-size="15.691603" fill="var(--text-muted)" font-family="Arial, sans-serif">Least flexible</text>
  <text x="1170" y="620" text-anchor="middle" font-size="15.691603" fill="var(--text-muted)" font-family="Arial, sans-serif">Most flexible</text>
  <text x="640" y="620" text-anchor="middle" font-size="15.691603" fill="var(--text-muted)" font-family="Arial, sans-serif">flexibility, complexity, and operational cost grow toward the right</text>
</svg>

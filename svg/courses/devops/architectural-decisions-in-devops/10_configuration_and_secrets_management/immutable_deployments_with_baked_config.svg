<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.018513" font-weight="bold" fill="var(--text)">Immutable Deployments with Baked Config</text>

  <rect x="40" y="82.962963" width="580" height="257.777778" rx="6.218253" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="131.296296" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.80026" font-weight="bold" fill="var(--danger-text)">Mutable Config at Runtime</text>
  <text x="330" y="179.62963" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--danger-text)">Env vars change without a new deploy</text>
  <text x="330" y="211.851852" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--danger-text)">Config drift between instances</text>
  <text x="330" y="244.074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--danger-text)">Rollback does not restore old config</text>
  <text x="330" y="276.296296" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--danger-text)">Debugging crosses many dashboards</text>
  <text x="330" y="313.888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545632" font-style="italic" fill="var(--danger-text)">Hard to reproduce incidents</text>

  <rect x="660" y="82.962963" width="580" height="257.777778" rx="6.218253" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="131.296296" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.80026" font-weight="bold" fill="var(--ok-text)">Baked Into the Artifact</text>
  <text x="950" y="179.62963" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--ok-text)">Config rendered at build time</text>
  <text x="950" y="211.851852" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--ok-text)">Image plus config is one unit</text>
  <text x="950" y="244.074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--ok-text)">Rollback ships the old bundle</text>
  <text x="950" y="276.296296" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--ok-text)">Same bits in every environment</text>
  <text x="950" y="313.888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545632" font-style="italic" fill="var(--ok-text)">Incidents reproduce locally</text>

  <rect x="40" y="372.962963" width="1200" height="247.037037" rx="6.218253" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="415.925926" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.80026" font-weight="bold" fill="var(--text)">Build-Time Pipeline</text>

  <rect x="80" y="448.148148" width="240" height="150.37037" rx="6.218253" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="200" y="491.111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758" font-weight="bold" fill="var(--primary-text)">Values File</text>
  <text x="200" y="528.703704" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--primary-text)">Per-env YAML</text>
  <text x="200" y="560.925926" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--primary-text)">checked into git</text>

  <rect x="360" y="448.148148" width="240" height="150.37037" rx="6.218253" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="491.111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758" font-weight="bold" fill="var(--warn-text)">Render</text>
  <text x="480" y="528.703704" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--warn-text)">Template + values,</text>
  <text x="480" y="560.925926" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--warn-text)">secrets referenced</text>

  <rect x="640" y="448.148148" width="240" height="150.37037" rx="6.218253" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="760" y="491.111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758" font-weight="bold" fill="var(--info-text)">Bundle</text>
  <text x="760" y="528.703704" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--info-text)">Image + manifests</text>
  <text x="760" y="560.925926" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--info-text)">published together</text>

  <rect x="920" y="448.148148" width="240" height="150.37037" rx="6.218253" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1040" y="491.111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758" font-weight="bold" fill="var(--ok-text)">Deploy</text>
  <text x="1040" y="528.703704" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--ok-text)">Apply the bundle,</text>
  <text x="1040" y="560.925926" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--ok-text)">no runtime edits</text>

  <line x1="320" y1="523.333333" x2="360" y2="523.333333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="523.333333" x2="640" y2="523.333333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="880" y1="523.333333" x2="920" y2="523.333333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

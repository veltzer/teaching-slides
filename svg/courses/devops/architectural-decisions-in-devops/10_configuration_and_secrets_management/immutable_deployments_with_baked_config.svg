<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="580" height="278.4000002592" rx="6.462198078413" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="92.1999996436" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.694725248285" font-weight="bold" fill="var(--danger-text)">Mutable Config at Runtime</text>
  <text x="330" y="144.4000003672" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--danger-text)">Env vars change without a new deploy</text>
  <text x="330" y="179.2000001296" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--danger-text)">Config drift between instances</text>
  <text x="330" y="213.999999892" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--danger-text)">Rollback does not restore old config</text>
  <text x="330" y="248.7999996544" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--danger-text)">Debugging crosses many dashboards</text>
  <text x="330" y="289.4000000972" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.155494676418" font-style="italic" fill="var(--danger-text)">Hard to reproduce incidents</text>

  <rect x="660" y="40" width="580" height="278.4000002592" rx="6.462198078413" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="92.1999996436" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.694725248285" font-weight="bold" fill="var(--ok-text)">Baked Into the Artifact</text>
  <text x="950" y="144.4000003672" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--ok-text)">Config rendered at build time</text>
  <text x="950" y="179.2000001296" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--ok-text)">Image plus config is one unit</text>
  <text x="950" y="213.999999892" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--ok-text)">Rollback ships the old bundle</text>
  <text x="950" y="248.7999996544" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--ok-text)">Same bits in every environment</text>
  <text x="950" y="289.4000000972" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.155494676418" font-style="italic" fill="var(--ok-text)">Incidents reproduce locally</text>

  <rect x="40" y="353.2000000216" width="1200" height="266.7999999784" rx="6.462198078413" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="399.6000000648" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.694725248285" font-weight="bold" fill="var(--text)">Build-Time Pipeline</text>

  <rect x="80" y="434.3999998272" width="240" height="162.3999996112" rx="6.462198078413" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="200" y="480.7999998704" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.38659319601" font-weight="bold" fill="var(--primary-text)">Values File</text>
  <text x="200" y="521.4000003132" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.078461143734" fill="var(--primary-text)">Per-env YAML</text>
  <text x="200" y="556.2000000756" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.078461143734" fill="var(--primary-text)">checked into git</text>

  <rect x="360" y="434.3999998272" width="240" height="162.3999996112" rx="6.462198078413" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="480.7999998704" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.38659319601" font-weight="bold" fill="var(--warn-text)">Render</text>
  <text x="480" y="521.4000003132" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.078461143734" fill="var(--warn-text)">Template + values,</text>
  <text x="480" y="556.2000000756" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.078461143734" fill="var(--warn-text)">secrets referenced</text>

  <rect x="640" y="434.3999998272" width="240" height="162.3999996112" rx="6.462198078413" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="760" y="480.7999998704" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.38659319601" font-weight="bold" fill="var(--info-text)">Bundle</text>
  <text x="760" y="521.4000003132" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.078461143734" fill="var(--info-text)">Image + manifests</text>
  <text x="760" y="556.2000000756" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.078461143734" fill="var(--info-text)">published together</text>

  <rect x="920" y="434.3999998272" width="240" height="162.3999996112" rx="6.462198078413" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1040" y="480.7999998704" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.38659319601" font-weight="bold" fill="var(--ok-text)">Deploy</text>
  <text x="1040" y="521.4000003132" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.078461143734" fill="var(--ok-text)">Apply the bundle,</text>
  <text x="1040" y="556.2000000756" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.078461143734" fill="var(--ok-text)">no runtime edits</text>

  <line x1="320" y1="515.5999996328" x2="360" y2="515.5999996328" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="600" y1="515.5999996328" x2="640" y2="515.5999996328" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="880" y1="515.5999996328" x2="920" y2="515.5999996328" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
</svg>

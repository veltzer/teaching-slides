<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:rect x="52.5128" y="49.2308" width="525.1281" height="590.7692" fill="#e3f2fd" stroke="#1565c0" stroke-width="3.5008" rx="14.0034" />
  <ns0:text x="315.0769" y="123.0769" text-anchor="middle" font-size="26.2564" font-weight="bold" fill="#1565c0">Config as Code</ns0:text>
  <ns0:text x="105.0256" y="196.9231" font-size="21.0052">+ Version controlled (git)</ns0:text>
  <ns0:text x="105.0256" y="258.4615" font-size="21.0052">+ Code review workflow</ns0:text>
  <ns0:text x="105.0256" y="320" font-size="21.0052">+ No extra infrastructure</ns0:text>
  <ns0:text x="105.0256" y="381.5384" font-size="21.0052">+ Easy rollback</ns0:text>
  <ns0:text x="105.0256" y="455.3846" font-size="21.0052">- Requires deploy to apply</ns0:text>
  <ns0:text x="105.0256" y="516.923" font-size="21.0052">- Not real-time</ns0:text>
  <ns0:text x="105.0256" y="590.7692" font-size="21.0052" font-weight="bold">Best: stable, audited config</ns0:text>
  <ns0:rect x="647.658" y="49.2308" width="525.1281" height="590.7692" fill="#fff3e0" stroke="#e65100" stroke-width="3.5008" rx="14.0034" />
  <ns0:text x="910.2221" y="123.0769" text-anchor="middle" font-size="26.2564" font-weight="bold" fill="#e65100">Config Service</ns0:text>
  <ns0:text x="700.1709" y="196.9231" font-size="21.0052">+ Real-time updates</ns0:text>
  <ns0:text x="700.1709" y="258.4615" font-size="21.0052">+ Dynamic feature flags</ns0:text>
  <ns0:text x="700.1709" y="320" font-size="21.0052">+ Cross-service consistency</ns0:text>
  <ns0:text x="700.1709" y="381.5384" font-size="21.0052">+ Built-in namespaces</ns0:text>
  <ns0:text x="700.1709" y="455.3846" font-size="21.0052">- Extra infra to manage</ns0:text>
  <ns0:text x="700.1709" y="516.923" font-size="21.0052">- Availability dependency</ns0:text>
  <ns0:text x="700.1709" y="590.7692" font-size="21.0052" font-weight="bold">Best: dynamic, runtime config</ns0:text>
</ns0:svg>
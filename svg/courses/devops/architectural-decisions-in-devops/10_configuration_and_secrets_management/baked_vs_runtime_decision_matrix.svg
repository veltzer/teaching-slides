<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:rect x="87.5214" y="49.2308" width="490.1196" height="590.7692" fill="#e3f2fd" stroke="#1565c0" stroke-width="3.5008" rx="14.0034" />
  <ns0:text x="332.5812" y="123.0769" text-anchor="middle" font-size="26.2564" font-weight="bold" fill="#1565c0">Baked-in Config</ns0:text>
  <ns0:text x="140.0342" y="196.9231" font-size="21.0052">+ Reproducible artifacts</ns0:text>
  <ns0:text x="140.0342" y="258.4615" font-size="21.0052">+ No external deps at start</ns0:text>
  <ns0:text x="140.0342" y="320" font-size="21.0052">+ Easy to audit</ns0:text>
  <ns0:text x="140.0342" y="381.5384" font-size="21.0052">- Rebuild per environment</ns0:text>
  <ns0:text x="140.0342" y="443.0768" font-size="21.0052">- Slow to change</ns0:text>
  <ns0:text x="140.0342" y="504.6154" font-size="21.0052">- Never for secrets</ns0:text>
  <ns0:text x="140.0342" y="578.4615" font-size="21.0052" font-weight="bold">Best: static settings</ns0:text>
  <ns0:rect x="647.658" y="49.2308" width="490.1196" height="590.7692" fill="#fff3e0" stroke="#e65100" stroke-width="3.5008" rx="14.0034" />
  <ns0:text x="892.7178" y="123.0769" text-anchor="middle" font-size="26.2564" font-weight="bold" fill="#e65100">Runtime Config</ns0:text>
  <ns0:text x="700.1709" y="196.9231" font-size="21.0052">+ Build once, deploy many</ns0:text>
  <ns0:text x="700.1709" y="258.4615" font-size="21.0052">+ Quick changes</ns0:text>
  <ns0:text x="700.1709" y="320" font-size="21.0052">+ Dynamic tuning</ns0:text>
  <ns0:text x="700.1709" y="381.5384" font-size="21.0052">- External dependency</ns0:text>
  <ns0:text x="700.1709" y="443.0768" font-size="21.0052">- Config drift risk</ns0:text>
  <ns0:text x="700.1709" y="504.6154" font-size="21.0052">- Harder to reproduce</ns0:text>
  <ns0:text x="700.1709" y="578.4615" font-size="21.0052" font-weight="bold">Best: env-specific values</ns0:text>
</ns0:svg>
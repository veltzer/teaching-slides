<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="91.4286" y="51.4286" width="512" height="617.1429" fill="#e3f2fd" stroke="#1565c0" stroke-width="3.6571" rx="14.6286" />
  <text x="347.4286" y="128.5714" text-anchor="middle" font-size="27.4286" font-weight="bold" fill="#1565c0">Baked-in Config</text>
  <text x="146.2857" y="205.7143" font-size="21.9429">+ Reproducible artifacts</text>
  <text x="146.2857" y="270" font-size="21.9429">+ No external deps at start</text>
  <text x="146.2857" y="334.2857" font-size="21.9429">+ Easy to audit</text>
  <text x="146.2857" y="398.5714" font-size="21.9429">- Rebuild per environment</text>
  <text x="146.2857" y="462.8571" font-size="21.9429">- Slow to change</text>
  <text x="146.2857" y="527.1429" font-size="21.9429">- Never for secrets</text>
  <text x="146.2857" y="604.2857" font-size="21.9429" font-weight="bold">Best: static settings</text>
  <rect x="676.5714" y="51.4286" width="512" height="617.1429" fill="#fff3e0" stroke="#e65100" stroke-width="3.6571" rx="14.6286" />
  <text x="932.5714" y="128.5714" text-anchor="middle" font-size="27.4286" font-weight="bold" fill="#e65100">Runtime Config</text>
  <text x="731.4286" y="205.7143" font-size="21.9429">+ Build once, deploy many</text>
  <text x="731.4286" y="270" font-size="21.9429">+ Quick changes</text>
  <text x="731.4286" y="334.2857" font-size="21.9429">+ Dynamic tuning</text>
  <text x="731.4286" y="398.5714" font-size="21.9429">- External dependency</text>
  <text x="731.4286" y="462.8571" font-size="21.9429">- Config drift risk</text>
  <text x="731.4286" y="527.1429" font-size="21.9429">- Harder to reproduce</text>
  <text x="731.4286" y="604.2857" font-size="21.9429" font-weight="bold">Best: env-specific values</text>
</svg>
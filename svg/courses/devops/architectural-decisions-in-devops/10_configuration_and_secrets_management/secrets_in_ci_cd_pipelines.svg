<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr6" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,32.7273 5.4857,0" fill="#333" />
    </marker>
  </defs>
  <rect x="446.1539" y="40" width="369.2308" height="193.3333" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="630.7692" y="160.2962" text-anchor="middle" font-size="29.472" font-weight="bold">CI/CD Pipeline</text>
  <rect x="40" y="426.6667" width="258.4615" height="193.3333" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="169.2308" y="504" text-anchor="middle" font-size="23.1566" font-weight="bold">Platform Secrets</text>
  <text x="169.2308" y="572.7409" text-anchor="middle" font-size="21.0514">GitHub, GitLab vars</text>
  <rect x="353.8462" y="426.6667" width="258.4615" height="193.3333" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="483.077" y="504" text-anchor="middle" font-size="23.1566" font-weight="bold">Vault / OIDC</text>
  <text x="483.077" y="572.7409" text-anchor="middle" font-size="21.0514">Dynamic, short-lived</text>
  <rect x="667.6923" y="426.6667" width="258.4615" height="193.3333" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="796.923" y="504" text-anchor="middle" font-size="23.1566" font-weight="bold">Cloud IAM</text>
  <text x="796.923" y="572.7409" text-anchor="middle" font-size="21.0514">IRSA, Workload ID</text>
  <rect x="981.5385" y="426.6667" width="258.4615" height="193.3333" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="1110.7692" y="504" text-anchor="middle" font-size="23.1566" font-weight="bold">SOPS Decrypt</text>
  <text x="1110.7692" y="572.7409" text-anchor="middle" font-size="21.0514">In-pipeline decrypt</text>
  <line x1="169.2308" y1="426.6667" x2="538.4615" y2="233.3333" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arr6)" />
  <line x1="483.077" y1="426.6667" x2="593.8462" y2="233.3333" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arr6)" />
  <line x1="796.923" y1="426.6667" x2="686.1538" y2="233.3333" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arr6)" />
  <line x1="1110.7692" y1="426.6667" x2="760" y2="233.3333" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arr6)" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr4" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,24 5.4857,0" fill="#333" />
    </marker>
  </defs>
  <rect x="459.0477" y="40" width="380.9524" height="120.8333" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="649.5238" y="112.5" text-anchor="middle" font-size="26.2185" font-weight="bold">Vault Server</text>
  <rect x="78.0953" y="233.3333" width="247.619" height="96.6667" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="201.9048" y="293.75" text-anchor="middle" font-size="22.473">Auth Methods</text>
  <rect x="382.8572" y="233.3333" width="247.619" height="96.6667" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="506.6666" y="293.75" text-anchor="middle" font-size="22.473">Secrets Engines</text>
  <rect x="687.619" y="233.3333" width="247.619" height="96.6667" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="811.4286" y="293.75" text-anchor="middle" font-size="22.473">Audit Devices</text>
  <rect x="992.381" y="233.3333" width="247.619" height="96.6667" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="1116.1904" y="293.75" text-anchor="middle" font-size="22.473">Policies (ACL)</text>
  <line x1="201.9048" y1="233.3333" x2="554.2857" y2="160.8333" stroke="var(--text)" stroke-width="2" marker-end="url(#arr4)" />
  <line x1="506.6666" y1="233.3333" x2="611.4286" y2="160.8333" stroke="var(--text)" stroke-width="2" marker-end="url(#arr4)" />
  <line x1="811.4286" y1="233.3333" x2="706.6666" y2="160.8333" stroke="var(--text)" stroke-width="2" marker-end="url(#arr4)" />
  <line x1="1116.1904" y1="233.3333" x2="782.8571" y2="160.8333" stroke="var(--text)" stroke-width="2" marker-end="url(#arr4)" />
  <rect x="459.0477" y="475" width="380.9524" height="96.6667" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="649.5238" y="535.4167" text-anchor="middle" font-size="22.473">Storage Backend</text>
  <text x="649.5238" y="620" text-anchor="middle" font-size="20.6002" fill="var(--text-muted)">(Consul, Raft, S3, etc.)</text>
  <line x1="649.5238" y1="160.8333" x2="649.5238" y2="475" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="9.1429 9.1429" />
  <rect x="40" y="475" width="266.6666" height="96.6667" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="173.3333" y="535.4167" text-anchor="middle" font-size="22.473">App / Service</text>
  <line x1="306.6666" y1="523.3333" x2="459.0477" y2="523.3333" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr4)" />
  <text x="382.8572" y="504" text-anchor="middle" font-size="18.7275" fill="var(--primary-accent)">API call</text>
</svg>
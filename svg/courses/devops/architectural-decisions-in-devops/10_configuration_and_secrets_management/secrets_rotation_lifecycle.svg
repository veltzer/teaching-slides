<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="305.367" y="77.05" width="542.95" height="542.95" rx="14" fill="none" stroke="var(--border)" stroke-width="1.0979" stroke-dasharray="4.3917 2.1959"/>
  <rect x="418.9474" y="40" width="315.7893" height="94.9308" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="5.9277" filter="url(#shadow)"/>
  <text x="576.8422" y="99.3316" text-anchor="middle" font-size="29.6156" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Generate</text>
  <rect x="924.2107" y="206.1292" width="315.7893" height="94.9308" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="5.9277" filter="url(#shadow)"/>
  <text x="1082.105" y="265.4607" text-anchor="middle" font-size="29.6156" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Distribute</text>
  <rect x="861.0526" y="467.1885" width="315.7893" height="94.9308" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="5.9277" filter="url(#shadow)"/>
  <text x="1018.9474" y="526.5203" text-anchor="middle" font-size="29.6156" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Use</text>
  <rect x="134.7367" y="467.1885" width="315.7893" height="94.9308" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="5.9277" filter="url(#shadow)"/>
  <text x="292.6315" y="526.5203" text-anchor="middle" font-size="29.6156" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Monitor</text>
  <rect x="40" y="206.1292" width="315.7893" height="94.9308" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="5.9277" filter="url(#shadow)"/>
  <text x="197.8948" y="265.4607" text-anchor="middle" font-size="29.6156" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Revoke</text>
  <path d="M 734.737 87.4657 Q 924.2107 111.1982 924.2107 217.9951" stroke="var(--text)" stroke-width="1.0979" fill="none" marker-end="url(#arrow)"/>
  <path d="M 1145.2633 301.06 Q 1145.2633 443.4557 1161.0527 467.1885" stroke="var(--text)" stroke-width="1.0979" fill="none" marker-end="url(#arrow)"/>
  <path d="M 861.0526 526.5203 Q 671.5789 562.1193 450.5263 526.5203" stroke="var(--text)" stroke-width="1.0979" fill="none" marker-end="url(#arrow)"/>
  <path d="M 166.3159 467.1885 Q 103.1578 372.2579 134.7367 301.06" stroke="var(--text)" stroke-width="1.0979" fill="none" marker-end="url(#arrow)"/>
  <path d="M 292.6315 206.1292 Q 387.3685 111.1982 418.9474 99.3316" stroke="var(--text)" stroke-width="1.0979" fill="none" marker-end="url(#arrow)"/>
</svg>

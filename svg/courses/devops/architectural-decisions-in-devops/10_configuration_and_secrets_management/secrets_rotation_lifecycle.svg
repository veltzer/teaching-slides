<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr5" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 5.4857,0" fill="#333" />
    </marker>
  </defs>
  <circle cx="603.0592" cy="375.4545" r="203.1746" fill="none" stroke="var(--border)" stroke-width="2.3925" stroke-dasharray="9.5701 4.7851" />
  <rect x="510.7071" y="80" width="184.7041" height="90.9091" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="9.2641" />
  <text x="603.0592" y="136.8181" text-anchor="middle" font-size="22.1646" font-weight="bold">Generate</text>
  <rect x="806.2338" y="239.0909" width="184.7041" height="90.9091" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="9.2641" />
  <text x="898.5858" y="295.909" text-anchor="middle" font-size="22.1646" font-weight="bold">Distribute</text>
  <rect x="769.2929" y="489.0909" width="184.7041" height="90.9091" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="9.2641" />
  <text x="861.645" y="545.909" text-anchor="middle" font-size="22.1646" font-weight="bold">Use</text>
  <rect x="344.4734" y="489.0909" width="184.7041" height="90.9091" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="9.2641" />
  <text x="436.8255" y="545.909" text-anchor="middle" font-size="22.1646" font-weight="bold">Monitor</text>
  <rect x="289.0621" y="239.0909" width="184.7041" height="90.9091" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="9.2641" />
  <text x="381.4142" y="295.909" text-anchor="middle" font-size="22.1646" font-weight="bold">Revoke</text>
  <path d="M 695.4113 125.4545 Q 806.2338 148.1818 806.2338 250.4545" stroke="var(--text)" stroke-width="2.3925" fill="none" marker-end="url(#arr5)" />
  <path d="M 935.5267 330 Q 935.5267 466.3635 944.7619 489.0909" stroke="var(--text)" stroke-width="2.3925" fill="none" marker-end="url(#arr5)" />
  <path d="M 769.2929 545.909 Q 658.4704 580 529.1775 545.909" stroke="var(--text)" stroke-width="2.3925" fill="none" marker-end="url(#arr5)" />
  <path d="M 362.9438 489.0909 Q 326.0029 398.1817 344.4734 330" stroke="var(--text)" stroke-width="2.3925" fill="none" marker-end="url(#arr5)" />
  <path d="M 436.8255 239.0909 Q 492.2367 148.1818 510.7071 136.8181" stroke="var(--text)" stroke-width="2.3925" fill="none" marker-end="url(#arr5)" />
</svg>
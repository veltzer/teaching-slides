<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 5.4857,0" fill="#333" />
    </marker>
  </defs>
  <rect x="35.8708" y="88.2759" width="233.1604" height="110.3448" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="152.451" y="154.4828" text-anchor="middle" font-size="23.316" font-weight="bold">Metrics</text>
  <rect x="322.8375" y="88.2759" width="233.1604" height="110.3448" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="439.4176" y="154.4828" text-anchor="middle" font-size="23.316" font-weight="bold">Alert Rules</text>
  <rect x="609.8041" y="88.2759" width="233.1604" height="110.3448" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="726.3842" y="154.4828" text-anchor="middle" font-size="23.316" font-weight="bold">Alert Manager</text>
  <rect x="609.8041" y="264.8276" width="233.1604" height="77.2414" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="726.3842" y="315.5862" text-anchor="middle" font-size="19.729">Grouping</text>
  <rect x="609.8041" y="364.1379" width="233.1604" height="77.2414" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="726.3842" y="414.8966" text-anchor="middle" font-size="19.729">Deduplication</text>
  <rect x="609.8041" y="463.4483" width="233.1604" height="77.2414" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="726.3842" y="514.2069" text-anchor="middle" font-size="19.729">Silencing</text>
  <rect x="968.5123" y="198.6207" width="233.1604" height="77.2414" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1085.0925" y="249.3793" text-anchor="middle" font-size="21.5225">Slack / Email</text>
  <rect x="968.5123" y="320" width="233.1604" height="77.2414" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="1085.0925" y="370.7586" text-anchor="middle" font-size="21.5225">PagerDuty</text>
  <rect x="968.5123" y="441.3793" width="233.1604" height="77.2414" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="1085.0925" y="492.1379" text-anchor="middle" font-size="21.5225">Webhook</text>
  <line x1="269.0312" y1="143.4483" x2="322.8375" y2="143.4483" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="555.9978" y1="143.4483" x2="609.8041" y2="143.4483" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="726.3842" y1="198.6207" x2="726.3842" y2="264.8276" stroke="var(--primary-border)" stroke-width="1.7936" marker-end="url(#arrow)" />
  <line x1="842.9645" y1="302.3448" x2="968.5123" y2="236.1379" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="842.9645" y1="401.6552" x2="968.5123" y2="357.5172" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="842.9645" y1="500.9655" x2="968.5123" y2="478.8966" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="627.7395" y="640" text-anchor="middle" font-size="21.5225" fill="var(--text-muted)">Alerts flow from metrics through rules, processing, then routing</text>
</svg>
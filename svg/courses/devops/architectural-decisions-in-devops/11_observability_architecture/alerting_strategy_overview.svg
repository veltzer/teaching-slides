<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 5.4857,0" fill="#333" />
    </marker>
  </defs>
  <rect x="40" y="40" width="240" height="116" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="160" y="109.6" text-anchor="middle" font-size="24.2541" font-weight="bold">Metrics</text>
  <rect x="335.3847" y="40" width="240" height="116" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="455.3846" y="109.6" text-anchor="middle" font-size="24.2541" font-weight="bold">Alert Rules</text>
  <rect x="630.7693" y="40" width="240" height="116" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="750.7692" y="109.6" text-anchor="middle" font-size="24.2541" font-weight="bold">Alert Manager</text>
  <rect x="630.7693" y="225.6" width="240" height="81.2" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="750.7692" y="278.96" text-anchor="middle" font-size="20.5228">Grouping</text>
  <rect x="630.7693" y="329.9999" width="240" height="81.2" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="750.7692" y="383.36" text-anchor="middle" font-size="20.5228">Deduplication</text>
  <rect x="630.7693" y="434.4" width="240" height="81.2" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="750.7692" y="487.76" text-anchor="middle" font-size="20.5228">Silencing</text>
  <rect x="1000" y="156" width="240" height="81.2" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1120" y="209.36" text-anchor="middle" font-size="22.3884">Slack / Email</text>
  <rect x="1000" y="283.6" width="240" height="81.2" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1120" y="336.96" text-anchor="middle" font-size="22.3884">PagerDuty</text>
  <rect x="1000" y="411.2" width="240" height="81.2" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1120" y="464.56" text-anchor="middle" font-size="22.3884">Webhook</text>
  <line x1="280" y1="98" x2="335.3847" y2="98" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="575.3846" y1="98" x2="630.7693" y2="98" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="750.7692" y1="156" x2="750.7692" y2="225.6" stroke="var(--primary-border)" stroke-width="1.7936" marker-end="url(#arrow)" />
  <line x1="870.7693" y1="265.0399" x2="1000" y2="195.4399" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="870.7693" y1="369.44" x2="1000" y2="323.0399" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="870.7693" y1="473.84" x2="1000" y2="450.64" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="649.2308" y="620" text-anchor="middle" font-size="22.3884" fill="var(--text-muted)">Alerts flow from metrics through rules, processing, then routing</text>
</svg>
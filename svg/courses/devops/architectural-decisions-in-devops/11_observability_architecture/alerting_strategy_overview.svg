<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="240" height="116" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="160" y="109.6" text-anchor="middle" font-size="24.2541" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Metrics</text>
  <rect x="335.3847" y="40" width="240" height="116" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="455.3846" y="109.6" text-anchor="middle" font-size="24.2541" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Alert Rules</text>
  <rect x="630.7693" y="40" width="240" height="116" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="750.7692" y="109.6" text-anchor="middle" font-size="24.2541" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Alert Manager</text>
  <rect x="630.7693" y="225.6" width="240" height="81.2" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="750.7692" y="278.96" text-anchor="middle" font-size="20.5228" font-family="Arial, sans-serif" fill="var(--info-text)">Grouping</text>
  <rect x="630.7693" y="329.9999" width="240" height="81.2" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="750.7692" y="383.36" text-anchor="middle" font-size="20.5228" font-family="Arial, sans-serif" fill="var(--info-text)">Deduplication</text>
  <rect x="630.7693" y="434.4" width="240" height="81.2" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="750.7692" y="487.76" text-anchor="middle" font-size="20.5228" font-family="Arial, sans-serif" fill="var(--info-text)">Silencing</text>
  <rect x="1000" y="156" width="240" height="81.2" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1120" y="209.36" text-anchor="middle" font-size="22.3884" font-family="Arial, sans-serif" fill="var(--ok-text)">Slack / Email</text>
  <rect x="1000" y="283.6" width="240" height="81.2" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1120" y="336.96" text-anchor="middle" font-size="22.3884" font-family="Arial, sans-serif" fill="var(--danger-text)">PagerDuty</text>
  <rect x="1000" y="411.2" width="240" height="81.2" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1120" y="464.56" text-anchor="middle" font-size="22.3884" font-family="Arial, sans-serif" fill="var(--warn-text)">Webhook</text>
  <line x1="280" y1="98" x2="335.3847" y2="98" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="575.3846" y1="98" x2="630.7693" y2="98" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="750.7692" y1="156" x2="750.7692" y2="225.6" stroke="var(--primary-border)" stroke-width="1.7936" marker-end="url(#arrow)"/>
  <line x1="870.7693" y1="265.0399" x2="1000" y2="195.4399" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="870.7693" y1="369.44" x2="1000" y2="323.0399" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="870.7693" y1="473.84" x2="1000" y2="450.64" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="649.2308" y="620" text-anchor="middle" font-size="22.3884" fill="var(--text-muted)" font-family="Arial, sans-serif">Alerts flow from metrics through rules, processing, then routing</text>
</svg>

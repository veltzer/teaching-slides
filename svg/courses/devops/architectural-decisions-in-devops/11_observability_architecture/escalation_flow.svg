<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow5" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,24 5.4857,0" fill="#333" />
    </marker>
  </defs>
  <rect x="91.4286" y="72" width="292.5714" height="120" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="237.7143" y="144" text-anchor="middle" font-size="25.6" font-weight="bold">Alert Fires</text>
  <rect x="91.4286" y="288" width="292.5714" height="120" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="237.7143" y="336" text-anchor="middle" font-size="23.7714" font-weight="bold">Primary On-Call</text>
  <text x="237.7143" y="379.2" text-anchor="middle" font-size="20.1143">Ack within 5 min</text>
  <rect x="493.7143" y="288" width="292.5714" height="120" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="640" y="336" text-anchor="middle" font-size="23.7714" font-weight="bold">Secondary On-Call</text>
  <text x="640" y="379.2" text-anchor="middle" font-size="20.1143">Ack within 10 min</text>
  <rect x="896" y="288" width="292.5714" height="120" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="1042.2857" y="336" text-anchor="middle" font-size="23.7714" font-weight="bold">Engineering Lead</text>
  <text x="1042.2857" y="379.2" text-anchor="middle" font-size="20.1143">Ack within 15 min</text>
  <line x1="237.7143" y1="192" x2="237.7143" y2="288" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="384" y1="348" x2="493.7143" y2="348" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="438.8571" y="331.2" font-size="18.2857" fill="var(--warn-accent)">no ack</text>
  <line x1="786.2857" y1="348" x2="896" y2="348" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="841.1429" y="331.2" font-size="18.2857" fill="var(--info-accent)">no ack</text>
  <rect x="91.4286" y="504" width="1097.1429" height="120" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="640" y="552" text-anchor="middle" font-size="23.7714" font-weight="bold" fill="var(--ok-accent)">Incident Response</text>
  <text x="640" y="595.2" text-anchor="middle" font-size="20.1143" fill="var(--text-muted)">Follow runbook, communicate status, resolve or escalate</text>
  <line x1="237.7143" y1="408" x2="237.7143" y2="504" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="265.1429" y="468" font-size="18.2857" fill="var(--ok-accent)">ack</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow5" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,24 5.4857,0" fill="#333" />
    </marker>
  </defs>
  <rect x="40" y="40" width="320" height="126.087" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="200" y="115.6522" text-anchor="middle" font-size="27.4437" font-weight="bold">Alert Fires</text>
  <rect x="40" y="266.9565" width="320" height="126.087" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="200" y="317.3913" text-anchor="middle" font-size="25.4835" font-weight="bold">Primary On-Call</text>
  <text x="200" y="362.7826" text-anchor="middle" font-size="21.563">Ack within 5 min</text>
  <rect x="480" y="266.9565" width="320" height="126.087" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="317.3913" text-anchor="middle" font-size="25.4835" font-weight="bold">Secondary On-Call</text>
  <text x="639.9999" y="362.7826" text-anchor="middle" font-size="21.563">Ack within 10 min</text>
  <rect x="919.9999" y="266.9565" width="320" height="126.087" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1079.9999" y="317.3913" text-anchor="middle" font-size="25.4835" font-weight="bold">Engineering Lead</text>
  <text x="1079.9999" y="362.7826" text-anchor="middle" font-size="21.563">Ack within 15 min</text>
  <line x1="200" y1="166.087" x2="200" y2="266.9565" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="360" y1="330" x2="480" y2="330" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="419.9999" y="312.3478" font-size="19.6027" fill="var(--warn-accent)">no ack</text>
  <line x1="799.9999" y1="330" x2="919.9999" y2="330" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="860" y="312.3478" font-size="19.6027" fill="var(--info-accent)">no ack</text>
  <rect x="40" y="493.913" width="1200" height="126.087" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="544.3478" text-anchor="middle" font-size="25.4835" font-weight="bold" fill="var(--ok-accent)">Incident Response</text>
  <text x="639.9999" y="589.7391" text-anchor="middle" font-size="21.563" fill="var(--text-muted)">Follow runbook, communicate status, resolve or escalate</text>
  <line x1="200" y1="393.0435" x2="200" y2="493.913" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="230" y="456.087" font-size="19.6027" fill="var(--ok-accent)">ack</text>
</svg>
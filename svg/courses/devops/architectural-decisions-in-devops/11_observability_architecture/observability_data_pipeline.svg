<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow6" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,27.6923 5.4857,0" fill="#333" />
    </marker>
  </defs>
  <rect x="36.5714" y="138.4615" width="182.8571" height="166.1538" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="128" y="207.6923" text-anchor="middle" font-size="20.1143" font-weight="bold">Applications</text>
  <text x="128" y="263.0769" text-anchor="middle" font-size="18.2857">SDK / Agent</text>
  <rect x="292.5714" y="138.4615" width="219.4286" height="166.1538" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="402.2857" y="207.6923" text-anchor="middle" font-size="20.1143" font-weight="bold">Collector</text>
  <text x="402.2857" y="263.0769" text-anchor="middle" font-size="18.2857">OTel Collector</text>
  <rect x="585.1429" y="55.3846" width="219.4286" height="110.7692" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="694.8571" y="124.6154" text-anchor="middle" font-size="20.1143">Filter / Enrich</text>
  <rect x="585.1429" y="221.5385" width="219.4286" height="110.7692" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="694.8571" y="290.7692" text-anchor="middle" font-size="20.1143">Sample / Batch</text>
  <rect x="896" y="41.5385" width="182.8571" height="110.7692" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="987.4286" y="110.7692" text-anchor="middle" font-size="20.1143" font-weight="bold">Metrics DB</text>
  <rect x="896" y="180" width="182.8571" height="110.7692" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="987.4286" y="249.2308" text-anchor="middle" font-size="20.1143" font-weight="bold">Log Store</text>
  <rect x="896" y="318.4615" width="182.8571" height="110.7692" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="987.4286" y="387.6923" text-anchor="middle" font-size="20.1143" font-weight="bold">Trace Store</text>
  <rect x="1152" y="180" width="100.5714" height="110.7692" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="1203.2" y="249.2308" text-anchor="middle" font-size="20.1143" font-weight="bold">UI</text>
  <line x1="219.4286" y1="221.5385" x2="292.5714" y2="221.5385" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow6)" />
  <line x1="512" y1="221.5385" x2="585.1429" y2="166.1538" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow6)" />
  <line x1="804.5714" y1="110.7692" x2="896" y2="96.9231" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow6)" />
  <line x1="804.5714" y1="221.5385" x2="896" y2="235.3846" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow6)" />
  <line x1="804.5714" y1="276.9231" x2="896" y2="346.1538" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow6)" />
  <line x1="1078.8571" y1="235.3846" x2="1152" y2="235.3846" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow6)" />
  <text x="640" y="553.8462" text-anchor="middle" font-size="21.9429" fill="var(--text-muted)">Collectors process data before it reaches storage backends</text>
</svg>
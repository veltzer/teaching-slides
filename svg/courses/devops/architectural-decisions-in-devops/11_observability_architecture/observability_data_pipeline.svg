<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="149.7296" width="180.4511" height="188.1081" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="130.2256" y="228.1081" text-anchor="middle" font-size="21.2607" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Applications</text>
  <text x="130.2256" y="290.8107" text-anchor="middle" font-size="19.3279" font-family="Arial, sans-serif" fill="var(--primary-text)">SDK / Agent</text>
  <rect x="292.6316" y="149.7296" width="216.5414" height="188.1081" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="400.9023" y="228.1081" text-anchor="middle" font-size="21.2607" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Collector</text>
  <text x="400.9023" y="290.8107" text-anchor="middle" font-size="19.3279" font-family="Arial, sans-serif" fill="var(--warn-text)">OTel Collector</text>
  <rect x="581.3535" y="55.6756" width="216.5414" height="125.4054" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="689.624" y="134.054" text-anchor="middle" font-size="21.2607" font-family="Arial, sans-serif" fill="var(--primary-text)">Filter / Enrich</text>
  <rect x="581.3535" y="243.7838" width="216.5414" height="125.4054" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="689.624" y="322.1621" text-anchor="middle" font-size="21.2607" font-family="Arial, sans-serif" fill="var(--primary-text)">Sample / Batch</text>
  <rect x="888.1203" y="40" width="180.4511" height="125.4054" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="978.3459" y="118.3783" text-anchor="middle" font-size="21.2607" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Metrics DB</text>
  <rect x="888.1203" y="196.7567" width="180.4511" height="125.4054" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="978.3459" y="275.1351" text-anchor="middle" font-size="21.2607" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Log Store</text>
  <rect x="888.1203" y="353.5134" width="180.4511" height="125.4054" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="978.3459" y="431.8918" text-anchor="middle" font-size="21.2607" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Trace Store</text>
  <rect x="1140.7519" y="196.7567" width="99.2481" height="125.4054" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1191.2782" y="275.1351" text-anchor="middle" font-size="21.2607" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">UI</text>
  <line x1="220.4512" y1="243.7838" x2="292.6316" y2="243.7838" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="509.173" y1="243.7838" x2="581.3535" y2="181.081" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="797.8947" y1="118.3783" x2="888.1203" y2="102.7027" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="797.8947" y1="243.7838" x2="888.1203" y2="259.4594" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="797.8947" y1="306.4865" x2="888.1203" y2="384.8648" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1068.5714" y1="259.4594" x2="1140.7519" y2="259.4594" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="635.4887" y="620" text-anchor="middle" font-size="23.1935" fill="var(--text-muted)" font-family="Arial, sans-serif">Collectors process data before it reaches storage backends</text>
</svg>

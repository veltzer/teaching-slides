<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow6" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,27.6923 5.4857,0" fill="#333" />
    </marker>
  </defs>
  <rect x="40" y="149.7296" width="180.4511" height="188.1081" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="130.2256" y="228.1081" text-anchor="middle" font-size="21.2607" font-weight="bold">Applications</text>
  <text x="130.2256" y="290.8107" text-anchor="middle" font-size="19.3279">SDK / Agent</text>
  <rect x="292.6316" y="149.7296" width="216.5414" height="188.1081" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="400.9023" y="228.1081" text-anchor="middle" font-size="21.2607" font-weight="bold">Collector</text>
  <text x="400.9023" y="290.8107" text-anchor="middle" font-size="19.3279">OTel Collector</text>
  <rect x="581.3535" y="55.6756" width="216.5414" height="125.4054" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="689.624" y="134.054" text-anchor="middle" font-size="21.2607">Filter / Enrich</text>
  <rect x="581.3535" y="243.7838" width="216.5414" height="125.4054" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="689.624" y="322.1621" text-anchor="middle" font-size="21.2607">Sample / Batch</text>
  <rect x="888.1203" y="40" width="180.4511" height="125.4054" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="978.3459" y="118.3783" text-anchor="middle" font-size="21.2607" font-weight="bold">Metrics DB</text>
  <rect x="888.1203" y="196.7567" width="180.4511" height="125.4054" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="978.3459" y="275.1351" text-anchor="middle" font-size="21.2607" font-weight="bold">Log Store</text>
  <rect x="888.1203" y="353.5134" width="180.4511" height="125.4054" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="978.3459" y="431.8918" text-anchor="middle" font-size="21.2607" font-weight="bold">Trace Store</text>
  <rect x="1140.7519" y="196.7567" width="99.2481" height="125.4054" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1191.2782" y="275.1351" text-anchor="middle" font-size="21.2607" font-weight="bold">UI</text>
  <line x1="220.4512" y1="243.7838" x2="292.6316" y2="243.7838" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow6)" />
  <line x1="509.173" y1="243.7838" x2="581.3535" y2="181.081" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow6)" />
  <line x1="797.8947" y1="118.3783" x2="888.1203" y2="102.7027" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow6)" />
  <line x1="797.8947" y1="243.7838" x2="888.1203" y2="259.4594" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow6)" />
  <line x1="797.8947" y1="306.4865" x2="888.1203" y2="384.8648" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow6)" />
  <line x1="1068.5714" y1="259.4594" x2="1140.7519" y2="259.4594" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow6)" />
  <text x="635.4887" y="620" text-anchor="middle" font-size="23.1935" fill="var(--text-muted)">Collectors process data before it reaches storage backends</text>
</svg>
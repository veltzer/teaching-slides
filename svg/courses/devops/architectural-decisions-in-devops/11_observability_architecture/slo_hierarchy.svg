<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow4" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,21.1765 5.4857,0" fill="#333" />
    </marker>
  </defs>
  <rect x="350.8793" y="40.6349" width="526.319" height="111.746" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="614.0388" y="85.3334" text-anchor="middle" font-size="24.5616" font-weight="bold" fill="var(--danger-accent)">SLA (Service Level Agreement)</text>
  <text x="614.0388" y="125.9682" text-anchor="middle" font-size="19.2984" fill="var(--text-muted)">Contract with customers, financial penalties</text>
  <rect x="350.8793" y="203.1746" width="526.319" height="111.746" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="614.0388" y="247.873" text-anchor="middle" font-size="24.5616" font-weight="bold" fill="var(--warn-accent)">SLO (Service Level Objective)</text>
  <text x="614.0388" y="288.508" text-anchor="middle" font-size="19.2984" fill="var(--text-muted)">Internal target, tighter than SLA</text>
  <rect x="350.8793" y="365.7143" width="526.319" height="111.746" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="614.0388" y="410.4127" text-anchor="middle" font-size="24.5616" font-weight="bold" fill="var(--ok-accent)">SLI (Service Level Indicator)</text>
  <text x="614.0388" y="451.0476" text-anchor="middle" font-size="19.2984" fill="var(--text-muted)">The actual metric being measured</text>
  <line x1="614.0388" y1="152.3809" x2="614.0388" y2="203.1746" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="614.0388" y1="314.9207" x2="614.0388" y2="365.7143" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="982.4621" y="91.4286" font-size="19.2984" fill="var(--danger-accent)">99.9% availability/month</text>
  <text x="982.4621" y="253.9683" font-size="19.2984" fill="var(--warn-accent)">99.95% availability/month</text>
  <text x="982.4621" y="416.5079" font-size="19.2984" fill="var(--ok-accent)">successful_requests / total</text>
  <rect x="350.8793" y="528.254" width="526.319" height="111.746" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="614.0388" y="572.9524" text-anchor="middle" font-size="24.5616" font-weight="bold" fill="var(--primary-accent)">Error Budget</text>
  <text x="614.0388" y="613.5873" text-anchor="middle" font-size="19.2984" fill="var(--text-muted)">Allowed failures = 1 - SLO target</text>
  <line x1="614.0388" y1="477.4604" x2="614.0388" y2="528.254" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="26.821872" font-weight="bold" fill="var(--text)">SLA / SLO / SLI / Error Budget</text>
  <rect x="40" y="77.247706" width="1200" height="127.706422" rx="6.189663" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="80" y="141.100917" font-size="33.011535" font-weight="bold" fill="var(--danger-text)">SLA</text>
  <text x="80" y="178.348624" font-size="17.537378" fill="var(--danger-text)">Service Level Agreement</text>
  <text x="520" y="141.100917" font-size="20.63221" fill="var(--danger-text)">Contract with customers, penalties</text>
  <text x="520" y="178.348624" font-size="17.537378" fill="var(--danger-text)">example: 99.9% monthly</text>
  <rect x="40" y="215.59633" width="1200" height="127.706422" rx="6.189663" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="80" y="279.449541" font-size="33.011535" font-weight="bold" fill="var(--warn-text)">SLO</text>
  <text x="80" y="316.697248" font-size="17.537378" fill="var(--warn-text)">Service Level Objective</text>
  <text x="520" y="279.449541" font-size="20.63221" fill="var(--warn-text)">Internal target, tighter than SLA</text>
  <text x="520" y="316.697248" font-size="17.537378" fill="var(--warn-text)">example: 99.95% monthly</text>
  <rect x="40" y="353.944954" width="1200" height="127.706422" rx="6.189663" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="80" y="417.798165" font-size="33.011535" font-weight="bold" fill="var(--ok-text)">SLI</text>
  <text x="80" y="455.045872" font-size="17.537378" fill="var(--ok-text)">Service Level Indicator</text>
  <text x="520" y="417.798165" font-size="20.63221" fill="var(--ok-text)">Actual measured metric</text>
  <text x="520" y="455.045872" font-size="17.537378" fill="var(--ok-text)">example: successful / total</text>
  <rect x="40" y="492.293578" width="1200" height="127.706422" rx="6.189663" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="80" y="556.146789" font-size="33.011535" font-weight="bold" fill="var(--primary-text)">Budget</text>
  <text x="80" y="593.394495" font-size="17.537378" fill="var(--primary-text)">Error Budget</text>
  <text x="520" y="556.146789" font-size="20.63221" fill="var(--primary-text)">Allowed failures = 1 - SLO</text>
  <text x="520" y="593.394495" font-size="17.537378" fill="var(--primary-text)">example: 0.05% = ~22m/month</text>
</svg>

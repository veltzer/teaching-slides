<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="26.821872" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">SLA / SLO / SLI / Error Budget</text>
  <rect x="40" y="77.247706" width="1200" height="127.706422" rx="6.189663" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="80" y="141.100917" font-size="33.011535" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">SLA</text>
  <text x="80" y="178.348624" font-size="17.537378" fill="var(--danger-text)" font-family="Arial, sans-serif">Service Level Agreement</text>
  <text x="520" y="141.100917" font-size="20.63221" fill="var(--danger-text)" font-family="Arial, sans-serif">Contract with customers, penalties</text>
  <text x="520" y="178.348624" font-size="17.537378" fill="var(--danger-text)" font-family="Arial, sans-serif">example: 99.9% monthly</text>
  <rect x="40" y="215.59633" width="1200" height="127.706422" rx="6.189663" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="80" y="279.449541" font-size="33.011535" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">SLO</text>
  <text x="80" y="316.697248" font-size="17.537378" fill="var(--warn-text)" font-family="Arial, sans-serif">Service Level Objective</text>
  <text x="520" y="279.449541" font-size="20.63221" fill="var(--warn-text)" font-family="Arial, sans-serif">Internal target, tighter than SLA</text>
  <text x="520" y="316.697248" font-size="17.537378" fill="var(--warn-text)" font-family="Arial, sans-serif">example: 99.95% monthly</text>
  <rect x="40" y="353.944954" width="1200" height="127.706422" rx="6.189663" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="80" y="417.798165" font-size="33.011535" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">SLI</text>
  <text x="80" y="455.045872" font-size="17.537378" fill="var(--ok-text)" font-family="Arial, sans-serif">Service Level Indicator</text>
  <text x="520" y="417.798165" font-size="20.63221" fill="var(--ok-text)" font-family="Arial, sans-serif">Actual measured metric</text>
  <text x="520" y="455.045872" font-size="17.537378" fill="var(--ok-text)" font-family="Arial, sans-serif">example: successful / total</text>
  <rect x="40" y="492.293578" width="1200" height="127.706422" rx="6.189663" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="80" y="556.146789" font-size="33.011535" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Budget</text>
  <text x="80" y="593.394495" font-size="17.537378" fill="var(--primary-text)" font-family="Arial, sans-serif">Error Budget</text>
  <text x="520" y="556.146789" font-size="20.63221" fill="var(--primary-text)" font-family="Arial, sans-serif">Allowed failures = 1 - SLO</text>
  <text x="520" y="593.394495" font-size="17.537378" fill="var(--primary-text)" font-family="Arial, sans-serif">example: 0.05% = ~22m/month</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,24 5.4857,0" fill="#333" />
    </marker>
  </defs>
  <text x="386.0318" y="100.8334" text-anchor="middle" font-size="25.3967" font-weight="bold" fill="var(--primary-accent)">Pull Model</text>
  <rect x="266.9841" y="142.5" width="238.0952" height="104.1667" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="8.631" />
  <text x="386.0318" y="205.0001" text-anchor="middle" font-size="22.2223">Prometheus</text>
  <rect x="155.873" y="350.8334" width="190.4762" height="83.3333" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="8.631" />
  <text x="251.1111" y="402.9167" text-anchor="middle" font-size="19.0476">Service A</text>
  <rect x="378.0953" y="350.8334" width="190.4762" height="83.3333" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="8.631" />
  <text x="473.3334" y="402.9167" text-anchor="middle" font-size="19.0476">Service B</text>
  <path d="M 346.3492 246.6667 L 251.1111 350.8334" stroke="var(--primary-border)" stroke-width="2.2069" marker-end="url(#arrow)" />
  <path d="M 425.7144 246.6667 L 473.3334 350.8334" stroke="var(--primary-border)" stroke-width="2.2069" marker-end="url(#arrow)" />
  <text x="219.3651" y="309.1668" font-size="15.873" fill="var(--primary-accent)">scrape</text>
  <text x="473.3334" y="309.1668" font-size="15.873" fill="var(--primary-accent)">scrape</text>
  <text x="941.5874" y="100.8334" text-anchor="middle" font-size="25.3967" font-weight="bold" fill="var(--ok-accent)">Push Model</text>
  <rect x="822.5397" y="142.5" width="238.0952" height="104.1667" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="8.631" />
  <text x="941.5874" y="205.0001" text-anchor="middle" font-size="22.2223">Collector</text>
  <rect x="711.4285" y="350.8334" width="190.4762" height="83.3333" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="8.631" />
  <text x="806.6666" y="402.9167" text-anchor="middle" font-size="19.0476">Service A</text>
  <rect x="933.6508" y="350.8334" width="190.4762" height="83.3333" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="8.631" />
  <text x="1028.8889" y="402.9167" text-anchor="middle" font-size="19.0476">Service B</text>
  <path d="M 806.6666 350.8334 L 886.0318 246.6667" stroke="var(--ok-border)" stroke-width="2.2069" marker-end="url(#arrow)" />
  <path d="M 1028.8889 350.8334 L 997.143 246.6667" stroke="var(--ok-border)" stroke-width="2.2069" marker-end="url(#arrow)" />
  <text x="806.6666" y="309.1668" font-size="15.873" fill="var(--ok-accent)">push</text>
  <text x="1028.8889" y="309.1668" font-size="15.873" fill="var(--ok-accent)">push</text>
  <line x1="663.8096" y1="80" x2="663.8096" y2="580" stroke="var(--text-faint)" stroke-width="1.1035" stroke-dasharray="5.5173 5.5173" />
  <text x="386.0318" y="517.5001" text-anchor="middle" font-size="17.4603" fill="var(--text-muted)">Server controls scrape rate</text>
  <text x="941.5874" y="517.5001" text-anchor="middle" font-size="17.4603" fill="var(--text-muted)">Agents push to collector</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,24 5.4857,0" fill="#333" />
    </marker>
  </defs>
  <text x="193.1035" y="43.4483" text-anchor="middle" font-size="17.6551" font-weight="bold" fill="var(--primary-accent)">Pull Model</text>
  <rect x="110.3448" y="72.4138" width="165.5172" height="72.4138" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="193.1035" y="115.8621" text-anchor="middle" font-size="15.4483">Prometheus</text>
  <rect x="33.1034" y="217.2414" width="132.4138" height="57.931" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="99.3103" y="253.4483" text-anchor="middle" font-size="13.2414">Service A</text>
  <rect x="187.5862" y="217.2414" width="132.4138" height="57.931" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="253.7931" y="253.4483" text-anchor="middle" font-size="13.2414">Service B</text>
  <path d="M 165.5172 144.8276 L 99.3103 217.2414" stroke="var(--primary-border)" stroke-width="2.2069" marker-end="url(#arrow)" />
  <path d="M 220.6897 144.8276 L 253.7931 217.2414" stroke="var(--primary-border)" stroke-width="2.2069" marker-end="url(#arrow)" />
  <text x="77.2414" y="188.2759" font-size="11.0345" fill="var(--primary-accent)">scrape</text>
  <text x="253.7931" y="188.2759" font-size="11.0345" fill="var(--primary-accent)">scrape</text>
  <text x="579.3104" y="43.4483" text-anchor="middle" font-size="17.6551" font-weight="bold" fill="var(--ok-accent)">Push Model</text>
  <rect x="496.5517" y="72.4138" width="165.5172" height="72.4138" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="579.3104" y="115.8621" text-anchor="middle" font-size="15.4483">Collector</text>
  <rect x="419.3103" y="217.2414" width="132.4138" height="57.931" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="485.5172" y="253.4483" text-anchor="middle" font-size="13.2414">Service A</text>
  <rect x="573.7931" y="217.2414" width="132.4138" height="57.931" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="640" y="253.4483" text-anchor="middle" font-size="13.2414">Service B</text>
  <path d="M 485.5172 217.2414 L 540.6897 144.8276" stroke="var(--ok-border)" stroke-width="2.2069" marker-end="url(#arrow)" />
  <path d="M 640 217.2414 L 617.9311 144.8276" stroke="var(--ok-border)" stroke-width="2.2069" marker-end="url(#arrow)" />
  <text x="485.5172" y="188.2759" font-size="11.0345" fill="var(--ok-accent)">push</text>
  <text x="640" y="188.2759" font-size="11.0345" fill="var(--ok-accent)">push</text>
  <line x1="386.2069" y1="28.9655" x2="386.2069" y2="376.5517" stroke="var(--text-faint)" stroke-width="1.1035" stroke-dasharray="5.5173 5.5173" />
  <text x="193.1035" y="333.1035" text-anchor="middle" font-size="12.1379" fill="var(--text-muted)">Server controls scrape rate</text>
  <text x="579.3104" y="333.1035" text-anchor="middle" font-size="12.1379" fill="var(--text-muted)">Agents push to collector</text>
</svg>
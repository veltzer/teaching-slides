<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.4857,0" fill="#333" />
    </marker>
  </defs>
  <rect x="90.831" y="112.9412" width="326.9917" height="225.8823" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="254.3268" y="178.8235" text-anchor="middle" font-size="29.0659" font-weight="bold" fill="var(--primary-accent)">Metrics</text>
  <text x="254.3268" y="225.8823" text-anchor="middle" font-size="21.7995">Numeric aggregates</text>
  <text x="254.3268" y="263.5295" text-anchor="middle" font-size="21.7995">over time</text>
  <text x="254.3268" y="301.1765" text-anchor="middle" font-size="21.7995">CPU, latency, errors</text>
  <rect x="472.3212" y="112.9412" width="326.9917" height="225.8823" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="635.817" y="178.8235" text-anchor="middle" font-size="29.0659" font-weight="bold" fill="var(--ok-accent)">Logs</text>
  <text x="635.817" y="225.8823" text-anchor="middle" font-size="21.7995">Discrete events</text>
  <text x="635.817" y="263.5295" text-anchor="middle" font-size="21.7995">with context</text>
  <text x="635.817" y="301.1765" text-anchor="middle" font-size="21.7995">Errors, audit, debug</text>
  <rect x="853.8115" y="112.9412" width="326.9917" height="225.8823" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="1017.3072" y="178.8235" text-anchor="middle" font-size="29.0659" font-weight="bold" fill="var(--warn-accent)">Traces</text>
  <text x="1017.3072" y="225.8823" text-anchor="middle" font-size="21.7995">Request flow across</text>
  <text x="1017.3072" y="263.5295" text-anchor="middle" font-size="21.7995">services</text>
  <text x="1017.3072" y="301.1765" text-anchor="middle" font-size="21.7995">Latency, dependencies</text>
  <line x1="417.8226" y1="338.8235" x2="472.3212" y2="338.8235" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="9.0831 5.4498" />
  <line x1="799.3128" y1="338.8235" x2="853.8115" y2="338.8235" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="9.0831 5.4498" />
  <rect x="326.9917" y="451.7647" width="617.6508" height="112.9412" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="635.817" y="517.647" text-anchor="middle" font-size="29.0659" font-weight="bold" fill="var(--info-accent)">Correlation Layer</text>
  <line x1="254.3268" y1="338.8235" x2="490.4874" y2="451.7647" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="635.817" y1="338.8235" x2="635.817" y2="451.7647" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1017.3072" y1="338.8235" x2="781.1466" y2="451.7647" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="635.817" y="640" text-anchor="middle" font-size="23.616" fill="var(--text-muted)">Each pillar answers different questions about system behavior</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="360" height="248.5714" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="220" y="112.4999" text-anchor="middle" font-size="31.9927" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Metrics</text>
  <text x="220" y="164.2856" text-anchor="middle" font-size="23.9946" font-family="Arial, sans-serif" fill="var(--primary-text)">Numeric aggregates</text>
  <text x="220" y="205.7144" text-anchor="middle" font-size="23.9946" font-family="Arial, sans-serif" fill="var(--primary-text)">over time</text>
  <text x="220" y="247.1429" text-anchor="middle" font-size="23.9946" font-family="Arial, sans-serif" fill="var(--primary-text)">CPU, latency, errors</text>
  <rect x="459.9999" y="40" width="360" height="248.5714" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="112.4999" text-anchor="middle" font-size="31.9927" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Logs</text>
  <text x="639.9999" y="164.2856" text-anchor="middle" font-size="23.9946" font-family="Arial, sans-serif" fill="var(--ok-text)">Discrete events</text>
  <text x="639.9999" y="205.7144" text-anchor="middle" font-size="23.9946" font-family="Arial, sans-serif" fill="var(--ok-text)">with context</text>
  <text x="639.9999" y="247.1429" text-anchor="middle" font-size="23.9946" font-family="Arial, sans-serif" fill="var(--ok-text)">Errors, audit, debug</text>
  <rect x="880" y="40" width="360" height="248.5714" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1059.9998" y="112.4999" text-anchor="middle" font-size="31.9927" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Traces</text>
  <text x="1059.9998" y="164.2856" text-anchor="middle" font-size="23.9946" font-family="Arial, sans-serif" fill="var(--warn-text)">Request flow across</text>
  <text x="1059.9998" y="205.7144" text-anchor="middle" font-size="23.9946" font-family="Arial, sans-serif" fill="var(--warn-text)">services</text>
  <text x="1059.9998" y="247.1429" text-anchor="middle" font-size="23.9946" font-family="Arial, sans-serif" fill="var(--warn-text)">Latency, dependencies</text>
  <line x1="399.9999" y1="288.5714" x2="459.9999" y2="288.5714" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="9.0831 5.4498"/>
  <line x1="819.9999" y1="288.5714" x2="880" y2="288.5714" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="9.0831 5.4498"/>
  <rect x="300.0001" y="412.8571" width="679.9999" height="124.2857" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="485.3571" text-anchor="middle" font-size="31.9927" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Correlation Layer</text>
  <line x1="220" y1="288.5714" x2="479.9999" y2="412.8571" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="639.9999" y1="288.5714" x2="639.9999" y2="412.8571" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1059.9998" y1="288.5714" x2="799.9999" y2="412.8571" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="639.9999" y="620" text-anchor="middle" font-size="25.994" fill="var(--text-muted)" font-family="Arial, sans-serif">Each pillar answers different questions about system behavior</text>
</svg>

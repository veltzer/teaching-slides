<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="210" height="220" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="145" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Developer</text>
  <text x="145" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">docker push</text>
  <text x="145" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">helm push</text>
  <text x="145" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">npm publish</text>
  <text x="145" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">untrusted input</text>

  <rect x="290" y="40" width="210" height="220" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="395" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Registry</text>
  <text x="395" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Harbor / JFrog</text>
  <text x="395" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">webhook fires</text>
  <text x="395" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">on-push event</text>
  <text x="395" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">quarantine lane</text>

  <rect x="540" y="40" width="210" height="220" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="645" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--danger-text)">Scanner</text>
  <text x="645" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Trivy / Grype</text>
  <text x="645" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">CVE database</text>
  <text x="645" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">license check</text>
  <text x="645" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">SBOM generated</text>

  <rect x="790" y="40" width="210" height="220" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="895" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Policy Engine</text>
  <text x="895" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">OPA / Rego</text>
  <text x="895" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">severity rules</text>
  <text x="895" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">allow / deny</text>
  <text x="895" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">audit log</text>

  <rect x="1040" y="40" width="200" height="220" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="1140" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Decision</text>
  <text x="1140" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">pass or fail</text>
  <text x="1140" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">per artifact</text>
  <text x="1140" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">notify owner</text>
  <text x="1140" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">record metrics</text>

  <line x1="250" y1="150" x2="288" y2="150" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="150" x2="538" y2="150" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="750" y1="150" x2="788" y2="150" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1000" y1="150" x2="1038" y2="150" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="300" width="585" height="150" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="332" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">PASS: promote and tag</text>
  <text x="332" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">signed with cosign, moved to prod-ready repo</text>
  <text x="332" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">immutable tag, provenance attestation attached</text>
  <text x="332" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">deployable by CD pipeline</text>

  <rect x="655" y="300" width="585" height="150" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="947" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-text)">FAIL: quarantine and alert</text>
  <text x="947" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">kept in isolated repo, not pullable by CD</text>
  <text x="947" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">Slack notification to owner with scan report</text>
  <text x="947" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">waiver workflow for exceptions</text>

  <rect x="40" y="480" width="1200" height="140" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="518" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Shift-left enforcement at ingress</text>
  <text x="640" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Every push is scanned; only approved artifacts reach downstream.</text>
  <text x="640" y="578" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Policy-as-code lives in Git alongside infra, reviewed like any change.</text>
  <text x="640" y="606" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Quarantine buys time — waivers force a conscious security decision.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="262.0455" width="232.2581" height="135.9091" rx="5.996" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="156.129" y="343.591" text-anchor="middle" fill="var(--bg)" font-size="21.2762" font-weight="bold">Developer Push</text>
  <rect x="349.6775" y="262.0455" width="232.2581" height="135.9091" rx="5.996" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="465.8064" y="316.4091" text-anchor="middle" fill="var(--bg)" font-size="21.2762" font-weight="bold">Registry</text>
  <text x="465.8064" y="365.3364" text-anchor="middle" fill="var(--bg)" font-size="19.342">Webhook</text>
  <rect x="659.3549" y="262.0455" width="232.2581" height="135.9091" rx="5.996" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="775.4839" y="316.4091" text-anchor="middle" fill="var(--bg)" font-size="21.2762" font-weight="bold">Scanner</text>
  <text x="775.4839" y="365.3364" text-anchor="middle" fill="var(--bg)" font-size="19.342">Trivy / Grype</text>
  <rect x="969.0323" y="180.5" width="270.9677" height="108.7272" rx="5.996" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1104.5161" y="248.4546" text-anchor="middle" fill="var(--bg)" font-size="21.2762" font-weight="bold">Pass: Tag OK</text>
  <rect x="969.0323" y="370.7728" width="270.9677" height="108.7272" rx="5.996" fill="var(--danger-accent)" stroke="var(--text)" stroke-width="3.6571" />
  <text x="1104.5161" y="438.7274" text-anchor="middle" fill="var(--bg)" font-size="21.2762" font-weight="bold">Fail: Quarantine</text>
  <line x1="272.2581" y1="330.0001" x2="349.6775" y2="330.0001" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="581.9355" y1="330.0001" x2="659.3549" y2="330.0001" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="891.613" y1="302.8183" x2="969.0323" y2="234.8638" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="891.613" y1="357.1819" x2="969.0323" y2="425.1364" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 18.2857 12.8571 L 0 25.7143 z" fill="#333" />
    </marker>
  </defs>

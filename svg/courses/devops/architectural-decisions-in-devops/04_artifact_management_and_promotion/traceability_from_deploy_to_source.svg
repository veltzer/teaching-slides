<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="67.6192" width="235.7143" height="276.1906" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="157.8573" y="233.3334" text-anchor="middle" fill="var(--bg)" font-size="28.2885" font-weight="bold" font-family="Arial, sans-serif">Production</text>
  <rect x="361.4286" y="67.6192" width="235.7143" height="276.1906" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="479.2857" y="233.3334" text-anchor="middle" fill="var(--bg)" font-size="28.2885" font-weight="bold" font-family="Arial, sans-serif">Artifact v2.3.1</text>
  <rect x="682.8571" y="67.6192" width="235.7143" height="276.1906" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="800.7143" y="233.3334" text-anchor="middle" fill="var(--bg)" font-size="28.2885" font-weight="bold" font-family="Arial, sans-serif">Build #1b5e20</text>
  <rect x="1004.2857" y="67.6192" width="235.7143" height="276.1906" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1122.1427" y="233.3334" text-anchor="middle" fill="var(--bg)" font-size="28.2885" font-weight="bold" font-family="Arial, sans-serif">Commit a3f8b2c</text>
  <line x1="275.7143" y1="205.7144" x2="361.4286" y2="205.7144" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="597.1429" y1="205.7144" x2="682.8571" y2="205.7144" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="918.5713" y1="205.7144" x2="1004.2857" y2="205.7144" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="318.5714" y="40" text-anchor="middle" fill="var(--text-muted)" font-size="25.7168" font-family="Arial, sans-serif">runs</text>
  <text x="639.9999" y="40" text-anchor="middle" fill="var(--text-muted)" font-size="25.7168" font-family="Arial, sans-serif">built by</text>
  <text x="961.4285" y="40" text-anchor="middle" fill="var(--text-muted)" font-size="25.7168" font-family="Arial, sans-serif">from</text>
  <text x="747.1429" y="620" text-anchor="middle" fill="var(--text-muted)" font-size="28.2885" font-style="italic" font-family="Arial, sans-serif">Full traceability chain from deploy to commit</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

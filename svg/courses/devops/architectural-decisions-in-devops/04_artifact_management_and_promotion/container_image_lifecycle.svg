<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="225" height="267.692307692308" rx="8.44894167246" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="152" y="90.192307692307" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.122354181148" font-weight="bold" fill="var(--primary-text)">1. Build</text>
  <text x="152" y="145.961538461538" text-anchor="middle" font-family="Courier New, monospace" font-size="14.785647926803" fill="var(--primary-text)">docker build</text>
  <text x="152" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--primary-text)">Pinned base</text>
  <text x="152" y="224.038461538462" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--primary-text)">SBOM</text>
  <text x="152" y="263.076923076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--primary-text)">Tag by SHA</text>

  <rect x="285" y="40" width="225" height="267.692307692308" rx="8.44894167246" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="397" y="90.192307692307" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.122354181148" font-weight="bold" fill="var(--warn-text)">2. Scan/Sign</text>
  <text x="397" y="145.961538461538" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--warn-text)">CVE scan</text>
  <text x="397" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--warn-text)">Block high sev</text>
  <text x="397" y="224.038461538462" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--warn-text)">Cosign sig</text>
  <text x="397" y="263.076923076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--warn-text)">Attestation</text>

  <rect x="530" y="40" width="225" height="267.692307692308" rx="8.44894167246" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="642" y="90.192307692307" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.122354181148" font-weight="bold" fill="var(--info-text)">3. Publish</text>
  <text x="642" y="145.961538461538" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--info-text)">Push to registry</text>
  <text x="642" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--info-text)">Immutable digest</text>
  <text x="642" y="224.038461538462" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--info-text)">dev / rc tags</text>

  <rect x="775" y="40" width="225" height="267.692307692308" rx="8.44894167246" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="887" y="90.192307692307" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.122354181148" font-weight="bold" fill="var(--ok-text)">4. Promote</text>
  <text x="887" y="145.961538461538" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--ok-text)">Retag, no rebuild</text>
  <text x="887" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--ok-text)">stage → prod</text>
  <text x="887" y="224.038461538462" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--ok-text)">Verify sig</text>

  <rect x="1020" y="40" width="220" height="267.692307692308" rx="8.44894167246" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1130" y="90.192307692307" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.122354181148" font-weight="bold" fill="var(--danger-text)">5. Retire</text>
  <text x="1130" y="145.961538461538" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--danger-text)">Keep current</text>
  <text x="1130" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--danger-text)">+ rollback target</text>
  <text x="1130" y="224.038461538462" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--danger-text)">GC old layers</text>

  <line x1="265" y1="173.846153846153" x2="285" y2="173.846153846153" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="510" y1="173.846153846153" x2="530" y2="173.846153846153" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="755" y1="173.846153846153" x2="775" y2="173.846153846153" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="1000" y1="173.846153846153" x2="1020" y2="173.846153846153" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="40" y="352.307692307692" width="380" height="267.692307692308" rx="8.44894167246" fill="var(--surface)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="230" y="402.499999999999" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.010118763033" font-weight="bold" fill="var(--primary-accent)">Build Once</text>
  <text x="230" y="458.269230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--text)">One image, all envs</text>
  <text x="230" y="497.307692307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--text)">Never rebuild to promote</text>

  <rect x="450" y="352.307692307692" width="380" height="267.692307692308" rx="8.44894167246" fill="var(--surface)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="402.499999999999" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.010118763033" font-weight="bold" fill="var(--ok-accent)">Pin by Digest</text>
  <text x="640" y="458.269230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--text)">Tags are mutable</text>
  <text x="640" y="497.307692307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--text)">Deploy by sha256</text>

  <rect x="860" y="352.307692307692" width="380" height="267.692307692308" rx="8.44894167246" fill="var(--surface)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1050" y="402.499999999999" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.010118763033" font-weight="bold" fill="var(--info-accent)">Verify Before Run</text>
  <text x="1050" y="458.269230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--text)">Admission policy</text>
  <text x="1050" y="497.307692307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--text)">Check sigs at edge</text>
</svg>

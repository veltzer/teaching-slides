<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="223.5" width="193.5483" height="152.143" rx="5.9946" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="136.7742" y="314.7857" text-anchor="middle" fill="var(--bg)" font-size="19.3372" font-weight="bold">Build</text>
  <rect x="291.6129" y="223.5" width="193.5483" height="152.143" rx="5.9946" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="388.3871" y="314.7857" text-anchor="middle" fill="var(--bg)" font-size="19.3372" font-weight="bold">Scan</text>
  <rect x="543.2258" y="223.5" width="193.5483" height="152.143" rx="5.9946" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="640.0001" y="314.7857" text-anchor="middle" fill="var(--bg)" font-size="19.3372" font-weight="bold">Sign</text>
  <rect x="794.8387" y="223.5" width="193.5483" height="152.143" rx="5.9946" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="891.613" y="314.7857" text-anchor="middle" fill="var(--bg)" font-size="19.3372" font-weight="bold">Promote</text>
  <rect x="1046.4517" y="223.5" width="193.5483" height="152.143" rx="5.9946" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="1143.2258" y="314.7857" text-anchor="middle" fill="var(--bg)" font-size="19.3372" font-weight="bold">Deploy</text>
  <line x1="233.5484" y1="299.5714" x2="291.6129" y2="299.5714" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow7)" />
  <line x1="485.1614" y1="299.5714" x2="543.2258" y2="299.5714" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow7)" />
  <line x1="736.7742" y1="299.5714" x2="794.8387" y2="299.5714" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow7)" />
  <line x1="988.3871" y1="299.5714" x2="1046.4517" y2="299.5714" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow7)" />
  <text x="136.7742" y="436.5" text-anchor="middle" fill="var(--text-muted)" font-size="19.3372">Dockerfile</text>
  <text x="388.3871" y="436.5" text-anchor="middle" fill="var(--text-muted)" font-size="19.3372">Trivy/Grype</text>
  <text x="640.0001" y="436.5" text-anchor="middle" fill="var(--text-muted)" font-size="19.3372">cosign</text>
  <text x="891.613" y="436.5" text-anchor="middle" fill="var(--text-muted)" font-size="19.3372">Tag/Copy</text>
  <text x="1143.2258" y="436.5" text-anchor="middle" fill="var(--text-muted)" font-size="19.3372">K8s/ECS</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 18.2857 14.4 L 0 28.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
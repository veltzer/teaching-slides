<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-size="29.290993" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Artifact Promotion Pipeline</text>
  <text x="640" y="83.773585" text-anchor="middle" font-size="18.829924" fill="var(--text-muted)" font-family="Arial, sans-serif">Build once, promote through environments — never rebuild</text>

  <rect x="40" y="133.018868" width="280" height="393.962264" rx="6.276641" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="209.622642" text-anchor="middle" fill="var(--primary-text)" font-size="27.198779" font-weight="bold" font-family="Arial, sans-serif">Build</text>
  <text x="180" y="275.283019" text-anchor="middle" fill="var(--primary-text)" font-size="18.829924" font-family="Arial, sans-serif">Compile</text>
  <text x="180" y="313.584906" text-anchor="middle" fill="var(--primary-text)" font-size="18.829924" font-family="Arial, sans-serif">Unit tests</text>
  <text x="180" y="351.886792" text-anchor="middle" fill="var(--primary-text)" font-size="18.829924" font-family="Arial, sans-serif">SBOM + sign</text>
  <text x="180" y="428.490566" text-anchor="middle" fill="var(--primary-text)" font-size="16.73771" font-family="Arial, sans-serif">Output: artifact</text>
  <text x="180" y="461.320755" text-anchor="middle" fill="var(--primary-text)" font-size="16.73771" font-family="Arial, sans-serif">with SHA + tag</text>

  <rect x="340" y="133.018868" width="280" height="393.962264" rx="6.276641" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="209.622642" text-anchor="middle" fill="var(--warn-text)" font-size="27.198779" font-weight="bold" font-family="Arial, sans-serif">Dev Repo</text>
  <text x="480" y="275.283019" text-anchor="middle" fill="var(--warn-text)" font-size="18.829924" font-family="Arial, sans-serif">Snapshot</text>
  <text x="480" y="313.584906" text-anchor="middle" fill="var(--warn-text)" font-size="18.829924" font-family="Arial, sans-serif">Smoke tests</text>
  <text x="480" y="351.886792" text-anchor="middle" fill="var(--warn-text)" font-size="18.829924" font-family="Arial, sans-serif">Auto-promote</text>
  <text x="480" y="428.490566" text-anchor="middle" fill="var(--warn-text)" font-size="16.73771" font-family="Arial, sans-serif">Gate: tests pass</text>
  <text x="480" y="461.320755" text-anchor="middle" fill="var(--warn-text)" font-size="16.73771" font-family="Arial, sans-serif">no manual step</text>

  <rect x="640" y="133.018868" width="280" height="393.962264" rx="6.276641" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="780" y="209.622642" text-anchor="middle" fill="var(--danger-text)" font-size="27.198779" font-weight="bold" font-family="Arial, sans-serif">Staging</text>
  <text x="780" y="275.283019" text-anchor="middle" fill="var(--danger-text)" font-size="18.829924" font-family="Arial, sans-serif">Integration</text>
  <text x="780" y="313.584906" text-anchor="middle" fill="var(--danger-text)" font-size="18.829924" font-family="Arial, sans-serif">Perf + security</text>
  <text x="780" y="351.886792" text-anchor="middle" fill="var(--danger-text)" font-size="18.829924" font-family="Arial, sans-serif">UAT sign-off</text>
  <text x="780" y="428.490566" text-anchor="middle" fill="var(--danger-text)" font-size="16.73771" font-family="Arial, sans-serif">Gate: approval</text>
  <text x="780" y="461.320755" text-anchor="middle" fill="var(--danger-text)" font-size="16.73771" font-family="Arial, sans-serif">change ticket</text>

  <rect x="940" y="133.018868" width="300" height="393.962264" rx="6.276641" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="209.622642" text-anchor="middle" fill="var(--ok-text)" font-size="27.198779" font-weight="bold" font-family="Arial, sans-serif">Prod Repo</text>
  <text x="1090" y="275.283019" text-anchor="middle" fill="var(--ok-text)" font-size="18.829924" font-family="Arial, sans-serif">Immutable</text>
  <text x="1090" y="313.584906" text-anchor="middle" fill="var(--ok-text)" font-size="18.829924" font-family="Arial, sans-serif">Release</text>
  <text x="1090" y="351.886792" text-anchor="middle" fill="var(--ok-text)" font-size="18.829924" font-family="Arial, sans-serif">Audit log</text>
  <text x="1090" y="428.490566" text-anchor="middle" fill="var(--ok-text)" font-size="16.73771" font-family="Arial, sans-serif">Same SHA as dev</text>
  <text x="1090" y="461.320755" text-anchor="middle" fill="var(--ok-text)" font-size="16.73771" font-family="Arial, sans-serif">Rollback-ready</text>

  <line x1="320" y1="330" x2="340" y2="330" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="620" y1="330" x2="640" y2="330" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="920" y1="330" x2="940" y2="330" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="640" y="581.698113" text-anchor="middle" font-size="18.829924" fill="var(--text-muted)" font-family="Arial, sans-serif">Same artifact flows left to right — gates differ, bits do not.</text>
  <text x="640" y="620" text-anchor="middle" font-size="16.73771" fill="var(--text-faint)" font-family="Arial, sans-serif">promote = retag, never rebuild</text>
</svg>

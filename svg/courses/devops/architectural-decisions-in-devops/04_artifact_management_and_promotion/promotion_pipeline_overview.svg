<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-size="29.290993" font-weight="bold" fill="var(--text)">Artifact Promotion Pipeline</text>
  <text x="640" y="83.773585" text-anchor="middle" font-size="18.829924" fill="var(--text-muted)">Build once, promote through environments — never rebuild</text>

  <rect x="40" y="133.018868" width="280" height="393.962264" rx="6.276641" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="209.622642" text-anchor="middle" fill="var(--primary-text)" font-size="27.198779" font-weight="bold">Build</text>
  <text x="180" y="275.283019" text-anchor="middle" fill="var(--primary-text)" font-size="18.829924">Compile</text>
  <text x="180" y="313.584906" text-anchor="middle" fill="var(--primary-text)" font-size="18.829924">Unit tests</text>
  <text x="180" y="351.886792" text-anchor="middle" fill="var(--primary-text)" font-size="18.829924">SBOM + sign</text>
  <text x="180" y="428.490566" text-anchor="middle" fill="var(--primary-text)" font-size="16.73771">Output: artifact</text>
  <text x="180" y="461.320755" text-anchor="middle" fill="var(--primary-text)" font-size="16.73771">with SHA + tag</text>

  <rect x="340" y="133.018868" width="280" height="393.962264" rx="6.276641" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="209.622642" text-anchor="middle" fill="var(--warn-text)" font-size="27.198779" font-weight="bold">Dev Repo</text>
  <text x="480" y="275.283019" text-anchor="middle" fill="var(--warn-text)" font-size="18.829924">Snapshot</text>
  <text x="480" y="313.584906" text-anchor="middle" fill="var(--warn-text)" font-size="18.829924">Smoke tests</text>
  <text x="480" y="351.886792" text-anchor="middle" fill="var(--warn-text)" font-size="18.829924">Auto-promote</text>
  <text x="480" y="428.490566" text-anchor="middle" fill="var(--warn-text)" font-size="16.73771">Gate: tests pass</text>
  <text x="480" y="461.320755" text-anchor="middle" fill="var(--warn-text)" font-size="16.73771">no manual step</text>

  <rect x="640" y="133.018868" width="280" height="393.962264" rx="6.276641" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="780" y="209.622642" text-anchor="middle" fill="var(--danger-text)" font-size="27.198779" font-weight="bold">Staging</text>
  <text x="780" y="275.283019" text-anchor="middle" fill="var(--danger-text)" font-size="18.829924">Integration</text>
  <text x="780" y="313.584906" text-anchor="middle" fill="var(--danger-text)" font-size="18.829924">Perf + security</text>
  <text x="780" y="351.886792" text-anchor="middle" fill="var(--danger-text)" font-size="18.829924">UAT sign-off</text>
  <text x="780" y="428.490566" text-anchor="middle" fill="var(--danger-text)" font-size="16.73771">Gate: approval</text>
  <text x="780" y="461.320755" text-anchor="middle" fill="var(--danger-text)" font-size="16.73771">change ticket</text>

  <rect x="940" y="133.018868" width="300" height="393.962264" rx="6.276641" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="209.622642" text-anchor="middle" fill="var(--ok-text)" font-size="27.198779" font-weight="bold">Prod Repo</text>
  <text x="1090" y="275.283019" text-anchor="middle" fill="var(--ok-text)" font-size="18.829924">Immutable</text>
  <text x="1090" y="313.584906" text-anchor="middle" fill="var(--ok-text)" font-size="18.829924">Release</text>
  <text x="1090" y="351.886792" text-anchor="middle" fill="var(--ok-text)" font-size="18.829924">Audit log</text>
  <text x="1090" y="428.490566" text-anchor="middle" fill="var(--ok-text)" font-size="16.73771">Same SHA as dev</text>
  <text x="1090" y="461.320755" text-anchor="middle" fill="var(--ok-text)" font-size="16.73771">Rollback-ready</text>

  <line x1="320" y1="330" x2="340" y2="330" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="620" y1="330" x2="640" y2="330" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="920" y1="330" x2="940" y2="330" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="640" y="581.698113" text-anchor="middle" font-size="18.829924" fill="var(--text-muted)">Same artifact flows left to right — gates differ, bits do not.</text>
  <text x="640" y="620" text-anchor="middle" font-size="16.73771" fill="var(--text-faint)">promote = retag, never rebuild</text>
</svg>

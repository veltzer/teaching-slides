<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="227.6957" width="240" height="188.8696" rx="5.9979" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="160" y="306.3913" text-anchor="middle" fill="var(--bg)" font-size="23.9917" font-weight="bold">Build</text>
  <text x="160" y="369.3478" text-anchor="middle" fill="var(--bg)" font-size="21.9924">Unit Tests</text>
  <rect x="360" y="227.6957" width="240" height="188.8696" rx="5.9979" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="479.9999" y="306.3913" text-anchor="middle" fill="var(--bg)" font-size="23.9917" font-weight="bold">Dev Repo</text>
  <text x="479.9999" y="369.3478" text-anchor="middle" fill="var(--bg)" font-size="21.9924">Snapshot</text>
  <rect x="680.0001" y="227.6957" width="240" height="188.8696" rx="5.9979" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="800.0001" y="306.3913" text-anchor="middle" fill="var(--bg)" font-size="23.9917" font-weight="bold">Staging Repo</text>
  <text x="800.0001" y="369.3478" text-anchor="middle" fill="var(--bg)" font-size="21.9924">Integration</text>
  <rect x="1000" y="227.6957" width="240" height="188.8696" rx="5.9979" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1120" y="306.3913" text-anchor="middle" fill="var(--bg)" font-size="23.9917" font-weight="bold">Prod Repo</text>
  <text x="1120" y="369.3478" text-anchor="middle" fill="var(--bg)" font-size="21.9924">Release</text>
  <line x1="280" y1="322.1304" x2="360" y2="322.1304" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="599.9999" y1="322.1304" x2="680.0001" y2="322.1304" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="920.0001" y1="322.1304" x2="1000" y2="322.1304" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="460" y="511" text-anchor="middle" fill="var(--text-muted)" font-size="19.9931">promote</text>
  <text x="780" y="511" text-anchor="middle" fill="var(--text-muted)" font-size="19.9931">promote</text>
  <text x="1100" y="511" text-anchor="middle" fill="var(--text-muted)" font-size="19.9931">promote</text>
  <text x="320" y="149" text-anchor="middle" fill="var(--text)" font-size="19.9931">auto</text>
  <text x="640.0001" y="149" text-anchor="middle" fill="var(--text)" font-size="19.9931">gate: tests pass</text>
  <text x="960" y="149" text-anchor="middle" fill="var(--text)" font-size="19.9931">gate: approval</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 18.2857 14.4 L 0 28.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
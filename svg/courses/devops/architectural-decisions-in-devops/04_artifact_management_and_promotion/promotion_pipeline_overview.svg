<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="80" y="234.45" width="224" height="176.4" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />

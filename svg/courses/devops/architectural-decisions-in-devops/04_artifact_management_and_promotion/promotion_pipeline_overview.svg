  <text x="192" y="366.75" text-anchor="middle" fill="var(--bg)" font-size="20.5333">Unit Tests</text>
  <rect x="378.6667" y="234.45" width="224" height="176.4" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="490.6666" y="307.95" text-anchor="middle" fill="var(--bg)" font-size="22.4" font-weight="bold">Dev Repo</text>
  <text x="490.6666" y="366.75" text-anchor="middle" fill="var(--bg)" font-size="20.5333">Snapshot</text>
  <rect x="677.3334" y="234.45" width="224" height="176.4" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="789.3334" y="307.95" text-anchor="middle" fill="var(--bg)" font-size="22.4" font-weight="bold">Staging Repo</text>
  <text x="789.3334" y="366.75" text-anchor="middle" fill="var(--bg)" font-size="20.5333">Integration</text>
  <rect x="976" y="234.45" width="224" height="176.4" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1088" y="307.95" text-anchor="middle" fill="var(--bg)" font-size="22.4" font-weight="bold">Prod Repo</text>
  <text x="1088" y="366.75" text-anchor="middle" fill="var(--bg)" font-size="20.5333">Release</text>
  <line x1="304" y1="322.65" x2="378.6667" y2="322.65" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="602.6666" y1="322.65" x2="677.3334" y2="322.65" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="901.3334" y1="322.65" x2="976" y2="322.65" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="472" y="499.05" text-anchor="middle" fill="var(--text-muted)" font-size="18.6667">promote</text>
  <text x="770.6667" y="499.05" text-anchor="middle" fill="var(--text-muted)" font-size="18.6667">promote</text>
  <text x="1069.3333" y="499.05" text-anchor="middle" fill="var(--text-muted)" font-size="18.6667">promote</text>
  <text x="341.3333" y="160.95" text-anchor="middle" fill="var(--text)" font-size="18.6667">auto</text>
  <text x="640.0001" y="160.95" text-anchor="middle" fill="var(--text)" font-size="18.6667">gate: tests pass</text>
  <text x="938.6667" y="160.95" text-anchor="middle" fill="var(--text)" font-size="18.6667">gate: approval</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 18.2857 14.4 L 0 28.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
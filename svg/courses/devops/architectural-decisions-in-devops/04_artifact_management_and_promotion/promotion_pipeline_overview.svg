<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <text x="640" y="75" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--text)">Artifact Promotion Pipeline</text>
  <text x="640" y="115" text-anchor="middle" font-size="18" fill="var(--text-muted)">Build once, promote through environments — never rebuild</text>

  <rect x="40" y="160" width="280" height="360" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="180" y="230" text-anchor="middle" fill="var(--primary-text)" font-size="26" font-weight="bold">Build</text>
  <text x="180" y="290" text-anchor="middle" fill="var(--primary-text)" font-size="18">Compile</text>
  <text x="180" y="325" text-anchor="middle" fill="var(--primary-text)" font-size="18">Unit tests</text>
  <text x="180" y="360" text-anchor="middle" fill="var(--primary-text)" font-size="18">SBOM + sign</text>
  <text x="180" y="430" text-anchor="middle" fill="var(--primary-text)" font-size="16">Output: artifact</text>
  <text x="180" y="460" text-anchor="middle" fill="var(--primary-text)" font-size="16">with SHA + tag</text>

  <rect x="340" y="160" width="280" height="360" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="480" y="230" text-anchor="middle" fill="var(--warn-text)" font-size="26" font-weight="bold">Dev Repo</text>
  <text x="480" y="290" text-anchor="middle" fill="var(--warn-text)" font-size="18">Snapshot</text>
  <text x="480" y="325" text-anchor="middle" fill="var(--warn-text)" font-size="18">Smoke tests</text>
  <text x="480" y="360" text-anchor="middle" fill="var(--warn-text)" font-size="18">Auto-promote</text>
  <text x="480" y="430" text-anchor="middle" fill="var(--warn-text)" font-size="16">Gate: tests pass</text>
  <text x="480" y="460" text-anchor="middle" fill="var(--warn-text)" font-size="16">no manual step</text>

  <rect x="640" y="160" width="280" height="360" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="780" y="230" text-anchor="middle" fill="var(--danger-text)" font-size="26" font-weight="bold">Staging</text>
  <text x="780" y="290" text-anchor="middle" fill="var(--danger-text)" font-size="18">Integration</text>
  <text x="780" y="325" text-anchor="middle" fill="var(--danger-text)" font-size="18">Perf + security</text>
  <text x="780" y="360" text-anchor="middle" fill="var(--danger-text)" font-size="18">UAT sign-off</text>
  <text x="780" y="430" text-anchor="middle" fill="var(--danger-text)" font-size="16">Gate: approval</text>
  <text x="780" y="460" text-anchor="middle" fill="var(--danger-text)" font-size="16">change ticket</text>

  <rect x="940" y="160" width="300" height="360" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1090" y="230" text-anchor="middle" fill="var(--ok-text)" font-size="26" font-weight="bold">Prod Repo</text>
  <text x="1090" y="290" text-anchor="middle" fill="var(--ok-text)" font-size="18">Immutable</text>
  <text x="1090" y="325" text-anchor="middle" fill="var(--ok-text)" font-size="18">Release</text>
  <text x="1090" y="360" text-anchor="middle" fill="var(--ok-text)" font-size="18">Audit log</text>
  <text x="1090" y="430" text-anchor="middle" fill="var(--ok-text)" font-size="16">Same SHA as dev</text>
  <text x="1090" y="460" text-anchor="middle" fill="var(--ok-text)" font-size="16">Rollback-ready</text>

  <line x1="320" y1="340" x2="340" y2="340" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="620" y1="340" x2="640" y2="340" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="920" y1="340" x2="940" y2="340" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="640" y="570" text-anchor="middle" font-size="18" fill="var(--text-muted)">Same artifact flows left to right — gates differ, bits do not.</text>
  <text x="640" y="605" text-anchor="middle" font-size="16" fill="var(--text-faint)">promote = retag, never rebuild</text>
</svg>

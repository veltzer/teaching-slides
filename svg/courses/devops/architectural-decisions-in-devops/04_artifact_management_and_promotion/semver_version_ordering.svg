<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="610" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.807319" font-weight="bold" fill="var(--primary-accent)">Semantic Versioning: Ordering of Releases</text>

  <!-- Timeline line -->
  <line x1="50" y1="314.181818" x2="1190" y2="314.181818" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Version nodes positioned along timeline -->
  <!-- 1.0.0-alpha -->
  <rect x="101.247" y="285.428" width="57.507" height="57.507" rx="14" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="3" filter="url(#shadow)"/>
  <rect x="40" y="113.818182" width="180" height="158.181818" rx="6.161464" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <line x1="130" y1="272" x2="130" y2="284.654545" stroke="var(--info-border)" stroke-width="2"/>
  <text x="130" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.592034" font-weight="bold" fill="var(--info-text)">1.0.0-alpha</text>
  <text x="130" y="192.909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457481" fill="var(--info-text)">Pre-release</text>
  <text x="130" y="224.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.40366" fill="var(--info-text)">Unstable,</text>
  <text x="130" y="247.745455" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.40366" fill="var(--info-text)">internal testing</text>

  <!-- 1.0.0-rc.1 -->
  <rect x="313.247" y="285.428" width="57.507" height="57.507" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="3" filter="url(#shadow)"/>
  <rect x="252" y="356.363636" width="180" height="158.181818" rx="6.161464" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <line x1="342" y1="343.709091" x2="342" y2="356.363636" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="342" y="398.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.592034" font-weight="bold" fill="var(--primary-text)">1.0.0-rc.1</text>
  <text x="342" y="435.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457481" fill="var(--primary-text)">Release candidate</text>
  <text x="342" y="467.090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.40366" fill="var(--primary-text)">Feature-frozen,</text>
  <text x="342" y="490.290909" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.40366" fill="var(--primary-text)">final QA</text>

  <!-- 1.0.0 -->
  <rect x="525.247" y="285.428" width="57.507" height="57.507" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="3" filter="url(#shadow)"/>
  <rect x="464" y="113.818182" width="180" height="158.181818" rx="6.161464" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <line x1="554" y1="272" x2="554" y2="284.654545" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="554" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.592034" font-weight="bold" fill="var(--ok-text)">1.0.0</text>
  <text x="554" y="192.909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457481" fill="var(--ok-text)">Stable release</text>
  <text x="554" y="224.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.40366" fill="var(--ok-text)">First public,</text>
  <text x="554" y="247.745455" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.40366" fill="var(--ok-text)">API locked</text>

  <!-- 1.0.1 -->
  <rect x="737.247" y="285.428" width="57.507" height="57.507" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="3" filter="url(#shadow)"/>
  <rect x="676" y="356.363636" width="180" height="158.181818" rx="6.161464" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <line x1="766" y1="343.709091" x2="766" y2="356.363636" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="766" y="398.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.592034" font-weight="bold" fill="var(--ok-text)">1.0.1</text>
  <text x="766" y="435.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457481" fill="var(--ok-text)">Patch</text>
  <text x="766" y="467.090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.40366" fill="var(--ok-text)">Bug fixes only,</text>
  <text x="766" y="490.290909" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.40366" fill="var(--ok-text)">compatible</text>

  <!-- 1.1.0 -->
  <rect x="949.247" y="285.428" width="57.507" height="57.507" rx="14" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="3" filter="url(#shadow)"/>
  <rect x="888" y="113.818182" width="180" height="158.181818" rx="6.161464" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <line x1="978" y1="272" x2="978" y2="284.654545" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="978" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.592034" font-weight="bold" fill="var(--warn-text)">1.1.0</text>
  <text x="978" y="192.909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457481" fill="var(--warn-text)">Minor</text>
  <text x="978" y="224.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.40366" fill="var(--warn-text)">New features,</text>
  <text x="978" y="247.745455" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.40366" fill="var(--warn-text)">backward-compat</text>

  <!-- 2.0.0 -->
  <rect x="1121.25" y="285.428" width="57.507" height="57.507" rx="14" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="3" filter="url(#shadow)"/>
  <rect x="1060" y="356.363636" width="180" height="158.181818" rx="6.161464" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <line x1="1150" y1="343.709091" x2="1150" y2="356.363636" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1150" y="398.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.592034" font-weight="bold" fill="var(--danger-text)">2.0.0</text>
  <text x="1150" y="435.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457481" fill="var(--danger-text)">Major</text>
  <text x="1150" y="467.090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.40366" fill="var(--danger-text)">Breaking changes,</text>
  <text x="1150" y="490.290909" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.40366" fill="var(--danger-text)">new contract</text>

  <!-- Legend banner -->
  <rect x="50" y="551.454545" width="1120" height="68.545455" rx="6.161464" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="610" y="580.981818" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538213" font-weight="bold" fill="var(--text)">MAJOR.MINOR.PATCH — precedence is left-to-right, pre-release &lt; release</text>
  <text x="610" y="607.345455" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.43057" fill="var(--text-muted)">Example: 1.0.0-alpha &lt; 1.0.0-rc.1 &lt; 1.0.0 &lt; 1.0.1 &lt; 1.1.0 &lt; 2.0.0</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <line x1="98.4615" y1="360" x2="1220.9231" y2="360" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <circle cx="196.9231" cy="360" r="15.7538" fill="var(--primary-fill)" />
  <text x="196.9231" y="306" text-anchor="middle" fill="var(--text)" font-size="21.6615" font-weight="bold">1.0.0-alpha</text>
  <circle cx="393.8462" cy="360" r="15.7538" fill="var(--primary-fill)" />
  <text x="393.8462" y="306" text-anchor="middle" fill="var(--text)" font-size="21.6615" font-weight="bold">1.0.0-rc.1</text>
  <circle cx="590.7692" cy="360" r="15.7538" fill="var(--ok-fill)" />
  <text x="590.7692" y="306" text-anchor="middle" fill="var(--text)" font-size="21.6615" font-weight="bold">1.0.0</text>
  <circle cx="787.6923" cy="360" r="15.7538" fill="var(--ok-fill)" />
  <text x="787.6923" y="306" text-anchor="middle" fill="var(--text)" font-size="21.6615" font-weight="bold">1.0.1</text>
  <circle cx="984.6154" cy="360" r="15.7538" fill="var(--warn-fill)" />
  <text x="984.6154" y="306" text-anchor="middle" fill="var(--text)" font-size="21.6615" font-weight="bold">1.1.0</text>
  <circle cx="1181.5385" cy="360" r="15.7538" fill="var(--danger-fill)" />
  <text x="1181.5385" y="306" text-anchor="middle" fill="var(--text)" font-size="21.6615" font-weight="bold">2.0.0</text>
  <text x="196.9231" y="468" text-anchor="middle" fill="var(--text-muted)" font-size="19.6923">pre-release</text>
  <text x="590.7692" y="468" text-anchor="middle" fill="var(--text-muted)" font-size="19.6923">stable</text>
  <text x="787.6923" y="468" text-anchor="middle" fill="var(--text-muted)" font-size="19.6923">patch</text>
  <text x="984.6154" y="468" text-anchor="middle" fill="var(--text-muted)" font-size="19.6923">minor</text>
  <text x="1181.5385" y="468" text-anchor="middle" fill="var(--text-muted)" font-size="19.6923">major</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 19.6923 18 L 0 36 z" fill="#333" />
    </marker>
  </defs>
</svg>
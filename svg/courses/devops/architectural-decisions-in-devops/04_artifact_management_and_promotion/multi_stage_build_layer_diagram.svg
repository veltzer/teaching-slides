<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="64.6809" width="500" height="555.3191" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="9.8462 9.8462" />
  <text x="290" y="40" text-anchor="middle" fill="var(--danger-accent)" font-size="24.6481" font-weight="bold" font-family="Arial, sans-serif">Build Stage (discarded)</text>
  <rect x="80" y="110.9574" width="420" height="92.5532" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="290" y="172.6596" text-anchor="middle" fill="var(--bg)" font-size="20.5401" font-family="Arial, sans-serif">Go Compiler (300 MB)</text>
  <rect x="80" y="234.3617" width="420" height="92.5532" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="290" y="296.0638" text-anchor="middle" fill="var(--bg)" font-size="20.5401" font-family="Arial, sans-serif">Build Dependencies (150 MB)</text>
  <rect x="80" y="357.766" width="420" height="92.5532" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="290" y="419.4681" text-anchor="middle" fill="var(--bg)" font-size="20.5401" font-family="Arial, sans-serif">Source Code (5 MB)</text>
  <rect x="80" y="481.1702" width="420" height="92.5532" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="290" y="542.8723" text-anchor="middle" fill="var(--bg)" font-size="20.5401" font-family="Arial, sans-serif">Binary Output (10 MB)</text>
  <rect x="740" y="64.6809" width="500" height="401.0638" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
  <text x="990" y="40" text-anchor="middle" fill="var(--ok-accent)" font-size="24.6481" font-weight="bold" font-family="Arial, sans-serif">Runtime Stage (shipped)</text>
  <rect x="780" y="110.9574" width="420" height="92.5532" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="990" y="172.6596" text-anchor="middle" fill="var(--bg)" font-size="20.5401" font-family="Arial, sans-serif">Distroless Base (2 MB)</text>
  <rect x="780" y="234.3617" width="420" height="92.5532" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="990" y="296.0638" text-anchor="middle" fill="var(--bg)" font-size="20.5401" font-family="Arial, sans-serif">Binary (10 MB)</text>
  <text x="990" y="419.4681" text-anchor="middle" fill="var(--text-muted)" font-size="22.594" font-weight="bold" font-family="Arial, sans-serif">Total: 12 MB</text>
  <line x1="500" y1="527.4468" x2="780" y2="280.6383" stroke="var(--text)" stroke-width="2" stroke-dasharray="7.8769 7.8769" marker-end="url(#arrow)" />
  <text x="639.9999" y="373.1915" text-anchor="middle" fill="var(--text)" font-size="20.5401" font-family="Arial, sans-serif">COPY</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
</svg>
  <rect x="740" y="64.6809" width="500" height="401.0638" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
  <text x="990" y="40" text-anchor="middle" fill="var(--ok-accent)" font-size="24.6481" font-weight="bold">Runtime Stage (shipped)</text>
  <rect x="780" y="110.9574" width="420" height="92.5532" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="990" y="172.6596" text-anchor="middle" fill="var(--bg)" font-size="20.5401">Distroless Base (2 MB)</text>

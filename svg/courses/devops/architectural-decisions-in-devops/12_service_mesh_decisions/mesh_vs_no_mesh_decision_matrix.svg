<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="60" text-anchor="middle" font-size="27.4286" font-weight="bold">Decision Matrix: Mesh Adoption</text>
  <rect x="91.4286" y="108" width="548.5714" height="84" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="365.7143" y="163.2" text-anchor="middle" font-size="21.9429" font-weight="bold" fill="var(--ok-accent)">Adopt a Service Mesh</text>
  <rect x="694.8571" y="108" width="512" height="84" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="950.8571" y="163.2" text-anchor="middle" font-size="21.9429" font-weight="bold" fill="var(--danger-accent)">Skip the Mesh</text>
  <text x="365.7143" y="252" text-anchor="middle" font-size="20.1143">10+ microservices</text>
  <text x="950.8571" y="252" text-anchor="middle" font-size="20.1143">Fewer than 5 services</text>
  <text x="365.7143" y="312" text-anchor="middle" font-size="20.1143">Multi-team ownership</text>
  <text x="950.8571" y="312" text-anchor="middle" font-size="20.1143">Single team</text>
  <text x="365.7143" y="372" text-anchor="middle" font-size="20.1143">Compliance requires mTLS</text>
  <text x="950.8571" y="372" text-anchor="middle" font-size="20.1143">No encryption mandate</text>
  <text x="365.7143" y="432" text-anchor="middle" font-size="20.1143">Need canary/blue-green</text>
  <text x="950.8571" y="432" text-anchor="middle" font-size="20.1143">Simple rolling updates suffice</text>
  <text x="365.7143" y="492" text-anchor="middle" font-size="20.1143">Cross-service observability needed</text>
  <text x="950.8571" y="492" text-anchor="middle" font-size="20.1143">Basic logging is enough</text>
  <text x="365.7143" y="552" text-anchor="middle" font-size="20.1143">Polyglot service stack</text>
  <text x="950.8571" y="552" text-anchor="middle" font-size="20.1143">Homogeneous stack</text>
  <text x="365.7143" y="612" text-anchor="middle" font-size="20.1143">Dedicated platform team</text>
  <text x="950.8571" y="612" text-anchor="middle" font-size="20.1143">Small ops team</text>
  <line x1="658.2857" y1="204" x2="658.2857" y2="636" stroke="var(--text-faint)" stroke-width="1.8286" stroke-dasharray="7.3143 5.4857" />
</svg>
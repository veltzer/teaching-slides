<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="630.1639" y="40" text-anchor="middle" font-size="28.548" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Decision Matrix: Mesh Adoption</text>
  <rect x="40" y="88.3333" width="590.1639" height="84.5833" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="335.082" y="143.9167" text-anchor="middle" font-size="22.8384" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Adopt a Service Mesh</text>
  <rect x="689.1803" y="88.3333" width="550.8197" height="84.5833" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="964.5901" y="143.9167" text-anchor="middle" font-size="22.8384" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Skip the Mesh</text>
  <text x="335.082" y="233.3333" text-anchor="middle" font-size="20.9352" font-family="Arial, sans-serif" fill="var(--text)">10+ microservices</text>
  <text x="964.5901" y="233.3333" text-anchor="middle" font-size="20.9352" font-family="Arial, sans-serif" fill="var(--text)">Fewer than 5 services</text>
  <text x="335.082" y="293.75" text-anchor="middle" font-size="20.9352" font-family="Arial, sans-serif" fill="var(--text)">Multi-team ownership</text>
  <text x="964.5901" y="293.75" text-anchor="middle" font-size="20.9352" font-family="Arial, sans-serif" fill="var(--text)">Single team</text>
  <text x="335.082" y="354.1667" text-anchor="middle" font-size="20.9352" font-family="Arial, sans-serif" fill="var(--text)">Compliance requires mTLS</text>
  <text x="964.5901" y="354.1667" text-anchor="middle" font-size="20.9352" font-family="Arial, sans-serif" fill="var(--text)">No encryption mandate</text>
  <text x="335.082" y="414.5833" text-anchor="middle" font-size="20.9352" font-family="Arial, sans-serif" fill="var(--text)">Need canary/blue-green</text>
  <text x="964.5901" y="414.5833" text-anchor="middle" font-size="20.9352" font-family="Arial, sans-serif" fill="var(--text)">Simple rolling updates suffice</text>
  <text x="335.082" y="475" text-anchor="middle" font-size="20.9352" font-family="Arial, sans-serif" fill="var(--text)">Cross-service observability needed</text>
  <text x="964.5901" y="475" text-anchor="middle" font-size="20.9352" font-family="Arial, sans-serif" fill="var(--text)">Basic logging is enough</text>
  <text x="335.082" y="535.4167" text-anchor="middle" font-size="20.9352" font-family="Arial, sans-serif" fill="var(--text)">Polyglot service stack</text>
  <text x="964.5901" y="535.4167" text-anchor="middle" font-size="20.9352" font-family="Arial, sans-serif" fill="var(--text)">Homogeneous stack</text>
  <text x="335.082" y="595.8333" text-anchor="middle" font-size="20.9352" font-family="Arial, sans-serif" fill="var(--text)">Dedicated platform team</text>
  <text x="964.5901" y="595.8333" text-anchor="middle" font-size="20.9352" font-family="Arial, sans-serif" fill="var(--text)">Small ops team</text>
  <line x1="649.8361" y1="185" x2="649.8361" y2="620" stroke="var(--text-faint)" stroke-width="1.8286" stroke-dasharray="7.3143 5.4857" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="630.1639" y="40" text-anchor="middle" font-size="28.548" font-weight="bold">Decision Matrix: Mesh Adoption</text>
  <rect x="40" y="88.3333" width="590.1639" height="84.5833" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="335.082" y="143.9167" text-anchor="middle" font-size="22.8384" font-weight="bold" fill="var(--ok-accent)">Adopt a Service Mesh</text>
  <rect x="689.1803" y="88.3333" width="550.8197" height="84.5833" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="964.5901" y="143.9167" text-anchor="middle" font-size="22.8384" font-weight="bold" fill="var(--danger-accent)">Skip the Mesh</text>
  <text x="335.082" y="233.3333" text-anchor="middle" font-size="20.9352">10+ microservices</text>
  <text x="964.5901" y="233.3333" text-anchor="middle" font-size="20.9352">Fewer than 5 services</text>
  <text x="335.082" y="293.75" text-anchor="middle" font-size="20.9352">Multi-team ownership</text>
  <text x="964.5901" y="293.75" text-anchor="middle" font-size="20.9352">Single team</text>
  <text x="335.082" y="354.1667" text-anchor="middle" font-size="20.9352">Compliance requires mTLS</text>
  <text x="964.5901" y="354.1667" text-anchor="middle" font-size="20.9352">No encryption mandate</text>
  <text x="335.082" y="414.5833" text-anchor="middle" font-size="20.9352">Need canary/blue-green</text>
  <text x="964.5901" y="414.5833" text-anchor="middle" font-size="20.9352">Simple rolling updates suffice</text>
  <text x="335.082" y="475" text-anchor="middle" font-size="20.9352">Cross-service observability needed</text>
  <text x="964.5901" y="475" text-anchor="middle" font-size="20.9352">Basic logging is enough</text>
  <text x="335.082" y="535.4167" text-anchor="middle" font-size="20.9352">Polyglot service stack</text>
  <text x="964.5901" y="535.4167" text-anchor="middle" font-size="20.9352">Homogeneous stack</text>
  <text x="335.082" y="595.8333" text-anchor="middle" font-size="20.9352">Dedicated platform team</text>
  <text x="964.5901" y="595.8333" text-anchor="middle" font-size="20.9352">Small ops team</text>
  <line x1="649.8361" y1="185" x2="649.8361" y2="620" stroke="var(--text-faint)" stroke-width="1.8286" stroke-dasharray="7.3143 5.4857" />
</svg>
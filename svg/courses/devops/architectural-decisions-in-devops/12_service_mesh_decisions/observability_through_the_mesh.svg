<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="28.4897" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Three Pillars of Mesh Observability</text>
  <rect x="40" y="99.1836" width="360" height="284.0816" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="219.9999" y="170.204" text-anchor="middle" font-size="24.691" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Metrics</text>
  <text x="219.9999" y="217.551" text-anchor="middle" font-size="18.9932" font-family="Arial, sans-serif" fill="var(--ok-text)">Request rate</text>
  <text x="219.9999" y="253.0612" text-anchor="middle" font-size="18.9932" font-family="Arial, sans-serif" fill="var(--ok-text)">Error rate</text>
  <text x="219.9999" y="288.5714" text-anchor="middle" font-size="18.9932" font-family="Arial, sans-serif" fill="var(--ok-text)">Latency (p50/p99)</text>
  <text x="219.9999" y="324.0816" text-anchor="middle" font-size="18.9932" font-family="Arial, sans-serif" fill="var(--ok-text)">Connection count</text>
  <rect x="459.9999" y="99.1836" width="360" height="284.0816" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="170.204" text-anchor="middle" font-size="24.691" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Traces</text>
  <text x="639.9999" y="217.551" text-anchor="middle" font-size="18.9932" font-family="Arial, sans-serif" fill="var(--primary-text)">Distributed tracing</text>
  <text x="639.9999" y="253.0612" text-anchor="middle" font-size="18.9932" font-family="Arial, sans-serif" fill="var(--primary-text)">Request flow</text>
  <text x="639.9999" y="288.5714" text-anchor="middle" font-size="18.9932" font-family="Arial, sans-serif" fill="var(--primary-text)">Latency breakdown</text>
  <text x="639.9999" y="324.0816" text-anchor="middle" font-size="18.9932" font-family="Arial, sans-serif" fill="var(--primary-text)">Span correlation</text>
  <rect x="880" y="99.1836" width="360" height="284.0816" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1059.9999" y="170.204" text-anchor="middle" font-size="24.691" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Logs</text>
  <text x="1059.9999" y="217.551" text-anchor="middle" font-size="18.9932" font-family="Arial, sans-serif" fill="var(--warn-text)">Access logs</text>
  <text x="1059.9999" y="253.0612" text-anchor="middle" font-size="18.9932" font-family="Arial, sans-serif" fill="var(--warn-text)">Error details</text>
  <text x="1059.9999" y="288.5714" text-anchor="middle" font-size="18.9932" font-family="Arial, sans-serif" fill="var(--warn-text)">Request metadata</text>
  <text x="1059.9999" y="324.0816" text-anchor="middle" font-size="18.9932" font-family="Arial, sans-serif" fill="var(--warn-text)">Proxy diagnostics</text>
  <rect x="239.9999" y="477.9592" width="800" height="142.0408" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="537.1428" text-anchor="middle" font-size="22.7918" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Dashboards and Alerting</text>
  <text x="639.9999" y="584.4897" text-anchor="middle" font-size="20.8925" fill="var(--info-accent)" font-family="Arial, sans-serif">Grafana / Kiali / Jaeger / Prometheus</text>
  <line x1="219.9999" y1="383.2653" x2="440" y2="477.9592" stroke="var(--text)" stroke-width="1.806" marker-end="url(#arrow)" />
  <line x1="639.9999" y1="383.2653" x2="639.9999" y2="473.2244" stroke="var(--text)" stroke-width="1.806" marker-end="url(#arrow)" />
  <line x1="1059.9999" y1="383.2653" x2="839.9999" y2="477.9592" stroke="var(--text)" stroke-width="1.806" marker-end="url(#arrow)" />
</svg>
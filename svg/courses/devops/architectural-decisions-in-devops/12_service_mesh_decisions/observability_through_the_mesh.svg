<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr7" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,24 5.4857,0" fill="#333" />
    </marker>
  </defs>
  <text x="632.0988" y="59.2593" text-anchor="middle" font-size="27.09" font-weight="bold">Three Pillars of Mesh Observability</text>
  <rect x="90.2999" y="118.5185" width="325.0794" height="284.4444" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="252.8395" y="189.6296" text-anchor="middle" font-size="23.4779" font-weight="bold" fill="var(--ok-accent)">Metrics</text>
  <text x="252.8395" y="237.037" text-anchor="middle" font-size="18.06">Request rate</text>
  <text x="252.8395" y="272.5926" text-anchor="middle" font-size="18.06">Error rate</text>
  <text x="252.8395" y="308.1481" text-anchor="middle" font-size="18.06">Latency (p50/p99)</text>
  <text x="252.8395" y="343.7037" text-anchor="middle" font-size="18.06">Connection count</text>
  <rect x="469.5591" y="118.5185" width="325.0794" height="284.4444" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="632.0988" y="189.6296" text-anchor="middle" font-size="23.4779" font-weight="bold" fill="var(--primary-accent)">Traces</text>
  <text x="632.0988" y="237.037" text-anchor="middle" font-size="18.06">Distributed tracing</text>
  <text x="632.0988" y="272.5926" text-anchor="middle" font-size="18.06">Request flow</text>
  <text x="632.0988" y="308.1481" text-anchor="middle" font-size="18.06">Latency breakdown</text>
  <text x="632.0988" y="343.7037" text-anchor="middle" font-size="18.06">Span correlation</text>
  <rect x="848.8184" y="118.5185" width="325.0794" height="284.4444" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="1011.358" y="189.6296" text-anchor="middle" font-size="23.4779" font-weight="bold" fill="var(--warn-accent)">Logs</text>
  <text x="1011.358" y="237.037" text-anchor="middle" font-size="18.06">Access logs</text>
  <text x="1011.358" y="272.5926" text-anchor="middle" font-size="18.06">Error details</text>
  <text x="1011.358" y="308.1481" text-anchor="middle" font-size="18.06">Request metadata</text>
  <text x="1011.358" y="343.7037" text-anchor="middle" font-size="18.06">Proxy diagnostics</text>
  <rect x="270.8995" y="497.7778" width="722.3986" height="142.2222" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="632.0988" y="557.037" text-anchor="middle" font-size="21.672" font-weight="bold" fill="var(--info-accent)">Dashboards and Alerting</text>
  <text x="632.0988" y="604.4444" text-anchor="middle" font-size="19.866" fill="var(--info-accent)">Grafana / Kiali / Jaeger / Prometheus</text>
  <line x1="252.8395" y1="402.963" x2="451.4992" y2="497.7778" stroke="var(--text)" stroke-width="1.806" marker-end="url(#arr7)" />
  <line x1="632.0988" y1="402.963" x2="632.0988" y2="493.037" stroke="var(--text)" stroke-width="1.806" marker-end="url(#arr7)" />
  <line x1="1011.358" y1="402.963" x2="812.6984" y2="497.7778" stroke="var(--text)" stroke-width="1.806" marker-end="url(#arr7)" />
</svg>
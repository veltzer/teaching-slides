<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 5.4857,0" fill="#333" />
    </marker>
  </defs>
  <text x="627.7395" y="55.1724" text-anchor="middle" font-size="26.9031" font-weight="bold">Without Mesh: Every Service Handles Networking</text>
  <rect x="53.8062" y="110.3448" width="251.0958" height="176.5517" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="179.3541" y="176.5517" text-anchor="middle" font-size="21.5225" font-weight="bold">Service A</text>
  <text x="179.3541" y="220.6897" text-anchor="middle" font-size="17.9354" fill="var(--text-muted)">retry, TLS, LB,</text>
  <text x="179.3541" y="253.7931" text-anchor="middle" font-size="17.9354" fill="var(--text-muted)">circuit breaker</text>
  <rect x="502.1916" y="110.3448" width="251.0958" height="176.5517" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="627.7395" y="176.5517" text-anchor="middle" font-size="21.5225" font-weight="bold">Service B</text>
  <text x="627.7395" y="220.6897" text-anchor="middle" font-size="17.9354" fill="var(--text-muted)">retry, TLS, LB,</text>
  <text x="627.7395" y="253.7931" text-anchor="middle" font-size="17.9354" fill="var(--text-muted)">circuit breaker</text>
  <rect x="950.5769" y="110.3448" width="251.0958" height="176.5517" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="1076.1248" y="176.5517" text-anchor="middle" font-size="21.5225" font-weight="bold">Service C</text>
  <text x="1076.1248" y="220.6897" text-anchor="middle" font-size="17.9354" fill="var(--text-muted)">retry, TLS, LB,</text>
  <text x="1076.1248" y="253.7931" text-anchor="middle" font-size="17.9354" fill="var(--text-muted)">circuit breaker</text>
  <line x1="304.902" y1="198.6207" x2="498.6045" y2="198.6207" stroke="var(--text)" stroke-width="2" marker-end="url(#arr)" />
  <line x1="753.2874" y1="198.6207" x2="946.9898" y2="198.6207" stroke="var(--text)" stroke-width="2" marker-end="url(#arr)" />
  <text x="627.7395" y="386.2069" text-anchor="middle" font-size="26.9031" font-weight="bold" fill="var(--ok-accent)">With Mesh: Networking Handled by Infrastructure</text>
  <rect x="89.6771" y="441.3793" width="179.3541" height="110.3448" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="179.3541" y="507.5862" text-anchor="middle" font-size="21.5225">Service A</text>
  <rect x="89.6771" y="573.7931" width="179.3541" height="66.2069" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="179.3541" y="617.931" text-anchor="middle" font-size="17.9354">Proxy</text>
  <rect x="538.0624" y="441.3793" width="179.3541" height="110.3448" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="627.7395" y="507.5862" text-anchor="middle" font-size="21.5225">Service B</text>
  <rect x="538.0624" y="573.7931" width="179.3541" height="66.2069" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="627.7395" y="617.931" text-anchor="middle" font-size="17.9354">Proxy</text>
  <rect x="986.4477" y="441.3793" width="179.3541" height="110.3448" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1076.1248" y="507.5862" text-anchor="middle" font-size="21.5225">Service C</text>
  <rect x="986.4477" y="573.7931" width="179.3541" height="66.2069" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="1076.1248" y="617.931" text-anchor="middle" font-size="17.9354">Proxy</text>
  <line x1="269.0312" y1="606.8966" x2="534.4753" y2="606.8966" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr)" />
  <line x1="717.4166" y1="606.8966" x2="982.8606" y2="606.8966" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr)" />
</svg>
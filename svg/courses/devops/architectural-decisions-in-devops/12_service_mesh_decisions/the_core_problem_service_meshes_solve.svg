<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="27.3935" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Without Mesh: Every Service Handles Networking</text>
  <rect x="40" y="94.717" width="262.5" height="175.0943" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="171.25" y="160.3773" text-anchor="middle" font-size="21.9148" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Service A</text>
  <text x="171.25" y="204.151" text-anchor="middle" font-size="18.2623" fill="var(--text-muted)" font-family="Arial, sans-serif">retry, TLS, LB,</text>
  <text x="171.25" y="236.9811" text-anchor="middle" font-size="18.2623" fill="var(--text-muted)" font-family="Arial, sans-serif">circuit breaker</text>
  <rect x="508.7501" y="94.717" width="262.5" height="175.0943" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640.0001" y="160.3773" text-anchor="middle" font-size="21.9148" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Service B</text>
  <text x="640.0001" y="204.151" text-anchor="middle" font-size="18.2623" fill="var(--text-muted)" font-family="Arial, sans-serif">retry, TLS, LB,</text>
  <text x="640.0001" y="236.9811" text-anchor="middle" font-size="18.2623" fill="var(--text-muted)" font-family="Arial, sans-serif">circuit breaker</text>
  <rect x="977.5" y="94.717" width="262.5" height="175.0943" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1108.75" y="160.3773" text-anchor="middle" font-size="21.9148" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Service C</text>
  <text x="1108.75" y="204.151" text-anchor="middle" font-size="18.2623" fill="var(--text-muted)" font-family="Arial, sans-serif">retry, TLS, LB,</text>
  <text x="1108.75" y="236.9811" text-anchor="middle" font-size="18.2623" fill="var(--text-muted)" font-family="Arial, sans-serif">circuit breaker</text>
  <line x1="302.5" y1="182.2642" x2="505" y2="182.2642" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="771.2501" y1="182.2642" x2="973.75" y2="182.2642" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640.0001" y="368.3019" text-anchor="middle" font-size="27.3935" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">With Mesh: Networking Handled by Infrastructure</text>
  <rect x="77.5001" y="423.0189" width="187.5" height="109.4339" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="171.25" y="488.6792" text-anchor="middle" font-size="21.9148" font-family="Arial, sans-serif" fill="var(--ok-text)">Service A</text>
  <rect x="77.5001" y="554.3396" width="187.5" height="65.6604" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="171.25" y="598.1132" text-anchor="middle" font-size="18.2623" font-family="Arial, sans-serif" fill="var(--primary-text)">Proxy</text>
  <rect x="546.25" y="423.0189" width="187.5" height="109.4339" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640.0001" y="488.6792" text-anchor="middle" font-size="21.9148" font-family="Arial, sans-serif" fill="var(--ok-text)">Service B</text>
  <rect x="546.25" y="554.3396" width="187.5" height="65.6604" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640.0001" y="598.1132" text-anchor="middle" font-size="18.2623" font-family="Arial, sans-serif" fill="var(--primary-text)">Proxy</text>
  <rect x="1015" y="423.0189" width="187.5" height="109.4339" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1108.75" y="488.6792" text-anchor="middle" font-size="21.9148" font-family="Arial, sans-serif" fill="var(--ok-text)">Service C</text>
  <rect x="1015" y="554.3396" width="187.5" height="65.6604" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1108.75" y="598.1132" text-anchor="middle" font-size="18.2623" font-family="Arial, sans-serif" fill="var(--primary-text)">Proxy</text>
  <line x1="265" y1="587.1699" x2="542.5" y2="587.1699" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="733.7501" y1="587.1699" x2="1011.2499" y2="587.1699" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

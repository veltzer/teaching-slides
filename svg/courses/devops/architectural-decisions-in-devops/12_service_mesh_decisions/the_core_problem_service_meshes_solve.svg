<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 5.4857,0" fill="#333" />
    </marker>
  </defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="27.3935" font-weight="bold">Without Mesh: Every Service Handles Networking</text>
  <rect x="40" y="94.717" width="262.5" height="175.0943" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="171.25" y="160.3773" text-anchor="middle" font-size="21.9148" font-weight="bold">Service A</text>
  <text x="171.25" y="204.151" text-anchor="middle" font-size="18.2623" fill="var(--text-muted)">retry, TLS, LB,</text>
  <text x="171.25" y="236.9811" text-anchor="middle" font-size="18.2623" fill="var(--text-muted)">circuit breaker</text>
  <rect x="508.7501" y="94.717" width="262.5" height="175.0943" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="640.0001" y="160.3773" text-anchor="middle" font-size="21.9148" font-weight="bold">Service B</text>
  <text x="640.0001" y="204.151" text-anchor="middle" font-size="18.2623" fill="var(--text-muted)">retry, TLS, LB,</text>
  <text x="640.0001" y="236.9811" text-anchor="middle" font-size="18.2623" fill="var(--text-muted)">circuit breaker</text>
  <rect x="977.5" y="94.717" width="262.5" height="175.0943" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="1108.75" y="160.3773" text-anchor="middle" font-size="21.9148" font-weight="bold">Service C</text>
  <text x="1108.75" y="204.151" text-anchor="middle" font-size="18.2623" fill="var(--text-muted)">retry, TLS, LB,</text>
  <text x="1108.75" y="236.9811" text-anchor="middle" font-size="18.2623" fill="var(--text-muted)">circuit breaker</text>
  <line x1="302.5" y1="182.2642" x2="505" y2="182.2642" stroke="var(--text)" stroke-width="2" marker-end="url(#arr)" />
  <line x1="771.2501" y1="182.2642" x2="973.75" y2="182.2642" stroke="var(--text)" stroke-width="2" marker-end="url(#arr)" />
  <text x="640.0001" y="368.3019" text-anchor="middle" font-size="27.3935" font-weight="bold" fill="var(--ok-accent)">With Mesh: Networking Handled by Infrastructure</text>
  <rect x="77.5001" y="423.0189" width="187.5" height="109.4339" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="171.25" y="488.6792" text-anchor="middle" font-size="21.9148">Service A</text>
  <rect x="77.5001" y="554.3396" width="187.5" height="65.6604" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="171.25" y="598.1132" text-anchor="middle" font-size="18.2623">Proxy</text>
  <rect x="546.25" y="423.0189" width="187.5" height="109.4339" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="640.0001" y="488.6792" text-anchor="middle" font-size="21.9148">Service B</text>
  <rect x="546.25" y="554.3396" width="187.5" height="65.6604" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="640.0001" y="598.1132" text-anchor="middle" font-size="18.2623">Proxy</text>
  <rect x="1015" y="423.0189" width="187.5" height="109.4339" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1108.75" y="488.6792" text-anchor="middle" font-size="21.9148">Service C</text>
  <rect x="1015" y="554.3396" width="187.5" height="65.6604" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="1108.75" y="598.1132" text-anchor="middle" font-size="18.2623">Proxy</text>
  <line x1="265" y1="587.1699" x2="542.5" y2="587.1699" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr)" />
  <line x1="733.7501" y1="587.1699" x2="1011.2499" y2="587.1699" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr)" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr3" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,25.7143 5.4857,0" fill="#333" />
    </marker>
  </defs>
  <text x="624.6623" y="62.7451" text-anchor="middle" font-size="26.7713" font-weight="bold">Sidecar Proxy Pattern (per Pod)</text>
  <rect x="178.4749" y="112.9412" width="892.3747" height="527.0588" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="624.6623" y="175.6863" text-anchor="middle" font-size="23.2017" fill="var(--warn-accent)">Kubernetes Pod</text>
  <rect x="249.8649" y="225.8824" width="321.2549" height="250.9804" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="410.4923" y="313.7255" text-anchor="middle" font-size="23.2017" font-weight="bold">App Container</text>
  <text x="410.4923" y="376.4706" text-anchor="middle" font-size="19.6323" fill="var(--text-muted)">Business Logic</text>
  <text x="410.4923" y="426.6667" text-anchor="middle" font-size="19.6323" fill="var(--text-muted)">Port 8080</text>
  <rect x="678.2047" y="225.8824" width="321.2549" height="250.9804" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="838.8323" y="313.7255" text-anchor="middle" font-size="23.2017" font-weight="bold">Sidecar Proxy</text>
  <text x="838.8323" y="376.4706" text-anchor="middle" font-size="19.6323" fill="var(--text-muted)">Envoy / linkerd2-proxy</text>
  <text x="838.8323" y="426.6667" text-anchor="middle" font-size="19.6323" fill="var(--text-muted)">Port 15001</text>
  <line x1="571.1199" y1="351.3725" x2="674.6353" y2="351.3725" stroke="var(--text)" stroke-width="2" marker-end="url(#arr3)" />
  <text x="624.6623" y="338.8236" text-anchor="middle" font-size="17.8475" fill="var(--text)">localhost</text>
  <line x1="107.085" y1="351.3725" x2="246.2955" y2="351.3725" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arr3)" />
  <text x="53.5424" y="338.8236" font-size="17.8475" fill="var(--ok-accent)">In</text>
  <line x1="999.4597" y1="351.3725" x2="1177.9346" y2="351.3725" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr3)" />
  <text x="1186.8584" y="338.8236" font-size="17.8475" fill="var(--primary-accent)">Out</text>
  <text x="624.6623" y="577.2549" text-anchor="middle" font-size="19.6323" fill="var(--text-muted)">iptables rules redirect all traffic through the sidecar</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="172.2835" y="40" width="944.8818" height="580" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.279217524774" filter="url(#shadow)"/>
  <text x="644.7244" y="109.047645124717" text-anchor="middle" font-size="25.044868404814" fill="var(--warn-accent)" font-family="Arial, sans-serif">Kubernetes Pod</text>
  <rect x="247.8741" y="164.285761224491" width="340.1574" height="276.190470975056" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.279217524774" filter="url(#shadow)"/>
  <text x="417.9527" y="260.952354875283" text-anchor="middle" font-size="25.044868404814" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">App Container</text>
  <text x="417.9527" y="330" text-anchor="middle" font-size="21.191940531612" fill="var(--text-muted)" font-family="Arial, sans-serif">Business Logic</text>
  <text x="417.9527" y="385.238116099774" text-anchor="middle" font-size="21.191940531612" fill="var(--text-muted)" font-family="Arial, sans-serif">Port 8080</text>
  <rect x="701.4173" y="164.285761224491" width="340.1574" height="276.190470975056" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.279217524774" filter="url(#shadow)"/>
  <text x="871.4961" y="260.952354875283" text-anchor="middle" font-size="25.044868404814" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Sidecar Proxy</text>
  <text x="871.4961" y="330" text-anchor="middle" font-size="21.191940531612" fill="var(--text-muted)" font-family="Arial, sans-serif">Envoy / linkerd2-proxy</text>
  <text x="871.4961" y="385.238116099774" text-anchor="middle" font-size="21.191940531612" fill="var(--text-muted)" font-family="Arial, sans-serif">Port 15001</text>
  <line x1="588.0316" y1="302.3808324263" x2="697.6378" y2="302.3808324263" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="644.7244" y="288.571522448983" text-anchor="middle" font-size="19.265371941386" fill="var(--text)" font-family="Arial, sans-serif">localhost</text>
  <line x1="96.693" y1="302.3808324263" x2="244.0946" y2="302.3808324263" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="40" y="288.571522448983" font-size="19.265371941386" fill="var(--ok-accent)" font-family="Arial, sans-serif">In</text>
  <line x1="1041.5748" y1="302.3808324263" x2="1230.5511" y2="302.3808324263" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1240" y="288.571522448983" font-size="19.265371941386" fill="var(--primary-accent)" font-family="Arial, sans-serif">Out</text>
  <text x="644.7244" y="550.952354875283" text-anchor="middle" font-size="21.191940531612" fill="var(--text-muted)" font-family="Arial, sans-serif">iptables rules redirect all traffic through the sidecar</text>
</svg>

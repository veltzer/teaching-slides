<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr3" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,25.7143 5.4857,0" fill="#333" />
    </marker>
  </defs>
  <text x="644.7244" y="40" text-anchor="middle" font-size="27.6131" font-weight="bold">Sidecar Proxy Pattern (per Pod)</text>
  <rect x="172.2835" y="90.4348" width="944.8818" height="529.5652" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="644.7244" y="153.4783" text-anchor="middle" font-size="23.9312" fill="var(--warn-accent)">Kubernetes Pod</text>
  <rect x="247.8741" y="203.9131" width="340.1574" height="252.1739" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="417.9527" y="292.1739" text-anchor="middle" font-size="23.9312" font-weight="bold">App Container</text>
  <text x="417.9527" y="355.2174" text-anchor="middle" font-size="20.2496" fill="var(--text-muted)">Business Logic</text>
  <text x="417.9527" y="405.6522" text-anchor="middle" font-size="20.2496" fill="var(--text-muted)">Port 8080</text>
  <rect x="701.4173" y="203.9131" width="340.1574" height="252.1739" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="871.4961" y="292.1739" text-anchor="middle" font-size="23.9312" font-weight="bold">Sidecar Proxy</text>
  <text x="871.4961" y="355.2174" text-anchor="middle" font-size="20.2496" fill="var(--text-muted)">Envoy / linkerd2-proxy</text>
  <text x="871.4961" y="405.6522" text-anchor="middle" font-size="20.2496" fill="var(--text-muted)">Port 15001</text>
  <line x1="588.0316" y1="329.9999" x2="697.6378" y2="329.9999" stroke="var(--text)" stroke-width="2" marker-end="url(#arr3)" />
  <text x="644.7244" y="317.3914" text-anchor="middle" font-size="18.4087" fill="var(--text)">localhost</text>
  <line x1="96.693" y1="329.9999" x2="244.0946" y2="329.9999" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arr3)" />
  <text x="40" y="317.3914" font-size="18.4087" fill="var(--ok-accent)">In</text>
  <line x1="1041.5748" y1="329.9999" x2="1230.5511" y2="329.9999" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr3)" />
  <text x="1240" y="317.3914" font-size="18.4087" fill="var(--primary-accent)">Out</text>
  <text x="644.7244" y="556.9565" text-anchor="middle" font-size="20.2496" fill="var(--text-muted)">iptables rules redirect all traffic through the sidecar</text>
</svg>
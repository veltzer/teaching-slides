<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr5" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,24 5.4857,0" fill="#333" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="27.6557" font-weight="bold">mTLS Handshake Between Proxies</text>
  <rect x="40" y="95.7692" width="260" height="111.5385" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="169.9999" y="162.6922" text-anchor="middle" font-size="22.1246">Service A</text>
  <rect x="40" y="229.6153" width="260" height="89.2308" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="169.9999" y="285.3846" text-anchor="middle" font-size="20.2808">Proxy A</text>
  <rect x="980" y="95.7692" width="260" height="111.5385" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1110.0001" y="162.6922" text-anchor="middle" font-size="22.1246">Service B</text>
  <rect x="980" y="229.6153" width="260" height="89.2308" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1110.0001" y="285.3846" text-anchor="middle" font-size="20.2808">Proxy B</text>
  <line x1="300.0001" y1="251.9231" x2="976" y2="251.9231" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr5)" />
  <text x="640" y="240.7692" text-anchor="middle" font-size="18.4371" fill="var(--primary-accent)">1. ClientHello + client cert</text>
  <line x1="976" y1="285.3846" x2="300.0001" y2="285.3846" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arr5)" />
  <text x="640" y="330" text-anchor="middle" font-size="18.4371" fill="var(--ok-accent)">2. ServerHello + server cert</text>
  <line x1="300.0001" y1="363.4615" x2="976" y2="363.4615" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr5)" />
  <text x="640" y="396.9231" text-anchor="middle" font-size="18.4371" fill="var(--primary-accent)">3. Certificate verification (both sides)</text>
  <line x1="300.0001" y1="430.3846" x2="976" y2="430.3846" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arr5)" />
  <line x1="976" y1="452.6922" x2="300.0001" y2="452.6922" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arr5)" />
  <text x="640" y="497.3077" text-anchor="middle" font-size="20.2808" font-weight="bold" fill="var(--warn-accent)">4. Encrypted application data</text>
  <rect x="340" y="541.9231" width="600" height="78.0769" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="591" text-anchor="middle" font-size="18.4371" fill="var(--warn-accent)">Certificates auto-rotated by control plane CA</text>
</svg>
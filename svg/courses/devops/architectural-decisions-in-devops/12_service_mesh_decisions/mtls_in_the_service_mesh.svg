  <ns0:text x="196.7585" y="179.6491" text-anchor="middle" font-size="20.5314">Service A</ns0:text>
  <ns0:rect x="85.5472" y="247.0175" width="222.4227" height="89.8246" fill="#bbdefb" stroke="#1976d2" stroke-width="3.4218" rx="5.1328" />
  <ns0:text x="196.7585" y="303.1579" text-anchor="middle" font-size="18.8204">Proxy A</ns0:text>
  <ns0:rect x="889.6909" y="112.2807" width="222.4227" height="112.2807" fill="#c8e6c9" stroke="#388e3c" stroke-width="3.4218" rx="8.5548" />
  <ns0:text x="1000.9023" y="179.6491" text-anchor="middle" font-size="20.5314">Service B</ns0:text>
  <ns0:rect x="889.6909" y="247.0175" width="222.4227" height="89.8246" fill="#bbdefb" stroke="#1976d2" stroke-width="3.4218" rx="5.1328" />
  <ns0:text x="1000.9023" y="303.1579" text-anchor="middle" font-size="18.8204">Proxy B</ns0:text>
  <ns0:line x1="307.97" y1="269.4737" x2="886.269" y2="269.4737" stroke="#1976d2" stroke-width="3.4218" marker-end="url(#arr5)" />
  <ns0:text x="598.8304" y="258.2456" text-anchor="middle" font-size="17.1094" fill="#1976d2">1. ClientHello + client cert</ns0:text>
  <ns0:line x1="886.269" y1="303.1579" x2="307.97" y2="303.1579" stroke="#388e3c" stroke-width="3.4218" marker-end="url(#arr5)" />
  <ns0:text x="598.8304" y="348.0702" text-anchor="middle" font-size="17.1094" fill="#388e3c">2. ServerHello + server cert</ns0:text>
  <ns0:line x1="307.97" y1="381.7544" x2="886.269" y2="381.7544" stroke="#1976d2" stroke-width="3.4218" marker-end="url(#arr5)" />
  <ns0:text x="598.8304" y="415.4386" text-anchor="middle" font-size="17.1094" fill="#1976d2">3. Certificate verification (both sides)</ns0:text>
  <ns0:line x1="307.97" y1="449.1228" x2="886.269" y2="449.1228" stroke="#e65100" stroke-width="5.1328" marker-end="url(#arr5)" />
  <ns0:line x1="886.269" y1="471.5789" x2="307.97" y2="471.5789" stroke="#e65100" stroke-width="5.1328" marker-end="url(#arr5)" />
  <ns0:text x="598.8304" y="516.4912" text-anchor="middle" font-size="18.8204" font-weight="bold" fill="#e65100">4. Encrypted application data</ns0:text>

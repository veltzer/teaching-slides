<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="260" height="123.404290629242" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.311084288478" filter="url(#shadow)"/>
  <text x="169.9999" y="114.042463739254" text-anchor="middle" font-size="23.271702574809" font-family="Arial, sans-serif" fill="var(--ok-text)">Service A</text>
  <rect x="40" y="188.085038116799" width="260" height="98.723432503394" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.311084288478" filter="url(#shadow)"/>
  <text x="169.9999" y="249.787238750566" text-anchor="middle" font-size="21.33230637296" font-family="Arial, sans-serif" fill="var(--primary-text)">Proxy A</text>
  <rect x="980" y="40" width="260" height="123.404290629242" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.311084288478" filter="url(#shadow)"/>
  <text x="1110.0001" y="114.042463739254" text-anchor="middle" font-size="23.271702574809" font-family="Arial, sans-serif" fill="var(--ok-text)">Service B</text>
  <rect x="980" y="188.085038116799" width="260" height="98.723432503394" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.311084288478" filter="url(#shadow)"/>
  <text x="1110.0001" y="249.787238750566" text-anchor="middle" font-size="21.33230637296" font-family="Arial, sans-serif" fill="var(--primary-text)">Proxy B</text>
  <line x1="300.0001" y1="212.766006880939" x2="976" y2="212.766006880939" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="200.425522498869" text-anchor="middle" font-size="19.393015355849" fill="var(--primary-accent)" font-family="Arial, sans-serif">1. ClientHello + client cert</text>
  <line x1="976" y1="249.787238750566" x2="300.0001" y2="249.787238750566" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="299.148955002262" text-anchor="middle" font-size="19.393015355849" fill="var(--ok-accent)" font-family="Arial, sans-serif">2. ServerHello + server cert</text>
  <line x1="300.0001" y1="336.170186871889" x2="976" y2="336.170186871889" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="373.191529379807" text-anchor="middle" font-size="19.393015355849" fill="var(--primary-accent)" font-family="Arial, sans-serif">3. Certificate verification (both sides)</text>
  <line x1="300.0001" y1="410.212761249434" x2="976" y2="410.212761249434" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="976" y1="434.893508736991" x2="300.0001" y2="434.893508736991" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="484.25533562698" text-anchor="middle" font-size="21.33230637296" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">4. Encrypted application data</text>
  <rect x="340" y="533.617051878676" width="600" height="86.382948121324" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.311084288478" filter="url(#shadow)"/>
  <text x="640" y="587.914895500226" text-anchor="middle" font-size="19.393015355849" fill="var(--warn-accent)" font-family="Arial, sans-serif">Certificates auto-rotated by control plane CA</text>
</svg>

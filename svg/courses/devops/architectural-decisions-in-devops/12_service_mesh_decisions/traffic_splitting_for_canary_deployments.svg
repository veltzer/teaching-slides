<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="30.8512" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Canary Traffic Splitting (90/10)</text>
  <rect x="40" y="263.077" width="240" height="148.7179" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="160" y="352.3077" text-anchor="middle" font-size="24.681" font-family="Arial, sans-serif" fill="var(--info-text)">Incoming</text>
  <text x="160" y="396.923" text-anchor="middle" font-size="24.681" font-family="Arial, sans-serif" fill="var(--info-text)">Traffic</text>
  <rect x="440" y="263.077" width="240" height="148.7179" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="559.9999" y="352.3077" text-anchor="middle" font-size="24.681" font-family="Arial, sans-serif" fill="var(--primary-text)">Mesh Proxy</text>
  <rect x="940" y="114.359" width="300" height="148.7179" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1090.0001" y="179.7949" text-anchor="middle" font-size="24.681" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">v1 (stable)</text>
  <text x="1090.0001" y="233.3334" text-anchor="middle" font-size="22.6242" fill="var(--ok-accent)" font-family="Arial, sans-serif">90% traffic</text>
  <rect x="940" y="471.2821" width="300" height="148.7179" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1090.0001" y="536.718" text-anchor="middle" font-size="24.681" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">v2 (canary)</text>
  <text x="1090.0001" y="590.2564" text-anchor="middle" font-size="22.6242" fill="var(--warn-accent)" font-family="Arial, sans-serif">10% traffic</text>
  <line x1="279.9999" y1="337.4359" x2="436" y2="337.4359" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="292.8205" x2="936" y2="203.5898" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="382.0513" x2="936" y2="530.7692" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="820" y="203.5898" text-anchor="middle" font-size="22.6242" fill="var(--ok-accent)" font-family="Arial, sans-serif">90%</text>
  <text x="820" y="486.1538" text-anchor="middle" font-size="22.6242" fill="var(--warn-accent)" font-family="Arial, sans-serif">10%</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="152.631537257623" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.382541601874" filter="url(#shadow)"/>
  <text x="639.9999" y="137.684220055401" text-anchor="middle" font-size="27.087187431271" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Control Plane (istiod)</text>
  <rect x="100" y="314.736812326873" width="320" height="305.263187673127" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.382541601874" filter="url(#shadow)"/>
  <text x="259.9999" y="406.315825207752" text-anchor="middle" font-size="25.00360672534" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Service A</text>
  <text x="259.9999" y="467.368349584496" text-anchor="middle" font-size="20.836338937783" fill="var(--text-muted)" font-family="Arial, sans-serif">gRPC library with</text>
  <text x="259.9999" y="513.157912603876" text-anchor="middle" font-size="20.836338937783" fill="var(--text-muted)" font-family="Arial, sans-serif">built-in xDS client</text>
  <text x="259.9999" y="574.21043698062" text-anchor="middle" font-size="20.836338937783" fill="var(--primary-accent)" font-family="Arial, sans-serif">No sidecar needed</text>
  <rect x="779.9999" y="314.736812326873" width="320" height="305.263187673127" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.382541601874" filter="url(#shadow)"/>
  <text x="939.9999" y="406.315825207752" text-anchor="middle" font-size="25.00360672534" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Service B</text>
  <text x="939.9999" y="467.368349584496" text-anchor="middle" font-size="20.836338937783" fill="var(--text-muted)" font-family="Arial, sans-serif">gRPC library with</text>
  <text x="939.9999" y="513.157912603876" text-anchor="middle" font-size="20.836338937783" fill="var(--text-muted)" font-family="Arial, sans-serif">built-in xDS client</text>
  <text x="939.9999" y="574.21043698062" text-anchor="middle" font-size="20.836338937783" fill="var(--primary-accent)" font-family="Arial, sans-serif">No sidecar needed</text>
  <line x1="419.9999" y1="467.368349584496" x2="776" y2="467.368349584496" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="445.999954736847" text-anchor="middle" font-size="20.836338937783" fill="var(--ok-accent)" font-family="Arial, sans-serif">Direct gRPC call</text>
  <line x1="259.9999" y1="314.736812326873" x2="259.9999" y2="192.631650415504" stroke="var(--info-border)" stroke-width="1.8286" stroke-dasharray="7.3143 5.4857" marker-end="url(#arrow)"/>
  <line x1="939.9999" y1="314.736812326873" x2="939.9999" y2="192.631650415504" stroke="var(--info-border)" stroke-width="1.8286" stroke-dasharray="7.3143 5.4857" marker-end="url(#arrow)"/>
  <text x="119.9999" y="268.947475623256" font-size="20.836338937783" fill="var(--info-accent)" font-family="Arial, sans-serif">xDS config</text>
  <text x="819.9999" y="268.947475623256" font-size="20.836338937783" fill="var(--info-accent)" font-family="Arial, sans-serif">xDS config</text>
</svg>

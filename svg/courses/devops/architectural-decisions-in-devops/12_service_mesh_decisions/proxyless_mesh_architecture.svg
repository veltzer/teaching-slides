<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arr4" markerWidth="18.2857" markerHeight="25.7143" refX="16.4571" refY="7.7143" orient="auto">
      <polygon points="0,25.7143 5.4857,0" fill="#333" />
    </marker>
  </defs>
  <text x="640" y="64.2857" text-anchor="middle" font-size="27.4286" font-weight="bold">Proxyless Mesh (gRPC xDS)</text>
  <rect x="91.4286" y="128.5714" width="1097.1429" height="128.5714" fill="#e8eaf6" stroke="#3f51b5" stroke-width="3.6571" rx="9.1429" />
  <text x="640" y="210.8571" text-anchor="middle" font-size="23.7714" font-weight="bold" fill="#3f51b5">Control Plane (istiod)</text>
  <rect x="146.2857" y="360" width="292.5714" height="257.1429" fill="#c8e6c9" stroke="#388e3c" stroke-width="3.6571" rx="9.1429" />
  <text x="292.5714" y="437.1429" text-anchor="middle" font-size="21.9429" font-weight="bold">Service A</text>
  <text x="292.5714" y="488.5714" text-anchor="middle" font-size="18.2857" fill="#555">gRPC library with</text>
  <text x="292.5714" y="527.1429" text-anchor="middle" font-size="18.2857" fill="#555">built-in xDS client</text>
  <text x="292.5714" y="578.5714" text-anchor="middle" font-size="18.2857" fill="#1976d2">No sidecar needed</text>
  <rect x="768" y="360" width="292.5714" height="257.1429" fill="#c8e6c9" stroke="#388e3c" stroke-width="3.6571" rx="9.1429" />
  <text x="914.2857" y="437.1429" text-anchor="middle" font-size="21.9429" font-weight="bold">Service B</text>
  <text x="914.2857" y="488.5714" text-anchor="middle" font-size="18.2857" fill="#555">gRPC library with</text>
  <text x="914.2857" y="527.1429" text-anchor="middle" font-size="18.2857" fill="#555">built-in xDS client</text>
  <text x="914.2857" y="578.5714" text-anchor="middle" font-size="18.2857" fill="#1976d2">No sidecar needed</text>
  <line x1="438.8571" y1="488.5714" x2="764.3429" y2="488.5714" stroke="#388e3c" stroke-width="3.6571" marker-end="url(#arr4)" />
  <text x="603.4286" y="470.5714" text-anchor="middle" font-size="18.2857" fill="#388e3c">Direct gRPC call</text>
  <line x1="292.5714" y1="360" x2="292.5714" y2="257.1429" stroke="#3f51b5" stroke-width="1.8286" stroke-dasharray="7.3143 5.4857" marker-end="url(#arr4)" />
  <line x1="914.2857" y1="360" x2="914.2857" y2="257.1429" stroke="#3f51b5" stroke-width="1.8286" stroke-dasharray="7.3143 5.4857" marker-end="url(#arr4)" />
  <text x="164.5714" y="321.4286" font-size="18.2857" fill="#3f51b5">xDS config</text>
  <text x="804.5714" y="321.4286" font-size="18.2857" fill="#3f51b5">xDS config</text>
</svg>
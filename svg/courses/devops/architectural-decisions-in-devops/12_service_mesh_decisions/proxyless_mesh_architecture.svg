<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="29.3812" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Proxyless Mesh (gRPC xDS)</text>
  <rect x="40" y="107.4418" width="1200" height="134.8837" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="193.7674" text-anchor="middle" font-size="25.4637" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Control Plane (istiod)</text>
  <rect x="100" y="350.2325" width="320" height="269.7675" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="259.9999" y="431.1628" text-anchor="middle" font-size="23.505" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Service A</text>
  <text x="259.9999" y="485.1162" text-anchor="middle" font-size="19.5875" fill="var(--text-muted)" font-family="Arial, sans-serif">gRPC library with</text>
  <text x="259.9999" y="525.5814" text-anchor="middle" font-size="19.5875" fill="var(--text-muted)" font-family="Arial, sans-serif">built-in xDS client</text>
  <text x="259.9999" y="579.5348" text-anchor="middle" font-size="19.5875" fill="var(--primary-accent)" font-family="Arial, sans-serif">No sidecar needed</text>
  <rect x="779.9999" y="350.2325" width="320" height="269.7675" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="939.9999" y="431.1628" text-anchor="middle" font-size="23.505" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Service B</text>
  <text x="939.9999" y="485.1162" text-anchor="middle" font-size="19.5875" fill="var(--text-muted)" font-family="Arial, sans-serif">gRPC library with</text>
  <text x="939.9999" y="525.5814" text-anchor="middle" font-size="19.5875" fill="var(--text-muted)" font-family="Arial, sans-serif">built-in xDS client</text>
  <text x="939.9999" y="579.5348" text-anchor="middle" font-size="19.5875" fill="var(--primary-accent)" font-family="Arial, sans-serif">No sidecar needed</text>
  <line x1="419.9999" y1="485.1162" x2="776" y2="485.1162" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="600" y="466.2325" text-anchor="middle" font-size="19.5875" fill="var(--ok-accent)" font-family="Arial, sans-serif">Direct gRPC call</text>
  <line x1="259.9999" y1="350.2325" x2="259.9999" y2="242.3256" stroke="var(--info-border)" stroke-width="1.8286" stroke-dasharray="7.3143 5.4857" marker-end="url(#arrow)" />
  <line x1="939.9999" y1="350.2325" x2="939.9999" y2="242.3256" stroke="var(--info-border)" stroke-width="1.8286" stroke-dasharray="7.3143 5.4857" marker-end="url(#arrow)" />
  <text x="119.9999" y="309.7675" font-size="19.5875" fill="var(--info-accent)" font-family="Arial, sans-serif">xDS config</text>
  <text x="819.9999" y="309.7675" font-size="19.5875" fill="var(--info-accent)" font-family="Arial, sans-serif">xDS config</text>
</svg>
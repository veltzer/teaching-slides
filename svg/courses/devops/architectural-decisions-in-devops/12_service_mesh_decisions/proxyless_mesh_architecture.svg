<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr4" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,25.7143 5.4857,0" fill="#333" />
    </marker>
  </defs>
  <text x="640" y="64.2857" text-anchor="middle" font-size="27.4286" font-weight="bold">Proxyless Mesh (gRPC xDS)</text>
  <rect x="91.4286" y="128.5714" width="1097.1429" height="128.5714" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="640" y="210.8571" text-anchor="middle" font-size="23.7714" font-weight="bold" fill="var(--info-accent)">Control Plane (istiod)</text>
  <rect x="146.2857" y="360" width="292.5714" height="257.1429" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="292.5714" y="437.1429" text-anchor="middle" font-size="21.9429" font-weight="bold">Service A</text>
  <text x="292.5714" y="488.5714" text-anchor="middle" font-size="18.2857" fill="var(--text-muted)">gRPC library with</text>
  <text x="292.5714" y="527.1429" text-anchor="middle" font-size="18.2857" fill="var(--text-muted)">built-in xDS client</text>
  <text x="292.5714" y="578.5714" text-anchor="middle" font-size="18.2857" fill="var(--primary-accent)">No sidecar needed</text>
  <rect x="768" y="360" width="292.5714" height="257.1429" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="914.2857" y="437.1429" text-anchor="middle" font-size="21.9429" font-weight="bold">Service B</text>
  <text x="914.2857" y="488.5714" text-anchor="middle" font-size="18.2857" fill="var(--text-muted)">gRPC library with</text>
  <text x="914.2857" y="527.1429" text-anchor="middle" font-size="18.2857" fill="var(--text-muted)">built-in xDS client</text>
  <text x="914.2857" y="578.5714" text-anchor="middle" font-size="18.2857" fill="var(--primary-accent)">No sidecar needed</text>
  <line x1="438.8571" y1="488.5714" x2="764.3429" y2="488.5714" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arr4)" />
  <text x="603.4286" y="470.5714" text-anchor="middle" font-size="18.2857" fill="var(--ok-accent)">Direct gRPC call</text>
  <line x1="292.5714" y1="360" x2="292.5714" y2="257.1429" stroke="var(--info-border)" stroke-width="1.8286" stroke-dasharray="7.3143 5.4857" marker-end="url(#arr4)" />
  <line x1="914.2857" y1="360" x2="914.2857" y2="257.1429" stroke="var(--info-border)" stroke-width="1.8286" stroke-dasharray="7.3143 5.4857" marker-end="url(#arr4)" />
  <text x="164.5714" y="321.4286" font-size="18.2857" fill="var(--info-accent)">xDS config</text>
  <text x="804.5714" y="321.4286" font-size="18.2857" fill="var(--info-accent)">xDS config</text>
</svg>
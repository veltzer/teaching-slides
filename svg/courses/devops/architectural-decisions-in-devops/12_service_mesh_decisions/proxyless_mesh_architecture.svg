<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr4" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,25.7143 5.4857,0" fill="#333" />
    </marker>
  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="29.3812" font-weight="bold">Proxyless Mesh (gRPC xDS)</text>
  <rect x="40" y="107.4418" width="1200" height="134.8837" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="193.7674" text-anchor="middle" font-size="25.4637" font-weight="bold" fill="var(--info-accent)">Control Plane (istiod)</text>
  <rect x="100" y="350.2325" width="320" height="269.7675" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="259.9999" y="431.1628" text-anchor="middle" font-size="23.505" font-weight="bold">Service A</text>
  <text x="259.9999" y="485.1162" text-anchor="middle" font-size="19.5875" fill="var(--text-muted)">gRPC library with</text>
  <text x="259.9999" y="525.5814" text-anchor="middle" font-size="19.5875" fill="var(--text-muted)">built-in xDS client</text>
  <text x="259.9999" y="579.5348" text-anchor="middle" font-size="19.5875" fill="var(--primary-accent)">No sidecar needed</text>
  <rect x="779.9999" y="350.2325" width="320" height="269.7675" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="939.9999" y="431.1628" text-anchor="middle" font-size="23.505" font-weight="bold">Service B</text>
  <text x="939.9999" y="485.1162" text-anchor="middle" font-size="19.5875" fill="var(--text-muted)">gRPC library with</text>
  <text x="939.9999" y="525.5814" text-anchor="middle" font-size="19.5875" fill="var(--text-muted)">built-in xDS client</text>
  <text x="939.9999" y="579.5348" text-anchor="middle" font-size="19.5875" fill="var(--primary-accent)">No sidecar needed</text>
  <line x1="419.9999" y1="485.1162" x2="776" y2="485.1162" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arr4)" />
  <text x="600" y="466.2325" text-anchor="middle" font-size="19.5875" fill="var(--ok-accent)">Direct gRPC call</text>
  <line x1="259.9999" y1="350.2325" x2="259.9999" y2="242.3256" stroke="var(--info-border)" stroke-width="1.8286" stroke-dasharray="7.3143 5.4857" marker-end="url(#arr4)" />
  <line x1="939.9999" y1="350.2325" x2="939.9999" y2="242.3256" stroke="var(--info-border)" stroke-width="1.8286" stroke-dasharray="7.3143 5.4857" marker-end="url(#arr4)" />
  <text x="119.9999" y="309.7675" font-size="19.5875" fill="var(--info-accent)">xDS config</text>
  <text x="819.9999" y="309.7675" font-size="19.5875" fill="var(--info-accent)">xDS config</text>
</svg>
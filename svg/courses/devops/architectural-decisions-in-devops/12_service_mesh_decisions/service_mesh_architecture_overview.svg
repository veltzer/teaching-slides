<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.4857,0" fill="#333" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="90.6249" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="98" text-anchor="middle" font-size="25.1308" font-weight="bold" fill="var(--info-accent)">Control Plane (istiod / Linkerd control plane)</text>
  <rect x="40" y="185.0001" width="1200" height="434.9999" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" stroke-dasharray="8.6196 8.6196" />
  <text x="640" y="221.25" text-anchor="middle" font-size="23.3356" fill="var(--text-muted)">Data Plane</text>
  <rect x="99.9999" y="257.5" width="220.0001" height="90.6249" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="209.9999" y="311.875" text-anchor="middle" font-size="19.7456">Service A</text>
  <rect x="99.9999" y="366.25" width="220.0001" height="63.4375" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="209.9999" y="406.125" text-anchor="middle" font-size="17.9505">Envoy Proxy</text>
  <rect x="530" y="257.5" width="220.0001" height="90.6249" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="311.875" text-anchor="middle" font-size="19.7456">Service B</text>
  <rect x="530" y="366.25" width="220.0001" height="63.4375" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="406.125" text-anchor="middle" font-size="17.9505">Envoy Proxy</text>
  <rect x="959.9999" y="257.5" width="220.0001" height="90.6249" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1070" y="311.875" text-anchor="middle" font-size="19.7456">Service C</text>
  <rect x="959.9999" y="366.25" width="220.0001" height="63.4375" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1070" y="406.125" text-anchor="middle" font-size="17.9505">Envoy Proxy</text>
  <line x1="320" y1="397.0625" x2="525.9999" y2="397.0625" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr2)" />
  <line x1="749.9999" y1="397.0625" x2="955.9999" y2="397.0625" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr2)" />
  <line x1="209.9999" y1="366.25" x2="209.9999" y2="130.6251" stroke="var(--info-border)" stroke-width="1.7239" stroke-dasharray="6.8956 5.1717" marker-end="url(#arr2)" />
  <line x1="640" y1="366.25" x2="640" y2="130.6251" stroke="var(--info-border)" stroke-width="1.7239" stroke-dasharray="6.8956 5.1717" marker-end="url(#arr2)" />
  <line x1="1070" y1="366.25" x2="1070" y2="130.6251" stroke="var(--info-border)" stroke-width="1.7239" stroke-dasharray="6.8956 5.1717" marker-end="url(#arr2)" />
  <text x="640" y="493.1249" text-anchor="middle" font-size="19.7456" fill="var(--primary-accent)">--- mTLS encrypted traffic ---</text>
  <text x="99.9999" y="583.75" font-size="17.9505" fill="var(--info-accent)">Config push (xDS)</text>
  <text x="580" y="583.75" font-size="17.9505" fill="var(--primary-accent)">Data traffic (mTLS)</text>
  <line x1="80" y1="556.5624" x2="80" y2="529.375" stroke="var(--info-border)" stroke-width="1.7239" stroke-dasharray="6.8956 5.1717" />
  <line x1="559.9999" y1="556.5624" x2="559.9999" y2="529.375" stroke="var(--primary-border)" stroke-width="2" />
</svg>
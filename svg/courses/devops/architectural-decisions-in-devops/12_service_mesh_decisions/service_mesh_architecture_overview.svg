<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <rect x="40" y="40" width="1200" height="90.6249" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="98" text-anchor="middle" font-size="25.1308" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Control Plane (istiod / Linkerd control plane)</text>
  <rect x="40" y="185.0001" width="1200" height="434.9999" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" stroke-dasharray="8.6196 8.6196" />
  <text x="640" y="221.25" text-anchor="middle" font-size="23.3356" fill="var(--text-muted)" font-family="Arial, sans-serif">Data Plane</text>
  <rect x="99.9999" y="257.5" width="220.0001" height="90.6249" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="209.9999" y="311.875" text-anchor="middle" font-size="19.7456" font-family="Arial, sans-serif" fill="var(--ok-text)">Service A</text>
  <rect x="99.9999" y="366.25" width="220.0001" height="63.4375" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="209.9999" y="406.125" text-anchor="middle" font-size="17.9505" font-family="Arial, sans-serif" fill="var(--primary-text)">Envoy Proxy</text>
  <rect x="530" y="257.5" width="220.0001" height="90.6249" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="311.875" text-anchor="middle" font-size="19.7456" font-family="Arial, sans-serif" fill="var(--ok-text)">Service B</text>
  <rect x="530" y="366.25" width="220.0001" height="63.4375" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="406.125" text-anchor="middle" font-size="17.9505" font-family="Arial, sans-serif" fill="var(--primary-text)">Envoy Proxy</text>
  <rect x="959.9999" y="257.5" width="220.0001" height="90.6249" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1070" y="311.875" text-anchor="middle" font-size="19.7456" font-family="Arial, sans-serif" fill="var(--ok-text)">Service C</text>
  <rect x="959.9999" y="366.25" width="220.0001" height="63.4375" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1070" y="406.125" text-anchor="middle" font-size="17.9505" font-family="Arial, sans-serif" fill="var(--primary-text)">Envoy Proxy</text>
  <line x1="320" y1="397.0625" x2="525.9999" y2="397.0625" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="749.9999" y1="397.0625" x2="955.9999" y2="397.0625" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="209.9999" y1="366.25" x2="209.9999" y2="130.6251" stroke="var(--info-border)" stroke-width="1.7239" stroke-dasharray="6.8956 5.1717" marker-end="url(#arrow)" />
  <line x1="640" y1="366.25" x2="640" y2="130.6251" stroke="var(--info-border)" stroke-width="1.7239" stroke-dasharray="6.8956 5.1717" marker-end="url(#arrow)" />
  <line x1="1070" y1="366.25" x2="1070" y2="130.6251" stroke="var(--info-border)" stroke-width="1.7239" stroke-dasharray="6.8956 5.1717" marker-end="url(#arrow)" />
  <text x="640" y="493.1249" text-anchor="middle" font-size="19.7456" fill="var(--primary-accent)" font-family="Arial, sans-serif">--- mTLS encrypted traffic ---</text>
  <text x="99.9999" y="583.75" font-size="17.9505" fill="var(--info-accent)" font-family="Arial, sans-serif">Config push (xDS)</text>
  <text x="580" y="583.75" font-size="17.9505" fill="var(--primary-accent)" font-family="Arial, sans-serif">Data traffic (mTLS)</text>
  <line x1="80" y1="556.5624" x2="80" y2="529.375" stroke="var(--info-border)" stroke-width="1.7239" stroke-dasharray="6.8956 5.1717" />
  <line x1="559.9999" y1="556.5624" x2="559.9999" y2="529.375" stroke="var(--primary-border)" stroke-width="2" />
</svg>
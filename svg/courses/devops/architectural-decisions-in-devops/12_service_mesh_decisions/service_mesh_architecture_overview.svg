<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.4857,0" fill="#333" />
    </marker>
  </defs>
  <rect x="86.1953" y="19.3939" width="1034.3434" height="96.9696" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="603.367" y="81.4545" text-anchor="middle" font-size="24.1347" font-weight="bold" fill="var(--info-accent)">Control Plane (istiod / Linkerd control plane)</text>
  <rect x="86.1953" y="174.5455" width="1034.3434" height="465.4545" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" stroke-dasharray="8.6196 8.6196" />
  <text x="603.367" y="213.3333" text-anchor="middle" font-size="22.4107" fill="var(--text-muted)">Data Plane</text>
  <rect x="137.9124" y="252.1212" width="189.6297" height="96.9696" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="232.7272" y="310.303" text-anchor="middle" font-size="18.963">Service A</text>
  <rect x="137.9124" y="368.4848" width="189.6297" height="67.8788" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="232.7272" y="411.1515" text-anchor="middle" font-size="17.239">Envoy Proxy</text>
  <rect x="508.5522" y="252.1212" width="189.6297" height="96.9696" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="603.367" y="310.303" text-anchor="middle" font-size="18.963">Service B</text>
  <rect x="508.5522" y="368.4848" width="189.6297" height="67.8788" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="603.367" y="411.1515" text-anchor="middle" font-size="17.239">Envoy Proxy</text>
  <rect x="879.1918" y="252.1212" width="189.6297" height="96.9696" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="974.0067" y="310.303" text-anchor="middle" font-size="18.963">Service C</text>
  <rect x="879.1918" y="368.4848" width="189.6297" height="67.8788" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="974.0067" y="411.1515" text-anchor="middle" font-size="17.239">Envoy Proxy</text>
  <line x1="327.5421" y1="401.4545" x2="505.1043" y2="401.4545" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr2)" />
  <line x1="698.1817" y1="401.4545" x2="875.744" y2="401.4545" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr2)" />
  <line x1="232.7272" y1="368.4848" x2="232.7272" y2="116.3637" stroke="var(--info-border)" stroke-width="1.7239" stroke-dasharray="6.8956 5.1717" marker-end="url(#arr2)" />
  <line x1="603.367" y1="368.4848" x2="603.367" y2="116.3637" stroke="var(--info-border)" stroke-width="1.7239" stroke-dasharray="6.8956 5.1717" marker-end="url(#arr2)" />
  <line x1="974.0067" y1="368.4848" x2="974.0067" y2="116.3637" stroke="var(--info-border)" stroke-width="1.7239" stroke-dasharray="6.8956 5.1717" marker-end="url(#arr2)" />
  <text x="603.367" y="504.2423" text-anchor="middle" font-size="18.963" fill="var(--primary-accent)">--- mTLS encrypted traffic ---</text>
  <text x="137.9124" y="601.2121" font-size="17.239" fill="var(--info-accent)">Config push (xDS)</text>
  <text x="551.6498" y="601.2121" font-size="17.239" fill="var(--primary-accent)">Data traffic (mTLS)</text>
  <line x1="120.6734" y1="572.1211" x2="120.6734" y2="543.0303" stroke="var(--info-border)" stroke-width="1.7239" stroke-dasharray="6.8956 5.1717" />
  <line x1="534.4107" y1="572.1211" x2="534.4107" y2="543.0303" stroke="var(--primary-border)" stroke-width="2" />
</svg>
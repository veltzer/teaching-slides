<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr5" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,60 5.4857,0" fill="#333" />
    </marker>
  </defs>
  <text x="298.4615" y="178.5" text-anchor="middle" font-size="24.0046" font-weight="bold">Push Model</text>
  <rect x="40" y="269.4" width="184.6153" height="212.1" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6.0011" />
  <text x="132.3077" y="402.72" text-anchor="middle" font-size="20.3116">CI Server</text>
  <rect x="353.8462" y="269.4" width="203.077" height="212.1" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6.0011" />
  <text x="455.3846" y="402.72" text-anchor="middle" font-size="20.3116">Production</text>
  <line x1="224.6154" y1="372.42" x2="350.1538" y2="372.42" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arr5)" />
  <text x="287.3846" y="330" text-anchor="middle" font-size="18.465" fill="var(--danger-accent)">push + creds</text>
  <text x="963.077" y="178.5" text-anchor="middle" font-size="24.0046" font-weight="bold">Pull Model (GitOps)</text>
  <rect x="723.077" y="269.4" width="184.6153" height="212.1" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6.0011" />
  <text x="815.3846" y="402.72" text-anchor="middle" font-size="20.3116">Git Repo</text>
  <rect x="1036.923" y="269.4" width="203.077" height="212.1" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6.0011" />
  <text x="1138.4615" y="402.72" text-anchor="middle" font-size="20.3116">Production</text>
  <line x1="1033.2308" y1="372.42" x2="911.3846" y2="372.42" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arr5)" />
  <text x="972.3077" y="330" text-anchor="middle" font-size="18.465" fill="var(--ok-accent)">pull desired state</text>
</svg>
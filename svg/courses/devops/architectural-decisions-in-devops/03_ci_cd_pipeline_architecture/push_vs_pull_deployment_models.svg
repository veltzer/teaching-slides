<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <rect x="40" y="40" width="585" height="580" rx="6" fill="var(--surface)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="332" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-accent)">Push (classic)</text>

  <rect x="70" y="110" width="220" height="150" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">CI Server</text>
  <text x="180" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">Jenkins/Actions</text>
  <text x="180" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">holds creds</text>
  <text x="180" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">kubectl apply</text>
  <text x="180" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">terraform apply</text>

  <rect x="375" y="110" width="220" height="150" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--danger-text)">Production</text>
  <text x="485" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">cluster</text>
  <text x="485" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">passive receive</text>
  <text x="485" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">inbound API</text>
  <text x="485" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">no reconciler</text>

  <line x1="290" y1="185" x2="373" y2="185" stroke="var(--danger-border)" stroke-width="3" marker-end="url(#arrow-danger)"/>
  <text x="332" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-accent)">push + creds</text>

  <rect x="70" y="290" width="525" height="310" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="2"/>
  <text x="332" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--danger-accent)">Trade-offs</text>
  <text x="90" y="355" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">+ Simple model</text>
  <text x="90" y="385" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">+ Any target</text>
  <text x="90" y="415" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">+ Easy hotfix</text>
  <text x="90" y="455" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-accent)">− CI holds secrets</text>
  <text x="90" y="485" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-accent)">− Drift possible</text>
  <text x="90" y="515" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-accent)">− No self-heal</text>
  <text x="90" y="545" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-accent)">− Inbound to prod</text>
  <text x="90" y="580" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-accent)">− Half-applied state</text>

  <rect x="655" y="40" width="585" height="580" rx="6" fill="var(--surface)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="947" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-accent)">Pull (GitOps)</text>

  <rect x="685" y="110" width="220" height="150" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="795" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-text)">Git Repo</text>
  <text x="795" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">desired state</text>
  <text x="795" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">PR-reviewed</text>
  <text x="795" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">signed commits</text>
  <text x="795" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">source of truth</text>

  <rect x="990" y="110" width="220" height="150" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-text)">Production</text>
  <text x="1100" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">Argo/Flux</text>
  <text x="1100" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">polls repo</text>
  <text x="1100" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">reconciles</text>
  <text x="1100" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">self-heals</text>

  <line x1="988" y1="185" x2="905" y2="185" stroke="var(--ok-border)" stroke-width="3" marker-end="url(#arrow-ok)"/>
  <text x="947" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-accent)">pull desired state</text>

  <rect x="685" y="290" width="525" height="310" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="2"/>
  <text x="947" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-accent)">Trade-offs</text>
  <text x="705" y="355" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">+ No outbound creds</text>
  <text x="705" y="385" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">+ Auto self-heal</text>
  <text x="705" y="415" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">+ Git audit log</text>
  <text x="705" y="455" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">+ Outbound only</text>
  <text x="705" y="485" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-accent)">− Needs reconciler</text>
  <text x="705" y="515" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-accent)">− Poll delay</text>
  <text x="705" y="545" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-accent)">− Fits k8s best</text>
  <text x="705" y="580" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-accent)">− Hotfix via PR</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,45 5.4857,0" fill="#333" />
    </marker>
  </defs>
  <text x="201.1429" y="90" text-anchor="middle" font-size="23.7714" font-weight="bold">Linear</text>
  <rect x="18.2857" y="135" width="109.7143" height="135" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="73.1429" y="225" text-anchor="middle" font-size="18.2857">Build</text>
  <line x1="128" y1="202.5" x2="164.5714" y2="202.5" stroke="var(--text)" stroke-width="2" marker-end="url(#arr2)" />
  <rect x="164.5714" y="135" width="109.7143" height="135" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="219.4286" y="225" text-anchor="middle" font-size="18.2857">Test</text>
  <line x1="274.2857" y1="202.5" x2="310.8571" y2="202.5" stroke="var(--text)" stroke-width="2" marker-end="url(#arr2)" />
  <rect x="310.8571" y="135" width="109.7143" height="135" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="365.7143" y="225" text-anchor="middle" font-size="18.2857">Deploy</text>
  <text x="896" y="90" text-anchor="middle" font-size="23.7714" font-weight="bold">Fan-out / Fan-in</text>
  <rect x="640" y="247.5" width="109.7143" height="135" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="694.8571" y="337.5" text-anchor="middle" font-size="18.2857">Build</text>
  <line x1="749.7143" y1="283.5" x2="822.8571" y2="202.5" stroke="var(--text)" stroke-width="2" marker-end="url(#arr2)" />
  <line x1="749.7143" y1="315" x2="822.8571" y2="315" stroke="var(--text)" stroke-width="2" marker-end="url(#arr2)" />
  <line x1="749.7143" y1="346.5" x2="822.8571" y2="427.5" stroke="var(--text)" stroke-width="2" marker-end="url(#arr2)" />
  <rect x="822.8571" y="135" width="146.2857" height="112.5" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="896" y="211.5" text-anchor="middle" font-size="18.2857">Unit Tests</text>
  <rect x="822.8571" y="261" width="146.2857" height="112.5" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="896" y="337.5" text-anchor="middle" font-size="18.2857">Integration</text>
  <rect x="822.8571" y="387" width="146.2857" height="112.5" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="896" y="463.5" text-anchor="middle" font-size="18.2857">Security Scan</text>
  <line x1="969.1429" y1="193.5" x2="1042.2857" y2="283.5" stroke="var(--text)" stroke-width="2" marker-end="url(#arr2)" />
  <line x1="969.1429" y1="319.5" x2="1042.2857" y2="315" stroke="var(--text)" stroke-width="2" marker-end="url(#arr2)" />
  <line x1="969.1429" y1="445.5" x2="1042.2857" y2="346.5" stroke="var(--text)" stroke-width="2" marker-end="url(#arr2)" />
  <rect x="1042.2857" y="247.5" width="109.7143" height="135" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1097.1429" y="337.5" text-anchor="middle" font-size="18.2857">Deploy</text>
</svg>
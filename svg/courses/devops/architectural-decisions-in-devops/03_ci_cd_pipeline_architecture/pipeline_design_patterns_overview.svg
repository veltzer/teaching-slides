<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,45 5.4857,0" fill="#333" />
    </marker>
  </defs>
  <text x="233.5484" y="40" text-anchor="middle" font-size="29.1059" font-weight="bold">Linear</text>
  <rect x="40" y="103.7363" width="116.129" height="191.2088" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="98.0646" y="231.2088" text-anchor="middle" font-size="22.3891">Build</text>
  <line x1="156.129" y1="199.3407" x2="194.8387" y2="199.3407" stroke="var(--text)" stroke-width="2" marker-end="url(#arr2)" />
  <rect x="194.8387" y="103.7363" width="116.129" height="191.2088" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="252.9033" y="231.2088" text-anchor="middle" font-size="22.3891">Test</text>
  <line x1="310.9677" y1="199.3407" x2="349.6774" y2="199.3407" stroke="var(--text)" stroke-width="2" marker-end="url(#arr2)" />
  <rect x="349.6774" y="103.7363" width="116.129" height="191.2088" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="407.742" y="231.2088" text-anchor="middle" font-size="22.3891">Deploy</text>
  <text x="969.0323" y="40" text-anchor="middle" font-size="29.1059" font-weight="bold">Fan-out / Fan-in</text>
  <rect x="698.0645" y="263.0769" width="116.129" height="191.2088" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="756.129" y="390.5495" text-anchor="middle" font-size="22.3891">Build</text>
  <line x1="814.1936" y1="314.0659" x2="891.6129" y2="199.3407" stroke="var(--text)" stroke-width="2" marker-end="url(#arr2)" />
  <line x1="814.1936" y1="358.6813" x2="891.6129" y2="358.6813" stroke="var(--text)" stroke-width="2" marker-end="url(#arr2)" />
  <line x1="814.1936" y1="403.2967" x2="891.6129" y2="518.022" stroke="var(--text)" stroke-width="2" marker-end="url(#arr2)" />
  <rect x="891.6129" y="103.7363" width="154.8387" height="159.3407" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="969.0323" y="212.0879" text-anchor="middle" font-size="22.3891">Unit Tests</text>
  <rect x="891.6129" y="282.1978" width="154.8387" height="159.3407" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="969.0323" y="390.5495" text-anchor="middle" font-size="22.3891">Integration</text>
  <rect x="891.6129" y="460.6593" width="154.8387" height="159.3407" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="969.0323" y="569.011" text-anchor="middle" font-size="22.3891">Security Scan</text>
  <line x1="1046.4517" y1="186.5934" x2="1123.871" y2="314.0659" stroke="var(--text)" stroke-width="2" marker-end="url(#arr2)" />
  <line x1="1046.4517" y1="365.0549" x2="1123.871" y2="358.6813" stroke="var(--text)" stroke-width="2" marker-end="url(#arr2)" />
  <line x1="1046.4517" y1="543.5165" x2="1123.871" y2="403.2967" stroke="var(--text)" stroke-width="2" marker-end="url(#arr2)" />
  <rect x="1123.871" y="263.0769" width="116.129" height="191.2088" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1181.9355" y="390.5495" text-anchor="middle" font-size="22.3891">Deploy</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="233.5484" y="40" text-anchor="middle" font-size="29.1059" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Linear</text>
  <rect x="40" y="103.7363" width="116.129" height="191.2088" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="98.0646" y="231.2088" text-anchor="middle" font-size="22.3891" font-family="Arial, sans-serif" fill="var(--primary-text)">Build</text>
  <line x1="156.129" y1="199.3407" x2="194.8387" y2="199.3407" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="194.8387" y="103.7363" width="116.129" height="191.2088" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="252.9033" y="231.2088" text-anchor="middle" font-size="22.3891" font-family="Arial, sans-serif" fill="var(--primary-text)">Test</text>
  <line x1="310.9677" y1="199.3407" x2="349.6774" y2="199.3407" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="349.6774" y="103.7363" width="116.129" height="191.2088" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="407.742" y="231.2088" text-anchor="middle" font-size="22.3891" font-family="Arial, sans-serif" fill="var(--primary-text)">Deploy</text>
  <text x="969.0323" y="40" text-anchor="middle" font-size="29.1059" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Fan-out / Fan-in</text>
  <rect x="698.0645" y="263.0769" width="116.129" height="191.2088" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="756.129" y="390.5495" text-anchor="middle" font-size="22.3891" font-family="Arial, sans-serif" fill="var(--ok-text)">Build</text>
  <line x1="814.1936" y1="314.0659" x2="891.6129" y2="199.3407" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="814.1936" y1="358.6813" x2="891.6129" y2="358.6813" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="814.1936" y1="403.2967" x2="891.6129" y2="518.022" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="891.6129" y="103.7363" width="154.8387" height="159.3407" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="969.0323" y="212.0879" text-anchor="middle" font-size="22.3891" font-family="Arial, sans-serif" fill="var(--warn-text)">Unit Tests</text>
  <rect x="891.6129" y="282.1978" width="154.8387" height="159.3407" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="969.0323" y="390.5495" text-anchor="middle" font-size="22.3891" font-family="Arial, sans-serif" fill="var(--warn-text)">Integration</text>
  <rect x="891.6129" y="460.6593" width="154.8387" height="159.3407" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="969.0323" y="569.011" text-anchor="middle" font-size="22.3891" font-family="Arial, sans-serif" fill="var(--warn-text)">Security Scan</text>
  <line x1="1046.4517" y1="186.5934" x2="1123.871" y2="314.0659" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1046.4517" y1="365.0549" x2="1123.871" y2="358.6813" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1046.4517" y1="543.5165" x2="1123.871" y2="403.2967" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1123.871" y="263.0769" width="116.129" height="191.2088" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1181.9355" y="390.5495" text-anchor="middle" font-size="22.3891" font-family="Arial, sans-serif" fill="var(--ok-text)">Deploy</text>
</svg>

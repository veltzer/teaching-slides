<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr4" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,28.8 5.4857,0" fill="#333" />
    </marker>
  </defs>
  <rect x="22.4561" y="159.1579" width="112.2807" height="70.7368" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="78.5965" y="203.3684" text-anchor="middle" font-size="13.4737">Developer</text>
  <rect x="202.1053" y="159.1579" width="134.7369" height="70.7368" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="269.4737" y="203.3684" text-anchor="middle" font-size="13.4737">Git Repository</text>
  <rect x="415.4386" y="159.1579" width="145.9649" height="70.7368" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="488.4211" y="203.3684" text-anchor="middle" font-size="13.4737">GitOps Operator</text>
  <rect x="640" y="123.7895" width="123.5088" height="141.4737" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="701.7544" y="176.8421" text-anchor="middle" font-size="13.4737">Kubernetes</text>
  <text x="701.7544" y="208.6737" text-anchor="middle" font-size="13.4737">Cluster</text>
  <text x="701.7544" y="244.0421" text-anchor="middle" font-size="11.2281" fill="var(--text-muted)">(actual state)</text>
  <line x1="134.7369" y1="194.5263" x2="199.8596" y2="194.5263" stroke="var(--text)" stroke-width="2" marker-end="url(#arr4)" />
  <text x="168.421" y="180.3789" text-anchor="middle" font-size="11.2281" fill="var(--text-muted)">push</text>
  <line x1="336.8421" y1="185.6842" x2="413.193" y2="185.6842" stroke="var(--text)" stroke-width="2" marker-end="url(#arr4)" />
  <text x="375.0176" y="173.3053" text-anchor="middle" font-size="11.2281" fill="var(--text-muted)">pull</text>
  <line x1="561.4035" y1="194.5263" x2="637.7544" y2="194.5263" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arr4)" />
  <text x="599.5789" y="180.3789" text-anchor="middle" font-size="11.2281" fill="var(--ok-accent)">reconcile</text>
  <path d="M 640 265.2632 Q 488.4211 371.3684 415.4386 229.8947" stroke="var(--info-border)" stroke-width="1.6842" fill="none" stroke-dasharray="5.6141 4.4912" marker-end="url(#arr4)" />
  <text x="516.4913" y="344.8421" text-anchor="middle" font-size="11.2281" fill="var(--info-accent)">observe actual state</text>
</svg>
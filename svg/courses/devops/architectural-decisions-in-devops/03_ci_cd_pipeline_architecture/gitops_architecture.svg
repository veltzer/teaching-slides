<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <marker id="arr4" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,28.8 5.4857,0" fill="#333" />
    </marker>
  </defs>
  <rect x="40" y="122.8572" width="181.8183" height="165.7143" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="130.9092" y="226.4286" text-anchor="middle" font-size="26.2429">Developer</text>
  <rect x="330.9091" y="122.8572" width="218.1819" height="165.7143" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="440" y="226.4286" text-anchor="middle" font-size="26.2429">Git Repository</text>
  <rect x="676.3637" y="122.8572" width="236.3635" height="165.7143" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="794.5456" y="226.4286" text-anchor="middle" font-size="26.2429">GitOps Operator</text>
  <rect x="1039.9999" y="40" width="200.0001" height="331.4287" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1139.9998" y="164.2856" text-anchor="middle" font-size="26.2429">Kubernetes</text>
  <text x="1139.9998" y="238.8571" text-anchor="middle" font-size="26.2429">Cluster</text>
  <text x="1139.9998" y="321.7143" text-anchor="middle" font-size="21.869" fill="var(--text-muted)">(actual state)</text>
  <line x1="221.8183" y1="205.7143" x2="327.2727" y2="205.7143" stroke="var(--text)" stroke-width="0.7978" marker-end="url(#arr4)" />
  <text x="276.3635" y="172.5714" text-anchor="middle" font-size="21.869" fill="var(--text-muted)">push</text>
  <line x1="549.0909" y1="184.9999" x2="672.7272" y2="184.9999" stroke="var(--text)" stroke-width="0.7978" marker-end="url(#arr4)" />
  <text x="610.9092" y="156.0001" text-anchor="middle" font-size="21.869" fill="var(--text-muted)">pull</text>
  <line x1="912.7272" y1="205.7143" x2="1036.3636" y2="205.7143" stroke="var(--ok-border)" stroke-width="0.7978" marker-end="url(#arr4)" />
  <text x="974.5451" y="172.5714" text-anchor="middle" font-size="21.869" fill="var(--ok-accent)">reconcile</text>
  <path d="M 1039.9999 371.4287 Q 794.5456 620 676.3637 288.5715" stroke="var(--info-border)" stroke-width="0.6718" fill="none" stroke-dasharray="2.2394 1.7915" marker-end="url(#arr4)" />
  <text x="840.0002" y="557.8573" text-anchor="middle" font-size="21.869" fill="var(--info-accent)">observe actual state</text>
</svg>
  <rect x="222.0096" y="124.0192" width="128.6125" height="67.5215" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.2632" rx="5.7273" />
  <text x="286.3158" y="166.2201" text-anchor="middle" font-size="12.8613">Git Repository</text>
  <rect x="425.646" y="124.0192" width="139.3301" height="67.5215" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.2632" rx="5.7273" />
  <text x="495.3111" y="166.2201" text-anchor="middle" font-size="12.8613">GitOps Operator</text>
  <rect x="640" y="90.2584" width="117.8948" height="135.0431" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="1.2632" rx="5.7273" />
  <text x="698.9474" y="140.8995" text-anchor="middle" font-size="12.8613">Kubernetes</text>
  <text x="698.9474" y="171.2842" text-anchor="middle" font-size="12.8613">Cluster</text>
  <text x="698.9474" y="205.045" text-anchor="middle" font-size="10.7177" fill="var(--text-muted)">(actual state)</text>
  <line x1="157.7034" y1="157.7799" x2="219.866" y2="157.7799" stroke="var(--text)" stroke-width="1.2632" marker-end="url(#arr4)" />
  <text x="189.8564" y="144.2756" text-anchor="middle" font-size="10.7177" fill="var(--text-muted)">push</text>
  <line x1="350.622" y1="149.3397" x2="423.5024" y2="149.3397" stroke="var(--text)" stroke-width="1.2632" marker-end="url(#arr4)" />
  <text x="387.0623" y="137.5235" text-anchor="middle" font-size="10.7177" fill="var(--text-muted)">pull</text>
  <line x1="564.9761" y1="157.7799" x2="637.8565" y2="157.7799" stroke="var(--ok-border)" stroke-width="1.2632" marker-end="url(#arr4)" />
  <text x="601.4162" y="144.2756" text-anchor="middle" font-size="10.7177" fill="var(--ok-accent)">reconcile</text>
  <path d="M 640 225.3015 Q 495.3111 326.5837 425.646 191.5407" stroke="var(--info-border)" stroke-width="1.0637" fill="none" stroke-dasharray="3.5457 2.8365" marker-end="url(#arr4)" />
  <text x="522.1054" y="301.2632" text-anchor="middle" font-size="10.7177" fill="var(--info-accent)">observe actual state</text>

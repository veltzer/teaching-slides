<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr4" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,28.8 5.4857,0" fill="#333" />
    </marker>
  </defs>
  <rect x="80" y="196.3637" width="169.697" height="106.909" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="9.0682" />
  <text x="164.8486" y="263.1818" text-anchor="middle" font-size="20.3637">Developer</text>
  <rect x="351.5152" y="196.3637" width="203.6364" height="106.909" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="9.0682" />
  <text x="453.3334" y="263.1818" text-anchor="middle" font-size="20.3637">Git Repository</text>
  <rect x="673.9394" y="196.3637" width="220.606" height="106.909" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="9.0682" />
  <text x="784.2425" y="263.1818" text-anchor="middle" font-size="20.3637">GitOps Operator</text>
  <rect x="1013.3333" y="142.9091" width="186.6667" height="213.8182" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="9.0682" />
  <text x="1106.6667" y="223.0909" text-anchor="middle" font-size="20.3637">Kubernetes</text>
  <text x="1106.6667" y="271.2" text-anchor="middle" font-size="20.3637">Cluster</text>
  <text x="1106.6667" y="324.6545" text-anchor="middle" font-size="16.9697" fill="var(--text-muted)">(actual state)</text>
  <line x1="249.6971" y1="249.8182" x2="348.1212" y2="249.8182" stroke="var(--text)" stroke-width="2" marker-end="url(#arr4)" />
  <text x="300.606" y="228.4363" text-anchor="middle" font-size="16.9697" fill="var(--text-muted)">push</text>
  <line x1="555.1515" y1="236.4545" x2="670.5455" y2="236.4545" stroke="var(--text)" stroke-width="2" marker-end="url(#arr4)" />
  <text x="612.8486" y="217.7455" text-anchor="middle" font-size="16.9697" fill="var(--text-muted)">pull</text>
  <line x1="894.5454" y1="249.8182" x2="1009.9394" y2="249.8182" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arr4)" />
  <text x="952.2423" y="228.4363" text-anchor="middle" font-size="16.9697" fill="var(--ok-accent)">reconcile</text>
  <path d="M 1013.3333 356.7273 Q 784.2425 517.0909 673.9394 303.2727" stroke="var(--info-border)" stroke-width="1.6842" fill="none" stroke-dasharray="5.6141 4.4912" marker-end="url(#arr4)" />
  <text x="826.6668" y="477" text-anchor="middle" font-size="16.9697" fill="var(--info-accent)">observe actual state</text>
</svg>
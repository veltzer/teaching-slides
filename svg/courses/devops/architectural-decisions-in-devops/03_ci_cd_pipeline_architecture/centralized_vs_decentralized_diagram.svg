<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="283.4783" y="40" text-anchor="middle" font-size="26.7824" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Centralized</text>
  <rect x="179.1305" y="102.1429" width="208.6957" height="165.7143" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="283.4783" y="205.7143" text-anchor="middle" font-size="22.9564" font-family="Arial, sans-serif" fill="var(--primary-text)">Platform Team</text>
  <line x1="283.4783" y1="267.8571" x2="126.9565" y2="475" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="283.4783" y1="267.8571" x2="283.4783" y2="475" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="283.4783" y1="267.8571" x2="440.0001" y2="475" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="475" width="173.913" height="145" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="126.9565" y="566.1429" text-anchor="middle" font-size="21.0433" font-family="Arial, sans-serif" fill="var(--ok-text)">Team A</text>
  <rect x="231.3044" y="475" width="173.913" height="145" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="318.2609" y="566.1429" text-anchor="middle" font-size="21.0433" font-family="Arial, sans-serif" fill="var(--ok-text)">Team B</text>
  <rect x="422.6088" y="475" width="173.913" height="145" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="509.5652" y="566.1429" text-anchor="middle" font-size="21.0433" font-family="Arial, sans-serif" fill="var(--ok-text)">Team C</text>
  <text x="909.5653" y="40" text-anchor="middle" font-size="26.7824" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Decentralized</text>
  <rect x="683.4784" y="143.5714" width="173.913" height="207.1429" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="770.4348" y="234.7143" text-anchor="middle" font-size="21.0433" font-family="Arial, sans-serif" fill="var(--warn-text)">Team A</text>
  <text x="770.4348" y="301" text-anchor="middle" font-size="19.1303" fill="var(--text-muted)" font-family="Arial, sans-serif">own pipeline</text>
  <rect x="874.7827" y="143.5714" width="173.913" height="207.1429" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="961.7392" y="234.7143" text-anchor="middle" font-size="21.0433" font-family="Arial, sans-serif" fill="var(--warn-text)">Team B</text>
  <text x="961.7392" y="301" text-anchor="middle" font-size="19.1303" fill="var(--text-muted)" font-family="Arial, sans-serif">own pipeline</text>
  <rect x="1066.087" y="143.5714" width="173.913" height="207.1429" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1153.0436" y="234.7143" text-anchor="middle" font-size="21.0433" font-family="Arial, sans-serif" fill="var(--warn-text)">Team C</text>
  <text x="1153.0436" y="301" text-anchor="middle" font-size="19.1303" fill="var(--text-muted)" font-family="Arial, sans-serif">own pipeline</text>
</svg>

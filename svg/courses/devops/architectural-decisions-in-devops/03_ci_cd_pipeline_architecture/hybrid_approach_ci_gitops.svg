<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr7" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,40 5.4857,0" fill="#333" />
    </marker>
  </defs>
  <rect x="40" y="241.8529" width="179.1044" height="156.7059" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="5.9998" />
  <text x="129.5523" y="339.7941" text-anchor="middle" font-size="19.7008">Developer</text>
  <rect x="290.7463" y="241.8529" width="179.1044" height="156.7059" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="5.9998" />
  <text x="380.2985" y="339.7941" text-anchor="middle" font-size="19.7008">CI Pipeline</text>
  <rect x="559.403" y="163.5" width="197.015" height="137.1177" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="5.9998" />
  <text x="657.9105" y="249.6882" text-anchor="middle" font-size="17.9098">App Repo</text>
  <rect x="559.403" y="359.3823" width="197.015" height="137.1177" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="5.9998" />
  <text x="657.9105" y="445.5706" text-anchor="middle" font-size="17.9098">Config Repo</text>
  <rect x="845.9702" y="241.8529" width="179.1044" height="156.7059" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="5.9998" />
  <text x="935.5223" y="339.7941" text-anchor="middle" font-size="19.7008">Argo CD</text>
  <rect x="1096.7164" y="241.8529" width="143.2836" height="156.7059" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="5.9998" />
  <text x="1168.3582" y="339.7941" text-anchor="middle" font-size="19.7008">Cluster</text>
  <line x1="219.1045" y1="320.2059" x2="287.1642" y2="320.2059" stroke="var(--text)" stroke-width="2" marker-end="url(#arr7)" />
  <line x1="469.8508" y1="281.0294" x2="555.8209" y2="234.0177" stroke="var(--text)" stroke-width="2" marker-end="url(#arr7)" />
  <line x1="469.8508" y1="359.3823" x2="555.8209" y2="425.9823" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr7)" />
  <text x="487.7612" y="457.3235" font-size="17.9098" fill="var(--primary-accent)">update image tag</text>
  <line x1="756.4179" y1="425.9823" x2="842.388" y2="339.7941" stroke="var(--text)" stroke-width="2" marker-end="url(#arr7)" />
  <line x1="1025.0746" y1="320.2059" x2="1093.1343" y2="320.2059" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arr7)" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
  </defs>
<text x="640" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--text)">Hybrid CI + GitOps Pipeline</text>
<rect x="40" y="120" width="200" height="200" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
<text x="140" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Developer</text>
<text x="140" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">push code</text>
<rect x="290" y="120" width="200" height="200" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
<text x="390" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">CI Pipeline</text>
<text x="390" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">build, test, image</text>
<rect x="540" y="120" width="200" height="200" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
<text x="640" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">App Repo</text>
<text x="640" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">image tag commit</text>
<rect x="790" y="120" width="200" height="200" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
<text x="890" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Argo CD</text>
<text x="890" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">detects change</text>
<rect x="1040" y="120" width="200" height="200" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
<text x="1140" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Cluster</text>
<text x="1140" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">synced state</text>
<line x1="240" y1="220" x2="290" y2="220" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="490" y1="220" x2="540" y2="220" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="740" y1="220" x2="790" y2="220" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="990" y1="220" x2="1040" y2="220" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="360" width="590" height="260" rx="6" fill="var(--surface)" stroke="var(--primary-border)" stroke-width="2"/>
<text x="335" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-accent)">CI side (push)</text>
<text x="335" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">Runs on every commit</text>
<text x="335" y="477" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">Builds artifacts and images</text>
<text x="335" y="519" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">Writes new tag to config repo</text>
<text x="335" y="561" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">Fails fast on tests and security</text>
<rect x="650" y="360" width="590" height="260" rx="6" fill="var(--surface)" stroke="var(--ok-border)" stroke-width="2"/>
<text x="945" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-accent)">GitOps side (pull)</text>
<text x="945" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">Argo CD watches config repo</text>
<text x="945" y="477" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">Reconciles cluster to desired state</text>
<text x="945" y="519" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">Rollbacks are a git revert</text>
<text x="945" y="561" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">Auditable change history</text>
</svg>

  <text x="500.7143" y="206.4348" text-anchor="middle" font-size="24.0084" fill="var(--text-muted)">compare</text>
  <rect x="725.7145" y="40" width="235.7143" height="226.9565" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="843.5714" y="130.7828" text-anchor="middle" font-size="26.4091">Actual State</text>
  <text x="843.5714" y="206.4348" text-anchor="middle" font-size="24.0084" fill="var(--text-muted)">(cluster)</text>

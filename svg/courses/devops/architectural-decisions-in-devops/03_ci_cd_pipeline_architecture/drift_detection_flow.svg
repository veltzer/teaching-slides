  <line x1="721.4287" y1="150.9565" x2="622.8572" y2="150.9565" stroke="var(--text)" stroke-width="0.677" marker-end="url(#arr6)" />
  <path d="M 500.7143 266.9565 Q 500.7143 544.3478 1132.8574 544.3478 Q 1132.8574 266.9565 1132.8574 266.9565" stroke="var(--danger-border)" stroke-width="0.6131" fill="none" stroke-dasharray="2.0439 1.6351" marker-end="url(#arr6)" />
  <text x="811.4287" y="620" text-anchor="middle" font-size="24.0084" fill="var(--danger-accent)">reconcile to desired state</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="257.1429" height="210.9091" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="168.5714" y="171.8182" text-anchor="middle" font-size="31.0509" font-family="Arial, sans-serif" fill="var(--primary-text)">CI Runner A</text>
  <rect x="40" y="409.0909" width="257.1429" height="210.9091" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="168.5714" y="540.9091" text-anchor="middle" font-size="31.0509" font-family="Arial, sans-serif" fill="var(--primary-text)">CI Runner B</text>
  <rect x="511.4286" y="145.4545" width="300.0001" height="316.3636" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="661.4285" y="293.0909" text-anchor="middle" font-size="33.6384" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Remote Cache</text>
  <text x="661.4285" y="398.5455" text-anchor="middle" font-size="25.8757" fill="var(--text-muted)" font-family="Arial, sans-serif">(S3, GCS, Artifactory)</text>
  <rect x="982.8571" y="40" width="257.1429" height="210.9091" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1111.4286" y="171.8182" text-anchor="middle" font-size="31.0509" font-family="Arial, sans-serif" fill="var(--primary-text)">CI Runner C</text>
  <rect x="982.8571" y="409.0909" width="257.1429" height="210.9091" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1111.4286" y="540.9091" text-anchor="middle" font-size="31.0509" font-family="Arial, sans-serif" fill="var(--primary-text)">CI Runner D</text>
  <line x1="297.1429" y1="145.4545" x2="507.1428" y2="250.9091" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="297.1429" y1="514.5455" x2="507.1428" y2="356.3636" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="815.7143" y1="250.9091" x2="978.5715" y2="145.4545" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="815.7143" y1="356.3636" x2="978.5715" y2="514.5455" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="361.4286" y="103.2727" font-size="25.8757" fill="var(--primary-accent)" font-family="Arial, sans-serif">push</text>
  <text x="361.4286" y="540.9091" font-size="25.8757" fill="var(--primary-accent)" font-family="Arial, sans-serif">push</text>
  <text x="886.4286" y="145.4545" font-size="25.8757" fill="var(--ok-accent)" font-family="Arial, sans-serif">pull</text>
  <text x="886.4286" y="514.5455" font-size="25.8757" fill="var(--ok-accent)" font-family="Arial, sans-serif">pull</text>
</svg>

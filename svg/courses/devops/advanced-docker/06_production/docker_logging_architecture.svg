  <ns0:text x="748.4444" y="544" font-size="21.3333" font-weight="bold" fill="#1565c0" text-anchor="middle">fluentd / splunk</ns0:text>
  <ns0:text x="748.4444" y="583.1111" font-size="17.7778" fill="#555555" text-anchor="middle">(remote)</ns0:text>
  <ns0:line x1="435.5556" y1="451.5556" x2="141.3333" y2="487.1111" stroke="#555555" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:line x1="493.3333" y1="451.5556" x2="435.5556" y2="487.1111" stroke="#555555" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:line x1="551.1111" y1="451.5556" x2="748.4444" y2="487.1111" stroke="#555555" stroke-width="1.7778" marker-end="url(#arrow)" />
</ns0:svg>
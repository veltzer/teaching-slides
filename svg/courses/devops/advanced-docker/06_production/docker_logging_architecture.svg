  <ns0:line x1="568.8889" y1="275.5556" x2="568.8889" y2="318.2222" stroke="#555555" stroke-width="2.2222" marker-end="url(#arrow)" />
  <ns0:line x1="568.8889" y1="168.8889" x2="568.8889" y2="275.5556" stroke="#555555" stroke-width="2.2222" />
  <ns0:rect x="17.7778" y="487.1111" width="247.1111" height="124.4444" rx="7.1111" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="141.3333" y="544" font-size="21.3333" font-weight="bold" fill="#1565c0" text-anchor="middle">json-file</ns0:text>
  <ns0:text x="141.3333" y="583.1111" font-size="17.7778" fill="#555555" text-anchor="middle">(default)</ns0:text>
  <ns0:rect x="293.3333" y="487.1111" width="284.4444" height="124.4444" rx="7.1111" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="435.5556" y="544" font-size="21.3333" font-weight="bold" fill="#1565c0" text-anchor="middle">syslog / journald</ns0:text>
  <ns0:text x="435.5556" y="583.1111" font-size="17.7778" fill="#555555" text-anchor="middle">(local)</ns0:text>

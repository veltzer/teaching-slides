<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="782.077478" height="246.808632" rx="7.165622" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="66.883913" y="91.124611" font-size="24.908418" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Container</text>
  <rect x="79.103874" y="110.516689" width="261.507157" height="141.033488" rx="7.165622" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="209.857452" y="189.84802" font-size="24.908418" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Process</text>
  <line x1="340.6109" y1="181.033488" x2="797.637557" y2="181.033488" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="504.358503" y="166.930128" font-size="22.832776" fill="var(--text)" font-family="Arial, sans-serif">stdout / stderr</text>
  <rect x="509.246487" y="329.118602" width="417.922652" height="132.218847" rx="7.165622" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="718.207813" y="408.449932" font-size="26.984179" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">Logging Driver</text>
  <line x1="797.637557" y1="286.808632" x2="797.637557" y2="329.118602" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="797.637557" y1="181.033488" x2="797.637557" y2="286.808632" stroke="var(--text-muted)" stroke-width="2"/>
  <rect x="40" y="496.595794" width="339.714905" height="123.404206" rx="7.165622" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="209.857452" y="553.009233" font-size="24.908418" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">json-file</text>
  <text x="209.857452" y="591.79339" font-size="20.757134" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">(default)</text>
  <rect x="418.818778" y="496.595794" width="391.038609" height="123.404206" rx="7.165622" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="614.338148" y="553.009233" font-size="24.908418" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">syslog / journald</text>
  <text x="614.338148" y="591.79339" font-size="20.757134" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">(local)</text>
  <rect x="848.961391" y="496.595794" width="391.038609" height="123.404206" rx="7.165622" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1044.48063" y="553.009233" font-size="24.908418" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">fluentd / splunk</text>
  <text x="1044.48063" y="591.79339" font-size="20.757134" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">(remote)</text>
  <line x1="614.338148" y1="461.337558" x2="209.857452" y2="496.595794" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <line x1="693.767892" y1="461.337558" x2="614.338148" y2="496.595794" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <line x1="773.197636" y1="461.337558" x2="1044.48063" y2="496.595794" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Container box -->
  <rect x="20" y="30" width="640" height="280" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="42" y="88" font-size="24" font-weight="bold" fill="#1565c0">Container</text>
  <!-- Process box inside container -->
  <rect x="52" y="110" width="214" height="160" rx="8" fill="url(#grad-surface)" stroke="#555555" stroke-width="2" filter="url(#shadow)"/>
  <text x="159" y="200" font-size="24" fill="#333333" text-anchor="middle">Process</text>
  <!-- stdout arrow -->
  <line x1="266" y1="190" x2="640" y2="190" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="400" y="174" font-size="22" fill="#333333">stdout / stderr</text>
  <!-- Logging Driver box -->
  <rect x="404" y="358" width="342" height="150" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="575" y="448" font-size="26" font-weight="bold" fill="#1565c0" text-anchor="middle">Logging Driver</text>
  <!-- vertical arrow from stdout junction down to logging driver -->
  <line x1="640" y1="310" x2="640" y2="358" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="640" y1="190" x2="640" y2="310" stroke="#555555" stroke-width="2.5"/>
  <!-- Destination boxes -->
  <rect x="20" y="548" width="278" height="140" rx="8" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="159" y="612" font-size="24" font-weight="bold" fill="#1565c0" text-anchor="middle">json-file</text>
  <text x="159" y="656" font-size="20" fill="#555555" text-anchor="middle">(default)</text>
  <rect x="330" y="548" width="320" height="140" rx="8" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="612" font-size="24" font-weight="bold" fill="#1565c0" text-anchor="middle">syslog / journald</text>
  <text x="490" y="656" font-size="20" fill="#555555" text-anchor="middle">(local)</text>
  <rect x="682" y="548" width="320" height="140" rx="8" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="842" y="612" font-size="24" font-weight="bold" fill="#1565c0" text-anchor="middle">fluentd / splunk</text>
  <text x="842" y="656" font-size="20" fill="#555555" text-anchor="middle">(remote)</text>
  <!-- arrows from logging driver to destinations -->
  <line x1="490" y1="508" x2="159" y2="548" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="555" y1="508" x2="490" y2="548" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="620" y1="508" x2="842" y2="548" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="17.7778" y="17.7778" width="515.5556" height="604.4444" rx="7.1111" fill="#ffebee" stroke="#c62828" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="275.5556" y="58.6667" font-size="24.8889" font-weight="bold" fill="#c62828" text-anchor="middle">AVOID</ns0:text>
  <ns0:text x="44.4444" y="99.5556" font-size="19.5556" fill="#333333">Running as root inside containers</ns0:text>
  <ns0:text x="44.4444" y="135.1111" font-size="19.5556" fill="#333333">Using :latest tag in production</ns0:text>
  <ns0:text x="44.4444" y="170.6667" font-size="19.5556" fill="#333333">Storing data in writable layer</ns0:text>
  <ns0:text x="44.4444" y="206.2222" font-size="19.5556" fill="#333333">No resource limits</ns0:text>
  <ns0:text x="44.4444" y="241.7778" font-size="19.5556" fill="#333333">No health checks</ns0:text>
  <ns0:text x="44.4444" y="277.3333" font-size="19.5556" fill="#333333">No log rotation</ns0:text>
  <ns0:text x="44.4444" y="312.8889" font-size="19.5556" fill="#333333">Mounting Docker socket in apps</ns0:text>
  <ns0:text x="44.4444" y="348.4444" font-size="19.5556" fill="#333333">Using --privileged</ns0:text>
  <ns0:text x="44.4444" y="384" font-size="19.5556" fill="#333333">Hardcoding config in images</ns0:text>
  <ns0:text x="44.4444" y="419.5556" font-size="19.5556" fill="#333333">No backup strategy for volumes</ns0:text>
  <ns0:text x="44.4444" y="455.1111" font-size="19.5556" fill="#333333">No monitoring or alerting</ns0:text>
  <ns0:rect x="604.4444" y="17.7778" width="515.5556" height="604.4444" rx="7.1111" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="862.2222" y="58.6667" font-size="24.8889" font-weight="bold" fill="#1565c0" text-anchor="middle">DO</ns0:text>
  <ns0:text x="631.1111" y="99.5556" font-size="19.5556" fill="#333333">Pin image versions with digests</ns0:text>
  <ns0:text x="631.1111" y="135.1111" font-size="19.5556" fill="#333333">Use named volumes for persistent data</ns0:text>
  <ns0:text x="631.1111" y="170.6667" font-size="19.5556" fill="#333333">Set memory and CPU limits</ns0:text>
  <ns0:text x="631.1111" y="206.2222" font-size="19.5556" fill="#333333">Implement health checks</ns0:text>
  <ns0:text x="631.1111" y="241.7778" font-size="19.5556" fill="#333333">Configure centralized logging</ns0:text>
  <ns0:text x="631.1111" y="277.3333" font-size="19.5556" fill="#333333">Run as non-root user</ns0:text>
  <ns0:text x="631.1111" y="312.8889" font-size="19.5556" fill="#333333">Use read-only root filesystem</ns0:text>
  <ns0:text x="631.1111" y="348.4444" font-size="19.5556" fill="#333333">Monitor with Prometheus/Grafana</ns0:text>
</ns0:svg>
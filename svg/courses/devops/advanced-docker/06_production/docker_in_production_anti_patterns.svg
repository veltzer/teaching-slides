<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="561.290371" height="580" rx="6.272739" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="320.645185" y="79.235347" font-size="25.438885" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle" font-family="Arial, sans-serif">AVOID</text>
  <text x="69.032261" y="118.470693" font-size="19.987665" fill="var(--text)" font-family="Arial, sans-serif">Running as root inside containers</text>
  <text x="69.032261" y="152.588216" font-size="19.987665" fill="var(--text)" font-family="Arial, sans-serif">Using :latest tag in production</text>
  <text x="69.032261" y="186.70595" font-size="19.987665" fill="var(--text)" font-family="Arial, sans-serif">Storing data in writable layer</text>
  <text x="69.032261" y="220.823579" font-size="19.987665" fill="var(--text)" font-family="Arial, sans-serif">No resource limits</text>
  <text x="69.032261" y="254.941207" font-size="19.987665" fill="var(--text)" font-family="Arial, sans-serif">No health checks</text>
  <text x="69.032261" y="289.058835" font-size="19.987665" fill="var(--text)" font-family="Arial, sans-serif">No log rotation</text>
  <text x="69.032261" y="323.17657" font-size="19.987665" fill="var(--text)" font-family="Arial, sans-serif">Mounting Docker socket in apps</text>
  <text x="69.032261" y="357.294092" font-size="19.987665" fill="var(--text)" font-family="Arial, sans-serif">Using --privileged</text>
  <text x="69.032261" y="391.411826" font-size="19.987665" fill="var(--text)" font-family="Arial, sans-serif">Hardcoding config in images</text>
  <text x="69.032261" y="425.529561" font-size="19.987665" fill="var(--text)" font-family="Arial, sans-serif">No backup strategy for volumes</text>
  <text x="69.032261" y="459.647083" font-size="19.987665" fill="var(--text)" font-family="Arial, sans-serif">No monitoring or alerting</text>
  <rect x="678.709629" y="40" width="561.290371" height="580" rx="6.272739" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="959.354918" y="79.235347" font-size="25.438885" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">DO</text>
  <text x="707.741993" y="118.470693" font-size="19.987665" fill="var(--text)" font-family="Arial, sans-serif">Pin image versions with digests</text>
  <text x="707.741993" y="152.588216" font-size="19.987665" fill="var(--text)" font-family="Arial, sans-serif">Use named volumes for persistent data</text>
  <text x="707.741993" y="186.70595" font-size="19.987665" fill="var(--text)" font-family="Arial, sans-serif">Set memory and CPU limits</text>
  <text x="707.741993" y="220.823579" font-size="19.987665" fill="var(--text)" font-family="Arial, sans-serif">Implement health checks</text>
  <text x="707.741993" y="254.941207" font-size="19.987665" fill="var(--text)" font-family="Arial, sans-serif">Configure centralized logging</text>
  <text x="707.741993" y="289.058835" font-size="19.987665" fill="var(--text)" font-family="Arial, sans-serif">Run as non-root user</text>
  <text x="707.741993" y="323.17657" font-size="19.987665" fill="var(--text)" font-family="Arial, sans-serif">Use read-only root filesystem</text>
  <text x="707.741993" y="357.294092" font-size="19.987665" fill="var(--text)" font-family="Arial, sans-serif">Monitor with Prometheus/Grafana</text>
</svg>

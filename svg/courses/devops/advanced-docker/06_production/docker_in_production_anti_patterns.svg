<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="561.290371" height="580" rx="6.272739" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="320.645185" y="79.235347" font-size="25.438885" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">AVOID</text>
  <text x="69.032261" y="118.470693" font-size="19.987665" fill="var(--text)">Running as root inside containers</text>
  <text x="69.032261" y="152.588216" font-size="19.987665" fill="var(--text)">Using :latest tag in production</text>
  <text x="69.032261" y="186.70595" font-size="19.987665" fill="var(--text)">Storing data in writable layer</text>
  <text x="69.032261" y="220.823579" font-size="19.987665" fill="var(--text)">No resource limits</text>
  <text x="69.032261" y="254.941207" font-size="19.987665" fill="var(--text)">No health checks</text>
  <text x="69.032261" y="289.058835" font-size="19.987665" fill="var(--text)">No log rotation</text>
  <text x="69.032261" y="323.17657" font-size="19.987665" fill="var(--text)">Mounting Docker socket in apps</text>
  <text x="69.032261" y="357.294092" font-size="19.987665" fill="var(--text)">Using --privileged</text>
  <text x="69.032261" y="391.411826" font-size="19.987665" fill="var(--text)">Hardcoding config in images</text>
  <text x="69.032261" y="425.529561" font-size="19.987665" fill="var(--text)">No backup strategy for volumes</text>
  <text x="69.032261" y="459.647083" font-size="19.987665" fill="var(--text)">No monitoring or alerting</text>
  <rect x="678.709629" y="40" width="561.290371" height="580" rx="6.272739" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="959.354918" y="79.235347" font-size="25.438885" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">DO</text>
  <text x="707.741993" y="118.470693" font-size="19.987665" fill="var(--text)">Pin image versions with digests</text>
  <text x="707.741993" y="152.588216" font-size="19.987665" fill="var(--text)">Use named volumes for persistent data</text>
  <text x="707.741993" y="186.70595" font-size="19.987665" fill="var(--text)">Set memory and CPU limits</text>
  <text x="707.741993" y="220.823579" font-size="19.987665" fill="var(--text)">Implement health checks</text>
  <text x="707.741993" y="254.941207" font-size="19.987665" fill="var(--text)">Configure centralized logging</text>
  <text x="707.741993" y="289.058835" font-size="19.987665" fill="var(--text)">Run as non-root user</text>
  <text x="707.741993" y="323.17657" font-size="19.987665" fill="var(--text)">Use read-only root filesystem</text>
  <text x="707.741993" y="357.294092" font-size="19.987665" fill="var(--text)">Monitor with Prometheus/Grafana</text>
</svg>
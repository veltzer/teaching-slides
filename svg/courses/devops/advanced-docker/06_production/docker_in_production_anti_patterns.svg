<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="20" y="20" width="580" height="680" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="3" />
  <text x="310" y="70" font-family="sans-serif" font-size="28" font-weight="bold" fill="#c62828" text-anchor="middle">AVOID</text>
  <text x="50" y="120" font-family="sans-serif" font-size="24" fill="#333">✗ Running as root inside containers</text>
  <text x="50" y="160" font-family="sans-serif" font-size="24" fill="#333">✗ Using :latest tag in production</text>
  <text x="50" y="200" font-family="sans-serif" font-size="24" fill="#333">✗ Storing data in writable layer</text>
  <text x="50" y="240" font-family="sans-serif" font-size="24" fill="#333">✗ No resource limits</text>
  <text x="50" y="280" font-family="sans-serif" font-size="24" fill="#333">✗ No health checks</text>
  <text x="50" y="320" font-family="sans-serif" font-size="24" fill="#333">✗ No log rotation</text>
  <text x="50" y="360" font-family="sans-serif" font-size="24" fill="#333">✗ Mounting Docker socket in apps</text>
  <text x="50" y="400" font-family="sans-serif" font-size="24" fill="#333">✗ Using --privileged</text>
  <text x="50" y="440" font-family="sans-serif" font-size="24" fill="#333">✗ Hardcoding config in images</text>
  <text x="50" y="480" font-family="sans-serif" font-size="24" fill="#333">✗ No backup strategy for volumes</text>
  <text x="50" y="520" font-family="sans-serif" font-size="24" fill="#333">✗ No monitoring or alerting</text>
  <rect x="680" y="20" width="580" height="680" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3" />
  <text x="970" y="70" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2e7d32" text-anchor="middle">DO</text>
  <text x="710" y="120" font-family="sans-serif" font-size="24" fill="#333">✓ Pin image versions with digests</text>
  <text x="710" y="160" font-family="sans-serif" font-size="24" fill="#333">✓ Use named volumes for persistent data</text>
  <text x="710" y="200" font-family="sans-serif" font-size="24" fill="#333">✓ Set memory and CPU limits</text>
  <text x="710" y="240" font-family="sans-serif" font-size="24" fill="#333">✓ Implement health checks</text>
  <text x="710" y="280" font-family="sans-serif" font-size="24" fill="#333">✓ Configure centralized logging</text>
  <text x="710" y="320" font-family="sans-serif" font-size="24" fill="#333">✓ Run as non-root user</text>
  <text x="710" y="360" font-family="sans-serif" font-size="24" fill="#333">✓ Use read-only root filesystem</text>
  <text x="710" y="400" font-family="sans-serif" font-size="24" fill="#333">✓ Monitor with Prometheus/Grafana</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- AVOID panel -->
  <rect x="20" y="20" width="580" height="680" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2" filter="url(#shadow)"/>
  <text x="310" y="66" font-size="28" font-weight="bold" fill="#c62828" text-anchor="middle">AVOID</text>
  <text x="50" y="112" font-size="22" fill="#333333">Running as root inside containers</text>
  <text x="50" y="152" font-size="22" fill="#333333">Using :latest tag in production</text>
  <text x="50" y="192" font-size="22" fill="#333333">Storing data in writable layer</text>
  <text x="50" y="232" font-size="22" fill="#333333">No resource limits</text>
  <text x="50" y="272" font-size="22" fill="#333333">No health checks</text>
  <text x="50" y="312" font-size="22" fill="#333333">No log rotation</text>
  <text x="50" y="352" font-size="22" fill="#333333">Mounting Docker socket in apps</text>
  <text x="50" y="392" font-size="22" fill="#333333">Using --privileged</text>
  <text x="50" y="432" font-size="22" fill="#333333">Hardcoding config in images</text>
  <text x="50" y="472" font-size="22" fill="#333333">No backup strategy for volumes</text>
  <text x="50" y="512" font-size="22" fill="#333333">No monitoring or alerting</text>
  <!-- DO panel -->
  <rect x="680" y="20" width="580" height="680" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="970" y="66" font-size="28" font-weight="bold" fill="#1565c0" text-anchor="middle">DO</text>
  <text x="710" y="112" font-size="22" fill="#333333">Pin image versions with digests</text>
  <text x="710" y="152" font-size="22" fill="#333333">Use named volumes for persistent data</text>
  <text x="710" y="192" font-size="22" fill="#333333">Set memory and CPU limits</text>
  <text x="710" y="232" font-size="22" fill="#333333">Implement health checks</text>
  <text x="710" y="272" font-size="22" fill="#333333">Configure centralized logging</text>
  <text x="710" y="312" font-size="22" fill="#333333">Run as non-root user</text>
  <text x="710" y="352" font-size="22" fill="#333333">Use read-only root filesystem</text>
  <text x="710" y="392" font-size="22" fill="#333333">Monitor with Prometheus/Grafana</text>
</svg>

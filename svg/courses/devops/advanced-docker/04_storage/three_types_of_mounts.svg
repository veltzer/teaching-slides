<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="Arial, sans-serif">
  <text x="280" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Three Types of Mounts</text>
  <rect x="10" y="40" width="540" height="250" rx="5" fill="#f9f9f9" stroke="#4a90e2" stroke-width="2"/>
  <rect x="30" y="60" width="150" height="55" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="105" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a90e2">Bind Mount</text>
  <rect x="200" y="60" width="150" height="55" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="275" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#28a745">Named Volume</text>
  <rect x="370" y="60" width="150" height="55" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="445" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#856404">tmpfs Mount</text>
  <line x1="105" y1="115" x2="105" y2="145" stroke="#4a90e2" stroke-width="2"/>
  <line x1="275" y1="115" x2="275" y2="145" stroke="#28a745" stroke-width="2"/>
  <line x1="445" y1="115" x2="445" y2="145" stroke="#ffc107" stroke-width="2"/>
  <text x="105" y="160" text-anchor="middle" font-size="12" fill="#333">Host path</text>
  <text x="105" y="178" text-anchor="middle" font-size="11" font-family="monospace" fill="#666">/home/user</text>
  <text x="105" y="196" text-anchor="middle" font-size="11" font-family="monospace" fill="#666">/data/app</text>
  <text x="275" y="160" text-anchor="middle" font-size="12" fill="#333">Docker-managed</text>
  <text x="275" y="178" text-anchor="middle" font-size="11" font-family="monospace" fill="#666">/var/lib/docker</text>
  <text x="275" y="196" text-anchor="middle" font-size="11" font-family="monospace" fill="#666">/volumes/...</text>
  <text x="445" y="160" text-anchor="middle" font-size="12" fill="#333">RAM only</text>
  <text x="445" y="178" text-anchor="middle" font-size="11" fill="#666">No disk I/O</text>
  <text x="445" y="196" text-anchor="middle" font-size="11" fill="#666">Fastest option</text>
</svg>

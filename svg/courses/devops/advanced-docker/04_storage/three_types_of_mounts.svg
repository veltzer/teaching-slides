<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Title -->
  <text x="640" y="50" text-anchor="middle" font-size="34" font-weight="bold" fill="#1565c0">Three Types of Mounts</text>
  <!-- Outer card -->
  <rect x="22" y="74" width="1236" height="560" rx="10" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <!-- Bind Mount -->
  <rect x="68" y="112" width="340" height="130" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="238" y="182" text-anchor="middle" font-size="28" font-weight="bold" fill="#1565c0">Bind Mount</text>
  <!-- Named Volume -->
  <rect x="470" y="112" width="340" height="130" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="182" text-anchor="middle" font-size="28" font-weight="bold" fill="#1565c0">Named Volume</text>
  <!-- tmpfs Mount -->
  <rect x="872" y="112" width="340" height="130" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="1042" y="182" text-anchor="middle" font-size="28" font-weight="bold" fill="#1565c0">tmpfs Mount</text>
  <!-- Connector lines -->
  <line x1="238" y1="242" x2="238" y2="310" stroke="#1565c0" stroke-width="3"/>
  <line x1="640" y1="242" x2="640" y2="310" stroke="#1565c0" stroke-width="3"/>
  <line x1="1042" y1="242" x2="1042" y2="310" stroke="#1565c0" stroke-width="3"/>
  <!-- Detail text -->
  <text x="238" y="346" text-anchor="middle" font-size="24" fill="#333333">Host path</text>
  <text x="238" y="390" text-anchor="middle" font-size="22" font-family="monospace" fill="#555555">/home/user</text>
  <text x="238" y="432" text-anchor="middle" font-size="22" font-family="monospace" fill="#555555">/data/app</text>
  <text x="640" y="346" text-anchor="middle" font-size="24" fill="#333333">Docker-managed</text>
  <text x="640" y="390" text-anchor="middle" font-size="22" font-family="monospace" fill="#555555">/var/lib/docker</text>
  <text x="640" y="432" text-anchor="middle" font-size="22" font-family="monospace" fill="#555555">/volumes/...</text>
  <text x="1042" y="346" text-anchor="middle" font-size="24" fill="#333333">RAM only</text>
  <text x="1042" y="390" text-anchor="middle" font-size="22" fill="#555555">No disk I/O</text>
  <text x="1042" y="432" text-anchor="middle" font-size="22" fill="#555555">Fastest option</text>
</svg>

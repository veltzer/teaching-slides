<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <text x="640" y="80.2777" text-anchor="middle" font-size="29.5469" font-weight="bold" fill="var(--primary-accent)">Three Types of Mounts</text>
  <rect x="60.625" y="99.6111" width="1158.75" height="451.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="103.75" y="130.2223" width="318.75" height="104.7223" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="263.125" y="186.6111" text-anchor="middle" font-size="24.3328" font-weight="bold" fill="var(--primary-accent)">Bind Mount</text>
  <rect x="480.625" y="130.2223" width="318.75" height="104.7223" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="186.6111" text-anchor="middle" font-size="24.3328" font-weight="bold" fill="var(--primary-accent)">Named Volume</text>
  <rect x="857.5" y="130.2223" width="318.75" height="104.7223" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1016.875" y="186.6111" text-anchor="middle" font-size="24.3328" font-weight="bold" fill="var(--primary-accent)">tmpfs Mount</text>
  <line x1="263.125" y1="234.9444" x2="263.125" y2="289.7223" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="640" y1="234.9444" x2="640" y2="289.7223" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="1016.875" y1="234.9444" x2="1016.875" y2="289.7223" stroke="var(--primary-border)" stroke-width="2" />
  <text x="263.125" y="318.7223" text-anchor="middle" font-size="20.8566" fill="var(--text)">Host path</text>
  <text x="263.125" y="354.1667" text-anchor="middle" font-size="19.1186" font-family="monospace" fill="var(--text-muted)">/home/user</text>
  <text x="263.125" y="388" text-anchor="middle" font-size="19.1186" font-family="monospace" fill="var(--text-muted)">/data/app</text>
  <text x="640" y="318.7223" text-anchor="middle" font-size="20.8566" fill="var(--text)">Docker-managed</text>
  <text x="640" y="354.1667" text-anchor="middle" font-size="19.1186" font-family="monospace" fill="var(--text-muted)">/var/lib/docker</text>
  <text x="640" y="388" text-anchor="middle" font-size="19.1186" font-family="monospace" fill="var(--text-muted)">/volumes/...</text>
  <text x="1016.875" y="318.7223" text-anchor="middle" font-size="20.8566" fill="var(--text)">RAM only</text>
  <text x="1016.875" y="354.1667" text-anchor="middle" font-size="19.1186" fill="var(--text-muted)">No disk I/O</text>
  <text x="1016.875" y="388" text-anchor="middle" font-size="19.1186" fill="var(--text-muted)">Fastest option</text>
</svg>
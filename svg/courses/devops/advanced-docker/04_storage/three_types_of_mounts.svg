<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" rx="6.923397496006" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="84.660194" y="79.357257958792" width="330.097087" height="134.642960832668" rx="6.923397496006" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="249.708738" y="151.857145330204" text-anchor="middle" font-size="28.077606541326" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Bind Mount</text>
  <rect x="474.951456" y="79.357257958792" width="330.097087" height="134.642960832668" rx="6.923397496006" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="151.857145330204" text-anchor="middle" font-size="28.077606541326" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Named Volume</text>
  <rect x="865.242718" y="79.357257958792" width="330.097087" height="134.642960832668" rx="6.923397496006" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1030.291262" y="151.857145330204" text-anchor="middle" font-size="28.077606541326" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">tmpfs Mount</text>
  <line x1="249.708738" y1="213.999961205709" x2="249.708738" y2="284.428691237976" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="640" y1="213.999961205709" x2="640" y2="284.428691237976" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="1030.291262" y1="213.999961205709" x2="1030.291262" y2="284.428691237976" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="249.708738" y="321.714407043283" text-anchor="middle" font-size="24.066420981678" fill="var(--text)" font-family="Arial, sans-serif">Host path</text>
  <text x="249.708738" y="367.285779419601" text-anchor="middle" font-size="22.060943087287" fill="var(--text-muted)" font-family="Courier New, monospace">/home/user</text>
  <text x="249.708738" y="410.785737913881" text-anchor="middle" font-size="22.060943087287" fill="var(--text-muted)" font-family="Courier New, monospace">/data/app</text>
  <text x="640" y="321.714407043283" text-anchor="middle" font-size="24.066420981678" fill="var(--text)" font-family="Arial, sans-serif">Docker-managed</text>
  <text x="640" y="367.285779419601" text-anchor="middle" font-size="22.060943087287" fill="var(--text-muted)" font-family="Courier New, monospace">/var/lib/docker</text>
  <text x="640" y="410.785737913881" text-anchor="middle" font-size="22.060943087287" fill="var(--text-muted)" font-family="Courier New, monospace">/volumes/...</text>
  <text x="1030.291262" y="321.714407043283" text-anchor="middle" font-size="24.066420981678" fill="var(--text)" font-family="Arial, sans-serif">RAM only</text>
  <text x="1030.291262" y="367.285779419601" text-anchor="middle" font-size="22.060943087287" fill="var(--text-muted)" font-family="Arial, sans-serif">No disk I/O</text>
  <text x="1030.291262" y="410.785737913881" text-anchor="middle" font-size="22.060943087287" fill="var(--text-muted)" font-family="Arial, sans-serif">Fastest option</text>
</svg>

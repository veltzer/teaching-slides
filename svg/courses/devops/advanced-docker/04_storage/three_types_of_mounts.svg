<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="356.643356443139" height="235.625246489166" rx="9.519947956876" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="218.321678761779" y="166.874837917119" text-anchor="middle" font-size="38.607829924725" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Bind Mount</text>
  <rect x="461.67832177843" y="40" width="356.643356443139" height="235.625246489166" rx="9.519947956876" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.00000054021" y="166.874837917119" text-anchor="middle" font-size="38.607829924725" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Named Volume</text>
  <rect x="883.356643556861" y="40" width="356.643356443139" height="235.625246489166" rx="9.519947956876" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1061.67832231864" y="166.874837917119" text-anchor="middle" font-size="38.607829924725" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">tmpfs Mount</text>
  <line x1="218.321678761779" y1="275.624795713977" x2="218.321678761779" y2="398.875107287232" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="640.00000054021" y1="275.624795713977" x2="640.00000054021" y2="398.875107287232" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="1061.67832231864" y1="275.624795713977" x2="1061.67832231864" y2="398.875107287232" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="218.321678761779" y="464.125127955367" text-anchor="middle" font-size="33.092289643346" fill="var(--text)" font-family="Arial, sans-serif">Host path</text>
  <text x="218.321678761779" y="543.875051624709" text-anchor="middle" font-size="30.334677474713" fill="var(--text-muted)" font-family="Courier New, monospace">/home/user</text>
  <text x="218.321678761779" y="620" text-anchor="middle" font-size="30.334677474713" fill="var(--text-muted)" font-family="Courier New, monospace">/data/app</text>
  <text x="640.00000054021" y="464.125127955367" text-anchor="middle" font-size="33.092289643346" fill="var(--text)" font-family="Arial, sans-serif">Docker-managed</text>
  <text x="640.00000054021" y="543.875051624709" text-anchor="middle" font-size="30.334677474713" fill="var(--text-muted)" font-family="Courier New, monospace">/var/lib/docker</text>
  <text x="640.00000054021" y="620" text-anchor="middle" font-size="30.334677474713" fill="var(--text-muted)" font-family="Courier New, monospace">/volumes/...</text>
  <text x="1061.67832231864" y="464.125127955367" text-anchor="middle" font-size="33.092289643346" fill="var(--text)" font-family="Arial, sans-serif">RAM only</text>
  <text x="1061.67832231864" y="543.875051624709" text-anchor="middle" font-size="30.334677474713" fill="var(--text-muted)" font-family="Arial, sans-serif">No disk I/O</text>
  <text x="1061.67832231864" y="620" text-anchor="middle" font-size="30.334677474713" fill="var(--text-muted)" font-family="Arial, sans-serif">Fastest option</text>
</svg>

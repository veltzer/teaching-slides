<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="33.386237" font-weight="bold" fill="var(--primary-accent)">Three Types of Mounts</text>
  <rect x="40" y="63.835696" width="1200" height="556.164304" rx="6.779643" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="84.660194" y="101.575527" width="330.097087" height="129.10967" rx="6.779643" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="249.708738" y="171.095957" text-anchor="middle" font-size="27.494615" font-weight="bold" fill="var(--primary-accent)">Bind Mount</text>
  <rect x="474.951456" y="101.575527" width="330.097087" height="129.10967" rx="6.779643" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="171.095957" text-anchor="middle" font-size="27.494615" font-weight="bold" fill="var(--primary-accent)">Named Volume</text>
  <rect x="865.242718" y="101.575527" width="330.097087" height="129.10967" rx="6.779643" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1030.291262" y="171.095957" text-anchor="middle" font-size="27.494615" font-weight="bold" fill="var(--primary-accent)">tmpfs Mount</text>
  <line x1="249.708738" y1="230.68495" x2="249.708738" y2="298.219339" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="640" y1="230.68495" x2="640" y2="298.219339" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="1030.291262" y1="230.68495" x2="1030.291262" y2="298.219339" stroke="var(--primary-border)" stroke-width="2" />
  <text x="249.708738" y="333.97276" text-anchor="middle" font-size="23.566716" fill="var(--text)">Host path</text>
  <text x="249.708738" y="377.67133" text-anchor="middle" font-size="21.602879" font-family="monospace" fill="var(--text-muted)">/home/user</text>
  <text x="249.708738" y="419.383613" text-anchor="middle" font-size="21.602879" font-family="monospace" fill="var(--text-muted)">/data/app</text>
  <text x="640" y="333.97276" text-anchor="middle" font-size="23.566716" fill="var(--text)">Docker-managed</text>
  <text x="640" y="377.67133" text-anchor="middle" font-size="21.602879" font-family="monospace" fill="var(--text-muted)">/var/lib/docker</text>
  <text x="640" y="419.383613" text-anchor="middle" font-size="21.602879" font-family="monospace" fill="var(--text-muted)">/volumes/...</text>
  <text x="1030.291262" y="333.97276" text-anchor="middle" font-size="23.566716" fill="var(--text)">RAM only</text>
  <text x="1030.291262" y="377.67133" text-anchor="middle" font-size="21.602879" fill="var(--text-muted)">No disk I/O</text>
  <text x="1030.291262" y="419.383613" text-anchor="middle" font-size="21.602879" fill="var(--text-muted)">Fastest option</text>
</svg>
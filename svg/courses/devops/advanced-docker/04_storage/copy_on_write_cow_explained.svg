<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="1240" y="40" text-anchor="middle" font-size="41.799299" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Copy-on-Write (CoW) Explained</text>
  <text x="40" y="88.864531" font-size="32.842258" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Read operation:</text>
  <rect x="40" y="103.736225" width="1069.930071" height="63.736225" rx="10.306903" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="574.965034" y="141.977986" text-anchor="middle" font-size="29.856691" fill="var(--text)" font-family="Arial, sans-serif">Upper (R/W)</text>
  <text x="1208.531469" y="141.977986" font-size="23.885216" fill="var(--text-muted)" font-family="Arial, sans-serif">file not found - look in lower</text>
  <rect x="40" y="173.846164" width="1069.930071" height="63.736225" rx="10.306903" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="574.965034" y="212.087925" text-anchor="middle" font-size="29.856691" fill="var(--text)" font-family="Arial, sans-serif">Lower (RO)</text>
  <text x="1208.531469" y="212.087925" font-size="23.885216" fill="var(--primary-accent)" font-family="Arial, sans-serif">file found here, read directly</text>
  <text x="40" y="277.948809" font-size="32.842258" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Write operation (existing file):</text>
  <rect x="40" y="292.820635" width="1069.930071" height="63.736225" rx="10.306903" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="574.965034" y="331.062396" text-anchor="middle" font-size="29.856691" fill="var(--text)" font-family="Arial, sans-serif">Upper (R/W)</text>
  <text x="1208.531469" y="331.062396" font-size="23.885216" fill="var(--primary-accent)" font-family="Arial, sans-serif">file copied here, then modified</text>
  <rect x="40" y="362.930442" width="1069.930071" height="63.736225" rx="10.306903" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="574.965034" y="401.172203" text-anchor="middle" font-size="29.856691" fill="var(--text)" font-family="Arial, sans-serif">Lower (RO)</text>
  <text x="1208.531469" y="401.172203" font-size="23.885216" fill="var(--text-muted)" font-family="Arial, sans-serif">original unchanged</text>
  <text x="40" y="471.282143" font-size="32.842258" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Delete operation:</text>
  <rect x="40" y="486.153836" width="1069.930071" height="63.736225" rx="10.306903" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="574.965034" y="524.395597" text-anchor="middle" font-size="29.856691" fill="var(--text)" font-family="Arial, sans-serif">Upper (R/W)</text>
  <text x="1208.531469" y="524.395597" font-size="23.885216" fill="var(--danger-accent)" font-family="Arial, sans-serif">whiteout file created</text>
  <rect x="40" y="556.263775" width="1069.930071" height="63.736225" rx="10.306903" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="574.965034" y="594.505537" text-anchor="middle" font-size="29.856691" fill="var(--text)" font-family="Arial, sans-serif">Lower (RO)</text>
  <text x="1208.531469" y="594.505537" font-size="23.885216" fill="var(--text-muted)" font-family="Arial, sans-serif">original still exists but hidden</text>
</svg>

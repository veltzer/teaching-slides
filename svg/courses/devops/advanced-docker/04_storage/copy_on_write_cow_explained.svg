<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <text x="1240" y="40" text-anchor="middle" font-size="41.799299" font-weight="bold" fill="var(--primary-accent)">Copy-on-Write (CoW) Explained</text>
  <text x="40" y="88.864531" font-size="32.842258" font-weight="bold" fill="var(--primary-accent)">Read operation:</text>
  <rect x="40" y="103.736225" width="1069.930071" height="63.736225" rx="10.306903" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="574.965034" y="141.977986" text-anchor="middle" font-size="29.856691" fill="var(--text)">Upper (R/W)</text>
  <text x="1208.531469" y="141.977986" font-size="23.885216" fill="var(--text-muted)">file not found - look in lower</text>
  <rect x="40" y="173.846164" width="1069.930071" height="63.736225" rx="10.306903" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="574.965034" y="212.087925" text-anchor="middle" font-size="29.856691" fill="var(--text)">Lower (RO)</text>
  <text x="1208.531469" y="212.087925" font-size="23.885216" fill="var(--primary-accent)">file found here, read directly</text>
  <text x="40" y="277.948809" font-size="32.842258" font-weight="bold" fill="var(--primary-accent)">Write operation (existing file):</text>
  <rect x="40" y="292.820635" width="1069.930071" height="63.736225" rx="10.306903" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="574.965034" y="331.062396" text-anchor="middle" font-size="29.856691" fill="var(--text)">Upper (R/W)</text>
  <text x="1208.531469" y="331.062396" font-size="23.885216" fill="var(--primary-accent)">file copied here, then modified</text>
  <rect x="40" y="362.930442" width="1069.930071" height="63.736225" rx="10.306903" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="574.965034" y="401.172203" text-anchor="middle" font-size="29.856691" fill="var(--text)">Lower (RO)</text>
  <text x="1208.531469" y="401.172203" font-size="23.885216" fill="var(--text-muted)">original unchanged</text>
  <text x="40" y="471.282143" font-size="32.842258" font-weight="bold" fill="var(--danger-accent)">Delete operation:</text>
  <rect x="40" y="486.153836" width="1069.930071" height="63.736225" rx="10.306903" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="574.965034" y="524.395597" text-anchor="middle" font-size="29.856691" fill="var(--text)">Upper (R/W)</text>
  <text x="1208.531469" y="524.395597" font-size="23.885216" fill="var(--danger-accent)">whiteout file created</text>
  <rect x="40" y="556.263775" width="1069.930071" height="63.736225" rx="10.306903" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="574.965034" y="594.505537" text-anchor="middle" font-size="29.856691" fill="var(--text)">Lower (RO)</text>
  <text x="1208.531469" y="594.505537" font-size="23.885216" fill="var(--text-muted)">original still exists but hidden</text>
</svg>
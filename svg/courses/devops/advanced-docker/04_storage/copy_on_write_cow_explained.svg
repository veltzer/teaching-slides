<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="37.5" text-anchor="middle" font-size="24" font-weight="bold" fill="#333">Copy-on-Write (CoW) Explained</text>
  <text x="68.5714" y="82.5" font-size="21" font-weight="bold" fill="#4a90e2">Read operation:</text>
  <rect x="68.5714" y="97.5" width="502.8571" height="60" rx="7.5" fill="#d4edda" stroke="#28a745" stroke-width="3" />
  <text x="320" y="135" text-anchor="middle" font-size="18" fill="#333">Upper (R/W)</text>
  <text x="617.1429" y="132" font-size="15" fill="#666">file not found → look in lower</text>
  <rect x="68.5714" y="157.5" width="502.8571" height="60" rx="7.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3" />
  <text x="320" y="195" text-anchor="middle" font-size="18" fill="#333">Lower (RO)</text>
  <text x="617.1429" y="192" font-size="15" fill="#28a745">← file found here, read directly</text>
  <text x="68.5714" y="262.5" font-size="21" font-weight="bold" fill="#ffc107">Write operation (existing file):</text>
  <rect x="68.5714" y="277.5" width="502.8571" height="60" rx="7.5" fill="#fff3cd" stroke="#ffc107" stroke-width="3" />
  <text x="320" y="315" text-anchor="middle" font-size="18" fill="#333">Upper (R/W)</text>
  <text x="617.1429" y="312" font-size="15" fill="#856404">← file copied here, then modified</text>
  <rect x="68.5714" y="337.5" width="502.8571" height="60" rx="7.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3" />
  <text x="320" y="375" text-anchor="middle" font-size="18" fill="#333">Lower (RO)</text>
  <text x="617.1429" y="372" font-size="15" fill="#666">original unchanged</text>
  <text x="68.5714" y="450" font-size="21" font-weight="bold" fill="#dc3545">Delete operation:</text>
  <rect x="68.5714" y="465" width="502.8571" height="60" rx="7.5" fill="#f8d7da" stroke="#dc3545" stroke-width="3" />
  <text x="320" y="502.5" text-anchor="middle" font-size="18" fill="#333">Upper (R/W)</text>
  <text x="617.1429" y="499.5" font-size="15" fill="#dc3545">← whiteout file created</text>
  <rect x="68.5714" y="525" width="502.8571" height="60" rx="7.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3" />
  <text x="320" y="562.5" text-anchor="middle" font-size="18" fill="#333">Lower (RO)</text>
  <text x="617.1429" y="559.5" font-size="15" fill="#666">original still exists but hidden</text>
</svg>
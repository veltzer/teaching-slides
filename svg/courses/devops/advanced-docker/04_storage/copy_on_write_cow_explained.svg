<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Title -->
  <text x="640" y="44" text-anchor="middle" font-size="28" font-weight="bold" fill="#1565c0">Copy-on-Write (CoW) Explained</text>
  <!-- Read operation -->
  <text x="68" y="90" font-size="22" font-weight="bold" fill="#1565c0">Read operation:</text>
  <rect x="68" y="104" width="510" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="323" y="140" text-anchor="middle" font-size="20" fill="#333333">Upper (R/W)</text>
  <text x="625" y="140" font-size="16" fill="#555555">file not found - look in lower</text>
  <rect x="68" y="170" width="510" height="60" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="323" y="206" text-anchor="middle" font-size="20" fill="#333333">Lower (RO)</text>
  <text x="625" y="206" font-size="16" fill="#1565c0">file found here, read directly</text>
  <!-- Write operation -->
  <text x="68" y="268" font-size="22" font-weight="bold" fill="#1565c0">Write operation (existing file):</text>
  <rect x="68" y="282" width="510" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="323" y="318" text-anchor="middle" font-size="20" fill="#333333">Upper (R/W)</text>
  <text x="625" y="318" font-size="16" fill="#1565c0">file copied here, then modified</text>
  <rect x="68" y="348" width="510" height="60" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="323" y="384" text-anchor="middle" font-size="20" fill="#333333">Lower (RO)</text>
  <text x="625" y="384" font-size="16" fill="#555555">original unchanged</text>
  <!-- Delete operation -->
  <text x="68" y="450" font-size="22" font-weight="bold" fill="#c62828">Delete operation:</text>
  <rect x="68" y="464" width="510" height="60" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="2" filter="url(#shadow)"/>
  <text x="323" y="500" text-anchor="middle" font-size="20" fill="#333333">Upper (R/W)</text>
  <text x="625" y="500" font-size="16" fill="#c62828">whiteout file created</text>
  <rect x="68" y="530" width="510" height="60" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="323" y="566" text-anchor="middle" font-size="20" fill="#333333">Lower (RO)</text>
  <text x="625" y="566" font-size="16" fill="#555555">original still exists but hidden</text>
</svg>

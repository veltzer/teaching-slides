<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Title -->
  <text x="640" y="50" text-anchor="middle" font-size="32" font-weight="bold" fill="#1565c0">Storage Performance Comparison</text>
  <text x="640" y="88" text-anchor="middle" font-size="24" fill="#555555">(Sequential Write Throughput)</text>
  <!-- tmpfs - fastest -->
  <text x="360" y="158" text-anchor="end" font-size="24" fill="#333333">tmpfs (RAM)</text>
  <rect x="377" y="130" width="780" height="48" rx="6" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="1172" y="162" font-size="22" fill="#1565c0">~2000 MB/s</text>
  <!-- Bind mount (SSD) -->
  <text x="360" y="238" text-anchor="end" font-size="24" fill="#333333">Bind mount (SSD)</text>
  <rect x="377" y="210" width="470" height="48" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="862" y="242" font-size="22" fill="#1565c0">~1200 MB/s</text>
  <!-- Named volume (SSD) -->
  <text x="360" y="318" text-anchor="end" font-size="24" fill="#333333">Named volume (SSD)</text>
  <rect x="377" y="290" width="452" height="48" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="844" y="322" font-size="22" fill="#1565c0">~1150 MB/s</text>
  <!-- Container layer -->
  <text x="360" y="398" text-anchor="end" font-size="24" fill="#333333">Container layer</text>
  <rect x="377" y="370" width="312" height="48" rx="6" fill="url(#grad-surface)" stroke="#555555" stroke-width="2" filter="url(#shadow)"/>
  <text x="704" y="402" font-size="22" fill="#555555">~800 MB/s</text>
  <!-- NFS volume -->
  <text x="360" y="478" text-anchor="end" font-size="24" fill="#333333">NFS volume</text>
  <rect x="377" y="450" width="196" height="48" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="2" filter="url(#shadow)"/>
  <text x="588" y="482" font-size="22" fill="#c62828">~500 MB/s</text>
</svg>

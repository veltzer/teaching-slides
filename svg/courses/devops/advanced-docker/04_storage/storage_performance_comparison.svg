<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="56.25" text-anchor="middle" font-size="36" font-weight="bold" fill="#333">Storage Performance Comparison</text>
  <text x="640" y="101.25" text-anchor="middle" font-size="27" fill="#666">(Sequential Write Throughput)</text>
  <text x="354.2857" y="180" text-anchor="end" font-size="27" fill="#333">tmpfs (RAM)</text>
  <rect x="377.1429" y="148.5" width="777.1429" height="49.5" rx="6.75" fill="#d4edda" stroke="#28a745" stroke-width="2.25" />
  <text x="1177.1429" y="184.5" font-size="24.75" fill="#28a745">~2000 MB/s</text>
  <text x="354.2857" y="270" text-anchor="end" font-size="27" fill="#333">Bind mount (SSD)</text>
  <rect x="377.1429" y="238.5" width="466.2857" height="49.5" rx="6.75" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.25" />
  <text x="868.5714" y="274.5" font-size="24.75" fill="#4a90e2">~1200 MB/s</text>
  <text x="354.2857" y="360" text-anchor="end" font-size="27" fill="#333">Named volume (SSD)</text>
  <rect x="377.1429" y="328.5" width="448" height="49.5" rx="6.75" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.25" />
  <text x="848" y="364.5" font-size="24.75" fill="#4a90e2">~1150 MB/s</text>
  <text x="354.2857" y="450" text-anchor="end" font-size="27" fill="#333">Container layer</text>
  <rect x="377.1429" y="418.5" width="310.8571" height="49.5" rx="6.75" fill="#fff3cd" stroke="#ffc107" stroke-width="2.25" />
  <text x="710.8571" y="454.5" font-size="24.75" fill="#856404">~800 MB/s</text>
  <text x="354.2857" y="540" text-anchor="end" font-size="27" fill="#333">NFS volume</text>
  <rect x="377.1429" y="508.5" width="194.2857" height="49.5" rx="6.75" fill="#f8d7da" stroke="#dc3545" stroke-width="2.25" />
  <text x="594.2857" y="544.5" font-size="24.75" fill="#dc3545">~500 MB/s</text>

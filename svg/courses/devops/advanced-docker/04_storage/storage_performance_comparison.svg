<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="Arial, sans-serif">
  <text x="280" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Storage Performance Comparison</text>
  <text x="280" y="45" text-anchor="middle" font-size="12" fill="#666">(Sequential Write Throughput)</text>
  <text x="155" y="80" text-anchor="end" font-size="12" fill="#333">tmpfs (RAM)</text>
  <rect x="165" y="66" width="340" height="22" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="515" y="82" font-size="11" fill="#28a745">~2000 MB/s</text>
  <text x="155" y="120" text-anchor="end" font-size="12" fill="#333">Bind mount (SSD)</text>
  <rect x="165" y="106" width="204" height="22" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="380" y="122" font-size="11" fill="#4a90e2">~1200 MB/s</text>
  <text x="155" y="160" text-anchor="end" font-size="12" fill="#333">Named volume (SSD)</text>
  <rect x="165" y="146" width="196" height="22" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="371" y="162" font-size="11" fill="#4a90e2">~1150 MB/s</text>
  <text x="155" y="200" text-anchor="end" font-size="12" fill="#333">Container layer</text>
  <rect x="165" y="186" width="136" height="22" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="311" y="202" font-size="11" fill="#856404">~800 MB/s</text>
  <text x="155" y="240" text-anchor="end" font-size="12" fill="#333">NFS volume</text>
  <rect x="165" y="226" width="85" height="22" rx="3" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/>
  <text x="260" y="242" font-size="11" fill="#dc3545">~500 MB/s</text>
</svg>

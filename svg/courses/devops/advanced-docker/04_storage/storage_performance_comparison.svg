<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="453.793103" y="40" text-anchor="middle" font-size="34.701223846893" fill="var(--text-muted)" font-family="Arial, sans-serif">(Sequential Write Throughput)</text>
  <text x="40" y="139.024228260282" text-anchor="end" font-size="34.701223846893" fill="var(--text)" font-family="Arial, sans-serif">tmpfs (RAM)</text>
  <rect x="65.123153" y="99.414747844025" width="1152.70936" height="67.902493413362" rx="9.982803055817" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1240" y="144.682900135818" font-size="31.809537947079" fill="var(--primary-accent)" font-family="Arial, sans-serif">~2000 MB/s</text>
  <text x="40" y="252.195224716741" text-anchor="end" font-size="34.701223846893" fill="var(--text)" font-family="Arial, sans-serif">Bind mount (SSD)</text>
  <rect x="65.123153" y="212.58539354918" width="694.581281" height="67.902493413362" rx="9.982803055817" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="781.871921" y="257.853546933656" font-size="31.809537947079" fill="var(--primary-accent)" font-family="Arial, sans-serif">~1200 MB/s</text>
  <text x="40" y="365.365870421896" text-anchor="end" font-size="34.701223846893" fill="var(--text)" font-family="Arial, sans-serif">Named volume (SSD)</text>
  <rect x="65.123153" y="325.756039254335" width="667.980296" height="67.902493413362" rx="9.982803055817" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="755.270936" y="371.024368560804" font-size="31.809537947079" fill="var(--primary-accent)" font-family="Arial, sans-serif">~1150 MB/s</text>
  <text x="40" y="478.536517219734" text-anchor="end" font-size="34.701223846893" fill="var(--text)" font-family="Arial, sans-serif">Container layer</text>
  <rect x="65.123153" y="438.926860881483" width="461.083744" height="67.902493413362" rx="9.982803055817" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="548.374384" y="484.195014265959" font-size="31.809537947079" fill="var(--text-muted)" font-family="Arial, sans-serif">~800 MB/s</text>
  <text x="40" y="591.707338846882" text-anchor="end" font-size="34.701223846893" fill="var(--text)" font-family="Arial, sans-serif">NFS volume</text>
  <rect x="65.123153" y="552.097506586638" width="289.655172" height="67.902493413362" rx="9.982803055817" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="376.945813" y="597.365659971113" font-size="31.809537947079" fill="var(--danger-accent)" font-family="Arial, sans-serif">~500 MB/s</text>
</svg>

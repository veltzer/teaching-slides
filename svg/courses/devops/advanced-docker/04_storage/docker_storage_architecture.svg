<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Container Layer (R/W) -->
  <rect x="107" y="40" width="1066" height="84" rx="8" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="90" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">Container Layer (R/W)</text>
  <!-- Image Layer 3 -->
  <rect x="107" y="140" width="1066" height="74" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="185" text-anchor="middle" font-size="24" fill="#1565c0">Image Layer 3 (RO)</text>
  <!-- Image Layer 2 -->
  <rect x="107" y="228" width="1066" height="74" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="273" text-anchor="middle" font-size="24" fill="#1565c0">Image Layer 2 (RO)</text>
  <!-- Image Layer 1 -->
  <rect x="107" y="316" width="1066" height="74" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="361" text-anchor="middle" font-size="24" fill="#1565c0">Image Layer 1 (RO)</text>
  <!-- Base Image Layer -->
  <rect x="107" y="404" width="1066" height="74" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="449" text-anchor="middle" font-size="24" fill="#1565c0">Base Image Layer (RO)</text>
  <!-- Storage Driver -->
  <rect x="107" y="496" width="1066" height="74" rx="8" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="541" text-anchor="middle" font-size="24" fill="#1565c0">Storage Driver (overlay2)</text>
  <!-- Filesystem -->
  <rect x="107" y="584" width="1066" height="74" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="629" text-anchor="middle" font-size="24" fill="#1565c0">Filesystem (ext4, xfs)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Docker CLI / API -->
  <rect x="154" y="90" width="972" height="100" rx="8" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="132" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">Docker CLI / API</text>
  <text x="640" y="170" font-size="22" fill="#bbdefb" text-anchor="middle">docker run, build, pull, push ...</text>
  <!-- dockerd -->
  <rect x="154" y="210" width="972" height="100" rx="8" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="252" font-size="30" font-weight="bold" fill="#1565c0" text-anchor="middle">dockerd</text>
  <text x="640" y="290" font-size="22" fill="#555555" text-anchor="middle">Docker Daemon — image management, REST API</text>
  <!-- containerd -->
  <rect x="154" y="330" width="972" height="100" rx="8" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="372" font-size="30" font-weight="bold" fill="#1565c0" text-anchor="middle">containerd</text>
  <text x="640" y="410" font-size="22" fill="#555555" text-anchor="middle">Container Runtime — lifecycle management</text>
  <!-- runc -->
  <rect x="154" y="450" width="972" height="100" rx="8" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="492" font-size="30" font-weight="bold" fill="#1565c0" text-anchor="middle">runc</text>
  <text x="640" y="530" font-size="22" fill="#555555" text-anchor="middle">OCI Runtime Reference Implementation</text>
  <!-- Linux Kernel -->
  <rect x="154" y="570" width="972" height="80" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="605" font-size="28" font-weight="bold" fill="#1565c0" text-anchor="middle">Linux Kernel</text>
  <text x="640" y="635" font-size="22" fill="#555555" text-anchor="middle">namespaces  |  cgroups  |  seccomp</text>
</svg>

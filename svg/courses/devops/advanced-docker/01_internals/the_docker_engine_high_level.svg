  <ns0:text x="568.8889" y="224" font-size="26.6667" font-weight="bold" fill="#1565c0" text-anchor="middle">dockerd</ns0:text>
  <ns0:text x="568.8889" y="257.7778" font-size="19.5556" fill="#555555" text-anchor="middle">Docker Daemon — image management, REST API</ns0:text>
  <ns0:rect x="136.8889" y="293.3333" width="864" height="88.8889" rx="7.1111" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="330.6667" font-size="26.6667" font-weight="bold" fill="#1565c0" text-anchor="middle">containerd</ns0:text>
  <ns0:text x="568.8889" y="364.4444" font-size="19.5556" fill="#555555" text-anchor="middle">Container Runtime — lifecycle management</ns0:text>
  <ns0:rect x="136.8889" y="400" width="864" height="88.8889" rx="7.1111" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="437.3333" font-size="26.6667" font-weight="bold" fill="#1565c0" text-anchor="middle">runc</ns0:text>
  <ns0:text x="568.8889" y="471.1111" font-size="19.5556" fill="#555555" text-anchor="middle">OCI Runtime Reference Implementation</ns0:text>
  <ns0:rect x="136.8889" y="506.6667" width="864" height="71.1111" rx="7.1111" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="537.7778" font-size="24.8889" font-weight="bold" fill="#1565c0" text-anchor="middle">Linux Kernel</ns0:text>
  <ns0:text x="568.8889" y="564.4444" font-size="19.5556" fill="#555555" text-anchor="middle">namespaces  |  cgroups  |  seccomp</ns0:text>

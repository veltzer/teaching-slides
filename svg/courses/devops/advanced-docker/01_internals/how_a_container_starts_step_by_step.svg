      <ns0:path d="M 0.8889 1.7778 L 8 4.4444 L 0.8889 7.1111 Z" fill="#555555" />
    </ns0:marker>
    <ns0:marker id="arrow-accent" markerWidth="8.8889" markerHeight="8.8889" refX="8" refY="4.4444" orient="auto">
      <ns0:path d="M 0.8889 1.7778 L 8 4.4444 L 0.8889 7.1111 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="203.5556" y="26.6667" width="730.6667" height="46.2222" rx="5.3333" fill="url(#grad-accent)" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="55.1111" font-size="19.5556" fill="#ffffff" text-anchor="middle">1. docker run nginx</ns0:text>
  <ns0:line x1="568.8889" y1="72.8889" x2="568.8889" y2="88.8889" stroke="#555555" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:rect x="203.5556" y="88.8889" width="730.6667" height="46.2222" rx="5.3333" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="117.3333" font-size="19.5556" fill="#333333" text-anchor="middle">2. CLI sends request to dockerd via REST API</ns0:text>
  <ns0:line x1="568.8889" y1="135.1111" x2="568.8889" y2="151.1111" stroke="#555555" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:rect x="203.5556" y="151.1111" width="730.6667" height="46.2222" rx="5.3333" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="179.5556" font-size="19.5556" fill="#333333" text-anchor="middle">3. dockerd pulls image, creates container record</ns0:text>
  <ns0:line x1="568.8889" y1="197.3333" x2="568.8889" y2="213.3333" stroke="#555555" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:rect x="203.5556" y="213.3333" width="730.6667" height="46.2222" rx="5.3333" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="241.7778" font-size="19.5556" fill="#333333" text-anchor="middle">4. dockerd calls containerd via gRPC</ns0:text>
  <ns0:line x1="568.8889" y1="259.5556" x2="568.8889" y2="275.5556" stroke="#555555" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:rect x="203.5556" y="275.5556" width="730.6667" height="46.2222" rx="5.3333" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="304" font-size="19.5556" fill="#333333" text-anchor="middle">5. containerd creates a task and shim process</ns0:text>
  <ns0:line x1="568.8889" y1="321.7778" x2="568.8889" y2="337.7778" stroke="#555555" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:rect x="203.5556" y="337.7778" width="730.6667" height="46.2222" rx="5.3333" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="366.2222" font-size="19.5556" fill="#333333" text-anchor="middle">6. shim calls runc to create the container</ns0:text>
  <ns0:line x1="568.8889" y1="384" x2="568.8889" y2="400" stroke="#555555" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:rect x="203.5556" y="400" width="730.6667" height="46.2222" rx="5.3333" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="428.4444" font-size="19.5556" fill="#333333" text-anchor="middle">7. runc sets up namespaces, cgroups, mounts</ns0:text>
  <ns0:line x1="568.8889" y1="446.2222" x2="568.8889" y2="462.2222" stroke="#555555" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:rect x="203.5556" y="462.2222" width="730.6667" height="46.2222" rx="5.3333" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="490.6667" font-size="19.5556" fill="#333333" text-anchor="middle">8. runc executes the container entrypoint</ns0:text>
  <ns0:line x1="568.8889" y1="508.4444" x2="568.8889" y2="524.4444" stroke="#555555" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:rect x="203.5556" y="524.4444" width="730.6667" height="46.2222" rx="5.3333" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="552.8889" font-size="19.5556" fill="#333333" text-anchor="middle">9. runc exits, shim takes over as parent</ns0:text>
  <ns0:line x1="568.8889" y1="570.6667" x2="568.8889" y2="586.6667" stroke="#555555" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:rect x="203.5556" y="586.6667" width="730.6667" height="39.1111" rx="5.3333" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.7778" />
  <ns0:text x="568.8889" y="611.5556" font-size="19.5556" font-weight="bold" fill="#1565c0" text-anchor="middle">10. Container process is running</ns0:text>
</ns0:svg>
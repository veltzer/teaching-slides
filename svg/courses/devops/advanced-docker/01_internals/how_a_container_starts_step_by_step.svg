<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Steps: 9 steps, y spacing ~64px, starting y=30 -->
  <!-- Step 1 -->
  <rect x="229" y="30" width="822" height="52" rx="6" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="62" font-size="22" fill="#ffffff" text-anchor="middle">1. docker run nginx</text>
  <line x1="640" y1="82" x2="640" y2="100" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Step 2 -->
  <rect x="229" y="100" width="822" height="52" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="132" font-size="22" fill="#333333" text-anchor="middle">2. CLI sends request to dockerd via REST API</text>
  <line x1="640" y1="152" x2="640" y2="170" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Step 3 -->
  <rect x="229" y="170" width="822" height="52" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="202" font-size="22" fill="#333333" text-anchor="middle">3. dockerd pulls image, creates container record</text>
  <line x1="640" y1="222" x2="640" y2="240" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Step 4 -->
  <rect x="229" y="240" width="822" height="52" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="272" font-size="22" fill="#333333" text-anchor="middle">4. dockerd calls containerd via gRPC</text>
  <line x1="640" y1="292" x2="640" y2="310" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Step 5 -->
  <rect x="229" y="310" width="822" height="52" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="342" font-size="22" fill="#333333" text-anchor="middle">5. containerd creates a task and shim process</text>
  <line x1="640" y1="362" x2="640" y2="380" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Step 6 -->
  <rect x="229" y="380" width="822" height="52" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="412" font-size="22" fill="#333333" text-anchor="middle">6. shim calls runc to create the container</text>
  <line x1="640" y1="432" x2="640" y2="450" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Step 7 -->
  <rect x="229" y="450" width="822" height="52" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="482" font-size="22" fill="#333333" text-anchor="middle">7. runc sets up namespaces, cgroups, mounts</text>
  <line x1="640" y1="502" x2="640" y2="520" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Step 8 -->
  <rect x="229" y="520" width="822" height="52" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="552" font-size="22" fill="#333333" text-anchor="middle">8. runc executes the container entrypoint</text>
  <line x1="640" y1="572" x2="640" y2="590" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Step 9 -->
  <rect x="229" y="590" width="822" height="52" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="622" font-size="22" fill="#333333" text-anchor="middle">9. runc exits, shim takes over as parent</text>
  <line x1="640" y1="642" x2="640" y2="660" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Final -->
  <rect x="229" y="660" width="822" height="44" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="640" y="688" font-size="22" font-weight="bold" fill="#1565c0" text-anchor="middle">10. Container process is running</text>
</svg>

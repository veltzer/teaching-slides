  <rect x="228.5714" y="636.2791" width="822.8571" height="36.8372" rx="6.6977" fill="#fff3e0" stroke="#e65100" stroke-width="1.6744" />
  <text x="640" y="663.0698" font-size="20.093" fill="#222" text-anchor="middle">9. runc exits, shim takes over as parent</text>

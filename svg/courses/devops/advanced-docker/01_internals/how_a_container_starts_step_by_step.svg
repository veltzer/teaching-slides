  <text x="640" y="38.5116" font-size="25.1163" font-weight="bold" fill="#222" text-anchor="middle">docker run — Container Startup Flow</text>
  <rect x="228.5714" y="73.6744" width="822.8571" height="46.8837" rx="6.6977" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6744" />
  <text x="640" y="105.4884" font-size="20.093" fill="#222" text-anchor="middle">1. docker run nginx</text>
  <line x1="640" y1="120.5581" x2="640" y2="144" stroke="#555" stroke-width="2.5116" marker-end="url(#arw7)" />
  <rect x="228.5714" y="144" width="822.8571" height="46.8837" rx="6.6977" fill="#f0f4f8" stroke="#555" stroke-width="1.6744" />
  <text x="640" y="175.814" font-size="20.093" fill="#222" text-anchor="middle">2. CLI sends request to dockerd via REST API</text>
  <line x1="640" y1="190.8837" x2="640" y2="214.3256" stroke="#555" stroke-width="2.5116" marker-end="url(#arw7)" />
  <rect x="228.5714" y="214.3256" width="822.8571" height="46.8837" rx="6.6977" fill="#f0f4f8" stroke="#555" stroke-width="1.6744" />
  <text x="640" y="246.1395" font-size="20.093" fill="#222" text-anchor="middle">3. dockerd pulls image, creates container record</text>
  <line x1="640" y1="261.2093" x2="640" y2="284.6512" stroke="#555" stroke-width="2.5116" marker-end="url(#arw7)" />
  <rect x="228.5714" y="284.6512" width="822.8571" height="46.8837" rx="6.6977" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6744" />
  <text x="640" y="316.4651" font-size="20.093" fill="#222" text-anchor="middle">4. dockerd calls containerd via gRPC</text>
  <line x1="640" y1="331.5349" x2="640" y2="354.9767" stroke="#555" stroke-width="2.5116" marker-end="url(#arw7)" />
  <rect x="228.5714" y="354.9767" width="822.8571" height="46.8837" rx="6.6977" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6744" />
  <text x="640" y="386.7907" font-size="20.093" fill="#222" text-anchor="middle">5. containerd creates a task + shim process</text>
  <line x1="640" y1="401.8605" x2="640" y2="425.3023" stroke="#555" stroke-width="2.5116" marker-end="url(#arw7)" />
  <rect x="228.5714" y="425.3023" width="822.8571" height="46.8837" rx="6.6977" fill="#fff9c4" stroke="#f9a825" stroke-width="1.6744" />
  <text x="640" y="457.1163" font-size="20.093" fill="#222" text-anchor="middle">6. shim calls runc to create the container</text>
  <line x1="640" y1="472.186" x2="640" y2="495.6279" stroke="#555" stroke-width="2.5116" marker-end="url(#arw7)" />
  <rect x="228.5714" y="495.6279" width="822.8571" height="46.8837" rx="6.6977" fill="#fff9c4" stroke="#f9a825" stroke-width="1.6744" />
  <text x="640" y="527.4419" font-size="20.093" fill="#222" text-anchor="middle">7. runc sets up namespaces, cgroups, mounts</text>
  <line x1="640" y1="542.5116" x2="640" y2="565.9535" stroke="#555" stroke-width="2.5116" marker-end="url(#arw7)" />
  <rect x="228.5714" y="565.9535" width="822.8571" height="46.8837" rx="6.6977" fill="#fff3e0" stroke="#e65100" stroke-width="1.6744" />
  <text x="640" y="597.7674" font-size="20.093" fill="#222" text-anchor="middle">8. runc executes the container entrypoint</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="44.74779" rx="7.738497" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="67.537011" font-size="24.658206" fill="var(--bg)" text-anchor="middle">1. docker run nginx</text>
  <line x1="640" y1="84.74779" x2="640" y2="100.237406" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="40" y="100.237406" width="1200" height="44.74779" rx="7.738497" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="127.774417" font-size="24.658206" fill="var(--text)" text-anchor="middle">2. CLI sends request to dockerd via REST API</text>
  <line x1="640" y1="144.985089" x2="640" y2="160.474704" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="40" y="160.474704" width="1200" height="44.74779" rx="7.738497" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="188.011929" font-size="24.658206" fill="var(--text)" text-anchor="middle">3. dockerd pulls image, creates container record</text>
  <line x1="640" y1="205.222494" x2="640" y2="220.71211" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="40" y="220.71211" width="1200" height="44.74779" rx="7.738497" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="248.249228" font-size="24.658206" fill="var(--text)" text-anchor="middle">4. dockerd calls containerd via gRPC</text>
  <line x1="640" y1="265.460007" x2="640" y2="280.949622" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="40" y="280.949622" width="1200" height="44.74779" rx="7.738497" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="308.486633" font-size="24.658206" fill="var(--text)" text-anchor="middle">5. containerd creates a task and shim process</text>
  <line x1="640" y1="325.697305" x2="640" y2="341.186921" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="40" y="341.186921" width="1200" height="44.74779" rx="7.738497" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="368.724039" font-size="24.658206" fill="var(--text)" text-anchor="middle">6. shim calls runc to create the container</text>
  <line x1="640" y1="385.934711" x2="640" y2="401.424326" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="40" y="401.424326" width="1200" height="44.74779" rx="7.738497" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="428.961337" font-size="24.658206" fill="var(--text)" text-anchor="middle">7. runc sets up namespaces, cgroups, mounts</text>
  <line x1="640" y1="446.172116" x2="640" y2="461.661732" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="40" y="461.661732" width="1200" height="44.74779" rx="7.738497" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="489.19885" font-size="24.658206" fill="var(--text)" text-anchor="middle">8. runc executes the container entrypoint</text>
  <line x1="640" y1="506.409415" x2="640" y2="521.899031" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="40" y="521.899031" width="1200" height="44.74779" rx="7.738497" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="549.436255" font-size="24.658206" fill="var(--text)" text-anchor="middle">9. runc exits, shim takes over as parent</text>
  <line x1="640" y1="566.646927" x2="640" y2="582.136543" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="40" y="582.136543" width="1200" height="37.863457" rx="7.738497" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="606.231548" font-size="24.658206" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">10. Container process is running</text>
</svg>
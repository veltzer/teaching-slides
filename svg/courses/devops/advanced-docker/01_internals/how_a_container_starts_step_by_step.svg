<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="1200" height="44.74779" rx="7.738497" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="67.537011" font-size="24.658206" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">1. docker run nginx</text>
  <line x1="640" y1="84.74779" x2="640" y2="100.237406" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="40" y="100.237406" width="1200" height="44.74779" rx="7.738497" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="127.774417" font-size="24.658206" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">2. CLI sends request to dockerd via REST API</text>
  <line x1="640" y1="144.985089" x2="640" y2="160.474704" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="40" y="160.474704" width="1200" height="44.74779" rx="7.738497" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="188.011929" font-size="24.658206" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">3. dockerd pulls image, creates container record</text>
  <line x1="640" y1="205.222494" x2="640" y2="220.71211" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="40" y="220.71211" width="1200" height="44.74779" rx="7.738497" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="248.249228" font-size="24.658206" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">4. dockerd calls containerd via gRPC</text>
  <line x1="640" y1="265.460007" x2="640" y2="280.949622" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="40" y="280.949622" width="1200" height="44.74779" rx="7.738497" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="308.486633" font-size="24.658206" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">5. containerd creates a task and shim process</text>
  <line x1="640" y1="325.697305" x2="640" y2="341.186921" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="40" y="341.186921" width="1200" height="44.74779" rx="7.738497" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="368.724039" font-size="24.658206" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">6. shim calls runc to create the container</text>
  <line x1="640" y1="385.934711" x2="640" y2="401.424326" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="40" y="401.424326" width="1200" height="44.74779" rx="7.738497" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="428.961337" font-size="24.658206" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">7. runc sets up namespaces, cgroups, mounts</text>
  <line x1="640" y1="446.172116" x2="640" y2="461.661732" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="40" y="461.661732" width="1200" height="44.74779" rx="7.738497" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="489.19885" font-size="24.658206" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">8. runc executes the container entrypoint</text>
  <line x1="640" y1="506.409415" x2="640" y2="521.899031" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="40" y="521.899031" width="1200" height="44.74779" rx="7.738497" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="549.436255" font-size="24.658206" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">9. runc exits, shim takes over as parent</text>
  <line x1="640" y1="566.646927" x2="640" y2="582.136543" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="40" y="582.136543" width="1200" height="37.863457" rx="7.738497" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="606.231548" font-size="24.658206" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">10. Container process is running</text>
</svg>
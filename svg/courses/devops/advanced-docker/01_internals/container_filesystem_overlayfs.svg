<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Merged (container view) -->
  <rect x="154" y="60" width="972" height="120" rx="8" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="108" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">Merged (container view)</text>
  <text x="640" y="148" font-size="22" fill="#bbdefb" text-anchor="middle">unified filesystem visible to the container</text>
  <!-- Upper Layer (writable) -->
  <rect x="154" y="200" width="972" height="120" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="248" font-size="30" font-weight="bold" fill="#1565c0" text-anchor="middle">Upper Layer (writable)</text>
  <text x="640" y="290" font-size="22" fill="#555555" text-anchor="middle">container writes go here — unique per container</text>
  <!-- Lower Layers (read-only) -->
  <rect x="154" y="340" width="972" height="280" rx="8" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="388" font-size="28" font-weight="bold" fill="#1565c0" text-anchor="middle">Lower Layers (read-only image layers)</text>
  <line x1="154" y1="410" x2="1126" y2="410" stroke="#1565c0" stroke-width="1" stroke-dasharray="6 4" opacity="0.4"/>
  <text x="640" y="450" font-size="24" fill="#555555" text-anchor="middle">layer3 — FROM instruction (top image layer)</text>
  <line x1="154" y1="470" x2="1126" y2="470" stroke="#1565c0" stroke-width="1" stroke-dasharray="6 4" opacity="0.4"/>
  <text x="640" y="510" font-size="24" fill="#555555" text-anchor="middle">layer2 — RUN instruction</text>
  <line x1="154" y1="530" x2="1126" y2="530" stroke="#1565c0" stroke-width="1" stroke-dasharray="6 4" opacity="0.4"/>
  <text x="640" y="570" font-size="24" fill="#555555" text-anchor="middle">layer1 — base image (bottom)</text>
</svg>

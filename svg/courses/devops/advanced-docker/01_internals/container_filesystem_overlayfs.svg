  <text x="640" y="69" font-size="38.4" font-weight="bold" fill="#222" text-anchor="middle">OverlayFS Layer Structure</text>
  <rect x="153.6" y="132" width="972.8" height="126" rx="10.24" fill="#bbdefb" stroke="#1565c0" stroke-width="3.84" />
  <text x="640" y="183" font-size="33.28" font-weight="bold" fill="#1565c0" text-anchor="middle">Merged (container view)</text>
  <text x="640" y="234" font-size="28.16" fill="#555" text-anchor="middle">unified filesystem visible to the container</text>
  <rect x="153.6" y="282" width="972.8" height="126" rx="10.24" fill="#c8e6c9" stroke="#2e7d32" stroke-width="3.84" />
  <text x="640" y="333" font-size="33.28" font-weight="bold" fill="#2e7d32" text-anchor="middle">Upper Layer (writable)</text>
  <text x="640" y="384" font-size="28.16" fill="#555" text-anchor="middle">container writes go here — unique per container</text>
  <rect x="153.6" y="432" width="972.8" height="264" rx="10.24" fill="#f0f4f8" stroke="#555" stroke-width="3.84" />
  <text x="640" y="486" font-size="33.28" font-weight="bold" fill="#222" text-anchor="middle">Lower Layers (read-only image layers)</text>

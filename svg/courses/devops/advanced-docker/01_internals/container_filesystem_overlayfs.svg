<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <rect x="2.56" y="3" width="1274.88" height="714" rx="10.24" fill="#fff" stroke="#333" stroke-width="3.84" />

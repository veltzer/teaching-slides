<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="521.311475" height="580" rx="7.374925" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="300.655738" y="98.000043" font-size="27.77237" font-weight="bold" fill="var(--text)" text-anchor="middle">Host Network Namespace</text>
  <rect x="84.262295" y="144.40002" width="206.557377" height="127.600009" rx="7.374925" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="187.540984" y="196.60003" font-size="23.499707" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">docker0</text>
  <text x="187.540984" y="231.400085" font-size="19.227044" fill="var(--text-muted)" text-anchor="middle">bridge</text>
  <rect x="118.688525" y="330.000216" width="167.213115" height="116.000086" rx="7.374925" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="202.295082" y="399.600181" font-size="21.363437" fill="var(--text)" text-anchor="middle">vethXXXX</text>
  <line x1="187.540984" y1="272.000029" x2="187.540984" y2="330.000216" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="718.688525" y="40" width="521.311475" height="580" rx="7.374925" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="979.344262" y="98.000043" font-size="27.77237" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Container Network NS</text>
  <rect x="984.262295" y="144.40002" width="167.213115" height="127.600009" rx="7.374925" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1067.868852" y="208.200096" font-size="23.499707" fill="var(--text)" text-anchor="middle">eth0</text>
  <rect x="984.262295" y="330.000216" width="167.213115" height="116.000086" rx="7.374925" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1067.868852" y="399.600181" font-size="21.363437" fill="var(--text)" text-anchor="middle">vethYYYY</text>
  <line x1="1067.868852" y1="272.000029" x2="1067.868852" y2="330.000216" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="285.901639" y1="504.000202" x2="561.311475" y2="504.000202" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="7.1111 5.3333" />
  <line x1="718.688525" y1="504.000202" x2="984.262295" y2="504.000202" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="7.1111 5.3333" />
  <text x="640" y="494.72012" font-size="21.363437" fill="var(--text-muted)" text-anchor="middle">veth pair</text>
  <line x1="202.295082" y1="388.000115" x2="202.295082" y2="504.000202" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="202.295082" y1="504.000202" x2="285.901639" y2="504.000202" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="1067.868852" y1="388.000115" x2="1067.868852" y2="504.000202" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="1067.868852" y1="504.000202" x2="984.262295" y2="504.000202" stroke="var(--text-muted)" stroke-width="1.7778" />
</svg>
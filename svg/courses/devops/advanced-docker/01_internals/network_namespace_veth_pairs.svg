<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Host Network box -->
  <rect x="30" y="60" width="530" height="500" rx="8" fill="url(#grad-surface)" stroke="#555555" stroke-width="2" filter="url(#shadow)"/>
  <text x="295" y="110" font-size="26" font-weight="bold" fill="#333333" text-anchor="middle">Host Network Namespace</text>
  <!-- docker0 bridge -->
  <rect x="75" y="150" width="210" height="110" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="195" font-size="22" font-weight="bold" fill="#1565c0" text-anchor="middle">docker0</text>
  <text x="180" y="225" font-size="18" fill="#555555" text-anchor="middle">bridge</text>
  <!-- vethXXXX -->
  <rect x="110" y="310" width="170" height="100" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="195" y="370" font-size="20" fill="#333333" text-anchor="middle">vethXXXX</text>
  <line x1="180" y1="260" x2="180" y2="310" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Container Network NS box -->
  <rect x="720" y="60" width="530" height="500" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="985" y="110" font-size="26" font-weight="bold" fill="#1565c0" text-anchor="middle">Container Network NS</text>
  <!-- eth0 -->
  <rect x="990" y="150" width="170" height="110" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="1075" y="205" font-size="22" fill="#333333" text-anchor="middle">eth0</text>
  <!-- vethYYYY -->
  <rect x="990" y="310" width="170" height="100" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="1075" y="370" font-size="20" fill="#333333" text-anchor="middle">vethYYYY</text>
  <line x1="1075" y1="260" x2="1075" y2="310" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- veth pair connecting line -->
  <line x1="280" y1="460" x2="560" y2="460" stroke="#555555" stroke-width="3" stroke-dasharray="8 6"/>
  <line x1="720" y1="460" x2="990" y2="460" stroke="#555555" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="640" y="452" font-size="20" fill="#555555" text-anchor="middle">veth pair</text>
  <line x1="195" y1="360" x2="195" y2="460" stroke="#555555" stroke-width="2"/>
  <line x1="195" y1="460" x2="280" y2="460" stroke="#555555" stroke-width="2"/>
  <line x1="1075" y1="360" x2="1075" y2="460" stroke="#555555" stroke-width="2"/>
  <line x1="1075" y1="460" x2="990" y2="460" stroke="#555555" stroke-width="2"/>
</svg>

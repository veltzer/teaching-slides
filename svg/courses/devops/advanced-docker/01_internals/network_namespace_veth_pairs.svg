<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="521.311475" height="580" rx="7.374925" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="300.655738" y="98.000043" font-size="27.77237" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Host Network Namespace</text>
  <rect x="84.262295" y="144.40002" width="206.557377" height="127.600009" rx="7.374925" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="187.540984" y="196.60003" font-size="23.499707" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">docker0</text>
  <text x="187.540984" y="231.400085" font-size="19.227044" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">bridge</text>
  <rect x="118.688525" y="330.000216" width="167.213115" height="116.000086" rx="7.374925" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="202.295082" y="399.600181" font-size="21.363437" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">vethXXXX</text>
  <line x1="187.540984" y1="272.000029" x2="187.540984" y2="330.000216" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <rect x="718.688525" y="40" width="521.311475" height="580" rx="7.374925" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="979.344262" y="98.000043" font-size="27.77237" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">Container Network NS</text>
  <rect x="984.262295" y="144.40002" width="167.213115" height="127.600009" rx="7.374925" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1067.868852" y="208.200096" font-size="23.499707" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">eth0</text>
  <rect x="984.262295" y="330.000216" width="167.213115" height="116.000086" rx="7.374925" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1067.868852" y="399.600181" font-size="21.363437" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">vethYYYY</text>
  <line x1="1067.868852" y1="272.000029" x2="1067.868852" y2="330.000216" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <line x1="285.901639" y1="504.000202" x2="561.311475" y2="504.000202" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="7.1111 5.3333"/>
  <line x1="718.688525" y1="504.000202" x2="984.262295" y2="504.000202" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="7.1111 5.3333"/>
  <text x="640" y="494.72012" font-size="21.363437" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">veth pair</text>
  <line x1="202.295082" y1="388.000115" x2="202.295082" y2="504.000202" stroke="var(--text-muted)" stroke-width="1.7778"/>
  <line x1="202.295082" y1="504.000202" x2="285.901639" y2="504.000202" stroke="var(--text-muted)" stroke-width="1.7778"/>
  <line x1="1067.868852" y1="388.000115" x2="1067.868852" y2="504.000202" stroke="var(--text-muted)" stroke-width="1.7778"/>
  <line x1="1067.868852" y1="504.000202" x2="984.262295" y2="504.000202" stroke="var(--text-muted)" stroke-width="1.7778"/>
</svg>

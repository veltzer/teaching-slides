<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="72.249137" rx="6.870554" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="85.15571" font-size="29.853475" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">containerd</text>
  <rect x="40" y="134.325359" width="280.263053" height="110.380612" rx="6.870554" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="180.131579" y="179.481069" font-size="23.882734" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">Content</text>
  <text x="180.131579" y="213.598606" font-size="21.892564" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Store</text>
  <rect x="338.026316" y="134.325359" width="280.263053" height="110.380612" rx="6.870554" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="478.157895" y="179.481069" font-size="23.882734" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">Snapshot</text>
  <text x="478.157895" y="213.598606" font-size="21.892564" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Manager</text>
  <rect x="636.052632" y="134.325359" width="280.263053" height="110.380612" rx="6.870554" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="776.184211" y="179.481069" font-size="23.882734" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">Runtime</text>
  <text x="776.184211" y="213.598606" font-size="21.892564" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Manager</text>
  <rect x="934.078947" y="134.325359" width="270.394737" height="110.380612" rx="6.870554" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1069.276316" y="179.481069" font-size="23.882734" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">Image</text>
  <text x="1069.276316" y="213.598606" font-size="21.892564" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Store</text>
  <rect x="40" y="266.782068" width="1200" height="80.276763" rx="6.870554" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="315.951591" font-size="25.873019" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">Metadata Store (bbolt)</text>
  <rect x="40" y="367.128022" width="1200" height="80.276763" rx="6.870554" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="416.29767" font-size="25.873019" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">Shim API (ttrpc)</text>
  <rect x="40" y="467.4741" width="1200" height="72.249137" rx="6.870554" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="512.629811" font-size="23.882734" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">containerd-shim-runc-v2</text>
  <rect x="40" y="559.792428" width="1200" height="60.207572" rx="6.870554" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="597.924027" font-size="25.873019" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">runc</text>
</svg>

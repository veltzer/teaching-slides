<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="561.290323" height="74.598013" rx="6.55868" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="320.645161" y="84.758761" font-family="Arial, sans-serif" font-size="22.798627" font-weight="bold" fill="var(--bg)" text-anchor="middle">Dockerfile Instruction</text>
  <rect x="610.967742" y="40" width="629.032258" height="74.598013" rx="6.55868" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="925.483871" y="84.758761" font-family="Arial, sans-serif" font-size="22.798627" font-weight="bold" fill="var(--bg)" text-anchor="middle">Cache Behavior</text>
  <rect x="40" y="123.922822" width="561.290323" height="76.463067" rx="6.55868" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="61.290323" y="170.546638" font-size="20.898796" fill="var(--text)" font-family="Courier New, monospace">FROM ubuntu:22.04</text>
  <rect x="610.967742" y="123.922822" width="629.032258" height="76.463067" rx="6.55868" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630.322581" y="170.546638" font-family="Arial, sans-serif" font-size="20.898796" fill="var(--primary-accent)">Cached if image exists</text>
  <rect x="40" y="207.845644" width="561.290323" height="76.463067" rx="6.55868" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="61.290323" y="254.46946" font-size="20.898796" fill="var(--text)" font-family="Courier New, monospace">RUN apt-get update</text>
  <rect x="610.967742" y="207.845644" width="629.032258" height="76.463067" rx="6.55868" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630.322581" y="254.46946" font-family="Arial, sans-serif" font-size="20.898796" fill="var(--primary-accent)">Cached if previous layers unchanged</text>
  <rect x="40" y="291.768466" width="561.290323" height="76.463067" rx="6.55868" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="61.290323" y="338.392282" font-size="20.898796" fill="var(--text)" font-family="Courier New, monospace">COPY package.json .</text>
  <rect x="610.967742" y="291.768466" width="629.032258" height="76.463067" rx="6.55868" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630.322581" y="338.392282" font-family="Arial, sans-serif" font-size="20.898796" fill="var(--danger-accent)">INVALIDATED if file changed</text>
  <rect x="40" y="375.691289" width="561.290323" height="76.463067" rx="6.55868" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="61.290323" y="422.315104" font-size="20.898796" fill="var(--text)" font-family="Courier New, monospace">RUN npm install</text>
  <rect x="610.967742" y="375.691289" width="629.032258" height="76.463067" rx="6.55868" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630.322581" y="422.315104" font-family="Arial, sans-serif" font-size="20.898796" fill="var(--danger-accent)">INVALIDATED (cache broken above)</text>
  <rect x="40" y="459.614111" width="561.290323" height="76.463067" rx="6.55868" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="61.290323" y="506.237926" font-size="20.898796" fill="var(--text)" font-family="Courier New, monospace">COPY . .</text>
  <rect x="610.967742" y="459.614111" width="629.032258" height="76.463067" rx="6.55868" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630.322581" y="506.237926" font-family="Arial, sans-serif" font-size="20.898796" fill="var(--danger-accent)">INVALIDATED (source code changes)</text>
  <rect x="40" y="543.536933" width="561.290323" height="76.463067" rx="6.55868" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="61.290323" y="590.160749" font-size="20.898796" fill="var(--text)" font-family="Courier New, monospace">RUN npm run build</text>
  <rect x="610.967742" y="543.536933" width="629.032258" height="76.463067" rx="6.55868" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630.322581" y="590.160749" font-family="Arial, sans-serif" font-size="20.898796" fill="var(--danger-accent)">INVALIDATED (cache broken above)</text>
</svg>
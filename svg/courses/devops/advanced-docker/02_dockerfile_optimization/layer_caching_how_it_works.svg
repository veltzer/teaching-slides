<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Header row -->
  <rect x="20" y="20" width="580" height="80" rx="4" fill="url(#grad-accent)"/>
  <text x="310" y="68" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">Dockerfile Instruction</text>
  <rect x="610" y="20" width="650" height="80" rx="4" fill="url(#grad-accent)"/>
  <text x="935" y="68" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">Cache Behavior</text>
  <!-- Row 1: cached -->
  <rect x="20" y="110" width="580" height="82" rx="4" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5"/>
  <text x="42" y="160" font-family="monospace" font-size="22" fill="#222222">FROM ubuntu:22.04</text>
  <rect x="610" y="110" width="650" height="82" rx="4" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="630" y="160" font-family="Arial, sans-serif" font-size="22" fill="#1565c0">Cached if image exists</text>
  <!-- Row 2: cached -->
  <rect x="20" y="200" width="580" height="82" rx="4" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5"/>
  <text x="42" y="250" font-family="monospace" font-size="22" fill="#222222">RUN apt-get update</text>
  <rect x="610" y="200" width="650" height="82" rx="4" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="630" y="250" font-family="Arial, sans-serif" font-size="22" fill="#1565c0">Cached if previous layers unchanged</text>
  <!-- Row 3: invalidated -->
  <rect x="20" y="290" width="580" height="82" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="42" y="340" font-family="monospace" font-size="22" fill="#222222">COPY package.json .</text>
  <rect x="610" y="290" width="650" height="82" rx="4" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
  <text x="630" y="340" font-family="Arial, sans-serif" font-size="22" fill="#c62828">INVALIDATED if file changed</text>
  <!-- Row 4: invalidated -->
  <rect x="20" y="380" width="580" height="82" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="42" y="430" font-family="monospace" font-size="22" fill="#222222">RUN npm install</text>
  <rect x="610" y="380" width="650" height="82" rx="4" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
  <text x="630" y="430" font-family="Arial, sans-serif" font-size="22" fill="#c62828">INVALIDATED (cache broken above)</text>
  <!-- Row 5: invalidated -->
  <rect x="20" y="470" width="580" height="82" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="42" y="520" font-family="monospace" font-size="22" fill="#222222">COPY . .</text>
  <rect x="610" y="470" width="650" height="82" rx="4" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
  <text x="630" y="520" font-family="Arial, sans-serif" font-size="22" fill="#c62828">INVALIDATED (source code changes)</text>
  <!-- Row 6: invalidated -->
  <rect x="20" y="560" width="580" height="82" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="42" y="610" font-family="monospace" font-size="22" fill="#222222">RUN npm run build</text>
  <rect x="610" y="560" width="650" height="82" rx="4" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
  <text x="630" y="610" font-family="Arial, sans-serif" font-size="22" fill="#c62828">INVALIDATED (cache broken above)</text>
</svg>

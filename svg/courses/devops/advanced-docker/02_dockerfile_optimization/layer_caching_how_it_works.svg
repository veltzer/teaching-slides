<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="561.290323" height="74.598013" rx="6.55868" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="320.645161" y="84.758761" font-family="Arial, sans-serif" font-size="22.798627" font-weight="bold" fill="var(--bg)" text-anchor="middle">Dockerfile Instruction</text>
  <rect x="610.967742" y="40" width="629.032258" height="74.598013" rx="6.55868" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="925.483871" y="84.758761" font-family="Arial, sans-serif" font-size="22.798627" font-weight="bold" fill="var(--bg)" text-anchor="middle">Cache Behavior</text>
  <rect x="40" y="123.922822" width="561.290323" height="76.463067" rx="6.55868" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="61.290323" y="170.546638" font-family="monospace" font-size="20.898796" fill="var(--text)">FROM ubuntu:22.04</text>
  <rect x="610.967742" y="123.922822" width="629.032258" height="76.463067" rx="6.55868" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630.322581" y="170.546638" font-family="Arial, sans-serif" font-size="20.898796" fill="var(--primary-accent)">Cached if image exists</text>
  <rect x="40" y="207.845644" width="561.290323" height="76.463067" rx="6.55868" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="61.290323" y="254.46946" font-family="monospace" font-size="20.898796" fill="var(--text)">RUN apt-get update</text>
  <rect x="610.967742" y="207.845644" width="629.032258" height="76.463067" rx="6.55868" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630.322581" y="254.46946" font-family="Arial, sans-serif" font-size="20.898796" fill="var(--primary-accent)">Cached if previous layers unchanged</text>
  <rect x="40" y="291.768466" width="561.290323" height="76.463067" rx="6.55868" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="61.290323" y="338.392282" font-family="monospace" font-size="20.898796" fill="var(--text)">COPY package.json .</text>
  <rect x="610.967742" y="291.768466" width="629.032258" height="76.463067" rx="6.55868" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630.322581" y="338.392282" font-family="Arial, sans-serif" font-size="20.898796" fill="var(--danger-accent)">INVALIDATED if file changed</text>
  <rect x="40" y="375.691289" width="561.290323" height="76.463067" rx="6.55868" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="61.290323" y="422.315104" font-family="monospace" font-size="20.898796" fill="var(--text)">RUN npm install</text>
  <rect x="610.967742" y="375.691289" width="629.032258" height="76.463067" rx="6.55868" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630.322581" y="422.315104" font-family="Arial, sans-serif" font-size="20.898796" fill="var(--danger-accent)">INVALIDATED (cache broken above)</text>
  <rect x="40" y="459.614111" width="561.290323" height="76.463067" rx="6.55868" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="61.290323" y="506.237926" font-family="monospace" font-size="20.898796" fill="var(--text)">COPY . .</text>
  <rect x="610.967742" y="459.614111" width="629.032258" height="76.463067" rx="6.55868" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630.322581" y="506.237926" font-family="Arial, sans-serif" font-size="20.898796" fill="var(--danger-accent)">INVALIDATED (source code changes)</text>
  <rect x="40" y="543.536933" width="561.290323" height="76.463067" rx="6.55868" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="61.290323" y="590.160749" font-family="monospace" font-size="20.898796" fill="var(--text)">RUN npm run build</text>
  <rect x="610.967742" y="543.536933" width="629.032258" height="76.463067" rx="6.55868" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630.322581" y="590.160749" font-family="Arial, sans-serif" font-size="20.898796" fill="var(--danger-accent)">INVALIDATED (cache broken above)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#1a1a2e"/>
  <!-- Docker whale body -->
  <ellipse cx="380" cy="220" rx="140" ry="60" fill="#0db7ed" opacity="0.7"/>
  <!-- Whale tail -->
  <path d="M240,220 Q200,160 220,120 Q240,140 260,180" fill="#0db7ed" opacity="0.6"/>
  <!-- Containers on whale (stacked) -->
  <rect x="280" y="150" width="35" height="30" rx="3" fill="#e8e8e8" stroke="#0db7ed" stroke-width="2" opacity="0.8"/>
  <rect x="320" y="150" width="35" height="30" rx="3" fill="#e8e8e8" stroke="#0db7ed" stroke-width="2" opacity="0.8"/>
  <rect x="360" y="150" width="35" height="30" rx="3" fill="#e8e8e8" stroke="#0db7ed" stroke-width="2" opacity="0.8"/>
  <rect x="400" y="150" width="35" height="30" rx="3" fill="#e8e8e8" stroke="#0db7ed" stroke-width="2" opacity="0.8"/>
  <rect x="300" y="115" width="35" height="30" rx="3" fill="#e8e8e8" stroke="#0db7ed" stroke-width="2" opacity="0.8"/>
  <rect x="340" y="115" width="35" height="30" rx="3" fill="#e8e8e8" stroke="#0db7ed" stroke-width="2" opacity="0.8"/>
  <rect x="380" y="115" width="35" height="30" rx="3" fill="#e8e8e8" stroke="#0db7ed" stroke-width="2" opacity="0.8"/>
  <rect x="320" y="80" width="35" height="30" rx="3" fill="#e8e8e8" stroke="#0db7ed" stroke-width="2" opacity="0.8"/>
  <rect x="360" y="80" width="35" height="30" rx="3" fill="#e8e8e8" stroke="#0db7ed" stroke-width="2" opacity="0.8"/>
  <!-- Network overlay lines -->
  <line x1="550" y1="100" x2="700" y2="100" stroke="#845ef7" stroke-width="2" opacity="0.4" stroke-dasharray="6,4"/>
  <line x1="550" y1="140" x2="700" y2="140" stroke="#845ef7" stroke-width="2" opacity="0.4" stroke-dasharray="6,4"/>
  <line x1="550" y1="180" x2="700" y2="180" stroke="#845ef7" stroke-width="2" opacity="0.4" stroke-dasharray="6,4"/>
  <!-- Orchestration nodes -->
  <circle cx="625" cy="100" r="15" fill="#845ef7" opacity="0.6"/>
  <circle cx="580" cy="140" r="15" fill="#845ef7" opacity="0.6"/>
  <circle cx="670" cy="180" r="15" fill="#845ef7" opacity="0.6"/>
  <line x1="625" y1="115" x2="580" y2="125" stroke="#845ef7" stroke-width="2" opacity="0.4"/>
  <line x1="580" y1="155" x2="670" y2="165" stroke="#845ef7" stroke-width="2" opacity="0.4"/>
  <!-- Gear for advanced -->
  <circle cx="650" cy="280" r="30" fill="none" stroke="#ffd43b" stroke-width="3" opacity="0.5"/>
  <circle cx="650" cy="280" r="12" fill="#ffd43b" opacity="0.3"/>
  <rect x="646" y="245" width="8" height="12" fill="#ffd43b" opacity="0.5" rx="2"/>
  <rect x="646" y="303" width="8" height="12" fill="#ffd43b" opacity="0.5" rx="2"/>
  <rect x="615" y="276" width="12" height="8" fill="#ffd43b" opacity="0.5" rx="2"/>
  <rect x="673" y="276" width="12" height="8" fill="#ffd43b" opacity="0.5" rx="2"/>
  <!-- Title -->
  <text x="400" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#adb5bd" letter-spacing="3">ADVANCED DOCKER</text>
</svg>

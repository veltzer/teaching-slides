<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <ellipse cx="609.9999" cy="359" rx="210" ry="77.3333" fill="var(--primary-fill)" opacity="0.75" />
  <path d="M 400 359 Q 339.9999 272 370 214 Q 400 243 430 301" fill="var(--primary-fill)" opacity="0.65" />
  <rect x="460" y="257.5" width="52.5" height="43.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" opacity="0.9" />
  <rect x="520" y="257.5" width="52.5" height="43.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" opacity="0.9" />
  <rect x="580" y="257.5" width="52.5" height="43.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" opacity="0.9" />
  <rect x="640" y="257.5" width="52.5" height="43.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" opacity="0.9" />
  <rect x="490" y="206.75" width="52.5" height="43.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" opacity="0.9" />
  <rect x="550" y="206.75" width="52.5" height="43.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" opacity="0.9" />
  <rect x="609.9999" y="206.75" width="52.5" height="43.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" opacity="0.9" />
  <rect x="520" y="156" width="52.5" height="43.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" opacity="0.9" />
  <rect x="580" y="156" width="52.5" height="43.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" opacity="0.9" />
  <line x1="865" y1="185" x2="1090" y2="185" stroke="var(--primary-border)" stroke-width="2" opacity="0.4" stroke-dasharray="8.8889 5.3333" />
  <line x1="865" y1="243" x2="1090" y2="243" stroke="var(--primary-border)" stroke-width="2" opacity="0.4" stroke-dasharray="8.8889 5.3333" />
  <line x1="865" y1="301" x2="1090" y2="301" stroke="var(--primary-border)" stroke-width="2" opacity="0.4" stroke-dasharray="8.8889 5.3333" />
  <circle cx="977.5" cy="185" r="20.8566" fill="var(--primary-fill)" opacity="0.55" />
  <circle cx="910" cy="243" r="20.8566" fill="var(--primary-fill)" opacity="0.55" />
  <circle cx="1045" cy="301" r="20.8566" fill="var(--primary-fill)" opacity="0.55" />
  <line x1="977.5" y1="206.75" x2="910" y2="221.25" stroke="var(--primary-border)" stroke-width="2" opacity="0.4" />
  <line x1="910" y1="264.75" x2="1045" y2="279.25" stroke="var(--primary-border)" stroke-width="2" opacity="0.4" />
  <circle cx="1014.9999" cy="446" r="41.7133" fill="none" stroke="var(--surface)" stroke-width="3.5556" opacity="0.45" />
  <circle cx="1014.9999" cy="446" r="16.5115" fill="var(--surface)" opacity="0.25" />
  <text x="640" y="545.8889" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.3328" fill="var(--border)" letter-spacing="4">ADVANCED DOCKER</text>
</svg>
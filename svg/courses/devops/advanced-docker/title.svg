  <rect x="512" y="240" width="49.7778" height="48" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" opacity="0.9" />
  <rect x="568.8889" y="240" width="49.7778" height="48" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" opacity="0.9" />
  <rect x="426.6667" y="184" width="49.7778" height="48" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" opacity="0.9" />
  <rect x="483.5556" y="184" width="49.7778" height="48" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" opacity="0.9" />
  <rect x="540.4444" y="184" width="49.7778" height="48" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" opacity="0.9" />
  <rect x="455.1111" y="128" width="49.7778" height="48" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" opacity="0.9" />
  <rect x="512" y="128" width="49.7778" height="48" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" opacity="0.9" />
  <line x1="782.2222" y1="160" x2="995.5556" y2="160" stroke="var(--primary-border)" stroke-width="2" opacity="0.4" stroke-dasharray="8.8889 5.3333" />
  <line x1="782.2222" y1="224" x2="995.5556" y2="224" stroke="var(--primary-border)" stroke-width="2" opacity="0.4" stroke-dasharray="8.8889 5.3333" />
  <line x1="782.2222" y1="288" x2="995.5556" y2="288" stroke="var(--primary-border)" stroke-width="2" opacity="0.4" stroke-dasharray="8.8889 5.3333" />
  <circle cx="888.8889" cy="160" r="21.3333" fill="var(--primary-fill)" opacity="0.55" />

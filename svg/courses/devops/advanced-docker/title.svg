  <circle cx="952.8889" cy="288" r="21.3333" fill="var(--primary-fill)" opacity="0.55" />
  <line x1="888.8889" y1="184" x2="824.8889" y2="200" stroke="var(--primary-border)" stroke-width="2" opacity="0.4" />
  <line x1="824.8889" y1="248" x2="952.8889" y2="264" stroke="var(--primary-border)" stroke-width="2" opacity="0.4" />
  <circle cx="924.4444" cy="448" r="42.6667" fill="none" stroke="var(--surface)" stroke-width="3.5556" opacity="0.45" />
  <circle cx="924.4444" cy="448" r="16.8889" fill="var(--surface)" opacity="0.25" />
  <text x="568.8889" y="558.2222" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.8889" fill="var(--border)" letter-spacing="4">ADVANCED DOCKER</text>

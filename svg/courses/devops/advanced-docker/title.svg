<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#1a1a2e"/>
  <!-- whale body -->
  <ellipse cx="608" cy="396" rx="224" ry="96" fill="#1e88e5" opacity="0.75"/>
  <!-- whale tail -->
  <path d="M 384 396 Q 320 288 352 216 Q 384 252 416 324" fill="#1e88e5" opacity="0.65"/>
  <!-- container boxes row 1 -->
  <rect x="448" y="270" width="56" height="54" rx="5" fill="#f2f2f2" stroke="#1e88e5" stroke-width="3" opacity="0.9"/>
  <rect x="512" y="270" width="56" height="54" rx="5" fill="#f2f2f2" stroke="#1e88e5" stroke-width="3" opacity="0.9"/>
  <rect x="576" y="270" width="56" height="54" rx="5" fill="#f2f2f2" stroke="#1e88e5" stroke-width="3" opacity="0.9"/>
  <rect x="640" y="270" width="56" height="54" rx="5" fill="#f2f2f2" stroke="#1e88e5" stroke-width="3" opacity="0.9"/>
  <!-- container boxes row 2 -->
  <rect x="480" y="207" width="56" height="54" rx="5" fill="#f2f2f2" stroke="#1e88e5" stroke-width="3" opacity="0.9"/>
  <rect x="544" y="207" width="56" height="54" rx="5" fill="#f2f2f2" stroke="#1e88e5" stroke-width="3" opacity="0.9"/>
  <rect x="608" y="207" width="56" height="54" rx="5" fill="#f2f2f2" stroke="#1e88e5" stroke-width="3" opacity="0.9"/>
  <!-- container boxes row 3 -->
  <rect x="512" y="144" width="56" height="54" rx="5" fill="#f2f2f2" stroke="#1e88e5" stroke-width="3" opacity="0.9"/>
  <rect x="576" y="144" width="56" height="54" rx="5" fill="#f2f2f2" stroke="#1e88e5" stroke-width="3" opacity="0.9"/>
  <!-- network graph decoration -->
  <line x1="880" y1="180" x2="1120" y2="180" stroke="#1565c0" stroke-width="3" opacity="0.4" stroke-dasharray="10 6"/>
  <line x1="880" y1="252" x2="1120" y2="252" stroke="#1565c0" stroke-width="3" opacity="0.4" stroke-dasharray="10 6"/>
  <line x1="880" y1="324" x2="1120" y2="324" stroke="#1565c0" stroke-width="3" opacity="0.4" stroke-dasharray="10 6"/>
  <circle cx="1000" cy="180" r="24" fill="#1e88e5" opacity="0.55"/>
  <circle cx="928" cy="252" r="24" fill="#1e88e5" opacity="0.55"/>
  <circle cx="1072" cy="324" r="24" fill="#1e88e5" opacity="0.55"/>
  <line x1="1000" y1="207" x2="928" y2="225" stroke="#1565c0" stroke-width="3" opacity="0.4"/>
  <line x1="928" y1="279" x2="1072" y2="297" stroke="#1565c0" stroke-width="3" opacity="0.4"/>
  <!-- gear / settings accent -->
  <circle cx="1040" cy="504" r="48" fill="none" stroke="#f2f2f2" stroke-width="4" opacity="0.45"/>
  <circle cx="1040" cy="504" r="19" fill="#f2f2f2" opacity="0.25"/>
  <text x="640" y="628" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#b0bec5" letter-spacing="4">ADVANCED DOCKER</text>

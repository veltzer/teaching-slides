  <rect x="30" y="255" width="420" height="35" rx="5" fill="#fff" stroke="#dc3545" stroke-width="1.5"/>
  <text x="50" y="278" font-size="13" fill="#333">6. Resource exhaustion (DoS)</text>
  <rect x="30" y="295" width="420" height="35" rx="5" fill="#fff" stroke="#dc3545" stroke-width="1.5"/>
  <text x="50" y="318" font-size="13" fill="#333">7. Misconfigured volumes</text>
  <rect x="30" y="335" width="420" height="25" rx="5" fill="#fff" stroke="#dc3545" stroke-width="1.5"/>
  <text x="50" y="353" font-size="13" fill="#333">8. Privileged containers</text>

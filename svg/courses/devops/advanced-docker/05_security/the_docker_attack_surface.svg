<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="460" height="360" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="240" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#dc3545">Docker Attack Vectors</text>
  <rect x="30" y="55" width="420" height="35" rx="5" fill="#fff" stroke="#dc3545" stroke-width="1.5"/>
  <text x="50" y="78" font-size="13" fill="#333">1. Docker daemon (root access)</text>
  <rect x="30" y="95" width="420" height="35" rx="5" fill="#fff" stroke="#dc3545" stroke-width="1.5"/>
  <text x="50" y="118" font-size="13" fill="#333">2. Container escape (kernel exploits)</text>
  <rect x="30" y="135" width="420" height="35" rx="5" fill="#fff" stroke="#dc3545" stroke-width="1.5"/>
  <text x="50" y="158" font-size="13" fill="#333">3. Malicious images (supply chain)</text>
  <rect x="30" y="175" width="420" height="35" rx="5" fill="#fff" stroke="#dc3545" stroke-width="1.5"/>
  <text x="50" y="198" font-size="13" fill="#333">4. Network exposure</text>

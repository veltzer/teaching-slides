<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Outer card -->
  <rect x="26" y="20" width="1228" height="640" rx="10" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <!-- Title -->
  <text x="640" y="72" text-anchor="middle" font-size="32" font-weight="bold" fill="#1565c0">Docker Content Trust</text>
  <!-- Root Key -->
  <rect x="106" y="110" width="540" height="80" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2" filter="url(#shadow)"/>
  <text x="376" y="158" text-anchor="middle" font-size="26" fill="#333333">Root Key (offline)</text>
  <line x1="376" y1="190" x2="376" y2="232" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <!-- Repository Key -->
  <rect x="160" y="232" width="540" height="80" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="430" y="280" text-anchor="middle" font-size="26" fill="#333333">Repository Key (per repo)</text>
  <line x1="430" y1="312" x2="430" y2="354" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <!-- Tag signatures -->
  <rect x="213" y="354" width="540" height="72" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="483" y="397" text-anchor="middle" font-size="24" fill="#333333">Tag signatures</text>
  <!-- Delegation Keys -->
  <rect x="750" y="232" width="450" height="80" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="975" y="280" text-anchor="middle" font-size="26" fill="#1565c0">Delegation Keys</text>
  <line x1="975" y1="312" x2="975" y2="354" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <!-- Sign specific tags -->
  <rect x="773" y="354" width="427" height="72" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="986" y="397" text-anchor="middle" font-size="24" fill="#333333">Sign specific tags</text>
  <!-- Timestamp Key -->
  <rect x="106" y="470" width="1068" height="110" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="518" text-anchor="middle" font-size="26" fill="#1565c0">Timestamp Key (managed by Notary)</text>
  <text x="640" y="560" text-anchor="middle" font-size="22" fill="#555555">Freshness guarantees</text>
</svg>

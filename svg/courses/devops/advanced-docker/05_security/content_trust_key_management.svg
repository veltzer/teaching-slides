<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="460" height="320" rx="5" fill="#f9f9f9" stroke="#4a90e2" stroke-width="2"/>
  <text x="240" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a90e2">Docker Content Trust</text>
  <rect x="40" y="60" width="200" height="40" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="140" y="85" text-anchor="middle" font-size="13" fill="#333">Root Key (offline)</text>
  <line x1="140" y1="100" x2="140" y2="120" stroke="#4a90e2" stroke-width="1.5"/>
  <rect x="60" y="120" width="200" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="160" y="145" text-anchor="middle" font-size="13" fill="#333">Repository Key (per repo)</text>
  <line x1="160" y1="160" x2="160" y2="180" stroke="#4a90e2" stroke-width="1.5"/>
  <rect x="80" y="180" width="200" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="180" y="203" text-anchor="middle" font-size="12" fill="#333">Tag signatures</text>
  <rect x="280" y="120" width="170" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="365" y="145" text-anchor="middle" font-size="13" fill="#333">Delegation Keys</text>
  <line x1="365" y1="160" x2="365" y2="180" stroke="#28a745" stroke-width="1.5"/>
  <rect x="290" y="180" width="160" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="370" y="203" text-anchor="middle" font-size="12" fill="#333">Sign specific tags</text>
  <rect x="40" y="240" width="400" height="55" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="240" y="263" text-anchor="middle" font-size="13" fill="#333">Timestamp Key (managed by Notary)</text>
  <text x="240" y="283" text-anchor="middle" font-size="12" fill="#666">Freshness guarantees</text>
</svg>

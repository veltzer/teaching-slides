<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="26.6667" y="17.7778" width="480" height="337.7778" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="266.6667" y="48" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--danger-accent)">Traditional: Binary root/non-root</text>
  <rect x="53.3333" y="65.7778" width="426.6667" height="106.6667" rx="6" fill="var(--danger-accent)" filter="url(#shadow)" />
  <text x="266.6667" y="108.4444" text-anchor="middle" font-family="sans-serif" font-size="19.5556" font-weight="bold" fill="var(--bg)">root (uid=0)</text>
  <text x="266.6667" y="133.3333" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--danger-accent)">ALL privileges — bind port 80, load modules,</text>
  <text x="266.6667" y="151.1111" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--danger-accent)">raw sockets, kill any process, …</text>
  <rect x="53.3333" y="192" width="426.6667" height="71.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="266.6667" y="232.8889" text-anchor="middle" font-family="sans-serif" font-size="19.5556" font-weight="bold" fill="var(--text-faint)">non-root</text>
  <text x="266.6667" y="250.6667" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-faint)">NO privileges — can do almost nothing privileged</text>
  <text x="266.6667" y="302.2222" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--danger-accent)" font-weight="bold">Problem: all-or-nothing</text>
  <text x="266.6667" y="323.5556" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Containers running as root have full host access</text>
  <rect x="551.1111" y="17.7778" width="560" height="515.5556" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="831.1111" y="48" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--ok-accent)">Capabilities: Fine-grained privileges</text>
  <rect x="576" y="60.4444" width="506.6667" height="106.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="622.2222" y="85.3333" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--primary-accent)">Network</text>
  <text x="622.2222" y="104.8889" font-family="monospace" font-size="11.5556" fill="var(--text-muted)">NET_BIND_SERVICE  — bind ports &lt; 1024</text>
  <text x="622.2222" y="122.6667" font-family="monospace" font-size="11.5556" fill="var(--text-muted)">NET_RAW           — raw/packet sockets (⚠ risky)</text>
  <text x="622.2222" y="140.4444" font-family="monospace" font-size="11.5556" fill="var(--text-muted)">NET_ADMIN         — network config (⚠ risky)</text>
  <text x="1013.3333" y="115.5556" text-anchor="middle" font-family="sans-serif" font-size="19.5556" fill="var(--ok-accent)">🟢</text>
  <rect x="576" y="177.7778" width="506.6667" height="106.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="622.2222" y="202.6667" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--warn-accent)">System</text>
  <text x="622.2222" y="222.2222" font-family="monospace" font-size="11.5556" fill="var(--text-muted)">SYS_ADMIN         — many ops (⚠⚠ very risky)</text>
  <text x="622.2222" y="240" font-family="monospace" font-size="11.5556" fill="var(--text-muted)">SYS_PTRACE        — debug other processes</text>
  <text x="622.2222" y="257.7778" font-family="monospace" font-size="11.5556" fill="var(--text-muted)">SYS_MODULE        — load kernel modules (⚠⚠)</text>
  <text x="1013.3333" y="232.8889" text-anchor="middle" font-family="sans-serif" font-size="19.5556" fill="var(--danger-accent)">🔴</text>
  <rect x="576" y="295.1111" width="506.6667" height="88.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="622.2222" y="320" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--primary-accent)">Process</text>
  <text x="622.2222" y="339.5556" font-family="monospace" font-size="11.5556" fill="var(--text-muted)">KILL              — send signals to any process</text>
  <text x="622.2222" y="357.3333" font-family="monospace" font-size="11.5556" fill="var(--text-muted)">SETUID / SETGID   — change user/group id</text>
  <text x="1013.3333" y="336" text-anchor="middle" font-family="sans-serif" font-size="19.5556" fill="var(--warn-accent)">🟡</text>
  <rect x="576" y="396.4444" width="506.6667" height="106.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="831.1111" y="421.3333" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--primary-accent)">Docker: drop all, add only what's needed</text>
  <text x="593.7778" y="442.6667" font-family="monospace" font-size="11.5556" fill="var(--text)">--cap-drop ALL --cap-add NET_BIND_SERVICE</text>
  <text x="593.7778" y="460.4444" font-family="monospace" font-size="11.5556" fill="var(--text)">securityContext:</text>
  <text x="593.7778" y="478.2222" font-family="monospace" font-size="11.5556" fill="var(--text)">  capabilities:</text>
  <text x="593.7778" y="494.2222" font-family="monospace" font-size="11.5556" fill="var(--primary-accent)">    drop: ["ALL"]   add: ["NET_BIND_SERVICE"]</text>
  <rect x="26.6667" y="549.3333" width="1084.4444" height="37.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="568.8889" y="572.4444" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--primary-accent)">Default Docker containers run with ~14 capabilities. Drop ALL and add back only what the app needs.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="68.125" y="56.1111" width="506.25" height="306.1111" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="321.25" y="83.5" text-anchor="middle" font-family="sans-serif" font-size="17.3806" font-weight="bold" fill="var(--danger-accent)">Traditional: Binary root/non-root</text>
  <rect x="96.25" y="99.6111" width="450" height="96.6667" rx="6" fill="var(--danger-accent)" filter="url(#shadow)" />
  <text x="321.25" y="138.2777" text-anchor="middle" font-family="sans-serif" font-size="19.1186" font-weight="bold" fill="var(--bg)">root (uid=0)</text>
  <text x="321.25" y="160.8333" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--danger-accent)">ALL privileges — bind port 80, load modules,</text>
  <text x="321.25" y="176.9444" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--danger-accent)">raw sockets, kill any process, …</text>
  <rect x="96.25" y="214" width="450" height="64.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="321.25" y="251.0556" text-anchor="middle" font-family="sans-serif" font-size="19.1186" font-weight="bold" fill="var(--text-faint)">non-root</text>
  <text x="321.25" y="267.1667" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text-faint)">NO privileges — can do almost nothing privileged</text>
  <text x="321.25" y="313.8889" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--danger-accent)" font-weight="bold">Problem: all-or-nothing</text>
  <text x="321.25" y="333.2223" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">Containers running as root have full host access</text>
  <rect x="621.25" y="56.1111" width="590.625" height="467.2223" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="916.5625" y="83.5" text-anchor="middle" font-family="sans-serif" font-size="17.3806" font-weight="bold" fill="var(--ok-accent)">Capabilities: Fine-grained privileges</text>
  <rect x="647.5" y="94.7777" width="534.375" height="96.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="696.25" y="117.3333" font-family="sans-serif" font-size="13.0354" font-weight="bold" fill="var(--primary-accent)">Network</text>
  <text x="696.25" y="135.0556" font-family="monospace" font-size="11.2974" fill="var(--text-muted)">NET_BIND_SERVICE  — bind ports &lt; 1024</text>
  <text x="696.25" y="151.1667" font-family="monospace" font-size="11.2974" fill="var(--text-muted)">NET_RAW           — raw/packet sockets (⚠ risky)</text>
  <text x="696.25" y="167.2777" font-family="monospace" font-size="11.2974" fill="var(--text-muted)">NET_ADMIN         — network config (⚠ risky)</text>
  <text x="1108.7499" y="144.7223" text-anchor="middle" font-family="sans-serif" font-size="19.1186" fill="var(--ok-accent)">🟢</text>
  <rect x="647.5" y="201.1111" width="534.375" height="96.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="696.25" y="223.6667" font-family="sans-serif" font-size="13.0354" font-weight="bold" fill="var(--warn-accent)">System</text>
  <text x="696.25" y="241.3889" font-family="monospace" font-size="11.2974" fill="var(--text-muted)">SYS_ADMIN         — many ops (⚠⚠ very risky)</text>
  <text x="696.25" y="257.5" font-family="monospace" font-size="11.2974" fill="var(--text-muted)">SYS_PTRACE        — debug other processes</text>
  <text x="696.25" y="273.6111" font-family="monospace" font-size="11.2974" fill="var(--text-muted)">SYS_MODULE        — load kernel modules (⚠⚠)</text>
  <text x="1108.7499" y="251.0556" text-anchor="middle" font-family="sans-serif" font-size="19.1186" fill="var(--danger-accent)">🔴</text>
  <rect x="647.5" y="307.4444" width="534.375" height="80.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="696.25" y="330" font-family="sans-serif" font-size="13.0354" font-weight="bold" fill="var(--primary-accent)">Process</text>
  <text x="696.25" y="347.7223" font-family="monospace" font-size="11.2974" fill="var(--text-muted)">KILL              — send signals to any process</text>
  <text x="696.25" y="363.8333" font-family="monospace" font-size="11.2974" fill="var(--text-muted)">SETUID / SETGID   — change user/group id</text>
  <text x="1108.7499" y="344.5" text-anchor="middle" font-family="sans-serif" font-size="19.1186" fill="var(--warn-accent)">🟡</text>
  <rect x="647.5" y="399.2777" width="534.375" height="96.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="916.5625" y="421.8333" text-anchor="middle" font-family="sans-serif" font-size="13.0354" font-weight="bold" fill="var(--primary-accent)">Docker: drop all, add only what's needed</text>
  <text x="666.25" y="441.1667" font-family="monospace" font-size="11.2974" fill="var(--text)">--cap-drop ALL --cap-add NET_BIND_SERVICE</text>
  <text x="666.25" y="457.2777" font-family="monospace" font-size="11.2974" fill="var(--text)">securityContext:</text>
  <text x="666.25" y="473.3889" font-family="monospace" font-size="11.2974" fill="var(--text)">  capabilities:</text>
  <text x="666.25" y="487.8889" font-family="monospace" font-size="11.2974" fill="var(--primary-accent)">    drop: ["ALL"]   add: ["NET_BIND_SERVICE"]</text>
  <rect x="68.125" y="537.8333" width="1143.7499" height="33.8333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="558.7777" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--primary-accent)">Default Docker containers run with ~14 capabilities. Drop ALL and add back only what the app needs.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Traditional model (left) -->
  <rect x="30" y="20" width="540" height="380" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="300" y="54" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#c62828">Traditional: Binary root/non-root</text>

  <rect x="60" y="74" width="480" height="120" rx="6" fill="#c62828" filter="url(#shadow)"/>
  <text x="300" y="122" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff">root (uid=0)</text>
  <text x="300" y="150" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#ffcdd2">ALL privileges — bind port 80, load modules,</text>
  <text x="300" y="170" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#ffcdd2">raw sockets, kill any process, …</text>

  <rect x="60" y="216" width="480" height="80" rx="6" fill="#f2f2f2" stroke="#9e9e9e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="300" y="262" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#9e9e9e">non-root</text>
  <text x="300" y="282" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#9e9e9e">NO privileges — can do almost nothing privileged</text>

  <text x="300" y="340" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#c62828" font-weight="bold">Problem: all-or-nothing</text>
  <text x="300" y="364" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555555">Containers running as root have full host access</text>

  <!-- Capabilities model (right) -->
  <rect x="620" y="20" width="630" height="580" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="935" y="54" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2e7d32">Capabilities: Fine-grained privileges</text>

  <!-- Capability groups -->
  <rect x="648" y="68" width="570" height="120" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="700" y="96" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1565c0">Network</text>
  <text x="700" y="118" font-family="monospace" font-size="13" fill="#555555">NET_BIND_SERVICE  — bind ports &lt; 1024</text>
  <text x="700" y="138" font-family="monospace" font-size="13" fill="#555555">NET_RAW           — raw/packet sockets (⚠ risky)</text>
  <text x="700" y="158" font-family="monospace" font-size="13" fill="#555555">NET_ADMIN         — network config (⚠ risky)</text>
  <text x="1140" y="130" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2e7d32">🟢</text>

  <rect x="648" y="200" width="570" height="120" rx="6" fill="url(#grad-surface)" stroke="#e65100" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="700" y="228" font-family="sans-serif" font-size="15" font-weight="bold" fill="#e65100">System</text>
  <text x="700" y="250" font-family="monospace" font-size="13" fill="#555555">SYS_ADMIN         — many ops (⚠⚠ very risky)</text>
  <text x="700" y="270" font-family="monospace" font-size="13" fill="#555555">SYS_PTRACE        — debug other processes</text>
  <text x="700" y="290" font-family="monospace" font-size="13" fill="#555555">SYS_MODULE        — load kernel modules (⚠⚠)</text>
  <text x="1140" y="262" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#c62828">🔴</text>

  <rect x="648" y="332" width="570" height="100" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="700" y="360" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1565c0">Process</text>
  <text x="700" y="382" font-family="monospace" font-size="13" fill="#555555">KILL              — send signals to any process</text>
  <text x="700" y="402" font-family="monospace" font-size="13" fill="#555555">SETUID / SETGID   — change user/group id</text>
  <text x="1140" y="378" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#f9a825">🟡</text>

  <!-- Docker drop caps -->
  <rect x="648" y="446" width="570" height="120" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="935" y="474" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1565c0">Docker: drop all, add only what's needed</text>
  <text x="668" y="498" font-family="monospace" font-size="13" fill="#212121">--cap-drop ALL --cap-add NET_BIND_SERVICE</text>
  <text x="668" y="518" font-family="monospace" font-size="13" fill="#212121">securityContext:</text>
  <text x="668" y="538" font-family="monospace" font-size="13" fill="#212121">  capabilities:</text>
  <text x="668" y="556" font-family="monospace" font-size="13" fill="#1565c0">    drop: ["ALL"]   add: ["NET_BIND_SERVICE"]</text>

  <rect x="30" y="618" width="1220" height="42" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="640" y="644" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1565c0">Default Docker containers run with ~14 capabilities. Drop ALL and add back only what the app needs.</text>
</svg>

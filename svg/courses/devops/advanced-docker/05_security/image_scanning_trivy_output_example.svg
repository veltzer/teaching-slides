  <text x="415" y="305.0277" text-anchor="middle" font-size="17.3806" font-family="monospace" fill="var(--text)">CVE-2024-1235</text>
  <rect x="602.5" y="284.8889" width="150" height="29" rx="6" fill="var(--danger-accent)" />
  <text x="677.4999" y="305.0277" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--bg)">CRITICAL</text>
  <text x="902.5" y="305.0277" text-anchor="middle" font-size="17.3806" font-family="monospace" fill="var(--text)">3.0.11-1</text>
  <text x="1127.5" y="305.0277" text-anchor="middle" font-size="17.3806" font-family="monospace" fill="var(--primary-accent)">3.0.13-1</text>
  <rect x="58.75" y="326.7777" width="1162.5" height="48.3333" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="152.5" y="356.5833" text-anchor="middle" font-size="17.3806" font-family="monospace" fill="var(--text)">curl</text>
  <text x="415" y="356.5833" text-anchor="middle" font-size="17.3806" font-family="monospace" fill="var(--text)">CVE-2024-5678</text>

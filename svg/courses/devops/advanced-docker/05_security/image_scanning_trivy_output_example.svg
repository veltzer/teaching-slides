  <text x="902.5" y="408.1389" text-anchor="middle" font-size="17.3806" font-family="monospace" fill="var(--text)">1.2.13-1</text>
  <text x="1127.5" y="408.1389" text-anchor="middle" font-size="17.3806" font-family="monospace" fill="var(--primary-accent)">1.2.13-2</text>
  <rect x="58.75" y="172.1111" width="1162.5" height="254.5556" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />

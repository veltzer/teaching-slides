  <text x="77.5" y="123.7777" font-size="19.1186" font-family="monospace" fill="var(--text)">myapp:latest (debian 12.4)</text>
  <text x="77.5" y="151.1667" font-size="19.1186" font-weight="bold" fill="var(--danger-accent)">Total: 15 (HIGH: 10, CRITICAL: 5)</text>

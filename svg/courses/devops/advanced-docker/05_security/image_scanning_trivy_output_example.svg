  <text x="1127.5" y="202.7223" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--bg)">Fixed</text>
  <rect x="58.75" y="223.6667" width="1162.5" height="48.3333" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="152.5" y="253.4723" text-anchor="middle" font-size="17.3806" font-family="monospace" fill="var(--text)">libssl3</text>
  <text x="415" y="253.4723" text-anchor="middle" font-size="17.3806" font-family="monospace" fill="var(--text)">CVE-2024-1234</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="32.712175880442" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Host</text>
  <rect x="40" y="72.925845815299" width="449.999999680208" height="164.628918814479" rx="8.686685570237" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="265.000000479688" y="126.11355888408" text-anchor="middle" font-size="27.67954459838" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Container A</text>
  <text x="265.000000479688" y="164.104871512749" text-anchor="middle" font-size="22.646913316318" fill="var(--text-muted)" font-family="Arial, sans-serif">eth0</text>
  <text x="265.000000479688" y="199.563294970538" text-anchor="middle" font-size="22.646913316318" fill="var(--text)" font-family="Courier New, monospace">172.17.0.2</text>
  <rect x="790.000000319792" y="72.925845815299" width="449.999999680208" height="164.628918814479" rx="8.686685570237" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1014.999999520313" y="126.11355888408" text-anchor="middle" font-size="27.67954459838" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Container B</text>
  <text x="1014.999999520313" y="164.104871512749" text-anchor="middle" font-size="22.646913316318" fill="var(--text-muted)" font-family="Arial, sans-serif">eth0</text>
  <text x="1014.999999520313" y="199.563294970538" text-anchor="middle" font-size="22.646913316318" fill="var(--text)" font-family="Courier New, monospace">172.17.0.3</text>
  <line x1="265.000000479688" y1="237.554450568637" x2="265.000000479688" y2="326.200899889972" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="265.000000479688" y="316.069967529606" text-anchor="middle" font-size="20.130525128249" fill="var(--text-muted)" font-family="Arial, sans-serif">vethXXXX</text>
  <line x1="1014.999999520313" y1="237.554450568637" x2="1014.999999520313" y2="326.200899889972" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1014.999999520313" y="316.069967529606" text-anchor="middle" font-size="20.130525128249" fill="var(--text-muted)" font-family="Arial, sans-serif">vethYYYY</text>
  <rect x="40" y="338.864723953969" width="1199.9998656875" height="113.973782121813" rx="8.686685570237" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="394.58516916306" text-anchor="middle" font-size="30.195787692373" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">docker0 bridge</text>
  <text x="640" y="433.842769979786" text-anchor="middle" font-size="25.163300231631" fill="var(--primary-accent)" font-family="Courier New, monospace">172.17.0.1</text>
  <line x1="640" y1="452.838506075782" x2="640" y2="528.82097430255" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="239.999867393056" y="528.82097430255" width="799.999999147222" height="91.17902569745" rx="8.686685570237" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="583.274975559388" text-anchor="middle" font-size="27.67954459838" fill="var(--text)" font-family="Arial, sans-serif">eth0 (host) — NAT to external network</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="1200" height="580" rx="6.825104" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="83.999938" text-anchor="middle" font-size="25.701863" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Host</text>
  <rect x="170.944625" y="110.000002" width="351.791531" height="130.000075" rx="6.825104" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="346.840391" y="151.999954" text-anchor="middle" font-size="21.747739" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Container A</text>
  <text x="346.840391" y="181.99999" text-anchor="middle" font-size="17.793615" fill="var(--text-muted)" font-family="Arial, sans-serif">eth0</text>
  <text x="346.840391" y="209.999917" text-anchor="middle" font-size="17.793615" fill="var(--text)" font-family="Courier New, monospace">172.17.0.2</text>
  <rect x="757.263844" y="110.000002" width="351.791531" height="130.000075" rx="6.825104" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="933.159609" y="151.999954" text-anchor="middle" font-size="21.747739" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Container B</text>
  <text x="933.159609" y="181.99999" text-anchor="middle" font-size="17.793615" fill="var(--text-muted)" font-family="Arial, sans-serif">eth0</text>
  <text x="933.159609" y="209.999917" text-anchor="middle" font-size="17.793615" fill="var(--text)" font-family="Courier New, monospace">172.17.0.3</text>
  <line x1="346.840391" y1="239.999829" x2="346.840391" y2="309.999955" stroke="var(--primary-border)" stroke-width="2" />
  <text x="346.840391" y="302.000012" text-anchor="middle" font-size="15.816496" fill="var(--text-muted)" font-family="Arial, sans-serif">vethXXXX</text>
  <line x1="933.159609" y1="239.999829" x2="933.159609" y2="309.999955" stroke="var(--primary-border)" stroke-width="2" />
  <text x="933.159609" y="302.000012" text-anchor="middle" font-size="15.816496" fill="var(--text-muted)" font-family="Arial, sans-serif">vethYYYY</text>
  <rect x="170.944625" y="320.000009" width="938.110645" height="89.999985" rx="6.825104" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="363.999946" text-anchor="middle" font-size="23.724744" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">docker0 bridge</text>
  <text x="640" y="394.999913" text-anchor="middle" font-size="19.770733" fill="var(--primary-accent)" font-family="Courier New, monospace">172.17.0.1</text>
  <line x1="640" y1="409.999994" x2="640" y2="469.999942" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="327.296313" y="469.999942" width="625.407166" height="71.999988" rx="6.825104" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="512.999825" text-anchor="middle" font-size="21.747739" fill="var(--text)" font-family="Arial, sans-serif">eth0 (host) — NAT to external network</text>
</svg>
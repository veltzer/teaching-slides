  <rect x="790.000000319792" y="40" width="449.999999680208" height="174.537166821009" rx="8.944272038647" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1014.999999520313" y="96.388833842583" text-anchor="middle" font-size="28.500326711726" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Container B</text>
  <text x="1014.999999520313" y="136.666666666666" text-anchor="middle" font-size="23.318462709281" fill="var(--text-muted)" font-family="Arial, sans-serif">eth0</text>
  <text x="1014.999999520313" y="174.259167515417" text-anchor="middle" font-size="23.318462709281" fill="var(--text)" font-family="Courier New, monospace">172.17.0.3</text>
  <line x1="265.000000479688" y1="214.536833857991" x2="265.000000479688" y2="308.51850016975" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="265.000000479688" y="297.777834166675" text-anchor="middle" font-size="20.727456009781" fill="var(--text-muted)" font-family="Arial, sans-serif">vethXXXX</text>
  <line x1="1014.999999520313" y1="214.536833857991" x2="1014.999999520313" y2="308.51850016975" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1014.999999520313" y="297.777834166675" text-anchor="middle" font-size="20.727456009781" fill="var(--text-muted)" font-family="Arial, sans-serif">vethYYYY</text>
  <rect x="40" y="321.944500833343" width="1199.9998656875" height="120.833333333334" rx="8.944272038647" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="381.01850016975" text-anchor="middle" font-size="31.091184014671" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">docker0 bridge</text>
  <text x="640" y="422.638833171286" text-anchor="middle" font-size="25.909468098283" fill="var(--primary-accent)" font-family="Courier New, monospace">172.17.0.1</text>
  <line x1="640" y1="442.777834166676" x2="640" y2="523.333333333333" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="239.999867393056" y="523.333333333333" width="799.999999147222" height="96.666666666666" rx="8.944272038647" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="581.06466735337" text-anchor="middle" font-size="28.500326711726" fill="var(--text)" font-family="Arial, sans-serif">eth0 (host) — NAT to external network</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="23.1111" y="26.6667" width="1091.5556" height="515.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="568.8889" y="65.7778" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="var(--primary-accent)">Host</text>
  <rect x="142.2222" y="88.8889" width="320" height="115.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="302.2222" y="126.2222" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--primary-accent)">Container A</text>
  <text x="302.2222" y="152.8889" text-anchor="middle" font-size="16" fill="var(--text-muted)">eth0</text>
  <text x="302.2222" y="177.7778" text-anchor="middle" font-size="16" font-family="monospace" fill="var(--text)">172.17.0.2</text>
  <rect x="675.5556" y="88.8889" width="320" height="115.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="835.5556" y="126.2222" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--primary-accent)">Container B</text>
  <text x="835.5556" y="152.8889" text-anchor="middle" font-size="16" fill="var(--text-muted)">eth0</text>
  <text x="835.5556" y="177.7778" text-anchor="middle" font-size="16" font-family="monospace" fill="var(--text)">172.17.0.3</text>
  <line x1="302.2222" y1="204.4444" x2="302.2222" y2="266.6667" stroke="var(--primary-border)" stroke-width="2" />
  <text x="302.2222" y="259.5556" text-anchor="middle" font-size="14.2222" fill="var(--text-muted)">vethXXXX</text>
  <line x1="835.5556" y1="204.4444" x2="835.5556" y2="266.6667" stroke="var(--primary-border)" stroke-width="2" />
  <text x="835.5556" y="259.5556" text-anchor="middle" font-size="14.2222" fill="var(--text-muted)">vethYYYY</text>
  <rect x="142.2222" y="275.5556" width="853.3333" height="80" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="568.8889" y="314.6667" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="var(--bg)">docker0 bridge</text>
  <text x="568.8889" y="342.2222" text-anchor="middle" font-size="17.7778" font-family="monospace" fill="var(--primary-accent)">172.17.0.1</text>
  <line x1="568.8889" y1="355.5556" x2="568.8889" y2="408.8889" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="284.4444" y="408.8889" width="568.8889" height="64" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="568.8889" y="447.1111" text-anchor="middle" font-size="19.5556" fill="var(--text)">eth0 (host) — NAT to external network</text>
</svg>
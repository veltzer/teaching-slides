<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" rx="6.825104" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="640" y="83.999938" text-anchor="middle" font-size="25.701863" font-weight="bold" fill="var(--primary-accent)">Host</text>
  <rect x="170.944625" y="110.000002" width="351.791531" height="130.000075" rx="6.825104" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="346.840391" y="151.999954" text-anchor="middle" font-size="21.747739" font-weight="bold" fill="var(--primary-accent)">Container A</text>
  <text x="346.840391" y="181.99999" text-anchor="middle" font-size="17.793615" fill="var(--text-muted)">eth0</text>
  <text x="346.840391" y="209.999917" text-anchor="middle" font-size="17.793615" font-family="monospace" fill="var(--text)">172.17.0.2</text>
  <rect x="757.263844" y="110.000002" width="351.791531" height="130.000075" rx="6.825104" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="933.159609" y="151.999954" text-anchor="middle" font-size="21.747739" font-weight="bold" fill="var(--primary-accent)">Container B</text>
  <text x="933.159609" y="181.99999" text-anchor="middle" font-size="17.793615" fill="var(--text-muted)">eth0</text>
  <text x="933.159609" y="209.999917" text-anchor="middle" font-size="17.793615" font-family="monospace" fill="var(--text)">172.17.0.3</text>
  <line x1="346.840391" y1="239.999829" x2="346.840391" y2="309.999955" stroke="var(--primary-border)" stroke-width="2" />
  <text x="346.840391" y="302.000012" text-anchor="middle" font-size="15.816496" fill="var(--text-muted)">vethXXXX</text>
  <line x1="933.159609" y1="239.999829" x2="933.159609" y2="309.999955" stroke="var(--primary-border)" stroke-width="2" />
  <text x="933.159609" y="302.000012" text-anchor="middle" font-size="15.816496" fill="var(--text-muted)">vethYYYY</text>
  <rect x="170.944625" y="320.000009" width="938.110645" height="89.999985" rx="6.825104" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="363.999946" text-anchor="middle" font-size="23.724744" font-weight="bold" fill="var(--bg)">docker0 bridge</text>
  <text x="640" y="394.999913" text-anchor="middle" font-size="19.770733" font-family="monospace" fill="var(--primary-accent)">172.17.0.1</text>
  <line x1="640" y1="409.999994" x2="640" y2="469.999942" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="327.296313" y="469.999942" width="625.407166" height="71.999988" rx="6.825104" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="512.999825" text-anchor="middle" font-size="21.747739" fill="var(--text)">eth0 (host) — NAT to external network</text>
</svg>
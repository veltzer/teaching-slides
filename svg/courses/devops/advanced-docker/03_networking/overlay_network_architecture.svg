  <rect x="133.75" y="257.5" width="375" height="54.7777" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="321.25" y="292.1389" text-anchor="middle" font-size="19.1186" fill="var(--text)">br-overlay</text>

  <line x1="728.8889" y1="177.7778" x2="728.8889" y2="240" stroke="var(--primary-border)" stroke-width="1.7778" />
  <line x1="960" y1="177.7778" x2="960" y2="240" stroke="var(--primary-border)" stroke-width="1.7778" />
  <rect x="666.6667" y="240" width="355.5556" height="60.4444" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />

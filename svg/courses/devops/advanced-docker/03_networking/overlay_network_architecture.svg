  <text x="857.7778" y="57.7778" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="var(--primary-accent)">Node 2</text>
  <rect x="631.1111" y="80" width="195.5556" height="97.7778" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />

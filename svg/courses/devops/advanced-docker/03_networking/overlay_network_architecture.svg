<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Node 1 -->
  <rect x="20" y="20" width="590" height="620" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="315" y="65" text-anchor="middle" font-size="26" font-weight="bold" fill="#1565c0">Node 1</text>
  <!-- web.1 -->
  <rect x="60" y="90" width="220" height="110" rx="8" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="170" y="136" text-anchor="middle" font-size="22" fill="#333333">web.1</text>
  <text x="170" y="170" text-anchor="middle" font-size="18" font-family="monospace" fill="#555555">10.20.0.3</text>
  <!-- api.1 -->
  <rect x="320" y="90" width="220" height="110" rx="8" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="430" y="136" text-anchor="middle" font-size="22" fill="#333333">api.1</text>
  <text x="430" y="170" text-anchor="middle" font-size="18" font-family="monospace" fill="#555555">10.20.0.4</text>
  <!-- lines down to bridge -->
  <line x1="170" y1="200" x2="170" y2="270" stroke="#1565c0" stroke-width="2"/>
  <line x1="430" y1="200" x2="430" y2="270" stroke="#1565c0" stroke-width="2"/>
  <!-- br-overlay -->
  <rect x="100" y="270" width="400" height="68" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="300" y="313" text-anchor="middle" font-size="22" fill="#333333">br-overlay</text>
  <!-- VXLAN tunnel label -->
  <text x="300" y="420" text-anchor="middle" font-size="18" fill="#c62828">VXLAN tunnel</text>
  <line x1="300" y1="338" x2="300" y2="460" stroke="#c62828" stroke-width="3" stroke-dasharray="10 6"/>
  <!-- eth0 -->
  <rect x="180" y="460" width="240" height="66" rx="8" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="300" y="500" text-anchor="middle" font-size="22" fill="#333333">eth0</text>
  <!-- Node 2 -->
  <rect x="670" y="20" width="590" height="620" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="965" y="65" text-anchor="middle" font-size="26" font-weight="bold" fill="#1565c0">Node 2</text>
  <!-- web.2 -->
  <rect x="710" y="90" width="220" height="110" rx="8" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="820" y="136" text-anchor="middle" font-size="22" fill="#333333">web.2</text>
  <text x="820" y="170" text-anchor="middle" font-size="18" font-family="monospace" fill="#555555">10.20.0.5</text>
  <!-- api.2 -->
  <rect x="970" y="90" width="220" height="110" rx="8" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="1080" y="136" text-anchor="middle" font-size="22" fill="#333333">api.2</text>
  <text x="1080" y="170" text-anchor="middle" font-size="18" font-family="monospace" fill="#555555">10.20.0.6</text>
  <!-- lines down to bridge -->
  <line x1="820" y1="200" x2="820" y2="270" stroke="#1565c0" stroke-width="2"/>
  <line x1="1080" y1="200" x2="1080" y2="270" stroke="#1565c0" stroke-width="2"/>
  <!-- br-overlay -->
  <rect x="750" y="270" width="400" height="68" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="313" text-anchor="middle" font-size="22" fill="#333333">br-overlay</text>
  <!-- VXLAN tunnel label -->
  <text x="950" y="420" text-anchor="middle" font-size="18" fill="#c62828">VXLAN tunnel</text>
  <line x1="950" y1="338" x2="950" y2="460" stroke="#c62828" stroke-width="3" stroke-dasharray="10 6"/>
  <!-- eth0 -->
  <rect x="830" y="460" width="240" height="66" rx="8" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="500" text-anchor="middle" font-size="22" fill="#333333">eth0</text>
  <!-- cross-node VXLAN line -->
  <line x1="420" y1="493" x2="830" y2="493" stroke="#c62828" stroke-width="3" stroke-dasharray="10 6"/>
</svg>

  <line x1="436.774228" y1="208.387112" x2="436.774228" y2="273.871001" stroke="var(--primary-border)" stroke-width="1.7778" />
  <rect x="117.419361" y="273.871001" width="387.096807" height="63.612819" rx="6.569251" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="310.967765" y="314.096824" text-anchor="middle" font-size="20.932479" fill="var(--text)">br-overlay</text>
  <text x="310.967765" y="414.193556" text-anchor="middle" font-size="17.126584" fill="var(--danger-accent)">VXLAN tunnel</text>
  <line x1="310.967765" y1="337.48382" x2="310.967765" y2="451.613004" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="8.8889 5.3333" />
  <rect x="194.838723" y="451.613004" width="232.258084" height="61.74198" rx="6.569251" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="310.967765" y="489.032221" text-anchor="middle" font-size="20.932479" fill="var(--text)">eth0</text>
  <rect x="669.032312" y="40" width="570.967688" height="580" rx="6.569251" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="954.516208" y="82.096778" text-anchor="middle" font-size="24.738375" font-weight="bold" fill="var(--primary-accent)">Node 2</text>
  <rect x="707.741993" y="105.48389" width="212.903244" height="102.903222" rx="6.569251" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="814.193615" y="148.516203" text-anchor="middle" font-size="20.932479" fill="var(--text)">web.2</text>
  <text x="814.193615" y="180.322554" text-anchor="middle" font-size="17.126584" font-family="monospace" fill="var(--text-muted)">10.20.0.5</text>
  <rect x="959.354918" y="105.48389" width="212.903244" height="102.903222" rx="6.569251" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1065.80654" y="148.516203" text-anchor="middle" font-size="20.932479" fill="var(--text)">api.2</text>
  <text x="1065.80654" y="180.322554" text-anchor="middle" font-size="17.126584" font-family="monospace" fill="var(--text-muted)">10.20.0.6</text>
  <line x1="814.193615" y1="208.387112" x2="814.193615" y2="273.871001" stroke="var(--primary-border)" stroke-width="1.7778" />
  <line x1="1065.80654" y1="208.387112" x2="1065.80654" y2="273.871001" stroke="var(--primary-border)" stroke-width="1.7778" />

  <rect x="88.8889" y="240" width="355.5556" height="60.4444" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="266.6667" y="278.2222" text-anchor="middle" font-size="19.5556" fill="var(--text)">br-overlay</text>

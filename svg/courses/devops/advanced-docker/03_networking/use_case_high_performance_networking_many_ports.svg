<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" font-family="Arial, sans-serif">
  <text x="210" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Host Network Mode</text>
  <rect x="40" y="40" width="340" height="220" rx="5" fill="#f9f9f9" stroke="#4a90e2" stroke-width="2"/>
  <text x="210" y="68" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a90e2">Host</text>
  <rect x="80" y="80" width="260" height="70" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="210" y="108" text-anchor="middle" font-size="13" fill="#333">Container Process</text>
  <text x="210" y="130" text-anchor="middle" font-size="12" fill="#666">(uses host network directly)</text>
  <rect x="80" y="170" width="260" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="210" y="195" text-anchor="middle" font-size="13" font-family="monospace" fill="#333">eth0: 192.168.1.10</text>
  <text x="210" y="245" text-anchor="middle" font-size="11" fill="#666">No network namespace isolation - best performance</text>
</svg>

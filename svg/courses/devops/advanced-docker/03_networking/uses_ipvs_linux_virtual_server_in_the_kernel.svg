<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Title -->
  <text x="640" y="55" text-anchor="middle" font-size="34" font-weight="bold" fill="#1565c0">IPVS Load Balancing</text>
  <!-- Client -->
  <rect x="46" y="100" width="220" height="120" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="156" y="167" text-anchor="middle" font-size="28" fill="#333333">Client</text>
  <!-- arrow to VIP -->
  <line x1="266" y1="160" x2="394" y2="160" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow-accent)"/>
  <!-- VIP -->
  <rect x="394" y="100" width="360" height="120" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="574" y="154" text-anchor="middle" font-size="28" fill="#333333">VIP</text>
  <text x="574" y="196" text-anchor="middle" font-size="22" font-family="monospace" fill="#555555">10.20.0.5</text>
  <!-- arrow to IPVS -->
  <line x1="754" y1="160" x2="866" y2="160" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow-accent)"/>
  <!-- IPVS box -->
  <rect x="866" y="84" width="340" height="152" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="1036" y="152" text-anchor="middle" font-size="30" font-weight="bold" fill="#1565c0">IPVS</text>
  <text x="1036" y="200" text-anchor="middle" font-size="20" fill="#555555">kernel module</text>
  <!-- arrows from IPVS to tasks -->
  <line x1="1036" y1="236" x2="560" y2="380" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
  <line x1="1036" y1="236" x2="1036" y2="380" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
  <line x1="1036" y1="236" x2="1200" y2="380" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
  <!-- Task 3 -->
  <rect x="434" y="380" width="252" height="130" rx="8" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="560" y="438" text-anchor="middle" font-size="26" fill="#333333">Task 3</text>
  <text x="560" y="480" text-anchor="middle" font-size="20" font-family="monospace" fill="#555555">10.20.0.8</text>
  <!-- Task 1 -->
  <rect x="910" y="380" width="252" height="130" rx="8" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="1036" y="438" text-anchor="middle" font-size="26" fill="#333333">Task 1</text>
  <text x="1036" y="480" text-anchor="middle" font-size="20" font-family="monospace" fill="#555555">10.20.0.6</text>
  <!-- Task 2 -->
  <rect x="1074" y="380" width="190" height="130" rx="8" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="1169" y="438" text-anchor="middle" font-size="26" fill="#333333">Task 2</text>
  <text x="1169" y="480" text-anchor="middle" font-size="20" font-family="monospace" fill="#555555">10.20.0.7</text>
</svg>

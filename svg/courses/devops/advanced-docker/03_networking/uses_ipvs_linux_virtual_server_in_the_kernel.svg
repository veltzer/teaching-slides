<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <text x="625.221675" y="40" text-anchor="middle" font-size="38.102528" font-weight="bold" fill="var(--primary-accent)">IPVS Load Balancing</text>
  <rect x="40" y="97.362634" width="216.748768" height="152.967077" rx="7.737366" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="148.374384" y="182.769028" text-anchor="middle" font-size="31.378628" fill="var(--text)">Client</text>
  <line x1="256.748663" y1="173.846093" x2="382.857143" y2="173.846093" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="382.857143" y="97.362634" width="354.679803" height="152.967077" rx="7.737366" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="560.197044" y="166.197795" text-anchor="middle" font-size="31.378628" fill="var(--text)">VIP</text>
  <text x="560.197044" y="219.7362" text-anchor="middle" font-size="24.6546" font-family="monospace" fill="var(--text-muted)">10.20.0.5</text>
  <line x1="737.536946" y1="173.846093" x2="847.881773" y2="173.846093" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="847.881773" y="76.967013" width="334.975369" height="193.75816" rx="7.737366" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1015.369458" y="163.648203" text-anchor="middle" font-size="33.619886" font-weight="bold" fill="var(--primary-accent)">IPVS</text>
  <text x="1015.369458" y="224.835065" text-anchor="middle" font-size="22.413344" fill="var(--text-muted)">kernel module</text>
  <line x1="1015.369458" y1="270.725173" x2="546.403941" y2="454.285601" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="1015.369458" y1="270.725173" x2="1015.369458" y2="454.285601" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="1015.369458" y1="270.725173" x2="1176.945813" y2="454.285601" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="422.26601" y="454.285601" width="248.275862" height="165.714399" rx="7.737366" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="546.403941" y="528.219627" text-anchor="middle" font-size="29.137243" fill="var(--text)">Task 3</text>
  <text x="546.403941" y="581.758192" text-anchor="middle" font-size="22.413344" font-family="monospace" fill="var(--text-muted)">10.20.0.8</text>
  <rect x="891.231527" y="454.285601" width="248.275862" height="165.714399" rx="7.737366" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1015.369458" y="528.219627" text-anchor="middle" font-size="29.137243" fill="var(--text)">Task 1</text>
  <text x="1015.369458" y="581.758192" text-anchor="middle" font-size="22.413344" font-family="monospace" fill="var(--text-muted)">10.20.0.6</text>
  <rect x="1052.807882" y="454.285601" width="187.192118" height="165.714399" rx="7.737366" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1146.403941" y="528.219627" text-anchor="middle" font-size="29.137243" fill="var(--text)">Task 2</text>
  <text x="1146.403941" y="581.758192" text-anchor="middle" font-size="22.413344" font-family="monospace" fill="var(--text-muted)">10.20.0.7</text>
</svg>
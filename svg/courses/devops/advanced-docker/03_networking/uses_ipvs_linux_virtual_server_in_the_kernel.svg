  <rect x="847.881773" y="40" width="334.975369" height="206.948261874191" rx="7.996391181272" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1015.369458" y="132.582018778907" text-anchor="middle" font-size="34.745384918559" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">IPVS</text>

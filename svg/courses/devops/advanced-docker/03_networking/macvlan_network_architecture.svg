<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="639.99999945583" y="40" text-anchor="middle" font-size="32.162303566101" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Physical Network (192.168.1.0/24)</text>
  <rect x="40" y="82.317612580817" width="296.819788174306" height="136.909849892245" rx="7.930604455464" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="188.409893542983" y="142.060151745654" text-anchor="middle" font-size="27.567575388813" fill="var(--text)" font-family="Arial, sans-serif">Router</text>
  <text x="188.409893542983" y="188.111412702399" text-anchor="middle" font-size="22.973111388622" fill="var(--text-muted)" font-family="Courier New, monospace">.1</text>
  <rect x="417.385158053016" y="82.317612580817" width="445.22968171729" height="298.712385781285" rx="7.930604455464" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.99999945583" y="138.326194528541" text-anchor="middle" font-size="27.567575388813" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Host</text>
  <text x="639.99999945583" y="179.399103830981" text-anchor="middle" font-size="22.973111388622" fill="var(--text-muted)" font-family="Courier New, monospace">.10</text>
  <rect x="470.388691927655" y="200.557832610664" width="339.222501869071" height="149.356269800509" rx="7.930604455464" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.99999945583" y="254.077315641103" text-anchor="middle" font-size="25.270342816905" fill="var(--text)" font-family="Arial, sans-serif">Container</text>
  <text x="639.99999945583" y="293.905520463449" text-anchor="middle" font-size="22.973111388622" fill="var(--text)" font-family="Courier New, monospace">.100 (own MAC)</text>
  <rect x="943.180211825694" y="82.317612580817" width="296.819788174306" height="136.909849892245" rx="7.930604455464" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1091.590105368677" y="142.060151745654" text-anchor="middle" font-size="27.567575388813" fill="var(--text)" font-family="Arial, sans-serif">Other Device</text>
  <text x="1091.590105368677" y="188.111412702399" text-anchor="middle" font-size="22.973111388622" fill="var(--text-muted)" font-family="Courier New, monospace">.50</text>
  <line x1="40" y1="455.70821137394" x2="1239.999998911661" y2="455.70821137394" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="188.409893542983" y1="219.227462473061" x2="188.409893542983" y2="455.70821137394" stroke="var(--primary-border)" stroke-width="1.7778"/>
  <line x1="639.99999945583" y1="381.029998362102" x2="639.99999945583" y2="455.70821137394" stroke="var(--primary-border)" stroke-width="1.7778"/>
  <line x1="1091.590105368677" y1="219.227462473061" x2="1091.590105368677" y2="455.70821137394" stroke="var(--primary-border)" stroke-width="1.7778"/>
  <text x="639.99999945583" y="530.386268162611" text-anchor="middle" font-size="25.270342816905" fill="var(--text-muted)" font-family="Arial, sans-serif">All devices share the same physical network segment</text>
  <text x="639.99999945583" y="575.193134682164" text-anchor="middle" font-size="25.270342816905" fill="var(--text-muted)" font-family="Arial, sans-serif">Container gets its own MAC address and IP</text>
  <text x="639.99999945583" y="620" text-anchor="middle" font-size="25.270342816905" fill="var(--text-muted)" font-family="Arial, sans-serif">directly on the physical network</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" rx="6.934627" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="87.642915" text-anchor="middle" font-size="28.12315" font-weight="bold" fill="var(--primary-accent)">Physical Network (192.168.1.0/24)</text>
  <rect x="88.701299" y="122.857216" width="272.727273" height="113.92856" rx="6.934627" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="225.064935" y="172.571546" text-anchor="middle" font-size="24.105458" fill="var(--text)">Router</text>
  <text x="225.064935" y="210.892776" text-anchor="middle" font-size="20.087997" font-family="monospace" fill="var(--text-muted)">.1</text>
  <rect x="435.454545" y="122.857216" width="409.090909" height="248.571392" rx="6.934627" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="169.46436" text-anchor="middle" font-size="24.105458" font-weight="bold" fill="var(--primary-accent)">Host</text>
  <text x="640" y="203.64289" text-anchor="middle" font-size="20.087997" font-family="monospace" fill="var(--text-muted)">.10</text>
  <rect x="484.155844" y="221.249976" width="311.688208" height="124.28576" rx="6.934627" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="265.785834" text-anchor="middle" font-size="22.096727" fill="var(--text)">Container</text>
  <text x="640" y="298.928592" text-anchor="middle" font-size="20.087997" font-family="monospace" fill="var(--text)">.100 (own MAC)</text>
  <rect x="918.571429" y="122.857216" width="272.727273" height="113.92856" rx="6.934627" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1054.935065" y="172.571546" text-anchor="middle" font-size="24.105458" fill="var(--text)">Other Device</text>
  <text x="1054.935065" y="210.892776" text-anchor="middle" font-size="20.087997" font-family="monospace" fill="var(--text-muted)">.50</text>
  <line x1="88.701299" y1="433.571553" x2="1191.298701" y2="433.571553" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="225.064935" y1="236.785776" x2="225.064935" y2="433.571553" stroke="var(--primary-border)" stroke-width="1.7778" />
  <line x1="640" y1="371.428608" x2="640" y2="433.571553" stroke="var(--primary-border)" stroke-width="1.7778" />
  <line x1="1054.935065" y1="236.785776" x2="1054.935065" y2="433.571553" stroke="var(--primary-border)" stroke-width="1.7778" />
  <text x="640" y="495.714368" text-anchor="middle" font-size="22.096727" fill="var(--text-muted)">All devices share the same physical network segment</text>
  <text x="640" y="533.000084" text-anchor="middle" font-size="22.096727" fill="var(--text-muted)">Container gets its own MAC address and IP</text>
  <text x="640" y="570.285799" text-anchor="middle" font-size="22.096727" fill="var(--text-muted)">directly on the physical network</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="21.3333" y="17.7778" width="1095.1111" height="497.7778" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="568.8889" y="58.6667" text-anchor="middle" font-size="24.8889" font-weight="bold" fill="var(--primary-accent)">Physical Network (192.168.1.0/24)</text>
  <rect x="65.7778" y="88.8889" width="248.8889" height="97.7778" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="190.2222" y="131.5556" text-anchor="middle" font-size="21.3333" fill="var(--text)">Router</text>
  <text x="190.2222" y="164.4444" text-anchor="middle" font-size="17.7778" font-family="monospace" fill="var(--text-muted)">.1</text>
  <rect x="382.2222" y="88.8889" width="373.3333" height="213.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="568.8889" y="128.8889" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="var(--primary-accent)">Host</text>
  <text x="568.8889" y="158.2222" text-anchor="middle" font-size="17.7778" font-family="monospace" fill="var(--text-muted)">.10</text>
  <rect x="426.6667" y="173.3333" width="284.4444" height="106.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="568.8889" y="211.5556" text-anchor="middle" font-size="19.5556" fill="var(--text)">Container</text>
  <text x="568.8889" y="240" text-anchor="middle" font-size="17.7778" font-family="monospace" fill="var(--text)">.100 (own MAC)</text>
  <rect x="823.1111" y="88.8889" width="248.8889" height="97.7778" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="947.5556" y="131.5556" text-anchor="middle" font-size="21.3333" fill="var(--text)">Other Device</text>
  <text x="947.5556" y="164.4444" text-anchor="middle" font-size="17.7778" font-family="monospace" fill="var(--text-muted)">.50</text>
  <line x1="65.7778" y1="355.5556" x2="1072" y2="355.5556" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="190.2222" y1="186.6667" x2="190.2222" y2="355.5556" stroke="var(--primary-border)" stroke-width="1.7778" />
  <line x1="568.8889" y1="302.2222" x2="568.8889" y2="355.5556" stroke="var(--primary-border)" stroke-width="1.7778" />
  <line x1="947.5556" y1="186.6667" x2="947.5556" y2="355.5556" stroke="var(--primary-border)" stroke-width="1.7778" />
  <text x="568.8889" y="408.8889" text-anchor="middle" font-size="19.5556" fill="var(--text-muted)">All devices share the same physical network segment</text>
  <text x="568.8889" y="440.8889" text-anchor="middle" font-size="19.5556" fill="var(--text-muted)">Container gets its own MAC address and IP</text>
  <text x="568.8889" y="472.8889" text-anchor="middle" font-size="19.5556" fill="var(--text-muted)">directly on the physical network</text>
</svg>
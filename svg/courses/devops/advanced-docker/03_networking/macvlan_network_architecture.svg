<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="62.5" y="56.1111" width="1155" height="451.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="640" y="93.1667" text-anchor="middle" font-size="24.3328" font-weight="bold" fill="var(--primary-accent)">Physical Network (192.168.1.0/24)</text>
  <rect x="109.375" y="120.5556" width="262.5" height="88.6111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="240.625" y="159.2223" text-anchor="middle" font-size="20.8566" fill="var(--text)">Router</text>
  <text x="240.625" y="189.0277" text-anchor="middle" font-size="17.3806" font-family="monospace" fill="var(--text-muted)">.1</text>
  <rect x="443.125" y="120.5556" width="393.75" height="193.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="156.8056" text-anchor="middle" font-size="20.8566" font-weight="bold" fill="var(--primary-accent)">Host</text>
  <text x="640" y="183.3889" text-anchor="middle" font-size="17.3806" font-family="monospace" fill="var(--text-muted)">.10</text>
  <rect x="490" y="197.0833" width="299.9999" height="96.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="231.7223" text-anchor="middle" font-size="19.1186" fill="var(--text)">Container</text>
  <text x="640" y="257.5" text-anchor="middle" font-size="17.3806" font-family="monospace" fill="var(--text)">.100 (own MAC)</text>
  <rect x="908.125" y="120.5556" width="262.5" height="88.6111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1039.375" y="159.2223" text-anchor="middle" font-size="20.8566" fill="var(--text)">Other Device</text>
  <text x="1039.375" y="189.0277" text-anchor="middle" font-size="17.3806" font-family="monospace" fill="var(--text-muted)">.50</text>
  <line x1="109.375" y1="362.2223" x2="1170.625" y2="362.2223" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="240.625" y1="209.1667" x2="240.625" y2="362.2223" stroke="var(--primary-border)" stroke-width="1.7778" />
  <line x1="640" y1="313.8889" x2="640" y2="362.2223" stroke="var(--primary-border)" stroke-width="1.7778" />
  <line x1="1039.375" y1="209.1667" x2="1039.375" y2="362.2223" stroke="var(--primary-border)" stroke-width="1.7778" />
  <text x="640" y="410.5556" text-anchor="middle" font-size="19.1186" fill="var(--text-muted)">All devices share the same physical network segment</text>
  <text x="640" y="439.5556" text-anchor="middle" font-size="19.1186" fill="var(--text-muted)">Container gets its own MAC address and IP</text>
  <text x="640" y="468.5556" text-anchor="middle" font-size="19.1186" fill="var(--text-muted)">directly on the physical network</text>
</svg>
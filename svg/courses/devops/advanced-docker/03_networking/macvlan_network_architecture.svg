<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <rect x="24.6154" y="20" width="1230.7692" height="680" rx="10" fill="#f9f9f9" stroke="#4a90e2" stroke-width="4" />
  <text x="640" y="76" text-anchor="middle" font-size="32" font-weight="bold" fill="#333">Physical Network (192.168.1.0/24)</text>
  <rect x="73.8462" y="110" width="295.3846" height="120" rx="10" fill="#e8f4f8" stroke="#4a90e2" stroke-width="4" />
  <text x="221.5385" y="160" text-anchor="middle" font-size="26" fill="#333">Router</text>
  <text x="221.5385" y="200" text-anchor="middle" font-size="22" font-family="monospace" fill="#666">.1</text>
  <rect x="443.0769" y="110" width="393.8462" height="240" rx="10" fill="#d4edda" stroke="#28a745" stroke-width="4" />
  <text x="640" y="156" text-anchor="middle" font-size="26" font-weight="bold" fill="#333">Host</text>
  <text x="640" y="196" text-anchor="middle" font-size="22" font-family="monospace" fill="#666">.10</text>
  <rect x="492.3077" y="210" width="295.3846" height="110" rx="10" fill="#fff3cd" stroke="#ffc107" stroke-width="3" />
  <text x="640" y="250" text-anchor="middle" font-size="24" fill="#333">Container</text>
  <text x="640" y="286" text-anchor="middle" font-size="22" font-family="monospace" fill="#333">.100 (own MAC)</text>
  <rect x="910.7692" y="110" width="295.3846" height="120" rx="10" fill="#e8f4f8" stroke="#4a90e2" stroke-width="4" />
  <text x="1058.4615" y="160" text-anchor="middle" font-size="26" fill="#333">Other Device</text>
  <text x="1058.4615" y="200" text-anchor="middle" font-size="22" font-family="monospace" fill="#666">.50</text>
  <line x1="73.8462" y1="440" x2="1206.1538" y2="440" stroke="#4a90e2" stroke-width="6" />
  <text x="640" y="500" text-anchor="middle" font-size="24" fill="#666">All devices share the same physical network segment</text>
  <text x="640" y="540" text-anchor="middle" font-size="24" fill="#666">Container gets its own MAC address and IP</text>
  <text x="640" y="580" text-anchor="middle" font-size="24" fill="#666">directly on the physical network</text>
</svg>
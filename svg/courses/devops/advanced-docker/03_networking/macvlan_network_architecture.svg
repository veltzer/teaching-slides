<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="500" height="340" rx="5" fill="#f9f9f9" stroke="#4a90e2" stroke-width="2"/>
  <text x="260" y="38" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Physical Network (192.168.1.0/24)</text>
  <rect x="30" y="55" width="120" height="60" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="90" y="80" text-anchor="middle" font-size="13" fill="#333">Router</text>
  <text x="90" y="100" text-anchor="middle" font-size="11" font-family="monospace" fill="#666">.1</text>
  <rect x="180" y="55" width="160" height="120" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="260" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Host</text>
  <text x="260" y="98" text-anchor="middle" font-size="11" font-family="monospace" fill="#666">.10</text>
  <rect x="200" y="105" width="120" height="55" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="260" y="125" text-anchor="middle" font-size="12" fill="#333">Container</text>
  <text x="260" y="143" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">.100 (own MAC)</text>
  <rect x="370" y="55" width="120" height="60" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="430" y="80" text-anchor="middle" font-size="13" fill="#333">Other Device</text>
  <text x="430" y="100" text-anchor="middle" font-size="11" font-family="monospace" fill="#666">.50</text>
  <line x1="30" y1="220" x2="490" y2="220" stroke="#4a90e2" stroke-width="3"/>
  <text x="260" y="250" text-anchor="middle" font-size="12" fill="#666">All devices share the same physical network segment</text>
  <text x="260" y="270" text-anchor="middle" font-size="12" fill="#666">Container gets its own MAC address and IP</text>
  <text x="260" y="290" text-anchor="middle" font-size="12" fill="#666">directly on the physical network</text>
</svg>

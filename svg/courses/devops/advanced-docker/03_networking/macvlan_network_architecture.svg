<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Physical Network outer box -->
  <rect x="24" y="20" width="1232" height="560" rx="8" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="66" text-anchor="middle" font-size="28" font-weight="bold" fill="#1565c0">Physical Network (192.168.1.0/24)</text>
  <!-- Router -->
  <rect x="74" y="100" width="280" height="110" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="214" y="148" text-anchor="middle" font-size="24" fill="#333333">Router</text>
  <text x="214" y="185" text-anchor="middle" font-size="20" font-family="monospace" fill="#555555">.1</text>
  <!-- Host with Container -->
  <rect x="430" y="100" width="420" height="240" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="145" text-anchor="middle" font-size="24" font-weight="bold" fill="#1565c0">Host</text>
  <text x="640" y="178" text-anchor="middle" font-size="20" font-family="monospace" fill="#555555">.10</text>
  <!-- Container inside host -->
  <rect x="480" y="195" width="320" height="120" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="238" text-anchor="middle" font-size="22" fill="#333333">Container</text>
  <text x="640" y="270" text-anchor="middle" font-size="20" font-family="monospace" fill="#333333">.100 (own MAC)</text>
  <!-- Other Device -->
  <rect x="926" y="100" width="280" height="110" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="1066" y="148" text-anchor="middle" font-size="24" fill="#333333">Other Device</text>
  <text x="1066" y="185" text-anchor="middle" font-size="20" font-family="monospace" fill="#555555">.50</text>
  <!-- Physical network bus line -->
  <line x1="74" y1="400" x2="1206" y2="400" stroke="#1565c0" stroke-width="5"/>
  <!-- drop lines -->
  <line x1="214" y1="210" x2="214" y2="400" stroke="#1565c0" stroke-width="2"/>
  <line x1="640" y1="340" x2="640" y2="400" stroke="#1565c0" stroke-width="2"/>
  <line x1="1066" y1="210" x2="1066" y2="400" stroke="#1565c0" stroke-width="2"/>
  <!-- Description text -->
  <text x="640" y="460" text-anchor="middle" font-size="22" fill="#555555">All devices share the same physical network segment</text>
  <text x="640" y="496" text-anchor="middle" font-size="22" fill="#555555">Container gets its own MAC address and IP</text>
  <text x="640" y="532" text-anchor="middle" font-size="22" fill="#555555">directly on the physical network</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="1200" height="580" rx="6.934627" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="87.642915" text-anchor="middle" font-size="28.12315" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Physical Network (192.168.1.0/24)</text>
  <rect x="88.701299" y="122.857216" width="272.727273" height="113.92856" rx="6.934627" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="225.064935" y="172.571546" text-anchor="middle" font-size="24.105458" fill="var(--text)" font-family="Arial, sans-serif">Router</text>
  <text x="225.064935" y="210.892776" text-anchor="middle" font-size="20.087997" fill="var(--text-muted)" font-family="Courier New, monospace">.1</text>
  <rect x="435.454545" y="122.857216" width="409.090909" height="248.571392" rx="6.934627" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="169.46436" text-anchor="middle" font-size="24.105458" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Host</text>
  <text x="640" y="203.64289" text-anchor="middle" font-size="20.087997" fill="var(--text-muted)" font-family="Courier New, monospace">.10</text>
  <rect x="484.155844" y="221.249976" width="311.688208" height="124.28576" rx="6.934627" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="265.785834" text-anchor="middle" font-size="22.096727" fill="var(--text)" font-family="Arial, sans-serif">Container</text>
  <text x="640" y="298.928592" text-anchor="middle" font-size="20.087997" fill="var(--text)" font-family="Courier New, monospace">.100 (own MAC)</text>
  <rect x="918.571429" y="122.857216" width="272.727273" height="113.92856" rx="6.934627" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1054.935065" y="172.571546" text-anchor="middle" font-size="24.105458" fill="var(--text)" font-family="Arial, sans-serif">Other Device</text>
  <text x="1054.935065" y="210.892776" text-anchor="middle" font-size="20.087997" fill="var(--text-muted)" font-family="Courier New, monospace">.50</text>
  <line x1="88.701299" y1="433.571553" x2="1191.298701" y2="433.571553" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="225.064935" y1="236.785776" x2="225.064935" y2="433.571553" stroke="var(--primary-border)" stroke-width="1.7778" />
  <line x1="640" y1="371.428608" x2="640" y2="433.571553" stroke="var(--primary-border)" stroke-width="1.7778" />
  <line x1="1054.935065" y1="236.785776" x2="1054.935065" y2="433.571553" stroke="var(--primary-border)" stroke-width="1.7778" />
  <text x="640" y="495.714368" text-anchor="middle" font-size="22.096727" fill="var(--text-muted)" font-family="Arial, sans-serif">All devices share the same physical network segment</text>
  <text x="640" y="533.000084" text-anchor="middle" font-size="22.096727" fill="var(--text-muted)" font-family="Arial, sans-serif">Container gets its own MAC address and IP</text>
  <text x="640" y="570.285799" text-anchor="middle" font-size="22.096727" fill="var(--text-muted)" font-family="Arial, sans-serif">directly on the physical network</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="639.999946" y="40" text-anchor="middle" font-size="27.541221" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Linux Capabilities Model</text>
  <rect x="40" y="99.999949" width="355.555536" height="260.000026" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.928202" filter="url(#shadow)"/>
  <text x="217.777822" y="180.000128" text-anchor="middle" font-size="25.246138" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">All Capabilities</text>
  <text x="217.777822" y="248.000021" text-anchor="middle" font-size="22.95094" font-family="Arial, sans-serif" fill="var(--danger-text)">SYS_ADMIN, NET_RAW</text>
  <text x="217.777822" y="303.999997" text-anchor="middle" font-size="22.95094" font-family="Arial, sans-serif" fill="var(--danger-text)">CHOWN, SETUID...</text>
  <rect x="462.222232" y="99.999949" width="355.555536" height="260.000026" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.928202" filter="url(#shadow)"/>
  <text x="639.999946" y="180.000128" text-anchor="middle" font-size="25.246138" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Default Set</text>
  <text x="639.999946" y="248.000021" text-anchor="middle" font-size="22.95094" font-family="Arial, sans-serif" fill="var(--warn-text)">CHOWN, SETUID</text>
  <text x="639.999946" y="303.999997" text-anchor="middle" font-size="22.95094" font-family="Arial, sans-serif" fill="var(--warn-text)">NET_BIND_SERVICE</text>
  <rect x="884.444464" y="99.999949" width="355.555536" height="260.000026" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.928202" filter="url(#shadow)"/>
  <text x="1062.222071" y="180.000128" text-anchor="middle" font-size="25.246138" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Minimal Set</text>
  <text x="1062.222071" y="248.000021" text-anchor="middle" font-size="22.95094" font-family="Arial, sans-serif" fill="var(--ok-text)">--cap-drop ALL</text>
  <text x="1062.222071" y="303.999997" text-anchor="middle" font-size="22.95094" font-family="Arial, sans-serif" fill="var(--ok-text)">--cap-add needed</text>
  <text x="217.777822" y="479.999872" text-anchor="middle" font-size="22.95094" fill="var(--danger-accent)" font-family="Arial, sans-serif">--privileged</text>
  <text x="639.999946" y="479.999872" text-anchor="middle" font-size="22.95094" fill="var(--warn-accent)" font-family="Arial, sans-serif">docker run</text>
  <text x="1062.222071" y="479.999872" text-anchor="middle" font-size="22.95094" fill="var(--ok-accent)" font-family="Arial, sans-serif">hardened</text>
  <line x1="395.555428" y1="232.000009" x2="462.222232" y2="232.000009" stroke="var(--text)" stroke-width="2"/>
  <line x1="817.77766" y1="232.000009" x2="884.444464" y2="232.000009" stroke="var(--text)" stroke-width="2"/>
  <text x="428.888777" y="208.000055" font-size="29.836303" font-family="Arial, sans-serif" fill="var(--text)">&gt;</text>
  <text x="851.111116" y="208.000055" font-size="29.836303" font-family="Arial, sans-serif" fill="var(--text)">&gt;</text>
  <text x="639.999946" y="620" text-anchor="middle" font-size="22.95094" fill="var(--text-muted)" font-family="Arial, sans-serif">Reduce attack surface by dropping unnecessary capabilities</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="19.961" y="33.6842" width="1157.7388" height="606.3158" fill="none" stroke="var(--border)" stroke-width="1" rx="6" stroke-dasharray="7.9844 3.9922" />
  <text x="598.8304" y="101.0526" text-anchor="middle" font-size="23.9532" font-weight="bold">Linux Capabilities Model</text>
  <rect x="59.883" y="151.5789" width="319.3762" height="218.9474" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="219.5712" y="218.9474" text-anchor="middle" font-size="21.9571" font-weight="bold" fill="var(--danger-accent)">All Capabilities</text>
  <text x="219.5712" y="276.2105" text-anchor="middle" font-size="19.961">SYS_ADMIN, NET_RAW</text>
  <text x="219.5712" y="323.3684" text-anchor="middle" font-size="19.961">CHOWN, SETUID...</text>
  <rect x="439.1423" y="151.5789" width="319.3762" height="218.9474" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="598.8304" y="218.9474" text-anchor="middle" font-size="21.9571" font-weight="bold" fill="var(--warn-accent)">Default Set</text>
  <text x="598.8304" y="276.2105" text-anchor="middle" font-size="19.961">CHOWN, SETUID</text>
  <text x="598.8304" y="323.3684" text-anchor="middle" font-size="19.961">NET_BIND_SERVICE</text>
  <rect x="818.4016" y="151.5789" width="319.3762" height="218.9474" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="978.0896" y="218.9474" text-anchor="middle" font-size="21.9571" font-weight="bold" fill="var(--ok-accent)">Minimal Set</text>
  <text x="978.0896" y="276.2105" text-anchor="middle" font-size="19.961">--cap-drop ALL</text>
  <text x="978.0896" y="323.3684" text-anchor="middle" font-size="19.961">--cap-add needed</text>
  <text x="219.5712" y="471.5789" text-anchor="middle" font-size="19.961" fill="var(--danger-accent)">--privileged</text>
  <text x="598.8304" y="471.5789" text-anchor="middle" font-size="19.961" fill="var(--warn-accent)">docker run</text>
  <text x="978.0896" y="471.5789" text-anchor="middle" font-size="19.961" fill="var(--ok-accent)">hardened</text>
  <line x1="379.2592" y1="262.7368" x2="439.1423" y2="262.7368" stroke="var(--text)" stroke-width="2" />
  <line x1="758.5185" y1="262.7368" x2="818.4016" y2="262.7368" stroke="var(--text)" stroke-width="2" />
  <text x="409.2007" y="242.5263" font-size="25.9493">&gt;</text>
  <text x="788.4601" y="242.5263" font-size="25.9493">&gt;</text>
  <text x="598.8304" y="589.4737" text-anchor="middle" font-size="19.961" fill="var(--text-muted)">Reduce attack surface by dropping unnecessary capabilities</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="580" fill="none" stroke="var(--border)" stroke-width="1" rx="6" stroke-dasharray="7.9844 3.9922" />
  <text x="640" y="104.4444" text-anchor="middle" font-size="23.8514" font-weight="bold">Linux Capabilities Model</text>
  <rect x="81.3793" y="152.7777" width="331.0345" height="209.4445" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="246.8966" y="217.2223" text-anchor="middle" font-size="21.8638" font-weight="bold" fill="var(--danger-accent)">All Capabilities</text>
  <text x="246.8966" y="272" text-anchor="middle" font-size="19.8761">SYS_ADMIN, NET_RAW</text>
  <text x="246.8966" y="317.1111" text-anchor="middle" font-size="19.8761">CHOWN, SETUID...</text>
  <rect x="474.4828" y="152.7777" width="331.0345" height="209.4445" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="640" y="217.2223" text-anchor="middle" font-size="21.8638" font-weight="bold" fill="var(--warn-accent)">Default Set</text>
  <text x="640" y="272" text-anchor="middle" font-size="19.8761">CHOWN, SETUID</text>
  <text x="640" y="317.1111" text-anchor="middle" font-size="19.8761">NET_BIND_SERVICE</text>
  <rect x="867.5863" y="152.7777" width="331.0345" height="209.4445" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1033.1034" y="217.2223" text-anchor="middle" font-size="21.8638" font-weight="bold" fill="var(--ok-accent)">Minimal Set</text>
  <text x="1033.1034" y="272" text-anchor="middle" font-size="19.8761">--cap-drop ALL</text>
  <text x="1033.1034" y="317.1111" text-anchor="middle" font-size="19.8761">--cap-add needed</text>
  <text x="246.8966" y="458.8888" text-anchor="middle" font-size="19.8761" fill="var(--danger-accent)">--privileged</text>
  <text x="640" y="458.8888" text-anchor="middle" font-size="19.8761" fill="var(--warn-accent)">docker run</text>
  <text x="1033.1034" y="458.8888" text-anchor="middle" font-size="19.8761" fill="var(--ok-accent)">hardened</text>
  <line x1="412.4137" y1="259.1111" x2="474.4828" y2="259.1111" stroke="var(--text)" stroke-width="2" />
  <line x1="805.5172" y1="259.1111" x2="867.5863" y2="259.1111" stroke="var(--text)" stroke-width="2" />
  <text x="443.4482" y="239.7778" font-size="25.839">&gt;</text>
  <text x="836.5518" y="239.7778" font-size="25.839">&gt;</text>
  <text x="640" y="571.6667" text-anchor="middle" font-size="19.8761" fill="var(--text-muted)">Reduce attack surface by dropping unnecessary capabilities</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="468.5714" y="40" width="342.8571" height="140.6061" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="127.8788" text-anchor="middle" font-size="25.3529" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Docker Network</text>
  <rect x="40" y="268.4848" width="257.1429" height="193.3333" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="168.5714" y="338.7879" text-anchor="middle" font-size="21.1274" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Frontend Net</text>
  <text x="168.5714" y="402.0606" text-anchor="middle" font-size="21.1274" font-family="Arial, sans-serif" fill="var(--ok-text)">web, proxy</text>
  <rect x="511.4286" y="268.4848" width="257.1429" height="193.3333" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="338.7879" text-anchor="middle" font-size="21.1274" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Backend Net</text>
  <text x="640" y="402.0606" text-anchor="middle" font-size="21.1274" font-family="Arial, sans-serif" fill="var(--warn-text)">api, worker</text>
  <rect x="982.8571" y="268.4848" width="257.1429" height="193.3333" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1111.4286" y="338.7879" text-anchor="middle" font-size="21.1274" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">DB Net</text>
  <text x="1111.4286" y="402.0606" text-anchor="middle" font-size="21.1274" font-family="Arial, sans-serif" fill="var(--danger-text)">postgres, redis</text>
  <line x1="297.1429" y1="363.3939" x2="511.4286" y2="363.3939" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="768.5714" y1="363.3939" x2="982.8571" y2="363.3939" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="404.2857" y="338.7879" text-anchor="middle" font-size="21.1274" fill="var(--text-muted)" font-family="Arial, sans-serif">allowed</text>
  <text x="875.7143" y="338.7879" text-anchor="middle" font-size="21.1274" fill="var(--text-muted)" font-family="Arial, sans-serif">allowed</text>
  <line x1="297.1429" y1="426.6667" x2="982.8571" y2="426.6667" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="10.6667 6.4"/>
  <text x="640" y="532.1212" text-anchor="middle" font-size="21.1274" fill="var(--danger-accent)" font-family="Arial, sans-serif">Isolated: frontend cannot reach DB directly</text>
  <text x="640" y="620" text-anchor="middle" font-size="21.1274" fill="var(--text-muted)" font-family="Arial, sans-serif">Use custom bridge networks to segment container traffic</text>
</svg>

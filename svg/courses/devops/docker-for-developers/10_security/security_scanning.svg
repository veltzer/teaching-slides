<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="160" width="257.1429" height="200" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="168.5714" y="240" text-anchor="middle" font-size="24.7912" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Docker Image</text>
  <text x="168.5714" y="312" text-anchor="middle" font-size="22.5374" font-family="Arial, sans-serif" fill="var(--primary-text)">myapp:latest</text>
  <line x1="297.1429" y1="260" x2="382.8571" y2="260" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="382.8571" y="120" width="300.0001" height="280" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="532.8571" y="208" text-anchor="middle" font-size="24.7912" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Scanner</text>
  <text x="532.8571" y="280" text-anchor="middle" font-size="22.5374" font-family="Arial, sans-serif" fill="var(--info-text)">Trivy / Snyk /</text>
  <text x="532.8571" y="340" text-anchor="middle" font-size="22.5374" font-family="Arial, sans-serif" fill="var(--info-text)">docker scout</text>
  <line x1="682.8572" y1="220" x2="790" y2="140" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="682.8572" y1="300" x2="790" y2="380" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="790" y="40" width="450" height="200" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1015" y="128" text-anchor="middle" font-size="24.7912" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">Pass: No CVEs</text>
  <text x="1015" y="192" text-anchor="middle" font-size="22.5374" fill="var(--ok-accent)" font-family="Arial, sans-serif">Deploy to production</text>
  <rect x="790" y="300" width="450" height="200" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1015" y="388" text-anchor="middle" font-size="24.7912" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">Fail: CVEs Found</text>
  <text x="1015" y="452" text-anchor="middle" font-size="22.5374" fill="var(--danger-accent)" font-family="Arial, sans-serif">Fix and rebuild image</text>
  <text x="640" y="620" text-anchor="middle" font-size="22.5374" fill="var(--text-muted)" font-family="Arial, sans-serif">Integrate scanning into CI/CD pipeline for every build</text>
</svg>

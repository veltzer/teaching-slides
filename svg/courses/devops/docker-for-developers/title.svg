  <rect x="540.4444" y="200" width="56.8889" height="56" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" opacity="0.8" />
  <rect x="604.4444" y="200" width="56.8889" height="56" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" opacity="0.8" />
  <rect x="443.7333" y="136" width="56.8889" height="56" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" opacity="0.8" />
  <rect x="507.7333" y="136" width="56.8889" height="56" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" opacity="0.8" />
  <rect x="142.2222" y="160" width="113.7778" height="160" rx="6" fill="var(--text)" stroke="var(--ok-border)" stroke-width="2.8444" opacity="0.6" />
  <text x="199.1111" y="224" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--ok-accent)" opacity="0.8">FROM</text>
  <text x="199.1111" y="252.8" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--ok-accent)" opacity="0.8">RUN</text>
  <text x="199.1111" y="281.6" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--ok-accent)" opacity="0.8">COPY</text>
  <text x="199.1111" y="310.4" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--ok-accent)" opacity="0.8">CMD</text>
  <text x="881.7778" y="272" font-family="monospace" font-size="85.3333" fill="var(--primary-accent)" opacity="0.4">{}</text>
  <rect x="824.8889" y="384" width="170.6667" height="24" rx="6" fill="var(--danger-fill)" opacity="0.4" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="824.8889" y="416" width="170.6667" height="24" rx="6" fill="var(--warn-fill)" opacity="0.4" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="824.8889" y="448" width="170.6667" height="24" rx="6" fill="var(--ok-fill)" opacity="0.4" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="824.8889" y="480" width="170.6667" height="24" rx="6" fill="var(--primary-fill)" opacity="0.4" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="568.8889" y="608" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.6" fill="var(--border)" letter-spacing="3">DOCKER FOR DEVELOPERS</text>
</svg>
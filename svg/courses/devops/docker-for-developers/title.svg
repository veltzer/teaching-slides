<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#1a1a2e"/>
  <!-- Docker whale body -->
  <ellipse cx="400" cy="200" rx="150" ry="65" fill="#0db7ed" opacity="0.7"/>
  <!-- Whale tail -->
  <path d="M250,200 Q210,140 230,100 Q250,120 270,165" fill="#0db7ed" opacity="0.6"/>
  <!-- Containers on whale -->
  <rect x="290" y="125" width="40" height="35" rx="3" fill="#e8e8e8" stroke="#0db7ed" stroke-width="2" opacity="0.8"/>
  <rect x="335" y="125" width="40" height="35" rx="3" fill="#e8e8e8" stroke="#0db7ed" stroke-width="2" opacity="0.8"/>
  <rect x="380" y="125" width="40" height="35" rx="3" fill="#e8e8e8" stroke="#0db7ed" stroke-width="2" opacity="0.8"/>
  <rect x="425" y="125" width="40" height="35" rx="3" fill="#e8e8e8" stroke="#0db7ed" stroke-width="2" opacity="0.8"/>
  <rect x="312" y="85" width="40" height="35" rx="3" fill="#e8e8e8" stroke="#0db7ed" stroke-width="2" opacity="0.8"/>
  <rect x="357" y="85" width="40" height="35" rx="3" fill="#e8e8e8" stroke="#0db7ed" stroke-width="2" opacity="0.8"/>
  <!-- Dockerfile icon -->
  <rect x="100" y="100" width="80" height="100" rx="5" fill="#343a40" stroke="#69db7c" stroke-width="2" opacity="0.6"/>
  <text x="140" y="140" text-anchor="middle" font-family="monospace" font-size="10" fill="#69db7c" opacity="0.8">FROM</text>
  <text x="140" y="158" text-anchor="middle" font-family="monospace" font-size="10" fill="#69db7c" opacity="0.8">RUN</text>
  <text x="140" y="176" text-anchor="middle" font-family="monospace" font-size="10" fill="#69db7c" opacity="0.8">COPY</text>
  <text x="140" y="194" text-anchor="middle" font-family="monospace" font-size="10" fill="#69db7c" opacity="0.8">CMD</text>
  <!-- Code brackets -->
  <text x="620" y="170" font-family="monospace" font-size="60" fill="#74c0fc" opacity="0.4">{}</text>
  <!-- Layers -->
  <rect x="580" y="240" width="120" height="15" rx="3" fill="#ff6b6b" opacity="0.4"/>
  <rect x="580" y="260" width="120" height="15" rx="3" fill="#ffd43b" opacity="0.4"/>
  <rect x="580" y="280" width="120" height="15" rx="3" fill="#69db7c" opacity="0.4"/>
  <rect x="580" y="300" width="120" height="15" rx="3" fill="#74c0fc" opacity="0.4"/>
  <!-- Title -->
  <text x="400" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#adb5bd" letter-spacing="3">DOCKER FOR DEVELOPERS</text>
</svg>

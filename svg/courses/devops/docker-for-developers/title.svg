  <ellipse cx="568.8889" cy="320" rx="213.3333" ry="92.4444" fill="var(--primary-fill)" opacity="0.7" />
  <path d="M 355.5556 320 Q 298.6667 224 327.1111 160 Q 355.5556 192 384 264" fill="var(--primary-fill)" opacity="0.6" />
  <rect x="412.4444" y="200" width="56.8889" height="56" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" opacity="0.8" />

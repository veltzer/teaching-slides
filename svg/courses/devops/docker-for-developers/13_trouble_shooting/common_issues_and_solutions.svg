<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="26.4149" font-weight="bold">Common Docker Issues</text>
  <rect x="40" y="85.7895" width="278.5714" height="209.8684" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="179.2857" y="162.1053" text-anchor="middle" font-size="22.0123" font-weight="bold" fill="var(--danger-accent)">Build Failures</text>
  <text x="179.2857" y="230.7895" text-anchor="middle" font-size="22.0123">Missing deps</text>
  <text x="179.2857" y="276.5789" text-anchor="middle" font-size="22.0123">Wrong base image</text>
  <rect x="339.9999" y="85.7895" width="278.5714" height="209.8684" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="479.2857" y="162.1053" text-anchor="middle" font-size="22.0123" font-weight="bold" fill="var(--warn-accent)">Runtime Errors</text>
  <text x="479.2857" y="230.7895" text-anchor="middle" font-size="22.0123">OOM killed</text>
  <text x="479.2857" y="276.5789" text-anchor="middle" font-size="22.0123">Permission denied</text>
  <rect x="640" y="85.7895" width="300.0001" height="209.8684" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="790" y="162.1053" text-anchor="middle" font-size="22.0123" font-weight="bold">Networking</text>
  <text x="790" y="230.7895" text-anchor="middle" font-size="22.0123">Port conflicts</text>
  <text x="790" y="276.5789" text-anchor="middle" font-size="22.0123">DNS resolution</text>
  <rect x="961.4286" y="85.7895" width="278.5714" height="209.8684" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1100.7143" y="162.1053" text-anchor="middle" font-size="22.0123" font-weight="bold">Storage</text>
  <text x="1100.7143" y="230.7895" text-anchor="middle" font-size="22.0123">Disk full</text>
  <text x="1100.7143" y="276.5789" text-anchor="middle" font-size="22.0123">Volume mount errors</text>
  <rect x="168.5714" y="371.9737" width="942.8572" height="152.6316" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="436.8421" text-anchor="middle" font-size="24.2136" font-weight="bold" fill="var(--ok-accent)">Debugging Toolkit</text>
  <text x="640" y="497.8947" text-anchor="middle" font-size="22.0123">docker logs | docker exec | docker inspect | docker stats</text>
  <text x="640" y="620" text-anchor="middle" font-size="22.0123" fill="var(--text-muted)">Always check logs first, then inspect container state</text>
</svg>
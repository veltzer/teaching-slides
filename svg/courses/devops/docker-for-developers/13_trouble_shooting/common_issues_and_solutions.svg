<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="278.5714" height="227.857131224489" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.251857021007" filter="url(#shadow)"/>
  <text x="179.2857" y="122.857158367348" text-anchor="middle" font-size="22.936292050587" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Build Failures</text>
  <text x="179.2857" y="197.428579183674" text-anchor="middle" font-size="22.936292050587" font-family="Arial, sans-serif" fill="var(--danger-text)">Missing deps</text>
  <text x="179.2857" y="247.142787346935" text-anchor="middle" font-size="22.936292050587" font-family="Arial, sans-serif" fill="var(--danger-text)">Wrong base image</text>
  <rect x="339.9999" y="40" width="278.5714" height="227.857131224489" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.251857021007" filter="url(#shadow)"/>
  <text x="479.2857" y="122.857158367348" text-anchor="middle" font-size="22.936292050587" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Runtime Errors</text>
  <text x="479.2857" y="197.428579183674" text-anchor="middle" font-size="22.936292050587" font-family="Arial, sans-serif" fill="var(--warn-text)">OOM killed</text>
  <text x="479.2857" y="247.142787346935" text-anchor="middle" font-size="22.936292050587" font-family="Arial, sans-serif" fill="var(--warn-text)">Permission denied</text>
  <rect x="640" y="40" width="300.0001" height="227.857131224489" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.251857021007" filter="url(#shadow)"/>
  <text x="790" y="122.857158367348" text-anchor="middle" font-size="22.936292050587" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Networking</text>
  <text x="790" y="197.428579183674" text-anchor="middle" font-size="22.936292050587" font-family="Arial, sans-serif" fill="var(--info-text)">Port conflicts</text>
  <text x="790" y="247.142787346935" text-anchor="middle" font-size="22.936292050587" font-family="Arial, sans-serif" fill="var(--info-text)">DNS resolution</text>
  <rect x="961.4286" y="40" width="278.5714" height="227.857131224489" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.251857021007" filter="url(#shadow)"/>
  <text x="1100.7143" y="122.857158367348" text-anchor="middle" font-size="22.936292050587" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Storage</text>
  <text x="1100.7143" y="197.428579183674" text-anchor="middle" font-size="22.936292050587" font-family="Arial, sans-serif" fill="var(--primary-text)">Disk full</text>
  <text x="1100.7143" y="247.142787346935" text-anchor="middle" font-size="22.936292050587" font-family="Arial, sans-serif" fill="var(--primary-text)">Volume mount errors</text>
  <rect x="168.5714" y="350.714289591837" width="942.8572" height="165.714316734695" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.251857021007" filter="url(#shadow)"/>
  <text x="640" y="421.142841632652" text-anchor="middle" font-size="25.229994193977" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Debugging Toolkit</text>
  <text x="640" y="487.428524897957" text-anchor="middle" font-size="22.936292050587" font-family="Arial, sans-serif" fill="var(--ok-text)">docker logs | docker exec | docker inspect | docker stats</text>
  <text x="640" y="620" text-anchor="middle" font-size="22.936292050587" fill="var(--text-muted)" font-family="Arial, sans-serif">Always check logs first, then inspect container state</text>
</svg>

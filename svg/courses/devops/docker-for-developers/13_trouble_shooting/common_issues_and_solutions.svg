<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <text x="640" y="64.8" text-anchor="middle" font-size="25.6" font-weight="bold">Common Docker Issues</text>
  <rect x="42.6667" y="108" width="277.3333" height="198" fill="#ffebee" stroke="#c62828" stroke-width="4.2667" rx="10.6667" />
  <text x="181.3333" y="180" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="#c62828">Build Failures</text>
  <text x="181.3333" y="244.8" text-anchor="middle" font-size="21.3333">Missing deps</text>
  <text x="181.3333" y="288" text-anchor="middle" font-size="21.3333">Wrong base image</text>
  <rect x="341.3333" y="108" width="277.3333" height="198" fill="#fff3e0" stroke="#e65100" stroke-width="4.2667" rx="10.6667" />
  <text x="480" y="180" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="#e65100">Runtime Errors</text>
  <text x="480" y="244.8" text-anchor="middle" font-size="21.3333">OOM killed</text>
  <text x="480" y="288" text-anchor="middle" font-size="21.3333">Permission denied</text>
  <rect x="640" y="108" width="298.6667" height="198" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="789.3333" y="180" text-anchor="middle" font-size="21.3333" font-weight="bold">Networking</text>
  <text x="789.3333" y="244.8" text-anchor="middle" font-size="21.3333">Port conflicts</text>
  <text x="789.3333" y="288" text-anchor="middle" font-size="21.3333">DNS resolution</text>
  <rect x="960" y="108" width="277.3333" height="198" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1098.6667" y="180" text-anchor="middle" font-size="21.3333" font-weight="bold">Storage</text>
  <text x="1098.6667" y="244.8" text-anchor="middle" font-size="21.3333">Disk full</text>
  <text x="1098.6667" y="288" text-anchor="middle" font-size="21.3333">Volume mount errors</text>
  <rect x="170.6667" y="378" width="938.6667" height="144" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="439.2" text-anchor="middle" font-size="23.4667" font-weight="bold" fill="#2e7d32">Debugging Toolkit</text>
  <text x="640" y="496.8" text-anchor="middle" font-size="21.3333">docker logs | docker exec | docker inspect | docker stats</text>
  <text x="640" y="612" text-anchor="middle" font-size="21.3333" fill="#555">Always check logs first, then inspect container state</text>
</svg>
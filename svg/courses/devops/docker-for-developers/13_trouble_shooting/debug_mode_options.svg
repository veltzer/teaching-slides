<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="64.8" text-anchor="middle" font-size="25.6" font-weight="bold">Debug Mode Options</text>
  <rect x="42.6667" y="108" width="576" height="270" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="330.6667" y="172.8" text-anchor="middle" font-size="23.4667" font-weight="bold">Runtime Debug Flags</text>
  <rect x="74.6667" y="198" width="245.3333" height="144" fill="#f3e5f5" stroke="#333" stroke-width="3.2" rx="8.5333" />
  <text x="196.2667" y="259.2" text-anchor="middle" font-size="21.3333">--entrypoint sh</text>
  <text x="196.2667" y="309.6" text-anchor="middle" font-size="21.3333">Override CMD</text>
  <rect x="341.3333" y="198" width="245.3333" height="144" fill="#f3e5f5" stroke="#333" stroke-width="3.2" rx="8.5333" />
  <text x="462.9333" y="259.2" text-anchor="middle" font-size="21.3333">-e DEBUG=1</text>
  <text x="462.9333" y="309.6" text-anchor="middle" font-size="21.3333">Verbose logging</text>
  <rect x="661.3333" y="108" width="576" height="270" fill="#fff3e0" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="949.3333" y="172.8" text-anchor="middle" font-size="23.4667" font-weight="bold">Docker Daemon Debug</text>
  <rect x="693.3333" y="198" width="245.3333" height="144" fill="#ffebee" stroke="#333" stroke-width="3.2" rx="8.5333" />
  <text x="814.9333" y="259.2" text-anchor="middle" font-size="21.3333">dockerd --debug</text>
  <text x="814.9333" y="309.6" text-anchor="middle" font-size="21.3333">Daemon logs</text>
  <rect x="960" y="198" width="245.3333" height="144" fill="#ffebee" stroke="#333" stroke-width="3.2" rx="8.5333" />
  <text x="1081.6" y="259.2" text-anchor="middle" font-size="21.3333">DOCKER_CLI_DEBUG</text>
  <text x="1081.6" y="309.6" text-anchor="middle" font-size="21.3333">CLI verbose</text>
  <rect x="42.6667" y="432" width="1194.6667" height="126" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3.2" rx="10.6667" />
  <text x="640" y="496.8" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="#2e7d32">Tip: docker run --rm -it --entrypoint sh myimage -- start a shell in any image</text>
  <text x="640" y="648" text-anchor="middle" font-size="21.3333" fill="#555">Use docker events to watch real-time container lifecycle events</text>
</svg>
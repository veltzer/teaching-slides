<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:text x="632.0988" y="64" text-anchor="middle" font-size="25.284" font-weight="bold">Debug Mode Options</ns0:text>
  <ns0:rect x="42.14" y="106.6667" width="568.8889" height="266.6667" fill="#e3f2fd" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="326.5844" y="170.6667" text-anchor="middle" font-size="23.177" font-weight="bold">Runtime Debug Flags</ns0:text>
  <ns0:rect x="73.7449" y="195.5556" width="242.3045" height="142.2222" fill="#f3e5f5" stroke="#333" stroke-width="3.1605" rx="8.428" />
  <ns0:text x="193.8437" y="256" text-anchor="middle" font-size="21.0699">--entrypoint sh</ns0:text>
  <ns0:text x="193.8437" y="305.7778" text-anchor="middle" font-size="21.0699">Override CMD</ns0:text>
  <ns0:rect x="337.1193" y="195.5556" width="242.3045" height="142.2222" fill="#f3e5f5" stroke="#333" stroke-width="3.1605" rx="8.428" />
  <ns0:text x="457.2181" y="256" text-anchor="middle" font-size="21.0699">-e DEBUG=1</ns0:text>
  <ns0:text x="457.2181" y="305.7778" text-anchor="middle" font-size="21.0699">Verbose logging</ns0:text>
  <ns0:rect x="653.1687" y="106.6667" width="568.8889" height="266.6667" fill="#fff3e0" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="937.6131" y="170.6667" text-anchor="middle" font-size="23.177" font-weight="bold">Docker Daemon Debug</ns0:text>
  <ns0:rect x="684.7736" y="195.5556" width="242.3045" height="142.2222" fill="#ffebee" stroke="#333" stroke-width="3.1605" rx="8.428" />
  <ns0:text x="804.8724" y="256" text-anchor="middle" font-size="21.0699">dockerd --debug</ns0:text>
  <ns0:text x="804.8724" y="305.7778" text-anchor="middle" font-size="21.0699">Daemon logs</ns0:text>
  <ns0:rect x="948.1481" y="195.5556" width="242.3045" height="142.2222" fill="#ffebee" stroke="#333" stroke-width="3.1605" rx="8.428" />
  <ns0:text x="1068.2469" y="256" text-anchor="middle" font-size="21.0699">DOCKER_CLI_DEBUG</ns0:text>
  <ns0:text x="1068.2469" y="305.7778" text-anchor="middle" font-size="21.0699">CLI verbose</ns0:text>
  <ns0:rect x="42.14" y="426.6667" width="1179.9177" height="124.4444" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3.1605" rx="10.535" />
  <ns0:text x="632.0988" y="490.6667" text-anchor="middle" font-size="21.0699" font-weight="bold" fill="#2e7d32">Tip: docker run --rm -it --entrypoint sh myimage -- start a shell in any image</ns0:text>
  <ns0:text x="632.0988" y="640" text-anchor="middle" font-size="21.0699" fill="#555">Use docker events to watch real-time container lifecycle events</ns0:text>
</ns0:svg>
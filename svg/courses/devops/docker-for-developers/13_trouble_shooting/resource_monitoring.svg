<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arrowd4_12_trouble_shooting" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="640" y="64.8" text-anchor="middle" font-size="25.6" font-weight="bold">Resource Monitoring Commands</text>
  <rect x="42.6667" y="108" width="362.6667" height="234" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="224" y="180" text-anchor="middle" font-size="21.3333" font-weight="bold">docker stats</text>
  <text x="224" y="237.6" text-anchor="middle" font-size="21.3333">CPU% | MEM | NET I/O</text>
  <text x="224" y="295.2" text-anchor="middle" font-size="21.3333">Real-time dashboard</text>
  <rect x="458.6667" y="108" width="362.6667" height="234" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="180" text-anchor="middle" font-size="21.3333" font-weight="bold">docker top</text>
  <text x="640" y="237.6" text-anchor="middle" font-size="21.3333">PID | USER | CMD</text>
  <text x="640" y="295.2" text-anchor="middle" font-size="21.3333">Process listing</text>
  <rect x="874.6667" y="108" width="362.6667" height="234" fill="#fff3e0" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1056" y="180" text-anchor="middle" font-size="21.3333" font-weight="bold">docker system df</text>
  <text x="1056" y="237.6" text-anchor="middle" font-size="21.3333">Images | Containers</text>
  <text x="1056" y="295.2" text-anchor="middle" font-size="21.3333">Disk usage</text>
  <rect x="128" y="396" width="490.6667" height="144" fill="#ffebee" stroke="#c62828" stroke-width="3.2" rx="10.6667" />
  <text x="373.3333" y="460.8" text-anchor="middle" font-size="21.3333" fill="#c62828" font-weight="bold">Warning Signs</text>
  <text x="373.3333" y="514.8" text-anchor="middle" font-size="21.3333" fill="#c62828">CPU &gt;80% | MEM &gt;90%</text>
  <rect x="661.3333" y="396" width="490.6667" height="144" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3.2" rx="10.6667" />
  <text x="906.6667" y="460.8" text-anchor="middle" font-size="21.3333" fill="#2e7d32" font-weight="bold">Action</text>
  <text x="906.6667" y="514.8" text-anchor="middle" font-size="21.3333" fill="#2e7d32">Scale up or set limits</text>
  <text x="640" y="630" text-anchor="middle" font-size="21.3333" fill="#555">docker stats --no-stream --format "table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}"</text>
</svg>
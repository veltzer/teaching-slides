<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd1_12_trouble_shooting" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="25.9908" font-weight="bold">Remote Debugging with Docker</text>
  <rect x="40" y="102.8025" width="300" height="221.6561" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="190" y="176.6879" text-anchor="middle" font-size="21.659" font-weight="bold">IDE Debugger</text>
  <text x="190" y="243.1847" text-anchor="middle" font-size="21.659">localhost:9229</text>
  <text x="190" y="291.2102" text-anchor="middle" font-size="21.659">Breakpoints set</text>
  <line x1="339.9999" y1="213.6306" x2="425.7143" y2="213.6306" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_12_trouble_shooting)" />
  <rect x="425.7143" y="102.8025" width="428.5715" height="221.6561" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="639.9999" y="176.6879" text-anchor="middle" font-size="21.659" font-weight="bold">Docker Container</text>
  <text x="639.9999" y="243.1847" text-anchor="middle" font-size="21.659">-p 9229:9229</text>
  <text x="639.9999" y="291.2102" text-anchor="middle" font-size="21.659">node --inspect=0.0.0.0:9229</text>
  <line x1="854.2856" y1="213.6306" x2="940" y2="213.6306" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_12_trouble_shooting)" />
  <rect x="940" y="102.8025" width="300" height="221.6561" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1089.9999" y="176.6879" text-anchor="middle" font-size="21.659" font-weight="bold">Application</text>
  <text x="1089.9999" y="243.1847" text-anchor="middle" font-size="21.659">Debug mode</text>
  <text x="1089.9999" y="291.2102" text-anchor="middle" font-size="21.659">Pauses on break</text>
  <rect x="82.8571" y="398.3439" width="1114.2856" height="129.2994" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" stroke-dasharray="8.5333 4.2667" />
  <text x="639.9999" y="479.6178" text-anchor="middle" font-size="21.659">Also: docker exec -it container bash for interactive shell access</text>
  <text x="639.9999" y="620" text-anchor="middle" font-size="21.659" fill="var(--text-muted)">Expose debug ports in development only, never in production</text>
</svg>
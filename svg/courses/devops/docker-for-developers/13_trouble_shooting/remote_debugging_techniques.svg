<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="300" height="248.571460612242" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.353851181964" filter="url(#shadow)"/>
  <text x="190" y="122.857190918363" text-anchor="middle" font-size="22.936343791692" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">IDE Debugger</text>
  <text x="190" y="197.428595459181" text-anchor="middle" font-size="22.936343791692" font-family="Arial, sans-serif" fill="var(--primary-text)">localhost:9229</text>
  <text x="190" y="251.285758341833" text-anchor="middle" font-size="22.936343791692" font-family="Arial, sans-serif" fill="var(--primary-text)">Breakpoints set</text>
  <line x1="339.9999" y1="164.285786377544" x2="425.7143" y2="164.285786377544" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="425.7143" y="40" width="428.5715" height="248.571460612242" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.353851181964" filter="url(#shadow)"/>
  <text x="639.9999" y="122.857190918363" text-anchor="middle" font-size="22.936343791692" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Docker Container</text>
  <text x="639.9999" y="197.428595459181" text-anchor="middle" font-size="22.936343791692" font-family="Arial, sans-serif" fill="var(--info-text)">-p 9229:9229</text>
  <text x="639.9999" y="251.285758341833" text-anchor="middle" font-size="22.936343791692" font-family="Arial, sans-serif" fill="var(--info-text)">node --inspect=0.0.0.0:9229</text>
  <line x1="854.2856" y1="164.285786377544" x2="940" y2="164.285786377544" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="940" y="40" width="300" height="248.571460612242" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.353851181964" filter="url(#shadow)"/>
  <text x="1089.9999" y="122.857190918363" text-anchor="middle" font-size="22.936343791692" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Application</text>
  <text x="1089.9999" y="197.428595459181" text-anchor="middle" font-size="22.936343791692" font-family="Arial, sans-serif" fill="var(--ok-text)">Debug mode</text>
  <text x="1089.9999" y="251.285758341833" text-anchor="middle" font-size="22.936343791692" font-family="Arial, sans-serif" fill="var(--ok-text)">Pauses on break</text>
  <rect x="82.8571" y="371.428539387758" width="1114.2856" height="145.000028035712" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.353851181964" stroke-dasharray="8.5333 4.2667" filter="url(#shadow)"/>
  <text x="639.9999" y="462.571404540819" text-anchor="middle" font-size="22.936343791692" font-family="Arial, sans-serif" fill="var(--warn-text)">Also: docker exec -it container bash for interactive shell access</text>
  <text x="639.9999" y="620" text-anchor="middle" font-size="22.936343791692" fill="var(--text-muted)" font-family="Arial, sans-serif">Expose debug ports in development only, never in production</text>
</svg>

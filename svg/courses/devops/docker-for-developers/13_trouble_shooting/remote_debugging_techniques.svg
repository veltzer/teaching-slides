<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrowd1_12_trouble_shooting" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="640" y="64.8" text-anchor="middle" font-size="25.6" font-weight="bold">Remote Debugging with Docker</text>
  <rect x="42.6667" y="126" width="298.6667" height="216" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="192" y="198" text-anchor="middle" font-size="21.3333" font-weight="bold">IDE Debugger</text>
  <text x="192" y="262.8" text-anchor="middle" font-size="21.3333">localhost:9229</text>
  <text x="192" y="309.6" text-anchor="middle" font-size="21.3333">Breakpoints set</text>
  <line x1="341.3333" y1="234" x2="426.6667" y2="234" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowd1_12_trouble_shooting)" />
  <rect x="426.6667" y="126" width="426.6667" height="216" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="198" text-anchor="middle" font-size="21.3333" font-weight="bold">Docker Container</text>
  <text x="640" y="262.8" text-anchor="middle" font-size="21.3333">-p 9229:9229</text>
  <text x="640" y="309.6" text-anchor="middle" font-size="21.3333">node --inspect=0.0.0.0:9229</text>
  <line x1="853.3333" y1="234" x2="938.6667" y2="234" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowd1_12_trouble_shooting)" />
  <rect x="938.6667" y="126" width="298.6667" height="216" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1088" y="198" text-anchor="middle" font-size="21.3333" font-weight="bold">Application</text>
  <text x="1088" y="262.8" text-anchor="middle" font-size="21.3333">Debug mode</text>
  <text x="1088" y="309.6" text-anchor="middle" font-size="21.3333">Pauses on break</text>
  <rect x="85.3333" y="414" width="1109.3333" height="126" fill="#fff3e0" stroke="#333" stroke-width="2.1333" rx="10.6667" stroke-dasharray="8.5333 4.2667" />
  <text x="640" y="493.2" text-anchor="middle" font-size="21.3333">Also: docker exec -it container bash for interactive shell access</text>
  <text x="640" y="630" text-anchor="middle" font-size="21.3333" fill="#555">Expose debug ports in development only, never in production</text>
</svg>
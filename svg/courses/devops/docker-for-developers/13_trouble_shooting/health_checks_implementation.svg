<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <text x="629.4737" y="40" text-anchor="middle" font-size="26.1821" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Health Check Flow</text>
  <rect x="40" y="85.7895" width="273.6842" height="152.6316" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="176.8421" y="154.4737" text-anchor="middle" font-size="21.8184" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Docker Daemon</text>
  <text x="176.8421" y="207.8947" text-anchor="middle" font-size="21.8184" font-family="Arial, sans-serif" fill="var(--primary-text)">Runs HEALTHCHECK</text>
  <line x1="313.6842" y1="162.1053" x2="397.8947" y2="162.1053" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="355.7895" y="131.5789" font-size="21.8184" font-family="Arial, sans-serif" fill="var(--text)">interval</text>
  <rect x="397.8947" y="85.7895" width="273.6842" height="152.6316" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="534.7368" y="154.4737" text-anchor="middle" font-size="21.8184" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Health Probe</text>
  <text x="534.7368" y="207.8947" text-anchor="middle" font-size="21.8184" font-family="Arial, sans-serif" fill="var(--info-text)">curl / wget / CMD</text>
  <line x1="671.579" y1="123.9474" x2="797.8948" y2="123.9474" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="734.7369" y="101.0526" font-size="21.8184" font-family="Arial, sans-serif" fill="var(--text)">exit 0</text>
  <rect x="797.8948" y="66.7105" width="210.5263" height="114.4737" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="903.1579" y="143.0263" text-anchor="middle" font-size="21.8184" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">Healthy</text>
  <line x1="671.579" y1="200.2632" x2="797.8948" y2="200.2632" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="734.7369" y="249.8684" font-size="21.8184" fill="var(--danger-accent)" font-family="Arial, sans-serif">exit 1</text>
  <rect x="797.8948" y="162.1053" width="210.5263" height="114.4737" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="903.1579" y="238.4211" text-anchor="middle" font-size="21.8184" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">Unhealthy</text>
  <line x1="1008.4211" y1="219.3421" x2="1092.6316" y2="219.3421" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="1092.6316" y="162.1053" width="147.3684" height="114.4737" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1166.3158" y="238.4211" text-anchor="middle" font-size="21.8184" font-family="Arial, sans-serif" fill="var(--warn-text)">Restart?</text>
  <rect x="82.1052" y="352.8947" width="1094.7369" height="171.7105" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" stroke-dasharray="8.5333 4.2667" filter="url(#shadow)"/>
  <text x="629.4737" y="417.7632" text-anchor="middle" font-size="21.8184" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Dockerfile HEALTHCHECK</text>
  <text x="629.4737" y="486.4474" text-anchor="middle" font-size="21.8184" font-family="Arial, sans-serif" fill="var(--primary-text)">HEALTHCHECK --interval=30s --timeout=3s --retries=3 CMD curl -f http://localhost/ || exit 1</text>
  <text x="629.4737" y="620" text-anchor="middle" font-size="21.8184" fill="var(--text-muted)" font-family="Arial, sans-serif">docker inspect --format='{{.State.Health.Status}}' container</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd2_12_trouble_shooting" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="629.4737" y="40" text-anchor="middle" font-size="26.1821" font-weight="bold">Health Check Flow</text>
  <rect x="40" y="85.7895" width="273.6842" height="152.6316" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="176.8421" y="154.4737" text-anchor="middle" font-size="21.8184" font-weight="bold">Docker Daemon</text>
  <text x="176.8421" y="207.8947" text-anchor="middle" font-size="21.8184">Runs HEALTHCHECK</text>
  <line x1="313.6842" y1="162.1053" x2="397.8947" y2="162.1053" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd2_12_trouble_shooting)" />
  <text x="355.7895" y="131.5789" font-size="21.8184">interval</text>
  <rect x="397.8947" y="85.7895" width="273.6842" height="152.6316" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="534.7368" y="154.4737" text-anchor="middle" font-size="21.8184" font-weight="bold">Health Probe</text>
  <text x="534.7368" y="207.8947" text-anchor="middle" font-size="21.8184">curl / wget / CMD</text>
  <line x1="671.579" y1="123.9474" x2="797.8948" y2="123.9474" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd2_12_trouble_shooting)" />
  <text x="734.7369" y="101.0526" font-size="21.8184">exit 0</text>
  <rect x="797.8948" y="66.7105" width="210.5263" height="114.4737" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="903.1579" y="143.0263" text-anchor="middle" font-size="21.8184" fill="var(--ok-accent)" font-weight="bold">Healthy</text>
  <line x1="671.579" y1="200.2632" x2="797.8948" y2="200.2632" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrowd2_12_trouble_shooting)" />
  <text x="734.7369" y="249.8684" font-size="21.8184" fill="var(--danger-accent)">exit 1</text>
  <rect x="797.8948" y="162.1053" width="210.5263" height="114.4737" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="903.1579" y="238.4211" text-anchor="middle" font-size="21.8184" fill="var(--danger-accent)" font-weight="bold">Unhealthy</text>
  <line x1="1008.4211" y1="219.3421" x2="1092.6316" y2="219.3421" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrowd2_12_trouble_shooting)" />
  <rect x="1092.6316" y="162.1053" width="147.3684" height="114.4737" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1166.3158" y="238.4211" text-anchor="middle" font-size="21.8184">Restart?</text>
  <rect x="82.1052" y="352.8947" width="1094.7369" height="171.7105" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" stroke-dasharray="8.5333 4.2667" filter="url(#shadow)"/>
  <text x="629.4737" y="417.7632" text-anchor="middle" font-size="21.8184" font-weight="bold">Dockerfile HEALTHCHECK</text>
  <text x="629.4737" y="486.4474" text-anchor="middle" font-size="21.8184">HEALTHCHECK --interval=30s --timeout=3s --retries=3 CMD curl -f http://localhost/ || exit 1</text>
  <text x="629.4737" y="620" text-anchor="middle" font-size="21.8184" fill="var(--text-muted)">docker inspect --format='{{.State.Health.Status}}' container</text>
</svg>
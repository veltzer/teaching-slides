<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arrowd2_12_trouble_shooting" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="640" y="64.8" text-anchor="middle" font-size="25.6" font-weight="bold">Health Check Flow</text>
  <rect x="42.6667" y="108" width="277.3333" height="144" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="181.3333" y="172.8" text-anchor="middle" font-size="21.3333" font-weight="bold">Docker Daemon</text>
  <text x="181.3333" y="223.2" text-anchor="middle" font-size="21.3333">Runs HEALTHCHECK</text>
  <line x1="320" y1="180" x2="405.3333" y2="180" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowd2_12_trouble_shooting)" />
  <text x="362.6667" y="151.2" font-size="21.3333">interval</text>
  <rect x="405.3333" y="108" width="277.3333" height="144" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="544" y="172.8" text-anchor="middle" font-size="21.3333" font-weight="bold">Health Probe</text>
  <text x="544" y="223.2" text-anchor="middle" font-size="21.3333">curl / wget / CMD</text>
  <line x1="682.6667" y1="144" x2="810.6667" y2="144" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowd2_12_trouble_shooting)" />
  <text x="746.6667" y="122.4" font-size="21.3333">exit 0</text>
  <rect x="810.6667" y="90" width="213.3333" height="108" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4.2667" rx="10.6667" />
  <text x="917.3333" y="162" text-anchor="middle" font-size="21.3333" fill="#2e7d32" font-weight="bold">Healthy</text>
  <line x1="682.6667" y1="216" x2="810.6667" y2="216" stroke="#c62828" stroke-width="4.2667" marker-end="url(#arrowd2_12_trouble_shooting)" />
  <text x="746.6667" y="262.8" font-size="21.3333" fill="#c62828">exit 1</text>
  <rect x="810.6667" y="180" width="213.3333" height="108" fill="#ffebee" stroke="#c62828" stroke-width="4.2667" rx="10.6667" />
  <text x="917.3333" y="252" text-anchor="middle" font-size="21.3333" fill="#c62828" font-weight="bold">Unhealthy</text>
  <line x1="1024" y1="234" x2="1109.3333" y2="234" stroke="#c62828" stroke-width="4.2667" marker-end="url(#arrowd2_12_trouble_shooting)" />
  <rect x="1109.3333" y="180" width="149.3333" height="108" fill="#fff3e0" stroke="#333" stroke-width="3.2" rx="8.5333" />
  <text x="1184" y="252" text-anchor="middle" font-size="21.3333">Restart?</text>
  <rect x="85.3333" y="360" width="1109.3333" height="162" fill="#e3f2fd" stroke="#333" stroke-width="2.1333" rx="10.6667" stroke-dasharray="8.5333 4.2667" />
  <text x="640" y="421.2" text-anchor="middle" font-size="21.3333" font-weight="bold">Dockerfile HEALTHCHECK</text>
  <text x="640" y="486" text-anchor="middle" font-size="21.3333">HEALTHCHECK --interval=30s --timeout=3s --retries=3 CMD curl -f http://localhost/ || exit 1</text>
  <text x="640" y="612" text-anchor="middle" font-size="21.3333" fill="#555">docker inspect --format='{{.State.Health.Status}}' container</text>
</svg>
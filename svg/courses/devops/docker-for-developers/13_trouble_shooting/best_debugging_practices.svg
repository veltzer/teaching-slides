<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="64.8" text-anchor="middle" font-size="25.6" font-weight="bold">Debugging Best Practices</text>
  <rect x="42.6667" y="108" width="373.3333" height="234" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="228.2667" y="172.8" text-anchor="middle" font-size="21.3333" font-weight="bold">1. Reproduce</text>
  <text x="228.2667" y="234" text-anchor="middle" font-size="21.3333">Same image tag</text>
  <text x="228.2667" y="288" text-anchor="middle" font-size="21.3333">Same env vars</text>
  <rect x="454.4" y="108" width="373.3333" height="234" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="172.8" text-anchor="middle" font-size="21.3333" font-weight="bold">2. Isolate</text>
  <text x="640" y="234" text-anchor="middle" font-size="21.3333">Minimal compose</text>
  <text x="640" y="288" text-anchor="middle" font-size="21.3333">One service at a time</text>
  <rect x="864" y="108" width="373.3333" height="234" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1049.6" y="172.8" text-anchor="middle" font-size="21.3333" font-weight="bold">3. Verify Fix</text>
  <text x="1049.6" y="234" text-anchor="middle" font-size="21.3333">Clean rebuild</text>
  <text x="1049.6" y="288" text-anchor="middle" font-size="21.3333">Test in CI</text>
  <rect x="42.6667" y="396" width="576" height="144" fill="#fff3e0" stroke="#333" stroke-width="3.2" rx="10.6667" />
  <text x="330.6667" y="460.8" text-anchor="middle" font-size="21.3333" font-weight="bold">Do: version pin, health checks, logs</text>
  <text x="330.6667" y="514.8" text-anchor="middle" font-size="21.3333">Structured JSON logging</text>
  <rect x="661.3333" y="396" width="576" height="144" fill="#ffebee" stroke="#c62828" stroke-width="3.2" rx="10.6667" />
  <text x="949.3333" y="460.8" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="#c62828">Avoid: latest tag, no limits, silent fails</text>
  <text x="949.3333" y="514.8" text-anchor="middle" font-size="21.3333" fill="#c62828">Ignoring exit codes</text>
  <text x="640" y="648" text-anchor="middle" font-size="21.3333" fill="#555">docker inspect -f '{{.State.ExitCode}}' container -- always check exit codes</text>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:text x="632.0988" y="64" text-anchor="middle" font-size="25.284" font-weight="bold">Debugging Best Practices</ns0:text>
  <ns0:rect x="42.14" y="106.6667" width="368.7242" height="231.1111" fill="#e3f2fd" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="225.4486" y="170.6667" text-anchor="middle" font-size="21.0699" font-weight="bold">1. Reproduce</ns0:text>
  <ns0:text x="225.4486" y="231.1111" text-anchor="middle" font-size="21.0699">Same image tag</ns0:text>
  <ns0:text x="225.4486" y="284.4444" text-anchor="middle" font-size="21.0699">Same env vars</ns0:text>
  <ns0:rect x="448.7901" y="106.6667" width="368.7242" height="231.1111" fill="#f3e5f5" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="632.0988" y="170.6667" text-anchor="middle" font-size="21.0699" font-weight="bold">2. Isolate</ns0:text>
  <ns0:text x="632.0988" y="231.1111" text-anchor="middle" font-size="21.0699">Minimal compose</ns0:text>
  <ns0:text x="632.0988" y="284.4444" text-anchor="middle" font-size="21.0699">One service at a time</ns0:text>
  <ns0:rect x="853.3333" y="106.6667" width="368.7242" height="231.1111" fill="#e8f5e9" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="1036.642" y="170.6667" text-anchor="middle" font-size="21.0699" font-weight="bold">3. Verify Fix</ns0:text>
  <ns0:text x="1036.642" y="231.1111" text-anchor="middle" font-size="21.0699">Clean rebuild</ns0:text>
  <ns0:text x="1036.642" y="284.4444" text-anchor="middle" font-size="21.0699">Test in CI</ns0:text>
  <ns0:rect x="42.14" y="391.1111" width="568.8889" height="142.2222" fill="#fff3e0" stroke="#333" stroke-width="3.1605" rx="10.535" />
  <ns0:text x="326.5844" y="455.1111" text-anchor="middle" font-size="21.0699" font-weight="bold">Do: version pin, health checks, logs</ns0:text>
  <ns0:text x="326.5844" y="508.4444" text-anchor="middle" font-size="21.0699">Structured JSON logging</ns0:text>
  <ns0:rect x="653.1687" y="391.1111" width="568.8889" height="142.2222" fill="#ffebee" stroke="#c62828" stroke-width="3.1605" rx="10.535" />
  <ns0:text x="937.6131" y="455.1111" text-anchor="middle" font-size="21.0699" font-weight="bold" fill="#c62828">Avoid: latest tag, no limits, silent fails</ns0:text>
  <ns0:text x="937.6131" y="508.4444" text-anchor="middle" font-size="21.0699" fill="#c62828">Ignoring exit codes</ns0:text>
  <ns0:text x="632.0988" y="640" text-anchor="middle" font-size="21.0699" fill="#555">docker inspect -f '{{.State.ExitCode}}' container -- always check exit codes</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="374.9999" height="251.333297333331" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.235383122261" filter="url(#shadow)"/>
  <text x="226.4285" y="109.599956799997" text-anchor="middle" font-size="22.158577078527" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">1. Reproduce</text>
  <text x="226.4285" y="175.333297333331" text-anchor="middle" font-size="22.158577078527" font-family="Arial, sans-serif" fill="var(--primary-text)">Same image tag</text>
  <text x="226.4285" y="233.333297333331" text-anchor="middle" font-size="22.158577078527" font-family="Arial, sans-serif" fill="var(--primary-text)">Same env vars</text>
  <rect x="453.5714" y="40" width="374.9999" height="251.333297333331" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.235383122261" filter="url(#shadow)"/>
  <text x="640" y="109.599956799997" text-anchor="middle" font-size="22.158577078527" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">2. Isolate</text>
  <text x="640" y="175.333297333331" text-anchor="middle" font-size="22.158577078527" font-family="Arial, sans-serif" fill="var(--info-text)">Minimal compose</text>
  <text x="640" y="233.333297333331" text-anchor="middle" font-size="22.158577078527" font-family="Arial, sans-serif" fill="var(--info-text)">One service at a time</text>
  <rect x="864.9999" y="40" width="374.9999" height="251.333297333331" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.235383122261" filter="url(#shadow)"/>
  <text x="1051.4286" y="109.599956799997" text-anchor="middle" font-size="22.158577078527" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">3. Verify Fix</text>
  <text x="1051.4286" y="175.333297333331" text-anchor="middle" font-size="22.158577078527" font-family="Arial, sans-serif" fill="var(--ok-text)">Clean rebuild</text>
  <text x="1051.4286" y="233.333297333331" text-anchor="middle" font-size="22.158577078527" font-family="Arial, sans-serif" fill="var(--ok-text)">Test in CI</text>
  <rect x="40" y="349.333297333331" width="578.5715" height="154.666702666669" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.235383122261" filter="url(#shadow)"/>
  <text x="329.2857" y="418.933254133328" text-anchor="middle" font-size="22.158577078527" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Do: version pin, health checks, logs</text>
  <text x="329.2857" y="476.933254133328" text-anchor="middle" font-size="22.158577078527" font-family="Arial, sans-serif" fill="var(--warn-text)">Structured JSON logging</text>
  <rect x="661.4285" y="349.333297333331" width="578.5715" height="154.666702666669" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.235383122261" filter="url(#shadow)"/>
  <text x="950.7142" y="418.933254133328" text-anchor="middle" font-size="22.158577078527" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Avoid: latest tag, no limits, silent fails</text>
  <text x="950.7142" y="476.933254133328" text-anchor="middle" font-size="22.158577078527" fill="var(--danger-accent)" font-family="Arial, sans-serif">Ignoring exit codes</text>
  <text x="640" y="620" text-anchor="middle" font-size="22.158577078527" fill="var(--text-muted)" font-family="Arial, sans-serif">docker inspect -f '{{.State.ExitCode}}' container -- always check exit codes</text>
</svg>

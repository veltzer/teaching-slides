<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arrowd5_12_trouble_shooting" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="640" y="64.8" text-anchor="middle" font-size="25.6" font-weight="bold">Log Collection Pipeline</text>
  <rect x="42.6667" y="126" width="256" height="198" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="170.6667" y="198" text-anchor="middle" font-size="21.3333" font-weight="bold">Container</text>
  <text x="170.6667" y="262.8" text-anchor="middle" font-size="21.3333">stdout/stderr</text>
  <line x1="298.6667" y1="223.2" x2="362.6667" y2="223.2" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowd5_12_trouble_shooting)" />
  <rect x="362.6667" y="126" width="256" height="198" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="490.6667" y="198" text-anchor="middle" font-size="21.3333" font-weight="bold">Log Driver</text>
  <text x="490.6667" y="262.8" text-anchor="middle" font-size="21.3333">json-file, syslog</text>
  <line x1="618.6667" y1="223.2" x2="682.6667" y2="223.2" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowd5_12_trouble_shooting)" />
  <rect x="682.6667" y="126" width="256" height="198" fill="#fff3e0" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="810.6667" y="198" text-anchor="middle" font-size="21.3333" font-weight="bold">Aggregator</text>
  <text x="810.6667" y="262.8" text-anchor="middle" font-size="21.3333">Fluentd / ELK</text>
  <line x1="938.6667" y1="223.2" x2="1002.6667" y2="223.2" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowd5_12_trouble_shooting)" />
  <rect x="1002.6667" y="126" width="234.6667" height="198" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1120" y="198" text-anchor="middle" font-size="21.3333" font-weight="bold">Search</text>
  <text x="1120" y="262.8" text-anchor="middle" font-size="21.3333">Kibana, Grafana</text>
  <rect x="85.3333" y="396" width="1109.3333" height="144" fill="#e3f2fd" stroke="#333" stroke-width="2.1333" rx="10.6667" stroke-dasharray="8.5333 4.2667" />
  <text x="640" y="460.8" text-anchor="middle" font-size="21.3333" font-weight="bold">Quick commands:</text>
  <text x="640" y="511.2" text-anchor="middle" font-size="21.3333">docker logs -f --tail 100 --since 1h container_name</text>
  <text x="640" y="630" text-anchor="middle" font-size="21.3333" fill="#555">Always log to stdout/stderr -- let Docker handle log routing</text>
</svg>
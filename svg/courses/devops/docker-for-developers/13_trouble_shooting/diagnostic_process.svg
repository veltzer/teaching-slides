<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd3_12_trouble_shooting" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="640" y="64.8" text-anchor="middle" font-size="25.6" font-weight="bold">Diagnostic Flowchart</text>
  <rect x="42.6667" y="108" width="234.6667" height="144" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="160" y="172.8" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="var(--danger-accent)">Problem</text>
  <text x="160" y="223.2" text-anchor="middle" font-size="21.3333">Container fails</text>
  <line x1="277.3333" y1="180" x2="330.6667" y2="180" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd3_12_trouble_shooting)" />
  <rect x="330.6667" y="108" width="213.3333" height="144" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="437.3333" y="172.8" text-anchor="middle" font-size="21.3333" font-weight="bold">docker logs</text>
  <text x="437.3333" y="223.2" text-anchor="middle" font-size="21.3333">Check output</text>
  <line x1="544" y1="180" x2="597.3333" y2="180" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd3_12_trouble_shooting)" />
  <rect x="597.3333" y="108" width="213.3333" height="144" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="704" y="172.8" text-anchor="middle" font-size="21.3333" font-weight="bold">docker inspect</text>
  <text x="704" y="223.2" text-anchor="middle" font-size="21.3333">Check config</text>
  <line x1="810.6667" y1="180" x2="864" y2="180" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd3_12_trouble_shooting)" />
  <rect x="864" y="108" width="170.6667" height="144" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="949.3333" y="172.8" text-anchor="middle" font-size="21.3333" font-weight="bold">docker exec</text>
  <text x="949.3333" y="223.2" text-anchor="middle" font-size="21.3333">Shell in</text>
  <line x1="1034.6667" y1="180" x2="1077.3333" y2="180" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd3_12_trouble_shooting)" />
  <rect x="1077.3333" y="108" width="170.6667" height="144" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1162.6667" y="172.8" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="var(--ok-accent)">Fix</text>
  <text x="1162.6667" y="223.2" text-anchor="middle" font-size="21.3333">Apply solution</text>
  <rect x="85.3333" y="324" width="1109.3333" height="180" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" stroke-dasharray="8.5333 4.2667" />
  <text x="640" y="388.8" text-anchor="middle" font-size="21.3333" font-weight="bold">Key questions at each step:</text>
  <text x="640" y="450" text-anchor="middle" font-size="21.3333">Exit code? | Environment correct? | Ports open? | Volumes mounted? | Permissions?</text>
  <text x="640" y="594" text-anchor="middle" font-size="21.3333" fill="var(--text-muted)">If container exits immediately: docker run -it --entrypoint sh image</text>
</svg>
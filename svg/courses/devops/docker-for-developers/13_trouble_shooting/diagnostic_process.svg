<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="634.6902" y="40" text-anchor="middle" font-size="26.7412" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Diagnostic Flowchart</text>
  <rect x="40" y="87.3469" width="233.6284" height="157.8231" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="156.8141" y="158.3673" text-anchor="middle" font-size="22.2843" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Problem</text>
  <text x="156.8141" y="213.6054" text-anchor="middle" font-size="22.2843" font-family="Arial, sans-serif" fill="var(--danger-text)">Container fails</text>
  <line x1="273.6283" y1="166.2585" x2="326.7257" y2="166.2585" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="326.7257" y="87.3469" width="212.3894" height="157.8231" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="432.9203" y="158.3673" text-anchor="middle" font-size="22.2843" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">docker logs</text>
  <text x="432.9203" y="213.6054" text-anchor="middle" font-size="22.2843" font-family="Arial, sans-serif" fill="var(--primary-text)">Check output</text>
  <line x1="539.115" y1="166.2585" x2="592.2123" y2="166.2585" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="592.2123" y="87.3469" width="212.3894" height="157.8231" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="698.4071" y="158.3673" text-anchor="middle" font-size="22.2843" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">docker inspect</text>
  <text x="698.4071" y="213.6054" text-anchor="middle" font-size="22.2843" font-family="Arial, sans-serif" fill="var(--info-text)">Check config</text>
  <line x1="804.6018" y1="166.2585" x2="857.6991" y2="166.2585" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="857.6991" y="87.3469" width="169.9115" height="157.8231" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="942.6548" y="158.3673" text-anchor="middle" font-size="22.2843" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">docker exec</text>
  <text x="942.6548" y="213.6054" text-anchor="middle" font-size="22.2843" font-family="Arial, sans-serif" fill="var(--warn-text)">Shell in</text>
  <line x1="1027.6106" y1="166.2585" x2="1070.0885" y2="166.2585" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1070.0885" y="87.3469" width="169.9115" height="157.8231" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1155.0443" y="158.3673" text-anchor="middle" font-size="22.2843" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Fix</text>
  <text x="1155.0443" y="213.6054" text-anchor="middle" font-size="22.2843" font-family="Arial, sans-serif" fill="var(--ok-text)">Apply solution</text>
  <rect x="82.4778" y="324.0816" width="1104.4248" height="197.2789" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" stroke-dasharray="8.5333 4.2667" filter="url(#shadow)"/>
  <text x="634.6902" y="395.102" text-anchor="middle" font-size="22.2843" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Key questions at each step:</text>
  <text x="634.6902" y="462.1769" text-anchor="middle" font-size="22.2843" font-family="Arial, sans-serif" fill="var(--primary-text)">Exit code? | Environment correct? | Ports open? | Volumes mounted? | Permissions?</text>
  <text x="634.6902" y="620" text-anchor="middle" font-size="22.2843" fill="var(--text-muted)" font-family="Arial, sans-serif">If container exits immediately: docker run -it --entrypoint sh image</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="342.8571" height="326.25" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="211.4285" y="119.75" text-anchor="middle" font-size="23.6006" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Host Machine</text>
  <text x="211.4285" y="192.25" text-anchor="middle" font-size="21.4549" font-family="Arial, sans-serif" fill="var(--warn-text)">External port: 8080</text>
  <text x="211.4285" y="264.7501" text-anchor="middle" font-size="21.4549" fill="var(--text-muted)" font-family="Arial, sans-serif">localhost:8080</text>
  <text x="211.4285" y="330.0001" text-anchor="middle" font-size="21.4549" fill="var(--text-muted)" font-family="Arial, sans-serif">0.0.0.0:8080</text>
  <line x1="382.8571" y1="203.125" x2="485.7142" y2="203.125" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="436.4284" y="166.8751" text-anchor="middle" font-size="21.4549" fill="var(--text-muted)" font-family="Arial, sans-serif">-p</text>
  <rect x="490" y="40" width="342.8571" height="326.25" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="661.4285" y="119.75" text-anchor="middle" font-size="23.6006" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Docker Proxy</text>
  <text x="661.4285" y="192.25" text-anchor="middle" font-size="21.4549" font-family="Arial, sans-serif" fill="var(--primary-text)">Port mapping</text>
  <text x="661.4285" y="264.7501" text-anchor="middle" font-size="21.4549" font-family="Arial, sans-serif" fill="var(--primary-text)">8080 -&gt; 80</text>
  <text x="661.4285" y="330.0001" text-anchor="middle" font-size="21.4549" fill="var(--text-muted)" font-family="Arial, sans-serif">iptables rules</text>
  <line x1="832.8571" y1="203.125" x2="935.7142" y2="203.125" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="939.9999" y="40" width="300.0001" height="326.25" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1089.9999" y="119.75" text-anchor="middle" font-size="23.6006" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Container</text>
  <text x="1089.9999" y="192.25" text-anchor="middle" font-size="21.4549" font-family="Arial, sans-serif" fill="var(--ok-text)">Internal port: 80</text>
  <text x="1089.9999" y="264.7501" text-anchor="middle" font-size="21.4549" fill="var(--text-muted)" font-family="Arial, sans-serif">EXPOSE 80</text>
  <text x="1089.9999" y="330.0001" text-anchor="middle" font-size="21.4549" fill="var(--text-muted)" font-family="Arial, sans-serif">in Dockerfile</text>
  <rect x="40" y="438.75" width="1200" height="181.25" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" stroke-dasharray="8.428 6.321"/>
  <text x="639.9999" y="511.25" text-anchor="middle" font-size="21.4549" fill="var(--text-muted)" font-family="Arial, sans-serif">docker run -p 8080:80 nginx</text>
  <text x="639.9999" y="572.875" text-anchor="middle" font-size="21.4549" fill="var(--text-muted)" font-family="Arial, sans-serif">EXPOSE alone does not publish ports - it is documentation only</text>
</svg>

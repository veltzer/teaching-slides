<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd1_07_networking" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="40" y="40" width="342.8571" height="326.25" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="211.4285" y="119.75" text-anchor="middle" font-size="23.6006" font-weight="bold">Host Machine</text>
  <text x="211.4285" y="192.25" text-anchor="middle" font-size="21.4549">External port: 8080</text>
  <text x="211.4285" y="264.7501" text-anchor="middle" font-size="21.4549" fill="var(--text-muted)">localhost:8080</text>
  <text x="211.4285" y="330.0001" text-anchor="middle" font-size="21.4549" fill="var(--text-muted)">0.0.0.0:8080</text>
  <line x1="382.8571" y1="203.125" x2="485.7142" y2="203.125" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_07_networking)" />
  <text x="436.4284" y="166.8751" text-anchor="middle" font-size="21.4549" fill="var(--text-muted)">-p</text>
  <rect x="490" y="40" width="342.8571" height="326.25" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="661.4285" y="119.75" text-anchor="middle" font-size="23.6006" font-weight="bold">Docker Proxy</text>
  <text x="661.4285" y="192.25" text-anchor="middle" font-size="21.4549">Port mapping</text>
  <text x="661.4285" y="264.7501" text-anchor="middle" font-size="21.4549">8080 -&gt; 80</text>
  <text x="661.4285" y="330.0001" text-anchor="middle" font-size="21.4549" fill="var(--text-muted)">iptables rules</text>
  <line x1="832.8571" y1="203.125" x2="935.7142" y2="203.125" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_07_networking)" />
  <rect x="939.9999" y="40" width="300.0001" height="326.25" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1089.9999" y="119.75" text-anchor="middle" font-size="23.6006" font-weight="bold">Container</text>
  <text x="1089.9999" y="192.25" text-anchor="middle" font-size="21.4549">Internal port: 80</text>
  <text x="1089.9999" y="264.7501" text-anchor="middle" font-size="21.4549" fill="var(--text-muted)">EXPOSE 80</text>
  <text x="1089.9999" y="330.0001" text-anchor="middle" font-size="21.4549" fill="var(--text-muted)">in Dockerfile</text>
  <rect x="40" y="438.75" width="1200" height="181.25" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" stroke-dasharray="8.428 6.321" />
  <text x="639.9999" y="511.25" text-anchor="middle" font-size="21.4549" fill="var(--text-muted)">docker run -p 8080:80 nginx</text>
  <text x="639.9999" y="572.875" text-anchor="middle" font-size="21.4549" fill="var(--text-muted)">EXPOSE alone does not publish ports - it is documentation only</text>
</svg>
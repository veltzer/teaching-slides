<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd3_07_networking" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="40" y="40" width="257.1429" height="136.4705" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="168.5713" y="125.2941" text-anchor="middle" font-size="22.8958" font-weight="bold">Container A</text>
  <line x1="168.5713" y1="176.4706" x2="168.5713" y2="620" stroke="var(--text)" stroke-width="2" />
  <rect x="489.9999" y="40" width="300" height="136.4705" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="639.9999" y="125.2941" text-anchor="middle" font-size="22.8958" font-weight="bold">Docker DNS</text>
  <line x1="639.9999" y1="176.4706" x2="639.9999" y2="620" stroke="var(--text)" stroke-width="2" />
  <rect x="982.8571" y="40" width="257.1429" height="136.4705" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1111.4285" y="125.2941" text-anchor="middle" font-size="22.8958" font-weight="bold">Container B</text>
  <line x1="1111.4285" y1="176.4706" x2="1111.4285" y2="620" stroke="var(--text)" stroke-width="2" />
  <line x1="168.5713" y1="261.7647" x2="635.7142" y2="261.7647" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd3_07_networking)" />
  <text x="404.2856" y="237.8823" text-anchor="middle" font-size="20.8144">resolve "db-server"</text>
  <line x1="639.9999" y1="347.0588" x2="172.8571" y2="347.0588" stroke="var(--text)" stroke-width="2" stroke-dasharray="9.9805 9.9805" marker-end="url(#arrowd3_07_networking)" />
  <text x="404.2856" y="323.1765" text-anchor="middle" font-size="20.8144">IP: 172.18.0.4</text>
  <line x1="168.5713" y1="449.4117" x2="1107.1428" y2="449.4117" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd3_07_networking)" />
  <text x="639.9999" y="425.5294" text-anchor="middle" font-size="20.8144">connect to 172.18.0.4:5432</text>
  <line x1="1111.4285" y1="551.7647" x2="172.8571" y2="551.7647" stroke="var(--text)" stroke-width="2" stroke-dasharray="9.9805 9.9805" marker-end="url(#arrowd3_07_networking)" />
  <text x="639.9999" y="527.8823" text-anchor="middle" font-size="20.8144" fill="var(--ok-accent)">connection established</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd6_07_networking" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="39.9221" y="67.3684" width="239.5322" height="134.7368" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="159.6881" y="151.5789" text-anchor="middle" font-size="21.9571" font-weight="bold">Admin</text>
  <line x1="159.6881" y1="202.1053" x2="159.6881" y2="640" stroke="var(--text)" stroke-width="2" />
  <rect x="479.0643" y="67.3684" width="239.5322" height="134.7368" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="598.8304" y="151.5789" text-anchor="middle" font-size="21.9571" font-weight="bold">Docker Host</text>
  <line x1="598.8304" y1="202.1053" x2="598.8304" y2="640" stroke="var(--text)" stroke-width="2" />
  <rect x="918.2066" y="67.3684" width="239.5322" height="134.7368" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1037.9727" y="151.5789" text-anchor="middle" font-size="21.9571" font-weight="bold">Network</text>
  <line x1="1037.9727" y1="202.1053" x2="1037.9727" y2="640" stroke="var(--text)" stroke-width="2" />
  <line x1="159.6881" y1="286.3158" x2="594.8382" y2="286.3158" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd6_07_networking)" />
  <text x="379.2592" y="262.7368" text-anchor="middle" font-size="19.961">docker network ls</text>
  <line x1="598.8304" y1="353.6842" x2="163.6803" y2="353.6842" stroke="var(--text)" stroke-width="2" stroke-dasharray="9.9805 9.9805" marker-end="url(#arrowd6_07_networking)" />
  <text x="379.2592" y="330.1053" text-anchor="middle" font-size="19.961">bridge, host, custom-net</text>
  <line x1="159.6881" y1="437.8947" x2="594.8382" y2="437.8947" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd6_07_networking)" />
  <text x="379.2592" y="414.3158" text-anchor="middle" font-size="19.961">docker network prune</text>
  <line x1="598.8304" y1="505.2632" x2="1033.9805" y2="505.2632" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd6_07_networking)" />
  <text x="818.4016" y="481.6842" text-anchor="middle" font-size="19.961">remove unused networks</text>
  <line x1="1037.9727" y1="572.6316" x2="602.8226" y2="572.6316" stroke="var(--text)" stroke-width="2" stroke-dasharray="9.9805 9.9805" marker-end="url(#arrowd6_07_networking)" />
  <text x="818.4016" y="549.0526" text-anchor="middle" font-size="19.961" fill="var(--ok-accent)">cleaned up</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd5_07_networking" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="42.14" y="106.6667" width="337.1193" height="231.1111" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="210.6996" y="184.8889" text-anchor="middle" font-size="23.177" font-weight="bold">network create</text>
  <text x="210.6996" y="248.8889" text-anchor="middle" font-size="21.0699">--driver bridge</text>
  <text x="210.6996" y="302.2222" text-anchor="middle" font-size="21.0699" fill="var(--text-muted)">--subnet 172.20.0.0/16</text>
  <line x1="379.2593" y1="220.4444" x2="459.3251" y2="220.4444" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd5_07_networking)" />
  <rect x="463.5391" y="106.6667" width="337.1193" height="231.1111" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="632.0988" y="184.8889" text-anchor="middle" font-size="23.177" font-weight="bold">network connect</text>
  <text x="632.0988" y="248.8889" text-anchor="middle" font-size="21.0699">Attach containers</text>
  <text x="632.0988" y="302.2222" text-anchor="middle" font-size="21.0699" fill="var(--text-muted)">to custom network</text>
  <line x1="800.6585" y1="220.4444" x2="880.7242" y2="220.4444" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd5_07_networking)" />
  <rect x="884.9383" y="106.6667" width="337.1193" height="231.1111" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1053.498" y="184.8889" text-anchor="middle" font-size="23.177" font-weight="bold">Communicate</text>
  <text x="1053.498" y="248.8889" text-anchor="middle" font-size="21.0699">Built-in DNS</text>
  <text x="1053.498" y="302.2222" text-anchor="middle" font-size="21.0699" fill="var(--text-muted)">Name resolution</text>
  <rect x="42.14" y="426.6667" width="1179.9177" height="213.3333" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" stroke-dasharray="8.428 6.321" />
  <text x="632.0988" y="497.7778" text-anchor="middle" font-size="21.0699" fill="var(--text-muted)">docker network create --driver bridge --subnet 172.20.0.0/16 my-net</text>
  <text x="632.0988" y="558.2222" text-anchor="middle" font-size="21.0699" fill="var(--text-muted)">docker run --network my-net --name app1 myimage</text>
  <text x="632.0988" y="611.5556" text-anchor="middle" font-size="21.0699" fill="var(--text-muted)">Containers on same custom network can resolve each other by name</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd2_07_networking" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="39.9221" y="33.6842" width="1117.8168" height="606.3158" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" stroke-dasharray="7.9844 5.9883" />
  <text x="598.8304" y="101.0526" text-anchor="middle" font-size="21.9571" fill="var(--text-muted)">User-defined bridge network: my-network</text>
  <rect x="79.844" y="151.5789" width="259.4931" height="218.9474" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="209.5906" y="229.0526" text-anchor="middle" font-size="21.9571" font-weight="bold">web-app</text>
  <text x="209.5906" y="286.3158" text-anchor="middle" font-size="19.961" fill="var(--text-muted)">172.18.0.2</text>
  <text x="209.5906" y="336.8421" text-anchor="middle" font-size="19.961" fill="var(--text-muted)">port 80</text>
  <line x1="339.3373" y1="259.3684" x2="455.1111" y2="259.3684" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd2_07_networking)" />
  <line x1="455.1111" y1="259.3684" x2="339.3373" y2="259.3684" stroke="var(--text-muted)" stroke-width="1.9961" stroke-dasharray="5.9883 5.9883" />
  <text x="399.2203" y="229.0526" text-anchor="middle" font-size="19.961" fill="var(--text-muted)">DNS</text>
  <rect x="459.1033" y="151.5789" width="279.4542" height="218.9474" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="598.8304" y="229.0526" text-anchor="middle" font-size="21.9571" font-weight="bold">api-server</text>
  <text x="598.8304" y="286.3158" text-anchor="middle" font-size="19.961" fill="var(--text-muted)">172.18.0.3</text>
  <text x="598.8304" y="336.8421" text-anchor="middle" font-size="19.961" fill="var(--text-muted)">port 3000</text>
  <line x1="738.5575" y1="259.3684" x2="854.3314" y2="259.3684" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd2_07_networking)" />
  <text x="798.4405" y="229.0526" text-anchor="middle" font-size="19.961" fill="var(--text-muted)">DNS</text>
  <rect x="858.3236" y="151.5789" width="279.4542" height="218.9474" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="998.0507" y="229.0526" text-anchor="middle" font-size="21.9571" font-weight="bold">database</text>
  <text x="998.0507" y="286.3158" text-anchor="middle" font-size="19.961" fill="var(--text-muted)">172.18.0.4</text>
  <text x="998.0507" y="336.8421" text-anchor="middle" font-size="19.961" fill="var(--text-muted)">port 5432</text>
  <rect x="299.4152" y="437.8947" width="598.8304" height="151.5789" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="598.8304" y="505.2632" text-anchor="middle" font-size="19.961">Containers resolve each other by name</text>
  <text x="598.8304" y="555.7895" text-anchor="middle" font-size="19.961" fill="var(--text-muted)">e.g., ping api-server from web-app</text>
</svg>
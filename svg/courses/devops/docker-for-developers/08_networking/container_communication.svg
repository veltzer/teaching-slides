<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <text x="628.679283" y="40" text-anchor="middle" font-size="25.4832" fill="var(--text-muted)" font-family="Arial, sans-serif">User-defined bridge network: my-network</text>
  <rect x="40" y="99.999961" width="294.339483" height="260.000081" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.871627" filter="url(#shadow)"/>
  <text x="187.169794" y="192.000076" text-anchor="middle" font-size="25.4832" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">web-app</text>
  <text x="187.169794" y="260.000107" text-anchor="middle" font-size="23.166546" fill="var(--text-muted)" font-family="Arial, sans-serif">172.18.0.2</text>
  <text x="187.169794" y="320.000068" text-anchor="middle" font-size="23.166546" fill="var(--text-muted)" font-family="Arial, sans-serif">port 80</text>
  <line x1="334.3398" y1="228.000078" x2="465.660432" y2="228.000078" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="465.660432" y1="228.000078" x2="334.3398" y2="228.000078" stroke="var(--text-muted)" stroke-width="1.9961" stroke-dasharray="5.9883 5.9883" />
  <text x="402.264207" y="192.000076" text-anchor="middle" font-size="23.166546" fill="var(--text-muted)" font-family="Arial, sans-serif">DNS</text>
  <rect x="470.188719" y="99.999961" width="316.981128" height="260.000081" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.871627" filter="url(#shadow)"/>
  <text x="628.679283" y="192.000076" text-anchor="middle" font-size="25.4832" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">api-server</text>
  <text x="628.679283" y="260.000107" text-anchor="middle" font-size="23.166546" fill="var(--text-muted)" font-family="Arial, sans-serif">172.18.0.3</text>
  <text x="628.679283" y="320.000068" text-anchor="middle" font-size="23.166546" fill="var(--text-muted)" font-family="Arial, sans-serif">port 3000</text>
  <line x1="787.169847" y1="228.000078" x2="918.490585" y2="228.000078" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="855.09436" y="192.000076" text-anchor="middle" font-size="23.166546" fill="var(--text-muted)" font-family="Arial, sans-serif">DNS</text>
  <rect x="923.018872" y="99.999961" width="316.981128" height="260.000081" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.871627" filter="url(#shadow)"/>
  <text x="1081.509436" y="192.000076" text-anchor="middle" font-size="25.4832" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">database</text>
  <text x="1081.509436" y="260.000107" text-anchor="middle" font-size="23.166546" fill="var(--text-muted)" font-family="Arial, sans-serif">172.18.0.4</text>
  <text x="1081.509436" y="320.000068" text-anchor="middle" font-size="23.166546" fill="var(--text-muted)" font-family="Arial, sans-serif">port 5432</text>
  <rect x="289.056616" y="439.999991" width="679.245229" height="180.000009" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.871627" filter="url(#shadow)"/>
  <text x="628.679283" y="520.000188" text-anchor="middle" font-size="23.166546" font-family="Arial, sans-serif" fill="var(--warn-text)">Containers resolve each other by name</text>
  <text x="628.679283" y="580.00015" text-anchor="middle" font-size="23.166546" fill="var(--text-muted)" font-family="Arial, sans-serif">e.g., ping api-server from web-app</text>
</svg>
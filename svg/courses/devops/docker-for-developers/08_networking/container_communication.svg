<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd2_07_networking" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" stroke-dasharray="7.9844 5.9883" />
  <text x="639.9999" y="104.4444" text-anchor="middle" font-size="22.2508" fill="var(--text-muted)">User-defined bridge network: my-network</text>
  <rect x="82.857" y="152.7777" width="278.5713" height="209.4445" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="222.1427" y="226.8889" text-anchor="middle" font-size="22.2508" font-weight="bold">web-app</text>
  <text x="222.1427" y="281.6667" text-anchor="middle" font-size="20.228" fill="var(--text-muted)">172.18.0.2</text>
  <text x="222.1427" y="330" text-anchor="middle" font-size="20.228" fill="var(--text-muted)">port 80</text>
  <line x1="361.4286" y1="255.8889" x2="485.7142" y2="255.8889" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd2_07_networking)" />
  <line x1="485.7142" y1="255.8889" x2="361.4286" y2="255.8889" stroke="var(--text-muted)" stroke-width="1.9961" stroke-dasharray="5.9883 5.9883" />
  <text x="425.7142" y="226.8889" text-anchor="middle" font-size="20.228" fill="var(--text-muted)">DNS</text>
  <rect x="489.9999" y="152.7777" width="300" height="209.4445" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="639.9999" y="226.8889" text-anchor="middle" font-size="22.2508" font-weight="bold">api-server</text>
  <text x="639.9999" y="281.6667" text-anchor="middle" font-size="20.228" fill="var(--text-muted)">172.18.0.3</text>
  <text x="639.9999" y="330" text-anchor="middle" font-size="20.228" fill="var(--text-muted)">port 3000</text>
  <line x1="789.9999" y1="255.8889" x2="914.2856" y2="255.8889" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd2_07_networking)" />
  <text x="854.2856" y="226.8889" text-anchor="middle" font-size="20.228" fill="var(--text-muted)">DNS</text>
  <rect x="918.5713" y="152.7777" width="300" height="209.4445" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1068.5713" y="226.8889" text-anchor="middle" font-size="22.2508" font-weight="bold">database</text>
  <text x="1068.5713" y="281.6667" text-anchor="middle" font-size="20.228" fill="var(--text-muted)">172.18.0.4</text>
  <text x="1068.5713" y="330" text-anchor="middle" font-size="20.228" fill="var(--text-muted)">port 5432</text>
  <rect x="318.5713" y="426.6666" width="642.8571" height="145" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="639.9999" y="491.1112" text-anchor="middle" font-size="20.228">Containers resolve each other by name</text>
  <text x="639.9999" y="539.4445" text-anchor="middle" font-size="20.228" fill="var(--text-muted)">e.g., ping api-server from web-app</text>
</svg>
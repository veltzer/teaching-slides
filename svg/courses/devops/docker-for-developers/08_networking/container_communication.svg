<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd2_07_networking" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="628.679283" y="40" text-anchor="middle" font-size="25.4832" fill="var(--text-muted)">User-defined bridge network: my-network</text>
  <rect x="40" y="99.999961" width="294.339483" height="260.000081" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6.871627" filter="url(#shadow)"/>
  <text x="187.169794" y="192.000076" text-anchor="middle" font-size="25.4832" font-weight="bold">web-app</text>
  <text x="187.169794" y="260.000107" text-anchor="middle" font-size="23.166546" fill="var(--text-muted)">172.18.0.2</text>
  <text x="187.169794" y="320.000068" text-anchor="middle" font-size="23.166546" fill="var(--text-muted)">port 80</text>
  <line x1="334.3398" y1="228.000078" x2="465.660432" y2="228.000078" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd2_07_networking)" />
  <line x1="465.660432" y1="228.000078" x2="334.3398" y2="228.000078" stroke="var(--text-muted)" stroke-width="1.9961" stroke-dasharray="5.9883 5.9883" />
  <text x="402.264207" y="192.000076" text-anchor="middle" font-size="23.166546" fill="var(--text-muted)">DNS</text>
  <rect x="470.188719" y="99.999961" width="316.981128" height="260.000081" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6.871627" filter="url(#shadow)"/>
  <text x="628.679283" y="192.000076" text-anchor="middle" font-size="25.4832" font-weight="bold">api-server</text>
  <text x="628.679283" y="260.000107" text-anchor="middle" font-size="23.166546" fill="var(--text-muted)">172.18.0.3</text>
  <text x="628.679283" y="320.000068" text-anchor="middle" font-size="23.166546" fill="var(--text-muted)">port 3000</text>
  <line x1="787.169847" y1="228.000078" x2="918.490585" y2="228.000078" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd2_07_networking)" />
  <text x="855.09436" y="192.000076" text-anchor="middle" font-size="23.166546" fill="var(--text-muted)">DNS</text>
  <rect x="923.018872" y="99.999961" width="316.981128" height="260.000081" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6.871627" filter="url(#shadow)"/>
  <text x="1081.509436" y="192.000076" text-anchor="middle" font-size="25.4832" font-weight="bold">database</text>
  <text x="1081.509436" y="260.000107" text-anchor="middle" font-size="23.166546" fill="var(--text-muted)">172.18.0.4</text>
  <text x="1081.509436" y="320.000068" text-anchor="middle" font-size="23.166546" fill="var(--text-muted)">port 5432</text>
  <rect x="289.056616" y="439.999991" width="679.245229" height="180.000009" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6.871627" filter="url(#shadow)"/>
  <text x="628.679283" y="520.000188" text-anchor="middle" font-size="23.166546">Containers resolve each other by name</text>
  <text x="628.679283" y="580.00015" text-anchor="middle" font-size="23.166546" fill="var(--text-muted)">e.g., ping api-server from web-app</text>
</svg>
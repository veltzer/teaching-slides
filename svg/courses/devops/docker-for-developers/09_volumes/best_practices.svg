<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <ellipse cx="639.9999" cy="330" rx="139.2858" ry="60.6536" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="4.1001" />
  <text x="639.9999" y="319.7647" text-anchor="middle" font-size="22.8959" fill="var(--primary-accent)" font-weight="bold">Volume Best</text>
  <text x="639.9999" y="370.9412" text-anchor="middle" font-size="22.8959" fill="var(--primary-accent)" font-weight="bold">Practices</text>
  <rect x="40" y="40" width="235.7143" height="136.4706" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="157.8572" y="98" text-anchor="middle" font-size="20.8144" fill="var(--ok-accent)">Use Named</text>
  <text x="157.8572" y="145.7647" text-anchor="middle" font-size="20.8144" fill="var(--ok-accent)">Volumes</text>
  <line x1="275.7143" y1="108.2353" x2="500.7142" y2="278.8236" stroke="var(--text)" stroke-width="2" />
  <rect x="1004.2857" y="40" width="235.7143" height="136.4706" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1122.1428" y="98" text-anchor="middle" font-size="20.8144" fill="var(--info-accent)">Read-Only</text>
  <text x="1122.1428" y="145.7647" text-anchor="middle" font-size="20.8144" fill="var(--info-accent)">When Possible</text>
  <line x1="1004.2857" y1="108.2353" x2="779.2857" y2="278.8236" stroke="var(--text)" stroke-width="2" />
  <rect x="40" y="483.5294" width="235.7143" height="136.4706" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="157.8572" y="541.5294" text-anchor="middle" font-size="20.8144" fill="var(--warn-accent)">Regular</text>
  <text x="157.8572" y="589.2942" text-anchor="middle" font-size="20.8144" fill="var(--warn-accent)">Backups</text>
  <line x1="275.7143" y1="551.7647" x2="500.7142" y2="381.1764" stroke="var(--text)" stroke-width="2" />
  <rect x="1004.2857" y="483.5294" width="235.7143" height="136.4706" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1122.1428" y="541.5294" text-anchor="middle" font-size="20.8144" fill="var(--danger-accent)">Prune Unused</text>
  <text x="1122.1428" y="589.2942" text-anchor="middle" font-size="20.8144" fill="var(--danger-accent)">Volumes</text>
  <line x1="1004.2857" y1="551.7647" x2="779.2857" y2="381.1764" stroke="var(--text)" stroke-width="2" />
</svg>
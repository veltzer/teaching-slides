<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <ellipse cx="615.015" cy="345.9459" rx="133.2533" ry="61.5015" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="4.1001" />
  <text x="615.015" y="335.5676" text-anchor="middle" font-size="22.5506" fill="var(--primary-accent)" font-weight="bold">Volume Best</text>
  <text x="615.015" y="387.4595" text-anchor="middle" font-size="22.5506" fill="var(--primary-accent)" font-weight="bold">Practices</text>
  <rect x="41.001" y="51.8919" width="225.5055" height="138.3784" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="153.7538" y="110.7027" text-anchor="middle" font-size="20.5005" fill="var(--ok-accent)">Use Named</text>
  <text x="153.7538" y="159.1351" text-anchor="middle" font-size="20.5005" fill="var(--ok-accent)">Volumes</text>
  <line x1="266.5065" y1="121.0811" x2="481.7617" y2="294.0541" stroke="var(--text)" stroke-width="2" />
  <rect x="963.5236" y="51.8919" width="225.5055" height="138.3784" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="1076.2763" y="110.7027" text-anchor="middle" font-size="20.5005" fill="var(--info-accent)">Read-Only</text>
  <text x="1076.2763" y="159.1351" text-anchor="middle" font-size="20.5005" fill="var(--info-accent)">When Possible</text>
  <line x1="963.5236" y1="121.0811" x2="748.2683" y2="294.0541" stroke="var(--text)" stroke-width="2" />
  <rect x="41.001" y="501.6216" width="225.5055" height="138.3784" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="153.7538" y="560.4324" text-anchor="middle" font-size="20.5005" fill="var(--warn-accent)">Regular</text>
  <text x="153.7538" y="608.8649" text-anchor="middle" font-size="20.5005" fill="var(--warn-accent)">Backups</text>
  <line x1="266.5065" y1="570.8108" x2="481.7617" y2="397.8378" stroke="var(--text)" stroke-width="2" />
  <rect x="963.5236" y="501.6216" width="225.5055" height="138.3784" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="1076.2763" y="560.4324" text-anchor="middle" font-size="20.5005" fill="var(--danger-accent)">Prune Unused</text>
  <text x="1076.2763" y="608.8649" text-anchor="middle" font-size="20.5005" fill="var(--danger-accent)">Volumes</text>
  <line x1="963.5236" y1="570.8108" x2="748.2683" y2="397.8378" stroke="var(--text)" stroke-width="2" />
</svg>
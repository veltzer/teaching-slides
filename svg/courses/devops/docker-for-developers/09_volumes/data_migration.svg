<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="278.5714" height="251.3333" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="179.2857" y="128.9333" text-anchor="middle" font-size="24.3745" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">Old Volume</text>
  <text x="179.2857" y="194.6667" text-anchor="middle" font-size="22.1586" fill="var(--text-muted)" font-family="Arial, sans-serif">Source data</text>
  <text x="179.2857" y="252.6667" text-anchor="middle" font-size="22.1586" fill="var(--text-faint)" font-family="Arial, sans-serif">v1_data</text>
  <rect x="468.5714" y="40" width="342.8571" height="251.3333" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="128.9333" text-anchor="middle" font-size="24.3745" fill="var(--warn-accent)" font-weight="bold" font-family="Arial, sans-serif">Migration Container</text>
  <text x="640" y="194.6667" text-anchor="middle" font-size="22.1586" fill="var(--text-muted)" font-family="Arial, sans-serif">cp -a /source/. /dest/</text>
  <text x="640" y="252.6667" text-anchor="middle" font-size="22.1586" fill="var(--text-faint)" font-family="Arial, sans-serif">mounts both volumes</text>
  <rect x="961.4286" y="40" width="278.5714" height="251.3333" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1100.7143" y="128.9333" text-anchor="middle" font-size="24.3745" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">New Volume</text>
  <text x="1100.7143" y="194.6667" text-anchor="middle" font-size="22.1586" fill="var(--text-muted)" font-family="Arial, sans-serif">Migrated data</text>
  <text x="1100.7143" y="252.6667" text-anchor="middle" font-size="22.1586" fill="var(--text-faint)" font-family="Arial, sans-serif">v2_data</text>
  <line x1="318.5714" y1="163.7333" x2="468.5714" y2="163.7333" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="393.5714" y="136.6667" text-anchor="middle" font-size="22.1586" fill="var(--text-muted)" font-family="Arial, sans-serif">read</text>
  <line x1="811.4286" y1="163.7333" x2="961.4286" y2="163.7333" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="886.4286" y="136.6667" text-anchor="middle" font-size="22.1586" fill="var(--text-muted)" font-family="Arial, sans-serif">write</text>
  <rect x="82.8571" y="407.3333" width="1114.2857" height="212.6667" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="125.7143" y="484.6667" font-size="22.1586" fill="var(--text)" font-family="Courier New, monospace">docker run --rm -v v1_data:/source -v v2_data:/dest</text>
  <text x="125.7143" y="554.2667" font-size="22.1586" fill="var(--text)" font-family="Courier New, monospace">  alpine sh -c "cp -a /source/. /dest/"</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

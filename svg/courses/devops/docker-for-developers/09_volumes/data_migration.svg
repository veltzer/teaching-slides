<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="278.5714" height="251.3333" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="179.2857" y="128.9333" text-anchor="middle" font-size="24.3745" fill="var(--danger-accent)" font-weight="bold">Old Volume</text>
  <text x="179.2857" y="194.6667" text-anchor="middle" font-size="22.1586" fill="var(--text-muted)">Source data</text>
  <text x="179.2857" y="252.6667" text-anchor="middle" font-size="22.1586" fill="var(--text-faint)">v1_data</text>
  <rect x="468.5714" y="40" width="342.8571" height="251.3333" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="128.9333" text-anchor="middle" font-size="24.3745" fill="var(--warn-accent)" font-weight="bold">Migration Container</text>
  <text x="640" y="194.6667" text-anchor="middle" font-size="22.1586" fill="var(--text-muted)">cp -a /source/. /dest/</text>
  <text x="640" y="252.6667" text-anchor="middle" font-size="22.1586" fill="var(--text-faint)">mounts both volumes</text>
  <rect x="961.4286" y="40" width="278.5714" height="251.3333" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1100.7143" y="128.9333" text-anchor="middle" font-size="24.3745" fill="var(--ok-accent)" font-weight="bold">New Volume</text>
  <text x="1100.7143" y="194.6667" text-anchor="middle" font-size="22.1586" fill="var(--text-muted)">Migrated data</text>
  <text x="1100.7143" y="252.6667" text-anchor="middle" font-size="22.1586" fill="var(--text-faint)">v2_data</text>
  <line x1="318.5714" y1="163.7333" x2="468.5714" y2="163.7333" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd6_08_volumes)" />
  <text x="393.5714" y="136.6667" text-anchor="middle" font-size="22.1586" fill="var(--text-muted)">read</text>
  <line x1="811.4286" y1="163.7333" x2="961.4286" y2="163.7333" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd6_08_volumes)" />
  <text x="886.4286" y="136.6667" text-anchor="middle" font-size="22.1586" fill="var(--text-muted)">write</text>
  <rect x="82.8571" y="407.3333" width="1114.2857" height="212.6667" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="125.7143" y="484.6667" font-size="22.1586" fill="var(--text)" font-family="monospace">docker run --rm -v v1_data:/source -v v2_data:/dest</text>
  <text x="125.7143" y="554.2667" font-size="22.1586" fill="var(--text)" font-family="monospace">  alpine sh -c "cp -a /source/. /dest/"</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd6_08_volumes" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
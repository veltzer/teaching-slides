<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="42.6667" y="90" width="277.3333" height="234" fill="#ffebee" stroke="#c62828" stroke-width="4.2667" rx="10.6667" />
  <text x="181.3333" y="172.8" text-anchor="middle" font-size="23.4667" fill="#c62828" font-weight="bold">Old Volume</text>
  <text x="181.3333" y="234" text-anchor="middle" font-size="21.3333" fill="#555">Source data</text>
  <text x="181.3333" y="288" text-anchor="middle" font-size="21.3333" fill="#888">v1_data</text>
  <rect x="469.3333" y="90" width="341.3333" height="234" fill="#fff3e0" stroke="#e65100" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="172.8" text-anchor="middle" font-size="23.4667" fill="#e65100" font-weight="bold">Migration Container</text>
  <text x="640" y="234" text-anchor="middle" font-size="21.3333" fill="#555">cp -a /source/. /dest/</text>
  <text x="640" y="288" text-anchor="middle" font-size="21.3333" fill="#888">mounts both volumes</text>
  <rect x="960" y="90" width="277.3333" height="234" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4.2667" rx="10.6667" />
  <text x="1098.6667" y="172.8" text-anchor="middle" font-size="23.4667" fill="#2e7d32" font-weight="bold">New Volume</text>
  <text x="1098.6667" y="234" text-anchor="middle" font-size="21.3333" fill="#555">Migrated data</text>
  <text x="1098.6667" y="288" text-anchor="middle" font-size="21.3333" fill="#888">v2_data</text>
  <line x1="320" y1="205.2" x2="469.3333" y2="205.2" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowd6_08_volumes)" />
  <text x="394.6667" y="180" text-anchor="middle" font-size="21.3333" fill="#555">read</text>
  <line x1="810.6667" y1="205.2" x2="960" y2="205.2" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowd6_08_volumes)" />
  <text x="885.3333" y="180" text-anchor="middle" font-size="21.3333" fill="#555">write</text>
  <rect x="85.3333" y="432" width="1109.3333" height="198" fill="#f5f5f5" stroke="#999" stroke-width="2.1333" rx="6.4" />
  <text x="128" y="504" font-size="21.3333" fill="#333" font-family="monospace">docker run --rm -v v1_data:/source -v v2_data:/dest</text>
  <text x="128" y="568.8" font-size="21.3333" fill="#333" font-family="monospace">  alpine sh -c "cp -a /source/. /dest/"</text>
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arrowd6_08_volumes" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="342.8571" height="580" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="211.4285" y="119.75" text-anchor="middle" font-size="25.7461" fill="var(--primary-accent)" font-weight="bold">Bind Mounts</text>
  <text x="211.4285" y="192.25" text-anchor="middle" font-size="21.455" fill="var(--text-muted)">Host path mapped</text>
  <text x="211.4285" y="250.25" text-anchor="middle" font-size="21.455" fill="var(--text-muted)">to container path</text>
  <rect x="72.1428" y="293.75" width="107.1429" height="108.75" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="125.7143" y="366.25" text-anchor="middle" font-size="21.455" fill="var(--warn-accent)">Host FS</text>
  <line x1="179.2856" y1="348.125" x2="232.8571" y2="348.125" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_08_volumes)" />
  <rect x="232.8571" y="293.75" width="117.8571" height="108.75" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="290.7143" y="366.25" text-anchor="middle" font-size="21.455" fill="var(--info-accent)">Container</text>
  <text x="211.4285" y="493.125" text-anchor="middle" font-size="21.455" fill="var(--text-muted)">-v /host:/container</text>
  <rect x="468.5714" y="40" width="342.8571" height="580" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="119.75" text-anchor="middle" font-size="25.7461" fill="var(--ok-accent)" font-weight="bold">Named Volumes</text>
  <text x="640" y="192.25" text-anchor="middle" font-size="21.455" fill="var(--text-muted)">Docker-managed</text>
  <text x="640" y="250.25" text-anchor="middle" font-size="21.455" fill="var(--text-muted)">storage area</text>
  <rect x="500.7142" y="293.75" width="117.8571" height="108.75" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="558.5714" y="366.25" text-anchor="middle" font-size="21.455" fill="var(--warn-accent)">Docker</text>
  <line x1="618.5714" y1="348.125" x2="661.4285" y2="348.125" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_08_volumes)" />
  <rect x="661.4285" y="293.75" width="117.8571" height="108.75" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="719.2857" y="366.25" text-anchor="middle" font-size="21.455" fill="var(--info-accent)">Container</text>
  <text x="640" y="493.125" text-anchor="middle" font-size="21.455" fill="var(--text-muted)">-v name:/path</text>
  <rect x="897.1429" y="40" width="342.8571" height="580" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1068.5715" y="119.75" text-anchor="middle" font-size="25.7461" fill="var(--danger-accent)" font-weight="bold">tmpfs Mounts</text>
  <text x="1068.5715" y="192.25" text-anchor="middle" font-size="21.455" fill="var(--text-muted)">In-memory only</text>
  <text x="1068.5715" y="250.25" text-anchor="middle" font-size="21.455" fill="var(--text-muted)">No disk persistence</text>
  <rect x="940" y="293.75" width="107.1429" height="108.75" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="993.5714" y="366.25" text-anchor="middle" font-size="21.455" fill="var(--warn-accent)">RAM</text>
  <line x1="1047.1429" y1="348.125" x2="1090" y2="348.125" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_08_volumes)" />
  <rect x="1090" y="293.75" width="117.8571" height="108.75" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1147.8572" y="366.25" text-anchor="middle" font-size="21.455" fill="var(--info-accent)">Container</text>
  <text x="1068.5715" y="493.125" text-anchor="middle" font-size="21.455" fill="var(--text-muted)">--tmpfs /path</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd1_08_volumes" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
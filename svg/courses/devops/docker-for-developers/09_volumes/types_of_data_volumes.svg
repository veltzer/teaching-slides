<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="342.8571" height="580" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="211.4285" y="119.75" text-anchor="middle" font-size="25.7461" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">Bind Mounts</text>
  <text x="211.4285" y="192.25" text-anchor="middle" font-size="21.455" fill="var(--text-muted)" font-family="Arial, sans-serif">Host path mapped</text>
  <text x="211.4285" y="250.25" text-anchor="middle" font-size="21.455" fill="var(--text-muted)" font-family="Arial, sans-serif">to container path</text>
  <rect x="72.1428" y="293.75" width="107.1429" height="108.75" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="125.7143" y="366.25" text-anchor="middle" font-size="21.455" fill="var(--warn-accent)" font-family="Arial, sans-serif">Host FS</text>
  <line x1="179.2856" y1="348.125" x2="232.8571" y2="348.125" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="232.8571" y="293.75" width="117.8571" height="108.75" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="290.7143" y="366.25" text-anchor="middle" font-size="21.455" fill="var(--info-accent)" font-family="Arial, sans-serif">Container</text>
  <text x="211.4285" y="493.125" text-anchor="middle" font-size="21.455" fill="var(--text-muted)" font-family="Arial, sans-serif">-v /host:/container</text>
  <rect x="468.5714" y="40" width="342.8571" height="580" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="119.75" text-anchor="middle" font-size="25.7461" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">Named Volumes</text>
  <text x="640" y="192.25" text-anchor="middle" font-size="21.455" fill="var(--text-muted)" font-family="Arial, sans-serif">Docker-managed</text>
  <text x="640" y="250.25" text-anchor="middle" font-size="21.455" fill="var(--text-muted)" font-family="Arial, sans-serif">storage area</text>
  <rect x="500.7142" y="293.75" width="117.8571" height="108.75" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="558.5714" y="366.25" text-anchor="middle" font-size="21.455" fill="var(--warn-accent)" font-family="Arial, sans-serif">Docker</text>
  <line x1="618.5714" y1="348.125" x2="661.4285" y2="348.125" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="661.4285" y="293.75" width="117.8571" height="108.75" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="719.2857" y="366.25" text-anchor="middle" font-size="21.455" fill="var(--info-accent)" font-family="Arial, sans-serif">Container</text>
  <text x="640" y="493.125" text-anchor="middle" font-size="21.455" fill="var(--text-muted)" font-family="Arial, sans-serif">-v name:/path</text>
  <rect x="897.1429" y="40" width="342.8571" height="580" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1068.5715" y="119.75" text-anchor="middle" font-size="25.7461" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">tmpfs Mounts</text>
  <text x="1068.5715" y="192.25" text-anchor="middle" font-size="21.455" fill="var(--text-muted)" font-family="Arial, sans-serif">In-memory only</text>
  <text x="1068.5715" y="250.25" text-anchor="middle" font-size="21.455" fill="var(--text-muted)" font-family="Arial, sans-serif">No disk persistence</text>
  <rect x="940" y="293.75" width="107.1429" height="108.75" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="993.5714" y="366.25" text-anchor="middle" font-size="21.455" fill="var(--warn-accent)" font-family="Arial, sans-serif">RAM</text>
  <line x1="1047.1429" y1="348.125" x2="1090" y2="348.125" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="1090" y="293.75" width="117.8571" height="108.75" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1147.8572" y="366.25" text-anchor="middle" font-size="21.455" fill="var(--info-accent)" font-family="Arial, sans-serif">Container</text>
  <text x="1068.5715" y="493.125" text-anchor="middle" font-size="21.455" fill="var(--text-muted)" font-family="Arial, sans-serif">--tmpfs /path</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="21.3333" y="270" width="170.6667" height="162" fill="#e3f2fd" stroke="#1565c0" stroke-width="4.2667" rx="10.6667" />
  <text x="106.6667" y="342" text-anchor="middle" font-size="21.3333" fill="#1565c0" font-weight="bold">Create</text>
  <text x="106.6667" y="396" text-anchor="middle" font-size="21.3333" fill="#555">volume create</text>
  <line x1="192" y1="349.2" x2="256" y2="349.2" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowLC)" />
  <rect x="256" y="270" width="170.6667" height="162" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4.2667" rx="10.6667" />
  <text x="341.3333" y="342" text-anchor="middle" font-size="21.3333" fill="#2e7d32" font-weight="bold">Mount</text>
  <text x="341.3333" y="396" text-anchor="middle" font-size="21.3333" fill="#555">docker run -v</text>
  <line x1="426.6667" y1="349.2" x2="490.6667" y2="349.2" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowLC)" />
  <rect x="490.6667" y="270" width="170.6667" height="162" fill="#fff3e0" stroke="#e65100" stroke-width="4.2667" rx="10.6667" />
  <text x="576" y="342" text-anchor="middle" font-size="21.3333" fill="#e65100" font-weight="bold">In Use</text>
  <text x="576" y="396" text-anchor="middle" font-size="21.3333" fill="#555">read/write</text>
  <line x1="661.3333" y1="349.2" x2="725.3333" y2="349.2" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowLC)" />
  <rect x="725.3333" y="270" width="170.6667" height="162" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="4.2667" rx="10.6667" />
  <text x="810.6667" y="342" text-anchor="middle" font-size="21.3333" fill="#7b1fa2" font-weight="bold">Unmount</text>
  <text x="810.6667" y="396" text-anchor="middle" font-size="21.3333" fill="#555">container stop</text>
  <line x1="896" y1="349.2" x2="960" y2="349.2" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowLC)" />
  <rect x="960" y="198" width="170.6667" height="126" fill="#ffebee" stroke="#c62828" stroke-width="4.2667" rx="10.6667" />
  <text x="1045.3333" y="259.2" text-anchor="middle" font-size="21.3333" fill="#c62828" font-weight="bold">Remove</text>
  <text x="1045.3333" y="306" text-anchor="middle" font-size="21.3333" fill="#555">volume rm</text>
  <rect x="960" y="378" width="170.6667" height="126" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4.2667" rx="10.6667" />
  <text x="1045.3333" y="439.2" text-anchor="middle" font-size="21.3333" fill="#2e7d32" font-weight="bold">Reuse</text>
  <text x="1045.3333" y="486" text-anchor="middle" font-size="21.3333" fill="#555">re-mount</text>
  <text x="640" y="630" text-anchor="middle" font-size="23.4667" fill="#333" font-style="italic">Volumes persist independently of container lifecycle</text>
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arrowLC" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
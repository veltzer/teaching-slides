<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="42.6667" y="108" width="256" height="216" fill="#e3f2fd" stroke="#1565c0" stroke-width="4.2667" rx="10.6667" />
  <text x="170.6667" y="198" text-anchor="middle" font-size="23.4667" fill="#1565c0" font-weight="bold">Source Volume</text>
  <text x="170.6667" y="259.2" text-anchor="middle" font-size="21.3333" fill="#555">mydata</text>
  <rect x="469.3333" y="108" width="298.6667" height="216" fill="#fff3e0" stroke="#e65100" stroke-width="4.2667" rx="10.6667" />
  <text x="618.6667" y="187.2" text-anchor="middle" font-size="23.4667" fill="#e65100" font-weight="bold">Backup Container</text>
  <text x="618.6667" y="252" text-anchor="middle" font-size="21.3333" fill="#555">tar czf backup.tar.gz</text>
  <rect x="938.6667" y="108" width="277.3333" height="216" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4.2667" rx="10.6667" />
  <text x="1077.3333" y="198" text-anchor="middle" font-size="23.4667" fill="#2e7d32" font-weight="bold">Backup Archive</text>
  <text x="1077.3333" y="259.2" text-anchor="middle" font-size="21.3333" fill="#555">Host / S3 / NFS</text>
  <line x1="298.6667" y1="216" x2="469.3333" y2="216" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowd3_08_volumes)" />
  <text x="373.3333" y="187.2" text-anchor="middle" font-size="21.3333" fill="#555">mount</text>
  <line x1="768" y1="216" x2="938.6667" y2="216" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowd3_08_volumes)" />
  <text x="849.0667" y="187.2" text-anchor="middle" font-size="21.3333" fill="#555">export</text>
  <rect x="128" y="432" width="1024" height="198" fill="#f5f5f5" stroke="#999" stroke-width="2.1333" rx="6.4" />
  <text x="170.6667" y="504" font-size="21.3333" fill="#333" font-family="monospace">docker run --rm -v mydata:/source -v $(pwd):/backup</text>
  <text x="170.6667" y="568.8" font-size="21.3333" fill="#333" font-family="monospace">  alpine tar czf /backup/mydata.tar.gz -C /source .</text>
  <defs>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="365.2173" height="257.7778" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="221.5652" y="104.4444" text-anchor="middle" font-size="21.9586" fill="var(--primary-accent)" font-weight="bold">Database Storage</text>
  <text x="221.5652" y="162.4444" text-anchor="middle" font-size="19.9624" fill="var(--text-muted)">postgres_data volume</text>
  <text x="221.5652" y="214" text-anchor="middle" font-size="19.9624" fill="var(--text-faint)">-v pgdata:/var/lib/postgresql</text>
  <text x="221.5652" y="265.5556" text-anchor="middle" font-size="19.9624" fill="var(--text-faint)">Named volume for durability</text>
  <rect x="457.3913" y="40" width="365.2173" height="257.7778" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="638.9565" y="104.4444" text-anchor="middle" font-size="21.9586" fill="var(--warn-accent)" font-weight="bold">Config Injection</text>
  <text x="638.9565" y="162.4444" text-anchor="middle" font-size="19.9624" fill="var(--text-muted)">Bind mount config files</text>
  <text x="638.9565" y="214" text-anchor="middle" font-size="19.9624" fill="var(--text-faint)">-v ./nginx.conf:/etc/nginx.conf</text>
  <text x="638.9565" y="265.5556" text-anchor="middle" font-size="19.9624" fill="var(--text-faint)">Host file into container</text>
  <rect x="874.7827" y="40" width="365.2173" height="257.7778" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1056.3478" y="104.4444" text-anchor="middle" font-size="21.9586" fill="var(--ok-accent)" font-weight="bold">Shared App Data</text>
  <text x="1056.3478" y="162.4444" text-anchor="middle" font-size="19.9624" fill="var(--text-muted)">Multi-container sharing</text>
  <text x="1056.3478" y="214" text-anchor="middle" font-size="19.9624" fill="var(--text-faint)">App + Sidecar share volume</text>
  <text x="1056.3478" y="265.5556" text-anchor="middle" font-size="19.9624" fill="var(--text-faint)">logs, uploads, cache</text>
  <rect x="269.5653" y="362.2222" width="166.9565" height="112.7777" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="353.0435" y="433.1111" text-anchor="middle" font-size="19.9624" fill="var(--info-accent)">App</text>
  <rect x="686.9566" y="362.2222" width="166.9565" height="112.7777" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="770.4348" y="433.1111" text-anchor="middle" font-size="19.9624" fill="var(--info-accent)">Sidecar</text>
  <rect x="436.5218" y="523.3334" width="417.3913" height="96.6666" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="645.2174" y="587.7778" text-anchor="middle" font-size="19.9624" fill="var(--ok-accent)">Shared Volume: /app/logs</text>
  <line x1="353.0435" y1="475" x2="540.8695" y2="523.3334" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd7_08_volumes)" />
  <line x1="770.4348" y1="475" x2="749.5652" y2="523.3334" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd7_08_volumes)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd7_08_volumes" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
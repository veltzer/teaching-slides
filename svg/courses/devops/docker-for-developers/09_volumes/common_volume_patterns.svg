<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="19.961" y="33.6842" width="349.3177" height="269.4737" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="193.6218" y="101.0526" text-anchor="middle" font-size="21.9571" fill="var(--primary-accent)" font-weight="bold">Database Storage</text>
  <text x="193.6218" y="161.6842" text-anchor="middle" font-size="19.961" fill="var(--text-muted)">postgres_data volume</text>
  <text x="193.6218" y="215.5789" text-anchor="middle" font-size="19.961" fill="var(--text-faint)">-v pgdata:/var/lib/postgresql</text>
  <text x="193.6218" y="269.4737" text-anchor="middle" font-size="19.961" fill="var(--text-faint)">Named volume for durability</text>
  <rect x="419.1813" y="33.6842" width="349.3177" height="269.4737" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="592.8421" y="101.0526" text-anchor="middle" font-size="21.9571" fill="var(--warn-accent)" font-weight="bold">Config Injection</text>
  <text x="592.8421" y="161.6842" text-anchor="middle" font-size="19.961" fill="var(--text-muted)">Bind mount config files</text>
  <text x="592.8421" y="215.5789" text-anchor="middle" font-size="19.961" fill="var(--text-faint)">-v ./nginx.conf:/etc/nginx.conf</text>
  <text x="592.8421" y="269.4737" text-anchor="middle" font-size="19.961" fill="var(--text-faint)">Host file into container</text>
  <rect x="818.4016" y="33.6842" width="349.3177" height="269.4737" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="992.0624" y="101.0526" text-anchor="middle" font-size="21.9571" fill="var(--ok-accent)" font-weight="bold">Shared App Data</text>
  <text x="992.0624" y="161.6842" text-anchor="middle" font-size="19.961" fill="var(--text-muted)">Multi-container sharing</text>
  <text x="992.0624" y="215.5789" text-anchor="middle" font-size="19.961" fill="var(--text-faint)">App + Sidecar share volume</text>
  <text x="992.0624" y="269.4737" text-anchor="middle" font-size="19.961" fill="var(--text-faint)">logs, uploads, cache</text>
  <rect x="239.5322" y="370.5263" width="159.6881" height="117.8947" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="319.3762" y="444.6316" text-anchor="middle" font-size="19.961" fill="var(--info-accent)">App</text>
  <rect x="638.7525" y="370.5263" width="159.6881" height="117.8947" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="718.5965" y="444.6316" text-anchor="middle" font-size="19.961" fill="var(--info-accent)">Sidecar</text>
  <rect x="399.2203" y="538.9474" width="399.2203" height="101.0526" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="598.8304" y="606.3158" text-anchor="middle" font-size="19.961" fill="var(--ok-accent)">Shared Volume: /app/logs</text>
  <line x1="319.3762" y1="488.4211" x2="499.0253" y2="538.9474" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd7_08_volumes)" />
  <line x1="718.5965" y1="488.4211" x2="698.6355" y2="538.9474" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd7_08_volumes)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd7_08_volumes" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
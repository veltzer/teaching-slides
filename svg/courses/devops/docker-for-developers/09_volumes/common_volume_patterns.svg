  <ns0:text x="193.6218" y="101.0526" text-anchor="middle" font-size="21.9571" fill="#1565c0" font-weight="bold">Database Storage</ns0:text>
  <ns0:text x="193.6218" y="161.6842" text-anchor="middle" font-size="19.961" fill="#555">postgres_data volume</ns0:text>
  <ns0:text x="193.6218" y="215.5789" text-anchor="middle" font-size="19.961" fill="#888">-v pgdata:/var/lib/postgresql</ns0:text>
  <ns0:text x="193.6218" y="269.4737" text-anchor="middle" font-size="19.961" fill="#888">Named volume for durability</ns0:text>
  <ns0:rect x="419.1813" y="33.6842" width="349.3177" height="269.4737" fill="#fff3e0" stroke="#e65100" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="592.8421" y="101.0526" text-anchor="middle" font-size="21.9571" fill="#e65100" font-weight="bold">Config Injection</ns0:text>
  <ns0:text x="592.8421" y="161.6842" text-anchor="middle" font-size="19.961" fill="#555">Bind mount config files</ns0:text>
  <ns0:text x="592.8421" y="215.5789" text-anchor="middle" font-size="19.961" fill="#888">-v ./nginx.conf:/etc/nginx.conf</ns0:text>
  <ns0:text x="592.8421" y="269.4737" text-anchor="middle" font-size="19.961" fill="#888">Host file into container</ns0:text>
  <ns0:rect x="818.4016" y="33.6842" width="349.3177" height="269.4737" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3.9922" rx="9.9805" />

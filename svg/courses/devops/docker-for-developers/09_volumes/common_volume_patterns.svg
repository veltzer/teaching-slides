  <ns0:text x="992.0624" y="215.5789" text-anchor="middle" font-size="19.961" fill="#888">App + Sidecar share volume</ns0:text>
  <ns0:text x="992.0624" y="269.4737" text-anchor="middle" font-size="19.961" fill="#888">logs, uploads, cache</ns0:text>

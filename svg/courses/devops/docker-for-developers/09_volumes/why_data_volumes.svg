<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Left: ephemeral container -->
  <rect x="40" y="40" width="380" height="580" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--danger-text)">Without Volume</text>
  <rect x="80" y="140" width="300" height="180" rx="6" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="230" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--text)">Container</text>
  <text x="230" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text-muted)">Writable Layer</text>
  <text x="230" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">data lives inside</text>
  <text x="230" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--danger-text)">docker rm</text>
  <line x1="230" y1="405" x2="230" y2="455" stroke="var(--bg)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="230" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-text)">Data lost!</text>
  <text x="230" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">no persistence</text>
  <text x="230" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">no sharing</text>

  <!-- Middle: with volume -->
  <rect x="450" y="40" width="380" height="580" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--ok-text)">With Volume</text>
  <rect x="490" y="140" width="300" height="140" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--text)">Container</text>
  <text x="640" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text-muted)">mount /data</text>
  <line x1="640" y1="290" x2="640" y2="340" stroke="var(--bg)" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="490" y="350" width="300" height="160" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--text)">Volume</text>
  <text x="640" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">managed by Docker</text>
  <text x="640" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">stored on host</text>
  <text x="640" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">survives remove</text>
  <text x="640" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">shareable, backup-friendly</text>

  <!-- Right: Why volumes -->
  <rect x="860" y="40" width="380" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--primary-text)">Why Volumes</text>
  <text x="900" y="180" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Persist</text>
  <text x="900" y="215" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">data outlives the container</text>
  <text x="900" y="285" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Share</text>
  <text x="900" y="320" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">between containers and host</text>
  <text x="900" y="390" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Decouple</text>
  <text x="900" y="425" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">data from image lifecycle</text>
  <text x="900" y="495" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Backup</text>
  <text x="900" y="530" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">snapshot, migrate, restore</text>
  <text x="900" y="600" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">use -v or --mount at run</text>
</svg>

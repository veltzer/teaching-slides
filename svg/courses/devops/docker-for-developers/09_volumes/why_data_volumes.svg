<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:rect x="42.14" y="71.1111" width="252.8395" height="284.4444" fill="#ffebee" stroke="#c62828" stroke-width="4.214" rx="10.535" />

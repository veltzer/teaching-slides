  <ns0:text x="547.819" y="220.4444" text-anchor="middle" font-size="21.0699" fill="#1565c0">+ Volume Mount</ns0:text>
  <ns0:line x1="547.819" y1="355.5556" x2="547.819" y2="462.2222" stroke="#1565c0" stroke-width="4.214" marker-end="url(#arrowVol0)" />
  <ns0:rect x="421.3992" y="462.2222" width="252.8395" height="177.7778" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4.214" rx="10.535" />
  <ns0:text x="547.819" y="540.4444" text-anchor="middle" font-size="21.0699" fill="#2e7d32">Persistent Volume</ns0:text>
  <ns0:text x="547.819" y="597.3333" text-anchor="middle" font-size="21.0699" fill="#2e7d32">Data survives</ns0:text>
  <ns0:text x="779.5884" y="142.2222" font-size="23.177" fill="#333" font-weight="bold">Why Volumes?</ns0:text>
  <ns0:text x="779.5884" y="213.3333" font-size="21.0699" fill="#555">- Persist data across restarts</ns0:text>
  <ns0:text x="779.5884" y="277.3333" font-size="21.0699" fill="#555">- Share data between containers</ns0:text>
  <ns0:text x="779.5884" y="341.3333" font-size="21.0699" fill="#555">- Decouple data from container</ns0:text>
  <ns0:text x="779.5884" y="405.3333" font-size="21.0699" fill="#555">- Backup and migration support</ns0:text>

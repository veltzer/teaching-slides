<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:text x="568.8889" y="57.6" text-anchor="middle" font-size="20.8593" fill="#555">Each instruction creates a cached layer</ns0:text>
  <ns0:rect x="284.4444" y="96" width="568.8889" height="96" fill="#e8f5e9" stroke="#333" stroke-width="3.7926" rx="5.6889" />
  <ns0:text x="568.8889" y="160" text-anchor="middle" font-size="20.8593">FROM ubuntu:22.04</ns0:text>
  <ns0:text x="986.074" y="160" font-size="18.9629" fill="#4caf50">cached</ns0:text>
  <ns0:rect x="284.4444" y="208" width="568.8889" height="96" fill="#e8f5e9" stroke="#333" stroke-width="3.7926" rx="5.6889" />
  <ns0:text x="568.8889" y="272" text-anchor="middle" font-size="20.8593">RUN apt-get update</ns0:text>
  <ns0:text x="986.074" y="272" font-size="18.9629" fill="#4caf50">cached</ns0:text>
  <ns0:rect x="284.4444" y="320" width="568.8889" height="96" fill="#fff3e0" stroke="#333" stroke-width="3.7926" rx="5.6889" />
  <ns0:text x="568.8889" y="384" text-anchor="middle" font-size="20.8593">COPY requirements.txt .</ns0:text>
  <ns0:text x="986.074" y="384" font-size="18.9629" fill="#ff9800">changed</ns0:text>
  <ns0:rect x="284.4444" y="432" width="568.8889" height="96" fill="#ffebee" stroke="#333" stroke-width="3.7926" rx="5.6889" />
  <ns0:text x="568.8889" y="496" text-anchor="middle" font-size="20.8593">RUN pip install -r requirements.txt</ns0:text>
  <ns0:text x="986.074" y="496" font-size="18.9629" fill="#f44336">rebuild</ns0:text>
  <ns0:rect x="284.4444" y="544" width="568.8889" height="96" fill="#ffebee" stroke="#333" stroke-width="3.7926" rx="5.6889" />
  <ns0:text x="568.8889" y="608" text-anchor="middle" font-size="20.8593">COPY . .</ns0:text>
  <ns0:text x="986.074" y="608" font-size="18.9629" fill="#f44336">rebuild</ns0:text>
</ns0:svg>
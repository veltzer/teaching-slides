<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
<rect x="40" y="40" width="1200" height="108.749999399048" rx="6.38602002312" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
<text x="70" y="87.578125137718" font-size="23.415406406902" font-weight="bold" fill="var(--ok-text)" font-family="Courier New, monospace">FROM ubuntu:22.04</text>
<text x="70" y="128.359375713631" font-family="Arial, sans-serif" font-size="19.15806006936" fill="var(--ok-text)">base layer rarely changes</text>
<rect x="1060" y="64.921875530006" width="160" height="58.906250475754" rx="6.38602002312" fill="var(--surface)" stroke="var(--ok-border)" stroke-width="2"/>
<text x="1140" y="103.437500183624" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.415406406902" font-weight="bold" fill="var(--ok-accent)">cached</text>
<rect x="40" y="157.812499883148" width="1200" height="108.749999399048" rx="6.38602002312" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
<text x="70" y="205.390625020866" font-size="23.415406406902" font-weight="bold" fill="var(--ok-text)" font-family="Courier New, monospace">RUN apt-get update &amp;&amp; apt-get install -y python3</text>
<text x="70" y="246.171875596779" font-family="Arial, sans-serif" font-size="19.15806006936" fill="var(--ok-text)">stable system packages</text>
<rect x="1060" y="182.734375413155" width="160" height="58.906250475754" rx="6.38602002312" fill="var(--surface)" stroke="var(--ok-border)" stroke-width="2"/>
<text x="1140" y="221.250000066772" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.415406406902" font-weight="bold" fill="var(--ok-accent)">cached</text>
<rect x="40" y="275.624999766296" width="1200" height="108.749999399048" rx="6.38602002312" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
<text x="70" y="323.203124904015" font-size="23.415406406902" font-weight="bold" fill="var(--warn-text)" font-family="Courier New, monospace">COPY requirements.txt .</text>
<text x="70" y="363.984375479927" font-family="Arial, sans-serif" font-size="19.15806006936" fill="var(--warn-text)">trigger: requirements.txt modified</text>
<rect x="1060" y="300.546875296303" width="160" height="58.906250475754" rx="6.38602002312" fill="var(--surface)" stroke="var(--warn-border)" stroke-width="2"/>
<text x="1140" y="339.062499949921" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.415406406902" font-weight="bold" fill="var(--warn-accent)">changed</text>
<rect x="40" y="393.437499649445" width="1200" height="108.749999399048" rx="6.38602002312" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
<text x="70" y="441.015624787163" font-size="23.415406406902" font-weight="bold" fill="var(--danger-text)" font-family="Courier New, monospace">RUN pip install -r requirements.txt</text>
<text x="70" y="481.796875363075" font-family="Arial, sans-serif" font-size="19.15806006936" fill="var(--danger-text)">all downstream invalidated</text>
<rect x="1060" y="418.359375179451" width="160" height="58.906250475754" rx="6.38602002312" fill="var(--surface)" stroke="var(--danger-border)" stroke-width="2"/>
<text x="1140" y="456.874999833069" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.415406406902" font-weight="bold" fill="var(--danger-accent)">rebuild</text>
<rect x="40" y="511.250000600952" width="1200" height="108.749999399048" rx="6.38602002312" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
<text x="70" y="558.828124670311" font-size="23.415406406902" font-weight="bold" fill="var(--danger-text)" font-family="Courier New, monospace">COPY . .</text>
<text x="70" y="599.609375246223" font-family="Arial, sans-serif" font-size="19.15806006936" fill="var(--danger-text)">source copy always rebuilds here</text>
<rect x="1060" y="536.171875062599" width="160" height="58.906250475754" rx="6.38602002312" fill="var(--surface)" stroke="var(--danger-border)" stroke-width="2"/>
<text x="1140" y="574.687499716217" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.415406406902" font-weight="bold" fill="var(--danger-accent)">rebuild</text>
</svg>

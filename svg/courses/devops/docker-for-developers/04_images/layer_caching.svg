<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="64.8" text-anchor="middle" font-size="23.4667" fill="#555">Each instruction creates a cached layer</text>
  <rect x="320" y="108" width="640" height="108" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="6.4" />
  <text x="640" y="180" text-anchor="middle" font-size="23.4667">FROM ubuntu:22.04</text>
  <text x="1109.3333" y="180" font-size="21.3333" fill="#4caf50">cached</text>
  <rect x="320" y="234" width="640" height="108" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="6.4" />
  <text x="640" y="306" text-anchor="middle" font-size="23.4667">RUN apt-get update</text>
  <text x="1109.3333" y="306" font-size="21.3333" fill="#4caf50">cached</text>
  <rect x="320" y="360" width="640" height="108" fill="#fff3e0" stroke="#333" stroke-width="4.2667" rx="6.4" />
  <text x="640" y="432" text-anchor="middle" font-size="23.4667">COPY requirements.txt .</text>
  <text x="1109.3333" y="432" font-size="21.3333" fill="#ff9800">changed</text>
  <rect x="320" y="486" width="640" height="108" fill="#ffebee" stroke="#333" stroke-width="4.2667" rx="6.4" />
  <text x="640" y="558" text-anchor="middle" font-size="23.4667">RUN pip install -r requirements.txt</text>
  <text x="1109.3333" y="558" font-size="21.3333" fill="#f44336">rebuild</text>
  <rect x="320" y="612" width="640" height="108" fill="#ffebee" stroke="#333" stroke-width="4.2667" rx="6.4" />
  <text x="640" y="684" text-anchor="middle" font-size="23.4667">COPY . .</text>
  <text x="1109.3333" y="684" font-size="21.3333" fill="#f44336">rebuild</text>
</svg>
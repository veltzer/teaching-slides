<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
  </defs>
<text x="640" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--text)">Docker Layer Caching: When Layers Rebuild</text>
<rect x="40" y="100" width="1200" height="96" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
<text x="70" y="142" font-family="Courier, monospace" font-size="22" font-weight="bold" fill="var(--ok-text)">FROM ubuntu:22.04</text>
<text x="70" y="178" font-family="Arial, sans-serif" font-size="18" fill="var(--ok-text)">base layer rarely changes</text>
<rect x="1060" y="122" width="160" height="52" rx="6" fill="var(--surface)" stroke="var(--ok-border)" stroke-width="2"/>
<text x="1140" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-accent)">cached</text>
<rect x="40" y="204" width="1200" height="96" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
<text x="70" y="246" font-family="Courier, monospace" font-size="22" font-weight="bold" fill="var(--ok-text)">RUN apt-get update &amp;&amp; apt-get install -y python3</text>
<text x="70" y="282" font-family="Arial, sans-serif" font-size="18" fill="var(--ok-text)">stable system packages</text>
<rect x="1060" y="226" width="160" height="52" rx="6" fill="var(--surface)" stroke="var(--ok-border)" stroke-width="2"/>
<text x="1140" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-accent)">cached</text>
<rect x="40" y="308" width="1200" height="96" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
<text x="70" y="350" font-family="Courier, monospace" font-size="22" font-weight="bold" fill="var(--warn-text)">COPY requirements.txt .</text>
<text x="70" y="386" font-family="Arial, sans-serif" font-size="18" fill="var(--warn-text)">trigger: requirements.txt modified</text>
<rect x="1060" y="330" width="160" height="52" rx="6" fill="var(--surface)" stroke="var(--warn-border)" stroke-width="2"/>
<text x="1140" y="364" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-accent)">changed</text>
<rect x="40" y="412" width="1200" height="96" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
<text x="70" y="454" font-family="Courier, monospace" font-size="22" font-weight="bold" fill="var(--danger-text)">RUN pip install -r requirements.txt</text>
<text x="70" y="490" font-family="Arial, sans-serif" font-size="18" fill="var(--danger-text)">all downstream invalidated</text>
<rect x="1060" y="434" width="160" height="52" rx="6" fill="var(--surface)" stroke="var(--danger-border)" stroke-width="2"/>
<text x="1140" y="468" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-accent)">rebuild</text>
<rect x="40" y="516" width="1200" height="96" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
<text x="70" y="558" font-family="Courier, monospace" font-size="22" font-weight="bold" fill="var(--danger-text)">COPY . .</text>
<text x="70" y="594" font-family="Arial, sans-serif" font-size="18" fill="var(--danger-text)">source copy always rebuilds here</text>
<rect x="1060" y="538" width="160" height="52" rx="6" fill="var(--surface)" stroke="var(--danger-border)" stroke-width="2"/>
<text x="1140" y="572" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-accent)">rebuild</text>
</svg>

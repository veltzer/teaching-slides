<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd6_03_images" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="40" y="40" width="342.8571" height="580" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="211.4285" y="130.625" text-anchor="middle" font-size="23.6006" font-weight="bold">Stage 1: Build</text>
  <rect x="72.1428" y="166.8751" width="278.5714" height="72.5" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="2.107" rx="6" />
  <text x="211.4285" y="217.625" text-anchor="middle" font-size="21.455">FROM golang AS build</text>
  <rect x="72.1428" y="257.5" width="278.5714" height="72.5" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="2.107" rx="6" />
  <text x="211.4285" y="308.25" text-anchor="middle" font-size="21.455">COPY source code</text>
  <rect x="72.1428" y="348.125" width="278.5714" height="72.5" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="2.107" rx="6" />
  <text x="211.4285" y="398.875" text-anchor="middle" font-size="21.455">RUN go build</text>
  <rect x="72.1428" y="456.875" width="278.5714" height="108.75" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="211.4285" y="525.75" text-anchor="middle" font-size="21.455">binary artifact</text>
  <line x1="382.8571" y1="330.0001" x2="464.2857" y2="330.0001" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd6_03_images)" />
  <text x="425.7143" y="293.75" text-anchor="middle" font-size="21.455" fill="var(--text-muted)">COPY</text>
  <text x="425.7143" y="384.375" text-anchor="middle" font-size="21.455" fill="var(--text-muted)">--from</text>
  <rect x="468.5714" y="148.75" width="342.8571" height="362.5" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="239.375" text-anchor="middle" font-size="23.6006" font-weight="bold">Stage 2: Runtime</text>
  <rect x="500.7142" y="275.625" width="278.5714" height="72.5" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="2.107" rx="6" />
  <text x="640" y="326.375" text-anchor="middle" font-size="21.455">FROM alpine</text>
  <rect x="500.7142" y="366.25" width="278.5714" height="90.625" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="427.875" text-anchor="middle" font-size="21.455">binary only</text>
  <rect x="918.5714" y="148.75" width="321.4286" height="362.5" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" stroke-dasharray="8.428 6.321" />
  <text x="1079.2857" y="257.5" text-anchor="middle" font-size="23.6006" fill="var(--text)" font-weight="bold">Result</text>
  <text x="1079.2857" y="330.0001" text-anchor="middle" font-size="21.455" fill="var(--ok-accent)">Small final image</text>
  <text x="1079.2857" y="384.375" text-anchor="middle" font-size="21.455" fill="var(--ok-accent)">No build tools</text>
  <text x="1079.2857" y="438.75" text-anchor="middle" font-size="21.455" fill="var(--ok-accent)">No source code</text>
</svg>
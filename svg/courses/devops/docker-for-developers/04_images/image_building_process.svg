<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="360" height="290" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Dockerfile</text>
  <text x="220" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">FROM python:3.12-slim</text>
  <text x="220" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">WORKDIR /app</text>
  <text x="220" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">COPY requirements.txt .</text>
  <text x="220" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">RUN pip install -r ...</text>
  <text x="220" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">COPY . .</text>
  <text x="220" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">CMD ["python", "app.py"]</text>
  <text x="220" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">recipe</text>

  <rect x="460" y="40" width="360" height="290" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">docker build</text>
  <text x="640" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">parse</text>
  <text x="640" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">run in container</text>
  <text x="640" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">commit layer</text>
  <text x="640" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">reuse cache</text>
  <text x="640" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">if unchanged</text>
  <text x="640" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">BuildKit parallel</text>
  <text x="640" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">layer engine</text>

  <rect x="880" y="40" width="360" height="290" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1060" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Image</text>
  <text x="1060" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">read-only layers</text>
  <text x="1060" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">(tarballs)</text>
  <text x="1060" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">sha256 addressed</text>
  <text x="1060" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)"/>
  <text x="1060" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">push to registry</text>
  <text x="1060" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">run anywhere</text>
  <text x="1060" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">portable</text>

  <line x1="400" y1="185" x2="458" y2="185" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="820" y1="185" x2="878" y2="185" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="429" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">parse</text>
  <text x="849" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">commit</text>

  <rect x="40" y="360" width="1200" height="260" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Layer caching</text>

  <rect x="70" y="425" width="275" height="175" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="2"/>
  <text x="207" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--primary-accent)">Order matters</text>
  <text x="207" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">stable first</text>
  <text x="207" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">volatile last</text>
  <text x="207" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">deps before src</text>
  <text x="207" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)"/>
  <text x="207" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">avoid busts</text>

  <rect x="365" y="425" width="275" height="175" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="2"/>
  <text x="502" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--primary-accent)">Smaller is better</text>
  <text x="502" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">slim/alpine</text>
  <text x="502" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">multi-stage</text>
  <text x="502" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">drop build tools</text>
  <text x="502" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">.dockerignore</text>
  <text x="502" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">no secrets</text>

  <rect x="660" y="425" width="275" height="175" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="2"/>
  <text x="797" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--primary-accent)">Reproducible</text>
  <text x="797" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">pin digest</text>
  <text x="797" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">pin versions</text>
  <text x="797" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">same in → same sha</text>
  <text x="797" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">provenance</text>
  <text x="797" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">SBOM</text>

  <rect x="955" y="425" width="255" height="175" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="2"/>
  <text x="1082" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--primary-accent)">Distribute</text>
  <text x="1082" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">push registry</text>
  <text x="1082" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">tag version</text>
  <text x="1082" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">scan</text>
  <text x="1082" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">cosign sign</text>
  <text x="1082" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">pull</text>
</svg>

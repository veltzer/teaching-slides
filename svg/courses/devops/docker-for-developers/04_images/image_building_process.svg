<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="360" height="290" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Dockerfile</text>
  <text x="220" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">FROM python:3.12-slim</text>
  <text x="220" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">WORKDIR /app</text>
  <text x="220" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">COPY requirements.txt .</text>
  <text x="220" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">RUN pip install -r ...</text>
  <text x="220" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">COPY . .</text>
  <text x="220" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">CMD ["python", "app.py"]</text>
  <text x="220" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">declarative recipe</text>

  <rect x="460" y="40" width="360" height="290" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">docker build</text>
  <text x="640" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">parse instructions</text>
  <text x="640" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">run each in container</text>
  <text x="640" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">commit layer on success</text>
  <text x="640" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">reuse cache when inputs</text>
  <text x="640" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">have not changed</text>
  <text x="640" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">BuildKit parallelizes</text>
  <text x="640" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">layer-by-layer engine</text>

  <rect x="880" y="40" width="360" height="290" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1060" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Image</text>
  <text x="1060" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">stack of read-only</text>
  <text x="1060" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">layers (tarballs)</text>
  <text x="1060" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">content-addressed by</text>
  <text x="1060" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">sha256 digest</text>
  <text x="1060" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">push to registry,</text>
  <text x="1060" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">pull and run anywhere</text>
  <text x="1060" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">portable artifact</text>

  <line x1="400" y1="185" x2="458" y2="185" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="820" y1="185" x2="878" y2="185" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="429" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">parse</text>
  <text x="849" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">commit</text>

  <rect x="40" y="360" width="1200" height="260" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Layer caching is the whole point</text>

  <rect x="70" y="425" width="275" height="175" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="2"/>
  <text x="207" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--primary-accent)">Order matters</text>
  <text x="207" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">put stable steps first</text>
  <text x="207" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">volatile code last</text>
  <text x="207" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">COPY deps before</text>
  <text x="207" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">COPY source</text>
  <text x="207" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">avoid cache busts</text>

  <rect x="365" y="425" width="275" height="175" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="2"/>
  <text x="502" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--primary-accent)">Smaller is better</text>
  <text x="502" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">slim/alpine base</text>
  <text x="502" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">multi-stage builds</text>
  <text x="502" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">delete build tooling</text>
  <text x="502" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">use .dockerignore</text>
  <text x="502" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">avoid secrets in layers</text>

  <rect x="660" y="425" width="275" height="175" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="2"/>
  <text x="797" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--primary-accent)">Reproducible</text>
  <text x="797" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">pin base tag digest</text>
  <text x="797" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">pin package versions</text>
  <text x="797" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">same input → same sha</text>
  <text x="797" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">signed provenance</text>
  <text x="797" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">SBOM attached</text>

  <rect x="955" y="425" width="255" height="175" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="2"/>
  <text x="1082" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--primary-accent)">Distribute</text>
  <text x="1082" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">push to registry</text>
  <text x="1082" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">tag by version</text>
  <text x="1082" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">scan before release</text>
  <text x="1082" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">sign with cosign</text>
  <text x="1082" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">pull anywhere</text>
</svg>

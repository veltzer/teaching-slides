<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <rect x="40" y="58.125" width="300.0001" height="235.625" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="189.9999" y="148.75" text-anchor="middle" font-size="23.6006" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Build Error</text>
  <text x="189.9999" y="221.25" text-anchor="middle" font-size="21.4549" font-family="Arial, sans-serif" fill="var(--danger-text)">Step 4/7 fails</text>
  <line x1="339.9999" y1="174.125" x2="464.2856" y2="174.125" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="468.5713" y="40" width="342.8571" height="271.875" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="119.75" text-anchor="middle" font-size="23.6006" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Debug Strategy</text>
  <text x="639.9999" y="185" text-anchor="middle" font-size="21.4549" font-family="Arial, sans-serif" fill="var(--warn-text)">docker build --no-cache</text>
  <text x="639.9999" y="239.375" text-anchor="middle" font-size="21.4549" font-family="Arial, sans-serif" fill="var(--warn-text)">docker run -it image sh</text>
  <text x="639.9999" y="293.75" text-anchor="middle" font-size="21.4549" fill="var(--text-muted)" font-family="Arial, sans-serif">inspect failed layer</text>
  <line x1="811.4285" y1="174.125" x2="914.2857" y2="174.125" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="918.5713" y="58.125" width="321.4286" height="235.625" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1079.2856" y="148.75" text-anchor="middle" font-size="23.6006" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Fix and Rebuild</text>
  <text x="1079.2856" y="221.25" text-anchor="middle" font-size="21.4549" font-family="Arial, sans-serif" fill="var(--ok-text)">Correct Dockerfile</text>
  <rect x="40" y="402.5" width="1200" height="217.5" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" stroke-dasharray="8.428 6.321" />
  <text x="639.9999" y="482.25" text-anchor="middle" font-size="21.4549" fill="var(--text-muted)" font-family="Arial, sans-serif">Common issues: missing files, wrong base image, permission errors,</text>
  <text x="639.9999" y="540.25" text-anchor="middle" font-size="21.4549" fill="var(--text-muted)" font-family="Arial, sans-serif">network timeouts during package install, syntax errors in RUN commands</text>
</svg>
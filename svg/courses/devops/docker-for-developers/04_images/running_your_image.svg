<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd7_03_images" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="40" y="76.25" width="261.8182" height="181.25" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="170.909" y="148.75" text-anchor="middle" font-size="23.8141" font-weight="bold">Image</text>
  <text x="170.909" y="214" text-anchor="middle" font-size="21.6491">myapp:1.0</text>
  <line x1="301.8182" y1="166.8751" x2="450.1818" y2="166.8751" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd7_03_images)" />
  <text x="375.9999" y="141.5" text-anchor="middle" font-size="21.6491" fill="var(--text-muted)">docker run</text>
  <rect x="454.5454" y="40" width="349.0908" height="253.75" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="629.0909" y="130.625" text-anchor="middle" font-size="23.8141" font-weight="bold">Container</text>
  <text x="629.0909" y="192.25" text-anchor="middle" font-size="21.6491">Running instance</text>
  <text x="629.0909" y="250.25" text-anchor="middle" font-size="21.6491" fill="var(--text-muted)">-p 5000:5000 -d</text>
  <rect x="454.5454" y="402.5" width="349.0908" height="217.5" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="629.0909" y="482.25" text-anchor="middle" font-size="23.8141" font-weight="bold">Host: localhost</text>
  <text x="629.0909" y="554.75" text-anchor="middle" font-size="21.6491">port 5000 mapped</text>
  <line x1="629.0909" y1="293.75" x2="629.0909" y2="395.25" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd7_03_images)" />
  <text x="716.3636" y="359" font-size="21.6491" fill="var(--text-muted)">port map</text>
  <rect x="934.5454" y="402.5" width="305.4546" height="217.5" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="1087.2726" y="482.25" text-anchor="middle" font-size="23.8141" font-weight="bold">External</text>
  <text x="1087.2726" y="554.75" text-anchor="middle" font-size="21.6491">curl localhost:5000</text>
  <line x1="803.6364" y1="511.25" x2="930.1817" y2="511.25" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd7_03_images)" />
</svg>
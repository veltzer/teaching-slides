<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arrowd0_06_handling_logs" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <ns0:path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect x="41.001" y="172.973" width="287.007" height="242.1622" fill="#e3f2fd" stroke="#333" stroke-width="4.1001" rx="10.2503" />
  <ns0:text x="184.5045" y="249.0811" text-anchor="middle" font-size="22.5506" font-weight="bold">Application</ns0:text>
  <ns0:text x="184.5045" y="311.3514" text-anchor="middle" font-size="20.5005">writes to</ns0:text>
  <ns0:text x="184.5045" y="363.2432" text-anchor="middle" font-size="20.5005" fill="#555">stdout / stderr</ns0:text>
  <ns0:line x1="328.008" y1="294.0541" x2="446.9109" y2="294.0541" stroke="#333" stroke-width="4.1001" marker-end="url(#arrowd0_06_handling_logs)" />
  <ns0:rect x="451.011" y="138.3784" width="328.008" height="311.3514" fill="#f3e5f5" stroke="#333" stroke-width="4.1001" rx="10.2503" />
  <ns0:text x="615.015" y="214.4865" text-anchor="middle" font-size="22.5506" font-weight="bold">Docker Daemon</ns0:text>
  <ns0:text x="615.015" y="276.7568" text-anchor="middle" font-size="20.5005">Captures streams</ns0:text>
  <ns0:text x="615.015" y="328.6486" text-anchor="middle" font-size="20.5005">Applies log driver</ns0:text>
  <ns0:text x="615.015" y="380.5405" text-anchor="middle" font-size="20.5005" fill="#555">(json-file default)</ns0:text>
  <ns0:line x1="779.0191" y1="294.0541" x2="897.9219" y2="294.0541" stroke="#333" stroke-width="4.1001" marker-end="url(#arrowd0_06_handling_logs)" />
  <ns0:rect x="902.0221" y="172.973" width="287.007" height="242.1622" fill="#e8f5e9" stroke="#333" stroke-width="4.1001" rx="10.2503" />
  <ns0:text x="1045.5255" y="249.0811" text-anchor="middle" font-size="22.5506" font-weight="bold">Log Storage</ns0:text>
  <ns0:text x="1045.5255" y="311.3514" text-anchor="middle" font-size="20.5005">/var/lib/docker/</ns0:text>
  <ns0:text x="1045.5255" y="363.2432" text-anchor="middle" font-size="20.5005" fill="#555">containers/&lt;id&gt;/</ns0:text>
  <ns0:rect x="41.001" y="536.2162" width="1148.0281" height="103.7838" fill="#f9f9f9" stroke="#999" stroke-width="2.05" rx="10.2503" stroke-dasharray="8.2002 6.1502" />
  <ns0:text x="615.015" y="605.4054" text-anchor="middle" font-size="20.5005" fill="#555">docker logs &lt;container&gt; reads from the configured log driver</ns0:text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="80" width="300" height="280.0001" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="190" y="168" text-anchor="middle" font-size="24.7912" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Application</text>
  <text x="190" y="240" text-anchor="middle" font-size="22.5374" font-family="Arial, sans-serif" fill="var(--primary-text)">writes to</text>
  <text x="190" y="299.9999" text-anchor="middle" font-size="22.5374" fill="var(--text-muted)" font-family="Arial, sans-serif">stdout / stderr</text>
  <line x1="340" y1="220" x2="464.2857" y2="220" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="468.5714" y="40" width="342.8571" height="360.0001" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="128" text-anchor="middle" font-size="24.7912" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Docker Daemon</text>
  <text x="639.9999" y="200" text-anchor="middle" font-size="22.5374" font-family="Arial, sans-serif" fill="var(--info-text)">Captures streams</text>
  <text x="639.9999" y="259.9999" text-anchor="middle" font-size="22.5374" font-family="Arial, sans-serif" fill="var(--info-text)">Applies log driver</text>
  <text x="639.9999" y="319.9999" text-anchor="middle" font-size="22.5374" fill="var(--text-muted)" font-family="Arial, sans-serif">(json-file default)</text>
  <line x1="811.4286" y1="220" x2="935.7142" y2="220" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="940" y="80" width="300" height="280.0001" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1089.9999" y="168" text-anchor="middle" font-size="24.7912" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Log Storage</text>
  <text x="1089.9999" y="240" text-anchor="middle" font-size="22.5374" font-family="Arial, sans-serif" fill="var(--ok-text)">/var/lib/docker/</text>
  <text x="1089.9999" y="299.9999" text-anchor="middle" font-size="22.5374" fill="var(--text-muted)" font-family="Arial, sans-serif">containers/&lt;id&gt;/</text>
  <rect x="40" y="500" width="1200" height="120" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" stroke-dasharray="8.2002 6.1502"/>
  <text x="639.9999" y="580" text-anchor="middle" font-size="22.5374" fill="var(--text-muted)" font-family="Arial, sans-serif">docker logs &lt;container&gt; reads from the configured log driver</text>
</svg>

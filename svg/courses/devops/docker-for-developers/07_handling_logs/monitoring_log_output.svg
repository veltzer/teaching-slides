<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd5_06_handling_logs" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="42.14" y="106.6667" width="294.9795" height="213.3333" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="189.6296" y="184.8889" text-anchor="middle" font-size="23.177" font-weight="bold">docker logs -f</text>
  <text x="189.6296" y="256" text-anchor="middle" font-size="21.0699" fill="var(--text-muted)">Follow / stream</text>
  <line x1="337.1193" y1="213.3333" x2="459.3251" y2="213.3333" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd5_06_handling_logs)" />
  <rect x="463.5391" y="106.6667" width="337.1193" height="213.3333" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="632.0988" y="170.6667" text-anchor="middle" font-size="23.177" font-weight="bold">Filter + Search</text>
  <text x="632.0988" y="231.1111" text-anchor="middle" font-size="21.0699">--since, --until</text>
  <text x="632.0988" y="284.4444" text-anchor="middle" font-size="21.0699" fill="var(--text-muted)">--tail N, | grep</text>
  <line x1="800.6585" y1="213.3333" x2="922.8642" y2="213.3333" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd5_06_handling_logs)" />
  <rect x="927.0782" y="106.6667" width="294.9795" height="213.3333" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1074.5679" y="184.8889" text-anchor="middle" font-size="23.177" font-weight="bold">Analyze</text>
  <text x="1074.5679" y="256" text-anchor="middle" font-size="21.0699" fill="var(--text-muted)">Pattern matching</text>
  <rect x="42.14" y="408.8889" width="1179.9177" height="231.1111" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" stroke-dasharray="8.428 6.321" />
  <text x="632.0988" y="480" text-anchor="middle" font-size="21.0699" fill="var(--text-muted)">docker logs --since 2024-01-01 --until 2024-01-02 myapp</text>
  <text x="632.0988" y="540.4444" text-anchor="middle" font-size="21.0699" fill="var(--text-muted)">docker logs myapp 2&gt;&amp;1 | grep ERROR</text>
  <text x="632.0988" y="600.8889" text-anchor="middle" font-size="21.0699" fill="var(--text-muted)">docker logs -f --tail 0 myapp  (only new logs)</text>
</svg>
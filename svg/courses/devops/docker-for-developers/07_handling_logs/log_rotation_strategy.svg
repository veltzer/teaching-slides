<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd4_06_handling_logs" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="629.0909" y="40" text-anchor="middle" font-size="23.6667" fill="var(--text-muted)">Log rotation prevents disk exhaustion</text>
  <rect x="40" y="82.963" width="349.0909" height="268.5186" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="214.5455" y="161.7284" text-anchor="middle" font-size="23.6667" font-weight="bold">Active Log</text>
  <text x="214.5455" y="226.1729" text-anchor="middle" font-size="21.5151">container-json.log</text>
  <text x="214.5455" y="287.037" text-anchor="middle" font-size="21.5151" fill="var(--text-muted)">max-size: 10m</text>
  <line x1="389.0909" y1="215.4321" x2="472" y2="215.4321" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd4_06_handling_logs)" />
  <text x="432.7272" y="183.2099" text-anchor="middle" font-size="21.5151" fill="var(--text-muted)">rotate</text>
  <rect x="476.3637" y="82.963" width="349.0909" height="268.5186" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="650.9091" y="161.7284" text-anchor="middle" font-size="23.6667" font-weight="bold">Rotated Logs</text>
  <text x="650.9091" y="226.1729" text-anchor="middle" font-size="21.5151">log.1, log.2, log.3</text>
  <text x="650.9091" y="287.037" text-anchor="middle" font-size="21.5151" fill="var(--text-muted)">max-file: 3</text>
  <line x1="825.4546" y1="215.4321" x2="908.3637" y2="215.4321" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd4_06_handling_logs)" />
  <text x="869.0909" y="183.2099" text-anchor="middle" font-size="21.5151" fill="var(--text-muted)">oldest</text>
  <rect x="912.7272" y="82.963" width="327.2728" height="268.5186" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1076.3636" y="161.7284" text-anchor="middle" font-size="23.6667" font-weight="bold">Discarded</text>
  <text x="1076.3636" y="226.1729" text-anchor="middle" font-size="21.5151">Oldest file removed</text>
  <text x="1076.3636" y="287.037" text-anchor="middle" font-size="21.5151" fill="var(--text-muted)">when limit reached</text>
  <rect x="40" y="423.0864" width="1200" height="196.9136" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" stroke-dasharray="8.428 6.321" />
  <text x="640.0001" y="501.8519" text-anchor="middle" font-size="21.5151" fill="var(--text-muted)">Config: --log-opt max-size=10m --log-opt max-file=3</text>
  <text x="640.0001" y="566.2963" text-anchor="middle" font-size="21.5151" fill="var(--text-muted)">Total max disk: max-size x max-file = 30MB per container</text>
</svg>
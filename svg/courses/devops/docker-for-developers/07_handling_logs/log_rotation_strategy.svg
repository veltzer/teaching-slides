<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="629.0909" y="40" text-anchor="middle" font-size="23.6667" fill="var(--text-muted)" font-family="Arial, sans-serif">Log rotation prevents disk exhaustion</text>
  <rect x="40" y="82.963" width="349.0909" height="268.5186" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="214.5455" y="161.7284" text-anchor="middle" font-size="23.6667" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Active Log</text>
  <text x="214.5455" y="226.1729" text-anchor="middle" font-size="21.5151" font-family="Arial, sans-serif" fill="var(--primary-text)">container-json.log</text>
  <text x="214.5455" y="287.037" text-anchor="middle" font-size="21.5151" fill="var(--text-muted)" font-family="Arial, sans-serif">max-size: 10m</text>
  <line x1="389.0909" y1="215.4321" x2="472" y2="215.4321" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="432.7272" y="183.2099" text-anchor="middle" font-size="21.5151" fill="var(--text-muted)" font-family="Arial, sans-serif">rotate</text>
  <rect x="476.3637" y="82.963" width="349.0909" height="268.5186" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="650.9091" y="161.7284" text-anchor="middle" font-size="23.6667" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Rotated Logs</text>
  <text x="650.9091" y="226.1729" text-anchor="middle" font-size="21.5151" font-family="Arial, sans-serif" fill="var(--info-text)">log.1, log.2, log.3</text>
  <text x="650.9091" y="287.037" text-anchor="middle" font-size="21.5151" fill="var(--text-muted)" font-family="Arial, sans-serif">max-file: 3</text>
  <line x1="825.4546" y1="215.4321" x2="908.3637" y2="215.4321" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="869.0909" y="183.2099" text-anchor="middle" font-size="21.5151" fill="var(--text-muted)" font-family="Arial, sans-serif">oldest</text>
  <rect x="912.7272" y="82.963" width="327.2728" height="268.5186" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1076.3636" y="161.7284" text-anchor="middle" font-size="23.6667" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Discarded</text>
  <text x="1076.3636" y="226.1729" text-anchor="middle" font-size="21.5151" font-family="Arial, sans-serif" fill="var(--danger-text)">Oldest file removed</text>
  <text x="1076.3636" y="287.037" text-anchor="middle" font-size="21.5151" fill="var(--text-muted)" font-family="Arial, sans-serif">when limit reached</text>
  <rect x="40" y="423.0864" width="1200" height="196.9136" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" stroke-dasharray="8.428 6.321"/>
  <text x="640.0001" y="501.8519" text-anchor="middle" font-size="21.5151" fill="var(--text-muted)" font-family="Arial, sans-serif">Config: --log-opt max-size=10m --log-opt max-file=3</text>
  <text x="640.0001" y="566.2963" text-anchor="middle" font-size="21.5151" fill="var(--text-muted)" font-family="Arial, sans-serif">Total max disk: max-size x max-file = 30MB per container</text>
</svg>

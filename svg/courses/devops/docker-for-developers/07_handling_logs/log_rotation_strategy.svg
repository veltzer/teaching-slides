<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd4_06_handling_logs" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="632.0988" y="64" text-anchor="middle" font-size="23.177" fill="var(--text-muted)">Log rotation prevents disk exhaustion</text>
  <rect x="63.2099" y="106.6667" width="337.1193" height="266.6667" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="231.7696" y="184.8889" text-anchor="middle" font-size="23.177" font-weight="bold">Active Log</text>
  <text x="231.7696" y="248.8889" text-anchor="middle" font-size="21.0699">container-json.log</text>
  <text x="231.7696" y="309.3333" text-anchor="middle" font-size="21.0699" fill="var(--text-muted)">max-size: 10m</text>
  <line x1="400.3292" y1="238.2222" x2="480.3951" y2="238.2222" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd4_06_handling_logs)" />
  <text x="442.4691" y="206.2222" text-anchor="middle" font-size="21.0699" fill="var(--text-muted)">rotate</text>
  <rect x="484.6091" y="106.6667" width="337.1193" height="266.6667" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="653.1687" y="184.8889" text-anchor="middle" font-size="23.177" font-weight="bold">Rotated Logs</text>
  <text x="653.1687" y="248.8889" text-anchor="middle" font-size="21.0699">log.1, log.2, log.3</text>
  <text x="653.1687" y="309.3333" text-anchor="middle" font-size="21.0699" fill="var(--text-muted)">max-file: 3</text>
  <line x1="821.7284" y1="238.2222" x2="901.7943" y2="238.2222" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd4_06_handling_logs)" />
  <text x="863.8683" y="206.2222" text-anchor="middle" font-size="21.0699" fill="var(--text-muted)">oldest</text>
  <rect x="906.0082" y="106.6667" width="316.0494" height="266.6667" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="1064.0329" y="184.8889" text-anchor="middle" font-size="23.177" font-weight="bold">Discarded</text>
  <text x="1064.0329" y="248.8889" text-anchor="middle" font-size="21.0699">Oldest file removed</text>
  <text x="1064.0329" y="309.3333" text-anchor="middle" font-size="21.0699" fill="var(--text-muted)">when limit reached</text>
  <rect x="63.2099" y="444.4444" width="1158.8477" height="195.5556" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" stroke-dasharray="8.428 6.321" />
  <text x="642.6338" y="522.6667" text-anchor="middle" font-size="21.0699" fill="var(--text-muted)">Config: --log-opt max-size=10m --log-opt max-file=3</text>
  <text x="642.6338" y="586.6667" text-anchor="middle" font-size="21.0699" fill="var(--text-muted)">Total max disk: max-size x max-file = 30MB per container</text>
</svg>
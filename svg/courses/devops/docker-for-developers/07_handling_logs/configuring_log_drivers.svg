  <ns0:text x="1074.5679" y="202.6667" text-anchor="middle" font-size="21.0699" fill="#555">File / Remote / Service</ns0:text>
  <ns0:rect x="42.14" y="355.5556" width="1179.9177" height="284.4444" fill="#f9f9f9" stroke="#999" stroke-width="2.107" rx="10.535" stroke-dasharray="8.428 6.321" />
  <ns0:text x="632.0988" y="426.6667" text-anchor="middle" font-size="21.0699" fill="#555">Per-container override: docker run --log-driver=syslog myapp</ns0:text>
  <ns0:text x="632.0988" y="497.7778" text-anchor="middle" font-size="21.0699" fill="#555">Global default: /etc/docker/daemon.json {"log-driver": "json-file"}</ns0:text>
  <ns0:text x="632.0988" y="568.8889" text-anchor="middle" font-size="21.0699" fill="#555">Log options: --log-opt max-size=10m --log-opt max-file=3</ns0:text>

  <ns0:text x="632.0988" y="184.8889" text-anchor="middle" font-size="21.0699">json-file | syslog</ns0:text>
  <ns0:text x="632.0988" y="238.2222" text-anchor="middle" font-size="21.0699">journald | splunk</ns0:text>

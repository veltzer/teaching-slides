<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd3_06_handling_logs" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="40" y="40" width="171.4286" height="172.4324" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="125.7142" y="112.1081" text-anchor="middle" font-size="19.9527" font-weight="bold">Container</text>
  <text x="125.7142" y="159.1351" text-anchor="middle" font-size="19.9527">A</text>
  <rect x="40" y="243.7838" width="171.4286" height="172.4324" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="125.7142" y="315.8919" text-anchor="middle" font-size="19.9527" font-weight="bold">Container</text>
  <text x="125.7142" y="362.9189" text-anchor="middle" font-size="19.9527">B</text>
  <rect x="40" y="447.5676" width="171.4286" height="172.4324" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="125.7142" y="519.6757" text-anchor="middle" font-size="19.9527" font-weight="bold">Container</text>
  <text x="125.7142" y="566.7027" text-anchor="middle" font-size="19.9527">C</text>
  <line x1="211.4285" y1="124.6486" x2="399.9999" y2="306.4865" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd3_06_handling_logs)" />
  <line x1="211.4285" y1="328.4324" x2="399.9999" y2="306.4865" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd3_06_handling_logs)" />
  <line x1="211.4285" y1="532.2162" x2="399.9999" y2="306.4865" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd3_06_handling_logs)" />
  <rect x="404.2856" y="181.0811" width="300" height="250.8108" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="554.2857" y="259.4595" text-anchor="middle" font-size="21.9481" font-weight="bold">Log Collector</text>
  <text x="554.2857" y="312.7568" text-anchor="middle" font-size="19.9527">Fluentd / Logstash</text>
  <text x="554.2857" y="359.7838" text-anchor="middle" font-size="19.9527" fill="var(--text-muted)">Filebeat</text>
  <line x1="704.2857" y1="306.4865" x2="828.5713" y2="306.4865" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd3_06_handling_logs)" />
  <rect x="832.8571" y="181.0811" width="407.1429" height="250.8108" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1036.4285" y="259.4595" text-anchor="middle" font-size="21.9481" font-weight="bold">Central Platform</text>
  <text x="1036.4285" y="312.7568" text-anchor="middle" font-size="19.9527">Elasticsearch / Splunk</text>
  <text x="1036.4285" y="359.7838" text-anchor="middle" font-size="19.9527" fill="var(--text-muted)">CloudWatch / Grafana Loki</text>
</svg>
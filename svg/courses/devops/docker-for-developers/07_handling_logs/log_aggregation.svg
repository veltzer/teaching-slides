<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd3_06_handling_logs" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="37.926" y="48" width="151.7037" height="176" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="113.7778" y="121.6" text-anchor="middle" font-size="18.9629" font-weight="bold">Container</text>
  <text x="113.7778" y="169.6" text-anchor="middle" font-size="18.9629">A</text>
  <rect x="37.926" y="256" width="151.7037" height="176" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="113.7778" y="329.6" text-anchor="middle" font-size="18.9629" font-weight="bold">Container</text>
  <text x="113.7778" y="377.6" text-anchor="middle" font-size="18.9629">B</text>
  <rect x="37.926" y="464" width="151.7037" height="176" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="113.7778" y="537.6" text-anchor="middle" font-size="18.9629" font-weight="bold">Container</text>
  <text x="113.7778" y="585.6" text-anchor="middle" font-size="18.9629">C</text>
  <line x1="189.6296" y1="134.4" x2="356.5037" y2="320" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd3_06_handling_logs)" />
  <line x1="189.6296" y1="342.4" x2="356.5037" y2="320" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd3_06_handling_logs)" />
  <line x1="189.6296" y1="550.4" x2="356.5037" y2="320" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd3_06_handling_logs)" />
  <rect x="360.2963" y="192" width="265.4815" height="256" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="493.0371" y="272" text-anchor="middle" font-size="20.8593" font-weight="bold">Log Collector</text>
  <text x="493.0371" y="326.4" text-anchor="middle" font-size="18.9629">Fluentd / Logstash</text>
  <text x="493.0371" y="374.4" text-anchor="middle" font-size="18.9629" fill="var(--text-muted)">Filebeat</text>
  <line x1="625.7778" y1="320" x2="735.7629" y2="320" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd3_06_handling_logs)" />
  <rect x="739.5556" y="192" width="360.2963" height="256" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="919.7037" y="272" text-anchor="middle" font-size="20.8593" font-weight="bold">Central Platform</text>
  <text x="919.7037" y="326.4" text-anchor="middle" font-size="18.9629">Elasticsearch / Splunk</text>
  <text x="919.7037" y="374.4" text-anchor="middle" font-size="18.9629" fill="var(--text-muted)">CloudWatch / Grafana Loki</text>
</svg>
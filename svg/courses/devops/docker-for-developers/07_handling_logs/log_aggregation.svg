<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- PLACEHOLDERSVG — replace with real diagram -->
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="171.4286" height="172.4324" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="125.7142" y="112.1081" text-anchor="middle" font-size="19.9527" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Container</text>
  <text x="125.7142" y="159.1351" text-anchor="middle" font-size="19.9527" font-family="Arial, sans-serif" fill="var(--primary-text)">A</text>
  <rect x="40" y="243.7838" width="171.4286" height="172.4324" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="125.7142" y="315.8919" text-anchor="middle" font-size="19.9527" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Container</text>
  <text x="125.7142" y="362.9189" text-anchor="middle" font-size="19.9527" font-family="Arial, sans-serif" fill="var(--primary-text)">B</text>
  <rect x="40" y="447.5676" width="171.4286" height="172.4324" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="125.7142" y="519.6757" text-anchor="middle" font-size="19.9527" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Container</text>
  <text x="125.7142" y="566.7027" text-anchor="middle" font-size="19.9527" font-family="Arial, sans-serif" fill="var(--primary-text)">C</text>
  <line x1="211.4285" y1="124.6486" x2="399.9999" y2="306.4865" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="211.4285" y1="328.4324" x2="399.9999" y2="306.4865" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="211.4285" y1="532.2162" x2="399.9999" y2="306.4865" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="404.2856" y="181.0811" width="300" height="250.8108" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="554.2857" y="259.4595" text-anchor="middle" font-size="21.9481" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Log Collector</text>
  <text x="554.2857" y="312.7568" text-anchor="middle" font-size="19.9527" font-family="Arial, sans-serif" fill="var(--info-text)">Fluentd / Logstash</text>
  <text x="554.2857" y="359.7838" text-anchor="middle" font-size="19.9527" fill="var(--text-muted)" font-family="Arial, sans-serif">Filebeat</text>
  <line x1="704.2857" y1="306.4865" x2="828.5713" y2="306.4865" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="832.8571" y="181.0811" width="407.1429" height="250.8108" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1036.4285" y="259.4595" text-anchor="middle" font-size="21.9481" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Central Platform</text>
  <text x="1036.4285" y="312.7568" text-anchor="middle" font-size="19.9527" font-family="Arial, sans-serif" fill="var(--ok-text)">Elasticsearch / Splunk</text>
  <text x="1036.4285" y="359.7838" text-anchor="middle" font-size="19.9527" fill="var(--text-muted)" font-family="Arial, sans-serif">CloudWatch / Grafana Loki</text>
</svg>

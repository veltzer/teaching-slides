<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <ellipse cx="626.5552" cy="352.4373" rx="135.7537" ry="62.6555" fill="var(--info-fill)" stroke="var(--text)" stroke-width="4.1771" />
  <text x="626.5552" y="345.3886" text-anchor="middle" font-size="25.0622" fill="var(--bg)" font-weight="bold">App Logs</text>
  <text x="626.5552" y="398.2542" text-anchor="middle" font-size="20.8851" fill="var(--bg)">Best Practice</text>
  <ellipse cx="208.8517" cy="158.5968" rx="156.6388" ry="58.4785" fill="var(--primary-fill)" stroke="var(--text)" stroke-width="4.1771" />
  <text x="208.8517" y="148.0237" text-anchor="middle" font-size="22.9737">stdout</text>
  <text x="208.8517" y="200.8893" text-anchor="middle" font-size="20.8851" fill="var(--text-muted)">Normal output</text>
  <ellipse cx="1044.2587" cy="158.5968" rx="156.6388" ry="58.4785" fill="var(--danger-fill)" stroke="var(--text)" stroke-width="4.1771" />
  <text x="1044.2587" y="148.0237" text-anchor="middle" font-size="22.9737">stderr</text>
  <text x="1044.2587" y="200.8893" text-anchor="middle" font-size="20.8851" fill="var(--text-muted)">Error output</text>
  <ellipse cx="208.8517" cy="581.5215" rx="156.6388" ry="58.4785" fill="var(--ok-fill)" stroke="var(--text)" stroke-width="4.1771" />
  <text x="208.8517" y="570.9484" text-anchor="middle" font-size="22.9737">JSON format</text>
  <text x="208.8517" y="623.814" text-anchor="middle" font-size="20.8851" fill="var(--text-muted)">Structured logging</text>
  <ellipse cx="1044.2587" cy="581.5215" rx="156.6388" ry="58.4785" fill="var(--warn-fill)" stroke="var(--text)" stroke-width="4.1771" />
  <text x="1044.2587" y="570.9484" text-anchor="middle" font-size="22.9737">No file logging</text>
  <text x="1044.2587" y="623.814" text-anchor="middle" font-size="20.8851" fill="var(--text-muted)">Use stdout only</text>
  <line x1="511.6868" y1="274.9011" x2="344.6054" y2="211.4624" stroke="var(--text)" stroke-width="2" />
  <line x1="741.4236" y1="274.9011" x2="908.505" y2="211.4624" stroke="var(--text)" stroke-width="2" />
  <line x1="511.6868" y1="429.9735" x2="344.6054" y2="521.6072" stroke="var(--text)" stroke-width="2" />
  <line x1="741.4236" y1="429.9735" x2="908.505" y2="521.6072" stroke="var(--text)" stroke-width="2" />
</svg>
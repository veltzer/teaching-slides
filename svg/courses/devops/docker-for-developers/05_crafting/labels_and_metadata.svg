<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <ellipse cx="640" cy="311.0687" rx="141.8183" ry="67.3114" fill="var(--info-fill)" stroke="var(--text)" stroke-width="4.1771" />
  <text x="640" y="303.4962" text-anchor="middle" font-size="26.5506" fill="var(--bg)" font-weight="bold">LABEL</text>
  <text x="640" y="360.2902" text-anchor="middle" font-size="22.1254" fill="var(--bg)">Metadata</text>
  <ellipse cx="203.6364" cy="102.824" rx="163.6364" ry="62.824" fill="var(--primary-fill)" stroke="var(--text)" stroke-width="4.1771" />
  <text x="203.6364" y="91.4652" text-anchor="middle" font-size="22.1254">maintainer</text>
  <text x="203.6364" y="148.2592" text-anchor="middle" font-size="22.1254" fill="var(--text-muted)">"team@co.com"</text>
  <ellipse cx="1076.3636" cy="102.824" rx="163.6364" ry="62.824" fill="var(--info-fill)" stroke="var(--text)" stroke-width="4.1771" />
  <text x="1076.3636" y="91.4652" text-anchor="middle" font-size="22.1254">version</text>
  <text x="1076.3636" y="148.2592" text-anchor="middle" font-size="22.1254" fill="var(--text-muted)">"1.0.0"</text>
  <ellipse cx="203.6364" cy="557.176" rx="163.6364" ry="62.824" fill="var(--ok-fill)" stroke="var(--text)" stroke-width="4.1771" />
  <text x="203.6364" y="545.8172" text-anchor="middle" font-size="22.1254">description</text>
  <text x="203.6364" y="602.6112" text-anchor="middle" font-size="22.1254" fill="var(--text-muted)">"My web app"</text>
  <ellipse cx="1076.3636" cy="557.176" rx="163.6364" ry="62.824" fill="var(--warn-fill)" stroke="var(--text)" stroke-width="4.1771" />
  <text x="1076.3636" y="545.8172" text-anchor="middle" font-size="22.1254">org.opencontainers</text>
  <text x="1076.3636" y="602.6112" text-anchor="middle" font-size="22.1254" fill="var(--text-muted)">OCI standard labels</text>
  <line x1="520.0001" y1="227.7708" x2="345.4546" y2="159.618" stroke="var(--text)" stroke-width="2" />
  <line x1="759.9999" y1="227.7708" x2="934.5454" y2="159.618" stroke="var(--text)" stroke-width="2" />
  <line x1="520.0001" y1="394.3666" x2="345.4546" y2="492.8095" stroke="var(--text)" stroke-width="2" />
  <line x1="759.9999" y1="394.3666" x2="934.5454" y2="492.8095" stroke="var(--text)" stroke-width="2" />
</svg>
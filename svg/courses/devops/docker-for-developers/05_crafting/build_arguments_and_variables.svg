  <ns0:rect x="42.14" y="53.3333" width="358.1893" height="284.4444" fill="#e3f2fd" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="221.2346" y="135.1111" text-anchor="middle" font-size="23.177" font-weight="bold">ARG (Build-time)</ns0:text>
  <ns0:text x="221.2346" y="195.5556" text-anchor="middle" font-size="21.0699">--build-arg VER=1.0</ns0:text>
  <ns0:text x="221.2346" y="256" text-anchor="middle" font-size="21.0699" fill="#555">Available in Dockerfile</ns0:text>
  <ns0:text x="221.2346" y="309.3333" text-anchor="middle" font-size="21.0699" fill="#555">Not in final image</ns0:text>
  <ns0:rect x="453.0041" y="53.3333" width="358.1893" height="284.4444" fill="#f3e5f5" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="632.0988" y="135.1111" text-anchor="middle" font-size="23.177" font-weight="bold">ENV (Runtime)</ns0:text>
  <ns0:text x="632.0988" y="195.5556" text-anchor="middle" font-size="21.0699">ENV APP_ENV=prod</ns0:text>
  <ns0:text x="632.0988" y="256" text-anchor="middle" font-size="21.0699" fill="#555">Persists in image</ns0:text>
  <ns0:text x="632.0988" y="309.3333" text-anchor="middle" font-size="21.0699" fill="#555">Overridable: -e flag</ns0:text>
  <ns0:line x1="400.3292" y1="195.5556" x2="448.7901" y2="195.5556" stroke="#333" stroke-width="4.214" marker-end="url(#arrowd4_04_crafting)" />
  <ns0:text x="425.6131" y="170.6667" text-anchor="middle" font-size="21.0699" fill="#666">set</ns0:text>
  <ns0:rect x="863.8683" y="53.3333" width="358.1893" height="284.4444" fill="#e8f5e9" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="1042.963" y="135.1111" text-anchor="middle" font-size="23.177" font-weight="bold">ARG + ENV</ns0:text>
  <ns0:text x="1042.963" y="195.5556" text-anchor="middle" font-size="21.0699">ARG VERSION</ns0:text>
  <ns0:text x="1042.963" y="256" text-anchor="middle" font-size="21.0699">ENV VER=$VERSION</ns0:text>
  <ns0:text x="1042.963" y="309.3333" text-anchor="middle" font-size="21.0699" fill="#555">Promotes to runtime</ns0:text>
  <ns0:rect x="42.14" y="408.8889" width="1179.9177" height="231.1111" fill="#f9f9f9" stroke="#999" stroke-width="2.107" rx="10.535" stroke-dasharray="8.428 6.321" />
  <ns0:text x="632.0988" y="490.6667" text-anchor="middle" font-size="21.0699" fill="#555">Build: docker build --build-arg VERSION=2.0 .</ns0:text>
  <ns0:text x="632.0988" y="551.1111" text-anchor="middle" font-size="21.0699" fill="#555">Run:   docker run -e APP_ENV=staging myapp</ns0:text>
  <ns0:text x="632.0988" y="611.5556" text-anchor="middle" font-size="21.0699" fill="#c62828">Warning: ARG values visible in image history - never use for secrets</ns0:text>
</ns0:svg>
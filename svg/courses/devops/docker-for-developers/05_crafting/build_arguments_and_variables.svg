<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrowd4_04_crafting" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="42.6667" y="54" width="362.6667" height="288" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="224" y="136.8" text-anchor="middle" font-size="23.4667" font-weight="bold">ARG (Build-time)</text>
  <text x="224" y="198" text-anchor="middle" font-size="21.3333">--build-arg VER=1.0</text>
  <text x="224" y="259.2" text-anchor="middle" font-size="21.3333" fill="#555">Available in Dockerfile</text>
  <text x="224" y="313.2" text-anchor="middle" font-size="21.3333" fill="#555">Not in final image</text>
  <rect x="458.6667" y="54" width="362.6667" height="288" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="136.8" text-anchor="middle" font-size="23.4667" font-weight="bold">ENV (Runtime)</text>
  <text x="640" y="198" text-anchor="middle" font-size="21.3333">ENV APP_ENV=prod</text>
  <text x="640" y="259.2" text-anchor="middle" font-size="21.3333" fill="#555">Persists in image</text>
  <text x="640" y="313.2" text-anchor="middle" font-size="21.3333" fill="#555">Overridable: -e flag</text>
  <line x1="405.3333" y1="198" x2="454.4" y2="198" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowd4_04_crafting)" />
  <text x="430.9333" y="172.8" text-anchor="middle" font-size="21.3333" fill="#666">set</text>
  <rect x="874.6667" y="54" width="362.6667" height="288" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1056" y="136.8" text-anchor="middle" font-size="23.4667" font-weight="bold">ARG + ENV</text>
  <text x="1056" y="198" text-anchor="middle" font-size="21.3333">ARG VERSION</text>
  <text x="1056" y="259.2" text-anchor="middle" font-size="21.3333">ENV VER=$VERSION</text>
  <text x="1056" y="313.2" text-anchor="middle" font-size="21.3333" fill="#555">Promotes to runtime</text>
  <rect x="42.6667" y="414" width="1194.6667" height="234" fill="#f9f9f9" stroke="#999" stroke-width="2.1333" rx="10.6667" stroke-dasharray="8.5333 6.4" />
  <text x="640" y="496.8" text-anchor="middle" font-size="21.3333" fill="#555">Build: docker build --build-arg VERSION=2.0 .</text>
  <text x="640" y="558" text-anchor="middle" font-size="21.3333" fill="#555">Run:   docker run -e APP_ENV=staging myapp</text>
  <text x="640" y="619.2" text-anchor="middle" font-size="21.3333" fill="#c62828">Warning: ARG values visible in image history - never use for secrets</text>

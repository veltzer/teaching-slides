<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd4_04_crafting" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="40" y="40" width="364.2857" height="281.2121" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="222.1428" y="120.8485" text-anchor="middle" font-size="23.2402" font-weight="bold">ARG (Build-time)</text>
  <text x="222.1428" y="180.6061" text-anchor="middle" font-size="21.1274">--build-arg VER=1.0</text>
  <text x="222.1428" y="240.3637" text-anchor="middle" font-size="21.1274" fill="var(--text-muted)">Available in Dockerfile</text>
  <text x="222.1428" y="293.0909" text-anchor="middle" font-size="21.1274" fill="var(--text-muted)">Not in final image</text>
  <rect x="457.857" y="40" width="364.2857" height="281.2121" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="639.9999" y="120.8485" text-anchor="middle" font-size="23.2402" font-weight="bold">ENV (Runtime)</text>
  <text x="639.9999" y="180.6061" text-anchor="middle" font-size="21.1274">ENV APP_ENV=prod</text>
  <text x="639.9999" y="240.3637" text-anchor="middle" font-size="21.1274" fill="var(--text-muted)">Persists in image</text>
  <text x="639.9999" y="293.0909" text-anchor="middle" font-size="21.1274" fill="var(--text-muted)">Overridable: -e flag</text>
  <line x1="404.2856" y1="180.6061" x2="453.5713" y2="180.6061" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd4_04_crafting)" />
  <text x="429.9998" y="156.0001" text-anchor="middle" font-size="21.1274" fill="var(--text-muted)">set</text>
  <rect x="875.7142" y="40" width="364.2857" height="281.2121" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1057.8571" y="120.8485" text-anchor="middle" font-size="23.2402" font-weight="bold">ARG + ENV</text>
  <text x="1057.8571" y="180.6061" text-anchor="middle" font-size="21.1274">ARG VERSION</text>
  <text x="1057.8571" y="240.3637" text-anchor="middle" font-size="21.1274">ENV VER=$VERSION</text>
  <text x="1057.8571" y="293.0909" text-anchor="middle" font-size="21.1274" fill="var(--text-muted)">Promotes to runtime</text>
  <rect x="40" y="391.5152" width="1200" height="228.4848" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" stroke-dasharray="8.428 6.321" />
  <text x="639.9999" y="472.3637" text-anchor="middle" font-size="21.1274" fill="var(--text-muted)">Build: docker build --build-arg VERSION=2.0 .</text>
  <text x="639.9999" y="532.1212" text-anchor="middle" font-size="21.1274" fill="var(--text-muted)">Run:   docker run -e APP_ENV=staging myapp</text>
  <text x="639.9999" y="591.8788" text-anchor="middle" font-size="21.1274" fill="var(--danger-accent)">Warning: ARG values visible in image history - never use for secrets</text>
</svg>
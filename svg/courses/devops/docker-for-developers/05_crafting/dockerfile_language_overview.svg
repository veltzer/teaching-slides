<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <ellipse cx="640" cy="311.0687" rx="155.5555" ry="78.53" fill="var(--info-fill)" stroke="var(--text)" stroke-width="4.1771" />
  <text x="640" y="303.4962" text-anchor="middle" font-size="26.7953" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Dockerfile</text>
  <text x="640" y="360.2902" text-anchor="middle" font-size="22.3293" fill="var(--bg)" font-family="Arial, sans-serif">Language</text>
  <ellipse cx="195.5555" cy="102.824" rx="155.5555" ry="62.824" fill="var(--primary-fill)" stroke="var(--text)" stroke-width="4.1771" />
  <text x="195.5555" y="91.4652" text-anchor="middle" font-size="24.5624" font-family="Arial, sans-serif" fill="var(--text)">Build</text>
  <text x="195.5555" y="148.2592" text-anchor="middle" font-size="22.3293" font-family="Arial, sans-serif" fill="var(--text)">FROM, RUN, COPY</text>
  <ellipse cx="1084.4445" cy="102.824" rx="155.5555" ry="62.824" fill="var(--info-fill)" stroke="var(--text)" stroke-width="4.1771" />
  <text x="1084.4445" y="91.4652" text-anchor="middle" font-size="24.5624" font-family="Arial, sans-serif" fill="var(--text)">Configure</text>
  <text x="1084.4445" y="148.2592" text-anchor="middle" font-size="22.3293" font-family="Arial, sans-serif" fill="var(--text)">ENV, ARG, EXPOSE</text>
  <ellipse cx="195.5555" cy="557.176" rx="155.5555" ry="62.824" fill="var(--ok-fill)" stroke="var(--text)" stroke-width="4.1771" />
  <text x="195.5555" y="545.8172" text-anchor="middle" font-size="24.5624" font-family="Arial, sans-serif" fill="var(--text)">Execute</text>
  <text x="195.5555" y="602.6112" text-anchor="middle" font-size="22.3293" font-family="Arial, sans-serif" fill="var(--text)">CMD, ENTRYPOINT</text>
  <ellipse cx="1084.4445" cy="557.176" rx="155.5555" ry="62.824" fill="var(--warn-fill)" stroke="var(--text)" stroke-width="4.1771" />
  <text x="1084.4445" y="545.8172" text-anchor="middle" font-size="24.5624" font-family="Arial, sans-serif" fill="var(--text)">Metadata</text>
  <text x="1084.4445" y="602.6112" text-anchor="middle" font-size="22.3293" font-family="Arial, sans-serif" fill="var(--text)">LABEL, USER</text>
  <line x1="506.6667" y1="227.7708" x2="328.8888" y2="167.1905" stroke="var(--text)" stroke-width="2" />
  <line x1="773.3333" y1="227.7708" x2="951.1112" y2="167.1905" stroke="var(--text)" stroke-width="2" />
  <line x1="506.6667" y1="394.3666" x2="328.8888" y2="492.8095" stroke="var(--text)" stroke-width="2" />
  <line x1="773.3333" y1="394.3666" x2="951.1112" y2="492.8095" stroke="var(--text)" stroke-width="2" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="364.2857" height="253.75" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="222.1428" y="119.75" text-anchor="middle" font-size="23.6006" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Do</text>
  <text x="222.1428" y="177.75" text-anchor="middle" font-size="21.455" font-family="Arial, sans-serif" fill="var(--ok-text)">Use specific base tags</text>
  <text x="222.1428" y="232.1251" text-anchor="middle" font-size="21.455" font-family="Arial, sans-serif" fill="var(--ok-text)">Combine RUN commands</text>
  <line x1="404.2856" y1="166.8751" x2="464.2857" y2="166.8751" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="468.5714" y="40" width="342.8571" height="253.75" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="119.75" text-anchor="middle" font-size="23.6006" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Do</text>
  <text x="640" y="177.75" text-anchor="middle" font-size="21.455" font-family="Arial, sans-serif" fill="var(--ok-text)">Clean cache in same RUN</text>
  <text x="640" y="232.1251" text-anchor="middle" font-size="21.455" font-family="Arial, sans-serif" fill="var(--ok-text)">Use .dockerignore</text>
  <line x1="811.4286" y1="166.8751" x2="892.857" y2="166.8751" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="897.1429" y="40" width="342.8571" height="253.75" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1068.5715" y="119.75" text-anchor="middle" font-size="23.6006" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Do</text>
  <text x="1068.5715" y="177.75" text-anchor="middle" font-size="21.455" font-family="Arial, sans-serif" fill="var(--ok-text)">Non-root USER</text>
  <text x="1068.5715" y="232.1251" text-anchor="middle" font-size="21.455" font-family="Arial, sans-serif" fill="var(--ok-text)">Multi-stage builds</text>
  <rect x="40" y="366.25" width="578.5715" height="253.75" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="329.2857" y="446" text-anchor="middle" font-size="23.6006" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Avoid</text>
  <text x="329.2857" y="504" text-anchor="middle" font-size="21.455" font-family="Arial, sans-serif" fill="var(--danger-text)">Secrets in ENV/ARG</text>
  <text x="329.2857" y="558.375" text-anchor="middle" font-size="21.455" font-family="Arial, sans-serif" fill="var(--danger-text)">Running as root in production</text>
  <rect x="661.4285" y="366.25" width="578.5715" height="253.75" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="950.7142" y="446" text-anchor="middle" font-size="23.6006" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Avoid</text>
  <text x="950.7142" y="504" text-anchor="middle" font-size="21.455" font-family="Arial, sans-serif" fill="var(--danger-text)">Using :latest tag in production</text>
  <text x="950.7142" y="558.375" text-anchor="middle" font-size="21.455" font-family="Arial, sans-serif" fill="var(--danger-text)">Unnecessary packages in image</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd5_04_crafting" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="42.14" y="71.1111" width="358.1893" height="248.8889" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="221.2346" y="149.3333" text-anchor="middle" font-size="23.177" font-weight="bold" fill="var(--ok-accent)">Do</text>
  <text x="221.2346" y="206.2222" text-anchor="middle" font-size="21.0699">Use specific base tags</text>
  <text x="221.2346" y="259.5556" text-anchor="middle" font-size="21.0699">Combine RUN commands</text>
  <line x1="400.3292" y1="195.5556" x2="459.3251" y2="195.5556" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd5_04_crafting)" />
  <rect x="463.5391" y="71.1111" width="337.1193" height="248.8889" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="632.0988" y="149.3333" text-anchor="middle" font-size="23.177" font-weight="bold" fill="var(--ok-accent)">Do</text>
  <text x="632.0988" y="206.2222" text-anchor="middle" font-size="21.0699">Clean cache in same RUN</text>
  <text x="632.0988" y="259.5556" text-anchor="middle" font-size="21.0699">Use .dockerignore</text>
  <line x1="800.6585" y1="195.5556" x2="880.7242" y2="195.5556" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd5_04_crafting)" />
  <rect x="884.9383" y="71.1111" width="337.1193" height="248.8889" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1053.498" y="149.3333" text-anchor="middle" font-size="23.177" font-weight="bold" fill="var(--ok-accent)">Do</text>
  <text x="1053.498" y="206.2222" text-anchor="middle" font-size="21.0699">Non-root USER</text>
  <text x="1053.498" y="259.5556" text-anchor="middle" font-size="21.0699">Multi-stage builds</text>
  <rect x="42.14" y="391.1111" width="568.8889" height="248.8889" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="326.5844" y="469.3333" text-anchor="middle" font-size="23.177" font-weight="bold" fill="var(--danger-accent)">Avoid</text>
  <text x="326.5844" y="526.2222" text-anchor="middle" font-size="21.0699">Secrets in ENV/ARG</text>
  <text x="326.5844" y="579.5556" text-anchor="middle" font-size="21.0699">Running as root in production</text>
  <rect x="653.1687" y="391.1111" width="568.8889" height="248.8889" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="937.6131" y="469.3333" text-anchor="middle" font-size="23.177" font-weight="bold" fill="var(--danger-accent)">Avoid</text>
  <text x="937.6131" y="526.2222" text-anchor="middle" font-size="21.0699">Using :latest tag in production</text>
  <text x="937.6131" y="579.5556" text-anchor="middle" font-size="21.0699">Unnecessary packages in image</text>
</svg>
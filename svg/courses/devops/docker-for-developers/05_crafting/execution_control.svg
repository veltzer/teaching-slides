<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd2_04_crafting" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="40" y="40" width="364.2857" height="246.0606" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="222.1429" y="127.8788" text-anchor="middle" font-size="23.2402" font-weight="bold">ENTRYPOINT</text>
  <text x="222.1429" y="187.6364" text-anchor="middle" font-size="21.1274">Fixed executable</text>
  <text x="222.1429" y="240.3637" text-anchor="middle" font-size="21.1274" fill="var(--text-muted)">["nginx", "-g"]</text>
  <rect x="457.8572" y="40" width="364.2857" height="246.0606" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="127.8788" text-anchor="middle" font-size="23.2402" font-weight="bold">CMD</text>
  <text x="640" y="187.6364" text-anchor="middle" font-size="21.1274">Default arguments</text>
  <text x="640" y="240.3637" text-anchor="middle" font-size="21.1274" fill="var(--text-muted)">["daemon off;"]</text>
  <line x1="404.2857" y1="163.0303" x2="453.5715" y2="163.0303" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd2_04_crafting)" />
  <text x="640" y="363.394" text-anchor="middle" font-size="21.1274" fill="var(--text-muted)">Combined at runtime:</text>
  <rect x="457.8572" y="391.5151" width="364.2857" height="105.4546" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="461.8182" text-anchor="middle" font-size="21.1274">nginx -g "daemon off;"</text>
  <rect x="897.1429" y="40" width="342.8571" height="246.0606" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1068.5715" y="127.8788" text-anchor="middle" font-size="23.2402" font-weight="bold">RUN</text>
  <text x="1068.5715" y="187.6364" text-anchor="middle" font-size="21.1274">Build-time only</text>
  <text x="1068.5715" y="240.3637" text-anchor="middle" font-size="21.1274" fill="var(--text-muted)">Creates layers</text>
  <rect x="40" y="391.5151" width="364.2857" height="228.4849" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" stroke-dasharray="8.2002 6.1502" filter="url(#shadow)"/>
  <text x="222.1429" y="468.8484" text-anchor="middle" font-size="21.1274" fill="var(--text-muted)">CMD is overridden by</text>
  <text x="222.1429" y="521.5757" text-anchor="middle" font-size="21.1274" fill="var(--text-muted)">docker run args;</text>
  <text x="222.1429" y="574.303" text-anchor="middle" font-size="21.1274" fill="var(--text-muted)">ENTRYPOINT is not</text>
</svg>
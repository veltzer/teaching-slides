  <ns0:line x1="389.5095" y1="190.2703" x2="436.6607" y2="190.2703" stroke="#333" stroke-width="4.1001" marker-end="url(#arrowd2_04_crafting)" />
  <ns0:text x="615.015" y="387.4595" text-anchor="middle" font-size="20.5005" fill="#666">Combined at runtime:</ns0:text>

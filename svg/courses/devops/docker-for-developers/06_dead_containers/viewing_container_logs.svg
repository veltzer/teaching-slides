<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd2_05_dead_containers" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="41.001" y="172.973" width="287.007" height="242.1622" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="184.5045" y="259.4595" text-anchor="middle" font-size="22.5506" font-weight="bold">Dead Container</text>
  <text x="184.5045" y="328.6486" text-anchor="middle" font-size="20.5005" fill="var(--text-muted)">Exited / Failed</text>
  <line x1="328.008" y1="294.0541" x2="446.9109" y2="294.0541" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd2_05_dead_containers)" />
  <text x="389.5095" y="266.3784" text-anchor="middle" font-size="20.5005" fill="var(--text-muted)">inspect</text>
  <rect x="451.011" y="138.3784" width="328.008" height="311.3514" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="615.015" y="214.4865" text-anchor="middle" font-size="22.5506" font-weight="bold">docker logs</text>
  <text x="615.015" y="276.7568" text-anchor="middle" font-size="20.5005">docker logs &lt;id&gt;</text>
  <text x="615.015" y="328.6486" text-anchor="middle" font-size="20.5005">--tail 100</text>
  <text x="615.015" y="380.5405" text-anchor="middle" font-size="20.5005">--since 1h</text>
  <line x1="779.0191" y1="294.0541" x2="877.4215" y2="294.0541" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd2_05_dead_containers)" />
  <text x="828.2203" y="266.3784" text-anchor="middle" font-size="20.5005" fill="var(--text-muted)">analyze</text>
  <rect x="881.5215" y="172.973" width="307.5075" height="242.1622" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1035.2752" y="259.4595" text-anchor="middle" font-size="22.5506" font-weight="bold">Root Cause</text>
  <text x="1035.2752" y="328.6486" text-anchor="middle" font-size="20.5005" fill="var(--text-muted)">Error messages</text>
  <text x="1035.2752" y="380.5405" text-anchor="middle" font-size="20.5005" fill="var(--text-muted)">Stack traces</text>
  <rect x="41.001" y="518.9189" width="1148.0281" height="121.0811" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" stroke-dasharray="8.2002 6.1502" />
  <text x="615.015" y="595.027" text-anchor="middle" font-size="20.5005" fill="var(--text-muted)">Logs persist even after container stops - always check logs first</text>
</svg>
  <ns0:text x="1035.2752" y="259.4595" text-anchor="middle" font-size="22.5506" font-weight="bold">Root Cause</ns0:text>
  <ns0:text x="1035.2752" y="328.6486" text-anchor="middle" font-size="20.5005" fill="#555">Error messages</ns0:text>
  <ns0:text x="1035.2752" y="380.5405" text-anchor="middle" font-size="20.5005" fill="#555">Stack traces</ns0:text>

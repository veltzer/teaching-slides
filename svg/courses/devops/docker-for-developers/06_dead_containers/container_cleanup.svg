  <ns0:text x="1074.5679" y="220.4444" text-anchor="middle" font-size="23.177" font-weight="bold">Bulk Cleanup</ns0:text>
  <ns0:text x="1074.5679" y="284.4444" text-anchor="middle" font-size="21.0699">docker container</ns0:text>
  <ns0:text x="1074.5679" y="330.6667" text-anchor="middle" font-size="21.0699">prune</ns0:text>
  <ns0:rect x="42.14" y="462.2222" width="1179.9177" height="177.7778" fill="#f9f9f9" stroke="#999" stroke-width="2.107" rx="10.535" stroke-dasharray="8.428 6.321" />
  <ns0:text x="632.0988" y="533.3333" text-anchor="middle" font-size="21.0699" fill="#555">docker system prune: removes all stopped containers, unused networks,</ns0:text>
  <ns0:text x="632.0988" y="593.7778" text-anchor="middle" font-size="21.0699" fill="#555">dangling images, and build cache. Use -a to also remove unused images.</ns0:text>

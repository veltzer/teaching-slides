<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arrowd6_05_dead_containers" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <ns0:path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect x="42.14" y="142.2222" width="294.9795" height="213.3333" fill="#ffebee" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="189.6296" y="220.4444" text-anchor="middle" font-size="23.177" font-weight="bold">Dead Containers</ns0:text>
  <ns0:text x="189.6296" y="284.4444" text-anchor="middle" font-size="21.0699" fill="#555">docker ps -a -f</ns0:text>
  <ns0:text x="189.6296" y="330.6667" text-anchor="middle" font-size="21.0699" fill="#555">status=exited</ns0:text>
  <ns0:line x1="337.1193" y1="248.8889" x2="459.3251" y2="248.8889" stroke="#333" stroke-width="4.214" marker-end="url(#arrowd6_05_dead_containers)" />
  <ns0:rect x="463.5391" y="142.2222" width="337.1193" height="213.3333" fill="#fff3e0" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="632.0988" y="220.4444" text-anchor="middle" font-size="23.177" font-weight="bold">Selective Remove</ns0:text>
  <ns0:text x="632.0988" y="284.4444" text-anchor="middle" font-size="21.0699">docker rm &lt;id&gt;</ns0:text>
  <ns0:text x="632.0988" y="330.6667" text-anchor="middle" font-size="21.0699" fill="#555">one at a time</ns0:text>
  <ns0:line x1="800.6585" y1="248.8889" x2="922.8642" y2="248.8889" stroke="#333" stroke-width="4.214" marker-end="url(#arrowd6_05_dead_containers)" />
  <ns0:rect x="927.0782" y="142.2222" width="294.9795" height="213.3333" fill="#e8f5e9" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="1074.5679" y="220.4444" text-anchor="middle" font-size="23.177" font-weight="bold">Bulk Cleanup</ns0:text>
  <ns0:text x="1074.5679" y="284.4444" text-anchor="middle" font-size="21.0699">docker container</ns0:text>
  <ns0:text x="1074.5679" y="330.6667" text-anchor="middle" font-size="21.0699">prune</ns0:text>
  <ns0:rect x="42.14" y="462.2222" width="1179.9177" height="177.7778" fill="#f9f9f9" stroke="#999" stroke-width="2.107" rx="10.535" stroke-dasharray="8.428 6.321" />
  <ns0:text x="632.0988" y="533.3333" text-anchor="middle" font-size="21.0699" fill="#555">docker system prune: removes all stopped containers, unused networks,</ns0:text>
  <ns0:text x="632.0988" y="593.7778" text-anchor="middle" font-size="21.0699" fill="#555">dangling images, and build cache. Use -a to also remove unused images.</ns0:text>
</ns0:svg>
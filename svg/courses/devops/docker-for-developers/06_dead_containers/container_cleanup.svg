<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrowd6_05_dead_containers" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="42.6667" y="144" width="298.6667" height="216" fill="#ffebee" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="192" y="223.2" text-anchor="middle" font-size="23.4667" font-weight="bold">Dead Containers</text>
  <text x="192" y="288" text-anchor="middle" font-size="21.3333" fill="#555">docker ps -a -f</text>
  <text x="192" y="334.8" text-anchor="middle" font-size="21.3333" fill="#555">status=exited</text>
  <line x1="341.3333" y1="252" x2="465.0667" y2="252" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowd6_05_dead_containers)" />
  <rect x="469.3333" y="144" width="341.3333" height="216" fill="#fff3e0" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="223.2" text-anchor="middle" font-size="23.4667" font-weight="bold">Selective Remove</text>
  <text x="640" y="288" text-anchor="middle" font-size="21.3333">docker rm &lt;id&gt;</text>
  <text x="640" y="334.8" text-anchor="middle" font-size="21.3333" fill="#555">one at a time</text>
  <line x1="810.6667" y1="252" x2="934.4" y2="252" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowd6_05_dead_containers)" />
  <rect x="938.6667" y="144" width="298.6667" height="216" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1088" y="223.2" text-anchor="middle" font-size="23.4667" font-weight="bold">Bulk Cleanup</text>
  <text x="1088" y="288" text-anchor="middle" font-size="21.3333">docker container</text>
  <text x="1088" y="334.8" text-anchor="middle" font-size="21.3333">prune</text>
  <rect x="42.6667" y="468" width="1194.6667" height="180" fill="#f9f9f9" stroke="#999" stroke-width="2.1333" rx="10.6667" stroke-dasharray="8.5333 6.4" />
  <text x="640" y="540" text-anchor="middle" font-size="21.3333" fill="#555">docker system prune: removes all stopped containers, unused networks,</text>
  <text x="640" y="601.2" text-anchor="middle" font-size="21.3333" fill="#555">dangling images, and build cache. Use -a to also remove unused images.</text>
</svg>
  <rect x="230.7692" y="185.4231" width="129.2308" height="96.9231" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.4615" rx="6" />
  <text x="295.3845" y="246" text-anchor="middle" font-size="15.7948">Running</text>
  <rect x="403.0769" y="185.4231" width="129.2308" height="96.9231" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.4615" rx="6" />
  <text x="467.6923" y="246" text-anchor="middle" font-size="15.7948">Paused</text>
  <rect x="575.3846" y="185.4231" width="129.2308" height="96.9231" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="1.4615" rx="6" />
  <text x="640" y="246" text-anchor="middle" font-size="15.7948">Stopped</text>
  <rect x="747.6924" y="185.4231" width="129.2308" height="96.9231" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.4615" rx="6" />
  <text x="812.3077" y="246" text-anchor="middle" font-size="15.7948">Dead</text>
  <line x1="187.6923" y1="233.8845" x2="227.8974" y2="233.8845" stroke="var(--text)" stroke-width="1.068" marker-end="url(#arrow_lifecycle)" />
  <line x1="360" y1="233.8845" x2="400.2051" y2="233.8845" stroke="var(--text)" stroke-width="1.068" marker-end="url(#arrow_lifecycle)" />
  <line x1="532.3077" y1="233.8845" x2="572.5128" y2="233.8845" stroke="var(--text)" stroke-width="1.068" marker-end="url(#arrow_lifecycle)" />
  <line x1="704.6154" y1="233.8845" x2="744.8205" y2="233.8845" stroke="var(--text)" stroke-width="1.068" marker-end="url(#arrow_lifecycle)" />
  <path d="M 467.6923 282.3462 Q 467.6923 367.1538 295.3845 367.1538 Q 230.7692 367.1538 230.7692 282.3462" stroke="var(--text)" stroke-width="1.2063" fill="none" marker-end="url(#arrow_lifecycle)" />
  <text x="352.8205" y="398.6539" text-anchor="middle" font-size="14.359" fill="var(--text-muted)">unpause</text>
  <path d="M 640 282.3462 Q 640 100.6154 295.3845 100.6154 Q 230.7692 100.6154 230.7692 180.577" stroke="var(--ok-border)" stroke-width="1.2063" fill="none" marker-end="url(#arrow_lifecycle)" />
  <text x="460.5128" y="83.6539" text-anchor="middle" font-size="14.359" fill="var(--ok-accent)">docker start (restart)</text>
</svg>
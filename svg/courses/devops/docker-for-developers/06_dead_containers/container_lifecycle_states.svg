<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow_lifecycle" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="80" y="253.7368" width="176.8421" height="132.6316" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="7.8289" />
  <text x="168.421" y="336.6316" text-anchor="middle" font-size="21.614">Created</text>
  <rect x="315.7894" y="253.7368" width="176.8421" height="132.6316" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.8289" />
  <text x="404.2104" y="336.6316" text-anchor="middle" font-size="21.614">Running</text>
  <rect x="551.5789" y="253.7368" width="176.8421" height="132.6316" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="7.8289" />
  <text x="639.9999" y="336.6316" text-anchor="middle" font-size="21.614">Paused</text>
  <rect x="787.3684" y="253.7368" width="176.8421" height="132.6316" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="7.8289" />
  <text x="875.7894" y="336.6316" text-anchor="middle" font-size="21.614">Stopped</text>
  <rect x="1023.1579" y="253.7368" width="176.8421" height="132.6316" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="7.8289" />
  <text x="1111.579" y="336.6316" text-anchor="middle" font-size="21.614">Dead</text>
  <line x1="256.8421" y1="320.0526" x2="311.8596" y2="320.0526" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_lifecycle)" />
  <line x1="492.6316" y1="320.0526" x2="547.649" y2="320.0526" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_lifecycle)" />
  <line x1="728.421" y1="320.0526" x2="783.4385" y2="320.0526" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_lifecycle)" />
  <line x1="964.2105" y1="320.0526" x2="1019.228" y2="320.0526" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_lifecycle)" />
  <path d="M 639.9999 386.3685 Q 639.9999 502.421 404.2104 502.421 Q 315.7894 502.421 315.7894 386.3685" stroke="var(--text)" stroke-width="2.2588" fill="none" marker-end="url(#arrow_lifecycle)" />
  <text x="482.8069" y="545.5263" text-anchor="middle" font-size="19.6491" fill="var(--text-muted)">unpause</text>
  <path d="M 875.7894 386.3685 Q 875.7894 137.6842 404.2104 137.6842 Q 315.7894 137.6842 315.7894 247.1053" stroke="var(--ok-border)" stroke-width="2.2588" fill="none" marker-end="url(#arrow_lifecycle)" />
  <text x="630.1754" y="114.4737" text-anchor="middle" font-size="19.6491" fill="var(--ok-accent)">docker start (restart)</text>
</svg>
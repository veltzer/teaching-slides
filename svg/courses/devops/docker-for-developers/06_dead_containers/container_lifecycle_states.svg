<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <rect x="40" y="227.3846" width="189.4737" height="178.4616" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="134.737" y="338.923" text-anchor="middle" font-size="25.9516" font-family="Arial, sans-serif" fill="var(--primary-text)">Created</text>
  <rect x="292.6315" y="227.3846" width="189.4737" height="178.4616" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="387.3682" y="338.923" text-anchor="middle" font-size="25.9516" font-family="Arial, sans-serif" fill="var(--ok-text)">Running</text>
  <rect x="545.2631" y="227.3846" width="189.4737" height="178.4616" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="338.923" text-anchor="middle" font-size="25.9516" font-family="Arial, sans-serif" fill="var(--warn-text)">Paused</text>
  <rect x="797.8946" y="227.3846" width="189.4737" height="178.4616" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="892.6315" y="338.923" text-anchor="middle" font-size="25.9516" font-family="Arial, sans-serif" fill="var(--info-text)">Stopped</text>
  <rect x="1050.5263" y="227.3846" width="189.4737" height="178.4616" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1145.263" y="338.923" text-anchor="middle" font-size="25.9516" font-family="Arial, sans-serif" fill="var(--danger-text)">Dead</text>
  <line x1="229.4737" y1="316.6151" x2="288.421" y2="316.6151" stroke="var(--text)" stroke-width="1.068" marker-end="url(#arrow)" />
  <line x1="482.1052" y1="316.6151" x2="541.0525" y2="316.6151" stroke="var(--text)" stroke-width="1.068" marker-end="url(#arrow)" />
  <line x1="734.7368" y1="316.6151" x2="793.6841" y2="316.6151" stroke="var(--text)" stroke-width="1.068" marker-end="url(#arrow)" />
  <line x1="987.3683" y1="316.6151" x2="1046.3156" y2="316.6151" stroke="var(--text)" stroke-width="1.068" marker-end="url(#arrow)" />
  <path d="M 639.9999 405.8461 Q 639.9999 561.9998 387.3682 561.9998 Q 292.6315 561.9998 292.6315 405.8461" stroke="var(--text)" stroke-width="1.2063" fill="none" marker-end="url(#arrow)" />
  <text x="471.5789" y="620" text-anchor="middle" font-size="23.5925" fill="var(--text-muted)" font-family="Arial, sans-serif">unpause</text>
  <path d="M 892.6315 405.8461 Q 892.6315 71.2307 387.3682 71.2307 Q 292.6315 71.2307 292.6315 218.4616" stroke="var(--ok-border)" stroke-width="1.2063" fill="none" marker-end="url(#arrow)" />
  <text x="629.4736" y="40" text-anchor="middle" font-size="23.5925" fill="var(--ok-accent)" font-family="Arial, sans-serif">docker start (restart)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow_lifecycle" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="30.1177" y="203.2941" width="135.5294" height="101.6471" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="97.8824" y="266.8235" text-anchor="middle" font-size="16.5647">Created</text>
  <rect x="210.8235" y="203.2941" width="135.5294" height="101.6471" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="278.5882" y="266.8235" text-anchor="middle" font-size="16.5647">Running</text>
  <rect x="391.5294" y="203.2941" width="135.5294" height="101.6471" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="459.2941" y="266.8235" text-anchor="middle" font-size="16.5647">Paused</text>
  <rect x="572.2353" y="203.2941" width="135.5294" height="101.6471" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="640" y="266.8235" text-anchor="middle" font-size="16.5647">Stopped</text>
  <rect x="752.9412" y="203.2941" width="135.5294" height="101.6471" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="820.7059" y="266.8235" text-anchor="middle" font-size="16.5647">Dead</text>
  <line x1="165.6471" y1="254.1176" x2="207.8118" y2="254.1176" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_lifecycle)" />
  <line x1="346.353" y1="254.1176" x2="388.5176" y2="254.1176" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_lifecycle)" />
  <line x1="527.0588" y1="254.1176" x2="569.2235" y2="254.1176" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_lifecycle)" />
  <line x1="707.7647" y1="254.1176" x2="749.9294" y2="254.1176" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_lifecycle)" />
  <path d="M 459.2941 304.9412 Q 459.2941 393.8823 278.5882 393.8823 Q 210.8235 393.8823 210.8235 304.9412" stroke="var(--text)" stroke-width="2.2588" fill="none" marker-end="url(#arrow_lifecycle)" />
  <text x="338.8235" y="426.9176" text-anchor="middle" font-size="15.0588" fill="var(--text-muted)">unpause</text>
  <path d="M 640 304.9412 Q 640 114.3529 278.5882 114.3529 Q 210.8235 114.3529 210.8235 198.2118" stroke="var(--ok-border)" stroke-width="2.2588" fill="none" marker-end="url(#arrow_lifecycle)" />
  <text x="451.7647" y="96.5647" text-anchor="middle" font-size="15.0588" fill="var(--ok-accent)">docker start (restart)</text>
</svg>
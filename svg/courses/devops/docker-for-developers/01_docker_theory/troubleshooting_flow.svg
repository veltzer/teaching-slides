<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="230" height="272.244898071637" rx="6.527805833922" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="155" y="93.26530578509" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.935287007933" font-weight="bold" fill="var(--danger-text)">1. Identify</text>
  <text x="155" y="146.530611570179" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231545896037" fill="var(--danger-text)">docker ps -a</text>
  <text x="155" y="182.040816528946" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231545896037" fill="var(--danger-text)">docker logs</text>
  <text x="155" y="217.551020385673" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231545896037" fill="var(--danger-text)">Exit code,</text>
  <text x="155" y="247.142857300292" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231545896037" fill="var(--danger-text)">last output</text>
  <text x="155" y="288.571428099125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.143578781941" font-style="italic" fill="var(--danger-text)">What failed?</text>

  <rect x="310" y="40" width="230" height="272.244898071637" rx="6.527805833922" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="425" y="93.26530578509" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.935287007933" font-weight="bold" fill="var(--warn-text)">2. Inspect</text>
  <text x="425" y="146.530611570179" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231545896037" fill="var(--warn-text)">docker inspect</text>
  <text x="425" y="182.040816528946" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231545896037" fill="var(--warn-text)">docker stats</text>
  <text x="425" y="217.551020385673" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231545896037" fill="var(--warn-text)">config, env,</text>
  <text x="425" y="247.142857300292" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231545896037" fill="var(--warn-text)">ports, limits</text>
  <text x="425" y="288.571428099125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.143578781941" font-style="italic" fill="var(--warn-text)">What is the state?</text>

  <rect x="580" y="40" width="230" height="272.244898071637" rx="6.527805833922" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="695" y="93.26530578509" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.935287007933" font-weight="bold" fill="var(--info-text)">3. Reproduce</text>
  <text x="695" y="146.530611570179" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231545896037" fill="var(--info-text)">docker exec -it</text>
  <text x="695" y="182.040816528946" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231545896037" fill="var(--info-text)">docker run --rm</text>
  <text x="695" y="217.551020385673" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231545896037" fill="var(--info-text)">Shell in,</text>
  <text x="695" y="247.142857300292" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231545896037" fill="var(--info-text)">rerun failure</text>
  <text x="695" y="288.571428099125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.143578781941" font-style="italic" fill="var(--info-text)">Can you trigger it?</text>

  <rect x="850" y="40" width="230" height="272.244898071637" rx="6.527805833922" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="965" y="93.26530578509" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.935287007933" font-weight="bold" fill="var(--primary-text)">4. Fix</text>
  <text x="965" y="146.530611570179" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231545896037" fill="var(--primary-text)">Edit Dockerfile</text>
  <text x="965" y="182.040816528946" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231545896037" fill="var(--primary-text)">or compose</text>
  <text x="965" y="217.551020385673" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231545896037" fill="var(--primary-text)">Rebuild,</text>
  <text x="965" y="247.142857300292" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231545896037" fill="var(--primary-text)">fresh tag</text>
  <text x="965" y="288.571428099125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.143578781941" font-style="italic" fill="var(--primary-text)">Patch the recipe</text>

  <rect x="1120" y="40" width="120" height="272.244898071637" rx="6.527805833922" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1180" y="105.102040771345" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.759351729959" font-weight="bold" fill="var(--ok-text)">5. Verify</text>
  <text x="1180" y="152.448979614327" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.143578781941" fill="var(--ok-text)">docker run</text>
  <text x="1180" y="187.959183471054" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.143578781941" fill="var(--ok-text)">healthcheck</text>
  <text x="1180" y="223.46938732778" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.143578781941" fill="var(--ok-text)">Re-run tests</text>
  <text x="1180" y="270.816326170762" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.143578781941" font-style="italic" fill="var(--ok-text)">Green?</text>

  <line x1="270" y1="176.122448484798" x2="310" y2="176.122448484798" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="176.122448484798" x2="580" y2="176.122448484798" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="810" y1="176.122448484798" x2="850" y2="176.122448484798" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1080" y1="176.122448484798" x2="1120" y2="176.122448484798" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="359.591836914619" width="1200" height="260.408163085381" rx="6.527805833922" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="406.938775757601" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.935287007933" font-weight="bold" fill="var(--text)">Common Culprits</text>

  <rect x="80" y="442.448979614327" width="360" height="153.877551515202" rx="6.527805833922" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="260" y="489.795918457309" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.583416451985" font-weight="bold" fill="var(--danger-accent)">Config</text>
  <text x="260" y="531.224489256143" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231545896037" fill="var(--text)">Missing env, bad port,</text>
  <text x="260" y="566.73469421491" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231545896037" fill="var(--text)">bad CMD</text>

  <rect x="460" y="442.448979614327" width="360" height="153.877551515202" rx="6.527805833922" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="489.795918457309" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.583416451985" font-weight="bold" fill="var(--warn-accent)">Image</text>
  <text x="640" y="531.224489256143" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231545896037" fill="var(--text)">Stale cache, bad base,</text>
  <text x="640" y="566.73469421491" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231545896037" fill="var(--text)">.dockerignore drops</text>

  <rect x="840" y="442.448979614327" width="360" height="153.877551515202" rx="6.527805833922" fill="var(--bg)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1020" y="489.795918457309" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.583416451985" font-weight="bold" fill="var(--info-accent)">Host</text>
  <text x="1020" y="531.224489256143" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231545896037" fill="var(--text)">Disk full, port clash,</text>
  <text x="1020" y="566.73469421491" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231545896037" fill="var(--text)">volume perms</text>
</svg>

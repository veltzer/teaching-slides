<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.018513" font-weight="bold" fill="var(--text)">From Dockerfile to Running Container</text>

  <rect x="40" y="93.703704" width="230" height="214.814815" rx="6.218253" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="155" y="142.037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.80026" font-weight="bold" fill="var(--primary-text)">Dockerfile</text>
  <text x="155" y="190.37037" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--primary-text)">Write</text>
  <text x="155" y="227.962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--primary-text)">FROM, COPY, RUN</text>
  <text x="155" y="260.185185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--primary-text)">Declarative recipe</text>
  <text x="155" y="292.407407" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--primary-text)">Checked into git</text>

  <rect x="310" y="93.703704" width="230" height="214.814815" rx="6.218253" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="425" y="142.037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.80026" font-weight="bold" fill="var(--warn-text)">Image</text>
  <text x="425" y="190.37037" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--warn-text)">Build</text>
  <text x="425" y="227.962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--warn-text)">docker build</text>
  <text x="425" y="260.185185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--warn-text)">Immutable layers</text>
  <text x="425" y="292.407407" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--warn-text)">Tagged artifact</text>

  <rect x="580" y="93.703704" width="230" height="214.814815" rx="6.218253" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="695" y="142.037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.80026" font-weight="bold" fill="var(--info-text)">Registry</text>
  <text x="695" y="190.37037" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--info-text)">Push / Pull</text>
  <text x="695" y="227.962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--info-text)">Hub or private</text>
  <text x="695" y="260.185185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--info-text)">Shared storage</text>
  <text x="695" y="292.407407" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--info-text)">Versioned tags</text>

  <rect x="850" y="93.703704" width="230" height="214.814815" rx="6.218253" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="965" y="142.037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.80026" font-weight="bold" fill="var(--ok-text)">Container</text>
  <text x="965" y="190.37037" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--ok-text)">Run</text>
  <text x="965" y="227.962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--ok-text)">docker run</text>
  <text x="965" y="260.185185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--ok-text)">Live process</text>
  <text x="965" y="292.407407" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--ok-text)">Writable layer</text>

  <line x1="270" y1="201.111111" x2="310" y2="201.111111" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="201.111111" x2="580" y2="201.111111" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="810" y1="201.111111" x2="850" y2="201.111111" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1100" y="93.703704" width="140" height="214.814815" rx="6.218253" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1170" y="147.407407" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758" font-weight="bold" fill="var(--danger-text)">Logs</text>
  <text x="1170" y="190.37037" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--danger-text)">docker logs</text>
  <text x="1170" y="227.962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--danger-text)">docker exec</text>
  <text x="1170" y="265.555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--danger-text)">Observe</text>

  <rect x="40" y="351.481481" width="1200" height="268.518519" rx="6.218253" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="394.444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.80026" font-weight="bold" fill="var(--text)">Key Ideas</text>

  <rect x="80" y="426.666667" width="360" height="161.111111" rx="6.218253" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="260" y="469.62963" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758" font-weight="bold" fill="var(--primary-accent)">Build Once</text>
  <text x="260" y="507.222222" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--text)">One image, many environments</text>
  <text x="260" y="539.444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--text)">Layer cache speeds rebuilds</text>
  <text x="260" y="571.666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--text)">Deterministic and reproducible</text>

  <rect x="460" y="426.666667" width="360" height="161.111111" rx="6.218253" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="469.62963" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758" font-weight="bold" fill="var(--ok-accent)">Ship Anywhere</text>
  <text x="640" y="507.222222" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--text)">Registry is the hand-off point</text>
  <text x="640" y="539.444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--text)">Pull by digest for safety</text>
  <text x="640" y="571.666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--text)">Same bits in dev, CI, prod</text>

  <rect x="840" y="426.666667" width="360" height="161.111111" rx="6.218253" fill="var(--bg)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1020" y="469.62963" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758" font-weight="bold" fill="var(--info-accent)">Run Disposably</text>
  <text x="1020" y="507.222222" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--text)">Containers are cheap</text>
  <text x="1020" y="539.444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--text)">Restart rather than repair</text>
  <text x="1020" y="571.666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--text)">State lives in volumes</text>
</svg>

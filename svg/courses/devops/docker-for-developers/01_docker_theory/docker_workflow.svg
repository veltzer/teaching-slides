<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="230" height="236.73469421491" rx="6.527805833922" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="155" y="93.26530578509" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.935287007933" font-weight="bold" fill="var(--primary-text)">Dockerfile</text>
  <text x="155" y="146.530611570179" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.407481174011" fill="var(--primary-text)">Write</text>
  <text x="155" y="187.959183471054" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231545896037" fill="var(--primary-text)">FROM, COPY, RUN</text>
  <text x="155" y="223.46938732778" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231545896037" fill="var(--primary-text)">Declarative recipe</text>
  <text x="155" y="258.979591184506" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231545896037" fill="var(--primary-text)">Checked into git</text>

  <rect x="310" y="40" width="230" height="236.73469421491" rx="6.527805833922" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="425" y="93.26530578509" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.935287007933" font-weight="bold" fill="var(--warn-text)">Image</text>
  <text x="425" y="146.530611570179" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.407481174011" fill="var(--warn-text)">Build</text>
  <text x="425" y="187.959183471054" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231545896037" fill="var(--warn-text)">docker build</text>
  <text x="425" y="223.46938732778" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231545896037" fill="var(--warn-text)">Immutable layers</text>
  <text x="425" y="258.979591184506" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231545896037" fill="var(--warn-text)">Tagged artifact</text>

  <rect x="580" y="40" width="230" height="236.73469421491" rx="6.527805833922" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="695" y="93.26530578509" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.935287007933" font-weight="bold" fill="var(--info-text)">Registry</text>
  <text x="695" y="146.530611570179" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.407481174011" fill="var(--info-text)">Push / Pull</text>
  <text x="695" y="187.959183471054" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231545896037" fill="var(--info-text)">Hub or private</text>
  <text x="695" y="223.46938732778" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231545896037" fill="var(--info-text)">Shared storage</text>
  <text x="695" y="258.979591184506" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231545896037" fill="var(--info-text)">Versioned tags</text>

  <rect x="850" y="40" width="230" height="236.73469421491" rx="6.527805833922" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="965" y="93.26530578509" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.935287007933" font-weight="bold" fill="var(--ok-text)">Container</text>
  <text x="965" y="146.530611570179" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.407481174011" fill="var(--ok-text)">Run</text>
  <text x="965" y="187.959183471054" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231545896037" fill="var(--ok-text)">docker run</text>
  <text x="965" y="223.46938732778" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231545896037" fill="var(--ok-text)">Live process</text>
  <text x="965" y="258.979591184506" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231545896037" fill="var(--ok-text)">Writable layer</text>

  <line x1="270" y1="158.367346556435" x2="310" y2="158.367346556435" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="540" y1="158.367346556435" x2="580" y2="158.367346556435" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="810" y1="158.367346556435" x2="850" y2="158.367346556435" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="1100" y="40" width="140" height="236.73469421491" rx="6.527805833922" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1170" y="99.183672727197" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.583416451985" font-weight="bold" fill="var(--danger-text)">Logs</text>
  <text x="1170" y="146.530611570179" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231545896037" fill="var(--danger-text)">docker logs</text>
  <text x="1170" y="187.959183471054" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231545896037" fill="var(--danger-text)">docker exec</text>
  <text x="1170" y="229.387755371928" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231545896037" fill="var(--danger-text)">Observe</text>

  <rect x="40" y="324.081631955852" width="1200" height="295.918368044148" rx="6.527805833922" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="371.428570798834" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.935287007933" font-weight="bold" fill="var(--text)">Key Ideas</text>

  <rect x="80" y="406.938775757601" width="360" height="177.551020385673" rx="6.527805833922" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="260" y="454.285714600583" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.583416451985" font-weight="bold" fill="var(--primary-accent)">Build Once</text>
  <text x="260" y="495.714285399417" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231545896037" fill="var(--text)">One image, many environments</text>
  <text x="260" y="531.224489256143" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231545896037" fill="var(--text)">Layer cache speeds rebuilds</text>
  <text x="260" y="566.73469421491" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231545896037" fill="var(--text)">Deterministic and reproducible</text>

  <rect x="460" y="406.938775757601" width="360" height="177.551020385673" rx="6.527805833922" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="454.285714600583" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.583416451985" font-weight="bold" fill="var(--ok-accent)">Ship Anywhere</text>
  <text x="640" y="495.714285399417" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231545896037" fill="var(--text)">Registry is the hand-off point</text>
  <text x="640" y="531.224489256143" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231545896037" fill="var(--text)">Pull by digest for safety</text>
  <text x="640" y="566.73469421491" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231545896037" fill="var(--text)">Same bits in dev, CI, prod</text>

  <rect x="840" y="406.938775757601" width="360" height="177.551020385673" rx="6.527805833922" fill="var(--bg)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1020" y="454.285714600583" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.583416451985" font-weight="bold" fill="var(--info-accent)">Run Disposably</text>
  <text x="1020" y="495.714285399417" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231545896037" fill="var(--text)">Containers are cheap</text>
  <text x="1020" y="531.224489256143" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231545896037" fill="var(--text)">Restart rather than repair</text>
  <text x="1020" y="566.73469421491" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231545896037" fill="var(--text)">State lives in volumes</text>
</svg>

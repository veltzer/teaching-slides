<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="236" width="222.2222" height="188" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6.008" />
  <text x="151.111" y="311.2" text-anchor="middle" font-size="24.4771" font-weight="bold">Dockerfile</text>
  <text x="151.111" y="375.12" text-anchor="middle" font-size="22.2518">Write</text>
  <rect x="351.111" y="236" width="222.2222" height="188" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6.008" />
  <text x="462.2222" y="311.2" text-anchor="middle" font-size="24.4771" font-weight="bold">Build</text>
  <text x="462.2222" y="375.12" text-anchor="middle" font-size="22.2518">docker build</text>
  <rect x="662.2222" y="236" width="222.2222" height="188" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6.008" />
  <text x="773.3333" y="311.2" text-anchor="middle" font-size="24.4771" font-weight="bold">Image</text>
  <text x="773.3333" y="375.12" text-anchor="middle" font-size="22.2518">docker push</text>
  <rect x="973.3333" y="236" width="266.6667" height="188" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6.008" />
  <text x="1106.6667" y="311.2" text-anchor="middle" font-size="24.4771" font-weight="bold">Container</text>
  <text x="1106.6667" y="375.12" text-anchor="middle" font-size="22.2518">docker run</text>
  <line x1="262.2222" y1="330" x2="351.111" y2="330" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd3_00)" />
  <line x1="573.3333" y1="330" x2="662.2222" y2="330" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd3_00)" />
  <line x1="884.4444" y1="330" x2="973.3333" y2="330" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd3_00)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd3_00" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
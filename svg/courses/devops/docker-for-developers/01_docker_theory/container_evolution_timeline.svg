<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --border: #e0e0e0;
        --text: #212121; --text-muted: #555555; --text-faint: #888888;
        --code-bg: #1a1a2e; --shadow: #00000022; --black: #000000;
        --primary-fill: #2196f3; --primary-border: #1565c0; --primary-text: #ffffff; --primary-accent: #0d47a1;
        --ok-fill: #4caf50; --ok-border: #2e7d32; --ok-text: #ffffff; --ok-accent: #1b5e20;
        --warn-fill: #ff9800; --warn-border: #e65100; --warn-text: #ffffff; --warn-accent: #bf360c;
        --danger-fill: #e74c3c; --danger-border: #c62828; --danger-text: #ffffff; --danger-accent: #b71c1c;
        --info-fill: #9c27b0; --info-border: #6a1b9a; --info-text: #ffffff; --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="108" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="90" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--danger-text)">1979 - chroot</text>
  <text x="70" y="128" font-family="Arial, sans-serif" font-size="18" fill="var(--danger-text)">Unix V7: filesystem isolation. No limits, escapable.</text>

  <rect x="40" y="156" width="1200" height="108" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="206" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--warn-text)">2000-2008 - Jails, Zones, OpenVZ, LXC</text>
  <text x="70" y="244" font-family="Arial, sans-serif" font-size="18" fill="var(--warn-text)">Per-OS PIDs and networks. Linux adds cgroups, namespaces.</text>

  <rect x="40" y="272" width="1200" height="108" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="322" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--primary-text)">2013 - Docker</text>
  <text x="70" y="360" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">Layered images, registry, one-command run. UX pushes containers mainstream.</text>

  <rect x="40" y="388" width="1200" height="108" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="438" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--ok-text)">2015-2016 - OCI and Kubernetes</text>
  <text x="70" y="476" font-family="Arial, sans-serif" font-size="18" fill="var(--ok-text)">Standard image and runtime. containerd plus runc under everything.</text>

  <rect x="40" y="504" width="1200" height="116" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="556" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--info-text)">2018+ - Rootless and microVMs</text>
  <text x="70" y="596" font-family="Arial, sans-serif" font-size="18" fill="var(--info-text)">Podman, gVisor, Firecracker. Stronger isolation.</text>
</svg>

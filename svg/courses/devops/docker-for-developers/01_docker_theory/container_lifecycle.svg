<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="80" y="343.5" width="160.0001" height="134.9999" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="7.6875" />
  <text x="160.0001" y="427.8751" text-anchor="middle" font-size="19.9999">Created</text>
  <rect x="320" y="343.5" width="160.0001" height="134.9999" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.6875" />
  <text x="400.0001" y="427.8751" text-anchor="middle" font-size="19.9999">Running</text>
  <rect x="560" y="343.5" width="160.0001" height="134.9999" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="7.6875" />
  <text x="640" y="427.8751" text-anchor="middle" font-size="19.9999">Paused</text>
  <rect x="799.9999" y="343.5" width="160.0001" height="134.9999" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="7.6875" />
  <text x="880" y="427.8751" text-anchor="middle" font-size="19.9999">Stopped</text>
  <rect x="1039.9999" y="343.5" width="160.0001" height="134.9999" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="7.6875" />
  <text x="1120" y="427.8751" text-anchor="middle" font-size="19.9999">Removed</text>
  <line x1="240.0001" y1="411" x2="320" y2="411" stroke="var(--text)" stroke-width="2" marker-end="url(#arrlc01)" />
  <line x1="480.0001" y1="411" x2="560" y2="411" stroke="var(--text)" stroke-width="2" marker-end="url(#arrlc01)" />
  <line x1="720" y1="411" x2="799.9999" y2="411" stroke="var(--text)" stroke-width="2" marker-end="url(#arrlc01)" />
  <line x1="960" y1="411" x2="1039.9999" y2="411" stroke="var(--text)" stroke-width="2" marker-end="url(#arrlc01)" />
  <path d="M 640 343.5 Q 640 242.25 400.0001 242.25 Q 400.0001 242.25 400.0001 343.5" fill="none" stroke="var(--text)" stroke-width="2.3415" marker-end="url(#arrlc01)" />
  <text x="520.0001" y="225.3751" text-anchor="middle" font-size="19.9999" fill="var(--text-muted)">unpause</text>
  <path d="M 880 343.5 Q 880 208.5 400.0001 208.5 Q 400.0001 208.5 400.0001 343.5" fill="none" stroke="var(--text)" stroke-width="2.3415" marker-end="url(#arrlc01)" />
  <text x="640" y="181.5001" text-anchor="middle" font-size="19.9999" fill="var(--text-muted)">restart</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrlc01" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
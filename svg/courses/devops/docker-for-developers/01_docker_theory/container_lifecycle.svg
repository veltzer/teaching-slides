<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <path d="M 640 344.356435977845 Q 640 114.653465777865 380 114.653465777865 Q 380 114.653465777865 380 229.504950333301" fill="none" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="510" y="97.425742822272" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.147005434484" fill="var(--text-muted)">unpause</text>

  <path d="M 900 344.356435977845 Q 900 57.227722955593 380 57.227722955593 Q 380 57.227722955593 380 229.504950333301" fill="none" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.147005434484" fill="var(--text-muted)">restart</text>

  <rect x="50" y="229.504950333301" width="220" height="229.70297019998" rx="6.430127298832" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="332.871286977747" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.863884613739" font-weight="bold" fill="var(--primary-text)">Created</text>
  <text x="160" y="373.069306844427" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.003630016074" fill="var(--primary-text)">docker create</text>
  <text x="160" y="401.782178800118" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.003630016074" fill="var(--primary-text)">config ready</text>

  <rect x="310" y="229.504950333301" width="220" height="229.70297019998" rx="6.430127298832" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="420" y="332.871286977747" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.863884613739" font-weight="bold" fill="var(--ok-text)">Running</text>
  <text x="420" y="373.069306844427" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.003630016074" fill="var(--ok-text)">docker start</text>
  <text x="420" y="401.782178800118" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.003630016074" fill="var(--ok-text)">process active</text>

  <rect x="570" y="229.504950333301" width="220" height="229.70297019998" rx="6.430127298832" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="680" y="332.871286977747" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.863884613739" font-weight="bold" fill="var(--warn-text)">Paused</text>
  <text x="680" y="373.069306844427" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.003630016074" fill="var(--warn-text)">docker pause</text>
  <text x="680" y="401.782178800118" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.003630016074" fill="var(--warn-text)">frozen in memory</text>

  <rect x="830" y="229.504950333301" width="220" height="229.70297019998" rx="6.430127298832" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="332.871286977747" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.863884613739" font-weight="bold" fill="var(--info-text)">Stopped</text>
  <text x="940" y="373.069306844427" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.003630016074" fill="var(--info-text)">docker stop</text>
  <text x="940" y="401.782178800118" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.003630016074" fill="var(--info-text)">writable layer kept</text>

  <rect x="1090" y="229.504950333301" width="150" height="229.70297019998" rx="6.430127298832" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1165" y="332.871286977747" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.577132733316" font-weight="bold" fill="var(--danger-text)">Removed</text>
  <text x="1165" y="373.069306844427" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.003630016074" fill="var(--danger-text)">docker rm</text>
  <text x="1165" y="401.782178800118" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.003630016074" fill="var(--danger-text)">gone</text>

  <line x1="270" y1="344.356435977845" x2="310" y2="344.356435977845" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="530" y1="344.356435977845" x2="570" y2="344.356435977845" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="790" y1="344.356435977845" x2="830" y2="344.356435977845" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1050" y1="344.356435977845" x2="1090" y2="344.356435977845" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="493.663366444466" width="1200" height="126.336633555534" rx="6.430127298832" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="539.603960266641" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.290380852894" font-weight="bold" fill="var(--text)">Five states, a handful of verbs</text>
  <text x="640" y="579.80198013332" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.147005434484" fill="var(--text-muted)">create → start → [pause/unpause] → stop → rm. Restart jumps straight back to Running.</text>
  <text x="640" y="608.514850999902" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.075318247081" fill="var(--text-muted)">Removed is terminal: the container and its writable layer are deleted.</text>
</svg>

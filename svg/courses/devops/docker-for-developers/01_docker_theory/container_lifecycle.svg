<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <text x="640" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="var(--text)">Container Lifecycle</text>

  <path d="M 640 380 Q 640 180 380 180 Q 380 180 380 280" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="510" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">unpause</text>

  <path d="M 900 380 Q 900 130 380 130 Q 380 130 380 280" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">restart</text>

  <rect x="50" y="280" width="220" height="200" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="160" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--primary-text)">Created</text>
  <text x="160" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">docker create</text>
  <text x="160" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">config ready</text>

  <rect x="310" y="280" width="220" height="200" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="420" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--ok-text)">Running</text>
  <text x="420" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">docker start</text>
  <text x="420" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">process active</text>

  <rect x="570" y="280" width="220" height="200" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="680" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--warn-text)">Paused</text>
  <text x="680" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">docker pause</text>
  <text x="680" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">frozen in memory</text>

  <rect x="830" y="280" width="220" height="200" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="940" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--info-text)">Stopped</text>
  <text x="940" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">docker stop</text>
  <text x="940" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">writable layer kept</text>

  <rect x="1090" y="280" width="150" height="200" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1165" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-text)">Removed</text>
  <text x="1165" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">docker rm</text>
  <text x="1165" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">gone</text>

  <line x1="270" y1="380" x2="310" y2="380" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="530" y1="380" x2="570" y2="380" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="790" y1="380" x2="830" y2="380" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1050" y1="380" x2="1090" y2="380" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="510" width="1200" height="110" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Five states, a handful of verbs</text>
  <text x="640" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">create → start → [pause/unpause] → stop → rm. Restart jumps straight back to Running.</text>
  <text x="640" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">Removed is terminal: the container and its writable layer are deleted.</text>
</svg>

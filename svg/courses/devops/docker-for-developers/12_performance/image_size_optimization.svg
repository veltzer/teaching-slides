<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="64.8" text-anchor="middle" font-size="25.6" font-weight="bold">Image Size Comparison</text>
  <rect x="42.6667" y="108" width="277.3333" height="432" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="181.3333" y="180" text-anchor="middle" font-size="23.4667" font-weight="bold" fill="var(--danger-accent)">ubuntu:22.04</text>
  <rect x="74.6667" y="208.8" width="213.3333" height="288" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="181.3333" y="280.8" text-anchor="middle" font-size="21.3333">~77MB base</text>
  <text x="181.3333" y="342" text-anchor="middle" font-size="21.3333">apt, bash, coreutils</text>
  <text x="181.3333" y="403.2" text-anchor="middle" font-size="21.3333">+ build tools</text>
  <text x="181.3333" y="464.4" text-anchor="middle" font-size="21.3333">= ~900MB</text>
  <rect x="362.6667" y="108" width="277.3333" height="432" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="501.3333" y="180" text-anchor="middle" font-size="23.4667" font-weight="bold" fill="var(--warn-accent)">node:18-slim</text>
  <rect x="394.6667" y="208.8" width="213.3333" height="216" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="501.3333" y="280.8" text-anchor="middle" font-size="21.3333">~50MB base</text>
  <text x="501.3333" y="342" text-anchor="middle" font-size="21.3333">node runtime</text>
  <text x="501.3333" y="403.2" text-anchor="middle" font-size="21.3333">= ~200MB</text>
  <rect x="682.6667" y="108" width="277.3333" height="432" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="821.3333" y="180" text-anchor="middle" font-size="23.4667" font-weight="bold" fill="var(--ok-accent)">alpine:3.18</text>
  <rect x="714.6667" y="208.8" width="213.3333" height="144" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="821.3333" y="280.8" text-anchor="middle" font-size="21.3333">~5MB base</text>
  <text x="821.3333" y="331.2" text-anchor="middle" font-size="21.3333">= ~50MB</text>
  <rect x="1002.6667" y="108" width="234.6667" height="432" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1120" y="180" text-anchor="middle" font-size="23.4667" font-weight="bold" fill="var(--ok-accent)">distroless</text>
  <rect x="1034.6667" y="208.8" width="170.6667" height="108" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="1120" y="280.8" text-anchor="middle" font-size="21.3333">~2MB</text>
  <text x="640" y="630" text-anchor="middle" font-size="21.3333" fill="var(--text-muted)">Smaller base images reduce attack surface and pull times</text>
</svg>
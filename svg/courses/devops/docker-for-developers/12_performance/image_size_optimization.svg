<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="278.5714" height="479.999988799049" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.243341221113" filter="url(#shadow)"/>
  <text x="179.2856" y="120.000052271105" text-anchor="middle" font-size="24.791267432169" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">ubuntu:22.04</text>
  <rect x="72.1429" y="152.000008214031" width="214.2857" height="319.999992532699" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.243341221113" filter="url(#shadow)"/>
  <text x="179.2856" y="232.000060485136" text-anchor="middle" font-size="22.537421251347" font-family="Arial, sans-serif" fill="var(--warn-text)">~77MB base</text>
  <text x="179.2856" y="300.000007467301" text-anchor="middle" font-size="22.537421251347" font-family="Arial, sans-serif" fill="var(--warn-text)">apt, bash, coreutils</text>
  <text x="179.2856" y="367.999954449466" text-anchor="middle" font-size="22.537421251347" font-family="Arial, sans-serif" fill="var(--warn-text)">+ build tools</text>
  <text x="179.2856" y="436.000009707491" text-anchor="middle" font-size="22.537421251347" font-family="Arial, sans-serif" fill="var(--warn-text)">= ~900MB</text>
  <rect x="361.4286" y="40" width="278.5714" height="479.999988799049" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.243341221113" filter="url(#shadow)"/>
  <text x="500.7142" y="120.000052271105" text-anchor="middle" font-size="24.791267432169" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">node:18-slim</text>
  <rect x="393.5714" y="152.000008214031" width="214.2857" height="240.000048537454" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.243341221113" filter="url(#shadow)"/>
  <text x="500.7142" y="232.000060485136" text-anchor="middle" font-size="22.537421251347" font-family="Arial, sans-serif" fill="var(--primary-text)">~50MB base</text>
  <text x="500.7142" y="300.000007467301" text-anchor="middle" font-size="22.537421251347" font-family="Arial, sans-serif" fill="var(--primary-text)">node runtime</text>
  <text x="500.7142" y="367.999954449466" text-anchor="middle" font-size="22.537421251347" font-family="Arial, sans-serif" fill="var(--primary-text)">= ~200MB</text>
  <rect x="682.8571" y="40" width="278.5714" height="479.999988799049" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.243341221113" filter="url(#shadow)"/>
  <text x="822.1428" y="120.000052271105" text-anchor="middle" font-size="24.791267432169" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">alpine:3.18</text>
  <rect x="715" y="152.000008214031" width="214.2857" height="159.99999626635" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.243341221113" filter="url(#shadow)"/>
  <text x="822.1428" y="232.000060485136" text-anchor="middle" font-size="22.537421251347" font-family="Arial, sans-serif" fill="var(--primary-text)">~5MB base</text>
  <text x="822.1428" y="288.000010454221" text-anchor="middle" font-size="22.537421251347" font-family="Arial, sans-serif" fill="var(--primary-text)">= ~50MB</text>
  <rect x="1004.2857" y="40" width="235.7143" height="479.999988799049" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.243341221113" filter="url(#shadow)"/>
  <text x="1122.1428" y="120.000052271105" text-anchor="middle" font-size="24.791267432169" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">distroless</text>
  <rect x="1036.4285" y="152.000008214031" width="171.4286" height="119.999970130797" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.243341221113" filter="url(#shadow)"/>
  <text x="1122.1428" y="232.000060485136" text-anchor="middle" font-size="22.537421251347" font-family="Arial, sans-serif" fill="var(--primary-text)">~2MB</text>
  <text x="639.9999" y="620" text-anchor="middle" font-size="22.537421251347" fill="var(--text-muted)" font-family="Arial, sans-serif">Smaller base images reduce attack surface and pull times</text>
</svg>

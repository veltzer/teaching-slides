<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="24.6885" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Cgroup Resource Controls</text>
  <rect x="40" y="80" width="1200" height="250" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="82.8571" y="146.6667" font-size="22.6312" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Host Resources</text>
  <rect x="82.8571" y="173.3333" width="257.1428" height="116.6667" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="211.4285" y="246.6667" text-anchor="middle" font-size="20.5738" font-family="Arial, sans-serif" fill="var(--warn-text)">CPU: 8 cores</text>
  <rect x="372.1428" y="173.3333" width="257.1428" height="116.6667" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="500.7142" y="246.6667" text-anchor="middle" font-size="20.5738" font-family="Arial, sans-serif" fill="var(--warn-text)">Memory: 16GB</text>
  <rect x="661.4284" y="173.3333" width="257.1428" height="116.6667" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="789.9999" y="246.6667" text-anchor="middle" font-size="20.5738" font-family="Arial, sans-serif" fill="var(--warn-text)">Disk I/O</text>
  <rect x="950.7142" y="173.3333" width="257.1428" height="116.6667" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1079.2856" y="246.6667" text-anchor="middle" font-size="20.5738" font-family="Arial, sans-serif" fill="var(--warn-text)">Network</text>
  <line x1="211.4285" y1="330" x2="211.4285" y2="396.6667" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="639.9999" y1="330" x2="639.9999" y2="396.6667" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1068.5714" y1="330" x2="1068.5714" y2="396.6667" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="396.6667" width="364.2857" height="150" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="222.1428" y="456.6667" text-anchor="middle" font-size="20.5738" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Container A</text>
  <text x="222.1428" y="513.3333" text-anchor="middle" font-size="20.5738" font-family="Arial, sans-serif" fill="var(--ok-text)">--cpus=2 --memory=4g</text>
  <rect x="457.8571" y="396.6667" width="364.2857" height="150" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="456.6667" text-anchor="middle" font-size="20.5738" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Container B</text>
  <text x="639.9999" y="513.3333" text-anchor="middle" font-size="20.5738" font-family="Arial, sans-serif" fill="var(--info-text)">--cpus=1 --memory=2g</text>
  <rect x="875.7143" y="396.6667" width="364.2857" height="150" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1057.8571" y="456.6667" text-anchor="middle" font-size="20.5738" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Container C</text>
  <text x="1057.8571" y="513.3333" text-anchor="middle" font-size="20.5738" font-family="Arial, sans-serif" fill="var(--primary-text)">--cpus=4 --memory=8g</text>
  <text x="639.9999" y="620" text-anchor="middle" font-size="20.5738" fill="var(--text-muted)" font-family="Arial, sans-serif">Cgroups enforce resource limits per container</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd3_11_performance" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="24.6885" font-weight="bold">Cgroup Resource Controls</text>
  <rect x="40" y="80" width="1200" height="250" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="82.8571" y="146.6667" font-size="22.6312" font-weight="bold">Host Resources</text>
  <rect x="82.8571" y="173.3333" width="257.1428" height="116.6667" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="211.4285" y="246.6667" text-anchor="middle" font-size="20.5738">CPU: 8 cores</text>
  <rect x="372.1428" y="173.3333" width="257.1428" height="116.6667" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="500.7142" y="246.6667" text-anchor="middle" font-size="20.5738">Memory: 16GB</text>
  <rect x="661.4284" y="173.3333" width="257.1428" height="116.6667" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="789.9999" y="246.6667" text-anchor="middle" font-size="20.5738">Disk I/O</text>
  <rect x="950.7142" y="173.3333" width="257.1428" height="116.6667" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1079.2856" y="246.6667" text-anchor="middle" font-size="20.5738">Network</text>
  <line x1="211.4285" y1="330" x2="211.4285" y2="396.6667" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd3_11_performance)" />
  <line x1="639.9999" y1="330" x2="639.9999" y2="396.6667" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd3_11_performance)" />
  <line x1="1068.5714" y1="330" x2="1068.5714" y2="396.6667" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd3_11_performance)" />
  <rect x="40" y="396.6667" width="364.2857" height="150" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="222.1428" y="456.6667" text-anchor="middle" font-size="20.5738" font-weight="bold">Container A</text>
  <text x="222.1428" y="513.3333" text-anchor="middle" font-size="20.5738">--cpus=2 --memory=4g</text>
  <rect x="457.8571" y="396.6667" width="364.2857" height="150" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="456.6667" text-anchor="middle" font-size="20.5738" font-weight="bold">Container B</text>
  <text x="639.9999" y="513.3333" text-anchor="middle" font-size="20.5738">--cpus=1 --memory=2g</text>
  <rect x="875.7143" y="396.6667" width="364.2857" height="150" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1057.8571" y="456.6667" text-anchor="middle" font-size="20.5738" font-weight="bold">Container C</text>
  <text x="1057.8571" y="513.3333" text-anchor="middle" font-size="20.5738">--cpus=4 --memory=8g</text>
  <text x="639.9999" y="620" text-anchor="middle" font-size="20.5738" fill="var(--text-muted)">Cgroups enforce resource limits per container</text>
</svg>
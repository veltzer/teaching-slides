<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="64.8" text-anchor="middle" font-size="25.6" font-weight="bold">CPU Constraint Options</text>
  <rect x="42.6667" y="108" width="576" height="270" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="330.6667" y="172.8" text-anchor="middle" font-size="23.4667" font-weight="bold">--cpus (Fractional)</text>
  <rect x="74.6667" y="198" width="234.6667" height="144" fill="#e8f5e9" stroke="#333" stroke-width="3.2" rx="8.5333" />
  <text x="192" y="259.2" text-anchor="middle" font-size="21.3333">--cpus=0.5</text>
  <text x="192" y="313.2" text-anchor="middle" font-size="21.3333">Half a core</text>
  <rect x="341.3333" y="198" width="234.6667" height="144" fill="#fff3e0" stroke="#333" stroke-width="3.2" rx="8.5333" />
  <text x="458.6667" y="259.2" text-anchor="middle" font-size="21.3333">--cpus=2.0</text>
  <text x="458.6667" y="313.2" text-anchor="middle" font-size="21.3333">Two full cores</text>
  <rect x="661.3333" y="108" width="576" height="270" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="949.3333" y="172.8" text-anchor="middle" font-size="23.4667" font-weight="bold">--cpuset-cpus (Pinning)</text>
  <rect x="693.3333" y="198" width="234.6667" height="144" fill="#e8f5e9" stroke="#333" stroke-width="3.2" rx="8.5333" />
  <text x="810.6667" y="259.2" text-anchor="middle" font-size="21.3333">--cpuset-cpus=0,1</text>
  <text x="810.6667" y="313.2" text-anchor="middle" font-size="21.3333">Pin to cores 0,1</text>
  <rect x="960" y="198" width="234.6667" height="144" fill="#fff3e0" stroke="#333" stroke-width="3.2" rx="8.5333" />
  <text x="1077.3333" y="259.2" text-anchor="middle" font-size="21.3333">--cpu-shares=512</text>
  <text x="1077.3333" y="313.2" text-anchor="middle" font-size="21.3333">Relative weight</text>
  <rect x="128" y="432" width="1024" height="144" fill="#ffebee" stroke="#333" stroke-width="2.1333" rx="10.6667" stroke-dasharray="8.5333 4.2667" />
  <text x="640" y="496.8" text-anchor="middle" font-size="21.3333">--cpus is a hard limit; --cpu-shares only applies under contention</text>
  <text x="640" y="550.8" text-anchor="middle" font-size="21.3333" fill="#555">Use --cpus for predictable behavior, --cpu-shares for flexible sharing</text>
  <text x="640" y="666" text-anchor="middle" font-size="21.3333" fill="#555">Monitor with: docker stats --format "{{.Name}}: {{.CPUPerc}}"</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="25.2006" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">CPU Constraint Options</text>
  <rect x="40" y="81.6766" width="578.5714" height="260.4791" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="329.2858" y="144.1916" text-anchor="middle" font-size="23.1006" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">--cpus (Fractional)</text>
  <rect x="72.1429" y="168.503" width="235.7143" height="138.9222" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="190" y="227.5449" text-anchor="middle" font-size="21.0005" font-family="Arial, sans-serif" fill="var(--ok-text)">--cpus=0.5</text>
  <text x="190" y="279.6407" text-anchor="middle" font-size="21.0005" font-family="Arial, sans-serif" fill="var(--ok-text)">Half a core</text>
  <rect x="340" y="168.503" width="235.7143" height="138.9222" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="457.8572" y="227.5449" text-anchor="middle" font-size="21.0005" font-family="Arial, sans-serif" fill="var(--warn-text)">--cpus=2.0</text>
  <text x="457.8572" y="279.6407" text-anchor="middle" font-size="21.0005" font-family="Arial, sans-serif" fill="var(--warn-text)">Two full cores</text>
  <rect x="661.4286" y="81.6766" width="578.5714" height="260.4791" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="950.7142" y="144.1916" text-anchor="middle" font-size="23.1006" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">--cpuset-cpus (Pinning)</text>
  <rect x="693.5714" y="168.503" width="235.7143" height="138.9222" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="811.4287" y="227.5449" text-anchor="middle" font-size="21.0005" font-family="Arial, sans-serif" fill="var(--ok-text)">--cpuset-cpus=0,1</text>
  <text x="811.4287" y="279.6407" text-anchor="middle" font-size="21.0005" font-family="Arial, sans-serif" fill="var(--ok-text)">Pin to cores 0,1</text>
  <rect x="961.4286" y="168.503" width="235.7143" height="138.9222" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1079.2857" y="227.5449" text-anchor="middle" font-size="21.0005" font-family="Arial, sans-serif" fill="var(--warn-text)">--cpu-shares=512</text>
  <text x="1079.2857" y="279.6407" text-anchor="middle" font-size="21.0005" font-family="Arial, sans-serif" fill="var(--warn-text)">Relative weight</text>
  <rect x="125.7143" y="394.2515" width="1028.5714" height="138.9222" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" stroke-dasharray="8.2002 4.1001" filter="url(#shadow)"/>
  <text x="640" y="456.7665" text-anchor="middle" font-size="21.0005" font-family="Arial, sans-serif" fill="var(--danger-text)">--cpus is a hard limit; --cpu-shares only applies under contention</text>
  <text x="640" y="508.8623" text-anchor="middle" font-size="21.0005" fill="var(--text-muted)" font-family="Arial, sans-serif">Use --cpus for predictable behavior, --cpu-shares for flexible sharing</text>
  <text x="640" y="620" text-anchor="middle" font-size="21.0005" fill="var(--text-muted)" font-family="Arial, sans-serif">Monitor with: docker stats --format "{{.Name}}: {{.CPUPerc}}"</text>
</svg>
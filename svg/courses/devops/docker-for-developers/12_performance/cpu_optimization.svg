<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:text x="615.015" y="62.2703" text-anchor="middle" font-size="24.6006" font-weight="bold">CPU Constraint Options</ns0:text>
  <ns0:rect x="41.001" y="103.7838" width="553.5135" height="259.4595" fill="#e3f2fd" stroke="#333" stroke-width="4.1001" rx="10.2503" />
  <ns0:text x="317.7578" y="166.0541" text-anchor="middle" font-size="22.5506" font-weight="bold">--cpus (Fractional)</ns0:text>
  <ns0:rect x="71.7518" y="190.2703" width="225.5055" height="138.3784" fill="#e8f5e9" stroke="#333" stroke-width="3.0751" rx="8.2002" />
  <ns0:text x="184.5045" y="249.0811" text-anchor="middle" font-size="20.5005">--cpus=0.5</ns0:text>
  <ns0:text x="184.5045" y="300.973" text-anchor="middle" font-size="20.5005">Half a core</ns0:text>
  <ns0:rect x="328.008" y="190.2703" width="225.5055" height="138.3784" fill="#fff3e0" stroke="#333" stroke-width="3.0751" rx="8.2002" />
  <ns0:text x="440.7608" y="249.0811" text-anchor="middle" font-size="20.5005">--cpus=2.0</ns0:text>
  <ns0:text x="440.7608" y="300.973" text-anchor="middle" font-size="20.5005">Two full cores</ns0:text>
  <ns0:rect x="635.5155" y="103.7838" width="553.5135" height="259.4595" fill="#f3e5f5" stroke="#333" stroke-width="4.1001" rx="10.2503" />
  <ns0:text x="912.2722" y="166.0541" text-anchor="middle" font-size="22.5506" font-weight="bold">--cpuset-cpus (Pinning)</ns0:text>
  <ns0:rect x="666.2662" y="190.2703" width="225.5055" height="138.3784" fill="#e8f5e9" stroke="#333" stroke-width="3.0751" rx="8.2002" />
  <ns0:text x="779.0191" y="249.0811" text-anchor="middle" font-size="20.5005">--cpuset-cpus=0,1</ns0:text>
  <ns0:text x="779.0191" y="300.973" text-anchor="middle" font-size="20.5005">Pin to cores 0,1</ns0:text>
  <ns0:rect x="922.5225" y="190.2703" width="225.5055" height="138.3784" fill="#fff3e0" stroke="#333" stroke-width="3.0751" rx="8.2002" />
  <ns0:text x="1035.2752" y="249.0811" text-anchor="middle" font-size="20.5005">--cpu-shares=512</ns0:text>
  <ns0:text x="1035.2752" y="300.973" text-anchor="middle" font-size="20.5005">Relative weight</ns0:text>
  <ns0:rect x="123.003" y="415.1351" width="984.024" height="138.3784" fill="#ffebee" stroke="#333" stroke-width="2.05" rx="10.2503" stroke-dasharray="8.2002 4.1001" />
  <ns0:text x="615.015" y="477.4054" text-anchor="middle" font-size="20.5005">--cpus is a hard limit; --cpu-shares only applies under contention</ns0:text>
  <ns0:text x="615.015" y="529.2973" text-anchor="middle" font-size="20.5005" fill="#555">Use --cpus for predictable behavior, --cpu-shares for flexible sharing</ns0:text>
  <ns0:text x="615.015" y="640" text-anchor="middle" font-size="20.5005" fill="#555">Monitor with: docker stats --format "{{.Name}}: {{.CPUPerc}}"</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="25.5866" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Storage Driver Performance</text>
  <rect x="40" y="82.963" width="364.2857" height="250.6173" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="222.1428" y="154.5679" text-anchor="middle" font-size="23.4544" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">overlay2</text>
  <text x="222.1428" y="219.0124" text-anchor="middle" font-size="21.3221" font-family="Arial, sans-serif" fill="var(--ok-text)">Default, best perf</text>
  <text x="222.1428" y="272.716" text-anchor="middle" font-size="21.3221" font-family="Arial, sans-serif" fill="var(--ok-text)">Copy-on-write</text>
  <rect x="457.8571" y="82.963" width="364.2857" height="250.6173" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="154.5679" text-anchor="middle" font-size="23.4544" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Named Volumes</text>
  <text x="640" y="219.0124" text-anchor="middle" font-size="21.3221" font-family="Arial, sans-serif" fill="var(--primary-text)">Managed by Docker</text>
  <text x="640" y="272.716" text-anchor="middle" font-size="21.3221" font-family="Arial, sans-serif" fill="var(--primary-text)">Best for databases</text>
  <rect x="875.7143" y="82.963" width="364.2857" height="250.6173" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1057.8572" y="154.5679" text-anchor="middle" font-size="23.4544" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Bind Mounts</text>
  <text x="1057.8572" y="219.0124" text-anchor="middle" font-size="21.3221" font-family="Arial, sans-serif" fill="var(--warn-text)">Host path access</text>
  <text x="1057.8572" y="272.716" text-anchor="middle" font-size="21.3221" font-family="Arial, sans-serif" fill="var(--warn-text)">Dev hot-reload</text>
  <rect x="125.7143" y="405.1852" width="428.5715" height="125.3086" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="339.9999" y="483.9506" text-anchor="middle" font-size="21.3221" fill="var(--danger-accent)" font-family="Arial, sans-serif">Avoid writing to container layer</text>
  <rect x="725.7143" y="405.1852" width="428.5715" height="125.3086" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="940" y="483.9506" text-anchor="middle" font-size="21.3221" fill="var(--ok-accent)" font-family="Arial, sans-serif">Use tmpfs for temp data</text>
  <text x="640" y="620" text-anchor="middle" font-size="21.3221" fill="var(--text-muted)" font-family="Arial, sans-serif">Choose storage strategy based on I/O pattern and persistence needs</text>
</svg>

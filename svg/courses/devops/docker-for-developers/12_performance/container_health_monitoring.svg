<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="25.9908" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">HEALTHCHECK Lifecycle</text>
  <rect x="40" y="102.8025" width="235.7143" height="184.7134" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="157.8571" y="176.6879" text-anchor="middle" font-size="21.659" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Starting</text>
  <text x="157.8571" y="239.4904" text-anchor="middle" font-size="21.659" font-family="Arial, sans-serif" fill="var(--primary-text)">Grace period</text>
  <line x1="275.7142" y1="195.1592" x2="339.9999" y2="195.1592" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="339.9999" y="102.8025" width="257.1429" height="184.7134" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="468.5714" y="176.6879" text-anchor="middle" font-size="21.659" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Healthy</text>
  <text x="468.5714" y="239.4904" text-anchor="middle" font-size="21.659" font-family="Arial, sans-serif" fill="var(--ok-text)">Check passes</text>
  <line x1="597.1428" y1="195.1592" x2="661.4285" y2="195.1592" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="661.4285" y="102.8025" width="257.1429" height="184.7134" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="790" y="176.6879" text-anchor="middle" font-size="21.659" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Unhealthy</text>
  <text x="790" y="239.4904" text-anchor="middle" font-size="21.659" font-family="Arial, sans-serif" fill="var(--danger-text)">Retries exceeded</text>
  <line x1="918.5714" y1="195.1592" x2="982.8571" y2="195.1592" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="982.8571" y="102.8025" width="257.1429" height="184.7134" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1111.4286" y="176.6879" text-anchor="middle" font-size="21.659" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Restart</text>
  <text x="1111.4286" y="239.4904" text-anchor="middle" font-size="21.659" font-family="Arial, sans-serif" fill="var(--warn-text)">if restart policy</text>
  <rect x="82.8571" y="361.4013" width="1114.2857" height="147.7707" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" stroke-dasharray="8.5333 4.2667" filter="url(#shadow)"/>
  <text x="640" y="424.2038" text-anchor="middle" font-size="21.659" font-family="Arial, sans-serif" fill="var(--info-text)">HEALTHCHECK --interval=30s --timeout=3s --retries=3</text>
  <text x="640" y="483.3121" text-anchor="middle" font-size="21.659" font-family="Arial, sans-serif" fill="var(--info-text)">CMD curl -f http://localhost/ || exit 1</text>
  <text x="640" y="620" text-anchor="middle" font-size="21.659" fill="var(--text-muted)" font-family="Arial, sans-serif">Health checks enable orchestrators to auto-replace failing containers</text>
</svg>

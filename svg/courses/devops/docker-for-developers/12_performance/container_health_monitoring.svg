    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arrowd6_11_performance" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="640" y="64.8" text-anchor="middle" font-size="25.6" font-weight="bold">HEALTHCHECK Lifecycle</text>
  <rect x="42.6667" y="126" width="234.6667" height="180" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="160" y="198" text-anchor="middle" font-size="21.3333" font-weight="bold">Starting</text>
  <text x="160" y="259.2" text-anchor="middle" font-size="21.3333">Grace period</text>
  <line x1="277.3333" y1="216" x2="341.3333" y2="216" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowd6_11_performance)" />
  <rect x="341.3333" y="126" width="256" height="180" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4.2667" rx="10.6667" />
  <text x="469.3333" y="198" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="#2e7d32">Healthy</text>
  <text x="469.3333" y="259.2" text-anchor="middle" font-size="21.3333">Check passes</text>
  <line x1="597.3333" y1="216" x2="661.3333" y2="216" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowd6_11_performance)" />
  <rect x="661.3333" y="126" width="256" height="180" fill="#ffebee" stroke="#c62828" stroke-width="4.2667" rx="10.6667" />
  <text x="789.3333" y="198" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="#c62828">Unhealthy</text>
  <text x="789.3333" y="259.2" text-anchor="middle" font-size="21.3333">Retries exceeded</text>
  <line x1="917.3333" y1="216" x2="981.3333" y2="216" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowd6_11_performance)" />
  <rect x="981.3333" y="126" width="256" height="180" fill="#fff3e0" stroke="#e65100" stroke-width="4.2667" rx="10.6667" />
  <text x="1109.3333" y="198" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="#e65100">Restart</text>
  <text x="1109.3333" y="259.2" text-anchor="middle" font-size="21.3333">if restart policy</text>
  <rect x="85.3333" y="378" width="1109.3333" height="144" fill="#f3e5f5" stroke="#333" stroke-width="2.1333" rx="10.6667" stroke-dasharray="8.5333 4.2667" />
  <text x="640" y="439.2" text-anchor="middle" font-size="21.3333">HEALTHCHECK --interval=30s --timeout=3s --retries=3</text>
  <text x="640" y="496.8" text-anchor="middle" font-size="21.3333">CMD curl -f http://localhost/ || exit 1</text>
  <text x="640" y="630" text-anchor="middle" font-size="21.3333" fill="#555">Health checks enable orchestrators to auto-replace failing containers</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="742.8571" height="105.45444793389" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.21435269332"/>
  <text x="411.4286" y="110.303108319554" text-anchor="middle" font-size="24.395891513258" font-family="Arial, sans-serif" fill="var(--ok-text)">FROM node:18-alpine</text>
  <text x="1240" y="110.303108319554" font-size="24.395891513258" fill="var(--ok-accent)" font-family="Arial, sans-serif">Cached (rarely changes)</text>
  <rect x="40" y="163.0303322865" width="742.8571" height="105.45444793389" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.21435269332"/>
  <text x="411.4286" y="233.333440606054" text-anchor="middle" font-size="24.395891513258" font-family="Arial, sans-serif" fill="var(--ok-text)">COPY package*.json ./</text>
  <text x="1240" y="233.333440606054" font-size="24.395891513258" fill="var(--ok-accent)" font-family="Arial, sans-serif">Cached (deps stable)</text>
  <rect x="40" y="286.060557300279" width="742.8571" height="105.45444793389" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.21435269332"/>
  <text x="411.4286" y="356.363665619833" text-anchor="middle" font-size="24.395891513258" font-family="Arial, sans-serif" fill="var(--primary-text)">RUN npm install</text>
  <text x="1240" y="356.363665619833" font-size="24.395891513258" fill="var(--primary-accent)" font-family="Arial, sans-serif">Cached if deps unchanged</text>
  <rect x="40" y="409.090889586778" width="742.8571" height="105.45444793389" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.21435269332"/>
  <text x="411.4286" y="479.393890633612" text-anchor="middle" font-size="24.395891513258" font-family="Arial, sans-serif" fill="var(--warn-text)">COPY . .</text>
  <text x="1240" y="479.393890633612" font-size="24.395891513258" fill="var(--warn-accent)" font-family="Arial, sans-serif">Invalidated on code change</text>
  <rect x="40" y="532.121221873278" width="742.8571" height="87.878778126722" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.21435269332"/>
  <text x="411.4286" y="591.878778126722" text-anchor="middle" font-size="24.395891513258" font-family="Arial, sans-serif" fill="var(--danger-text)">RUN npm run build</text>
  <text x="1240" y="591.878778126722" font-size="24.395891513258" fill="var(--danger-accent)" font-family="Arial, sans-serif">Rebuilds every time</text>
  <line x1="868.5713" y1="75.151661432498" x2="868.5713" y2="584.848553112943" stroke="var(--text)" stroke-width="1.9449" stroke-dasharray="5.8348 3.8899"/>
  <text x="925.7143" y="40" font-size="24.395891513258" fill="var(--text-muted)" font-weight="bold" font-family="Arial, sans-serif">Cache status</text>
</svg>

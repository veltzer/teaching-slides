<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="840" y="40" text-anchor="middle" font-size="28.2652" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Dockerfile Layer Order for Caching</text>
  <rect x="40" y="79.322" width="742.8571" height="98.305" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="411.4286" y="144.8588" text-anchor="middle" font-size="23.5544" font-family="Arial, sans-serif" fill="var(--ok-text)">FROM node:18-alpine</text>
  <text x="1240" y="144.8588" font-size="23.5544" fill="var(--ok-accent)" font-family="Arial, sans-serif">Cached (rarely changes)</text>
  <rect x="40" y="194.0113" width="742.8571" height="98.305" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="411.4286" y="259.5481" text-anchor="middle" font-size="23.5544" font-family="Arial, sans-serif" fill="var(--ok-text)">COPY package*.json ./</text>
  <text x="1240" y="259.5481" font-size="23.5544" fill="var(--ok-accent)" font-family="Arial, sans-serif">Cached (deps stable)</text>
  <rect x="40" y="308.7005" width="742.8571" height="98.305" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="411.4286" y="374.2373" text-anchor="middle" font-size="23.5544" font-family="Arial, sans-serif" fill="var(--primary-text)">RUN npm install</text>
  <text x="1240" y="374.2373" font-size="23.5544" fill="var(--primary-accent)" font-family="Arial, sans-serif">Cached if deps unchanged</text>
  <rect x="40" y="423.3898" width="742.8571" height="98.305" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="411.4286" y="488.9265" text-anchor="middle" font-size="23.5544" font-family="Arial, sans-serif" fill="var(--warn-text)">COPY . .</text>
  <text x="1240" y="488.9265" font-size="23.5544" fill="var(--warn-accent)" font-family="Arial, sans-serif">Invalidated on code change</text>
  <rect x="40" y="538.0791" width="742.8571" height="81.9209" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="411.4286" y="593.7853" text-anchor="middle" font-size="23.5544" font-family="Arial, sans-serif" fill="var(--danger-text)">RUN npm run build</text>
  <text x="1240" y="593.7853" font-size="23.5544" fill="var(--danger-accent)" font-family="Arial, sans-serif">Rebuilds every time</text>
  <line x1="868.5713" y1="112.0905" x2="868.5713" y2="587.2317" stroke="var(--text)" stroke-width="1.9449" stroke-dasharray="5.8348 3.8899"/>
  <text x="925.7143" y="79.322" font-size="23.5544" fill="var(--text-muted)" font-weight="bold" font-family="Arial, sans-serif">Cache status</text>
</svg>

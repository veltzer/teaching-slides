<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <ellipse cx="640" cy="319.9744" rx="162.5" ry="83.1755" fill="var(--info-fill)" stroke="var(--text)" stroke-width="4.2667" />
  <text x="640" y="307.9437" text-anchor="middle" font-size="26.8119" fill="var(--bg)">Storage</text>
  <text x="640" y="368.0973" text-anchor="middle" font-size="26.8119" fill="var(--bg)">Drivers</text>
  <ellipse cx="190" cy="99.411" rx="150" ry="59.411" fill="var(--primary-fill)" stroke="var(--text)" stroke-width="4.2667" />
  <text x="190" y="119.4622" text-anchor="middle" font-size="24.3743">overlay2</text>
  <ellipse cx="1090" cy="99.411" rx="150" ry="59.411" fill="var(--info-fill)" stroke="var(--text)" stroke-width="4.2667" />
  <text x="1090" y="119.4622" text-anchor="middle" font-size="24.3743">devicemapper</text>
  <ellipse cx="190" cy="560.589" rx="150" ry="59.411" fill="var(--ok-fill)" stroke="var(--text)" stroke-width="4.2667" />
  <text x="190" y="580.6402" text-anchor="middle" font-size="24.3743">btrfs</text>
  <ellipse cx="1090" cy="560.589" rx="150" ry="59.411" fill="var(--warn-fill)" stroke="var(--text)" stroke-width="4.2667" />
  <text x="1090" y="580.6402" text-anchor="middle" font-size="24.3743">zfs</text>
  <line x1="502.5" y1="231.749" x2="327.5" y2="159.5646" stroke="var(--text)" stroke-width="2" />
  <line x1="777.5" y1="231.749" x2="952.5" y2="159.5646" stroke="var(--text)" stroke-width="2" />
  <line x1="502.5" y1="408.1998" x2="327.5" y2="500.4354" stroke="var(--text)" stroke-width="2" />
  <line x1="777.5" y1="408.1998" x2="952.5" y2="500.4354" stroke="var(--text)" stroke-width="2" />
</svg>
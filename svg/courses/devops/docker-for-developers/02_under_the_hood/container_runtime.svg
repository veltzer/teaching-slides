<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="278.5714" height="207.1429" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="179.2856" y="122.8571" text-anchor="middle" font-size="22.9363" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">docker run</text>
  <text x="179.2856" y="193.2857" text-anchor="middle" font-size="22.9363" font-family="Arial, sans-serif" fill="var(--primary-text)">User command</text>
  <rect x="404.2856" y="40" width="278.5714" height="207.1429" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="543.5714" y="122.8571" text-anchor="middle" font-size="22.9363" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">containerd</text>
  <text x="543.5714" y="193.2857" text-anchor="middle" font-size="22.9363" font-family="Arial, sans-serif" fill="var(--info-text)">Manages lifecycle</text>
  <rect x="768.5714" y="40" width="214.2857" height="207.1429" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="875.7143" y="122.8571" text-anchor="middle" font-size="22.9363" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">shim</text>
  <text x="875.7143" y="193.2857" text-anchor="middle" font-size="22.9363" font-family="Arial, sans-serif" fill="var(--ok-text)">Daemonless</text>
  <rect x="1068.5714" y="40" width="171.4286" height="207.1429" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1154.2856" y="122.8571" text-anchor="middle" font-size="22.9363" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">runc</text>
  <text x="1154.2856" y="193.2857" text-anchor="middle" font-size="22.9363" font-family="Arial, sans-serif" fill="var(--warn-text)">Spawn</text>
  <rect x="404.2856" y="412.8571" width="835.7143" height="207.1429" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="822.1428" y="495.7143" text-anchor="middle" font-size="22.9363" font-family="Arial, sans-serif" fill="var(--danger-text)">Linux Kernel: namespaces + cgroups + seccomp</text>
  <text x="822.1428" y="566.1429" text-anchor="middle" font-size="22.9363" font-family="Arial, sans-serif" fill="var(--danger-text)">Process isolation and resource control</text>
  <line x1="318.5714" y1="143.5714" x2="404.2856" y2="143.5714" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="682.8571" y1="143.5714" x2="768.5714" y2="143.5714" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="982.857" y1="143.5714" x2="1068.5714" y2="143.5714" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="875.7143" y1="247.1429" x2="875.7143" y2="412.8571" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

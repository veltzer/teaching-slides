<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.999891" y="40" text-anchor="middle" font-size="27.837633" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Defense in Depth</text>
  <rect x="40" y="102.142802" width="260.869565" height="207.142931" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.092993" filter="url(#shadow)"/>
  <text x="170.434783" y="185.000129" text-anchor="middle" font-size="25.306971" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Namespaces</text>
  <text x="170.434783" y="255.428586" text-anchor="middle" font-size="25.306971" font-family="Arial, sans-serif" fill="var(--primary-text)">Visibility</text>
  <rect x="353.04337" y="102.142802" width="260.869565" height="207.142931" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="7.092993" filter="url(#shadow)"/>
  <text x="483.478152" y="185.000129" text-anchor="middle" font-size="25.306971" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">cgroups</text>
  <text x="483.478152" y="255.428586" text-anchor="middle" font-size="25.306971" font-family="Arial, sans-serif" fill="var(--info-text)">Resources</text>
  <rect x="666.086848" y="102.142802" width="260.869565" height="207.142931" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.092993" filter="url(#shadow)"/>
  <text x="796.521739" y="185.000129" text-anchor="middle" font-size="25.306971" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Seccomp</text>
  <text x="796.521739" y="255.428586" text-anchor="middle" font-size="25.306971" font-family="Arial, sans-serif" fill="var(--ok-text)">Syscalls</text>
  <rect x="979.130435" y="102.142802" width="260.869565" height="207.142931" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.092993" filter="url(#shadow)"/>
  <text x="1109.565217" y="185.000129" text-anchor="middle" font-size="25.306971" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Capabilities</text>
  <text x="1109.565217" y="255.428586" text-anchor="middle" font-size="25.306971" font-family="Arial, sans-serif" fill="var(--warn-text)">Privileges</text>
  <rect x="40" y="412.857069" width="1199.999891" height="207.142931" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="7.092993" filter="url(#shadow)"/>
  <text x="639.999891" y="495.714139" text-anchor="middle" font-size="25.306971" font-family="Arial, sans-serif" fill="var(--danger-text)">AppArmor / SELinux mandatory access control profiles</text>
  <text x="639.999891" y="566.142853" text-anchor="middle" font-size="25.306971" fill="var(--text-muted)" font-family="Arial, sans-serif">read-only rootfs, no-new-privileges, user remapping</text>
</svg>
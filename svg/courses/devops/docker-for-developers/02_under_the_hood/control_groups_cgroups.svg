<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:rect x="41.001" y="51.8919" width="1148.0281" height="588.1081" fill="none" stroke="#333" stroke-width="2.05" stroke-dasharray="8.2002 8.2002" rx="10.2503" />
  <ns0:text x="615.015" y="121.0811" text-anchor="middle" font-size="22.5506" font-weight="bold">cgroup hierarchy</ns0:text>
  <ns0:rect x="102.5025" y="172.973" width="225.5055" height="190.2703" fill="#e3f2fd" stroke="#333" stroke-width="4.1001" rx="10.2503" />
  <ns0:text x="215.2553" y="249.0811" text-anchor="middle" font-size="20.5005" font-weight="bold">CPU</ns0:text>
  <ns0:text x="215.2553" y="311.3514" text-anchor="middle" font-size="20.5005">--cpus, shares</ns0:text>
  <ns0:rect x="379.2593" y="172.973" width="225.5055" height="190.2703" fill="#f3e5f5" stroke="#333" stroke-width="4.1001" rx="10.2503" />
  <ns0:text x="492.012" y="249.0811" text-anchor="middle" font-size="20.5005" font-weight="bold">Memory</ns0:text>
  <ns0:text x="492.012" y="311.3514" text-anchor="middle" font-size="20.5005">--memory, swap</ns0:text>
  <ns0:rect x="656.016" y="172.973" width="225.5055" height="190.2703" fill="#e8f5e9" stroke="#333" stroke-width="4.1001" rx="10.2503" />
  <ns0:text x="768.7688" y="249.0811" text-anchor="middle" font-size="20.5005" font-weight="bold">Block I/O</ns0:text>
  <ns0:text x="768.7688" y="311.3514" text-anchor="middle" font-size="20.5005">read/write bps</ns0:text>
  <ns0:rect x="932.7728" y="172.973" width="225.5055" height="190.2703" fill="#fff3e0" stroke="#333" stroke-width="4.1001" rx="10.2503" />
  <ns0:text x="1045.5255" y="249.0811" text-anchor="middle" font-size="20.5005" font-weight="bold">PIDs</ns0:text>
  <ns0:text x="1045.5255" y="311.3514" text-anchor="middle" font-size="20.5005">--pids-limit</ns0:text>
  <ns0:rect x="102.5025" y="415.1351" width="1055.7758" height="155.6757" fill="#ffebee" stroke="#333" stroke-width="2.05" rx="6.1502" />
  <ns0:text x="615.015" y="484.3243" text-anchor="middle" font-size="20.5005">Each container gets its own cgroup with resource limits enforced by the kernel</ns0:text>
  <ns0:text x="615.015" y="536.2162" text-anchor="middle" font-size="20.5005" fill="#555">Prevents any single container from consuming all host resources</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="622.524194" y="40" text-anchor="middle" font-size="27.302406" font-weight="bold">cgroup hierarchy</text>
  <rect x="40" y="106.923117" width="256.310702" height="245.384676" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="7.15475" />
  <text x="168.155405" y="205.076935" text-anchor="middle" font-size="24.820304" font-weight="bold">CPU</text>
  <text x="168.155405" y="285.384676" text-anchor="middle" font-size="24.820304">--cpus, shares</text>
  <rect x="354.563208" y="106.923117" width="256.310702" height="245.384676" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="7.15475" />
  <text x="482.718396" y="205.076935" text-anchor="middle" font-size="24.820304" font-weight="bold">Memory</text>
  <text x="482.718396" y="285.384676" text-anchor="middle" font-size="24.820304">--memory, swap</text>
  <rect x="669.126199" y="106.923117" width="256.310702" height="245.384676" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.15475" />
  <text x="797.281604" y="205.076935" text-anchor="middle" font-size="24.820304" font-weight="bold">Block I/O</text>
  <text x="797.281604" y="285.384676" text-anchor="middle" font-size="24.820304">read/write bps</text>
  <rect x="983.689298" y="106.923117" width="256.310702" height="245.384676" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="7.15475" />
  <text x="1111.844595" y="205.076935" text-anchor="middle" font-size="24.820304" font-weight="bold">PIDs</text>
  <text x="1111.844595" y="285.384676" text-anchor="middle" font-size="24.820304">--pids-limit</text>
  <rect x="40" y="419.230779" width="1200" height="200.769221" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="7.15475" />
  <text x="622.524194" y="508.461559" text-anchor="middle" font-size="24.820304">Each container gets its own cgroup with resource limits enforced by the kernel</text>
  <text x="622.524194" y="575.384545" text-anchor="middle" font-size="24.820304" fill="var(--text-muted)">Prevents any single container from consuming all host resources</text>
</svg>
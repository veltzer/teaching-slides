<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="256.310702" height="277.391394536869" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.60706691058" filter="url(#shadow)"/>
  <text x="168.155405" y="150.95649857996" text-anchor="middle" font-size="26.389421470902" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">CPU</text>
  <text x="168.155405" y="241.739169410211" text-anchor="middle" font-size="26.389421470902" font-family="Arial, sans-serif" fill="var(--primary-text)">--cpus, shares</text>
  <rect x="354.563208" y="40" width="256.310702" height="277.391394536869" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="7.60706691058" filter="url(#shadow)"/>
  <text x="482.718396" y="150.95649857996" text-anchor="middle" font-size="26.389421470902" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Memory</text>
  <text x="482.718396" y="241.739169410211" text-anchor="middle" font-size="26.389421470902" font-family="Arial, sans-serif" fill="var(--info-text)">--memory, swap</text>
  <rect x="669.126199" y="40" width="256.310702" height="277.391394536869" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.60706691058" filter="url(#shadow)"/>
  <text x="797.281604" y="150.95649857996" text-anchor="middle" font-size="26.389421470902" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Block I/O</text>
  <text x="797.281604" y="241.739169410211" text-anchor="middle" font-size="26.389421470902" font-family="Arial, sans-serif" fill="var(--ok-text)">read/write bps</text>
  <rect x="983.689298" y="40" width="256.310702" height="277.391394536869" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.60706691058" filter="url(#shadow)"/>
  <text x="1111.844595" y="150.95649857996" text-anchor="middle" font-size="26.389421470902" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">PIDs</text>
  <text x="1111.844595" y="241.739169410211" text-anchor="middle" font-size="26.389421470902" font-family="Arial, sans-serif" fill="var(--warn-text)">--pids-limit</text>
  <rect x="40" y="393.043471576559" width="1200" height="226.956528423441" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="7.60706691058" filter="url(#shadow)"/>
  <text x="622.524194" y="493.913056846882" text-anchor="middle" font-size="26.389421470902" font-family="Arial, sans-serif" fill="var(--danger-text)">Each container gets its own cgroup with resource limits enforced by the kernel</text>
  <text x="622.524194" y="569.565133886572" text-anchor="middle" font-size="26.389421470902" fill="var(--text-muted)" font-family="Arial, sans-serif">Prevents any single container from consuming all host resources</text>
</svg>

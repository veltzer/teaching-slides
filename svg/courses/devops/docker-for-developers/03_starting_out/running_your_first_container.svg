<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="242.2019" height="193.3333" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="161.1009" y="117.3333" text-anchor="middle" font-size="22.4615" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">docker run</text>
  <text x="161.1009" y="183.0667" text-anchor="middle" font-size="22.4615" font-family="Arial, sans-serif" fill="var(--primary-text)">Parse flags</text>
  <rect x="359.266" y="40" width="242.2019" height="193.3333" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="480.3669" y="117.3333" text-anchor="middle" font-size="22.4615" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Pull image</text>
  <text x="480.3669" y="183.0667" text-anchor="middle" font-size="22.4615" font-family="Arial, sans-serif" fill="var(--info-text)">If not local</text>
  <rect x="678.532" y="40" width="242.2019" height="193.3333" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="799.633" y="117.3333" text-anchor="middle" font-size="22.4615" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Create</text>
  <text x="799.633" y="183.0667" text-anchor="middle" font-size="22.4615" font-family="Arial, sans-serif" fill="var(--ok-text)">Container layer</text>
  <rect x="997.7981" y="40" width="242.2019" height="193.3333" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1118.899" y="117.3333" text-anchor="middle" font-size="22.4615" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Start</text>
  <text x="1118.899" y="183.0667" text-anchor="middle" font-size="22.4615" font-family="Arial, sans-serif" fill="var(--warn-text)">Run process</text>
  <line x1="282.2018" y1="136.6667" x2="359.266" y2="136.6667" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="601.4679" y1="136.6667" x2="678.532" y2="136.6667" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="920.7339" y1="136.6667" x2="997.7981" y2="136.6667" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="349.3333" width="1200" height="270.6667" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="638.899" y="426.6667" text-anchor="middle" font-size="22.4615" font-family="Courier New, monospace" fill="var(--danger-text)">$ docker run -it ubuntu:22.04 /bin/bash</text>
  <text x="638.899" y="504" text-anchor="middle" font-size="22.4615" font-family="Arial, sans-serif" fill="var(--danger-text)">-i = interactive (keep STDIN open) | -t = allocate pseudo-TTY</text>
  <text x="638.899" y="573.6" text-anchor="middle" font-size="22.4615" fill="var(--text-muted)" font-family="Arial, sans-serif">You are now inside the container with a shell</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

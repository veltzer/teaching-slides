<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="42.6667" y="72" width="234.6667" height="180" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="160" y="144" text-anchor="middle" font-size="21.3333" font-weight="bold">docker run</text>
  <text x="160" y="205.2" text-anchor="middle" font-size="21.3333">Parse flags</text>
  <rect x="352" y="72" width="234.6667" height="180" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="469.3333" y="144" text-anchor="middle" font-size="21.3333" font-weight="bold">Pull image</text>
  <text x="469.3333" y="205.2" text-anchor="middle" font-size="21.3333">If not local</text>
  <rect x="661.3333" y="72" width="234.6667" height="180" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="778.6667" y="144" text-anchor="middle" font-size="21.3333" font-weight="bold">Create</text>
  <text x="778.6667" y="205.2" text-anchor="middle" font-size="21.3333">Container layer</text>
  <rect x="970.6667" y="72" width="234.6667" height="180" fill="#fff3e0" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1088" y="144" text-anchor="middle" font-size="21.3333" font-weight="bold">Start</text>
  <text x="1088" y="205.2" text-anchor="middle" font-size="21.3333">Run process</text>
  <line x1="277.3333" y1="162" x2="352" y2="162" stroke="#333" stroke-width="4.2667" marker-end="url(#arr03run)" />
  <line x1="586.6667" y1="162" x2="661.3333" y2="162" stroke="#333" stroke-width="4.2667" marker-end="url(#arr03run)" />
  <line x1="896" y1="162" x2="970.6667" y2="162" stroke="#333" stroke-width="4.2667" marker-end="url(#arr03run)" />
  <rect x="42.6667" y="360" width="1162.6667" height="252" fill="#ffebee" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="622.9333" y="432" text-anchor="middle" font-size="21.3333" font-family="monospace">$ docker run -it ubuntu:22.04 /bin/bash</text>
  <text x="622.9333" y="504" text-anchor="middle" font-size="21.3333">-i = interactive (keep STDIN open) | -t = allocate pseudo-TTY</text>
  <text x="622.9333" y="568.8" text-anchor="middle" font-size="21.3333" fill="#555">You are now inside the container with a shell</text>
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arr03run" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
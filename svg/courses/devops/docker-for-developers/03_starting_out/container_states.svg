<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-size="29.018513" font-weight="bold" fill="var(--text)">Container States</text>

  <rect x="40" y="82.962963" width="280" height="537.037037" rx="6.218253" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="180" y="125.925926" text-anchor="middle" font-size="20.727509" font-weight="bold" fill="var(--text)">Created</text>
  <text x="180" y="190.37037" text-anchor="middle" font-size="15.545632" fill="var(--text-muted)">docker create</text>
  <text x="180" y="233.333333" text-anchor="middle" font-size="15.545632" fill="var(--text-muted)">Filesystem ready</text>
  <text x="180" y="276.296296" text-anchor="middle" font-size="15.545632" fill="var(--text-muted)">No process yet</text>
  <text x="180" y="340.740741" text-anchor="middle" font-size="15.545632" fill="var(--text-muted)">Config frozen</text>
  <text x="180" y="405.185185" text-anchor="middle" font-size="15.545632" fill="var(--text-muted)">Writable layer</text>
  <text x="180" y="469.62963" text-anchor="middle" font-size="15.545632" fill="var(--text-muted)">is allocated</text>
  <text x="180" y="555.555556" text-anchor="middle" font-size="15.545632" fill="var(--text-muted)">Awaiting start</text>

  <rect x="340" y="82.962963" width="280" height="537.037037" rx="6.218253" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="125.925926" text-anchor="middle" font-size="20.727509" font-weight="bold" fill="var(--ok-text)">Running</text>
  <text x="480" y="190.37037" text-anchor="middle" font-size="15.545632" fill="var(--ok-text)">docker start</text>
  <text x="480" y="233.333333" text-anchor="middle" font-size="15.545632" fill="var(--ok-text)">PID 1 executing</text>
  <text x="480" y="276.296296" text-anchor="middle" font-size="15.545632" fill="var(--ok-text)">Namespaces active</text>
  <text x="480" y="340.740741" text-anchor="middle" font-size="15.545632" fill="var(--ok-text)">Network attached</text>
  <text x="480" y="405.185185" text-anchor="middle" font-size="15.545632" fill="var(--ok-text)">Logs streaming</text>
  <text x="480" y="469.62963" text-anchor="middle" font-size="15.545632" fill="var(--ok-text)">Can exec into it</text>
  <text x="480" y="555.555556" text-anchor="middle" font-size="15.545632" fill="var(--ok-text)">Healthy state</text>

  <rect x="640" y="82.962963" width="280" height="537.037037" rx="6.218253" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="780" y="125.925926" text-anchor="middle" font-size="20.727509" font-weight="bold" fill="var(--warn-text)">Paused</text>
  <text x="780" y="190.37037" text-anchor="middle" font-size="15.545632" fill="var(--warn-text)">docker pause</text>
  <text x="780" y="233.333333" text-anchor="middle" font-size="15.545632" fill="var(--warn-text)">SIGSTOP via cgroup</text>
  <text x="780" y="276.296296" text-anchor="middle" font-size="15.545632" fill="var(--warn-text)">Processes frozen</text>
  <text x="780" y="340.740741" text-anchor="middle" font-size="15.545632" fill="var(--warn-text)">Memory retained</text>
  <text x="780" y="405.185185" text-anchor="middle" font-size="15.545632" fill="var(--warn-text)">No CPU use</text>
  <text x="780" y="469.62963" text-anchor="middle" font-size="15.545632" fill="var(--warn-text)">Resume via unpause</text>
  <text x="780" y="555.555556" text-anchor="middle" font-size="15.545632" fill="var(--warn-text)">Good for debugging</text>

  <rect x="940" y="82.962963" width="300" height="537.037037" rx="6.218253" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="125.925926" text-anchor="middle" font-size="20.727509" font-weight="bold" fill="var(--danger-text)">Exited</text>
  <text x="1090" y="190.37037" text-anchor="middle" font-size="15.545632" fill="var(--danger-text)">PID 1 terminated</text>
  <text x="1090" y="233.333333" text-anchor="middle" font-size="15.545632" fill="var(--danger-text)">docker stop or crash</text>
  <text x="1090" y="276.296296" text-anchor="middle" font-size="15.545632" fill="var(--danger-text)">Exit code recorded</text>
  <text x="1090" y="340.740741" text-anchor="middle" font-size="15.545632" fill="var(--danger-text)">Filesystem kept</text>
  <text x="1090" y="405.185185" text-anchor="middle" font-size="15.545632" fill="var(--danger-text)">Can restart</text>
  <text x="1090" y="469.62963" text-anchor="middle" font-size="15.545632" fill="var(--danger-text)">docker rm removes</text>
  <text x="1090" y="555.555556" text-anchor="middle" font-size="15.545632" fill="var(--danger-text)">Final cleanup</text>
</svg>

  <ns0:text x="990.2881" y="444.4444" text-anchor="middle" font-size="21.0699">Ephemeral by default</ns0:text>
  <ns0:text x="990.2881" y="533.3333" text-anchor="middle" font-size="21.0699" fill="#555">Like an object instance</ns0:text>

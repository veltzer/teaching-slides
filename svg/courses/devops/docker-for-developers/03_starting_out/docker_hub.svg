<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="145.4545" width="288.8889" height="369.0909" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="184.4445" y="277.2727" text-anchor="middle" font-size="26.3505" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Developer</text>
  <text x="184.4445" y="366.9091" text-anchor="middle" font-size="26.3505" font-family="Arial, sans-serif" fill="var(--primary-text)">docker push</text>
  <text x="184.4445" y="446" text-anchor="middle" font-size="26.3505" font-family="Arial, sans-serif" fill="var(--primary-text)">docker pull</text>
  <rect x="484.4445" y="40" width="311.1111" height="580" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="171.8182" text-anchor="middle" font-size="28.9856" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Docker Hub</text>
  <text x="640" y="277.2727" text-anchor="middle" font-size="26.3505" font-family="Arial, sans-serif" fill="var(--info-text)">Official images</text>
  <text x="640" y="356.3636" text-anchor="middle" font-size="26.3505" font-family="Arial, sans-serif" fill="var(--info-text)">Community images</text>
  <text x="640" y="435.4545" text-anchor="middle" font-size="26.3505" font-family="Arial, sans-serif" fill="var(--info-text)">Private repos</text>
  <text x="640" y="514.5455" text-anchor="middle" font-size="26.3505" font-family="Arial, sans-serif" fill="var(--info-text)">Automated builds</text>
  <rect x="951.1111" y="145.4545" width="288.8889" height="369.0909" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1095.5555" y="277.2727" text-anchor="middle" font-size="26.3505" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Production</text>
  <text x="1095.5555" y="366.9091" text-anchor="middle" font-size="26.3505" font-family="Arial, sans-serif" fill="var(--ok-text)">docker pull</text>
  <text x="1095.5555" y="446" text-anchor="middle" font-size="26.3505" font-family="Arial, sans-serif" fill="var(--ok-text)">docker run</text>
  <line x1="328.8889" y1="277.2727" x2="484.4445" y2="277.2727" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="484.4445" y1="382.7273" x2="328.8889" y2="382.7273" stroke="var(--text)" stroke-width="2" stroke-dasharray="10.6667 6.4" marker-end="url(#arrow)"/>
  <line x1="795.5555" y1="330" x2="951.1111" y2="330" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

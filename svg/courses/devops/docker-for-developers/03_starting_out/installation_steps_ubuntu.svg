<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="42.6667" y="108" width="256" height="144" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="170.6667" y="169.2" text-anchor="middle" font-size="21.3333" font-weight="bold">1. Add repo</text>
  <text x="170.6667" y="223.2" text-anchor="middle" font-size="21.3333">GPG key + apt</text>
  <rect x="352" y="108" width="256" height="144" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="480" y="169.2" text-anchor="middle" font-size="21.3333" font-weight="bold">2. Install</text>
  <text x="480" y="223.2" text-anchor="middle" font-size="21.3333">docker-ce</text>
  <rect x="661.3333" y="108" width="256" height="144" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="789.3333" y="169.2" text-anchor="middle" font-size="21.3333" font-weight="bold">3. Start</text>
  <text x="789.3333" y="223.2" text-anchor="middle" font-size="21.3333">systemctl enable</text>
  <rect x="970.6667" y="108" width="256" height="144" fill="#fff3e0" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1098.6667" y="169.2" text-anchor="middle" font-size="21.3333" font-weight="bold">4. Verify</text>
  <text x="1098.6667" y="223.2" text-anchor="middle" font-size="21.3333">hello-world</text>
  <line x1="298.6667" y1="180" x2="352" y2="180" stroke="#333" stroke-width="4.2667" marker-end="url(#arr03inst)" />
  <line x1="608" y1="180" x2="661.3333" y2="180" stroke="#333" stroke-width="4.2667" marker-end="url(#arr03inst)" />
  <line x1="917.3333" y1="180" x2="970.6667" y2="180" stroke="#333" stroke-width="4.2667" marker-end="url(#arr03inst)" />
  <rect x="42.6667" y="360" width="1184" height="252" fill="#ffebee" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="633.6" y="432" text-anchor="middle" font-size="21.3333" font-weight="bold">Post-install: Add user to docker group</text>
  <text x="633.6" y="504" text-anchor="middle" font-size="21.3333" font-family="monospace">sudo usermod -aG docker $USER</text>
  <text x="633.6" y="568.8" text-anchor="middle" font-size="21.3333" fill="#555">Log out and back in for group changes to take effect</text>
  <defs>
    <marker id="arr03inst" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
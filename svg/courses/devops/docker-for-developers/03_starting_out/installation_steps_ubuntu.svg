<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="259.4595" height="165.7143" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="169.7297" y="110.4286" text-anchor="middle" font-size="23.0394" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">1. Add repo</text>
  <text x="169.7297" y="172.5714" text-anchor="middle" font-size="23.0394" font-family="Arial, sans-serif" fill="var(--primary-text)">GPG key + apt</text>
  <rect x="353.5135" y="40" width="259.4595" height="165.7143" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="483.2432" y="110.4286" text-anchor="middle" font-size="23.0394" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">2. Install</text>
  <text x="483.2432" y="172.5714" text-anchor="middle" font-size="23.0394" font-family="Arial, sans-serif" fill="var(--info-text)">docker-ce</text>
  <rect x="667.027" y="40" width="259.4595" height="165.7143" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="796.7567" y="110.4286" text-anchor="middle" font-size="23.0394" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">3. Start</text>
  <text x="796.7567" y="172.5714" text-anchor="middle" font-size="23.0394" font-family="Arial, sans-serif" fill="var(--ok-text)">systemctl enable</text>
  <rect x="980.5405" y="40" width="259.4595" height="165.7143" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1110.2703" y="110.4286" text-anchor="middle" font-size="23.0394" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">4. Verify</text>
  <text x="1110.2703" y="172.5714" text-anchor="middle" font-size="23.0394" font-family="Arial, sans-serif" fill="var(--warn-text)">hello-world</text>
  <line x1="299.4595" y1="122.8571" x2="353.5135" y2="122.8571" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="612.9729" y1="122.8571" x2="667.027" y2="122.8571" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="926.4864" y1="122.8571" x2="980.5405" y2="122.8571" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="330" width="1200" height="290" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="638.9189" y="412.8571" text-anchor="middle" font-size="23.0394" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Post-install: Add user to docker group</text>
  <text x="638.9189" y="495.7143" text-anchor="middle" font-size="23.0394" font-family="Courier New, monospace" fill="var(--danger-text)">sudo usermod -aG docker $USER</text>
  <text x="638.9189" y="570.2857" text-anchor="middle" font-size="23.0394" fill="var(--text-muted)" font-family="Arial, sans-serif">Log out and back in for group changes to take effect</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

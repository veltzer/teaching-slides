<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="470.5883" height="112.2581" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="275.2941" y="114.8387" text-anchor="middle" font-size="22.8418" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Container R/W Layer</text>
  <rect x="40" y="170.9677" width="470.5883" height="93.5484" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="275.2941" y="234.5806" text-anchor="middle" font-size="22.8418" font-family="Arial, sans-serif" fill="var(--primary-text)">Application Code</text>
  <rect x="40" y="283.2258" width="470.5883" height="93.5484" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="275.2941" y="346.8387" text-anchor="middle" font-size="22.8418" font-family="Arial, sans-serif" fill="var(--primary-text)">Dependencies</text>
  <rect x="40" y="395.4839" width="470.5883" height="93.5484" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="275.2941" y="459.0968" text-anchor="middle" font-size="22.8418" font-family="Arial, sans-serif" fill="var(--primary-text)">Runtime (Python, Node)</text>
  <rect x="40" y="507.7419" width="470.5883" height="112.2581" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="275.2941" y="582.5806" text-anchor="middle" font-size="22.8418" font-family="Arial, sans-serif" fill="var(--ok-text)">Base OS (Ubuntu, Alpine)</text>
  <rect x="698.8235" y="114.8387" width="541.1765" height="486.4516" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="969.4117" y="208.3871" text-anchor="middle" font-size="22.8418" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Image Properties</text>
  <text x="969.4117" y="283.2258" text-anchor="middle" font-size="22.8418" font-family="Arial, sans-serif" fill="var(--warn-text)">Immutable layers (read-only)</text>
  <text x="969.4117" y="346.8387" text-anchor="middle" font-size="22.8418" font-family="Arial, sans-serif" fill="var(--warn-text)">Content-addressable (SHA256)</text>
  <text x="969.4117" y="410.4516" text-anchor="middle" font-size="22.8418" font-family="Arial, sans-serif" fill="var(--warn-text)">Shared between containers</text>
  <text x="969.4117" y="474.0645" text-anchor="middle" font-size="22.8418" font-family="Arial, sans-serif" fill="var(--warn-text)">Cached for fast builds</text>
  <text x="969.4117" y="537.6774" text-anchor="middle" font-size="22.8418" font-family="Arial, sans-serif" fill="var(--warn-text)">Stored in registries</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="634.6902" y="40" text-anchor="middle" font-size="25.8756" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Docker Testing Pipeline</text>
  <rect x="40" y="102.8025" width="276.1062" height="203.1847" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="178.053" y="176.6879" text-anchor="middle" font-size="23.7193" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Unit Tests</text>
  <text x="178.053" y="243.1847" text-anchor="middle" font-size="21.5629" font-family="Arial, sans-serif" fill="var(--primary-text)">docker run --rm</text>
  <line x1="316.1062" y1="202.5478" x2="369.2035" y2="202.5478" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="369.2035" y="102.8025" width="297.3452" height="203.1847" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="517.8761" y="176.6879" text-anchor="middle" font-size="23.7193" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Integration Tests</text>
  <text x="517.8761" y="243.1847" text-anchor="middle" font-size="21.5629" font-family="Arial, sans-serif" fill="var(--info-text)">compose up + test</text>
  <line x1="666.5487" y1="202.5478" x2="719.646" y2="202.5478" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="719.646" y="102.8025" width="254.8673" height="203.1847" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="847.0796" y="176.6879" text-anchor="middle" font-size="23.7193" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">E2E Tests</text>
  <text x="847.0796" y="243.1847" text-anchor="middle" font-size="21.5629" font-family="Arial, sans-serif" fill="var(--warn-text)">Full stack</text>
  <line x1="974.5132" y1="202.5478" x2="1027.6106" y2="202.5478" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1027.6106" y="102.8025" width="212.3894" height="203.1847" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1133.8053" y="176.6879" text-anchor="middle" font-size="23.7193" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Deploy</text>
  <text x="1133.8053" y="243.1847" text-anchor="middle" font-size="21.5629" font-family="Arial, sans-serif" fill="var(--ok-text)">Verified</text>
  <rect x="124.9557" y="398.3439" width="1019.4691" height="129.2994" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" stroke-dasharray="8.5333 4.2667" filter="url(#shadow)"/>
  <text x="634.6902" y="479.6178" text-anchor="middle" font-size="21.5629" font-family="Arial, sans-serif" fill="var(--primary-text)">Each stage runs in isolated containers with disposable environments</text>
  <text x="634.6902" y="620" text-anchor="middle" font-size="21.5629" fill="var(--text-muted)" font-family="Arial, sans-serif">docker-compose -f docker-compose.test.yml up --abort-on-container-exit</text>
</svg>

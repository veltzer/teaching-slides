<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="557.1429" height="580" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6"/>
  <text x="318.5714" y="108.2353" text-anchor="middle" font-size="24.9773" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Development</text>
  <rect x="82.8571" y="142.353" width="214.2857" height="102.353" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="190" y="210.5883" text-anchor="middle" font-size="20.8144" font-family="Arial, sans-serif" fill="var(--primary-text)">Volume mounts</text>
  <rect x="340" y="142.353" width="214.2857" height="102.353" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="447.1429" y="210.5883" text-anchor="middle" font-size="20.8144" font-family="Arial, sans-serif" fill="var(--primary-text)">Hot reload</text>
  <rect x="82.8571" y="278.8236" width="214.2857" height="102.353" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="190" y="347.0588" text-anchor="middle" font-size="20.8144" font-family="Arial, sans-serif" fill="var(--primary-text)">Debug ports</text>
  <rect x="340" y="278.8236" width="214.2857" height="102.353" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="447.1429" y="347.0588" text-anchor="middle" font-size="20.8144" font-family="Arial, sans-serif" fill="var(--primary-text)">.env files</text>
  <rect x="82.8571" y="415.2941" width="471.4286" height="102.353" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6"/>
  <text x="318.5714" y="483.5294" text-anchor="middle" font-size="20.8144" font-family="Arial, sans-serif" fill="var(--info-text)">docker-compose.override.yml</text>
  <rect x="682.8571" y="40" width="557.1429" height="580" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="961.4286" y="108.2353" text-anchor="middle" font-size="24.9773" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Production</text>
  <rect x="725.7143" y="142.353" width="214.2857" height="102.353" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="832.8571" y="210.5883" text-anchor="middle" font-size="20.8144" font-family="Arial, sans-serif" fill="var(--primary-text)">Multi-stage</text>
  <rect x="982.8571" y="142.353" width="214.2857" height="102.353" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="1090" y="210.5883" text-anchor="middle" font-size="20.8144" font-family="Arial, sans-serif" fill="var(--primary-text)">Minimal image</text>
  <rect x="725.7143" y="278.8236" width="214.2857" height="102.353" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="832.8571" y="347.0588" text-anchor="middle" font-size="20.8144" font-family="Arial, sans-serif" fill="var(--primary-text)">Non-root user</text>
  <rect x="982.8571" y="278.8236" width="214.2857" height="102.353" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="1090" y="347.0588" text-anchor="middle" font-size="20.8144" font-family="Arial, sans-serif" fill="var(--primary-text)">Read-only FS</text>
  <rect x="725.7143" y="415.2941" width="471.4286" height="102.353" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6"/>
  <text x="961.4286" y="483.5294" text-anchor="middle" font-size="20.8144" font-family="Arial, sans-serif" fill="var(--info-text)">docker-compose.prod.yml</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="186.2069" height="237.272707107437" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.318803227609" filter="url(#shadow)"/>
  <text x="133.1034" y="134.909127206613" text-anchor="middle" font-size="25.425600427252" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">git push</text>
  <text x="133.1034" y="213.999955636362" text-anchor="middle" font-size="25.425600427252" font-family="Arial, sans-serif" fill="var(--primary-text)">Source</text>
  <line x1="226.2069" y1="155.999933454543" x2="288.2758" y2="155.999933454543" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="288.2758" y="40" width="206.8965" height="237.272707107437" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.318803227609" filter="url(#shadow)"/>
  <text x="391.7242" y="134.909127206613" text-anchor="middle" font-size="25.425600427252" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">docker build</text>
  <text x="391.7242" y="213.999955636362" text-anchor="middle" font-size="25.425600427252" font-family="Arial, sans-serif" fill="var(--info-text)">CI Server</text>
  <line x1="495.1725" y1="155.999933454543" x2="557.2414" y2="155.999933454543" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="557.2414" y="40" width="186.2069" height="237.272707107437" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.318803227609" filter="url(#shadow)"/>
  <text x="650.3449" y="134.909127206613" text-anchor="middle" font-size="25.425600427252" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Test</text>
  <text x="650.3449" y="213.999955636362" text-anchor="middle" font-size="25.425600427252" font-family="Arial, sans-serif" fill="var(--warn-text)">Run tests</text>
  <line x1="743.4483" y1="155.999933454543" x2="805.5173" y2="155.999933454543" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="805.5173" y="40" width="186.2069" height="237.272707107437" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.318803227609" filter="url(#shadow)"/>
  <text x="898.6207" y="134.909127206613" text-anchor="middle" font-size="25.425600427252" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Push Image</text>
  <text x="898.6207" y="213.999955636362" text-anchor="middle" font-size="25.425600427252" font-family="Arial, sans-serif" fill="var(--ok-text)">Registry</text>
  <line x1="991.7242" y1="155.999933454543" x2="1053.7931" y2="155.999933454543" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1053.7931" y="40" width="186.2069" height="237.272707107437" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.318803227609" filter="url(#shadow)"/>
  <text x="1146.8966" y="134.909127206613" text-anchor="middle" font-size="25.425600427252" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Deploy</text>
  <text x="1146.8966" y="213.999955636362" text-anchor="middle" font-size="25.425600427252" font-family="Arial, sans-serif" fill="var(--primary-text)">Production</text>
  <rect x="226.2069" y="409.090939338844" width="827.5861" height="210.909060661156" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.318803227609" stroke-dasharray="8.5333 4.2667" filter="url(#shadow)"/>
  <text x="640" y="503.999955636362" text-anchor="middle" font-size="25.425600427252" font-family="Arial, sans-serif" fill="var(--info-text)">Automated pipeline: same image from build to production</text>
  <text x="640" y="593.636353553719" text-anchor="middle" font-size="25.425600427252" fill="var(--text-muted)" font-family="Arial, sans-serif">Ensures consistency across all environments</text>
</svg>

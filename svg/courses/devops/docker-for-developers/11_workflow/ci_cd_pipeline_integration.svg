<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd1_10_workflow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="640" y="64.8" text-anchor="middle" font-size="25.6" font-weight="bold">CI/CD with Docker</text>
  <rect x="21.3333" y="108" width="192" height="162" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="117.3333" y="172.8" text-anchor="middle" font-size="21.3333" font-weight="bold">git push</text>
  <text x="117.3333" y="226.8" text-anchor="middle" font-size="21.3333">Source</text>
  <line x1="213.3333" y1="187.2" x2="277.3333" y2="187.2" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_10_workflow)" />
  <rect x="277.3333" y="108" width="213.3333" height="162" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="384" y="172.8" text-anchor="middle" font-size="21.3333" font-weight="bold">docker build</text>
  <text x="384" y="226.8" text-anchor="middle" font-size="21.3333">CI Server</text>
  <line x1="490.6667" y1="187.2" x2="554.6667" y2="187.2" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_10_workflow)" />
  <rect x="554.6667" y="108" width="192" height="162" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="650.6667" y="172.8" text-anchor="middle" font-size="21.3333" font-weight="bold">Test</text>
  <text x="650.6667" y="226.8" text-anchor="middle" font-size="21.3333">Run tests</text>
  <line x1="746.6667" y1="187.2" x2="810.6667" y2="187.2" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_10_workflow)" />
  <rect x="810.6667" y="108" width="192" height="162" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="906.6667" y="172.8" text-anchor="middle" font-size="21.3333" font-weight="bold">Push Image</text>
  <text x="906.6667" y="226.8" text-anchor="middle" font-size="21.3333">Registry</text>
  <line x1="1002.6667" y1="187.2" x2="1066.6667" y2="187.2" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_10_workflow)" />
  <rect x="1066.6667" y="108" width="192" height="162" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="1162.6667" y="172.8" text-anchor="middle" font-size="21.3333" font-weight="bold">Deploy</text>
  <text x="1162.6667" y="226.8" text-anchor="middle" font-size="21.3333">Production</text>
  <rect x="213.3333" y="360" width="853.3333" height="144" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" stroke-dasharray="8.5333 4.2667" />
  <text x="640" y="424.8" text-anchor="middle" font-size="21.3333">Automated pipeline: same image from build to production</text>
  <text x="640" y="486" text-anchor="middle" font-size="21.3333" fill="var(--text-muted)">Ensures consistency across all environments</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="276.92312662722" height="185.599895424043" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.303864760682"/>
  <text x="178.461509467455" y="123.520001100799" text-anchor="middle" font-size="25.189812248798" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Dockerfile</text>
  <text x="178.461509467455" y="193.119979084808" text-anchor="middle" font-size="25.189812248798" font-family="Arial, sans-serif" fill="var(--primary-text)">Build instructions</text>
  <rect x="363.076927218935" y="40" width="276.92312662722" height="185.599895424043" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="7.303864760682"/>
  <text x="501.53843668639" y="123.520001100799" text-anchor="middle" font-size="25.189812248798" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">compose.yml</text>
  <text x="501.53843668639" y="193.119979084808" text-anchor="middle" font-size="25.189812248798" font-family="Arial, sans-serif" fill="var(--info-text)">Service definitions</text>
  <rect x="686.153962130179" y="40" width="276.92312662722" height="185.599895424043" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.303864760682"/>
  <text x="824.615363905325" y="123.520001100799" text-anchor="middle" font-size="25.189812248798" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">.dockerignore</text>
  <text x="824.615363905325" y="193.119979084808" text-anchor="middle" font-size="25.189812248798" font-family="Arial, sans-serif" fill="var(--ok-text)">Exclude files</text>
  <rect x="1009.230781656805" y="40" width="230.769218343195" height="185.599895424043" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.303864760682"/>
  <text x="1124.615444674557" y="123.520001100799" text-anchor="middle" font-size="25.189812248798" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">.env</text>
  <text x="1124.615444674557" y="193.119979084808" text-anchor="middle" font-size="25.189812248798" font-family="Arial, sans-serif" fill="var(--warn-text)">Environment</text>
  <rect x="40" y="295.200011007996" width="576.922992011833" height="185.599895424043" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.303864760682"/>
  <text x="328.461603698226" y="378.720012108795" text-anchor="middle" font-size="25.189812248798" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">src/</text>
  <text x="328.461603698226" y="448.319990092805" text-anchor="middle" font-size="25.189812248798" font-family="Arial, sans-serif" fill="var(--primary-text)">Application source code</text>
  <rect x="663.076900295858" y="295.200011007996" width="576.922992011833" height="185.599895424043" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="7.303864760682"/>
  <text x="951.538503994083" y="378.720012108795" text-anchor="middle" font-size="25.189812248798" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">docker/</text>
  <text x="951.538503994083" y="448.319990092805" text-anchor="middle" font-size="25.189812248798" font-family="Arial, sans-serif" fill="var(--info-text)">Config, scripts, overrides</text>
  <text x="640.000053846155" y="620" text-anchor="middle" font-size="25.189812248798" fill="var(--text-muted)" font-family="Arial, sans-serif">Keep Docker files at project root alongside source code</text>
</svg>

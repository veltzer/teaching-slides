<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrowd2_10_workflow" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="640" y="64.8" text-anchor="middle" font-size="25.6" font-weight="bold">Multi-stage Build Flow</text>
  <rect x="42.6667" y="108" width="362.6667" height="252" fill="#fff3e0" stroke="#e65100" stroke-width="4.2667" rx="10.6667" />
  <text x="224" y="180" text-anchor="middle" font-size="23.4667" font-weight="bold" fill="#e65100">Stage 1: Build</text>
  <text x="224" y="244.8" text-anchor="middle" font-size="21.3333">FROM node:18 AS build</text>
  <text x="224" y="298.8" text-anchor="middle" font-size="21.3333">npm install + compile</text>
  <line x1="405.3333" y1="234" x2="469.3333" y2="234" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowd2_10_workflow)" />
  <rect x="469.3333" y="108" width="341.3333" height="252" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="180" text-anchor="middle" font-size="23.4667" font-weight="bold">COPY --from=build</text>
  <text x="640" y="244.8" text-anchor="middle" font-size="21.3333">Only artifacts</text>
  <text x="640" y="298.8" text-anchor="middle" font-size="21.3333">No dev dependencies</text>
  <line x1="810.6667" y1="234" x2="874.6667" y2="234" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowd2_10_workflow)" />
  <rect x="874.6667" y="108" width="362.6667" height="252" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4.2667" rx="10.6667" />
  <text x="1056" y="180" text-anchor="middle" font-size="23.4667" font-weight="bold" fill="#2e7d32">Stage 2: Runtime</text>
  <text x="1056" y="244.8" text-anchor="middle" font-size="21.3333">FROM node:18-alpine</text>
  <text x="1056" y="298.8" text-anchor="middle" font-size="21.3333">Minimal final image</text>
  <rect x="42.6667" y="432" width="362.6667" height="108" fill="#ffebee" stroke="#333" stroke-width="2.1333" rx="8.5333" />
  <text x="224" y="504" text-anchor="middle" font-size="21.3333" fill="#c62828">~900MB with build tools</text>
  <rect x="874.6667" y="432" width="362.6667" height="108" fill="#e8f5e9" stroke="#333" stroke-width="2.1333" rx="8.5333" />
  <text x="1056" y="504" text-anchor="middle" font-size="21.3333" fill="#2e7d32">~150MB production</text>
  <text x="640" y="648" text-anchor="middle" font-size="21.3333" fill="#555">Build tools discarded, only runtime artifacts remain</text>

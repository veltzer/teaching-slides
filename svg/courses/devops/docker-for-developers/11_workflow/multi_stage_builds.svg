    <ns0:marker id="arrowd2_10_workflow" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <ns0:path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="632.0988" y="64" text-anchor="middle" font-size="25.284" font-weight="bold">Multi-stage Build Flow</ns0:text>
  <ns0:rect x="42.14" y="106.6667" width="358.1893" height="248.8889" fill="#fff3e0" stroke="#e65100" stroke-width="4.214" rx="10.535" />
  <ns0:text x="221.2346" y="177.7778" text-anchor="middle" font-size="23.177" font-weight="bold" fill="#e65100">Stage 1: Build</ns0:text>
  <ns0:text x="221.2346" y="241.7778" text-anchor="middle" font-size="21.0699">FROM node:18 AS build</ns0:text>
  <ns0:text x="221.2346" y="295.1111" text-anchor="middle" font-size="21.0699">npm install + compile</ns0:text>
  <ns0:line x1="400.3292" y1="231.1111" x2="463.5391" y2="231.1111" stroke="#333" stroke-width="4.214" marker-end="url(#arrowd2_10_workflow)" />
  <ns0:rect x="463.5391" y="106.6667" width="337.1193" height="248.8889" fill="#f3e5f5" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="632.0988" y="177.7778" text-anchor="middle" font-size="23.177" font-weight="bold">COPY --from=build</ns0:text>
  <ns0:text x="632.0988" y="241.7778" text-anchor="middle" font-size="21.0699">Only artifacts</ns0:text>
  <ns0:text x="632.0988" y="295.1111" text-anchor="middle" font-size="21.0699">No dev dependencies</ns0:text>
  <ns0:line x1="800.6585" y1="231.1111" x2="863.8683" y2="231.1111" stroke="#333" stroke-width="4.214" marker-end="url(#arrowd2_10_workflow)" />
  <ns0:rect x="863.8683" y="106.6667" width="358.1893" height="248.8889" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4.214" rx="10.535" />
  <ns0:text x="1042.963" y="177.7778" text-anchor="middle" font-size="23.177" font-weight="bold" fill="#2e7d32">Stage 2: Runtime</ns0:text>
  <ns0:text x="1042.963" y="241.7778" text-anchor="middle" font-size="21.0699">FROM node:18-alpine</ns0:text>
  <ns0:text x="1042.963" y="295.1111" text-anchor="middle" font-size="21.0699">Minimal final image</ns0:text>
  <ns0:rect x="42.14" y="426.6667" width="358.1893" height="106.6667" fill="#ffebee" stroke="#333" stroke-width="2.107" rx="8.428" />
  <ns0:text x="221.2346" y="497.7778" text-anchor="middle" font-size="21.0699" fill="#c62828">~900MB with build tools</ns0:text>
  <ns0:rect x="863.8683" y="426.6667" width="358.1893" height="106.6667" fill="#e8f5e9" stroke="#333" stroke-width="2.107" rx="8.428" />
  <ns0:text x="1042.963" y="497.7778" text-anchor="middle" font-size="21.0699" fill="#2e7d32">~150MB production</ns0:text>
  <ns0:text x="632.0988" y="640" text-anchor="middle" font-size="21.0699" fill="#555">Build tools discarded, only runtime artifacts remain</ns0:text>
</ns0:svg>
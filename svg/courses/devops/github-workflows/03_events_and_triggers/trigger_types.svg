<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1087.5767" height="474.8286" fill="var(--bg)" rx="5.7089" x="152.4233" y="145.1714"/>
  <rect x="568.7611" y="303.4475" width="254.9008" height="65.9485" rx="5.7089" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="696.2116" y="333.1243" text-anchor="middle" font-family="sans-serif" font-size="17.9655" font-weight="bold" fill="var(--bg)">Workflow</text>
  <text x="696.2116" y="351.5899" text-anchor="middle" font-family="monospace" font-size="11.9769" fill="var(--primary-accent)">.github/workflows/*.yml</text>
  <rect x="186.41" y="158.361" width="288.8875" height="118.7072" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="330.8538" y="179.4646" text-anchor="middle" font-family="sans-serif" font-size="13.4741" font-weight="bold" fill="var(--primary-accent)">Code Events</text>
  <text x="203.4034" y="197.9301" font-family="monospace" font-size="11.9769" fill="var(--text)">push</text>
  <text x="322.3571" y="197.9301" font-family="sans-serif" font-size="10.4797" fill="var(--text-muted)">branch/tag pushed</text>
  <text x="203.4034" y="215.0767" font-family="monospace" font-size="11.9769" fill="var(--text)">pull_request</text>
  <text x="322.3571" y="215.0767" font-family="sans-serif" font-size="10.4797" fill="var(--text-muted)">PR opened/updated</text>
  <text x="203.4034" y="232.2232" font-family="monospace" font-size="11.9769" fill="var(--text)">create / delete</text>
  <text x="322.3571" y="232.2232" font-family="sans-serif" font-size="10.4797" fill="var(--text-muted)">branch or tag</text>
  <text x="203.4034" y="249.3698" font-family="monospace" font-size="11.9769" fill="var(--text)">release</text>
  <text x="322.3571" y="249.3698" font-family="sans-serif" font-size="10.4797" fill="var(--text-muted)">published/edited</text>
  <text x="203.4034" y="266.5165" font-family="monospace" font-size="11.9769" fill="var(--text)">workflow_run</text>
  <text x="322.3571" y="266.5165" font-family="sans-serif" font-size="10.4797" fill="var(--text-muted)">another workflow ends</text>
  <line x1="475.2976" y1="224.3095" x2="567.0619" y2="319.9347" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="917.1256" y="158.361" width="288.8875" height="72.5433" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1061.5694" y="179.4646" text-anchor="middle" font-family="sans-serif" font-size="13.4741" font-weight="bold" fill="var(--primary-accent)">Scheduled</text>
  <text x="934.119" y="197.9301" font-family="monospace" font-size="11.9769" fill="var(--text)">schedule</text>
  <text x="1027.5827" y="197.9301" font-family="sans-serif" font-size="10.4797" fill="var(--text-muted)">cron expression</text>
  <text x="934.119" y="215.0767" font-family="monospace" font-size="11.2285" fill="var(--text-faint)">- cron: '0 2 * * 1'</text>
  <text x="934.119" y="226.9474" font-family="sans-serif" font-size="10" fill="var(--text-faint)">every Monday at 2am UTC</text>
  <line x1="917.1256" y1="197.9301" x2="825.3614" y2="319.9347" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="186.41" y="422.1547" width="288.8875" height="85.733" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="330.8538" y="443.2582" text-anchor="middle" font-family="sans-serif" font-size="13.4741" font-weight="bold" fill="var(--primary-accent)">Manual</text>
  <text x="203.4034" y="461.7238" font-family="monospace" font-size="11.9769" fill="var(--text)">workflow_dispatch</text>
  <text x="203.4034" y="476.2324" font-family="sans-serif" font-size="10.4797" fill="var(--text-muted)">triggered from UI or API</text>
  <text x="203.4034" y="492.0601" font-family="monospace" font-size="11.9769" fill="var(--text)">repository_dispatch</text>
  <text x="203.4034" y="506.5687" font-family="sans-serif" font-size="10.4797" fill="var(--text-muted)">external HTTP POST</text>
  <line x1="475.2976" y1="461.7238" x2="567.0619" y2="392.4779" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="917.1256" y="369.396" width="288.8875" height="125.302" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1061.5694" y="390.4995" text-anchor="middle" font-family="sans-serif" font-size="13.4741" font-weight="bold" fill="var(--primary-accent)">Repo Activity</text>
  <text x="934.119" y="408.9651" font-family="monospace" font-size="11.9769" fill="var(--text)">issues</text>
  <text x="1036.0793" y="408.9651" font-family="sans-serif" font-size="10.4797" fill="var(--text-muted)">opened/labeled/…</text>
  <text x="934.119" y="426.1117" font-family="monospace" font-size="11.9769" fill="var(--text)">issue_comment</text>
  <text x="934.119" y="443.2582" font-family="monospace" font-size="11.9769" fill="var(--text)">fork / star</text>
  <text x="934.119" y="460.4049" font-family="monospace" font-size="11.9769" fill="var(--text)">deployment</text>
  <text x="934.119" y="477.5514" font-family="monospace" font-size="11.9769" fill="var(--text)">registry_package</text>
  <line x1="917.1256" y1="428.7496" x2="825.3614" y2="392.4779" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="322.3571" y="521.0774" width="747.7091" height="29.0173" rx="5.7089" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="696.2116" y="538.8835" text-anchor="middle" font-family="sans-serif" font-size="11.9769" fill="var(--primary-accent)">All triggers support filters: <tspan font-family="monospace">branches:</tspan>, <tspan font-family="monospace">paths:</tspan>, <tspan font-family="monospace">tags:</tspan> — limit when the workflow runs</text>
</svg>
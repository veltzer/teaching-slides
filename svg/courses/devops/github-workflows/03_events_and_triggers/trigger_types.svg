  <text x="568.8889" y="530.6667" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--primary-dk)">All triggers support filters: <tspan font-family="monospace">branches:</tspan>, <tspan font-family="monospace">paths:</tspan>, <tspan font-family="monospace">tags:</tspan> — limit when the workflow runs</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="489.999933" y="254.814743" width="300.000027" height="97.643252" rx="6.822423" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640.000053" y="298.754128" text-anchor="middle" font-family="sans-serif" font-size="23.715537" font-weight="bold" fill="var(--bg)">Workflow</text>
  <text x="640.000053" y="326.094243" text-anchor="middle" font-family="monospace" font-size="15.810168" fill="var(--primary-accent)">.github/workflows/*.yml</text>
  <rect x="40" y="40" width="339.999924" height="175.75766" rx="6.822423" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="210.000015" y="71.245933" text-anchor="middle" font-family="sans-serif" font-size="17.786624" font-weight="bold" fill="var(--primary-accent)">Code Events</text>
  <text x="60.000002" y="98.585927" font-family="monospace" font-size="15.810168" fill="var(--text)">push</text>
  <text x="200.000014" y="98.585927" font-family="sans-serif" font-size="13.833826" fill="var(--text-muted)">branch/tag pushed</text>
  <text x="60.000002" y="123.973195" font-family="monospace" font-size="15.810168" fill="var(--text)">pull_request</text>
  <text x="200.000014" y="123.973195" font-family="sans-serif" font-size="13.833826" fill="var(--text-muted)">PR opened/updated</text>
  <text x="60.000002" y="149.36022" font-family="monospace" font-size="15.810168" fill="var(--text)">create / delete</text>
  <text x="200.000014" y="149.36022" font-family="sans-serif" font-size="13.833826" fill="var(--text-muted)">branch or tag</text>
  <text x="60.000002" y="174.747487" font-family="monospace" font-size="15.810168" fill="var(--text)">release</text>
  <text x="200.000014" y="174.747487" font-family="sans-serif" font-size="13.833826" fill="var(--text-muted)">published/edited</text>
  <text x="60.000002" y="200.134754" font-family="monospace" font-size="15.810168" fill="var(--text)">workflow_run</text>
  <text x="200.000014" y="200.134754" font-family="sans-serif" font-size="13.833826" fill="var(--text-muted)">another workflow ends</text>
  <line x1="380.000137" y1="137.643252" x2="488.000146" y2="279.225647" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="900.000076" y="40" width="339.999924" height="107.407493" rx="6.822423" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1070.000092" y="71.245933" text-anchor="middle" font-family="sans-serif" font-size="17.786624" font-weight="bold" fill="var(--primary-accent)">Scheduled</text>
  <text x="920.000078" y="98.585927" font-family="monospace" font-size="15.810168" fill="var(--text)">schedule</text>
  <text x="1030.000195" y="98.585927" font-family="sans-serif" font-size="13.833826" fill="var(--text-muted)">cron expression</text>
  <text x="920.000078" y="123.973195" font-family="monospace" font-size="14.822281" fill="var(--text-faint)">- cron: '0 2 * * 1'</text>
  <text x="920.000078" y="141.548827" font-family="sans-serif" font-size="13.200592" fill="var(--text-faint)">every Monday at 2am UTC</text>
  <line x1="900.000076" y1="98.585927" x2="792.000174" y2="279.225647" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="40" y="430.572403" width="339.999924" height="126.936095" rx="6.822423" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="210.000015" y="461.818215" text-anchor="middle" font-family="sans-serif" font-size="17.786624" font-weight="bold" fill="var(--primary-accent)">Manual</text>
  <text x="60.000002" y="489.15833" font-family="monospace" font-size="15.810168" fill="var(--text)">workflow_dispatch</text>
  <text x="60.000002" y="510.639659" font-family="sans-serif" font-size="13.833826" fill="var(--text-muted)">triggered from UI or API</text>
  <text x="60.000002" y="534.0742" font-family="monospace" font-size="15.810168" fill="var(--text)">repository_dispatch</text>
  <text x="60.000002" y="555.555529" font-family="sans-serif" font-size="13.833826" fill="var(--text-muted)">external HTTP POST</text>
  <line x1="380.000137" y1="489.15833" x2="488.000146" y2="386.633018" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="900.000076" y="352.457995" width="339.999924" height="185.521901" rx="6.822423" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1070.000092" y="383.703807" text-anchor="middle" font-family="sans-serif" font-size="17.786624" font-weight="bold" fill="var(--primary-accent)">Repo Activity</text>
  <text x="920.000078" y="411.043922" font-family="monospace" font-size="15.810168" fill="var(--text)">issues</text>
  <text x="1040.000089" y="411.043922" font-family="sans-serif" font-size="13.833826" fill="var(--text-muted)">opened/labeled/…</text>
  <text x="920.000078" y="436.431069" font-family="monospace" font-size="15.810168" fill="var(--text)">issue_comment</text>
  <text x="920.000078" y="461.818215" font-family="monospace" font-size="15.810168" fill="var(--text)">fork / star</text>
  <text x="920.000078" y="487.205482" font-family="monospace" font-size="15.810168" fill="var(--text)">deployment</text>
  <text x="920.000078" y="512.592629" font-family="monospace" font-size="15.810168" fill="var(--text)">registry_package</text>
  <line x1="900.000076" y1="440.336765" x2="792.000174" y2="386.633018" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="200.000014" y="577.0371" width="880.000185" height="42.9629" rx="6.822423" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000053" y="603.400731" text-anchor="middle" font-family="sans-serif" font-size="15.810168" fill="var(--primary-accent)">All triggers support filters: <tspan font-family="monospace">branches:</tspan>, <tspan font-family="monospace">paths:</tspan>, <tspan font-family="monospace">tags:</tspan> — limit when the workflow runs</text>
</svg>
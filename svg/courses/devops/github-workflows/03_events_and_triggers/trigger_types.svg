<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Centre: Workflow -->
  <rect x="490" y="240" width="300" height="100" rx="8" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="285" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Workflow</text>
  <text x="640" y="313" text-anchor="middle" font-family="monospace" font-size="16" fill="#bbdefb">.github/workflows/*.yml</text>

  <!-- Category 1: Code events (top-left) -->
  <rect x="40" y="20" width="340" height="180" rx="8" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="210" y="52" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1565c0">Code Events</text>
  <text x="60"  y="80"  font-family="monospace" font-size="16" fill="#212121">push</text>
  <text x="200" y="80"  font-family="sans-serif" font-size="14" fill="#555555">branch/tag pushed</text>
  <text x="60"  y="106" font-family="monospace" font-size="16" fill="#212121">pull_request</text>
  <text x="200" y="106" font-family="sans-serif" font-size="14" fill="#555555">PR opened/updated</text>
  <text x="60"  y="132" font-family="monospace" font-size="16" fill="#212121">create / delete</text>
  <text x="200" y="132" font-family="sans-serif" font-size="14" fill="#555555">branch or tag</text>
  <text x="60"  y="158" font-family="monospace" font-size="16" fill="#212121">release</text>
  <text x="200" y="158" font-family="sans-serif" font-size="14" fill="#555555">published/edited</text>
  <text x="60"  y="184" font-family="monospace" font-size="16" fill="#212121">workflow_run</text>
  <text x="200" y="184" font-family="sans-serif" font-size="14" fill="#555555">another workflow ends</text>
  <line x1="380" y1="120" x2="488" y2="265" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <!-- Category 2: Scheduled (top-right) -->
  <rect x="900" y="20" width="340" height="110" rx="8" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1070" y="52"  text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1565c0">Scheduled</text>
  <text x="920"  y="80"  font-family="monospace" font-size="16" fill="#212121">schedule</text>
  <text x="1030" y="80"  font-family="sans-serif" font-size="14" fill="#555555">cron expression</text>
  <text x="920"  y="106" font-family="monospace" font-size="15" fill="#9e9e9e">- cron: '0 2 * * 1'</text>
  <text x="920"  y="124" font-family="sans-serif" font-size="13" fill="#9e9e9e">every Monday at 2am UTC</text>
  <line x1="900" y1="80" x2="792" y2="265" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <!-- Category 3: Manual (bottom-left) -->
  <rect x="40" y="420" width="340" height="130" rx="8" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="210" y="452" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1565c0">Manual</text>
  <text x="60"  y="480" font-family="monospace" font-size="16" fill="#212121">workflow_dispatch</text>
  <text x="60"  y="502" font-family="sans-serif" font-size="14" fill="#555555">triggered from UI or API</text>
  <text x="60"  y="526" font-family="monospace" font-size="16" fill="#212121">repository_dispatch</text>
  <text x="60"  y="548" font-family="sans-serif" font-size="14" fill="#555555">external HTTP POST</text>
  <line x1="380" y1="480" x2="488" y2="375" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <!-- Category 4: Repo activity (bottom-right) -->
  <rect x="900" y="340" width="340" height="190" rx="8" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1070" y="372" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1565c0">Repo Activity</text>
  <text x="920"  y="400" font-family="monospace" font-size="16" fill="#212121">issues</text>
  <text x="1040" y="400" font-family="sans-serif" font-size="14" fill="#555555">opened/labeled/…</text>
  <text x="920"  y="426" font-family="monospace" font-size="16" fill="#212121">issue_comment</text>
  <text x="920"  y="452" font-family="monospace" font-size="16" fill="#212121">fork / star</text>
  <text x="920"  y="478" font-family="monospace" font-size="16" fill="#212121">deployment</text>
  <text x="920"  y="504" font-family="monospace" font-size="16" fill="#212121">registry_package</text>
  <line x1="900" y1="430" x2="792" y2="375" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <!-- Filter note -->
  <rect x="200" y="570" width="880" height="44" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="640" y="597" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1565c0">All triggers support filters: <tspan font-family="monospace">branches:</tspan>, <tspan font-family="monospace">paths:</tspan>, <tspan font-family="monospace">tags:</tspan> — limit when the workflow runs</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="499.3748" y="233.3332" width="281.25" height="80.5557" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="639.9999" y="269.5832" text-anchor="middle" font-family="sans-serif" font-size="20.8567" font-weight="bold" fill="var(--bg)">Workflow</text>
  <text x="639.9999" y="292.1388" text-anchor="middle" font-family="monospace" font-size="13.9043" fill="var(--primary-accent)">.github/workflows/*.yml</text>
  <rect x="77.4999" y="56.111" width="318.7499" height="145.0001" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="236.8749" y="81.8889" text-anchor="middle" font-family="sans-serif" font-size="15.6425" font-weight="bold" fill="var(--primary-accent)">Code Events</text>
  <text x="96.2499" y="104.4444" font-family="monospace" font-size="13.9043" fill="var(--text)">push</text>
  <text x="227.4999" y="104.4444" font-family="sans-serif" font-size="12.1662" fill="var(--text-muted)">branch/tag pushed</text>
  <text x="96.2499" y="125.3889" font-family="monospace" font-size="13.9043" fill="var(--text)">pull_request</text>
  <text x="227.4999" y="125.3889" font-family="sans-serif" font-size="12.1662" fill="var(--text-muted)">PR opened/updated</text>
  <text x="96.2499" y="146.3332" font-family="monospace" font-size="13.9043" fill="var(--text)">create / delete</text>
  <text x="227.4999" y="146.3332" font-family="sans-serif" font-size="12.1662" fill="var(--text-muted)">branch or tag</text>
  <text x="96.2499" y="167.2777" font-family="monospace" font-size="13.9043" fill="var(--text)">release</text>
  <text x="227.4999" y="167.2777" font-family="sans-serif" font-size="12.1662" fill="var(--text-muted)">published/edited</text>
  <text x="96.2499" y="188.2222" font-family="monospace" font-size="13.9043" fill="var(--text)">workflow_run</text>
  <text x="227.4999" y="188.2222" font-family="sans-serif" font-size="12.1662" fill="var(--text-muted)">another workflow ends</text>
  <line x1="396.25" y1="136.6667" x2="497.5" y2="253.4722" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="883.7499" y="56.111" width="318.7499" height="88.6112" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1043.1249" y="81.8889" text-anchor="middle" font-family="sans-serif" font-size="15.6425" font-weight="bold" fill="var(--primary-accent)">Scheduled</text>
  <text x="902.4999" y="104.4444" font-family="monospace" font-size="13.9043" fill="var(--text)">schedule</text>
  <text x="1005.625" y="104.4444" font-family="sans-serif" font-size="12.1662" fill="var(--text-muted)">cron expression</text>
  <text x="902.4999" y="125.3889" font-family="monospace" font-size="13.0355" fill="var(--text-faint)">- cron: '0 2 * * 1'</text>
  <text x="902.4999" y="139.8888" font-family="sans-serif" font-size="11.6093" fill="var(--text-faint)">every Monday at 2am UTC</text>
  <line x1="883.7499" y1="104.4444" x2="782.5" y2="253.4722" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="77.4999" y="378.3333" width="318.7499" height="104.7223" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="236.8749" y="404.1111" text-anchor="middle" font-family="sans-serif" font-size="15.6425" font-weight="bold" fill="var(--primary-accent)">Manual</text>
  <text x="96.2499" y="426.6667" font-family="monospace" font-size="13.9043" fill="var(--text)">workflow_dispatch</text>
  <text x="96.2499" y="444.3888" font-family="sans-serif" font-size="12.1662" fill="var(--text-muted)">triggered from UI or API</text>
  <text x="96.2499" y="463.7223" font-family="monospace" font-size="13.9043" fill="var(--text)">repository_dispatch</text>
  <text x="96.2499" y="481.4444" font-family="sans-serif" font-size="12.1662" fill="var(--text-muted)">external HTTP POST</text>
  <line x1="396.25" y1="426.6667" x2="497.5" y2="342.0833" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="883.7499" y="313.8889" width="318.7499" height="153.0556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1043.1249" y="339.6667" text-anchor="middle" font-family="sans-serif" font-size="15.6425" font-weight="bold" fill="var(--primary-accent)">Repo Activity</text>
  <text x="902.4999" y="362.2223" font-family="monospace" font-size="13.9043" fill="var(--text)">issues</text>
  <text x="1014.9999" y="362.2223" font-family="sans-serif" font-size="12.1662" fill="var(--text-muted)">opened/labeled/…</text>
  <text x="902.4999" y="383.1667" font-family="monospace" font-size="13.9043" fill="var(--text)">issue_comment</text>
  <text x="902.4999" y="404.1111" font-family="monospace" font-size="13.9043" fill="var(--text)">fork / star</text>
  <text x="902.4999" y="425.0556" font-family="monospace" font-size="13.9043" fill="var(--text)">deployment</text>
  <text x="902.4999" y="446" font-family="monospace" font-size="13.9043" fill="var(--text)">registry_package</text>
  <line x1="883.7499" y1="386.3889" x2="782.5" y2="342.0833" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="227.4999" y="499.1667" width="825.0001" height="35.4444" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="639.9999" y="520.9167" text-anchor="middle" font-family="sans-serif" font-size="13.9043" fill="var(--primary-accent)">All triggers support filters: <tspan font-family="monospace">branches:</tspan>, <tspan font-family="monospace">paths:</tspan>, <tspan font-family="monospace">tags:</tspan> — limit when the workflow runs</text>
</svg>
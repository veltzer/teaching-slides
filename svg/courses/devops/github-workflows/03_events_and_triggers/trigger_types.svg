<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="489.999933" y="254.814743" width="300.000027" height="97.643252" rx="6.822423" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000053" y="298.754128" text-anchor="middle" font-size="23.715537" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Workflow</text>
  <text x="640.000053" y="326.094243" text-anchor="middle" font-size="15.810168" fill="var(--primary-accent)" font-family="Courier New, monospace">.github/workflows/*.yml</text>
  <rect x="40" y="40" width="339.999924" height="175.75766" rx="6.822423" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="210.000015" y="71.245933" text-anchor="middle" font-size="17.786624" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Code Events</text>
  <text x="60.000002" y="98.585927" font-size="15.810168" fill="var(--text)" font-family="Courier New, monospace">push</text>
  <text x="200.000014" y="98.585927" font-size="13.833826" fill="var(--text-muted)" font-family="Arial, sans-serif">branch/tag pushed</text>
  <text x="60.000002" y="123.973195" font-size="15.810168" fill="var(--text)" font-family="Courier New, monospace">pull_request</text>
  <text x="200.000014" y="123.973195" font-size="13.833826" fill="var(--text-muted)" font-family="Arial, sans-serif">PR opened/updated</text>
  <text x="60.000002" y="149.36022" font-size="15.810168" fill="var(--text)" font-family="Courier New, monospace">create / delete</text>
  <text x="200.000014" y="149.36022" font-size="13.833826" fill="var(--text-muted)" font-family="Arial, sans-serif">branch or tag</text>
  <text x="60.000002" y="174.747487" font-size="15.810168" fill="var(--text)" font-family="Courier New, monospace">release</text>
  <text x="200.000014" y="174.747487" font-size="13.833826" fill="var(--text-muted)" font-family="Arial, sans-serif">published/edited</text>
  <text x="60.000002" y="200.134754" font-size="15.810168" fill="var(--text)" font-family="Courier New, monospace">workflow_run</text>
  <text x="200.000014" y="200.134754" font-size="13.833826" fill="var(--text-muted)" font-family="Arial, sans-serif">another workflow ends</text>
  <line x1="380.000137" y1="137.643252" x2="488.000146" y2="279.225647" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="900.000076" y="40" width="339.999924" height="107.407493" rx="6.822423" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1070.000092" y="71.245933" text-anchor="middle" font-size="17.786624" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Scheduled</text>
  <text x="920.000078" y="98.585927" font-size="15.810168" fill="var(--text)" font-family="Courier New, monospace">schedule</text>
  <text x="1030.000195" y="98.585927" font-size="13.833826" fill="var(--text-muted)" font-family="Arial, sans-serif">cron expression</text>
  <text x="920.000078" y="123.973195" font-size="14.822281" fill="var(--text-faint)" font-family="Courier New, monospace">- cron: '0 2 * * 1'</text>
  <text x="920.000078" y="141.548827" font-size="13.200592" fill="var(--text-faint)" font-family="Arial, sans-serif">every Monday at 2am UTC</text>
  <line x1="900.000076" y1="98.585927" x2="792.000174" y2="279.225647" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="40" y="430.572403" width="339.999924" height="126.936095" rx="6.822423" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="210.000015" y="461.818215" text-anchor="middle" font-size="17.786624" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Manual</text>
  <text x="60.000002" y="489.15833" font-size="15.810168" fill="var(--text)" font-family="Courier New, monospace">workflow_dispatch</text>
  <text x="60.000002" y="510.639659" font-size="13.833826" fill="var(--text-muted)" font-family="Arial, sans-serif">triggered from UI or API</text>
  <text x="60.000002" y="534.0742" font-size="15.810168" fill="var(--text)" font-family="Courier New, monospace">repository_dispatch</text>
  <text x="60.000002" y="555.555529" font-size="13.833826" fill="var(--text-muted)" font-family="Arial, sans-serif">external HTTP POST</text>
  <line x1="380.000137" y1="489.15833" x2="488.000146" y2="386.633018" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="900.000076" y="352.457995" width="339.999924" height="185.521901" rx="6.822423" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1070.000092" y="383.703807" text-anchor="middle" font-size="17.786624" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Repo Activity</text>
  <text x="920.000078" y="411.043922" font-size="15.810168" fill="var(--text)" font-family="Courier New, monospace">issues</text>
  <text x="1040.000089" y="411.043922" font-size="13.833826" fill="var(--text-muted)" font-family="Arial, sans-serif">opened/labeled/…</text>
  <text x="920.000078" y="436.431069" font-size="15.810168" fill="var(--text)" font-family="Courier New, monospace">issue_comment</text>
  <text x="920.000078" y="461.818215" font-size="15.810168" fill="var(--text)" font-family="Courier New, monospace">fork / star</text>
  <text x="920.000078" y="487.205482" font-size="15.810168" fill="var(--text)" font-family="Courier New, monospace">deployment</text>
  <text x="920.000078" y="512.592629" font-size="15.810168" fill="var(--text)" font-family="Courier New, monospace">registry_package</text>
  <line x1="900.000076" y1="440.336765" x2="792.000174" y2="386.633018" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="200.000014" y="577.0371" width="880.000185" height="42.9629" rx="6.822423" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000053" y="603.400731" text-anchor="middle" font-size="15.810168" fill="var(--primary-accent)" font-family="Arial, sans-serif">All triggers support filters: <tspan font-family="Courier New, monospace" fill="var(--text)">branches:</tspan>, <tspan font-family="Courier New, monospace" fill="var(--text)">paths:</tspan>, <tspan font-family="Courier New, monospace" fill="var(--text)">tags:</tspan> — limit when the workflow runs</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="43.549488" rx="6.422698" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="67.713311" font-family="Arial, sans-serif" font-size="17.760258" font-weight="bold" fill="var(--bg)" text-anchor="middle">Action Types</text>

  <!-- Three type columns -->
  <rect x="40" y="99.385666" width="373.770492" height="247.440273" rx="6.422698" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.885246" y="123.139932" font-family="Arial, sans-serif" font-size="13.813511" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">JavaScript</text>
  <text x="54.754098" y="144.914676" font-family="Arial, sans-serif" font-size="11.840137" fill="var(--text)">Node.js (node20)</text>
  <text x="54.754098" y="164.709898" font-family="Arial, sans-serif" font-size="11.840137" fill="var(--text)">JS/TS</text>
  <text x="54.754098" y="184.505119" font-family="Arial, sans-serif" font-size="11.840137" fill="var(--text)">Fast</text>
  <text x="54.754098" y="204.300341" font-family="Arial, sans-serif" font-size="11.840137" fill="var(--text)">All runners</text>
  <text x="54.754098" y="228.054608" font-size="10.853503" fill="var(--text-muted)" font-family="Courier New, monospace">runs:</text>
  <text x="69.508197" y="245.870307" font-size="10.853503" fill="var(--text-muted)" font-family="Courier New, monospace">  using: node20</text>
  <text x="69.508197" y="263.686007" font-size="10.853503" fill="var(--text-muted)" font-family="Courier New, monospace">  main: index.js</text>
  <text x="69.508197" y="281.501706" font-size="10.853503" fill="var(--text-muted)" font-family="Courier New, monospace">  pre/post: ...</text>
  <text x="69.508197" y="299.317406" font-size="10.853503" fill="var(--text-muted)" font-family="Courier New, monospace"/>
  <text x="54.754098" y="323.071672" font-family="Arial, sans-serif" font-size="10.853503" fill="var(--text-faint)">@actions/core</text>

  <rect x="443.278689" y="99.385666" width="373.770492" height="247.440273" rx="6.422698" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630.163934" y="123.139932" font-family="Arial, sans-serif" font-size="13.813511" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Docker</text>
  <text x="458.032787" y="144.914676" font-family="Arial, sans-serif" font-size="11.840137" fill="var(--text)">Docker</text>
  <text x="458.032787" y="164.709898" font-family="Arial, sans-serif" font-size="11.840137" fill="var(--text)">Any language</text>
  <text x="458.032787" y="184.505119" font-family="Arial, sans-serif" font-size="11.840137" fill="var(--text)">Slower</text>
  <text x="458.032787" y="204.300341" font-family="Arial, sans-serif" font-size="11.840137" fill="var(--text)">Linux only</text>
  <text x="458.032787" y="228.054608" font-size="10.853503" fill="var(--text-muted)" font-family="Courier New, monospace">runs:</text>
  <text x="472.786885" y="245.870307" font-size="10.853503" fill="var(--text-muted)" font-family="Courier New, monospace">  using: docker</text>
  <text x="472.786885" y="263.686007" font-size="10.853503" fill="var(--text-muted)" font-family="Courier New, monospace">  image: Dockerfile</text>
  <text x="472.786885" y="281.501706" font-size="10.853503" fill="var(--text-muted)" font-family="Courier New, monospace">  args:</text>
  <text x="487.540984" y="299.317406" font-size="10.853503" fill="var(--text-muted)" font-family="Courier New, monospace">    - ${{ inputs.x }}</text>
  <text x="458.032787" y="323.071672" font-family="Arial, sans-serif" font-size="10.853503" fill="var(--text-faint)">ENTRYPOINT is main</text>

  <rect x="846.557377" y="99.385666" width="393.442623" height="247.440273" rx="6.422698" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1043.278689" y="123.139932" font-family="Arial, sans-serif" font-size="13.813511" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Composite</text>
  <text x="861.311475" y="144.914676" font-family="Arial, sans-serif" font-size="11.840137" fill="var(--text)">Caller runner</text>
  <text x="861.311475" y="164.709898" font-family="Arial, sans-serif" font-size="11.840137" fill="var(--text)">YAML + shell</text>
  <text x="861.311475" y="184.505119" font-family="Arial, sans-serif" font-size="11.840137" fill="var(--text)">Fast</text>
  <text x="861.311475" y="204.300341" font-family="Arial, sans-serif" font-size="11.840137" fill="var(--text)">All runners</text>
  <text x="861.311475" y="228.054608" font-size="10.853503" fill="var(--text-muted)" font-family="Courier New, monospace">runs:</text>
  <text x="876.065574" y="245.870307" font-size="10.853503" fill="var(--text-muted)" font-family="Courier New, monospace">  using: composite</text>
  <text x="876.065574" y="263.686007" font-size="10.853503" fill="var(--text-muted)" font-family="Courier New, monospace">  steps:</text>
  <text x="890.819672" y="281.501706" font-size="10.853503" fill="var(--text-muted)" font-family="Courier New, monospace">    - run: echo</text>
  <text x="905.57377" y="299.317406" font-size="10.853503" fill="var(--text-muted)" font-family="Courier New, monospace">      shell: bash</text>
  <text x="890.819672" y="317.133106" font-size="10.853503" fill="var(--text-muted)" font-family="Courier New, monospace">    - uses: checkout</text>
  <text x="861.311475" y="336.928328" font-family="Arial, sans-serif" font-size="10.853503" fill="var(--text-faint)">shell: required</text>

  <!-- action.yml structure -->
  <rect x="40" y="366.62116" width="590.163934" height="253.37884" rx="6.422698" fill="var(--surface)"/>
  <text x="335.081967" y="390.375427" font-family="Arial, sans-serif" font-size="13.813511" font-weight="bold" fill="var(--text)" text-anchor="middle">action.yml</text>
  <text x="54.754098" y="414.129693" font-size="10.853503" fill="var(--text)" font-family="Courier New, monospace">name: "Name"</text>
  <text x="54.754098" y="431.945392" font-size="10.853503" fill="var(--text)" font-family="Courier New, monospace">description: "..."</text>
  <text x="54.754098" y="449.761092" font-size="10.853503" fill="var(--text)" font-family="Courier New, monospace">author: "..."</text>
  <text x="54.754098" y="469.556314" font-size="10.853503" fill="var(--text)" font-family="Courier New, monospace">branding:</text>
  <text x="69.508197" y="487.372014" font-size="10.853503" fill="var(--text)" font-family="Courier New, monospace">  icon: "check-circle"</text>
  <text x="69.508197" y="505.187713" font-size="10.853503" fill="var(--text)" font-family="Courier New, monospace">  color: "green"</text>
  <text x="54.754098" y="524.982935" font-size="10.853503" fill="var(--text)" font-family="Courier New, monospace">inputs:</text>
  <text x="69.508197" y="542.798635" font-size="10.853503" fill="var(--text)" font-family="Courier New, monospace">  token:</text>
  <text x="84.262295" y="560.614334" font-size="10.853503" fill="var(--text)" font-family="Courier New, monospace">    description: "..."</text>
  <text x="84.262295" y="578.430034" font-size="10.853503" fill="var(--text)" font-family="Courier New, monospace">    required: true</text>
  <text x="54.754098" y="598.225256" font-size="10.853503" fill="var(--text)" font-family="Courier New, monospace">outputs:</text>
  <text x="69.508197" y="616.040956" font-size="10.853503" fill="var(--text)" font-family="Courier New, monospace">  result:</text>

  <!-- Inputs/Outputs/Branding -->
  <rect x="649.836066" y="366.62116" width="590.163934" height="253.37884" rx="6.422698" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="944.918033" y="390.375427" font-family="Arial, sans-serif" font-size="13.813511" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">I/O</text>
  <text x="664.590164" y="414.129693" font-family="Arial, sans-serif" font-size="12.826877" font-weight="bold" fill="var(--primary-accent)">Inputs:</text>
  <text x="664.590164" y="433.924915" font-size="10.853503" fill="var(--text)" font-family="Courier New, monospace">${{ inputs.token }}</text>
  <text x="664.590164" y="451.740614" font-size="10.853503" fill="var(--text-muted)" font-family="Courier New, monospace">process.env.INPUT_TOKEN</text>
  <text x="664.590164" y="475.494881" font-family="Arial, sans-serif" font-size="12.826877" font-weight="bold" fill="var(--primary-accent)">Outputs:</text>
  <text x="664.590164" y="495.290102" font-size="10.853503" fill="var(--text)" font-family="Courier New, monospace">echo k=v &gt;&gt; $GITHUB_OUTPUT</text>
  <text x="664.590164" y="513.105802" font-size="10.853503" fill="var(--text-muted)" font-family="Courier New, monospace">core.setOutput(k,v)</text>
  <text x="664.590164" y="536.860068" font-family="Arial, sans-serif" font-size="12.826877" font-weight="bold" fill="var(--primary-accent)">Branding:</text>
  <text x="664.590164" y="556.65529" font-family="Arial, sans-serif" font-size="11.840137" fill="var(--text)">icon: feather name</text>
  <text x="664.590164" y="576.450512" font-family="Arial, sans-serif" font-size="11.840137" fill="var(--text)">color: named</text>
  <text x="664.590164" y="598.225256" font-family="Arial, sans-serif" font-size="11.840137" fill="var(--text-muted)">Marketplace</text>
  <text x="664.590164" y="618.020478" font-family="Arial, sans-serif" font-size="11.840137" fill="var(--text-muted)">Not private</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <rect x="68.125" y="52.6875" width="1143.75" height="39.875" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="78.0625" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--bg)" text-anchor="middle">Custom GitHub Action Types</text>

  <!-- Three type columns -->
  <rect x="68.125" y="107.0625" width="356.25" height="226.5625" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="246.25" y="128.8125" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">JavaScript Action</text>
  <text x="82.1875" y="148.75" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Runtime: Node.js (node20)</text>
  <text x="82.1875" y="166.875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Language: JavaScript / TypeScript</text>
  <text x="82.1875" y="185" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Speed: fast (no container)</text>
  <text x="82.1875" y="203.125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Platform: all runners</text>
  <text x="82.1875" y="224.875" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">runs:</text>
  <text x="96.25" y="241.1875" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">  using: node20</text>
  <text x="96.25" y="257.5" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">  main: index.js</text>
  <text x="96.25" y="273.8125" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">  pre: setup.js</text>
  <text x="96.25" y="290.125" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">  post: cleanup.js</text>
  <text x="82.1875" y="311.875" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)">Use @actions/core, @actions/exec, @actions/io</text>

  <rect x="452.5" y="107.0625" width="356.25" height="226.5625" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="630.625" y="128.8125" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Docker Container Action</text>
  <text x="466.5625" y="148.75" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Runtime: Docker container</text>
  <text x="466.5625" y="166.875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Language: any (Python, Go, Ruby...)</text>
  <text x="466.5625" y="185" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Speed: slower (image pull)</text>
  <text x="466.5625" y="203.125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Platform: Linux only</text>
  <text x="466.5625" y="224.875" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">runs:</text>
  <text x="480.625" y="241.1875" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">  using: docker</text>
  <text x="480.625" y="257.5" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">  image: Dockerfile</text>
  <text x="480.625" y="273.8125" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">  args:</text>
  <text x="494.6875" y="290.125" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">    - ${{ inputs.my-arg }}</text>
  <text x="466.5625" y="311.875" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)">ENTRYPOINT in Dockerfile is the main script</text>

  <rect x="836.875" y="107.0625" width="375" height="226.5625" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1024.375" y="128.8125" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Composite Action</text>
  <text x="850.9375" y="148.75" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Runtime: caller job runner</text>
  <text x="850.9375" y="166.875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Language: YAML + shell scripts</text>
  <text x="850.9375" y="185" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Speed: fast (no extra container)</text>
  <text x="850.9375" y="203.125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Platform: all runners</text>
  <text x="850.9375" y="224.875" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">runs:</text>
  <text x="865" y="241.1875" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">  using: composite</text>
  <text x="865" y="257.5" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">  steps:</text>
  <text x="879.0625" y="273.8125" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">    - run: echo "hi"</text>
  <text x="893.125" y="290.125" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">      shell: bash</text>
  <text x="879.0625" y="306.4375" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">    - uses: actions/checkout@v4</text>
  <text x="850.9375" y="324.5625" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)">shell: is required for every run step</text>

  <!-- action.yml structure -->
  <rect x="68.125" y="351.75" width="562.5" height="232" rx="6" fill="var(--surface)" filter="url(#shadow)"/>
  <text x="349.375" y="373.5" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text)" text-anchor="middle">action.yml Structure</text>
  <text x="82.1875" y="395.25" font-family="monospace" font-size="10.1392" fill="var(--text)">name: "My Custom Action"</text>
  <text x="82.1875" y="411.5625" font-family="monospace" font-size="10.1392" fill="var(--text)">description: "Does something useful"</text>
  <text x="82.1875" y="427.875" font-family="monospace" font-size="10.1392" fill="var(--text)">author: "Your Name"</text>
  <text x="82.1875" y="446" font-family="monospace" font-size="10.1392" fill="var(--text)">branding:</text>
  <text x="96.25" y="462.3125" font-family="monospace" font-size="10.1392" fill="var(--text)">  icon: "check-circle"</text>
  <text x="96.25" y="478.625" font-family="monospace" font-size="10.1392" fill="var(--text)">  color: "green"</text>
  <text x="82.1875" y="496.75" font-family="monospace" font-size="10.1392" fill="var(--text)">inputs:</text>
  <text x="96.25" y="513.0625" font-family="monospace" font-size="10.1392" fill="var(--text)">  token:</text>
  <text x="110.3125" y="529.375" font-family="monospace" font-size="10.1392" fill="var(--text)">    description: "GitHub token"</text>
  <text x="110.3125" y="545.6875" font-family="monospace" font-size="10.1392" fill="var(--text)">    required: true</text>
  <text x="82.1875" y="563.8125" font-family="monospace" font-size="10.1392" fill="var(--text)">outputs:</text>
  <text x="96.25" y="580.125" font-family="monospace" font-size="10.1392" fill="var(--text)">  result:</text>

  <!-- Inputs/Outputs/Branding -->
  <rect x="649.375" y="351.75" width="562.5" height="232" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="930.625" y="373.5" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Inputs, Outputs, and Branding</text>
  <text x="663.4375" y="395.25" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--primary-accent)">Accessing Inputs in script:</text>
  <text x="663.4375" y="413.375" font-family="monospace" font-size="10.1392" fill="var(--text)">${{ inputs.token }}</text>
  <text x="663.4375" y="429.6875" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">process.env.INPUT_TOKEN  (JS)</text>
  <text x="663.4375" y="451.4375" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--primary-accent)">Setting Outputs:</text>
  <text x="663.4375" y="469.5625" font-family="monospace" font-size="10.1392" fill="var(--text)">echo "result=done" &gt;&gt; $GITHUB_OUTPUT</text>
  <text x="663.4375" y="485.875" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">core.setOutput("result","done")  (JS)</text>
  <text x="663.4375" y="507.625" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--primary-accent)">Branding (Marketplace display):</text>
  <text x="663.4375" y="525.75" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">icon: feather icon name (activity, check-circle...)</text>
  <text x="663.4375" y="543.875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">color: white/yellow/blue/green/orange/red/purple/gray</text>
  <text x="663.4375" y="563.8125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Only shown on Marketplace listing</text>
  <text x="663.4375" y="581.9375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Not required for private/local actions</text>
</svg>

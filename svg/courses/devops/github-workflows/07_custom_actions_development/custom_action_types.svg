<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)"/>

  <rect x="30" y="14" width="1220" height="44" rx="6" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="640" y="42" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--bg)" text-anchor="middle">Custom GitHub Action Types</text>

  <!-- Three type columns -->
  <rect x="30" y="74" width="380" height="250" rx="5" fill="var(--primary-pale)" filter="url(#shadow)"/>
  <text x="220" y="98" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">JavaScript Action</text>
  <text x="45" y="120" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Runtime: Node.js (node20)</text>
  <text x="45" y="140" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Language: JavaScript / TypeScript</text>
  <text x="45" y="160" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Speed: fast (no container)</text>
  <text x="45" y="180" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Platform: all runners</text>
  <text x="45" y="204" font-family="monospace" font-size="11" fill="var(--text-muted)">runs:</text>
  <text x="60" y="222" font-family="monospace" font-size="11" fill="var(--text-muted)">  using: node20</text>
  <text x="60" y="240" font-family="monospace" font-size="11" fill="var(--text-muted)">  main: index.js</text>
  <text x="60" y="258" font-family="monospace" font-size="11" fill="var(--text-muted)">  pre: setup.js</text>
  <text x="60" y="276" font-family="monospace" font-size="11" fill="var(--text-muted)">  post: cleanup.js</text>
  <text x="45" y="300" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">Use @actions/core, @actions/exec, @actions/io</text>

  <rect x="440" y="74" width="380" height="250" rx="5" fill="var(--ok-pale)" filter="url(#shadow)"/>
  <text x="630" y="98" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">Docker Container Action</text>
  <text x="455" y="120" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Runtime: Docker container</text>
  <text x="455" y="140" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Language: any (Python, Go, Ruby...)</text>
  <text x="455" y="160" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Speed: slower (image pull)</text>
  <text x="455" y="180" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Platform: Linux only</text>
  <text x="455" y="204" font-family="monospace" font-size="11" fill="var(--text-muted)">runs:</text>
  <text x="470" y="222" font-family="monospace" font-size="11" fill="var(--text-muted)">  using: docker</text>
  <text x="470" y="240" font-family="monospace" font-size="11" fill="var(--text-muted)">  image: Dockerfile</text>
  <text x="470" y="258" font-family="monospace" font-size="11" fill="var(--text-muted)">  args:</text>
  <text x="485" y="276" font-family="monospace" font-size="11" fill="var(--text-muted)">    - ${{ inputs.my-arg }}</text>
  <text x="455" y="300" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">ENTRYPOINT in Dockerfile is the main script</text>

  <rect x="850" y="74" width="400" height="250" rx="5" fill="var(--warn-pale)" filter="url(#shadow)"/>
  <text x="1050" y="98" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-dk)" text-anchor="middle">Composite Action</text>
  <text x="865" y="120" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Runtime: caller job runner</text>
  <text x="865" y="140" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Language: YAML + shell scripts</text>
  <text x="865" y="160" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Speed: fast (no extra container)</text>
  <text x="865" y="180" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Platform: all runners</text>
  <text x="865" y="204" font-family="monospace" font-size="11" fill="var(--text-muted)">runs:</text>
  <text x="880" y="222" font-family="monospace" font-size="11" fill="var(--text-muted)">  using: composite</text>
  <text x="880" y="240" font-family="monospace" font-size="11" fill="var(--text-muted)">  steps:</text>
  <text x="895" y="258" font-family="monospace" font-size="11" fill="var(--text-muted)">    - run: echo "hi"</text>
  <text x="910" y="276" font-family="monospace" font-size="11" fill="var(--text-muted)">      shell: bash</text>
  <text x="895" y="294" font-family="monospace" font-size="11" fill="var(--text-muted)">    - uses: actions/checkout@v4</text>
  <text x="865" y="314" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">shell: is required for every run step</text>

  <!-- action.yml structure -->
  <rect x="30" y="344" width="600" height="256" rx="5" fill="var(--surface)" filter="url(#shadow)"/>
  <text x="330" y="368" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text-dark)" text-anchor="middle">action.yml Structure</text>
  <text x="45" y="392" font-family="monospace" font-size="11" fill="var(--text-dark)">name: "My Custom Action"</text>
  <text x="45" y="410" font-family="monospace" font-size="11" fill="var(--text-dark)">description: "Does something useful"</text>
  <text x="45" y="428" font-family="monospace" font-size="11" fill="var(--text-dark)">author: "Your Name"</text>
  <text x="45" y="448" font-family="monospace" font-size="11" fill="var(--text-dark)">branding:</text>
  <text x="60" y="466" font-family="monospace" font-size="11" fill="var(--text-dark)">  icon: "check-circle"</text>
  <text x="60" y="484" font-family="monospace" font-size="11" fill="var(--text-dark)">  color: "green"</text>
  <text x="45" y="504" font-family="monospace" font-size="11" fill="var(--text-dark)">inputs:</text>
  <text x="60" y="522" font-family="monospace" font-size="11" fill="var(--text-dark)">  token:</text>
  <text x="75" y="540" font-family="monospace" font-size="11" fill="var(--text-dark)">    description: "GitHub token"</text>
  <text x="75" y="558" font-family="monospace" font-size="11" fill="var(--text-dark)">    required: true</text>
  <text x="45" y="578" font-family="monospace" font-size="11" fill="var(--text-dark)">outputs:</text>
  <text x="60" y="596" font-family="monospace" font-size="11" fill="var(--text-dark)">  result:</text>

  <!-- Inputs/Outputs/Branding -->
  <rect x="650" y="344" width="600" height="256" rx="5" fill="var(--primary-pale)" filter="url(#shadow)"/>
  <text x="950" y="368" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">Inputs, Outputs, and Branding</text>
  <text x="665" y="392" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-dk)">Accessing Inputs in script:</text>
  <text x="665" y="412" font-family="monospace" font-size="11" fill="var(--text-dark)">${{ inputs.token }}</text>
  <text x="665" y="430" font-family="monospace" font-size="11" fill="var(--text-muted)">process.env.INPUT_TOKEN  (JS)</text>
  <text x="665" y="454" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-dk)">Setting Outputs:</text>
  <text x="665" y="474" font-family="monospace" font-size="11" fill="var(--text-dark)">echo "result=done" &gt;&gt; $GITHUB_OUTPUT</text>
  <text x="665" y="492" font-family="monospace" font-size="11" fill="var(--text-muted)">core.setOutput("result","done")  (JS)</text>
  <text x="665" y="516" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-dk)">Branding (Marketplace display):</text>
  <text x="665" y="536" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">icon: feather icon name (activity, check-circle...)</text>
  <text x="665" y="556" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">color: white/yellow/blue/green/orange/red/purple/gray</text>
  <text x="665" y="578" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Only shown on Marketplace listing</text>
  <text x="665" y="598" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Not required for private/local actions</text>
</svg>

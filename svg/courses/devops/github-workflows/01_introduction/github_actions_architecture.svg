<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="320.851064" y="40" width="638.297736" height="98.639524" rx="7.747649" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="81.428536" font-size="29.175967" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">GitHub Event</text>
  <text x="640" y="113.979521" font-size="21.320884" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">(push, PR, schedule, etc.)</text>
  <line x1="640" y1="138.639524" x2="640" y2="192.891042" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="320.851064" y="192.891042" width="638.297736" height="98.639524" rx="7.747649" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="235.30615" font-size="29.175967" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Workflow</text>
  <text x="640" y="268.843583" font-size="21.320884" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">.github/workflows/*.yml</text>
  <line x1="640" y1="291.530566" x2="640" y2="335.918327" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="231.489226" y1="335.918327" x2="1048.510502" y2="335.918327" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="231.489226" y1="335.918327" x2="231.489226" y2="380.306089" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1048.510502" y1="335.918327" x2="1048.510502" y2="380.306089" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="380.306089" width="382.978723" height="98.639524" rx="7.747649" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="231.489226" y="422.721197" font-size="26.931602" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Job 1</text>
  <text x="231.489226" y="457.244957" font-size="20.198766" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">(parallel or sequential)</text>
  <line x1="231.489226" y1="478.945613" x2="231.489226" y2="533.197253" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="533.197253" width="382.978723" height="86.802747" rx="7.747649" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="231.489226" y="570.68036" font-size="24.687366" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Steps</text>
  <text x="231.489226" y="604.217671" font-size="19.076648" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">(commands / actions)</text>
  <rect x="857.021277" y="380.306089" width="382.978723" height="98.639524" rx="7.747649" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1048.510502" y="422.721197" font-size="26.931602" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Job 2</text>
  <text x="1048.510502" y="457.244957" font-size="20.198766" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">(parallel or sequential)</text>
  <line x1="1048.510502" y1="478.945613" x2="1048.510502" y2="533.197253" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="857.021277" y="533.197253" width="382.978723" height="86.802747" rx="7.747649" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1048.510502" y="570.68036" font-size="24.687366" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Steps</text>
  <text x="1048.510502" y="604.217671" font-size="19.076648" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">(commands / actions)</text>
</svg>
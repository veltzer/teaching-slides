<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="320.851064" y="40" width="638.297736" height="98.639524" rx="7.747649" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="81.428536" font-size="29.175967" font-weight="bold" fill="var(--bg)" text-anchor="middle">GitHub Event</text>
  <text x="640" y="113.979521" font-size="21.320884" fill="var(--primary-accent)" text-anchor="middle">(push, PR, schedule, etc.)</text>
  <line x1="640" y1="138.639524" x2="640" y2="192.891042" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="320.851064" y="192.891042" width="638.297736" height="98.639524" rx="7.747649" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="640" y="235.30615" font-size="29.175967" font-weight="bold" fill="var(--text)" text-anchor="middle">Workflow</text>
  <text x="640" y="268.843583" font-size="21.320884" fill="var(--text-muted)" text-anchor="middle">.github/workflows/*.yml</text>
  <line x1="640" y1="291.530566" x2="640" y2="335.918327" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="231.489226" y1="335.918327" x2="1048.510502" y2="335.918327" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="231.489226" y1="335.918327" x2="231.489226" y2="380.306089" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1048.510502" y1="335.918327" x2="1048.510502" y2="380.306089" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="380.306089" width="382.978723" height="98.639524" rx="7.747649" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="231.489226" y="422.721197" font-size="26.931602" font-weight="bold" fill="var(--text)" text-anchor="middle">Job 1</text>
  <text x="231.489226" y="457.244957" font-size="20.198766" fill="var(--text-muted)" text-anchor="middle">(parallel or sequential)</text>
  <line x1="231.489226" y1="478.945613" x2="231.489226" y2="533.197253" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="533.197253" width="382.978723" height="86.802747" rx="7.747649" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="231.489226" y="570.68036" font-size="24.687366" font-weight="bold" fill="var(--text)" text-anchor="middle">Steps</text>
  <text x="231.489226" y="604.217671" font-size="19.076648" fill="var(--text-muted)" text-anchor="middle">(commands / actions)</text>
  <rect x="857.021277" y="380.306089" width="382.978723" height="98.639524" rx="7.747649" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1048.510502" y="422.721197" font-size="26.931602" font-weight="bold" fill="var(--text)" text-anchor="middle">Job 2</text>
  <text x="1048.510502" y="457.244957" font-size="20.198766" fill="var(--text-muted)" text-anchor="middle">(parallel or sequential)</text>
  <line x1="1048.510502" y1="478.945613" x2="1048.510502" y2="533.197253" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="857.021277" y="533.197253" width="382.978723" height="86.802747" rx="7.747649" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1048.510502" y="570.68036" font-size="24.687366" font-weight="bold" fill="var(--text)" text-anchor="middle">Steps</text>
  <text x="1048.510502" y="604.217671" font-size="19.076648" fill="var(--text-muted)" text-anchor="middle">(commands / actions)</text>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
    <ns0:linearGradient id="scope1" x1="0" y1="0" x2="1" y2="0">
      <ns0:stop offset="0%" stop-color="#bbdefb" />
      <ns0:stop offset="100%" stop-color="#90caf9" />
    </ns0:linearGradient>
    <ns0:linearGradient id="scope2" x1="0" y1="0" x2="1" y2="0">
      <ns0:stop offset="0%" stop-color="#90caf9" />
      <ns0:stop offset="100%" stop-color="#90caf9" />
    </ns0:linearGradient>
    <ns0:linearGradient id="scope3" x1="0" y1="0" x2="1" y2="0">
      <ns0:stop offset="0%" stop-color="#90caf9" />
      <ns0:stop offset="100%" stop-color="#4a90e2" />
    </ns0:linearGradient>
    <ns0:linearGradient id="scope4" x1="0" y1="0" x2="1" y2="0">
      <ns0:stop offset="0%" stop-color="#4a90e2" />
      <ns0:stop offset="100%" stop-color="#1e88e5" />
    </ns0:linearGradient>
    <ns0:linearGradient id="scope5" x1="0" y1="0" x2="1" y2="0">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:linearGradient id="scope6" x1="0" y1="0" x2="1" y2="0">
      <ns0:stop offset="0%" stop-color="#1565c0" />
      <ns0:stop offset="100%" stop-color="#0d47a1" />
    </ns0:linearGradient>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:text x="71.1111" y="48.8889" font-size="16" fill="#555555">Scope</ns0:text>
  <ns0:text x="1066.6667" y="48.8889" font-size="16" fill="#555555" text-anchor="end">Priority</ns0:text>
  <ns0:line x1="71.1111" y1="57.7778" x2="1066.6667" y2="57.7778" stroke="#f0f0f0" stroke-width="1.3333" />
  <ns0:rect x="53.3333" y="66.6667" width="1031.1111" height="74.6667" rx="7.1111" fill="url(#scope1)" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="97.7778" font-size="21.3333" font-weight="bold" fill="#212121" text-anchor="middle">Organization Secrets</ns0:text>
  <ns0:text x="568.8889" y="126.2222" font-size="16" fill="#555555" text-anchor="middle">shared across all repositories in the org</ns0:text>
  <ns0:text x="1062.2222" y="115.5556" font-size="14.2222" fill="#555555" text-anchor="end">lowest</ns0:text>
  <ns0:rect x="88.8889" y="151.1111" width="960" height="74.6667" rx="7.1111" fill="url(#scope2)" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="182.2222" font-size="21.3333" font-weight="bold" fill="#212121" text-anchor="middle">Repository Secrets</ns0:text>
  <ns0:text x="568.8889" y="210.6667" font-size="16" fill="#555555" text-anchor="middle">scoped to a single repository</ns0:text>
  <ns0:rect x="124.4444" y="235.5556" width="888.8889" height="74.6667" rx="7.1111" fill="url(#scope3)" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="266.6667" font-size="21.3333" font-weight="bold" fill="#212121" text-anchor="middle">Environment Secrets</ns0:text>
  <ns0:text x="568.8889" y="295.1111" font-size="16" fill="#555555" text-anchor="middle">scoped to a named deployment environment</ns0:text>
  <ns0:rect x="160" y="320" width="817.7778" height="74.6667" rx="7.1111" fill="url(#scope4)" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="351.1111" font-size="21.3333" font-weight="bold" fill="#212121" text-anchor="middle">Workflow env:</ns0:text>
  <ns0:text x="568.8889" y="379.5556" font-size="16" fill="#212121" text-anchor="middle">workflow-level variables (env: at top level)</ns0:text>
  <ns0:rect x="195.5556" y="404.4444" width="746.6667" height="74.6667" rx="7.1111" fill="url(#scope5)" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="435.5556" font-size="21.3333" font-weight="bold" fill="#ffffff" text-anchor="middle">Job env:</ns0:text>
  <ns0:text x="568.8889" y="464" font-size="16" fill="#e3f2fd" text-anchor="middle">job-level variables (env: under a job)</ns0:text>
  <ns0:rect x="231.1111" y="488.8889" width="675.5556" height="74.6667" rx="7.1111" fill="url(#scope6)" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="520" font-size="21.3333" font-weight="bold" fill="#ffffff" text-anchor="middle">Step env:</ns0:text>
  <ns0:text x="568.8889" y="548.4444" font-size="16" fill="#e3f2fd" text-anchor="middle">step-level variables — highest specificity wins</ns0:text>
  <ns0:text x="888.8889" y="533.3333" font-size="14.2222" fill="#e3f2fd">highest</ns0:text>
</ns0:svg>
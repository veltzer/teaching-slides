<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <linearGradient id="scope1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#bbdefb" />
      <stop offset="100%" stop-color="#90caf9" />
    </linearGradient>
    <linearGradient id="scope2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#90caf9" />
      <stop offset="100%" stop-color="#90caf9" />
    </linearGradient>
    <linearGradient id="scope3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#90caf9" />
      <stop offset="100%" stop-color="#4a90e2" />
    </linearGradient>
    <linearGradient id="scope4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a90e2" />
      <stop offset="100%" stop-color="#1e88e5" />
    </linearGradient>
    <linearGradient id="scope5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="scope6" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1565c0" />
      <stop offset="100%" stop-color="#0d47a1" />
    </linearGradient>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <text x="71.1111" y="48.8889" font-size="16" fill="var(--text-muted)">Scope</text>
  <text x="1066.6667" y="48.8889" font-size="16" fill="var(--text-muted)" text-anchor="end">Priority</text>
  <line x1="71.1111" y1="57.7778" x2="1066.6667" y2="57.7778" stroke="var(--surface)" stroke-width="1.3333" />
  <rect x="53.3333" y="66.6667" width="1031.1111" height="74.6667" rx="6" fill="url(#scope1)" filter="url(#shadow)" />
  <text x="568.8889" y="97.7778" font-size="21.3333" font-weight="bold" fill="var(--text)" text-anchor="middle">Organization Secrets</text>
  <text x="568.8889" y="126.2222" font-size="16" fill="var(--text-muted)" text-anchor="middle">shared across all repositories in the org</text>
  <text x="1062.2222" y="115.5556" font-size="14.2222" fill="var(--text-muted)" text-anchor="end">lowest</text>
  <rect x="88.8889" y="151.1111" width="960" height="74.6667" rx="6" fill="url(#scope2)" filter="url(#shadow)" />
  <text x="568.8889" y="182.2222" font-size="21.3333" font-weight="bold" fill="var(--text)" text-anchor="middle">Repository Secrets</text>
  <text x="568.8889" y="210.6667" font-size="16" fill="var(--text-muted)" text-anchor="middle">scoped to a single repository</text>
  <rect x="124.4444" y="235.5556" width="888.8889" height="74.6667" rx="6" fill="url(#scope3)" filter="url(#shadow)" />
  <text x="568.8889" y="266.6667" font-size="21.3333" font-weight="bold" fill="var(--text)" text-anchor="middle">Environment Secrets</text>
  <text x="568.8889" y="295.1111" font-size="16" fill="var(--text-muted)" text-anchor="middle">scoped to a named deployment environment</text>
  <rect x="160" y="320" width="817.7778" height="74.6667" rx="6" fill="url(#scope4)" filter="url(#shadow)" />
  <text x="568.8889" y="351.1111" font-size="21.3333" font-weight="bold" fill="var(--text)" text-anchor="middle">Workflow env:</text>
  <text x="568.8889" y="379.5556" font-size="16" fill="var(--text)" text-anchor="middle">workflow-level variables (env: at top level)</text>
  <rect x="195.5556" y="404.4444" width="746.6667" height="74.6667" rx="6" fill="url(#scope5)" filter="url(#shadow)" />
  <text x="568.8889" y="435.5556" font-size="21.3333" font-weight="bold" fill="var(--bg)" text-anchor="middle">Job env:</text>
  <text x="568.8889" y="464" font-size="16" fill="var(--primary-accent)" text-anchor="middle">job-level variables (env: under a job)</text>
  <rect x="231.1111" y="488.8889" width="675.5556" height="74.6667" rx="6" fill="url(#scope6)" filter="url(#shadow)" />
  <text x="568.8889" y="520" font-size="21.3333" font-weight="bold" fill="var(--bg)" text-anchor="middle">Step env:</text>
  <text x="568.8889" y="548.4444" font-size="16" fill="var(--primary-accent)" text-anchor="middle">step-level variables — highest specificity wins</text>
  <text x="888.8889" y="533.3333" font-size="14.2222" fill="var(--primary-accent)">highest</text>
</svg>
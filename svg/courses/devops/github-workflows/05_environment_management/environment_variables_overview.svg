<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <linearGradient id="scope1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#bbdefb" />
      <stop offset="100%" stop-color="#90caf9" />
    </linearGradient>
    <linearGradient id="scope2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#90caf9" />
      <stop offset="100%" stop-color="#90caf9" />
    </linearGradient>
    <linearGradient id="scope3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#90caf9" />
      <stop offset="100%" stop-color="#4a90e2" />
    </linearGradient>
    <linearGradient id="scope4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a90e2" />
      <stop offset="100%" stop-color="#1e88e5" />
    </linearGradient>
    <linearGradient id="scope5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="scope6" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1565c0" />
      <stop offset="100%" stop-color="#0d47a1" />
    </linearGradient>
  </defs>
  <text x="60.689655" y="40" font-size="18.323528" fill="var(--text-muted)">Scope</text>
  <text x="1219.310345" y="40" font-size="18.323528" fill="var(--text-muted)" text-anchor="end">Priority</text>
  <line x1="60.689655" y1="50.017201" x2="1219.310345" y2="50.017201" stroke="var(--surface)" stroke-width="1.3333" />
  <rect x="40" y="60.034527" width="1200" height="84.145113" rx="7.028363" fill="url(#scope1)" />
  <text x="640" y="95.094918" font-size="24.431293" font-weight="bold" fill="var(--text)" text-anchor="middle">Organization Secrets</text>
  <text x="640" y="127.150211" font-size="18.323528" fill="var(--text-muted)" text-anchor="middle">shared across all repositories in the org</text>
  <text x="1214.137931" y="115.12957" font-size="16.287529" fill="var(--text-muted)" text-anchor="end">lowest</text>
  <rect x="81.37931" y="155.1985" width="1117.241379" height="84.145113" rx="7.028363" fill="url(#scope2)" />
  <text x="640" y="190.259015" font-size="24.431293" font-weight="bold" fill="var(--text)" text-anchor="middle">Repository Secrets</text>
  <text x="640" y="222.314308" font-size="18.323528" fill="var(--text-muted)" text-anchor="middle">scoped to a single repository</text>
  <rect x="122.758621" y="250.362721" width="1034.482759" height="84.145113" rx="7.028363" fill="url(#scope3)" />
  <text x="640" y="285.423112" font-size="24.431293" font-weight="bold" fill="var(--text)" text-anchor="middle">Environment Secrets</text>
  <text x="640" y="317.478281" font-size="18.323528" fill="var(--text-muted)" text-anchor="middle">scoped to a named deployment environment</text>
  <rect x="164.137931" y="345.526693" width="951.724138" height="84.145113" rx="7.028363" fill="url(#scope4)" />
  <text x="640" y="380.587084" font-size="24.431293" font-weight="bold" fill="var(--text)" text-anchor="middle">Workflow env:</text>
  <text x="640" y="412.642502" font-size="18.323528" fill="var(--text)" text-anchor="middle">workflow-level variables (env: at top level)</text>
  <rect x="205.517241" y="440.690666" width="868.965517" height="84.145113" rx="7.028363" fill="url(#scope5)" />
  <text x="640" y="475.751306" font-size="24.431293" font-weight="bold" fill="var(--bg)" text-anchor="middle">Job env:</text>
  <text x="640" y="507.806474" font-size="18.323528" fill="var(--primary-accent)" text-anchor="middle">job-level variables (env: under a job)</text>
  <rect x="246.896552" y="535.854887" width="786.206897" height="84.145113" rx="7.028363" fill="url(#scope6)" />
  <text x="640" y="570.915278" font-size="24.431293" font-weight="bold" fill="var(--bg)" text-anchor="middle">Step env:</text>
  <text x="640" y="602.970447" font-size="18.323528" fill="var(--primary-accent)" text-anchor="middle">step-level variables — highest specificity wins</text>
  <text x="1012.413793" y="585.941142" font-size="16.287529" fill="var(--primary-accent)">highest</text>
</svg>
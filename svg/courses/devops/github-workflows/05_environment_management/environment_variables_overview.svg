<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <linearGradient id="scope1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#bbdefb" />
      <stop offset="100%" stop-color="#90caf9" />
    </linearGradient>
    <linearGradient id="scope2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#90caf9" />
      <stop offset="100%" stop-color="#90caf9" />
    </linearGradient>
    <linearGradient id="scope3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#90caf9" />
      <stop offset="100%" stop-color="#4a90e2" />
    </linearGradient>
    <linearGradient id="scope4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a90e2" />
      <stop offset="100%" stop-color="#1e88e5" />
    </linearGradient>
    <linearGradient id="scope5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="scope6" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1565c0" />
      <stop offset="100%" stop-color="#0d47a1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <text x="115" y="84.3056" font-size="15.6425" fill="var(--text-muted)">Scope</text>
  <text x="1165" y="84.3056" font-size="15.6425" fill="var(--text-muted)" text-anchor="end">Priority</text>
  <line x1="115" y1="92.3611" x2="1165" y2="92.3611" stroke="var(--surface)" stroke-width="1.3333" />
  <rect x="96.25" y="100.4167" width="1087.5" height="67.6667" rx="6" fill="url(#scope1)" filter="url(#shadow)" />
  <text x="640" y="128.6111" font-size="20.8566" font-weight="bold" fill="var(--text)" text-anchor="middle">Organization Secrets</text>
  <text x="640" y="154.3889" font-size="15.6425" fill="var(--text-muted)" text-anchor="middle">shared across all repositories in the org</text>
  <text x="1160.3125" y="144.7223" font-size="13.9044" fill="var(--text-muted)" text-anchor="end">lowest</text>
  <rect x="133.75" y="176.9444" width="1012.5" height="67.6667" rx="6" fill="url(#scope2)" filter="url(#shadow)" />
  <text x="640" y="205.1389" font-size="20.8566" font-weight="bold" fill="var(--text)" text-anchor="middle">Repository Secrets</text>
  <text x="640" y="230.9167" font-size="15.6425" fill="var(--text-muted)" text-anchor="middle">scoped to a single repository</text>
  <rect x="171.25" y="253.4723" width="937.5" height="67.6667" rx="6" fill="url(#scope3)" filter="url(#shadow)" />
  <text x="640" y="281.6667" font-size="20.8566" font-weight="bold" fill="var(--text)" text-anchor="middle">Environment Secrets</text>
  <text x="640" y="307.4444" font-size="15.6425" fill="var(--text-muted)" text-anchor="middle">scoped to a named deployment environment</text>
  <rect x="208.75" y="330" width="862.5" height="67.6667" rx="6" fill="url(#scope4)" filter="url(#shadow)" />
  <text x="640" y="358.1944" font-size="20.8566" font-weight="bold" fill="var(--text)" text-anchor="middle">Workflow env:</text>
  <text x="640" y="383.9723" font-size="15.6425" fill="var(--text)" text-anchor="middle">workflow-level variables (env: at top level)</text>
  <rect x="246.25" y="406.5277" width="787.5" height="67.6667" rx="6" fill="url(#scope5)" filter="url(#shadow)" />
  <text x="640" y="434.7223" font-size="20.8566" font-weight="bold" fill="var(--bg)" text-anchor="middle">Job env:</text>
  <text x="640" y="460.5" font-size="15.6425" fill="var(--primary-accent)" text-anchor="middle">job-level variables (env: under a job)</text>
  <rect x="283.75" y="483.0556" width="712.5" height="67.6667" rx="6" fill="url(#scope6)" filter="url(#shadow)" />
  <text x="640" y="511.25" font-size="20.8566" font-weight="bold" fill="var(--bg)" text-anchor="middle">Step env:</text>
  <text x="640" y="537.0277" font-size="15.6425" fill="var(--primary-accent)" text-anchor="middle">step-level variables — highest specificity wins</text>
  <text x="977.5" y="523.3333" font-size="13.9044" fill="var(--primary-accent)">highest</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="21.042984" fill="var(--text-muted)">Method 1: Job Outputs (for small data)</text>
  <rect x="40" y="58.191952" width="455.172414" height="267.527636" rx="7.264301" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="267.586207" y="106.346924" font-size="31.564354" font-weight="bold" fill="var(--text)" text-anchor="middle">Job A</text>
  <text x="267.586207" y="147.011107" font-size="21.042984" fill="var(--text-muted)" text-anchor="middle">steps:</text>
  <text x="267.586207" y="183.394879" font-size="21.042984" fill="var(--text-muted)" text-anchor="middle">- name: set output</text>
  <text x="267.586207" y="219.778517" font-family="monospace" font-size="16.83429" fill="var(--primary-accent)" text-anchor="middle">echo "result=42" &gt;&gt; $GITHUB_OUTPUT</text>
  <text x="267.586207" y="256.162288" font-size="16.83429" fill="var(--text-muted)" text-anchor="middle">outputs: result: ${{ steps.x.outputs.result }}</text>
  <line x1="495.172303" y1="191.955703" x2="743.448276" y2="191.955703" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="619.310345" y="175.90409" font-size="18.938637" fill="var(--primary-accent)" text-anchor="middle">outputs</text>
  <text x="619.310345" y="213.357898" font-size="14.729943" fill="var(--text-muted)" text-anchor="middle">(small values)</text>
  <rect x="743.448276" y="58.191952" width="496.551724" height="267.527636" rx="7.264301" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="991.724138" y="106.346924" font-size="31.564354" font-weight="bold" fill="var(--text)" text-anchor="middle">Job B</text>
  <text x="991.724138" y="147.011107" font-size="21.042984" fill="var(--text-muted)" text-anchor="middle">needs: [job_a]</text>
  <text x="991.724138" y="183.394879" font-size="21.042984" fill="var(--text-muted)" text-anchor="middle">steps:</text>
  <text x="991.724138" y="219.778517" font-size="21.042984" fill="var(--text-muted)" text-anchor="middle">- name: use output</text>
  <text x="991.724138" y="256.162288" font-family="monospace" font-size="16.83429" fill="var(--primary-accent)" text-anchor="middle">${{ needs.job_a.outputs.result }}</text>
  <line x1="40" y1="361.033056" x2="1239.99989" y2="361.033056" stroke="var(--surface)" stroke-width="1.7778" stroke-dasharray="8.8889 5.3333" />
  <text x="640" y="395.276754" text-anchor="middle" font-size="21.042984" fill="var(--text-muted)">Method 2: Artifacts (for large files / binaries)</text>
  <rect x="40" y="416.678949" width="455.172414" height="203.321051" rx="7.264301" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="267.586207" y="464.833921" font-size="31.564354" font-weight="bold" fill="var(--text)" text-anchor="middle">Job A</text>
  <text x="267.586207" y="507.638311" font-size="21.042984" fill="var(--text-muted)" text-anchor="middle">- uses: actions/upload-artifact</text>
  <text x="267.586207" y="545.092119" font-family="monospace" font-size="16.83429" fill="var(--primary-accent)" text-anchor="middle">name: build-output</text>
  <text x="267.586207" y="582.545926" font-family="monospace" font-size="16.83429" fill="var(--primary-accent)" text-anchor="middle">path: ./dist/</text>
  <line x1="495.172303" y1="518.339342" x2="743.448276" y2="518.339342" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="619.310345" y="502.287729" font-size="18.938637" fill="var(--text-muted)" text-anchor="middle">artifact</text>
  <text x="619.310345" y="539.741669" font-size="14.729943" fill="var(--text-muted)" text-anchor="middle">(files/binaries)</text>
  <rect x="743.448276" y="416.678949" width="496.551724" height="203.321051" rx="7.264301" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="991.724138" y="464.833921" font-size="31.564354" font-weight="bold" fill="var(--text)" text-anchor="middle">Job B</text>
  <text x="991.724138" y="507.638311" font-size="21.042984" fill="var(--text-muted)" text-anchor="middle">- uses: actions/download-artifact</text>
  <text x="991.724138" y="545.092119" font-family="monospace" font-size="16.83429" fill="var(--primary-accent)" text-anchor="middle">name: build-output</text>
  <text x="991.724138" y="582.545926" font-size="16.83429" fill="var(--text-muted)" text-anchor="middle">files available in workspace</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <text x="568.8889" y="33.7778" text-anchor="middle" font-size="17.7778" fill="var(--text-muted)">Method 1: Job Outputs (for small data)</text>
  <rect x="53.3333" y="48.8889" width="391.1111" height="222.2222" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="248.8889" y="88.8889" font-size="26.6667" font-weight="bold" fill="var(--text)" text-anchor="middle">Job A</text>
  <text x="248.8889" y="122.6667" font-size="17.7778" fill="var(--text-muted)" text-anchor="middle">steps:</text>
  <text x="248.8889" y="152.8889" font-size="17.7778" fill="var(--text-muted)" text-anchor="middle">- name: set output</text>
  <text x="248.8889" y="183.1111" font-family="monospace" font-size="14.2222" fill="var(--primary-accent)" text-anchor="middle">echo "result=42" &gt;&gt; $GITHUB_OUTPUT</text>
  <text x="248.8889" y="213.3333" font-size="14.2222" fill="var(--text-muted)" text-anchor="middle">outputs: result: ${{ steps.x.outputs.result }}</text>
  <line x1="444.4444" y1="160" x2="657.7778" y2="160" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="551.1111" y="146.6667" font-size="16" fill="var(--primary-accent)" text-anchor="middle">outputs</text>
  <text x="551.1111" y="177.7778" font-size="12.4444" fill="var(--text-muted)" text-anchor="middle">(small values)</text>
  <rect x="657.7778" y="48.8889" width="426.6667" height="222.2222" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="871.1111" y="88.8889" font-size="26.6667" font-weight="bold" fill="var(--text)" text-anchor="middle">Job B</text>
  <text x="871.1111" y="122.6667" font-size="17.7778" fill="var(--text-muted)" text-anchor="middle">needs: [job_a]</text>
  <text x="871.1111" y="152.8889" font-size="17.7778" fill="var(--text-muted)" text-anchor="middle">steps:</text>
  <text x="871.1111" y="183.1111" font-size="17.7778" fill="var(--text-muted)" text-anchor="middle">- name: use output</text>
  <text x="871.1111" y="213.3333" font-family="monospace" font-size="14.2222" fill="var(--primary-accent)" text-anchor="middle">${{ needs.job_a.outputs.result }}</text>
  <line x1="53.3333" y1="300.4444" x2="1084.4444" y2="300.4444" stroke="var(--surface)" stroke-width="1.7778" stroke-dasharray="8.8889 5.3333" />
  <text x="568.8889" y="328.8889" text-anchor="middle" font-size="17.7778" fill="var(--text-muted)">Method 2: Artifacts (for large files / binaries)</text>
  <rect x="53.3333" y="346.6667" width="391.1111" height="168.8889" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="248.8889" y="386.6667" font-size="26.6667" font-weight="bold" fill="var(--text)" text-anchor="middle">Job A</text>
  <text x="248.8889" y="422.2222" font-size="17.7778" fill="var(--text-muted)" text-anchor="middle">- uses: actions/upload-artifact</text>
  <text x="248.8889" y="453.3333" font-family="monospace" font-size="14.2222" fill="var(--primary-accent)" text-anchor="middle">name: build-output</text>
  <text x="248.8889" y="484.4444" font-family="monospace" font-size="14.2222" fill="var(--primary-accent)" text-anchor="middle">path: ./dist/</text>
  <line x1="444.4444" y1="431.1111" x2="657.7778" y2="431.1111" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="551.1111" y="417.7778" font-size="16" fill="var(--text-muted)" text-anchor="middle">artifact</text>
  <text x="551.1111" y="448.8889" font-size="12.4444" fill="var(--text-muted)" text-anchor="middle">(files/binaries)</text>
  <rect x="657.7778" y="346.6667" width="426.6667" height="168.8889" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="871.1111" y="386.6667" font-size="26.6667" font-weight="bold" fill="var(--text)" text-anchor="middle">Job B</text>
  <text x="871.1111" y="422.2222" font-size="17.7778" fill="var(--text-muted)" text-anchor="middle">- uses: actions/download-artifact</text>
  <text x="871.1111" y="453.3333" font-family="monospace" font-size="14.2222" fill="var(--primary-accent)" text-anchor="middle">name: build-output</text>
  <text x="871.1111" y="484.4444" font-size="14.2222" fill="var(--text-muted)" text-anchor="middle">files available in workspace</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <text x="640" y="70.6111" text-anchor="middle" font-size="17.3806" fill="var(--text-muted)">Method 1: Job Outputs (for small data)</text>
  <rect x="96.25" y="84.3056" width="412.5" height="201.3889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="302.5" y="120.5556" font-size="26.0708" font-weight="bold" fill="var(--text)" text-anchor="middle">Job A</text>
  <text x="302.5" y="151.1667" font-size="17.3806" fill="var(--text-muted)" text-anchor="middle">steps:</text>
  <text x="302.5" y="178.5556" font-size="17.3806" fill="var(--text-muted)" text-anchor="middle">- name: set output</text>
  <text x="302.5" y="205.9444" font-family="monospace" font-size="13.9044" fill="var(--primary-accent)" text-anchor="middle">echo "result=42" &gt;&gt; $GITHUB_OUTPUT</text>
  <text x="302.5" y="233.3333" font-size="13.9044" fill="var(--text-muted)" text-anchor="middle">outputs: result: ${{ steps.x.outputs.result }}</text>
  <line x1="508.7499" y1="185" x2="733.75" y2="185" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="621.25" y="172.9167" font-size="15.6425" fill="var(--primary-accent)" text-anchor="middle">outputs</text>
  <text x="621.25" y="201.1111" font-size="12.1663" fill="var(--text-muted)" text-anchor="middle">(small values)</text>
  <rect x="733.75" y="84.3056" width="450" height="201.3889" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="958.75" y="120.5556" font-size="26.0708" font-weight="bold" fill="var(--text)" text-anchor="middle">Job B</text>
  <text x="958.75" y="151.1667" font-size="17.3806" fill="var(--text-muted)" text-anchor="middle">needs: [job_a]</text>
  <text x="958.75" y="178.5556" font-size="17.3806" fill="var(--text-muted)" text-anchor="middle">steps:</text>
  <text x="958.75" y="205.9444" font-size="17.3806" fill="var(--text-muted)" text-anchor="middle">- name: use output</text>
  <text x="958.75" y="233.3333" font-family="monospace" font-size="13.9044" fill="var(--primary-accent)" text-anchor="middle">${{ needs.job_a.outputs.result }}</text>
  <line x1="96.25" y1="312.2777" x2="1183.7499" y2="312.2777" stroke="var(--surface)" stroke-width="1.7778" stroke-dasharray="8.8889 5.3333" />
  <text x="640" y="338.0556" text-anchor="middle" font-size="17.3806" fill="var(--text-muted)">Method 2: Artifacts (for large files / binaries)</text>
  <rect x="96.25" y="354.1667" width="412.5" height="153.0556" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="302.5" y="390.4167" font-size="26.0708" font-weight="bold" fill="var(--text)" text-anchor="middle">Job A</text>
  <text x="302.5" y="422.6389" font-size="17.3806" fill="var(--text-muted)" text-anchor="middle">- uses: actions/upload-artifact</text>
  <text x="302.5" y="450.8333" font-family="monospace" font-size="13.9044" fill="var(--primary-accent)" text-anchor="middle">name: build-output</text>
  <text x="302.5" y="479.0277" font-family="monospace" font-size="13.9044" fill="var(--primary-accent)" text-anchor="middle">path: ./dist/</text>
  <line x1="508.7499" y1="430.6944" x2="733.75" y2="430.6944" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="621.25" y="418.6111" font-size="15.6425" fill="var(--text-muted)" text-anchor="middle">artifact</text>
  <text x="621.25" y="446.8056" font-size="12.1663" fill="var(--text-muted)" text-anchor="middle">(files/binaries)</text>
  <rect x="733.75" y="354.1667" width="450" height="153.0556" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="958.75" y="390.4167" font-size="26.0708" font-weight="bold" fill="var(--text)" text-anchor="middle">Job B</text>
  <text x="958.75" y="422.6389" font-size="17.3806" fill="var(--text-muted)" text-anchor="middle">- uses: actions/download-artifact</text>
  <text x="958.75" y="450.8333" font-family="monospace" font-size="13.9044" fill="var(--primary-accent)" text-anchor="middle">name: build-output</text>
  <text x="958.75" y="479.0277" font-size="13.9044" fill="var(--text-muted)" text-anchor="middle">files available in workspace</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="413.114754" height="295.087684" rx="6.907249" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="246.557377" y="70.526229" text-anchor="middle" font-size="18.007774" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Matrix strategy</text>
  <text x="59.672131" y="101.052711" font-size="15.006574" fill="var(--primary-accent)" font-family="Courier New, monospace">strategy:</text>
  <text x="59.672131" y="123.438773" font-size="15.006574" fill="var(--primary-accent)" font-family="Courier New, monospace">  matrix:</text>
  <text x="59.672131" y="145.824582" font-size="15.006574" fill="var(--text)" font-family="Courier New, monospace">    os: [ubuntu, windows, macos]</text>
  <text x="59.672131" y="168.210517" font-size="15.006574" fill="var(--text)" font-family="Courier New, monospace">    python: ['3.10', '3.11', '3.12']</text>
  <line x1="59.672131" y1="184.491358" x2="433.442623" y2="184.491358" stroke="var(--border)" stroke-width="0.8889"/>
  <text x="246.557377" y="210.94744" text-anchor="middle" font-size="15.006574" fill="var(--text-muted)" font-family="Arial, sans-serif">3×3 = <tspan font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">9 jobs</tspan>
  </text>
  <text x="59.672131" y="265.894805" font-size="14.005829" fill="var(--text)" font-family="Courier New, monospace">runs-on: ${{ matrix.os }}</text>
  <text x="59.672131" y="288.28074" font-size="14.005829" fill="var(--text)" font-family="Courier New, monospace">python: ${{ matrix.python }}</text>
  <text x="59.672131" y="318.807096" font-size="13.364721" fill="var(--text-faint)" font-family="Courier New, monospace">fail-fast: false</text>
  <line x1="455.082072" y1="187.544031" x2="521.967423" y2="187.544031" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)"/>
  <text x="488.52459" y="177.368537" text-anchor="middle" font-size="13.364721" fill="var(--primary-accent)" font-family="Arial, sans-serif">expands to</text>
  <text x="640" y="62.386062" text-anchor="middle" font-size="15.006574" font-weight="bold" fill="var(--text-muted)" font-family="Courier New, monospace">ubuntu</text>
  <text x="836.721416" y="62.386062" text-anchor="middle" font-size="15.006574" font-weight="bold" fill="var(--text-muted)" font-family="Courier New, monospace">windows</text>
  <text x="1033.442623" y="62.386062" text-anchor="middle" font-size="15.006574" font-weight="bold" fill="var(--text-muted)" font-family="Courier New, monospace">macos</text>
  <text x="531.803384" y="121.403573" text-anchor="end" font-size="14.005829" font-weight="bold" fill="var(--text-muted)" font-family="Courier New, monospace">3.10</text>
  <text x="531.803384" y="212.98264" text-anchor="end" font-size="14.005829" font-weight="bold" fill="var(--text-muted)" font-family="Courier New, monospace">3.11</text>
  <text x="531.803384" y="304.561581" text-anchor="end" font-size="14.005829" font-weight="bold" fill="var(--text-muted)" font-family="Courier New, monospace">3.12</text>
  <rect x="541.639344" y="76.631703" width="192.786885" height="77.333426" rx="6.907249" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="638.032787" y="111.228205" text-anchor="middle" font-size="14.005829" fill="var(--bg)" font-family="Arial, sans-serif">ubuntu / 3.10</text>
  <text x="638.032787" y="133.614267" text-anchor="middle" font-size="13.364721" fill="var(--primary-accent)" font-family="Courier New, monospace">✓ pass</text>
  <rect x="738.360656" y="76.631703" width="192.786885" height="77.333426" rx="6.907249" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="834.754098" y="111.228205" text-anchor="middle" font-size="14.005829" fill="var(--bg)" font-family="Arial, sans-serif">windows / 3.10</text>
  <text x="834.754098" y="133.614267" text-anchor="middle" font-size="13.364721" fill="var(--primary-accent)" font-family="Courier New, monospace">✓ pass</text>
  <rect x="935.082177" y="76.631703" width="192.786885" height="77.333426" rx="6.907249" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1031.475515" y="111.228205" text-anchor="middle" font-size="14.005829" fill="var(--bg)" font-family="Arial, sans-serif">macos / 3.10</text>
  <text x="1031.475515" y="133.614267" text-anchor="middle" font-size="13.364721" fill="var(--primary-accent)" font-family="Courier New, monospace">✓ pass</text>
  <rect x="541.639344" y="168.210517" width="192.786885" height="77.333426" rx="6.907249" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="638.032787" y="202.80702" text-anchor="middle" font-size="14.005829" fill="var(--text)" font-family="Arial, sans-serif">ubuntu / 3.11</text>
  <text x="638.032787" y="225.193081" text-anchor="middle" font-size="13.364721" fill="var(--text-muted)" font-family="Courier New, monospace">✓ pass</text>
  <rect x="738.360656" y="168.210517" width="192.786885" height="77.333426" rx="6.907249" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="834.754098" y="202.80702" text-anchor="middle" font-size="14.005829" fill="var(--danger-accent)" font-family="Arial, sans-serif">windows / 3.11</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1087.5767" height="474.8286" fill="var(--bg)" rx="5.7089" x="152.4233" y="145.1714"/>
  <rect x="177.9133" y="158.361" width="356.8611" height="191.2504" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="356.3438" y="178.1455" text-anchor="middle" font-family="sans-serif" font-size="13.4741" font-weight="bold" fill="var(--text)">Matrix strategy definition</text>
  <text x="194.9067" y="197.9301" font-family="monospace" font-size="11.2285" fill="var(--primary-accent)">strategy:</text>
  <text x="194.9067" y="212.4388" font-family="monospace" font-size="11.2285" fill="var(--primary-accent)">  matrix:</text>
  <text x="194.9067" y="226.9474" font-family="monospace" font-size="11.2285" fill="var(--text)">    os: [ubuntu, windows, macos]</text>
  <text x="194.9067" y="241.456" font-family="monospace" font-size="11.2285" fill="var(--text)">    python: ['3.10', '3.11', '3.12']</text>
  <line x1="194.9067" y1="252.0078" x2="517.781" y2="252.0078" stroke="var(--border)" stroke-width="0.8889" />
  <text x="356.3438" y="269.1544" text-anchor="middle" font-family="sans-serif" font-size="11.2285" fill="var(--text-muted)">3 OS × 3 versions = <tspan font-weight="bold" fill="var(--primary-accent)">9 parallel jobs</tspan>
  </text>
  <text x="194.9067" y="290.258" font-family="monospace" font-size="10.4797" fill="var(--text-faint)">    # use in steps:</text>
  <text x="194.9067" y="304.7665" font-family="monospace" font-size="10.4797" fill="var(--text)">runs-on: ${{ matrix.os }}</text>
  <text x="194.9067" y="319.2752" font-family="monospace" font-size="10.4797" fill="var(--text)">python-version: ${{ matrix.python }}</text>
  <text x="194.9067" y="339.0597" font-family="monospace" font-size="10" fill="var(--text-faint)">fail-fast: false  # run all even if one fails</text>
  <line x1="536.4738" y1="253.9863" x2="594.2514" y2="253.9863" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <text x="565.3625" y="247.3914" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--primary-accent)">expands to</text>
  <text x="696.2116" y="172.8697" text-anchor="middle" font-family="monospace" font-size="11.2285" font-weight="bold" fill="var(--text-muted)">ubuntu</text>
  <text x="866.1455" y="172.8697" text-anchor="middle" font-family="monospace" font-size="11.2285" font-weight="bold" fill="var(--text-muted)">windows</text>
  <text x="1036.0793" y="172.8697" text-anchor="middle" font-family="monospace" font-size="11.2285" font-weight="bold" fill="var(--text-muted)">macos</text>
  <text x="602.748" y="211.1198" text-anchor="end" font-family="monospace" font-size="10.4797" font-weight="bold" fill="var(--text-muted)">3.10</text>
  <text x="602.748" y="270.4734" text-anchor="end" font-family="monospace" font-size="10.4797" font-weight="bold" fill="var(--text-muted)">3.11</text>
  <text x="602.748" y="329.827" text-anchor="end" font-family="monospace" font-size="10.4797" font-weight="bold" fill="var(--text-muted)">3.12</text>
  <rect x="611.2446" y="182.1025" width="166.5352" height="50.1209" rx="5.7089" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="694.5122" y="204.525" text-anchor="middle" font-family="sans-serif" font-size="10.4797" fill="var(--bg)">ubuntu / 3.10</text>
  <text x="694.5122" y="219.0337" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--primary-accent)">✓ pass</text>
  <rect x="781.1785" y="182.1025" width="166.5352" height="50.1209" rx="5.7089" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="864.4461" y="204.525" text-anchor="middle" font-family="sans-serif" font-size="10.4797" fill="var(--bg)">windows / 3.10</text>
  <text x="864.4461" y="219.0337" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--primary-accent)">✓ pass</text>
  <rect x="951.1125" y="182.1025" width="166.5352" height="50.1209" rx="5.7089" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1034.38" y="204.525" text-anchor="middle" font-family="sans-serif" font-size="10.4797" fill="var(--bg)">macos / 3.10</text>
  <text x="1034.38" y="219.0337" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--primary-accent)">✓ pass</text>
  <rect x="611.2446" y="241.456" width="166.5352" height="50.1209" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="694.5122" y="263.8785" text-anchor="middle" font-family="sans-serif" font-size="10.4797" fill="var(--text)">ubuntu / 3.11</text>
  <text x="694.5122" y="278.3872" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--text-muted)">✓ pass</text>
  <rect x="781.1785" y="241.456" width="166.5352" height="50.1209" rx="5.7089" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="864.4461" y="263.8785" text-anchor="middle" font-family="sans-serif" font-size="10.4797" fill="var(--danger-accent)">windows / 3.11</text>
  <text x="864.4461" y="278.3872" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--danger-accent)">✗ fail</text>
  <rect x="951.1125" y="241.456" width="166.5352" height="50.1209" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1034.38" y="263.8785" text-anchor="middle" font-family="sans-serif" font-size="10.4797" fill="var(--text)">macos / 3.11</text>
  <text x="1034.38" y="278.3872" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--text-muted)">✓ pass</text>
  <rect x="611.2446" y="300.8096" width="166.5352" height="50.1209" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="694.5122" y="323.2321" text-anchor="middle" font-family="sans-serif" font-size="10.4797" fill="var(--text)">ubuntu / 3.12</text>
  <text x="694.5122" y="337.7408" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--text-muted)">✓ pass</text>
  <rect x="781.1785" y="300.8096" width="166.5352" height="50.1209" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="864.4461" y="323.2321" text-anchor="middle" font-family="sans-serif" font-size="10.4797" fill="var(--text)">windows / 3.12</text>
  <text x="864.4461" y="337.7408" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--text-muted)">✓ pass</text>
  <rect x="951.1125" y="300.8096" width="166.5352" height="50.1209" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1034.38" y="323.2321" text-anchor="middle" font-family="sans-serif" font-size="10.4797" fill="var(--text)">macos / 3.12</text>
  <text x="1034.38" y="337.7408" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--text-muted)">✓ pass</text>
  <rect x="611.2446" y="364.1201" width="506.4029" height="23.7414" rx="5.7089" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="864.4461" y="379.9477" text-anchor="middle" font-family="sans-serif" font-size="11.2285" fill="var(--primary-accent)">All 9 jobs run in parallel — one failure visible immediately</text>
  <rect x="177.9133" y="402.3702" width="1036.5965" height="131.8968" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="696.2116" y="422.1547" text-anchor="middle" font-family="sans-serif" font-size="12.7255" font-weight="bold" fill="var(--text)">Fine-tuning the matrix</text>
  <rect x="194.9067" y="432.7066" width="305.881" height="85.733" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="347.847" y="449.8531" text-anchor="middle" font-family="sans-serif" font-size="11.2285" font-weight="bold" fill="var(--text)">exclude — remove combinations</text>
  <text x="211.9" y="465.6807" font-family="monospace" font-size="10" fill="var(--text-muted)">exclude:</text>
  <text x="211.9" y="478.8704" font-family="monospace" font-size="10" fill="var(--text-muted)">  - os: windows</text>
  <text x="211.9" y="492.0601" font-family="monospace" font-size="10" fill="var(--text-muted)">    python: '3.10'</text>
  <text x="211.9" y="506.5687" font-family="sans-serif" font-size="10" fill="var(--text-faint)">removes windows/3.10 from grid</text>
  <rect x="543.2711" y="432.7066" width="305.881" height="85.733" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="696.2116" y="449.8531" text-anchor="middle" font-family="sans-serif" font-size="11.2285" font-weight="bold" fill="var(--text)">include — add extra combinations</text>
  <text x="560.2645" y="465.6807" font-family="monospace" font-size="10" fill="var(--text-muted)">include:</text>
  <text x="560.2645" y="478.8704" font-family="monospace" font-size="10" fill="var(--text-muted)">  - os: ubuntu</text>
  <text x="560.2645" y="492.0601" font-family="monospace" font-size="10" fill="var(--text-muted)">    python: '3.13-dev'</text>
  <text x="560.2645" y="506.5687" font-family="sans-serif" font-size="10" fill="var(--text-faint)">adds one extra experimental job</text>
  <rect x="891.6355" y="432.7066" width="305.881" height="85.733" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1044.5759" y="449.8531" text-anchor="middle" font-family="sans-serif" font-size="11.2285" font-weight="bold" fill="var(--primary-accent)">fail-fast</text>
  <text x="908.629" y="469.6376" font-family="monospace" font-size="10" fill="var(--text-muted)">fail-fast: true   # default</text>
  <text x="908.629" y="484.1463" font-family="sans-serif" font-size="10" fill="var(--text-muted)">cancel remaining jobs on first fail</text>
  <text x="908.629" y="501.2928" font-family="monospace" font-size="10" fill="var(--text-muted)">fail-fast: false</text>
  <text x="908.629" y="515.8016" font-family="sans-serif" font-size="10" fill="var(--text-muted)">run all jobs regardless</text>
</svg>
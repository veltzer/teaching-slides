  <text x="638.032787" y="316.772148" text-anchor="middle" font-size="13.364721" fill="var(--text-muted)" font-family="Courier New, monospace">✓ pass</text>
  <rect x="738.360656" y="259.789458" width="192.786885" height="77.333426" rx="6.907249" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="834.754098" y="294.386087" text-anchor="middle" font-size="14.005829" fill="var(--text)" font-family="Arial, sans-serif">windows / 3.12</text>
  <text x="834.754098" y="316.772148" text-anchor="middle" font-size="13.364721" fill="var(--text-muted)" font-family="Courier New, monospace">✓ pass</text>
  <rect x="935.082177" y="259.789458" width="192.786885" height="77.333426" rx="6.907249" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1031.475515" y="294.386087" text-anchor="middle" font-size="14.005829" fill="var(--text)" font-family="Arial, sans-serif">macos / 3.12</text>
  <text x="1031.475515" y="316.772148" text-anchor="middle" font-size="13.364721" fill="var(--text-muted)" font-family="Courier New, monospace">✓ pass</text>
  <rect x="541.639344" y="357.473745" width="586.229508" height="36.631576" rx="6.907249" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="834.754098" y="381.894754" text-anchor="middle" font-size="15.006574" fill="var(--primary-accent)" font-family="Arial, sans-serif">9 parallel jobs</text>
  <rect x="40" y="416.491257" width="1200" height="203.508743" rx="6.907249" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="447.017613" text-anchor="middle" font-size="17.007259" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Tuning</text>
  <rect x="59.672131" y="463.298453" width="354.098466" height="132.28079" rx="6.907249" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="236.721102" y="489.754536" text-anchor="middle" font-size="15.006574" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">exclude</text>
  <text x="79.344157" y="514.175545" font-size="13.364721" fill="var(--text-muted)" font-family="Courier New, monospace">exclude:</text>
  <text x="79.344157" y="534.526406" font-size="13.364721" fill="var(--text-muted)" font-family="Courier New, monospace">  - os: windows</text>
  <text x="79.344157" y="554.877394" font-size="13.364721" fill="var(--text-muted)" font-family="Courier New, monospace">    python: '3.10'</text>
  <text x="79.344157" y="577.263203" font-size="13.364721" fill="var(--text-faint)" font-family="Arial, sans-serif">drops windows/3.10</text>
  <rect x="462.95082" y="463.298453" width="354.098466" height="132.28079" rx="6.907249" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="489.754536" text-anchor="middle" font-size="15.006574" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">include</text>
  <text x="482.622951" y="514.175545" font-size="13.364721" fill="var(--text-muted)" font-family="Courier New, monospace">include:</text>
  <text x="482.622951" y="534.526406" font-size="13.364721" fill="var(--text-muted)" font-family="Courier New, monospace">  - os: ubuntu</text>
  <text x="482.622951" y="554.877394" font-size="13.364721" fill="var(--text-muted)" font-family="Courier New, monospace">    python: '3.13-dev'</text>
  <text x="482.622951" y="577.263203" font-size="13.364721" fill="var(--text-faint)" font-family="Arial, sans-serif">adds extra job</text>
  <rect x="866.229508" y="463.298453" width="354.098466" height="132.28079" rx="6.907249" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1043.278584" y="489.754536" text-anchor="middle" font-size="15.006574" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">fail-fast</text>
  <text x="885.901744" y="520.280765" font-size="13.364721" fill="var(--text-muted)" font-family="Courier New, monospace">fail-fast: true</text>
  <text x="885.901744" y="542.666827" font-size="13.364721" fill="var(--text-muted)" font-family="Arial, sans-serif">cancel on first fail</text>
  <text x="885.901744" y="569.122783" font-size="13.364721" fill="var(--text-muted)" font-family="Courier New, monospace">fail-fast: false</text>
  <text x="885.901744" y="591.50897" font-size="13.364721" fill="var(--text-muted)" font-family="Arial, sans-serif">run all</text>
</svg>

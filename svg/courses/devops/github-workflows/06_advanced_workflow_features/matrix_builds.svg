    </marker>

    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="var(--bg)" />
  <ns0:rect x="26.6667" y="17.7778" width="373.3333" height="257.7778" rx="7.1111" fill="var(--surface-dark)" stroke="var(--border)" stroke-width="1.3333" />
  <ns0:text x="213.3333" y="44.4444" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Matrix strategy definition</ns0:text>
  <ns0:text x="44.4444" y="71.1111" font-family="monospace" font-size="13.3333" fill="var(--primary-dk)">strategy:</ns0:text>
  <ns0:text x="44.4444" y="90.6667" font-family="monospace" font-size="13.3333" fill="var(--primary-dk)">  matrix:</ns0:text>
  <ns0:text x="44.4444" y="110.2222" font-family="monospace" font-size="13.3333" fill="var(--text)">    os: [ubuntu, windows, macos]</ns0:text>
  <ns0:text x="44.4444" y="129.7778" font-family="monospace" font-size="13.3333" fill="var(--text)">    python: ['3.10', '3.11', '3.12']</ns0:text>
  <ns0:line x1="44.4444" y1="144" x2="382.2222" y2="144" stroke="var(--border)" stroke-width="0.8889" />
  <ns0:text x="213.3333" y="167.1111" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">3 OS × 3 versions = <ns0:tspan font-weight="bold" fill="var(--primary-dk)">9 parallel jobs</ns0:tspan>
  </ns0:text>
  <ns0:text x="44.4444" y="195.5556" font-family="monospace" font-size="12.4444" fill="var(--text-disabled)">    # use in steps:</ns0:text>
  <ns0:text x="44.4444" y="215.1111" font-family="monospace" font-size="12.4444" fill="var(--text)">runs-on: ${{ matrix.os }}</ns0:text>
  <ns0:text x="44.4444" y="234.6667" font-family="monospace" font-size="12.4444" fill="var(--text)">python-version: ${{ matrix.python }}</ns0:text>
  <ns0:text x="44.4444" y="261.3333" font-family="monospace" font-size="11.5556" fill="var(--text-disabled)">fail-fast: false  # run all even if one fails</ns0:text>
  <ns0:line x1="401.7778" y1="146.6667" x2="462.2222" y2="146.6667" stroke="var(--primary-dk)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <ns0:text x="432" y="137.7778" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--primary-dk)">expands to</ns0:text>
  <ns0:text x="568.8889" y="37.3333" text-anchor="middle" font-family="monospace" font-size="13.3333" font-weight="bold" fill="var(--text-muted)">ubuntu</ns0:text>
  <ns0:text x="746.6667" y="37.3333" text-anchor="middle" font-family="monospace" font-size="13.3333" font-weight="bold" fill="var(--text-muted)">windows</ns0:text>
  <ns0:text x="924.4444" y="37.3333" text-anchor="middle" font-family="monospace" font-size="13.3333" font-weight="bold" fill="var(--text-muted)">macos</ns0:text>
  <ns0:text x="471.1111" y="88.8889" text-anchor="end" font-family="monospace" font-size="12.4444" font-weight="bold" fill="var(--text-muted)">3.10</ns0:text>
  <ns0:text x="471.1111" y="168.8889" text-anchor="end" font-family="monospace" font-size="12.4444" font-weight="bold" fill="var(--text-muted)">3.11</ns0:text>
  <ns0:text x="471.1111" y="248.8889" text-anchor="end" font-family="monospace" font-size="12.4444" font-weight="bold" fill="var(--text-muted)">3.12</ns0:text>

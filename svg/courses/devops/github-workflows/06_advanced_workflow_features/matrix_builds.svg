<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="26.6667" y="17.7778" width="373.3333" height="257.7778" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="213.3333" y="44.4444" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Matrix strategy definition</text>
  <text x="44.4444" y="71.1111" font-family="monospace" font-size="13.3333" fill="var(--primary-accent)">strategy:</text>
  <text x="44.4444" y="90.6667" font-family="monospace" font-size="13.3333" fill="var(--primary-accent)">  matrix:</text>
  <text x="44.4444" y="110.2222" font-family="monospace" font-size="13.3333" fill="var(--text)">    os: [ubuntu, windows, macos]</text>
  <text x="44.4444" y="129.7778" font-family="monospace" font-size="13.3333" fill="var(--text)">    python: ['3.10', '3.11', '3.12']</text>
  <line x1="44.4444" y1="144" x2="382.2222" y2="144" stroke="var(--border)" stroke-width="0.8889" />
  <text x="213.3333" y="167.1111" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">3 OS × 3 versions = <tspan font-weight="bold" fill="var(--primary-accent)">9 parallel jobs</tspan>
  </text>
  <text x="44.4444" y="195.5556" font-family="monospace" font-size="12.4444" fill="var(--text-faint)">    # use in steps:</text>
  <text x="44.4444" y="215.1111" font-family="monospace" font-size="12.4444" fill="var(--text)">runs-on: ${{ matrix.os }}</text>
  <text x="44.4444" y="234.6667" font-family="monospace" font-size="12.4444" fill="var(--text)">python-version: ${{ matrix.python }}</text>
  <text x="44.4444" y="261.3333" font-family="monospace" font-size="11.5556" fill="var(--text-faint)">fail-fast: false  # run all even if one fails</text>
  <line x1="401.7778" y1="146.6667" x2="462.2222" y2="146.6667" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <text x="432" y="137.7778" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--primary-accent)">expands to</text>
  <text x="568.8889" y="37.3333" text-anchor="middle" font-family="monospace" font-size="13.3333" font-weight="bold" fill="var(--text-muted)">ubuntu</text>
  <text x="746.6667" y="37.3333" text-anchor="middle" font-family="monospace" font-size="13.3333" font-weight="bold" fill="var(--text-muted)">windows</text>
  <text x="924.4444" y="37.3333" text-anchor="middle" font-family="monospace" font-size="13.3333" font-weight="bold" fill="var(--text-muted)">macos</text>
  <text x="471.1111" y="88.8889" text-anchor="end" font-family="monospace" font-size="12.4444" font-weight="bold" fill="var(--text-muted)">3.10</text>
  <text x="471.1111" y="168.8889" text-anchor="end" font-family="monospace" font-size="12.4444" font-weight="bold" fill="var(--text-muted)">3.11</text>
  <text x="471.1111" y="248.8889" text-anchor="end" font-family="monospace" font-size="12.4444" font-weight="bold" fill="var(--text-muted)">3.12</text>
  <rect x="480" y="49.7778" width="174.2222" height="67.5556" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="567.1111" y="80" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--bg)">ubuntu / 3.10</text>
  <text x="567.1111" y="99.5556" text-anchor="middle" font-family="monospace" font-size="10.6667" fill="var(--primary-accent)">✓ pass</text>
  <rect x="657.7778" y="49.7778" width="174.2222" height="67.5556" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="744.8889" y="80" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--bg)">windows / 3.10</text>
  <text x="744.8889" y="99.5556" text-anchor="middle" font-family="monospace" font-size="10.6667" fill="var(--primary-accent)">✓ pass</text>
  <rect x="835.5556" y="49.7778" width="174.2222" height="67.5556" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="922.6667" y="80" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--bg)">macos / 3.10</text>
  <text x="922.6667" y="99.5556" text-anchor="middle" font-family="monospace" font-size="10.6667" fill="var(--primary-accent)">✓ pass</text>
  <rect x="480" y="129.7778" width="174.2222" height="67.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="567.1111" y="160" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text)">ubuntu / 3.11</text>
  <text x="567.1111" y="179.5556" text-anchor="middle" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">✓ pass</text>
  <rect x="657.7778" y="129.7778" width="174.2222" height="67.5556" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="744.8889" y="160" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--danger-accent)">windows / 3.11</text>
  <text x="744.8889" y="179.5556" text-anchor="middle" font-family="monospace" font-size="10.6667" fill="var(--danger-accent)">✗ fail</text>
  <rect x="835.5556" y="129.7778" width="174.2222" height="67.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="922.6667" y="160" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text)">macos / 3.11</text>
  <text x="922.6667" y="179.5556" text-anchor="middle" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">✓ pass</text>
  <rect x="480" y="209.7778" width="174.2222" height="67.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="567.1111" y="240" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text)">ubuntu / 3.12</text>
  <text x="567.1111" y="259.5556" text-anchor="middle" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">✓ pass</text>
  <rect x="657.7778" y="209.7778" width="174.2222" height="67.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="744.8889" y="240" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text)">windows / 3.12</text>
  <text x="744.8889" y="259.5556" text-anchor="middle" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">✓ pass</text>
  <rect x="835.5556" y="209.7778" width="174.2222" height="67.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="922.6667" y="240" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text)">macos / 3.12</text>
  <text x="922.6667" y="259.5556" text-anchor="middle" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">✓ pass</text>
  <rect x="480" y="295.1111" width="529.7778" height="32" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="744.8889" y="316.4444" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--primary-accent)">All 9 jobs run in parallel — one failure visible immediately</text>
  <rect x="26.6667" y="346.6667" width="1084.4444" height="177.7778" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="568.8889" y="373.3333" text-anchor="middle" font-family="sans-serif" font-size="15.1111" font-weight="bold" fill="var(--text)">Fine-tuning the matrix</text>
  <rect x="44.4444" y="387.5556" width="320" height="115.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="204.4444" y="410.6667" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--text)">exclude — remove combinations</text>
  <text x="62.2222" y="432" font-family="monospace" font-size="11.5556" fill="var(--text-muted)">exclude:</text>
  <text x="62.2222" y="449.7778" font-family="monospace" font-size="11.5556" fill="var(--text-muted)">  - os: windows</text>
  <text x="62.2222" y="467.5556" font-family="monospace" font-size="11.5556" fill="var(--text-muted)">    python: '3.10'</text>
  <text x="62.2222" y="487.1111" font-family="sans-serif" font-size="11.5556" fill="var(--text-faint)">removes windows/3.10 from grid</text>
  <rect x="408.8889" y="387.5556" width="320" height="115.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="568.8889" y="410.6667" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--text)">include — add extra combinations</text>
  <text x="426.6667" y="432" font-family="monospace" font-size="11.5556" fill="var(--text-muted)">include:</text>
  <text x="426.6667" y="449.7778" font-family="monospace" font-size="11.5556" fill="var(--text-muted)">  - os: ubuntu</text>
  <text x="426.6667" y="467.5556" font-family="monospace" font-size="11.5556" fill="var(--text-muted)">    python: '3.13-dev'</text>
  <text x="426.6667" y="487.1111" font-family="sans-serif" font-size="11.5556" fill="var(--text-faint)">adds one extra experimental job</text>
  <rect x="773.3333" y="387.5556" width="320" height="115.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="933.3333" y="410.6667" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--primary-accent)">fail-fast</text>
  <text x="791.1111" y="437.3333" font-family="monospace" font-size="11.5556" fill="var(--text-muted)">fail-fast: true   # default</text>
  <text x="791.1111" y="456.8889" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">cancel remaining jobs on first fail</text>
  <text x="791.1111" y="480" font-family="monospace" font-size="11.5556" fill="var(--text-muted)">fail-fast: false</text>
  <text x="791.1111" y="499.5556" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">run all jobs regardless</text>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#ffffff" />
      <ns0:stop offset="100%" stop-color="#f2f2f2" />
    </ns0:linearGradient>
    <ns0:filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <ns0:feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </ns0:filter>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="26.6667" y="17.7778" width="373.3333" height="257.7778" rx="7.1111" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.3333" />
  <ns0:text x="213.3333" y="44.4444" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#212121">Matrix strategy definition</ns0:text>
  <ns0:text x="44.4444" y="71.1111" font-family="monospace" font-size="13.3333" fill="#1565c0">strategy:</ns0:text>
  <ns0:text x="44.4444" y="90.6667" font-family="monospace" font-size="13.3333" fill="#1565c0">  matrix:</ns0:text>
  <ns0:text x="44.4444" y="110.2222" font-family="monospace" font-size="13.3333" fill="#212121">    os: [ubuntu, windows, macos]</ns0:text>
  <ns0:text x="44.4444" y="129.7778" font-family="monospace" font-size="13.3333" fill="#212121">    python: ['3.10', '3.11', '3.12']</ns0:text>
  <ns0:line x1="44.4444" y1="144" x2="382.2222" y2="144" stroke="#e0e0e0" stroke-width="0.8889" />
  <ns0:text x="213.3333" y="167.1111" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#555555">3 OS × 3 versions = <ns0:tspan font-weight="bold" fill="#1565c0">9 parallel jobs</ns0:tspan>
  </ns0:text>
  <ns0:text x="44.4444" y="195.5556" font-family="monospace" font-size="12.4444" fill="#9e9e9e">    # use in steps:</ns0:text>
  <ns0:text x="44.4444" y="215.1111" font-family="monospace" font-size="12.4444" fill="#212121">runs-on: ${{ matrix.os }}</ns0:text>
  <ns0:text x="44.4444" y="234.6667" font-family="monospace" font-size="12.4444" fill="#212121">python-version: ${{ matrix.python }}</ns0:text>
  <ns0:text x="44.4444" y="261.3333" font-family="monospace" font-size="11.5556" fill="#9e9e9e">fail-fast: false  # run all even if one fails</ns0:text>
  <ns0:line x1="401.7778" y1="146.6667" x2="462.2222" y2="146.6667" stroke="#1565c0" stroke-width="1.7778" marker-end="url(#arrow-accent)" />
  <ns0:text x="432" y="137.7778" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="#1565c0">expands to</ns0:text>
  <ns0:text x="568.8889" y="37.3333" text-anchor="middle" font-family="monospace" font-size="13.3333" font-weight="bold" fill="#555555">ubuntu</ns0:text>
  <ns0:text x="746.6667" y="37.3333" text-anchor="middle" font-family="monospace" font-size="13.3333" font-weight="bold" fill="#555555">windows</ns0:text>
  <ns0:text x="924.4444" y="37.3333" text-anchor="middle" font-family="monospace" font-size="13.3333" font-weight="bold" fill="#555555">macos</ns0:text>
  <ns0:text x="471.1111" y="88.8889" text-anchor="end" font-family="monospace" font-size="12.4444" font-weight="bold" fill="#555555">3.10</ns0:text>
  <ns0:text x="471.1111" y="168.8889" text-anchor="end" font-family="monospace" font-size="12.4444" font-weight="bold" fill="#555555">3.11</ns0:text>
  <ns0:text x="471.1111" y="248.8889" text-anchor="end" font-family="monospace" font-size="12.4444" font-weight="bold" fill="#555555">3.12</ns0:text>
  <ns0:rect x="480" y="49.7778" width="174.2222" height="67.5556" rx="5.3333" fill="url(#grad-accent)" filter="url(#shadow)" />
  <ns0:text x="567.1111" y="80" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#ffffff">ubuntu / 3.10</ns0:text>
  <ns0:text x="567.1111" y="99.5556" text-anchor="middle" font-family="monospace" font-size="10.6667" fill="#bbdefb">✓ pass</ns0:text>
  <ns0:rect x="657.7778" y="49.7778" width="174.2222" height="67.5556" rx="5.3333" fill="url(#grad-accent)" filter="url(#shadow)" />
  <ns0:text x="744.8889" y="80" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#ffffff">windows / 3.10</ns0:text>
  <ns0:text x="744.8889" y="99.5556" text-anchor="middle" font-family="monospace" font-size="10.6667" fill="#bbdefb">✓ pass</ns0:text>
  <ns0:rect x="835.5556" y="49.7778" width="174.2222" height="67.5556" rx="5.3333" fill="url(#grad-accent)" filter="url(#shadow)" />
  <ns0:text x="922.6667" y="80" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#ffffff">macos / 3.10</ns0:text>
  <ns0:text x="922.6667" y="99.5556" text-anchor="middle" font-family="monospace" font-size="10.6667" fill="#bbdefb">✓ pass</ns0:text>
  <ns0:rect x="480" y="129.7778" width="174.2222" height="67.5556" rx="5.3333" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="567.1111" y="160" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#212121">ubuntu / 3.11</ns0:text>
  <ns0:text x="567.1111" y="179.5556" text-anchor="middle" font-family="monospace" font-size="10.6667" fill="#555555">✓ pass</ns0:text>
  <ns0:rect x="657.7778" y="129.7778" width="174.2222" height="67.5556" rx="5.3333" fill="#ffebee" stroke="#c62828" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="744.8889" y="160" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#c62828">windows / 3.11</ns0:text>
  <ns0:text x="744.8889" y="179.5556" text-anchor="middle" font-family="monospace" font-size="10.6667" fill="#c62828">✗ fail</ns0:text>
  <ns0:rect x="835.5556" y="129.7778" width="174.2222" height="67.5556" rx="5.3333" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="922.6667" y="160" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#212121">macos / 3.11</ns0:text>
  <ns0:text x="922.6667" y="179.5556" text-anchor="middle" font-family="monospace" font-size="10.6667" fill="#555555">✓ pass</ns0:text>
  <ns0:rect x="480" y="209.7778" width="174.2222" height="67.5556" rx="5.3333" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="567.1111" y="240" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#212121">ubuntu / 3.12</ns0:text>
  <ns0:text x="567.1111" y="259.5556" text-anchor="middle" font-family="monospace" font-size="10.6667" fill="#555555">✓ pass</ns0:text>
  <ns0:rect x="657.7778" y="209.7778" width="174.2222" height="67.5556" rx="5.3333" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="744.8889" y="240" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#212121">windows / 3.12</ns0:text>
  <ns0:text x="744.8889" y="259.5556" text-anchor="middle" font-family="monospace" font-size="10.6667" fill="#555555">✓ pass</ns0:text>
  <ns0:rect x="835.5556" y="209.7778" width="174.2222" height="67.5556" rx="5.3333" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="922.6667" y="240" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#212121">macos / 3.12</ns0:text>
  <ns0:text x="922.6667" y="259.5556" text-anchor="middle" font-family="monospace" font-size="10.6667" fill="#555555">✓ pass</ns0:text>
  <ns0:rect x="480" y="295.1111" width="529.7778" height="32" rx="3.5556" fill="#e3f2fd" stroke="#1565c0" stroke-width="0.8889" />
  <ns0:text x="744.8889" y="316.4444" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#1565c0">All 9 jobs run in parallel — one failure visible immediately</ns0:text>
  <ns0:rect x="26.6667" y="346.6667" width="1084.4444" height="177.7778" rx="7.1111" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="373.3333" text-anchor="middle" font-family="sans-serif" font-size="15.1111" font-weight="bold" fill="#212121">Fine-tuning the matrix</ns0:text>
  <ns0:rect x="44.4444" y="387.5556" width="320" height="115.5556" rx="5.3333" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" />
  <ns0:text x="204.4444" y="410.6667" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="#212121">exclude — remove combinations</ns0:text>
  <ns0:text x="62.2222" y="432" font-family="monospace" font-size="11.5556" fill="#555555">exclude:</ns0:text>
  <ns0:text x="62.2222" y="449.7778" font-family="monospace" font-size="11.5556" fill="#555555">  - os: windows</ns0:text>
  <ns0:text x="62.2222" y="467.5556" font-family="monospace" font-size="11.5556" fill="#555555">    python: '3.10'</ns0:text>
  <ns0:text x="62.2222" y="487.1111" font-family="sans-serif" font-size="11.5556" fill="#9e9e9e">removes windows/3.10 from grid</ns0:text>
  <ns0:rect x="408.8889" y="387.5556" width="320" height="115.5556" rx="5.3333" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="410.6667" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="#212121">include — add extra combinations</ns0:text>
  <ns0:text x="426.6667" y="432" font-family="monospace" font-size="11.5556" fill="#555555">include:</ns0:text>
  <ns0:text x="426.6667" y="449.7778" font-family="monospace" font-size="11.5556" fill="#555555">  - os: ubuntu</ns0:text>
  <ns0:text x="426.6667" y="467.5556" font-family="monospace" font-size="11.5556" fill="#555555">    python: '3.13-dev'</ns0:text>
  <ns0:text x="426.6667" y="487.1111" font-family="sans-serif" font-size="11.5556" fill="#9e9e9e">adds one extra experimental job</ns0:text>
  <ns0:rect x="773.3333" y="387.5556" width="320" height="115.5556" rx="5.3333" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="933.3333" y="410.6667" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="#1565c0">fail-fast</ns0:text>
  <ns0:text x="791.1111" y="437.3333" font-family="monospace" font-size="11.5556" fill="#555555">fail-fast: true   # default</ns0:text>
  <ns0:text x="791.1111" y="456.8889" font-family="sans-serif" font-size="11.5556" fill="#555555">cancel remaining jobs on first fail</ns0:text>
  <ns0:text x="791.1111" y="480" font-family="monospace" font-size="11.5556" fill="#555555">fail-fast: false</ns0:text>
  <ns0:text x="791.1111" y="499.5556" font-family="sans-serif" font-size="11.5556" fill="#555555">run all jobs regardless</ns0:text>
</ns0:svg>
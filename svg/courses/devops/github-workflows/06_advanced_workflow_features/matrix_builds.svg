  <ns0:text x="567.1111" y="80" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--bg)">ubuntu / 3.10</ns0:text>
  <ns0:text x="567.1111" y="99.5556" text-anchor="middle" font-family="monospace" font-size="10.6667" fill="var(--primary-lt)">✓ pass</ns0:text>
  <ns0:rect x="657.7778" y="49.7778" width="174.2222" height="67.5556" rx="5.3333" fill="url(#grad-primary)" filter="url(#shadow)" />
  <ns0:text x="744.8889" y="80" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--bg)">windows / 3.10</ns0:text>
  <ns0:text x="744.8889" y="99.5556" text-anchor="middle" font-family="monospace" font-size="10.6667" fill="var(--primary-lt)">✓ pass</ns0:text>
  <ns0:rect x="835.5556" y="49.7778" width="174.2222" height="67.5556" rx="5.3333" fill="url(#grad-primary)" filter="url(#shadow)" />
  <ns0:text x="922.6667" y="80" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--bg)">macos / 3.10</ns0:text>
  <ns0:text x="922.6667" y="99.5556" text-anchor="middle" font-family="monospace" font-size="10.6667" fill="var(--primary-lt)">✓ pass</ns0:text>
  <ns0:rect x="480" y="129.7778" width="174.2222" height="67.5556" rx="5.3333" fill="url(#grad-surface)" stroke="var(--primary-dk)" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="567.1111" y="160" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text)">ubuntu / 3.11</ns0:text>
  <ns0:text x="567.1111" y="179.5556" text-anchor="middle" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">✓ pass</ns0:text>
  <ns0:rect x="657.7778" y="129.7778" width="174.2222" height="67.5556" rx="5.3333" fill="var(--danger-pale)" stroke="var(--danger-dk)" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="744.8889" y="160" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--danger-dk)">windows / 3.11</ns0:text>
  <ns0:text x="744.8889" y="179.5556" text-anchor="middle" font-family="monospace" font-size="10.6667" fill="var(--danger-dk)">✗ fail</ns0:text>
  <ns0:rect x="835.5556" y="129.7778" width="174.2222" height="67.5556" rx="5.3333" fill="url(#grad-surface)" stroke="var(--primary-dk)" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="922.6667" y="160" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text)">macos / 3.11</ns0:text>
  <ns0:text x="922.6667" y="179.5556" text-anchor="middle" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">✓ pass</ns0:text>
  <ns0:rect x="480" y="209.7778" width="174.2222" height="67.5556" rx="5.3333" fill="url(#grad-surface)" stroke="var(--primary-dk)" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="567.1111" y="240" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text)">ubuntu / 3.12</ns0:text>
  <ns0:text x="567.1111" y="259.5556" text-anchor="middle" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">✓ pass</ns0:text>
  <ns0:rect x="657.7778" y="209.7778" width="174.2222" height="67.5556" rx="5.3333" fill="url(#grad-surface)" stroke="var(--primary-dk)" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="744.8889" y="240" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text)">windows / 3.12</ns0:text>
  <ns0:text x="744.8889" y="259.5556" text-anchor="middle" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">✓ pass</ns0:text>
  <ns0:rect x="835.5556" y="209.7778" width="174.2222" height="67.5556" rx="5.3333" fill="url(#grad-surface)" stroke="var(--primary-dk)" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="922.6667" y="240" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text)">macos / 3.12</ns0:text>
  <ns0:text x="922.6667" y="259.5556" text-anchor="middle" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">✓ pass</ns0:text>
  <ns0:rect x="480" y="295.1111" width="529.7778" height="32" rx="3.5556" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="0.8889" />
  <ns0:text x="744.8889" y="316.4444" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--primary-dk)">All 9 jobs run in parallel — one failure visible immediately</ns0:text>
  <ns0:rect x="26.6667" y="346.6667" width="1084.4444" height="177.7778" rx="7.1111" fill="var(--surface-dark)" stroke="var(--border)" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="373.3333" text-anchor="middle" font-family="sans-serif" font-size="15.1111" font-weight="bold" fill="var(--text)">Fine-tuning the matrix</ns0:text>
  <ns0:rect x="44.4444" y="387.5556" width="320" height="115.5556" rx="5.3333" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="1.3333" />
  <ns0:text x="204.4444" y="410.6667" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--text)">exclude — remove combinations</ns0:text>
  <ns0:text x="62.2222" y="432" font-family="monospace" font-size="11.5556" fill="var(--text-muted)">exclude:</ns0:text>
  <ns0:text x="62.2222" y="449.7778" font-family="monospace" font-size="11.5556" fill="var(--text-muted)">  - os: windows</ns0:text>
  <ns0:text x="62.2222" y="467.5556" font-family="monospace" font-size="11.5556" fill="var(--text-muted)">    python: '3.10'</ns0:text>
  <ns0:text x="62.2222" y="487.1111" font-family="sans-serif" font-size="11.5556" fill="var(--text-disabled)">removes windows/3.10 from grid</ns0:text>
  <ns0:rect x="408.8889" y="387.5556" width="320" height="115.5556" rx="5.3333" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="410.6667" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--text)">include — add extra combinations</ns0:text>
  <ns0:text x="426.6667" y="432" font-family="monospace" font-size="11.5556" fill="var(--text-muted)">include:</ns0:text>
  <ns0:text x="426.6667" y="449.7778" font-family="monospace" font-size="11.5556" fill="var(--text-muted)">  - os: ubuntu</ns0:text>
  <ns0:text x="426.6667" y="467.5556" font-family="monospace" font-size="11.5556" fill="var(--text-muted)">    python: '3.13-dev'</ns0:text>
  <ns0:text x="426.6667" y="487.1111" font-family="sans-serif" font-size="11.5556" fill="var(--text-disabled)">adds one extra experimental job</ns0:text>
  <ns0:rect x="773.3333" y="387.5556" width="320" height="115.5556" rx="5.3333" fill="url(#grad-surface)" stroke="var(--primary-dk)" stroke-width="1.3333" />
  <ns0:text x="933.3333" y="410.6667" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--primary-dk)">fail-fast</ns0:text>
  <ns0:text x="791.1111" y="437.3333" font-family="monospace" font-size="11.5556" fill="var(--text-muted)">fail-fast: true   # default</ns0:text>
  <ns0:text x="791.1111" y="456.8889" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">cancel remaining jobs on first fail</ns0:text>
  <ns0:text x="791.1111" y="480" font-family="monospace" font-size="11.5556" fill="var(--text-muted)">fail-fast: false</ns0:text>
  <ns0:text x="791.1111" y="499.5556" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">run all jobs regardless</ns0:text>
</ns0:svg>
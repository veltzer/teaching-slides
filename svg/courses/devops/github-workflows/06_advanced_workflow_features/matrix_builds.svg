<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6.6276" x="40" y="40"/>
  <rect x="68.1249" y="56.111" width="393.75" height="233.6111" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="264.9999" y="80.2776" text-anchor="middle" font-family="sans-serif" font-size="15.6425" font-weight="bold" fill="var(--text)">Matrix strategy definition</text>
  <text x="86.8749" y="104.4444" font-family="monospace" font-size="13.0355" fill="var(--primary-accent)">strategy:</text>
  <text x="86.8749" y="122.1667" font-family="monospace" font-size="13.0355" fill="var(--primary-accent)">  matrix:</text>
  <text x="86.8749" y="139.8888" font-family="monospace" font-size="13.0355" fill="var(--text)">    os: [ubuntu, windows, macos]</text>
  <text x="86.8749" y="157.611" font-family="monospace" font-size="13.0355" fill="var(--text)">    python: ['3.10', '3.11', '3.12']</text>
  <line x1="86.8749" y1="170.5" x2="443.1249" y2="170.5" stroke="var(--border)" stroke-width="0.8889" />
  <text x="264.9999" y="191.4444" text-anchor="middle" font-family="sans-serif" font-size="13.0355" fill="var(--text-muted)">3 OS × 3 versions = <tspan font-weight="bold" fill="var(--primary-accent)">9 parallel jobs</tspan>
  </text>
  <text x="86.8749" y="217.2223" font-family="monospace" font-size="12.1662" fill="var(--text-faint)">    # use in steps:</text>
  <text x="86.8749" y="234.9444" font-family="monospace" font-size="12.1662" fill="var(--text)">runs-on: ${{ matrix.os }}</text>
  <text x="86.8749" y="252.6666" font-family="monospace" font-size="12.1662" fill="var(--text)">python-version: ${{ matrix.python }}</text>
  <text x="86.8749" y="276.8333" font-family="monospace" font-size="11.6093" fill="var(--text-faint)">fail-fast: false  # run all even if one fails</text>
  <line x1="463.75" y1="172.9167" x2="527.5001" y2="172.9167" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <text x="495.6249" y="164.8611" text-anchor="middle" font-family="sans-serif" font-size="11.6093" fill="var(--primary-accent)">expands to</text>
  <text x="639.9999" y="73.8333" text-anchor="middle" font-family="monospace" font-size="13.0355" font-weight="bold" fill="var(--text-muted)">ubuntu</text>
  <text x="827.5" y="73.8333" text-anchor="middle" font-family="monospace" font-size="13.0355" font-weight="bold" fill="var(--text-muted)">windows</text>
  <text x="1014.9999" y="73.8333" text-anchor="middle" font-family="monospace" font-size="13.0355" font-weight="bold" fill="var(--text-muted)">macos</text>
  <text x="536.875" y="120.5555" text-anchor="end" font-family="monospace" font-size="12.1662" font-weight="bold" fill="var(--text-muted)">3.10</text>
  <text x="536.875" y="193.0556" text-anchor="end" font-family="monospace" font-size="12.1662" font-weight="bold" fill="var(--text-muted)">3.11</text>
  <text x="536.875" y="265.5556" text-anchor="end" font-family="monospace" font-size="12.1662" font-weight="bold" fill="var(--text-muted)">3.12</text>
  <rect x="546.2499" y="85.1111" width="183.75" height="61.2223" rx="6.6276" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="638.1249" y="112.5" text-anchor="middle" font-family="sans-serif" font-size="12.1662" fill="var(--bg)">ubuntu / 3.10</text>
  <text x="638.1249" y="130.2223" text-anchor="middle" font-family="monospace" font-size="11.6093" fill="var(--primary-accent)">✓ pass</text>
  <rect x="733.7499" y="85.1111" width="183.75" height="61.2223" rx="6.6276" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="825.6249" y="112.5" text-anchor="middle" font-family="sans-serif" font-size="12.1662" fill="var(--bg)">windows / 3.10</text>
  <text x="825.6249" y="130.2223" text-anchor="middle" font-family="monospace" font-size="11.6093" fill="var(--primary-accent)">✓ pass</text>
  <rect x="921.2501" y="85.1111" width="183.75" height="61.2223" rx="6.6276" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1013.125" y="112.5" text-anchor="middle" font-family="sans-serif" font-size="12.1662" fill="var(--bg)">macos / 3.10</text>
  <text x="1013.125" y="130.2223" text-anchor="middle" font-family="monospace" font-size="11.6093" fill="var(--primary-accent)">✓ pass</text>
  <rect x="546.2499" y="157.611" width="183.75" height="61.2223" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="638.1249" y="184.9999" text-anchor="middle" font-family="sans-serif" font-size="12.1662" fill="var(--text)">ubuntu / 3.11</text>
  <text x="638.1249" y="202.7222" text-anchor="middle" font-family="monospace" font-size="11.6093" fill="var(--text-muted)">✓ pass</text>
  <rect x="733.7499" y="157.611" width="183.75" height="61.2223" rx="6.6276" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="825.6249" y="184.9999" text-anchor="middle" font-family="sans-serif" font-size="12.1662" fill="var(--danger-accent)">windows / 3.11</text>
  <text x="825.6249" y="202.7222" text-anchor="middle" font-family="monospace" font-size="11.6093" fill="var(--danger-accent)">✗ fail</text>
  <rect x="921.2501" y="157.611" width="183.75" height="61.2223" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1013.125" y="184.9999" text-anchor="middle" font-family="sans-serif" font-size="12.1662" fill="var(--text)">macos / 3.11</text>
  <text x="1013.125" y="202.7222" text-anchor="middle" font-family="monospace" font-size="11.6093" fill="var(--text-muted)">✓ pass</text>
  <rect x="546.2499" y="230.111" width="183.75" height="61.2223" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="638.1249" y="257.5" text-anchor="middle" font-family="sans-serif" font-size="12.1662" fill="var(--text)">ubuntu / 3.12</text>
  <text x="638.1249" y="275.2223" text-anchor="middle" font-family="monospace" font-size="11.6093" fill="var(--text-muted)">✓ pass</text>
  <rect x="733.7499" y="230.111" width="183.75" height="61.2223" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="825.6249" y="257.5" text-anchor="middle" font-family="sans-serif" font-size="12.1662" fill="var(--text)">windows / 3.12</text>
  <text x="825.6249" y="275.2223" text-anchor="middle" font-family="monospace" font-size="11.6093" fill="var(--text-muted)">✓ pass</text>
  <rect x="921.2501" y="230.111" width="183.75" height="61.2223" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1013.125" y="257.5" text-anchor="middle" font-family="sans-serif" font-size="12.1662" fill="var(--text)">macos / 3.12</text>
  <text x="1013.125" y="275.2223" text-anchor="middle" font-family="monospace" font-size="11.6093" fill="var(--text-muted)">✓ pass</text>
  <rect x="546.2499" y="307.4444" width="558.75" height="29" rx="6.6276" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="825.6249" y="326.7777" text-anchor="middle" font-family="sans-serif" font-size="13.0355" fill="var(--primary-accent)">All 9 jobs run in parallel — one failure visible immediately</text>
  <rect x="68.1249" y="354.1666" width="1143.75" height="161.1111" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="639.9999" y="378.3333" text-anchor="middle" font-family="sans-serif" font-size="14.7734" font-weight="bold" fill="var(--text)">Fine-tuning the matrix</text>
  <rect x="86.8749" y="391.2223" width="337.5001" height="104.7223" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="255.6247" y="412.1667" text-anchor="middle" font-family="sans-serif" font-size="13.0355" font-weight="bold" fill="var(--text)">exclude — remove combinations</text>
  <text x="105.6248" y="431.5" font-family="monospace" font-size="11.6093" fill="var(--text-muted)">exclude:</text>
  <text x="105.6248" y="447.6111" font-family="monospace" font-size="11.6093" fill="var(--text-muted)">  - os: windows</text>
  <text x="105.6248" y="463.7223" font-family="monospace" font-size="11.6093" fill="var(--text-muted)">    python: '3.10'</text>
  <text x="105.6248" y="481.4444" font-family="sans-serif" font-size="11.6093" fill="var(--text-faint)">removes windows/3.10 from grid</text>
  <rect x="471.2499" y="391.2223" width="337.5001" height="104.7223" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="639.9999" y="412.1667" text-anchor="middle" font-family="sans-serif" font-size="13.0355" font-weight="bold" fill="var(--text)">include — add extra combinations</text>
  <text x="489.9999" y="431.5" font-family="monospace" font-size="11.6093" fill="var(--text-muted)">include:</text>
  <text x="489.9999" y="447.6111" font-family="monospace" font-size="11.6093" fill="var(--text-muted)">  - os: ubuntu</text>
  <text x="489.9999" y="463.7223" font-family="monospace" font-size="11.6093" fill="var(--text-muted)">    python: '3.13-dev'</text>
  <text x="489.9999" y="481.4444" font-family="sans-serif" font-size="11.6093" fill="var(--text-faint)">adds one extra experimental job</text>
  <rect x="855.6249" y="391.2223" width="337.5001" height="104.7223" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1024.3748" y="412.1667" text-anchor="middle" font-family="sans-serif" font-size="13.0355" font-weight="bold" fill="var(--primary-accent)">fail-fast</text>
  <text x="874.375" y="436.3333" font-family="monospace" font-size="11.6093" fill="var(--text-muted)">fail-fast: true   # default</text>
  <text x="874.375" y="454.0556" font-family="sans-serif" font-size="11.6093" fill="var(--text-muted)">cancel remaining jobs on first fail</text>
  <text x="874.375" y="474.9999" font-family="monospace" font-size="11.6093" fill="var(--text-muted)">fail-fast: false</text>
  <text x="874.375" y="492.7223" font-family="sans-serif" font-size="11.6093" fill="var(--text-muted)">run all jobs regardless</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Reusable -->
  <rect x="40" y="40" width="590" height="200" rx="8" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">Reusable Workflows</text>
  <text x="60" y="110" font-family="Courier New, monospace" font-size="12" fill="var(--bg)">on:</text>
  <text x="60" y="135" font-family="Courier New, monospace" font-size="12" fill="var(--bg)">  workflow_call:</text>
  <text x="60" y="160" font-family="Courier New, monospace" font-size="12" fill="var(--bg)">    inputs: { node-version }</text>
  <text x="60" y="185" font-family="Courier New, monospace" font-size="12" fill="var(--bg)">    secrets: { NPM_TOKEN }</text>
  <text x="60" y="220" font-family="Courier New, monospace" font-size="12" fill="var(--bg)">uses: org/repo/.github/...@main</text>

  <!-- Caching -->
  <rect x="650" y="40" width="590" height="200" rx="8" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">Caching</text>
  <text x="670" y="110" font-family="Courier New, monospace" font-size="12" fill="var(--bg)">- uses: actions/cache@v4</text>
  <text x="670" y="135" font-family="Courier New, monospace" font-size="12" fill="var(--bg)">  with:</text>
  <text x="670" y="160" font-family="Courier New, monospace" font-size="12" fill="var(--bg)">    path: ~/.npm</text>
  <text x="670" y="185" font-family="Courier New, monospace" font-size="12" fill="var(--bg)">    key: ${{ hashFiles(...) }}</text>
  <text x="670" y="220" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="var(--bg)">Hash-based invalidation</text>

  <!-- Concurrency -->
  <rect x="40" y="260" width="390" height="200" rx="8" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">Concurrency</text>
  <text x="60" y="330" font-family="Courier New, monospace" font-size="12" fill="var(--bg)">concurrency:</text>
  <text x="60" y="355" font-family="Courier New, monospace" font-size="12" fill="var(--bg)">  group: ${{ github.ref }}</text>
  <text x="60" y="380" font-family="Courier New, monospace" font-size="12" fill="var(--bg)">  cancel-in-progress: true</text>
  <text x="60" y="420" font-family="Arial, sans-serif" font-size="12" fill="var(--bg)">Cancels old PR runs</text>

  <!-- Security -->
  <rect x="445" y="260" width="390" height="200" rx="8" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">Security</text>
  <text x="465" y="330" font-family="Courier New, monospace" font-size="12" fill="var(--bg)">permissions:</text>
  <text x="465" y="355" font-family="Courier New, monospace" font-size="12" fill="var(--bg)">  contents: read</text>
  <text x="465" y="380" font-family="Courier New, monospace" font-size="12" fill="var(--bg)">  pull-requests: write</text>
  <text x="465" y="420" font-family="Arial, sans-serif" font-size="12" fill="var(--bg)">Use secrets.NAME</text>

  <!-- Matrix -->
  <rect x="850" y="260" width="390" height="200" rx="8" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">Matrix</text>
  <text x="870" y="330" font-family="Courier New, monospace" font-size="12" fill="var(--bg)">strategy:</text>
  <text x="870" y="355" font-family="Courier New, monospace" font-size="12" fill="var(--bg)">  matrix:</text>
  <text x="870" y="380" font-family="Courier New, monospace" font-size="12" fill="var(--bg)">    os: [ubuntu, macos]</text>
  <text x="870" y="405" font-family="Courier New, monospace" font-size="12" fill="var(--bg)">    python: ["3.11","3.12"]</text>
  <text x="870" y="440" font-family="Arial, sans-serif" font-size="12" fill="var(--bg)">fail-fast: false</text>

  <!-- Tips -->
  <rect x="40" y="480" width="1200" height="140" rx="8" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--bg)">Optimization</text>
  <text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">needs: runs independent jobs in parallel</text>
  <text x="640" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">paths: filter skips unrelated changes</text>
  <text x="640" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">Upload artifacts for test results</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)"/>

  <rect x="30" y="14" width="1220" height="44" rx="6" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="640" y="42" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--bg)" text-anchor="middle">Workflow Best Practices</text>

  <!-- Reusable workflows -->
  <rect x="30" y="74" width="590" height="196" rx="5" fill="var(--primary-pale)" filter="url(#shadow)"/>
  <text x="325" y="98" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">Reusable Workflows (workflow_call)</text>
  <text x="45" y="120" font-family="monospace" font-size="11" fill="var(--text-faint)"># .github/workflows/reusable-ci.yml</text>
  <text x="45" y="138" font-family="monospace" font-size="11" fill="var(--text-dark)">on:</text>
  <text x="60" y="156" font-family="monospace" font-size="11" fill="var(--text-dark)">  workflow_call:</text>
  <text x="75" y="174" font-family="monospace" font-size="11" fill="var(--text-dark)">    inputs:</text>
  <text x="90" y="192" font-family="monospace" font-size="11" fill="var(--text-dark)">      node-version: {type: string}</text>
  <text x="75" y="210" font-family="monospace" font-size="11" fill="var(--text-dark)">    secrets:</text>
  <text x="90" y="228" font-family="monospace" font-size="11" fill="var(--text-dark)">      NPM_TOKEN: {required: true}</text>
  <text x="45" y="252" font-family="monospace" font-size="11" fill="var(--text-faint)"># caller workflow</text>
  <text x="45" y="270" font-family="monospace" font-size="11" fill="var(--text-dark)">uses: org/repo/.github/workflows/ci.yml@main</text>

  <!-- Caching -->
  <rect x="660" y="74" width="590" height="196" rx="5" fill="var(--ok-pale)" filter="url(#shadow)"/>
  <text x="955" y="98" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">Caching Dependencies</text>
  <text x="675" y="120" font-family="monospace" font-size="11" fill="var(--text-dark)">- uses: actions/cache@v4</text>
  <text x="690" y="138" font-family="monospace" font-size="11" fill="var(--text-dark)">  with:</text>
  <text x="705" y="156" font-family="monospace" font-size="11" fill="var(--text-dark)">    path: ~/.npm</text>
  <text x="705" y="174" font-family="monospace" font-size="11" fill="var(--text-dark)">    key: npm-${{ runner.os }}-</text>
  <text x="720" y="192" font-family="monospace" font-size="11" fill="var(--text-dark)">      ${{ hashFiles('**/package-lock.json') }}</text>
  <text x="705" y="210" font-family="monospace" font-size="11" fill="var(--text-dark)">    restore-keys: npm-${{ runner.os }}-</text>
  <text x="675" y="234" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">setup-* actions have built-in cache: option</text>
  <text x="675" y="254" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Cache key includes file hash - invalidated on change</text>
  <text x="675" y="274" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">restore-keys provide fallback partial matches</text>

  <!-- Concurrency -->
  <rect x="30" y="288" width="390" height="196" rx="5" fill="var(--warn-pale)" filter="url(#shadow)"/>
  <text x="225" y="312" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-dk)" text-anchor="middle">Concurrency Control</text>
  <text x="45" y="336" font-family="monospace" font-size="11" fill="var(--text-dark)">concurrency:</text>
  <text x="60" y="354" font-family="monospace" font-size="11" fill="var(--text-dark)">  group: ${{ github.workflow }}-</text>
  <text x="75" y="372" font-family="monospace" font-size="11" fill="var(--text-dark)">    ${{ github.ref }}</text>
  <text x="60" y="390" font-family="monospace" font-size="11" fill="var(--text-dark)">  cancel-in-progress: true</text>
  <text x="45" y="414" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Cancels old PR runs when new push arrives</text>
  <text x="45" y="434" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Prevents duplicate deploys</text>
  <text x="45" y="454" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Set cancel-in-progress: false on main branch</text>
  <text x="45" y="474" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Saves runner minutes and reduces conflicts</text>

  <!-- Security -->
  <rect x="440" y="288" width="400" height="196" rx="5" fill="var(--danger-pale3)" filter="url(#shadow)"/>
  <text x="640" y="312" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--danger-dk)" text-anchor="middle">Security: Tokens and Secrets</text>
  <text x="455" y="336" font-family="monospace" font-size="11" fill="var(--text-dark)">permissions:</text>
  <text x="470" y="354" font-family="monospace" font-size="11" fill="var(--text-dark)">  contents: read</text>
  <text x="470" y="372" font-family="monospace" font-size="11" fill="var(--text-dark)">  pull-requests: write</text>
  <text x="455" y="394" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">GITHUB_TOKEN: auto-created per job</text>
  <text x="455" y="414" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Limit GITHUB_TOKEN permissions at top level</text>
  <text x="455" y="434" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Never print secrets to logs</text>
  <text x="455" y="454" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Use secrets.NAME - never hardcode in YAML</text>
  <text x="455" y="474" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Environment protection rules for prod secrets</text>

  <!-- Matrix strategy -->
  <rect x="860" y="288" width="390" height="196" rx="5" fill="var(--info-pale)" filter="url(#shadow)"/>
  <text x="1055" y="312" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--info-dk)" text-anchor="middle">Matrix Strategy</text>
  <text x="875" y="336" font-family="monospace" font-size="11" fill="var(--text-dark)">strategy:</text>
  <text x="890" y="354" font-family="monospace" font-size="11" fill="var(--text-dark)">  matrix:</text>
  <text x="905" y="372" font-family="monospace" font-size="11" fill="var(--text-dark)">    os: [ubuntu, macos, windows]</text>
  <text x="905" y="390" font-family="monospace" font-size="11" fill="var(--text-dark)">    python: ["3.11", "3.12"]</text>
  <text x="890" y="408" font-family="monospace" font-size="11" fill="var(--text-dark)">  fail-fast: false</text>
  <text x="890" y="426" font-family="monospace" font-size="11" fill="var(--text-dark)">  max-parallel: 4</text>
  <text x="875" y="450" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">3 x 2 = 6 parallel jobs</text>
  <text x="875" y="470" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">include/exclude to adjust matrix cells</text>
  <text x="875" y="490" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">fail-fast: false - all cells run to completion</text>

  <!-- Bottom tips -->
  <rect x="30" y="502" width="1220" height="118" rx="6" fill="var(--surface)" filter="url(#shadow)"/>
  <text x="640" y="526" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text-dark)" text-anchor="middle">Optimization Tips</text>
  <text x="50" y="548" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Use needs: to express job dependencies and run independent jobs in parallel</text>
  <text x="50" y="568" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Use if: github.event_name == 'push' to skip expensive steps on PR builds</text>
  <text x="50" y="588" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Use paths: filter to skip workflows when unrelated files change (e.g. docs-only changes)</text>
  <text x="50" y="608" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Upload test results as artifacts; use continue-on-error: true on flaky steps</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <rect x="30" y="14" width="1220" height="44" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="42" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--bg)" text-anchor="middle">Workflow Best Practices</text>

  <!-- Reusable workflows -->
  <rect x="30" y="74" width="590" height="196" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="325" y="98" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Reusable Workflows (workflow_call)</text>
  <text x="45" y="120" font-family="monospace" font-size="11" fill="var(--text-faint)"># .github/workflows/reusable-ci.yml</text>
  <text x="45" y="138" font-family="monospace" font-size="11" fill="var(--text)">on:</text>
  <text x="60" y="156" font-family="monospace" font-size="11" fill="var(--text)">  workflow_call:</text>
  <text x="75" y="174" font-family="monospace" font-size="11" fill="var(--text)">    inputs:</text>
  <text x="90" y="192" font-family="monospace" font-size="11" fill="var(--text)">      node-version: {type: string}</text>
  <text x="75" y="210" font-family="monospace" font-size="11" fill="var(--text)">    secrets:</text>
  <text x="90" y="228" font-family="monospace" font-size="11" fill="var(--text)">      NPM_TOKEN: {required: true}</text>
  <text x="45" y="252" font-family="monospace" font-size="11" fill="var(--text-faint)"># caller workflow</text>
  <text x="45" y="270" font-family="monospace" font-size="11" fill="var(--text)">uses: org/repo/.github/workflows/ci.yml@main</text>

  <!-- Caching -->
  <rect x="660" y="74" width="590" height="196" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="955" y="98" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Caching Dependencies</text>
  <text x="675" y="120" font-family="monospace" font-size="11" fill="var(--text)">- uses: actions/cache@v4</text>
  <text x="690" y="138" font-family="monospace" font-size="11" fill="var(--text)">  with:</text>
  <text x="705" y="156" font-family="monospace" font-size="11" fill="var(--text)">    path: ~/.npm</text>
  <text x="705" y="174" font-family="monospace" font-size="11" fill="var(--text)">    key: npm-${{ runner.os }}-</text>
  <text x="720" y="192" font-family="monospace" font-size="11" fill="var(--text)">      ${{ hashFiles('**/package-lock.json') }}</text>
  <text x="705" y="210" font-family="monospace" font-size="11" fill="var(--text)">    restore-keys: npm-${{ runner.os }}-</text>
  <text x="675" y="234" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">setup-* actions have built-in cache: option</text>
  <text x="675" y="254" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Cache key includes file hash - invalidated on change</text>
  <text x="675" y="274" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">restore-keys provide fallback partial matches</text>

  <!-- Concurrency -->
  <rect x="30" y="288" width="390" height="196" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="225" y="312" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Concurrency Control</text>
  <text x="45" y="336" font-family="monospace" font-size="11" fill="var(--text)">concurrency:</text>
  <text x="60" y="354" font-family="monospace" font-size="11" fill="var(--text)">  group: ${{ github.workflow }}-</text>
  <text x="75" y="372" font-family="monospace" font-size="11" fill="var(--text)">    ${{ github.ref }}</text>
  <text x="60" y="390" font-family="monospace" font-size="11" fill="var(--text)">  cancel-in-progress: true</text>
  <text x="45" y="414" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Cancels old PR runs when new push arrives</text>
  <text x="45" y="434" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Prevents duplicate deploys</text>
  <text x="45" y="454" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Set cancel-in-progress: false on main branch</text>
  <text x="45" y="474" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Saves runner minutes and reduces conflicts</text>

  <!-- Security -->
  <rect x="440" y="288" width="400" height="196" rx="6" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="640" y="312" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Security: Tokens and Secrets</text>
  <text x="455" y="336" font-family="monospace" font-size="11" fill="var(--text)">permissions:</text>
  <text x="470" y="354" font-family="monospace" font-size="11" fill="var(--text)">  contents: read</text>
  <text x="470" y="372" font-family="monospace" font-size="11" fill="var(--text)">  pull-requests: write</text>
  <text x="455" y="394" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">GITHUB_TOKEN: auto-created per job</text>
  <text x="455" y="414" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Limit GITHUB_TOKEN permissions at top level</text>
  <text x="455" y="434" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Never print secrets to logs</text>
  <text x="455" y="454" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Use secrets.NAME - never hardcode in YAML</text>
  <text x="455" y="474" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Environment protection rules for prod secrets</text>

  <!-- Matrix strategy -->
  <rect x="860" y="288" width="390" height="196" rx="6" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1055" y="312" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Matrix Strategy</text>
  <text x="875" y="336" font-family="monospace" font-size="11" fill="var(--text)">strategy:</text>
  <text x="890" y="354" font-family="monospace" font-size="11" fill="var(--text)">  matrix:</text>
  <text x="905" y="372" font-family="monospace" font-size="11" fill="var(--text)">    os: [ubuntu, macos, windows]</text>
  <text x="905" y="390" font-family="monospace" font-size="11" fill="var(--text)">    python: ["3.11", "3.12"]</text>
  <text x="890" y="408" font-family="monospace" font-size="11" fill="var(--text)">  fail-fast: false</text>
  <text x="890" y="426" font-family="monospace" font-size="11" fill="var(--text)">  max-parallel: 4</text>
  <text x="875" y="450" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">3 x 2 = 6 parallel jobs</text>
  <text x="875" y="470" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">include/exclude to adjust matrix cells</text>
  <text x="875" y="490" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">fail-fast: false - all cells run to completion</text>

  <!-- Bottom tips -->
  <rect x="30" y="502" width="1220" height="118" rx="6" fill="var(--surface)" filter="url(#shadow)"/>
  <text x="640" y="526" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)" text-anchor="middle">Optimization Tips</text>
  <text x="50" y="548" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Use needs: to express job dependencies and run independent jobs in parallel</text>
  <text x="50" y="568" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Use if: github.event_name == 'push' to skip expensive steps on PR builds</text>
  <text x="50" y="588" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Use paths: filter to skip workflows when unrelated files change (e.g. docs-only changes)</text>
  <text x="50" y="608" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Upload test results as artifacts; use continue-on-error: true on flaky steps</text>
</svg>

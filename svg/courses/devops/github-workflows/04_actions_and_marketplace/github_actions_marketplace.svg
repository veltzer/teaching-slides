<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <!-- Three action types -->
  <rect x="40" y="40" width="390" height="240.754716981132" rx="8.368855109814" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="72.830188679245" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.783817108355" font-weight="bold" fill="var(--bg)">JavaScript</text>
  <text x="60" y="105.66037735849" font-family="Arial, sans-serif" font-size="13.599389553448" fill="var(--bg)">Runs on the runner directly</text>
  <text x="60" y="133.018867924529" font-family="Arial, sans-serif" font-size="13.599389553448" fill="var(--bg)">Fast, cross-platform</text>
  <text x="60" y="176.792452830188" font-family="Courier New, monospace" font-size="12.55328266472" fill="var(--bg)">actions/checkout@v4</text>
  <text x="60" y="201.962264150943" font-family="Courier New, monospace" font-size="12.55328266472" fill="var(--bg)">actions/setup-node@v4</text>
  <text x="60" y="227.132075471699" font-family="Courier New, monospace" font-size="12.55328266472" fill="var(--bg)">actions/cache@v4</text>
  <text x="60" y="264.339622641509" font-family="Arial, sans-serif" font-size="12.55328266472" fill="var(--bg)">runs.using: node20</text>

  <rect x="445" y="40" width="390" height="240.754716981132" rx="8.368855109814" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="72.830188679245" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.783817108355" font-weight="bold" fill="var(--bg)">Docker Container</text>
  <text x="465" y="105.66037735849" font-family="Arial, sans-serif" font-size="13.599389553448" fill="var(--bg)">Any language or toolchain</text>
  <text x="465" y="133.018867924529" font-family="Arial, sans-serif" font-size="13.599389553448" fill="var(--bg)">Linux runners only</text>
  <text x="465" y="176.792452830188" font-family="Courier New, monospace" font-size="12.55328266472" fill="var(--bg)">github/codeql-action@v3</text>
  <text x="465" y="201.962264150943" font-family="Courier New, monospace" font-size="12.55328266472" fill="var(--bg)">snyk/actions/python@master</text>
  <text x="465" y="227.132075471699" font-family="Arial, sans-serif" font-size="12.55328266472" fill="var(--bg)">Slower cold start</text>
  <text x="465" y="264.339622641509" font-family="Arial, sans-serif" font-size="12.55328266472" fill="var(--bg)">runs.using: docker</text>

  <rect x="850" y="40" width="390" height="240.754716981132" rx="8.368855109814" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="72.830188679245" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.783817108355" font-weight="bold" fill="var(--bg)">Composite</text>
  <text x="870" y="105.66037735849" font-family="Arial, sans-serif" font-size="13.599389553448" fill="var(--bg)">Combines steps in YAML</text>
  <text x="870" y="133.018867924529" font-family="Arial, sans-serif" font-size="13.599389553448" fill="var(--bg)">Reuse setup chains</text>
  <text x="870" y="176.792452830188" font-family="Courier New, monospace" font-size="12.55328266472" fill="var(--bg)">./.github/actions/setup</text>
  <text x="870" y="201.962264150943" font-family="Courier New, monospace" font-size="12.55328266472" fill="var(--bg)">org/repo/.github/actions/x@v1</text>
  <text x="870" y="227.132075471699" font-family="Arial, sans-serif" font-size="12.55328266472" fill="var(--bg)">Each step needs shell:</text>
  <text x="870" y="264.339622641509" font-family="Arial, sans-serif" font-size="12.55328266472" fill="var(--bg)">runs.using: composite</text>

  <!-- Uses syntax -->
  <rect x="40" y="302.641509433962" width="590" height="218.867924528302" rx="8.368855109814" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="335.471698113207" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.737710219627" font-weight="bold" fill="var(--bg)">uses: Syntax</text>
  <rect x="60" y="351.88679245283" width="550" height="120.377358490566" rx="6.276641332361" fill="var(--code-bg)"/>
  <text x="80" y="379.245283018868" font-family="Courier New, monospace" font-size="13.599389553448" fill="var(--bg)">steps:</text>
  <text x="80" y="401.132075471698" font-family="Courier New, monospace" font-size="13.599389553448" fill="var(--bg)">  - uses: actions/setup-python@v5</text>
  <text x="80" y="423.018867924528" font-family="Courier New, monospace" font-size="13.599389553448" fill="var(--bg)">    with:</text>
  <text x="80" y="444.905660377359" font-family="Courier New, monospace" font-size="13.599389553448" fill="var(--bg)">      python-version: "3.12"</text>
  <text x="80" y="466.792452830189" font-family="Courier New, monospace" font-size="13.599389553448" fill="var(--bg)">      cache: "pip"</text>
  <text x="335" y="499.622641509434" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.599389553448" fill="var(--bg)">Pin SHA or tag, never @main</text>

  <!-- Categories -->
  <rect x="650" y="302.641509433962" width="590" height="218.867924528302" rx="8.368855109814" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="335.471698113207" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.737710219627" font-weight="bold" fill="var(--bg)">Popular Categories</text>
  <text x="670" y="368.301886792453" font-family="Arial, sans-serif" font-size="13.599389553448" fill="var(--bg)">CI/CD: checkout, setup-*, artifacts</text>
  <text x="670" y="395.660377358491" font-family="Arial, sans-serif" font-size="13.599389553448" fill="var(--bg)">Quality: super-linter, eslint</text>
  <text x="670" y="423.018867924528" font-family="Arial, sans-serif" font-size="13.599389553448" fill="var(--bg)">Security: codeql, snyk, trivy</text>
  <text x="670" y="450.377358490566" font-family="Arial, sans-serif" font-size="13.599389553448" fill="var(--bg)">Deploy: aws, azure, google-cloud</text>
  <text x="670" y="477.735849056604" font-family="Arial, sans-serif" font-size="13.599389553448" fill="var(--bg)">Release: semantic-release</text>
  <text x="670" y="505.094339622642" font-family="Arial, sans-serif" font-size="12.55328266472" fill="var(--bg)">github.com/marketplace</text>

  <!-- Security footer -->
  <rect x="40" y="543.396226415094" width="1200" height="76.603773584906" rx="8.368855109814" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="576.226415094339" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.737710219627" font-weight="bold" fill="var(--bg)">Security: Pin to SHA</text>
  <text x="640" y="603.584905660377" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.599389553448" fill="var(--bg)">Dependabot updates, prefer verified actions</text>
</svg>

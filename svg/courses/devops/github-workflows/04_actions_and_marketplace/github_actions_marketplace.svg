<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <rect x="68.125" y="52.6875" width="1143.75" height="39.875" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="78.0625" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--bg)" text-anchor="middle">GitHub Actions Marketplace</text>

  <rect x="68.125" y="107.0625" width="356.25" height="199.375" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="246.25" y="128.8125" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">JavaScript Actions</text>
  <text x="82.1875" y="148.75" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Runs directly on the runner</text>
  <text x="82.1875" y="166.875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Fast startup - no container overhead</text>
  <text x="82.1875" y="185" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Cross-platform: Linux / macOS / Windows</text>
  <text x="82.1875" y="206.75" font-family="monospace" font-size="11.0609" fill="var(--text)">uses: actions/checkout@v4</text>
  <text x="82.1875" y="223.0625" font-family="monospace" font-size="11.0609" fill="var(--text)">uses: actions/setup-node@v4</text>
  <text x="82.1875" y="239.375" font-family="monospace" font-size="11.0609" fill="var(--text)">uses: actions/cache@v4</text>
  <text x="82.1875" y="255.6875" font-family="monospace" font-size="11.0609" fill="var(--text)">uses: actions/upload-artifact@v4</text>
  <text x="82.1875" y="275.625" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)">Implemented in Node.js with @actions/core SDK</text>
  <text x="82.1875" y="291.9375" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)">action.yml: runs.using: node20</text>

  <rect x="452.5" y="107.0625" width="356.25" height="199.375" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="630.625" y="128.8125" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Docker Container Actions</text>
  <text x="466.5625" y="148.75" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Runs inside a Docker container</text>
  <text x="466.5625" y="166.875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Any language or toolchain</text>
  <text x="466.5625" y="185" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Consistent reproducible environment</text>
  <text x="466.5625" y="203.125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Linux runners only</text>
  <text x="466.5625" y="224.875" font-family="monospace" font-size="10.1392" fill="var(--text)">uses: github/codeql-action/analyze@v3</text>
  <text x="466.5625" y="241.1875" font-family="monospace" font-size="10.1392" fill="var(--text)">uses: snyk/actions/python@master</text>
  <text x="466.5625" y="261.125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Slower start due to container pull</text>
  <text x="466.5625" y="279.25" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)">action.yml: runs.using: docker</text>
  <text x="466.5625" y="295.5625" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)">Requires Dockerfile in action repo</text>

  <rect x="836.875" y="107.0625" width="375" height="199.375" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1024.375" y="128.8125" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Composite Actions</text>
  <text x="850.9375" y="148.75" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Combines multiple workflow steps</text>
  <text x="850.9375" y="166.875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Written entirely in YAML</text>
  <text x="850.9375" y="185" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Can call other actions via uses:</text>
  <text x="850.9375" y="203.125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Great for reusing setup steps</text>
  <text x="850.9375" y="224.875" font-family="monospace" font-size="10.1392" fill="var(--text)">uses: ./.github/actions/my-setup</text>
  <text x="850.9375" y="241.1875" font-family="monospace" font-size="10.1392" fill="var(--text)">uses: org/repo/.github/actions/x@v1</text>
  <text x="850.9375" y="261.125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">action.yml: runs.using: composite</text>
  <text x="850.9375" y="279.25" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)">Each step must have shell: defined</text>
  <text x="850.9375" y="295.5625" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)">No separate runtime - runs in caller job</text>

  <rect x="68.125" y="324.5625" width="562.5" height="181.25" rx="6" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="349.375" y="346.3125" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">uses: Syntax and Parameters</text>
  <text x="82.1875" y="368.0625" font-family="monospace" font-size="11.0609" fill="var(--text)">steps:</text>
  <text x="82.1875" y="384.375" font-family="monospace" font-size="11.0609" fill="var(--text)">  - uses: actions/setup-python@v5</text>
  <text x="96.25" y="400.6875" font-family="monospace" font-size="11.0609" fill="var(--text)">    with:</text>
  <text x="110.3125" y="417" font-family="monospace" font-size="11.0609" fill="var(--text)">      python-version: "3.12"</text>
  <text x="110.3125" y="433.3125" font-family="monospace" font-size="11.0609" fill="var(--text)">      cache: "pip"</text>
  <text x="82.1875" y="455.0625" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Pin to SHA for security: @a1b2c3d</text>
  <text x="82.1875" y="473.1875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Pin to tag for convenience: @v4</text>
  <text x="82.1875" y="491.3125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Never use @main in production</text>

  <rect x="649.375" y="324.5625" width="562.5" height="181.25" rx="6" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="930.625" y="346.3125" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Popular Action Categories</text>
  <text x="663.4375" y="368.0625" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">CI/CD:       checkout, setup-*, upload/download-artifact</text>
  <text x="663.4375" y="386.1875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Code Quality: super-linter, eslint, pylint</text>
  <text x="663.4375" y="404.3125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Security:    codeql-action, snyk, trivy, dependency-review</text>
  <text x="663.4375" y="422.4375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Deployment:  aws-actions, azure/login, google-github-actions</text>
  <text x="663.4375" y="440.5625" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Notifications: slack-notify, send-email</text>
  <text x="663.4375" y="458.6875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Release:     release-please, semantic-release, gh-release</text>
  <text x="663.4375" y="480.4375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Browse: github.com/marketplace?type=actions</text>
  <text x="663.4375" y="498.5625" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Filter by: Verified Creator, Category, Stars</text>

  <rect x="68.125" y="520.3125" width="1143.75" height="81.5625" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="542.0625" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Action Security and Pinning</text>
  <text x="86.875" y="562" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Always pin third-party actions to a specific SHA commit hash to prevent supply chain attacks</text>
  <text x="86.875" y="580.125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Use Dependabot to automatically update action versions in .github/dependabot.yml</text>
  <text x="86.875" y="598.25" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Prefer GitHub-verified actions (checkmark badge) and first-party actions from trusted orgs</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)"/>

  <rect x="30" y="14" width="1220" height="44" rx="6" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="640" y="42" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--bg)" text-anchor="middle">GitHub Actions Marketplace</text>

  <rect x="30" y="74" width="380" height="220" rx="5" fill="var(--primary-pale)" filter="url(#shadow)"/>
  <text x="220" y="98" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">JavaScript Actions</text>
  <text x="45" y="120" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Runs directly on the runner</text>
  <text x="45" y="140" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Fast startup - no container overhead</text>
  <text x="45" y="160" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Cross-platform: Linux / macOS / Windows</text>
  <text x="45" y="184" font-family="monospace" font-size="12" fill="var(--text-dark)">uses: actions/checkout@v4</text>
  <text x="45" y="202" font-family="monospace" font-size="12" fill="var(--text-dark)">uses: actions/setup-node@v4</text>
  <text x="45" y="220" font-family="monospace" font-size="12" fill="var(--text-dark)">uses: actions/cache@v4</text>
  <text x="45" y="238" font-family="monospace" font-size="12" fill="var(--text-dark)">uses: actions/upload-artifact@v4</text>
  <text x="45" y="260" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">Implemented in Node.js with @actions/core SDK</text>
  <text x="45" y="278" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">action.yml: runs.using: node20</text>

  <rect x="440" y="74" width="380" height="220" rx="5" fill="var(--ok-pale)" filter="url(#shadow)"/>
  <text x="630" y="98" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">Docker Container Actions</text>
  <text x="455" y="120" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Runs inside a Docker container</text>
  <text x="455" y="140" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Any language or toolchain</text>
  <text x="455" y="160" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Consistent reproducible environment</text>
  <text x="455" y="180" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Linux runners only</text>
  <text x="455" y="204" font-family="monospace" font-size="11" fill="var(--text-dark)">uses: github/codeql-action/analyze@v3</text>
  <text x="455" y="222" font-family="monospace" font-size="11" fill="var(--text-dark)">uses: snyk/actions/python@master</text>
  <text x="455" y="244" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Slower start due to container pull</text>
  <text x="455" y="264" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">action.yml: runs.using: docker</text>
  <text x="455" y="282" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">Requires Dockerfile in action repo</text>

  <rect x="850" y="74" width="400" height="220" rx="5" fill="var(--warn-pale)" filter="url(#shadow)"/>
  <text x="1050" y="98" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-dk)" text-anchor="middle">Composite Actions</text>
  <text x="865" y="120" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Combines multiple workflow steps</text>
  <text x="865" y="140" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Written entirely in YAML</text>
  <text x="865" y="160" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Can call other actions via uses:</text>
  <text x="865" y="180" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Great for reusing setup steps</text>
  <text x="865" y="204" font-family="monospace" font-size="11" fill="var(--text-dark)">uses: ./.github/actions/my-setup</text>
  <text x="865" y="222" font-family="monospace" font-size="11" fill="var(--text-dark)">uses: org/repo/.github/actions/x@v1</text>
  <text x="865" y="244" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">action.yml: runs.using: composite</text>
  <text x="865" y="264" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">Each step must have shell: defined</text>
  <text x="865" y="282" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">No separate runtime - runs in caller job</text>

  <rect x="30" y="314" width="600" height="200" rx="5" fill="var(--info-pale)" filter="url(#shadow)"/>
  <text x="330" y="338" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--info-dk)" text-anchor="middle">uses: Syntax and Parameters</text>
  <text x="45" y="362" font-family="monospace" font-size="12" fill="var(--text-dark)">steps:</text>
  <text x="45" y="380" font-family="monospace" font-size="12" fill="var(--text-dark)">  - uses: actions/setup-python@v5</text>
  <text x="60" y="398" font-family="monospace" font-size="12" fill="var(--text-dark)">    with:</text>
  <text x="75" y="416" font-family="monospace" font-size="12" fill="var(--text-dark)">      python-version: "3.12"</text>
  <text x="75" y="434" font-family="monospace" font-size="12" fill="var(--text-dark)">      cache: "pip"</text>
  <text x="45" y="458" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Pin to SHA for security: @a1b2c3d</text>
  <text x="45" y="478" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Pin to tag for convenience: @v4</text>
  <text x="45" y="498" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Never use @main in production</text>

  <rect x="650" y="314" width="600" height="200" rx="5" fill="var(--danger-pale3)" filter="url(#shadow)"/>
  <text x="950" y="338" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--danger-dk)" text-anchor="middle">Popular Action Categories</text>
  <text x="665" y="362" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">CI/CD:       checkout, setup-*, upload/download-artifact</text>
  <text x="665" y="382" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Code Quality: super-linter, eslint, pylint</text>
  <text x="665" y="402" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Security:    codeql-action, snyk, trivy, dependency-review</text>
  <text x="665" y="422" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Deployment:  aws-actions, azure/login, google-github-actions</text>
  <text x="665" y="442" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Notifications: slack-notify, send-email</text>
  <text x="665" y="462" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Release:     release-please, semantic-release, gh-release</text>
  <text x="665" y="486" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Browse: github.com/marketplace?type=actions</text>
  <text x="665" y="506" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Filter by: Verified Creator, Category, Stars</text>

  <rect x="30" y="530" width="1220" height="90" rx="6" fill="var(--primary-pale)" filter="url(#shadow)"/>
  <text x="640" y="554" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">Action Security and Pinning</text>
  <text x="50" y="576" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Always pin third-party actions to a specific SHA commit hash to prevent supply chain attacks</text>
  <text x="50" y="596" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Use Dependabot to automatically update action versions in .github/dependabot.yml</text>
  <text x="50" y="616" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Prefer GitHub-verified actions (checkmark badge) and first-party actions from trusted orgs</text>
</svg>

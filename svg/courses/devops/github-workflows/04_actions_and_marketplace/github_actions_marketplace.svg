<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <rect x="30" y="14" width="1220" height="44" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="42" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--bg)" text-anchor="middle">GitHub Actions Marketplace</text>

  <rect x="30" y="74" width="380" height="220" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="220" y="98" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">JavaScript Actions</text>
  <text x="45" y="120" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Runs directly on the runner</text>
  <text x="45" y="140" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Fast startup - no container overhead</text>
  <text x="45" y="160" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Cross-platform: Linux / macOS / Windows</text>
  <text x="45" y="184" font-family="monospace" font-size="12" fill="var(--text)">uses: actions/checkout@v4</text>
  <text x="45" y="202" font-family="monospace" font-size="12" fill="var(--text)">uses: actions/setup-node@v4</text>
  <text x="45" y="220" font-family="monospace" font-size="12" fill="var(--text)">uses: actions/cache@v4</text>
  <text x="45" y="238" font-family="monospace" font-size="12" fill="var(--text)">uses: actions/upload-artifact@v4</text>
  <text x="45" y="260" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">Implemented in Node.js with @actions/core SDK</text>
  <text x="45" y="278" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">action.yml: runs.using: node20</text>

  <rect x="440" y="74" width="380" height="220" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="630" y="98" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Docker Container Actions</text>
  <text x="455" y="120" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Runs inside a Docker container</text>
  <text x="455" y="140" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Any language or toolchain</text>
  <text x="455" y="160" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Consistent reproducible environment</text>
  <text x="455" y="180" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Linux runners only</text>
  <text x="455" y="204" font-family="monospace" font-size="11" fill="var(--text)">uses: github/codeql-action/analyze@v3</text>
  <text x="455" y="222" font-family="monospace" font-size="11" fill="var(--text)">uses: snyk/actions/python@master</text>
  <text x="455" y="244" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Slower start due to container pull</text>
  <text x="455" y="264" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">action.yml: runs.using: docker</text>
  <text x="455" y="282" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">Requires Dockerfile in action repo</text>

  <rect x="850" y="74" width="400" height="220" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1050" y="98" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Composite Actions</text>
  <text x="865" y="120" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Combines multiple workflow steps</text>
  <text x="865" y="140" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Written entirely in YAML</text>
  <text x="865" y="160" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Can call other actions via uses:</text>
  <text x="865" y="180" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Great for reusing setup steps</text>
  <text x="865" y="204" font-family="monospace" font-size="11" fill="var(--text)">uses: ./.github/actions/my-setup</text>
  <text x="865" y="222" font-family="monospace" font-size="11" fill="var(--text)">uses: org/repo/.github/actions/x@v1</text>
  <text x="865" y="244" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">action.yml: runs.using: composite</text>
  <text x="865" y="264" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">Each step must have shell: defined</text>
  <text x="865" y="282" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">No separate runtime - runs in caller job</text>

  <rect x="30" y="314" width="600" height="200" rx="6" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="330" y="338" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">uses: Syntax and Parameters</text>
  <text x="45" y="362" font-family="monospace" font-size="12" fill="var(--text)">steps:</text>
  <text x="45" y="380" font-family="monospace" font-size="12" fill="var(--text)">  - uses: actions/setup-python@v5</text>
  <text x="60" y="398" font-family="monospace" font-size="12" fill="var(--text)">    with:</text>
  <text x="75" y="416" font-family="monospace" font-size="12" fill="var(--text)">      python-version: "3.12"</text>
  <text x="75" y="434" font-family="monospace" font-size="12" fill="var(--text)">      cache: "pip"</text>
  <text x="45" y="458" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Pin to SHA for security: @a1b2c3d</text>
  <text x="45" y="478" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Pin to tag for convenience: @v4</text>
  <text x="45" y="498" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Never use @main in production</text>

  <rect x="650" y="314" width="600" height="200" rx="6" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="950" y="338" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Popular Action Categories</text>
  <text x="665" y="362" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">CI/CD:       checkout, setup-*, upload/download-artifact</text>
  <text x="665" y="382" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Code Quality: super-linter, eslint, pylint</text>
  <text x="665" y="402" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Security:    codeql-action, snyk, trivy, dependency-review</text>
  <text x="665" y="422" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Deployment:  aws-actions, azure/login, google-github-actions</text>
  <text x="665" y="442" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Notifications: slack-notify, send-email</text>
  <text x="665" y="462" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Release:     release-please, semantic-release, gh-release</text>
  <text x="665" y="486" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Browse: github.com/marketplace?type=actions</text>
  <text x="665" y="506" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Filter by: Verified Creator, Category, Stars</text>

  <rect x="30" y="530" width="1220" height="90" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="554" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Action Security and Pinning</text>
  <text x="50" y="576" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Always pin third-party actions to a specific SHA commit hash to prevent supply chain attacks</text>
  <text x="50" y="596" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Use Dependabot to automatically update action versions in .github/dependabot.yml</text>
  <text x="50" y="616" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Prefer GitHub-verified actions (checkmark badge) and first-party actions from trusted orgs</text>
</svg>

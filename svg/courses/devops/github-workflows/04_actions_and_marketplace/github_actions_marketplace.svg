<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.342871951533" font-weight="bold" fill="var(--primary-accent)">GitHub Actions Marketplace</text>

  <!-- Three action types -->
  <rect x="40" y="75.929203539823" width="390" height="225.840707964602" rx="8.10549906201" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="106.725663716814" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.224185506772" font-weight="bold" fill="var(--bg)">JavaScript</text>
  <text x="60" y="137.522123893805" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--bg)">Runs on the runner directly</text>
  <text x="60" y="163.185840707965" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--bg)">Fast, cross-platform</text>
  <text x="60" y="204.247787610619" font-family="Courier New, monospace" font-size="12.158248593015" fill="var(--bg)">actions/checkout@v4</text>
  <text x="60" y="227.858407079646" font-family="Courier New, monospace" font-size="12.158248593015" fill="var(--bg)">actions/setup-node@v4</text>
  <text x="60" y="251.469026548673" font-family="Courier New, monospace" font-size="12.158248593015" fill="var(--bg)">actions/cache@v4</text>
  <text x="60" y="286.371681415929" font-family="Arial, sans-serif" font-size="12.158248593015" fill="var(--bg)">runs.using: node20</text>

  <rect x="445" y="75.929203539823" width="390" height="225.840707964602" rx="8.10549906201" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="106.725663716814" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.224185506772" font-weight="bold" fill="var(--bg)">Docker Container</text>
  <text x="465" y="137.522123893805" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--bg)">Any language or toolchain</text>
  <text x="465" y="163.185840707965" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--bg)">Linux runners only</text>
  <text x="465" y="204.247787610619" font-family="Courier New, monospace" font-size="12.158248593015" fill="var(--bg)">github/codeql-action@v3</text>
  <text x="465" y="227.858407079646" font-family="Courier New, monospace" font-size="12.158248593015" fill="var(--bg)">snyk/actions/python@master</text>
  <text x="465" y="251.469026548673" font-family="Arial, sans-serif" font-size="12.158248593015" fill="var(--bg)">Slower cold start</text>
  <text x="465" y="286.371681415929" font-family="Arial, sans-serif" font-size="12.158248593015" fill="var(--bg)">runs.using: docker</text>

  <rect x="850" y="75.929203539823" width="390" height="225.840707964602" rx="8.10549906201" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="106.725663716814" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.224185506772" font-weight="bold" fill="var(--bg)">Composite</text>
  <text x="870" y="137.522123893805" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--bg)">Combines steps in YAML</text>
  <text x="870" y="163.185840707965" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--bg)">Reuse setup chains</text>
  <text x="870" y="204.247787610619" font-family="Courier New, monospace" font-size="12.158248593015" fill="var(--bg)">./.github/actions/setup</text>
  <text x="870" y="227.858407079646" font-family="Courier New, monospace" font-size="12.158248593015" fill="var(--bg)">org/repo/.github/actions/x@v1</text>
  <text x="870" y="251.469026548673" font-family="Arial, sans-serif" font-size="12.158248593015" fill="var(--bg)">Each step needs shell:</text>
  <text x="870" y="286.371681415929" font-family="Arial, sans-serif" font-size="12.158248593015" fill="var(--bg)">runs.using: composite</text>

  <!-- Uses syntax -->
  <rect x="40" y="322.300884955752" width="590" height="205.309734513274" rx="8.10549906201" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="353.097345132743" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.21099812402" font-weight="bold" fill="var(--bg)">uses: Syntax</text>
  <rect x="60" y="368.495575221239" width="550" height="112.920353982301" rx="6.079124296508" fill="var(--code-bg)"/>
  <text x="80" y="394.159292035398" font-family="Courier New, monospace" font-size="13.171435975767" fill="var(--bg)">steps:</text>
  <text x="80" y="414.690265486726" font-family="Courier New, monospace" font-size="13.171435975767" fill="var(--bg)">  - uses: actions/setup-python@v5</text>
  <text x="80" y="435.221238938053" font-family="Courier New, monospace" font-size="13.171435975767" fill="var(--bg)">    with:</text>
  <text x="80" y="455.752212389381" font-family="Courier New, monospace" font-size="13.171435975767" fill="var(--bg)">      python-version: "3.12"</text>
  <text x="80" y="476.283185840708" font-family="Courier New, monospace" font-size="13.171435975767" fill="var(--bg)">      cache: "pip"</text>
  <text x="335" y="507.079646017699" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--bg)">Pin SHA or tag, never @main</text>

  <!-- Categories -->
  <rect x="650" y="322.300884955752" width="590" height="205.309734513274" rx="8.10549906201" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="353.097345132743" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.21099812402" font-weight="bold" fill="var(--bg)">Popular Categories</text>
  <text x="670" y="383.893805309735" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--bg)">CI/CD: checkout, setup-*, artifacts</text>
  <text x="670" y="409.557522123894" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--bg)">Quality: super-linter, eslint</text>
  <text x="670" y="435.221238938053" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--bg)">Security: codeql, snyk, trivy</text>
  <text x="670" y="460.884955752212" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--bg)">Deploy: aws, azure, google-cloud</text>
  <text x="670" y="486.548672566372" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--bg)">Release: semantic-release</text>
  <text x="670" y="512.212389380531" font-family="Arial, sans-serif" font-size="12.158248593015" fill="var(--bg)">github.com/marketplace</text>

  <!-- Security footer -->
  <rect x="40" y="548.141592920354" width="1200" height="71.858407079646" rx="8.10549906201" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="578.938053097345" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.21099812402" font-weight="bold" fill="var(--bg)">Security: Pin to SHA</text>
  <text x="640" y="604.601769911504" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--bg)">Dependabot updates, prefer verified actions</text>
</svg>

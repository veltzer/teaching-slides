<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Left column: Without needs -->
  <text x="310" y="48" font-size="26" font-weight="bold" fill="#212121" text-anchor="middle">Without needs:</text>

  <rect x="150" y="70" width="200" height="110" rx="8" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="250" y="135" font-size="24" fill="#212121" text-anchor="middle">lint</text>

  <rect x="370" y="70" width="200" height="110" rx="8" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="470" y="135" font-size="24" fill="#212121" text-anchor="middle">test</text>

  <rect x="260" y="240" width="200" height="110" rx="8" fill="#fce4ec" stroke="#c62828" stroke-width="2" filter="url(#shadow)"/>
  <text x="360" y="305" font-size="24" fill="#212121" text-anchor="middle">deploy</text>

  <text x="310" y="410" font-size="18" fill="#555555" text-anchor="middle">(all run in parallel)</text>
  <text x="310" y="440" font-size="16" fill="#555555" text-anchor="middle">deploy may run before tests pass!</text>

  <!-- Vertical divider -->
  <line x1="640" y1="30" x2="640" y2="620" stroke="#f2f2f2" stroke-width="2"/>

  <!-- Right column: With needs -->
  <text x="960" y="48" font-size="26" font-weight="bold" fill="#212121" text-anchor="middle">With needs:</text>

  <rect x="820" y="70" width="280" height="110" rx="8" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="120" font-size="24" fill="#212121" text-anchor="middle">lint</text>
  <text x="960" y="152" font-size="15" fill="#555555" text-anchor="middle">(runs first)</text>

  <line x1="960" y1="180" x2="960" y2="240" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="820" y="240" width="280" height="110" rx="8" fill="#e8f5e9" stroke="#388e3c" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="290" font-size="24" fill="#212121" text-anchor="middle">test</text>
  <text x="960" y="322" font-size="15" fill="#555555" text-anchor="middle">needs: [lint]</text>

  <line x1="960" y1="350" x2="960" y2="410" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="820" y="410" width="280" height="110" rx="8" fill="#fce4ec" stroke="#c62828" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="460" font-size="24" fill="#212121" text-anchor="middle">deploy</text>
  <text x="960" y="492" font-size="15" fill="#555555" text-anchor="middle">needs: [test]</text>

  <text x="960" y="580" font-size="18" fill="#555555" text-anchor="middle">(guaranteed sequential order)</text>

  <!-- Code example -->
  <rect x="150" y="490" width="420" height="120" rx="8" fill="#f2f2f2" filter="url(#shadow)"/>
  <text x="170" y="520" font-family="monospace" font-size="15" fill="#555555">jobs:</text>
  <text x="170" y="543" font-family="monospace" font-size="15" fill="#212121">  deploy:</text>
  <text x="170" y="566" font-family="monospace" font-size="15" fill="#212121">    needs: [lint, test]</text>
  <text x="170" y="589" font-family="monospace" font-size="15" fill="#555555">    runs-on: ubuntu-latest</text>
</svg>

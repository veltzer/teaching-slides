<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="242.105263" y="57.694918" font-size="28.972771" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Without needs:</text>
  <rect x="40" y="79.322013" width="252.631579" height="108.135597" rx="7.69369" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="166.315789" y="143.220315" font-size="26.744037" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">lint</text>
  <rect x="317.894737" y="79.322013" width="252.631579" height="108.135597" rx="7.69369" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="444.210526" y="143.220315" font-size="26.744037" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">test</text>
  <rect x="178.947368" y="246.44063" width="252.631579" height="108.135597" rx="7.69369" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="305.263158" y="310.338932" font-size="26.744037" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">deploy</text>
  <text x="242.105263" y="413.559248" font-size="20.058092" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">(all run in parallel)</text>
  <text x="242.105263" y="443.050819" font-size="17.829358" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">deploy may run before tests pass!</text>
  <line x1="658.947368" y1="40" x2="658.947368" y2="620" stroke="var(--surface)" stroke-width="1.7778"/>
  <text x="1063.15776" y="57.694918" font-size="28.972771" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">With needs:</text>
  <rect x="886.315789" y="79.322013" width="353.684211" height="108.135597" rx="7.69369" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1063.15776" y="128.474591" font-size="26.744037" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">lint</text>
  <text x="1063.15776" y="159.932128" font-size="16.715055" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">(runs first)</text>
  <line x1="1063.15776" y1="187.457611" x2="1063.15776" y2="246.44063" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="886.315789" y="246.44063" width="353.684211" height="108.135597" rx="7.69369" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1063.15776" y="295.593208" font-size="26.744037" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">test</text>
  <text x="1063.15776" y="327.050867" font-size="16.715055" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">needs: [lint]</text>
  <line x1="1063.15776" y1="354.576228" x2="1063.15776" y2="413.559248" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="886.315789" y="413.559248" width="353.684211" height="108.135597" rx="7.69369" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1063.15776" y="462.711947" font-size="26.744037" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">deploy</text>
  <text x="1063.15776" y="494.169484" font-size="16.715055" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">needs: [test]</text>
  <text x="1063.15776" y="580.678109" font-size="20.058092" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">(guaranteed sequential order)</text>
  <rect x="40" y="492.203518" width="530.526316" height="117.966162" rx="7.69369" fill="var(--surface)"/>
  <text x="65.263158" y="521.694967" font-size="16.715055" fill="var(--text-muted)" font-family="Courier New, monospace">jobs:</text>
  <text x="65.263158" y="544.305167" font-size="16.715055" fill="var(--text)" font-family="Courier New, monospace">  deploy:</text>
  <text x="65.263158" y="566.915246" font-size="16.715055" fill="var(--text)" font-family="Courier New, monospace">    needs: [lint, test]</text>
  <text x="65.263158" y="589.525568" font-size="16.715055" fill="var(--text-muted)" font-family="Courier New, monospace">    runs-on: ubuntu-latest</text>
</svg>

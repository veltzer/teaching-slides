<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <text x="330.625" y="78.6667" font-size="22.5947" font-weight="bold" fill="var(--text)" text-anchor="middle">Without needs:</text>
  <rect x="180.625" y="96.3889" width="187.5" height="88.6111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="274.375" y="148.75" font-size="20.8566" fill="var(--text)" text-anchor="middle">lint</text>
  <rect x="386.875" y="96.3889" width="187.5" height="88.6111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="480.625" y="148.75" font-size="20.8566" fill="var(--text)" text-anchor="middle">test</text>
  <rect x="283.75" y="233.3333" width="187.5" height="88.6111" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="377.5" y="285.6944" font-size="20.8566" fill="var(--text)" text-anchor="middle">deploy</text>
  <text x="330.625" y="370.2777" font-size="15.6425" fill="var(--text-muted)" text-anchor="middle">(all run in parallel)</text>
  <text x="330.625" y="394.4444" font-size="13.9044" fill="var(--text-muted)" text-anchor="middle">deploy may run before tests pass!</text>
  <line x1="640" y1="64.1667" x2="640" y2="539.4444" stroke="var(--surface)" stroke-width="1.7778" />
  <text x="939.9999" y="78.6667" font-size="22.5947" font-weight="bold" fill="var(--text)" text-anchor="middle">With needs:</text>
  <rect x="808.75" y="96.3889" width="262.5" height="88.6111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="939.9999" y="136.6667" font-size="20.8566" fill="var(--text)" text-anchor="middle">lint</text>
  <text x="939.9999" y="162.4444" font-size="13.0354" fill="var(--text-muted)" text-anchor="middle">(runs first)</text>
  <line x1="939.9999" y1="185" x2="939.9999" y2="233.3333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="808.75" y="233.3333" width="262.5" height="88.6111" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="939.9999" y="273.6111" font-size="20.8566" fill="var(--text)" text-anchor="middle">test</text>
  <text x="939.9999" y="299.3889" font-size="13.0354" fill="var(--text-muted)" text-anchor="middle">needs: [lint]</text>
  <line x1="939.9999" y1="321.9444" x2="939.9999" y2="370.2777" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="808.75" y="370.2777" width="262.5" height="88.6111" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="939.9999" y="410.5556" font-size="20.8566" fill="var(--text)" text-anchor="middle">deploy</text>
  <text x="939.9999" y="436.3333" font-size="13.0354" fill="var(--text-muted)" text-anchor="middle">needs: [test]</text>
  <text x="939.9999" y="507.2223" font-size="15.6425" fill="var(--text-muted)" text-anchor="middle">(guaranteed sequential order)</text>
  <rect x="180.625" y="434.7223" width="393.75" height="96.6667" rx="6" fill="var(--surface)" filter="url(#shadow)" />
  <text x="199.375" y="458.8889" font-family="monospace" font-size="13.0354" fill="var(--text-muted)">jobs:</text>
  <text x="199.375" y="477.4167" font-family="monospace" font-size="13.0354" fill="var(--text)">  deploy:</text>
  <text x="199.375" y="495.9444" font-family="monospace" font-size="13.0354" fill="var(--text)">    needs: [lint, test]</text>
  <text x="199.375" y="514.4723" font-family="monospace" font-size="13.0354" fill="var(--text-muted)">    runs-on: ubuntu-latest</text>
</svg>
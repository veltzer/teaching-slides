</defs>
<text x="110" y="18" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">Without needs:</text>
<rect x="30" y="30" width="80" height="35" fill="#e3f2fd" stroke="#333" stroke-width="1.5" rx="4"/>
<text x="70" y="53" font-size="12" font-weight="normal" fill="#222" text-anchor="middle">lint</text>
<rect x="120" y="30" width="80" height="35" fill="#e3f2fd" stroke="#333" stroke-width="1.5" rx="4"/>
<text x="160" y="53" font-size="12" font-weight="normal" fill="#222" text-anchor="middle">test</text>

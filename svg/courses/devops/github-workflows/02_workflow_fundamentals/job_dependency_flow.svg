<text x="115" y="108" font-size="12" font-weight="normal" fill="#222" text-anchor="middle">deploy</text>
<text x="75" y="140" font-size="11" font-weight="normal" fill="#666" text-anchor="start">(all parallel)</text>
<text x="400" y="18" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">With needs:</text>
<rect x="330" y="30" width="120" height="35" fill="#e3f2fd" stroke="#333" stroke-width="1.5" rx="4"/>
<text x="390" y="53" font-size="12" font-weight="normal" fill="#222" text-anchor="middle">lint</text>
<line x1="390" y1="65" x2="390" y2="78" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="330" y="80" width="120" height="35" fill="#e8f5e9" stroke="#333" stroke-width="1.5" rx="4"/>
<text x="390" y="103" font-size="12" font-weight="normal" fill="#222" text-anchor="middle">test</text>
<line x1="390" y1="115" x2="390" y2="128" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="330" y="130" width="120" height="35" fill="#fce4ec" stroke="#333" stroke-width="1.5" rx="4"/>
<text x="390" y="153" font-size="12" font-weight="normal" fill="#222" text-anchor="middle">deploy</text>
<text x="330" y="175" font-size="11" font-weight="normal" fill="#666" text-anchor="start">(sequential)</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <text x="242.105263" y="57.694918" font-size="28.972771" font-weight="bold" fill="var(--text)" text-anchor="middle">Without needs:</text>
  <rect x="40" y="79.322013" width="252.631579" height="108.135597" rx="7.69369" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="166.315789" y="143.220315" font-size="26.744037" fill="var(--text)" text-anchor="middle">lint</text>
  <rect x="317.894737" y="79.322013" width="252.631579" height="108.135597" rx="7.69369" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="444.210526" y="143.220315" font-size="26.744037" fill="var(--text)" text-anchor="middle">test</text>
  <rect x="178.947368" y="246.44063" width="252.631579" height="108.135597" rx="7.69369" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="305.263158" y="310.338932" font-size="26.744037" fill="var(--text)" text-anchor="middle">deploy</text>
  <text x="242.105263" y="413.559248" font-size="20.058092" fill="var(--text-muted)" text-anchor="middle">(all run in parallel)</text>
  <text x="242.105263" y="443.050819" font-size="17.829358" fill="var(--text-muted)" text-anchor="middle">deploy may run before tests pass!</text>
  <line x1="658.947368" y1="40" x2="658.947368" y2="620" stroke="var(--surface)" stroke-width="1.7778" />
  <text x="1063.15776" y="57.694918" font-size="28.972771" font-weight="bold" fill="var(--text)" text-anchor="middle">With needs:</text>
  <rect x="886.315789" y="79.322013" width="353.684211" height="108.135597" rx="7.69369" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1063.15776" y="128.474591" font-size="26.744037" fill="var(--text)" text-anchor="middle">lint</text>
  <text x="1063.15776" y="159.932128" font-size="16.715055" fill="var(--text-muted)" text-anchor="middle">(runs first)</text>
  <line x1="1063.15776" y1="187.457611" x2="1063.15776" y2="246.44063" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="886.315789" y="246.44063" width="353.684211" height="108.135597" rx="7.69369" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1063.15776" y="295.593208" font-size="26.744037" fill="var(--text)" text-anchor="middle">test</text>
  <text x="1063.15776" y="327.050867" font-size="16.715055" fill="var(--text-muted)" text-anchor="middle">needs: [lint]</text>
  <line x1="1063.15776" y1="354.576228" x2="1063.15776" y2="413.559248" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="886.315789" y="413.559248" width="353.684211" height="108.135597" rx="7.69369" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1063.15776" y="462.711947" font-size="26.744037" fill="var(--text)" text-anchor="middle">deploy</text>
  <text x="1063.15776" y="494.169484" font-size="16.715055" fill="var(--text-muted)" text-anchor="middle">needs: [test]</text>
  <text x="1063.15776" y="580.678109" font-size="20.058092" fill="var(--text-muted)" text-anchor="middle">(guaranteed sequential order)</text>
  <rect x="40" y="492.203518" width="530.526316" height="117.966162" rx="7.69369" fill="var(--surface)" filter="url(#shadow)" />
  <text x="65.263158" y="521.694967" font-family="monospace" font-size="16.715055" fill="var(--text-muted)">jobs:</text>
  <text x="65.263158" y="544.305167" font-family="monospace" font-size="16.715055" fill="var(--text)">  deploy:</text>
  <text x="65.263158" y="566.915246" font-family="monospace" font-size="16.715055" fill="var(--text)">    needs: [lint, test]</text>
  <text x="65.263158" y="589.525568" font-family="monospace" font-size="16.715055" fill="var(--text-muted)">    runs-on: ubuntu-latest</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="351.111111" y="40" text-anchor="middle" font-size="27.63901" fill="var(--text-muted)" font-family="Arial, sans-serif">Passing Build</text>
  <rect x="84.444444" y="68.410209" width="177.777778" height="85.230098" rx="8.673965" fill="url(#label-grad)"/>
  <rect x="262.222222" y="68.410209" width="266.666667" height="85.230098" rx="8.673965" fill="url(#pass-grad)"/>
  <rect x="84.444444" y="68.410209" width="188.888889" height="85.230098" fill="url(#label-grad)" rx="8.673965"/>
  <rect x="262.222222" y="68.410209" width="255.555437" height="85.230098" fill="url(#pass-grad)" rx="8.673965"/>
  <text x="173.333333" y="125.230098" text-anchor="middle" font-size="37.689531" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">CI</text>
  <text x="390" y="125.230098" text-anchor="middle" font-size="37.689531" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">passing</text>
  <text x="928.888889" y="40" text-anchor="middle" font-size="27.63901" fill="var(--text-muted)" font-family="Arial, sans-serif">Failing Build</text>
  <rect x="662.222222" y="68.410209" width="177.777778" height="85.230098" rx="8.673965" fill="url(#label-grad)"/>
  <rect x="840" y="68.410209" width="266.666667" height="85.230098" rx="8.673965" fill="url(#fail-grad)"/>
  <rect x="662.222222" y="68.410209" width="188.888889" height="85.230098" fill="url(#label-grad)" rx="8.673965"/>
  <rect x="840" y="68.410209" width="255.555437" height="85.230098" fill="url(#fail-grad)" rx="8.673965"/>
  <text x="751.111111" y="125.230098" text-anchor="middle" font-size="37.689531" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">CI</text>
  <text x="967.777778" y="125.230098" text-anchor="middle" font-size="37.689531" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">failing</text>
  <line x1="40" y1="224.665302" x2="1240" y2="224.665302" stroke="var(--surface)" stroke-width="1.7778"/>
  <text x="640" y="309.895578" text-anchor="middle" font-size="25.126451" fill="var(--text-muted)" font-family="Arial, sans-serif">CI badges display live build status. Embed in your README with:</text>
  <rect x="151.111111" y="345.408162" width="977.777778" height="142.05034" rx="8.673965" fill="var(--surface)"/>
  <text x="640" y="409.330781" text-anchor="middle" font-size="22.613748" fill="var(--primary-accent)" font-family="Courier New, monospace">![CI](https://github.com/&lt;owner&gt;/&lt;repo&gt;/actions/workflows/ci.yml/badge.svg)</text>
  <text x="640" y="459.048295" text-anchor="middle" font-size="20.101044" fill="var(--text-muted)" font-family="Courier New, monospace">Markdown image link pointing to the GitHub Actions badge endpoint</text>
  <rect x="143.573" y="548.10435" width="15.0756" height="15.07561" rx="7.537823" fill="var(--primary-accent)"/>
  <text x="173.333333" y="562.745064" font-size="22.613748" fill="var(--text)" font-family="Arial, sans-serif">Badge auto-updates on every workflow run</text>
  <rect x="143.573" y="604.92439" width="15.0756" height="15.07561" rx="7.537823" fill="var(--primary-accent)"/>
  <text x="173.333333" y="619.564954" font-size="22.613748" fill="var(--text)" font-family="Arial, sans-serif">Green = passing, Red = failing, Gray = no runs yet</text>
</svg>

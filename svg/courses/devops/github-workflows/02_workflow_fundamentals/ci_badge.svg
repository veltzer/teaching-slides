<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <linearGradient id="label-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#555555" />
      <stop offset="100%" stop-color="#333333" />
    </linearGradient>
    <linearGradient id="pass-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="fail-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <text x="337.7778" y="177.7778" text-anchor="middle" font-size="19.5556" fill="var(--text-muted)">Passing Build</text>
  <rect x="124.4444" y="195.5556" width="142.2222" height="53.3333" rx="6" fill="url(#label-grad)" filter="url(#shadow)" />
  <rect x="266.6667" y="195.5556" width="213.3333" height="53.3333" rx="6" fill="url(#pass-grad)" filter="url(#shadow)" />
  <rect x="124.4444" y="195.5556" width="151.1111" height="53.3333" fill="url(#label-grad)" rx="6"/>
  <rect x="266.6667" y="195.5556" width="204.4444" height="53.3333" fill="url(#pass-grad)" rx="6"/>
  <text x="195.5556" y="231.1111" text-anchor="middle" font-size="26.6667" font-weight="bold" fill="var(--bg)">CI</text>
  <text x="368.8889" y="231.1111" text-anchor="middle" font-size="26.6667" font-weight="bold" fill="var(--bg)">passing</text>
  <text x="800" y="177.7778" text-anchor="middle" font-size="19.5556" fill="var(--text-muted)">Failing Build</text>
  <rect x="586.6667" y="195.5556" width="142.2222" height="53.3333" rx="6" fill="url(#label-grad)" filter="url(#shadow)" />
  <rect x="728.8889" y="195.5556" width="213.3333" height="53.3333" rx="6" fill="url(#fail-grad)" filter="url(#shadow)" />
  <rect x="586.6667" y="195.5556" width="151.1111" height="53.3333" fill="url(#label-grad)" rx="6"/>
  <rect x="728.8889" y="195.5556" width="204.4444" height="53.3333" fill="url(#fail-grad)" rx="6"/>
  <text x="657.7778" y="231.1111" text-anchor="middle" font-size="26.6667" font-weight="bold" fill="var(--bg)">CI</text>
  <text x="831.1111" y="231.1111" text-anchor="middle" font-size="26.6667" font-weight="bold" fill="var(--bg)">failing</text>
  <line x1="88.8889" y1="293.3333" x2="1048.8889" y2="293.3333" stroke="var(--surface)" stroke-width="1.7778" />
  <text x="568.8889" y="346.6667" text-anchor="middle" font-size="17.7778" fill="var(--text-muted)">CI badges display live build status. Embed in your README with:</text>
  <rect x="177.7778" y="368.8889" width="782.2222" height="88.8889" rx="6" fill="var(--surface)" filter="url(#shadow)" />
  <text x="568.8889" y="408.8889" text-anchor="middle" font-family="monospace" font-size="16" fill="var(--primary-accent)">![CI](https://github.com/&lt;owner&gt;/&lt;repo&gt;/actions/workflows/ci.yml/badge.svg)</text>
  <text x="568.8889" y="440" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--text-muted)">Markdown image link pointing to the GitHub Actions badge endpoint</text>
  <circle cx="177.7778" cy="500.4444" r="5.3333" fill="var(--primary-accent)" />
  <text x="195.5556" y="504.8889" font-size="16" fill="var(--text)">Badge auto-updates on every workflow run</text>
  <circle cx="177.7778" cy="536" r="5.3333" fill="var(--primary-accent)" />
  <text x="195.5556" y="540.4444" font-size="16" fill="var(--text)">Green = passing, Red = failing, Gray = no runs yet</text>
</svg>
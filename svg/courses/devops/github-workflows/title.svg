<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <linearGradient id="bg" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" stop-color="#212121" />
      <stop offset="100%" stop-color="#212121" />
    </linearGradient>
  </defs>
  <rect width="1109.8266" height="499.8644" fill="url(#bg)" rx="6" x="130.1734" y="120.1356"/>
  <g transform="translate(400,155)">
    <circle cx="130.1734" cy="120.1356" r="80.6893" fill="var(--surface)" opacity="0.9" />
    <ellipse cx="105.0288" cy="107.6388" rx="16.474" ry="15.2737" fill="var(--text)" />
    <ellipse cx="155.3179" cy="107.6388" rx="16.474" ry="15.2737" fill="var(--text)" />
    <ellipse cx="109.3642" cy="104.8619" rx="6.9364" ry="6.9425" fill="var(--surface)" />
    <ellipse cx="159.6531" cy="104.8619" rx="6.9364" ry="6.9425" fill="var(--surface)" />
    <path d="M 113.6994 138.8804 Q 130.1734 151.377 146.6474 138.8804" fill="none" stroke="var(--text)" stroke-width="3.5556" />
    <path d="M 60.8092 170.122 Q 40 207.6118 67.7456 226.3567" fill="none" stroke="var(--surface)" stroke-width="8.8889" stroke-linecap="round" opacity="0.7" />
    <path d="M 199.5375 170.122 Q 220.3467 207.6118 192.6011 226.3567" fill="none" stroke="var(--surface)" stroke-width="8.8889" stroke-linecap="round" opacity="0.7" />
  </g>
  <g transform="translate(0,310)">
    <line x1="296.6474" y1="157.6254" x2="1073.526" y2="157.6254" stroke="var(--ok-border)" stroke-width="2" opacity="0.5" />
    <circle cx="366.0115" cy="157.6254" r="22.4999" fill="var(--text)" stroke="var(--ok-border)" stroke-width="2.6667" />
    <text x="366.0115" y="163.1794" font-family="monospace" font-size="17.069" fill="var(--ok-accent)" text-anchor="middle">1</text>
    <circle cx="560.2312" cy="157.6254" r="22.4999" fill="var(--text)" stroke="var(--ok-border)" stroke-width="2.6667" />
    <text x="560.2312" y="163.1794" font-family="monospace" font-size="17.069" fill="var(--ok-accent)" text-anchor="middle">2</text>
    <circle cx="754.4508" cy="157.6254" r="22.4999" fill="var(--text)" stroke="var(--ok-border)" stroke-width="2.6667" />
    <text x="754.4508" y="163.1794" font-family="monospace" font-size="17.069" fill="var(--ok-accent)" text-anchor="middle">3</text>
    <circle cx="948.6705" cy="157.6254" r="22.4999" fill="var(--ok-accent)" opacity="0.8" />
    <polyline points="936.5318,157.6254 945.2023,165.2622 962.5433,149.2942" fill="none" stroke="var(--bg)" stroke-width="3.5556" stroke-linecap="round" stroke-linejoin="round" />
    <polygon points="442.3121,154.1541 456.1849,157.6254 442.3121,161.0965" fill="var(--ok-accent)" opacity="0.6" />
    <polygon points="636.5317,154.1541 650.4046,157.6254 636.5317,161.0965" fill="var(--ok-accent)" opacity="0.6" />
    <polygon points="830.7514,154.1541 844.6242,157.6254 830.7514,161.0965" fill="var(--ok-accent)" opacity="0.6" />
  </g>
  <g transform="translate(100,50)" opacity="0.4">
    <text x="130.1734" y="120.1356" font-family="monospace" font-size="12.4137" fill="var(--text-faint)">on: push</text>
    <text x="130.1734" y="137.4919" font-family="monospace" font-size="12.4137" fill="var(--text-faint)">jobs:</text>
    <text x="130.1734" y="154.8483" font-family="monospace" font-size="12.4137" fill="var(--ok-accent)">  build:</text>
  </g>
  <g transform="translate(600,50)" opacity="0.4">
    <text x="130.1734" y="120.1356" font-family="monospace" font-size="12.4137" fill="var(--text-faint)">steps:</text>
    <text x="130.1734" y="137.4919" font-family="monospace" font-size="12.4137" fill="var(--ok-accent)">  - uses: ...</text>
    <text x="130.1734" y="154.8483" font-family="monospace" font-size="12.4137" fill="var(--ok-accent)">  - run: ...</text>
  </g>
  <circle cx="213.4103" cy="370.0677" r="2.3276" fill="var(--ok-accent)" opacity="0.3" />
  <circle cx="1156.7629" cy="345.0745" r="3.8793" fill="var(--ok-accent)" opacity="0.25" />
  <rect x="546.3584" y="583.8987" width="277.4566" height="3.4713" rx="6" fill="var(--ok-accent)" opacity="0.4" />
</svg>
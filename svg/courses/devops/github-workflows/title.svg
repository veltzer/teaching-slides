<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <g transform="translate(0,120)">
  <g transform="translate(400,155)">
    <circle cx="40" cy="40" r="90.3789" fill="var(--surface)" opacity="0.9"/>
    <ellipse cx="12.8124" cy="25.4998" rx="17.8125" ry="17.7223" fill="var(--text)"/>
    <ellipse cx="67.1875" cy="25.4998" rx="17.8125" ry="17.7223" fill="var(--text)"/>
    <ellipse cx="17.5001" cy="22.2777" rx="7.5" ry="8.0555" fill="var(--surface)"/>
    <ellipse cx="71.8749" cy="22.2777" rx="7.5" ry="8.0555" fill="var(--surface)"/>
    <path d="M 22.1875 61.7499 Q 40 76.2499 57.8125 61.7499" fill="none" stroke="var(--text)" stroke-width="3.5556"/>
    <path d="M -35 98 Q -57.5 141.4999 -27.5001 163.2499" fill="none" stroke="var(--surface)" stroke-width="8.8889" stroke-linecap="round" opacity="0.7"/>
    <path d="M 114.9999 98 Q 137.4999 141.4999 107.4999 163.2499" fill="none" stroke="var(--surface)" stroke-width="8.8889" stroke-linecap="round" opacity="0.7"/>
  </g>
  <g transform="translate(0,310)">
    <line x1="220" y1="83.5" x2="1060" y2="83.5" stroke="var(--ok-border)" stroke-width="2" opacity="0.5"/>
    <circle cx="294.9999" cy="83.5" r="25.2018" fill="var(--text)" stroke="var(--ok-border)" stroke-width="2.6667"/>
    <text x="294.9999" y="89.9444" font-size="19.1187" fill="var(--ok-accent)" text-anchor="middle" font-family="Courier New, monospace">1</text>
    <circle cx="505" cy="83.5" r="25.2018" fill="var(--text)" stroke="var(--ok-border)" stroke-width="2.6667"/>
    <text x="505" y="89.9444" font-size="19.1187" fill="var(--ok-accent)" text-anchor="middle" font-family="Courier New, monospace">2</text>
    <circle cx="714.9999" cy="83.5" r="25.2018" fill="var(--text)" stroke="var(--ok-border)" stroke-width="2.6667"/>
    <text x="714.9999" y="89.9444" font-size="19.1187" fill="var(--ok-accent)" text-anchor="middle" font-family="Courier New, monospace">3</text>
    <circle cx="925" cy="83.5" r="25.2018" fill="var(--ok-accent)" opacity="0.8"/>
    <polyline points="911.875,83.5 921.25,92.3611 939.9999,73.8332" fill="none" stroke="var(--bg)" stroke-width="3.5556" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="377.5,79.4722 392.4999,83.5 377.5,87.5275" fill="var(--ok-accent)" opacity="0.6"/>
    <polygon points="587.4999,79.4722 602.5,83.5 587.4999,87.5275" fill="var(--ok-accent)" opacity="0.6"/>
    <polygon points="797.5,79.4722 812.4999,83.5 797.5,87.5275" fill="var(--ok-accent)" opacity="0.6"/>
  </g>
  <g transform="translate(100,50)" opacity="0.4">
    <text x="40" y="40" font-size="13.9044" fill="var(--text-faint)" font-family="Courier New, monospace">on: push</text>
    <text x="40" y="60.1388" font-size="13.9044" fill="var(--text-faint)" font-family="Courier New, monospace">jobs:</text>
    <text x="40" y="80.2777" font-size="13.9044" fill="var(--ok-accent)" font-family="Courier New, monospace">  build:</text>
  </g>
  <g transform="translate(600,50)" opacity="0.4">
    <text x="40" y="40" font-size="13.9044" fill="var(--text-faint)" font-family="Courier New, monospace">steps:</text>
    <text x="40" y="60.1388" font-size="13.9044" fill="var(--ok-accent)" font-family="Courier New, monospace">  - uses: ...</text>
    <text x="40" y="80.2777" font-size="13.9044" fill="var(--ok-accent)" font-family="Courier New, monospace">  - run: ...</text>
  </g>
  <circle cx="129.9999" cy="329.9999" r="2.6071" fill="var(--ok-accent)" opacity="0.3"/>
  <circle cx="1149.9999" cy="300.9999" r="4.3451" fill="var(--ok-accent)" opacity="0.25"/>
  <rect x="490" y="578.1111" width="299.9999" height="4.0278" rx="6" fill="var(--ok-accent)" opacity="0.4"/>
  </g>
  <text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">Github Workflows</text>
  <text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">CI/CD Pipeline Automation</text>
</svg>

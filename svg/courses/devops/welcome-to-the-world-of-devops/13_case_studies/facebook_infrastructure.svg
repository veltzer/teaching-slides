<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="615.015" y="62.2703" text-anchor="middle" font-size="24.6006" font-weight="bold">Deployment Frequency Metrics</text>
  <rect x="61.5015" y="121.0811" width="164.004" height="484.3243" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <rect x="82.002" y="467.027" width="123.003" height="103.7838" fill="var(--danger-accent)" rx="6" />
  <text x="143.5035" y="536.2162" text-anchor="middle" font-size="20.5005" fill="var(--bg)">2/year</text>
  <text x="143.5035" y="640" text-anchor="middle" font-size="20.5005">2009</text>
  <rect x="287.007" y="121.0811" width="164.004" height="484.3243" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <rect x="307.5075" y="363.2432" width="123.003" height="207.5676" fill="var(--warn-accent)" rx="6" />
  <text x="369.009" y="484.3243" text-anchor="middle" font-size="20.5005" fill="var(--bg)">12/year</text>
  <text x="369.009" y="640" text-anchor="middle" font-size="20.5005">2012</text>
  <rect x="512.5125" y="121.0811" width="164.004" height="484.3243" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <rect x="533.013" y="259.4595" width="123.003" height="311.3514" fill="var(--primary-accent)" rx="6" />
  <text x="594.5145" y="432.4324" text-anchor="middle" font-size="20.5005" fill="var(--bg)">52/year</text>
  <text x="594.5145" y="640" text-anchor="middle" font-size="20.5005">2015</text>
  <rect x="738.018" y="121.0811" width="164.004" height="484.3243" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <rect x="758.5185" y="172.973" width="123.003" height="397.8378" fill="var(--ok-accent)" rx="6" />
  <text x="820.02" y="387.4595" text-anchor="middle" font-size="20.5005" fill="var(--bg)">1000s/day</text>
  <text x="820.02" y="640" text-anchor="middle" font-size="20.5005">2018</text>
  <rect x="963.5236" y="121.0811" width="205.005" height="484.3243" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <rect x="984.024" y="138.3784" width="164.004" height="432.4324" fill="var(--info-accent)" rx="6" />
  <text x="1066.026" y="328.6486" text-anchor="middle" font-size="20.5005" fill="var(--bg)">On-demand</text>
  <text x="1066.026" y="380.5405" text-anchor="middle" font-size="20.5005" fill="var(--bg)">continuous</text>
  <text x="1066.026" y="640" text-anchor="middle" font-size="20.5005">Now</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="177.7778" height="541.333266533335" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.3308766183" filter="url(#shadow)"/>
  <rect x="62.2222" y="426.666666666667" width="133.3333" height="115.999977733334" fill="var(--danger-accent)" rx="6.3308766183"/>
  <text x="128.8889" y="504.000022266666" text-anchor="middle" font-size="22.565249045217" fill="var(--bg)" font-family="Arial, sans-serif">2/year</text>
  <text x="128.8889" y="620" text-anchor="middle" font-size="22.565249045217" font-family="Arial, sans-serif" fill="var(--text)">2009</text>
  <rect x="284.4444" y="40" width="177.7778" height="541.333266533335" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.3308766183" filter="url(#shadow)"/>
  <rect x="306.6666" y="310.666577600003" width="133.3333" height="232.000066799998" fill="var(--warn-accent)" rx="6.3308766183"/>
  <text x="373.3333" y="445.999922066669" text-anchor="middle" font-size="22.565249045217" fill="var(--bg)" font-family="Arial, sans-serif">12/year</text>
  <text x="373.3333" y="620" text-anchor="middle" font-size="22.565249045217" font-family="Arial, sans-serif" fill="var(--text)">2012</text>
  <rect x="528.8888" y="40" width="177.7778" height="541.333266533335" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.3308766183" filter="url(#shadow)"/>
  <rect x="551.1111" y="194.666711199999" width="133.3333" height="348.000044533332" fill="var(--primary-accent)" rx="6.3308766183"/>
  <text x="617.7777" y="387.999933200002" text-anchor="middle" font-size="22.565249045217" fill="var(--bg)" font-family="Arial, sans-serif">52/year</text>
  <text x="617.7777" y="620" text-anchor="middle" font-size="22.565249045217" font-family="Arial, sans-serif" fill="var(--text)">2015</text>
  <rect x="773.3333" y="40" width="177.7778" height="541.333266533335" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.3308766183" filter="url(#shadow)"/>
  <rect x="795.5555" y="97.999988866667" width="133.3333" height="444.666655533334" fill="var(--ok-accent)" rx="6.3308766183"/>
  <text x="862.2221" y="337.733380093332" text-anchor="middle" font-size="22.565249045217" fill="var(--bg)" font-family="Arial, sans-serif">1000s/day</text>
  <text x="862.2221" y="620" text-anchor="middle" font-size="22.565249045217" font-family="Arial, sans-serif" fill="var(--text)">2018</text>
  <rect x="1017.7778" y="40" width="222.2222" height="541.333266533335" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.3308766183" filter="url(#shadow)"/>
  <rect x="1039.9999" y="59.333366733332" width="177.7778" height="483.333277666668" fill="var(--info-accent)" rx="6.3308766183"/>
  <text x="1128.8888" y="271.999955466668" text-anchor="middle" font-size="22.565249045217" fill="var(--bg)" font-family="Arial, sans-serif">On-demand</text>
  <text x="1128.8888" y="329.999944333335" text-anchor="middle" font-size="22.565249045217" fill="var(--bg)" font-family="Arial, sans-serif">continuous</text>
  <text x="1128.8888" y="620" text-anchor="middle" font-size="22.565249045217" font-family="Arial, sans-serif" fill="var(--text)">Now</text>
</svg>

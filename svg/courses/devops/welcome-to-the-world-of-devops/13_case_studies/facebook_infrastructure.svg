<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="25.6631" font-weight="bold">Deployment Frequency Metrics</text>
  <rect x="40" y="99.0419" width="177.7778" height="486.2275" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <rect x="62.2222" y="446.3473" width="133.3333" height="104.1916" fill="var(--danger-accent)" rx="6" />
  <text x="128.8889" y="515.8084" text-anchor="middle" font-size="21.3859" fill="var(--bg)">2/year</text>
  <text x="128.8889" y="620" text-anchor="middle" font-size="21.3859">2009</text>
  <rect x="284.4444" y="99.0419" width="177.7778" height="486.2275" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <rect x="306.6666" y="342.1556" width="133.3333" height="208.3833" fill="var(--warn-accent)" rx="6" />
  <text x="373.3333" y="463.7125" text-anchor="middle" font-size="21.3859" fill="var(--bg)">12/year</text>
  <text x="373.3333" y="620" text-anchor="middle" font-size="21.3859">2012</text>
  <rect x="528.8888" y="99.0419" width="177.7778" height="486.2275" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <rect x="551.1111" y="237.9641" width="133.3333" height="312.5749" fill="var(--primary-accent)" rx="6" />
  <text x="617.7777" y="411.6167" text-anchor="middle" font-size="21.3859" fill="var(--bg)">52/year</text>
  <text x="617.7777" y="620" text-anchor="middle" font-size="21.3859">2015</text>
  <rect x="773.3333" y="99.0419" width="177.7778" height="486.2275" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <rect x="795.5555" y="151.1377" width="133.3333" height="399.4012" fill="var(--ok-accent)" rx="6" />
  <text x="862.2221" y="366.4671" text-anchor="middle" font-size="21.3859" fill="var(--bg)">1000s/day</text>
  <text x="862.2221" y="620" text-anchor="middle" font-size="21.3859">2018</text>
  <rect x="1017.7778" y="99.0419" width="222.2222" height="486.2275" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <rect x="1039.9999" y="116.4072" width="177.7778" height="434.1317" fill="var(--info-accent)" rx="6" />
  <text x="1128.8888" y="307.4251" text-anchor="middle" font-size="21.3859" fill="var(--bg)">On-demand</text>
  <text x="1128.8888" y="359.5209" text-anchor="middle" font-size="21.3859" fill="var(--bg)">continuous</text>
  <text x="1128.8888" y="620" text-anchor="middle" font-size="21.3859">Now</text>
</svg>
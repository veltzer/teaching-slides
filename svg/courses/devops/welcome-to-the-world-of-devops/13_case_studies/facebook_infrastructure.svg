<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="25.6631" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Deployment Frequency Metrics</text>
  <rect x="40" y="99.0419" width="177.7778" height="486.2275" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <rect x="62.2222" y="446.3473" width="133.3333" height="104.1916" fill="var(--danger-accent)" rx="6"/>
  <text x="128.8889" y="515.8084" text-anchor="middle" font-size="21.3859" fill="var(--bg)" font-family="Arial, sans-serif">2/year</text>
  <text x="128.8889" y="620" text-anchor="middle" font-size="21.3859" font-family="Arial, sans-serif" fill="var(--text)">2009</text>
  <rect x="284.4444" y="99.0419" width="177.7778" height="486.2275" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <rect x="306.6666" y="342.1556" width="133.3333" height="208.3833" fill="var(--warn-accent)" rx="6"/>
  <text x="373.3333" y="463.7125" text-anchor="middle" font-size="21.3859" fill="var(--bg)" font-family="Arial, sans-serif">12/year</text>
  <text x="373.3333" y="620" text-anchor="middle" font-size="21.3859" font-family="Arial, sans-serif" fill="var(--text)">2012</text>
  <rect x="528.8888" y="99.0419" width="177.7778" height="486.2275" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <rect x="551.1111" y="237.9641" width="133.3333" height="312.5749" fill="var(--primary-accent)" rx="6"/>
  <text x="617.7777" y="411.6167" text-anchor="middle" font-size="21.3859" fill="var(--bg)" font-family="Arial, sans-serif">52/year</text>
  <text x="617.7777" y="620" text-anchor="middle" font-size="21.3859" font-family="Arial, sans-serif" fill="var(--text)">2015</text>
  <rect x="773.3333" y="99.0419" width="177.7778" height="486.2275" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <rect x="795.5555" y="151.1377" width="133.3333" height="399.4012" fill="var(--ok-accent)" rx="6"/>
  <text x="862.2221" y="366.4671" text-anchor="middle" font-size="21.3859" fill="var(--bg)" font-family="Arial, sans-serif">1000s/day</text>
  <text x="862.2221" y="620" text-anchor="middle" font-size="21.3859" font-family="Arial, sans-serif" fill="var(--text)">2018</text>
  <rect x="1017.7778" y="99.0419" width="222.2222" height="486.2275" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <rect x="1039.9999" y="116.4072" width="177.7778" height="434.1317" fill="var(--info-accent)" rx="6"/>
  <text x="1128.8888" y="307.4251" text-anchor="middle" font-size="21.3859" fill="var(--bg)" font-family="Arial, sans-serif">On-demand</text>
  <text x="1128.8888" y="359.5209" text-anchor="middle" font-size="21.3859" fill="var(--bg)" font-family="Arial, sans-serif">continuous</text>
  <text x="1128.8888" y="620" text-anchor="middle" font-size="21.3859" font-family="Arial, sans-serif" fill="var(--text)">Now</text>
</svg>

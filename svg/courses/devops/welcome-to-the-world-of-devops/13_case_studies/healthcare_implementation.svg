<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="364.2857" height="270.666688933333" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.3308766183" filter="url(#shadow)"/>
  <text x="222.1429" y="117.333355599999" text-anchor="middle" font-size="24.374508068117" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Siloed Teams</text>
  <text x="222.1429" y="183.066668893333" text-anchor="middle" font-size="22.158595737102" font-family="Arial, sans-serif" fill="var(--danger-text)">Dev / Ops / Security</text>
  <text x="222.1429" y="248.799982186667" text-anchor="middle" font-size="22.158595737102" font-family="Arial, sans-serif" fill="var(--danger-text)">separate, slow handoffs</text>
  <rect x="457.8572" y="40" width="364.2857" height="270.666688933333" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.3308766183" filter="url(#shadow)"/>
  <text x="639.9999" y="117.333355599999" text-anchor="middle" font-size="24.374508068117" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Shared Ownership</text>
  <text x="639.9999" y="183.066668893333" text-anchor="middle" font-size="22.158595737102" font-family="Arial, sans-serif" fill="var(--warn-text)">Cross-functional squads</text>
  <text x="639.9999" y="248.799982186667" text-anchor="middle" font-size="22.158595737102" font-family="Arial, sans-serif" fill="var(--warn-text)">HIPAA-aware pipelines</text>
  <rect x="875.7143" y="40" width="364.2857" height="270.666688933333" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.3308766183" filter="url(#shadow)"/>
  <text x="1057.8571" y="117.333355599999" text-anchor="middle" font-size="24.374508068117" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Full DevSecOps</text>
  <text x="1057.8571" y="183.066668893333" text-anchor="middle" font-size="22.158595737102" font-family="Arial, sans-serif" fill="var(--ok-text)">Automated compliance</text>
  <text x="1057.8571" y="248.799982186667" text-anchor="middle" font-size="22.158595737102" font-family="Arial, sans-serif" fill="var(--ok-text)">Continuous audit trails</text>
  <line x1="404.2857" y1="175.333344466666" x2="457.8572" y2="175.333344466666" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="822.1427" y1="175.333344466666" x2="875.7143" y2="175.333344466666" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="387.999933200002" width="1200" height="232.000066799998" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.3308766183" filter="url(#shadow)"/>
  <text x="222.1429" y="476.933331106667" text-anchor="middle" font-size="22.158595737102" fill="var(--danger-accent)" font-family="Arial, sans-serif">Deploys: quarterly</text>
  <text x="222.1429" y="554.266686706666" text-anchor="middle" font-size="22.158595737102" fill="var(--danger-accent)" font-family="Arial, sans-serif">MTTR: days</text>
  <text x="639.9999" y="476.933331106667" text-anchor="middle" font-size="22.158595737102" fill="var(--warn-accent)" font-family="Arial, sans-serif">Deploys: monthly</text>
  <text x="639.9999" y="554.266686706666" text-anchor="middle" font-size="22.158595737102" fill="var(--warn-accent)" font-family="Arial, sans-serif">MTTR: hours</text>
  <text x="1057.8571" y="476.933331106667" text-anchor="middle" font-size="22.158595737102" fill="var(--ok-accent)" font-family="Arial, sans-serif">Deploys: weekly</text>
  <text x="1057.8571" y="554.266686706666" text-anchor="middle" font-size="22.158595737102" fill="var(--ok-accent)" font-family="Arial, sans-serif">MTTR: minutes</text>
</svg>

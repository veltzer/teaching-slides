<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arrowhealth" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <ns0:path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="615.015" y="62.2703" text-anchor="middle" font-size="24.6006" font-weight="bold">Healthcare DevOps Cultural Shift</ns0:text>
  <ns0:rect x="41.001" y="121.0811" width="348.5085" height="242.1622" fill="#ffebee" stroke="#333" stroke-width="3.0751" rx="10.2503" />
  <ns0:text x="215.2553" y="190.2703" text-anchor="middle" font-size="22.5506" font-weight="bold">Siloed Teams</ns0:text>
  <ns0:text x="215.2553" y="249.0811" text-anchor="middle" font-size="20.5005">Dev / Ops / Security</ns0:text>
  <ns0:text x="215.2553" y="307.8919" text-anchor="middle" font-size="20.5005">separate, slow handoffs</ns0:text>
  <ns0:rect x="440.7608" y="121.0811" width="348.5085" height="242.1622" fill="#fff3e0" stroke="#333" stroke-width="3.0751" rx="10.2503" />
  <ns0:text x="615.015" y="190.2703" text-anchor="middle" font-size="22.5506" font-weight="bold">Shared Ownership</ns0:text>
  <ns0:text x="615.015" y="249.0811" text-anchor="middle" font-size="20.5005">Cross-functional squads</ns0:text>
  <ns0:text x="615.015" y="307.8919" text-anchor="middle" font-size="20.5005">HIPAA-aware pipelines</ns0:text>
  <ns0:rect x="840.5206" y="121.0811" width="348.5085" height="242.1622" fill="#e8f5e9" stroke="#333" stroke-width="3.0751" rx="10.2503" />
  <ns0:text x="1014.7748" y="190.2703" text-anchor="middle" font-size="22.5506" font-weight="bold">Full DevSecOps</ns0:text>
  <ns0:text x="1014.7748" y="249.0811" text-anchor="middle" font-size="20.5005">Automated compliance</ns0:text>
  <ns0:text x="1014.7748" y="307.8919" text-anchor="middle" font-size="20.5005">Continuous audit trails</ns0:text>
  <ns0:line x1="389.5095" y1="242.1622" x2="440.7608" y2="242.1622" stroke="#333" stroke-width="4.1001" marker-end="url(#arrowhealth)" />
  <ns0:line x1="789.2692" y1="242.1622" x2="840.5206" y2="242.1622" stroke="#333" stroke-width="4.1001" marker-end="url(#arrowhealth)" />
  <ns0:rect x="41.001" y="432.4324" width="1148.0281" height="207.5676" fill="#e3f2fd" stroke="#333" stroke-width="2.05" rx="10.2503" />
  <ns0:text x="215.2553" y="512" text-anchor="middle" font-size="20.5005" fill="#c62828">Deploys: quarterly</ns0:text>
  <ns0:text x="215.2553" y="581.1892" text-anchor="middle" font-size="20.5005" fill="#c62828">MTTR: days</ns0:text>
  <ns0:text x="615.015" y="512" text-anchor="middle" font-size="20.5005" fill="#e65100">Deploys: monthly</ns0:text>
  <ns0:text x="615.015" y="581.1892" text-anchor="middle" font-size="20.5005" fill="#e65100">MTTR: hours</ns0:text>
  <ns0:text x="1014.7748" y="512" text-anchor="middle" font-size="20.5005" fill="#2e7d32">Deploys: weekly</ns0:text>
  <ns0:text x="1014.7748" y="581.1892" text-anchor="middle" font-size="20.5005" fill="#2e7d32">MTTR: minutes</ns0:text>
</ns0:svg>
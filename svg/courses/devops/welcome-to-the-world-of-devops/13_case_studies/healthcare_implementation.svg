<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhealth" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="25.2006" font-weight="bold">Healthcare DevOps Cultural Shift</text>
  <rect x="40" y="99.0419" width="364.2857" height="243.1138" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="222.1429" y="168.503" text-anchor="middle" font-size="23.1006" font-weight="bold">Siloed Teams</text>
  <text x="222.1429" y="227.5449" text-anchor="middle" font-size="21.0005">Dev / Ops / Security</text>
  <text x="222.1429" y="286.5868" text-anchor="middle" font-size="21.0005">separate, slow handoffs</text>
  <rect x="457.8572" y="99.0419" width="364.2857" height="243.1138" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="168.503" text-anchor="middle" font-size="23.1006" font-weight="bold">Shared Ownership</text>
  <text x="639.9999" y="227.5449" text-anchor="middle" font-size="21.0005">Cross-functional squads</text>
  <text x="639.9999" y="286.5868" text-anchor="middle" font-size="21.0005">HIPAA-aware pipelines</text>
  <rect x="875.7143" y="99.0419" width="364.2857" height="243.1138" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1057.8571" y="168.503" text-anchor="middle" font-size="23.1006" font-weight="bold">Full DevSecOps</text>
  <text x="1057.8571" y="227.5449" text-anchor="middle" font-size="21.0005">Automated compliance</text>
  <text x="1057.8571" y="286.5868" text-anchor="middle" font-size="21.0005">Continuous audit trails</text>
  <line x1="404.2857" y1="220.5988" x2="457.8572" y2="220.5988" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowhealth)" />
  <line x1="822.1427" y1="220.5988" x2="875.7143" y2="220.5988" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowhealth)" />
  <rect x="40" y="411.6167" width="1200" height="208.3833" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="222.1429" y="491.497" text-anchor="middle" font-size="21.0005" fill="var(--danger-accent)">Deploys: quarterly</text>
  <text x="222.1429" y="560.9581" text-anchor="middle" font-size="21.0005" fill="var(--danger-accent)">MTTR: days</text>
  <text x="639.9999" y="491.497" text-anchor="middle" font-size="21.0005" fill="var(--warn-accent)">Deploys: monthly</text>
  <text x="639.9999" y="560.9581" text-anchor="middle" font-size="21.0005" fill="var(--warn-accent)">MTTR: hours</text>
  <text x="1057.8571" y="491.497" text-anchor="middle" font-size="21.0005" fill="var(--ok-accent)">Deploys: weekly</text>
  <text x="1057.8571" y="560.9581" text-anchor="middle" font-size="21.0005" fill="var(--ok-accent)">MTTR: minutes</text>
</svg>
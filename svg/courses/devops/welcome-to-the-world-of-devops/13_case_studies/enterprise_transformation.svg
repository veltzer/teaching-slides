<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="615.015" y="62.2703" text-anchor="middle" font-size="24.6006" font-weight="bold">Enterprise Before / After Transformation</text>
  <rect x="41.001" y="103.7838" width="512.5125" height="259.4595" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="297.2572" y="172.973" text-anchor="middle" font-size="22.5506" font-weight="bold" fill="var(--danger-accent)">Before</text>
  <text x="297.2572" y="235.2432" text-anchor="middle" font-size="20.5005">Waterfall releases (6-12 mo)</text>
  <text x="297.2572" y="287.1351" text-anchor="middle" font-size="20.5005">Manual testing, on-prem servers</text>
  <text x="297.2572" y="339.027" text-anchor="middle" font-size="20.5005">Change Approval Board bottleneck</text>
  <rect x="676.5165" y="103.7838" width="512.5125" height="259.4595" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="932.7728" y="172.973" text-anchor="middle" font-size="22.5506" font-weight="bold" fill="var(--ok-accent)">After</text>
  <text x="932.7728" y="235.2432" text-anchor="middle" font-size="20.5005">CI/CD pipelines (daily deploys)</text>
  <text x="932.7728" y="287.1351" text-anchor="middle" font-size="20.5005">IaC, containers, cloud-native</text>
  <text x="932.7728" y="339.027" text-anchor="middle" font-size="20.5005">Automated governance + audit</text>
  <line x1="553.5135" y1="231.7838" x2="676.5165" y2="231.7838" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowent)" />
  <rect x="41.001" y="415.1351" width="246.006" height="224.8649" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="164.004" y="484.3243" text-anchor="middle" font-size="20.5005" font-weight="bold">Lead Time</text>
  <text x="164.004" y="536.2162" text-anchor="middle" font-size="20.5005" fill="var(--danger-accent)">6 months</text>
  <text x="164.004" y="595.027" text-anchor="middle" font-size="20.5005" fill="var(--ok-accent)">2 days</text>
  <rect x="328.008" y="415.1351" width="246.006" height="224.8649" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="451.011" y="484.3243" text-anchor="middle" font-size="20.5005" font-weight="bold">Deploy Freq</text>
  <text x="451.011" y="536.2162" text-anchor="middle" font-size="20.5005" fill="var(--danger-accent)">2/year</text>
  <text x="451.011" y="595.027" text-anchor="middle" font-size="20.5005" fill="var(--ok-accent)">Daily</text>
  <rect x="615.015" y="415.1351" width="246.006" height="224.8649" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="738.018" y="484.3243" text-anchor="middle" font-size="20.5005" font-weight="bold">MTTR</text>
  <text x="738.018" y="536.2162" text-anchor="middle" font-size="20.5005" fill="var(--danger-accent)">1-2 weeks</text>
  <text x="738.018" y="595.027" text-anchor="middle" font-size="20.5005" fill="var(--ok-accent)">&lt; 1 hour</text>
  <rect x="902.0221" y="415.1351" width="287.007" height="224.8649" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1045.5255" y="484.3243" text-anchor="middle" font-size="20.5005" font-weight="bold">Change Fail %</text>
  <text x="1045.5255" y="536.2162" text-anchor="middle" font-size="20.5005" fill="var(--danger-accent)">45%</text>
  <text x="1045.5255" y="595.027" text-anchor="middle" font-size="20.5005" fill="var(--ok-accent)">5%</text>
</svg>
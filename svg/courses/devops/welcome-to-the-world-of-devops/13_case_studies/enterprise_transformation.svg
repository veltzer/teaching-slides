<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="535.7142" height="280.645199521329" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.227928500626" filter="url(#shadow)"/>
  <text x="307.8571" y="114.838727055149" text-anchor="middle" font-size="23.978147520259" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Before</text>
  <text x="307.8571" y="182.19348443705" text-anchor="middle" font-size="21.798268746232" font-family="Arial, sans-serif" fill="var(--danger-text)">Waterfall releases (6-12 mo)</text>
  <text x="307.8571" y="238.322502792931" text-anchor="middle" font-size="21.798268746232" font-family="Arial, sans-serif" fill="var(--danger-text)">Manual testing, on-prem servers</text>
  <text x="307.8571" y="294.451628890737" text-anchor="middle" font-size="21.798268746232" font-family="Arial, sans-serif" fill="var(--danger-text)">Change Approval Board bottleneck</text>
  <rect x="704.2857" y="40" width="535.7142" height="280.645199521329" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.227928500626" filter="url(#shadow)"/>
  <text x="972.1428" y="114.838727055149" text-anchor="middle" font-size="23.978147520259" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">After</text>
  <text x="972.1428" y="182.19348443705" text-anchor="middle" font-size="21.798268746232" font-family="Arial, sans-serif" fill="var(--ok-text)">CI/CD pipelines (daily deploys)</text>
  <text x="972.1428" y="238.322502792931" text-anchor="middle" font-size="21.798268746232" font-family="Arial, sans-serif" fill="var(--ok-text)">IaC, containers, cloud-native</text>
  <text x="972.1428" y="294.451628890737" text-anchor="middle" font-size="21.798268746232" font-family="Arial, sans-serif" fill="var(--ok-text)">Automated governance + audit</text>
  <line x1="575.7142" y1="178.451607342352" x2="704.2857" y2="178.451607342352" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="376.774217877209" width="257.1428" height="243.225782122791" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.227928500626" filter="url(#shadow)"/>
  <text x="168.5714" y="451.612837190432" text-anchor="middle" font-size="21.798268746232" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Lead Time</text>
  <text x="168.5714" y="507.741963288239" text-anchor="middle" font-size="21.798268746232" fill="var(--danger-accent)" font-family="Arial, sans-serif">6 months</text>
  <text x="168.5714" y="571.354843575442" text-anchor="middle" font-size="21.798268746232" fill="var(--ok-accent)" font-family="Arial, sans-serif">2 days</text>
  <rect x="340" y="376.774217877209" width="257.1428" height="243.225782122791" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.227928500626" filter="url(#shadow)"/>
  <text x="468.5714" y="451.612837190432" text-anchor="middle" font-size="21.798268746232" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Deploy Freq</text>
  <text x="468.5714" y="507.741963288239" text-anchor="middle" font-size="21.798268746232" fill="var(--danger-accent)" font-family="Arial, sans-serif">2/year</text>
  <text x="468.5714" y="571.354843575442" text-anchor="middle" font-size="21.798268746232" fill="var(--ok-accent)" font-family="Arial, sans-serif">Daily</text>
  <rect x="639.9999" y="376.774217877209" width="257.1428" height="243.225782122791" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.227928500626" filter="url(#shadow)"/>
  <text x="768.5714" y="451.612837190432" text-anchor="middle" font-size="21.798268746232" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">MTTR</text>
  <text x="768.5714" y="507.741963288239" text-anchor="middle" font-size="21.798268746232" fill="var(--danger-accent)" font-family="Arial, sans-serif">1-2 weeks</text>
  <text x="768.5714" y="571.354843575442" text-anchor="middle" font-size="21.798268746232" fill="var(--ok-accent)" font-family="Arial, sans-serif">&lt; 1 hour</text>
  <rect x="940" y="376.774217877209" width="300" height="243.225782122791" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.227928500626" filter="url(#shadow)"/>
  <text x="1089.9999" y="451.612837190432" text-anchor="middle" font-size="21.798268746232" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Change Fail %</text>
  <text x="1089.9999" y="507.741963288239" text-anchor="middle" font-size="21.798268746232" fill="var(--danger-accent)" font-family="Arial, sans-serif">45%</text>
  <text x="1089.9999" y="571.354843575442" text-anchor="middle" font-size="21.798268746232" fill="var(--ok-accent)" font-family="Arial, sans-serif">5%</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="224.6153" y="40" text-anchor="middle" font-size="26.5525" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Before</text>
  <text x="1009.2308" y="40" text-anchor="middle" font-size="26.5525" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">After</text>
  <rect x="40" y="82.963" width="369.2307" height="537.037" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <rect x="74.6155" y="136.6667" width="299.9999" height="107.4074" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="224.6153" y="208.2716" text-anchor="middle" font-size="22.127" font-family="Arial, sans-serif" fill="var(--warn-text)">Monolith App</text>
  <rect x="74.6155" y="279.8765" width="299.9999" height="89.5062" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="224.6153" y="340.7408" text-anchor="middle" font-size="22.127" font-family="Arial, sans-serif" fill="var(--warn-text)">Single DB</text>
  <rect x="74.6155" y="405.1852" width="299.9999" height="89.5062" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="224.6153" y="466.0494" text-anchor="middle" font-size="22.127" font-family="Arial, sans-serif" fill="var(--warn-text)">Manual Deploy</text>
  <text x="224.6153" y="584.1975" text-anchor="middle" font-size="22.127" fill="var(--danger-accent)" font-family="Arial, sans-serif">Releases: Monthly</text>
  <line x1="432.3077" y1="333.5803" x2="778.4614" y2="333.5803" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="12.642 6.321"/>
  <text x="616.9231" y="297.7778" text-anchor="middle" font-size="22.127" fill="var(--text)" font-family="Arial, sans-serif">Transform</text>
  <rect x="801.5385" y="82.963" width="438.4615" height="537.037" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <rect x="836.1538" y="125.9259" width="173.0769" height="85.9259" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="921.5384" y="186.7901" text-anchor="middle" font-size="22.127" font-family="Arial, sans-serif" fill="var(--primary-text)">API Svc</text>
  <rect x="1032.3076" y="125.9259" width="173.0769" height="85.9259" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1117.6922" y="186.7901" text-anchor="middle" font-size="22.127" font-family="Arial, sans-serif" fill="var(--primary-text)">Auth Svc</text>
  <rect x="836.1538" y="240.4938" width="173.0769" height="85.9259" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="921.5384" y="301.3581" text-anchor="middle" font-size="22.127" font-family="Arial, sans-serif" fill="var(--primary-text)">Stream Svc</text>
  <rect x="1032.3076" y="240.4938" width="173.0769" height="85.9259" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1117.6922" y="301.3581" text-anchor="middle" font-size="22.127" font-family="Arial, sans-serif" fill="var(--primary-text)">CDN Svc</text>
  <rect x="836.1538" y="355.0617" width="369.2307" height="85.9259" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1020.7691" y="415.9259" text-anchor="middle" font-size="22.127" font-family="Arial, sans-serif" fill="var(--info-text)">AWS Auto-scaling</text>
  <text x="1020.7691" y="530.4938" text-anchor="middle" font-size="22.127" fill="var(--ok-accent)" font-family="Arial, sans-serif">Deploys: 1000s/day</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <text x="640" y="40" text-anchor="middle" font-size="30.3683" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Bash Script Workflow</text>
  <rect x="40" y="140.8696" width="321.4286" height="302.6087" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="200.7143" y="231.6522" text-anchor="middle" font-size="25.3069" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Parse Args</text>
  <text x="200.7143" y="307.3043" text-anchor="middle" font-size="25.3069" font-family="Arial, sans-serif" fill="var(--primary-text)">getopts, validation</text>
  <text x="200.7143" y="372.8696" text-anchor="middle" font-size="25.3069" font-family="Arial, sans-serif" fill="var(--primary-text)">Usage + help text</text>
  <rect x="479.2857" y="140.8696" width="321.4286" height="302.6087" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="231.6522" text-anchor="middle" font-size="25.3069" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Execute Logic</text>
  <text x="640" y="307.3043" text-anchor="middle" font-size="25.3069" font-family="Arial, sans-serif" fill="var(--info-text)">set -euo pipefail</text>
  <text x="640" y="372.8696" text-anchor="middle" font-size="25.3069" font-family="Arial, sans-serif" fill="var(--info-text)">Functions + traps</text>
  <rect x="918.5714" y="140.8696" width="321.4286" height="302.6087" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1079.2857" y="231.6522" text-anchor="middle" font-size="25.3069" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Report Result</text>
  <text x="1079.2857" y="307.3043" text-anchor="middle" font-size="25.3069" font-family="Arial, sans-serif" fill="var(--ok-text)">Exit codes, logging</text>
  <text x="1079.2857" y="372.8696" text-anchor="middle" font-size="25.3069" font-family="Arial, sans-serif" fill="var(--ok-text)">Notifications</text>
  <line x1="361.4286" y1="292.1739" x2="479.2857" y2="292.1739" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800.7143" y1="292.1739" x2="918.5714" y2="292.1739" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="620" text-anchor="middle" font-size="25.3069" fill="var(--text-muted)" font-family="Arial, sans-serif">Robust scripts follow a consistent structure</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

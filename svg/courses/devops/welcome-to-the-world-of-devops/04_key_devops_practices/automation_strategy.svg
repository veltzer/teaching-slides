<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <ellipse cx="640" cy="319.9744" rx="141.1765" ry="83.1755" fill="var(--info-fill)" stroke="var(--text)" stroke-width="4.2667"/>
  <text x="640" y="303.9334" text-anchor="middle" font-size="26.0113" fill="var(--bg)" font-family="Arial, sans-serif">Automation</text>
  <text x="640" y="360.0768" text-anchor="middle" font-size="23.6466" fill="var(--bg)" font-family="Arial, sans-serif">Strategy</text>
  <ellipse cx="216.4706" cy="99.411" rx="176.4706" ry="59.411" fill="var(--primary-fill)" stroke="var(--text)" stroke-width="4.2667"/>
  <text x="216.4706" y="87.3803" text-anchor="middle" font-size="23.6466" font-family="Arial, sans-serif" fill="var(--text)">CI/CD Pipelines</text>
  <text x="216.4706" y="139.5134" text-anchor="middle" font-size="23.6466" font-family="Arial, sans-serif" fill="var(--text)">Build, test, deploy</text>
  <ellipse cx="1063.5294" cy="99.411" rx="176.4706" ry="59.411" fill="var(--info-fill)" stroke="var(--text)" stroke-width="4.2667"/>
  <text x="1063.5294" y="87.3803" text-anchor="middle" font-size="23.6466" font-family="Arial, sans-serif" fill="var(--text)">Infrastructure</text>
  <text x="1063.5294" y="139.5134" text-anchor="middle" font-size="23.6466" font-family="Arial, sans-serif" fill="var(--text)">Provision + configure</text>
  <ellipse cx="216.4706" cy="560.589" rx="176.4706" ry="59.411" fill="var(--ok-fill)" stroke="var(--text)" stroke-width="4.2667"/>
  <text x="216.4706" y="548.5583" text-anchor="middle" font-size="23.6466" font-family="Arial, sans-serif" fill="var(--text)">Testing</text>
  <text x="216.4706" y="600.6915" text-anchor="middle" font-size="23.6466" font-family="Arial, sans-serif" fill="var(--text)">Unit, integration, E2E</text>
  <ellipse cx="1063.5294" cy="560.589" rx="176.4706" ry="59.411" fill="var(--warn-fill)" stroke="var(--text)" stroke-width="4.2667"/>
  <text x="1063.5294" y="548.5583" text-anchor="middle" font-size="23.6466" font-family="Arial, sans-serif" fill="var(--text)">Monitoring</text>
  <text x="1063.5294" y="600.6915" text-anchor="middle" font-size="23.6466" font-family="Arial, sans-serif" fill="var(--text)">Alerts + remediation</text>
  <line x1="522.3529" y1="231.749" x2="381.1764" y2="151.5442" stroke="var(--text)" stroke-width="2"/>
  <line x1="757.6471" y1="231.749" x2="898.8236" y2="151.5442" stroke="var(--text)" stroke-width="2"/>
  <line x1="522.3529" y1="408.1998" x2="381.1764" y2="500.4354" stroke="var(--text)" stroke-width="2"/>
  <line x1="757.6471" y1="408.1998" x2="898.8236" y2="500.4354" stroke="var(--text)" stroke-width="2"/>
</svg>

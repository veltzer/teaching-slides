  <text x="1077.3333" y="208.8" text-anchor="middle" font-size="21.3333" font-weight="bold">Traces</text>
  <text x="1077.3333" y="262.8" text-anchor="middle" font-size="21.3333">Distributed requests</text>
  <text x="1077.3333" y="309.6" text-anchor="middle" font-size="21.3333">End-to-end visibility</text>
  <line x1="362.6667" y1="252" x2="480" y2="252" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowd4_03_key_devops_practices)" />

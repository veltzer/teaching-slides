  <text x="202.6667" y="309.6" text-anchor="middle" font-size="21.3333">Gauges, counters, hist.</text>
  <rect x="480" y="144" width="320" height="216" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="208.8" text-anchor="middle" font-size="21.3333" font-weight="bold">Logs</text>

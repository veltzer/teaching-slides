<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="74.1176" width="231.579" height="238.8236" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="155.7894" y="149.1764" text-anchor="middle" font-size="20.631" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">API Gateway</text>
  <text x="155.7894" y="203.7647" text-anchor="middle" font-size="20.631" font-family="Arial, sans-serif" fill="var(--primary-text)">Routing</text>
  <text x="155.7894" y="251.5294" text-anchor="middle" font-size="20.631" font-family="Arial, sans-serif" fill="var(--primary-text)">Auth</text>
  <rect x="376.8421" y="40" width="210.5263" height="153.5294" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="482.1052" y="108.2353" text-anchor="middle" font-size="20.631" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">User Svc</text>
  <text x="482.1052" y="155.9999" text-anchor="middle" font-size="20.631" font-family="Arial, sans-serif" fill="var(--info-text)">REST API</text>
  <rect x="376.8421" y="227.647" width="210.5263" height="153.5294" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="482.1052" y="295.8823" text-anchor="middle" font-size="20.631" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Order Svc</text>
  <text x="482.1052" y="343.647" text-anchor="middle" font-size="20.631" font-family="Arial, sans-serif" fill="var(--ok-text)">gRPC</text>
  <rect x="713.6842" y="40" width="210.5263" height="153.5294" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="818.9473" y="108.2353" text-anchor="middle" font-size="20.631" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Payment Svc</text>
  <text x="818.9473" y="155.9999" text-anchor="middle" font-size="20.631" font-family="Arial, sans-serif" fill="var(--warn-text)">Async</text>
  <rect x="713.6842" y="227.647" width="210.5263" height="153.5294" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="818.9473" y="295.8823" text-anchor="middle" font-size="20.631" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Notify Svc</text>
  <text x="818.9473" y="343.647" text-anchor="middle" font-size="20.631" font-family="Arial, sans-serif" fill="var(--danger-text)">Events</text>
  <rect x="1029.4737" y="74.1176" width="210.5263" height="238.8236" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1134.7368" y="149.1764" text-anchor="middle" font-size="20.631" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Message Bus</text>
  <text x="1134.7368" y="203.7647" text-anchor="middle" font-size="20.631" font-family="Arial, sans-serif" fill="var(--primary-text)">Kafka</text>
  <text x="1134.7368" y="251.5294" text-anchor="middle" font-size="20.631" font-family="Arial, sans-serif" fill="var(--primary-text)">RabbitMQ</text>
  <line x1="271.5788" y1="142.3529" x2="376.8421" y2="115.0588" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="271.5788" y1="227.647" x2="376.8421" y2="278.8235" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="587.3683" y1="115.0588" x2="713.6842" y2="115.0588" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="587.3683" y1="302.7058" x2="713.6842" y2="302.7058" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="924.2105" y1="142.3529" x2="1029.4737" y2="159.4117" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="924.2105" y1="302.7058" x2="1029.4737" y2="244.7059" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="208.421" y="449.4117" width="842.1052" height="170.5883" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" stroke-dasharray="8.428" filter="url(#shadow)"/>
  <text x="629.4737" y="524.4705" text-anchor="middle" font-size="22.6942" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Service Mesh Layer</text>
  <text x="629.4737" y="579.0588" text-anchor="middle" font-size="20.631" font-family="Arial, sans-serif" fill="var(--info-text)">Discovery - Load Balance - Circuit Break - mTLS</text>
</svg>

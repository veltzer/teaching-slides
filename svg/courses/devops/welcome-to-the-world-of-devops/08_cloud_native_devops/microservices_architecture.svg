  <text x="484.6091" y="106.6667" text-anchor="middle" font-size="21.0699" font-weight="bold">User Svc</text>
  <text x="484.6091" y="156.4444" text-anchor="middle" font-size="21.0699">REST API</text>
  <rect x="379.2593" y="231.1111" width="210.6996" height="160" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="484.6091" y="302.2222" text-anchor="middle" font-size="21.0699" font-weight="bold">Order Svc</text>
  <text x="484.6091" y="352" text-anchor="middle" font-size="21.0699">gRPC</text>
  <rect x="716.3786" y="35.5556" width="210.6996" height="160" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="821.7284" y="106.6667" text-anchor="middle" font-size="21.0699" font-weight="bold">Payment Svc</text>
  <text x="821.7284" y="156.4444" text-anchor="middle" font-size="21.0699">Async</text>
  <rect x="716.3786" y="231.1111" width="210.6996" height="160" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="821.7284" y="302.2222" text-anchor="middle" font-size="21.0699" font-weight="bold">Notify Svc</text>
  <text x="821.7284" y="352" text-anchor="middle" font-size="21.0699">Events</text>
  <rect x="1032.428" y="71.1111" width="210.6996" height="248.8889" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="1137.7778" y="149.3333" text-anchor="middle" font-size="21.0699" font-weight="bold">Message Bus</text>
  <text x="1137.7778" y="206.2222" text-anchor="middle" font-size="21.0699">Kafka</text>
  <text x="1137.7778" y="256" text-anchor="middle" font-size="21.0699">RabbitMQ</text>
  <line x1="273.9094" y1="142.2222" x2="379.2593" y2="113.7778" stroke="var(--text)" stroke-width="2" marker-end="url(#arr08b)" />
  <line x1="273.9094" y1="231.1111" x2="379.2593" y2="284.4444" stroke="var(--text)" stroke-width="2" marker-end="url(#arr08b)" />
  <line x1="589.9588" y1="113.7778" x2="716.3786" y2="113.7778" stroke="var(--text)" stroke-width="2" marker-end="url(#arr08b)" />
  <line x1="589.9588" y1="309.3333" x2="716.3786" y2="309.3333" stroke="var(--text)" stroke-width="2" marker-end="url(#arr08b)" />
  <line x1="927.0782" y1="142.2222" x2="1032.428" y2="160" stroke="var(--text)" stroke-width="2" marker-end="url(#arr08b)" />
  <line x1="927.0782" y1="309.3333" x2="1032.428" y2="248.8889" stroke="var(--text)" stroke-width="2" marker-end="url(#arr08b)" />
  <rect x="210.6996" y="462.2222" width="842.7983" height="177.7778" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" stroke-dasharray="8.428" />
  <text x="632.0988" y="540.4444" text-anchor="middle" font-size="23.177" font-weight="bold">Service Mesh Layer</text>
  <text x="632.0988" y="597.3333" text-anchor="middle" font-size="21.0699">Discovery - Load Balance - Circuit Break - mTLS</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <ellipse cx="640" cy="309.7465" rx="152.9412" ry="96.0165" fill="var(--info-fill)" stroke="var(--text)" stroke-width="4.2667" />
  <text x="640" y="293.5437" text-anchor="middle" font-size="28.5187" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Deploy</text>
  <text x="640" y="358.3549" text-anchor="middle" font-size="23.7656" fill="var(--bg)" font-family="Arial, sans-serif">Methods</text>
  <ellipse cx="169.4117" cy="107.2116" rx="129.4117" ry="67.2116" fill="var(--primary-fill)" stroke="var(--text)" stroke-width="4.2667" />
  <text x="169.4117" y="95.0595" text-anchor="middle" font-size="23.7656" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Blue-Green</text>
  <text x="169.4117" y="147.7185" text-anchor="middle" font-size="23.7656" font-family="Arial, sans-serif" fill="var(--text)">Instant Switch</text>
  <ellipse cx="1110.5883" cy="107.2116" rx="129.4117" ry="67.2116" fill="var(--info-fill)" stroke="var(--text)" stroke-width="4.2667" />
  <text x="1110.5883" y="95.0595" text-anchor="middle" font-size="23.7656" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Canary</text>
  <text x="1110.5883" y="147.7185" text-anchor="middle" font-size="23.7656" font-family="Arial, sans-serif" fill="var(--text)">Gradual Rollout</text>
  <ellipse cx="169.4117" cy="552.7884" rx="129.4117" ry="67.2116" fill="var(--ok-fill)" stroke="var(--text)" stroke-width="4.2667" />
  <text x="169.4117" y="540.6363" text-anchor="middle" font-size="23.7656" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Rolling</text>
  <text x="169.4117" y="593.2954" text-anchor="middle" font-size="23.7656" font-family="Arial, sans-serif" fill="var(--text)">Zero Downtime</text>
  <ellipse cx="1110.5883" cy="552.7884" rx="129.4117" ry="67.2116" fill="var(--warn-fill)" stroke="var(--text)" stroke-width="4.2667" />
  <text x="1110.5883" y="540.6363" text-anchor="middle" font-size="23.7656" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">A/B Testing</text>
  <text x="1110.5883" y="593.2954" text-anchor="middle" font-size="23.7656" font-family="Arial, sans-serif" fill="var(--text)">Feature Flags</text>
  <line x1="510.5883" y1="208.479" x2="287.0588" y2="147.7185" stroke="var(--text)" stroke-width="2" />
  <line x1="769.4117" y1="208.479" x2="992.9412" y2="147.7185" stroke="var(--text)" stroke-width="2" />
  <line x1="510.5883" y1="411.014" x2="287.0588" y2="492.028" stroke="var(--text)" stroke-width="2" />
  <line x1="769.4117" y1="411.014" x2="992.9412" y2="492.028" stroke="var(--text)" stroke-width="2" />
</svg>
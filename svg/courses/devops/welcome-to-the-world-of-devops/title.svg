<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="bg" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#212121" />
      <stop offset="100%" style="stop-color:#1a1a2e" />
    </linearGradient>
    <linearGradient id="devGrad" x1="0%" y1="0%" x2="160%" y2="0%">
      <stop offset="0%" style="stop-color:#2196f3" />
      <stop offset="100%" style="stop-color:#9b59b6" />
    </linearGradient>
  </defs>
  <rect width="1137.7778" height="640" fill="url(#bg)" rx="6"/>
  <g transform="translate(400,170)">
    <path d="M -142.2222 0 C -142.2222 -88 -56.8889 -88 0 0 C 56.8889 88 142.2222 88 142.2222 0 C 142.2222 -88 56.8889 -88 0 0 C -56.8889 88 -142.2222 88 -142.2222 0 Z" fill="none" stroke="url(#devGrad)" stroke-width="7.1111" opacity="0.8" />
    <text x="-85.3333" y="12.8" font-family="monospace" font-size="39.8222" fill="var(--primary-accent)" text-anchor="middle" opacity="0.9">&lt;/&gt;</text>
    <g transform="translate(60,0)">
      <circle cx="0" cy="0" r="19.9111" fill="none" stroke="var(--info-border)" stroke-width="3.5556" opacity="0.9" />
      <circle cx="0" cy="0" r="8.5333" fill="var(--info-fill)" opacity="0.7" />
      <rect x="-3.5556" y="-32" width="7.1111" height="12.8" rx="6" fill="var(--info-fill)" opacity="0.8" stroke="var(--info-border)" stroke-width="2"/>
      <rect x="-3.5556" y="19.2" width="7.1111" height="12.8" rx="6" fill="var(--info-fill)" opacity="0.8" stroke="var(--info-border)" stroke-width="2"/>
      <rect x="-28.4444" y="-4" width="11.3778" height="8" rx="6" fill="var(--info-fill)" opacity="0.8" stroke="var(--info-border)" stroke-width="2"/>
      <rect x="17.0667" y="-4" width="11.3778" height="8" rx="6" fill="var(--info-fill)" opacity="0.8" stroke="var(--info-border)" stroke-width="2"/>
    </g>
  </g>
  <g transform="translate(0,300)">
    <line x1="142.2222" y1="48" x2="995.5556" y2="48" stroke="var(--text)" stroke-width="2" />
    <rect x="156.4444" y="24" width="99.5556" height="48" rx="6" fill="var(--primary-fill)" opacity="0.3" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="206.2222" y="56" font-family="sans-serif" font-size="14.2222" fill="var(--primary-accent)" text-anchor="middle">Plan</text>
    <rect x="298.6667" y="24" width="99.5556" height="48" rx="6" fill="var(--primary-fill)" opacity="0.35" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="348.4444" y="56" font-family="sans-serif" font-size="14.2222" fill="var(--primary-accent)" text-anchor="middle">Code</text>
    <rect x="440.8889" y="24" width="99.5556" height="48" rx="6" fill="var(--info-fill)" opacity="0.3" stroke="var(--info-border)" stroke-width="2"/>
    <text x="490.6667" y="56" font-family="sans-serif" font-size="14.2222" fill="var(--info-accent)" text-anchor="middle">Build</text>
    <rect x="583.1111" y="24" width="99.5556" height="48" rx="6" fill="var(--info-fill)" opacity="0.35" stroke="var(--info-border)" stroke-width="2"/>
    <text x="632.8889" y="56" font-family="sans-serif" font-size="14.2222" fill="var(--info-accent)" text-anchor="middle">Test</text>
    <rect x="725.3333" y="24" width="99.5556" height="48" rx="6" fill="var(--info-fill)" opacity="0.3" stroke="var(--info-border)" stroke-width="2"/>
    <text x="775.1111" y="56" font-family="sans-serif" font-size="14.2222" fill="var(--info-accent)" text-anchor="middle">Deploy</text>
    <rect x="867.5556" y="24" width="99.5556" height="48" rx="6" fill="var(--info-fill)" opacity="0.35" stroke="var(--info-border)" stroke-width="2"/>
    <text x="917.3333" y="56" font-family="sans-serif" font-size="14.2222" fill="var(--info-accent)" text-anchor="middle">Monitor</text>
    <polygon points="267.3778,44.8 277.3333,48 267.3778,51.2" fill="var(--primary-fill)" opacity="0.5" />
    <polygon points="409.6,44.8 419.5556,48 409.6,51.2" fill="var(--primary-fill)" opacity="0.5" />
    <polygon points="551.8222,44.8 561.7778,48 551.8222,51.2" fill="var(--info-fill)" opacity="0.5" />
    <polygon points="694.0444,44.8 704,48 694.0444,51.2" fill="var(--info-fill)" opacity="0.5" />
    <polygon points="836.2667,44.8 846.2222,48 836.2667,51.2" fill="var(--info-fill)" opacity="0.5" />
  </g>
  <g opacity="0.3">
    <circle cx="213.3333" cy="160" r="14.2222" fill="var(--primary-fill)" />
    <ellipse cx="213.3333" cy="200" rx="19.9111" ry="14.2222" fill="var(--primary-fill)" />
    <circle cx="924.4444" cy="160" r="14.2222" fill="var(--info-fill)" />
    <ellipse cx="924.4444" cy="200" rx="19.9111" ry="14.2222" fill="var(--info-fill)" />
    <line x1="241.7778" y1="176" x2="896" y2="176" stroke="var(--text)" stroke-width="1.4222" stroke-dasharray="7.1111 7.1111" />
  </g>
  <circle cx="85.3333" cy="80" r="2.8444" fill="var(--primary-fill)" opacity="0.3" />
  <circle cx="1052.4444" cy="88" r="4.2667" fill="var(--info-fill)" opacity="0.25" />
  <circle cx="113.7778" cy="592" r="2.8444" fill="var(--primary-fill)" opacity="0.25" />
  <circle cx="1024" cy="600" r="2.8444" fill="var(--info-fill)" opacity="0.3" />
  <rect x="426.6667" y="608" width="284.4444" height="4.8" rx="6" fill="url(#devGrad)" opacity="0.4" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="bg" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#212121" />
      <stop offset="100%" style="stop-color:#1a1a2e" />
    </linearGradient>
    <linearGradient id="devGrad" x1="0%" y1="0%" x2="160%" y2="0%">
      <stop offset="0%" style="stop-color:#2196f3" />
      <stop offset="100%" style="stop-color:#9b59b6" />
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="url(#bg)" rx="6" x="40" y="40"/>
  <g transform="translate(400,170)">
    <path d="M -110 40 C -110 -39.75 -20 -39.75 40 40 C 100.0001 119.75 190 119.75 190 40 C 190 -39.75 100.0001 -39.75 40 40 C -20 119.75 -110 119.75 -110 40 Z" fill="none" stroke="url(#devGrad)" stroke-width="7.1111" opacity="0.8" />
    <text x="-50" y="51.6" font-size="38.9324" fill="var(--primary-accent)" text-anchor="middle" opacity="0.9" font-family="Courier New, monospace">&lt;/&gt;</text>
    <g transform="translate(60,0)">
      <circle cx="40" cy="40" r="19.4663" fill="none" stroke="var(--info-border)" stroke-width="3.5556" opacity="0.9" />
      <circle cx="40" cy="40" r="8.3426" fill="var(--info-fill)" opacity="0.7" />
      <rect x="36.2499" y="11" width="7.5" height="11.6" rx="6" fill="url(#grad-info)" opacity="0.8" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
      <rect x="36.2499" y="57.4" width="7.5" height="11.6" rx="6" fill="url(#grad-info)" opacity="0.8" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
      <rect x="10.0001" y="36.375" width="12" height="7.25" rx="6" fill="url(#grad-info)" opacity="0.8" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
      <rect x="58" y="36.375" width="12" height="7.25" rx="6" fill="url(#grad-info)" opacity="0.8" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
    </g>
  </g>
  <g transform="translate(0,300)">
    <line x1="190" y1="83.4999" x2="1090" y2="83.4999" stroke="var(--text)" stroke-width="2" />
    <rect x="204.9999" y="61.75" width="105.0001" height="43.5" rx="6" fill="url(#grad-primary)" opacity="0.3" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="257.5" y="90.75" font-size="13.9044" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">Plan</text>
    <rect x="355" y="61.75" width="105.0001" height="43.5" rx="6" fill="url(#grad-primary)" opacity="0.35" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="407.4999" y="90.75" font-size="13.9044" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">Code</text>
    <rect x="505.0001" y="61.75" width="105.0001" height="43.5" rx="6" fill="url(#grad-info)" opacity="0.3" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="557.5" y="90.75" font-size="13.9044" fill="var(--info-accent)" text-anchor="middle" font-family="Arial, sans-serif">Build</text>
    <rect x="655" y="61.75" width="105.0001" height="43.5" rx="6" fill="url(#grad-info)" opacity="0.35" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="707.5001" y="90.75" font-size="13.9044" fill="var(--info-accent)" text-anchor="middle" font-family="Arial, sans-serif">Test</text>
    <rect x="805" y="61.75" width="105.0001" height="43.5" rx="6" fill="url(#grad-info)" opacity="0.3" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="857.5" y="90.75" font-size="13.9044" fill="var(--info-accent)" text-anchor="middle" font-family="Arial, sans-serif">Deploy</text>
    <rect x="955" y="61.75" width="105.0001" height="43.5" rx="6" fill="url(#grad-info)" opacity="0.35" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="1007.5" y="90.75" font-size="13.9044" fill="var(--info-accent)" text-anchor="middle" font-family="Arial, sans-serif">Monitor</text>
    <polygon points="322,80.6 332.5,83.4999 322,86.4" fill="var(--primary-fill)" opacity="0.5" />
    <polygon points="472,80.6 482.5001,83.4999 472,86.4" fill="var(--primary-fill)" opacity="0.5" />
    <polygon points="621.9999,80.6 632.5,83.4999 621.9999,86.4" fill="var(--info-fill)" opacity="0.5" />
    <polygon points="771.9999,80.6 782.5,83.4999 771.9999,86.4" fill="var(--info-fill)" opacity="0.5" />
    <polygon points="922,80.6 932.4999,83.4999 922,86.4" fill="var(--info-fill)" opacity="0.5" />
  </g>
  <g opacity="0.3">
    <circle cx="265" cy="185" r="13.9044" fill="var(--primary-fill)" />
    <ellipse cx="265" cy="221.2499" rx="21" ry="12.8889" fill="var(--primary-fill)" />
    <circle cx="1014.9999" cy="185" r="13.9044" fill="var(--info-fill)" />
    <ellipse cx="1014.9999" cy="221.2499" rx="21" ry="12.8889" fill="var(--info-fill)" />
    <line x1="295" y1="199.5" x2="985" y2="199.5" stroke="var(--text)" stroke-width="1.4222" stroke-dasharray="7.1111 7.1111" />
  </g>
  <circle cx="130" cy="112.5" r="2.7808" fill="var(--primary-fill)" opacity="0.3" />
  <circle cx="1149.9999" cy="119.75" r="4.1713" fill="var(--info-fill)" opacity="0.25" />
  <circle cx="160" cy="576.5" r="2.7808" fill="var(--primary-fill)" opacity="0.25" />
  <circle cx="1120" cy="583.75" r="2.7808" fill="var(--info-fill)" opacity="0.3" />
  <rect x="490" y="591" width="299.9999" height="4.35" rx="6" fill="url(#devGrad)" opacity="0.4" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="bg" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#212121" />
      <stop offset="100%" style="stop-color:#1a1a2e" />
    </linearGradient>
    <linearGradient id="devGrad" x1="0%" y1="0%" x2="160%" y2="0%">
      <stop offset="0%" style="stop-color:#2196f3" />
      <stop offset="100%" style="stop-color:#9b59b6" />
    </linearGradient>
  </defs>
  <rect width="1066.6667" height="509.8901" fill="url(#bg)" rx="6" x="173.3333" y="110.1099"/>
  <g transform="translate(400,170)">
    <path d="M 40 110.1099 C 40 40 120 40 173.3333 110.1099 C 226.6667 180.2198 306.6666 180.2198 306.6666 110.1099 C 306.6666 40 226.6667 40 173.3333 110.1099 C 120 180.2198 40 180.2198 40 110.1099 Z" fill="none" stroke="url(#devGrad)" stroke-width="7.1111" opacity="0.8" />
    <text x="93.3333" y="120.3077" font-family="monospace" font-size="34.4159" fill="var(--primary-accent)" text-anchor="middle" opacity="0.9">&lt;/&gt;</text>
    <g transform="translate(60,0)">
      <circle cx="173.3333" cy="110.1099" r="17.208" fill="none" stroke="var(--info-border)" stroke-width="3.5556" opacity="0.9" />
      <circle cx="173.3333" cy="110.1099" r="7.3748" fill="var(--info-fill)" opacity="0.7" />
      <rect x="169.9999" y="84.6154" width="6.6667" height="10.1978" rx="6" fill="var(--info-fill)" opacity="0.8" stroke="var(--info-border)" stroke-width="2"/>
      <rect x="169.9999" y="125.4066" width="6.6667" height="10.1978" rx="6" fill="var(--info-fill)" opacity="0.8" stroke="var(--info-border)" stroke-width="2"/>
      <rect x="146.6667" y="106.9231" width="10.6667" height="6.3736" rx="6" fill="var(--info-fill)" opacity="0.8" stroke="var(--info-border)" stroke-width="2"/>
      <rect x="189.3333" y="106.9231" width="10.6667" height="6.3736" rx="6" fill="var(--info-fill)" opacity="0.8" stroke="var(--info-border)" stroke-width="2"/>
    </g>
  </g>
  <g transform="translate(0,300)">
    <line x1="306.6666" y1="148.3516" x2="1106.6667" y2="148.3516" stroke="var(--text)" stroke-width="2" />
    <rect x="319.9999" y="129.2308" width="93.3334" height="38.2418" rx="6" fill="var(--primary-fill)" opacity="0.3" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="366.6666" y="154.7253" font-family="sans-serif" font-size="12.2914" fill="var(--primary-accent)" text-anchor="middle">Plan</text>
    <rect x="453.3333" y="129.2308" width="93.3334" height="38.2418" rx="6" fill="var(--primary-fill)" opacity="0.35" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="499.9999" y="154.7253" font-family="sans-serif" font-size="12.2914" fill="var(--primary-accent)" text-anchor="middle">Code</text>
    <rect x="586.6667" y="129.2308" width="93.3334" height="38.2418" rx="6" fill="var(--info-fill)" opacity="0.3" stroke="var(--info-border)" stroke-width="2"/>
    <text x="633.3333" y="154.7253" font-family="sans-serif" font-size="12.2914" fill="var(--info-accent)" text-anchor="middle">Build</text>
    <rect x="720" y="129.2308" width="93.3334" height="38.2418" rx="6" fill="var(--info-fill)" opacity="0.35" stroke="var(--info-border)" stroke-width="2"/>
    <text x="766.6667" y="154.7253" font-family="sans-serif" font-size="12.2914" fill="var(--info-accent)" text-anchor="middle">Test</text>
    <rect x="853.3333" y="129.2308" width="93.3334" height="38.2418" rx="6" fill="var(--info-fill)" opacity="0.3" stroke="var(--info-border)" stroke-width="2"/>
    <text x="900" y="154.7253" font-family="sans-serif" font-size="12.2914" fill="var(--info-accent)" text-anchor="middle">Deploy</text>
    <rect x="986.6667" y="129.2308" width="93.3334" height="38.2418" rx="6" fill="var(--info-fill)" opacity="0.35" stroke="var(--info-border)" stroke-width="2"/>
    <text x="1033.3333" y="154.7253" font-family="sans-serif" font-size="12.2914" fill="var(--info-accent)" text-anchor="middle">Monitor</text>
    <polygon points="424,145.8022 433.3333,148.3516 424,150.9011" fill="var(--primary-fill)" opacity="0.5" />
    <polygon points="557.3333,145.8022 566.6667,148.3516 557.3333,150.9011" fill="var(--primary-fill)" opacity="0.5" />
    <polygon points="690.6666,145.8022 700,148.3516 690.6666,150.9011" fill="var(--info-fill)" opacity="0.5" />
    <polygon points="823.9999,145.8022 833.3333,148.3516 823.9999,150.9011" fill="var(--info-fill)" opacity="0.5" />
    <polygon points="957.3333,145.8022 966.6666,148.3516 957.3333,150.9011" fill="var(--info-fill)" opacity="0.5" />
  </g>
  <g opacity="0.3">
    <circle cx="373.3333" cy="237.5824" r="12.2914" fill="var(--primary-fill)" />
    <ellipse cx="373.3333" cy="269.4505" rx="18.6667" ry="11.3309" fill="var(--primary-fill)" />
    <circle cx="1039.9999" cy="237.5824" r="12.2914" fill="var(--info-fill)" />
    <ellipse cx="1039.9999" cy="269.4505" rx="18.6667" ry="11.3309" fill="var(--info-fill)" />
    <line x1="400" y1="250.3297" x2="1013.3333" y2="250.3297" stroke="var(--text)" stroke-width="1.4222" stroke-dasharray="7.1111 7.1111" />
  </g>
  <circle cx="253.3333" cy="173.8462" r="2.4582" fill="var(--primary-fill)" opacity="0.3" />
  <circle cx="1159.9999" cy="180.2198" r="3.6874" fill="var(--info-fill)" opacity="0.25" />
  <circle cx="280" cy="581.7582" r="2.4582" fill="var(--primary-fill)" opacity="0.25" />
  <circle cx="1133.3333" cy="588.1319" r="2.4582" fill="var(--info-fill)" opacity="0.3" />
  <rect x="573.3333" y="594.5055" width="266.6666" height="3.8242" rx="6" fill="url(#devGrad)" opacity="0.4" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.378891504872" font-weight="bold" fill="var(--text)">CALMS Framework</text>

  <rect x="40" y="87.889908256881" width="227.586206896552" height="255.412844036697" rx="10.49246125174" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="153.793103448276" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="37.772860506264" font-weight="bold" fill="var(--primary-text)">C</text>
  <text x="153.793103448276" y="162.385321100917" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.787938002784" font-weight="bold" fill="var(--primary-text)">Culture</text>
  <text x="60.689655172414" y="204.954128440367" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--primary-text)">Shared ownership</text>
  <text x="60.689655172414" y="231.559633027523" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--primary-text)">Blameless</text>
  <text x="60.689655172414" y="258.165137614679" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--primary-text)">Trust</text>

  <rect x="288.275862068966" y="87.889908256881" width="227.586206896552" height="255.412844036697" rx="10.49246125174" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="402.068965517241" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="37.772860506264" font-weight="bold" fill="var(--ok-text)">A</text>
  <text x="402.068965517241" y="162.385321100917" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.787938002784" font-weight="bold" fill="var(--ok-text)">Automation</text>
  <text x="308.965517241379" y="204.954128440367" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">CI/CD pipelines</text>
  <text x="308.965517241379" y="231.559633027523" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">IaC</text>
  <text x="308.965517241379" y="258.165137614679" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">Tests, deploys</text>

  <rect x="536.551724137931" y="87.889908256881" width="227.586206896552" height="255.412844036697" rx="10.49246125174" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="650.344827586207" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="37.772860506264" font-weight="bold" fill="var(--warn-text)">L</text>
  <text x="650.344827586207" y="162.385321100917" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.787938002784" font-weight="bold" fill="var(--warn-text)">Lean</text>
  <text x="557.241379310345" y="204.954128440367" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">Small batches</text>
  <text x="557.241379310345" y="231.559633027523" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">Reduce waste</text>
  <text x="557.241379310345" y="258.165137614679" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">Fast feedback</text>

  <rect x="784.827586206897" y="87.889908256881" width="227.586206896552" height="255.412844036697" rx="10.49246125174" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="898.620689655172" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="37.772860506264" font-weight="bold" fill="var(--info-text)">M</text>
  <text x="898.620689655172" y="162.385321100917" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.787938002784" font-weight="bold" fill="var(--info-text)">Measurement</text>
  <text x="805.51724137931" y="204.954128440367" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--info-text)">DORA metrics</text>
  <text x="805.51724137931" y="231.559633027523" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--info-text)">SLOs / SLIs</text>
  <text x="805.51724137931" y="258.165137614679" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--info-text)">Telemetry</text>

  <rect x="1033.103448275862" y="87.889908256881" width="206.896551724138" height="255.412844036697" rx="10.49246125174" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1136.551724137931" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="37.772860506264" font-weight="bold" fill="var(--danger-text)">S</text>
  <text x="1136.551724137931" y="162.385321100917" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.787938002784" font-weight="bold" fill="var(--danger-text)">Sharing</text>
  <text x="1053.793103448276" y="204.954128440367" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--danger-text)">Knowledge</text>
  <text x="1053.793103448276" y="231.559633027523" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--danger-text)">Tooling</text>
  <text x="1053.793103448276" y="258.165137614679" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--danger-text)">Wins / fails</text>

  <rect x="40" y="385.871559633028" width="1200" height="234.128440366972" rx="10.49246125174" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="423.119266055046" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.886430253132" font-weight="bold" fill="var(--text)">DORA metrics</text>
  <text x="60.689655172414" y="460.366972477064" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text)">Deployment frequency, lead time, MTTR, change failure rate</text>
  <text x="60.689655172414" y="502.935779816514" font-family="Arial, sans-serif" font-size="14.689445752436" font-weight="bold" fill="var(--text)">Elite teams: deploy multiple times daily, recover in &lt;1 hour</text>
  <text x="60.689655172414" y="540.183486238532" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text-muted)">Low teams: deploy monthly, recover in &gt;1 week</text>
  <text x="60.689655172414" y="582.752293577982" font-family="Arial, sans-serif" font-size="13.640199627262" font-style="italic" fill="var(--text-muted)">Accelerate (Forsgren) is the data-backed source</text>
</svg>

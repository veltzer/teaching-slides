<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="42.6667" y="108" width="320" height="198" fill="#ffebee" stroke="#b71c1c" stroke-width="4.2667" rx="10.6667" />
  <text x="202.6667" y="172.8" text-anchor="middle" font-size="21.3333" font-weight="bold">Functional Silos</text>
  <text x="202.6667" y="223.2" text-anchor="middle" font-size="21.3333">Dev | QA | Ops</text>
  <text x="202.6667" y="273.6" text-anchor="middle" font-size="21.3333">Separate goals</text>
  <rect x="480" y="108" width="320" height="198" fill="#fff3e0" stroke="#e65100" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="172.8" text-anchor="middle" font-size="21.3333" font-weight="bold">Cross-functional</text>
  <text x="640" y="223.2" text-anchor="middle" font-size="21.3333">Shared ownership</text>
  <text x="640" y="273.6" text-anchor="middle" font-size="21.3333">Mixed skills</text>
  <rect x="917.3333" y="108" width="320" height="198" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4.2667" rx="10.6667" />
  <text x="1077.3333" y="172.8" text-anchor="middle" font-size="21.3333" font-weight="bold">Platform Teams</text>
  <text x="1077.3333" y="223.2" text-anchor="middle" font-size="21.3333">Self-service infra</text>
  <text x="1077.3333" y="273.6" text-anchor="middle" font-size="21.3333">Dev autonomy</text>
  <line x1="362.6667" y1="205.2" x2="480" y2="205.2" stroke="#333" stroke-width="4.2667" marker-end="url(#arr_team)" />
  <line x1="800" y1="205.2" x2="917.3333" y2="205.2" stroke="#333" stroke-width="4.2667" marker-end="url(#arr_team)" />
  <text x="640" y="432" text-anchor="middle" font-size="21.3333" fill="#555">Evolution toward autonomous, empowered teams</text>
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>

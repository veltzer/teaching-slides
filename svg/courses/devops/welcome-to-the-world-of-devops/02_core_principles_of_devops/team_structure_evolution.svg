<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="380" height="480" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--danger-text)">Functional Silos</text>
  <text x="230" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--danger-text)">Dev | QA | Ops</text>
  <text x="230" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--danger-text)">Separate goals</text>
  <text x="230" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--danger-text)">Handoff tickets</text>
  <text x="230" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--danger-text)">Blame loops</text>
  <text x="230" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--danger-text)">Slow releases</text>

  <rect x="450" y="40" width="380" height="480" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--warn-text)">Cross-functional</text>
  <text x="640" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--warn-text)">Shared ownership</text>
  <text x="640" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--warn-text)">Mixed skills</text>
  <text x="640" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--warn-text)">You build it,</text>
  <text x="640" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--warn-text)">you run it</text>
  <text x="640" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--warn-text)">Faster feedback</text>

  <rect x="860" y="40" width="380" height="480" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--ok-text)">Platform Teams</text>
  <text x="1050" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--ok-text)">Self-service infra</text>
  <text x="1050" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--ok-text)">Paved roads</text>
  <text x="1050" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--ok-text)">Dev autonomy</text>
  <text x="1050" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--ok-text)">Internal products</text>
  <text x="1050" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--ok-text)">Scales with org</text>

  <line x1="420" y1="280" x2="450" y2="280" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="830" y1="280" x2="860" y2="280" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="550" width="1200" height="70" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--text)">Evolution toward autonomous, empowered teams</text>
</svg>

  <rect x="525.3047" y="225.1613" width="229.3907" height="161.2903" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="8.7814" />
  <text x="639.9999" y="321.9356" text-anchor="middle" font-size="19.1159">Deploy</text>
  <rect x="888.5066" y="225.1613" width="229.3907" height="161.2903" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="8.7814" />
  <text x="1003.2018" y="321.9356" text-anchor="middle" font-size="19.1159">Operate</text>
  <line x1="391.4934" y1="305.8065" x2="525.3047" y2="305.8065" stroke="var(--text)" stroke-width="2" marker-end="url(#arr_fb)" />
  <line x1="754.6953" y1="305.8065" x2="888.5066" y2="305.8065" stroke="var(--text)" stroke-width="2" marker-end="url(#arr_fb)" />
  <path d="M 1003.2018 225.1613 Q 1003.2018 96.1292 639.9999 96.1292 Q 276.7982 96.1292 276.7982 225.1613" stroke="var(--primary-border)" stroke-width="2.6123" fill="none" stroke-dasharray="6.5306" marker-end="url(#arr_fb2)" />
  <text x="639.9999" y="80" text-anchor="middle" font-size="19.1159" fill="var(--primary-accent)">Feedback: metrics, alerts, user data</text>
  <path d="M 1003.2018 386.4516 Q 1003.2018 515.4839 639.9999 515.4839 Q 276.7982 515.4839 276.7982 386.4516" stroke="var(--ok-border)" stroke-width="2.6123" fill="none" stroke-dasharray="6.5306" marker-end="url(#arr_fb2)" />
  <text x="639.9999" y="580" text-anchor="middle" font-size="19.1159" fill="var(--ok-accent)">Feedback: incidents, logs, performance</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="177.7778" height="181.249959151784" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.262131180487" filter="url(#shadow)"/>
  <text x="128.8889" y="153.928505293365" text-anchor="middle" font-size="26.114130711159" font-family="Arial, sans-serif" fill="var(--primary-text)">Build</text>
  <rect x="262.2222" y="40" width="177.7778" height="181.249959151784" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.262131180487" filter="url(#shadow)"/>
  <text x="351.1111" y="153.928505293365" text-anchor="middle" font-size="26.114130711159" font-family="Arial, sans-serif" fill="var(--info-text)">Test</text>
  <rect x="484.4445" y="40" width="177.7778" height="181.249959151784" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.262131180487" filter="url(#shadow)"/>
  <text x="573.3333" y="153.928505293365" text-anchor="middle" font-size="26.114130711159" font-family="Arial, sans-serif" fill="var(--ok-text)">Staging</text>
  <rect x="751.1111" y="40" width="222.2222" height="181.249959151784" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.262131180487" stroke-dasharray="8.5333" filter="url(#shadow)"/>
  <text x="862.2222" y="122.857173979593" text-anchor="middle" font-size="26.114130711159" font-family="Arial, sans-serif" fill="var(--warn-text)">Manual</text>
  <text x="862.2222" y="184.999945535713" text-anchor="middle" font-size="26.114130711159" font-family="Arial, sans-serif" fill="var(--warn-text)">Approval</text>
  <rect x="1040" y="40" width="200" height="181.249959151784" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.262131180487" filter="url(#shadow)"/>
  <text x="1140" y="153.928505293365" text-anchor="middle" font-size="26.114130711159" font-family="Arial, sans-serif" fill="var(--ok-text)">Production</text>
  <text x="640" y="386.96430711097" text-anchor="middle" font-size="28.725648151128" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Continuous Deployment</text>
  <rect x="40" y="438.750040848216" width="177.7778" height="181.249959151784" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.262131180487" filter="url(#shadow)"/>
  <text x="128.8889" y="552.678546141581" text-anchor="middle" font-size="26.114130711159" font-family="Arial, sans-serif" fill="var(--primary-text)">Build</text>
  <rect x="306.6667" y="438.750040848216" width="177.7778" height="181.249959151784" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.262131180487" filter="url(#shadow)"/>
  <text x="395.5555" y="552.678546141581" text-anchor="middle" font-size="26.114130711159" font-family="Arial, sans-serif" fill="var(--info-text)">Test</text>
  <rect x="573.3333" y="438.750040848216" width="177.7778" height="181.249959151784" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.262131180487" filter="url(#shadow)"/>
  <text x="662.2222" y="552.678546141581" text-anchor="middle" font-size="26.114130711159" font-family="Arial, sans-serif" fill="var(--ok-text)">Staging</text>
  <rect x="884.4445" y="438.750040848216" width="200" height="181.249959151784" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.262131180487" filter="url(#shadow)"/>
  <text x="984.4445" y="552.678546141581" text-anchor="middle" font-size="26.114130711159" font-family="Arial, sans-serif" fill="var(--ok-text)">Production</text>
  <text x="1128.8889" y="552.678546141581" text-anchor="middle" font-size="26.114130711159" fill="var(--ok-accent)" font-family="Arial, sans-serif">Auto!</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="634.6902" y="40" text-anchor="middle" font-size="30.9132" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">DORA Metrics (Four Keys)</text>
  <rect x="40" y="119.0909" width="276.1062" height="316.3636" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="178.053" y="224.5455" text-anchor="middle" font-size="25.7609" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Deploy Freq</text>
  <text x="178.053" y="314.1818" text-anchor="middle" font-size="25.7609" font-family="Arial, sans-serif" fill="var(--primary-text)">How often you</text>
  <text x="178.053" y="377.4545" text-anchor="middle" font-size="25.7609" font-family="Arial, sans-serif" fill="var(--primary-text)">release to prod</text>
  <rect x="347.9646" y="119.0909" width="276.1062" height="316.3636" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="486.0177" y="224.5455" text-anchor="middle" font-size="25.7609" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Lead Time</text>
  <text x="486.0177" y="314.1818" text-anchor="middle" font-size="25.7609" font-family="Arial, sans-serif" fill="var(--info-text)">Commit to prod</text>
  <text x="486.0177" y="377.4545" text-anchor="middle" font-size="25.7609" font-family="Arial, sans-serif" fill="var(--info-text)">deployment time</text>
  <rect x="655.9292" y="119.0909" width="276.1062" height="316.3636" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="793.9823" y="224.5455" text-anchor="middle" font-size="25.7609" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">MTTR</text>
  <text x="793.9823" y="314.1818" text-anchor="middle" font-size="25.7609" font-family="Arial, sans-serif" fill="var(--warn-text)">Mean time to</text>
  <text x="793.9823" y="377.4545" text-anchor="middle" font-size="25.7609" font-family="Arial, sans-serif" fill="var(--warn-text)">restore service</text>
  <rect x="963.8938" y="119.0909" width="276.1062" height="316.3636" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1101.9469" y="224.5455" text-anchor="middle" font-size="25.7609" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Failure Rate</text>
  <text x="1101.9469" y="314.1818" text-anchor="middle" font-size="25.7609" font-family="Arial, sans-serif" fill="var(--danger-text)">% of deploys</text>
  <text x="1101.9469" y="377.4545" text-anchor="middle" font-size="25.7609" font-family="Arial, sans-serif" fill="var(--danger-text)">causing failure</text>
  <text x="634.6902" y="620" text-anchor="middle" font-size="25.7609" fill="var(--text-muted)" font-family="Arial, sans-serif">Elite teams: multiple deploys/day, &lt;1h lead time, &lt;1h MTTR, &lt;5% failure</text>
</svg>

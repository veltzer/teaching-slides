<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <text x="640" y="72" text-anchor="middle" font-size="25.6" font-weight="bold">DORA Metrics (Four Keys)</text>
  <rect x="42.6667" y="126" width="277.3333" height="216" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="181.3333" y="198" text-anchor="middle" font-size="21.3333" font-weight="bold">Deploy Freq</text>
  <text x="181.3333" y="259.2" text-anchor="middle" font-size="21.3333">How often you</text>
  <text x="181.3333" y="302.4" text-anchor="middle" font-size="21.3333">release to prod</text>
  <rect x="352" y="126" width="277.3333" height="216" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="490.6667" y="198" text-anchor="middle" font-size="21.3333" font-weight="bold">Lead Time</text>
  <text x="490.6667" y="259.2" text-anchor="middle" font-size="21.3333">Commit to prod</text>
  <text x="490.6667" y="302.4" text-anchor="middle" font-size="21.3333">deployment time</text>
  <rect x="661.3333" y="126" width="277.3333" height="216" fill="#fff3e0" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="800" y="198" text-anchor="middle" font-size="21.3333" font-weight="bold">MTTR</text>
  <text x="800" y="259.2" text-anchor="middle" font-size="21.3333">Mean time to</text>
  <text x="800" y="302.4" text-anchor="middle" font-size="21.3333">restore service</text>
  <rect x="970.6667" y="126" width="277.3333" height="216" fill="#ffebee" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1109.3333" y="198" text-anchor="middle" font-size="21.3333" font-weight="bold">Failure Rate</text>
  <text x="1109.3333" y="259.2" text-anchor="middle" font-size="21.3333">% of deploys</text>
  <text x="1109.3333" y="302.4" text-anchor="middle" font-size="21.3333">causing failure</text>
  <text x="640" y="468" text-anchor="middle" font-size="21.3333" fill="#555">Elite teams: multiple deploys/day, &lt;1h lead time, &lt;1h MTTR, &lt;5% failure</text>
</svg>
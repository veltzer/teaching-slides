<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Three pillars: Culture, Process, Tools -->
  <rect x="40" y="40" width="370.909091" height="401.538462" rx="13.236948" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="4" opacity="0.85" filter="url(#shadow)"/>
  <text x="225.454545" y="118.076923" text-anchor="middle" font-size="46.329317" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Culture</text>
  <rect x="72.727273" y="162.692308" width="305.454545" height="78.076923" rx="8.824632" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="225.454545" y="212.884615" text-anchor="middle" font-size="30.886211" fill="var(--text)" font-family="Arial, sans-serif">Collaboration</text>
  <rect x="72.727273" y="274.230769" width="305.454545" height="78.076923" rx="8.824632" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="225.454545" y="324.423077" text-anchor="middle" font-size="30.886211" fill="var(--text)" font-family="Arial, sans-serif">Trust</text>
  <rect x="72.727273" y="363.461538" width="305.454545" height="66.923077" rx="8.824632" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="225.454545" y="408.076923" text-anchor="middle" font-size="26.473895" fill="var(--text-muted)" font-family="Arial, sans-serif">Shared ownership</text>

  <rect x="454.545455" y="40" width="370.909091" height="401.538462" rx="13.236948" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="4" opacity="0.85" filter="url(#shadow)"/>
  <text x="640" y="118.076923" text-anchor="middle" font-size="46.329317" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Process</text>
  <rect x="487.272727" y="162.692308" width="305.454545" height="78.076923" rx="8.824632" fill="var(--bg)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="212.884615" text-anchor="middle" font-size="30.886211" fill="var(--text)" font-family="Arial, sans-serif">CI / CD</text>
  <rect x="487.272727" y="274.230769" width="305.454545" height="78.076923" rx="8.824632" fill="var(--bg)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="324.423077" text-anchor="middle" font-size="30.886211" fill="var(--text)" font-family="Arial, sans-serif">Agile</text>
  <rect x="487.272727" y="363.461538" width="305.454545" height="66.923077" rx="8.824632" fill="var(--bg)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="408.076923" text-anchor="middle" font-size="26.473895" fill="var(--text-muted)" font-family="Arial, sans-serif">Feedback loops</text>

  <rect x="869.090909" y="40" width="370.909091" height="401.538462" rx="13.236948" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="4" opacity="0.85" filter="url(#shadow)"/>
  <text x="1054.545455" y="118.076923" text-anchor="middle" font-size="46.329317" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Tools</text>
  <rect x="901.818182" y="162.692308" width="305.454545" height="78.076923" rx="8.824632" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1054.545455" y="212.884615" text-anchor="middle" font-size="30.886211" fill="var(--text)" font-family="Arial, sans-serif">Automation</text>
  <rect x="901.818182" y="274.230769" width="305.454545" height="78.076923" rx="8.824632" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1054.545455" y="324.423077" text-anchor="middle" font-size="30.886211" fill="var(--text)" font-family="Arial, sans-serif">Platforms</text>
  <rect x="901.818182" y="363.461538" width="305.454545" height="66.923077" rx="8.824632" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1054.545455" y="408.076923" text-anchor="middle" font-size="26.473895" fill="var(--text-muted)" font-family="Arial, sans-serif">Monitoring</text>

  <!-- Converging arrows -->
  <line x1="225.454545" y1="452.692308" x2="530.909091" y2="530.769231" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="640" y1="452.692308" x2="640" y2="530.769231" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1054.545455" y1="452.692308" x2="749.090909" y2="530.769231" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- DevOps synthesis box -->
  <rect x="400" y="541.923077" width="480" height="78.076923" rx="13.236948" fill="var(--info-accent)" stroke="var(--black)" stroke-width="3"/>
  <text x="640" y="597.692308" text-anchor="middle" font-size="41.917001" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">DevOps</text>
</svg>

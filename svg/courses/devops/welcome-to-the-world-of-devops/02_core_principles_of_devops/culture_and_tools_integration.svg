<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow-down" markerWidth="12" markerHeight="12" refX="6" refY="10" orient="auto">
      <path d="M2,2 L6,10 L10,2 Z" fill="#555555"/>
    </marker>
  </defs>

  <!-- Three pillars: Culture, Process, Tools -->
  <rect x="40" y="40" width="370.909091" height="401.538462" rx="13.236948" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="4" opacity="0.85" filter="url(#shadow)"/>
  <text x="225.454545" y="118.076923" text-anchor="middle" font-size="46.329317" font-weight="bold" fill="var(--primary-text)">Culture</text>
  <rect x="72.727273" y="162.692308" width="305.454545" height="78.076923" rx="8.824632" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="225.454545" y="212.884615" text-anchor="middle" font-size="30.886211" fill="var(--text)">Collaboration</text>
  <rect x="72.727273" y="274.230769" width="305.454545" height="78.076923" rx="8.824632" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="225.454545" y="324.423077" text-anchor="middle" font-size="30.886211" fill="var(--text)">Trust</text>
  <rect x="72.727273" y="363.461538" width="305.454545" height="66.923077" rx="8.824632" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="225.454545" y="408.076923" text-anchor="middle" font-size="26.473895" fill="var(--text-muted)">Shared ownership</text>

  <rect x="454.545455" y="40" width="370.909091" height="401.538462" rx="13.236948" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="4" opacity="0.85" filter="url(#shadow)"/>
  <text x="640" y="118.076923" text-anchor="middle" font-size="46.329317" font-weight="bold" fill="var(--info-text)">Process</text>
  <rect x="487.272727" y="162.692308" width="305.454545" height="78.076923" rx="8.824632" fill="var(--bg)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="212.884615" text-anchor="middle" font-size="30.886211" fill="var(--text)">CI / CD</text>
  <rect x="487.272727" y="274.230769" width="305.454545" height="78.076923" rx="8.824632" fill="var(--bg)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="324.423077" text-anchor="middle" font-size="30.886211" fill="var(--text)">Agile</text>
  <rect x="487.272727" y="363.461538" width="305.454545" height="66.923077" rx="8.824632" fill="var(--bg)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="408.076923" text-anchor="middle" font-size="26.473895" fill="var(--text-muted)">Feedback loops</text>

  <rect x="869.090909" y="40" width="370.909091" height="401.538462" rx="13.236948" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="4" opacity="0.85" filter="url(#shadow)"/>
  <text x="1054.545455" y="118.076923" text-anchor="middle" font-size="46.329317" font-weight="bold" fill="var(--ok-text)">Tools</text>
  <rect x="901.818182" y="162.692308" width="305.454545" height="78.076923" rx="8.824632" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1054.545455" y="212.884615" text-anchor="middle" font-size="30.886211" fill="var(--text)">Automation</text>
  <rect x="901.818182" y="274.230769" width="305.454545" height="78.076923" rx="8.824632" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1054.545455" y="324.423077" text-anchor="middle" font-size="30.886211" fill="var(--text)">Platforms</text>
  <rect x="901.818182" y="363.461538" width="305.454545" height="66.923077" rx="8.824632" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1054.545455" y="408.076923" text-anchor="middle" font-size="26.473895" fill="var(--text-muted)">Monitoring</text>

  <!-- Converging arrows -->
  <line x1="225.454545" y1="452.692308" x2="530.909091" y2="530.769231" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow-down)"/>
  <line x1="640" y1="452.692308" x2="640" y2="530.769231" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow-down)"/>
  <line x1="1054.545455" y1="452.692308" x2="749.090909" y2="530.769231" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow-down)"/>

  <!-- DevOps synthesis box -->
  <rect x="400" y="541.923077" width="480" height="78.076923" rx="13.236948" fill="var(--info-accent)" stroke="var(--black)" stroke-width="3"/>
  <text x="640" y="597.692308" text-anchor="middle" font-size="41.917001" font-weight="bold" fill="var(--bg)">DevOps</text>
</svg>

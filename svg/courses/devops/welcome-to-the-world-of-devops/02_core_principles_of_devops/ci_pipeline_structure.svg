<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="21.3333" y="216" width="192" height="144" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="117.3333" y="306" text-anchor="middle" font-size="21.3333">Commit</text>
  <rect x="256" y="216" width="192" height="144" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="352" y="306" text-anchor="middle" font-size="21.3333">Build</text>
  <rect x="490.6667" y="216" width="192" height="144" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="586.6667" y="306" text-anchor="middle" font-size="21.3333">Unit Test</text>
  <rect x="725.3333" y="216" width="192" height="144" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="821.3333" y="306" text-anchor="middle" font-size="21.3333">Integration</text>
  <rect x="960" y="216" width="192" height="144" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1056" y="306" text-anchor="middle" font-size="21.3333">Artifact</text>
  <line x1="213.3333" y1="288" x2="256" y2="288" stroke="#333" stroke-width="4.2667" marker-end="url(#arr_ci)" />
  <line x1="448" y1="288" x2="490.6667" y2="288" stroke="#333" stroke-width="4.2667" marker-end="url(#arr_ci)" />
  <line x1="682.6667" y1="288" x2="725.3333" y2="288" stroke="#333" stroke-width="4.2667" marker-end="url(#arr_ci)" />
  <line x1="917.3333" y1="288" x2="960" y2="288" stroke="#333" stroke-width="4.2667" marker-end="url(#arr_ci)" />
  <text x="640" y="486" text-anchor="middle" font-size="21.3333" fill="#555">Automated on every code push</text>
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arr_ci" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
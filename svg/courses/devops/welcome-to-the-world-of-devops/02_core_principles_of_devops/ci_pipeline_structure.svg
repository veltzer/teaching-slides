<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="225" height="459.81982" rx="6.133647" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="152" y="134.054054" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.579136" font-weight="bold" fill="var(--primary-text)">Commit</text>
  <text x="152" y="217.657658" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.40094" fill="var(--primary-text)">Developer</text>
  <text x="152" y="249.009009" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.40094" fill="var(--primary-text)">pushes to git</text>
  <text x="152" y="332.612613" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.40094" fill="var(--primary-text)">Webhook fires</text>
  <text x="152" y="416.216216" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.40094" fill="var(--primary-text)">seconds</text>

  <rect x="295" y="40" width="225" height="459.81982" rx="6.133647" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="407" y="134.054054" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.579136" font-weight="bold" fill="var(--primary-text)">Build</text>
  <text x="407" y="217.657658" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.40094" fill="var(--primary-text)">Compile code</text>
  <text x="407" y="249.009009" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.40094" fill="var(--primary-text)">resolve deps</text>
  <text x="407" y="332.612613" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.40094" fill="var(--primary-text)">Lint, typecheck</text>
  <text x="407" y="416.216216" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.40094" fill="var(--primary-text)">~1-3 min</text>

  <rect x="550" y="40" width="225" height="459.81982" rx="6.133647" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="662" y="134.054054" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.579136" font-weight="bold" fill="var(--info-text)">Unit Test</text>
  <text x="662" y="217.657658" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.40094" fill="var(--info-text)">Fast, isolated</text>
  <text x="662" y="249.009009" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.40094" fill="var(--info-text)">per-function</text>
  <text x="662" y="332.612613" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.40094" fill="var(--info-text)">Mock externals</text>
  <text x="662" y="416.216216" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.40094" fill="var(--info-text)">Coverage gate</text>

  <rect x="805" y="40" width="225" height="459.81982" rx="6.133647" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="917" y="134.054054" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.579136" font-weight="bold" fill="var(--info-text)">Integration</text>
  <text x="917" y="217.657658" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.40094" fill="var(--info-text)">Real services</text>
  <text x="917" y="249.009009" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.40094" fill="var(--info-text)">DB, queues</text>
  <text x="917" y="332.612613" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.40094" fill="var(--info-text)">Docker compose</text>
  <text x="917" y="416.216216" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.40094" fill="var(--info-text)">~5-10 min</text>

  <rect x="1060" y="40" width="180" height="459.81982" rx="6.133647" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1150" y="134.054054" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.579136" font-weight="bold" fill="var(--ok-text)">Artifact</text>
  <text x="1150" y="217.657658" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.40094" fill="var(--ok-text)">Image, jar</text>
  <text x="1150" y="249.009009" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.40094" fill="var(--ok-text)">binary</text>
  <text x="1150" y="332.612613" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.40094" fill="var(--ok-text)">Push registry</text>
  <text x="1150" y="416.216216" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.40094" fill="var(--ok-text)">Tag sha</text>

  <line x1="265" y1="269.90991" x2="293" y2="269.90991" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="269.90991" x2="548" y2="269.90991" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="775" y1="269.90991" x2="803" y2="269.90991" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1030" y1="269.90991" x2="1058" y2="269.90991" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="531.171171" width="1200" height="88.828829" rx="6.133647" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="567.747748" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.445489" font-weight="bold" fill="var(--text)">Automated on every code push</text>
  <text x="640" y="604.324324" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.356391" fill="var(--text-muted)">Fail-fast: any stage red blocks the merge. Total wall time kept under ten minutes.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="213.3333" y="108" width="853.3333" height="234" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4.2667" rx="64" />
  <rect x="256" y="151.2" width="192" height="144" fill="#e3f2fd" stroke="#333" stroke-width="2.1333" rx="10.6667" />

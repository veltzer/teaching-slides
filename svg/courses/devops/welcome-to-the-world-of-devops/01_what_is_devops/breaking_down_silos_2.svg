  <line x1="448" y1="223.2" x2="544" y2="223.2" stroke="#2e7d32" stroke-width="4.2667" marker-end="url(#arr_collab)" />
  <line x1="736" y1="223.2" x2="832" y2="223.2" stroke="#2e7d32" stroke-width="4.2667" marker-end="url(#arr_collab)" />
  <text x="640" y="432" text-anchor="middle" font-size="21.3333" fill="#2e7d32">Unified team, shared goals, continuous flow</text>
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>

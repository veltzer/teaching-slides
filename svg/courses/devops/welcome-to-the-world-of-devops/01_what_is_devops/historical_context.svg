<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="285" height="435" rx="6.106203" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="182" y="112.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.495614" font-weight="bold" fill="var(--primary-text)">1990s</text>
  <text x="182" y="164.285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.424812" font-weight="bold" fill="var(--primary-text)">Waterfall</text>
  <text x="182" y="236.785714" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.318609" fill="var(--primary-text)">Long release cycles</text>
  <text x="182" y="288.571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.318609" fill="var(--primary-text)">Heavy documentation</text>
  <text x="182" y="340.357143" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.318609" fill="var(--primary-text)">Sequential phases</text>
  <text x="182" y="412.857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.318609" fill="var(--primary-text)">Siloed teams</text>

  <rect x="355" y="40" width="285" height="435" rx="6.106203" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="497" y="112.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.495614" font-weight="bold" fill="var(--info-text)">2001</text>
  <text x="497" y="164.285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.424812" font-weight="bold" fill="var(--info-text)">Agile</text>
  <text x="497" y="236.785714" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.318609" fill="var(--info-text)">Iterative sprints</text>
  <text x="497" y="288.571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.318609" fill="var(--info-text)">Customer feedback</text>
  <text x="497" y="340.357143" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.318609" fill="var(--info-text)">Manifesto values</text>
  <text x="497" y="412.857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.318609" fill="var(--info-text)">Dev-only focus</text>

  <rect x="670" y="40" width="285" height="435" rx="6.106203" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="812" y="112.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.495614" font-weight="bold" fill="var(--ok-text)">2008</text>
  <text x="812" y="164.285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.424812" font-weight="bold" fill="var(--ok-text)">DevOps</text>
  <text x="812" y="236.785714" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.318609" fill="var(--ok-text)">Dev + Ops unite</text>
  <text x="812" y="288.571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.318609" fill="var(--ok-text)">CI/CD pipelines</text>
  <text x="812" y="340.357143" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.318609" fill="var(--ok-text)">Automation</text>
  <text x="812" y="412.857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.318609" fill="var(--ok-text)">Shared ownership</text>

  <rect x="985" y="40" width="255" height="435" rx="6.106203" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1112" y="112.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.495614" font-weight="bold" fill="var(--warn-text)">2015+</text>
  <text x="1112" y="164.285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.424812" font-weight="bold" fill="var(--warn-text)">DevSecOps</text>
  <text x="1112" y="236.785714" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.318609" fill="var(--warn-text)">Security shifts left</text>
  <text x="1112" y="288.571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.318609" fill="var(--warn-text)">SAST in pipelines</text>
  <text x="1112" y="340.357143" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.318609" fill="var(--warn-text)">Policy as code</text>
  <text x="1112" y="412.857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.318609" fill="var(--warn-text)">Compliance baked in</text>

  <line x1="325" y1="257.5" x2="355" y2="257.5" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="257.5" x2="670" y2="257.5" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="955" y1="257.5" x2="985" y2="257.5" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="506.071429" width="1200" height="113.928571" rx="6.106203" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="552.678571" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.389411" font-weight="bold" fill="var(--text)">From siloed teams to integrated, security-aware culture</text>
  <text x="640" y="594.107143" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.318609" fill="var(--text-muted)">Each era solved pain from the previous one</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="257.1428" height="253.75" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="168.5714" y="119.75" text-anchor="middle" font-size="21.4549" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Source Control</text>
  <text x="168.5714" y="177.75" text-anchor="middle" font-size="21.4549" font-family="Arial, sans-serif" fill="var(--primary-text)">Git, GitHub</text>
  <text x="168.5714" y="228.5" text-anchor="middle" font-size="21.4549" font-family="Arial, sans-serif" fill="var(--primary-text)">GitLab, Bitbucket</text>
  <rect x="339.9999" y="40" width="257.1428" height="253.75" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="468.5713" y="119.75" text-anchor="middle" font-size="21.4549" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">CI/CD</text>
  <text x="468.5713" y="177.75" text-anchor="middle" font-size="21.4549" font-family="Arial, sans-serif" fill="var(--info-text)">Jenkins, GitLab CI</text>
  <text x="468.5713" y="228.5" text-anchor="middle" font-size="21.4549" font-family="Arial, sans-serif" fill="var(--info-text)">GitHub Actions</text>
  <rect x="639.9999" y="40" width="257.1428" height="253.75" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="768.5713" y="119.75" text-anchor="middle" font-size="21.4549" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Containers</text>
  <text x="768.5713" y="177.75" text-anchor="middle" font-size="21.4549" font-family="Arial, sans-serif" fill="var(--ok-text)">Docker, K8s</text>
  <text x="768.5713" y="228.5" text-anchor="middle" font-size="21.4549" font-family="Arial, sans-serif" fill="var(--ok-text)">Helm, Podman</text>
  <rect x="939.9999" y="40" width="300.0001" height="253.75" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1089.9999" y="119.75" text-anchor="middle" font-size="21.4549" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Monitoring</text>
  <text x="1089.9999" y="177.75" text-anchor="middle" font-size="21.4549" font-family="Arial, sans-serif" fill="var(--warn-text)">Prometheus, Grafana</text>
  <text x="1089.9999" y="228.5" text-anchor="middle" font-size="21.4549" font-family="Arial, sans-serif" fill="var(--warn-text)">ELK, Datadog</text>
  <rect x="189.9999" y="366.25" width="257.1428" height="253.75" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="318.5714" y="446" text-anchor="middle" font-size="21.4549" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Config Mgmt</text>
  <text x="318.5714" y="504" text-anchor="middle" font-size="21.4549" font-family="Arial, sans-serif" fill="var(--danger-text)">Ansible, Terraform</text>
  <text x="318.5714" y="554.75" text-anchor="middle" font-size="21.4549" font-family="Arial, sans-serif" fill="var(--danger-text)">Puppet, Chef</text>
  <rect x="789.9998" y="366.25" width="257.1428" height="253.75" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="918.5713" y="446" text-anchor="middle" font-size="21.4549" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Security</text>
  <text x="918.5713" y="504" text-anchor="middle" font-size="21.4549" font-family="Arial, sans-serif" fill="var(--primary-text)">Vault, Snyk</text>
  <text x="918.5713" y="554.75" text-anchor="middle" font-size="21.4549" font-family="Arial, sans-serif" fill="var(--primary-text)">SonarQube</text>
</svg>

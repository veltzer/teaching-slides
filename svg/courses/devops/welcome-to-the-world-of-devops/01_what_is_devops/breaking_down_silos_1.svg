<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="380" height="360" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--danger-text)">Development</text>
  <text x="230" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">features</text>
  <text x="230" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">velocity metric</text>
  <text x="230" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">throws over wall</text>
  <text x="230" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">owns "make it work"</text>
  <text x="230" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">"works on my box"</text>
  <text x="230" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--danger-text)">blames ops</text>

  <rect x="450" y="40" width="380" height="360" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--danger-text)">QA / Testing</text>
  <text x="640" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">sign-off gate</text>
  <text x="640" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">manual regression</text>
  <text x="640" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">different env</text>
  <text x="640" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">owns "catch bugs"</text>
  <text x="640" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">weeks re-verifying</text>
  <text x="640" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--danger-text)">release bottleneck</text>

  <rect x="860" y="40" width="380" height="360" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--danger-text)">Operations</text>
  <text x="1050" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">runs prod</text>
  <text x="1050" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">uptime metric</text>
  <text x="1050" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">fears change</text>
  <text x="1050" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">owns "keep it up"</text>
  <text x="1050" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">change freeze</text>
  <text x="1050" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--danger-text)">blames dev</text>

  <line x1="420" y1="220" x2="448" y2="220" stroke="var(--danger-border)" stroke-width="3" stroke-dasharray="6" marker-end="url(#arrow-danger)"/>
  <line x1="830" y1="220" x2="858" y2="220" stroke="var(--danger-border)" stroke-width="3" stroke-dasharray="6" marker-end="url(#arrow-danger)"/>

  <rect x="40" y="430" width="1200" height="190" rx="6" fill="var(--surface)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="640" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-accent)">The silo tax</text>
  <text x="640" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">Isolated teams, conflicting goals.</text>
  <text x="640" y="548" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Boundaries are queues. Queues add latency.</text>
  <text x="640" y="581" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Context drops on handoff.</text>
  <text x="640" y="612" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">DevOps attacks walls, not people.</text>
</svg>

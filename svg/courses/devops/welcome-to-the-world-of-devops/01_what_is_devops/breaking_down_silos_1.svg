<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="380" height="360" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--danger-text)">Development</text>
  <text x="230" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">writes features</text>
  <text x="230" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">measured on velocity</text>
  <text x="230" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">throws builds over wall</text>
  <text x="230" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">owns "make it work"</text>
  <text x="230" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">"works on my machine"</text>
  <text x="230" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--danger-text)">blames ops when down</text>

  <rect x="450" y="40" width="380" height="360" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--danger-text)">QA / Testing</text>
  <text x="640" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">separate sign-off gate</text>
  <text x="640" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">manual regression runs</text>
  <text x="640" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">different environment</text>
  <text x="640" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">owns "catch bugs"</text>
  <text x="640" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">weeks of re-verification</text>
  <text x="640" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--danger-text)">bottleneck on release</text>

  <rect x="860" y="40" width="380" height="360" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--danger-text)">Operations</text>
  <text x="1050" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">runs production</text>
  <text x="1050" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">measured on uptime</text>
  <text x="1050" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">fears every change</text>
  <text x="1050" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">owns "keep it up"</text>
  <text x="1050" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">change freeze culture</text>
  <text x="1050" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--danger-text)">blames dev when broken</text>

  <line x1="420" y1="220" x2="448" y2="220" stroke="var(--danger-border)" stroke-width="3" stroke-dasharray="6" marker-end="url(#arrow-danger)"/>
  <line x1="830" y1="220" x2="858" y2="220" stroke="var(--danger-border)" stroke-width="3" stroke-dasharray="6" marker-end="url(#arrow-danger)"/>

  <rect x="40" y="430" width="1200" height="190" rx="6" fill="var(--surface)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="640" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-accent)">The silo tax</text>
  <text x="640" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">Isolated teams, conflicting goals, slow handoffs, finger-pointing.</text>
  <text x="640" y="548" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Each boundary is a queue. Each queue adds latency and distortion.</text>
  <text x="640" y="581" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Context drops at every handoff — who actually owns this deploy?</text>
  <text x="640" y="612" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">DevOps attacks the walls, not the people behind them.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <text x="328.8887" y="99.9998" text-anchor="middle" font-size="27.5412" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Dev</text>
  <text x="951.1113" y="99.9998" text-anchor="middle" font-size="27.5412" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Ops</text>
  <rect x="62.2221" y="159.9999" width="166.6666" height="120.0001" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="144.4444" y="239.9996" text-anchor="middle" font-size="22.9511" font-family="Arial, sans-serif" fill="var(--primary-text)">Plan</text>
  <rect x="251.1111" y="159.9999" width="166.6666" height="120.0001" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="333.3332" y="239.9996" text-anchor="middle" font-size="22.9511" font-family="Arial, sans-serif" fill="var(--primary-text)">Code</text>
  <rect x="440.0001" y="159.9999" width="166.6666" height="120.0001" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="522.2222" y="239.9996" text-anchor="middle" font-size="22.9511" font-family="Arial, sans-serif" fill="var(--primary-text)">Build</text>
  <rect x="628.8888" y="159.9999" width="166.6666" height="120.0001" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6"/>
  <text x="711.1111" y="239.9996" text-anchor="middle" font-size="22.9511" font-family="Arial, sans-serif" fill="var(--info-text)">Test</text>
  <rect x="817.7778" y="159.9999" width="166.6666" height="120.0001" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="900.0001" y="239.9996" text-anchor="middle" font-size="22.9511" font-family="Arial, sans-serif" fill="var(--ok-text)">Release</text>
  <rect x="1006.6667" y="159.9999" width="166.6666" height="120.0001" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="1088.8888" y="239.9996" text-anchor="middle" font-size="22.9511" font-family="Arial, sans-serif" fill="var(--ok-text)">Deploy</text>
  <rect x="817.7778" y="339.9996" width="166.6666" height="120.0001" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6"/>
  <text x="900.0001" y="420" text-anchor="middle" font-size="22.9511" font-family="Arial, sans-serif" fill="var(--warn-text)">Operate</text>
  <rect x="1006.6667" y="339.9996" width="166.6666" height="120.0001" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6"/>
  <text x="1088.8888" y="420" text-anchor="middle" font-size="22.9511" font-family="Arial, sans-serif" fill="var(--warn-text)">Monitor</text>
  <path d="M 1173.3334 399.9999 Q 1240 399.9999 1240 219.9997 Q 1240 40 640 40 Q 40 40 40 219.9997 L 40 219.9997 L 62.2221 219.9997" stroke="var(--primary-border)" stroke-width="0.6477" fill="none" marker-end="url(#arrow)"/>
  <text x="640" y="620" text-anchor="middle" font-size="22.9511" fill="var(--text-muted)" font-family="Arial, sans-serif">Continuous feedback loop from Monitor back to Plan</text>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
</svg>

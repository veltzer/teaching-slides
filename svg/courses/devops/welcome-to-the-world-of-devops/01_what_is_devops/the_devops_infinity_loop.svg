<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="353.9207" y="131.7241" text-anchor="middle" font-size="24.5211" font-weight="bold" fill="var(--primary-accent)">Dev</text>
  <text x="926.0793" y="131.7241" text-anchor="middle" font-size="24.5211" font-weight="bold" fill="var(--ok-accent)">Ops</text>
  <rect x="108.7101" y="183.4483" width="153.2567" height="103.4483" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="10.9195" />
  <text x="184.3168" y="252.4137" text-anchor="middle" font-size="20.4343">Plan</text>
  <rect x="282.401" y="183.4483" width="153.2567" height="103.4483" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="10.9195" />
  <text x="358.0076" y="252.4137" text-anchor="middle" font-size="20.4343">Code</text>
  <rect x="456.092" y="183.4483" width="153.2567" height="103.4483" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="10.9195" />
  <text x="531.6985" y="252.4137" text-anchor="middle" font-size="20.4343">Build</text>
  <rect x="629.7829" y="183.4483" width="153.2567" height="103.4483" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="10.9195" />
  <text x="705.3895" y="252.4137" text-anchor="middle" font-size="20.4343">Test</text>
  <rect x="803.4739" y="183.4483" width="153.2567" height="103.4483" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="10.9195" />
  <text x="879.0805" y="252.4137" text-anchor="middle" font-size="20.4343">Release</text>
  <rect x="977.1649" y="183.4483" width="153.2567" height="103.4483" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="10.9195" />
  <text x="1052.7714" y="252.4137" text-anchor="middle" font-size="20.4343">Deploy</text>
  <rect x="803.4739" y="338.6206" width="153.2567" height="103.4483" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="10.9195" />
  <text x="879.0805" y="407.5863" text-anchor="middle" font-size="20.4343">Operate</text>
  <rect x="977.1649" y="338.6206" width="153.2567" height="103.4483" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="10.9195" />
  <text x="1052.7714" y="407.5863" text-anchor="middle" font-size="20.4343">Monitor</text>
  <path d="M 1130.4216 390.3448 Q 1191.7242 390.3448 1191.7242 235.1723 Q 1191.7242 80 640 80 Q 88.2758 80 88.2758 235.1723 L 88.2758 235.1723 L 108.7101 235.1723" stroke="var(--primary-border)" stroke-width="2.2456" fill="none" marker-end="url(#arr_loop)" />
  <text x="640" y="580" text-anchor="middle" font-size="20.4343" fill="var(--text-muted)">Continuous feedback loop from Monitor back to Plan</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr_loop" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#1565c0" />
    </marker>
  </defs>
</svg>
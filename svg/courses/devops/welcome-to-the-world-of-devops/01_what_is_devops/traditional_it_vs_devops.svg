<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="28.753498" font-weight="bold" fill="var(--text)">Traditional IT vs DevOps</text>
  <text x="310" y="87.454545" text-anchor="middle" font-size="22.592034" font-weight="bold" fill="var(--danger-accent)">Traditional IT</text>
  <text x="950" y="87.454545" text-anchor="middle" font-size="22.592034" font-weight="bold" fill="var(--ok-accent)">DevOps</text>
  <rect x="40" y="113.818182" width="170" height="358.545455" rx="6.161464" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="125" y="198.181818" text-anchor="middle" font-size="24.645855" font-weight="bold" fill="var(--danger-text)">Dev</text>
  <text x="125" y="256.181818" text-anchor="middle" font-size="14.376749" fill="var(--danger-text)">own tools</text>
  <text x="125" y="287.818182" text-anchor="middle" font-size="14.376749" fill="var(--danger-text)">own goals</text>
  <text x="125" y="319.454545" text-anchor="middle" font-size="14.376749" fill="var(--danger-text)">own queue</text>
  <rect x="230" y="113.818182" width="170" height="358.545455" rx="6.161464" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="315" y="198.181818" text-anchor="middle" font-size="24.645855" font-weight="bold" fill="var(--danger-text)">QA</text>
  <text x="315" y="256.181818" text-anchor="middle" font-size="14.376749" fill="var(--danger-text)">own tools</text>
  <text x="315" y="287.818182" text-anchor="middle" font-size="14.376749" fill="var(--danger-text)">own goals</text>
  <text x="315" y="319.454545" text-anchor="middle" font-size="14.376749" fill="var(--danger-text)">own queue</text>
  <rect x="420" y="113.818182" width="170" height="358.545455" rx="6.161464" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="505" y="198.181818" text-anchor="middle" font-size="24.645855" font-weight="bold" fill="var(--danger-text)">Ops</text>
  <text x="505" y="256.181818" text-anchor="middle" font-size="14.376749" fill="var(--danger-text)">own tools</text>
  <text x="505" y="287.818182" text-anchor="middle" font-size="14.376749" fill="var(--danger-text)">own goals</text>
  <text x="505" y="319.454545" text-anchor="middle" font-size="14.376749" fill="var(--danger-text)">own queue</text>
  <line x1="210" y1="113.818182" x2="210" y2="472.363636" stroke="var(--danger-accent)" stroke-width="4" stroke-dasharray="10,6"/>
  <text x="210" y="498.727273" text-anchor="middle" font-size="15.40366" font-weight="bold" fill="var(--danger-accent)">WALL</text>
  <line x1="400" y1="113.818182" x2="400" y2="472.363636" stroke="var(--danger-accent)" stroke-width="4" stroke-dasharray="10,6"/>
  <text x="400" y="498.727273" text-anchor="middle" font-size="15.40366" font-weight="bold" fill="var(--danger-accent)">WALL</text>
  <text x="310" y="551.454545" text-anchor="middle" font-size="17.457481" fill="var(--danger-accent)">Slow, error-prone handoffs</text>
  <text x="310" y="588.363636" text-anchor="middle" font-size="14.376749" fill="var(--text-muted)">Blame crosses the wall; releases are rare.</text>
  <line x1="620" y1="71.636364" x2="620" y2="620" stroke="var(--border)" stroke-width="2"/>
  <rect x="660" y="113.818182" width="580" height="358.545455" rx="6.161464" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="187.636364" text-anchor="middle" font-size="28.753498" font-weight="bold" fill="var(--ok-text)">Dev + QA + Ops</text>
  <text x="950" y="245.636364" text-anchor="middle" font-size="17.457481" fill="var(--ok-text)">One team, one backlog</text>
  <text x="950" y="287.818182" text-anchor="middle" font-size="17.457481" fill="var(--ok-text)">Shared tools and metrics</text>
  <text x="950" y="330" text-anchor="middle" font-size="17.457481" fill="var(--ok-text)">Automated pipelines</text>
  <text x="950" y="372.181818" text-anchor="middle" font-size="17.457481" fill="var(--ok-text)">You build it, you run it</text>
  <text x="950" y="414.363636" text-anchor="middle" font-size="17.457481" fill="var(--ok-text)">Continuous delivery</text>
  <text x="950" y="551.454545" text-anchor="middle" font-size="17.457481" fill="var(--ok-accent)">Shared ownership, fast flow</text>
  <text x="950" y="588.363636" text-anchor="middle" font-size="14.376749" fill="var(--text-muted)">Releases become routine.</text>
</svg>

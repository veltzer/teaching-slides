<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="28.753498" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Traditional IT vs DevOps</text>
  <text x="310" y="87.454545" text-anchor="middle" font-size="22.592034" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Traditional IT</text>
  <text x="950" y="87.454545" text-anchor="middle" font-size="22.592034" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">DevOps</text>
  <rect x="40" y="113.818182" width="170" height="358.545455" rx="6.161464" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="125" y="198.181818" text-anchor="middle" font-size="24.645855" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Dev</text>
  <text x="125" y="256.181818" text-anchor="middle" font-size="14.376749" fill="var(--danger-text)" font-family="Arial, sans-serif">own tools</text>
  <text x="125" y="287.818182" text-anchor="middle" font-size="14.376749" fill="var(--danger-text)" font-family="Arial, sans-serif">own goals</text>
  <text x="125" y="319.454545" text-anchor="middle" font-size="14.376749" fill="var(--danger-text)" font-family="Arial, sans-serif">own queue</text>
  <rect x="230" y="113.818182" width="170" height="358.545455" rx="6.161464" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="315" y="198.181818" text-anchor="middle" font-size="24.645855" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">QA</text>
  <text x="315" y="256.181818" text-anchor="middle" font-size="14.376749" fill="var(--danger-text)" font-family="Arial, sans-serif">own tools</text>
  <text x="315" y="287.818182" text-anchor="middle" font-size="14.376749" fill="var(--danger-text)" font-family="Arial, sans-serif">own goals</text>
  <text x="315" y="319.454545" text-anchor="middle" font-size="14.376749" fill="var(--danger-text)" font-family="Arial, sans-serif">own queue</text>
  <rect x="420" y="113.818182" width="170" height="358.545455" rx="6.161464" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="505" y="198.181818" text-anchor="middle" font-size="24.645855" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Ops</text>
  <text x="505" y="256.181818" text-anchor="middle" font-size="14.376749" fill="var(--danger-text)" font-family="Arial, sans-serif">own tools</text>
  <text x="505" y="287.818182" text-anchor="middle" font-size="14.376749" fill="var(--danger-text)" font-family="Arial, sans-serif">own goals</text>
  <text x="505" y="319.454545" text-anchor="middle" font-size="14.376749" fill="var(--danger-text)" font-family="Arial, sans-serif">own queue</text>
  <line x1="210" y1="113.818182" x2="210" y2="472.363636" stroke="var(--danger-accent)" stroke-width="4" stroke-dasharray="10,6"/>
  <text x="210" y="498.727273" text-anchor="middle" font-size="15.40366" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">WALL</text>
  <line x1="400" y1="113.818182" x2="400" y2="472.363636" stroke="var(--danger-accent)" stroke-width="4" stroke-dasharray="10,6"/>
  <text x="400" y="498.727273" text-anchor="middle" font-size="15.40366" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">WALL</text>
  <text x="310" y="551.454545" text-anchor="middle" font-size="17.457481" fill="var(--danger-accent)" font-family="Arial, sans-serif">Slow, error-prone handoffs</text>
  <text x="310" y="588.363636" text-anchor="middle" font-size="14.376749" fill="var(--text-muted)" font-family="Arial, sans-serif">Blame crosses the wall; releases are rare.</text>
  <line x1="620" y1="71.636364" x2="620" y2="620" stroke="var(--border)" stroke-width="2"/>
  <rect x="660" y="113.818182" width="580" height="358.545455" rx="6.161464" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="187.636364" text-anchor="middle" font-size="28.753498" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Dev + QA + Ops</text>
  <text x="950" y="245.636364" text-anchor="middle" font-size="17.457481" fill="var(--ok-text)" font-family="Arial, sans-serif">One team, one backlog</text>
  <text x="950" y="287.818182" text-anchor="middle" font-size="17.457481" fill="var(--ok-text)" font-family="Arial, sans-serif">Shared tools and metrics</text>
  <text x="950" y="330" text-anchor="middle" font-size="17.457481" fill="var(--ok-text)" font-family="Arial, sans-serif">Automated pipelines</text>
  <text x="950" y="372.181818" text-anchor="middle" font-size="17.457481" fill="var(--ok-text)" font-family="Arial, sans-serif">You build it, you run it</text>
  <text x="950" y="414.363636" text-anchor="middle" font-size="17.457481" fill="var(--ok-text)" font-family="Arial, sans-serif">Continuous delivery</text>
  <text x="950" y="551.454545" text-anchor="middle" font-size="17.457481" fill="var(--ok-accent)" font-family="Arial, sans-serif">Shared ownership, fast flow</text>
  <text x="950" y="588.363636" text-anchor="middle" font-size="14.376749" fill="var(--text-muted)" font-family="Arial, sans-serif">Releases become routine.</text>
</svg>

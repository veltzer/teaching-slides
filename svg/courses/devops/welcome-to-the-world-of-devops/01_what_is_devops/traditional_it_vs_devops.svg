<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="310" y="56.730768376479" text-anchor="middle" font-size="23.234589612819" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Traditional IT</text>
  <text x="950" y="56.730768376479" text-anchor="middle" font-size="23.234589612819" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">DevOps</text>
  <rect x="40" y="84.615384452663" width="170" height="379.230769963018" rx="6.336706445031" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="125" y="173.846153357988" text-anchor="middle" font-size="25.346824751682" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Dev</text>
  <text x="125" y="235.192307244822" text-anchor="middle" font-size="14.785648028925" fill="var(--danger-text)" font-family="Arial, sans-serif">own tools</text>
  <text x="125" y="268.653846113166" text-anchor="middle" font-size="14.785648028925" fill="var(--danger-text)" font-family="Arial, sans-serif">own goals</text>
  <text x="125" y="302.115383923817" text-anchor="middle" font-size="14.785648028925" fill="var(--danger-text)" font-family="Arial, sans-serif">own queue</text>
  <rect x="230" y="84.615384452663" width="170" height="379.230769963018" rx="6.336706445031" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="315" y="173.846153357988" text-anchor="middle" font-size="25.346824751682" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">QA</text>
  <text x="315" y="235.192307244822" text-anchor="middle" font-size="14.785648028925" fill="var(--danger-text)" font-family="Arial, sans-serif">own tools</text>
  <text x="315" y="268.653846113166" text-anchor="middle" font-size="14.785648028925" fill="var(--danger-text)" font-family="Arial, sans-serif">own goals</text>
  <text x="315" y="302.115383923817" text-anchor="middle" font-size="14.785648028925" fill="var(--danger-text)" font-family="Arial, sans-serif">own queue</text>
  <rect x="420" y="84.615384452663" width="170" height="379.230769963018" rx="6.336706445031" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="505" y="173.846153357988" text-anchor="middle" font-size="25.346824751682" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Ops</text>
  <text x="505" y="235.192307244822" text-anchor="middle" font-size="14.785648028925" fill="var(--danger-text)" font-family="Arial, sans-serif">own tools</text>
  <text x="505" y="268.653846113166" text-anchor="middle" font-size="14.785648028925" fill="var(--danger-text)" font-family="Arial, sans-serif">own goals</text>
  <text x="505" y="302.115383923817" text-anchor="middle" font-size="14.785648028925" fill="var(--danger-text)" font-family="Arial, sans-serif">own queue</text>
  <line x1="210" y1="84.615384452663" x2="210" y2="463.846153357988" stroke="var(--danger-accent)" stroke-width="4" stroke-dasharray="10,6"/>
  <text x="210" y="491.730769434172" text-anchor="middle" font-size="15.841766112578" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">WALL</text>
  <line x1="400" y1="84.615384452663" x2="400" y2="463.846153357988" stroke="var(--danger-accent)" stroke-width="4" stroke-dasharray="10,6"/>
  <text x="400" y="491.730769434172" text-anchor="middle" font-size="15.841766112578" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">WALL</text>
  <text x="310" y="547.499999471154" text-anchor="middle" font-size="17.954001251441" fill="var(--danger-accent)" font-family="Arial, sans-serif">Slow, error-prone handoffs</text>
  <text x="310" y="586.538461131657" text-anchor="middle" font-size="14.785648028925" fill="var(--text-muted)" font-family="Arial, sans-serif">Blame crosses the wall; releases are rare.</text>
  <line x1="620" y1="40" x2="620" y2="620" stroke="var(--border)" stroke-width="2"/>
  <rect x="660" y="84.615384452663" width="580" height="379.230769963018" rx="6.336706445031" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="162.692307773669" text-anchor="middle" font-size="29.57129605785" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Dev + QA + Ops</text>
  <text x="950" y="224.038461660503" text-anchor="middle" font-size="17.954001251441" fill="var(--ok-text)" font-family="Arial, sans-serif">One team, one backlog</text>
  <text x="950" y="268.653846113166" text-anchor="middle" font-size="17.954001251441" fill="var(--ok-text)" font-family="Arial, sans-serif">Shared tools and metrics</text>
  <text x="950" y="313.269230565828" text-anchor="middle" font-size="17.954001251441" fill="var(--ok-text)" font-family="Arial, sans-serif">Automated pipelines</text>
  <text x="950" y="357.884615018491" text-anchor="middle" font-size="17.954001251441" fill="var(--ok-text)" font-family="Arial, sans-serif">You build it, you run it</text>
  <text x="950" y="402.499999471154" text-anchor="middle" font-size="17.954001251441" fill="var(--ok-text)" font-family="Arial, sans-serif">Continuous delivery</text>
  <text x="950" y="547.499999471154" text-anchor="middle" font-size="17.954001251441" fill="var(--ok-accent)" font-family="Arial, sans-serif">Shared ownership, fast flow</text>
  <text x="950" y="586.538461131657" text-anchor="middle" font-size="14.785648028925" fill="var(--text-muted)" font-family="Arial, sans-serif">Releases become routine.</text>
</svg>

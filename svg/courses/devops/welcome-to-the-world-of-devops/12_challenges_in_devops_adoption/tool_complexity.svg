<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <ellipse cx="640" cy="309.7465" rx="152.9412" ry="96.0165" fill="var(--info-fill)" stroke="var(--text)" stroke-width="4.2667" />
  <text x="640" y="293.5437" text-anchor="middle" font-size="26.1422" fill="var(--bg)" font-weight="bold">Tool</text>
  <text x="640" y="358.3549" text-anchor="middle" font-size="23.7656" fill="var(--bg)">Sprawl</text>
  <ellipse cx="169.4117" cy="107.2116" rx="129.4117" ry="67.2116" fill="var(--danger-fill)" stroke="var(--text)" stroke-width="4.2667" />
  <text x="169.4117" y="95.0595" text-anchor="middle" font-size="23.7656" font-weight="bold">Too Many</text>
  <text x="169.4117" y="147.7185" text-anchor="middle" font-size="23.7656">Overlap / Waste</text>
  <ellipse cx="1110.5883" cy="107.2116" rx="129.4117" ry="67.2116" fill="var(--warn-fill)" stroke="var(--text)" stroke-width="4.2667" />
  <text x="1110.5883" y="95.0595" text-anchor="middle" font-size="23.7656" font-weight="bold">Integration</text>
  <text x="1110.5883" y="147.7185" text-anchor="middle" font-size="23.7656">Glue Code</text>
  <ellipse cx="169.4117" cy="552.7884" rx="129.4117" ry="67.2116" fill="var(--info-fill)" stroke="var(--text)" stroke-width="4.2667" />
  <text x="169.4117" y="540.6363" text-anchor="middle" font-size="23.7656" font-weight="bold">Learning</text>
  <text x="169.4117" y="593.2954" text-anchor="middle" font-size="23.7656">Steep Curves</text>
  <ellipse cx="1110.5883" cy="552.7884" rx="129.4117" ry="67.2116" fill="var(--primary-fill)" stroke="var(--text)" stroke-width="4.2667" />
  <text x="1110.5883" y="540.6363" text-anchor="middle" font-size="23.7656" font-weight="bold">Vendor Lock</text>
  <text x="1110.5883" y="593.2954" text-anchor="middle" font-size="23.7656">Dependency Risk</text>
  <line x1="510.5883" y1="208.479" x2="287.0588" y2="147.7185" stroke="var(--text)" stroke-width="2" />
  <line x1="769.4117" y1="208.479" x2="992.9412" y2="147.7185" stroke="var(--text)" stroke-width="2" />
  <line x1="510.5883" y1="411.014" x2="287.0588" y2="492.028" stroke="var(--text)" stroke-width="2" />
  <line x1="769.4117" y1="411.014" x2="992.9412" y2="492.028" stroke="var(--text)" stroke-width="2" />
</svg>
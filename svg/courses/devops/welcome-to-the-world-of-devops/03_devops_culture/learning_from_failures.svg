<svg width="600" height="200" xmlns="http://www.w3.org/2000/svg">
  <text x="300" y="20" text-anchor="middle" font-size="12" font-weight="bold">Blameless Postmortem Process</text>
  <rect x="20" y="35" width="110" height="50" fill="#ffebee" stroke="#333" stroke-width="2" rx="5"/>
  <text x="75" y="55" text-anchor="middle" font-size="10" font-weight="bold">Incident</text>
  <text x="75" y="70" text-anchor="middle" font-size="9">Detect + Respond</text>
  <rect x="155" y="35" width="110" height="50" fill="#fff3e0" stroke="#333" stroke-width="2" rx="5"/>
  <text x="210" y="55" text-anchor="middle" font-size="10" font-weight="bold">Timeline</text>
  <text x="210" y="70" text-anchor="middle" font-size="9">What happened?</text>
  <rect x="290" y="35" width="110" height="50" fill="#e3f2fd" stroke="#333" stroke-width="2" rx="5"/>
  <text x="345" y="55" text-anchor="middle" font-size="10" font-weight="bold">Root Cause</text>
  <text x="345" y="70" text-anchor="middle" font-size="9">Systems, not people</text>
  <rect x="425" y="35" width="110" height="50" fill="#e8f5e9" stroke="#333" stroke-width="2" rx="5"/>
  <text x="480" y="55" text-anchor="middle" font-size="10" font-weight="bold">Action Items</text>
  <text x="480" y="70" text-anchor="middle" font-size="9">Prevent recurrence</text>
  <line x1="130" y1="60" x2="155" y2="60" stroke="#333" stroke-width="2" marker-end="url(#arr_pm)"/>
  <line x1="265" y1="60" x2="290" y2="60" stroke="#333" stroke-width="2" marker-end="url(#arr_pm)"/>
  <line x1="400" y1="60" x2="425" y2="60" stroke="#333" stroke-width="2" marker-end="url(#arr_pm)"/>
  <text x="300" y="120" text-anchor="middle" font-size="10" fill="#673ab7">Focus on fixing systems, not blaming individuals</text>
  <defs>
    <marker id="arr_pm" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
</svg>

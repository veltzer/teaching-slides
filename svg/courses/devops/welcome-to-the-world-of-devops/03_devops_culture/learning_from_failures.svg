<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="25.6" font-weight="bold">Blameless Postmortem Process</text>
  <rect x="42.6667" y="126" width="234.6667" height="180" fill="#ffebee" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="160" y="198" text-anchor="middle" font-size="21.3333" font-weight="bold">Incident</text>
  <text x="160" y="252" text-anchor="middle" font-size="21.3333">Detect + Respond</text>
  <rect x="330.6667" y="126" width="234.6667" height="180" fill="#fff3e0" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="448" y="198" text-anchor="middle" font-size="21.3333" font-weight="bold">Timeline</text>
  <text x="448" y="252" text-anchor="middle" font-size="21.3333">What happened?</text>
  <rect x="618.6667" y="126" width="234.6667" height="180" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="736" y="198" text-anchor="middle" font-size="21.3333" font-weight="bold">Root Cause</text>
  <text x="736" y="252" text-anchor="middle" font-size="21.3333">Systems, not people</text>
  <rect x="906.6667" y="126" width="234.6667" height="180" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1024" y="198" text-anchor="middle" font-size="21.3333" font-weight="bold">Action Items</text>
  <text x="1024" y="252" text-anchor="middle" font-size="21.3333">Prevent recurrence</text>
  <line x1="277.3333" y1="216" x2="330.6667" y2="216" stroke="#333" stroke-width="4.2667" marker-end="url(#arr_pm)" />
  <line x1="565.3333" y1="216" x2="618.6667" y2="216" stroke="#333" stroke-width="4.2667" marker-end="url(#arr_pm)" />
  <line x1="853.3333" y1="216" x2="906.6667" y2="216" stroke="#333" stroke-width="4.2667" marker-end="url(#arr_pm)" />
  <text x="640" y="432" text-anchor="middle" font-size="21.3333" fill="#673ab7">Focus on fixing systems, not blaming individuals</text>
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arr_pm" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
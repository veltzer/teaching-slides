<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <ellipse cx="640" cy="319.2297" rx="129.4118" ry="89.3536" fill="var(--info-fill)" stroke="var(--text)" stroke-width="4.2667" />
  <text x="640" y="340.7703" text-anchor="middle" font-size="24.509" fill="var(--bg)">KPI Focus</text>
  <ellipse cx="216.4706" cy="103.8239" rx="176.4706" ry="63.8239" fill="var(--primary-fill)" stroke="var(--text)" stroke-width="4.2667" />
  <text x="216.4706" y="86.5913" text-anchor="middle" font-size="24.509">Throughput</text>
  <text x="216.4706" y="146.905" text-anchor="middle" font-size="24.509">deploys/week</text>
  <ellipse cx="1063.5294" cy="103.8239" rx="176.4706" ry="63.8239" fill="var(--info-fill)" stroke="var(--text)" stroke-width="4.2667" />
  <text x="1063.5294" y="86.5913" text-anchor="middle" font-size="24.509">Stability</text>
  <text x="1063.5294" y="146.905" text-anchor="middle" font-size="24.509">uptime %, MTTR</text>
  <ellipse cx="216.4706" cy="556.1761" rx="176.4706" ry="63.8239" fill="var(--ok-fill)" stroke="var(--text)" stroke-width="4.2667" />
  <text x="216.4706" y="538.9437" text-anchor="middle" font-size="24.509">Satisfaction</text>
  <text x="216.4706" y="599.2573" text-anchor="middle" font-size="24.509">eNPS, surveys</text>
  <ellipse cx="1063.5294" cy="556.1761" rx="176.4706" ry="63.8239" fill="var(--warn-fill)" stroke="var(--text)" stroke-width="4.2667" />
  <text x="1063.5294" y="538.9437" text-anchor="middle" font-size="24.509">Velocity</text>
  <text x="1063.5294" y="599.2573" text-anchor="middle" font-size="24.509">lead time, cycle</text>
  <line x1="522.3529" y1="224.4512" x2="381.1764" y2="146.905" stroke="var(--text)" stroke-width="2" />
  <line x1="757.6471" y1="224.4512" x2="898.8236" y2="146.905" stroke="var(--text)" stroke-width="2" />
  <line x1="522.3529" y1="414.0083" x2="381.1764" y2="513.095" stroke="var(--text)" stroke-width="2" />
  <line x1="757.6471" y1="414.0083" x2="898.8236" y2="513.095" stroke="var(--text)" stroke-width="2" />
</svg>
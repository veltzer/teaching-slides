<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <ellipse cx="640" cy="320.7353" rx="120.7843" ry="76.8628" fill="var(--info-fill)" stroke="var(--text)" stroke-width="4.2667" />
  <text x="640" y="339.2647" text-anchor="middle" font-size="21.9607" fill="var(--bg)">KPI Focus</text>
  <ellipse cx="244.7059" cy="135.4412" rx="164.7059" ry="54.9019" fill="var(--primary-fill)" stroke="var(--text)" stroke-width="4.2667" />
  <text x="244.7059" y="120.6176" text-anchor="middle" font-size="21.9607">Throughput</text>
  <text x="244.7059" y="172.5" text-anchor="middle" font-size="21.9607">deploys/week</text>
  <ellipse cx="1035.2941" cy="135.4412" rx="164.7059" ry="54.9019" fill="var(--info-fill)" stroke="var(--text)" stroke-width="4.2667" />
  <text x="1035.2941" y="120.6176" text-anchor="middle" font-size="21.9607">Stability</text>
  <text x="1035.2941" y="172.5" text-anchor="middle" font-size="21.9607">uptime %, MTTR</text>
  <ellipse cx="244.7059" cy="524.5588" rx="164.7059" ry="54.9019" fill="var(--ok-fill)" stroke="var(--text)" stroke-width="4.2667" />
  <text x="244.7059" y="509.7353" text-anchor="middle" font-size="21.9607">Satisfaction</text>
  <text x="244.7059" y="561.6176" text-anchor="middle" font-size="21.9607">eNPS, surveys</text>
  <ellipse cx="1035.2941" cy="524.5588" rx="164.7059" ry="54.9019" fill="var(--warn-fill)" stroke="var(--text)" stroke-width="4.2667" />
  <text x="1035.2941" y="509.7353" text-anchor="middle" font-size="21.9607">Velocity</text>
  <text x="1035.2941" y="561.6176" text-anchor="middle" font-size="21.9607">lead time, cycle</text>
  <line x1="530.196" y1="239.2059" x2="398.4313" y2="172.5" stroke="var(--text)" stroke-width="2" />
  <line x1="749.804" y1="239.2059" x2="881.5687" y2="172.5" stroke="var(--text)" stroke-width="2" />
  <line x1="530.196" y1="402.2647" x2="398.4313" y2="487.5" stroke="var(--text)" stroke-width="2" />
  <line x1="749.804" y1="402.2647" x2="881.5687" y2="487.5" stroke="var(--text)" stroke-width="2" />
</svg>
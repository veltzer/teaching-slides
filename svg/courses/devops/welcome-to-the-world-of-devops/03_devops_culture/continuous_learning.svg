<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="278.5714" height="248.571363265293" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.414270437846"/>
  <text x="179.2855" y="122.85704489794" text-anchor="middle" font-size="22.936255136157" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Experiment</text>
  <text x="179.2855" y="184.999914285697" text-anchor="middle" font-size="22.936255136157" font-family="Arial, sans-serif" fill="var(--primary-text)">Try new approaches</text>
  <text x="179.2855" y="238.857296326561" text-anchor="middle" font-size="22.936255136157" font-family="Arial, sans-serif" fill="var(--primary-text)">Safe-to-fail probes</text>
  <rect x="500.7143" y="40" width="278.5714" height="248.571363265293" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.414270437846"/>
  <text x="640" y="122.85704489794" text-anchor="middle" font-size="22.936255136157" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Reflect</text>
  <text x="640" y="184.999914285697" text-anchor="middle" font-size="22.936255136157" font-family="Arial, sans-serif" fill="var(--info-text)">Retrospectives</text>
  <text x="640" y="238.857296326561" text-anchor="middle" font-size="22.936255136157" font-family="Arial, sans-serif" fill="var(--info-text)">Gather data + insights</text>
  <rect x="961.4286" y="40" width="278.5714" height="248.571363265293" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.414270437846"/>
  <text x="1100.7143" y="122.85704489794" text-anchor="middle" font-size="22.936255136157" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Adapt</text>
  <text x="1100.7143" y="184.999914285697" text-anchor="middle" font-size="22.936255136157" font-family="Arial, sans-serif" fill="var(--ok-text)">Apply learnings</text>
  <text x="1100.7143" y="238.857296326561" text-anchor="middle" font-size="22.936255136157" font-family="Arial, sans-serif" fill="var(--ok-text)">Improve processes</text>
  <line x1="318.5716" y1="164.285624489778" x2="500.7143" y2="164.285624489778" stroke="var(--text)" stroke-width="0.7601" marker-end="url(#arrow)"/>
  <line x1="779.2857" y1="164.285624489778" x2="961.4286" y2="164.285624489778" stroke="var(--text)" stroke-width="0.7601" marker-end="url(#arrow)"/>
  <path d="M 1100.7143 309.285767346949 Q 1100.7143 537.14295510206 640 537.14295510206 Q 179.2855 537.14295510206 179.2855 309.285767346949" fill="none" stroke="var(--text-faint)" stroke-width="0.7085" stroke-dasharray="2.3615 1.4169" marker-end="url(#arrow)"/>
  <text x="640" y="620" text-anchor="middle" font-size="22.936255136157" fill="var(--text-muted)" font-family="Arial, sans-serif">Iterate continuously to build a learning organization</text>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
</svg>

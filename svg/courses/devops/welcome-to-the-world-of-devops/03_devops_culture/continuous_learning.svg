<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640" y="40" text-anchor="middle" font-size="25.746" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Continuous Learning Cycle</text>
  <rect x="40" y="112.5001" width="278.5714" height="217.4999" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="179.2855" y="185" text-anchor="middle" font-size="21.4549" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Experiment</text>
  <text x="179.2855" y="239.375" text-anchor="middle" font-size="21.4549" font-family="Arial, sans-serif" fill="var(--primary-text)">Try new approaches</text>
  <text x="179.2855" y="286.5002" text-anchor="middle" font-size="21.4549" font-family="Arial, sans-serif" fill="var(--primary-text)">Safe-to-fail probes</text>
  <rect x="500.7143" y="112.5001" width="278.5714" height="217.4999" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="185" text-anchor="middle" font-size="21.4549" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Reflect</text>
  <text x="640" y="239.375" text-anchor="middle" font-size="21.4549" font-family="Arial, sans-serif" fill="var(--info-text)">Retrospectives</text>
  <text x="640" y="286.5002" text-anchor="middle" font-size="21.4549" font-family="Arial, sans-serif" fill="var(--info-text)">Gather data + insights</text>
  <rect x="961.4286" y="112.5001" width="278.5714" height="217.4999" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1100.7143" y="185" text-anchor="middle" font-size="21.4549" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Adapt</text>
  <text x="1100.7143" y="239.375" text-anchor="middle" font-size="21.4549" font-family="Arial, sans-serif" fill="var(--ok-text)">Apply learnings</text>
  <text x="1100.7143" y="286.5002" text-anchor="middle" font-size="21.4549" font-family="Arial, sans-serif" fill="var(--ok-text)">Improve processes</text>
  <line x1="318.5716" y1="221.25" x2="500.7143" y2="221.25" stroke="var(--text)" stroke-width="0.7601" marker-end="url(#arrow)" />
  <line x1="779.2857" y1="221.25" x2="961.4286" y2="221.25" stroke="var(--text)" stroke-width="0.7601" marker-end="url(#arrow)" />
  <path d="M 1100.7143 348.1251 Q 1100.7143 547.5001 640 547.5001 Q 179.2855 547.5001 179.2855 348.1251" fill="none" stroke="var(--text-faint)" stroke-width="0.7085" stroke-dasharray="2.3615 1.4169" marker-end="url(#arrow)" />
  <text x="640" y="620" text-anchor="middle" font-size="21.4549" fill="var(--text-muted)" font-family="Arial, sans-serif">Iterate continuously to build a learning organization</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
</svg>
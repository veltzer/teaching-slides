<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="380" height="519.583333959201" rx="6.595453330226" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="112.499999463542" text-anchor="middle" font-size="26.381812285087" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Old Culture</text>
  <text x="230" y="209.166666845486" text-anchor="middle" font-size="19.786358954861" fill="var(--danger-text)" font-family="Arial, sans-serif">Blame and silos</text>
  <text x="230" y="269.583332886285" text-anchor="middle" font-size="19.786358954861" fill="var(--danger-text)" font-family="Arial, sans-serif">Fear of failure</text>
  <text x="230" y="330" text-anchor="middle" font-size="19.786358954861" fill="var(--danger-text)" font-family="Arial, sans-serif">Manual handoffs</text>
  <text x="230" y="390.416666040799" text-anchor="middle" font-size="19.786358954861" fill="var(--danger-text)" font-family="Arial, sans-serif">Infrequent releases</text>
  <text x="230" y="450.833333154514" text-anchor="middle" font-size="19.786358954861" fill="var(--danger-text)" font-family="Arial, sans-serif">Ops owns uptime</text>
  <text x="230" y="511.250000268229" text-anchor="middle" font-size="19.786358954861" fill="var(--danger-text)" font-family="Arial, sans-serif">Dev throws code</text>

  <rect x="450" y="40" width="380" height="519.583333959201" rx="6.595453330226" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="112.499999463542" text-anchor="middle" font-size="26.381812285087" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Transition</text>
  <text x="640" y="209.166666845486" text-anchor="middle" font-size="19.786358954861" fill="var(--warn-text)" font-family="Arial, sans-serif">Training, coaching</text>
  <text x="640" y="269.583332886285" text-anchor="middle" font-size="19.786358954861" fill="var(--warn-text)" font-family="Arial, sans-serif">Pilot teams</text>
  <text x="640" y="330" text-anchor="middle" font-size="19.786358954861" fill="var(--warn-text)" font-family="Arial, sans-serif">Quick wins visible</text>
  <text x="640" y="390.416666040799" text-anchor="middle" font-size="19.786358954861" fill="var(--warn-text)" font-family="Arial, sans-serif">Shared on-call</text>
  <text x="640" y="450.833333154514" text-anchor="middle" font-size="19.786358954861" fill="var(--warn-text)" font-family="Arial, sans-serif">Blameless postmortem</text>
  <text x="640" y="511.250000268229" text-anchor="middle" font-size="19.786358954861" fill="var(--warn-text)" font-family="Arial, sans-serif">Metrics over opinion</text>

  <rect x="860" y="40" width="380" height="519.583333959201" rx="6.595453330226" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="112.499999463542" text-anchor="middle" font-size="26.381812285087" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">DevOps Culture</text>
  <text x="1050" y="209.166666845486" text-anchor="middle" font-size="19.786358954861" fill="var(--ok-text)" font-family="Arial, sans-serif">Trust and learning</text>
  <text x="1050" y="269.583332886285" text-anchor="middle" font-size="19.786358954861" fill="var(--ok-text)" font-family="Arial, sans-serif">Safe experiments</text>
  <text x="1050" y="330" text-anchor="middle" font-size="19.786358954861" fill="var(--ok-text)" font-family="Arial, sans-serif">You build, you run</text>
  <text x="1050" y="390.416666040799" text-anchor="middle" font-size="19.786358954861" fill="var(--ok-text)" font-family="Arial, sans-serif">Many small releases</text>
  <text x="1050" y="450.833333154514" text-anchor="middle" font-size="19.786358954861" fill="var(--ok-text)" font-family="Arial, sans-serif">Shared goals</text>
  <text x="1050" y="511.250000268229" text-anchor="middle" font-size="19.786358954861" fill="var(--ok-text)" font-family="Arial, sans-serif">Continuous feedback</text>

  <line x1="420" y1="299.791666443142" x2="450" y2="299.791666443142" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="830" y1="299.791666443142" x2="860" y2="299.791666443142" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <text x="640" y="620" text-anchor="middle" font-size="19.786358954861" fill="var(--text-muted)" font-family="Arial, sans-serif">Culture change takes years — tools change in weeks.</text>
</svg>

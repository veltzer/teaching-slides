<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-size="29.714499" font-weight="bold" fill="var(--text)">Cultural Transformation</text>

  <rect x="40" y="79.417476" width="380" height="484.271845" rx="6.367393" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="230" y="146.990291" text-anchor="middle" font-size="25.469571" font-weight="bold" fill="var(--danger-text)">Old Culture</text>
  <text x="230" y="237.087379" text-anchor="middle" font-size="19.102178" fill="var(--danger-text)">Blame and silos</text>
  <text x="230" y="293.398058" text-anchor="middle" font-size="19.102178" fill="var(--danger-text)">Fear of failure</text>
  <text x="230" y="349.708738" text-anchor="middle" font-size="19.102178" fill="var(--danger-text)">Manual handoffs</text>
  <text x="230" y="406.019417" text-anchor="middle" font-size="19.102178" fill="var(--danger-text)">Infrequent releases</text>
  <text x="230" y="462.330097" text-anchor="middle" font-size="19.102178" fill="var(--danger-text)">Ops owns uptime</text>
  <text x="230" y="518.640777" text-anchor="middle" font-size="19.102178" fill="var(--danger-text)">Dev throws code</text>

  <rect x="450" y="79.417476" width="380" height="484.271845" rx="6.367393" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="146.990291" text-anchor="middle" font-size="25.469571" font-weight="bold" fill="var(--warn-text)">Transition</text>
  <text x="640" y="237.087379" text-anchor="middle" font-size="19.102178" fill="var(--warn-text)">Training, coaching</text>
  <text x="640" y="293.398058" text-anchor="middle" font-size="19.102178" fill="var(--warn-text)">Pilot teams</text>
  <text x="640" y="349.708738" text-anchor="middle" font-size="19.102178" fill="var(--warn-text)">Quick wins visible</text>
  <text x="640" y="406.019417" text-anchor="middle" font-size="19.102178" fill="var(--warn-text)">Shared on-call</text>
  <text x="640" y="462.330097" text-anchor="middle" font-size="19.102178" fill="var(--warn-text)">Blameless postmortem</text>
  <text x="640" y="518.640777" text-anchor="middle" font-size="19.102178" fill="var(--warn-text)">Metrics over opinion</text>

  <rect x="860" y="79.417476" width="380" height="484.271845" rx="6.367393" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1050" y="146.990291" text-anchor="middle" font-size="25.469571" font-weight="bold" fill="var(--ok-text)">DevOps Culture</text>
  <text x="1050" y="237.087379" text-anchor="middle" font-size="19.102178" fill="var(--ok-text)">Trust and learning</text>
  <text x="1050" y="293.398058" text-anchor="middle" font-size="19.102178" fill="var(--ok-text)">Safe experiments</text>
  <text x="1050" y="349.708738" text-anchor="middle" font-size="19.102178" fill="var(--ok-text)">You build, you run</text>
  <text x="1050" y="406.019417" text-anchor="middle" font-size="19.102178" fill="var(--ok-text)">Many small releases</text>
  <text x="1050" y="462.330097" text-anchor="middle" font-size="19.102178" fill="var(--ok-text)">Shared goals</text>
  <text x="1050" y="518.640777" text-anchor="middle" font-size="19.102178" fill="var(--ok-text)">Continuous feedback</text>

  <line x1="420" y1="321.553398" x2="450" y2="321.553398" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="830" y1="321.553398" x2="860" y2="321.553398" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="640" y="620" text-anchor="middle" font-size="19.102178" fill="var(--text-muted)">Culture change takes years — tools change in weeks.</text>
</svg>

<svg width="600" height="200" xmlns="http://www.w3.org/2000/svg">
  <rect x="20" y="40" width="150" height="60" fill="#ffebee" stroke="#c00" stroke-width="2" rx="5"/>
  <text x="95" y="60" text-anchor="middle" font-size="10" font-weight="bold">Old Culture</text>
  <text x="95" y="75" text-anchor="middle" font-size="9">Blame, silos</text>
  <text x="95" y="88" text-anchor="middle" font-size="9">Fear of failure</text>
  <rect x="225" y="40" width="150" height="60" fill="#fff3e0" stroke="#e65100" stroke-width="2" rx="5"/>
  <text x="300" y="60" text-anchor="middle" font-size="10" font-weight="bold">Transition</text>
  <text x="300" y="75" text-anchor="middle" font-size="9">Training, pilots</text>
  <text x="300" y="88" text-anchor="middle" font-size="9">Quick wins</text>
  <rect x="430" y="40" width="150" height="60" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="5"/>
  <text x="505" y="60" text-anchor="middle" font-size="10" font-weight="bold">DevOps Culture</text>
  <text x="505" y="75" text-anchor="middle" font-size="9">Trust, learning</text>
  <text x="505" y="88" text-anchor="middle" font-size="9">Experimentation</text>
  <line x1="170" y1="70" x2="225" y2="70" stroke="#333" stroke-width="2" marker-end="url(#arr_ct)"/>
  <line x1="375" y1="70" x2="430" y2="70" stroke="#333" stroke-width="2" marker-end="url(#arr_ct)"/>
  <text x="300" y="140" text-anchor="middle" font-size="10" fill="#555">Culture change is the hardest part of DevOps adoption</text>
  <defs>
    <marker id="arr_ct" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
</svg>

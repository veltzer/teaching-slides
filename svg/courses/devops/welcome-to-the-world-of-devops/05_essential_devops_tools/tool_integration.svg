<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="25.6" font-weight="bold">Tool Integration Pattern</text>
  <rect x="42.6667" y="144" width="320" height="216" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="202.6667" y="208.8" text-anchor="middle" font-size="21.3333" font-weight="bold">Source (Git)</text>
  <text x="202.6667" y="262.8" text-anchor="middle" font-size="21.3333">Commit triggers</text>
  <text x="202.6667" y="309.6" text-anchor="middle" font-size="21.3333">Webhooks + events</text>
  <rect x="480" y="144" width="320" height="216" fill="#fff3e0" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="208.8" text-anchor="middle" font-size="21.3333" font-weight="bold">CI/CD (Jenkins)</text>
  <text x="640" y="262.8" text-anchor="middle" font-size="21.3333">Build + test + deploy</text>
  <text x="640" y="309.6" text-anchor="middle" font-size="21.3333">Artifact registry</text>
  <rect x="917.3333" y="144" width="320" height="216" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1077.3333" y="208.8" text-anchor="middle" font-size="21.3333" font-weight="bold">Infra (K8s)</text>
  <text x="1077.3333" y="262.8" text-anchor="middle" font-size="21.3333">Deploy + monitor</text>
  <text x="1077.3333" y="309.6" text-anchor="middle" font-size="21.3333">Prometheus + Grafana</text>
  <line x1="362.6667" y1="252" x2="480" y2="252" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowd7_04_essential_devops_tools)" />
  <line x1="800" y1="252" x2="917.3333" y2="252" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowd7_04_essential_devops_tools)" />
  <text x="640" y="486" text-anchor="middle" font-size="21.3333" fill="#555">End-to-end automation from commit to production</text>
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arrowd7_04_essential_devops_tools" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <!-- Row 1 -->
  <rect x="40" y="40" width="290" height="227.450980392157" rx="10.664215404617" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="79.803921568628" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.262009268773" font-weight="bold" fill="var(--primary-text)">System</text>
  <text x="60" y="119.607843137255" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--primary-text)">service</text>
  <text x="60" y="148.039215686274" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--primary-text)">user</text>
  <text x="60" y="176.470588235295" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--primary-text)">cron</text>
  <text x="60" y="204.901960784314" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--primary-text)">systemd</text>
  <text x="60" y="233.333333333333" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--primary-text)">mount</text>

  <rect x="345" y="40" width="290" height="227.450980392157" rx="10.664215404617" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="79.803921568628" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.262009268773" font-weight="bold" fill="var(--ok-text)">Files</text>
  <text x="365" y="119.607843137255" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--ok-text)">copy</text>
  <text x="365" y="148.039215686274" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--ok-text)">template</text>
  <text x="365" y="176.470588235295" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--ok-text)">file</text>
  <text x="365" y="204.901960784314" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--ok-text)">lineinfile</text>
  <text x="365" y="233.333333333333" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--ok-text)">fetch</text>

  <rect x="650" y="40" width="290" height="227.450980392157" rx="10.664215404617" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="795" y="79.803921568628" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.262009268773" font-weight="bold" fill="var(--warn-text)">Network</text>
  <text x="670" y="119.607843137255" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--warn-text)">uri</text>
  <text x="670" y="148.039215686274" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--warn-text)">get_url</text>
  <text x="670" y="176.470588235295" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--warn-text)">wait_for</text>
  <text x="670" y="204.901960784314" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--warn-text)">firewalld</text>
  <text x="670" y="233.333333333333" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--warn-text)">iptables</text>

  <rect x="955" y="40" width="285" height="227.450980392157" rx="10.664215404617" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097" y="79.803921568628" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.262009268773" font-weight="bold" fill="var(--info-text)">Cloud</text>
  <text x="975" y="119.607843137255" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--info-text)">ec2_instance</text>
  <text x="975" y="148.039215686274" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--info-text)">s3_bucket</text>
  <text x="975" y="176.470588235295" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--info-text)">azure_rm_vm</text>
  <text x="975" y="204.901960784314" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--info-text)">docker_container</text>
  <text x="975" y="233.333333333333" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--info-text)">k8s</text>

  <!-- Row 2 -->
  <rect x="40" y="290.196078431372" width="290" height="193.333333333333" rx="10.664215404617" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.262009268773" font-weight="bold" fill="var(--danger-text)">Database</text>
  <text x="60" y="369.803921568628" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--danger-text)">mysql_db</text>
  <text x="60" y="398.235294117647" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--danger-text)">postgresql_db</text>
  <text x="60" y="426.666666666667" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--danger-text)">redis</text>
  <text x="60" y="455.098039215686" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--danger-text)">mongodb_user</text>

  <rect x="345" y="290.196078431372" width="290" height="193.333333333333" rx="10.664215404617" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.262009268773" font-weight="bold" fill="var(--ok-text)">Notify</text>
  <text x="365" y="369.803921568628" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--ok-text)">slack</text>
  <text x="365" y="398.235294117647" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--ok-text)">mail</text>
  <text x="365" y="426.666666666667" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--ok-text)">rabbitmq_queue</text>
  <text x="365" y="455.098039215686" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--ok-text)">hipchat</text>

  <rect x="650" y="290.196078431372" width="590" height="193.333333333333" rx="10.664215404617" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.262009268773" font-weight="bold" fill="var(--warn-text)">Ad-Hoc Command</text>
  <text x="670" y="369.803921568628" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--warn-text)">ansible all -m ping</text>
  <text x="670" y="398.235294117647" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--warn-text)">ansible web -m copy -a src=x</text>
  <text x="670" y="426.666666666667" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--warn-text)">ansible-doc -l</text>
  <text x="670" y="460.78431372549" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--warn-text)">pattern / module / args / inventory</text>

  <!-- Bottom -->
  <rect x="40" y="506.274509803922" width="1200" height="113.725490196078" rx="10.664215404617" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="542.666666666667" font-family="Arial, sans-serif" font-size="15.996323106926" font-weight="bold" fill="var(--text)">7000+ modules, idempotent by default</text>
  <text x="60" y="574.509803921569" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--text)">ansible-doc copy</text>
  <text x="60" y="602.941176470588" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--text)">ansible-doc -s copy</text>
  <text x="700" y="574.509803921569" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--text)">-b become  -k ask-pass</text>
  <text x="700" y="602.941176470588" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--text)">--check  --diff  -vvv</text>
</svg>

  <rect x="40" y="82.181818181818" width="290" height="210.909090909091" rx="10.269106361049" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="119.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.511302085994" font-weight="bold" fill="var(--primary-text)">System</text>
  <text x="60" y="156" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--primary-text)">service</text>
  <text x="60" y="182.363636363636" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--primary-text)">user</text>
  <text x="60" y="208.727272727273" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--primary-text)">cron</text>
  <text x="60" y="235.090909090909" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--primary-text)">systemd</text>
  <text x="60" y="261.454545454545" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--primary-text)">mount</text>

  <rect x="345" y="82.181818181818" width="290" height="210.909090909091" rx="10.269106361049" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="119.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.511302085994" font-weight="bold" fill="var(--ok-text)">Files</text>
  <text x="365" y="156" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--ok-text)">copy</text>
  <text x="365" y="182.363636363636" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--ok-text)">template</text>
  <text x="365" y="208.727272727273" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--ok-text)">file</text>
  <text x="365" y="235.090909090909" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--ok-text)">lineinfile</text>
  <text x="365" y="261.454545454545" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--ok-text)">fetch</text>

  <rect x="650" y="82.181818181818" width="290" height="210.909090909091" rx="10.269106361049" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="795" y="119.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.511302085994" font-weight="bold" fill="var(--warn-text)">Network</text>
  <text x="670" y="156" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--warn-text)">uri</text>
  <text x="670" y="182.363636363636" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--warn-text)">get_url</text>
  <text x="670" y="208.727272727273" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--warn-text)">wait_for</text>
  <text x="670" y="235.090909090909" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--warn-text)">firewalld</text>
  <text x="670" y="261.454545454545" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--warn-text)">iptables</text>

  <rect x="955" y="82.181818181818" width="285" height="210.909090909091" rx="10.269106361049" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097" y="119.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.511302085994" font-weight="bold" fill="var(--info-text)">Cloud</text>
  <text x="975" y="156" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--info-text)">ec2_instance</text>
  <text x="975" y="182.363636363636" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--info-text)">s3_bucket</text>
  <text x="975" y="208.727272727273" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--info-text)">azure_rm_vm</text>
  <text x="975" y="235.090909090909" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--info-text)">docker_container</text>
  <text x="975" y="261.454545454545" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--info-text)">k8s</text>

  <!-- Row 2 -->
  <rect x="40" y="314.181818181818" width="290" height="179.272727272727" rx="10.269106361049" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="351.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.511302085994" font-weight="bold" fill="var(--danger-text)">Database</text>
  <text x="60" y="388" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--danger-text)">mysql_db</text>
  <text x="60" y="414.363636363636" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--danger-text)">postgresql_db</text>
  <text x="60" y="440.727272727273" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--danger-text)">redis</text>
  <text x="60" y="467.090909090909" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--danger-text)">mongodb_user</text>

  <rect x="345" y="314.181818181818" width="290" height="179.272727272727" rx="10.269106361049" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="351.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.511302085994" font-weight="bold" fill="var(--ok-text)">Notify</text>
  <text x="365" y="388" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--ok-text)">slack</text>
  <text x="365" y="414.363636363636" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--ok-text)">mail</text>
  <text x="365" y="440.727272727273" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--ok-text)">rabbitmq_queue</text>
  <text x="365" y="467.090909090909" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--ok-text)">hipchat</text>

  <rect x="650" y="314.181818181818" width="590" height="179.272727272727" rx="10.269106361049" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="351.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.511302085994" font-weight="bold" fill="var(--warn-text)">Ad-Hoc Command</text>
  <text x="670" y="388" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--warn-text)">ansible all -m ping</text>
  <text x="670" y="414.363636363636" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--warn-text)">ansible web -m copy -a src=x</text>
  <text x="670" y="440.727272727273" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--warn-text)">ansible-doc -l</text>
  <text x="670" y="472.363636363636" font-family="Arial, sans-serif" font-size="13.349838269364" fill="var(--warn-text)">pattern / module / args / inventory</text>

  <!-- Bottom -->
  <rect x="40" y="514.545454545455" width="1200" height="105.454545454545" rx="10.269106361049" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="548.290909090909" font-family="Arial, sans-serif" font-size="15.403659541574" font-weight="bold" fill="var(--text)">7000+ modules, idempotent by default</text>
  <text x="60" y="577.818181818182" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--text)">ansible-doc copy</text>
  <text x="60" y="604.181818181818" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--text)">ansible-doc -s copy</text>
  <text x="700" y="577.818181818182" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--text)">-b become  -k ask-pass</text>
  <text x="700" y="604.181818181818" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--text)">--check  --diff  -vvv</text>
</svg>

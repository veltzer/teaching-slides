<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="#ffffff"/>

  <!-- Header -->
  <rect x="0" y="0" width="1280" height="52" fill="url(#grad-accent)"/>
  <text x="640" y="34" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">Ansible Module Categories</text>

  <!-- Category grid: 3 cols x 2 rows -->

  <!-- System Modules -->
  <rect x="25" y="65" width="240" height="140" rx="8" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="25" y="65" width="240" height="30" rx="8" fill="url(#grad-accent)"/>
  <rect x="25" y="83" width="240" height="12" fill="url(#grad-accent)"/>
  <text x="145" y="85" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">System</text>
  <text x="40" y="114" font-family="monospace" font-size="12" fill="#1565c0">service</text>
  <text x="150" y="114" font-family="Arial, sans-serif" font-size="11" fill="#555555">Manage services</text>
  <text x="40" y="131" font-family="monospace" font-size="12" fill="#1565c0">user</text>
  <text x="150" y="131" font-family="Arial, sans-serif" font-size="11" fill="#555555">Manage users</text>
  <text x="40" y="148" font-family="monospace" font-size="12" fill="#1565c0">cron</text>
  <text x="150" y="148" font-family="Arial, sans-serif" font-size="11" fill="#555555">Cron jobs</text>
  <text x="40" y="165" font-family="monospace" font-size="12" fill="#1565c0">sysctl</text>
  <text x="150" y="165" font-family="Arial, sans-serif" font-size="11" fill="#555555">Kernel params</text>
  <text x="40" y="182" font-family="monospace" font-size="12" fill="#1565c0">systemd</text>
  <text x="150" y="182" font-family="Arial, sans-serif" font-size="11" fill="#555555">Systemd units</text>
  <text x="40" y="199" font-family="monospace" font-size="12" fill="#1565c0">mount</text>
  <text x="150" y="199" font-family="Arial, sans-serif" font-size="11" fill="#555555">Filesystems</text>

  <!-- Files Modules -->
  <rect x="280" y="65" width="240" height="140" rx="8" fill="url(#grad-surface)" stroke="#43a047" stroke-width="2" filter="url(#shadow)"/>
  <rect x="280" y="65" width="240" height="30" rx="8" fill="url(#grad-green)"/>
  <rect x="280" y="83" width="240" height="12" fill="url(#grad-green)"/>
  <text x="400" y="85" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Files</text>
  <text x="295" y="114" font-family="monospace" font-size="12" fill="#2e7d32">copy</text>
  <text x="385" y="114" font-family="Arial, sans-serif" font-size="11" fill="#555555">Copy files to remote</text>
  <text x="295" y="131" font-family="monospace" font-size="12" fill="#2e7d32">template</text>
  <text x="385" y="131" font-family="Arial, sans-serif" font-size="11" fill="#555555">Jinja2 templates</text>
  <text x="295" y="148" font-family="monospace" font-size="12" fill="#2e7d32">file</text>
  <text x="385" y="148" font-family="Arial, sans-serif" font-size="11" fill="#555555">File attributes</text>
  <text x="295" y="165" font-family="monospace" font-size="12" fill="#2e7d32">lineinfile</text>
  <text x="385" y="165" font-family="Arial, sans-serif" font-size="11" fill="#555555">Manage lines</text>
  <text x="295" y="182" font-family="monospace" font-size="12" fill="#2e7d32">blockinfile</text>
  <text x="385" y="182" font-family="Arial, sans-serif" font-size="11" fill="#555555">Manage blocks</text>
  <text x="295" y="199" font-family="monospace" font-size="12" fill="#2e7d32">fetch</text>
  <text x="385" y="199" font-family="Arial, sans-serif" font-size="11" fill="#555555">Fetch from remote</text>

  <!-- Network/net_tools Modules -->
  <rect x="535" y="65" width="240" height="140" rx="8" fill="url(#grad-surface)" stroke="#fb8c00" stroke-width="2" filter="url(#shadow)"/>
  <rect x="535" y="65" width="240" height="30" rx="8" fill="url(#grad-orange)"/>
  <rect x="535" y="83" width="240" height="12" fill="url(#grad-orange)"/>
  <text x="655" y="85" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Net Tools</text>
  <text x="550" y="114" font-family="monospace" font-size="12" fill="#e65100">uri</text>
  <text x="635" y="114" font-family="Arial, sans-serif" font-size="11" fill="#555555">HTTP requests</text>
  <text x="550" y="131" font-family="monospace" font-size="12" fill="#e65100">get_url</text>
  <text x="635" y="131" font-family="Arial, sans-serif" font-size="11" fill="#555555">Download files</text>
  <text x="550" y="148" font-family="monospace" font-size="12" fill="#e65100">wait_for</text>
  <text x="635" y="148" font-family="Arial, sans-serif" font-size="11" fill="#555555">Wait for port/file</text>
  <text x="550" y="165" font-family="monospace" font-size="12" fill="#e65100">nmcli</text>
  <text x="635" y="165" font-family="Arial, sans-serif" font-size="11" fill="#555555">Network mgr</text>
  <text x="550" y="182" font-family="monospace" font-size="12" fill="#e65100">firewalld</text>
  <text x="635" y="182" font-family="Arial, sans-serif" font-size="11" fill="#555555">Firewall rules</text>
  <text x="550" y="199" font-family="monospace" font-size="12" fill="#e65100">iptables</text>
  <text x="635" y="199" font-family="Arial, sans-serif" font-size="11" fill="#555555">IP tables</text>

  <!-- Cloud Modules -->
  <rect x="790" y="65" width="240" height="140" rx="8" fill="url(#grad-surface)" stroke="#8e24aa" stroke-width="2" filter="url(#shadow)"/>
  <rect x="790" y="65" width="240" height="30" rx="8" fill="url(#grad-purple)"/>
  <rect x="790" y="83" width="240" height="12" fill="url(#grad-purple)"/>
  <text x="910" y="85" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Cloud</text>
  <text x="805" y="114" font-family="monospace" font-size="12" fill="#6a1b9a">ec2_instance</text>
  <text x="920" y="114" font-family="Arial, sans-serif" font-size="11" fill="#555555">AWS EC2</text>
  <text x="805" y="131" font-family="monospace" font-size="12" fill="#6a1b9a">s3_bucket</text>
  <text x="920" y="131" font-family="Arial, sans-serif" font-size="11" fill="#555555">AWS S3</text>
  <text x="805" y="148" font-family="monospace" font-size="12" fill="#6a1b9a">azure_rm_vm</text>
  <text x="920" y="148" font-family="Arial, sans-serif" font-size="11" fill="#555555">Azure VMs</text>
  <text x="805" y="165" font-family="monospace" font-size="12" fill="#6a1b9a">gcp_compute</text>
  <text x="920" y="165" font-family="Arial, sans-serif" font-size="11" fill="#555555">GCP Compute</text>
  <text x="805" y="182" font-family="monospace" font-size="12" fill="#6a1b9a">docker_container</text>
  <text x="920" y="182" font-family="Arial, sans-serif" font-size="11" fill="#555555">Docker</text>
  <text x="805" y="199" font-family="monospace" font-size="12" fill="#6a1b9a">k8s</text>
  <text x="920" y="199" font-family="Arial, sans-serif" font-size="11" fill="#555555">Kubernetes</text>

  <!-- Database Modules -->
  <rect x="25" y="225" width="240" height="115" rx="8" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="25" y="225" width="240" height="30" rx="8" fill="url(#grad-accent)"/>
  <rect x="25" y="243" width="240" height="12" fill="url(#grad-accent)"/>
  <text x="145" y="245" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Database</text>
  <text x="40" y="274" font-family="monospace" font-size="12" fill="#1565c0">mysql_db</text>
  <text x="145" y="274" font-family="Arial, sans-serif" font-size="11" fill="#555555">MySQL databases</text>
  <text x="40" y="291" font-family="monospace" font-size="12" fill="#1565c0">postgresql_db</text>
  <text x="145" y="291" font-family="Arial, sans-serif" font-size="11" fill="#555555">PostgreSQL</text>
  <text x="40" y="308" font-family="monospace" font-size="12" fill="#1565c0">redis</text>
  <text x="145" y="308" font-family="Arial, sans-serif" font-size="11" fill="#555555">Redis commands</text>
  <text x="40" y="325" font-family="monospace" font-size="12" fill="#1565c0">mongodb_user</text>
  <text x="145" y="325" font-family="Arial, sans-serif" font-size="11" fill="#555555">MongoDB</text>

  <!-- Messaging Modules -->
  <rect x="280" y="225" width="240" height="115" rx="8" fill="url(#grad-surface)" stroke="#43a047" stroke-width="2" filter="url(#shadow)"/>
  <rect x="280" y="225" width="240" height="30" rx="8" fill="url(#grad-green)"/>
  <rect x="280" y="243" width="240" height="12" fill="url(#grad-green)"/>
  <text x="400" y="245" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Messaging / Notify</text>
  <text x="295" y="274" font-family="monospace" font-size="12" fill="#2e7d32">slack</text>
  <text x="375" y="274" font-family="Arial, sans-serif" font-size="11" fill="#555555">Slack notification</text>
  <text x="295" y="291" font-family="monospace" font-size="12" fill="#2e7d32">mail</text>
  <text x="375" y="291" font-family="Arial, sans-serif" font-size="11" fill="#555555">Email alerts</text>
  <text x="295" y="308" font-family="monospace" font-size="12" fill="#2e7d32">hipchat</text>
  <text x="375" y="308" font-family="Arial, sans-serif" font-size="11" fill="#555555">HipChat</text>
  <text x="295" y="325" font-family="monospace" font-size="12" fill="#2e7d32">rabbitmq_queue</text>
  <text x="375" y="325" font-family="Arial, sans-serif" font-size="11" fill="#555555">RabbitMQ</text>

  <!-- Ad-Hoc Command Structure -->
  <rect x="535" y="225" width="495" height="115" rx="8" fill="#fffde7" stroke="#fb8c00" stroke-width="2" filter="url(#shadow)"/>
  <rect x="535" y="225" width="495" height="30" rx="8" fill="url(#grad-orange)"/>
  <rect x="535" y="243" width="495" height="12" fill="url(#grad-orange)"/>
  <text x="782" y="245" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Ad-Hoc Command Structure</text>
  <text x="550" y="278" font-family="monospace" font-size="13" fill="#1565c0">ansible</text>
  <text x="610" y="278" font-family="monospace" font-size="13" fill="#2e7d32">all</text>
  <text x="640" y="278" font-family="monospace" font-size="13" fill="#e65100">-m ping</text>
  <text x="710" y="278" font-family="monospace" font-size="13" fill="#6a1b9a">-a "data=hello"</text>
  <text x="870" y="278" font-family="monospace" font-size="13" fill="#555555">-i inventory/</text>
  <text x="550" y="296" font-family="Arial, sans-serif" font-size="11" fill="#888888">command</text>
  <text x="610" y="296" font-family="Arial, sans-serif" font-size="11" fill="#888888">pattern</text>
  <text x="640" y="296" font-family="Arial, sans-serif" font-size="11" fill="#888888">module</text>
  <text x="720" y="296" font-family="Arial, sans-serif" font-size="11" fill="#888888">arguments</text>
  <text x="870" y="296" font-family="Arial, sans-serif" font-size="11" fill="#888888">inventory</text>
  <text x="550" y="320" font-family="monospace" font-size="12" fill="#333333">ansible webservers -m copy -a "src=app.conf dest=/etc/app.conf" --become</text>
  <text x="550" y="337" font-family="monospace" font-size="12" fill="#333333">ansible-doc -l                  # list all modules</text>

  <!-- Module Documentation -->
  <rect x="25" y="358" width="1005" height="88" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="40" y="381" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2e7d32">Module Documentation Lookup</text>
  <text x="40" y="402" font-family="monospace" font-size="12" fill="#333333">ansible-doc copy</text>
  <text x="250" y="402" font-family="Arial, sans-serif" font-size="11" fill="#555555"># full module docs in terminal</text>
  <text x="40" y="420" font-family="monospace" font-size="12" fill="#333333">ansible-doc -s copy</text>
  <text x="250" y="420" font-family="Arial, sans-serif" font-size="11" fill="#555555"># short synopsis/snippet</text>
  <text x="550" y="402" font-family="monospace" font-size="12" fill="#333333">ansible-doc community.general.json_query</text>
  <text x="550" y="420" font-family="monospace" font-size="12" fill="#333333">ansible-doc -t filter ansible.builtin.items2dict</text>

  <!-- Key stats box -->
  <rect x="1045" y="65" width="210" height="380" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="1045" y="65" width="210" height="30" rx="8" fill="url(#grad-accent)"/>
  <rect x="1045" y="83" width="210" height="12" fill="url(#grad-accent)"/>
  <text x="1150" y="85" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Quick Facts</text>
  <text x="1060" y="115" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1565c0">7,000+ modules</text>
  <text x="1060" y="133" font-family="Arial, sans-serif" font-size="11" fill="#555555">in Ansible collections</text>
  <line x1="1060" y1="145" x2="1240" y2="145" stroke="#bbdefb" stroke-width="1"/>
  <text x="1060" y="163" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1565c0">Idempotent</text>
  <text x="1060" y="181" font-family="Arial, sans-serif" font-size="11" fill="#555555">Most modules check</text>
  <text x="1060" y="197" font-family="Arial, sans-serif" font-size="11" fill="#555555">state before acting</text>
  <line x1="1060" y1="209" x2="1240" y2="209" stroke="#bbdefb" stroke-width="1"/>
  <text x="1060" y="227" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1565c0">Return Values</text>
  <text x="1060" y="245" font-family="Arial, sans-serif" font-size="11" fill="#555555">changed: true/false</text>
  <text x="1060" y="263" font-family="Arial, sans-serif" font-size="11" fill="#555555">failed: true/false</text>
  <text x="1060" y="281" font-family="Arial, sans-serif" font-size="11" fill="#555555">rc: return code</text>
  <text x="1060" y="299" font-family="Arial, sans-serif" font-size="11" fill="#555555">stdout / stderr</text>
  <line x1="1060" y1="311" x2="1240" y2="311" stroke="#bbdefb" stroke-width="1"/>
  <text x="1060" y="329" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1565c0">Common Flags</text>
  <text x="1060" y="347" font-family="monospace" font-size="11" fill="#333333">-b / --become</text>
  <text x="1060" y="363" font-family="monospace" font-size="11" fill="#333333">-k (ask pass)</text>
  <text x="1060" y="379" font-family="monospace" font-size="11" fill="#333333">-K (ask sudo)</text>
  <text x="1060" y="395" font-family="monospace" font-size="11" fill="#333333">-v / -vvv</text>
  <text x="1060" y="411" font-family="monospace" font-size="11" fill="#333333">--check (dry run)</text>
  <text x="1060" y="427" font-family="monospace" font-size="11" fill="#333333">--diff</text>
</svg>

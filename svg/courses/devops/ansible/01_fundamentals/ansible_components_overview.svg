<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="1200" height="580" rx="6.367071" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="40" y="40" width="1200" height="49.212106" rx="6.367071" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="71.636362" width="1200" height="17.575744" rx="6.367071" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="72.515198" text-anchor="middle" font-size="23.977008" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Ansible Ecosystem</text>
  <rect x="73.870968" y="119.090904" width="348.387097" height="474.545425" rx="6.367071" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="73.870968" y="119.090904" width="348.387097" height="40.424288" rx="6.367071" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="73.870968" y="141.939448" width="348.387097" height="17.575744" rx="6.367071" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="248.064516" y="147.212139" text-anchor="middle" font-size="18.443918" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Core Tools</text>
  <text x="248.064516" y="203.454499" text-anchor="middle" font-size="16.599483" fill="var(--text)" font-family="Arial, sans-serif">ansible</text>
  <text x="248.064516" y="243.878787" text-anchor="middle" font-size="16.599483" fill="var(--text)" font-family="Arial, sans-serif">ansible-playbook</text>
  <text x="248.064516" y="284.303076" text-anchor="middle" font-size="16.599483" fill="var(--text)" font-family="Arial, sans-serif">ansible-galaxy</text>
  <text x="248.064516" y="324.727255" text-anchor="middle" font-size="16.599483" fill="var(--text)" font-family="Arial, sans-serif">ansible-vault</text>
  <text x="248.064516" y="365.151543" text-anchor="middle" font-size="16.599483" fill="var(--text)" font-family="Arial, sans-serif">ansible-doc</text>
  <text x="248.064516" y="405.575832" text-anchor="middle" font-size="16.599483" fill="var(--text)" font-family="Arial, sans-serif">ansible-pull</text>
  <text x="248.064516" y="445.999902" text-anchor="middle" font-size="16.599483" fill="var(--text)" font-family="Arial, sans-serif">ansible-lint</text>
  <text x="248.064516" y="486.42419" text-anchor="middle" font-size="16.599483" fill="var(--text)" font-family="Arial, sans-serif">ansible-navigator</text>
  <rect x="465.806452" y="119.090904" width="348.387097" height="474.545425" rx="6.367071" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="465.806452" y="119.090904" width="348.387097" height="40.424288" rx="6.367071" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="465.806452" y="141.939448" width="348.387097" height="17.575744" rx="6.367071" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="147.212139" text-anchor="middle" font-size="18.443918" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Content</text>
  <text x="640" y="203.454499" text-anchor="middle" font-size="16.599483" fill="var(--text)" font-family="Arial, sans-serif">Playbooks</text>
  <text x="640" y="243.878787" text-anchor="middle" font-size="16.599483" fill="var(--text)" font-family="Arial, sans-serif">Roles</text>
  <text x="640" y="284.303076" text-anchor="middle" font-size="16.599483" fill="var(--text)" font-family="Arial, sans-serif">Collections</text>
  <text x="640" y="324.727255" text-anchor="middle" font-size="16.599483" fill="var(--text)" font-family="Arial, sans-serif">Modules</text>
  <text x="640" y="365.151543" text-anchor="middle" font-size="16.599483" fill="var(--text)" font-family="Arial, sans-serif">Plugins</text>
  <text x="640" y="405.575832" text-anchor="middle" font-size="16.599483" fill="var(--text)" font-family="Arial, sans-serif">Filters</text>
  <text x="640" y="445.999902" text-anchor="middle" font-size="16.599483" fill="var(--text)" font-family="Arial, sans-serif">Inventory</text>
  <text x="640" y="486.42419" text-anchor="middle" font-size="16.599483" fill="var(--text)" font-family="Arial, sans-serif">Vault secrets</text>
  <rect x="857.741935" y="119.090904" width="348.387097" height="474.545425" rx="6.367071" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="857.741935" y="119.090904" width="348.387097" height="40.424288" rx="6.367071" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="857.741935" y="141.939448" width="348.387097" height="17.575744" rx="6.367071" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1031.935484" y="147.212139" text-anchor="middle" font-size="18.443918" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Platform</text>
  <text x="1031.935484" y="203.454499" text-anchor="middle" font-size="16.599483" fill="var(--text)" font-family="Arial, sans-serif">AWX / Tower</text>
  <text x="1031.935484" y="243.878787" text-anchor="middle" font-size="16.599483" fill="var(--text)" font-family="Arial, sans-serif">Ansible Galaxy</text>
  <text x="1031.935484" y="284.303076" text-anchor="middle" font-size="16.599483" fill="var(--text)" font-family="Arial, sans-serif">Execution Environments</text>
  <text x="1031.935484" y="324.727255" text-anchor="middle" font-size="16.599483" fill="var(--text)" font-family="Arial, sans-serif">Navigator</text>
  <text x="1031.935484" y="365.151543" text-anchor="middle" font-size="16.599483" fill="var(--text)" font-family="Arial, sans-serif">Automation Hub</text>
  <text x="1031.935484" y="405.575832" text-anchor="middle" font-size="16.599483" fill="var(--text)" font-family="Arial, sans-serif">Controller API</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" rx="6.367071" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="40" y="40" width="1200" height="49.212106" rx="6.367071" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="40" y="71.636362" width="1200" height="17.575744" rx="6.367071" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="72.515198" text-anchor="middle" font-size="23.977008" fill="var(--bg)" font-weight="bold">Ansible Ecosystem</text>
  <rect x="73.870968" y="119.090904" width="348.387097" height="474.545425" rx="6.367071" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="73.870968" y="119.090904" width="348.387097" height="40.424288" rx="6.367071" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="73.870968" y="141.939448" width="348.387097" height="17.575744" rx="6.367071" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="248.064516" y="147.212139" text-anchor="middle" font-size="18.443918" fill="var(--bg)" font-weight="bold">Core Tools</text>
  <text x="248.064516" y="203.454499" text-anchor="middle" font-size="16.599483" fill="var(--text)">ansible</text>
  <text x="248.064516" y="243.878787" text-anchor="middle" font-size="16.599483" fill="var(--text)">ansible-playbook</text>
  <text x="248.064516" y="284.303076" text-anchor="middle" font-size="16.599483" fill="var(--text)">ansible-galaxy</text>
  <text x="248.064516" y="324.727255" text-anchor="middle" font-size="16.599483" fill="var(--text)">ansible-vault</text>
  <text x="248.064516" y="365.151543" text-anchor="middle" font-size="16.599483" fill="var(--text)">ansible-doc</text>
  <text x="248.064516" y="405.575832" text-anchor="middle" font-size="16.599483" fill="var(--text)">ansible-pull</text>
  <text x="248.064516" y="445.999902" text-anchor="middle" font-size="16.599483" fill="var(--text)">ansible-lint</text>
  <text x="248.064516" y="486.42419" text-anchor="middle" font-size="16.599483" fill="var(--text)">ansible-navigator</text>
  <rect x="465.806452" y="119.090904" width="348.387097" height="474.545425" rx="6.367071" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="465.806452" y="119.090904" width="348.387097" height="40.424288" rx="6.367071" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="465.806452" y="141.939448" width="348.387097" height="17.575744" rx="6.367071" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="147.212139" text-anchor="middle" font-size="18.443918" fill="var(--bg)" font-weight="bold">Content</text>
  <text x="640" y="203.454499" text-anchor="middle" font-size="16.599483" fill="var(--text)">Playbooks</text>
  <text x="640" y="243.878787" text-anchor="middle" font-size="16.599483" fill="var(--text)">Roles</text>
  <text x="640" y="284.303076" text-anchor="middle" font-size="16.599483" fill="var(--text)">Collections</text>
  <text x="640" y="324.727255" text-anchor="middle" font-size="16.599483" fill="var(--text)">Modules</text>
  <text x="640" y="365.151543" text-anchor="middle" font-size="16.599483" fill="var(--text)">Plugins</text>
  <text x="640" y="405.575832" text-anchor="middle" font-size="16.599483" fill="var(--text)">Filters</text>
  <text x="640" y="445.999902" text-anchor="middle" font-size="16.599483" fill="var(--text)">Inventory</text>
  <text x="640" y="486.42419" text-anchor="middle" font-size="16.599483" fill="var(--text)">Vault secrets</text>
  <rect x="857.741935" y="119.090904" width="348.387097" height="474.545425" rx="6.367071" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="857.741935" y="119.090904" width="348.387097" height="40.424288" rx="6.367071" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>

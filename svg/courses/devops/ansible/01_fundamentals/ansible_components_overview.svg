<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="58.75" y="56.1111" width="1162.5" height="531.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="58.75" y="56.1111" width="1162.5" height="45.1111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="58.75" y="85.1111" width="1162.5" height="16.1111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="85.9167" text-anchor="middle" font-size="22.5947" fill="var(--bg)" font-weight="bold">Ansible Ecosystem</text>
  <rect x="91.5625" y="128.6111" width="337.5" height="435" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="91.5625" y="128.6111" width="337.5" height="37.0556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="91.5625" y="149.5556" width="337.5" height="16.1111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="260.3125" y="154.3889" text-anchor="middle" font-size="17.3806" fill="var(--bg)" font-weight="bold">Core Tools</text>
  <text x="260.3125" y="205.9444" text-anchor="middle" font-size="15.6425" fill="var(--text)">ansible</text>
  <text x="260.3125" y="243" text-anchor="middle" font-size="15.6425" fill="var(--text)">ansible-playbook</text>
  <text x="260.3125" y="280.0556" text-anchor="middle" font-size="15.6425" fill="var(--text)">ansible-galaxy</text>
  <text x="260.3125" y="317.1111" text-anchor="middle" font-size="15.6425" fill="var(--text)">ansible-vault</text>
  <text x="260.3125" y="354.1667" text-anchor="middle" font-size="15.6425" fill="var(--text)">ansible-doc</text>
  <text x="260.3125" y="391.2223" text-anchor="middle" font-size="15.6425" fill="var(--text)">ansible-pull</text>
  <text x="260.3125" y="428.2777" text-anchor="middle" font-size="15.6425" fill="var(--text)">ansible-lint</text>
  <text x="260.3125" y="465.3333" text-anchor="middle" font-size="15.6425" fill="var(--text)">ansible-navigator</text>
  <rect x="471.25" y="128.6111" width="337.5" height="435" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="471.25" y="128.6111" width="337.5" height="37.0556" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="471.25" y="149.5556" width="337.5" height="16.1111" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="154.3889" text-anchor="middle" font-size="17.3806" fill="var(--bg)" font-weight="bold">Content</text>
  <text x="640" y="205.9444" text-anchor="middle" font-size="15.6425" fill="var(--text)">Playbooks</text>
  <text x="640" y="243" text-anchor="middle" font-size="15.6425" fill="var(--text)">Roles</text>
  <text x="640" y="280.0556" text-anchor="middle" font-size="15.6425" fill="var(--text)">Collections</text>
  <text x="640" y="317.1111" text-anchor="middle" font-size="15.6425" fill="var(--text)">Modules</text>
  <text x="640" y="354.1667" text-anchor="middle" font-size="15.6425" fill="var(--text)">Plugins</text>
  <text x="640" y="391.2223" text-anchor="middle" font-size="15.6425" fill="var(--text)">Filters</text>
  <text x="640" y="428.2777" text-anchor="middle" font-size="15.6425" fill="var(--text)">Inventory</text>
  <text x="640" y="465.3333" text-anchor="middle" font-size="15.6425" fill="var(--text)">Vault secrets</text>
  <rect x="850.9375" y="128.6111" width="337.5" height="435" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="850.9375" y="128.6111" width="337.5" height="37.0556" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="850.9375" y="149.5556" width="337.5" height="16.1111" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1019.6875" y="154.3889" text-anchor="middle" font-size="17.3806" fill="var(--bg)" font-weight="bold">Platform</text>
  <text x="1019.6875" y="205.9444" text-anchor="middle" font-size="15.6425" fill="var(--text)">AWX / Tower</text>
  <text x="1019.6875" y="243" text-anchor="middle" font-size="15.6425" fill="var(--text)">Ansible Galaxy</text>
  <text x="1019.6875" y="280.0556" text-anchor="middle" font-size="15.6425" fill="var(--text)">Execution Environments</text>
  <text x="1019.6875" y="317.1111" text-anchor="middle" font-size="15.6425" fill="var(--text)">Navigator</text>
  <text x="1019.6875" y="354.1667" text-anchor="middle" font-size="15.6425" fill="var(--text)">Automation Hub</text>
  <text x="1019.6875" y="391.2223" text-anchor="middle" font-size="15.6425" fill="var(--text)">Controller API</text>
</svg>
  <text x="1031.935484" y="147.212139" text-anchor="middle" font-size="18.443918" fill="var(--bg)" font-weight="bold">Platform</text>
  <text x="1031.935484" y="203.454499" text-anchor="middle" font-size="16.599483" fill="var(--text)">AWX / Tower</text>
  <text x="1031.935484" y="243.878787" text-anchor="middle" font-size="16.599483" fill="var(--text)">Ansible Galaxy</text>
  <text x="1031.935484" y="284.303076" text-anchor="middle" font-size="16.599483" fill="var(--text)">Execution Environments</text>
  <text x="1031.935484" y="324.727255" text-anchor="middle" font-size="16.599483" fill="var(--text)">Navigator</text>
  <text x="1031.935484" y="365.151543" text-anchor="middle" font-size="16.599483" fill="var(--text)">Automation Hub</text>
  <text x="1031.935484" y="405.575832" text-anchor="middle" font-size="16.599483" fill="var(--text)">Controller API</text>
</svg>
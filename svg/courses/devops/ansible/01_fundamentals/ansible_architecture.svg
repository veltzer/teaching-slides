  <ns0:text x="586.6667" y="320" font-size="14.2222" fill="#1565c0" font-weight="600">SSH / WinRM</ns0:text>
  <ns0:rect x="53.3333" y="362.6667" width="444.4444" height="177.7778" rx="8.8889" fill="url(#grad-surface)" stroke="#43a047" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:rect x="53.3333" y="362.6667" width="444.4444" height="42.6667" rx="8.8889" fill="#43a047" />
  <ns0:rect x="53.3333" y="389.3333" width="444.4444" height="16" rx="0" fill="#43a047" />
  <ns0:text x="275.5556" y="391.1111" text-anchor="middle" font-size="19.5556" fill="#ffffff" font-weight="bold">Managed Node 1</ns0:text>
  <ns0:text x="275.5556" y="435.5556" text-anchor="middle" font-size="16" fill="#555">(web server)</ns0:text>

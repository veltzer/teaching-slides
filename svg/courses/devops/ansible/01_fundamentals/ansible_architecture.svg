  <ns0:text x="568.8889" y="217.7778" text-anchor="middle" font-size="16" fill="#333">ansible-galaxy</ns0:text>
  <ns0:text x="568.8889" y="248.8889" text-anchor="middle" font-size="16" fill="#333">ansible-vault</ns0:text>

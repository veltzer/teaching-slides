  <ns0:text x="862.2222" y="391.1111" text-anchor="middle" font-size="19.5556" fill="#ffffff" font-weight="bold">Managed Node 2</ns0:text>
  <ns0:text x="862.2222" y="435.5556" text-anchor="middle" font-size="16" fill="#555">(db server)</ns0:text>
  <ns0:text x="862.2222" y="469.3333" text-anchor="middle" font-size="14.2222" fill="#1565c0">Python required (SSH only)</ns0:text>
  <ns0:text x="862.2222" y="502.2222" text-anchor="middle" font-size="13.3333" fill="#888">No agent needed</ns0:text>
</ns0:svg>
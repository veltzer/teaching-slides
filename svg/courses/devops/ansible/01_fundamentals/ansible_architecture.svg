<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="381.379342" y="40" width="517.241317" height="265.492934" rx="7.096094" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="381.379342" y="40" width="517.241317" height="53.098612" rx="7.096094" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="381.379342" y="72.675962" width="517.241317" height="20.422524" rx="7.096094" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000055" y="75.739385" text-anchor="middle" font-size="24.666733" fill="var(--bg)" font-weight="bold">Control Node</text>
  <text x="640.000055" y="131.90142" text-anchor="middle" font-size="18.500109" fill="var(--text-muted)">(your laptop / jump host)</text>
  <text x="640.000055" y="177.852129" text-anchor="middle" font-size="18.500109" fill="var(--text)">ansible</text>
  <text x="640.000055" y="213.591514" text-anchor="middle" font-size="18.500109" fill="var(--text)">ansible-playbook</text>
  <text x="640.000055" y="249.330899" text-anchor="middle" font-size="18.500109" fill="var(--text)">ansible-galaxy</text>
  <text x="640.000055" y="285.07041" text-anchor="middle" font-size="18.500109" fill="var(--text)">ansible-vault</text>
  <line x1="640.000055" y1="307.535047" x2="640.000055" y2="407.605678" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="660.689712" y="366.760504" font-size="16.444489" fill="var(--primary-accent)" font-weight="600">SSH / WinRM</text>
  <rect x="40" y="415.774637" width="517.241317" height="204.225363" rx="7.096094" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="40" y="415.774637" width="517.241317" height="49.014133" rx="7.096094" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="446.408359" width="517.241317" height="18.380284" rx="7.096094" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="298.620713" y="448.450599" text-anchor="middle" font-size="22.611231" fill="var(--bg)" font-weight="bold">Managed Node 1</text>
  <text x="298.620713" y="499.507098" text-anchor="middle" font-size="18.500109" fill="var(--text-muted)">(web server)</text>
  <text x="298.620713" y="538.309779" text-anchor="middle" font-size="16.444489" fill="var(--primary-accent)">Python required (SSH only)</text>
  <text x="298.620713" y="576.09153" text-anchor="middle" font-size="15.416738" fill="var(--text-faint)">No agent needed</text>
  <rect x="722.758683" y="415.774637" width="517.241317" height="204.225363" rx="7.096094" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="722.758683" y="415.774637" width="517.241317" height="49.014133" rx="7.096094" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="722.758683" y="446.408359" width="517.241317" height="18.380284" rx="7.096094" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="981.379397" y="448.450599" text-anchor="middle" font-size="22.611231" fill="var(--bg)" font-weight="bold">Managed Node 2</text>
  <text x="981.379397" y="499.507098" text-anchor="middle" font-size="18.500109" fill="var(--text-muted)">(db server)</text>
  <text x="981.379397" y="538.309779" text-anchor="middle" font-size="16.444489" fill="var(--primary-accent)">Python required (SSH only)</text>
  <text x="981.379397" y="576.09153" text-anchor="middle" font-size="15.416738" fill="var(--text-faint)">No agent needed</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="381.379342" y="40" width="517.241317" height="265.492934" rx="7.096094" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="381.379342" y="40" width="517.241317" height="53.098612" rx="7.096094" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="381.379342" y="72.675962" width="517.241317" height="20.422524" rx="7.096094" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000055" y="75.739385" text-anchor="middle" font-size="24.666733" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Control Node</text>
  <text x="640.000055" y="131.90142" text-anchor="middle" font-size="18.500109" fill="var(--text-muted)" font-family="Arial, sans-serif">(your laptop / jump host)</text>
  <text x="640.000055" y="177.852129" text-anchor="middle" font-size="18.500109" fill="var(--text)" font-family="Arial, sans-serif">ansible</text>
  <text x="640.000055" y="213.591514" text-anchor="middle" font-size="18.500109" fill="var(--text)" font-family="Arial, sans-serif">ansible-playbook</text>
  <text x="640.000055" y="249.330899" text-anchor="middle" font-size="18.500109" fill="var(--text)" font-family="Arial, sans-serif">ansible-galaxy</text>
  <text x="640.000055" y="285.07041" text-anchor="middle" font-size="18.500109" fill="var(--text)" font-family="Arial, sans-serif">ansible-vault</text>
  <line x1="640.000055" y1="307.535047" x2="640.000055" y2="407.605678" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <text x="660.689712" y="366.760504" font-size="16.444489" fill="var(--primary-accent)" font-weight="600" font-family="Arial, sans-serif">SSH / WinRM</text>
  <rect x="40" y="415.774637" width="517.241317" height="204.225363" rx="7.096094" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="40" y="415.774637" width="517.241317" height="49.014133" rx="7.096094" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="446.408359" width="517.241317" height="18.380284" rx="7.096094" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="298.620713" y="448.450599" text-anchor="middle" font-size="22.611231" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Managed Node 1</text>
  <text x="298.620713" y="499.507098" text-anchor="middle" font-size="18.500109" fill="var(--text-muted)" font-family="Arial, sans-serif">(web server)</text>
  <text x="298.620713" y="538.309779" text-anchor="middle" font-size="16.444489" fill="var(--primary-accent)" font-family="Arial, sans-serif">Python required (SSH only)</text>
  <text x="298.620713" y="576.09153" text-anchor="middle" font-size="15.416738" fill="var(--text-faint)" font-family="Arial, sans-serif">No agent needed</text>
  <rect x="722.758683" y="415.774637" width="517.241317" height="204.225363" rx="7.096094" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="722.758683" y="415.774637" width="517.241317" height="49.014133" rx="7.096094" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="722.758683" y="446.408359" width="517.241317" height="18.380284" rx="7.096094" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="981.379397" y="448.450599" text-anchor="middle" font-size="22.611231" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Managed Node 2</text>
  <text x="981.379397" y="499.507098" text-anchor="middle" font-size="18.500109" fill="var(--text-muted)" font-family="Arial, sans-serif">(db server)</text>
  <text x="981.379397" y="538.309779" text-anchor="middle" font-size="16.444489" fill="var(--primary-accent)" font-family="Arial, sans-serif">Python required (SSH only)</text>
  <text x="981.379397" y="576.09153" text-anchor="middle" font-size="15.416738" fill="var(--text-faint)" font-family="Arial, sans-serif">No agent needed</text>
</svg>

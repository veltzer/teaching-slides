<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect width="1137.7778" height="7.1111" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <circle cx="568.8889" cy="266.6667" r="133.3333" fill="var(--primary-accent)" filter="url(#shadow)" />
  <circle cx="568.8889" cy="266.6667" r="126.2222" fill="var(--primary-fill)" />
  <polygon points="568.8889,155.5556 613.3333,351.1111 599.1111,351.1111 568.8889,255.1111 538.6667,351.1111 524.4444,351.1111" fill="var(--bg)" />
  <line x1="547.5556" y1="303.1111" x2="602.6667" y2="333.3333" stroke="var(--bg)" stroke-width="2" stroke-linecap="round" />
  <g opacity="0.55" filter="url(#shadow)">
    <rect x="53.3333" y="240" width="168.8889" height="96" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
    <text x="67.5556" y="264.8889" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">---</text>
    <text x="67.5556" y="282.6667" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">- hosts: all</text>
    <text x="67.5556" y="300.4444" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">  tasks:</text>
    <text x="67.5556" y="318.2222" font-family="monospace" font-size="12.4444" fill="var(--text-faint)">    - name: ...</text>
  </g>
  <g opacity="0.55" filter="url(#shadow)">
    <rect x="915.5556" y="240" width="168.8889" height="96" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
    <text x="929.7778" y="264.8889" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">---</text>
    <text x="929.7778" y="282.6667" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">- role: web</text>
    <text x="929.7778" y="300.4444" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">  vars:</text>
    <text x="929.7778" y="318.2222" font-family="monospace" font-size="12.4444" fill="var(--text-faint)">    port: 80</text>
  </g>
  <line x1="222.2222" y1="288" x2="435.5556" y2="288" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="8.8889 4.4444" opacity="0.5" />
  <line x1="702.2222" y1="288" x2="915.5556" y2="288" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="8.8889 4.4444" opacity="0.5" />
  <rect x="0" y="453.3333" width="1137.7778" height="53.3333" fill="var(--primary-fill)" opacity="0.08" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="568.8889" y="488.8889" text-anchor="middle" font-size="19.5556" fill="var(--primary-accent)" font-weight="600" letter-spacing="3">AUTOMATION FOR EVERYONE</text>
  <rect x="426.6667" y="542.2222" width="284.4444" height="4.4444" rx="6" fill="var(--primary-fill)" opacity="0.5" stroke="var(--primary-border)" stroke-width="2"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- accent header bar -->
  <rect width="1280" height="8" fill="url(#grad-accent)"/>

  <!-- central Ansible logo circle -->
  <circle cx="640" cy="300" r="150" fill="#1565c0" filter="url(#shadow)"/>
  <circle cx="640" cy="300" r="142" fill="#1e88e5"/>
  <!-- stylised "A" mark -->
  <polygon points="640,175 690,395 674,395 640,287 606,395 590,395" fill="#ffffff"/>
  <line x1="616" y1="341" x2="678" y2="375" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>

  <!-- decorative playbook snippets -->
  <g opacity="0.55" filter="url(#shadow)">
    <rect x="60" y="270" width="190" height="108" rx="6" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.5"/>
    <text x="76" y="298" font-family="monospace" font-size="14" fill="#1565c0">---</text>
    <text x="76" y="318" font-family="monospace" font-size="14" fill="#555">- hosts: all</text>
    <text x="76" y="338" font-family="monospace" font-size="14" fill="#555">  tasks:</text>
    <text x="76" y="358" font-family="monospace" font-size="14" fill="#888">    - name: ...</text>
  </g>
  <g opacity="0.55" filter="url(#shadow)">
    <rect x="1030" y="270" width="190" height="108" rx="6" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.5"/>
    <text x="1046" y="298" font-family="monospace" font-size="14" fill="#1565c0">---</text>
    <text x="1046" y="318" font-family="monospace" font-size="14" fill="#555">- role: web</text>
    <text x="1046" y="338" font-family="monospace" font-size="14" fill="#555">  vars:</text>
    <text x="1046" y="358" font-family="monospace" font-size="14" fill="#888">    port: 80</text>
  </g>

  <!-- dashed connection lines -->
  <line x1="250" y1="324" x2="490" y2="324" stroke="#1e88e5" stroke-width="2.5" stroke-dasharray="10 5" opacity="0.5"/>
  <line x1="790" y1="324" x2="1030" y2="324" stroke="#1e88e5" stroke-width="2.5" stroke-dasharray="10 5" opacity="0.5"/>

  <!-- subtitle band -->
  <rect x="0" y="510" width="1280" height="60" fill="url(#grad-accent)" opacity="0.08"/>
  <text x="640" y="550" text-anchor="middle" font-size="22" fill="#1565c0" font-weight="600" letter-spacing="3">AUTOMATION FOR EVERYONE</text>

  <!-- bottom accent line -->
  <rect x="480" y="610" width="320" height="5" rx="2" fill="url(#grad-accent)" opacity="0.5"/>
</svg>

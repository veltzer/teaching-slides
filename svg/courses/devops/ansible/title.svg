<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect width="1200" height="6.4444" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2" x="40" y="40" filter="url(#shadow)"/>
  <circle cx="640" cy="281.6667" r="130.3541" fill="var(--primary-accent)" filter="url(#shadow)" />
  <circle cx="640" cy="281.6667" r="123.4018" fill="var(--primary-fill)" />
  <polygon points="640,180.9723 686.875,358.1944 671.875,358.1944 640,271.1944 608.125,358.1944 593.1249,358.1944" fill="var(--bg)" />
  <line x1="617.5" y1="314.6944" x2="675.625" y2="342.0833" stroke="var(--bg)" stroke-width="2" stroke-linecap="round" />
  <g opacity="0.55" filter="url(#shadow)">
    <rect x="96.25" y="257.5" width="178.125" height="87" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
    <text x="111.25" y="280.0556" font-family="monospace" font-size="12.1663" fill="var(--primary-accent)">---</text>
    <text x="111.25" y="296.1667" font-family="monospace" font-size="12.1663" fill="var(--text-muted)">- hosts: all</text>
    <text x="111.25" y="312.2777" font-family="monospace" font-size="12.1663" fill="var(--text-muted)">  tasks:</text>
    <text x="111.25" y="328.3889" font-family="monospace" font-size="12.1663" fill="var(--text-faint)">    - name: ...</text>
  </g>
  <g opacity="0.55" filter="url(#shadow)">
    <rect x="1005.625" y="257.5" width="178.125" height="87" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
    <text x="1020.625" y="280.0556" font-family="monospace" font-size="12.1663" fill="var(--primary-accent)">---</text>
    <text x="1020.625" y="296.1667" font-family="monospace" font-size="12.1663" fill="var(--text-muted)">- role: web</text>
    <text x="1020.625" y="312.2777" font-family="monospace" font-size="12.1663" fill="var(--text-muted)">  vars:</text>
    <text x="1020.625" y="328.3889" font-family="monospace" font-size="12.1663" fill="var(--text-faint)">    port: 80</text>
  </g>
  <line x1="274.375" y1="301" x2="499.375" y2="301" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="8.8889 4.4444" opacity="0.5" />
  <line x1="780.625" y1="301" x2="1005.625" y2="301" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="8.8889 4.4444" opacity="0.5" />
  <rect x="40" y="450.8333" width="1200" height="48.3333" fill="var(--primary-fill)" opacity="0.08" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="483.0556" text-anchor="middle" font-size="19.1186" fill="var(--primary-accent)" font-weight="600" letter-spacing="3">AUTOMATION FOR EVERYONE</text>
  <rect x="490" y="531.3889" width="299.9999" height="4.0277" rx="6" fill="var(--primary-fill)" opacity="0.5" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <polygon points="53.3333,408.8889 1084.4444,408.8889 1137.7778,551.1111 0,551.1111" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.7778" />
  <text x="568.8889" y="487.1111" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--primary-accent)">Unit Tests</text>
  <text x="568.8889" y="517.3333" text-anchor="middle" font-size="15.1111" fill="var(--text)">module tests, filter tests, ansible-test units</text>
  <polygon points="146.6667,266.6667 991.1111,266.6667 1084.4444,408.8889 53.3333,408.8889" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.7778" />
  <text x="568.8889" y="344.8889" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--ok-accent)">Linting &amp; Syntax</text>
  <text x="568.8889" y="375.1111" text-anchor="middle" font-size="15.1111" fill="var(--text)">ansible-lint, yamllint, molecule syntax</text>
  <polygon points="253.3333,149.3333 884.4444,149.3333 991.1111,266.6667 146.6667,266.6667" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.7778" />
  <text x="568.8889" y="215.1111" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--warn-accent)">Functional Tests</text>
  <text x="568.8889" y="245.3333" text-anchor="middle" font-size="15.1111" fill="var(--text)">Molecule + testinfra / ansible verifier</text>
  <polygon points="355.5556,48.8889 782.2222,48.8889 884.4444,149.3333 253.3333,149.3333" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.7778" />
  <text x="568.8889" y="103.1111" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--danger-accent)">Integration Tests</text>
  <text x="568.8889" y="133.3333" text-anchor="middle" font-size="15.1111" fill="var(--text)">full stack, multi-host, staging</text>
  <text x="1066.6667" y="88.8889" text-anchor="middle" font-size="12.4444" fill="var(--text-faint)">Slow</text>
  <text x="1066.6667" y="124.4444" text-anchor="middle" font-size="12.4444" fill="var(--text-faint)">Expensive</text>
  <text x="1066.6667" y="515.5556" text-anchor="middle" font-size="12.4444" fill="var(--text-muted)">Fast</text>
  <text x="1066.6667" y="542.2222" text-anchor="middle" font-size="12.4444" fill="var(--text-muted)">Cheap</text>
  <line x1="1111.1111" y1="551.1111" x2="1111.1111" y2="53.3333" stroke="var(--border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="1127.1111" y="302.2222" font-size="11.5556" fill="var(--text-faint)" transform="rotate(90,1268,340)">scope / cost / time</text>
  <rect x="88.8889" y="567.1111" width="960" height="35.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="568.8889" y="590.2222" text-anchor="middle" font-size="13.3333" fill="var(--primary-accent)">Aim for many fast unit tests at the base; fewer slow integration tests at the top</text>
</svg>
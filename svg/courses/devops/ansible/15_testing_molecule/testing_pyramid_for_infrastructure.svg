<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <polygon points="96.25,410.5556 1183.7499,410.5556 1240,539.4444 40,539.4444" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.7778" />
  <text x="640" y="481.4444" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--primary-accent)">Unit Tests</text>
  <text x="640" y="508.8333" text-anchor="middle" font-size="14.7735" fill="var(--text)">module tests, filter tests, ansible-test units</text>
  <polygon points="194.6875,281.6667 1085.3125,281.6667 1183.7499,410.5556 96.25,410.5556" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.7778" />
  <text x="640" y="352.5556" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--ok-accent)">Linting &amp; Syntax</text>
  <text x="640" y="379.9444" text-anchor="middle" font-size="14.7735" fill="var(--text)">ansible-lint, yamllint, molecule syntax</text>
  <polygon points="307.1875,175.3333 972.8124,175.3333 1085.3125,281.6667 194.6875,281.6667" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.7778" />
  <text x="640" y="234.9444" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--warn-accent)">Functional Tests</text>
  <text x="640" y="262.3333" text-anchor="middle" font-size="14.7735" fill="var(--text)">Molecule + testinfra / ansible verifier</text>
  <polygon points="415,84.3056 865,84.3056 972.8124,175.3333 307.1875,175.3333" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.7778" />
  <text x="640" y="133.4444" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--danger-accent)">Integration Tests</text>
  <text x="640" y="160.8333" text-anchor="middle" font-size="14.7735" fill="var(--text)">full stack, multi-host, staging</text>
  <text x="1165" y="120.5556" text-anchor="middle" font-size="12.1663" fill="var(--text-faint)">Slow</text>
  <text x="1165" y="152.7777" text-anchor="middle" font-size="12.1663" fill="var(--text-faint)">Expensive</text>
  <text x="1165" y="507.2223" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)">Fast</text>
  <text x="1165" y="531.3889" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)">Cheap</text>
  <line x1="1211.875" y1="539.4444" x2="1211.875" y2="88.3333" stroke="var(--border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="1228.75" y="313.8889" font-size="11.2974" fill="var(--text-faint)" transform="rotate(90,1268,340)">scope / cost / time</text>
  <rect x="133.75" y="553.9444" width="1012.5" height="32.2223" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="574.8889" text-anchor="middle" font-size="13.0354" fill="var(--primary-accent)">Aim for many fast unit tests at the base; fewer slow integration tests at the top</text>
</svg>
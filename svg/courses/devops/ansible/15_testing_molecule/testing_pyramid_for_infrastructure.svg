<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <polygon points="96.25,417.046557 1183.7499,417.046557 1240,566.003119 40,566.003119" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.7778"/>
  <text x="640" y="498.97262" text-anchor="middle" font-size="20.553146" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Unit Tests</text>
  <text x="640" y="530.625924" text-anchor="middle" font-size="15.882016" fill="var(--text)" font-family="Arial, sans-serif">module tests, filter tests, ansible-test units</text>
  <polygon points="194.6875,268.08988 1085.3125,268.08988 1183.7499,417.046557 96.25,417.046557" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.7778"/>
  <text x="640" y="350.016058" text-anchor="middle" font-size="20.553146" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Linting &amp; Syntax</text>
  <text x="640" y="381.669247" text-anchor="middle" font-size="15.882016" fill="var(--text)" font-family="Arial, sans-serif">ansible-lint, yamllint, molecule syntax</text>
  <polygon points="307.1875,145.200554 972.8124,145.200554 1085.3125,268.08988 194.6875,268.08988" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.7778"/>
  <text x="640" y="214.092999" text-anchor="middle" font-size="20.553146" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Functional Tests</text>
  <text x="640" y="245.746303" text-anchor="middle" font-size="15.882016" fill="var(--text)" font-family="Arial, sans-serif">Molecule + testinfra / ansible verifier</text>
  <polygon points="415,40 865,40 972.8124,145.200554 307.1875,145.200554" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.7778"/>
  <text x="640" y="96.789626" text-anchor="middle" font-size="20.553146" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Integration Tests</text>
  <text x="640" y="128.44293" text-anchor="middle" font-size="15.882016" fill="var(--text)" font-family="Arial, sans-serif">full stack, multi-host, staging</text>
  <text x="1165" y="81.894062" text-anchor="middle" font-size="13.079187" fill="var(--text-faint)" font-family="Arial, sans-serif">Slow</text>
  <text x="1165" y="119.133087" text-anchor="middle" font-size="13.079187" fill="var(--text-faint)" font-family="Arial, sans-serif">Expensive</text>
  <text x="1165" y="528.764094" text-anchor="middle" font-size="13.079187" fill="var(--text-muted)" font-family="Arial, sans-serif">Fast</text>
  <text x="1165" y="556.693392" text-anchor="middle" font-size="13.079187" fill="var(--text-muted)" font-family="Arial, sans-serif">Cheap</text>
  <line x1="1211.875" y1="566.003119" x2="1211.875" y2="44.654806" stroke="var(--border)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <text x="1228.75" y="313.8889" font-size="11.2974" fill="var(--text-faint)" transform="rotate(90,1268,340)" font-family="Arial, sans-serif">scope / cost / time</text>
  <rect x="133.75" y="582.760744" width="1012.5" height="37.239256" rx="6.450204" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="606.966266" text-anchor="middle" font-size="14.013499" fill="var(--primary-accent)" font-family="Arial, sans-serif">Aim for many fast unit tests at the base; fewer slow integration tests at the top</text>
</svg>

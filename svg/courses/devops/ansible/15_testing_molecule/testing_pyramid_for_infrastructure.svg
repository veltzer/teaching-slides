<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Layer 4 (base, widest): Unit Tests -->
  <polygon points="60,460 1220,460 1280,620 0,620" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
  <text x="640" y="548" text-anchor="middle" font-size="22" font-weight="bold" fill="#1565c0">Unit Tests</text>
  <text x="640" y="582" text-anchor="middle" font-size="17" fill="#333">module tests, filter tests, ansible-test units</text>

  <!-- Layer 3: Linting and Syntax -->
  <polygon points="165,300 1115,300 1220,460 60,460" fill="#e8f5e9" stroke="#43a047" stroke-width="2"/>
  <text x="640" y="388" text-anchor="middle" font-size="22" font-weight="bold" fill="#1b5e20">Linting &amp; Syntax</text>
  <text x="640" y="422" text-anchor="middle" font-size="17" fill="#333">ansible-lint, yamllint, molecule syntax</text>

  <!-- Layer 2: Functional Tests -->
  <polygon points="285,168 995,168 1115,300 165,300" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="640" y="242" text-anchor="middle" font-size="22" font-weight="bold" fill="#e65100">Functional Tests</text>
  <text x="640" y="276" text-anchor="middle" font-size="17" fill="#333">Molecule + testinfra / ansible verifier</text>

  <!-- Layer 1 (top, narrowest): Integration Tests -->
  <polygon points="400,55 880,55 995,168 285,168" fill="#fce4ec" stroke="#e91e63" stroke-width="2"/>
  <text x="640" y="116" text-anchor="middle" font-size="22" font-weight="bold" fill="#880e4f">Integration Tests</text>
  <text x="640" y="150" text-anchor="middle" font-size="17" fill="#333">full stack, multi-host, staging</text>

  <!-- labels on the right: cost / speed -->
  <text x="1200" y="100" text-anchor="middle" font-size="14" fill="#888">Slow</text>
  <text x="1200" y="140" text-anchor="middle" font-size="14" fill="#888">Expensive</text>
  <text x="1200" y="580" text-anchor="middle" font-size="14" fill="#555">Fast</text>
  <text x="1200" y="610" text-anchor="middle" font-size="14" fill="#555">Cheap</text>

  <!-- vertical arrow on right side -->
  <line x1="1250" y1="620" x2="1250" y2="60" stroke="#bbbbbb" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1268" y="340" font-size="13" fill="#999" transform="rotate(90,1268,340)">scope / cost / time</text>

  <!-- bottom note -->
  <rect x="100" y="638" width="1080" height="40" rx="6" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1"/>
  <text x="640" y="664" text-anchor="middle" font-size="15" fill="#1565c0">Aim for many fast unit tests at the base; fewer slow integration tests at the top</text>
</svg>

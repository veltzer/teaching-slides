<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="40" y="40" font-size="24.490206" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">forks=5 (default)</text>
  <rect x="40" y="56.236393" width="206.557395" height="90.202231" rx="6.50335" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="143.278698" y="110.357776" text-anchor="middle" font-size="18.838687" fill="var(--text)" font-family="Arial, sans-serif">Host 1</text>
  <line x1="246.557395" y1="101.337508" x2="276.065594" y2="101.337508" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="280.983523" y="56.236393" width="206.557395" height="90.202231" rx="6.50335" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="384.262325" y="110.357776" text-anchor="middle" font-size="18.838687" fill="var(--text)" font-family="Arial, sans-serif">Host 2</text>
  <line x1="487.541023" y1="101.337508" x2="517.049222" y2="101.337508" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="521.967255" y="56.236393" width="206.557395" height="90.202231" rx="6.50335" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="625.245953" y="110.357776" text-anchor="middle" font-size="18.838687" fill="var(--text)" font-family="Arial, sans-serif">Host 3</text>
  <line x1="728.52465" y1="101.337508" x2="758.03285" y2="101.337508" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="762.950883" y="56.236393" width="206.557395" height="90.202231" rx="6.50335" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="866.229476" y="110.357776" text-anchor="middle" font-size="18.838687" fill="var(--text)" font-family="Arial, sans-serif">Host 4</text>
  <line x1="969.508278" y1="101.337508" x2="999.016372" y2="101.337508" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1003.934511" y="56.236393" width="206.557395" height="90.202231" rx="6.50335" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1107.213208" y="110.357776" text-anchor="middle" font-size="18.838687" fill="var(--text)" font-family="Arial, sans-serif">Host 5</text>
  <text x="40" y="187.029493" font-size="16.012873" fill="var(--text-muted)" font-family="Arial, sans-serif">Then Host 6 -&gt; 7 -&gt; 8 ... (batches of 5)</text>
  <rect x="40" y="209.580051" width="550.81972" height="54.121271" rx="6.50335" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="59.672133" y="236.640742" font-size="15.070863" fill="var(--text-muted)" font-family="Arial, sans-serif">~50-100 MB per fork (varies)</text>
  <text x="59.672133" y="256.485309" font-size="15.070863" fill="var(--text-muted)" font-family="Arial, sans-serif">forks=5: 5 SSH + workers</text>
  <text x="40" y="335.863129" font-size="24.490206" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">forks=20</text>
  <rect x="40" y="352.099522" width="186.885262" height="90.202231" rx="6.50335" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="133.442631" y="406.220793" text-anchor="middle" font-size="18.838687" fill="var(--text)" font-family="Arial, sans-serif">Host 1</text>
  <line x1="226.885262" y1="397.200637" x2="254.426143" y2="397.200637" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="259.344281" y="352.099522" width="186.885262" height="90.202231" rx="6.50335" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="352.786913" y="406.220793" text-anchor="middle" font-size="18.838687" fill="var(--text)" font-family="Arial, sans-serif">Host 2</text>
  <line x1="446.229544" y1="397.200637" x2="473.77053" y2="397.200637" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="478.688563" y="352.099522" width="186.885262" height="90.202231" rx="6.50335" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="572.131194" y="406.220793" text-anchor="middle" font-size="18.838687" fill="var(--text)" font-family="Arial, sans-serif">Host 3</text>
  <line x1="665.573825" y1="397.200637" x2="693.114811" y2="397.200637" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="698.032844" y="352.099522" width="186.885262" height="90.202231" rx="6.50335" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="791.475476" y="406.220793" text-anchor="middle" font-size="18.838687" fill="var(--text)" font-family="Arial, sans-serif">...</text>
  <line x1="884.918107" y1="397.200637" x2="912.459093" y2="397.200637" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="917.377126" y="352.099522" width="186.885262" height="90.202231" rx="6.50335" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1010.819757" y="406.220793" text-anchor="middle" font-size="18.838687" fill="var(--text)" font-family="Arial, sans-serif">Host 20</text>
  <text x="40" y="487.402756" font-size="16.012873" fill="var(--text-muted)" font-family="Arial, sans-serif">Then 21 -&gt; 22 ... (20 in parallel)</text>
  <rect x="40" y="511.757345" width="1200" height="108.242655" rx="6.50335" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640.000052" y="537.916077" text-anchor="middle" font-size="15.070863" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Memory (~100 MB/fork)</text>
  <text x="128.524598" y="566.780688" text-anchor="middle" font-size="14.128961" fill="var(--text)" font-family="Arial, sans-serif">forks=5</text>
  <text x="128.524598" y="586.625255" text-anchor="middle" font-size="14.128961" fill="var(--text-muted)" font-family="Arial, sans-serif">~500 MB RAM</text>
  <text x="423.606591" y="566.780688" text-anchor="middle" font-size="14.128961" fill="var(--text)" font-family="Arial, sans-serif">forks=10</text>
  <text x="423.606591" y="586.625255" text-anchor="middle" font-size="14.128961" fill="var(--text-muted)" font-family="Arial, sans-serif">~1 GB RAM</text>
  <text x="718.688584" y="566.780688" text-anchor="middle" font-size="14.128961" fill="var(--text)" font-family="Arial, sans-serif">forks=20</text>
  <text x="718.688584" y="586.625255" text-anchor="middle" font-size="14.128961" fill="var(--text-muted)" font-family="Arial, sans-serif">~2 GB RAM</text>
  <text x="1013.770577" y="566.780688" text-anchor="middle" font-size="14.128961" fill="var(--text)" font-family="Arial, sans-serif">forks=50</text>
  <text x="1013.770577" y="586.625255" text-anchor="middle" font-size="14.128961" fill="var(--text-muted)" font-family="Arial, sans-serif">~5 GB RAM</text>
  <line x1="276.065594" y1="547.838305" x2="276.065594" y2="597.449554" stroke="var(--border)" stroke-width="0.8889"/>
  <line x1="571.147587" y1="547.838305" x2="571.147587" y2="597.449554" stroke="var(--border)" stroke-width="0.8889"/>
  <line x1="866.229476" y1="547.838305" x2="866.229476" y2="597.449554" stroke="var(--border)" stroke-width="0.8889"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <text x="40" y="40" font-size="24.490206" font-weight="bold" fill="var(--primary-accent)">forks=5 (default)</text>
  <rect x="40" y="56.236393" width="206.557395" height="90.202231" rx="6.50335" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="143.278698" y="110.357776" text-anchor="middle" font-size="18.838687" fill="var(--text)">Host 1</text>
  <line x1="246.557395" y1="101.337508" x2="276.065594" y2="101.337508" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="280.983523" y="56.236393" width="206.557395" height="90.202231" rx="6.50335" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="384.262325" y="110.357776" text-anchor="middle" font-size="18.838687" fill="var(--text)">Host 2</text>
  <line x1="487.541023" y1="101.337508" x2="517.049222" y2="101.337508" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="521.967255" y="56.236393" width="206.557395" height="90.202231" rx="6.50335" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="625.245953" y="110.357776" text-anchor="middle" font-size="18.838687" fill="var(--text)">Host 3</text>
  <line x1="728.52465" y1="101.337508" x2="758.03285" y2="101.337508" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="762.950883" y="56.236393" width="206.557395" height="90.202231" rx="6.50335" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="866.229476" y="110.357776" text-anchor="middle" font-size="18.838687" fill="var(--text)">Host 4</text>
  <line x1="969.508278" y1="101.337508" x2="999.016372" y2="101.337508" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="1003.934511" y="56.236393" width="206.557395" height="90.202231" rx="6.50335" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1107.213208" y="110.357776" text-anchor="middle" font-size="18.838687" fill="var(--text)">Host 5</text>
  <text x="40" y="187.029493" font-size="16.012873" fill="var(--text-muted)">Then sequentially: Host 6 -&gt; Host 7 -&gt; Host 8 ... (one batch of 5 at a time)</text>
  <rect x="40" y="209.580051" width="550.81972" height="54.121271" rx="6.50335" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="59.672133" y="236.640742" font-size="15.070863" fill="var(--text-muted)">Memory per fork: ~50-100 MB (varies with modules used)</text>
  <text x="59.672133" y="256.485309" font-size="15.070863" fill="var(--text-muted)">forks=5 means 5 parallel SSH connections + worker processes</text>
  <text x="40" y="335.863129" font-size="24.490206" font-weight="bold" fill="var(--ok-accent)">forks=20</text>
  <rect x="40" y="352.099522" width="186.885262" height="90.202231" rx="6.50335" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="133.442631" y="406.220793" text-anchor="middle" font-size="18.838687" fill="var(--text)">Host 1</text>
  <line x1="226.885262" y1="397.200637" x2="254.426143" y2="397.200637" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="259.344281" y="352.099522" width="186.885262" height="90.202231" rx="6.50335" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="352.786913" y="406.220793" text-anchor="middle" font-size="18.838687" fill="var(--text)">Host 2</text>
  <line x1="446.229544" y1="397.200637" x2="473.77053" y2="397.200637" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="478.688563" y="352.099522" width="186.885262" height="90.202231" rx="6.50335" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="572.131194" y="406.220793" text-anchor="middle" font-size="18.838687" fill="var(--text)">Host 3</text>
  <line x1="665.573825" y1="397.200637" x2="693.114811" y2="397.200637" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="698.032844" y="352.099522" width="186.885262" height="90.202231" rx="6.50335" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="791.475476" y="406.220793" text-anchor="middle" font-size="18.838687" fill="var(--text)">...</text>
  <line x1="884.918107" y1="397.200637" x2="912.459093" y2="397.200637" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="917.377126" y="352.099522" width="186.885262" height="90.202231" rx="6.50335" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1010.819757" y="406.220793" text-anchor="middle" font-size="18.838687" fill="var(--text)">Host 20</text>
  <text x="40" y="487.402756" font-size="16.012873" fill="var(--text-muted)">Then: Host 21 -&gt; Host 22 ... (all 20 in first batch simultaneously)</text>
  <rect x="40" y="511.757345" width="1200" height="108.242655" rx="6.50335" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640.000052" y="537.916077" text-anchor="middle" font-size="15.070863" font-weight="bold" fill="var(--primary-accent)">Memory impact (approx. 100 MB per fork)</text>
  <text x="128.524598" y="566.780688" text-anchor="middle" font-size="14.128961" fill="var(--text)">forks=5</text>
  <text x="128.524598" y="586.625255" text-anchor="middle" font-size="14.128961" fill="var(--text-muted)">~500 MB RAM</text>
  <text x="423.606591" y="566.780688" text-anchor="middle" font-size="14.128961" fill="var(--text)">forks=10</text>
  <text x="423.606591" y="586.625255" text-anchor="middle" font-size="14.128961" fill="var(--text-muted)">~1 GB RAM</text>
  <text x="718.688584" y="566.780688" text-anchor="middle" font-size="14.128961" fill="var(--text)">forks=20</text>
  <text x="718.688584" y="586.625255" text-anchor="middle" font-size="14.128961" fill="var(--text-muted)">~2 GB RAM</text>
  <text x="1013.770577" y="566.780688" text-anchor="middle" font-size="14.128961" fill="var(--text)">forks=50</text>
  <text x="1013.770577" y="586.625255" text-anchor="middle" font-size="14.128961" fill="var(--text-muted)">~5 GB RAM (watch out!)</text>
  <line x1="276.065594" y1="547.838305" x2="276.065594" y2="597.449554" stroke="var(--border)" stroke-width="0.8889" />
  <line x1="571.147587" y1="547.838305" x2="571.147587" y2="597.449554" stroke="var(--border)" stroke-width="0.8889" />
  <line x1="866.229476" y1="547.838305" x2="866.229476" y2="597.449554" stroke="var(--border)" stroke-width="0.8889" />
</svg>
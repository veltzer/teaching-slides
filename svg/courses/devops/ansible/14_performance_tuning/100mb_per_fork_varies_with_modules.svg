<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <text x="68.125" y="81.8889" font-size="22.5947" font-weight="bold" fill="var(--primary-accent)">forks=5 (default)</text>
  <rect x="68.125" y="96.3889" width="196.875" height="80.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="166.5625" y="144.7223" text-anchor="middle" font-size="17.3806" fill="var(--text)">Host 1</text>
  <line x1="265" y1="136.6667" x2="293.125" y2="136.6667" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="297.8124" y="96.3889" width="196.875" height="80.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="396.25" y="144.7223" text-anchor="middle" font-size="17.3806" fill="var(--text)">Host 2</text>
  <line x1="494.6875" y1="136.6667" x2="522.8125" y2="136.6667" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="527.5" y="96.3889" width="196.875" height="80.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="625.9375" y="144.7223" text-anchor="middle" font-size="17.3806" fill="var(--text)">Host 3</text>
  <line x1="724.375" y1="136.6667" x2="752.5" y2="136.6667" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="757.1875" y="96.3889" width="196.875" height="80.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="855.6249" y="144.7223" text-anchor="middle" font-size="17.3806" fill="var(--text)">Host 4</text>
  <line x1="954.0625" y1="136.6667" x2="982.1874" y2="136.6667" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="986.875" y="96.3889" width="196.875" height="80.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1085.3125" y="144.7223" text-anchor="middle" font-size="17.3806" fill="var(--text)">Host 5</text>
  <text x="68.125" y="213.1944" font-size="14.7735" fill="var(--text-muted)">Then sequentially: Host 6 -&gt; Host 7 -&gt; Host 8 ... (one batch of 5 at a time)</text>
  <rect x="68.125" y="233.3333" width="525" height="48.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="86.875" y="257.5" font-size="13.9044" fill="var(--text-muted)">Memory per fork: ~50-100 MB (varies with modules used)</text>
  <text x="86.875" y="275.2223" font-size="13.9044" fill="var(--text-muted)">forks=5 means 5 parallel SSH connections + worker processes</text>
  <text x="68.125" y="346.1111" font-size="22.5947" font-weight="bold" fill="var(--ok-accent)">forks=20</text>
  <rect x="68.125" y="360.6111" width="178.125" height="80.5556" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="157.1875" y="408.9444" text-anchor="middle" font-size="17.3806" fill="var(--text)">Host 1</text>
  <line x1="246.25" y1="400.8889" x2="272.4999" y2="400.8889" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="277.1875" y="360.6111" width="178.125" height="80.5556" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="366.25" y="408.9444" text-anchor="middle" font-size="17.3806" fill="var(--text)">Host 2</text>
  <line x1="455.3125" y1="400.8889" x2="481.5625" y2="400.8889" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="486.25" y="360.6111" width="178.125" height="80.5556" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="575.3125" y="408.9444" text-anchor="middle" font-size="17.3806" fill="var(--text)">Host 3</text>
  <line x1="664.375" y1="400.8889" x2="690.625" y2="400.8889" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="695.3125" y="360.6111" width="178.125" height="80.5556" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="784.375" y="408.9444" text-anchor="middle" font-size="17.3806" fill="var(--text)">...</text>
  <line x1="873.4375" y1="400.8889" x2="899.6875" y2="400.8889" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="904.375" y="360.6111" width="178.125" height="80.5556" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="993.4375" y="408.9444" text-anchor="middle" font-size="17.3806" fill="var(--text)">Host 20</text>
  <text x="68.125" y="481.4444" font-size="14.7735" fill="var(--text-muted)">Then: Host 21 -&gt; Host 22 ... (all 20 in first batch simultaneously)</text>
  <rect x="68.125" y="503.1944" width="1143.7499" height="96.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="640" y="526.5556" text-anchor="middle" font-size="13.9044" font-weight="bold" fill="var(--primary-accent)">Memory impact (approx. 100 MB per fork)</text>
  <text x="152.5" y="552.3333" text-anchor="middle" font-size="13.0354" fill="var(--text)">forks=5</text>
  <text x="152.5" y="570.0556" text-anchor="middle" font-size="13.0354" fill="var(--text-muted)">~500 MB RAM</text>
  <text x="433.75" y="552.3333" text-anchor="middle" font-size="13.0354" fill="var(--text)">forks=10</text>
  <text x="433.75" y="570.0556" text-anchor="middle" font-size="13.0354" fill="var(--text-muted)">~1 GB RAM</text>
  <text x="715" y="552.3333" text-anchor="middle" font-size="13.0354" fill="var(--text)">forks=20</text>
  <text x="715" y="570.0556" text-anchor="middle" font-size="13.0354" fill="var(--text-muted)">~2 GB RAM</text>
  <text x="996.25" y="552.3333" text-anchor="middle" font-size="13.0354" fill="var(--text)">forks=50</text>
  <text x="996.25" y="570.0556" text-anchor="middle" font-size="13.0354" fill="var(--text-muted)">~5 GB RAM (watch out!)</text>
  <line x1="293.125" y1="535.4167" x2="293.125" y2="579.7223" stroke="var(--border)" stroke-width="0.8889" />
  <line x1="574.375" y1="535.4167" x2="574.375" y2="579.7223" stroke="var(--border)" stroke-width="0.8889" />
  <line x1="855.6249" y1="535.4167" x2="855.6249" y2="579.7223" stroke="var(--border)" stroke-width="0.8889" />
</svg>
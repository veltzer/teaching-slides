<text x="30" y="90" font-size="11" font-weight="normal" fill="#666" text-anchor="start">Then: Host6 → Host7 → Host8 → ...</text>
<text x="10" y="122" font-size="13" font-weight="bold" fill="#222" text-anchor="start">forks=20:</text>

  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:text x="26.6667" y="46.2222" font-size="23.1111" font-weight="bold" fill="#1565c0">forks=5 (default)</ns0:text>
  <ns0:rect x="26.6667" y="62.2222" width="186.6667" height="88.8889" rx="7.1111" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="120" y="115.5556" text-anchor="middle" font-size="17.7778" fill="#222">Host 1</ns0:text>
  <ns0:line x1="213.3333" y1="106.6667" x2="240" y2="106.6667" stroke="#555" stroke-width="2.2222" marker-end="url(#arrow)" />
  <ns0:rect x="244.4444" y="62.2222" width="186.6667" height="88.8889" rx="7.1111" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="337.7778" y="115.5556" text-anchor="middle" font-size="17.7778" fill="#222">Host 2</ns0:text>
  <ns0:line x1="431.1111" y1="106.6667" x2="457.7778" y2="106.6667" stroke="#555" stroke-width="2.2222" marker-end="url(#arrow)" />
  <ns0:rect x="462.2222" y="62.2222" width="186.6667" height="88.8889" rx="7.1111" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="555.5556" y="115.5556" text-anchor="middle" font-size="17.7778" fill="#222">Host 3</ns0:text>
  <ns0:line x1="648.8889" y1="106.6667" x2="675.5556" y2="106.6667" stroke="#555" stroke-width="2.2222" marker-end="url(#arrow)" />
  <ns0:rect x="680" y="62.2222" width="186.6667" height="88.8889" rx="7.1111" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="773.3333" y="115.5556" text-anchor="middle" font-size="17.7778" fill="#222">Host 4</ns0:text>
  <ns0:line x1="866.6667" y1="106.6667" x2="893.3333" y2="106.6667" stroke="#555" stroke-width="2.2222" marker-end="url(#arrow)" />
  <ns0:rect x="897.7778" y="62.2222" width="186.6667" height="88.8889" rx="7.1111" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="991.1111" y="115.5556" text-anchor="middle" font-size="17.7778" fill="#222">Host 5</ns0:text>
  <ns0:text x="26.6667" y="191.1111" font-size="15.1111" fill="#666">Then sequentially: Host 6 -&gt; Host 7 -&gt; Host 8 ... (one batch of 5 at a time)</ns0:text>
  <ns0:rect x="26.6667" y="213.3333" width="497.7778" height="53.3333" rx="5.3333" fill="#fff8e1" stroke="#f9a825" stroke-width="1.3333" />
  <ns0:text x="44.4444" y="240" font-size="14.2222" fill="#555">Memory per fork: ~50-100 MB (varies with modules used)</ns0:text>
  <ns0:text x="44.4444" y="259.5556" font-size="14.2222" fill="#555">forks=5 means 5 parallel SSH connections + worker processes</ns0:text>
  <ns0:text x="26.6667" y="337.7778" font-size="23.1111" font-weight="bold" fill="#1b5e20">forks=20</ns0:text>
  <ns0:rect x="26.6667" y="353.7778" width="168.8889" height="88.8889" rx="7.1111" fill="#e8f5e9" stroke="#43a047" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="111.1111" y="407.1111" text-anchor="middle" font-size="17.7778" fill="#222">Host 1</ns0:text>
  <ns0:line x1="195.5556" y1="398.2222" x2="220.4444" y2="398.2222" stroke="#555" stroke-width="2.2222" marker-end="url(#arrow)" />
  <ns0:rect x="224.8889" y="353.7778" width="168.8889" height="88.8889" rx="7.1111" fill="#e8f5e9" stroke="#43a047" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="309.3333" y="407.1111" text-anchor="middle" font-size="17.7778" fill="#222">Host 2</ns0:text>
  <ns0:line x1="393.7778" y1="398.2222" x2="418.6667" y2="398.2222" stroke="#555" stroke-width="2.2222" marker-end="url(#arrow)" />
  <ns0:rect x="423.1111" y="353.7778" width="168.8889" height="88.8889" rx="7.1111" fill="#e8f5e9" stroke="#43a047" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="507.5556" y="407.1111" text-anchor="middle" font-size="17.7778" fill="#222">Host 3</ns0:text>
  <ns0:line x1="592" y1="398.2222" x2="616.8889" y2="398.2222" stroke="#555" stroke-width="2.2222" marker-end="url(#arrow)" />
  <ns0:rect x="621.3333" y="353.7778" width="168.8889" height="88.8889" rx="7.1111" fill="#e8f5e9" stroke="#43a047" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="705.7778" y="407.1111" text-anchor="middle" font-size="17.7778" fill="#222">...</ns0:text>
  <ns0:line x1="790.2222" y1="398.2222" x2="815.1111" y2="398.2222" stroke="#555" stroke-width="2.2222" marker-end="url(#arrow)" />
  <ns0:rect x="819.5556" y="353.7778" width="168.8889" height="88.8889" rx="7.1111" fill="#e8f5e9" stroke="#43a047" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="904" y="407.1111" text-anchor="middle" font-size="17.7778" fill="#222">Host 20</ns0:text>
  <ns0:text x="26.6667" y="487.1111" font-size="15.1111" fill="#666">Then: Host 21 -&gt; Host 22 ... (all 20 in first batch simultaneously)</ns0:text>
  <ns0:rect x="26.6667" y="511.1111" width="1084.4444" height="106.6667" rx="7.1111" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="536.8889" text-anchor="middle" font-size="14.2222" font-weight="bold" fill="#1565c0">Memory impact (approx. 100 MB per fork)</ns0:text>
  <ns0:text x="106.6667" y="565.3333" text-anchor="middle" font-size="13.3333" fill="#333">forks=5</ns0:text>
  <ns0:text x="106.6667" y="584.8889" text-anchor="middle" font-size="13.3333" fill="#555">~500 MB RAM</ns0:text>
  <ns0:text x="373.3333" y="565.3333" text-anchor="middle" font-size="13.3333" fill="#333">forks=10</ns0:text>
  <ns0:text x="373.3333" y="584.8889" text-anchor="middle" font-size="13.3333" fill="#555">~1 GB RAM</ns0:text>
  <ns0:text x="640" y="565.3333" text-anchor="middle" font-size="13.3333" fill="#333">forks=20</ns0:text>
  <ns0:text x="640" y="584.8889" text-anchor="middle" font-size="13.3333" fill="#555">~2 GB RAM</ns0:text>
  <ns0:text x="906.6667" y="565.3333" text-anchor="middle" font-size="13.3333" fill="#333">forks=50</ns0:text>
  <ns0:text x="906.6667" y="584.8889" text-anchor="middle" font-size="13.3333" fill="#555">~5 GB RAM (watch out!)</ns0:text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <!-- Block/Rescue/Always -->
  <rect x="40" y="40" width="400" height="189.615384615385" rx="10.561177090573" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="79.038461538461" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.010118763033" font-weight="bold" fill="var(--primary-text)">block / rescue / always</text>
  <text x="240" y="118.076923076923" text-anchor="middle" font-family="Courier New, monospace" font-size="14.785647926804" fill="var(--primary-text)">block: try tasks</text>
  <text x="240" y="151.538461538461" text-anchor="middle" font-family="Courier New, monospace" font-size="14.785647926804" fill="var(--primary-text)">rescue: on failure</text>
  <text x="240" y="184.999999999999" text-anchor="middle" font-family="Courier New, monospace" font-size="14.785647926804" fill="var(--primary-text)">always: cleanup</text>
  <text x="240" y="216.230769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--primary-text)">try / catch / finally</text>

  <!-- ignore_errors / failed_when -->
  <rect x="460" y="40" width="400" height="189.615384615385" rx="10.561177090573" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="660" y="79.038461538461" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.010118763033" font-weight="bold" fill="var(--warn-text)">ignore / failed_when</text>
  <text x="660" y="123.653846153846" text-anchor="middle" font-family="Courier New, monospace" font-size="14.785647926804" fill="var(--warn-text)">ignore_errors: true</text>
  <text x="660" y="157.115384615384" text-anchor="middle" font-family="Courier New, monospace" font-size="14.785647926804" fill="var(--warn-text)">failed_when: rc != 0</text>
  <text x="660" y="190.576923076923" text-anchor="middle" font-family="Courier New, monospace" font-size="14.785647926804" fill="var(--warn-text)">changed_when: false</text>
  <text x="660" y="218.461538461538" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--warn-text)">custom success logic</text>

  <!-- any_errors_fatal -->
  <rect x="880" y="40" width="360" height="189.615384615385" rx="10.561177090573" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1060" y="79.038461538461" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.010118763033" font-weight="bold" fill="var(--danger-text)">Fail Fast</text>
  <text x="1060" y="123.653846153846" text-anchor="middle" font-family="Courier New, monospace" font-size="14.785647926804" fill="var(--danger-text)">any_errors_fatal</text>
  <text x="1060" y="157.115384615384" text-anchor="middle" font-family="Courier New, monospace" font-size="14.785647926804" fill="var(--danger-text)">max_fail_percentage</text>
  <text x="1060" y="193.923076923077" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--danger-text)">halt cluster wide</text>

  <!-- Debugging -->
  <rect x="40" y="263.076923076923" width="600" height="356.923076923077" rx="10.561177090573" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="302.115384615384" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.010118763033" font-weight="bold" fill="var(--ok-text)">Debugging</text>
  <text x="60" y="346.730769230769" font-family="Courier New, monospace" font-size="14.785647926804" fill="var(--ok-text)">debug: msg / var</text>
  <text x="60" y="385.769230769231" font-family="Courier New, monospace" font-size="14.785647926804" fill="var(--ok-text)">-v  -vv  -vvv  -vvvv</text>
  <text x="60" y="424.807692307692" font-family="Courier New, monospace" font-size="14.785647926804" fill="var(--ok-text)">ansible-lint playbook.yml</text>
  <text x="60" y="463.846153846154" font-family="Courier New, monospace" font-size="14.785647926804" fill="var(--ok-text)">setup  -- gather facts</text>
  <text x="60" y="502.884615384615" font-family="Courier New, monospace" font-size="14.785647926804" fill="var(--ok-text)">register: result</text>
  <text x="60" y="541.923076923077" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--ok-text)">raise verbosity progressively</text>
  <text x="60" y="580.961538461538" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--ok-text)">lint in CI pipelines</text>

  <!-- Decision flow -->
  <rect x="660" y="263.076923076923" width="580" height="356.923076923077" rx="10.561177090573" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="302.115384615384" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.010118763033" font-weight="bold" fill="var(--info-text)">Choosing a Strategy</text>
  <text x="680" y="352.307692307692" font-family="Arial, sans-serif" font-size="15.841765635861" fill="var(--info-text)">Expected failure? ignore_errors</text>
  <text x="680" y="402.5" font-family="Arial, sans-serif" font-size="15.841765635861" fill="var(--info-text)">Custom success? failed_when</text>
  <text x="680" y="452.692307692307" font-family="Arial, sans-serif" font-size="15.841765635861" fill="var(--info-text)">Recovery? block/rescue</text>
  <text x="680" y="502.884615384615" font-family="Arial, sans-serif" font-size="15.841765635861" fill="var(--info-text)">Halt play? any_errors_fatal</text>
  <text x="680" y="558.653846153847" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--info-text)">Combine freely per task</text>
</svg>

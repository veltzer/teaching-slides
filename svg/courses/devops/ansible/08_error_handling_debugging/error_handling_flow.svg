<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.579135622711" font-weight="bold" fill="var(--primary-accent)">Ansible Error Handling</text>

  <!-- Block/Rescue/Always -->
  <rect x="40" y="76.576576576577" width="400" height="177.657657657658" rx="10.222744470273" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="113.153153153153" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.400940046492" font-weight="bold" fill="var(--primary-text)">block / rescue / always</text>
  <text x="240" y="149.72972972973" text-anchor="middle" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--primary-text)">block: try tasks</text>
  <text x="240" y="181.081081081081" text-anchor="middle" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--primary-text)">rescue: on failure</text>
  <text x="240" y="212.432432432432" text-anchor="middle" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--primary-text)">always: cleanup</text>
  <text x="240" y="241.693693693694" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--primary-text)">try / catch / finally</text>

  <!-- ignore_errors / failed_when -->
  <rect x="460" y="76.576576576577" width="400" height="177.657657657658" rx="10.222744470273" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="660" y="113.153153153153" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.400940046492" font-weight="bold" fill="var(--warn-text)">ignore / failed_when</text>
  <text x="660" y="154.954954954955" text-anchor="middle" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--warn-text)">ignore_errors: true</text>
  <text x="660" y="186.306306306306" text-anchor="middle" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--warn-text)">failed_when: rc != 0</text>
  <text x="660" y="217.657657657658" text-anchor="middle" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--warn-text)">changed_when: false</text>
  <text x="660" y="243.783783783784" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--warn-text)">custom success logic</text>

  <!-- any_errors_fatal -->
  <rect x="880" y="76.576576576577" width="360" height="177.657657657658" rx="10.222744470273" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1060" y="113.153153153153" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.400940046492" font-weight="bold" fill="var(--danger-text)">Fail Fast</text>
  <text x="1060" y="154.954954954955" text-anchor="middle" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--danger-text)">any_errors_fatal</text>
  <text x="1060" y="186.306306306306" text-anchor="middle" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--danger-text)">max_fail_percentage</text>
  <text x="1060" y="220.792792792793" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--danger-text)">halt cluster wide</text>

  <!-- Debugging -->
  <rect x="40" y="285.585585585586" width="600" height="334.414414414414" rx="10.222744470273" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="322.162162162162" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.400940046492" font-weight="bold" fill="var(--ok-text)">Debugging</text>
  <text x="60" y="363.963963963964" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--ok-text)">debug: msg / var</text>
  <text x="60" y="400.540540540541" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--ok-text)">-v  -vv  -vvv  -vvvv</text>
  <text x="60" y="437.117117117117" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--ok-text)">ansible-lint playbook.yml</text>
  <text x="60" y="473.693693693694" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--ok-text)">setup  -- gather facts</text>
  <text x="60" y="510.27027027027" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--ok-text)">register: result</text>
  <text x="60" y="546.846846846847" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--ok-text)">raise verbosity progressively</text>
  <text x="60" y="583.423423423423" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--ok-text)">lint in CI pipelines</text>

  <!-- Decision flow -->
  <rect x="660" y="285.585585585586" width="580" height="334.414414414414" rx="10.222744470273" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="322.162162162162" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.400940046492" font-weight="bold" fill="var(--info-text)">Choosing a Strategy</text>
  <text x="680" y="369.189189189189" font-family="Arial, sans-serif" font-size="15.33411670541" fill="var(--info-text)">Expected failure? ignore_errors</text>
  <text x="680" y="416.216216216216" font-family="Arial, sans-serif" font-size="15.33411670541" fill="var(--info-text)">Custom success? failed_when</text>
  <text x="680" y="463.243243243243" font-family="Arial, sans-serif" font-size="15.33411670541" fill="var(--info-text)">Recovery? block/rescue</text>
  <text x="680" y="510.27027027027" font-family="Arial, sans-serif" font-size="15.33411670541" fill="var(--info-text)">Halt play? any_errors_fatal</text>
  <text x="680" y="562.522522522523" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--info-text)">Combine freely per task</text>
</svg>

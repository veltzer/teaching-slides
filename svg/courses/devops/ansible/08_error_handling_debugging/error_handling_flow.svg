<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
  </defs>
  <!-- Header -->
  <rect x="40" y="40" width="1200" height="59.722766" fill="var(--primary-fill)" rx="6.754536" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="79.049501" font-family="Arial, sans-serif" font-size="22.828418" font-weight="bold" fill="var(--bg)" text-anchor="middle">Ansible Error Handling Flow</text>

  <!-- LEFT: Block/Rescue/Always -->
  <rect x="58.75" y="111.207913" width="346.875" height="430.693086" rx="6.754536" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="58.75" y="111.207913" width="346.875" height="34.455442" rx="6.754536" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="58.75" y="131.881178" width="346.875" height="13.782177" fill="var(--primary-fill)" rx="6.754536" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="232.1875" y="134.178208" font-family="Arial, sans-serif" font-size="14.527206" font-weight="bold" fill="var(--bg)" text-anchor="middle">block / rescue / always</text>

  <rect x="72.8125" y="154.851473" width="318.75" height="91.881178" rx="6.754536" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="86.875" y="175.524738" font-family="monospace" font-size="11.414265" font-weight="bold" fill="var(--primary-accent)">block:                  # try</text>
  <text x="86.875" y="196.198003" font-family="monospace" font-size="11.414265" fill="var(--text)">  - name: Risky deploy</text>
  <text x="86.875" y="215.72269" font-family="monospace" font-size="11.414265" fill="var(--text)">    command: /opt/deploy.sh</text>
  <text x="86.875" y="235.247503" font-family="monospace" font-size="11.414265" fill="var(--text)">  - name: Configure app</text>

  <rect x="72.8125" y="253.623739" width="318.75" height="91.881178" rx="6.754536" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="86.875" y="274.297004" font-family="monospace" font-size="11.414265" font-weight="bold" fill="var(--danger-accent)">rescue:                 # catch</text>
  <text x="86.875" y="293.821691" font-family="monospace" font-size="11.414265" fill="var(--text)">  - name: Alert on failure</text>
  <text x="86.875" y="313.346505" font-family="monospace" font-size="11.414265" fill="var(--text)">    slack: msg="Deploy failed"</text>
  <text x="86.875" y="332.871318" font-family="monospace" font-size="11.414265" fill="var(--text)">  - name: Rollback changes</text>

  <rect x="72.8125" y="352.396005" width="318.75" height="91.881178" rx="6.754536" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="86.875" y="373.069271" font-family="monospace" font-size="11.414265" font-weight="bold" fill="var(--ok-accent)">always:                 # finally</text>
  <text x="86.875" y="392.594084" font-family="monospace" font-size="11.414265" fill="var(--text)">  - name: Cleanup temp files</text>
  <text x="86.875" y="412.118771" font-family="monospace" font-size="11.414265" fill="var(--text)">    file: path=/tmp/work state=absent</text>
  <text x="86.875" y="431.643458" font-family="monospace" font-size="11.414265" fill="var(--text)">  - name: Log completion</text>

  <text x="232.1875" y="469.544508" font-family="Arial, sans-serif" font-size="11.414265" fill="var(--text-muted)" text-anchor="middle">block FAILS -&gt; rescue runs -&gt; always runs</text>
  <text x="232.1875" y="489.069321" font-family="Arial, sans-serif" font-size="11.414265" fill="var(--text-muted)" text-anchor="middle">block PASSES -&gt; skip rescue -&gt; always runs</text>
  <text x="232.1875" y="508.594008" font-family="Arial, sans-serif" font-size="11.414265" fill="var(--text-faint)" text-anchor="middle">ansible_failed_task / ansible_failed_result available</text>
  <text x="232.1875" y="528.118695" font-family="Arial, sans-serif" font-size="11.414265" fill="var(--text-faint)" text-anchor="middle">in rescue scope</text>

  <!-- CENTER TOP: ignore_errors and failed_when -->
  <rect x="419.6875" y="111.207913" width="318.75" height="212.475161" rx="6.754536" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="419.6875" y="111.207913" width="318.75" height="34.455442" rx="6.754536" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="419.6875" y="131.881178" width="318.75" height="13.782177" fill="var(--warn-fill)" rx="6.754536" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="579.0625" y="134.178208" font-family="Arial, sans-serif" font-size="14.527206" font-weight="bold" fill="var(--bg)" text-anchor="middle">ignore_errors / failed_when</text>
  <text x="433.75" y="168.633649" font-family="monospace" font-size="11.414265" fill="var(--text)">- name: Check service (may fail)</text>
  <text x="433.75" y="188.158336" font-family="monospace" font-size="11.414265" fill="var(--text)">  command: systemctl status nginx</text>
  <text x="433.75" y="207.68315" font-family="monospace" font-size="11.414265" fill="var(--warn-accent)">  ignore_errors: true</text>
  <text x="433.75" y="227.207964" font-family="monospace" font-size="11.414265" fill="var(--warn-accent)">  register: svc_status</text>
  <line x1="433.75" y1="239.841562" x2="724.375" y2="239.841562" stroke="var(--border)" stroke-width="1"/>
  <text x="433.75" y="260.514827" font-family="monospace" font-size="11.414265" fill="var(--text)">- name: Run migration</text>
  <text x="433.75" y="280.039514" font-family="monospace" font-size="11.414265" fill="var(--text)">  command: ./migrate.sh</text>
  <text x="433.75" y="299.564328" font-family="monospace" font-size="11.414265" fill="var(--warn-accent)">  failed_when:</text>
  <text x="433.75" y="319.089142" font-family="monospace" font-size="11.414265" fill="var(--warn-accent)">    - result.rc not in [0, 2]</text>

  <!-- CENTER MID: changed_when -->
  <rect x="419.6875" y="338.613829" width="318.75" height="120.593983" rx="6.754536" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="419.6875" y="338.613829" width="318.75" height="34.455442" rx="6.754536" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="419.6875" y="359.287094" width="318.75" height="13.782177" fill="var(--info-fill)" rx="6.754536" stroke="var(--info-border)" stroke-width="2"/>
  <text x="579.0625" y="361.584123" font-family="Arial, sans-serif" font-size="14.527206" font-weight="bold" fill="var(--bg)" text-anchor="middle">changed_when</text>
  <text x="433.75" y="396.039565" font-family="monospace" font-size="11.414265" fill="var(--text)">- shell: ./check_and_update.sh</text>
  <text x="433.75" y="415.564379" font-family="monospace" font-size="11.414265" fill="var(--info-accent)">  register: upd</text>
  <text x="433.75" y="435.089066" font-family="monospace" font-size="11.414265" fill="var(--info-accent)">  changed_when: "'updated' in upd.stdout"</text>
  <text x="433.75" y="454.613753" font-family="monospace" font-size="11.414265" fill="var(--info-accent)">  changed_when: false   # never changed</text>

  <!-- CENTER BOT: any_errors_fatal -->
  <rect x="419.6875" y="474.138566" width="318.75" height="68.910884" rx="6.754536" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="433.75" y="499.40589" font-family="monospace" font-size="12.451875" font-weight="bold" fill="var(--warn-accent)">any_errors_fatal: true</text>
  <text x="433.75" y="522.376185" font-family="Arial, sans-serif" font-size="11.414265" fill="var(--text-muted)">Halt ALL hosts if ANY host fails this play</text>
  <text x="433.75" y="536.158362" font-family="Arial, sans-serif" font-size="11.414265" fill="var(--text-muted)">max_fail_percentage: 20  # allow 20%</text>

  <!-- RIGHT: Debugging -->
  <rect x="752.5" y="111.207913" width="468.75" height="430.693086" rx="6.754536" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="752.5" y="111.207913" width="468.75" height="34.455442" rx="6.754536" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="752.5" y="131.881178" width="468.75" height="13.782177" fill="var(--ok-fill)" rx="6.754536" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="986.875" y="134.178208" font-family="Arial, sans-serif" font-size="14.527206" font-weight="bold" fill="var(--bg)" text-anchor="middle">Debugging Techniques</text>

  <text x="766.5625" y="168.633649" font-family="Arial, sans-serif" font-size="12.451875" font-weight="bold" fill="var(--ok-accent)">debug module:</text>
  <text x="766.5625" y="189.306914" font-family="monospace" font-size="11.414265" fill="var(--text)">- debug: msg="Value is {{ my_var }}"</text>
  <text x="766.5625" y="208.831728" font-family="monospace" font-size="11.414265" fill="var(--text)">- debug: var=ansible_facts</text>
  <text x="766.5625" y="228.356415" font-family="monospace" font-size="11.414265" fill="var(--text)">- debug: var=result  verbosity=2</text>

  <line x1="766.5625" y1="242.138592" x2="1207.1875" y2="242.138592" stroke="var(--border)" stroke-width="1"/>
  <text x="766.5625" y="265.108886" font-family="Arial, sans-serif" font-size="12.451875" font-weight="bold" fill="var(--ok-accent)">Verbose modes:</text>
  <text x="766.5625" y="285.782151" font-family="monospace" font-size="11.414265" fill="var(--text)">-v</text>
  <text x="813.4375" y="285.782151" font-family="Arial, sans-serif" font-size="11.414265" fill="var(--text-muted)">task results</text>
  <text x="996.25" y="285.782151" font-family="monospace" font-size="11.414265" fill="var(--text)">-vvv</text>
  <text x="1038.4375" y="285.782151" font-family="Arial, sans-serif" font-size="11.414265" fill="var(--text-muted)">full connection debug</text>
  <text x="766.5625" y="305.306965" font-family="monospace" font-size="11.414265" fill="var(--text)">-vv</text>
  <text x="813.4375" y="305.306965" font-family="Arial, sans-serif" font-size="11.414265" fill="var(--text-muted)">file + line info</text>
  <text x="996.25" y="305.306965" font-family="monospace" font-size="11.414265" fill="var(--text)">-vvvv</text>
  <text x="1047.8125" y="305.306965" font-family="Arial, sans-serif" font-size="11.414265" fill="var(--text-muted)">winrm / SSH debug</text>

  <line x1="766.5625" y1="321.386045" x2="1207.1875" y2="321.386045" stroke="var(--border)" stroke-width="1"/>
  <text x="766.5625" y="344.356339" font-family="Arial, sans-serif" font-size="12.451875" font-weight="bold" fill="var(--ok-accent)">ansible-lint:</text>
  <text x="766.5625" y="365.029731" font-family="monospace" font-size="11.414265" fill="var(--text)">ansible-lint playbook.yml</text>
  <text x="766.5625" y="384.554418" font-family="monospace" font-size="11.414265" fill="var(--text)">ansible-lint --list-rules</text>
  <text x="766.5625" y="404.079105" font-family="monospace" font-size="11.414265" fill="var(--text)">ansible-lint --profile production</text>
  <text x="996.25" y="365.029731" font-family="Arial, sans-serif" font-size="11.414265" fill="var(--text-muted)">Checks best practices</text>
  <text x="996.25" y="384.554418" font-family="Arial, sans-serif" font-size="11.414265" fill="var(--text-muted)">Show all rules</text>
  <text x="996.25" y="404.079105" font-family="Arial, sans-serif" font-size="11.414265" fill="var(--text-muted)">Strict enforcement</text>

  <line x1="766.5625" y1="419.00986" x2="1207.1875" y2="419.00986" stroke="var(--border)" stroke-width="1"/>
  <text x="766.5625" y="441.980154" font-family="Arial, sans-serif" font-size="12.451875" font-weight="bold" fill="var(--ok-accent)">Useful debugging tasks:</text>
  <text x="766.5625" y="462.653419" font-family="monospace" font-size="11.414265" fill="var(--text)">- name: Gather all facts first</text>
  <text x="766.5625" y="482.178106" font-family="monospace" font-size="11.414265" fill="var(--text)">  setup:    # explicit fact gather</text>
  <text x="766.5625" y="501.70292" font-family="monospace" font-size="11.414265" fill="var(--text)">- name: Print all vars</text>
  <text x="766.5625" y="521.227734" font-family="monospace" font-size="11.414265" fill="var(--text)">  debug: var=vars  verbosity=3</text>

  <!-- Bottom bar -->
  <rect x="58.75" y="562.574264" width="1162.5" height="57.425736" rx="6.754536" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="72.8125" y="583.247402" font-family="Arial, sans-serif" font-size="12.451875" font-weight="bold" fill="var(--text)">Error Handling Decision:</text>
  <text x="246.25" y="583.247402" font-family="Arial, sans-serif" font-size="12.451875" fill="var(--text-muted)">Task may fail safely?</text>
  <text x="433.75" y="583.247402" font-family="Arial, sans-serif" font-size="12.451875" fill="var(--warn-accent)">-&gt; ignore_errors</text>
  <text x="574.375" y="583.247402" font-family="Arial, sans-serif" font-size="12.451875" fill="var(--text-muted)">|  Need custom fail logic?</text>
  <text x="780.625" y="583.247402" font-family="Arial, sans-serif" font-size="12.451875" fill="var(--warn-accent)">-&gt; failed_when</text>
  <text x="902.5" y="583.247402" font-family="Arial, sans-serif" font-size="12.451875" fill="var(--text-muted)">|  Need try/catch?</text>
  <text x="1052.5" y="583.247402" font-family="Arial, sans-serif" font-size="12.451875" fill="var(--primary-accent)">-&gt; block/rescue</text>
  <text x="72.8125" y="609.663304" font-family="Arial, sans-serif" font-size="12.451875" fill="var(--text-muted)">Always use</text>
  <text x="152.5" y="609.663304" font-family="monospace" font-size="12.451875" fill="var(--ok-accent)">ansible-lint</text>
  <text x="241.5625" y="609.663304" font-family="Arial, sans-serif" font-size="12.451875" fill="var(--text-muted)">in CI pipelines to catch issues before production. Enable</text>
  <text x="682.1875" y="609.663304" font-family="monospace" font-size="12.451875" fill="var(--ok-accent)">ANSIBLE_STDOUT_CALLBACK=yaml</text>
  <text x="949.375" y="609.663304" font-family="Arial, sans-serif" font-size="12.451875" fill="var(--text-muted)">for readable output.</text>
</svg>

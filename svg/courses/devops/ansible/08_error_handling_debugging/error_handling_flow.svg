<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
  </defs>
  <!-- Header -->
  <rect x="40" y="40" width="1200" height="59.722766" fill="url(#grad-primary)" rx="6.754536" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="79.049501" font-family="Arial, sans-serif" font-size="22.828418" font-weight="bold" fill="var(--bg)" text-anchor="middle">Ansible Error Handling Flow</text>

  <!-- LEFT: Block/Rescue/Always -->
  <rect x="58.75" y="111.207913" width="346.875" height="430.693086" rx="6.754536" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="58.75" y="111.207913" width="346.875" height="34.455442" rx="6.754536" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="58.75" y="131.881178" width="346.875" height="13.782177" fill="url(#grad-primary)" rx="6.754536" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="232.1875" y="134.178208" font-family="Arial, sans-serif" font-size="14.527206" font-weight="bold" fill="var(--bg)" text-anchor="middle">block / rescue / always</text>

  <rect x="72.8125" y="154.851473" width="318.75" height="91.881178" rx="6.754536" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="86.875" y="175.524738" font-size="11.414265" font-weight="bold" fill="var(--primary-accent)" font-family="Courier New, monospace">block:                  # try</text>
  <text x="86.875" y="196.198003" font-size="11.414265" fill="var(--text)" font-family="Courier New, monospace">  - name: Risky deploy</text>
  <text x="86.875" y="215.72269" font-size="11.414265" fill="var(--text)" font-family="Courier New, monospace">    command: /opt/deploy.sh</text>
  <text x="86.875" y="235.247503" font-size="11.414265" fill="var(--text)" font-family="Courier New, monospace">  - name: Configure app</text>

  <rect x="72.8125" y="253.623739" width="318.75" height="91.881178" rx="6.754536" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="86.875" y="274.297004" font-size="11.414265" font-weight="bold" fill="var(--danger-accent)" font-family="Courier New, monospace">rescue:                 # catch</text>
  <text x="86.875" y="293.821691" font-size="11.414265" fill="var(--text)" font-family="Courier New, monospace">  - name: Alert on failure</text>
  <text x="86.875" y="313.346505" font-size="11.414265" fill="var(--text)" font-family="Courier New, monospace">    slack: msg="Deploy failed"</text>
  <text x="86.875" y="332.871318" font-size="11.414265" fill="var(--text)" font-family="Courier New, monospace">  - name: Rollback changes</text>

  <rect x="72.8125" y="352.396005" width="318.75" height="91.881178" rx="6.754536" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="86.875" y="373.069271" font-size="11.414265" font-weight="bold" fill="var(--ok-accent)" font-family="Courier New, monospace">always:                 # finally</text>
  <text x="86.875" y="392.594084" font-size="11.414265" fill="var(--text)" font-family="Courier New, monospace">  - name: Cleanup temp files</text>
  <text x="86.875" y="412.118771" font-size="11.414265" fill="var(--text)" font-family="Courier New, monospace">    file: path=/tmp/work state=absent</text>
  <text x="86.875" y="431.643458" font-size="11.414265" fill="var(--text)" font-family="Courier New, monospace">  - name: Log completion</text>

  <text x="232.1875" y="469.544508" font-family="Arial, sans-serif" font-size="11.414265" fill="var(--text-muted)" text-anchor="middle">block FAILS -&gt; rescue runs -&gt; always runs</text>
  <text x="232.1875" y="489.069321" font-family="Arial, sans-serif" font-size="11.414265" fill="var(--text-muted)" text-anchor="middle">block PASSES -&gt; skip rescue -&gt; always runs</text>
  <text x="232.1875" y="508.594008" font-family="Arial, sans-serif" font-size="11.414265" fill="var(--text-faint)" text-anchor="middle">ansible_failed_task / ansible_failed_result available</text>
  <text x="232.1875" y="528.118695" font-family="Arial, sans-serif" font-size="11.414265" fill="var(--text-faint)" text-anchor="middle">in rescue scope</text>

  <!-- CENTER TOP: ignore_errors and failed_when -->
  <rect x="419.6875" y="111.207913" width="318.75" height="212.475161" rx="6.754536" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="419.6875" y="111.207913" width="318.75" height="34.455442" rx="6.754536" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="419.6875" y="131.881178" width="318.75" height="13.782177" fill="url(#grad-warn)" rx="6.754536" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="579.0625" y="134.178208" font-family="Arial, sans-serif" font-size="14.527206" font-weight="bold" fill="var(--bg)" text-anchor="middle">ignore_errors / failed_when</text>
  <text x="433.75" y="168.633649" font-size="11.414265" fill="var(--text)" font-family="Courier New, monospace">- name: Check service (may fail)</text>
  <text x="433.75" y="188.158336" font-size="11.414265" fill="var(--text)" font-family="Courier New, monospace">  command: systemctl status nginx</text>
  <text x="433.75" y="207.68315" font-size="11.414265" fill="var(--warn-accent)" font-family="Courier New, monospace">  ignore_errors: true</text>
  <text x="433.75" y="227.207964" font-size="11.414265" fill="var(--warn-accent)" font-family="Courier New, monospace">  register: svc_status</text>
  <line x1="433.75" y1="239.841562" x2="724.375" y2="239.841562" stroke="var(--border)" stroke-width="1"/>
  <text x="433.75" y="260.514827" font-size="11.414265" fill="var(--text)" font-family="Courier New, monospace">- name: Run migration</text>
  <text x="433.75" y="280.039514" font-size="11.414265" fill="var(--text)" font-family="Courier New, monospace">  command: ./migrate.sh</text>
  <text x="433.75" y="299.564328" font-size="11.414265" fill="var(--warn-accent)" font-family="Courier New, monospace">  failed_when:</text>
  <text x="433.75" y="319.089142" font-size="11.414265" fill="var(--warn-accent)" font-family="Courier New, monospace">    - result.rc not in [0, 2]</text>

  <!-- CENTER MID: changed_when -->
  <rect x="419.6875" y="338.613829" width="318.75" height="120.593983" rx="6.754536" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="419.6875" y="338.613829" width="318.75" height="34.455442" rx="6.754536" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="419.6875" y="359.287094" width="318.75" height="13.782177" fill="url(#grad-info)" rx="6.754536" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="579.0625" y="361.584123" font-family="Arial, sans-serif" font-size="14.527206" font-weight="bold" fill="var(--bg)" text-anchor="middle">changed_when</text>
  <text x="433.75" y="396.039565" font-size="11.414265" fill="var(--text)" font-family="Courier New, monospace">- shell: ./check_and_update.sh</text>
  <text x="433.75" y="415.564379" font-size="11.414265" fill="var(--info-accent)" font-family="Courier New, monospace">  register: upd</text>
  <text x="433.75" y="435.089066" font-size="11.414265" fill="var(--info-accent)" font-family="Courier New, monospace">  changed_when: "'updated' in upd.stdout"</text>
  <text x="433.75" y="454.613753" font-size="11.414265" fill="var(--info-accent)" font-family="Courier New, monospace">  changed_when: false   # never changed</text>

  <!-- CENTER BOT: any_errors_fatal -->
  <rect x="419.6875" y="474.138566" width="318.75" height="68.910884" rx="6.754536" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="433.75" y="499.40589" font-size="12.451875" font-weight="bold" fill="var(--warn-accent)" font-family="Courier New, monospace">any_errors_fatal: true</text>
  <text x="433.75" y="522.376185" font-family="Arial, sans-serif" font-size="11.414265" fill="var(--text-muted)">Halt ALL hosts if ANY host fails this play</text>
  <text x="433.75" y="536.158362" font-family="Arial, sans-serif" font-size="11.414265" fill="var(--text-muted)">max_fail_percentage: 20  # allow 20%</text>

  <!-- RIGHT: Debugging -->
  <rect x="752.5" y="111.207913" width="468.75" height="430.693086" rx="6.754536" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="752.5" y="111.207913" width="468.75" height="34.455442" rx="6.754536" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="752.5" y="131.881178" width="468.75" height="13.782177" fill="url(#grad-ok)" rx="6.754536" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="986.875" y="134.178208" font-family="Arial, sans-serif" font-size="14.527206" font-weight="bold" fill="var(--bg)" text-anchor="middle">Debugging Techniques</text>

  <text x="766.5625" y="168.633649" font-family="Arial, sans-serif" font-size="12.451875" font-weight="bold" fill="var(--ok-accent)">debug module:</text>
  <text x="766.5625" y="189.306914" font-size="11.414265" fill="var(--text)" font-family="Courier New, monospace">- debug: msg="Value is {{ my_var }}"</text>
  <text x="766.5625" y="208.831728" font-size="11.414265" fill="var(--text)" font-family="Courier New, monospace">- debug: var=ansible_facts</text>
  <text x="766.5625" y="228.356415" font-size="11.414265" fill="var(--text)" font-family="Courier New, monospace">- debug: var=result  verbosity=2</text>

  <line x1="766.5625" y1="242.138592" x2="1207.1875" y2="242.138592" stroke="var(--border)" stroke-width="1"/>
  <text x="766.5625" y="265.108886" font-family="Arial, sans-serif" font-size="12.451875" font-weight="bold" fill="var(--ok-accent)">Verbose modes:</text>
  <text x="766.5625" y="285.782151" font-size="11.414265" fill="var(--text)" font-family="Courier New, monospace">-v</text>
  <text x="813.4375" y="285.782151" font-family="Arial, sans-serif" font-size="11.414265" fill="var(--text-muted)">task results</text>
  <text x="996.25" y="285.782151" font-size="11.414265" fill="var(--text)" font-family="Courier New, monospace">-vvv</text>
  <text x="1038.4375" y="285.782151" font-family="Arial, sans-serif" font-size="11.414265" fill="var(--text-muted)">full connection debug</text>
  <text x="766.5625" y="305.306965" font-size="11.414265" fill="var(--text)" font-family="Courier New, monospace">-vv</text>
  <text x="813.4375" y="305.306965" font-family="Arial, sans-serif" font-size="11.414265" fill="var(--text-muted)">file + line info</text>
  <text x="996.25" y="305.306965" font-size="11.414265" fill="var(--text)" font-family="Courier New, monospace">-vvvv</text>
  <text x="1047.8125" y="305.306965" font-family="Arial, sans-serif" font-size="11.414265" fill="var(--text-muted)">winrm / SSH debug</text>

  <line x1="766.5625" y1="321.386045" x2="1207.1875" y2="321.386045" stroke="var(--border)" stroke-width="1"/>
  <text x="766.5625" y="344.356339" font-family="Arial, sans-serif" font-size="12.451875" font-weight="bold" fill="var(--ok-accent)">ansible-lint:</text>
  <text x="766.5625" y="365.029731" font-size="11.414265" fill="var(--text)" font-family="Courier New, monospace">ansible-lint playbook.yml</text>
  <text x="766.5625" y="384.554418" font-size="11.414265" fill="var(--text)" font-family="Courier New, monospace">ansible-lint --list-rules</text>
  <text x="766.5625" y="404.079105" font-size="11.414265" fill="var(--text)" font-family="Courier New, monospace">ansible-lint --profile production</text>
  <text x="996.25" y="365.029731" font-family="Arial, sans-serif" font-size="11.414265" fill="var(--text-muted)">Checks best practices</text>
  <text x="996.25" y="384.554418" font-family="Arial, sans-serif" font-size="11.414265" fill="var(--text-muted)">Show all rules</text>
  <text x="996.25" y="404.079105" font-family="Arial, sans-serif" font-size="11.414265" fill="var(--text-muted)">Strict enforcement</text>

  <line x1="766.5625" y1="419.00986" x2="1207.1875" y2="419.00986" stroke="var(--border)" stroke-width="1"/>
  <text x="766.5625" y="441.980154" font-family="Arial, sans-serif" font-size="12.451875" font-weight="bold" fill="var(--ok-accent)">Useful debugging tasks:</text>
  <text x="766.5625" y="462.653419" font-size="11.414265" fill="var(--text)" font-family="Courier New, monospace">- name: Gather all facts first</text>
  <text x="766.5625" y="482.178106" font-size="11.414265" fill="var(--text)" font-family="Courier New, monospace">  setup:    # explicit fact gather</text>
  <text x="766.5625" y="501.70292" font-size="11.414265" fill="var(--text)" font-family="Courier New, monospace">- name: Print all vars</text>
  <text x="766.5625" y="521.227734" font-size="11.414265" fill="var(--text)" font-family="Courier New, monospace">  debug: var=vars  verbosity=3</text>

  <!-- Bottom bar -->
  <rect x="58.75" y="562.574264" width="1162.5" height="57.425736" rx="6.754536" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="72.8125" y="583.247402" font-family="Arial, sans-serif" font-size="12.451875" font-weight="bold" fill="var(--text)">Error Handling Decision:</text>
  <text x="246.25" y="583.247402" font-family="Arial, sans-serif" font-size="12.451875" fill="var(--text-muted)">Task may fail safely?</text>
  <text x="433.75" y="583.247402" font-family="Arial, sans-serif" font-size="12.451875" fill="var(--warn-accent)">-&gt; ignore_errors</text>
  <text x="574.375" y="583.247402" font-family="Arial, sans-serif" font-size="12.451875" fill="var(--text-muted)">|  Need custom fail logic?</text>
  <text x="780.625" y="583.247402" font-family="Arial, sans-serif" font-size="12.451875" fill="var(--warn-accent)">-&gt; failed_when</text>
  <text x="902.5" y="583.247402" font-family="Arial, sans-serif" font-size="12.451875" fill="var(--text-muted)">|  Need try/catch?</text>
  <text x="1052.5" y="583.247402" font-family="Arial, sans-serif" font-size="12.451875" fill="var(--primary-accent)">-&gt; block/rescue</text>
  <text x="72.8125" y="609.663304" font-family="Arial, sans-serif" font-size="12.451875" fill="var(--text-muted)">Always use</text>
  <text x="152.5" y="609.663304" font-size="12.451875" fill="var(--ok-accent)" font-family="Courier New, monospace">ansible-lint</text>
  <text x="241.5625" y="609.663304" font-family="Arial, sans-serif" font-size="12.451875" fill="var(--text-muted)">in CI pipelines to catch issues before production. Enable</text>
  <text x="682.1875" y="609.663304" font-size="12.451875" fill="var(--ok-accent)" font-family="Courier New, monospace">ANSIBLE_STDOUT_CALLBACK=yaml</text>
  <text x="949.375" y="609.663304" font-family="Arial, sans-serif" font-size="12.451875" fill="var(--text-muted)">for readable output.</text>
</svg>

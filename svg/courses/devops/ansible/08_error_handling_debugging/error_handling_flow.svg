<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Header -->
  <rect x="40" y="40" width="1200" height="47.125" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="70.8125" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--bg)" text-anchor="middle">Ansible Error Handling Flow</text>

  <!-- LEFT: Block/Rescue/Always -->
  <rect x="58.75" y="96.1875" width="346.875" height="339.8438" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="58.75" y="96.1875" width="346.875" height="27.1875" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="58.75" y="112.5" width="346.875" height="10.875" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="232.1875" y="114.3125" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)" text-anchor="middle">block / rescue / always</text>

  <rect x="72.8125" y="130.625" width="318.75" height="72.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="86.875" y="146.9375" font-family="monospace" font-size="10.1392" font-weight="bold" fill="var(--primary-accent)">block:                  # try</text>
  <text x="86.875" y="163.25" font-family="monospace" font-size="10.1392" fill="var(--text)">  - name: Risky deploy</text>
  <text x="86.875" y="178.6562" font-family="monospace" font-size="10.1392" fill="var(--text)">    command: /opt/deploy.sh</text>
  <text x="86.875" y="194.0625" font-family="monospace" font-size="10.1392" fill="var(--text)">  - name: Configure app</text>

  <rect x="72.8125" y="208.5625" width="318.75" height="72.5" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="86.875" y="224.875" font-family="monospace" font-size="10.1392" font-weight="bold" fill="var(--danger-accent)">rescue:                 # catch</text>
  <text x="86.875" y="240.2812" font-family="monospace" font-size="10.1392" fill="var(--text)">  - name: Alert on failure</text>
  <text x="86.875" y="255.6875" font-family="monospace" font-size="10.1392" fill="var(--text)">    slack: msg="Deploy failed"</text>
  <text x="86.875" y="271.0938" font-family="monospace" font-size="10.1392" fill="var(--text)">  - name: Rollback changes</text>

  <rect x="72.8125" y="286.5" width="318.75" height="72.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="86.875" y="302.8125" font-family="monospace" font-size="10.1392" font-weight="bold" fill="var(--ok-accent)">always:                 # finally</text>
  <text x="86.875" y="318.2188" font-family="monospace" font-size="10.1392" fill="var(--text)">  - name: Cleanup temp files</text>
  <text x="86.875" y="333.625" font-family="monospace" font-size="10.1392" fill="var(--text)">    file: path=/tmp/work state=absent</text>
  <text x="86.875" y="349.0312" font-family="monospace" font-size="10.1392" fill="var(--text)">  - name: Log completion</text>

  <text x="232.1875" y="378.9375" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)" text-anchor="middle">block FAILS -&gt; rescue runs -&gt; always runs</text>
  <text x="232.1875" y="394.3438" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)" text-anchor="middle">block PASSES -&gt; skip rescue -&gt; always runs</text>
  <text x="232.1875" y="409.75" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)" text-anchor="middle">ansible_failed_task / ansible_failed_result available</text>
  <text x="232.1875" y="425.1562" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)" text-anchor="middle">in rescue scope</text>

  <!-- CENTER TOP: ignore_errors and failed_when -->
  <rect x="419.6875" y="96.1875" width="318.75" height="167.6562" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="419.6875" y="96.1875" width="318.75" height="27.1875" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="419.6875" y="112.5" width="318.75" height="10.875" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="579.0625" y="114.3125" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)" text-anchor="middle">ignore_errors / failed_when</text>
  <text x="433.75" y="141.5" font-family="monospace" font-size="10.1392" fill="var(--text)">- name: Check service (may fail)</text>
  <text x="433.75" y="156.9062" font-family="monospace" font-size="10.1392" fill="var(--text)">  command: systemctl status nginx</text>
  <text x="433.75" y="172.3125" font-family="monospace" font-size="10.1392" fill="var(--warn-accent)">  ignore_errors: true</text>
  <text x="433.75" y="187.7188" font-family="monospace" font-size="10.1392" fill="var(--warn-accent)">  register: svc_status</text>
  <line x1="433.75" y1="197.6875" x2="724.375" y2="197.6875" stroke="var(--border)" stroke-width="1"/>
  <text x="433.75" y="214" font-family="monospace" font-size="10.1392" fill="var(--text)">- name: Run migration</text>
  <text x="433.75" y="229.4062" font-family="monospace" font-size="10.1392" fill="var(--text)">  command: ./migrate.sh</text>
  <text x="433.75" y="244.8125" font-family="monospace" font-size="10.1392" fill="var(--warn-accent)">  failed_when:</text>
  <text x="433.75" y="260.2188" font-family="monospace" font-size="10.1392" fill="var(--warn-accent)">    - result.rc not in [0, 2]</text>

  <!-- CENTER MID: changed_when -->
  <rect x="419.6875" y="275.625" width="318.75" height="95.1562" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="419.6875" y="275.625" width="318.75" height="27.1875" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="419.6875" y="291.9375" width="318.75" height="10.875" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="579.0625" y="293.75" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)" text-anchor="middle">changed_when</text>
  <text x="433.75" y="320.9375" font-family="monospace" font-size="10.1392" fill="var(--text)">- shell: ./check_and_update.sh</text>
  <text x="433.75" y="336.3438" font-family="monospace" font-size="10.1392" fill="var(--info-accent)">  register: upd</text>
  <text x="433.75" y="351.75" font-family="monospace" font-size="10.1392" fill="var(--info-accent)">  changed_when: "'updated' in upd.stdout"</text>
  <text x="433.75" y="367.1562" font-family="monospace" font-size="10.1392" fill="var(--info-accent)">  changed_when: false   # never changed</text>

  <!-- CENTER BOT: any_errors_fatal -->
  <rect x="419.6875" y="382.5625" width="318.75" height="54.375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="433.75" y="402.5" font-family="monospace" font-size="11.0609" font-weight="bold" fill="var(--warn-accent)">any_errors_fatal: true</text>
  <text x="433.75" y="420.625" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Halt ALL hosts if ANY host fails this play</text>
  <text x="433.75" y="431.5" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">max_fail_percentage: 20  # allow 20%</text>

  <!-- RIGHT: Debugging -->
  <rect x="752.5" y="96.1875" width="468.75" height="339.8438" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="752.5" y="96.1875" width="468.75" height="27.1875" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="752.5" y="112.5" width="468.75" height="10.875" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="986.875" y="114.3125" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)" text-anchor="middle">Debugging Techniques</text>

  <text x="766.5625" y="141.5" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--ok-accent)">debug module:</text>
  <text x="766.5625" y="157.8125" font-family="monospace" font-size="10.1392" fill="var(--text)">- debug: msg="Value is {{ my_var }}"</text>
  <text x="766.5625" y="173.2188" font-family="monospace" font-size="10.1392" fill="var(--text)">- debug: var=ansible_facts</text>
  <text x="766.5625" y="188.625" font-family="monospace" font-size="10.1392" fill="var(--text)">- debug: var=result  verbosity=2</text>

  <line x1="766.5625" y1="199.5" x2="1207.1875" y2="199.5" stroke="var(--border)" stroke-width="1"/>
  <text x="766.5625" y="217.625" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--ok-accent)">Verbose modes:</text>
  <text x="766.5625" y="233.9375" font-family="monospace" font-size="10.1392" fill="var(--text)">-v</text>
  <text x="813.4375" y="233.9375" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">task results</text>
  <text x="996.25" y="233.9375" font-family="monospace" font-size="10.1392" fill="var(--text)">-vvv</text>
  <text x="1038.4375" y="233.9375" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">full connection debug</text>
  <text x="766.5625" y="249.3438" font-family="monospace" font-size="10.1392" fill="var(--text)">-vv</text>
  <text x="813.4375" y="249.3438" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">file + line info</text>
  <text x="996.25" y="249.3438" font-family="monospace" font-size="10.1392" fill="var(--text)">-vvvv</text>
  <text x="1047.8125" y="249.3438" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">winrm / SSH debug</text>

  <line x1="766.5625" y1="262.0312" x2="1207.1875" y2="262.0312" stroke="var(--border)" stroke-width="1"/>
  <text x="766.5625" y="280.1562" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--ok-accent)">ansible-lint:</text>
  <text x="766.5625" y="296.4688" font-family="monospace" font-size="10.1392" fill="var(--text)">ansible-lint playbook.yml</text>
  <text x="766.5625" y="311.875" font-family="monospace" font-size="10.1392" fill="var(--text)">ansible-lint --list-rules</text>
  <text x="766.5625" y="327.2812" font-family="monospace" font-size="10.1392" fill="var(--text)">ansible-lint --profile production</text>
  <text x="996.25" y="296.4688" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Checks best practices</text>
  <text x="996.25" y="311.875" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Show all rules</text>
  <text x="996.25" y="327.2812" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Strict enforcement</text>

  <line x1="766.5625" y1="339.0625" x2="1207.1875" y2="339.0625" stroke="var(--border)" stroke-width="1"/>
  <text x="766.5625" y="357.1875" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--ok-accent)">Useful debugging tasks:</text>
  <text x="766.5625" y="373.5" font-family="monospace" font-size="10.1392" fill="var(--text)">- name: Gather all facts first</text>
  <text x="766.5625" y="388.9062" font-family="monospace" font-size="10.1392" fill="var(--text)">  setup:    # explicit fact gather</text>
  <text x="766.5625" y="404.3125" font-family="monospace" font-size="10.1392" fill="var(--text)">- name: Print all vars</text>
  <text x="766.5625" y="419.7188" font-family="monospace" font-size="10.1392" fill="var(--text)">  debug: var=vars  verbosity=3</text>

  <!-- Bottom bar -->
  <rect x="58.75" y="452.3438" width="1162.5" height="45.3125" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="72.8125" y="468.6562" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--text)">Error Handling Decision:</text>
  <text x="246.25" y="468.6562" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Task may fail safely?</text>
  <text x="433.75" y="468.6562" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--warn-accent)">-&gt; ignore_errors</text>
  <text x="574.375" y="468.6562" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">|  Need custom fail logic?</text>
  <text x="780.625" y="468.6562" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--warn-accent)">-&gt; failed_when</text>
  <text x="902.5" y="468.6562" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">|  Need try/catch?</text>
  <text x="1052.5" y="468.6562" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--primary-accent)">-&gt; block/rescue</text>
  <text x="72.8125" y="489.5" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Always use</text>
  <text x="152.5" y="489.5" font-family="monospace" font-size="11.0609" fill="var(--ok-accent)">ansible-lint</text>
  <text x="241.5625" y="489.5" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">in CI pipelines to catch issues before production. Enable</text>
  <text x="682.1875" y="489.5" font-family="monospace" font-size="11.0609" fill="var(--ok-accent)">ANSIBLE_STDOUT_CALLBACK=yaml</text>
  <text x="949.375" y="489.5" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">for readable output.</text>
</svg>

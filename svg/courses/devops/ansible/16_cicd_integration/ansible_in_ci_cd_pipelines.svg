  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="17.7778" y="17.7778" width="1102.2222" height="42.6667" rx="7.1111" fill="url(#grad-accent)" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="46.2222" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#ffffff">Ansible in CI/CD Pipeline</ns0:text>
  <ns0:rect x="26.6667" y="88.8889" width="213.3333" height="124.4444" rx="7.1111" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="133.3333" y="135.1111" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="#1565c0">Code</ns0:text>
  <ns0:text x="133.3333" y="163.5556" text-anchor="middle" font-size="14.2222" fill="#333">Commit / PR</ns0:text>
  <ns0:text x="133.3333" y="186.6667" text-anchor="middle" font-size="11.5556" fill="#777">git push</ns0:text>
  <ns0:text x="133.3333" y="202.6667" text-anchor="middle" font-size="11.5556" fill="#777">merge request</ns0:text>
  <ns0:line x1="241.7778" y1="151.1111" x2="273.7778" y2="151.1111" stroke="#1565c0" stroke-width="2.2222" marker-end="url(#arrow-accent)" />
  <ns0:rect x="278.2222" y="88.8889" width="213.3333" height="124.4444" rx="7.1111" fill="#e8f5e9" stroke="#43a047" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="384.8889" y="135.1111" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="#1b5e20">Build</ns0:text>
  <ns0:text x="384.8889" y="163.5556" text-anchor="middle" font-size="14.2222" fill="#333">Lint + Syntax</ns0:text>
  <ns0:text x="384.8889" y="186.6667" text-anchor="middle" font-size="11.5556" fill="#777">ansible-lint</ns0:text>
  <ns0:text x="384.8889" y="202.6667" text-anchor="middle" font-size="11.5556" fill="#777">yamllint</ns0:text>
  <ns0:line x1="493.3333" y1="151.1111" x2="525.3333" y2="151.1111" stroke="#1565c0" stroke-width="2.2222" marker-end="url(#arrow-accent)" />
  <ns0:rect x="529.7778" y="88.8889" width="213.3333" height="124.4444" rx="7.1111" fill="#fff8e1" stroke="#f9a825" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="636.4444" y="135.1111" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="#e65100">Test</ns0:text>
  <ns0:text x="636.4444" y="163.5556" text-anchor="middle" font-size="14.2222" fill="#333">Molecule tests</ns0:text>
  <ns0:text x="636.4444" y="186.6667" text-anchor="middle" font-size="11.5556" fill="#777">unit + functional</ns0:text>
  <ns0:text x="636.4444" y="202.6667" text-anchor="middle" font-size="11.5556" fill="#777">molecule test</ns0:text>
  <ns0:line x1="744.8889" y1="151.1111" x2="776.8889" y2="151.1111" stroke="#1565c0" stroke-width="2.2222" marker-end="url(#arrow-accent)" />
  <ns0:rect x="781.3333" y="88.8889" width="213.3333" height="124.4444" rx="7.1111" fill="#fce4ec" stroke="#e91e63" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="888" y="131.5556" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="#880e4f">Deploy</ns0:text>
  <ns0:text x="888" y="158.2222" text-anchor="middle" font-size="14.2222" fill="#333">(Ansible)</ns0:text>
  <ns0:text x="888" y="184.8889" text-anchor="middle" font-size="11.5556" fill="#777">ansible-playbook</ns0:text>
  <ns0:text x="888" y="200.8889" text-anchor="middle" font-size="11.5556" fill="#777">site.yml</ns0:text>
  <ns0:line x1="888" y1="215.1111" x2="888" y2="282.6667" stroke="#1565c0" stroke-width="2.2222" marker-end="url(#arrow-accent)" />
  <ns0:rect x="745.7778" y="289.7778" width="284.4444" height="115.5556" rx="7.1111" fill="#e8f5e9" stroke="#43a047" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="888" y="336" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="#1b5e20">Staging</ns0:text>
  <ns0:text x="888" y="364.4444" text-anchor="middle" font-size="14.2222" fill="#555">Environment</ns0:text>
  <ns0:text x="888" y="391.1111" text-anchor="middle" font-size="11.5556" fill="#777">Integration tests run here</ns0:text>
  <ns0:line x1="888" y1="407.1111" x2="888" y2="474.6667" stroke="#1565c0" stroke-width="2.2222" marker-end="url(#arrow-accent)" />
  <ns0:text x="906.6667" y="446.2222" font-size="12.4444" fill="#555">Approval / gate</ns0:text>
  <ns0:rect x="745.7778" y="481.7778" width="284.4444" height="115.5556" rx="7.1111" fill="#c8e6c9" stroke="#43a047" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:text x="888" y="528" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="#1b5e20">Production</ns0:text>
  <ns0:text x="888" y="556.4444" text-anchor="middle" font-size="14.2222" fill="#555">Environment</ns0:text>
  <ns0:text x="888" y="582.2222" text-anchor="middle" font-size="11.5556" fill="#777">ansible-playbook --limit prod</ns0:text>
  <ns0:rect x="26.6667" y="257.7778" width="675.5556" height="337.7778" rx="7.1111" fill="url(#grad-surface)" stroke="#bbbbbb" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:rect x="26.6667" y="257.7778" width="675.5556" height="35.5556" rx="7.1111" fill="#eeeeee" />
  <ns0:rect x="26.6667" y="275.5556" width="675.5556" height="17.7778" rx="0" fill="#eeeeee" />
  <ns0:text x="364.4444" y="280.8889" text-anchor="middle" font-size="14.2222" font-weight="bold" fill="#333">CI Runner (GitHub Actions / GitLab CI / Jenkins)</ns0:text>
  <ns0:text x="53.3333" y="321.7778" font-size="14.2222" fill="#333" font-weight="600">Example .github/workflows/ansible.yml steps:</ns0:text>
  <ns0:text x="53.3333" y="350.2222" font-family="monospace" font-size="12.4444" fill="#1565c0">- name: Lint</ns0:text>
  <ns0:text x="53.3333" y="369.7778" font-family="monospace" font-size="12.4444" fill="#555">  run: ansible-lint roles/</ns0:text>
  <ns0:text x="53.3333" y="394.6667" font-family="monospace" font-size="12.4444" fill="#1565c0">- name: Molecule test</ns0:text>
  <ns0:text x="53.3333" y="414.2222" font-family="monospace" font-size="12.4444" fill="#555">  run: molecule test</ns0:text>
  <ns0:text x="53.3333" y="439.1111" font-family="monospace" font-size="12.4444" fill="#1565c0">- name: Deploy to staging</ns0:text>
  <ns0:text x="53.3333" y="458.6667" font-family="monospace" font-size="12.4444" fill="#555">  run: ansible-playbook site.yml -i inventory/staging</ns0:text>
  <ns0:text x="53.3333" y="483.5556" font-family="monospace" font-size="12.4444" fill="#1565c0">- name: Deploy to production</ns0:text>
  <ns0:text x="53.3333" y="503.1111" font-family="monospace" font-size="12.4444" fill="#555">  run: ansible-playbook site.yml -i inventory/prod</ns0:text>
  <ns0:text x="53.3333" y="528" font-family="monospace" font-size="12.4444" fill="#888">  if: github.ref == 'refs/heads/main'</ns0:text>
  <ns0:text x="53.3333" y="552.8889" font-family="monospace" font-size="12.4444" fill="#888">  environment: production</ns0:text>
  <ns0:text x="53.3333" y="579.5556" font-size="12.4444" fill="#777">Secrets stored in GitHub Secrets / HashiCorp Vault / AWX credentials</ns0:text>
</ns0:svg>
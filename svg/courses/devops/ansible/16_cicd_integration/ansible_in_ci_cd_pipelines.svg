<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" />
  <rect x="17.7778" y="17.7778" width="1102.2222" height="42.6667" rx="7.1111" fill="url(#grad-primary)" filter="url(#shadow)" />
  <text x="568.8889" y="46.2222" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--bg)">Ansible in CI/CD Pipeline</text>
  <rect x="26.6667" y="88.8889" width="213.3333" height="124.4444" rx="7.1111" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1.7778" filter="url(#shadow)" />
  <text x="133.3333" y="135.1111" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--primary-dk)">Code</text>
  <text x="133.3333" y="163.5556" text-anchor="middle" font-size="14.2222" fill="var(--text-dark)">Commit / PR</text>
  <text x="133.3333" y="186.6667" text-anchor="middle" font-size="11.5556" fill="var(--text-lighter)">git push</text>
  <text x="133.3333" y="202.6667" text-anchor="middle" font-size="11.5556" fill="var(--text-lighter)">merge request</text>
  <line x1="241.7778" y1="151.1111" x2="273.7778" y2="151.1111" stroke="var(--primary-dk)" stroke-width="2.2222" marker-end="url(#arrow-primary)" />
  <rect x="278.2222" y="88.8889" width="213.3333" height="124.4444" rx="7.1111" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1.7778" filter="url(#shadow)" />
  <text x="384.8889" y="135.1111" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--ok-deep)">Build</text>
  <text x="384.8889" y="163.5556" text-anchor="middle" font-size="14.2222" fill="var(--text-dark)">Lint + Syntax</text>
  <text x="384.8889" y="186.6667" text-anchor="middle" font-size="11.5556" fill="var(--text-lighter)">ansible-lint</text>
  <text x="384.8889" y="202.6667" text-anchor="middle" font-size="11.5556" fill="var(--text-lighter)">yamllint</text>
  <line x1="493.3333" y1="151.1111" x2="525.3333" y2="151.1111" stroke="var(--primary-dk)" stroke-width="2.2222" marker-end="url(#arrow-primary)" />
  <rect x="529.7778" y="88.8889" width="213.3333" height="124.4444" rx="7.1111" fill="var(--warn-pale3)" stroke="var(--warn-amber)" stroke-width="1.7778" filter="url(#shadow)" />
  <text x="636.4444" y="135.1111" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--warn-dk)">Test</text>
  <text x="636.4444" y="163.5556" text-anchor="middle" font-size="14.2222" fill="var(--text-dark)">Molecule tests</text>
  <text x="636.4444" y="186.6667" text-anchor="middle" font-size="11.5556" fill="var(--text-lighter)">unit + functional</text>
  <text x="636.4444" y="202.6667" text-anchor="middle" font-size="11.5556" fill="var(--text-lighter)">molecule test</text>
  <line x1="744.8889" y1="151.1111" x2="776.8889" y2="151.1111" stroke="var(--primary-dk)" stroke-width="2.2222" marker-end="url(#arrow-primary)" />
  <rect x="781.3333" y="88.8889" width="213.3333" height="124.4444" rx="7.1111" fill="var(--danger-pale3)" stroke="var(--danger-bright)" stroke-width="1.7778" filter="url(#shadow)" />
  <text x="888" y="131.5556" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--danger-pink)">Deploy</text>
  <text x="888" y="158.2222" text-anchor="middle" font-size="14.2222" fill="var(--text-dark)">(Ansible)</text>
  <text x="888" y="184.8889" text-anchor="middle" font-size="11.5556" fill="var(--text-lighter)">ansible-playbook</text>
  <text x="888" y="200.8889" text-anchor="middle" font-size="11.5556" fill="var(--text-lighter)">site.yml</text>
  <line x1="888" y1="215.1111" x2="888" y2="282.6667" stroke="var(--primary-dk)" stroke-width="2.2222" marker-end="url(#arrow-primary)" />
  <rect x="745.7778" y="289.7778" width="284.4444" height="115.5556" rx="7.1111" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1.7778" filter="url(#shadow)" />
  <text x="888" y="336" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--ok-deep)">Staging</text>
  <text x="888" y="364.4444" text-anchor="middle" font-size="14.2222" fill="var(--text-muted)">Environment</text>
  <text x="888" y="391.1111" text-anchor="middle" font-size="11.5556" fill="var(--text-lighter)">Integration tests run here</text>
  <line x1="888" y1="407.1111" x2="888" y2="474.6667" stroke="var(--primary-dk)" stroke-width="2.2222" marker-end="url(#arrow-primary)" />
  <text x="906.6667" y="446.2222" font-size="12.4444" fill="var(--text-muted)">Approval / gate</text>
  <rect x="745.7778" y="481.7778" width="284.4444" height="115.5556" rx="7.1111" fill="var(--ok-lt)" stroke="var(--ok)" stroke-width="2.2222" filter="url(#shadow)" />
  <text x="888" y="528" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--ok-deep)">Production</text>
  <text x="888" y="556.4444" text-anchor="middle" font-size="14.2222" fill="var(--text-muted)">Environment</text>
  <text x="888" y="582.2222" text-anchor="middle" font-size="11.5556" fill="var(--text-lighter)">ansible-playbook --limit prod</text>
  <rect x="26.6667" y="257.7778" width="675.5556" height="337.7778" rx="7.1111" fill="url(#grad-surface)" stroke="var(--border-strong)" stroke-width="1.3333" filter="url(#shadow)" />
  <rect x="26.6667" y="257.7778" width="675.5556" height="35.5556" rx="7.1111" fill="var(--surface-alt)" />
  <rect x="26.6667" y="275.5556" width="675.5556" height="17.7778" rx="0" fill="var(--surface-alt)" />
  <text x="364.4444" y="280.8889" text-anchor="middle" font-size="14.2222" font-weight="bold" fill="var(--text-dark)">CI Runner (GitHub Actions / GitLab CI / Jenkins)</text>
  <text x="53.3333" y="321.7778" font-size="14.2222" fill="var(--text-dark)" font-weight="600">Example .github/workflows/ansible.yml steps:</text>
  <text x="53.3333" y="350.2222" font-family="monospace" font-size="12.4444" fill="var(--primary-dk)">- name: Lint</text>
  <text x="53.3333" y="369.7778" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">  run: ansible-lint roles/</text>
  <text x="53.3333" y="394.6667" font-family="monospace" font-size="12.4444" fill="var(--primary-dk)">- name: Molecule test</text>
  <text x="53.3333" y="414.2222" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">  run: molecule test</text>
  <text x="53.3333" y="439.1111" font-family="monospace" font-size="12.4444" fill="var(--primary-dk)">- name: Deploy to staging</text>
  <text x="53.3333" y="458.6667" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">  run: ansible-playbook site.yml -i inventory/staging</text>
  <text x="53.3333" y="483.5556" font-family="monospace" font-size="12.4444" fill="var(--primary-dk)">- name: Deploy to production</text>
  <text x="53.3333" y="503.1111" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">  run: ansible-playbook site.yml -i inventory/prod</text>
  <text x="53.3333" y="528" font-family="monospace" font-size="12.4444" fill="var(--text-faint)">  if: github.ref == 'refs/heads/main'</text>
  <text x="53.3333" y="552.8889" font-family="monospace" font-size="12.4444" fill="var(--text-faint)">  environment: production</text>
  <text x="53.3333" y="579.5556" font-size="12.4444" fill="var(--text-lighter)">Secrets stored in GitHub Secrets / HashiCorp Vault / AWX credentials</text>
</svg>
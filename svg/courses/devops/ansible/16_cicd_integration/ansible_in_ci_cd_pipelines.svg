<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="58.75" y="56.1111" width="1162.5" height="38.6667" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="81.8889" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--bg)">Ansible in CI/CD Pipeline</text>
  <rect x="68.125" y="120.5556" width="225" height="112.7777" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="180.625" y="162.4444" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--primary-accent)">Code</text>
  <text x="180.625" y="188.2223" text-anchor="middle" font-size="13.9044" fill="var(--text)">Commit / PR</text>
  <text x="180.625" y="209.1667" text-anchor="middle" font-size="11.2974" fill="var(--text-muted)">git push</text>
  <text x="180.625" y="223.6667" text-anchor="middle" font-size="11.2974" fill="var(--text-muted)">merge request</text>
  <line x1="295" y1="176.9444" x2="328.75" y2="176.9444" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="333.4375" y="120.5556" width="225" height="112.7777" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="445.9375" y="162.4444" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--ok-accent)">Build</text>
  <text x="445.9375" y="188.2223" text-anchor="middle" font-size="13.9044" fill="var(--text)">Lint + Syntax</text>
  <text x="445.9375" y="209.1667" text-anchor="middle" font-size="11.2974" fill="var(--text-muted)">ansible-lint</text>
  <text x="445.9375" y="223.6667" text-anchor="middle" font-size="11.2974" fill="var(--text-muted)">yamllint</text>
  <line x1="560.3125" y1="176.9444" x2="594.0625" y2="176.9444" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="598.75" y="120.5556" width="225" height="112.7777" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="711.2499" y="162.4444" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--warn-accent)">Test</text>
  <text x="711.2499" y="188.2223" text-anchor="middle" font-size="13.9044" fill="var(--text)">Molecule tests</text>
  <text x="711.2499" y="209.1667" text-anchor="middle" font-size="11.2974" fill="var(--text-muted)">unit + functional</text>
  <text x="711.2499" y="223.6667" text-anchor="middle" font-size="11.2974" fill="var(--text-muted)">molecule test</text>
  <line x1="825.625" y1="176.9444" x2="859.375" y2="176.9444" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="864.0624" y="120.5556" width="225" height="112.7777" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="976.5625" y="159.2223" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--danger-accent)">Deploy</text>
  <text x="976.5625" y="183.3889" text-anchor="middle" font-size="13.9044" fill="var(--text)">(Ansible)</text>
  <text x="976.5625" y="207.5556" text-anchor="middle" font-size="11.2974" fill="var(--text-muted)">ansible-playbook</text>
  <text x="976.5625" y="222.0556" text-anchor="middle" font-size="11.2974" fill="var(--text-muted)">site.yml</text>
  <line x1="976.5625" y1="234.9444" x2="976.5625" y2="296.1667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="826.5625" y="302.6111" width="299.9999" height="104.7223" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="976.5625" y="344.5" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--ok-accent)">Staging</text>
  <text x="976.5625" y="370.2777" text-anchor="middle" font-size="13.9044" fill="var(--text-muted)">Environment</text>
  <text x="976.5625" y="394.4444" text-anchor="middle" font-size="11.2974" fill="var(--text-muted)">Integration tests run here</text>
  <line x1="976.5625" y1="408.9444" x2="976.5625" y2="470.1667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="996.25" y="444.3889" font-size="12.1663" fill="var(--text-muted)">Approval / gate</text>
  <rect x="826.5625" y="476.6111" width="299.9999" height="104.7223" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="976.5625" y="518.5" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--ok-accent)">Production</text>
  <text x="976.5625" y="544.2777" text-anchor="middle" font-size="13.9044" fill="var(--text-muted)">Environment</text>
  <text x="976.5625" y="567.6389" text-anchor="middle" font-size="11.2974" fill="var(--text-muted)">ansible-playbook --limit prod</text>
  <rect x="68.125" y="273.6111" width="712.5" height="306.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="68.125" y="273.6111" width="712.5" height="32.2223" rx="6" fill="var(--surface)" />
  <rect x="68.125" y="289.7223" width="712.5" height="16.1111" rx="6" fill="var(--surface)" />
  <text x="424.3749" y="294.5556" text-anchor="middle" font-size="13.9044" font-weight="bold" fill="var(--text)">CI Runner (GitHub Actions / GitLab CI / Jenkins)</text>
  <text x="96.25" y="331.6111" font-size="13.9044" fill="var(--text)" font-weight="600">Example .github/workflows/ansible.yml steps:</text>
  <text x="96.25" y="357.3889" font-family="monospace" font-size="12.1663" fill="var(--primary-accent)">- name: Lint</text>
  <text x="96.25" y="375.1111" font-family="monospace" font-size="12.1663" fill="var(--text-muted)">  run: ansible-lint roles/</text>
  <text x="96.25" y="397.6667" font-family="monospace" font-size="12.1663" fill="var(--primary-accent)">- name: Molecule test</text>
  <text x="96.25" y="415.3889" font-family="monospace" font-size="12.1663" fill="var(--text-muted)">  run: molecule test</text>
  <text x="96.25" y="437.9444" font-family="monospace" font-size="12.1663" fill="var(--primary-accent)">- name: Deploy to staging</text>
  <text x="96.25" y="455.6667" font-family="monospace" font-size="12.1663" fill="var(--text-muted)">  run: ansible-playbook site.yml -i inventory/staging</text>
  <text x="96.25" y="478.2223" font-family="monospace" font-size="12.1663" fill="var(--primary-accent)">- name: Deploy to production</text>
  <text x="96.25" y="495.9444" font-family="monospace" font-size="12.1663" fill="var(--text-muted)">  run: ansible-playbook site.yml -i inventory/prod</text>
  <text x="96.25" y="518.5" font-family="monospace" font-size="12.1663" fill="var(--text-faint)">  if: github.ref == 'refs/heads/main'</text>
  <text x="96.25" y="541.0556" font-family="monospace" font-size="12.1663" fill="var(--text-faint)">  environment: production</text>
  <text x="96.25" y="565.2223" font-size="12.1663" fill="var(--text-muted)">Secrets stored in GitHub Secrets / HashiCorp Vault / AWX credentials</text>
</svg>
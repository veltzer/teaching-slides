<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" font-family="sans-serif">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
  </marker>
</defs>
<rect x="20" y="30" width="110" height="50" fill="#e3f2fd" stroke="#333" stroke-width="1.5" rx="4"/>
<text x="75" y="51" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">Code</text>
<text x="75" y="67" font-size="11" font-weight="normal" fill="#222" text-anchor="middle">Commit</text>
<line x1="130" y1="55" x2="158" y2="55" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="160" y="30" width="110" height="50" fill="#e8f5e9" stroke="#333" stroke-width="1.5" rx="4"/>
<text x="215" y="60" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">Build</text>
<line x1="270" y1="55" x2="298" y2="55" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="300" y="30" width="110" height="50" fill="#fff3e0" stroke="#333" stroke-width="1.5" rx="4"/>
<text x="355" y="60" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">Test</text>
<line x1="410" y1="55" x2="438" y2="55" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="440" y="30" width="110" height="50" fill="#fce4ec" stroke="#333" stroke-width="1.5" rx="4"/>
<text x="495" y="51" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">Deploy</text>
<text x="495" y="67" font-size="11" font-weight="normal" fill="#222" text-anchor="middle">(Ansible)</text>
<line x1="495" y1="80" x2="495" y2="118" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="425" y="120" width="140" height="40" fill="#e8f5e9" stroke="#333" stroke-width="1.5" rx="4"/>
<text x="495" y="135" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">Staging</text>
<text x="495" y="150" font-size="11" font-weight="normal" fill="#222" text-anchor="middle">Environment</text>
<line x1="495" y1="160" x2="495" y2="198" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="425" y="200" width="140" height="40" fill="#c8e6c9" stroke="#333" stroke-width="1.5" rx="4"/>
<text x="495" y="215" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">Production</text>
<text x="495" y="230" font-size="11" font-weight="normal" fill="#222" text-anchor="middle">Environment</text>

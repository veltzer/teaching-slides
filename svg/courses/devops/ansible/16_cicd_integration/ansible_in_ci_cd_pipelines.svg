<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="17.7778" y="17.7778" width="1102.2222" height="42.6667" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="568.8889" y="46.2222" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--bg)">Ansible in CI/CD Pipeline</text>
  <rect x="26.6667" y="88.8889" width="213.3333" height="124.4444" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="133.3333" y="135.1111" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--primary-accent)">Code</text>
  <text x="133.3333" y="163.5556" text-anchor="middle" font-size="14.2222" fill="var(--text)">Commit / PR</text>
  <text x="133.3333" y="186.6667" text-anchor="middle" font-size="11.5556" fill="var(--text-muted)">git push</text>
  <text x="133.3333" y="202.6667" text-anchor="middle" font-size="11.5556" fill="var(--text-muted)">merge request</text>
  <line x1="241.7778" y1="151.1111" x2="273.7778" y2="151.1111" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="278.2222" y="88.8889" width="213.3333" height="124.4444" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="384.8889" y="135.1111" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--ok-accent)">Build</text>
  <text x="384.8889" y="163.5556" text-anchor="middle" font-size="14.2222" fill="var(--text)">Lint + Syntax</text>
  <text x="384.8889" y="186.6667" text-anchor="middle" font-size="11.5556" fill="var(--text-muted)">ansible-lint</text>
  <text x="384.8889" y="202.6667" text-anchor="middle" font-size="11.5556" fill="var(--text-muted)">yamllint</text>
  <line x1="493.3333" y1="151.1111" x2="525.3333" y2="151.1111" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="529.7778" y="88.8889" width="213.3333" height="124.4444" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="636.4444" y="135.1111" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--warn-accent)">Test</text>
  <text x="636.4444" y="163.5556" text-anchor="middle" font-size="14.2222" fill="var(--text)">Molecule tests</text>
  <text x="636.4444" y="186.6667" text-anchor="middle" font-size="11.5556" fill="var(--text-muted)">unit + functional</text>
  <text x="636.4444" y="202.6667" text-anchor="middle" font-size="11.5556" fill="var(--text-muted)">molecule test</text>
  <line x1="744.8889" y1="151.1111" x2="776.8889" y2="151.1111" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="781.3333" y="88.8889" width="213.3333" height="124.4444" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="888" y="131.5556" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--danger-accent)">Deploy</text>
  <text x="888" y="158.2222" text-anchor="middle" font-size="14.2222" fill="var(--text)">(Ansible)</text>
  <text x="888" y="184.8889" text-anchor="middle" font-size="11.5556" fill="var(--text-muted)">ansible-playbook</text>
  <text x="888" y="200.8889" text-anchor="middle" font-size="11.5556" fill="var(--text-muted)">site.yml</text>
  <line x1="888" y1="215.1111" x2="888" y2="282.6667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="745.7778" y="289.7778" width="284.4444" height="115.5556" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="888" y="336" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--ok-accent)">Staging</text>
  <text x="888" y="364.4444" text-anchor="middle" font-size="14.2222" fill="var(--text-muted)">Environment</text>
  <text x="888" y="391.1111" text-anchor="middle" font-size="11.5556" fill="var(--text-muted)">Integration tests run here</text>
  <line x1="888" y1="407.1111" x2="888" y2="474.6667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="906.6667" y="446.2222" font-size="12.4444" fill="var(--text-muted)">Approval / gate</text>
  <rect x="745.7778" y="481.7778" width="284.4444" height="115.5556" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="888" y="528" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--ok-accent)">Production</text>
  <text x="888" y="556.4444" text-anchor="middle" font-size="14.2222" fill="var(--text-muted)">Environment</text>
  <text x="888" y="582.2222" text-anchor="middle" font-size="11.5556" fill="var(--text-muted)">ansible-playbook --limit prod</text>
  <rect x="26.6667" y="257.7778" width="675.5556" height="337.7778" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="26.6667" y="257.7778" width="675.5556" height="35.5556" rx="6" fill="var(--surface)" />
  <rect x="26.6667" y="275.5556" width="675.5556" height="17.7778" rx="6" fill="var(--surface)" />
  <text x="364.4444" y="280.8889" text-anchor="middle" font-size="14.2222" font-weight="bold" fill="var(--text)">CI Runner (GitHub Actions / GitLab CI / Jenkins)</text>
  <text x="53.3333" y="321.7778" font-size="14.2222" fill="var(--text)" font-weight="600">Example .github/workflows/ansible.yml steps:</text>
  <text x="53.3333" y="350.2222" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">- name: Lint</text>
  <text x="53.3333" y="369.7778" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">  run: ansible-lint roles/</text>
  <text x="53.3333" y="394.6667" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">- name: Molecule test</text>
  <text x="53.3333" y="414.2222" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">  run: molecule test</text>
  <text x="53.3333" y="439.1111" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">- name: Deploy to staging</text>
  <text x="53.3333" y="458.6667" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">  run: ansible-playbook site.yml -i inventory/staging</text>
  <text x="53.3333" y="483.5556" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">- name: Deploy to production</text>
  <text x="53.3333" y="503.1111" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">  run: ansible-playbook site.yml -i inventory/prod</text>
  <text x="53.3333" y="528" font-family="monospace" font-size="12.4444" fill="var(--text-faint)">  if: github.ref == 'refs/heads/main'</text>
  <text x="53.3333" y="552.8889" font-family="monospace" font-size="12.4444" fill="var(--text-faint)">  environment: production</text>
  <text x="53.3333" y="579.5556" font-size="12.4444" fill="var(--text-muted)">Secrets stored in GitHub Secrets / HashiCorp Vault / AWX credentials</text>
</svg>
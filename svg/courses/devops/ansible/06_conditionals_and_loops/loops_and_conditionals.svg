<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <!-- Column: when -->
  <rect x="40" y="40" width="290" height="261.568627450981" rx="10.664215404617" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="79.803921568628" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.328430809235" font-weight="bold" fill="var(--primary-text)">when</text>
  <text x="60" y="119.607843137255" font-family="Courier New, monospace" font-size="13.863480026002" fill="var(--primary-text)">when: os_family == "Debian"</text>
  <text x="60" y="153.725490196079" font-family="Courier New, monospace" font-size="13.863480026002" fill="var(--primary-text)">when:</text>
  <text x="60" y="182.156862745098" font-family="Courier New, monospace" font-size="13.863480026002" fill="var(--primary-text)">  - memtotal &gt;= 2048</text>
  <text x="60" y="210.588235294117" font-family="Courier New, monospace" font-size="13.863480026002" fill="var(--primary-text)">  - "web in groups"</text>
  <text x="60" y="264.117647058824" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--primary-text)">List = AND, or = OR</text>

  <!-- Column: loop -->
  <rect x="355" y="40" width="290" height="261.568627450981" rx="10.664215404617" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="79.803921568628" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.328430809235" font-weight="bold" fill="var(--ok-text)">loop</text>
  <text x="375" y="119.607843137255" font-family="Courier New, monospace" font-size="13.863480026002" fill="var(--ok-text)">apt: name={{ item }}</text>
  <text x="375" y="148.039215686274" font-family="Courier New, monospace" font-size="13.863480026002" fill="var(--ok-text)">loop:</text>
  <text x="375" y="170.78431372549" font-family="Courier New, monospace" font-size="13.863480026002" fill="var(--ok-text)">  - nginx</text>
  <text x="375" y="193.529411764707" font-family="Courier New, monospace" font-size="13.863480026002" fill="var(--ok-text)">  - curl</text>
  <text x="375" y="227.647058823529" font-family="Courier New, monospace" font-size="13.863480026002" fill="var(--ok-text)">loop:</text>
  <text x="375" y="250.392156862745" font-family="Courier New, monospace" font-size="13.863480026002" fill="var(--ok-text)">  - { name: bob }</text>
  <text x="375" y="278.823529411765" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--ok-text)">Access: item.name</text>

  <!-- Column: loop_control -->
  <rect x="670" y="40" width="290" height="261.568627450981" rx="10.664215404617" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="815" y="79.803921568628" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.328430809235" font-weight="bold" fill="var(--warn-text)">loop_control</text>
  <text x="690" y="119.607843137255" font-family="Courier New, monospace" font-size="13.863480026002" fill="var(--warn-text)">loop_control:</text>
  <text x="690" y="148.039215686274" font-family="Courier New, monospace" font-size="13.863480026002" fill="var(--warn-text)">  loop_var: usr</text>
  <text x="690" y="176.470588235295" font-family="Courier New, monospace" font-size="13.863480026002" fill="var(--warn-text)">  label: usr.name</text>
  <text x="690" y="204.901960784314" font-family="Courier New, monospace" font-size="13.863480026002" fill="var(--warn-text)">  index_var: idx</text>
  <text x="690" y="233.333333333333" font-family="Courier New, monospace" font-size="13.863480026002" fill="var(--warn-text)">  pause: 5</text>
  <text x="690" y="278.823529411765" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--warn-text)">Rename / pause</text>

  <!-- Column: register -->
  <rect x="985" y="40" width="255" height="261.568627450981" rx="10.664215404617" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1112" y="79.803921568628" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.328430809235" font-weight="bold" fill="var(--info-text)">register</text>
  <text x="1005" y="119.607843137255" font-family="Courier New, monospace" font-size="13.863480026002" fill="var(--info-text)">stat:</text>
  <text x="1005" y="148.039215686274" font-family="Courier New, monospace" font-size="13.863480026002" fill="var(--info-text)">  path: /etc/app</text>
  <text x="1005" y="176.470588235295" font-family="Courier New, monospace" font-size="13.863480026002" fill="var(--info-text)">register: s</text>
  <text x="1005" y="216.274509803922" font-family="Courier New, monospace" font-size="13.863480026002" fill="var(--info-text)">when: not s.stat.exists</text>
  <text x="1005" y="244.705882352941" font-family="Courier New, monospace" font-size="13.863480026002" fill="var(--info-text)">when: r.rc != 0</text>
  <text x="1005" y="278.823529411765" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--info-text)">Act on output</text>

  <!-- Combined example -->
  <rect x="40" y="335.686274509804" width="600" height="193.333333333333" rx="10.664215404617" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="375.490196078431" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.328430809235" font-weight="bold" fill="var(--ok-text)">when + loop</text>
  <text x="60" y="415.294117647059" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--ok-text)">file: path=/var/{{ item.name }}</text>
  <text x="60" y="443.725490196079" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--ok-text)">loop: "{{ services }}"</text>
  <text x="60" y="472.156862745098" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--ok-text)">when: item.enabled | bool</text>
  <text x="60" y="511.960784313726" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--ok-text)">per-iteration eval</text>

  <!-- Retry pattern -->
  <rect x="660" y="335.686274509804" width="580" height="193.333333333333" rx="10.664215404617" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="375.490196078431" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.328430809235" font-weight="bold" fill="var(--primary-text)">Retry / until</text>
  <text x="680" y="415.294117647059" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--primary-text)">command: curl http://app</text>
  <text x="680" y="443.725490196079" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--primary-text)">register: r</text>
  <text x="680" y="472.156862745098" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--primary-text)">until: r.rc == 0</text>
  <text x="680" y="500.588235294117" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--primary-text)">retries: 10  delay: 3</text>

  <!-- Tips bar -->
  <rect x="40" y="551.764705882353" width="1200" height="68.235294117647" rx="10.664215404617" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="593.039215686275" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.615608065086" fill="var(--warn-text)">Prefer loop over with_items</text>
</svg>

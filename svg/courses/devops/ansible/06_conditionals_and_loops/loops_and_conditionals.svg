<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- Header -->
  <rect x="0" y="0" width="1280" height="52" fill="url(#grad-primary)"/>
  <text x="640" y="34" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--bg)" text-anchor="middle">Loops and Conditionals in Ansible</text>

  <!-- === COLUMN 1: when clause === -->
  <rect x="20" y="62" width="295" height="260" rx="8" fill="url(#grad-surface)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="20" y="62" width="295" height="30" rx="8" fill="url(#grad-primary)"/>
  <rect x="20" y="80" width="295" height="12" fill="url(#grad-primary)"/>
  <text x="167" y="82" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">when Clause</text>
  <text x="35" y="112" font-family="monospace" font-size="11" fill="var(--text-dark)">- name: Install on Debian</text>
  <text x="35" y="129" font-family="monospace" font-size="11" fill="var(--text-dark)">  apt:</text>
  <text x="35" y="146" font-family="monospace" font-size="11" fill="var(--text-dark)">    name: nginx</text>
  <text x="35" y="163" font-family="monospace" font-size="11" fill="var(--warn-dk)">  when: ansible_os_family</text>
  <text x="35" y="179" font-family="monospace" font-size="11" fill="var(--warn-dk)">       == "Debian"</text>
  <line x1="35" y1="192" x2="300" y2="192" stroke="var(--border-softer)" stroke-width="1"/>
  <text x="35" y="210" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--primary-dk)">Multiple conditions:</text>
  <text x="35" y="228" font-family="monospace" font-size="11" fill="var(--text-dark)">  when:</text>
  <text x="35" y="245" font-family="monospace" font-size="11" fill="var(--text-dark)">    - ansible_memtotal_mb &gt;= 2048</text>
  <text x="35" y="262" font-family="monospace" font-size="11" fill="var(--text-dark)">    - "'web' in group_names"</text>
  <text x="35" y="279" font-family="monospace" font-size="11" fill="var(--text-muted)">  # list items = AND logic</text>
  <text x="35" y="296" font-family="monospace" font-size="11" fill="var(--text-dark)">  when: a or b or c</text>
  <text x="35" y="313" font-family="monospace" font-size="11" fill="var(--text-muted)">  # 'or' for OR logic</text>

  <!-- === COLUMN 2: loop / with_items === -->
  <rect x="330" y="62" width="295" height="260" rx="8" fill="url(#grad-surface)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="330" y="62" width="295" height="30" rx="8" fill="url(#grad-ok)"/>
  <rect x="330" y="80" width="295" height="12" fill="url(#grad-ok)"/>
  <text x="477" y="82" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">loop / with_items</text>
  <text x="345" y="112" font-family="monospace" font-size="11" fill="var(--text-dark)">- name: Install packages</text>
  <text x="345" y="129" font-family="monospace" font-size="11" fill="var(--text-dark)">  apt:</text>
  <text x="345" y="146" font-family="monospace" font-size="11" fill="var(--text-dark)">    name: "{{ item }}"</text>
  <text x="345" y="163" font-family="monospace" font-size="11" fill="var(--ok-dk)">  loop:</text>
  <text x="345" y="180" font-family="monospace" font-size="11" fill="var(--ok-dk)">    - nginx</text>
  <text x="345" y="197" font-family="monospace" font-size="11" fill="var(--ok-dk)">    - curl</text>
  <text x="345" y="214" font-family="monospace" font-size="11" fill="var(--ok-dk)">    - git</text>
  <line x1="345" y1="226" x2="610" y2="226" stroke="var(--border-softer)" stroke-width="1"/>
  <text x="345" y="244" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--ok-dk)">Loop over dicts:</text>
  <text x="345" y="262" font-family="monospace" font-size="11" fill="var(--text-dark)">  loop:</text>
  <text x="345" y="279" font-family="monospace" font-size="11" fill="var(--text-dark)">    - { name: bob, uid: 1001 }</text>
  <text x="345" y="296" font-family="monospace" font-size="11" fill="var(--text-dark)">    - { name: alice, uid: 1002 }</text>
  <text x="345" y="313" font-family="monospace" font-size="11" fill="var(--text-muted)">  # access: item.name, item.uid</text>

  <!-- === COLUMN 3: loop_control === -->
  <rect x="640" y="62" width="295" height="260" rx="8" fill="url(#grad-surface)" stroke="var(--warn)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="640" y="62" width="295" height="30" rx="8" fill="url(#grad-warn)"/>
  <rect x="640" y="80" width="295" height="12" fill="url(#grad-warn)"/>
  <text x="787" y="82" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">loop_control</text>
  <text x="655" y="112" font-family="monospace" font-size="11" fill="var(--text-dark)">- name: Process users</text>
  <text x="655" y="129" font-family="monospace" font-size="11" fill="var(--text-dark)">  user:</text>
  <text x="655" y="146" font-family="monospace" font-size="11" fill="var(--text-dark)">    name: "{{ usr.name }}"</text>
  <text x="655" y="163" font-family="monospace" font-size="11" fill="var(--text-dark)">  loop: "{{ users }}"</text>
  <text x="655" y="180" font-family="monospace" font-size="11" fill="var(--warn-dk)">  loop_control:</text>
  <text x="655" y="197" font-family="monospace" font-size="11" fill="var(--warn-dk)">    loop_var: usr</text>
  <text x="655" y="214" font-family="monospace" font-size="11" fill="var(--warn-dk)">    label: "{{ usr.name }}"</text>
  <text x="655" y="231" font-family="monospace" font-size="11" fill="var(--warn-dk)">    index_var: idx</text>
  <line x1="655" y1="243" x2="920" y2="243" stroke="var(--border-softer)" stroke-width="1"/>
  <text x="655" y="261" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--warn-dk)">Loop with pause:</text>
  <text x="655" y="279" font-family="monospace" font-size="11" fill="var(--warn-dk)">  loop_control:</text>
  <text x="655" y="296" font-family="monospace" font-size="11" fill="var(--warn-dk)">    pause: 5</text>
  <text x="655" y="313" font-family="monospace" font-size="11" fill="var(--text-muted)">  # 5 second pause/iteration</text>

  <!-- === COLUMN 4: register + when === -->
  <rect x="950" y="62" width="310" height="260" rx="8" fill="url(#grad-surface)" stroke="var(--info)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="950" y="62" width="310" height="30" rx="8" fill="url(#grad-info)"/>
  <rect x="950" y="80" width="310" height="12" fill="url(#grad-info)"/>
  <text x="1105" y="82" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">register + when Pattern</text>
  <text x="965" y="112" font-family="monospace" font-size="11" fill="var(--text-dark)">- name: Check if file exists</text>
  <text x="965" y="129" font-family="monospace" font-size="11" fill="var(--text-dark)">  stat:</text>
  <text x="965" y="146" font-family="monospace" font-size="11" fill="var(--text-dark)">    path: /etc/app.conf</text>
  <text x="965" y="163" font-family="monospace" font-size="11" fill="var(--info-dk)">  register: conf_stat</text>
  <text x="965" y="180" font-family="monospace" font-size="11" fill="var(--text-dark)">- name: Configure app</text>
  <text x="965" y="197" font-family="monospace" font-size="11" fill="var(--text-dark)">  template:</text>
  <text x="965" y="214" font-family="monospace" font-size="11" fill="var(--text-dark)">    src: app.conf.j2</text>
  <text x="965" y="231" font-family="monospace" font-size="11" fill="var(--text-dark)">    dest: /etc/app.conf</text>
  <text x="965" y="248" font-family="monospace" font-size="11" fill="var(--info-dk)">  when: not conf_stat.stat.exists</text>
  <line x1="965" y1="261" x2="1245" y2="261" stroke="var(--border-softer)" stroke-width="1"/>
  <text x="965" y="279" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--info-dk)">Check command output:</text>
  <text x="965" y="297" font-family="monospace" font-size="11" fill="var(--info-dk)">  when: result.rc != 0</text>
  <text x="965" y="314" font-family="monospace" font-size="11" fill="var(--info-dk)">  when: "'error' in result.stdout"</text>

  <!-- Bottom section: when+loop combined -->
  <rect x="20" y="335" width="605" height="125" rx="8" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="20" y="335" width="605" height="30" rx="8" fill="url(#grad-ok)"/>
  <rect x="20" y="353" width="605" height="12" fill="url(#grad-ok)"/>
  <text x="322" y="355" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">Combining when + loop</text>
  <text x="35" y="387" font-family="monospace" font-size="12" fill="var(--text-dark)">- name: Create dirs for enabled services</text>
  <text x="35" y="405" font-family="monospace" font-size="12" fill="var(--text-dark)">  file: path=/var/{{ item.name }} state=directory</text>
  <text x="35" y="423" font-family="monospace" font-size="12" fill="var(--ok-dk)">  loop: "{{ services }}"</text>
  <text x="35" y="441" font-family="monospace" font-size="12" fill="var(--warn-dk)">  when: item.enabled | bool</text>
  <text x="370" y="387" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Note: when is evaluated</text>
  <text x="370" y="405" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">per iteration, not once.</text>
  <text x="370" y="423" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Use loop_control.when</text>
  <text x="370" y="441" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">for clarity in output.</text>

  <!-- Bottom right: useful loop keywords -->
  <rect x="640" y="335" width="620" height="125" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="640" y="335" width="620" height="30" rx="8" fill="url(#grad-primary)"/>
  <rect x="640" y="353" width="620" height="12" fill="url(#grad-primary)"/>
  <text x="950" y="355" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">Useful Loop Patterns</text>
  <text x="655" y="385" font-family="monospace" font-size="12" fill="var(--primary-dk)">loop: "{{ range(1,6) | list }}"</text>
  <text x="655" y="403" font-family="monospace" font-size="12" fill="var(--primary-dk)">loop: "{{ dict | dict2items }}"</text>
  <text x="655" y="421" font-family="monospace" font-size="12" fill="var(--primary-dk)">loop: "{{ list1 + list2 }}"</text>
  <text x="920" y="385" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Numeric range</text>
  <text x="920" y="403" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Dict iteration</text>
  <text x="920" y="421" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">List concatenation</text>
  <text x="655" y="451" font-family="monospace" font-size="12" fill="var(--primary-dk)">with_nested: [listA, listB]</text>
  <text x="920" y="451" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Cartesian product (legacy)</text>

  <!-- Quick tips bar -->
  <rect x="20" y="472" width="1240" height="50" rx="6" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="1"/>
  <text x="35" y="490" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--warn-dk)">Tips:</text>
  <text x="80" y="490" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Use loop: over with_items: (modern).</text>
  <text x="360" y="490" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Avoid deeply nested loops - extract to roles.</text>
  <text x="680" y="490" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Use until: with retries: for polling patterns.</text>
  <text x="35" y="512" font-family="monospace" font-size="12" fill="var(--primary-dk)">- name: Wait   command: curl http://app   register: r   until: r.rc==0   retries: 10   delay: 3</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Header -->
  <rect x="40" y="40" width="1200" height="47.125" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="70.8125" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--bg)" text-anchor="middle">Loops and Conditionals in Ansible</text>

  <!-- === COLUMN 1: when clause === -->
  <rect x="58.75" y="96.1875" width="276.5625" height="235.625" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="58.75" y="96.1875" width="276.5625" height="27.1875" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="58.75" y="112.5" width="276.5625" height="10.875" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="196.5625" y="114.3125" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)" text-anchor="middle">when Clause</text>
  <text x="72.8125" y="141.5" font-family="monospace" font-size="10.1392" fill="var(--text)">- name: Install on Debian</text>
  <text x="72.8125" y="156.9062" font-family="monospace" font-size="10.1392" fill="var(--text)">  apt:</text>
  <text x="72.8125" y="172.3125" font-family="monospace" font-size="10.1392" fill="var(--text)">    name: nginx</text>
  <text x="72.8125" y="187.7188" font-family="monospace" font-size="10.1392" fill="var(--warn-accent)">  when: ansible_os_family</text>
  <text x="72.8125" y="202.2188" font-family="monospace" font-size="10.1392" fill="var(--warn-accent)">       == "Debian"</text>
  <line x1="72.8125" y1="214" x2="321.25" y2="214" stroke="var(--border)" stroke-width="1"/>
  <text x="72.8125" y="230.3125" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--primary-accent)">Multiple conditions:</text>
  <text x="72.8125" y="246.625" font-family="monospace" font-size="10.1392" fill="var(--text)">  when:</text>
  <text x="72.8125" y="262.0312" font-family="monospace" font-size="10.1392" fill="var(--text)">    - ansible_memtotal_mb &gt;= 2048</text>
  <text x="72.8125" y="277.4375" font-family="monospace" font-size="10.1392" fill="var(--text)">    - "'web' in group_names"</text>
  <text x="72.8125" y="292.8438" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">  # list items = AND logic</text>
  <text x="72.8125" y="308.25" font-family="monospace" font-size="10.1392" fill="var(--text)">  when: a or b or c</text>
  <text x="72.8125" y="323.6562" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">  # 'or' for OR logic</text>

  <!-- === COLUMN 2: loop / with_items === -->
  <rect x="349.375" y="96.1875" width="276.5625" height="235.625" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="349.375" y="96.1875" width="276.5625" height="27.1875" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="349.375" y="112.5" width="276.5625" height="10.875" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="487.1875" y="114.3125" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)" text-anchor="middle">loop / with_items</text>
  <text x="363.4375" y="141.5" font-family="monospace" font-size="10.1392" fill="var(--text)">- name: Install packages</text>
  <text x="363.4375" y="156.9062" font-family="monospace" font-size="10.1392" fill="var(--text)">  apt:</text>
  <text x="363.4375" y="172.3125" font-family="monospace" font-size="10.1392" fill="var(--text)">    name: "{{ item }}"</text>
  <text x="363.4375" y="187.7188" font-family="monospace" font-size="10.1392" fill="var(--ok-accent)">  loop:</text>
  <text x="363.4375" y="203.125" font-family="monospace" font-size="10.1392" fill="var(--ok-accent)">    - nginx</text>
  <text x="363.4375" y="218.5312" font-family="monospace" font-size="10.1392" fill="var(--ok-accent)">    - curl</text>
  <text x="363.4375" y="233.9375" font-family="monospace" font-size="10.1392" fill="var(--ok-accent)">    - git</text>
  <line x1="363.4375" y1="244.8125" x2="611.875" y2="244.8125" stroke="var(--border)" stroke-width="1"/>
  <text x="363.4375" y="261.125" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--ok-accent)">Loop over dicts:</text>
  <text x="363.4375" y="277.4375" font-family="monospace" font-size="10.1392" fill="var(--text)">  loop:</text>
  <text x="363.4375" y="292.8438" font-family="monospace" font-size="10.1392" fill="var(--text)">    - { name: bob, uid: 1001 }</text>
  <text x="363.4375" y="308.25" font-family="monospace" font-size="10.1392" fill="var(--text)">    - { name: alice, uid: 1002 }</text>
  <text x="363.4375" y="323.6562" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">  # access: item.name, item.uid</text>

  <!-- === COLUMN 3: loop_control === -->
  <rect x="640" y="96.1875" width="276.5625" height="235.625" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="640" y="96.1875" width="276.5625" height="27.1875" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="640" y="112.5" width="276.5625" height="10.875" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="777.8125" y="114.3125" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)" text-anchor="middle">loop_control</text>
  <text x="654.0625" y="141.5" font-family="monospace" font-size="10.1392" fill="var(--text)">- name: Process users</text>
  <text x="654.0625" y="156.9062" font-family="monospace" font-size="10.1392" fill="var(--text)">  user:</text>
  <text x="654.0625" y="172.3125" font-family="monospace" font-size="10.1392" fill="var(--text)">    name: "{{ usr.name }}"</text>
  <text x="654.0625" y="187.7188" font-family="monospace" font-size="10.1392" fill="var(--text)">  loop: "{{ users }}"</text>
  <text x="654.0625" y="203.125" font-family="monospace" font-size="10.1392" fill="var(--warn-accent)">  loop_control:</text>
  <text x="654.0625" y="218.5312" font-family="monospace" font-size="10.1392" fill="var(--warn-accent)">    loop_var: usr</text>
  <text x="654.0625" y="233.9375" font-family="monospace" font-size="10.1392" fill="var(--warn-accent)">    label: "{{ usr.name }}"</text>
  <text x="654.0625" y="249.3438" font-family="monospace" font-size="10.1392" fill="var(--warn-accent)">    index_var: idx</text>
  <line x1="654.0625" y1="260.2188" x2="902.5" y2="260.2188" stroke="var(--border)" stroke-width="1"/>
  <text x="654.0625" y="276.5312" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--warn-accent)">Loop with pause:</text>
  <text x="654.0625" y="292.8438" font-family="monospace" font-size="10.1392" fill="var(--warn-accent)">  loop_control:</text>
  <text x="654.0625" y="308.25" font-family="monospace" font-size="10.1392" fill="var(--warn-accent)">    pause: 5</text>
  <text x="654.0625" y="323.6562" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">  # 5 second pause/iteration</text>

  <!-- === COLUMN 4: register + when === -->
  <rect x="930.625" y="96.1875" width="290.625" height="235.625" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="930.625" y="96.1875" width="290.625" height="27.1875" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="930.625" y="112.5" width="290.625" height="10.875" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1075.9375" y="114.3125" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)" text-anchor="middle">register + when Pattern</text>
  <text x="944.6875" y="141.5" font-family="monospace" font-size="10.1392" fill="var(--text)">- name: Check if file exists</text>
  <text x="944.6875" y="156.9062" font-family="monospace" font-size="10.1392" fill="var(--text)">  stat:</text>
  <text x="944.6875" y="172.3125" font-family="monospace" font-size="10.1392" fill="var(--text)">    path: /etc/app.conf</text>
  <text x="944.6875" y="187.7188" font-family="monospace" font-size="10.1392" fill="var(--info-accent)">  register: conf_stat</text>
  <text x="944.6875" y="203.125" font-family="monospace" font-size="10.1392" fill="var(--text)">- name: Configure app</text>
  <text x="944.6875" y="218.5312" font-family="monospace" font-size="10.1392" fill="var(--text)">  template:</text>
  <text x="944.6875" y="233.9375" font-family="monospace" font-size="10.1392" fill="var(--text)">    src: app.conf.j2</text>
  <text x="944.6875" y="249.3438" font-family="monospace" font-size="10.1392" fill="var(--text)">    dest: /etc/app.conf</text>
  <text x="944.6875" y="264.75" font-family="monospace" font-size="10.1392" fill="var(--info-accent)">  when: not conf_stat.stat.exists</text>
  <line x1="944.6875" y1="276.5312" x2="1207.1875" y2="276.5312" stroke="var(--border)" stroke-width="1"/>
  <text x="944.6875" y="292.8438" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--info-accent)">Check command output:</text>
  <text x="944.6875" y="309.1562" font-family="monospace" font-size="10.1392" fill="var(--info-accent)">  when: result.rc != 0</text>
  <text x="944.6875" y="324.5625" font-family="monospace" font-size="10.1392" fill="var(--info-accent)">  when: "'error' in result.stdout"</text>

  <!-- Bottom section: when+loop combined -->
  <rect x="58.75" y="343.5938" width="567.1875" height="113.2812" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="58.75" y="343.5938" width="567.1875" height="27.1875" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="58.75" y="359.9062" width="567.1875" height="10.875" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="341.875" y="361.7188" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)" text-anchor="middle">Combining when + loop</text>
  <text x="72.8125" y="390.7188" font-family="monospace" font-size="11.0609" fill="var(--text)">- name: Create dirs for enabled services</text>
  <text x="72.8125" y="407.0312" font-family="monospace" font-size="11.0609" fill="var(--text)">  file: path=/var/{{ item.name }} state=directory</text>
  <text x="72.8125" y="423.3438" font-family="monospace" font-size="11.0609" fill="var(--ok-accent)">  loop: "{{ services }}"</text>
  <text x="72.8125" y="439.6562" font-family="monospace" font-size="11.0609" fill="var(--warn-accent)">  when: item.enabled | bool</text>
  <text x="386.875" y="390.7188" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Note: when is evaluated</text>
  <text x="386.875" y="407.0312" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">per iteration, not once.</text>
  <text x="386.875" y="423.3438" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Use loop_control.when</text>
  <text x="386.875" y="439.6562" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">for clarity in output.</text>

  <!-- Bottom right: useful loop keywords -->
  <rect x="640" y="343.5938" width="581.25" height="113.2812" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="640" y="343.5938" width="581.25" height="27.1875" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="640" y="359.9062" width="581.25" height="10.875" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="930.625" y="361.7188" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)" text-anchor="middle">Useful Loop Patterns</text>
  <text x="654.0625" y="388.9062" font-family="monospace" font-size="11.0609" fill="var(--primary-accent)">loop: "{{ range(1,6) | list }}"</text>
  <text x="654.0625" y="405.2188" font-family="monospace" font-size="11.0609" fill="var(--primary-accent)">loop: "{{ dict | dict2items }}"</text>
  <text x="654.0625" y="421.5312" font-family="monospace" font-size="11.0609" fill="var(--primary-accent)">loop: "{{ list1 + list2 }}"</text>
  <text x="902.5" y="388.9062" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Numeric range</text>
  <text x="902.5" y="405.2188" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Dict iteration</text>
  <text x="902.5" y="421.5312" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">List concatenation</text>
  <text x="654.0625" y="448.7188" font-family="monospace" font-size="11.0609" fill="var(--primary-accent)">with_nested: [listA, listB]</text>
  <text x="902.5" y="448.7188" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Cartesian product (legacy)</text>

  <!-- Quick tips bar -->
  <rect x="58.75" y="467.75" width="1162.5" height="45.3125" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="72.8125" y="484.0625" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--warn-accent)">Tips:</text>
  <text x="115" y="484.0625" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Use loop: over with_items: (modern).</text>
  <text x="377.5" y="484.0625" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Avoid deeply nested loops - extract to roles.</text>
  <text x="677.5" y="484.0625" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Use until: with retries: for polling patterns.</text>
  <text x="72.8125" y="504" font-family="monospace" font-size="11.0609" fill="var(--primary-accent)">- name: Wait   command: curl http://app   register: r   until: r.rc==0   retries: 10   delay: 3</text>
</svg>

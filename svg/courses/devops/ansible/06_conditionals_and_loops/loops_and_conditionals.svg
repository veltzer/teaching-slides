<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- Header -->
  <rect x="0" y="0" width="1280" height="52" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="34" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--bg)" text-anchor="middle">Loops and Conditionals in Ansible</text>

  <!-- === COLUMN 1: when clause === -->
  <rect x="20" y="62" width="295" height="260" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="20" y="62" width="295" height="30" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="20" y="80" width="295" height="12" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="167" y="82" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">when Clause</text>
  <text x="35" y="112" font-family="monospace" font-size="11" fill="var(--text)">- name: Install on Debian</text>
  <text x="35" y="129" font-family="monospace" font-size="11" fill="var(--text)">  apt:</text>
  <text x="35" y="146" font-family="monospace" font-size="11" fill="var(--text)">    name: nginx</text>
  <text x="35" y="163" font-family="monospace" font-size="11" fill="var(--warn-accent)">  when: ansible_os_family</text>
  <text x="35" y="179" font-family="monospace" font-size="11" fill="var(--warn-accent)">       == "Debian"</text>
  <line x1="35" y1="192" x2="300" y2="192" stroke="var(--border)" stroke-width="1"/>
  <text x="35" y="210" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--primary-accent)">Multiple conditions:</text>
  <text x="35" y="228" font-family="monospace" font-size="11" fill="var(--text)">  when:</text>
  <text x="35" y="245" font-family="monospace" font-size="11" fill="var(--text)">    - ansible_memtotal_mb &gt;= 2048</text>
  <text x="35" y="262" font-family="monospace" font-size="11" fill="var(--text)">    - "'web' in group_names"</text>
  <text x="35" y="279" font-family="monospace" font-size="11" fill="var(--text-muted)">  # list items = AND logic</text>
  <text x="35" y="296" font-family="monospace" font-size="11" fill="var(--text)">  when: a or b or c</text>
  <text x="35" y="313" font-family="monospace" font-size="11" fill="var(--text-muted)">  # 'or' for OR logic</text>

  <!-- === COLUMN 2: loop / with_items === -->
  <rect x="330" y="62" width="295" height="260" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="330" y="62" width="295" height="30" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="330" y="80" width="295" height="12" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="477" y="82" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">loop / with_items</text>
  <text x="345" y="112" font-family="monospace" font-size="11" fill="var(--text)">- name: Install packages</text>
  <text x="345" y="129" font-family="monospace" font-size="11" fill="var(--text)">  apt:</text>
  <text x="345" y="146" font-family="monospace" font-size="11" fill="var(--text)">    name: "{{ item }}"</text>
  <text x="345" y="163" font-family="monospace" font-size="11" fill="var(--ok-accent)">  loop:</text>
  <text x="345" y="180" font-family="monospace" font-size="11" fill="var(--ok-accent)">    - nginx</text>
  <text x="345" y="197" font-family="monospace" font-size="11" fill="var(--ok-accent)">    - curl</text>
  <text x="345" y="214" font-family="monospace" font-size="11" fill="var(--ok-accent)">    - git</text>
  <line x1="345" y1="226" x2="610" y2="226" stroke="var(--border)" stroke-width="1"/>
  <text x="345" y="244" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--ok-accent)">Loop over dicts:</text>
  <text x="345" y="262" font-family="monospace" font-size="11" fill="var(--text)">  loop:</text>
  <text x="345" y="279" font-family="monospace" font-size="11" fill="var(--text)">    - { name: bob, uid: 1001 }</text>
  <text x="345" y="296" font-family="monospace" font-size="11" fill="var(--text)">    - { name: alice, uid: 1002 }</text>
  <text x="345" y="313" font-family="monospace" font-size="11" fill="var(--text-muted)">  # access: item.name, item.uid</text>

  <!-- === COLUMN 3: loop_control === -->
  <rect x="640" y="62" width="295" height="260" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="640" y="62" width="295" height="30" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="640" y="80" width="295" height="12" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="787" y="82" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">loop_control</text>
  <text x="655" y="112" font-family="monospace" font-size="11" fill="var(--text)">- name: Process users</text>
  <text x="655" y="129" font-family="monospace" font-size="11" fill="var(--text)">  user:</text>
  <text x="655" y="146" font-family="monospace" font-size="11" fill="var(--text)">    name: "{{ usr.name }}"</text>
  <text x="655" y="163" font-family="monospace" font-size="11" fill="var(--text)">  loop: "{{ users }}"</text>
  <text x="655" y="180" font-family="monospace" font-size="11" fill="var(--warn-accent)">  loop_control:</text>
  <text x="655" y="197" font-family="monospace" font-size="11" fill="var(--warn-accent)">    loop_var: usr</text>
  <text x="655" y="214" font-family="monospace" font-size="11" fill="var(--warn-accent)">    label: "{{ usr.name }}"</text>
  <text x="655" y="231" font-family="monospace" font-size="11" fill="var(--warn-accent)">    index_var: idx</text>
  <line x1="655" y1="243" x2="920" y2="243" stroke="var(--border)" stroke-width="1"/>
  <text x="655" y="261" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--warn-accent)">Loop with pause:</text>
  <text x="655" y="279" font-family="monospace" font-size="11" fill="var(--warn-accent)">  loop_control:</text>
  <text x="655" y="296" font-family="monospace" font-size="11" fill="var(--warn-accent)">    pause: 5</text>
  <text x="655" y="313" font-family="monospace" font-size="11" fill="var(--text-muted)">  # 5 second pause/iteration</text>

  <!-- === COLUMN 4: register + when === -->
  <rect x="950" y="62" width="310" height="260" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="950" y="62" width="310" height="30" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="950" y="80" width="310" height="12" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1105" y="82" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">register + when Pattern</text>
  <text x="965" y="112" font-family="monospace" font-size="11" fill="var(--text)">- name: Check if file exists</text>
  <text x="965" y="129" font-family="monospace" font-size="11" fill="var(--text)">  stat:</text>
  <text x="965" y="146" font-family="monospace" font-size="11" fill="var(--text)">    path: /etc/app.conf</text>
  <text x="965" y="163" font-family="monospace" font-size="11" fill="var(--info-accent)">  register: conf_stat</text>
  <text x="965" y="180" font-family="monospace" font-size="11" fill="var(--text)">- name: Configure app</text>
  <text x="965" y="197" font-family="monospace" font-size="11" fill="var(--text)">  template:</text>
  <text x="965" y="214" font-family="monospace" font-size="11" fill="var(--text)">    src: app.conf.j2</text>
  <text x="965" y="231" font-family="monospace" font-size="11" fill="var(--text)">    dest: /etc/app.conf</text>
  <text x="965" y="248" font-family="monospace" font-size="11" fill="var(--info-accent)">  when: not conf_stat.stat.exists</text>
  <line x1="965" y1="261" x2="1245" y2="261" stroke="var(--border)" stroke-width="1"/>
  <text x="965" y="279" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--info-accent)">Check command output:</text>
  <text x="965" y="297" font-family="monospace" font-size="11" fill="var(--info-accent)">  when: result.rc != 0</text>
  <text x="965" y="314" font-family="monospace" font-size="11" fill="var(--info-accent)">  when: "'error' in result.stdout"</text>

  <!-- Bottom section: when+loop combined -->
  <rect x="20" y="335" width="605" height="125" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="20" y="335" width="605" height="30" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="20" y="353" width="605" height="12" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="322" y="355" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">Combining when + loop</text>
  <text x="35" y="387" font-family="monospace" font-size="12" fill="var(--text)">- name: Create dirs for enabled services</text>
  <text x="35" y="405" font-family="monospace" font-size="12" fill="var(--text)">  file: path=/var/{{ item.name }} state=directory</text>
  <text x="35" y="423" font-family="monospace" font-size="12" fill="var(--ok-accent)">  loop: "{{ services }}"</text>
  <text x="35" y="441" font-family="monospace" font-size="12" fill="var(--warn-accent)">  when: item.enabled | bool</text>
  <text x="370" y="387" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Note: when is evaluated</text>
  <text x="370" y="405" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">per iteration, not once.</text>
  <text x="370" y="423" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Use loop_control.when</text>
  <text x="370" y="441" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">for clarity in output.</text>

  <!-- Bottom right: useful loop keywords -->
  <rect x="640" y="335" width="620" height="125" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="640" y="335" width="620" height="30" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="640" y="353" width="620" height="12" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="950" y="355" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">Useful Loop Patterns</text>
  <text x="655" y="385" font-family="monospace" font-size="12" fill="var(--primary-accent)">loop: "{{ range(1,6) | list }}"</text>
  <text x="655" y="403" font-family="monospace" font-size="12" fill="var(--primary-accent)">loop: "{{ dict | dict2items }}"</text>
  <text x="655" y="421" font-family="monospace" font-size="12" fill="var(--primary-accent)">loop: "{{ list1 + list2 }}"</text>
  <text x="920" y="385" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Numeric range</text>
  <text x="920" y="403" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Dict iteration</text>
  <text x="920" y="421" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">List concatenation</text>
  <text x="655" y="451" font-family="monospace" font-size="12" fill="var(--primary-accent)">with_nested: [listA, listB]</text>
  <text x="920" y="451" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Cartesian product (legacy)</text>

  <!-- Quick tips bar -->
  <rect x="20" y="472" width="1240" height="50" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="35" y="490" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--warn-accent)">Tips:</text>
  <text x="80" y="490" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Use loop: over with_items: (modern).</text>
  <text x="360" y="490" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Avoid deeply nested loops - extract to roles.</text>
  <text x="680" y="490" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Use until: with retries: for polling patterns.</text>
  <text x="35" y="512" font-family="monospace" font-size="12" fill="var(--primary-accent)">- name: Wait   command: curl http://app   register: r   until: r.rc==0   retries: 10   delay: 3</text>
</svg>

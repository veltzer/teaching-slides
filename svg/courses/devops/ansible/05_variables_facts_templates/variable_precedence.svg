<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <marker id="arrow-up" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e53935"/>
    </marker>
  </defs>
  <!-- Header -->
  <rect x="40" y="40" width="1200" height="47.873016" fill="var(--primary-fill)" rx="6.047432" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="71.301587" font-family="Arial, sans-serif" font-size="20.438605" font-weight="bold" fill="var(--bg)" text-anchor="middle">Ansible Variable Precedence</text>

  <!-- Pyramid - drawn as trapezoids stacked, lowest at bottom -->
  <!-- Level labels on right -->
  <text x="91.5625" y="117.333333" font-family="Arial, sans-serif" font-size="10.219353" fill="var(--text-faint)" text-anchor="middle">LOWEST</text>
  <text x="91.5625" y="604.349156" font-family="Arial, sans-serif" font-size="10.219353" fill="var(--danger-accent)" font-weight="bold" text-anchor="middle">HIGHEST</text>
  <!-- Arrow going up -->
  <line x1="91.5625" y1="132.063492" x2="91.5625" y2="587.777829" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-up)"/>
  <text x="91.5625" y="357.1875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--danger-accent)" font-weight="bold" text-anchor="middle" transform="rotate(-90 55 350)">Priority</text>

  <!-- Pyramid levels - 9 rows from bottom (high) to top (low) -->
  <!-- Row 1 (bottom=highest): extra_vars -->
  <polygon points="147.8125,583.174603 991.5625,583.174603 963.4375,555.555556 175.9375,555.555556" fill="var(--danger-fill)"/>
  <text x="569.6875" y="573.968254" font-family="Arial, sans-serif" font-size="12.077426" font-weight="bold" fill="var(--bg)" text-anchor="middle">--extra-vars / -e (command line)</text>

  <!-- Row 2: include_vars, set_fact registered -->
  <polygon points="175.9375,553.714286 963.4375,553.714286 935.3125,526.095238 204.0625,526.095238" fill="var(--danger-fill)"/>
  <text x="569.6875" y="544.507937" font-family="Arial, sans-serif" font-size="11.148339" font-weight="bold" fill="var(--bg)" text-anchor="middle">set_fact / registered vars / include_vars</text>

  <!-- Row 3: task vars (module args) -->
  <polygon points="204.0625,524.253968 935.3125,524.253968 907.1875,496.634921 232.1875,496.634921" fill="var(--warn-fill)"/>
  <text x="569.6875" y="515.047619" font-family="Arial, sans-serif" font-size="11.148339" font-weight="bold" fill="var(--bg)" text-anchor="middle">Task vars (in the task itself)</text>

  <!-- Row 4: block vars -->
  <polygon points="232.1875,494.793651 907.1875,494.793651 879.0625,467.174603 260.3125,467.174603" fill="var(--warn-fill)"/>
  <text x="569.6875" y="485.587302" font-family="Arial, sans-serif" font-size="11.148339" font-weight="bold" fill="var(--text)" text-anchor="middle">Block vars</text>

  <!-- Row 5: play vars_files, play vars_prompt -->
  <polygon points="260.3125,465.333333 879.0625,465.333333 850.9375,437.714286 288.4375,437.714286" fill="var(--warn-fill)"/>
  <text x="569.6875" y="456.126984" font-family="Arial, sans-serif" font-size="11.148339" font-weight="bold" fill="var(--text)" text-anchor="middle">vars_files / vars_prompt (in play)</text>

  <!-- Row 6: host_vars, group_vars -->
  <polygon points="288.4375,435.873016 850.9375,435.873016 822.8125,408.253968 316.5625,408.253968" fill="var(--ok-fill)"/>
  <text x="569.6875" y="426.666667" font-family="Arial, sans-serif" font-size="11.148339" font-weight="bold" fill="var(--bg)" text-anchor="middle">host_vars / group_vars (inventory files)</text>

  <!-- Row 7: inventory vars, play vars -->
  <polygon points="316.5625,406.412698 822.8125,406.412698 794.6875,378.793651 344.6875,378.793651" fill="var(--ok-fill)"/>
  <text x="569.6875" y="397.206349" font-family="Arial, sans-serif" font-size="11.148339" font-weight="bold" fill="var(--bg)" text-anchor="middle">play vars: / inventory group_vars/all</text>

  <!-- Row 8: role defaults -->
  <polygon points="344.6875,376.952381 794.6875,376.952381 766.5625,349.333333 372.8125,349.333333" fill="var(--primary-fill)"/>
  <text x="569.6875" y="367.746032" font-family="Arial, sans-serif" font-size="11.148339" font-weight="bold" fill="var(--bg)" text-anchor="middle">Role vars (roles/x/vars/main.yml)</text>

  <!-- Row 9 (top=lowest): role defaults -->
  <polygon points="372.8125,347.492063 766.5625,347.492063 640,319.873016 640,319.873016" fill="var(--primary-fill)"/>
  <text x="569.6875" y="334.603175" font-family="Arial, sans-serif" font-size="11.148339" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Role defaults (roles/x/defaults/main.yml)</text>

  <!-- Magic Variables panel -->
  <rect x="1015" y="97.079365" width="210.9375" height="193.333333" rx="6.047432" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="1015" y="97.079365" width="210.9375" height="27.619048" rx="6.047432" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="1015" y="113.650794" width="210.9375" height="11.047619" fill="var(--info-fill)" rx="6.047432" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1120" y="115.492063" font-family="Arial, sans-serif" font-size="12.077426" font-weight="bold" fill="var(--bg)" text-anchor="middle">Magic Variables</text>
  <text x="1029.0625" y="144.031695" font-family="monospace" font-size="11.148339" fill="var(--info-accent)">inventory_hostname</text>
  <text x="1029.0625" y="160.603225" font-family="monospace" font-size="11.148339" fill="var(--info-accent)">group_names</text>
  <text x="1029.0625" y="177.174552" font-family="monospace" font-size="11.148339" fill="var(--info-accent)">groups</text>
  <text x="1029.0625" y="193.746083" font-family="monospace" font-size="11.148339" fill="var(--info-accent)">hostvars</text>
  <text x="1029.0625" y="210.31741" font-family="monospace" font-size="11.148339" fill="var(--info-accent)">ansible_play_hosts</text>
  <text x="1029.0625" y="226.88894" font-family="monospace" font-size="11.148339" fill="var(--info-accent)">ansible_facts</text>
  <text x="1029.0625" y="243.460267" font-family="monospace" font-size="11.148339" fill="var(--info-accent)">role_path</text>
  <text x="1029.0625" y="260.031797" font-family="monospace" font-size="11.148339" fill="var(--info-accent)">playbook_dir</text>
  <text x="1029.0625" y="276.603124" font-family="monospace" font-size="11.148339" fill="var(--info-accent)">ansible_check_mode</text>

  <!-- Jinja2 Filters panel -->
  <rect x="1015" y="302.380902" width="210.9375" height="211.746032" rx="6.047432" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="1015" y="302.380902" width="210.9375" height="27.619048" rx="6.047432" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="1015" y="318.952432" width="210.9375" height="11.047619" fill="var(--ok-fill)" rx="6.047432" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1120" y="320.7936" font-family="Arial, sans-serif" font-size="12.077426" font-weight="bold" fill="var(--bg)" text-anchor="middle">Jinja2 Filters</text>
  <text x="1029.0625" y="348.412749" font-family="monospace" font-size="10.219353" fill="var(--ok-accent)">| default('val')</text>
  <text x="1029.0625" y="364.984076" font-family="monospace" font-size="10.219353" fill="var(--ok-accent)">| upper / lower</text>
  <text x="1029.0625" y="381.555606" font-family="monospace" font-size="10.219353" fill="var(--ok-accent)">| int / float</text>
  <text x="1029.0625" y="398.126933" font-family="monospace" font-size="10.219353" fill="var(--ok-accent)">| bool</text>
  <text x="1029.0625" y="414.698463" font-family="monospace" font-size="10.219353" fill="var(--ok-accent)">| length</text>
  <text x="1029.0625" y="431.26979" font-family="monospace" font-size="10.219353" fill="var(--ok-accent)">| join(',')</text>
  <text x="1029.0625" y="447.841321" font-family="monospace" font-size="10.219353" fill="var(--ok-accent)">| selectattr(...)</text>
  <text x="1029.0625" y="464.412648" font-family="monospace" font-size="10.219353" fill="var(--ok-accent)">| map(attribute=..)</text>
  <text x="1029.0625" y="480.984178" font-family="monospace" font-size="10.219353" fill="var(--ok-accent)">| to_json</text>
  <text x="1029.0625" y="497.555505" font-family="monospace" font-size="10.219353" fill="var(--ok-accent)">| from_yaml</text>
  <text x="1029.0625" y="514.127035" font-family="monospace" font-size="10.219353" fill="var(--ok-accent)">| combine({})</text>

  <!-- Bottom note -->
  <rect x="124.375" y="592.380952" width="871.875" height="27.619048" rx="6.047432" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="560.3125" y="609.873067" font-family="Arial, sans-serif" font-size="11.148339" fill="var(--text-muted)" text-anchor="middle">Higher precedence WINS. Use role defaults for overridable values; use extra-vars for one-time overrides. Avoid abusing set_fact for simple variable declarations.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <marker id="arrow-up" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e53935"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- Header -->
  <rect x="0" y="0" width="1280" height="52" fill="url(#grad-primary)"/>
  <text x="640" y="34" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--bg)" text-anchor="middle">Ansible Variable Precedence</text>

  <!-- Pyramid - drawn as trapezoids stacked, lowest at bottom -->
  <!-- Level labels on right -->
  <text x="55" y="84" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)" text-anchor="middle">LOWEST</text>
  <text x="55" y="613" font-family="Arial, sans-serif" font-size="11" fill="var(--danger)" font-weight="bold" text-anchor="middle">HIGHEST</text>
  <!-- Arrow going up -->
  <line x1="55" y1="100" x2="55" y2="595" stroke="var(--danger)" stroke-width="2" marker-end="url(#arrow-up)"/>
  <text x="55" y="350" font-family="Arial, sans-serif" font-size="12" fill="var(--danger)" font-weight="bold" text-anchor="middle" transform="rotate(-90 55 350)">Priority</text>

  <!-- Pyramid levels - 9 rows from bottom (high) to top (low) -->
  <!-- Row 1 (bottom=highest): extra_vars -->
  <polygon points="115,590 1015,590 985,560 145,560" fill="var(--danger)"/>
  <text x="565" y="580" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)" text-anchor="middle">--extra-vars / -e (command line)</text>

  <!-- Row 2: include_vars, set_fact registered -->
  <polygon points="145,558 985,558 955,528 175,528" fill="var(--danger-vivid)"/>
  <text x="565" y="548" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--bg)" text-anchor="middle">set_fact / registered vars / include_vars</text>

  <!-- Row 3: task vars (module args) -->
  <polygon points="175,526 955,526 925,496 205,496" fill="var(--warn)"/>
  <text x="565" y="516" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--bg)" text-anchor="middle">Task vars (in the task itself)</text>

  <!-- Row 4: block vars -->
  <polygon points="205,494 925,494 895,464 235,464" fill="var(--warn-amber)"/>
  <text x="565" y="484" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--text-dark)" text-anchor="middle">Block vars</text>

  <!-- Row 5: play vars_files, play vars_prompt -->
  <polygon points="235,462 895,462 865,432 265,432" fill="var(--warn-tint)"/>
  <text x="565" y="452" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--text-dark)" text-anchor="middle">vars_files / vars_prompt (in play)</text>

  <!-- Row 6: host_vars, group_vars -->
  <polygon points="265,430 865,430 835,400 295,400" fill="var(--ok-light)"/>
  <text x="565" y="420" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--bg)" text-anchor="middle">host_vars / group_vars (inventory files)</text>

  <!-- Row 7: inventory vars, play vars -->
  <polygon points="295,398 835,398 805,368 325,368" fill="var(--ok-vivid)"/>
  <text x="565" y="388" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--bg)" text-anchor="middle">play vars: / inventory group_vars/all</text>

  <!-- Row 8: role defaults -->
  <polygon points="325,366 805,366 775,336 355,336" fill="var(--primary-bright)"/>
  <text x="565" y="356" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--bg)" text-anchor="middle">Role vars (roles/x/vars/main.yml)</text>

  <!-- Row 9 (top=lowest): role defaults -->
  <polygon points="355,334 775,334 640,304 640,304" fill="var(--primary-tint)"/>
  <text x="565" y="320" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">Role defaults (roles/x/defaults/main.yml)</text>

  <!-- Magic Variables panel -->
  <rect x="1040" y="62" width="225" height="210" rx="8" fill="url(#grad-surface)" stroke="var(--info)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1040" y="62" width="225" height="30" rx="8" fill="url(#grad-info)"/>
  <rect x="1040" y="80" width="225" height="12" fill="url(#grad-info)"/>
  <text x="1152" y="82" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)" text-anchor="middle">Magic Variables</text>
  <text x="1055" y="113" font-family="monospace" font-size="12" fill="var(--info-dk)">inventory_hostname</text>
  <text x="1055" y="131" font-family="monospace" font-size="12" fill="var(--info-dk)">group_names</text>
  <text x="1055" y="149" font-family="monospace" font-size="12" fill="var(--info-dk)">groups</text>
  <text x="1055" y="167" font-family="monospace" font-size="12" fill="var(--info-dk)">hostvars</text>
  <text x="1055" y="185" font-family="monospace" font-size="12" fill="var(--info-dk)">ansible_play_hosts</text>
  <text x="1055" y="203" font-family="monospace" font-size="12" fill="var(--info-dk)">ansible_facts</text>
  <text x="1055" y="221" font-family="monospace" font-size="12" fill="var(--info-dk)">role_path</text>
  <text x="1055" y="239" font-family="monospace" font-size="12" fill="var(--info-dk)">playbook_dir</text>
  <text x="1055" y="257" font-family="monospace" font-size="12" fill="var(--info-dk)">ansible_check_mode</text>

  <!-- Jinja2 Filters panel -->
  <rect x="1040" y="285" width="225" height="230" rx="8" fill="url(#grad-surface)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1040" y="285" width="225" height="30" rx="8" fill="url(#grad-ok)"/>
  <rect x="1040" y="303" width="225" height="12" fill="url(#grad-ok)"/>
  <text x="1152" y="305" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)" text-anchor="middle">Jinja2 Filters</text>
  <text x="1055" y="335" font-family="monospace" font-size="11" fill="var(--ok-dk)">| default('val')</text>
  <text x="1055" y="353" font-family="monospace" font-size="11" fill="var(--ok-dk)">| upper / lower</text>
  <text x="1055" y="371" font-family="monospace" font-size="11" fill="var(--ok-dk)">| int / float</text>
  <text x="1055" y="389" font-family="monospace" font-size="11" fill="var(--ok-dk)">| bool</text>
  <text x="1055" y="407" font-family="monospace" font-size="11" fill="var(--ok-dk)">| length</text>
  <text x="1055" y="425" font-family="monospace" font-size="11" fill="var(--ok-dk)">| join(',')</text>
  <text x="1055" y="443" font-family="monospace" font-size="11" fill="var(--ok-dk)">| selectattr(...)</text>
  <text x="1055" y="461" font-family="monospace" font-size="11" fill="var(--ok-dk)">| map(attribute=..)</text>
  <text x="1055" y="479" font-family="monospace" font-size="11" fill="var(--ok-dk)">| to_json</text>
  <text x="1055" y="497" font-family="monospace" font-size="11" fill="var(--ok-dk)">| from_yaml</text>
  <text x="1055" y="515" font-family="monospace" font-size="11" fill="var(--ok-dk)">| combine({})</text>

  <!-- Bottom note -->
  <rect x="90" y="600" width="930" height="30" rx="6" fill="var(--warn-pale3)" stroke="var(--warn-amber)" stroke-width="1"/>
  <text x="555" y="619" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)" text-anchor="middle">Higher precedence WINS. Use role defaults for overridable values; use extra-vars for one-time overrides. Avoid abusing set_fact for simple variable declarations.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <marker id="arrow-up" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e53935"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Header -->
  <rect x="40" y="40" width="1200" height="47.125" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="70.8125" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--bg)" text-anchor="middle">Ansible Variable Precedence</text>

  <!-- Pyramid - drawn as trapezoids stacked, lowest at bottom -->
  <!-- Level labels on right -->
  <text x="91.5625" y="116.125" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)" text-anchor="middle">LOWEST</text>
  <text x="91.5625" y="595.5312" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--danger-accent)" font-weight="bold" text-anchor="middle">HIGHEST</text>
  <!-- Arrow going up -->
  <line x1="91.5625" y1="130.625" x2="91.5625" y2="579.2188" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-up)"/>
  <text x="91.5625" y="357.1875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--danger-accent)" font-weight="bold" text-anchor="middle" transform="rotate(-90 55 350)">Priority</text>

  <!-- Pyramid levels - 9 rows from bottom (high) to top (low) -->
  <!-- Row 1 (bottom=highest): extra_vars -->
  <polygon points="147.8125,574.6875 991.5625,574.6875 963.4375,547.5 175.9375,547.5" fill="var(--danger-fill)"/>
  <text x="569.6875" y="565.625" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)" text-anchor="middle">--extra-vars / -e (command line)</text>

  <!-- Row 2: include_vars, set_fact registered -->
  <polygon points="175.9375,545.6875 963.4375,545.6875 935.3125,518.5 204.0625,518.5" fill="var(--danger-fill)"/>
  <text x="569.6875" y="536.625" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--bg)" text-anchor="middle">set_fact / registered vars / include_vars</text>

  <!-- Row 3: task vars (module args) -->
  <polygon points="204.0625,516.6875 935.3125,516.6875 907.1875,489.5 232.1875,489.5" fill="var(--warn-fill)"/>
  <text x="569.6875" y="507.625" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--bg)" text-anchor="middle">Task vars (in the task itself)</text>

  <!-- Row 4: block vars -->
  <polygon points="232.1875,487.6875 907.1875,487.6875 879.0625,460.5 260.3125,460.5" fill="var(--warn-fill)"/>
  <text x="569.6875" y="478.625" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--text)" text-anchor="middle">Block vars</text>

  <!-- Row 5: play vars_files, play vars_prompt -->
  <polygon points="260.3125,458.6875 879.0625,458.6875 850.9375,431.5 288.4375,431.5" fill="var(--warn-fill)"/>
  <text x="569.6875" y="449.625" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--text)" text-anchor="middle">vars_files / vars_prompt (in play)</text>

  <!-- Row 6: host_vars, group_vars -->
  <polygon points="288.4375,429.6875 850.9375,429.6875 822.8125,402.5 316.5625,402.5" fill="var(--ok-fill)"/>
  <text x="569.6875" y="420.625" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--bg)" text-anchor="middle">host_vars / group_vars (inventory files)</text>

  <!-- Row 7: inventory vars, play vars -->
  <polygon points="316.5625,400.6875 822.8125,400.6875 794.6875,373.5 344.6875,373.5" fill="var(--ok-fill)"/>
  <text x="569.6875" y="391.625" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--bg)" text-anchor="middle">play vars: / inventory group_vars/all</text>

  <!-- Row 8: role defaults -->
  <polygon points="344.6875,371.6875 794.6875,371.6875 766.5625,344.5 372.8125,344.5" fill="var(--primary-fill)"/>
  <text x="569.6875" y="362.625" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--bg)" text-anchor="middle">Role vars (roles/x/vars/main.yml)</text>

  <!-- Row 9 (top=lowest): role defaults -->
  <polygon points="372.8125,342.6875 766.5625,342.6875 640,315.5 640,315.5" fill="var(--primary-fill)"/>
  <text x="569.6875" y="330" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Role defaults (roles/x/defaults/main.yml)</text>

  <!-- Magic Variables panel -->
  <rect x="1015" y="96.1875" width="210.9375" height="190.3125" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="1015" y="96.1875" width="210.9375" height="27.1875" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="1015" y="112.5" width="210.9375" height="10.875" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1120" y="114.3125" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)" text-anchor="middle">Magic Variables</text>
  <text x="1029.0625" y="142.4062" font-family="monospace" font-size="11.0609" fill="var(--info-accent)">inventory_hostname</text>
  <text x="1029.0625" y="158.7188" font-family="monospace" font-size="11.0609" fill="var(--info-accent)">group_names</text>
  <text x="1029.0625" y="175.0312" font-family="monospace" font-size="11.0609" fill="var(--info-accent)">groups</text>
  <text x="1029.0625" y="191.3438" font-family="monospace" font-size="11.0609" fill="var(--info-accent)">hostvars</text>
  <text x="1029.0625" y="207.6562" font-family="monospace" font-size="11.0609" fill="var(--info-accent)">ansible_play_hosts</text>
  <text x="1029.0625" y="223.9688" font-family="monospace" font-size="11.0609" fill="var(--info-accent)">ansible_facts</text>
  <text x="1029.0625" y="240.2812" font-family="monospace" font-size="11.0609" fill="var(--info-accent)">role_path</text>
  <text x="1029.0625" y="256.5938" font-family="monospace" font-size="11.0609" fill="var(--info-accent)">playbook_dir</text>
  <text x="1029.0625" y="272.9062" font-family="monospace" font-size="11.0609" fill="var(--info-accent)">ansible_check_mode</text>

  <!-- Jinja2 Filters panel -->
  <rect x="1015" y="298.2812" width="210.9375" height="208.4375" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="1015" y="298.2812" width="210.9375" height="27.1875" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="1015" y="314.5938" width="210.9375" height="10.875" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1120" y="316.4062" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)" text-anchor="middle">Jinja2 Filters</text>
  <text x="1029.0625" y="343.5938" font-family="monospace" font-size="10.1392" fill="var(--ok-accent)">| default('val')</text>
  <text x="1029.0625" y="359.9062" font-family="monospace" font-size="10.1392" fill="var(--ok-accent)">| upper / lower</text>
  <text x="1029.0625" y="376.2188" font-family="monospace" font-size="10.1392" fill="var(--ok-accent)">| int / float</text>
  <text x="1029.0625" y="392.5312" font-family="monospace" font-size="10.1392" fill="var(--ok-accent)">| bool</text>
  <text x="1029.0625" y="408.8438" font-family="monospace" font-size="10.1392" fill="var(--ok-accent)">| length</text>
  <text x="1029.0625" y="425.1562" font-family="monospace" font-size="10.1392" fill="var(--ok-accent)">| join(',')</text>
  <text x="1029.0625" y="441.4688" font-family="monospace" font-size="10.1392" fill="var(--ok-accent)">| selectattr(...)</text>
  <text x="1029.0625" y="457.7812" font-family="monospace" font-size="10.1392" fill="var(--ok-accent)">| map(attribute=..)</text>
  <text x="1029.0625" y="474.0938" font-family="monospace" font-size="10.1392" fill="var(--ok-accent)">| to_json</text>
  <text x="1029.0625" y="490.4062" font-family="monospace" font-size="10.1392" fill="var(--ok-accent)">| from_yaml</text>
  <text x="1029.0625" y="506.7188" font-family="monospace" font-size="10.1392" fill="var(--ok-accent)">| combine({})</text>

  <!-- Bottom note -->
  <rect x="124.375" y="583.75" width="871.875" height="27.1875" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="560.3125" y="600.9688" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)" text-anchor="middle">Higher precedence WINS. Use role defaults for overridable values; use extra-vars for one-time overrides. Avoid abusing set_fact for simple variable declarations.</text>
</svg>

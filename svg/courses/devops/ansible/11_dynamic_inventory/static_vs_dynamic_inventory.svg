<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <line x1="640.000053" y1="40" x2="640.000053" y2="620" stroke="var(--border)" stroke-width="1.7778" stroke-dasharray="7.1111 4.4444" />
  <text x="319.999918" y="74.117622" text-anchor="middle" font-size="24.012244" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Static Inventory</text>
  <rect x="40" y="99.705892" width="560.00005" height="153.529406" rx="6.376427" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="319.999918" y="149.17656" text-anchor="middle" font-size="20.318061" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">inventory.yml</text>
  <text x="319.999918" y="186.705923" text-anchor="middle" font-size="16.623877" fill="var(--text-muted)" font-family="Arial, sans-serif">Manually edited flat file</text>
  <text x="319.999918" y="220.823546" text-anchor="middle" font-size="14.776733" fill="var(--text-muted)" font-family="Arial, sans-serif">hosts.ini / inventory.yml / inventory/</text>
  <text x="70.000003" y="304.41173" font-size="16.623877" fill="var(--text)" font-family="Arial, sans-serif">Fixed, pre-defined hosts</text>
  <text x="70.000003" y="341.941094" font-size="16.623877" fill="var(--text)" font-family="Arial, sans-serif">Manual updates required</text>
  <text x="70.000003" y="379.470669" font-size="16.623877" fill="var(--text)" font-family="Arial, sans-serif">Simple INI or YAML format</text>
  <text x="70.000003" y="417.000032" font-size="16.623877" fill="var(--text)" font-family="Arial, sans-serif">Best for small / stable environments</text>
  <text x="70.000003" y="454.529395" font-size="16.623877" fill="var(--text)" font-family="Arial, sans-serif">Version-controlled alongside playbooks</text>
  <rect x="40" y="483.529406" width="560.00005" height="119.411678" rx="6.376427" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="60.000002" y="507.411805" font-size="12.929588" fill="var(--primary-accent)" font-family="Courier New, monospace">[webservers]</text>
  <text x="60.000002" y="526.17638" font-size="12.929588" fill="var(--text-muted)" font-family="Courier New, monospace">web01 ansible_host=192.168.56.20</text>
  <text x="60.000002" y="544.941168" font-size="12.929588" fill="var(--text-muted)" font-family="Courier New, monospace">web02 ansible_host=192.168.56.21</text>
  <text x="60.000002" y="563.705955" font-size="12.929588" fill="var(--primary-accent)" font-family="Courier New, monospace">[dbservers]</text>
  <text x="60.000002" y="582.470531" font-size="12.929588" fill="var(--text-muted)" font-family="Courier New, monospace">db01 ansible_host=192.168.56.30</text>
  <text x="959.999975" y="74.117622" text-anchor="middle" font-size="24.012244" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Dynamic Inventory</text>
  <rect x="679.99995" y="99.705892" width="560.00005" height="153.529406" rx="6.376427" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="959.999975" y="149.17656" text-anchor="middle" font-size="20.318061" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">AWS / Azure / GCP / VMware</text>
  <text x="959.999975" y="186.705923" text-anchor="middle" font-size="16.623877" fill="var(--text-muted)" font-family="Arial, sans-serif">Script or plugin queries cloud API</text>
  <text x="959.999975" y="220.823546" text-anchor="middle" font-size="14.776733" fill="var(--text-muted)" font-family="Arial, sans-serif">Discovered at runtime</text>
  <text x="710.00006" y="304.41173" font-size="16.623877" fill="var(--text)" font-family="Arial, sans-serif">Hosts discovered at runtime</text>
  <text x="710.00006" y="341.941094" font-size="16.623877" fill="var(--text)" font-family="Arial, sans-serif">Always current (no drift)</text>
  <text x="710.00006" y="379.470669" font-size="16.623877" fill="var(--text)" font-family="Arial, sans-serif">Plugin or executable script</text>
  <text x="710.00006" y="417.000032" font-size="16.623877" fill="var(--text)" font-family="Arial, sans-serif">Best for cloud / ephemeral environments</text>
  <text x="710.00006" y="454.529395" font-size="16.623877" fill="var(--text)" font-family="Arial, sans-serif">Scales automatically with infrastructure</text>
  <rect x="679.99995" y="483.529406" width="560.00005" height="119.411678" rx="6.376427" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="700.000059" y="507.411805" font-size="12.929588" fill="var(--ok-accent)" font-family="Courier New, monospace"># aws_ec2.yml</text>
  <text x="700.000059" y="526.17638" font-size="12.929588" fill="var(--text-muted)" font-family="Courier New, monospace">plugin: amazon.aws.aws_ec2</text>
  <text x="700.000059" y="544.941168" font-size="12.929588" fill="var(--text-muted)" font-family="Courier New, monospace">regions: [us-east-1]</text>
  <text x="700.000059" y="563.705955" font-size="12.929588" fill="var(--text-muted)" font-family="Courier New, monospace">filters:</text>
  <text x="700.000059" y="582.470531" font-size="12.929588" fill="var(--text-muted)" font-family="Courier New, monospace">  instance-state-name: running</text>
</svg>
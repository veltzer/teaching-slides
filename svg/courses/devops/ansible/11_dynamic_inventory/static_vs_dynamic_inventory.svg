    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="var(--bg)" />
  <ns0:line x1="568.8889" y1="17.7778" x2="568.8889" y2="622.2222" stroke="var(--border-faint)" stroke-width="1.7778" stroke-dasharray="7.1111 4.4444" />
  <ns0:text x="284.4444" y="53.3333" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="var(--primary-dk)">Static Inventory</ns0:text>
  <ns0:rect x="35.5556" y="80" width="497.7778" height="160" rx="7.1111" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="284.4444" y="131.5556" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--text-darker)">inventory.yml</ns0:text>
  <ns0:text x="284.4444" y="170.6667" text-anchor="middle" font-size="16" fill="var(--text-muted)">Manually edited flat file</ns0:text>
  <ns0:text x="284.4444" y="206.2222" text-anchor="middle" font-size="14.2222" fill="var(--text-lighter)">hosts.ini / inventory.yml / inventory/</ns0:text>
  <ns0:text x="62.2222" y="293.3333" font-size="16" fill="var(--text-dark)">Fixed, pre-defined hosts</ns0:text>
  <ns0:text x="62.2222" y="332.4444" font-size="16" fill="var(--text-dark)">Manual updates required</ns0:text>
  <ns0:text x="62.2222" y="371.5556" font-size="16" fill="var(--text-dark)">Simple INI or YAML format</ns0:text>
  <ns0:text x="62.2222" y="410.6667" font-size="16" fill="var(--text-dark)">Best for small / stable environments</ns0:text>
  <ns0:text x="62.2222" y="449.7778" font-size="16" fill="var(--text-dark)">Version-controlled alongside playbooks</ns0:text>
  <ns0:rect x="35.5556" y="480" width="497.7778" height="124.4444" rx="7.1111" fill="url(#grad-surface)" stroke="var(--primary)" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="53.3333" y="504.8889" font-family="monospace" font-size="12.4444" fill="var(--primary-dk)">[webservers]</ns0:text>
  <ns0:text x="53.3333" y="524.4444" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">web01 ansible_host=192.168.56.20</ns0:text>
  <ns0:text x="53.3333" y="544" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">web02 ansible_host=192.168.56.21</ns0:text>
  <ns0:text x="53.3333" y="563.5556" font-family="monospace" font-size="12.4444" fill="var(--primary-dk)">[dbservers]</ns0:text>
  <ns0:text x="53.3333" y="583.1111" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">db01 ansible_host=192.168.56.30</ns0:text>
  <ns0:text x="853.3333" y="53.3333" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="var(--ok-deep)">Dynamic Inventory</ns0:text>
  <ns0:rect x="604.4444" y="80" width="497.7778" height="160" rx="7.1111" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="853.3333" y="131.5556" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--text-darker)">AWS / Azure / GCP / VMware</ns0:text>
  <ns0:text x="853.3333" y="170.6667" text-anchor="middle" font-size="16" fill="var(--text-muted)">Script or plugin queries cloud API</ns0:text>
  <ns0:text x="853.3333" y="206.2222" text-anchor="middle" font-size="14.2222" fill="var(--text-lighter)">Discovered at runtime</ns0:text>
  <ns0:text x="631.1111" y="293.3333" font-size="16" fill="var(--text-dark)">Hosts discovered at runtime</ns0:text>
  <ns0:text x="631.1111" y="332.4444" font-size="16" fill="var(--text-dark)">Always current (no drift)</ns0:text>
  <ns0:text x="631.1111" y="371.5556" font-size="16" fill="var(--text-dark)">Plugin or executable script</ns0:text>
  <ns0:text x="631.1111" y="410.6667" font-size="16" fill="var(--text-dark)">Best for cloud / ephemeral environments</ns0:text>
  <ns0:text x="631.1111" y="449.7778" font-size="16" fill="var(--text-dark)">Scales automatically with infrastructure</ns0:text>
  <ns0:rect x="604.4444" y="480" width="497.7778" height="124.4444" rx="7.1111" fill="url(#grad-surface)" stroke="var(--ok)" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="622.2222" y="504.8889" font-family="monospace" font-size="12.4444" fill="var(--ok-deep)"># aws_ec2.yml</ns0:text>
  <ns0:text x="622.2222" y="524.4444" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">plugin: amazon.aws.aws_ec2</ns0:text>
  <ns0:text x="622.2222" y="544" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">regions: [us-east-1]</ns0:text>
  <ns0:text x="622.2222" y="563.5556" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">filters:</ns0:text>
  <ns0:text x="622.2222" y="583.1111" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">  instance-state-name: running</ns0:text>
</ns0:svg>
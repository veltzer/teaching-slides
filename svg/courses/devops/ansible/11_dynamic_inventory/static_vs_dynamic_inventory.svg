<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="20" markerHeight="28" refX="18" refY="14" orient="auto">
      <polygon points="0,40 7,0" fill="#555" />
    </marker>
  </defs>
  <text x="320" y="80" font-size="28" font-weight="bold" fill="#222" text-anchor="middle">Static Inventory</text>
  <text x="960" y="80" font-size="28" font-weight="bold" fill="#222" text-anchor="middle">Dynamic Inventory</text>
  <rect x="40" y="140" width="560" height="200" fill="#e3f2fd" stroke="#333" stroke-width="3" rx="8" />
  <text x="320" y="208" font-size="24" font-weight="bold" fill="#222" text-anchor="middle">inventory.yml</text>
  <text x="320" y="272" font-size="22" font-weight="normal" fill="#222" text-anchor="middle">(manually edited)</text>
  <rect x="680" y="140" width="560" height="200" fill="#e8f5e9" stroke="#333" stroke-width="3" rx="8" />
  <text x="960" y="208" font-size="24" font-weight="bold" fill="#222" text-anchor="middle">AWS / Azure / GCP</text>
  <text x="960" y="272" font-size="22" font-weight="normal" fill="#222" text-anchor="middle">(API queries)</text>
  <text x="60" y="420" font-size="24" fill="#333" text-anchor="start">• Fixed hosts</text>
  <text x="700" y="420" font-size="24" fill="#333" text-anchor="start">• Discovered at runtime</text>
  <text x="60" y="500" font-size="24" fill="#333" text-anchor="start">• Manual updates</text>
  <text x="700" y="500" font-size="24" fill="#333" text-anchor="start">• Always current</text>
  <text x="60" y="580" font-size="24" fill="#333" text-anchor="start">• Good for small environments</text>
  <text x="700" y="580" font-size="24" fill="#333" text-anchor="start">• Good for cloud environments</text>
  <line x1="640" y1="120" x2="640" y2="700" stroke="#ccc" stroke-width="2" stroke-dasharray="8 6" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <line x1="568.8889" y1="17.7778" x2="568.8889" y2="622.2222" stroke="var(--border)" stroke-width="1.7778" stroke-dasharray="7.1111 4.4444" />
  <text x="284.4444" y="53.3333" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="var(--primary-accent)">Static Inventory</text>
  <rect x="35.5556" y="80" width="497.7778" height="160" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="284.4444" y="131.5556" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--text)">inventory.yml</text>
  <text x="284.4444" y="170.6667" text-anchor="middle" font-size="16" fill="var(--text-muted)">Manually edited flat file</text>
  <text x="284.4444" y="206.2222" text-anchor="middle" font-size="14.2222" fill="var(--text-muted)">hosts.ini / inventory.yml / inventory/</text>
  <text x="62.2222" y="293.3333" font-size="16" fill="var(--text)">Fixed, pre-defined hosts</text>
  <text x="62.2222" y="332.4444" font-size="16" fill="var(--text)">Manual updates required</text>
  <text x="62.2222" y="371.5556" font-size="16" fill="var(--text)">Simple INI or YAML format</text>
  <text x="62.2222" y="410.6667" font-size="16" fill="var(--text)">Best for small / stable environments</text>
  <text x="62.2222" y="449.7778" font-size="16" fill="var(--text)">Version-controlled alongside playbooks</text>
  <rect x="35.5556" y="480" width="497.7778" height="124.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="53.3333" y="504.8889" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">[webservers]</text>
  <text x="53.3333" y="524.4444" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">web01 ansible_host=192.168.56.20</text>
  <text x="53.3333" y="544" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">web02 ansible_host=192.168.56.21</text>
  <text x="53.3333" y="563.5556" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">[dbservers]</text>
  <text x="53.3333" y="583.1111" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">db01 ansible_host=192.168.56.30</text>
  <text x="853.3333" y="53.3333" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="var(--ok-accent)">Dynamic Inventory</text>
  <rect x="604.4444" y="80" width="497.7778" height="160" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="853.3333" y="131.5556" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--text)">AWS / Azure / GCP / VMware</text>
  <text x="853.3333" y="170.6667" text-anchor="middle" font-size="16" fill="var(--text-muted)">Script or plugin queries cloud API</text>
  <text x="853.3333" y="206.2222" text-anchor="middle" font-size="14.2222" fill="var(--text-muted)">Discovered at runtime</text>
  <text x="631.1111" y="293.3333" font-size="16" fill="var(--text)">Hosts discovered at runtime</text>
  <text x="631.1111" y="332.4444" font-size="16" fill="var(--text)">Always current (no drift)</text>
  <text x="631.1111" y="371.5556" font-size="16" fill="var(--text)">Plugin or executable script</text>
  <text x="631.1111" y="410.6667" font-size="16" fill="var(--text)">Best for cloud / ephemeral environments</text>
  <text x="631.1111" y="449.7778" font-size="16" fill="var(--text)">Scales automatically with infrastructure</text>
  <rect x="604.4444" y="480" width="497.7778" height="124.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="622.2222" y="504.8889" font-family="monospace" font-size="12.4444" fill="var(--ok-accent)"># aws_ec2.yml</text>
  <text x="622.2222" y="524.4444" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">plugin: amazon.aws.aws_ec2</text>
  <text x="622.2222" y="544" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">regions: [us-east-1]</text>
  <text x="622.2222" y="563.5556" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">filters:</text>
  <text x="622.2222" y="583.1111" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">  instance-state-name: running</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <line x1="640" y1="56.1111" x2="640" y2="603.8889" stroke="var(--border)" stroke-width="1.7778" stroke-dasharray="7.1111 4.4444" />
  <text x="339.9999" y="88.3333" text-anchor="middle" font-size="22.5947" font-weight="bold" fill="var(--primary-accent)">Static Inventory</text>
  <rect x="77.5" y="112.5" width="525" height="145" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="339.9999" y="159.2223" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--text)">inventory.yml</text>
  <text x="339.9999" y="194.6667" text-anchor="middle" font-size="15.6425" fill="var(--text-muted)">Manually edited flat file</text>
  <text x="339.9999" y="226.8889" text-anchor="middle" font-size="13.9044" fill="var(--text-muted)">hosts.ini / inventory.yml / inventory/</text>
  <text x="105.625" y="305.8333" font-size="15.6425" fill="var(--text)">Fixed, pre-defined hosts</text>
  <text x="105.625" y="341.2777" font-size="15.6425" fill="var(--text)">Manual updates required</text>
  <text x="105.625" y="376.7223" font-size="15.6425" fill="var(--text)">Simple INI or YAML format</text>
  <text x="105.625" y="412.1667" font-size="15.6425" fill="var(--text)">Best for small / stable environments</text>
  <text x="105.625" y="447.6111" font-size="15.6425" fill="var(--text)">Version-controlled alongside playbooks</text>
  <rect x="77.5" y="475" width="525" height="112.7777" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="96.25" y="497.5556" font-family="monospace" font-size="12.1663" fill="var(--primary-accent)">[webservers]</text>
  <text x="96.25" y="515.2777" font-family="monospace" font-size="12.1663" fill="var(--text-muted)">web01 ansible_host=192.168.56.20</text>
  <text x="96.25" y="533" font-family="monospace" font-size="12.1663" fill="var(--text-muted)">web02 ansible_host=192.168.56.21</text>
  <text x="96.25" y="550.7223" font-family="monospace" font-size="12.1663" fill="var(--primary-accent)">[dbservers]</text>
  <text x="96.25" y="568.4444" font-family="monospace" font-size="12.1663" fill="var(--text-muted)">db01 ansible_host=192.168.56.30</text>
  <text x="939.9999" y="88.3333" text-anchor="middle" font-size="22.5947" font-weight="bold" fill="var(--ok-accent)">Dynamic Inventory</text>
  <rect x="677.4999" y="112.5" width="525" height="145" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="939.9999" y="159.2223" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--text)">AWS / Azure / GCP / VMware</text>
  <text x="939.9999" y="194.6667" text-anchor="middle" font-size="15.6425" fill="var(--text-muted)">Script or plugin queries cloud API</text>
  <text x="939.9999" y="226.8889" text-anchor="middle" font-size="13.9044" fill="var(--text-muted)">Discovered at runtime</text>
  <text x="705.625" y="305.8333" font-size="15.6425" fill="var(--text)">Hosts discovered at runtime</text>
  <text x="705.625" y="341.2777" font-size="15.6425" fill="var(--text)">Always current (no drift)</text>
  <text x="705.625" y="376.7223" font-size="15.6425" fill="var(--text)">Plugin or executable script</text>
  <text x="705.625" y="412.1667" font-size="15.6425" fill="var(--text)">Best for cloud / ephemeral environments</text>
  <text x="705.625" y="447.6111" font-size="15.6425" fill="var(--text)">Scales automatically with infrastructure</text>
  <rect x="677.4999" y="475" width="525" height="112.7777" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="696.25" y="497.5556" font-family="monospace" font-size="12.1663" fill="var(--ok-accent)"># aws_ec2.yml</text>
  <text x="696.25" y="515.2777" font-family="monospace" font-size="12.1663" fill="var(--text-muted)">plugin: amazon.aws.aws_ec2</text>
  <text x="696.25" y="533" font-family="monospace" font-size="12.1663" fill="var(--text-muted)">regions: [us-east-1]</text>
  <text x="696.25" y="550.7223" font-family="monospace" font-size="12.1663" fill="var(--text-muted)">filters:</text>
  <text x="696.25" y="568.4444" font-family="monospace" font-size="12.1663" fill="var(--text-muted)">  instance-state-name: running</text>
</svg>
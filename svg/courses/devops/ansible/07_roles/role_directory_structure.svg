<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="26.6667" y="17.7778" width="408.8889" height="515.5556" rx="7.1111" fill="#f0f0f0" stroke="#e0e0e0" stroke-width="1.3333" />
  <ns0:text x="231.1111" y="46.2222" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#212121">Role Directory Layout</ns0:text>
  <ns0:text x="48.8889" y="72.8889" font-family="monospace" font-size="14.2222" fill="#1565c0" font-weight="bold">roles/</ns0:text>
  <ns0:text x="48.8889" y="96" font-family="monospace" font-size="14.2222" fill="#1565c0" font-weight="bold">└── my_role/</ns0:text>
  <ns0:text x="66.6667" y="119.1111" font-family="monospace" font-size="13.3333" fill="#212121">├── tasks/</ns0:text>
  <ns0:text x="102.2222" y="138.6667" font-family="monospace" font-size="12.4444" fill="#555555">└── main.yml</ns0:text>
  <ns0:text x="66.6667" y="161.7778" font-family="monospace" font-size="13.3333" fill="#212121">├── handlers/</ns0:text>
  <ns0:text x="102.2222" y="181.3333" font-family="monospace" font-size="12.4444" fill="#555555">└── main.yml</ns0:text>
  <ns0:text x="66.6667" y="204.4444" font-family="monospace" font-size="13.3333" fill="#212121">├── defaults/</ns0:text>
  <ns0:text x="102.2222" y="224" font-family="monospace" font-size="12.4444" fill="#555555">└── main.yml</ns0:text>
  <ns0:text x="66.6667" y="247.1111" font-family="monospace" font-size="13.3333" fill="#212121">├── vars/</ns0:text>
  <ns0:text x="102.2222" y="266.6667" font-family="monospace" font-size="12.4444" fill="#555555">└── main.yml</ns0:text>
  <ns0:text x="66.6667" y="289.7778" font-family="monospace" font-size="13.3333" fill="#212121">├── templates/</ns0:text>
  <ns0:text x="102.2222" y="309.3333" font-family="monospace" font-size="12.4444" fill="#555555">└── nginx.conf.j2</ns0:text>
  <ns0:text x="66.6667" y="332.4444" font-family="monospace" font-size="13.3333" fill="#212121">├── files/</ns0:text>
  <ns0:text x="102.2222" y="352" font-family="monospace" font-size="12.4444" fill="#555555">└── my_script.sh</ns0:text>
  <ns0:text x="66.6667" y="375.1111" font-family="monospace" font-size="13.3333" fill="#212121">├── meta/</ns0:text>
  <ns0:text x="102.2222" y="394.6667" font-family="monospace" font-size="12.4444" fill="#555555">└── main.yml</ns0:text>
  <ns0:text x="66.6667" y="417.7778" font-family="monospace" font-size="13.3333" fill="#212121">├── library/</ns0:text>
  <ns0:text x="102.2222" y="437.3333" font-family="monospace" font-size="12.4444" fill="#555555">└── custom_module.py</ns0:text>
  <ns0:text x="66.6667" y="460.4444" font-family="monospace" font-size="13.3333" fill="#212121">└── README.md</ns0:text>
  <ns0:rect x="453.3333" y="17.7778" width="657.7778" height="515.5556" rx="7.1111" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.3333" />
  <ns0:text x="782.2222" y="46.2222" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#212121">What each directory does</ns0:text>
  <ns0:rect x="471.1111" y="58.6667" width="622.2222" height="49.7778" rx="3.5556" fill="url(#grad-primary)" filter="url(#shadow)" />
  <ns0:text x="613.3333" y="80" font-family="monospace" font-size="14.2222" font-weight="bold" fill="#ffffff">tasks/main.yml</ns0:text>
  <ns0:text x="613.3333" y="99.5556" font-family="sans-serif" font-size="12.4444" fill="#bbdefb">The main list of tasks the role executes — entry point</ns0:text>
  <ns0:rect x="471.1111" y="115.5556" width="622.2222" height="49.7778" rx="3.5556" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="613.3333" y="136.8889" font-family="monospace" font-size="14.2222" font-weight="bold" fill="#212121">handlers/main.yml</ns0:text>
  <ns0:text x="613.3333" y="156.4444" font-family="sans-serif" font-size="12.4444" fill="#555555">Handlers triggered by <ns0:tspan font-family="monospace">notify:</ns0:tspan> — e.g. restart nginx</ns0:text>
  <ns0:rect x="471.1111" y="172.4444" width="622.2222" height="49.7778" rx="3.5556" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="613.3333" y="193.7778" font-family="monospace" font-size="14.2222" font-weight="bold" fill="#212121">defaults/main.yml</ns0:text>
  <ns0:text x="613.3333" y="213.3333" font-family="sans-serif" font-size="12.4444" fill="#555555">Lowest-priority variables — easily overridden by users</ns0:text>
  <ns0:rect x="471.1111" y="229.3333" width="622.2222" height="49.7778" rx="3.5556" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="613.3333" y="250.6667" font-family="monospace" font-size="14.2222" font-weight="bold" fill="#212121">vars/main.yml</ns0:text>
  <ns0:text x="613.3333" y="270.2222" font-family="sans-serif" font-size="12.4444" fill="#555555">Higher-priority variables — internal role constants</ns0:text>
  <ns0:rect x="471.1111" y="286.2222" width="622.2222" height="49.7778" rx="3.5556" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="613.3333" y="307.5556" font-family="monospace" font-size="14.2222" font-weight="bold" fill="#212121">templates/</ns0:text>
  <ns0:text x="613.3333" y="327.1111" font-family="sans-serif" font-size="12.4444" fill="#555555">Jinja2 templates (<ns0:tspan font-family="monospace">.j2</ns0:tspan>) deployed with the <ns0:tspan font-family="monospace">template:</ns0:tspan> module</ns0:text>
  <ns0:rect x="471.1111" y="343.1111" width="622.2222" height="49.7778" rx="3.5556" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="613.3333" y="364.4444" font-family="monospace" font-size="14.2222" font-weight="bold" fill="#212121">files/</ns0:text>
  <ns0:text x="613.3333" y="384" font-family="sans-serif" font-size="12.4444" fill="#555555">Static files deployed with the <ns0:tspan font-family="monospace">copy:</ns0:tspan> module</ns0:text>
  <ns0:rect x="471.1111" y="400" width="622.2222" height="49.7778" rx="3.5556" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="613.3333" y="421.3333" font-family="monospace" font-size="14.2222" font-weight="bold" fill="#212121">meta/main.yml</ns0:text>
  <ns0:text x="613.3333" y="440.8889" font-family="sans-serif" font-size="12.4444" fill="#555555">Role metadata: author, Galaxy tags, role dependencies</ns0:text>
  <ns0:rect x="471.1111" y="456.8889" width="622.2222" height="49.7778" rx="3.5556" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="613.3333" y="478.2222" font-family="monospace" font-size="14.2222" font-weight="bold" fill="#212121">library/</ns0:text>
  <ns0:text x="613.3333" y="497.7778" font-family="sans-serif" font-size="12.4444" fill="#555555">Custom modules used only by this role</ns0:text>
  <ns0:rect x="26.6667" y="549.3333" width="1084.4444" height="37.3333" rx="5.3333" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="572.4444" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="#1565c0">Create with: <ns0:tspan font-family="monospace">ansible-galaxy role init my_role</ns0:tspan> — all directories are optional, only <ns0:tspan font-family="monospace">tasks/</ns0:tspan> is needed</ns0:text>
</ns0:svg>
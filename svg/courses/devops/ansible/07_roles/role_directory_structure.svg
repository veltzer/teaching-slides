<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="452.458937" height="525.625042" rx="6.518573" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="266.229574" y="69.000135" text-anchor="middle" font-size="16.994463" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Role Directory Layout</text>
  <text x="64.59016" y="96.18767" font-size="15.106032" fill="var(--primary-accent)" font-weight="bold" font-family="Courier New, monospace">roles/</text>
  <text x="64.59016" y="119.750118" font-size="15.106032" fill="var(--primary-accent)" font-weight="bold" font-family="Courier New, monospace">└── my_role/</text>
  <text x="84.262287" y="143.312454" font-size="14.162143" fill="var(--text)" font-family="Courier New, monospace">├── tasks/</text>
  <text x="123.606543" y="163.250039" font-size="13.21771" fill="var(--text-muted)" font-family="Courier New, monospace">└── main.yml</text>
  <text x="84.262287" y="186.8126" font-size="14.162143" fill="var(--text)" font-family="Courier New, monospace">├── handlers/</text>
  <text x="123.606543" y="206.749961" font-size="13.21771" fill="var(--text-muted)" font-family="Courier New, monospace">└── main.yml</text>
  <text x="84.262287" y="230.312521" font-size="14.162143" fill="var(--text)" font-family="Courier New, monospace">├── defaults/</text>
  <text x="123.606543" y="250.250107" font-size="13.21771" fill="var(--text-muted)" font-family="Courier New, monospace">└── main.yml</text>
  <text x="84.262287" y="273.812442" font-size="14.162143" fill="var(--text)" font-family="Courier New, monospace">├── vars/</text>
  <text x="123.606543" y="293.750141" font-size="13.21771" fill="var(--text-muted)" font-family="Courier New, monospace">└── main.yml</text>
  <text x="84.262287" y="317.312589" font-size="14.162143" fill="var(--text)" font-family="Courier New, monospace">├── templates/</text>
  <text x="123.606543" y="337.249949" font-size="13.21771" fill="var(--text-muted)" font-family="Courier New, monospace">└── nginx.conf.j2</text>
  <text x="84.262287" y="360.81251" font-size="14.162143" fill="var(--text)" font-family="Courier New, monospace">├── files/</text>
  <text x="123.606543" y="380.750096" font-size="13.21771" fill="var(--text-muted)" font-family="Courier New, monospace">└── my_script.sh</text>
  <text x="84.262287" y="404.312544" font-size="14.162143" fill="var(--text)" font-family="Courier New, monospace">├── meta/</text>
  <text x="123.606543" y="424.250129" font-size="13.21771" fill="var(--text-muted)" font-family="Courier New, monospace">└── main.yml</text>
  <text x="84.262287" y="447.812465" font-size="14.162143" fill="var(--text)" font-family="Courier New, monospace">├── library/</text>
  <text x="123.606543" y="467.750051" font-size="13.21771" fill="var(--text-muted)" font-family="Courier New, monospace">└── custom_module.py</text>
  <text x="84.262287" y="491.312499" font-size="14.162143" fill="var(--text)" font-family="Courier New, monospace">└── README.md</text>
  <rect x="512.13117" y="40" width="727.86883" height="525.625042" rx="6.518573" fill="var(--bg)" stroke="var(--border)" stroke-width="1.3333"/>
  <text x="876.065532" y="69.000135" text-anchor="middle" font-size="16.994463" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">What each directory does</text>
  <rect x="531.803298" y="81.687546" width="688.52447" height="50.749983" rx="6.518573" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="689.180319" y="103.43762" font-size="15.106032" font-weight="bold" fill="var(--bg)" font-family="Courier New, monospace">tasks/main.yml</text>
  <text x="689.180319" y="123.375205" font-size="13.21771" fill="var(--primary-accent)" font-family="Arial, sans-serif">The main list of tasks the role executes — entry point</text>
  <rect x="531.803298" y="139.687704" width="688.52447" height="50.749983" rx="6.518573" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="689.180319" y="161.437665" font-size="15.106032" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">handlers/main.yml</text>
  <text x="689.180319" y="181.374913" font-size="13.21771" fill="var(--text-muted)" font-family="Arial, sans-serif">Handlers triggered by <tspan font-family="Courier New, monospace" fill="var(--text)">notify:</tspan> — e.g. restart nginx</text>
  <rect x="531.803298" y="197.687524" width="688.52447" height="50.749983" rx="6.518573" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="689.180319" y="219.437597" font-size="15.106032" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">defaults/main.yml</text>
  <text x="689.180319" y="239.374958" font-size="13.21771" fill="var(--text-muted)" font-family="Arial, sans-serif">Lowest-priority variables — easily overridden by users</text>
  <rect x="531.803298" y="255.687569" width="688.52447" height="50.749983" rx="6.518573" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="689.180319" y="277.43753" font-size="15.106032" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">vars/main.yml</text>
  <text x="689.180319" y="297.375115" font-size="13.21771" fill="var(--text-muted)" font-family="Arial, sans-serif">Higher-priority variables — internal role constants</text>
  <rect x="531.803298" y="313.687614" width="688.52447" height="50.749983" rx="6.518573" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="689.180319" y="335.437687" font-size="15.106032" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">templates/</text>
  <text x="689.180319" y="355.375048" font-size="13.21771" fill="var(--text-muted)" font-family="Arial, sans-serif">Jinja2 templates (<tspan font-family="Courier New, monospace" fill="var(--text)">.j2</tspan>) deployed with the <tspan font-family="Courier New, monospace" fill="var(--text)">template:</tspan> module</text>
  <rect x="531.803298" y="371.687434" width="688.52447" height="50.749983" rx="6.518573" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="689.180319" y="393.437395" font-size="15.106032" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">files/</text>
  <text x="689.180319" y="413.37498" font-size="13.21771" fill="var(--text-muted)" font-family="Arial, sans-serif">Static files deployed with the <tspan font-family="Courier New, monospace" fill="var(--text)">copy:</tspan> module</text>
  <rect x="531.803298" y="429.687591" width="688.52447" height="50.749983" rx="6.518573" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="689.180319" y="451.43744" font-size="15.106032" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">meta/main.yml</text>
  <text x="689.180319" y="471.375138" font-size="13.21771" fill="var(--text-muted)" font-family="Arial, sans-serif">Role metadata: author, Galaxy tags, role dependencies</text>
  <rect x="531.803298" y="487.687636" width="688.52447" height="50.749983" rx="6.518573" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="689.180319" y="509.437597" font-size="15.106032" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">library/</text>
  <text x="689.180319" y="529.37507" font-size="13.21771" fill="var(--text-muted)" font-family="Arial, sans-serif">Custom modules used only by this role</text>
  <rect x="40" y="581.937541" width="1199.99979" height="38.062459" rx="6.518573" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.999895" y="605.499989" text-anchor="middle" font-size="15.106032" fill="var(--primary-accent)" font-family="Arial, sans-serif">Create with: <tspan font-family="Courier New, monospace" fill="var(--text)">ansible-galaxy role init my_role</tspan> — all directories are optional, only <tspan font-family="Courier New, monospace" fill="var(--text)">tasks/</tspan> is needed</text>
</svg>

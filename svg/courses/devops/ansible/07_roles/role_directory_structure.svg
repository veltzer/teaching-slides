<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="26.6667" y="17.7778" width="408.8889" height="515.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="231.1111" y="46.2222" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Role Directory Layout</text>
  <text x="48.8889" y="72.8889" font-family="monospace" font-size="14.2222" fill="var(--primary-accent)" font-weight="bold">roles/</text>
  <text x="48.8889" y="96" font-family="monospace" font-size="14.2222" fill="var(--primary-accent)" font-weight="bold">└── my_role/</text>
  <text x="66.6667" y="119.1111" font-family="monospace" font-size="13.3333" fill="var(--text)">├── tasks/</text>
  <text x="102.2222" y="138.6667" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">└── main.yml</text>
  <text x="66.6667" y="161.7778" font-family="monospace" font-size="13.3333" fill="var(--text)">├── handlers/</text>
  <text x="102.2222" y="181.3333" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">└── main.yml</text>
  <text x="66.6667" y="204.4444" font-family="monospace" font-size="13.3333" fill="var(--text)">├── defaults/</text>
  <text x="102.2222" y="224" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">└── main.yml</text>
  <text x="66.6667" y="247.1111" font-family="monospace" font-size="13.3333" fill="var(--text)">├── vars/</text>
  <text x="102.2222" y="266.6667" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">└── main.yml</text>
  <text x="66.6667" y="289.7778" font-family="monospace" font-size="13.3333" fill="var(--text)">├── templates/</text>
  <text x="102.2222" y="309.3333" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">└── nginx.conf.j2</text>
  <text x="66.6667" y="332.4444" font-family="monospace" font-size="13.3333" fill="var(--text)">├── files/</text>
  <text x="102.2222" y="352" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">└── my_script.sh</text>
  <text x="66.6667" y="375.1111" font-family="monospace" font-size="13.3333" fill="var(--text)">├── meta/</text>
  <text x="102.2222" y="394.6667" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">└── main.yml</text>
  <text x="66.6667" y="417.7778" font-family="monospace" font-size="13.3333" fill="var(--text)">├── library/</text>
  <text x="102.2222" y="437.3333" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">└── custom_module.py</text>
  <text x="66.6667" y="460.4444" font-family="monospace" font-size="13.3333" fill="var(--text)">└── README.md</text>
  <rect x="453.3333" y="17.7778" width="657.7778" height="515.5556" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1.3333" />
  <text x="782.2222" y="46.2222" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--text)">What each directory does</text>
  <rect x="471.1111" y="58.6667" width="622.2222" height="49.7778" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="613.3333" y="80" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--bg)">tasks/main.yml</text>
  <text x="613.3333" y="99.5556" font-family="sans-serif" font-size="12.4444" fill="var(--primary-accent)">The main list of tasks the role executes — entry point</text>
  <rect x="471.1111" y="115.5556" width="622.2222" height="49.7778" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="613.3333" y="136.8889" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--text)">handlers/main.yml</text>
  <text x="613.3333" y="156.4444" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Handlers triggered by <tspan font-family="monospace">notify:</tspan> — e.g. restart nginx</text>
  <rect x="471.1111" y="172.4444" width="622.2222" height="49.7778" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="613.3333" y="193.7778" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--text)">defaults/main.yml</text>
  <text x="613.3333" y="213.3333" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Lowest-priority variables — easily overridden by users</text>
  <rect x="471.1111" y="229.3333" width="622.2222" height="49.7778" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="613.3333" y="250.6667" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--text)">vars/main.yml</text>
  <text x="613.3333" y="270.2222" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Higher-priority variables — internal role constants</text>
  <rect x="471.1111" y="286.2222" width="622.2222" height="49.7778" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="613.3333" y="307.5556" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--text)">templates/</text>
  <text x="613.3333" y="327.1111" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Jinja2 templates (<tspan font-family="monospace">.j2</tspan>) deployed with the <tspan font-family="monospace">template:</tspan> module</text>
  <rect x="471.1111" y="343.1111" width="622.2222" height="49.7778" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="613.3333" y="364.4444" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--text)">files/</text>
  <text x="613.3333" y="384" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Static files deployed with the <tspan font-family="monospace">copy:</tspan> module</text>
  <rect x="471.1111" y="400" width="622.2222" height="49.7778" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="613.3333" y="421.3333" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--text)">meta/main.yml</text>
  <text x="613.3333" y="440.8889" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Role metadata: author, Galaxy tags, role dependencies</text>
  <rect x="471.1111" y="456.8889" width="622.2222" height="49.7778" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="613.3333" y="478.2222" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--text)">library/</text>
  <text x="613.3333" y="497.7778" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Custom modules used only by this role</text>
  <rect x="26.6667" y="549.3333" width="1084.4444" height="37.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="568.8889" y="572.4444" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--primary-accent)">Create with: <tspan font-family="monospace">ansible-galaxy role init my_role</tspan> — all directories are optional, only <tspan font-family="monospace">tasks/</tspan> is needed</text>
</svg>
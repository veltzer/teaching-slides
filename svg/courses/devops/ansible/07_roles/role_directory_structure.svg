<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6.6276" x="40" y="40"/>
  <rect x="68.1249" y="56.111" width="431.25" height="467.2223" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="283.75" y="81.8889" text-anchor="middle" font-family="sans-serif" font-size="15.6425" font-weight="bold" fill="var(--text)">Role Directory Layout</text>
  <text x="91.5624" y="106.0556" font-family="monospace" font-size="13.9043" fill="var(--primary-accent)" font-weight="bold">roles/</text>
  <text x="91.5624" y="127" font-family="monospace" font-size="13.9043" fill="var(--primary-accent)" font-weight="bold">└── my_role/</text>
  <text x="110.3124" y="147.9443" font-family="monospace" font-size="13.0355" fill="var(--text)">├── tasks/</text>
  <text x="147.8124" y="165.6666" font-family="monospace" font-size="12.1662" fill="var(--text-muted)">└── main.yml</text>
  <text x="110.3124" y="186.6111" font-family="monospace" font-size="13.0355" fill="var(--text)">├── handlers/</text>
  <text x="147.8124" y="204.3332" font-family="monospace" font-size="12.1662" fill="var(--text-muted)">└── main.yml</text>
  <text x="110.3124" y="225.2777" font-family="monospace" font-size="13.0355" fill="var(--text)">├── defaults/</text>
  <text x="147.8124" y="243" font-family="monospace" font-size="12.1662" fill="var(--text-muted)">└── main.yml</text>
  <text x="110.3124" y="263.9443" font-family="monospace" font-size="13.0355" fill="var(--text)">├── vars/</text>
  <text x="147.8124" y="281.6667" font-family="monospace" font-size="12.1662" fill="var(--text-muted)">└── main.yml</text>
  <text x="110.3124" y="302.6111" font-family="monospace" font-size="13.0355" fill="var(--text)">├── templates/</text>
  <text x="147.8124" y="320.3332" font-family="monospace" font-size="12.1662" fill="var(--text-muted)">└── nginx.conf.j2</text>
  <text x="110.3124" y="341.2777" font-family="monospace" font-size="13.0355" fill="var(--text)">├── files/</text>
  <text x="147.8124" y="359" font-family="monospace" font-size="12.1662" fill="var(--text-muted)">└── my_script.sh</text>
  <text x="110.3124" y="379.9444" font-family="monospace" font-size="13.0355" fill="var(--text)">├── meta/</text>
  <text x="147.8124" y="397.6667" font-family="monospace" font-size="12.1662" fill="var(--text-muted)">└── main.yml</text>
  <text x="110.3124" y="418.611" font-family="monospace" font-size="13.0355" fill="var(--text)">├── library/</text>
  <text x="147.8124" y="436.3333" font-family="monospace" font-size="12.1662" fill="var(--text-muted)">└── custom_module.py</text>
  <text x="110.3124" y="457.2777" font-family="monospace" font-size="13.0355" fill="var(--text)">└── README.md</text>
  <rect x="518.125" y="56.111" width="693.7501" height="467.2223" rx="6.6276" fill="var(--bg)" stroke="var(--border)" stroke-width="1.3333" />
  <text x="865" y="81.8889" text-anchor="middle" font-family="sans-serif" font-size="15.6425" font-weight="bold" fill="var(--text)">What each directory does</text>
  <rect x="536.875" y="93.1666" width="656.25" height="45.1111" rx="6.6276" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="686.875" y="112.5" font-family="monospace" font-size="13.9043" font-weight="bold" fill="var(--bg)">tasks/main.yml</text>
  <text x="686.875" y="130.2223" font-family="sans-serif" font-size="12.1662" fill="var(--primary-accent)">The main list of tasks the role executes — entry point</text>
  <rect x="536.875" y="144.7223" width="656.25" height="45.1111" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="686.875" y="164.0556" font-family="monospace" font-size="13.9043" font-weight="bold" fill="var(--text)">handlers/main.yml</text>
  <text x="686.875" y="181.7776" font-family="sans-serif" font-size="12.1662" fill="var(--text-muted)">Handlers triggered by <tspan font-family="monospace">notify:</tspan> — e.g. restart nginx</text>
  <rect x="536.875" y="196.2777" width="656.25" height="45.1111" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="686.875" y="215.6111" font-family="monospace" font-size="13.9043" font-weight="bold" fill="var(--text)">defaults/main.yml</text>
  <text x="686.875" y="233.3332" font-family="sans-serif" font-size="12.1662" fill="var(--text-muted)">Lowest-priority variables — easily overridden by users</text>
  <rect x="536.875" y="247.8333" width="656.25" height="45.1111" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="686.875" y="267.1666" font-family="monospace" font-size="13.9043" font-weight="bold" fill="var(--text)">vars/main.yml</text>
  <text x="686.875" y="284.8889" font-family="sans-serif" font-size="12.1662" fill="var(--text-muted)">Higher-priority variables — internal role constants</text>
  <rect x="536.875" y="299.3889" width="656.25" height="45.1111" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="686.875" y="318.7223" font-family="monospace" font-size="13.9043" font-weight="bold" fill="var(--text)">templates/</text>
  <text x="686.875" y="336.4444" font-family="sans-serif" font-size="12.1662" fill="var(--text-muted)">Jinja2 templates (<tspan font-family="monospace">.j2</tspan>) deployed with the <tspan font-family="monospace">template:</tspan> module</text>
  <rect x="536.875" y="350.9443" width="656.25" height="45.1111" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="686.875" y="370.2776" font-family="monospace" font-size="13.9043" font-weight="bold" fill="var(--text)">files/</text>
  <text x="686.875" y="387.9999" font-family="sans-serif" font-size="12.1662" fill="var(--text-muted)">Static files deployed with the <tspan font-family="monospace">copy:</tspan> module</text>
  <rect x="536.875" y="402.5" width="656.25" height="45.1111" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="686.875" y="421.8332" font-family="monospace" font-size="13.9043" font-weight="bold" fill="var(--text)">meta/main.yml</text>
  <text x="686.875" y="439.5556" font-family="sans-serif" font-size="12.1662" fill="var(--text-muted)">Role metadata: author, Galaxy tags, role dependencies</text>
  <rect x="536.875" y="454.0556" width="656.25" height="45.1111" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="686.875" y="473.3889" font-family="monospace" font-size="13.9043" font-weight="bold" fill="var(--text)">library/</text>
  <text x="686.875" y="491.1111" font-family="sans-serif" font-size="12.1662" fill="var(--text-muted)">Custom modules used only by this role</text>
  <rect x="68.1249" y="537.8333" width="1143.75" height="33.8333" rx="6.6276" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="639.9999" y="558.7777" text-anchor="middle" font-family="sans-serif" font-size="13.9043" fill="var(--primary-accent)">Create with: <tspan font-family="monospace">ansible-galaxy role init my_role</tspan> — all directories are optional, only <tspan font-family="monospace">tasks/</tspan> is needed</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Directory tree (left panel) -->
  <rect x="30" y="20" width="460" height="580" rx="8" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="260" y="52" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#212121">Role Directory Layout</text>

  <!-- tree lines -->
  <text x="55"  y="82"  font-family="monospace" font-size="16" fill="#1565c0" font-weight="bold">roles/</text>
  <text x="55"  y="108" font-family="monospace" font-size="16" fill="#1565c0" font-weight="bold">└── my_role/</text>
  <text x="75"  y="134" font-family="monospace" font-size="15" fill="#212121">├── tasks/</text>
  <text x="115" y="156" font-family="monospace" font-size="14" fill="#555555">└── main.yml</text>
  <text x="75"  y="182" font-family="monospace" font-size="15" fill="#212121">├── handlers/</text>
  <text x="115" y="204" font-family="monospace" font-size="14" fill="#555555">└── main.yml</text>
  <text x="75"  y="230" font-family="monospace" font-size="15" fill="#212121">├── defaults/</text>
  <text x="115" y="252" font-family="monospace" font-size="14" fill="#555555">└── main.yml</text>
  <text x="75"  y="278" font-family="monospace" font-size="15" fill="#212121">├── vars/</text>
  <text x="115" y="300" font-family="monospace" font-size="14" fill="#555555">└── main.yml</text>
  <text x="75"  y="326" font-family="monospace" font-size="15" fill="#212121">├── templates/</text>
  <text x="115" y="348" font-family="monospace" font-size="14" fill="#555555">└── nginx.conf.j2</text>
  <text x="75"  y="374" font-family="monospace" font-size="15" fill="#212121">├── files/</text>
  <text x="115" y="396" font-family="monospace" font-size="14" fill="#555555">└── my_script.sh</text>
  <text x="75"  y="422" font-family="monospace" font-size="15" fill="#212121">├── meta/</text>
  <text x="115" y="444" font-family="monospace" font-size="14" fill="#555555">└── main.yml</text>
  <text x="75"  y="470" font-family="monospace" font-size="15" fill="#212121">├── library/</text>
  <text x="115" y="492" font-family="monospace" font-size="14" fill="#555555">└── custom_module.py</text>
  <text x="75"  y="518" font-family="monospace" font-size="15" fill="#212121">└── README.md</text>

  <!-- Right panel: descriptions -->
  <rect x="510" y="20" width="740" height="580" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="880" y="52" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#212121">What each directory does</text>

  <!-- tasks -->
  <rect x="530" y="66" width="700" height="56" rx="4" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="690" y="90" font-family="monospace" font-size="16" font-weight="bold" fill="#ffffff">tasks/main.yml</text>
  <text x="690" y="112" font-family="sans-serif" font-size="14" fill="#bbdefb">The main list of tasks the role executes — entry point</text>

  <!-- handlers -->
  <rect x="530" y="130" width="700" height="56" rx="4" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="690" y="154" font-family="monospace" font-size="16" font-weight="bold" fill="#212121">handlers/main.yml</text>
  <text x="690" y="176" font-family="sans-serif" font-size="14" fill="#555555">Handlers triggered by <tspan font-family="monospace">notify:</tspan> — e.g. restart nginx</text>

  <!-- defaults -->
  <rect x="530" y="194" width="700" height="56" rx="4" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="690" y="218" font-family="monospace" font-size="16" font-weight="bold" fill="#212121">defaults/main.yml</text>
  <text x="690" y="240" font-family="sans-serif" font-size="14" fill="#555555">Lowest-priority variables — easily overridden by users</text>

  <!-- vars -->
  <rect x="530" y="258" width="700" height="56" rx="4" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="690" y="282" font-family="monospace" font-size="16" font-weight="bold" fill="#212121">vars/main.yml</text>
  <text x="690" y="304" font-family="sans-serif" font-size="14" fill="#555555">Higher-priority variables — internal role constants</text>

  <!-- templates -->
  <rect x="530" y="322" width="700" height="56" rx="4" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="690" y="346" font-family="monospace" font-size="16" font-weight="bold" fill="#212121">templates/</text>
  <text x="690" y="368" font-family="sans-serif" font-size="14" fill="#555555">Jinja2 templates (<tspan font-family="monospace">.j2</tspan>) deployed with the <tspan font-family="monospace">template:</tspan> module</text>

  <!-- files -->
  <rect x="530" y="386" width="700" height="56" rx="4" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="690" y="410" font-family="monospace" font-size="16" font-weight="bold" fill="#212121">files/</text>
  <text x="690" y="432" font-family="sans-serif" font-size="14" fill="#555555">Static files deployed with the <tspan font-family="monospace">copy:</tspan> module</text>

  <!-- meta -->
  <rect x="530" y="450" width="700" height="56" rx="4" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="690" y="474" font-family="monospace" font-size="16" font-weight="bold" fill="#212121">meta/main.yml</text>
  <text x="690" y="496" font-family="sans-serif" font-size="14" fill="#555555">Role metadata: author, Galaxy tags, role dependencies</text>

  <!-- library -->
  <rect x="530" y="514" width="700" height="56" rx="4" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="690" y="538" font-family="monospace" font-size="16" font-weight="bold" fill="#212121">library/</text>
  <text x="690" y="560" font-family="sans-serif" font-size="14" fill="#555555">Custom modules used only by this role</text>

  <!-- Note -->
  <rect x="30" y="618" width="1220" height="42" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="640" y="644" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1565c0">Create with: <tspan font-family="monospace">ansible-galaxy role init my_role</tspan> — all directories are optional, only <tspan font-family="monospace">tasks/</tspan> is needed</text>
</svg>

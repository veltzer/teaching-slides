<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="452.458937" height="525.625042" rx="6.518573" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="266.229574" y="69.000135" text-anchor="middle" font-family="sans-serif" font-size="16.994463" font-weight="bold" fill="var(--text)">Role Directory Layout</text>
  <text x="64.59016" y="96.18767" font-family="monospace" font-size="15.106032" fill="var(--primary-accent)" font-weight="bold">roles/</text>
  <text x="64.59016" y="119.750118" font-family="monospace" font-size="15.106032" fill="var(--primary-accent)" font-weight="bold">└── my_role/</text>
  <text x="84.262287" y="143.312454" font-family="monospace" font-size="14.162143" fill="var(--text)">├── tasks/</text>
  <text x="123.606543" y="163.250039" font-family="monospace" font-size="13.21771" fill="var(--text-muted)">└── main.yml</text>
  <text x="84.262287" y="186.8126" font-family="monospace" font-size="14.162143" fill="var(--text)">├── handlers/</text>
  <text x="123.606543" y="206.749961" font-family="monospace" font-size="13.21771" fill="var(--text-muted)">└── main.yml</text>
  <text x="84.262287" y="230.312521" font-family="monospace" font-size="14.162143" fill="var(--text)">├── defaults/</text>
  <text x="123.606543" y="250.250107" font-family="monospace" font-size="13.21771" fill="var(--text-muted)">└── main.yml</text>
  <text x="84.262287" y="273.812442" font-family="monospace" font-size="14.162143" fill="var(--text)">├── vars/</text>
  <text x="123.606543" y="293.750141" font-family="monospace" font-size="13.21771" fill="var(--text-muted)">└── main.yml</text>
  <text x="84.262287" y="317.312589" font-family="monospace" font-size="14.162143" fill="var(--text)">├── templates/</text>
  <text x="123.606543" y="337.249949" font-family="monospace" font-size="13.21771" fill="var(--text-muted)">└── nginx.conf.j2</text>
  <text x="84.262287" y="360.81251" font-family="monospace" font-size="14.162143" fill="var(--text)">├── files/</text>
  <text x="123.606543" y="380.750096" font-family="monospace" font-size="13.21771" fill="var(--text-muted)">└── my_script.sh</text>
  <text x="84.262287" y="404.312544" font-family="monospace" font-size="14.162143" fill="var(--text)">├── meta/</text>
  <text x="123.606543" y="424.250129" font-family="monospace" font-size="13.21771" fill="var(--text-muted)">└── main.yml</text>
  <text x="84.262287" y="447.812465" font-family="monospace" font-size="14.162143" fill="var(--text)">├── library/</text>
  <text x="123.606543" y="467.750051" font-family="monospace" font-size="13.21771" fill="var(--text-muted)">└── custom_module.py</text>
  <text x="84.262287" y="491.312499" font-family="monospace" font-size="14.162143" fill="var(--text)">└── README.md</text>
  <rect x="512.13117" y="40" width="727.86883" height="525.625042" rx="6.518573" fill="var(--bg)" stroke="var(--border)" stroke-width="1.3333" />
  <text x="876.065532" y="69.000135" text-anchor="middle" font-family="sans-serif" font-size="16.994463" font-weight="bold" fill="var(--text)">What each directory does</text>
  <rect x="531.803298" y="81.687546" width="688.52447" height="50.749983" rx="6.518573" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="689.180319" y="103.43762" font-family="monospace" font-size="15.106032" font-weight="bold" fill="var(--bg)">tasks/main.yml</text>
  <text x="689.180319" y="123.375205" font-family="sans-serif" font-size="13.21771" fill="var(--primary-accent)">The main list of tasks the role executes — entry point</text>
  <rect x="531.803298" y="139.687704" width="688.52447" height="50.749983" rx="6.518573" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="689.180319" y="161.437665" font-family="monospace" font-size="15.106032" font-weight="bold" fill="var(--text)">handlers/main.yml</text>
  <text x="689.180319" y="181.374913" font-family="sans-serif" font-size="13.21771" fill="var(--text-muted)">Handlers triggered by <tspan font-family="monospace">notify:</tspan> — e.g. restart nginx</text>
  <rect x="531.803298" y="197.687524" width="688.52447" height="50.749983" rx="6.518573" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="689.180319" y="219.437597" font-family="monospace" font-size="15.106032" font-weight="bold" fill="var(--text)">defaults/main.yml</text>
  <text x="689.180319" y="239.374958" font-family="sans-serif" font-size="13.21771" fill="var(--text-muted)">Lowest-priority variables — easily overridden by users</text>
  <rect x="531.803298" y="255.687569" width="688.52447" height="50.749983" rx="6.518573" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="689.180319" y="277.43753" font-family="monospace" font-size="15.106032" font-weight="bold" fill="var(--text)">vars/main.yml</text>
  <text x="689.180319" y="297.375115" font-family="sans-serif" font-size="13.21771" fill="var(--text-muted)">Higher-priority variables — internal role constants</text>
  <rect x="531.803298" y="313.687614" width="688.52447" height="50.749983" rx="6.518573" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="689.180319" y="335.437687" font-family="monospace" font-size="15.106032" font-weight="bold" fill="var(--text)">templates/</text>
  <text x="689.180319" y="355.375048" font-family="sans-serif" font-size="13.21771" fill="var(--text-muted)">Jinja2 templates (<tspan font-family="monospace">.j2</tspan>) deployed with the <tspan font-family="monospace">template:</tspan> module</text>
  <rect x="531.803298" y="371.687434" width="688.52447" height="50.749983" rx="6.518573" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="689.180319" y="393.437395" font-family="monospace" font-size="15.106032" font-weight="bold" fill="var(--text)">files/</text>
  <text x="689.180319" y="413.37498" font-family="sans-serif" font-size="13.21771" fill="var(--text-muted)">Static files deployed with the <tspan font-family="monospace">copy:</tspan> module</text>
  <rect x="531.803298" y="429.687591" width="688.52447" height="50.749983" rx="6.518573" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="689.180319" y="451.43744" font-family="monospace" font-size="15.106032" font-weight="bold" fill="var(--text)">meta/main.yml</text>
  <text x="689.180319" y="471.375138" font-family="sans-serif" font-size="13.21771" fill="var(--text-muted)">Role metadata: author, Galaxy tags, role dependencies</text>
  <rect x="531.803298" y="487.687636" width="688.52447" height="50.749983" rx="6.518573" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="689.180319" y="509.437597" font-family="monospace" font-size="15.106032" font-weight="bold" fill="var(--text)">library/</text>
  <text x="689.180319" y="529.37507" font-family="sans-serif" font-size="13.21771" fill="var(--text-muted)">Custom modules used only by this role</text>
  <rect x="40" y="581.937541" width="1199.99979" height="38.062459" rx="6.518573" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.999895" y="605.499989" text-anchor="middle" font-family="sans-serif" font-size="15.106032" fill="var(--primary-accent)">Create with: <tspan font-family="monospace">ansible-galaxy role init my_role</tspan> — all directories are optional, only <tspan font-family="monospace">tasks/</tspan> is needed</text>
</svg>
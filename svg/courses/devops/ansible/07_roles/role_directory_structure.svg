<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect width="1087.5767" height="474.8286" fill="var(--bg)" rx="5.7089" x="152.4233" y="145.1714"/>
  <rect x="177.9133" y="158.361" width="390.8479" height="382.5009" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="373.3373" y="179.4646" text-anchor="middle" font-family="sans-serif" font-size="13.4741" font-weight="bold" fill="var(--text)">Role Directory Layout</text>
  <text x="199.155" y="199.2491" font-family="monospace" font-size="11.9769" fill="var(--primary-accent)" font-weight="bold">roles/</text>
  <text x="199.155" y="216.3957" font-family="monospace" font-size="11.9769" fill="var(--primary-accent)" font-weight="bold">└── my_role/</text>
  <text x="216.1484" y="233.5422" font-family="monospace" font-size="11.2285" fill="var(--text)">├── tasks/</text>
  <text x="250.1352" y="248.0509" font-family="monospace" font-size="10.4797" fill="var(--text-muted)">└── main.yml</text>
  <text x="216.1484" y="265.1975" font-family="monospace" font-size="11.2285" fill="var(--text)">├── handlers/</text>
  <text x="250.1352" y="279.7061" font-family="monospace" font-size="10.4797" fill="var(--text-muted)">└── main.yml</text>
  <text x="216.1484" y="296.8527" font-family="monospace" font-size="11.2285" fill="var(--text)">├── defaults/</text>
  <text x="250.1352" y="311.3614" font-family="monospace" font-size="10.4797" fill="var(--text-muted)">└── main.yml</text>
  <text x="216.1484" y="328.5079" font-family="monospace" font-size="11.2285" fill="var(--text)">├── vars/</text>
  <text x="250.1352" y="343.0167" font-family="monospace" font-size="10.4797" fill="var(--text-muted)">└── main.yml</text>
  <text x="216.1484" y="360.1632" font-family="monospace" font-size="11.2285" fill="var(--text)">├── templates/</text>
  <text x="250.1352" y="374.6718" font-family="monospace" font-size="10.4797" fill="var(--text-muted)">└── nginx.conf.j2</text>
  <text x="216.1484" y="391.8184" font-family="monospace" font-size="11.2285" fill="var(--text)">├── files/</text>
  <text x="250.1352" y="406.3271" font-family="monospace" font-size="10.4797" fill="var(--text-muted)">└── my_script.sh</text>
  <text x="216.1484" y="423.4737" font-family="monospace" font-size="11.2285" fill="var(--text)">├── meta/</text>
  <text x="250.1352" y="437.9824" font-family="monospace" font-size="10.4797" fill="var(--text-muted)">└── main.yml</text>
  <text x="216.1484" y="455.1289" font-family="monospace" font-size="11.2285" fill="var(--text)">├── library/</text>
  <text x="250.1352" y="469.6376" font-family="monospace" font-size="10.4797" fill="var(--text-muted)">└── custom_module.py</text>
  <text x="216.1484" y="486.7841" font-family="monospace" font-size="11.2285" fill="var(--text)">└── README.md</text>
  <rect x="585.7546" y="158.361" width="628.7554" height="382.5009" rx="5.7089" fill="var(--bg)" stroke="var(--border)" stroke-width="1.3333" />
  <text x="900.1323" y="179.4646" text-anchor="middle" font-family="sans-serif" font-size="13.4741" font-weight="bold" fill="var(--text)">What each directory does</text>
  <rect x="602.748" y="188.6973" width="594.7685" height="36.9311" rx="5.7089" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="738.6951" y="204.525" font-family="monospace" font-size="11.9769" font-weight="bold" fill="var(--bg)">tasks/main.yml</text>
  <text x="738.6951" y="219.0337" font-family="sans-serif" font-size="10.4797" fill="var(--primary-accent)">The main list of tasks the role executes — entry point</text>
  <rect x="602.748" y="230.9044" width="594.7685" height="36.9311" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="738.6951" y="246.732" font-family="monospace" font-size="11.9769" font-weight="bold" fill="var(--text)">handlers/main.yml</text>
  <text x="738.6951" y="261.2405" font-family="sans-serif" font-size="10.4797" fill="var(--text-muted)">Handlers triggered by <tspan font-family="monospace">notify:</tspan> — e.g. restart nginx</text>
  <rect x="602.748" y="273.1113" width="594.7685" height="36.9311" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="738.6951" y="288.9389" font-family="monospace" font-size="11.9769" font-weight="bold" fill="var(--text)">defaults/main.yml</text>
  <text x="738.6951" y="303.4475" font-family="sans-serif" font-size="10.4797" fill="var(--text-muted)">Lowest-priority variables — easily overridden by users</text>
  <rect x="602.748" y="315.3183" width="594.7685" height="36.9311" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="738.6951" y="331.1459" font-family="monospace" font-size="11.9769" font-weight="bold" fill="var(--text)">vars/main.yml</text>
  <text x="738.6951" y="345.6546" font-family="sans-serif" font-size="10.4797" fill="var(--text-muted)">Higher-priority variables — internal role constants</text>
  <rect x="602.748" y="357.5253" width="594.7685" height="36.9311" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="738.6951" y="373.353" font-family="monospace" font-size="11.9769" font-weight="bold" fill="var(--text)">templates/</text>
  <text x="738.6951" y="387.8615" font-family="sans-serif" font-size="10.4797" fill="var(--text-muted)">Jinja2 templates (<tspan font-family="monospace">.j2</tspan>) deployed with the <tspan font-family="monospace">template:</tspan> module</text>
  <rect x="602.748" y="399.7322" width="594.7685" height="36.9311" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="738.6951" y="415.5598" font-family="monospace" font-size="11.9769" font-weight="bold" fill="var(--text)">files/</text>
  <text x="738.6951" y="430.0685" font-family="sans-serif" font-size="10.4797" fill="var(--text-muted)">Static files deployed with the <tspan font-family="monospace">copy:</tspan> module</text>
  <rect x="602.748" y="441.9393" width="594.7685" height="36.9311" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="738.6951" y="457.7668" font-family="monospace" font-size="11.9769" font-weight="bold" fill="var(--text)">meta/main.yml</text>
  <text x="738.6951" y="472.2756" font-family="sans-serif" font-size="10.4797" fill="var(--text-muted)">Role metadata: author, Galaxy tags, role dependencies</text>
  <rect x="602.748" y="484.1463" width="594.7685" height="36.9311" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="738.6951" y="499.9739" font-family="monospace" font-size="11.9769" font-weight="bold" fill="var(--text)">library/</text>
  <text x="738.6951" y="514.4825" font-family="sans-serif" font-size="10.4797" fill="var(--text-muted)">Custom modules used only by this role</text>
  <rect x="177.9133" y="552.7326" width="1036.5965" height="27.6983" rx="5.7089" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="696.2116" y="569.8791" text-anchor="middle" font-family="sans-serif" font-size="11.9769" fill="var(--primary-accent)">Create with: <tspan font-family="monospace">ansible-galaxy role init my_role</tspan> — all directories are optional, only <tspan font-family="monospace">tasks/</tspan> is needed</text>
</svg>
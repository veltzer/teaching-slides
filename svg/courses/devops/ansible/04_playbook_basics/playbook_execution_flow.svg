  <rect x="280" y="458.9011" width="720" height="50.6374" fill="#fffde7" stroke="#333" stroke-width="2.3736" rx="6.3297" />
  <text x="304" y="492.1319" font-size="18.989" font-weight="normal" fill="#222" text-anchor="start">  5. Execute tasks (in order)</text>

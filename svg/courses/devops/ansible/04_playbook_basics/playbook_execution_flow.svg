<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Step 0: command -->
  <rect x="240" y="15" width="800" height="52" rx="8" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="300" y="47" font-size="20" font-weight="bold" fill="#ffffff">ansible-playbook site.yml</text>

  <!-- connector -->
  <line x1="640" y1="68" x2="640" y2="88" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 1 -->
  <rect x="240" y="90" width="800" height="52" rx="8" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="300" y="122" font-size="18" fill="#333">Parse YAML file and validate syntax</text>
  <line x1="640" y1="143" x2="640" y2="163" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect x="240" y="165" width="800" height="52" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="300" y="197" font-size="18" fill="#333" font-weight="bold">For each play:</text>
  <line x1="640" y1="218" x2="640" y2="238" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <rect x="240" y="240" width="800" height="52" rx="8" fill="url(#grad-surface)" stroke="#bbbbbb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="300" y="272" font-size="18" fill="#333">1. Select hosts from inventory</text>
  <line x1="640" y1="293" x2="640" y2="313" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <rect x="240" y="315" width="800" height="52" rx="8" fill="url(#grad-surface)" stroke="#bbbbbb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="300" y="347" font-size="18" fill="#333">2. Gather facts (if enabled)</text>
  <line x1="640" y1="368" x2="640" y2="388" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 5 -->
  <rect x="240" y="390" width="800" height="52" rx="8" fill="url(#grad-surface)" stroke="#bbbbbb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="300" y="422" font-size="18" fill="#333">3. Execute pre_tasks</text>
  <line x1="640" y1="443" x2="640" y2="463" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 6 -->
  <rect x="240" y="465" width="800" height="52" rx="8" fill="url(#grad-surface)" stroke="#bbbbbb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="300" y="497" font-size="18" fill="#333">4. Execute roles (in order)</text>
  <line x1="640" y1="518" x2="640" y2="538" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 7 -->
  <rect x="240" y="540" width="800" height="52" rx="8" fill="url(#grad-surface)" stroke="#bbbbbb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="300" y="572" font-size="18" fill="#333">5. Execute tasks (in declaration order)</text>
  <line x1="640" y1="593" x2="640" y2="613" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 8: recap -->
  <rect x="240" y="615" width="800" height="52" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="2" filter="url(#shadow)"/>
  <text x="300" y="647" font-size="18" font-weight="bold" fill="#1b5e20">Run notified handlers, then display play recap</text>
</svg>

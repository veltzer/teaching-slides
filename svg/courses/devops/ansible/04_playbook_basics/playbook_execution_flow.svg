<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="213.3333" y="13.3333" width="711.1111" height="46.2222" rx="7.1111" fill="url(#grad-primary)" filter="url(#shadow)" />
  <ns0:text x="266.6667" y="41.7778" font-size="17.7778" font-weight="bold" fill="#ffffff">ansible-playbook site.yml</ns0:text>
  <ns0:line x1="568.8889" y1="60.4444" x2="568.8889" y2="78.2222" stroke="#555" stroke-width="2.2222" marker-end="url(#arrow)" />
  <ns0:rect x="213.3333" y="80" width="711.1111" height="46.2222" rx="7.1111" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="266.6667" y="108.4444" font-size="16" fill="#333">Parse YAML file and validate syntax</ns0:text>
  <ns0:line x1="568.8889" y1="127.1111" x2="568.8889" y2="144.8889" stroke="#555" stroke-width="2.2222" marker-end="url(#arrow)" />
  <ns0:rect x="213.3333" y="146.6667" width="711.1111" height="46.2222" rx="7.1111" fill="#fff8e1" stroke="#f9a825" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="266.6667" y="175.1111" font-size="16" fill="#333" font-weight="bold">For each play:</ns0:text>
  <ns0:line x1="568.8889" y1="193.7778" x2="568.8889" y2="211.5556" stroke="#555" stroke-width="2.2222" marker-end="url(#arrow)" />
  <ns0:rect x="213.3333" y="213.3333" width="711.1111" height="46.2222" rx="7.1111" fill="url(#grad-surface)" stroke="#bdbdbd" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="266.6667" y="241.7778" font-size="16" fill="#333">1. Select hosts from inventory</ns0:text>
  <ns0:line x1="568.8889" y1="260.4444" x2="568.8889" y2="278.2222" stroke="#555" stroke-width="2.2222" marker-end="url(#arrow)" />
  <ns0:rect x="213.3333" y="280" width="711.1111" height="46.2222" rx="7.1111" fill="url(#grad-surface)" stroke="#bdbdbd" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="266.6667" y="308.4444" font-size="16" fill="#333">2. Gather facts (if enabled)</ns0:text>
  <ns0:line x1="568.8889" y1="327.1111" x2="568.8889" y2="344.8889" stroke="#555" stroke-width="2.2222" marker-end="url(#arrow)" />
  <ns0:rect x="213.3333" y="346.6667" width="711.1111" height="46.2222" rx="7.1111" fill="url(#grad-surface)" stroke="#bdbdbd" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="266.6667" y="375.1111" font-size="16" fill="#333">3. Execute pre_tasks</ns0:text>
  <ns0:line x1="568.8889" y1="393.7778" x2="568.8889" y2="411.5556" stroke="#555" stroke-width="2.2222" marker-end="url(#arrow)" />
  <ns0:rect x="213.3333" y="413.3333" width="711.1111" height="46.2222" rx="7.1111" fill="url(#grad-surface)" stroke="#bdbdbd" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="266.6667" y="441.7778" font-size="16" fill="#333">4. Execute roles (in order)</ns0:text>
  <ns0:line x1="568.8889" y1="460.4444" x2="568.8889" y2="478.2222" stroke="#555" stroke-width="2.2222" marker-end="url(#arrow)" />
  <ns0:rect x="213.3333" y="480" width="711.1111" height="46.2222" rx="7.1111" fill="url(#grad-surface)" stroke="#bdbdbd" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="266.6667" y="508.4444" font-size="16" fill="#333">5. Execute tasks (in declaration order)</ns0:text>
  <ns0:line x1="568.8889" y1="527.1111" x2="568.8889" y2="544.8889" stroke="#555" stroke-width="2.2222" marker-end="url(#arrow)" />
  <ns0:rect x="213.3333" y="546.6667" width="711.1111" height="46.2222" rx="7.1111" fill="#e8f5e9" stroke="#43a047" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="266.6667" y="575.1111" font-size="16" font-weight="bold" fill="#1b5e20">Run notified handlers, then display play recap</ns0:text>
</ns0:svg>
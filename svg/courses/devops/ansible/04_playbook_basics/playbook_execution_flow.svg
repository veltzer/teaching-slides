<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="1200" height="46.257674" rx="7.975422" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="130" y="68.466278" font-size="23.102936" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">ansible-playbook site.yml</text>
  <line x1="640" y1="87.147183" x2="640" y2="104.93869" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="106.717818" width="1200" height="46.257674" rx="7.975422" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="130" y="135.183986" font-size="20.792589" fill="var(--text)" font-family="Arial, sans-serif">Parse YAML file and validate syntax</text>
  <line x1="640" y1="153.865002" x2="640" y2="171.656508" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="173.435637" width="1200" height="46.257674" rx="7.975422" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="130" y="201.901804" font-size="20.792589" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">For each play:</text>
  <line x1="640" y1="220.58282" x2="640" y2="238.374326" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="240.153345" width="1200" height="46.257674" rx="7.975422" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="130" y="268.619623" font-size="20.792589" fill="var(--text)" font-family="Arial, sans-serif">1. Select hosts from inventory</text>
  <line x1="640" y1="287.300528" x2="640" y2="305.092034" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="306.871163" width="1200" height="46.257674" rx="7.975422" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="130" y="335.33733" font-size="20.792589" fill="var(--text)" font-family="Arial, sans-serif">2. Gather facts (if enabled)</text>
  <line x1="640" y1="354.018346" x2="640" y2="371.809853" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="373.588981" width="1200" height="46.257674" rx="7.975422" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="130" y="402.055149" font-size="20.792589" fill="var(--text)" font-family="Arial, sans-serif">3. Execute pre_tasks</text>
  <line x1="640" y1="420.736164" x2="640" y2="438.527671" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="440.306689" width="1200" height="46.257674" rx="7.975422" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="130" y="468.772967" font-size="20.792589" fill="var(--text)" font-family="Arial, sans-serif">4. Execute roles (in order)</text>
  <line x1="640" y1="487.453872" x2="640" y2="505.245379" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="507.024508" width="1200" height="46.257674" rx="7.975422" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="130" y="535.490675" font-size="20.792589" fill="var(--text)" font-family="Arial, sans-serif">5. Execute tasks (in declaration order)</text>
  <line x1="640" y1="554.171691" x2="640" y2="571.963197" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="573.742326" width="1200" height="46.257674" rx="7.975422" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="130" y="602.208493" font-size="20.792589" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Run notified handlers, then display play recap</text>
</svg>
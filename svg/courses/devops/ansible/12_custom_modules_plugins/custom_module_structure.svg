<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- Header -->
  <rect x="0" y="0" width="1280" height="52" fill="url(#grad-primary)"/>
  <text x="640" y="34" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--bg)" text-anchor="middle">Custom Module Structure</text>

  <!-- LEFT: Python Module Structure -->
  <rect x="20" y="62" width="470" height="440" rx="8" fill="url(#grad-surface)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="20" y="62" width="470" height="30" rx="8" fill="url(#grad-primary)"/>
  <rect x="20" y="80" width="470" height="12" fill="url(#grad-primary)"/>
  <text x="255" y="82" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">Python Module Structure</text>

  <text x="35" y="112" font-family="monospace" font-size="11" fill="var(--text-faint)">#!/usr/bin/python</text>
  <text x="35" y="129" font-family="monospace" font-size="11" fill="var(--text-faint)"># -*- coding: utf-8 -*-</text>
  <text x="35" y="146" font-family="monospace" font-size="11" fill="var(--ok-dk)">from ansible.module_utils.basic import AnsibleModule</text>
  <line x1="35" y1="158" x2="475" y2="158" stroke="var(--border-softer)" stroke-width="1"/>

  <text x="35" y="176" font-family="monospace" font-size="11" fill="var(--primary-dk)">DOCUMENTATION = r'''</text>
  <text x="35" y="193" font-family="monospace" font-size="11" fill="var(--text-dark)">  module: my_module</text>
  <text x="35" y="210" font-family="monospace" font-size="11" fill="var(--text-dark)">  short_description: Does X</text>
  <text x="35" y="227" font-family="monospace" font-size="11" fill="var(--primary-dk)">'''</text>
  <line x1="35" y1="239" x2="475" y2="239" stroke="var(--border-softer)" stroke-width="1"/>

  <text x="35" y="257" font-family="monospace" font-size="11" fill="var(--warn-dk)">def main():</text>
  <text x="35" y="274" font-family="monospace" font-size="11" fill="var(--info-dk)">  module = AnsibleModule(</text>
  <text x="35" y="291" font-family="monospace" font-size="11" fill="var(--info-dk)">    argument_spec=dict(</text>
  <text x="35" y="308" font-family="monospace" font-size="11" fill="var(--text-dark)">      name=dict(type='str', required=True),</text>
  <text x="35" y="325" font-family="monospace" font-size="11" fill="var(--text-dark)">      state=dict(type='str',</text>
  <text x="35" y="342" font-family="monospace" font-size="11" fill="var(--text-dark)">             choices=['present','absent'],</text>
  <text x="35" y="359" font-family="monospace" font-size="11" fill="var(--text-dark)">             default='present'),</text>
  <text x="35" y="376" font-family="monospace" font-size="11" fill="var(--text-dark)">      port=dict(type='int', default=8080),</text>
  <text x="35" y="393" font-family="monospace" font-size="11" fill="var(--text-dark)">      secret=dict(type='str', no_log=True),</text>
  <text x="35" y="410" font-family="monospace" font-size="11" fill="var(--info-dk)">    ),</text>
  <text x="35" y="427" font-family="monospace" font-size="11" fill="var(--info-dk)">    supports_check_mode=True,</text>
  <text x="35" y="444" font-family="monospace" font-size="11" fill="var(--info-dk)">  )</text>
  <line x1="35" y1="456" x2="475" y2="456" stroke="var(--border-softer)" stroke-width="1"/>
  <text x="35" y="474" font-family="monospace" font-size="11" fill="var(--text-dark)">  name = module.params['name']</text>
  <text x="35" y="491" font-family="monospace" font-size="11" fill="var(--ok-dk)">  module.exit_json(changed=True,</text>
  <text x="35" y="508" font-family="monospace" font-size="11" fill="var(--ok-dk)">                  msg="Created",</text>
  <text x="35" y="525" font-family="monospace" font-size="11" fill="var(--ok-dk)">                  result={"name": name})</text>

  <!-- CENTER: AnsibleModule class features -->
  <rect x="510" y="62" width="330" height="280" rx="8" fill="url(#grad-surface)" stroke="var(--info)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="510" y="62" width="330" height="30" rx="8" fill="url(#grad-info)"/>
  <rect x="510" y="80" width="330" height="12" fill="url(#grad-info)"/>
  <text x="675" y="82" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">AnsibleModule Features</text>

  <text x="525" y="113" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--info-dk)">Exit methods:</text>
  <text x="525" y="131" font-family="monospace" font-size="11" fill="var(--text-dark)">module.exit_json(**result)</text>
  <text x="525" y="148" font-family="monospace" font-size="11" fill="var(--text-dark)">module.fail_json(msg="err")</text>
  <line x1="525" y1="160" x2="825" y2="160" stroke="var(--border-softer)" stroke-width="1"/>

  <text x="525" y="178" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--info-dk)">Helpers:</text>
  <text x="525" y="196" font-family="monospace" font-size="11" fill="var(--text-dark)">module.run_command(cmd)</text>
  <text x="525" y="213" font-family="monospace" font-size="11" fill="var(--text-dark)">module.get_bin_path('git')</text>
  <text x="525" y="230" font-family="monospace" font-size="11" fill="var(--text-dark)">module.atomic_move(src,dst)</text>
  <text x="525" y="247" font-family="monospace" font-size="11" fill="var(--text-dark)">module.set_mode_if_different()</text>
  <line x1="525" y1="259" x2="825" y2="259" stroke="var(--border-softer)" stroke-width="1"/>

  <text x="525" y="277" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--info-dk)">Check mode support:</text>
  <text x="525" y="295" font-family="monospace" font-size="11" fill="var(--text-dark)">if module.check_mode:</text>
  <text x="525" y="312" font-family="monospace" font-size="11" fill="var(--text-dark)">  module.exit_json(changed=True)</text>
  <text x="525" y="329" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">  # no real changes in check mode</text>

  <!-- CENTER: Return Values -->
  <rect x="510" y="355" width="330" height="148" rx="8" fill="url(#grad-surface)" stroke="var(--warn)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="510" y="355" width="330" height="30" rx="8" fill="url(#grad-warn)"/>
  <rect x="510" y="373" width="330" height="12" fill="url(#grad-warn)"/>
  <text x="675" y="375" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">Standard Return Values</text>
  <text x="525" y="406" font-family="monospace" font-size="11" fill="var(--text-dark)">changed: true/false</text>
  <text x="680" y="406" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">was anything changed?</text>
  <text x="525" y="423" font-family="monospace" font-size="11" fill="var(--text-dark)">failed: true/false</text>
  <text x="680" y="423" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">did the task fail?</text>
  <text x="525" y="440" font-family="monospace" font-size="11" fill="var(--text-dark)">msg: "human message"</text>
  <text x="525" y="457" font-family="monospace" font-size="11" fill="var(--text-dark)">diff: {before:, after:}</text>
  <text x="680" y="457" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">for --diff mode</text>
  <text x="525" y="474" font-family="monospace" font-size="11" fill="var(--text-dark)">result: {}</text>
  <text x="680" y="474" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">custom data</text>
  <text x="525" y="491" font-family="monospace" font-size="11" fill="var(--text-dark)">invocation: {}</text>
  <text x="680" y="491" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">auto-added by Ansible</text>

  <!-- RIGHT: Filter Plugins vs Callback Plugins -->
  <rect x="860" y="62" width="400" height="205" rx="8" fill="url(#grad-surface)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="860" y="62" width="400" height="30" rx="8" fill="url(#grad-ok)"/>
  <rect x="860" y="80" width="400" height="12" fill="url(#grad-ok)"/>
  <text x="1060" y="82" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">Filter Plugins</text>
  <text x="875" y="112" font-family="monospace" font-size="11" fill="var(--text-dark)"># filter_plugins/my_filters.py</text>
  <text x="875" y="129" font-family="monospace" font-size="11" fill="var(--text-dark)">class FilterModule(object):</text>
  <text x="875" y="146" font-family="monospace" font-size="11" fill="var(--text-dark)">  def filters(self):</text>
  <text x="875" y="163" font-family="monospace" font-size="11" fill="var(--text-dark)">    return {'my_filter': self.do_it}</text>
  <text x="875" y="180" font-family="monospace" font-size="11" fill="var(--text-dark)">  def do_it(self, value, arg='default'):</text>
  <text x="875" y="197" font-family="monospace" font-size="11" fill="var(--text-dark)">    return value.upper()</text>
  <text x="875" y="214" font-family="monospace" font-size="11" fill="var(--text-muted)"># usage: {{ my_var | my_filter }}</text>
  <text x="875" y="231" font-family="monospace" font-size="11" fill="var(--text-muted)"># usage: {{ my_var | my_filter('arg') }}</text>
  <text x="875" y="258" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">Place in filter_plugins/ next to playbook or in role</text>

  <!-- RIGHT: Callback Plugins -->
  <rect x="860" y="280" width="400" height="225" rx="8" fill="url(#grad-surface)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="860" y="280" width="400" height="30" rx="8" fill="url(#grad-primary)"/>
  <rect x="860" y="298" width="400" height="12" fill="url(#grad-primary)"/>
  <text x="1060" y="300" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">Callback Plugins</text>
  <text x="875" y="332" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--primary-dk)">Built-in callbacks:</text>
  <text x="875" y="350" font-family="monospace" font-size="11" fill="var(--text-dark)">yaml       # pretty YAML output</text>
  <text x="875" y="367" font-family="monospace" font-size="11" fill="var(--text-dark)">json       # JSON output for CI</text>
  <text x="875" y="384" font-family="monospace" font-size="11" fill="var(--text-dark)">junit      # JUnit XML for Jenkins</text>
  <text x="875" y="401" font-family="monospace" font-size="11" fill="var(--text-dark)">profile_tasks  # timing info</text>
  <line x1="875" y1="413" x2="1245" y2="413" stroke="var(--border-softer)" stroke-width="1"/>
  <text x="875" y="431" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--primary-dk)">Enable in ansible.cfg:</text>
  <text x="875" y="449" font-family="monospace" font-size="11" fill="var(--text-dark)">[defaults]</text>
  <text x="875" y="466" font-family="monospace" font-size="11" fill="var(--text-dark)">stdout_callback = yaml</text>
  <text x="875" y="483" font-family="monospace" font-size="11" fill="var(--text-dark)">callback_whitelist = profile_tasks</text>

  <!-- File locations box -->
  <rect x="20" y="518" width="470" height="75" rx="6" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1"/>
  <text x="35" y="538" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--ok-dk)">Module search path:</text>
  <text x="35" y="556" font-family="monospace" font-size="11" fill="var(--text-dark)">./library/       # next to playbook</text>
  <text x="250" y="556" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">role/library/    # in role</text>
  <text x="35" y="574" font-family="monospace" font-size="11" fill="var(--text-dark)">collections/ansible_collections/ns/name/plugins/modules/</text>
  <text x="35" y="588" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">Test with: python -m pytest tests/unit/ or ansible-test units</text>
</svg>

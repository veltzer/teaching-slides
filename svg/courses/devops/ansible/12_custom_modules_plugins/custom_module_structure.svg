<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- Header -->
  <rect x="0" y="0" width="1280" height="52" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="34" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--bg)" text-anchor="middle">Custom Module Structure</text>

  <!-- LEFT: Python Module Structure -->
  <rect x="20" y="62" width="470" height="440" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="20" y="62" width="470" height="30" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="20" y="80" width="470" height="12" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="255" y="82" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">Python Module Structure</text>

  <text x="35" y="112" font-family="monospace" font-size="11" fill="var(--text-faint)">#!/usr/bin/python</text>
  <text x="35" y="129" font-family="monospace" font-size="11" fill="var(--text-faint)"># -*- coding: utf-8 -*-</text>
  <text x="35" y="146" font-family="monospace" font-size="11" fill="var(--ok-accent)">from ansible.module_utils.basic import AnsibleModule</text>
  <line x1="35" y1="158" x2="475" y2="158" stroke="var(--border)" stroke-width="1"/>

  <text x="35" y="176" font-family="monospace" font-size="11" fill="var(--primary-accent)">DOCUMENTATION = r'''</text>
  <text x="35" y="193" font-family="monospace" font-size="11" fill="var(--text)">  module: my_module</text>
  <text x="35" y="210" font-family="monospace" font-size="11" fill="var(--text)">  short_description: Does X</text>
  <text x="35" y="227" font-family="monospace" font-size="11" fill="var(--primary-accent)">'''</text>
  <line x1="35" y1="239" x2="475" y2="239" stroke="var(--border)" stroke-width="1"/>

  <text x="35" y="257" font-family="monospace" font-size="11" fill="var(--warn-accent)">def main():</text>
  <text x="35" y="274" font-family="monospace" font-size="11" fill="var(--info-accent)">  module = AnsibleModule(</text>
  <text x="35" y="291" font-family="monospace" font-size="11" fill="var(--info-accent)">    argument_spec=dict(</text>
  <text x="35" y="308" font-family="monospace" font-size="11" fill="var(--text)">      name=dict(type='str', required=True),</text>
  <text x="35" y="325" font-family="monospace" font-size="11" fill="var(--text)">      state=dict(type='str',</text>
  <text x="35" y="342" font-family="monospace" font-size="11" fill="var(--text)">             choices=['present','absent'],</text>
  <text x="35" y="359" font-family="monospace" font-size="11" fill="var(--text)">             default='present'),</text>
  <text x="35" y="376" font-family="monospace" font-size="11" fill="var(--text)">      port=dict(type='int', default=8080),</text>
  <text x="35" y="393" font-family="monospace" font-size="11" fill="var(--text)">      secret=dict(type='str', no_log=True),</text>
  <text x="35" y="410" font-family="monospace" font-size="11" fill="var(--info-accent)">    ),</text>
  <text x="35" y="427" font-family="monospace" font-size="11" fill="var(--info-accent)">    supports_check_mode=True,</text>
  <text x="35" y="444" font-family="monospace" font-size="11" fill="var(--info-accent)">  )</text>
  <line x1="35" y1="456" x2="475" y2="456" stroke="var(--border)" stroke-width="1"/>
  <text x="35" y="474" font-family="monospace" font-size="11" fill="var(--text)">  name = module.params['name']</text>
  <text x="35" y="491" font-family="monospace" font-size="11" fill="var(--ok-accent)">  module.exit_json(changed=True,</text>
  <text x="35" y="508" font-family="monospace" font-size="11" fill="var(--ok-accent)">                  msg="Created",</text>
  <text x="35" y="525" font-family="monospace" font-size="11" fill="var(--ok-accent)">                  result={"name": name})</text>

  <!-- CENTER: AnsibleModule class features -->
  <rect x="510" y="62" width="330" height="280" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="510" y="62" width="330" height="30" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="510" y="80" width="330" height="12" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="675" y="82" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">AnsibleModule Features</text>

  <text x="525" y="113" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--info-accent)">Exit methods:</text>
  <text x="525" y="131" font-family="monospace" font-size="11" fill="var(--text)">module.exit_json(**result)</text>
  <text x="525" y="148" font-family="monospace" font-size="11" fill="var(--text)">module.fail_json(msg="err")</text>
  <line x1="525" y1="160" x2="825" y2="160" stroke="var(--border)" stroke-width="1"/>

  <text x="525" y="178" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--info-accent)">Helpers:</text>
  <text x="525" y="196" font-family="monospace" font-size="11" fill="var(--text)">module.run_command(cmd)</text>
  <text x="525" y="213" font-family="monospace" font-size="11" fill="var(--text)">module.get_bin_path('git')</text>
  <text x="525" y="230" font-family="monospace" font-size="11" fill="var(--text)">module.atomic_move(src,dst)</text>
  <text x="525" y="247" font-family="monospace" font-size="11" fill="var(--text)">module.set_mode_if_different()</text>
  <line x1="525" y1="259" x2="825" y2="259" stroke="var(--border)" stroke-width="1"/>

  <text x="525" y="277" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--info-accent)">Check mode support:</text>
  <text x="525" y="295" font-family="monospace" font-size="11" fill="var(--text)">if module.check_mode:</text>
  <text x="525" y="312" font-family="monospace" font-size="11" fill="var(--text)">  module.exit_json(changed=True)</text>
  <text x="525" y="329" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">  # no real changes in check mode</text>

  <!-- CENTER: Return Values -->
  <rect x="510" y="355" width="330" height="148" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="510" y="355" width="330" height="30" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="510" y="373" width="330" height="12" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="675" y="375" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">Standard Return Values</text>
  <text x="525" y="406" font-family="monospace" font-size="11" fill="var(--text)">changed: true/false</text>
  <text x="680" y="406" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">was anything changed?</text>
  <text x="525" y="423" font-family="monospace" font-size="11" fill="var(--text)">failed: true/false</text>
  <text x="680" y="423" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">did the task fail?</text>
  <text x="525" y="440" font-family="monospace" font-size="11" fill="var(--text)">msg: "human message"</text>
  <text x="525" y="457" font-family="monospace" font-size="11" fill="var(--text)">diff: {before:, after:}</text>
  <text x="680" y="457" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">for --diff mode</text>
  <text x="525" y="474" font-family="monospace" font-size="11" fill="var(--text)">result: {}</text>
  <text x="680" y="474" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">custom data</text>
  <text x="525" y="491" font-family="monospace" font-size="11" fill="var(--text)">invocation: {}</text>
  <text x="680" y="491" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">auto-added by Ansible</text>

  <!-- RIGHT: Filter Plugins vs Callback Plugins -->
  <rect x="860" y="62" width="400" height="205" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="860" y="62" width="400" height="30" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="860" y="80" width="400" height="12" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1060" y="82" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">Filter Plugins</text>
  <text x="875" y="112" font-family="monospace" font-size="11" fill="var(--text)"># filter_plugins/my_filters.py</text>
  <text x="875" y="129" font-family="monospace" font-size="11" fill="var(--text)">class FilterModule(object):</text>
  <text x="875" y="146" font-family="monospace" font-size="11" fill="var(--text)">  def filters(self):</text>
  <text x="875" y="163" font-family="monospace" font-size="11" fill="var(--text)">    return {'my_filter': self.do_it}</text>
  <text x="875" y="180" font-family="monospace" font-size="11" fill="var(--text)">  def do_it(self, value, arg='default'):</text>
  <text x="875" y="197" font-family="monospace" font-size="11" fill="var(--text)">    return value.upper()</text>
  <text x="875" y="214" font-family="monospace" font-size="11" fill="var(--text-muted)"># usage: {{ my_var | my_filter }}</text>
  <text x="875" y="231" font-family="monospace" font-size="11" fill="var(--text-muted)"># usage: {{ my_var | my_filter('arg') }}</text>
  <text x="875" y="258" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">Place in filter_plugins/ next to playbook or in role</text>

  <!-- RIGHT: Callback Plugins -->
  <rect x="860" y="280" width="400" height="225" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="860" y="280" width="400" height="30" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="860" y="298" width="400" height="12" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1060" y="300" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">Callback Plugins</text>
  <text x="875" y="332" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--primary-accent)">Built-in callbacks:</text>
  <text x="875" y="350" font-family="monospace" font-size="11" fill="var(--text)">yaml       # pretty YAML output</text>
  <text x="875" y="367" font-family="monospace" font-size="11" fill="var(--text)">json       # JSON output for CI</text>
  <text x="875" y="384" font-family="monospace" font-size="11" fill="var(--text)">junit      # JUnit XML for Jenkins</text>
  <text x="875" y="401" font-family="monospace" font-size="11" fill="var(--text)">profile_tasks  # timing info</text>
  <line x1="875" y1="413" x2="1245" y2="413" stroke="var(--border)" stroke-width="1"/>
  <text x="875" y="431" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--primary-accent)">Enable in ansible.cfg:</text>
  <text x="875" y="449" font-family="monospace" font-size="11" fill="var(--text)">[defaults]</text>
  <text x="875" y="466" font-family="monospace" font-size="11" fill="var(--text)">stdout_callback = yaml</text>
  <text x="875" y="483" font-family="monospace" font-size="11" fill="var(--text)">callback_whitelist = profile_tasks</text>

  <!-- File locations box -->
  <rect x="20" y="518" width="470" height="75" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="35" y="538" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--ok-accent)">Module search path:</text>
  <text x="35" y="556" font-family="monospace" font-size="11" fill="var(--text)">./library/       # next to playbook</text>
  <text x="250" y="556" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">role/library/    # in role</text>
  <text x="35" y="574" font-family="monospace" font-size="11" fill="var(--text)">collections/ansible_collections/ns/name/plugins/modules/</text>
  <text x="35" y="588" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">Test with: python -m pytest tests/unit/ or ansible-test units</text>
</svg>

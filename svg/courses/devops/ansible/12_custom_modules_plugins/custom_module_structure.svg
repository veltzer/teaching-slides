<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Module skeleton -->
  <rect x="40" y="40" width="455.172413793103" height="580" rx="10.540925533895" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="267.586206896552" y="77.592592592593" font-family="Arial, sans-serif" font-size="18.97366596101" font-weight="bold" fill="var(--bg)" text-anchor="middle">Module Skeleton</text>
  <text x="60.689655172414" y="120.555555555556" font-size="13.703203194063" fill="var(--bg)" font-family="Courier New, monospace">from ansible.module_utils.basic</text>
  <text x="60.689655172414" y="142.037037037037" font-size="13.703203194063" fill="var(--bg)" font-family="Courier New, monospace">  import AnsibleModule</text>
  <text x="60.689655172414" y="185" font-size="13.703203194063" fill="var(--bg)" font-family="Courier New, monospace">DOCUMENTATION = r'''...'''</text>
  <text x="60.689655172414" y="227.962962962963" font-size="13.703203194063" fill="var(--bg)" font-family="Courier New, monospace">def main():</text>
  <text x="60.689655172414" y="254.814814814815" font-size="13.703203194063" fill="var(--bg)" font-family="Courier New, monospace">  m = AnsibleModule(</text>
  <text x="60.689655172414" y="281.666666666667" font-size="13.703203194063" fill="var(--bg)" font-family="Courier New, monospace">    argument_spec=dict(</text>
  <text x="60.689655172414" y="308.518518518519" font-size="13.703203194063" fill="var(--bg)" font-family="Courier New, monospace">      name=dict(required=True),</text>
  <text x="60.689655172414" y="335.37037037037" font-size="13.703203194063" fill="var(--bg)" font-family="Courier New, monospace">      state=dict(choices=[...]),</text>
  <text x="60.689655172414" y="362.222222222222" font-size="13.703203194063" fill="var(--bg)" font-family="Courier New, monospace">      secret=dict(no_log=True)),</text>
  <text x="60.689655172414" y="389.074074074074" font-size="13.703203194063" fill="var(--bg)" font-family="Courier New, monospace">    supports_check_mode=True)</text>
  <text x="60.689655172414" y="432.037037037037" font-size="13.703203194063" fill="var(--bg)" font-family="Courier New, monospace">  m.exit_json(changed=True,</text>
  <text x="60.689655172414" y="458.888888888889" font-size="13.703203194063" fill="var(--bg)" font-family="Courier New, monospace">              msg="ok")</text>
  <text x="60.689655172414" y="512.592592592593" font-size="13.703203194063" fill="var(--bg)" font-family="Courier New, monospace">  # or m.fail_json(msg=...)</text>
  <text x="267.586206896552" y="571.666666666667" font-family="Arial, sans-serif" font-size="14.757295747452" font-style="italic" fill="var(--bg)" text-anchor="middle">library/ beside playbook</text>
  <text x="267.586206896552" y="598.518518518519" font-family="Arial, sans-serif" font-size="13.703203194063" fill="var(--bg)" text-anchor="middle">or collections/plugins/modules/</text>

  <!-- AnsibleModule features -->
  <rect x="515.862068965517" y="40" width="331.034482758621" height="279.259259259259" rx="10.540925533895" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="681.379310344828" y="77.592592592593" font-family="Arial, sans-serif" font-size="18.97366596101" font-weight="bold" fill="var(--bg)" text-anchor="middle">Helpers</text>
  <text x="536.551724137931" y="115.185185185185" font-size="13.703203194063" fill="var(--bg)" font-family="Courier New, monospace">exit_json / fail_json</text>
  <text x="536.551724137931" y="147.407407407407" font-size="13.703203194063" fill="var(--bg)" font-family="Courier New, monospace">run_command(cmd)</text>
  <text x="536.551724137931" y="179.62962962963" font-size="13.703203194063" fill="var(--bg)" font-family="Courier New, monospace">get_bin_path('git')</text>
  <text x="536.551724137931" y="211.851851851852" font-size="13.703203194063" fill="var(--bg)" font-family="Courier New, monospace">atomic_move(src,dst)</text>
  <text x="536.551724137931" y="244.074074074074" font-size="13.703203194063" fill="var(--bg)" font-family="Courier New, monospace">check_mode guard</text>
  <text x="536.551724137931" y="287.037037037037" font-size="13.703203194063" fill="var(--bg)" font-family="Courier New, monospace">set_mode_if_different</text>

  <!-- Return values -->
  <rect x="515.862068965517" y="340.740740740741" width="331.034482758621" height="279.259259259259" rx="10.540925533895" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="681.379310344828" y="378.333333333333" font-family="Arial, sans-serif" font-size="18.97366596101" font-weight="bold" fill="var(--bg)" text-anchor="middle">Return Keys</text>
  <text x="536.551724137931" y="415.925925925926" font-size="13.703203194063" fill="var(--bg)" font-family="Courier New, monospace">changed</text>
  <text x="536.551724137931" y="448.148148148148" font-size="13.703203194063" fill="var(--bg)" font-family="Courier New, monospace">failed</text>
  <text x="536.551724137931" y="480.37037037037" font-size="13.703203194063" fill="var(--bg)" font-family="Courier New, monospace">msg</text>
  <text x="536.551724137931" y="512.592592592593" font-size="13.703203194063" fill="var(--bg)" font-family="Courier New, monospace">diff</text>
  <text x="536.551724137931" y="544.814814814815" font-size="13.703203194063" fill="var(--bg)" font-family="Courier New, monospace">result</text>
  <text x="536.551724137931" y="577.037037037037" font-size="13.703203194063" fill="var(--bg)" font-family="Courier New, monospace">invocation (auto)</text>

  <!-- Filter / callback plugins -->
  <rect x="867.586206896552" y="40" width="372.413793103448" height="279.259259259259" rx="10.540925533895" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.793103448276" y="77.592592592593" font-family="Arial, sans-serif" font-size="18.97366596101" font-weight="bold" fill="var(--bg)" text-anchor="middle">Filter Plugin</text>
  <text x="888.275862068966" y="120.555555555556" font-size="13.703203194063" fill="var(--bg)" font-family="Courier New, monospace">class FilterModule:</text>
  <text x="888.275862068966" y="147.407407407407" font-size="13.703203194063" fill="var(--bg)" font-family="Courier New, monospace">  def filters(self):</text>
  <text x="888.275862068966" y="174.259259259259" font-size="13.703203194063" fill="var(--bg)" font-family="Courier New, monospace">    return {'upper': fn}</text>
  <text x="888.275862068966" y="217.222222222222" font-size="13.703203194063" fill="var(--bg)" font-family="Courier New, monospace">{{ v | upper }}</text>
  <text x="888.275862068966" y="260.185185185185" font-family="Arial, sans-serif" font-size="13.703203194063" font-style="italic" fill="var(--bg)">filter_plugins/ dir</text>

  <rect x="867.586206896552" y="340.740740740741" width="372.413793103448" height="279.259259259259" rx="10.540925533895" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.793103448276" y="378.333333333333" font-family="Arial, sans-serif" font-size="18.97366596101" font-weight="bold" fill="var(--bg)" text-anchor="middle">Callback Plugin</text>
  <text x="888.275862068966" y="415.925925925926" font-size="13.703203194063" fill="var(--bg)" font-family="Courier New, monospace">yaml</text>
  <text x="888.275862068966" y="442.777777777778" font-size="13.703203194063" fill="var(--bg)" font-family="Courier New, monospace">json</text>
  <text x="888.275862068966" y="469.62962962963" font-size="13.703203194063" fill="var(--bg)" font-family="Courier New, monospace">junit</text>
  <text x="888.275862068966" y="496.481481481482" font-size="13.703203194063" fill="var(--bg)" font-family="Courier New, monospace">profile_tasks</text>
  <text x="888.275862068966" y="539.444444444444" font-size="13.703203194063" fill="var(--bg)" font-family="Courier New, monospace">[defaults]</text>
  <text x="888.275862068966" y="566.296296296296" font-size="13.703203194063" fill="var(--bg)" font-family="Courier New, monospace">stdout_callback = yaml</text>
</svg>

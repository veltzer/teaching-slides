<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Header -->
  <rect x="40" y="40" width="1200" height="47.125" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="70.8125" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--bg)" text-anchor="middle">Custom Module Structure</text>

  <!-- LEFT: Python Module Structure -->
  <rect x="58.75" y="96.1875" width="440.625" height="398.75" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="58.75" y="96.1875" width="440.625" height="27.1875" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="58.75" y="112.5" width="440.625" height="10.875" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="279.0625" y="114.3125" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)" text-anchor="middle">Python Module Structure</text>

  <text x="72.8125" y="141.5" font-family="monospace" font-size="10.1392" fill="var(--text-faint)">#!/usr/bin/python</text>
  <text x="72.8125" y="156.9062" font-family="monospace" font-size="10.1392" fill="var(--text-faint)"># -*- coding: utf-8 -*-</text>
  <text x="72.8125" y="172.3125" font-family="monospace" font-size="10.1392" fill="var(--ok-accent)">from ansible.module_utils.basic import AnsibleModule</text>
  <line x1="72.8125" y1="183.1875" x2="485.3125" y2="183.1875" stroke="var(--border)" stroke-width="1"/>

  <text x="72.8125" y="199.5" font-family="monospace" font-size="10.1392" fill="var(--primary-accent)">DOCUMENTATION = r'''</text>
  <text x="72.8125" y="214.9062" font-family="monospace" font-size="10.1392" fill="var(--text)">  module: my_module</text>
  <text x="72.8125" y="230.3125" font-family="monospace" font-size="10.1392" fill="var(--text)">  short_description: Does X</text>
  <text x="72.8125" y="245.7188" font-family="monospace" font-size="10.1392" fill="var(--primary-accent)">'''</text>
  <line x1="72.8125" y1="256.5938" x2="485.3125" y2="256.5938" stroke="var(--border)" stroke-width="1"/>

  <text x="72.8125" y="272.9062" font-family="monospace" font-size="10.1392" fill="var(--warn-accent)">def main():</text>
  <text x="72.8125" y="288.3125" font-family="monospace" font-size="10.1392" fill="var(--info-accent)">  module = AnsibleModule(</text>
  <text x="72.8125" y="303.7188" font-family="monospace" font-size="10.1392" fill="var(--info-accent)">    argument_spec=dict(</text>
  <text x="72.8125" y="319.125" font-family="monospace" font-size="10.1392" fill="var(--text)">      name=dict(type='str', required=True),</text>
  <text x="72.8125" y="334.5312" font-family="monospace" font-size="10.1392" fill="var(--text)">      state=dict(type='str',</text>
  <text x="72.8125" y="349.9375" font-family="monospace" font-size="10.1392" fill="var(--text)">             choices=['present','absent'],</text>
  <text x="72.8125" y="365.3438" font-family="monospace" font-size="10.1392" fill="var(--text)">             default='present'),</text>
  <text x="72.8125" y="380.75" font-family="monospace" font-size="10.1392" fill="var(--text)">      port=dict(type='int', default=8080),</text>
  <text x="72.8125" y="396.1562" font-family="monospace" font-size="10.1392" fill="var(--text)">      secret=dict(type='str', no_log=True),</text>
  <text x="72.8125" y="411.5625" font-family="monospace" font-size="10.1392" fill="var(--info-accent)">    ),</text>
  <text x="72.8125" y="426.9688" font-family="monospace" font-size="10.1392" fill="var(--info-accent)">    supports_check_mode=True,</text>
  <text x="72.8125" y="442.375" font-family="monospace" font-size="10.1392" fill="var(--info-accent)">  )</text>
  <line x1="72.8125" y1="453.25" x2="485.3125" y2="453.25" stroke="var(--border)" stroke-width="1"/>
  <text x="72.8125" y="469.5625" font-family="monospace" font-size="10.1392" fill="var(--text)">  name = module.params['name']</text>
  <text x="72.8125" y="484.9688" font-family="monospace" font-size="10.1392" fill="var(--ok-accent)">  module.exit_json(changed=True,</text>
  <text x="72.8125" y="500.375" font-family="monospace" font-size="10.1392" fill="var(--ok-accent)">                  msg="Created",</text>
  <text x="72.8125" y="515.7812" font-family="monospace" font-size="10.1392" fill="var(--ok-accent)">                  result={"name": name})</text>

  <!-- CENTER: AnsibleModule class features -->
  <rect x="518.125" y="96.1875" width="309.375" height="253.75" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="518.125" y="96.1875" width="309.375" height="27.1875" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="518.125" y="112.5" width="309.375" height="10.875" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="672.8125" y="114.3125" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)" text-anchor="middle">AnsibleModule Features</text>

  <text x="532.1875" y="142.4062" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--info-accent)">Exit methods:</text>
  <text x="532.1875" y="158.7188" font-family="monospace" font-size="10.1392" fill="var(--text)">module.exit_json(**result)</text>
  <text x="532.1875" y="174.125" font-family="monospace" font-size="10.1392" fill="var(--text)">module.fail_json(msg="err")</text>
  <line x1="532.1875" y1="185" x2="813.4375" y2="185" stroke="var(--border)" stroke-width="1"/>

  <text x="532.1875" y="201.3125" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--info-accent)">Helpers:</text>
  <text x="532.1875" y="217.625" font-family="monospace" font-size="10.1392" fill="var(--text)">module.run_command(cmd)</text>
  <text x="532.1875" y="233.0312" font-family="monospace" font-size="10.1392" fill="var(--text)">module.get_bin_path('git')</text>
  <text x="532.1875" y="248.4375" font-family="monospace" font-size="10.1392" fill="var(--text)">module.atomic_move(src,dst)</text>
  <text x="532.1875" y="263.8438" font-family="monospace" font-size="10.1392" fill="var(--text)">module.set_mode_if_different()</text>
  <line x1="532.1875" y1="274.7188" x2="813.4375" y2="274.7188" stroke="var(--border)" stroke-width="1"/>

  <text x="532.1875" y="291.0312" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--info-accent)">Check mode support:</text>
  <text x="532.1875" y="307.3438" font-family="monospace" font-size="10.1392" fill="var(--text)">if module.check_mode:</text>
  <text x="532.1875" y="322.75" font-family="monospace" font-size="10.1392" fill="var(--text)">  module.exit_json(changed=True)</text>
  <text x="532.1875" y="338.1562" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">  # no real changes in check mode</text>

  <!-- CENTER: Return Values -->
  <rect x="518.125" y="361.7188" width="309.375" height="134.125" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="518.125" y="361.7188" width="309.375" height="27.1875" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="518.125" y="378.0312" width="309.375" height="10.875" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="672.8125" y="379.8438" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)" text-anchor="middle">Standard Return Values</text>
  <text x="532.1875" y="407.9375" font-family="monospace" font-size="10.1392" fill="var(--text)">changed: true/false</text>
  <text x="677.5" y="407.9375" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">was anything changed?</text>
  <text x="532.1875" y="423.3438" font-family="monospace" font-size="10.1392" fill="var(--text)">failed: true/false</text>
  <text x="677.5" y="423.3438" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">did the task fail?</text>
  <text x="532.1875" y="438.75" font-family="monospace" font-size="10.1392" fill="var(--text)">msg: "human message"</text>
  <text x="532.1875" y="454.1562" font-family="monospace" font-size="10.1392" fill="var(--text)">diff: {before:, after:}</text>
  <text x="677.5" y="454.1562" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">for --diff mode</text>
  <text x="532.1875" y="469.5625" font-family="monospace" font-size="10.1392" fill="var(--text)">result: {}</text>
  <text x="677.5" y="469.5625" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">custom data</text>
  <text x="532.1875" y="484.9688" font-family="monospace" font-size="10.1392" fill="var(--text)">invocation: {}</text>
  <text x="677.5" y="484.9688" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">auto-added by Ansible</text>

  <!-- RIGHT: Filter Plugins vs Callback Plugins -->
  <rect x="846.25" y="96.1875" width="375" height="185.7812" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="846.25" y="96.1875" width="375" height="27.1875" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="846.25" y="112.5" width="375" height="10.875" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1033.75" y="114.3125" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)" text-anchor="middle">Filter Plugins</text>
  <text x="860.3125" y="141.5" font-family="monospace" font-size="10.1392" fill="var(--text)"># filter_plugins/my_filters.py</text>
  <text x="860.3125" y="156.9062" font-family="monospace" font-size="10.1392" fill="var(--text)">class FilterModule(object):</text>
  <text x="860.3125" y="172.3125" font-family="monospace" font-size="10.1392" fill="var(--text)">  def filters(self):</text>
  <text x="860.3125" y="187.7188" font-family="monospace" font-size="10.1392" fill="var(--text)">    return {'my_filter': self.do_it}</text>
  <text x="860.3125" y="203.125" font-family="monospace" font-size="10.1392" fill="var(--text)">  def do_it(self, value, arg='default'):</text>
  <text x="860.3125" y="218.5312" font-family="monospace" font-size="10.1392" fill="var(--text)">    return value.upper()</text>
  <text x="860.3125" y="233.9375" font-family="monospace" font-size="10.1392" fill="var(--text-muted)"># usage: {{ my_var | my_filter }}</text>
  <text x="860.3125" y="249.3438" font-family="monospace" font-size="10.1392" fill="var(--text-muted)"># usage: {{ my_var | my_filter('arg') }}</text>
  <text x="860.3125" y="273.8125" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)">Place in filter_plugins/ next to playbook or in role</text>

  <!-- RIGHT: Callback Plugins -->
  <rect x="846.25" y="293.75" width="375" height="203.9062" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="846.25" y="293.75" width="375" height="27.1875" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="846.25" y="310.0625" width="375" height="10.875" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1033.75" y="311.875" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)" text-anchor="middle">Callback Plugins</text>
  <text x="860.3125" y="340.875" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--primary-accent)">Built-in callbacks:</text>
  <text x="860.3125" y="357.1875" font-family="monospace" font-size="10.1392" fill="var(--text)">yaml       # pretty YAML output</text>
  <text x="860.3125" y="372.5938" font-family="monospace" font-size="10.1392" fill="var(--text)">json       # JSON output for CI</text>
  <text x="860.3125" y="388" font-family="monospace" font-size="10.1392" fill="var(--text)">junit      # JUnit XML for Jenkins</text>
  <text x="860.3125" y="403.4062" font-family="monospace" font-size="10.1392" fill="var(--text)">profile_tasks  # timing info</text>
  <line x1="860.3125" y1="414.2812" x2="1207.1875" y2="414.2812" stroke="var(--border)" stroke-width="1"/>
  <text x="860.3125" y="430.5938" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--primary-accent)">Enable in ansible.cfg:</text>
  <text x="860.3125" y="446.9062" font-family="monospace" font-size="10.1392" fill="var(--text)">[defaults]</text>
  <text x="860.3125" y="462.3125" font-family="monospace" font-size="10.1392" fill="var(--text)">stdout_callback = yaml</text>
  <text x="860.3125" y="477.7188" font-family="monospace" font-size="10.1392" fill="var(--text)">callback_whitelist = profile_tasks</text>

  <!-- File locations box -->
  <rect x="58.75" y="509.4375" width="440.625" height="67.9688" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="72.8125" y="527.5625" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--ok-accent)">Module search path:</text>
  <text x="72.8125" y="543.875" font-family="monospace" font-size="10.1392" fill="var(--text)">./library/       # next to playbook</text>
  <text x="274.375" y="543.875" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">role/library/    # in role</text>
  <text x="72.8125" y="560.1875" font-family="monospace" font-size="10.1392" fill="var(--text)">collections/ansible_collections/ns/name/plugins/modules/</text>
  <text x="72.8125" y="572.875" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)">Test with: python -m pytest tests/unit/ or ansible-test units</text>
</svg>

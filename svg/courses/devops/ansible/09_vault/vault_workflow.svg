<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <linearGradient id="grad-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
  </defs>
  <!-- Header -->
  <rect x="40" y="40" width="1200" height="60.32" fill="var(--primary-fill)" rx="6.788225" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="79.44" font-family="Arial, sans-serif" font-size="22.942278" font-weight="bold" fill="var(--bg)" text-anchor="middle">Ansible Vault Workflow</text>

  <!-- AES-256 badge -->
  <rect x="499.375" y="111.92" width="281.25" height="58" rx="6.788225" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="640" y="135.12" font-family="Arial, sans-serif" font-size="16.685344" font-weight="bold" fill="var(--bg)" text-anchor="middle">AES-256 Encryption</text>
  <text x="640" y="158.32" font-family="Arial, sans-serif" font-size="13.556877" fill="var(--danger-accent)" text-anchor="middle">Symmetric key, password-based</text>

  <!-- Vault Commands box -->
  <rect x="58.75" y="188.48" width="356.25" height="324.8" rx="6.788225" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="58.75" y="188.48" width="356.25" height="34.8" rx="6.788225" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="58.75" y="209.36" width="356.25" height="13.92" fill="var(--primary-fill)" rx="6.788225" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="236.875" y="211.68" font-family="Arial, sans-serif" font-size="14.599662" font-weight="bold" fill="var(--bg)" text-anchor="middle">Vault Commands</text>

  <!-- Command rows -->
  <rect x="72.8125" y="234.88" width="328.125" height="30.16" rx="6.788225" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="86.875" y="255.76" font-family="monospace" font-size="12.51398" font-weight="bold" fill="var(--primary-accent)">ansible-vault create vault.yml</text>
  <text x="72.8125" y="276.64" font-family="Arial, sans-serif" font-size="11.471195" fill="var(--text-muted)">  Create new encrypted file (opens editor)</text>

  <rect x="72.8125" y="288.24" width="328.125" height="30.16" rx="6.788225" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="86.875" y="309.12" font-family="monospace" font-size="12.51398" font-weight="bold" fill="var(--ok-accent)">ansible-vault edit vault.yml</text>
  <text x="72.8125" y="330" font-family="Arial, sans-serif" font-size="11.471195" fill="var(--text-muted)">  Edit existing encrypted file</text>

  <rect x="72.8125" y="341.6" width="328.125" height="30.16" rx="6.788225" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="86.875" y="362.48" font-family="monospace" font-size="12.51398" font-weight="bold" fill="var(--warn-accent)">ansible-vault encrypt vars.yml</text>
  <text x="72.8125" y="383.36" font-family="Arial, sans-serif" font-size="11.471195" fill="var(--text-muted)">  Encrypt existing plaintext file</text>

  <rect x="72.8125" y="394.96" width="328.125" height="30.16" rx="6.788225" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="86.875" y="415.84" font-family="monospace" font-size="12.51398" font-weight="bold" fill="var(--info-accent)">ansible-vault decrypt vars.yml</text>
  <text x="72.8125" y="436.72" font-family="Arial, sans-serif" font-size="11.471195" fill="var(--text-muted)">  Decrypt to plaintext (use with care!)</text>

  <rect x="72.8125" y="448.32" width="328.125" height="30.16" rx="6.788225" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="86.875" y="469.2" font-family="monospace" font-size="12.51398" font-weight="bold" fill="var(--ok-accent)">ansible-vault view vault.yml</text>
  <text x="72.8125" y="490.08" font-family="Arial, sans-serif" font-size="11.471195" fill="var(--text-muted)">  View decrypted contents</text>

  <text x="72.8125" y="510.96" font-family="monospace" font-size="11.471195" fill="var(--text)">ansible-vault rekey vault.yml</text>
  <text x="236.875" y="510.96" font-family="Arial, sans-serif" font-size="11.471195" fill="var(--text-muted)">Change password</text>

  <!-- Vault-ID box -->
  <rect x="433.75" y="188.48" width="365.625" height="324.8" rx="6.788225" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="433.75" y="188.48" width="365.625" height="34.8" rx="6.788225" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="433.75" y="209.36" width="365.625" height="13.92" fill="var(--info-fill)" rx="6.788225" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="616.5625" y="211.68" font-family="Arial, sans-serif" font-size="14.599662" font-weight="bold" fill="var(--bg)" text-anchor="middle">Vault-ID (Multiple Vaults)</text>
  <text x="447.8125" y="246.48" font-family="Arial, sans-serif" font-size="12.51398" font-weight="bold" fill="var(--info-accent)">Create with labeled vault-id:</text>
  <text x="447.8125" y="267.36" font-family="monospace" font-size="11.471195" fill="var(--text)">ansible-vault create \</text>
  <text x="447.8125" y="287.079936" font-family="monospace" font-size="11.471195" fill="var(--text)">  --vault-id prod@prompt vault_prod.yml</text>
  <text x="447.8125" y="306.8" font-family="monospace" font-size="11.471195" fill="var(--text)">ansible-vault create \</text>
  <text x="447.8125" y="326.520064" font-family="monospace" font-size="11.471195" fill="var(--text)">  --vault-id dev@~/.dev_pass vault_dev.yml</text>
  <line x1="447.8125" y1="341.6" x2="785.3125" y2="341.6" stroke="var(--border)" stroke-width="1"/>
  <text x="447.8125" y="364.8" font-family="Arial, sans-serif" font-size="12.51398" font-weight="bold" fill="var(--info-accent)">Run playbook with multiple vaults:</text>
  <text x="447.8125" y="385.68" font-family="monospace" font-size="11.471195" fill="var(--text)">ansible-playbook site.yml \</text>
  <text x="447.8125" y="405.400064" font-family="monospace" font-size="11.471195" fill="var(--text)">  --vault-id prod@prompt \</text>
  <text x="447.8125" y="425.12" font-family="monospace" font-size="11.471195" fill="var(--text)">  --vault-id dev@~/.dev_pass</text>
  <line x1="447.8125" y1="440.199936" x2="785.3125" y2="440.199936" stroke="var(--border)" stroke-width="1"/>
  <text x="447.8125" y="463.399936" font-family="Arial, sans-serif" font-size="12.51398" font-weight="bold" fill="var(--info-accent)">Password sources:</text>
  <text x="447.8125" y="484.280064" font-family="Arial, sans-serif" font-size="11.471195" fill="var(--text-muted)">@prompt  - interactive input</text>
  <text x="447.8125" y="502.840064" font-family="Arial, sans-serif" font-size="11.471195" fill="var(--text-muted)">@/path   - password file</text>
  <text x="447.8125" y="510.96" font-family="Arial, sans-serif" font-size="11.471195" fill="var(--text-muted)">@script  - password script</text>

  <!-- Integration with Playbooks box -->
  <rect x="818.125" y="111.92" width="403.125" height="401.36" rx="6.788225" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="818.125" y="111.92" width="403.125" height="34.8" rx="6.788225" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="818.125" y="132.8" width="403.125" height="13.92" fill="var(--ok-fill)" rx="6.788225" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1019.6875" y="135.12" font-family="Arial, sans-serif" font-size="14.599662" font-weight="bold" fill="var(--bg)" text-anchor="middle">Integration with Playbooks</text>

  <text x="832.1875" y="169.92" font-family="Arial, sans-serif" font-size="12.51398" font-weight="bold" fill="var(--ok-accent)">Encrypted vars file:</text>
  <text x="832.1875" y="190.8" font-family="monospace" font-size="11.471195" fill="var(--text)">- hosts: all</text>
  <text x="832.1875" y="210.520064" font-family="monospace" font-size="11.471195" fill="var(--text)">  vars_files:</text>
  <text x="832.1875" y="230.24" font-family="monospace" font-size="11.471195" fill="var(--ok-accent)">    - group_vars/prod/vault.yml</text>
  <text x="832.1875" y="249.959936" font-family="monospace" font-size="11.471195" fill="var(--text)">  tasks:</text>
  <text x="832.1875" y="269.68" font-family="monospace" font-size="11.471195" fill="var(--text)">    - name: Use secret</text>
  <text x="832.1875" y="289.400064" font-family="monospace" font-size="11.471195" fill="var(--text)">      template: src=db.conf.j2 dest=..</text>
  <text x="832.1875" y="309.12" font-family="monospace" font-size="11.471195" fill="var(--text-muted)">      # uses {{ db_password }} from vault</text>
  <line x1="832.1875" y1="323.04" x2="1207.1875" y2="323.04" stroke="var(--border)" stroke-width="1"/>
  <text x="832.1875" y="346.24" font-family="Arial, sans-serif" font-size="12.51398" font-weight="bold" fill="var(--ok-accent)">Inline encrypted variable:</text>
  <text x="832.1875" y="367.12" font-family="monospace" font-size="11.471195" fill="var(--text)">db_password: !vault |</text>
  <text x="832.1875" y="386.840064" font-family="monospace" font-size="11.471195" fill="var(--text)">  $ANSIBLE_VAULT;1.1;AES256</text>
  <text x="832.1875" y="406.56" font-family="monospace" font-size="11.471195" fill="var(--text)">  35613464...</text>
  <line x1="832.1875" y1="420.48" x2="1207.1875" y2="420.48" stroke="var(--border)" stroke-width="1"/>
  <text x="832.1875" y="443.68" font-family="Arial, sans-serif" font-size="12.51398" font-weight="bold" fill="var(--ok-accent)">Run with password prompt:</text>
  <text x="832.1875" y="464.56" font-family="monospace" font-size="11.471195" fill="var(--text)">ansible-playbook site.yml --ask-vault-pass</text>
  <text x="832.1875" y="485.44" font-family="monospace" font-size="11.471195" fill="var(--text)">ansible-playbook site.yml \</text>
  <text x="832.1875" y="505.159936" font-family="monospace" font-size="11.471195" fill="var(--text)">  --vault-password-file ~/.vault_pass</text>

  <!-- Bottom: best practices -->
  <rect x="58.75" y="527.2" width="1162.5" height="92.8" rx="6.788225" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="72.8125" y="553.880064" font-family="Arial, sans-serif" font-size="13.556877" font-weight="bold" fill="var(--ok-accent)">Vault Best Practices</text>
  <text x="72.8125" y="575.92" font-family="Arial, sans-serif" font-size="12.51398" fill="var(--text)">1. Commit encrypted vault files to Git - never commit plaintext secrets</text>
  <text x="72.8125" y="596.8" font-family="Arial, sans-serif" font-size="12.51398" fill="var(--text)">2. Use vault-id labels for multi-environment setups (dev, staging, prod)</text>
  <text x="72.8125" y="617.68" font-family="Arial, sans-serif" font-size="12.51398" fill="var(--text)">3. Use a password manager or secrets manager (HashiCorp Vault) to supply vault passwords in CI</text>
  <text x="640" y="575.92" font-family="Arial, sans-serif" font-size="12.51398" fill="var(--text)">4. Keep only secrets in vault files; keep structure in regular vars</text>
  <text x="640" y="596.8" font-family="Arial, sans-serif" font-size="12.51398" fill="var(--text)">5. Add .vault_pass to .gitignore - never commit password files</text>
  <text x="640" y="617.68" font-family="Arial, sans-serif" font-size="12.51398" fill="var(--text)">6. Use ansible-lint to verify no plaintext secrets leak into playbooks</text>
</svg>

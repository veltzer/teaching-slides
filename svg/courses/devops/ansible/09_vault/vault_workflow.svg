<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <linearGradient id="grad-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- Header -->
  <rect x="0" y="0" width="1280" height="52" fill="url(#grad-primary)"/>
  <text x="640" y="34" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--bg)" text-anchor="middle">Ansible Vault Workflow</text>

  <!-- AES-256 badge -->
  <rect x="490" y="62" width="300" height="50" rx="8" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="640" y="82" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)" text-anchor="middle">AES-256 Encryption</text>
  <text x="640" y="102" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-lt)" text-anchor="middle">Symmetric key, password-based</text>

  <!-- Vault Commands box -->
  <rect x="20" y="128" width="380" height="280" rx="8" fill="url(#grad-surface)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="20" y="128" width="380" height="30" rx="8" fill="url(#grad-primary)"/>
  <rect x="20" y="146" width="380" height="12" fill="url(#grad-primary)"/>
  <text x="210" y="148" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">Vault Commands</text>

  <!-- Command rows -->
  <rect x="35" y="168" width="350" height="26" rx="4" fill="var(--primary-pale)"/>
  <text x="50" y="186" font-family="monospace" font-size="12" font-weight="bold" fill="var(--primary-dk)">ansible-vault create vault.yml</text>
  <text x="35" y="204" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">  Create new encrypted file (opens editor)</text>

  <rect x="35" y="214" width="350" height="26" rx="4" fill="var(--ok-pale)"/>
  <text x="50" y="232" font-family="monospace" font-size="12" font-weight="bold" fill="var(--ok-dk)">ansible-vault edit vault.yml</text>
  <text x="35" y="250" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">  Edit existing encrypted file</text>

  <rect x="35" y="260" width="350" height="26" rx="4" fill="var(--warn-pale)"/>
  <text x="50" y="278" font-family="monospace" font-size="12" font-weight="bold" fill="var(--warn-dk)">ansible-vault encrypt vars.yml</text>
  <text x="35" y="296" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">  Encrypt existing plaintext file</text>

  <rect x="35" y="306" width="350" height="26" rx="4" fill="var(--info-pale)"/>
  <text x="50" y="324" font-family="monospace" font-size="12" font-weight="bold" fill="var(--info-dk)">ansible-vault decrypt vars.yml</text>
  <text x="35" y="342" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">  Decrypt to plaintext (use with care!)</text>

  <rect x="35" y="352" width="350" height="26" rx="4" fill="var(--ok-pale)"/>
  <text x="50" y="370" font-family="monospace" font-size="12" font-weight="bold" fill="var(--ok-dk)">ansible-vault view vault.yml</text>
  <text x="35" y="388" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">  View decrypted contents</text>

  <text x="35" y="406" font-family="monospace" font-size="11" fill="var(--text-dark)">ansible-vault rekey vault.yml</text>
  <text x="210" y="406" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Change password</text>

  <!-- Vault-ID box -->
  <rect x="420" y="128" width="390" height="280" rx="8" fill="url(#grad-surface)" stroke="var(--info)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="420" y="128" width="390" height="30" rx="8" fill="url(#grad-info)"/>
  <rect x="420" y="146" width="390" height="12" fill="url(#grad-info)"/>
  <text x="615" y="148" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">Vault-ID (Multiple Vaults)</text>
  <text x="435" y="178" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--info-dk)">Create with labeled vault-id:</text>
  <text x="435" y="196" font-family="monospace" font-size="11" fill="var(--text-dark)">ansible-vault create \</text>
  <text x="435" y="213" font-family="monospace" font-size="11" fill="var(--text-dark)">  --vault-id prod@prompt vault_prod.yml</text>
  <text x="435" y="230" font-family="monospace" font-size="11" fill="var(--text-dark)">ansible-vault create \</text>
  <text x="435" y="247" font-family="monospace" font-size="11" fill="var(--text-dark)">  --vault-id dev@~/.dev_pass vault_dev.yml</text>
  <line x1="435" y1="260" x2="795" y2="260" stroke="var(--border-softer)" stroke-width="1"/>
  <text x="435" y="280" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--info-dk)">Run playbook with multiple vaults:</text>
  <text x="435" y="298" font-family="monospace" font-size="11" fill="var(--text-dark)">ansible-playbook site.yml \</text>
  <text x="435" y="315" font-family="monospace" font-size="11" fill="var(--text-dark)">  --vault-id prod@prompt \</text>
  <text x="435" y="332" font-family="monospace" font-size="11" fill="var(--text-dark)">  --vault-id dev@~/.dev_pass</text>
  <line x1="435" y1="345" x2="795" y2="345" stroke="var(--border-softer)" stroke-width="1"/>
  <text x="435" y="365" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--info-dk)">Password sources:</text>
  <text x="435" y="383" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">@prompt  - interactive input</text>
  <text x="435" y="399" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">@/path   - password file</text>
  <text x="435" y="406" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">@script  - password script</text>

  <!-- Integration with Playbooks box -->
  <rect x="830" y="62" width="430" height="346" rx="8" fill="url(#grad-surface)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="830" y="62" width="430" height="30" rx="8" fill="url(#grad-ok)"/>
  <rect x="830" y="80" width="430" height="12" fill="url(#grad-ok)"/>
  <text x="1045" y="82" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">Integration with Playbooks</text>

  <text x="845" y="112" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--ok-dk)">Encrypted vars file:</text>
  <text x="845" y="130" font-family="monospace" font-size="11" fill="var(--text-dark)">- hosts: all</text>
  <text x="845" y="147" font-family="monospace" font-size="11" fill="var(--text-dark)">  vars_files:</text>
  <text x="845" y="164" font-family="monospace" font-size="11" fill="var(--ok-dk)">    - group_vars/prod/vault.yml</text>
  <text x="845" y="181" font-family="monospace" font-size="11" fill="var(--text-dark)">  tasks:</text>
  <text x="845" y="198" font-family="monospace" font-size="11" fill="var(--text-dark)">    - name: Use secret</text>
  <text x="845" y="215" font-family="monospace" font-size="11" fill="var(--text-dark)">      template: src=db.conf.j2 dest=..</text>
  <text x="845" y="232" font-family="monospace" font-size="11" fill="var(--text-muted)">      # uses {{ db_password }} from vault</text>
  <line x1="845" y1="244" x2="1245" y2="244" stroke="var(--border-softer)" stroke-width="1"/>
  <text x="845" y="264" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--ok-dk)">Inline encrypted variable:</text>
  <text x="845" y="282" font-family="monospace" font-size="11" fill="var(--text-dark)">db_password: !vault |</text>
  <text x="845" y="299" font-family="monospace" font-size="11" fill="var(--text-dark)">  $ANSIBLE_VAULT;1.1;AES256</text>
  <text x="845" y="316" font-family="monospace" font-size="11" fill="var(--text-dark)">  35613464...</text>
  <line x1="845" y1="328" x2="1245" y2="328" stroke="var(--border-softer)" stroke-width="1"/>
  <text x="845" y="348" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--ok-dk)">Run with password prompt:</text>
  <text x="845" y="366" font-family="monospace" font-size="11" fill="var(--text-dark)">ansible-playbook site.yml --ask-vault-pass</text>
  <text x="845" y="384" font-family="monospace" font-size="11" fill="var(--text-dark)">ansible-playbook site.yml \</text>
  <text x="845" y="401" font-family="monospace" font-size="11" fill="var(--text-dark)">  --vault-password-file ~/.vault_pass</text>

  <!-- Bottom: best practices -->
  <rect x="20" y="420" width="1240" height="80" rx="8" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="35" y="443" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-dk)">Vault Best Practices</text>
  <text x="35" y="462" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">1. Commit encrypted vault files to Git - never commit plaintext secrets</text>
  <text x="35" y="480" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">2. Use vault-id labels for multi-environment setups (dev, staging, prod)</text>
  <text x="35" y="498" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">3. Use a password manager or secrets manager (HashiCorp Vault) to supply vault passwords in CI</text>
  <text x="640" y="462" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">4. Keep only secrets in vault files; keep structure in regular vars</text>
  <text x="640" y="480" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">5. Add .vault_pass to .gitignore - never commit password files</text>
  <text x="640" y="498" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">6. Use ansible-lint to verify no plaintext secrets leak into playbooks</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- AES-256 badge -->
  <rect x="440" y="40" width="400" height="60" rx="8" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--bg)">AES-256 Encryption</text>

  <!-- Commands box -->
  <rect x="40" y="120" width="380" height="370" rx="8" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">Commands</text>
  <text x="60" y="185" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">ansible-vault create</text>
  <text x="60" y="215" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">ansible-vault edit</text>
  <text x="60" y="245" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">ansible-vault encrypt</text>
  <text x="60" y="275" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">ansible-vault decrypt</text>
  <text x="60" y="305" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">ansible-vault view</text>
  <text x="60" y="335" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">ansible-vault rekey</text>
  <text x="60" y="380" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">create opens editor</text>
  <text x="60" y="410" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">rekey changes password</text>
  <text x="60" y="450" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="var(--bg)">Symmetric, password-based</text>

  <!-- Vault-ID -->
  <rect x="435" y="120" width="395" height="370" rx="8" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="632" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">Vault-ID</text>
  <text x="455" y="185" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)">Labeled vaults:</text>
  <text x="455" y="215" font-family="Courier New, monospace" font-size="12" fill="var(--bg)">--vault-id prod@prompt</text>
  <text x="455" y="240" font-family="Courier New, monospace" font-size="12" fill="var(--bg)">--vault-id dev@~/.pass</text>
  <text x="455" y="285" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)">Multi-vault run:</text>
  <text x="455" y="315" font-family="Courier New, monospace" font-size="12" fill="var(--bg)">ansible-playbook site.yml \</text>
  <text x="455" y="340" font-family="Courier New, monospace" font-size="12" fill="var(--bg)">  --vault-id prod@prompt \</text>
  <text x="455" y="365" font-family="Courier New, monospace" font-size="12" fill="var(--bg)">  --vault-id dev@~/.pass</text>
  <text x="455" y="410" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)">Sources:</text>
  <text x="455" y="435" font-family="Arial, sans-serif" font-size="12" fill="var(--bg)">@prompt | @file | @script</text>

  <!-- Integration -->
  <rect x="845" y="120" width="395" height="370" rx="8" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1042" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">Playbook Integration</text>
  <text x="865" y="185" font-family="Courier New, monospace" font-size="12" fill="var(--bg)">- hosts: all</text>
  <text x="865" y="210" font-family="Courier New, monospace" font-size="12" fill="var(--bg)">  vars_files:</text>
  <text x="865" y="235" font-family="Courier New, monospace" font-size="12" fill="var(--bg)">    - vault.yml</text>
  <text x="865" y="260" font-family="Courier New, monospace" font-size="12" fill="var(--bg)">  tasks:</text>
  <text x="865" y="285" font-family="Courier New, monospace" font-size="12" fill="var(--bg)">    - template: ...</text>
  <text x="865" y="325" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)">Run options:</text>
  <text x="865" y="355" font-family="Courier New, monospace" font-size="12" fill="var(--bg)">--ask-vault-pass</text>
  <text x="865" y="380" font-family="Courier New, monospace" font-size="12" fill="var(--bg)">--vault-password-file</text>
  <text x="865" y="425" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="var(--bg)">Inline with !vault tag</text>

  <!-- Best practices -->
  <rect x="40" y="510" width="1200" height="110" rx="8" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--bg)">Best Practices</text>
  <text x="640" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">Commit encrypted files; gitignore password files</text>
  <text x="640" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">Use vault-id labels per environment</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="390.909061" rx="6.475917" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="40" y="40" width="1200" height="47.272735" rx="6.475917" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="69.090931" width="1200" height="18.181804" rx="6.475917" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="72.727269" text-anchor="middle" font-size="22.510935" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Tower / AWX</text>
  <rect x="73.870968" y="112.727328" width="348.387097" height="118.181893" rx="6.475917" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="248.064516" y="159.999949" text-anchor="middle" font-size="18.759221" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Web UI</text>
  <text x="248.064516" y="192.727219" text-anchor="middle" font-size="15.00729" fill="var(--text-muted)" font-family="Arial, sans-serif">(React / nginx)</text>
  <text x="248.064516" y="219.999981" text-anchor="middle" font-size="13.131325" fill="var(--text-muted)" font-family="Arial, sans-serif">Job launch, RBAC, dashboards</text>
  <rect x="465.806452" y="112.727328" width="348.387097" height="118.181893" rx="6.475917" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="159.999949" text-anchor="middle" font-size="18.759221" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">REST API</text>
  <text x="640" y="192.727219" text-anchor="middle" font-size="15.00729" fill="var(--text-muted)" font-family="Arial, sans-serif">(Django / DRF)</text>
  <text x="640" y="219.999981" text-anchor="middle" font-size="13.131325" fill="var(--text-muted)" font-family="Arial, sans-serif">/api/v2/ endpoints</text>
  <rect x="857.741935" y="112.727328" width="348.387097" height="118.181893" rx="6.475917" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1031.935484" y="159.999949" text-anchor="middle" font-size="18.759221" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Task Engine</text>
  <text x="1031.935484" y="192.727219" text-anchor="middle" font-size="15.00729" fill="var(--text-muted)" font-family="Arial, sans-serif">(Dispatcher)</text>
  <text x="1031.935484" y="219.999981" text-anchor="middle" font-size="13.131325" fill="var(--text-muted)" font-family="Arial, sans-serif">Schedules and launches jobs</text>
  <rect x="73.870968" y="267.272715" width="348.387097" height="118.181893" rx="6.475917" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="248.064516" y="314.54545" text-anchor="middle" font-size="18.759221" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">PostgreSQL</text>
  <text x="248.064516" y="347.272719" text-anchor="middle" font-size="15.00729" fill="var(--text-muted)" font-family="Arial, sans-serif">(primary data store)</text>
  <text x="248.064516" y="374.545481" text-anchor="middle" font-size="13.131325" fill="var(--text-muted)" font-family="Arial, sans-serif">Jobs, credentials, inventory</text>
  <rect x="465.806452" y="267.272715" width="348.387097" height="118.181893" rx="6.475917" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="314.54545" text-anchor="middle" font-size="18.759221" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Redis</text>
  <text x="640" y="347.272719" text-anchor="middle" font-size="15.00729" fill="var(--text-muted)" font-family="Arial, sans-serif">(message queue)</text>
  <text x="640" y="374.545481" text-anchor="middle" font-size="13.131325" fill="var(--text-muted)" font-family="Arial, sans-serif">Task dispatch and caching</text>
  <rect x="857.741935" y="267.272715" width="348.387097" height="118.181893" rx="6.475917" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1031.935484" y="314.54545" text-anchor="middle" font-size="18.759221" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Receptor</text>
  <text x="1031.935484" y="347.272719" text-anchor="middle" font-size="15.00729" fill="var(--text-muted)" font-family="Arial, sans-serif">(mesh network)</text>
  <text x="1031.935484" y="374.545481" text-anchor="middle" font-size="13.131325" fill="var(--text-muted)" font-family="Arial, sans-serif">Connects execution nodes</text>
  <line x1="640" y1="432.72723" x2="640" y2="503.636276" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <text x="659.354839" y="476.363514" font-size="15.00729" fill="var(--primary-accent)" font-weight="600" font-family="Arial, sans-serif">SSH / API</text>
  <rect x="59.354839" y="510.909065" width="503.225806" height="109.090935" rx="6.475917" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="310.967742" y="558.181687" text-anchor="middle" font-size="18.759221" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Managed Nodes</text>
  <text x="310.967742" y="590.908956" text-anchor="middle" font-size="15.00729" fill="var(--text-muted)" font-family="Arial, sans-serif">Linux / Windows / Network devices</text>
  <text x="310.967742" y="610.909042" text-anchor="middle" font-size="13.131325" fill="var(--text-faint)" font-family="Arial, sans-serif">SSH + Python required</text>
  <rect x="717.419355" y="510.909065" width="503.225806" height="109.090935" rx="6.475917" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="969.032258" y="558.181687" text-anchor="middle" font-size="18.759221" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Execution Environments</text>
  <text x="969.032258" y="590.908956" text-anchor="middle" font-size="15.00729" fill="var(--text-muted)" font-family="Arial, sans-serif">(container images)</text>
  <text x="969.032258" y="610.909042" text-anchor="middle" font-size="13.131325" fill="var(--text-faint)" font-family="Arial, sans-serif">Isolated, reproducible runtime</text>
</svg>

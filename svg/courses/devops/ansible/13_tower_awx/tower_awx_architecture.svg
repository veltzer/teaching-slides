<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Tower/AWX outer box -->
  <rect x="20" y="20" width="1240" height="430" rx="10" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="20" y="20" width="1240" height="52" rx="10" fill="url(#grad-accent)"/>
  <rect x="20" y="52" width="1240" height="20" rx="0" fill="url(#grad-accent)"/>
  <text x="640" y="56" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">Tower / AWX</text>

  <!-- row 1 boxes -->
  <!-- Web UI -->
  <rect x="55" y="100" width="360" height="130" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="235" y="152" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Web UI</text>
  <text x="235" y="188" text-anchor="middle" font-size="16" fill="#555">(React / nginx)</text>
  <text x="235" y="218" text-anchor="middle" font-size="14" fill="#777">Job launch, RBAC, dashboards</text>

  <!-- REST API -->
  <rect x="460" y="100" width="360" height="130" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="152" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">REST API</text>
  <text x="640" y="188" text-anchor="middle" font-size="16" fill="#555">(Django / DRF)</text>
  <text x="640" y="218" text-anchor="middle" font-size="14" fill="#777">/api/v2/ endpoints</text>

  <!-- Task Engine -->
  <rect x="865" y="100" width="360" height="130" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1045" y="152" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Task Engine</text>
  <text x="1045" y="188" text-anchor="middle" font-size="16" fill="#555">(Dispatcher)</text>
  <text x="1045" y="218" text-anchor="middle" font-size="14" fill="#777">Schedules and launches jobs</text>

  <!-- row 2 boxes -->
  <!-- PostgreSQL -->
  <rect x="55" y="270" width="360" height="130" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="235" y="322" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">PostgreSQL</text>
  <text x="235" y="358" text-anchor="middle" font-size="16" fill="#555">(primary data store)</text>
  <text x="235" y="388" text-anchor="middle" font-size="14" fill="#777">Jobs, credentials, inventory</text>

  <!-- Redis -->
  <rect x="460" y="270" width="360" height="130" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="322" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Redis</text>
  <text x="640" y="358" text-anchor="middle" font-size="16" fill="#555">(message queue)</text>
  <text x="640" y="388" text-anchor="middle" font-size="14" fill="#777">Task dispatch and caching</text>

  <!-- Receptor -->
  <rect x="865" y="270" width="360" height="130" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1045" y="322" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Receptor</text>
  <text x="1045" y="358" text-anchor="middle" font-size="16" fill="#555">(mesh network)</text>
  <text x="1045" y="388" text-anchor="middle" font-size="14" fill="#777">Connects execution nodes</text>

  <!-- SSH arrow down -->
  <line x1="640" y1="452" x2="640" y2="530" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow-accent)"/>
  <text x="660" y="500" font-size="16" fill="#1565c0" font-weight="600">SSH / API</text>

  <!-- Managed Nodes box -->
  <rect x="40" y="538" width="520" height="120" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="2" filter="url(#shadow)"/>
  <text x="300" y="590" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Managed Nodes</text>
  <text x="300" y="626" text-anchor="middle" font-size="16" fill="#555">Linux / Windows / Network devices</text>
  <text x="300" y="648" text-anchor="middle" font-size="14" fill="#888">SSH + Python required</text>

  <!-- Execution Environments box -->
  <rect x="720" y="538" width="520" height="120" rx="8" fill="#fff3e0" stroke="#f57c00" stroke-width="2" filter="url(#shadow)"/>
  <text x="980" y="590" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Execution Environments</text>
  <text x="980" y="626" text-anchor="middle" font-size="16" fill="#555">(container images)</text>
  <text x="980" y="648" text-anchor="middle" font-size="14" fill="#888">Isolated, reproducible runtime</text>
</svg>

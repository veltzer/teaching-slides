<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="58.75" y="56.1111" width="1162.5" height="346.3889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="58.75" y="56.1111" width="1162.5" height="41.8889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="58.75" y="81.8889" width="1162.5" height="16.1111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="85.1111" text-anchor="middle" font-size="20.8566" font-weight="bold" fill="var(--bg)">Tower / AWX</text>
  <rect x="91.5625" y="120.5556" width="337.5" height="104.7223" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="260.3125" y="162.4444" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--text)">Web UI</text>
  <text x="260.3125" y="191.4444" text-anchor="middle" font-size="13.9044" fill="var(--text-muted)">(React / nginx)</text>
  <text x="260.3125" y="215.6111" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)">Job launch, RBAC, dashboards</text>
  <rect x="471.25" y="120.5556" width="337.5" height="104.7223" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="162.4444" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--text)">REST API</text>
  <text x="640" y="191.4444" text-anchor="middle" font-size="13.9044" fill="var(--text-muted)">(Django / DRF)</text>
  <text x="640" y="215.6111" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)">/api/v2/ endpoints</text>
  <rect x="850.9375" y="120.5556" width="337.5" height="104.7223" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1019.6875" y="162.4444" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--text)">Task Engine</text>
  <text x="1019.6875" y="191.4444" text-anchor="middle" font-size="13.9044" fill="var(--text-muted)">(Dispatcher)</text>
  <text x="1019.6875" y="215.6111" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)">Schedules and launches jobs</text>
  <rect x="91.5625" y="257.5" width="337.5" height="104.7223" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="260.3125" y="299.3889" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--text)">PostgreSQL</text>
  <text x="260.3125" y="328.3889" text-anchor="middle" font-size="13.9044" fill="var(--text-muted)">(primary data store)</text>
  <text x="260.3125" y="352.5556" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)">Jobs, credentials, inventory</text>
  <rect x="471.25" y="257.5" width="337.5" height="104.7223" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="299.3889" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--text)">Redis</text>
  <text x="640" y="328.3889" text-anchor="middle" font-size="13.9044" fill="var(--text-muted)">(message queue)</text>
  <text x="640" y="352.5556" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)">Task dispatch and caching</text>
  <rect x="850.9375" y="257.5" width="337.5" height="104.7223" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1019.6875" y="299.3889" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--text)">Receptor</text>
  <text x="1019.6875" y="328.3889" text-anchor="middle" font-size="13.9044" fill="var(--text-muted)">(mesh network)</text>
  <text x="1019.6875" y="352.5556" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)">Connects execution nodes</text>
  <line x1="640" y1="404.1111" x2="640" y2="466.9444" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="658.75" y="442.7777" font-size="13.9044" fill="var(--primary-accent)" font-weight="600">SSH / API</text>
  <rect x="77.5" y="473.3889" width="487.5" height="96.6667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="321.25" y="515.2777" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--text)">Managed Nodes</text>
  <text x="321.25" y="544.2777" text-anchor="middle" font-size="13.9044" fill="var(--text-muted)">Linux / Windows / Network devices</text>
  <text x="321.25" y="562" text-anchor="middle" font-size="12.1663" fill="var(--text-faint)">SSH + Python required</text>
  <rect x="715" y="473.3889" width="487.5" height="96.6667" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="958.75" y="515.2777" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--text)">Execution Environments</text>
  <text x="958.75" y="544.2777" text-anchor="middle" font-size="13.9044" fill="var(--text-muted)">(container images)</text>
  <text x="958.75" y="562" text-anchor="middle" font-size="12.1663" fill="var(--text-faint)">Isolated, reproducible runtime</text>
</svg>
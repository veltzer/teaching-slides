<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="390.909061" rx="6.475917" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="40" y="40" width="1200" height="47.272735" rx="6.475917" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="69.090931" width="1200" height="18.181804" rx="6.475917" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="72.727269" text-anchor="middle" font-size="22.510935" font-weight="bold" fill="var(--bg)">Tower / AWX</text>
  <rect x="73.870968" y="112.727328" width="348.387097" height="118.181893" rx="6.475917" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="248.064516" y="159.999949" text-anchor="middle" font-size="18.759221" font-weight="bold" fill="var(--text)">Web UI</text>
  <text x="248.064516" y="192.727219" text-anchor="middle" font-size="15.00729" fill="var(--text-muted)">(React / nginx)</text>
  <text x="248.064516" y="219.999981" text-anchor="middle" font-size="13.131325" fill="var(--text-muted)">Job launch, RBAC, dashboards</text>
  <rect x="465.806452" y="112.727328" width="348.387097" height="118.181893" rx="6.475917" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="159.999949" text-anchor="middle" font-size="18.759221" font-weight="bold" fill="var(--text)">REST API</text>
  <text x="640" y="192.727219" text-anchor="middle" font-size="15.00729" fill="var(--text-muted)">(Django / DRF)</text>
  <text x="640" y="219.999981" text-anchor="middle" font-size="13.131325" fill="var(--text-muted)">/api/v2/ endpoints</text>
  <rect x="857.741935" y="112.727328" width="348.387097" height="118.181893" rx="6.475917" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1031.935484" y="159.999949" text-anchor="middle" font-size="18.759221" font-weight="bold" fill="var(--text)">Task Engine</text>
  <text x="1031.935484" y="192.727219" text-anchor="middle" font-size="15.00729" fill="var(--text-muted)">(Dispatcher)</text>
  <text x="1031.935484" y="219.999981" text-anchor="middle" font-size="13.131325" fill="var(--text-muted)">Schedules and launches jobs</text>
  <rect x="73.870968" y="267.272715" width="348.387097" height="118.181893" rx="6.475917" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="248.064516" y="314.54545" text-anchor="middle" font-size="18.759221" font-weight="bold" fill="var(--text)">PostgreSQL</text>
  <text x="248.064516" y="347.272719" text-anchor="middle" font-size="15.00729" fill="var(--text-muted)">(primary data store)</text>
  <text x="248.064516" y="374.545481" text-anchor="middle" font-size="13.131325" fill="var(--text-muted)">Jobs, credentials, inventory</text>
  <rect x="465.806452" y="267.272715" width="348.387097" height="118.181893" rx="6.475917" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="314.54545" text-anchor="middle" font-size="18.759221" font-weight="bold" fill="var(--text)">Redis</text>
  <text x="640" y="347.272719" text-anchor="middle" font-size="15.00729" fill="var(--text-muted)">(message queue)</text>
  <text x="640" y="374.545481" text-anchor="middle" font-size="13.131325" fill="var(--text-muted)">Task dispatch and caching</text>
  <rect x="857.741935" y="267.272715" width="348.387097" height="118.181893" rx="6.475917" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1031.935484" y="314.54545" text-anchor="middle" font-size="18.759221" font-weight="bold" fill="var(--text)">Receptor</text>
  <text x="1031.935484" y="347.272719" text-anchor="middle" font-size="15.00729" fill="var(--text-muted)">(mesh network)</text>
  <text x="1031.935484" y="374.545481" text-anchor="middle" font-size="13.131325" fill="var(--text-muted)">Connects execution nodes</text>
  <line x1="640" y1="432.72723" x2="640" y2="503.636276" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="659.354839" y="476.363514" font-size="15.00729" fill="var(--primary-accent)" font-weight="600">SSH / API</text>
  <rect x="59.354839" y="510.909065" width="503.225806" height="109.090935" rx="6.475917" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="310.967742" y="558.181687" text-anchor="middle" font-size="18.759221" font-weight="bold" fill="var(--text)">Managed Nodes</text>
  <text x="310.967742" y="590.908956" text-anchor="middle" font-size="15.00729" fill="var(--text-muted)">Linux / Windows / Network devices</text>
  <text x="310.967742" y="610.909042" text-anchor="middle" font-size="13.131325" fill="var(--text-faint)">SSH + Python required</text>
  <rect x="717.419355" y="510.909065" width="503.225806" height="109.090935" rx="6.475917" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="969.032258" y="558.181687" text-anchor="middle" font-size="18.759221" font-weight="bold" fill="var(--text)">Execution Environments</text>
  <text x="969.032258" y="590.908956" text-anchor="middle" font-size="15.00729" fill="var(--text-muted)">(container images)</text>
  <text x="969.032258" y="610.909042" text-anchor="middle" font-size="13.131325" fill="var(--text-faint)">Isolated, reproducible runtime</text>
</svg>
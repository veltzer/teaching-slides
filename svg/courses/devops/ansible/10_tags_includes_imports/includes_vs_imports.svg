<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
  </defs>
  <!-- Header -->
  <rect x="40" y="40" width="1200" height="52.452179" fill="url(#grad-primary)" rx="6.330053" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="74.295655" font-family="Arial, sans-serif" font-size="21.393785" font-weight="bold" fill="var(--bg)" text-anchor="middle">Includes vs Imports in Ansible</text>

  <!-- import_tasks column -->
  <rect x="58.75" y="102.539136" width="553.125" height="373.217427" rx="6.330053" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="58.75" y="102.539136" width="553.125" height="34.295655" rx="6.330053" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="58.75" y="124.730443" width="553.125" height="12.104349" fill="url(#grad-primary)" rx="6.330053" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335.3125" y="126.747834" font-family="Arial, sans-serif" font-size="15.559164" font-weight="bold" fill="var(--bg)" text-anchor="middle">import_tasks (STATIC)</text>

  <rect x="72.8125" y="145.912998" width="65.625" height="22.191306" rx="6.330053" fill="var(--primary-accent)"/>
  <text x="105.625" y="162.05213" font-family="Arial, sans-serif" font-size="10.696945" font-weight="bold" fill="var(--bg)" text-anchor="middle">STATIC</text>

  <text x="147.8125" y="162.05213" font-family="Arial, sans-serif" font-size="11.669347" fill="var(--text)">Processed at playbook parse time (before execution)</text>

  <text x="72.8125" y="189.286971" font-family="Arial, sans-serif" font-size="11.669347" font-weight="bold" fill="var(--primary-accent)">Syntax:</text>
  <rect x="72.8125" y="196.347897" width="520.3125" height="44.382613" rx="6.330053" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="86.875" y="213.495669" font-size="11.669347" fill="var(--text)" font-family="Courier New, monospace">- import_tasks: tasks/setup.yml</text>
  <text x="86.875" y="231.652192" font-size="11.669347" fill="var(--text)" font-family="Courier New, monospace">  vars: { env: prod }</text>

  <text x="72.8125" y="261.913065" font-family="Arial, sans-serif" font-size="11.669347" font-weight="bold" fill="var(--primary-accent)">Characteristics:</text>
  <text x="72.8125" y="282.08698" font-family="Arial, sans-serif" font-size="11.669347" fill="var(--text)">+ Tags applied to import propagate into imported tasks</text>
  <text x="72.8125" y="300.243503" font-family="Arial, sans-serif" font-size="11.669347" fill="var(--text)">+ Can use --list-tasks and --list-tags to see all tasks</text>
  <text x="72.8125" y="318.400027" font-family="Arial, sans-serif" font-size="11.669347" fill="var(--text)">+ Supports notify handlers in imported tasks</text>
  <text x="72.8125" y="336.55655" font-family="Arial, sans-serif" font-size="11.669347" fill="var(--danger-accent)">- when: is applied to EVERY individual task (not wrapper)</text>
  <text x="72.8125" y="354.713074" font-family="Arial, sans-serif" font-size="11.669347" fill="var(--danger-accent)">- Cannot use variables in the filename (static resolution)</text>
  <text x="72.8125" y="372.869597" font-family="Arial, sans-serif" font-size="11.669347" fill="var(--danger-accent)">- Cannot loop over import_tasks</text>

  <text x="72.8125" y="401.113078" font-family="Arial, sans-serif" font-size="11.669347" font-weight="bold" fill="var(--primary-accent)">Tag inheritance example:</text>
  <rect x="72.8125" y="408.173893" width="520.3125" height="58.504353" rx="6.330053" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="86.875" y="426.330528" font-size="10.696945" fill="var(--text)" font-family="Courier New, monospace">- import_tasks: tasks/install.yml</text>
  <text x="86.875" y="443.4783" font-size="10.696945" fill="var(--text)" font-family="Courier New, monospace">  tags: install     # ALL tasks in install.yml get this tag</text>
  <text x="86.875" y="460.626072" font-size="10.696945" fill="var(--text-muted)" font-family="Courier New, monospace">  # ansible-playbook site.yml --tags install  -- runs all</text>

  <!-- include_tasks column -->
  <rect x="630.625" y="102.539136" width="590.625" height="373.217427" rx="6.330053" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="630.625" y="102.539136" width="590.625" height="34.295655" rx="6.330053" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="630.625" y="124.730443" width="590.625" height="12.104349" fill="url(#grad-ok)" rx="6.330053" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="925.9375" y="126.747834" font-family="Arial, sans-serif" font-size="15.559164" font-weight="bold" fill="var(--bg)" text-anchor="middle">include_tasks (DYNAMIC)</text>

  <rect x="644.6875" y="145.912998" width="75" height="22.191306" rx="6.330053" fill="var(--ok-accent)"/>
  <text x="682.1875" y="162.05213" font-family="Arial, sans-serif" font-size="10.696945" font-weight="bold" fill="var(--bg)" text-anchor="middle">DYNAMIC</text>

  <text x="729.0625" y="162.05213" font-family="Arial, sans-serif" font-size="11.669347" fill="var(--text)">Processed at runtime when that task is reached</text>

  <text x="644.6875" y="189.286971" font-family="Arial, sans-serif" font-size="11.669347" font-weight="bold" fill="var(--ok-accent)">Syntax:</text>
  <rect x="644.6875" y="196.347897" width="562.5" height="44.382613" rx="6.330053" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="658.75" y="213.495669" font-size="11.669347" fill="var(--text)" font-family="Courier New, monospace">- include_tasks: "tasks/{{ env }}_setup.yml"</text>
  <text x="658.75" y="231.652192" font-size="11.669347" fill="var(--text)" font-family="Courier New, monospace">  vars: { component: nginx }</text>

  <text x="644.6875" y="261.913065" font-family="Arial, sans-serif" font-size="11.669347" font-weight="bold" fill="var(--ok-accent)">Characteristics:</text>
  <text x="644.6875" y="282.08698" font-family="Arial, sans-serif" font-size="11.669347" fill="var(--text)">+ Can use variables in the filename (resolved at runtime)</text>
  <text x="644.6875" y="300.243503" font-family="Arial, sans-serif" font-size="11.669347" fill="var(--text)">+ Can use loop: to include a file multiple times</text>
  <text x="644.6875" y="318.400027" font-family="Arial, sans-serif" font-size="11.669347" fill="var(--text)">+ when: applies to the include itself (wraps all tasks)</text>
  <text x="644.6875" y="336.55655" font-family="Arial, sans-serif" font-size="11.669347" fill="var(--danger-accent)">- Tags NOT inherited; included tasks invisible to --list-tasks</text>
  <text x="644.6875" y="354.713074" font-family="Arial, sans-serif" font-size="11.669347" fill="var(--danger-accent)">- Cannot target specific tasks with --tags inside include</text>

  <text x="644.6875" y="382.956555" font-family="Arial, sans-serif" font-size="11.669347" font-weight="bold" fill="var(--ok-accent)">Dynamic include with loop:</text>
  <rect x="644.6875" y="390.017481" width="562.5" height="78.678268" rx="6.330053" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="658.75" y="408.173893" font-size="10.696945" fill="var(--text)" font-family="Courier New, monospace">- include_tasks: "tasks/{{ item }}.yml"</text>
  <text x="658.75" y="425.321776" font-size="10.696945" fill="var(--text)" font-family="Courier New, monospace">  loop:</text>
  <text x="658.75" y="442.469659" font-size="10.696945" fill="var(--text)" font-family="Courier New, monospace">    - pre_install</text>
  <text x="658.75" y="459.617432" font-size="10.696945" fill="var(--text)" font-family="Courier New, monospace">    - install</text>
  <text x="658.75" y="476.765204" font-size="10.696945" fill="var(--text)" font-family="Courier New, monospace">    - post_install</text>

  <!-- Bottom: decision guide + tags -->
  <rect x="58.75" y="488.869553" width="553.125" height="80.69566" rx="6.330053" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="72.8125" y="510.052219" font-family="Arial, sans-serif" font-size="12.641854" font-weight="bold" fill="var(--warn-accent)">When to use import_tasks:</text>
  <text x="72.8125" y="530.226134" font-family="Arial, sans-serif" font-size="11.669347" fill="var(--text-muted)">- You want tag control and --list-tasks visibility</text>
  <text x="72.8125" y="548.382657" font-family="Arial, sans-serif" font-size="11.669347" fill="var(--text-muted)">- Filename is known at write time (no variable in path)</text>
  <text x="72.8125" y="566.539181" font-family="Arial, sans-serif" font-size="11.669347" fill="var(--text-muted)">- You need handler notifications from imported tasks</text>

  <rect x="630.625" y="488.869553" width="590.625" height="80.69566" rx="6.330053" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="644.6875" y="510.052219" font-family="Arial, sans-serif" font-size="12.641854" font-weight="bold" fill="var(--ok-accent)">When to use include_tasks:</text>
  <text x="644.6875" y="530.226134" font-family="Arial, sans-serif" font-size="11.669347" fill="var(--text-muted)">- Filename includes variables resolved at runtime</text>
  <text x="644.6875" y="548.382657" font-family="Arial, sans-serif" font-size="11.669347" fill="var(--text-muted)">- Looping over multiple task files dynamically</text>
  <text x="644.6875" y="566.539181" font-family="Arial, sans-serif" font-size="11.669347" fill="var(--text-muted)">- Conditionally skipping entire task file with when:</text>

  <!-- Bottom tip -->
  <rect x="58.75" y="581.669562" width="1162.5" height="38.330438" rx="6.330053" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="72.8125" y="597.808694" font-family="Arial, sans-serif" font-size="11.669347" font-weight="bold" fill="var(--primary-accent)">Also:</text>
  <text x="115" y="597.808694" font-size="11.669347" fill="var(--text)" font-family="Courier New, monospace">import_playbook</text>
  <text x="255.625" y="597.808694" font-family="Arial, sans-serif" font-size="11.669347" fill="var(--text-muted)">statically includes entire playbooks |</text>
  <text x="518.125" y="597.808694" font-size="11.669347" fill="var(--text)" font-family="Courier New, monospace">include_role</text>
  <text x="621.25" y="597.808694" font-family="Arial, sans-serif" font-size="11.669347" fill="var(--text-muted)">dynamically includes a role |</text>
  <text x="808.75" y="597.808694" font-size="11.669347" fill="var(--text)" font-family="Courier New, monospace">import_role</text>
  <text x="907.1875" y="597.808694" font-family="Arial, sans-serif" font-size="11.669347" fill="var(--text-muted)">statically includes a role with tag inheritance</text>
  <text x="72.8125" y="612.939185" font-family="Arial, sans-serif" font-size="10.696945" fill="var(--text-faint)">Tags on import_tasks/import_role apply to every child task. Tags on include_tasks apply only to the wrapper - inner tasks need their own tags.</text>
</svg>

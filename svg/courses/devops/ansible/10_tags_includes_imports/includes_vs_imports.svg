<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Header -->
  <rect x="40" y="40" width="1200" height="47.125" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="70.8125" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--bg)" text-anchor="middle">Includes vs Imports in Ansible</text>

  <!-- import_tasks column -->
  <rect x="58.75" y="96.1875" width="553.125" height="335.3125" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="58.75" y="96.1875" width="553.125" height="30.8125" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="58.75" y="116.125" width="553.125" height="10.875" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="335.3125" y="117.9375" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--bg)" text-anchor="middle">import_tasks (STATIC)</text>

  <rect x="72.8125" y="135.1562" width="65.625" height="19.9375" rx="6" fill="var(--primary-accent)"/>
  <text x="105.625" y="149.6562" font-family="Arial, sans-serif" font-size="10.1392" font-weight="bold" fill="var(--bg)" text-anchor="middle">STATIC</text>

  <text x="147.8125" y="149.6562" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Processed at playbook parse time (before execution)</text>

  <text x="72.8125" y="174.125" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--primary-accent)">Syntax:</text>
  <rect x="72.8125" y="180.4688" width="520.3125" height="39.875" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="86.875" y="195.875" font-family="monospace" font-size="11.0609" fill="var(--text)">- import_tasks: tasks/setup.yml</text>
  <text x="86.875" y="212.1875" font-family="monospace" font-size="11.0609" fill="var(--text)">  vars: { env: prod }</text>

  <text x="72.8125" y="239.375" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--primary-accent)">Characteristics:</text>
  <text x="72.8125" y="257.5" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">+ Tags applied to import propagate into imported tasks</text>
  <text x="72.8125" y="273.8125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">+ Can use --list-tasks and --list-tags to see all tasks</text>
  <text x="72.8125" y="290.125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">+ Supports notify handlers in imported tasks</text>
  <text x="72.8125" y="306.4375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--danger-accent)">- when: is applied to EVERY individual task (not wrapper)</text>
  <text x="72.8125" y="322.75" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--danger-accent)">- Cannot use variables in the filename (static resolution)</text>
  <text x="72.8125" y="339.0625" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--danger-accent)">- Cannot loop over import_tasks</text>

  <text x="72.8125" y="364.4375" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--primary-accent)">Tag inheritance example:</text>
  <rect x="72.8125" y="370.7812" width="520.3125" height="52.5625" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="86.875" y="387.0938" font-family="monospace" font-size="10.1392" fill="var(--text)">- import_tasks: tasks/install.yml</text>
  <text x="86.875" y="402.5" font-family="monospace" font-size="10.1392" fill="var(--text)">  tags: install     # ALL tasks in install.yml get this tag</text>
  <text x="86.875" y="417.9062" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">  # ansible-playbook site.yml --tags install  -- runs all</text>

  <!-- include_tasks column -->
  <rect x="630.625" y="96.1875" width="590.625" height="335.3125" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="630.625" y="96.1875" width="590.625" height="30.8125" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="630.625" y="116.125" width="590.625" height="10.875" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="925.9375" y="117.9375" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--bg)" text-anchor="middle">include_tasks (DYNAMIC)</text>

  <rect x="644.6875" y="135.1562" width="75" height="19.9375" rx="6" fill="var(--ok-accent)"/>
  <text x="682.1875" y="149.6562" font-family="Arial, sans-serif" font-size="10.1392" font-weight="bold" fill="var(--bg)" text-anchor="middle">DYNAMIC</text>

  <text x="729.0625" y="149.6562" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Processed at runtime when that task is reached</text>

  <text x="644.6875" y="174.125" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--ok-accent)">Syntax:</text>
  <rect x="644.6875" y="180.4688" width="562.5" height="39.875" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="658.75" y="195.875" font-family="monospace" font-size="11.0609" fill="var(--text)">- include_tasks: "tasks/{{ env }}_setup.yml"</text>
  <text x="658.75" y="212.1875" font-family="monospace" font-size="11.0609" fill="var(--text)">  vars: { component: nginx }</text>

  <text x="644.6875" y="239.375" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--ok-accent)">Characteristics:</text>
  <text x="644.6875" y="257.5" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">+ Can use variables in the filename (resolved at runtime)</text>
  <text x="644.6875" y="273.8125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">+ Can use loop: to include a file multiple times</text>
  <text x="644.6875" y="290.125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">+ when: applies to the include itself (wraps all tasks)</text>
  <text x="644.6875" y="306.4375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--danger-accent)">- Tags NOT inherited; included tasks invisible to --list-tasks</text>
  <text x="644.6875" y="322.75" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--danger-accent)">- Cannot target specific tasks with --tags inside include</text>

  <text x="644.6875" y="348.125" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--ok-accent)">Dynamic include with loop:</text>
  <rect x="644.6875" y="354.4688" width="562.5" height="70.6875" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="658.75" y="370.7812" font-family="monospace" font-size="10.1392" fill="var(--text)">- include_tasks: "tasks/{{ item }}.yml"</text>
  <text x="658.75" y="386.1875" font-family="monospace" font-size="10.1392" fill="var(--text)">  loop:</text>
  <text x="658.75" y="401.5938" font-family="monospace" font-size="10.1392" fill="var(--text)">    - pre_install</text>
  <text x="658.75" y="417" font-family="monospace" font-size="10.1392" fill="var(--text)">    - install</text>
  <text x="658.75" y="432.4062" font-family="monospace" font-size="10.1392" fill="var(--text)">    - post_install</text>

  <!-- Bottom: decision guide + tags -->
  <rect x="58.75" y="443.2812" width="553.125" height="72.5" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="72.8125" y="462.3125" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--warn-accent)">When to use import_tasks:</text>
  <text x="72.8125" y="480.4375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">- You want tag control and --list-tasks visibility</text>
  <text x="72.8125" y="496.75" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">- Filename is known at write time (no variable in path)</text>
  <text x="72.8125" y="513.0625" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">- You need handler notifications from imported tasks</text>

  <rect x="630.625" y="443.2812" width="590.625" height="72.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="644.6875" y="462.3125" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--ok-accent)">When to use include_tasks:</text>
  <text x="644.6875" y="480.4375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">- Filename includes variables resolved at runtime</text>
  <text x="644.6875" y="496.75" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">- Looping over multiple task files dynamically</text>
  <text x="644.6875" y="513.0625" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">- Conditionally skipping entire task file with when:</text>

  <!-- Bottom tip -->
  <rect x="58.75" y="526.6562" width="1162.5" height="34.4375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="72.8125" y="541.1562" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--primary-accent)">Also:</text>
  <text x="115" y="541.1562" font-family="monospace" font-size="11.0609" fill="var(--text)">import_playbook</text>
  <text x="255.625" y="541.1562" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">statically includes entire playbooks |</text>
  <text x="518.125" y="541.1562" font-family="monospace" font-size="11.0609" fill="var(--text)">include_role</text>
  <text x="621.25" y="541.1562" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">dynamically includes a role |</text>
  <text x="808.75" y="541.1562" font-family="monospace" font-size="11.0609" fill="var(--text)">import_role</text>
  <text x="907.1875" y="541.1562" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">statically includes a role with tag inheritance</text>
  <text x="72.8125" y="554.75" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)">Tags on import_tasks/import_role apply to every child task. Tags on include_tasks apply only to the wrapper - inner tasks need their own tags.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="#ffffff"/>

  <!-- Header -->
  <rect x="0" y="0" width="1280" height="52" fill="url(#grad-accent)"/>
  <text x="640" y="34" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">Includes vs Imports in Ansible</text>

  <!-- import_tasks column -->
  <rect x="20" y="62" width="590" height="370" rx="8" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="20" y="62" width="590" height="34" rx="8" fill="url(#grad-accent)"/>
  <rect x="20" y="84" width="590" height="12" fill="url(#grad-accent)"/>
  <text x="315" y="86" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">import_tasks (STATIC)</text>

  <rect x="35" y="105" width="70" height="22" rx="4" fill="#1565c0"/>
  <text x="70" y="121" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">STATIC</text>

  <text x="115" y="121" font-family="Arial, sans-serif" font-size="12" fill="#333333">Processed at playbook parse time (before execution)</text>

  <text x="35" y="148" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1565c0">Syntax:</text>
  <rect x="35" y="155" width="555" height="44" rx="5" fill="#e3f2fd"/>
  <text x="50" y="172" font-family="monospace" font-size="12" fill="#333333">- import_tasks: tasks/setup.yml</text>
  <text x="50" y="190" font-family="monospace" font-size="12" fill="#333333">  vars: { env: prod }</text>

  <text x="35" y="220" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1565c0">Characteristics:</text>
  <text x="35" y="240" font-family="Arial, sans-serif" font-size="12" fill="#333333">+ Tags applied to import propagate into imported tasks</text>
  <text x="35" y="258" font-family="Arial, sans-serif" font-size="12" fill="#333333">+ Can use --list-tasks and --list-tags to see all tasks</text>
  <text x="35" y="276" font-family="Arial, sans-serif" font-size="12" fill="#333333">+ Supports notify handlers in imported tasks</text>
  <text x="35" y="294" font-family="Arial, sans-serif" font-size="12" fill="#e53935">- when: is applied to EVERY individual task (not wrapper)</text>
  <text x="35" y="312" font-family="Arial, sans-serif" font-size="12" fill="#e53935">- Cannot use variables in the filename (static resolution)</text>
  <text x="35" y="330" font-family="Arial, sans-serif" font-size="12" fill="#e53935">- Cannot loop over import_tasks</text>

  <text x="35" y="358" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1565c0">Tag inheritance example:</text>
  <rect x="35" y="365" width="555" height="58" rx="5" fill="#e3f2fd"/>
  <text x="50" y="383" font-family="monospace" font-size="11" fill="#333333">- import_tasks: tasks/install.yml</text>
  <text x="50" y="400" font-family="monospace" font-size="11" fill="#333333">  tags: install     # ALL tasks in install.yml get this tag</text>
  <text x="50" y="417" font-family="monospace" font-size="11" fill="#555555">  # ansible-playbook site.yml --tags install  -- runs all</text>

  <!-- include_tasks column -->
  <rect x="630" y="62" width="630" height="370" rx="8" fill="url(#grad-surface)" stroke="#43a047" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="630" y="62" width="630" height="34" rx="8" fill="url(#grad-green)"/>
  <rect x="630" y="84" width="630" height="12" fill="url(#grad-green)"/>
  <text x="945" y="86" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">include_tasks (DYNAMIC)</text>

  <rect x="645" y="105" width="80" height="22" rx="4" fill="#2e7d32"/>
  <text x="685" y="121" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">DYNAMIC</text>

  <text x="735" y="121" font-family="Arial, sans-serif" font-size="12" fill="#333333">Processed at runtime when that task is reached</text>

  <text x="645" y="148" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">Syntax:</text>
  <rect x="645" y="155" width="600" height="44" rx="5" fill="#e8f5e9"/>
  <text x="660" y="172" font-family="monospace" font-size="12" fill="#333333">- include_tasks: "tasks/{{ env }}_setup.yml"</text>
  <text x="660" y="190" font-family="monospace" font-size="12" fill="#333333">  vars: { component: nginx }</text>

  <text x="645" y="220" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">Characteristics:</text>
  <text x="645" y="240" font-family="Arial, sans-serif" font-size="12" fill="#333333">+ Can use variables in the filename (resolved at runtime)</text>
  <text x="645" y="258" font-family="Arial, sans-serif" font-size="12" fill="#333333">+ Can use loop: to include a file multiple times</text>
  <text x="645" y="276" font-family="Arial, sans-serif" font-size="12" fill="#333333">+ when: applies to the include itself (wraps all tasks)</text>
  <text x="645" y="294" font-family="Arial, sans-serif" font-size="12" fill="#e53935">- Tags NOT inherited; included tasks invisible to --list-tasks</text>
  <text x="645" y="312" font-family="Arial, sans-serif" font-size="12" fill="#e53935">- Cannot target specific tasks with --tags inside include</text>

  <text x="645" y="340" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">Dynamic include with loop:</text>
  <rect x="645" y="347" width="600" height="78" rx="5" fill="#e8f5e9"/>
  <text x="660" y="365" font-family="monospace" font-size="11" fill="#333333">- include_tasks: "tasks/{{ item }}.yml"</text>
  <text x="660" y="382" font-family="monospace" font-size="11" fill="#333333">  loop:</text>
  <text x="660" y="399" font-family="monospace" font-size="11" fill="#333333">    - pre_install</text>
  <text x="660" y="416" font-family="monospace" font-size="11" fill="#333333">    - install</text>
  <text x="660" y="433" font-family="monospace" font-size="11" fill="#333333">    - post_install</text>

  <!-- Bottom: decision guide + tags -->
  <rect x="20" y="445" width="590" height="80" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.5"/>
  <text x="35" y="466" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#e65100">When to use import_tasks:</text>
  <text x="35" y="486" font-family="Arial, sans-serif" font-size="12" fill="#555555">- You want tag control and --list-tasks visibility</text>
  <text x="35" y="504" font-family="Arial, sans-serif" font-size="12" fill="#555555">- Filename is known at write time (no variable in path)</text>
  <text x="35" y="522" font-family="Arial, sans-serif" font-size="12" fill="#555555">- You need handler notifications from imported tasks</text>

  <rect x="630" y="445" width="630" height="80" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <text x="645" y="466" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2e7d32">When to use include_tasks:</text>
  <text x="645" y="486" font-family="Arial, sans-serif" font-size="12" fill="#555555">- Filename includes variables resolved at runtime</text>
  <text x="645" y="504" font-family="Arial, sans-serif" font-size="12" fill="#555555">- Looping over multiple task files dynamically</text>
  <text x="645" y="522" font-family="Arial, sans-serif" font-size="12" fill="#555555">- Conditionally skipping entire task file with when:</text>

  <!-- Bottom tip -->
  <rect x="20" y="537" width="1240" height="38" rx="6" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1"/>
  <text x="35" y="553" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1565c0">Also:</text>
  <text x="80" y="553" font-family="monospace" font-size="12" fill="#333333">import_playbook</text>
  <text x="230" y="553" font-family="Arial, sans-serif" font-size="12" fill="#555555">statically includes entire playbooks |</text>
  <text x="510" y="553" font-family="monospace" font-size="12" fill="#333333">include_role</text>
  <text x="620" y="553" font-family="Arial, sans-serif" font-size="12" fill="#555555">dynamically includes a role |</text>
  <text x="820" y="553" font-family="monospace" font-size="12" fill="#333333">import_role</text>
  <text x="925" y="553" font-family="Arial, sans-serif" font-size="12" fill="#555555">statically includes a role with tag inheritance</text>
  <text x="35" y="568" font-family="Arial, sans-serif" font-size="11" fill="#888888">Tags on import_tasks/import_role apply to every child task. Tags on include_tasks apply only to the wrapper - inner tasks need their own tags.</text>
</svg>

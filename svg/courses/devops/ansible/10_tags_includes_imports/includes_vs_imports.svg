<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- Header -->
  <rect x="0" y="0" width="1280" height="52" fill="url(#grad-primary)"/>
  <text x="640" y="34" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--bg)" text-anchor="middle">Includes vs Imports in Ansible</text>

  <!-- import_tasks column -->
  <rect x="20" y="62" width="590" height="370" rx="8" fill="url(#grad-surface)" stroke="var(--primary)" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="20" y="62" width="590" height="34" rx="8" fill="url(#grad-primary)"/>
  <rect x="20" y="84" width="590" height="12" fill="url(#grad-primary)"/>
  <text x="315" y="86" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)" text-anchor="middle">import_tasks (STATIC)</text>

  <rect x="35" y="105" width="70" height="22" rx="4" fill="var(--primary-dk)"/>
  <text x="70" y="121" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="var(--bg)" text-anchor="middle">STATIC</text>

  <text x="115" y="121" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Processed at playbook parse time (before execution)</text>

  <text x="35" y="148" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--primary-dk)">Syntax:</text>
  <rect x="35" y="155" width="555" height="44" rx="5" fill="var(--primary-pale)"/>
  <text x="50" y="172" font-family="monospace" font-size="12" fill="var(--text-dark)">- import_tasks: tasks/setup.yml</text>
  <text x="50" y="190" font-family="monospace" font-size="12" fill="var(--text-dark)">  vars: { env: prod }</text>

  <text x="35" y="220" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--primary-dk)">Characteristics:</text>
  <text x="35" y="240" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">+ Tags applied to import propagate into imported tasks</text>
  <text x="35" y="258" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">+ Can use --list-tasks and --list-tags to see all tasks</text>
  <text x="35" y="276" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">+ Supports notify handlers in imported tasks</text>
  <text x="35" y="294" font-family="Arial, sans-serif" font-size="12" fill="var(--danger)">- when: is applied to EVERY individual task (not wrapper)</text>
  <text x="35" y="312" font-family="Arial, sans-serif" font-size="12" fill="var(--danger)">- Cannot use variables in the filename (static resolution)</text>
  <text x="35" y="330" font-family="Arial, sans-serif" font-size="12" fill="var(--danger)">- Cannot loop over import_tasks</text>

  <text x="35" y="358" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--primary-dk)">Tag inheritance example:</text>
  <rect x="35" y="365" width="555" height="58" rx="5" fill="var(--primary-pale)"/>
  <text x="50" y="383" font-family="monospace" font-size="11" fill="var(--text-dark)">- import_tasks: tasks/install.yml</text>
  <text x="50" y="400" font-family="monospace" font-size="11" fill="var(--text-dark)">  tags: install     # ALL tasks in install.yml get this tag</text>
  <text x="50" y="417" font-family="monospace" font-size="11" fill="var(--text-muted)">  # ansible-playbook site.yml --tags install  -- runs all</text>

  <!-- include_tasks column -->
  <rect x="630" y="62" width="630" height="370" rx="8" fill="url(#grad-surface)" stroke="var(--ok)" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="630" y="62" width="630" height="34" rx="8" fill="url(#grad-ok)"/>
  <rect x="630" y="84" width="630" height="12" fill="url(#grad-ok)"/>
  <text x="945" y="86" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)" text-anchor="middle">include_tasks (DYNAMIC)</text>

  <rect x="645" y="105" width="80" height="22" rx="4" fill="var(--ok-dk)"/>
  <text x="685" y="121" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="var(--bg)" text-anchor="middle">DYNAMIC</text>

  <text x="735" y="121" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Processed at runtime when that task is reached</text>

  <text x="645" y="148" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--ok-dk)">Syntax:</text>
  <rect x="645" y="155" width="600" height="44" rx="5" fill="var(--ok-pale)"/>
  <text x="660" y="172" font-family="monospace" font-size="12" fill="var(--text-dark)">- include_tasks: "tasks/{{ env }}_setup.yml"</text>
  <text x="660" y="190" font-family="monospace" font-size="12" fill="var(--text-dark)">  vars: { component: nginx }</text>

  <text x="645" y="220" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--ok-dk)">Characteristics:</text>
  <text x="645" y="240" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">+ Can use variables in the filename (resolved at runtime)</text>
  <text x="645" y="258" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">+ Can use loop: to include a file multiple times</text>
  <text x="645" y="276" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">+ when: applies to the include itself (wraps all tasks)</text>
  <text x="645" y="294" font-family="Arial, sans-serif" font-size="12" fill="var(--danger)">- Tags NOT inherited; included tasks invisible to --list-tasks</text>
  <text x="645" y="312" font-family="Arial, sans-serif" font-size="12" fill="var(--danger)">- Cannot target specific tasks with --tags inside include</text>

  <text x="645" y="340" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--ok-dk)">Dynamic include with loop:</text>
  <rect x="645" y="347" width="600" height="78" rx="5" fill="var(--ok-pale)"/>
  <text x="660" y="365" font-family="monospace" font-size="11" fill="var(--text-dark)">- include_tasks: "tasks/{{ item }}.yml"</text>
  <text x="660" y="382" font-family="monospace" font-size="11" fill="var(--text-dark)">  loop:</text>
  <text x="660" y="399" font-family="monospace" font-size="11" fill="var(--text-dark)">    - pre_install</text>
  <text x="660" y="416" font-family="monospace" font-size="11" fill="var(--text-dark)">    - install</text>
  <text x="660" y="433" font-family="monospace" font-size="11" fill="var(--text-dark)">    - post_install</text>

  <!-- Bottom: decision guide + tags -->
  <rect x="20" y="445" width="590" height="80" rx="8" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="1.5"/>
  <text x="35" y="466" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-dk)">When to use import_tasks:</text>
  <text x="35" y="486" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">- You want tag control and --list-tasks visibility</text>
  <text x="35" y="504" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">- Filename is known at write time (no variable in path)</text>
  <text x="35" y="522" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">- You need handler notifications from imported tasks</text>

  <rect x="630" y="445" width="630" height="80" rx="8" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="645" y="466" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-dk)">When to use include_tasks:</text>
  <text x="645" y="486" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">- Filename includes variables resolved at runtime</text>
  <text x="645" y="504" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">- Looping over multiple task files dynamically</text>
  <text x="645" y="522" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">- Conditionally skipping entire task file with when:</text>

  <!-- Bottom tip -->
  <rect x="20" y="537" width="1240" height="38" rx="6" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1"/>
  <text x="35" y="553" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--primary-dk)">Also:</text>
  <text x="80" y="553" font-family="monospace" font-size="12" fill="var(--text-dark)">import_playbook</text>
  <text x="230" y="553" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">statically includes entire playbooks |</text>
  <text x="510" y="553" font-family="monospace" font-size="12" fill="var(--text-dark)">include_role</text>
  <text x="620" y="553" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">dynamically includes a role |</text>
  <text x="820" y="553" font-family="monospace" font-size="12" fill="var(--text-dark)">import_role</text>
  <text x="925" y="553" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">statically includes a role with tag inheritance</text>
  <text x="35" y="568" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">Tags on import_tasks/import_role apply to every child task. Tags on include_tasks apply only to the wrapper - inner tasks need their own tags.</text>
</svg>

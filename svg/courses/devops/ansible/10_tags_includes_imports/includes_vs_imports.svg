<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- Header -->
  <rect x="0" y="0" width="1280" height="52" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="34" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--bg)" text-anchor="middle">Includes vs Imports in Ansible</text>

  <!-- import_tasks column -->
  <rect x="20" y="62" width="590" height="370" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="20" y="62" width="590" height="34" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="20" y="84" width="590" height="12" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="315" y="86" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)" text-anchor="middle">import_tasks (STATIC)</text>

  <rect x="35" y="105" width="70" height="22" rx="6" fill="var(--primary-accent)"/>
  <text x="70" y="121" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="var(--bg)" text-anchor="middle">STATIC</text>

  <text x="115" y="121" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Processed at playbook parse time (before execution)</text>

  <text x="35" y="148" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--primary-accent)">Syntax:</text>
  <rect x="35" y="155" width="555" height="44" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="50" y="172" font-family="monospace" font-size="12" fill="var(--text)">- import_tasks: tasks/setup.yml</text>
  <text x="50" y="190" font-family="monospace" font-size="12" fill="var(--text)">  vars: { env: prod }</text>

  <text x="35" y="220" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--primary-accent)">Characteristics:</text>
  <text x="35" y="240" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">+ Tags applied to import propagate into imported tasks</text>
  <text x="35" y="258" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">+ Can use --list-tasks and --list-tags to see all tasks</text>
  <text x="35" y="276" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">+ Supports notify handlers in imported tasks</text>
  <text x="35" y="294" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-accent)">- when: is applied to EVERY individual task (not wrapper)</text>
  <text x="35" y="312" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-accent)">- Cannot use variables in the filename (static resolution)</text>
  <text x="35" y="330" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-accent)">- Cannot loop over import_tasks</text>

  <text x="35" y="358" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--primary-accent)">Tag inheritance example:</text>
  <rect x="35" y="365" width="555" height="58" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="50" y="383" font-family="monospace" font-size="11" fill="var(--text)">- import_tasks: tasks/install.yml</text>
  <text x="50" y="400" font-family="monospace" font-size="11" fill="var(--text)">  tags: install     # ALL tasks in install.yml get this tag</text>
  <text x="50" y="417" font-family="monospace" font-size="11" fill="var(--text-muted)">  # ansible-playbook site.yml --tags install  -- runs all</text>

  <!-- include_tasks column -->
  <rect x="630" y="62" width="630" height="370" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="630" y="62" width="630" height="34" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="630" y="84" width="630" height="12" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="945" y="86" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)" text-anchor="middle">include_tasks (DYNAMIC)</text>

  <rect x="645" y="105" width="80" height="22" rx="6" fill="var(--ok-accent)"/>
  <text x="685" y="121" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="var(--bg)" text-anchor="middle">DYNAMIC</text>

  <text x="735" y="121" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Processed at runtime when that task is reached</text>

  <text x="645" y="148" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--ok-accent)">Syntax:</text>
  <rect x="645" y="155" width="600" height="44" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="660" y="172" font-family="monospace" font-size="12" fill="var(--text)">- include_tasks: "tasks/{{ env }}_setup.yml"</text>
  <text x="660" y="190" font-family="monospace" font-size="12" fill="var(--text)">  vars: { component: nginx }</text>

  <text x="645" y="220" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--ok-accent)">Characteristics:</text>
  <text x="645" y="240" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">+ Can use variables in the filename (resolved at runtime)</text>
  <text x="645" y="258" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">+ Can use loop: to include a file multiple times</text>
  <text x="645" y="276" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">+ when: applies to the include itself (wraps all tasks)</text>
  <text x="645" y="294" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-accent)">- Tags NOT inherited; included tasks invisible to --list-tasks</text>
  <text x="645" y="312" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-accent)">- Cannot target specific tasks with --tags inside include</text>

  <text x="645" y="340" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--ok-accent)">Dynamic include with loop:</text>
  <rect x="645" y="347" width="600" height="78" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="660" y="365" font-family="monospace" font-size="11" fill="var(--text)">- include_tasks: "tasks/{{ item }}.yml"</text>
  <text x="660" y="382" font-family="monospace" font-size="11" fill="var(--text)">  loop:</text>
  <text x="660" y="399" font-family="monospace" font-size="11" fill="var(--text)">    - pre_install</text>
  <text x="660" y="416" font-family="monospace" font-size="11" fill="var(--text)">    - install</text>
  <text x="660" y="433" font-family="monospace" font-size="11" fill="var(--text)">    - post_install</text>

  <!-- Bottom: decision guide + tags -->
  <rect x="20" y="445" width="590" height="80" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="35" y="466" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-accent)">When to use import_tasks:</text>
  <text x="35" y="486" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">- You want tag control and --list-tasks visibility</text>
  <text x="35" y="504" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">- Filename is known at write time (no variable in path)</text>
  <text x="35" y="522" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">- You need handler notifications from imported tasks</text>

  <rect x="630" y="445" width="630" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="645" y="466" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-accent)">When to use include_tasks:</text>
  <text x="645" y="486" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">- Filename includes variables resolved at runtime</text>
  <text x="645" y="504" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">- Looping over multiple task files dynamically</text>
  <text x="645" y="522" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">- Conditionally skipping entire task file with when:</text>

  <!-- Bottom tip -->
  <rect x="20" y="537" width="1240" height="38" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="35" y="553" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--primary-accent)">Also:</text>
  <text x="80" y="553" font-family="monospace" font-size="12" fill="var(--text)">import_playbook</text>
  <text x="230" y="553" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">statically includes entire playbooks |</text>
  <text x="510" y="553" font-family="monospace" font-size="12" fill="var(--text)">include_role</text>
  <text x="620" y="553" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">dynamically includes a role |</text>
  <text x="820" y="553" font-family="monospace" font-size="12" fill="var(--text)">import_role</text>
  <text x="925" y="553" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">statically includes a role with tag inheritance</text>
  <text x="35" y="568" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">Tags on import_tasks/import_role apply to every child task. Tags on include_tasks apply only to the wrapper - inner tasks need their own tags.</text>
</svg>

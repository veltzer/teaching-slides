<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.726960052005" font-weight="bold" fill="var(--primary-accent)">Ansible Best Practices</text>

  <!-- Row 1 -->
  <rect x="40" y="85.490196078431" width="290" height="250.196078431373" rx="10.664215404617" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="125.294117647059" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.328430809235" font-weight="bold" fill="var(--primary-text)">Project Layout</text>
  <text x="60" y="165.098039215686" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--primary-text)">inventories/</text>
  <text x="60" y="193.529411764706" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--primary-text)">group_vars/</text>
  <text x="60" y="221.960784313725" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--primary-text)">roles/</text>
  <text x="60" y="250.392156862745" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--primary-text)">requirements.yml</text>
  <text x="60" y="278.823529411765" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--primary-text)">ansible.cfg</text>
  <text x="60" y="307.254901960784" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--primary-text)">site.yml</text>

  <rect x="355" y="85.490196078431" width="290" height="250.196078431373" rx="10.664215404617" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="125.294117647059" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.328430809235" font-weight="bold" fill="var(--ok-text)">Naming</text>
  <text x="375" y="165.098039215686" font-family="Arial, sans-serif" font-size="15.996323106926" fill="var(--ok-text)">Tasks: verb + noun</text>
  <text x="375" y="199.21568627451" font-family="Arial, sans-serif" font-size="15.996323106926" fill="var(--ok-text)">Vars: snake_case</text>
  <text x="375" y="233.333333333333" font-family="Arial, sans-serif" font-size="15.996323106926" fill="var(--ok-text)">Prefix vars by role</text>
  <text x="375" y="267.450980392157" font-family="Arial, sans-serif" font-size="15.996323106926" fill="var(--ok-text)">One role per service</text>
  <text x="375" y="301.56862745098" font-family="Arial, sans-serif" font-size="15.996323106926" fill="var(--ok-text)">Pin collections</text>

  <rect x="670" y="85.490196078431" width="290" height="250.196078431373" rx="10.664215404617" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="815" y="125.294117647059" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.328430809235" font-weight="bold" fill="var(--info-text)">Idempotency</text>
  <text x="690" y="165.098039215686" font-family="Arial, sans-serif" font-size="15.996323106926" fill="var(--info-text)">Declarative modules</text>
  <text x="690" y="199.21568627451" font-family="Arial, sans-serif" font-size="15.996323106926" fill="var(--info-text)">state: present/absent</text>
  <text x="690" y="233.333333333333" font-family="Arial, sans-serif" font-size="15.996323106926" fill="var(--info-text)">creates / removes</text>
  <text x="690" y="267.450980392157" font-family="Arial, sans-serif" font-size="15.996323106926" fill="var(--info-text)">changed_when: false</text>
  <text x="690" y="301.56862745098" font-family="Arial, sans-serif" font-size="15.996323106926" fill="var(--info-text)">Test --check --diff</text>

  <rect x="985" y="85.490196078431" width="255" height="250.196078431373" rx="10.664215404617" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1112" y="125.294117647059" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.328430809235" font-weight="bold" fill="var(--danger-text)">Vault</text>
  <text x="1005" y="165.098039215686" font-family="Arial, sans-serif" font-size="15.996323106926" fill="var(--danger-text)">All secrets encrypted</text>
  <text x="1005" y="199.21568627451" font-family="Arial, sans-serif" font-size="15.996323106926" fill="var(--danger-text)">vault-id per env</text>
  <text x="1005" y="233.333333333333" font-family="Arial, sans-serif" font-size="15.996323106926" fill="var(--danger-text)">Rotate passwords</text>
  <text x="1005" y="267.450980392157" font-family="Arial, sans-serif" font-size="15.996323106926" fill="var(--danger-text)">Never commit keys</text>
  <text x="1005" y="301.56862745098" font-family="Arial, sans-serif" font-size="15.996323106926" fill="var(--danger-text)">Gitignore .vault_pass</text>

  <!-- Row 2 -->
  <rect x="40" y="369.803921568627" width="595" height="250.196078431373" rx="10.664215404617" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="337" y="409.607843137255" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.328430809235" font-weight="bold" fill="var(--warn-text)">Testing with Molecule</text>
  <text x="60" y="449.411764705882" font-family="Courier New, monospace" font-size="15.996323106926" fill="var(--warn-text)">molecule test</text>
  <text x="60" y="483.529411764706" font-family="Courier New, monospace" font-size="15.996323106926" fill="var(--warn-text)">molecule converge</text>
  <text x="60" y="517.647058823529" font-family="Courier New, monospace" font-size="15.996323106926" fill="var(--warn-text)">molecule verify</text>
  <text x="60" y="551.764705882353" font-family="Courier New, monospace" font-size="15.996323106926" fill="var(--warn-text)">molecule lint</text>
  <text x="60" y="591.56862745098" font-family="Arial, sans-serif" font-size="14.929901566464" fill="var(--warn-text)">Cycle: lint to converge to verify to destroy</text>

  <rect x="660" y="369.803921568627" width="580" height="250.196078431373" rx="10.664215404617" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="950" y="409.607843137255" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.328430809235" font-weight="bold" fill="var(--text)">CI/CD Checks</text>
  <text x="680" y="449.411764705882" font-family="Courier New, monospace" font-size="15.996323106926" fill="var(--text)">ansible-lint site.yml</text>
  <text x="680" y="483.529411764706" font-family="Courier New, monospace" font-size="15.996323106926" fill="var(--text)">yamllint .</text>
  <text x="680" y="517.647058823529" font-family="Courier New, monospace" font-size="15.996323106926" fill="var(--text)">molecule test</text>
  <text x="680" y="551.764705882353" font-family="Courier New, monospace" font-size="15.996323106926" fill="var(--text)">ansible-playbook --check</text>
  <text x="680" y="591.56862745098" font-family="Arial, sans-serif" font-size="14.929901566464" font-style="italic" fill="var(--text-muted)">If untested, assume broken</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- Header -->
  <rect x="0" y="0" width="1280" height="52" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="34" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--bg)" text-anchor="middle">Ansible Best Practices</text>

  <!-- COL 1: Project Structure -->
  <rect x="20" y="62" width="250" height="380" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="20" y="62" width="250" height="30" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="20" y="80" width="250" height="12" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="145" y="82" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)" text-anchor="middle">Project Structure</text>
  <text x="35" y="110" font-family="monospace" font-size="10" fill="var(--text)">project/</text>
  <text x="35" y="126" font-family="monospace" font-size="10" fill="var(--text)">  ansible.cfg</text>
  <text x="35" y="142" font-family="monospace" font-size="10" fill="var(--text)">  requirements.yml</text>
  <text x="35" y="158" font-family="monospace" font-size="10" fill="var(--text)">  site.yml</text>
  <text x="35" y="174" font-family="monospace" font-size="10" fill="var(--primary-accent)">  inventories/</text>
  <text x="35" y="190" font-family="monospace" font-size="10" fill="var(--text)">    production/</text>
  <text x="35" y="206" font-family="monospace" font-size="10" fill="var(--text)">      hosts.yml</text>
  <text x="35" y="222" font-family="monospace" font-size="10" fill="var(--text)">      group_vars/</text>
  <text x="35" y="238" font-family="monospace" font-size="10" fill="var(--ok-accent)">        all/vars.yml</text>
  <text x="35" y="254" font-family="monospace" font-size="10" fill="var(--danger-accent)">        all/vault.yml</text>
  <text x="35" y="270" font-family="monospace" font-size="10" fill="var(--primary-accent)">  roles/</text>
  <text x="35" y="286" font-family="monospace" font-size="10" fill="var(--text)">    webserver/</text>
  <text x="35" y="302" font-family="monospace" font-size="10" fill="var(--text)">      tasks/main.yml</text>
  <text x="35" y="318" font-family="monospace" font-size="10" fill="var(--text)">      handlers/main.yml</text>
  <text x="35" y="334" font-family="monospace" font-size="10" fill="var(--text)">      defaults/main.yml</text>
  <text x="35" y="350" font-family="monospace" font-size="10" fill="var(--text)">      vars/main.yml</text>
  <text x="35" y="366" font-family="monospace" font-size="10" fill="var(--text)">      templates/</text>
  <text x="35" y="382" font-family="monospace" font-size="10" fill="var(--text)">      files/</text>
  <text x="35" y="398" font-family="monospace" font-size="10" fill="var(--text)">      meta/main.yml</text>
  <text x="35" y="414" font-family="monospace" font-size="10" fill="var(--text-muted)">      molecule/</text>
  <text x="35" y="430" font-family="monospace" font-size="10" fill="var(--text-muted)">        default/</text>

  <!-- COL 2: Naming Conventions -->
  <rect x="285" y="62" width="270" height="190" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="285" y="62" width="270" height="30" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="285" y="80" width="270" height="12" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="420" y="82" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)" text-anchor="middle">Naming Conventions</text>
  <text x="300" y="112" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="var(--ok-accent)">Tasks: verb + noun + detail</text>
  <text x="300" y="130" font-family="monospace" font-size="11" fill="var(--text-muted)">- name: Install nginx package</text>
  <text x="300" y="148" font-family="monospace" font-size="11" fill="var(--text-muted)">- name: Configure nginx vhosts</text>
  <text x="300" y="166" font-family="monospace" font-size="11" fill="var(--text-muted)">- name: Enable nginx service</text>
  <line x1="300" y1="178" x2="540" y2="178" stroke="var(--border)" stroke-width="1"/>
  <text x="300" y="196" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="var(--ok-accent)">Variables: lowercase_with_underscores</text>
  <text x="300" y="214" font-family="monospace" font-size="11" fill="var(--text)">nginx_port: 80</text>
  <text x="300" y="231" font-family="monospace" font-size="11" fill="var(--text)">app_db_password: !vault |</text>
  <text x="300" y="248" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">Prefix with role name to avoid collisions</text>

  <!-- COL 2: Idempotency -->
  <rect x="285" y="265" width="270" height="180" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="285" y="265" width="270" height="30" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="285" y="283" width="270" height="12" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="420" y="285" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)" text-anchor="middle">Idempotency Rules</text>
  <text x="300" y="316" font-family="Arial, sans-serif" font-size="11" fill="var(--text)">+ Prefer declarative modules over shell/command</text>
  <text x="300" y="334" font-family="Arial, sans-serif" font-size="11" fill="var(--text)">+ Use state: present/absent explicitly</text>
  <text x="300" y="352" font-family="Arial, sans-serif" font-size="11" fill="var(--text)">+ Use creates:/removes: with shell/command</text>
  <text x="300" y="370" font-family="Arial, sans-serif" font-size="11" fill="var(--text)">+ Add changed_when: false to read-only cmds</text>
  <text x="300" y="388" font-family="Arial, sans-serif" font-size="11" fill="var(--text)">+ Test with --check --diff before applying</text>
  <text x="300" y="406" font-family="Arial, sans-serif" font-size="11" fill="var(--danger-accent)">- Never use shell: for tasks modules can do</text>
  <text x="300" y="424" font-family="Arial, sans-serif" font-size="11" fill="var(--danger-accent)">- Never ignore idempotency errors silently</text>

  <!-- COL 3: Vault Usage -->
  <rect x="570" y="62" width="280" height="175" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="570" y="62" width="280" height="30" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="570" y="80" width="280" height="12" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="710" y="82" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)" text-anchor="middle">Vault Usage</text>
  <text x="585" y="112" font-family="Arial, sans-serif" font-size="11" fill="var(--text)">+ ALL secrets in vault-encrypted files</text>
  <text x="585" y="130" font-family="Arial, sans-serif" font-size="11" fill="var(--text)">+ Separate vars from vault (vars ref vault)</text>
  <text x="585" y="148" font-family="monospace" font-size="11" fill="var(--text)">  db_pass: "{{ vault_db_pass }}"</text>
  <text x="585" y="166" font-family="Arial, sans-serif" font-size="11" fill="var(--text)">+ Use vault-id per environment</text>
  <text x="585" y="184" font-family="Arial, sans-serif" font-size="11" fill="var(--text)">+ Rotate vault passwords regularly</text>
  <text x="585" y="202" font-family="Arial, sans-serif" font-size="11" fill="var(--danger-accent)">- Never commit .vault_pass to Git</text>
  <text x="585" y="220" font-family="Arial, sans-serif" font-size="11" fill="var(--danger-accent)">- Never use plaintext for any credential</text>
  <text x="585" y="235" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">Add to .gitignore: .vault_pass, *.key</text>

  <!-- COL 3: Testing with Molecule -->
  <rect x="570" y="250" width="280" height="198" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="570" y="250" width="280" height="30" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="570" y="268" width="280" height="12" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="710" y="270" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)" text-anchor="middle">Testing with Molecule</text>
  <text x="585" y="302" font-family="monospace" font-size="11" fill="var(--text)">molecule init role myrole</text>
  <text x="585" y="319" font-family="monospace" font-size="11" fill="var(--text)">molecule test      # full test cycle</text>
  <text x="585" y="336" font-family="monospace" font-size="11" fill="var(--text)">molecule converge  # run role</text>
  <text x="585" y="353" font-family="monospace" font-size="11" fill="var(--text)">molecule verify    # run tests</text>
  <text x="585" y="370" font-family="monospace" font-size="11" fill="var(--text)">molecule lint      # lint checks</text>
  <line x1="585" y1="382" x2="835" y2="382" stroke="var(--border)" stroke-width="1"/>
  <text x="585" y="400" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="var(--warn-accent)">Test cycle order:</text>
  <text x="585" y="418" font-family="Arial, sans-serif" font-size="11" fill="var(--text)">lint -&gt; create -&gt; converge -&gt; idempotency</text>
  <text x="585" y="436" font-family="Arial, sans-serif" font-size="11" fill="var(--text)">-&gt; verify -&gt; destroy</text>
  <text x="585" y="453" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">Drivers: docker, podman, vagrant, delegated</text>

  <!-- COL 4: Role Best Practices -->
  <rect x="865" y="62" width="395" height="195" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="865" y="62" width="395" height="30" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="865" y="80" width="395" height="12" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1062" y="82" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)" text-anchor="middle">Role Best Practices</text>
  <text x="880" y="112" font-family="Arial, sans-serif" font-size="11" fill="var(--text)">+ One role per service/application component</text>
  <text x="880" y="130" font-family="Arial, sans-serif" font-size="11" fill="var(--text)">+ Put overridable defaults in defaults/main.yml</text>
  <text x="880" y="148" font-family="Arial, sans-serif" font-size="11" fill="var(--text)">+ Prefix all variables with role name: nginx_port</text>
  <text x="880" y="166" font-family="Arial, sans-serif" font-size="11" fill="var(--text)">+ Use meta/main.yml to declare role dependencies</text>
  <text x="880" y="184" font-family="Arial, sans-serif" font-size="11" fill="var(--text)">+ Include molecule/ tests in every role</text>
  <text x="880" y="202" font-family="Arial, sans-serif" font-size="11" fill="var(--text)">+ Pin collection versions in requirements.yml</text>
  <text x="880" y="220" font-family="Arial, sans-serif" font-size="11" fill="var(--danger-accent)">- Avoid role-to-role variable coupling (use interfaces)</text>
  <text x="880" y="238" font-family="Arial, sans-serif" font-size="11" fill="var(--danger-accent)">- Don't put secrets in roles - pass from inventory</text>
  <text x="880" y="254" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">Publish reusable roles to Ansible Galaxy</text>

  <!-- COL 4: ansible.cfg settings -->
  <rect x="865" y="270" width="395" height="180" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="865" y="270" width="395" height="30" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="865" y="288" width="395" height="12" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1062" y="290" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)" text-anchor="middle">Recommended ansible.cfg</text>
  <text x="880" y="322" font-family="monospace" font-size="11" fill="var(--text)">[defaults]</text>
  <text x="880" y="339" font-family="monospace" font-size="11" fill="var(--text)">inventory           = inventories/production</text>
  <text x="880" y="356" font-family="monospace" font-size="11" fill="var(--text)">roles_path          = roles</text>
  <text x="880" y="373" font-family="monospace" font-size="11" fill="var(--text)">stdout_callback     = yaml</text>
  <text x="880" y="390" font-family="monospace" font-size="11" fill="var(--text)">callback_whitelist  = profile_tasks</text>
  <text x="880" y="407" font-family="monospace" font-size="11" fill="var(--text)">retry_files_enabled = False</text>
  <text x="880" y="424" font-family="monospace" font-size="11" fill="var(--text)">[ssh_connection]</text>
  <text x="880" y="441" font-family="monospace" font-size="11" fill="var(--text)">pipelining          = True</text>
  <text x="880" y="458" font-family="monospace" font-size="11" fill="var(--text-muted)">ssh_args = -o ControlMaster=auto -o ControlPersist=60s</text>

  <!-- Bottom bar -->
  <rect x="20" y="460" width="1240" height="50" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="35" y="479" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--warn-accent)">CI/CD Integration:</text>
  <text x="180" y="479" font-family="monospace" font-size="12" fill="var(--text)">ansible-lint site.yml</text>
  <text x="360" y="479" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">in every PR check |</text>
  <text x="520" y="479" font-family="monospace" font-size="12" fill="var(--text)">yamllint</text>
  <text x="610" y="479" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">for YAML style |</text>
  <text x="730" y="479" font-family="monospace" font-size="12" fill="var(--text)">molecule test</text>
  <text x="855" y="479" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">per role |</text>
  <text x="930" y="479" font-family="monospace" font-size="12" fill="var(--text)">--check --diff</text>
  <text x="1060" y="479" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">dry-run in staging</text>
  <text x="35" y="501" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Golden rule: if it is not tested it is broken. Run molecule in CI. Use --check in staging pipeline before production apply.</text>
</svg>

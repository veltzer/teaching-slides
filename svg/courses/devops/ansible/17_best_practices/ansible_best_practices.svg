<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <!-- Row 1 -->
  <rect x="40" y="40" width="290" height="271.489361702128" rx="11.108746793367" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="83.191489361703" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.217493586735" font-weight="bold" fill="var(--primary-text)">Project Layout</text>
  <text x="60" y="126.382978723404" font-family="Courier New, monospace" font-size="15.552245510714" fill="var(--primary-text)">inventories/</text>
  <text x="60" y="157.234042553192" font-family="Courier New, monospace" font-size="15.552245510714" fill="var(--primary-text)">group_vars/</text>
  <text x="60" y="188.085106382978" font-family="Courier New, monospace" font-size="15.552245510714" fill="var(--primary-text)">roles/</text>
  <text x="60" y="218.936170212766" font-family="Courier New, monospace" font-size="15.552245510714" fill="var(--primary-text)">requirements.yml</text>
  <text x="60" y="249.787234042554" font-family="Courier New, monospace" font-size="15.552245510714" fill="var(--primary-text)">ansible.cfg</text>
  <text x="60" y="280.63829787234" font-family="Courier New, monospace" font-size="15.552245510714" fill="var(--primary-text)">site.yml</text>

  <rect x="355" y="40" width="290" height="271.489361702128" rx="11.108746793367" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="83.191489361703" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.217493586735" font-weight="bold" fill="var(--ok-text)">Naming</text>
  <text x="375" y="126.382978723404" font-family="Arial, sans-serif" font-size="16.663120190051" fill="var(--ok-text)">Tasks: verb + noun</text>
  <text x="375" y="163.404255319149" font-family="Arial, sans-serif" font-size="16.663120190051" fill="var(--ok-text)">Vars: snake_case</text>
  <text x="375" y="200.425531914894" font-family="Arial, sans-serif" font-size="16.663120190051" fill="var(--ok-text)">Prefix vars by role</text>
  <text x="375" y="237.446808510639" font-family="Arial, sans-serif" font-size="16.663120190051" fill="var(--ok-text)">One role per service</text>
  <text x="375" y="274.468085106383" font-family="Arial, sans-serif" font-size="16.663120190051" fill="var(--ok-text)">Pin collections</text>

  <rect x="670" y="40" width="290" height="271.489361702128" rx="11.108746793367" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="815" y="83.191489361703" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.217493586735" font-weight="bold" fill="var(--info-text)">Idempotency</text>
  <text x="690" y="126.382978723404" font-family="Arial, sans-serif" font-size="16.663120190051" fill="var(--info-text)">Declarative modules</text>
  <text x="690" y="163.404255319149" font-family="Arial, sans-serif" font-size="16.663120190051" fill="var(--info-text)">state: present/absent</text>
  <text x="690" y="200.425531914894" font-family="Arial, sans-serif" font-size="16.663120190051" fill="var(--info-text)">creates / removes</text>
  <text x="690" y="237.446808510639" font-family="Arial, sans-serif" font-size="16.663120190051" fill="var(--info-text)">changed_when: false</text>
  <text x="690" y="274.468085106383" font-family="Arial, sans-serif" font-size="16.663120190051" fill="var(--info-text)">Test --check --diff</text>

  <rect x="985" y="40" width="255" height="271.489361702128" rx="11.108746793367" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1112" y="83.191489361703" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.217493586735" font-weight="bold" fill="var(--danger-text)">Vault</text>
  <text x="1005" y="126.382978723404" font-family="Arial, sans-serif" font-size="16.663120190051" fill="var(--danger-text)">All secrets encrypted</text>
  <text x="1005" y="163.404255319149" font-family="Arial, sans-serif" font-size="16.663120190051" fill="var(--danger-text)">vault-id per env</text>
  <text x="1005" y="200.425531914894" font-family="Arial, sans-serif" font-size="16.663120190051" fill="var(--danger-text)">Rotate passwords</text>
  <text x="1005" y="237.446808510639" font-family="Arial, sans-serif" font-size="16.663120190051" fill="var(--danger-text)">Never commit keys</text>
  <text x="1005" y="274.468085106383" font-family="Arial, sans-serif" font-size="16.663120190051" fill="var(--danger-text)">Gitignore .vault_pass</text>

  <!-- Row 2 -->
  <rect x="40" y="348.510638297872" width="595" height="271.489361702128" rx="11.108746793367" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="337" y="391.702127659575" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.217493586735" font-weight="bold" fill="var(--warn-text)">Testing with Molecule</text>
  <text x="60" y="434.893617021276" font-family="Courier New, monospace" font-size="16.663120190051" fill="var(--warn-text)">molecule test</text>
  <text x="60" y="471.914893617022" font-family="Courier New, monospace" font-size="16.663120190051" fill="var(--warn-text)">molecule converge</text>
  <text x="60" y="508.936170212766" font-family="Courier New, monospace" font-size="16.663120190051" fill="var(--warn-text)">molecule verify</text>
  <text x="60" y="545.957446808511" font-family="Courier New, monospace" font-size="16.663120190051" fill="var(--warn-text)">molecule lint</text>
  <text x="60" y="589.148936170212" font-family="Arial, sans-serif" font-size="15.552245510714" fill="var(--warn-text)">Cycle: lint to converge to verify to destroy</text>

  <rect x="660" y="348.510638297872" width="580" height="271.489361702128" rx="11.108746793367" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="950" y="391.702127659575" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.217493586735" font-weight="bold" fill="var(--text)">CI/CD Checks</text>
  <text x="680" y="434.893617021276" font-family="Courier New, monospace" font-size="16.663120190051" fill="var(--text)">ansible-lint site.yml</text>
  <text x="680" y="471.914893617022" font-family="Courier New, monospace" font-size="16.663120190051" fill="var(--text)">yamllint .</text>
  <text x="680" y="508.936170212766" font-family="Courier New, monospace" font-size="16.663120190051" fill="var(--text)">molecule test</text>
  <text x="680" y="545.957446808511" font-family="Courier New, monospace" font-size="16.663120190051" fill="var(--text)">ansible-playbook --check</text>
  <text x="680" y="589.148936170212" font-family="Arial, sans-serif" font-size="15.552245510714" font-style="italic" fill="var(--text-muted)">If untested, assume broken</text>
</svg>

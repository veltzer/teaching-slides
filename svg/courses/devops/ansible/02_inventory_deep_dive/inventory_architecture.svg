<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- Top header bar -->
  <rect x="0" y="0" width="1280" height="52" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="34" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--bg)" text-anchor="middle">Ansible Inventory Architecture</text>

  <!-- === LEFT COLUMN: Inventory Formats === -->
  <!-- INI Format Box -->
  <rect x="30" y="70" width="270" height="170" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="30" y="70" width="270" height="34" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="30" y="90" width="270" height="14" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="165" y="93" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">INI Format</text>
  <text x="45" y="122" font-family="monospace" font-size="12" fill="var(--text)">[webservers]</text>
  <text x="45" y="140" font-family="monospace" font-size="12" fill="var(--text-muted)">web01 ansible_host=10.0.0.1</text>
  <text x="45" y="158" font-family="monospace" font-size="12" fill="var(--text-muted)">web02 ansible_host=10.0.0.2</text>
  <text x="45" y="176" font-family="monospace" font-size="12" fill="var(--text)">[webservers:vars]</text>
  <text x="45" y="194" font-family="monospace" font-size="12" fill="var(--text-muted)">ansible_user=admin</text>
  <text x="45" y="212" font-family="monospace" font-size="12" fill="var(--text-muted)">http_port=80</text>
  <text x="45" y="230" font-family="monospace" font-size="12" fill="var(--text)">[prod:children]</text>

  <!-- YAML Format Box -->
  <rect x="30" y="260" width="270" height="175" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="30" y="260" width="270" height="34" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="30" y="280" width="270" height="14" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="165" y="283" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">YAML Format</text>
  <text x="45" y="312" font-family="monospace" font-size="12" fill="var(--text)">all:</text>
  <text x="45" y="330" font-family="monospace" font-size="12" fill="var(--text-muted)">  hosts:</text>
  <text x="45" y="348" font-family="monospace" font-size="12" fill="var(--text-muted)">    web01:</text>
  <text x="45" y="366" font-family="monospace" font-size="12" fill="var(--text-muted)">      ansible_host: 10.0.0.1</text>
  <text x="45" y="384" font-family="monospace" font-size="12" fill="var(--text-muted)">  children:</text>
  <text x="45" y="402" font-family="monospace" font-size="12" fill="var(--text-muted)">    webservers:</text>
  <text x="45" y="420" font-family="monospace" font-size="12" fill="var(--text-muted)">      hosts:</text>

  <!-- === CENTER COLUMN: Groups and Host/Group Vars === -->
  <!-- Groups box -->
  <rect x="340" y="70" width="270" height="175" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="340" y="70" width="270" height="34" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="340" y="90" width="270" height="14" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="475" y="93" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">Groups and Nesting</text>
  <!-- Group hierarchy diagram -->
  <rect x="380" y="116" width="80" height="28" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="420" y="135" font-family="Arial, sans-serif" font-size="12" fill="var(--bg)" text-anchor="middle">all</text>
  <line x1="420" y1="144" x2="380" y2="165" stroke="var(--text-muted)" stroke-width="1.5"/>
  <line x1="420" y1="144" x2="475" y2="165" stroke="var(--text-muted)" stroke-width="1.5"/>
  <line x1="420" y1="144" x2="560" y2="165" stroke="var(--text-muted)" stroke-width="1.5"/>
  <rect x="345" y="165" width="80" height="26" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="385" y="183" font-family="Arial, sans-serif" font-size="11" fill="var(--primary-accent)" text-anchor="middle">production</text>
  <rect x="438" y="165" width="80" height="26" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="478" y="183" font-family="Arial, sans-serif" font-size="11" fill="var(--primary-accent)" text-anchor="middle">staging</text>
  <rect x="530" y="165" width="70" height="26" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="565" y="183" font-family="Arial, sans-serif" font-size="11" fill="var(--primary-accent)" text-anchor="middle">ungrouped</text>
  <line x1="385" y1="191" x2="370" y2="212" stroke="var(--text-muted)" stroke-width="1.5"/>
  <line x1="385" y1="191" x2="420" y2="212" stroke="var(--text-muted)" stroke-width="1.5"/>
  <rect x="345" y="212" width="58" height="24" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="374" y="229" font-family="Arial, sans-serif" font-size="10" fill="var(--warn-accent)" text-anchor="middle">webservers</text>
  <rect x="410" y="212" width="58" height="24" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="439" y="229" font-family="Arial, sans-serif" font-size="10" fill="var(--warn-accent)" text-anchor="middle">dbservers</text>
  <text x="475" y="238" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)" font-style="italic">:children keyword</text>

  <!-- Host Vars box -->
  <rect x="340" y="260" width="270" height="175" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="340" y="260" width="270" height="34" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="340" y="280" width="270" height="14" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="475" y="283" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">host_vars / group_vars</text>
  <text x="355" y="313" font-family="monospace" font-size="11" fill="var(--text)">group_vars/</text>
  <text x="355" y="330" font-family="monospace" font-size="11" fill="var(--text-muted)">  all.yml         # all hosts</text>
  <text x="355" y="347" font-family="monospace" font-size="11" fill="var(--text-muted)">  webservers.yml  # group</text>
  <text x="355" y="364" font-family="monospace" font-size="11" fill="var(--text)">host_vars/</text>
  <text x="355" y="381" font-family="monospace" font-size="11" fill="var(--text-muted)">  web01.yml       # one host</text>
  <text x="355" y="398" font-family="monospace" font-size="11" fill="var(--text-muted)">  web01/          # directory</text>
  <text x="355" y="415" font-family="monospace" font-size="11" fill="var(--text-muted)">    vars.yml</text>
  <text x="355" y="427" font-family="monospace" font-size="11" fill="var(--text-muted)">    vault.yml</text>

  <!-- === RIGHT COLUMN: Dynamic Inventory and Connection Vars === -->
  <!-- Dynamic Inventory box -->
  <rect x="650" y="70" width="290" height="200" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="650" y="70" width="290" height="34" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="650" y="90" width="290" height="14" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="795" y="93" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">Dynamic Inventory Plugins</text>
  <!-- Plugin rows -->
  <rect x="665" y="114" width="255" height="24" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="680" y="131" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--primary-accent)">amazon.aws.aws_ec2</text>
  <text x="870" y="131" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">AWS EC2</text>
  <rect x="665" y="143" width="255" height="24" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="680" y="160" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--ok-accent)">azure.azcollection.azure_rm</text>
  <text x="680" y="175" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">  Azure VMs</text>
  <rect x="665" y="182" width="255" height="24" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="680" y="199" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--info-accent)">google.cloud.gcp_compute</text>
  <text x="870" y="199" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">GCP</text>
  <rect x="665" y="211" width="255" height="24" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="680" y="228" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--warn-accent)">community.vmware.vmware_vm</text>
  <rect x="665" y="240" width="255" height="24" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="680" y="257" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--ok-accent)">openstack.cloud.openstack</text>

  <!-- Connection Variables box -->
  <rect x="650" y="285" width="290" height="155" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="650" y="285" width="290" height="34" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="650" y="305" width="290" height="14" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="795" y="308" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">Connection Variables</text>
  <text x="665" y="338" font-family="monospace" font-size="11" fill="var(--text)">ansible_host</text>
  <text x="800" y="338" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">IP/hostname override</text>
  <text x="665" y="356" font-family="monospace" font-size="11" fill="var(--text)">ansible_port</text>
  <text x="800" y="356" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">SSH port (default 22)</text>
  <text x="665" y="374" font-family="monospace" font-size="11" fill="var(--text)">ansible_user</text>
  <text x="800" y="374" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Remote user</text>
  <text x="665" y="392" font-family="monospace" font-size="11" fill="var(--text)">ansible_password</text>
  <text x="800" y="392" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">SSH password</text>
  <text x="665" y="410" font-family="monospace" font-size="11" fill="var(--text)">ansible_ssh_private_key_file</text>
  <text x="665" y="428" font-family="monospace" font-size="11" fill="var(--text)">ansible_connection</text>
  <text x="800" y="428" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">ssh/local/docker</text>

  <!-- Bottom bar: validation commands -->
  <rect x="30" y="455" width="910" height="48" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="50" y="473" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--text)">Validation Commands:</text>
  <text x="50" y="492" font-family="monospace" font-size="12" fill="var(--primary-accent)">ansible-inventory --list -i inventory/</text>
  <text x="340" y="492" font-family="monospace" font-size="12" fill="var(--ok-accent)">ansible all -m ping --list-hosts</text>
  <text x="620" y="492" font-family="monospace" font-size="12" fill="var(--info-accent)">ansible-inventory --graph</text>

  <!-- Right: quick tip -->
  <rect x="960" y="70" width="290" height="430" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="960" y="70" width="290" height="34" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="960" y="90" width="290" height="14" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1105" y="93" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">Key Concepts</text>
  <text x="975" y="125" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-accent)">Inventory Sources</text>
  <text x="975" y="145" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">- Single file (INI or YAML)</text>
  <text x="975" y="163" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">- Directory of files</text>
  <text x="975" y="181" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">- Dynamic plugin script</text>
  <text x="975" y="199" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">- Multiple sources combined</text>
  <line x1="975" y1="212" x2="1235" y2="212" stroke="var(--primary-border)" stroke-width="1"/>
  <text x="975" y="232" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-accent)">Variable Precedence</text>
  <text x="975" y="252" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">1. host_vars (highest)</text>
  <text x="975" y="270" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">2. group_vars (child group)</text>
  <text x="975" y="288" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">3. group_vars (parent group)</text>
  <text x="975" y="306" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">4. group_vars/all</text>
  <line x1="975" y1="319" x2="1235" y2="319" stroke="var(--primary-border)" stroke-width="1"/>
  <text x="975" y="339" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-accent)">Ranges in INI</text>
  <text x="975" y="359" font-family="monospace" font-size="12" fill="var(--text)">web[01:10]</text>
  <text x="975" y="377" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">  expands to web01..web10</text>
  <text x="975" y="395" font-family="monospace" font-size="12" fill="var(--text)">db-[a:d]</text>
  <text x="975" y="413" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">  expands to db-a..db-d</text>
  <line x1="975" y1="426" x2="1235" y2="426" stroke="var(--primary-border)" stroke-width="1"/>
  <text x="975" y="446" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-accent)">ansible.cfg Reference</text>
  <text x="975" y="466" font-family="monospace" font-size="12" fill="var(--text)">[defaults]</text>
  <text x="975" y="484" font-family="monospace" font-size="12" fill="var(--text)">inventory = ./inventory/</text>
</svg>

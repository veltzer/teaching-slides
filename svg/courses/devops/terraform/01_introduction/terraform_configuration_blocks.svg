<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Outer border -->
  <rect x="24" y="24" width="1232" height="672" rx="12" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="3" filter="url(#shadow)"/>
  <rect x="24" y="24" width="1232" height="50" rx="12" fill="url(#grad-accent)"/>
  <rect x="24" y="55" width="1232" height="19" fill="url(#grad-accent)"/>
  <text x="640" y="56" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">Terraform Config File (.tf)</text>
  <!-- Row 1 -->
  <rect x="71" y="104" width="545" height="114" rx="10" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="344" y="152" text-anchor="middle" font-size="20" font-weight="bold" fill="#1565c0">terraform { }</text>
  <text x="344" y="190" text-anchor="middle" font-size="16" fill="#555">(settings)</text>
  <rect x="664" y="104" width="545" height="114" rx="10" fill="url(#grad-surface)" stroke="#2e7d32" stroke-width="2" filter="url(#shadow)"/>
  <text x="936" y="152" text-anchor="middle" font-size="20" font-weight="bold" fill="#2e7d32">provider "aws" { }</text>
  <text x="936" y="190" text-anchor="middle" font-size="16" fill="#555">(cloud config)</text>
  <!-- Row 2 -->
  <rect x="71" y="246" width="545" height="114" rx="10" fill="url(#grad-surface)" stroke="#f57c00" stroke-width="2" filter="url(#shadow)"/>
  <text x="344" y="294" text-anchor="middle" font-size="20" font-weight="bold" fill="#e65100">resource "..." { }</text>
  <text x="344" y="332" text-anchor="middle" font-size="16" fill="#555">(infrastructure)</text>
  <rect x="664" y="246" width="545" height="114" rx="10" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="936" y="294" text-anchor="middle" font-size="20" font-weight="bold" fill="#1565c0">variable "..." { }</text>
  <text x="936" y="332" text-anchor="middle" font-size="16" fill="#555">(inputs)</text>
  <!-- Row 3 -->
  <rect x="71" y="388" width="545" height="114" rx="10" fill="url(#grad-surface)" stroke="#2e7d32" stroke-width="2" filter="url(#shadow)"/>
  <text x="344" y="436" text-anchor="middle" font-size="20" font-weight="bold" fill="#2e7d32">data "..." { }</text>
  <text x="344" y="474" text-anchor="middle" font-size="16" fill="#555">(queries)</text>
  <rect x="664" y="388" width="545" height="114" rx="10" fill="url(#grad-surface)" stroke="#f57c00" stroke-width="2" filter="url(#shadow)"/>
  <text x="936" y="436" text-anchor="middle" font-size="20" font-weight="bold" fill="#e65100">output "..." { }</text>
  <text x="936" y="474" text-anchor="middle" font-size="16" fill="#555">(results)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="60.669331710321" rx="7.505906929764" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="77.615175141872" width="1200" height="23.054457421953" fill="url(#grad-primary)" rx="7.505906929764" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="78.82848077057" text-anchor="middle" font-size="23.917070494132" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Terraform Config File (.tf)</text>
  <rect x="85.779221" y="137.071052202601" width="530.844052" height="138.32629325146" rx="7.505906929764" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="351.688312" y="195.313772655527" text-anchor="middle" font-size="21.742860236031" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">terraform { }</text>
  <text x="351.688312" y="241.42268890529" text-anchor="middle" font-size="17.394188353844" fill="var(--text-muted)" font-family="Arial, sans-serif">(settings)</text>
  <rect x="663.376623" y="137.071052202601" width="530.844052" height="138.32629325146" rx="7.505906929764" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="928.311688" y="195.313772655527" text-anchor="middle" font-size="21.742860236031" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">provider "aws" { }</text>
  <text x="928.311688" y="241.42268890529" text-anchor="middle" font-size="17.394188353844" fill="var(--text-muted)" font-family="Arial, sans-serif">(cloud config)</text>
  <rect x="85.779221" y="309.372454688946" width="530.844052" height="138.32629325146" rx="7.505906929764" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="351.688312" y="367.615026120978" text-anchor="middle" font-size="21.742860236031" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">resource "..." { }</text>
  <text x="351.688312" y="413.723790538131" text-anchor="middle" font-size="17.394188353844" fill="var(--text-muted)" font-family="Arial, sans-serif">(infrastructure)</text>
  <rect x="663.376623" y="309.372454688946" width="530.844052" height="138.32629325146" rx="7.505906929764" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="928.311688" y="367.615026120978" text-anchor="middle" font-size="21.742860236031" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">variable "..." { }</text>
  <text x="928.311688" y="413.723790538131" text-anchor="middle" font-size="17.394188353844" fill="var(--text-muted)" font-family="Arial, sans-serif">(inputs)</text>
  <rect x="85.779221" y="481.67370674854" width="530.844052" height="138.32629325146" rx="7.505906929764" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="351.688312" y="539.916428607323" text-anchor="middle" font-size="21.742860236031" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">data "..." { }</text>
  <text x="351.688312" y="586.025042597724" text-anchor="middle" font-size="17.394188353844" fill="var(--text-muted)" font-family="Arial, sans-serif">(queries)</text>
  <rect x="663.376623" y="481.67370674854" width="530.844052" height="138.32629325146" rx="7.505906929764" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="928.311688" y="539.916428607323" text-anchor="middle" font-size="21.742860236031" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">output "..." { }</text>
  <text x="928.311688" y="586.025042597724" text-anchor="middle" font-size="17.394188353844" fill="var(--text-muted)" font-family="Arial, sans-serif">(results)</text>
</svg>

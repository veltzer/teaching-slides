<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="Arial, sans-serif">
  <!-- Outer box -->
  <rect x="10" y="10" width="520" height="360" rx="5" fill="#f8f9fa" stroke="#4a90e2" stroke-width="2"/>
  <text x="260" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Terraform Config File (.tf)</text>
  <!-- terraform {} -->
  <rect x="30" y="55" width="230" height="60" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="145" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">terraform { }</text>
  <text x="145" y="100" text-anchor="middle" font-size="11" fill="#555">(settings)</text>
  <!-- provider {} -->
  <rect x="280" y="55" width="230" height="60" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="395" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">provider "aws" { }</text>
  <text x="395" y="100" text-anchor="middle" font-size="11" fill="#555">(cloud config)</text>
  <!-- resource {} -->
  <rect x="30" y="130" width="230" height="60" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="145" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">resource "..." { }</text>
  <text x="145" y="175" text-anchor="middle" font-size="11" fill="#555">(infrastructure)</text>
  <!-- variable {} -->
  <rect x="280" y="130" width="230" height="60" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="395" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">variable "..." { }</text>
  <text x="395" y="175" text-anchor="middle" font-size="11" fill="#555">(inputs)</text>
  <!-- data {} -->
  <rect x="30" y="205" width="230" height="60" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="145" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">data "..." { }</text>
  <text x="145" y="250" text-anchor="middle" font-size="11" fill="#555">(queries)</text>
  <!-- output {} -->
  <rect x="280" y="205" width="230" height="60" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="395" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">output "..." { }</text>
  <text x="395" y="250" text-anchor="middle" font-size="11" fill="#555">(results)</text>
</svg>
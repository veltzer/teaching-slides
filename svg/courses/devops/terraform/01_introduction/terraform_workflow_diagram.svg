<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="170.022429" y="40" width="866.817156" height="63.272677" rx="8.251336" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="603.431151" y="80.07284" text-anchor="middle" font-size="21.51192" font-weight="bold" fill="var(--primary-accent)">Write .tf files</text>
  <line x1="603.431151" y1="103.272808" x2="603.431151" y2="143.345648" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="170.022429" y="143.345648" width="866.817156" height="63.272677" rx="8.251336" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="603.431151" y="183.418226" text-anchor="middle" font-size="21.51192" font-weight="bold" fill="var(--ok-accent)">terraform init</text>
  <line x1="603.431151" y1="206.618325" x2="603.431151" y2="246.691034" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="170.022429" y="246.691034" width="866.817156" height="63.272677" rx="8.251336" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="603.431151" y="286.763612" text-anchor="middle" font-size="21.51192" font-weight="bold" fill="var(--warn-accent)">terraform plan</text>
  <line x1="1036.839585" y1="278.327307" x2="1226.455982" y2="278.327307" stroke="var(--warn-border)" stroke-width="1.3333" stroke-dasharray="5.3333 2.6667" />
  <text x="1240" y="284.654666" font-size="16.731371" fill="var(--text-muted)">Review changes</text>
  <line x1="603.431151" y1="309.963711" x2="603.431151" y2="350.03642" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="170.022429" y="350.03642" width="866.817156" height="63.272677" rx="8.251336" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="603.431151" y="390.109259" text-anchor="middle" font-size="21.51192" font-weight="bold" fill="var(--ok-accent)">terraform apply</text>
  <line x1="1036.839585" y1="381.672693" x2="1226.455982" y2="381.672693" stroke="var(--ok-border)" stroke-width="1.3333" stroke-dasharray="5.3333 2.6667" />
  <text x="1240" y="388.000052" font-size="16.731371" fill="var(--text-muted)">Confirm (yes/no)</text>
  <line x1="603.431151" y1="413.309097" x2="603.431151" y2="453.381937" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="40" y="453.381937" width="1126.862302" height="63.272677" rx="8.251336" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="603.431151" y="493.454645" text-anchor="middle" font-size="21.51192" font-weight="bold" fill="var(--primary-accent)">Infrastructure created/updated</text>
  <line x1="603.431151" y1="516.654614" x2="603.431151" y2="556.727323" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="170.022429" y="556.727323" width="866.817156" height="63.272677" rx="8.251336" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="603.431151" y="596.800031" text-anchor="middle" font-size="21.51192" font-weight="bold" fill="var(--danger-accent)">terraform destroy</text>
  <line x1="1036.839585" y1="588.363727" x2="1226.455982" y2="588.363727" stroke="var(--danger-border)" stroke-width="1.3333" stroke-dasharray="5.3333 2.6667" />
  <text x="1240" y="594.690955" font-size="16.731371" fill="var(--text-muted)">Clean up</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" font-family="Arial, sans-serif">
  <text x="200" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Terraform Workflow</text>
  <!-- Write .tf files -->
  <rect x="100" y="40" width="200" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="200" y="65" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Write .tf files</text>
  <line x1="200" y1="80" x2="200" y2="110" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#twa)"/>
  <!-- terraform init -->
  <rect x="100" y="110" width="200" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="200" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">terraform init</text>
  <line x1="200" y1="150" x2="200" y2="180" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#twa)"/>
  <!-- terraform plan -->
  <rect x="100" y="180" width="200" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="200" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">terraform plan</text>
  <line x1="300" y1="200" x2="350" y2="200" stroke="#ffc107" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="358" y="205" font-size="11" fill="#555">Review changes</text>
  <line x1="200" y1="220" x2="200" y2="250" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#twa)"/>
  <!-- terraform apply -->
  <rect x="100" y="250" width="200" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="200" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">terraform apply</text>
  <line x1="300" y1="270" x2="350" y2="270" stroke="#28a745" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="358" y="275" font-size="11" fill="#555">Confirm (yes/no)</text>
  <line x1="200" y1="290" x2="200" y2="320" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#twa)"/>
  <!-- Infrastructure created -->
  <rect x="70" y="320" width="260" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="200" y="345" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Infrastructure created/updated</text>
  <line x1="200" y1="360" x2="200" y2="390" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#twa)"/>
  <!-- terraform destroy -->
  <rect x="100" y="390" width="200" height="40" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="200" y="415" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">terraform destroy</text>
  <line x1="300" y1="410" x2="350" y2="410" stroke="#dc3545" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="358" y="415" font-size="11" fill="#555">Clean up</text>
  <defs>
    <marker id="twa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a90e2"/></marker>
  </defs>
</svg>
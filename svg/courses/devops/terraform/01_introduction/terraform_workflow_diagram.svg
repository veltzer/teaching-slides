<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Step 1 -->
  <rect x="320" y="50" width="640" height="60" rx="8" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="88" text-anchor="middle" font-size="18" font-weight="bold" fill="#1565c0">Write .tf files</text>
  <line x1="640" y1="110" x2="640" y2="148" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <!-- Step 2 -->
  <rect x="320" y="148" width="640" height="60" rx="8" fill="url(#grad-surface)" stroke="#2e7d32" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="186" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e7d32">terraform init</text>
  <line x1="640" y1="208" x2="640" y2="246" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <!-- Step 3 -->
  <rect x="320" y="246" width="640" height="60" rx="8" fill="url(#grad-surface)" stroke="#f57c00" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="284" text-anchor="middle" font-size="18" font-weight="bold" fill="#e65100">terraform plan</text>
  <line x1="960" y1="276" x2="1100" y2="276" stroke="#f57c00" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="1110" y="282" font-size="14" fill="#555">Review changes</text>
  <line x1="640" y1="306" x2="640" y2="344" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <!-- Step 4 -->
  <rect x="320" y="344" width="640" height="60" rx="8" fill="url(#grad-surface)" stroke="#2e7d32" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="382" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e7d32">terraform apply</text>
  <line x1="960" y1="374" x2="1100" y2="374" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="1110" y="380" font-size="14" fill="#555">Confirm (yes/no)</text>
  <line x1="640" y1="404" x2="640" y2="442" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <!-- Step 5 -->
  <rect x="224" y="442" width="832" height="60" rx="8" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="480" text-anchor="middle" font-size="18" font-weight="bold" fill="#1565c0">Infrastructure created/updated</text>
  <line x1="640" y1="502" x2="640" y2="540" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <!-- Step 6 -->
  <rect x="320" y="540" width="640" height="60" rx="8" fill="url(#grad-surface)" stroke="#c62828" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="578" text-anchor="middle" font-size="18" font-weight="bold" fill="#c62828">terraform destroy</text>
  <line x1="960" y1="570" x2="1100" y2="570" stroke="#c62828" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="1110" y="576" font-size="14" fill="#555">Clean up</text>
</svg>

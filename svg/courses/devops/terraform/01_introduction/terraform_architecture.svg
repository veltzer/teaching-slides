<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="369.69697" height="215.575306" rx="7.030563" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="40" y="40" width="369.69697" height="45.168094" rx="7.030563" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="40" y="70.796381" width="369.69697" height="14.371585" fill="var(--primary-fill)" rx="7.030563" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="224.848485" y="69.769776" text-anchor="middle" font-size="22.402419" font-weight="bold" fill="var(--bg)">Terraform CLI</text>
  <text x="86.464646" y="119.044164" font-size="18.329263" fill="var(--text)">• init</text>
  <text x="86.464646" y="149.840673" font-size="18.329263" fill="var(--text)">• plan</text>
  <text x="86.464646" y="180.637054" font-size="18.329263" fill="var(--text)">• apply</text>
  <text x="86.464646" y="211.433563" font-size="18.329263" fill="var(--text)">• destroy</text>
  <rect x="824.848485" y="40" width="415.151515" height="135.504409" rx="7.030563" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="824.848485" y="40" width="415.151515" height="41.062054" rx="7.030563" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="824.848485" y="65.663609" width="415.151515" height="15.398191" fill="var(--warn-fill)" rx="7.030563" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1031.919192" y="66.690214" text-anchor="middle" font-size="20.365899" font-weight="bold" fill="var(--bg)">State File</text>
  <text x="1031.919192" y="129.309709" text-anchor="middle" font-size="16.292626" fill="var(--text-muted)">(terraform.tfstate)</text>
  <rect x="340" y="322.300841" width="600" height="117.026529" rx="7.030563" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="340" y="322.300841" width="600" height="41.062054" rx="7.030563" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="340" y="347.964577" width="600" height="15.398191" fill="var(--primary-fill)" rx="7.030563" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="350.017661" text-anchor="middle" font-size="20.365899" font-weight="bold" fill="var(--bg)">Terraform Core</text>
  <text x="640" y="404.424694" text-anchor="middle" font-size="16.292626" fill="var(--text-muted)">(Resource Graph)</text>
  <line x1="409.69697" y1="255.575178" x2="547.070707" y2="319.221152" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="1031.919192" y1="175.504409" x2="801.616162" y2="319.221152" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="501.616162" y1="439.32737" x2="340" y2="515.291972" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="640" y1="439.32737" x2="640" y2="515.291972" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="778.383838" y1="439.32737" x2="940" y2="515.291972" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="224.848485" y="515.291972" width="230.30303" height="78.017813" rx="7.030563" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="340" y="562.513277" text-anchor="middle" font-size="22.402419" font-weight="bold" fill="var(--primary-accent)">AWS</text>
  <rect x="524.848485" y="515.291972" width="230.30303" height="78.017813" rx="7.030563" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="640" y="562.513277" text-anchor="middle" font-size="22.402419" font-weight="bold" fill="var(--primary-accent)">GCP</text>
  <rect x="824.848485" y="515.291972" width="230.30303" height="78.017813" rx="7.030563" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="940" y="562.513277" text-anchor="middle" font-size="22.402419" font-weight="bold" fill="var(--primary-accent)">Azure</text>
  <text x="640" y="620" text-anchor="middle" font-size="16.292626" fill="var(--text-muted)">Providers (Plugins)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Terraform CLI box -->
  <rect x="46" y="85" width="366" height="210" rx="10" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="3" filter="url(#shadow)"/>
  <rect x="46" y="85" width="366" height="44" rx="10" fill="url(#grad-accent)"/>
  <rect x="46" y="115" width="366" height="14" fill="url(#grad-accent)"/>
  <text x="229" y="114" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">Terraform CLI</text>
  <text x="92" y="162" font-size="18" fill="#333">• init</text>
  <text x="92" y="192" font-size="18" fill="#333">• plan</text>
  <text x="92" y="222" font-size="18" fill="#333">• apply</text>
  <text x="92" y="252" font-size="18" fill="#333">• destroy</text>
  <!-- State File box -->
  <rect x="823" y="85" width="411" height="132" rx="10" fill="url(#grad-surface)" stroke="#f57c00" stroke-width="3" filter="url(#shadow)"/>
  <rect x="823" y="85" width="411" height="40" rx="10" fill="#f57c00"/>
  <rect x="823" y="110" width="411" height="15" fill="#f57c00"/>
  <text x="1028" y="111" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">State File</text>
  <text x="1028" y="172" text-anchor="middle" font-size="16" fill="#555">(terraform.tfstate)</text>
  <!-- Terraform Core box -->
  <rect x="343" y="360" width="594" height="114" rx="10" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="3" filter="url(#shadow)"/>
  <rect x="343" y="360" width="594" height="40" rx="10" fill="url(#grad-accent)"/>
  <rect x="343" y="385" width="594" height="15" fill="url(#grad-accent)"/>
  <text x="640" y="387" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">Terraform Core</text>
  <text x="640" y="440" text-anchor="middle" font-size="16" fill="#555">(Resource Graph)</text>
  <!-- Arrows -->
  <line x1="412" y1="295" x2="548" y2="357" stroke="#1e88e5" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
  <line x1="1028" y1="217" x2="800" y2="357" stroke="#f57c00" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="503" y1="474" x2="343" y2="548" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
  <line x1="640" y1="474" x2="640" y2="548" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
  <line x1="777" y1="474" x2="937" y2="548" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
  <!-- Provider boxes -->
  <rect x="229" y="548" width="228" height="76" rx="10" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="343" y="594" text-anchor="middle" font-size="22" font-weight="bold" fill="#1565c0">AWS</text>
  <rect x="526" y="548" width="228" height="76" rx="10" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="594" text-anchor="middle" font-size="22" font-weight="bold" fill="#1565c0">GCP</text>
  <rect x="823" y="548" width="228" height="76" rx="10" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="937" y="594" text-anchor="middle" font-size="22" font-weight="bold" fill="#1565c0">Azure</text>
  <text x="640" y="650" text-anchor="middle" font-size="16" fill="#666">Providers (Plugins)</text>
</svg>

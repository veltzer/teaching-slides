<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="40.8889" y="75.5556" width="325.3333" height="186.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="40.8889" y="75.5556" width="325.3333" height="39.1111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="40.8889" y="102.2222" width="325.3333" height="12.4444" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="203.5556" y="101.3333" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--bg)">Terraform CLI</text>
  <text x="81.7778" y="144" font-size="16" fill="var(--text)">• init</text>
  <text x="81.7778" y="170.6667" font-size="16" fill="var(--text)">• plan</text>
  <text x="81.7778" y="197.3333" font-size="16" fill="var(--text)">• apply</text>
  <text x="81.7778" y="224" font-size="16" fill="var(--text)">• destroy</text>
  <rect x="731.5556" y="75.5556" width="365.3333" height="117.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="731.5556" y="75.5556" width="365.3333" height="35.5556" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="731.5556" y="97.7778" width="365.3333" height="13.3333" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="913.7778" y="98.6667" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--bg)">State File</text>
  <text x="913.7778" y="152.8889" text-anchor="middle" font-size="14.2222" fill="var(--text-muted)">(terraform.tfstate)</text>
  <rect x="304.8889" y="320" width="528" height="101.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="304.8889" y="320" width="528" height="35.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="304.8889" y="342.2222" width="528" height="13.3333" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="568.8889" y="344" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--bg)">Terraform Core</text>
  <text x="568.8889" y="391.1111" text-anchor="middle" font-size="14.2222" fill="var(--text-muted)">(Resource Graph)</text>
  <line x1="366.2222" y1="262.2222" x2="487.1111" y2="317.3333" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="913.7778" y1="192.8889" x2="711.1111" y2="317.3333" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="447.1111" y1="421.3333" x2="304.8889" y2="487.1111" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="568.8889" y1="421.3333" x2="568.8889" y2="487.1111" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="690.6667" y1="421.3333" x2="832.8889" y2="487.1111" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="203.5556" y="487.1111" width="202.6667" height="67.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="304.8889" y="528" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--primary-accent)">AWS</text>
  <rect x="467.5556" y="487.1111" width="202.6667" height="67.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="568.8889" y="528" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--primary-accent)">GCP</text>
  <rect x="731.5556" y="487.1111" width="202.6667" height="67.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="832.8889" y="528" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--primary-accent)">Azure</text>
  <text x="568.8889" y="577.7778" text-anchor="middle" font-size="14.2222" fill="var(--text-muted)">Providers (Plugins)</text>
</svg>
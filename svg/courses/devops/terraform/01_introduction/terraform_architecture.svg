<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="369.69697" height="215.575306" rx="7.030563" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="40" y="40" width="369.69697" height="45.168094" rx="7.030563" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="70.796381" width="369.69697" height="14.371585" fill="url(#grad-primary)" rx="7.030563" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="224.848485" y="69.769776" text-anchor="middle" font-size="22.402419" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Terraform CLI</text>
  <text x="86.464646" y="119.044164" font-size="18.329263" fill="var(--text)" font-family="Arial, sans-serif">• init</text>
  <text x="86.464646" y="149.840673" font-size="18.329263" fill="var(--text)" font-family="Arial, sans-serif">• plan</text>
  <text x="86.464646" y="180.637054" font-size="18.329263" fill="var(--text)" font-family="Arial, sans-serif">• apply</text>
  <text x="86.464646" y="211.433563" font-size="18.329263" fill="var(--text)" font-family="Arial, sans-serif">• destroy</text>
  <rect x="824.848485" y="40" width="415.151515" height="135.504409" rx="7.030563" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="824.848485" y="40" width="415.151515" height="41.062054" rx="7.030563" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="824.848485" y="65.663609" width="415.151515" height="15.398191" fill="url(#grad-warn)" rx="7.030563" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1031.919192" y="66.690214" text-anchor="middle" font-size="20.365899" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">State File</text>
  <text x="1031.919192" y="129.309709" text-anchor="middle" font-size="16.292626" fill="var(--text-muted)" font-family="Arial, sans-serif">(terraform.tfstate)</text>
  <rect x="340" y="322.300841" width="600" height="117.026529" rx="7.030563" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="340" y="322.300841" width="600" height="41.062054" rx="7.030563" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="340" y="347.964577" width="600" height="15.398191" fill="url(#grad-primary)" rx="7.030563" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="350.017661" text-anchor="middle" font-size="20.365899" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Terraform Core</text>
  <text x="640" y="404.424694" text-anchor="middle" font-size="16.292626" fill="var(--text-muted)" font-family="Arial, sans-serif">(Resource Graph)</text>
  <line x1="409.69697" y1="255.575178" x2="547.070707" y2="319.221152" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="1031.919192" y1="175.504409" x2="801.616162" y2="319.221152" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="501.616162" y1="439.32737" x2="340" y2="515.291972" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="640" y1="439.32737" x2="640" y2="515.291972" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="778.383838" y1="439.32737" x2="940" y2="515.291972" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="224.848485" y="515.291972" width="230.30303" height="78.017813" rx="7.030563" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="340" y="562.513277" text-anchor="middle" font-size="22.402419" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">AWS</text>
  <rect x="524.848485" y="515.291972" width="230.30303" height="78.017813" rx="7.030563" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="562.513277" text-anchor="middle" font-size="22.402419" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">GCP</text>
  <rect x="824.848485" y="515.291972" width="230.30303" height="78.017813" rx="7.030563" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="940" y="562.513277" text-anchor="middle" font-size="22.402419" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Azure</text>
  <text x="640" y="620" text-anchor="middle" font-size="16.292626" fill="var(--text-muted)" font-family="Arial, sans-serif">Providers (Plugins)</text>
</svg>

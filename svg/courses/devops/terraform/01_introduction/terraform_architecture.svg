<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="Arial, sans-serif">
  <text x="280" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Terraform Architecture</text>
  <!-- Terraform CLI -->
  <rect x="20" y="45" width="160" height="110" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="100" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Terraform CLI</text>
  <text x="40" y="95" font-size="12" fill="#555">- init</text>
  <text x="40" y="112" font-size="12" fill="#555">- plan</text>
  <text x="40" y="129" font-size="12" fill="#555">- apply</text>
  <text x="40" y="146" font-size="12" fill="#555">- destroy</text>
  <!-- State File -->
  <rect x="360" y="45" width="180" height="70" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="450" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">State File</text>
  <text x="450" y="100" text-anchor="middle" font-size="11" fill="#555">(terraform.tfstate)</text>
  <!-- Terraform Core -->
  <rect x="150" y="190" width="260" height="60" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="280" y="218" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Terraform Core</text>
  <text x="280" y="238" text-anchor="middle" font-size="11" fill="#555">(Resource Graph)</text>
  <!-- Arrows to Core -->
  <line x1="180" y1="155" x2="240" y2="188" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#ta)"/>
  <line x1="450" y1="115" x2="350" y2="188" stroke="#ffc107" stroke-width="1.5" marker-end="url(#ta3)"/>
  <!-- Providers -->
  <line x1="220" y1="250" x2="150" y2="300" stroke="#28a745" stroke-width="1.5" marker-end="url(#ta2)"/>
  <line x1="280" y1="250" x2="280" y2="300" stroke="#28a745" stroke-width="1.5" marker-end="url(#ta2)"/>
  <line x1="340" y1="250" x2="410" y2="300" stroke="#28a745" stroke-width="1.5" marker-end="url(#ta2)"/>
  <rect x="100" y="300" width="100" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="150" y="328" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">AWS</text>
  <rect x="230" y="300" width="100" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="280" y="328" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">GCP</text>
  <rect x="360" y="300" width="100" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="410" y="328" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Azure</text>
  <text x="280" y="368" text-anchor="middle" font-size="12" fill="#555">Providers (Plugins)</text>
  <defs>
    <marker id="ta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a90e2"/></marker>
    <marker id="ta2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#28a745"/></marker>
    <marker id="ta3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc107"/></marker>
  </defs>
</svg>
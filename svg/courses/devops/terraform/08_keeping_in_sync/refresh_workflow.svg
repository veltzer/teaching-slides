<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Command header -->
  <rect x="278" y="26" width="724" height="104" rx="10" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="88" font-family="monospace" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">terraform refresh</text>
  <line x1="640" y1="130" x2="640" y2="178" stroke="#555" stroke-width="4" marker-end="url(#arrow)"/>
  <!-- Step 1 -->
  <rect x="83" y="178" width="1114" height="112" rx="10" fill="url(#grad-surface)" stroke="#555" stroke-width="3.5" filter="url(#shadow)"/>
  <text x="640" y="245" font-size="22" fill="#222" text-anchor="middle">Query all providers for current resource state</text>
  <line x1="640" y1="290" x2="640" y2="338" stroke="#555" stroke-width="4" marker-end="url(#arrow)"/>
  <!-- Step 2 -->
  <rect x="83" y="338" width="1114" height="112" rx="10" fill="url(#grad-surface)" stroke="#555" stroke-width="3.5" filter="url(#shadow)"/>
  <text x="640" y="405" font-size="22" fill="#222" text-anchor="middle">Compare API responses to current state file</text>
  <line x1="640" y1="450" x2="640" y2="498" stroke="#555" stroke-width="4" marker-end="url(#arrow)"/>
  <!-- Step 3 -->
  <rect x="83" y="498" width="1114" height="112" rx="10" fill="url(#grad-surface)" stroke="#555" stroke-width="3.5" filter="url(#shadow)"/>
  <text x="640" y="565" font-size="22" fill="#222" text-anchor="middle">Update state file with actual values</text>
  <line x1="640" y1="610" x2="640" y2="622" stroke="#555" stroke-width="4" marker-end="url(#arrow)"/>
  <!-- Step 4 -->
  <rect x="83" y="622" width="1114" height="80" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3" filter="url(#shadow)"/>
  <text x="640" y="671" font-size="22" fill="#222" text-anchor="middle">State file reflects reality (not config)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="535.92233" height="122.10531" rx="6.446099" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="307.961165" y="116.315763" font-size="20.540065" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">Terraform Config</text>
  <rect x="704.07767" y="40" width="535.92233" height="122.10531" rx="6.446099" fill="var(--danger-accent)" stroke="var(--danger-border)" stroke-width="1.7778"/>
  <text x="972.038835" y="116.315763" font-size="20.540065" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">Actual Infrastructure</text>
  <rect x="40" y="192.631638" width="535.92233" height="188.544925" rx="6.446099" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="61.359223" y="253.684181" font-size="18.672845" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">instance_type:</text>
  <text x="82.718447" y="330.897827" font-size="20.540065" fill="var(--primary-accent)" font-family="Courier New, monospace">t3.micro</text>
  <rect x="704.07767" y="192.631638" width="535.92233" height="188.544925" rx="6.446099" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="725.436893" y="253.684181" font-size="18.672845" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">instance_type:</text>
  <text x="746.796117" y="330.897827" font-size="20.540065" fill="var(--danger-accent)" font-family="Courier New, monospace">t3.large</text>
  <text x="1047.76699" y="330.897827" font-size="16.805518" fill="var(--danger-accent)" font-family="Arial, sans-serif">← changed manually</text>
  <rect x="40" y="397.337553" width="535.92233" height="222.662447" rx="6.446099" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="61.359223" y="458.390096" font-size="18.672845" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">tags:</text>
  <text x="82.718447" y="524.829711" font-size="18.672845" fill="var(--primary-accent)" font-family="Courier New, monospace">Name: web</text>
  <rect x="704.07767" y="397.337553" width="535.92233" height="222.662447" rx="6.446099" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="725.436893" y="458.390096" font-size="18.672845" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">tags:</text>
  <text x="746.796117" y="524.829711" font-size="18.672845" fill="var(--danger-accent)" font-family="Courier New, monospace">Name: web-prod</text>
  <text x="1047.76699" y="587.678019" font-size="16.805518" fill="var(--danger-accent)" font-family="Arial, sans-serif">← changed manually</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Terraform Config header -->
  <rect x="22" y="38" width="552" height="136" rx="10" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="298" y="123" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">Terraform Config</text>
  <!-- Actual Infrastructure header -->
  <rect x="706" y="38" width="552" height="136" rx="10" fill="#c62828" stroke="#b71c1c" stroke-width="2" filter="url(#shadow)"/>
  <text x="982" y="123" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">Actual Infrastructure</text>
  <!-- Left content: instance_type -->
  <rect x="22" y="208" width="552" height="210" rx="0" fill="#e3f2fd" stroke="#bbb" stroke-width="1.5"/>
  <text x="44" y="276" font-size="20" font-weight="bold" fill="#222">instance_type:</text>
  <text x="66" y="362" font-family="monospace" font-size="22" fill="#1565c0">t3.micro</text>
  <!-- Right content: instance_type -->
  <rect x="706" y="208" width="552" height="210" rx="0" fill="#ffebee" stroke="#bbb" stroke-width="1.5"/>
  <text x="728" y="276" font-size="20" font-weight="bold" fill="#222">instance_type:</text>
  <text x="750" y="362" font-family="monospace" font-size="22" fill="#c62828">t3.large</text>
  <text x="1060" y="362" font-size="18" fill="#c62828">← changed manually</text>
  <!-- Left content: tags -->
  <rect x="22" y="436" width="552" height="248" rx="0" fill="#e3f2fd" stroke="#bbb" stroke-width="1.5"/>
  <text x="44" y="504" font-size="20" font-weight="bold" fill="#222">tags:</text>
  <text x="66" y="578" font-family="monospace" font-size="20" fill="#1565c0">Name: web</text>
  <!-- Right content: tags -->
  <rect x="706" y="436" width="552" height="248" rx="0" fill="#ffebee" stroke="#bbb" stroke-width="1.5"/>
  <text x="728" y="504" font-size="20" font-weight="bold" fill="#222">tags:</text>
  <text x="750" y="578" font-family="monospace" font-size="20" fill="#c62828">Name: web-prod</text>
  <text x="1060" y="648" font-size="18" fill="#c62828">← changed manually</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="455.3125" y="60.9444" width="369.375" height="86.1944" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="110.8889" font-size="22.5947" font-weight="bold" fill="var(--bg)" text-anchor="middle">Root Module</text>
  <line x1="640" y1="147.1389" x2="640" y2="211.5833" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="155.3125" y1="211.5833" x2="1124.6874" y2="211.5833" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="155.3125" y1="211.5833" x2="155.3125" y2="276.0277" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="444.0625" y1="211.5833" x2="444.0625" y2="276.0277" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="778.7499" y1="211.5833" x2="778.7499" y2="276.0277" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1124.6874" y1="211.5833" x2="1124.6874" y2="276.0277" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="63.4375" y="276.0277" width="183.75" height="107.1389" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="155.3125" y="336.4444" font-size="22.5947" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">VPC</text>
  <rect x="339.9999" y="276.0277" width="183.75" height="107.1389" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="431.875" y="336.4444" font-size="22.5947" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">SG</text>
  <rect x="685.9374" y="276.0277" width="183.75" height="107.1389" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="777.8125" y="336.4444" font-size="22.5947" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">EC2</text>
  <rect x="1032.8124" y="276.0277" width="183.75" height="107.1389" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1124.6874" y="336.4444" font-size="22.5947" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">RDS</text>
  <line x1="247.1874" y1="383.1667" x2="685.9374" y2="383.1667" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="10.6667 6.2222" marker-end="url(#arrow)" />
  <line x1="523.75" y1="372.6944" x2="685.9374" y2="372.6944" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="10.6667 6.2222" marker-end="url(#arrow)" />
  <line x1="523.75" y1="351.75" x2="1032.8124" y2="351.75" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="10.6667 6.2222" marker-end="url(#arrow)" />
  <line x1="109.375" y1="507.2223" x2="224.6875" y2="507.2223" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="10.6667 6.2222" marker-end="url(#arrow)" />
  <text x="248.125" y="512.0556" font-size="17.3806" fill="var(--text-muted)">outputs flow between modules</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="393.7778" y="23.1111" width="350.2222" height="95.1111" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="568.8889" y="78.2222" font-size="23.1111" font-weight="bold" fill="var(--bg)" text-anchor="middle">Root Module</text>
  <line x1="568.8889" y1="118.2222" x2="568.8889" y2="189.3333" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="109.3333" y1="189.3333" x2="1028.4444" y2="189.3333" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="109.3333" y1="189.3333" x2="109.3333" y2="260.4444" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="383.1111" y1="189.3333" x2="383.1111" y2="260.4444" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="700.4444" y1="189.3333" x2="700.4444" y2="260.4444" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1028.4444" y1="189.3333" x2="1028.4444" y2="260.4444" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="22.2222" y="260.4444" width="174.2222" height="118.2222" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="109.3333" y="327.1111" font-size="23.1111" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">VPC</text>
  <rect x="284.4444" y="260.4444" width="174.2222" height="118.2222" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="371.5556" y="327.1111" font-size="23.1111" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">SG</text>
  <rect x="612.4444" y="260.4444" width="174.2222" height="118.2222" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="699.5556" y="327.1111" font-size="23.1111" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">EC2</text>
  <rect x="941.3333" y="260.4444" width="174.2222" height="118.2222" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1028.4444" y="327.1111" font-size="23.1111" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">RDS</text>
  <line x1="196.4444" y1="378.6667" x2="612.4444" y2="378.6667" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="10.6667 6.2222" marker-end="url(#arrow)" />
  <line x1="458.6667" y1="367.1111" x2="612.4444" y2="367.1111" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="10.6667 6.2222" marker-end="url(#arrow)" />
  <line x1="458.6667" y1="344" x2="941.3333" y2="344" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="10.6667 6.2222" marker-end="url(#arrow)" />
  <line x1="65.7778" y1="515.5556" x2="175.1111" y2="515.5556" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="10.6667 6.2222" marker-end="url(#arrow)" />
  <text x="197.3333" y="520.8889" font-size="17.7778" fill="var(--text-muted)">outputs flow between modules</text>
</svg>
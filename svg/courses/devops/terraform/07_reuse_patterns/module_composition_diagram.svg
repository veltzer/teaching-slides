<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="447.804913" y="40" width="384.390277" height="110.82135" rx="6.940262" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640.000052" y="104.214344" font-size="26.135524" font-weight="bold" fill="var(--bg)" text-anchor="middle">Root Module</text>
  <line x1="640.000052" y1="150.821478" x2="640.000052" y2="233.678548" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="135.609764" y1="233.678548" x2="1144.390236" y2="233.678548" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="135.609764" y1="233.678548" x2="135.609764" y2="316.535617" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="436.097595" y1="233.678548" x2="436.097595" y2="316.535617" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="784.390204" y1="233.678548" x2="784.390204" y2="316.535617" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1144.390236" y1="233.678548" x2="1144.390236" y2="316.535617" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="316.535617" width="191.219529" height="137.749987" rx="6.940262" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="135.609764" y="394.214216" font-size="26.135524" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">VPC</text>
  <rect x="327.804799" y="316.535617" width="191.219529" height="137.749987" rx="6.940262" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="423.414667" y="394.214216" font-size="26.135524" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">SG</text>
  <rect x="687.80483" y="316.535617" width="191.219529" height="137.749987" rx="6.940262" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="783.414699" y="394.214216" font-size="26.135524" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">EC2</text>
  <rect x="1048.780471" y="316.535617" width="191.219529" height="137.749987" rx="6.940262" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1144.390236" y="394.214216" font-size="26.135524" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">RDS</text>
  <line x1="231.219425" y1="454.285733" x2="687.80483" y2="454.285733" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="10.6667 6.2222" marker-end="url(#arrow)" />
  <line x1="519.024432" y1="440.82135" x2="687.80483" y2="440.82135" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="10.6667 6.2222" marker-end="url(#arrow)" />
  <line x1="519.024432" y1="413.892841" x2="1048.780471" y2="413.892841" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="10.6667 6.2222" marker-end="url(#arrow)" />
  <line x1="87.804882" y1="613.785758" x2="207.804893" y2="613.785758" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="10.6667 6.2222" marker-end="url(#arrow)" />
  <text x="232.195139" y="620" font-size="20.104321" fill="var(--text-muted)">outputs flow between modules</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="552.19517" height="257.777778" rx="6.451823" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="40" y="40" width="552.19517" height="46.543222" rx="6.451823" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="40" y="72.222222" width="552.19517" height="14.321" fill="var(--primary-fill)" rx="6.451823" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="316.097585" y="70.432111" font-size="20.558304" font-weight="bold" fill="var(--bg)" text-anchor="middle">Workspaces</text>
  <text x="316.097585" y="150.987667" font-size="18.689426" fill="var(--text-muted)" text-anchor="middle">Same config,</text>
  <text x="316.097585" y="195.740778" font-size="18.689426" fill="var(--text-muted)" text-anchor="middle">different state</text>
  <rect x="687.80483" y="40" width="552.19517" height="257.777778" rx="6.451823" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="687.80483" y="40" width="552.19517" height="46.543222" rx="6.451823" fill="var(--ok-accent)" />
  <rect x="687.80483" y="72.222222" width="552.19517" height="14.321" fill="var(--ok-accent)" rx="6.451823"/>
  <text x="963.902519" y="70.432111" font-size="20.558304" font-weight="bold" fill="var(--bg)" text-anchor="middle">Modules</text>
  <text x="963.902519" y="150.987667" font-size="18.689426" fill="var(--text-muted)" text-anchor="middle">Reusable config</text>
  <text x="963.902519" y="195.740778" font-size="18.689426" fill="var(--text-muted)" text-anchor="middle">components</text>
  <rect x="40" y="362.222222" width="552.19517" height="257.777778" rx="6.451823" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="40" y="362.222222" width="552.19517" height="46.543222" rx="6.451823" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="40" y="394.444444" width="552.19517" height="14.321" fill="var(--warn-fill)" rx="6.451823" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="316.097585" y="392.654333" font-size="20.558304" font-weight="bold" fill="var(--bg)" text-anchor="middle">Outputs</text>
  <text x="316.097585" y="476.790111" font-size="18.689426" fill="var(--text-muted)" text-anchor="middle">Export values</text>
  <text x="316.097585" y="519.753" font-size="18.689426" fill="var(--text-muted)" text-anchor="middle">from configs</text>
  <rect x="687.80483" y="362.222222" width="552.19517" height="257.777778" rx="6.451823" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="687.80483" y="362.222222" width="552.19517" height="46.543222" rx="6.451823" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="687.80483" y="394.444444" width="552.19517" height="14.321" fill="var(--info-fill)" rx="6.451823" stroke="var(--info-border)" stroke-width="2"/>
  <text x="963.902519" y="392.654333" font-size="20.558304" font-weight="bold" fill="var(--bg)" text-anchor="middle">Remote State</text>
  <text x="963.902519" y="476.790111" font-size="18.689426" fill="var(--text-muted)" text-anchor="middle">Cross-project</text>
  <text x="963.902519" y="519.753" font-size="18.689426" fill="var(--text-muted)" text-anchor="middle">data sharing</text>
</svg>
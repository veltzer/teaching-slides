<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Workspaces -->
  <rect x="25" y="36" width="566" height="288" rx="10" fill="#e3f2fd" stroke="#1e88e5" stroke-width="3" filter="url(#shadow)"/>
  <rect x="25" y="36" width="566" height="52" rx="10" fill="url(#grad-accent)"/>
  <rect x="25" y="72" width="566" height="16" fill="url(#grad-accent)"/>
  <text x="308" y="70" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">Workspaces</text>
  <text x="308" y="160" font-size="20" fill="#555" text-anchor="middle">Same config,</text>
  <text x="308" y="210" font-size="20" fill="#555" text-anchor="middle">different state</text>
  <!-- Modules -->
  <rect x="689" y="36" width="566" height="288" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3" filter="url(#shadow)"/>
  <rect x="689" y="36" width="566" height="52" rx="10" fill="#2e7d32"/>
  <rect x="689" y="72" width="566" height="16" fill="#2e7d32"/>
  <text x="972" y="70" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">Modules</text>
  <text x="972" y="160" font-size="20" fill="#555" text-anchor="middle">Reusable config</text>
  <text x="972" y="210" font-size="20" fill="#555" text-anchor="middle">components</text>
  <!-- Outputs -->
  <rect x="25" y="396" width="566" height="288" rx="10" fill="#fff8e1" stroke="#f57c00" stroke-width="3" filter="url(#shadow)"/>
  <rect x="25" y="396" width="566" height="52" rx="10" fill="#f57c00"/>
  <rect x="25" y="432" width="566" height="16" fill="#f57c00"/>
  <text x="308" y="430" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">Outputs</text>
  <text x="308" y="524" font-size="20" fill="#555" text-anchor="middle">Export values</text>
  <text x="308" y="572" font-size="20" fill="#555" text-anchor="middle">from configs</text>
  <!-- Remote State -->
  <rect x="689" y="396" width="566" height="288" rx="10" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="3" filter="url(#shadow)"/>
  <rect x="689" y="396" width="566" height="52" rx="10" fill="#7b1fa2"/>
  <rect x="689" y="432" width="566" height="16" fill="#7b1fa2"/>
  <text x="972" y="430" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">Remote State</text>
  <text x="972" y="524" font-size="20" fill="#555" text-anchor="middle">Cross-project</text>
  <text x="972" y="572" font-size="20" fill="#555" text-anchor="middle">data sharing</text>
</svg>

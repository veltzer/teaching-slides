<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="Arial, sans-serif">
  <text x="240" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Security Layers</text>
  <!-- Layer 1: Access Control -->
  <rect x="30" y="45" width="420" height="55" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="240" y="68" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Access Control</text>
  <text x="240" y="88" text-anchor="middle" font-size="11" fill="#555">Who can run terraform apply?</text>
  <!-- Layer 2: Secrets -->
  <rect x="30" y="110" width="420" height="55" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="240" y="133" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Secrets Management</text>
  <text x="240" y="153" text-anchor="middle" font-size="11" fill="#555">How are passwords/keys handled?</text>
  <!-- Layer 3: State -->
  <rect x="30" y="175" width="420" height="55" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="240" y="198" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">State Security</text>
  <text x="240" y="218" text-anchor="middle" font-size="11" fill="#555">How is state file protected?</text>
  <!-- Layer 4: Network -->
  <rect x="30" y="240" width="420" height="55" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="240" y="263" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Network Security</text>
  <text x="240" y="283" text-anchor="middle" font-size="11" fill="#555">How does Terraform reach providers?</text>
</svg>
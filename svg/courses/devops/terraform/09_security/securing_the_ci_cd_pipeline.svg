<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="318.407882" height="170.275173" rx="7.943384" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="199.203994" y="138.440492" text-anchor="middle" font-size="29.913063" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Git Push</text>
  <rect x="468.855759" y="40" width="342.288587" height="170.275173" rx="7.943384" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000053" y="138.440492" text-anchor="middle" font-size="29.913063" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">CI/CD Pipeline</text>
  <rect x="921.592118" y="40" width="318.407882" height="170.275173" rx="7.943384" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1080.796006" y="138.440492" text-anchor="middle" font-size="29.913063" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Terraform Apply</text>
  <line x1="358.407988" y1="125.137668" x2="463.880635" y2="125.137668" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="811.144241" y1="125.137668" x2="916.616993" y2="125.137668" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640.000053" y1="210.275338" x2="640.000053" y2="345.963271" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="640.000053" y1="345.963271" x2="432.039836" y2="345.963271" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="640.000053" y1="345.963271" x2="847.960164" y2="345.963271" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="432.039836" y1="345.963271" x2="432.039836" y2="449.724827" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="847.960164" y1="345.963271" x2="847.960164" y2="449.724827" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="260.895542" y="449.724827" width="342.288587" height="170.275173" rx="7.943384" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="432.039836" y="550.82552" text-anchor="middle" font-size="27.611997" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Secrets Manager</text>
  <rect x="676.815871" y="449.724827" width="342.288587" height="170.275173" rx="7.943384" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="847.960164" y="550.82552" text-anchor="middle" font-size="27.611997" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Policy Check</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" font-family="Arial, sans-serif">
  <text x="260" y="25" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Securing the CI/CD Pipeline</text>
  <!-- Git Push -->
  <rect x="20" y="50" width="130" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="85" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Git Push</text>
  <!-- CI/CD Pipeline -->
  <rect x="195" y="50" width="140" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="265" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">CI/CD Pipeline</text>
  <!-- Terraform Apply -->
  <rect x="380" y="50" width="130" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="445" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Terraform Apply</text>
  <!-- Arrows top row -->
  <line x1="150" y1="75" x2="193" y2="75" stroke="#4a90e2" stroke-width="2" marker-end="url(#cia)"/>
  <line x1="335" y1="75" x2="378" y2="75" stroke="#28a745" stroke-width="2" marker-end="url(#cia2)"/>
  <!-- Branches from pipeline -->
  <line x1="265" y1="100" x2="265" y2="140" stroke="#28a745" stroke-width="1.5"/>
  <line x1="265" y1="140" x2="180" y2="140" stroke="#28a745" stroke-width="1.5"/>
  <line x1="265" y1="140" x2="350" y2="140" stroke="#28a745" stroke-width="1.5"/>
  <line x1="180" y1="140" x2="180" y2="170" stroke="#28a745" stroke-width="1.5" marker-end="url(#cia2)"/>
  <line x1="350" y1="140" x2="350" y2="170" stroke="#28a745" stroke-width="1.5" marker-end="url(#cia2)"/>
  <!-- Secrets Manager -->
  <rect x="110" y="170" width="140" height="50" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="180" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Secrets Manager</text>
  <!-- Policy Check -->
  <rect x="280" y="170" width="140" height="50" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="350" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Policy Check</text>
  <defs>
    <marker id="cia" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a90e2"/></marker>
    <marker id="cia2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#28a745"/></marker>
  </defs>
</svg>
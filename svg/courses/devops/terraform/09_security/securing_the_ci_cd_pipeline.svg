<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Top row -->
  <rect x="49" y="128" width="320" height="128" rx="12" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="5" filter="url(#shadow)"/>
  <text x="209" y="202" text-anchor="middle" font-size="26" font-weight="bold" fill="#1565c0">Git Push</text>
  <rect x="480" y="128" width="344" height="128" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="5" filter="url(#shadow)"/>
  <text x="652" y="202" text-anchor="middle" font-size="26" font-weight="bold" fill="#2e7d32">CI/CD Pipeline</text>
  <rect x="935" y="128" width="320" height="128" rx="12" fill="#fff8e1" stroke="#f57c00" stroke-width="5" filter="url(#shadow)"/>
  <text x="1095" y="202" text-anchor="middle" font-size="26" font-weight="bold" fill="#e65100">Terraform Apply</text>
  <!-- Top arrows -->
  <line x1="369" y1="192" x2="475" y2="192" stroke="#1e88e5" stroke-width="5" marker-end="url(#arrow-accent)"/>
  <line x1="824" y1="192" x2="930" y2="192" stroke="#2e7d32" stroke-width="5" marker-end="url(#arrow)"/>
  <!-- Branches from CI/CD -->
  <line x1="652" y1="256" x2="652" y2="358" stroke="#2e7d32" stroke-width="3.5"/>
  <line x1="652" y1="358" x2="443" y2="358" stroke="#2e7d32" stroke-width="3.5"/>
  <line x1="652" y1="358" x2="861" y2="358" stroke="#2e7d32" stroke-width="3.5"/>
  <line x1="443" y1="358" x2="443" y2="436" stroke="#2e7d32" stroke-width="3.5" marker-end="url(#arrow)"/>
  <line x1="861" y1="358" x2="861" y2="436" stroke="#2e7d32" stroke-width="3.5" marker-end="url(#arrow)"/>
  <!-- Bottom row -->
  <rect x="271" y="436" width="344" height="128" rx="12" fill="#ffebee" stroke="#c62828" stroke-width="3.5" filter="url(#shadow)"/>
  <text x="443" y="512" text-anchor="middle" font-size="24" font-weight="bold" fill="#c62828">Secrets Manager</text>
  <rect x="689" y="436" width="344" height="128" rx="12" fill="#ffebee" stroke="#c62828" stroke-width="3.5" filter="url(#shadow)"/>
  <text x="861" y="512" text-anchor="middle" font-size="24" font-weight="bold" fill="#c62828">Policy Check</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Terraform box -->
  <rect x="49" y="138" width="320" height="194" rx="12" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="5" filter="url(#shadow)"/>
  <rect x="49" y="138" width="320" height="54" rx="12" fill="url(#grad-accent)"/>
  <rect x="49" y="174" width="320" height="18" fill="url(#grad-accent)"/>
  <text x="209" y="172" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">Terraform</text>
  <text x="209" y="258" text-anchor="middle" font-size="18" fill="#555">Request creds</text>
  <!-- Arrow 1 -->
  <line x1="369" y1="235" x2="487" y2="235" stroke="#1565c0" stroke-width="5" marker-end="url(#arrow-accent)"/>
  <!-- Vault box -->
  <rect x="492" y="138" width="320" height="194" rx="12" fill="#fff8e1" stroke="#f57c00" stroke-width="5" filter="url(#shadow)"/>
  <rect x="492" y="138" width="320" height="54" rx="12" fill="#f57c00"/>
  <rect x="492" y="174" width="320" height="18" fill="#f57c00"/>
  <text x="652" y="172" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">Vault</text>
  <text x="652" y="258" text-anchor="middle" font-size="18" fill="#555">Generate temp creds</text>
  <!-- Arrow 2 -->
  <line x1="812" y1="235" x2="930" y2="235" stroke="#f57c00" stroke-width="5" marker-end="url(#arrow)"/>
  <!-- AWS box -->
  <rect x="935" y="138" width="295" height="194" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="5" filter="url(#shadow)"/>
  <rect x="935" y="138" width="295" height="54" rx="12" fill="#2e7d32"/>
  <rect x="935" y="174" width="295" height="18" fill="#2e7d32"/>
  <text x="1083" y="172" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">AWS</text>
  <text x="1083" y="258" text-anchor="middle" font-size="18" fill="#555">STS Token</text>
  <!-- Arrow down from Vault -->
  <line x1="652" y1="332" x2="652" y2="468" stroke="#f57c00" stroke-width="3.5" marker-end="url(#arrow)"/>
  <!-- Expiry box -->
  <rect x="394" y="468" width="516" height="152" rx="12" fill="#ffebee" stroke="#c62828" stroke-width="3.5" filter="url(#shadow)"/>
  <text x="652" y="540" text-anchor="middle" font-size="24" font-weight="bold" fill="#c62828">Creds auto-expire</text>
  <text x="652" y="592" text-anchor="middle" font-size="20" fill="#555">after TTL (e.g., 1 hour)</text>
</svg>

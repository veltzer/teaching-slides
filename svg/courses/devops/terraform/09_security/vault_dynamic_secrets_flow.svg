<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" font-family="Arial, sans-serif">
  <text x="260" y="25" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Vault Dynamic Secrets Flow</text>
  <!-- Terraform -->
  <rect x="20" y="50" width="130" height="70" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="85" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Terraform</text>
  <text x="85" y="100" text-anchor="middle" font-size="11" fill="#555">Request creds</text>
  <!-- Vault -->
  <rect x="200" y="50" width="130" height="70" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="265" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Vault</text>
  <text x="265" y="100" text-anchor="middle" font-size="11" fill="#555">Generate temp creds</text>
  <!-- AWS -->
  <rect x="380" y="50" width="120" height="70" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="440" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">AWS</text>
  <text x="440" y="100" text-anchor="middle" font-size="11" fill="#555">STS Token</text>
  <!-- Arrows -->
  <line x1="150" y1="85" x2="198" y2="85" stroke="#4a90e2" stroke-width="2" marker-end="url(#va)"/>
  <line x1="330" y1="85" x2="378" y2="85" stroke="#ffc107" stroke-width="2" marker-end="url(#va2)"/>
  <!-- Auto-expire -->
  <line x1="265" y1="120" x2="265" y2="170" stroke="#ffc107" stroke-width="1.5" marker-end="url(#va2)"/>
  <rect x="160" y="170" width="210" height="55" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="265" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Creds auto-expire</text>
  <text x="265" y="215" text-anchor="middle" font-size="11" fill="#555">after TTL (e.g., 1 hour)</text>
  <defs>
    <marker id="va" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a90e2"/></marker>
    <marker id="va2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc107"/></marker>
  </defs>
</svg>
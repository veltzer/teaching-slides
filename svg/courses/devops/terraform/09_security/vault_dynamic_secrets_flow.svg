<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="325.148071" height="233.443914" rx="7.634385" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="40" y="40" width="325.148071" height="64.979266" rx="7.634385" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="83.319511" width="325.148071" height="21.659755" fill="url(#grad-primary)" rx="7.634385" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="202.57409" y="80.912888" text-anchor="middle" font-size="24.326459" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Terraform</text>
  <text x="202.57409" y="184.39827" text-anchor="middle" font-size="19.903478" fill="var(--text-muted)" font-family="Arial, sans-serif">Request creds</text>
  <line x1="365.14818" y1="156.722032" x2="485.046571" y2="156.722032" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="490.127011" y="40" width="325.148071" height="233.443914" rx="7.634385" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="490.127011" y="40" width="325.148071" height="64.979266" rx="7.634385" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="490.127011" y="83.319511" width="325.148071" height="21.659755" fill="url(#grad-warn)" rx="7.634385" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="652.701101" y="80.912888" text-anchor="middle" font-size="24.326459" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Vault</text>
  <text x="652.701101" y="184.39827" text-anchor="middle" font-size="19.903478" fill="var(--text-muted)" font-family="Arial, sans-serif">Generate temp creds</text>
  <line x1="815.275191" y1="156.722032" x2="935.173582" y2="156.722032" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="940.254022" y="40" width="299.745978" height="233.443914" rx="7.634385" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="940.254022" y="40" width="299.745978" height="64.979266" rx="7.634385" fill="var(--ok-accent)" />
  <rect x="940.254022" y="83.319511" width="299.745978" height="21.659755" fill="var(--ok-accent)" rx="7.634385"/>
  <text x="1090.635055" y="80.912888" text-anchor="middle" font-size="24.326459" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">AWS</text>
  <text x="1090.635055" y="184.39827" text-anchor="middle" font-size="19.903478" fill="var(--text-muted)" font-family="Arial, sans-serif">STS Token</text>
  <line x1="652.701101" y1="273.443914" x2="652.701101" y2="437.095465" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="390.550381" y="437.095465" width="524.301439" height="182.904535" rx="7.634385" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="652.701101" y="523.734487" text-anchor="middle" font-size="26.537886" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Creds auto-expire</text>
  <text x="652.701101" y="586.30713" text-anchor="middle" font-size="22.115032" fill="var(--text-muted)" font-family="Arial, sans-serif">after TTL (e.g., 1 hour)</text>
</svg>
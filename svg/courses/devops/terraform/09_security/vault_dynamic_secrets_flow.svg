<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="325.148071" height="233.443914" rx="7.634385" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="40" y="40" width="325.148071" height="64.979266" rx="7.634385" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="83.319511" width="325.148071" height="21.659755" fill="var(--primary-fill)" rx="7.634385" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="202.57409" y="80.912888" text-anchor="middle" font-size="24.326459" font-weight="bold" fill="var(--bg)">Terraform</text>
  <text x="202.57409" y="184.39827" text-anchor="middle" font-size="19.903478" fill="var(--text-muted)">Request creds</text>
  <line x1="365.14818" y1="156.722032" x2="485.046571" y2="156.722032" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="490.127011" y="40" width="325.148071" height="233.443914" rx="7.634385" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="490.127011" y="40" width="325.148071" height="64.979266" rx="7.634385" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="490.127011" y="83.319511" width="325.148071" height="21.659755" fill="var(--warn-fill)" rx="7.634385" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="652.701101" y="80.912888" text-anchor="middle" font-size="24.326459" font-weight="bold" fill="var(--bg)">Vault</text>
  <text x="652.701101" y="184.39827" text-anchor="middle" font-size="19.903478" fill="var(--text-muted)">Generate temp creds</text>
  <line x1="815.275191" y1="156.722032" x2="935.173582" y2="156.722032" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="940.254022" y="40" width="299.745978" height="233.443914" rx="7.634385" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="940.254022" y="40" width="299.745978" height="64.979266" rx="7.634385" fill="var(--ok-accent)" />
  <rect x="940.254022" y="83.319511" width="299.745978" height="21.659755" fill="var(--ok-accent)" rx="7.634385"/>
  <text x="1090.635055" y="80.912888" text-anchor="middle" font-size="24.326459" font-weight="bold" fill="var(--bg)">AWS</text>
  <text x="1090.635055" y="184.39827" text-anchor="middle" font-size="19.903478" fill="var(--text-muted)">STS Token</text>
  <line x1="652.701101" y1="273.443914" x2="652.701101" y2="437.095465" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="390.550381" y="437.095465" width="524.301439" height="182.904535" rx="7.634385" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="652.701101" y="523.734487" text-anchor="middle" font-size="26.537886" font-weight="bold" fill="var(--danger-accent)">Creds auto-expire</text>
  <text x="652.701101" y="586.30713" text-anchor="middle" font-size="22.115032" fill="var(--text-muted)">after TTL (e.g., 1 hour)</text>
</svg>
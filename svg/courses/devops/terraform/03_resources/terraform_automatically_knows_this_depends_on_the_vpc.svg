<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- VPC box -->
  <rect x="77" y="200" width="461" height="280" rx="14" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="5" filter="url(#shadow)"/>
  <rect x="77" y="200" width="461" height="58" rx="14" fill="url(#grad-accent)"/>
  <rect x="77" y="240" width="461" height="18" fill="url(#grad-accent)"/>
  <text x="307" y="237" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">aws_vpc.main</text>
  <text x="307" y="330" text-anchor="middle" font-size="22" font-weight="bold" fill="#333">aws_vpc.main</text>
  <text x="307" y="415" text-anchor="middle" font-size="18" fill="#555">(created first)</text>
  <!-- Arrow -->
  <line x1="538" y1="340" x2="717" y2="340" stroke="#2e7d32" stroke-width="5" marker-end="url(#arrow)"/>
  <!-- Subnet box -->
  <rect x="742" y="200" width="461" height="280" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="5" filter="url(#shadow)"/>
  <rect x="742" y="200" width="461" height="58" rx="14" fill="#2e7d32"/>
  <rect x="742" y="240" width="461" height="18" fill="#2e7d32"/>
  <text x="972" y="237" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">aws_subnet.public</text>
  <text x="972" y="330" text-anchor="middle" font-size="22" font-weight="bold" fill="#333">aws_subnet.public</text>
  <text x="972" y="415" text-anchor="middle" font-size="18" fill="#555">(created second)</text>
  <!-- Footer -->
  <text x="640" y="580" text-anchor="middle" font-size="20" fill="#555">Terraform automatically knows the subnet depends on the VPC</text>
</svg>

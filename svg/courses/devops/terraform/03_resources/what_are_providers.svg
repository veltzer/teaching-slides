<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="343.283612" height="580" rx="9.842145" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="40" y="40" width="343.283612" height="118.450943" rx="9.842145" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="121.690112" width="343.283612" height="36.760575" fill="url(#grad-primary)" rx="9.842145" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="212.139319" y="115.563517" text-anchor="middle" font-size="28.510397" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Terraform</text>
  <text x="212.139319" y="315.704317" text-anchor="middle" font-size="37.063385" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Terraform</text>
  <text x="212.139319" y="489.29587" text-anchor="middle" font-size="31.361339" fill="var(--text-muted)" font-family="Arial, sans-serif">Core</text>
  <line x1="383.283612" y1="330.000125" x2="479.800928" y2="330.000125" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="492.736358" y="40" width="343.283612" height="580" rx="9.842145" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="492.736358" y="40" width="343.283612" height="118.450943" rx="9.842145" fill="var(--ok-accent)"/>
  <rect x="492.736358" y="121.690112" width="343.283612" height="36.760575" fill="var(--ok-accent)" rx="9.842145"/>
  <text x="664.875677" y="115.563517" text-anchor="middle" font-size="28.510397" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Provider</text>
  <text x="664.875677" y="315.704317" text-anchor="middle" font-size="37.063385" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Provider</text>
  <text x="664.875677" y="489.29587" text-anchor="middle" font-size="31.361339" fill="var(--text-muted)" font-family="Arial, sans-serif">Plugin</text>
  <line x1="836.019971" y1="330.000125" x2="933.532417" y2="330.000125" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="946.467636" y="40" width="293.532364" height="580" rx="9.842145" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="946.467636" y="40" width="293.532364" height="118.450943" rx="9.842145" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="946.467636" y="121.690112" width="293.532364" height="36.760575" fill="url(#grad-warn)" rx="9.842145" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1093.731436" y="115.563517" text-anchor="middle" font-size="28.510397" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Cloud</text>
  <text x="1093.731436" y="315.704317" text-anchor="middle" font-size="37.063385" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Cloud</text>
  <text x="1093.731436" y="489.29587" text-anchor="middle" font-size="31.361339" fill="var(--text-muted)" font-family="Arial, sans-serif">API</text>
</svg>

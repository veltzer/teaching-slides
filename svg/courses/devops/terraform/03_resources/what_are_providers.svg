<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Terraform Core -->
  <rect x="49" y="210" width="345" height="284" rx="14" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="5" filter="url(#shadow)"/>
  <rect x="49" y="210" width="345" height="58" rx="14" fill="url(#grad-accent)"/>
  <rect x="49" y="250" width="345" height="18" fill="url(#grad-accent)"/>
  <text x="222" y="247" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">Terraform</text>
  <text x="222" y="345" text-anchor="middle" font-size="26" font-weight="bold" fill="#1565c0">Terraform</text>
  <text x="222" y="430" text-anchor="middle" font-size="22" fill="#555">Core</text>
  <!-- Arrow 1 -->
  <line x1="394" y1="352" x2="491" y2="352" stroke="#1565c0" stroke-width="5" marker-end="url(#arrow-accent)"/>
  <!-- Provider Plugin -->
  <rect x="504" y="210" width="345" height="284" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="5" filter="url(#shadow)"/>
  <rect x="504" y="210" width="345" height="58" rx="14" fill="#2e7d32"/>
  <rect x="504" y="250" width="345" height="18" fill="#2e7d32"/>
  <text x="677" y="247" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">Provider</text>
  <text x="677" y="345" text-anchor="middle" font-size="26" font-weight="bold" fill="#2e7d32">Provider</text>
  <text x="677" y="430" text-anchor="middle" font-size="22" fill="#555">Plugin</text>
  <!-- Arrow 2 -->
  <line x1="849" y1="352" x2="947" y2="352" stroke="#2e7d32" stroke-width="5" marker-end="url(#arrow)"/>
  <!-- Cloud API -->
  <rect x="960" y="210" width="295" height="284" rx="14" fill="#fff8e1" stroke="#f57c00" stroke-width="5" filter="url(#shadow)"/>
  <rect x="960" y="210" width="295" height="58" rx="14" fill="#f57c00"/>
  <rect x="960" y="250" width="295" height="18" fill="#f57c00"/>
  <text x="1108" y="247" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">Cloud</text>
  <text x="1108" y="345" text-anchor="middle" font-size="26" font-weight="bold" fill="#e65100">Cloud</text>
  <text x="1108" y="430" text-anchor="middle" font-size="22" fill="#555">API</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" font-family="Arial, sans-serif">
  <text x="260" y="25" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">What Are Providers</text>
  <!-- Terraform Core -->
  <rect x="20" y="45" width="140" height="55" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="90" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Terraform</text>
  <text x="90" y="90" text-anchor="middle" font-size="12" fill="#555">Core</text>
  <!-- Arrow -->
  <line x1="160" y1="72" x2="200" y2="72" stroke="#4a90e2" stroke-width="2" marker-end="url(#pra)"/>
  <!-- Provider Plugin -->
  <rect x="205" y="45" width="140" height="55" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="275" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Provider</text>
  <text x="275" y="90" text-anchor="middle" font-size="12" fill="#555">Plugin</text>
  <!-- Arrow -->
  <line x1="345" y1="72" x2="385" y2="72" stroke="#28a745" stroke-width="2" marker-end="url(#pra2)"/>
  <!-- Cloud API -->
  <rect x="390" y="45" width="120" height="55" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="450" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Cloud</text>
  <text x="450" y="90" text-anchor="middle" font-size="12" fill="#555">API</text>
  <defs>
    <marker id="pra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a90e2"/></marker>
    <marker id="pra2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#28a745"/></marker>
  </defs>
</svg>
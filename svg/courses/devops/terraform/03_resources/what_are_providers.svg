<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="343.283612" height="580" rx="9.842145" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="40" y="40" width="343.283612" height="118.450943" rx="9.842145" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="121.690112" width="343.283612" height="36.760575" fill="var(--primary-fill)" rx="9.842145" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="212.139319" y="115.563517" text-anchor="middle" font-size="28.510397" font-weight="bold" fill="var(--bg)">Terraform</text>
  <text x="212.139319" y="315.704317" text-anchor="middle" font-size="37.063385" font-weight="bold" fill="var(--primary-accent)">Terraform</text>
  <text x="212.139319" y="489.29587" text-anchor="middle" font-size="31.361339" fill="var(--text-muted)">Core</text>
  <line x1="383.283612" y1="330.000125" x2="479.800928" y2="330.000125" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="492.736358" y="40" width="343.283612" height="580" rx="9.842145" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="492.736358" y="40" width="343.283612" height="118.450943" rx="9.842145" fill="var(--ok-accent)" />
  <rect x="492.736358" y="121.690112" width="343.283612" height="36.760575" fill="var(--ok-accent)" rx="9.842145"/>
  <text x="664.875677" y="115.563517" text-anchor="middle" font-size="28.510397" font-weight="bold" fill="var(--bg)">Provider</text>
  <text x="664.875677" y="315.704317" text-anchor="middle" font-size="37.063385" font-weight="bold" fill="var(--ok-accent)">Provider</text>
  <text x="664.875677" y="489.29587" text-anchor="middle" font-size="31.361339" fill="var(--text-muted)">Plugin</text>
  <line x1="836.019971" y1="330.000125" x2="933.532417" y2="330.000125" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="946.467636" y="40" width="293.532364" height="580" rx="9.842145" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="946.467636" y="40" width="293.532364" height="118.450943" rx="9.842145" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="946.467636" y="121.690112" width="293.532364" height="36.760575" fill="var(--warn-fill)" rx="9.842145" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1093.731436" y="115.563517" text-anchor="middle" font-size="28.510397" font-weight="bold" fill="var(--bg)">Cloud</text>
  <text x="1093.731436" y="315.704317" text-anchor="middle" font-size="37.063385" font-weight="bold" fill="var(--warn-accent)">Cloud</text>
  <text x="1093.731436" y="489.29587" text-anchor="middle" font-size="31.361339" fill="var(--text-muted)">API</text>
</svg>
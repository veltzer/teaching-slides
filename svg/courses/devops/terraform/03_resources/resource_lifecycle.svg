<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="891.3358" height="470.4653" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="742.8018" y="247.5485" width="206.1214" height="54.8875" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="845.8626" y="280.8729" text-anchor="middle" font-size="18.1628" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Create</text>
  <line x1="845.8626" y1="302.436" x2="845.8626" y2="354.7099" stroke="var(--primary-border)" stroke-width="0.5606" marker-end="url(#arrow-primary)"/>
  <rect x="742.8018" y="354.7099" width="206.1214" height="54.8875" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="845.8626" y="388.0346" text-anchor="middle" font-size="18.1628" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Read</text>
  <line x1="948.9231" y1="382.1536" x2="1068.6964" y2="456.644" stroke="var(--primary-border)" stroke-width="0.5606" marker-end="url(#arrow-primary)"/>
  <line x1="742.8018" y1="382.1536" x2="623.0284" y2="456.644" stroke="var(--primary-border)" stroke-width="0.5606" marker-end="url(#arrow-primary)"/>
  <rect x="983.0446" y="456.644" width="206.1214" height="54.8875" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1086.1053" y="489.9688" text-anchor="middle" font-size="18.1628" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Update</text>
  <rect x="503.2551" y="456.644" width="206.1214" height="54.8875" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="606.316" y="489.9688" text-anchor="middle" font-size="18.1628" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Delete</text>
  <path d="M 1189.1659 484.0877 Q 1240 382.1536 948.9231 382.1536" fill="none" stroke="var(--primary-border)" stroke-width="0.5606" marker-end="url(#arrow-primary)"/>
  <path d="M 503.2551 484.0877 Q 451.7249 382.1536 742.8018 382.1536" fill="none" stroke="var(--primary-border)" stroke-width="0.5606" marker-end="url(#arrow-primary)"/>
  <text x="845.8626" y="561.1918" text-anchor="middle" font-size="18.1628" fill="var(--text-muted)" font-family="Arial, sans-serif">Create: terraform apply --&gt; API call --&gt; State updated</text>
  <text x="845.8626" y="580.7947" text-anchor="middle" font-size="18.1628" fill="var(--text-muted)" font-family="Arial, sans-serif">Read: terraform plan --&gt; API call --&gt; Compare to config</text>
  <text x="845.8626" y="600.3973" text-anchor="middle" font-size="18.1628" fill="var(--text-muted)" font-family="Arial, sans-serif">Update: terraform apply --&gt; API call --&gt; State updated</text>
  <text x="845.8626" y="620" text-anchor="middle" font-size="18.1628" fill="var(--text-muted)" font-family="Arial, sans-serif">Delete: terraform destroy --&gt; API call --&gt; State updated</text>
</svg>

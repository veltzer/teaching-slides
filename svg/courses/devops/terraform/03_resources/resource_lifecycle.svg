<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="475.3791" height="267.4008" fill="var(--bg)" rx="5.1795" />
  <rect x="374.8276" y="117.9654" width="109.9314" height="31.1967" rx="5.1795" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.1368" filter="url(#shadow)" />
  <text x="429.7934" y="136.9062" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">Create</text>
  <line x1="429.7934" y1="149.1621" x2="429.7934" y2="178.8733" stroke="var(--primary-border)" stroke-width="0.5606" marker-end="url(#arrow-primary)" />
  <rect x="374.8276" y="178.8733" width="109.9314" height="31.1967" rx="5.1795" fill="var(--surface)" stroke="var(--border)" stroke-width="0.5684" filter="url(#shadow)" />
  <text x="429.7934" y="197.8142" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Read</text>
  <line x1="484.759" y1="194.4716" x2="548.6381" y2="236.8101" stroke="var(--primary-border)" stroke-width="0.5606" marker-end="url(#arrow-primary)" />
  <line x1="374.8276" y1="194.4716" x2="310.9485" y2="236.8101" stroke="var(--primary-border)" stroke-width="0.5606" marker-end="url(#arrow-primary)" />
  <rect x="502.9571" y="236.8101" width="109.9314" height="31.1967" rx="5.1795" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.1368" filter="url(#shadow)" />
  <text x="557.9228" y="255.7511" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-accent)">Update</text>
  <rect x="247.0694" y="236.8101" width="109.9314" height="31.1967" rx="5.1795" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.1368" filter="url(#shadow)" />
  <text x="302.0352" y="255.7511" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-accent)">Delete</text>
  <path d="M 612.8885 252.4084 Q 640 194.4716 484.759 194.4716" fill="none" stroke="var(--primary-border)" stroke-width="0.5606" marker-end="url(#arrow-primary)" />
  <path d="M 247.0694 252.4084 Q 219.5866 194.4716 374.8276 194.4716" fill="none" stroke="var(--primary-border)" stroke-width="0.5606" marker-end="url(#arrow-primary)" />
  <text x="429.7934" y="296.2325" text-anchor="middle" font-size="10" fill="var(--text-muted)">Create: terraform apply --&gt; API call --&gt; State updated</text>
  <text x="429.7934" y="307.3743" text-anchor="middle" font-size="10" fill="var(--text-muted)">Read: terraform plan --&gt; API call --&gt; Compare to config</text>
  <text x="429.7934" y="318.5159" text-anchor="middle" font-size="10" fill="var(--text-muted)">Update: terraform apply --&gt; API call --&gt; State updated</text>
  <text x="429.7934" y="329.6576" text-anchor="middle" font-size="10" fill="var(--text-muted)">Delete: terraform destroy --&gt; API call --&gt; State updated</text>
</svg>
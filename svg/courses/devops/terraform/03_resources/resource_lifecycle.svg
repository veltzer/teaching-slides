<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="891.3358" height="470.4653" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="742.8018" y="247.5485" width="206.1214" height="54.8875" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="845.8626" y="280.8729" text-anchor="middle" font-size="18.1628" font-weight="bold" fill="var(--ok-accent)">Create</text>
  <line x1="845.8626" y1="302.436" x2="845.8626" y2="354.7099" stroke="var(--primary-border)" stroke-width="0.5606" marker-end="url(#arrow-primary)" />
  <rect x="742.8018" y="354.7099" width="206.1214" height="54.8875" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="845.8626" y="388.0346" text-anchor="middle" font-size="18.1628" font-weight="bold" fill="var(--primary-accent)">Read</text>
  <line x1="948.9231" y1="382.1536" x2="1068.6964" y2="456.644" stroke="var(--primary-border)" stroke-width="0.5606" marker-end="url(#arrow-primary)" />
  <line x1="742.8018" y1="382.1536" x2="623.0284" y2="456.644" stroke="var(--primary-border)" stroke-width="0.5606" marker-end="url(#arrow-primary)" />
  <rect x="983.0446" y="456.644" width="206.1214" height="54.8875" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1086.1053" y="489.9688" text-anchor="middle" font-size="18.1628" font-weight="bold" fill="var(--warn-accent)">Update</text>
  <rect x="503.2551" y="456.644" width="206.1214" height="54.8875" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="606.316" y="489.9688" text-anchor="middle" font-size="18.1628" font-weight="bold" fill="var(--danger-accent)">Delete</text>
  <path d="M 1189.1659 484.0877 Q 1240 382.1536 948.9231 382.1536" fill="none" stroke="var(--primary-border)" stroke-width="0.5606" marker-end="url(#arrow-primary)" />
  <path d="M 503.2551 484.0877 Q 451.7249 382.1536 742.8018 382.1536" fill="none" stroke="var(--primary-border)" stroke-width="0.5606" marker-end="url(#arrow-primary)" />
  <text x="845.8626" y="561.1918" text-anchor="middle" font-size="18.1628" fill="var(--text-muted)">Create: terraform apply --&gt; API call --&gt; State updated</text>
  <text x="845.8626" y="580.7947" text-anchor="middle" font-size="18.1628" fill="var(--text-muted)">Read: terraform plan --&gt; API call --&gt; Compare to config</text>
  <text x="845.8626" y="600.3973" text-anchor="middle" font-size="18.1628" fill="var(--text-muted)">Update: terraform apply --&gt; API call --&gt; State updated</text>
  <text x="845.8626" y="620" text-anchor="middle" font-size="18.1628" fill="var(--text-muted)">Delete: terraform destroy --&gt; API call --&gt; State updated</text>
</svg>
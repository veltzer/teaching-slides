  <rect x="873.3333" y="355" width="77.7778" height="125" rx="6.1458" fill="var(--text)" stroke="var(--text-faint)" stroke-width="2.1695" opacity="0.6" />
  <line x1="884.4445" y1="386.25" x2="940" y2="386.25" stroke="var(--primary-border)" stroke-width="2" opacity="0.5" />
  <line x1="884.4445" y1="411.25" x2="940" y2="411.25" stroke="var(--primary-border)" stroke-width="2" opacity="0.5" />
  <line x1="884.4445" y1="436.25" x2="940" y2="436.25" stroke="var(--primary-border)" stroke-width="2" opacity="0.5" />
  <circle cx="934.4444" cy="461.25" r="4.4445" fill="var(--primary-fill)" opacity="0.6" />
  <text x="584.4444" y="405" font-family="monospace" font-size="13.3333" fill="var(--border)" opacity="0.5">resource "aws_instance"</text>
  <text x="595.5556" y="430" font-family="monospace" font-size="13.3333" fill="var(--border)" opacity="0.4">  ami = "..."</text>
  <text x="595.5556" y="455" font-family="monospace" font-size="13.3333" fill="var(--border)" opacity="0.4">  type = "t2.micro"</text>
  <text x="640" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--border)" letter-spacing="3">TERRAFORM INFRASTRUCTURE AS CODE</text>
</svg>
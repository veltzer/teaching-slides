  <ellipse cx="1206.6623" cy="304.6846" rx="24.4476" ry="16.016" fill="var(--text-muted)" opacity="0.5"/>
  <path d="M 734.3788 304.6846 L 834.392 293.4235" stroke="var(--ok-border)" stroke-width="1.081" opacity="0.5"/>
  <polygon points="834.392,288.919 847.727,293.4235 834.392,297.928" fill="var(--ok-fill)" opacity="0.5"/>
  <path d="M 1045.5304 304.6846 L 1112.2057 310.3153" stroke="var(--ok-border)" stroke-width="1.081" opacity="0.5"/>
  <polygon points="1112.2057,305.8108 1125.5407,310.3153 1112.2057,314.8197" fill="var(--ok-fill)" opacity="0.5"/>
  <rect x="589.9157" y="439.8199" width="77.7878" height="112.6126" rx="6" fill="var(--text)" stroke="var(--text-faint)" stroke-width="1.081" opacity="0.6"/>
  <line x1="601.0283" y1="467.973" x2="656.591" y2="467.973" stroke="var(--ok-border)" stroke-width="0.9966" opacity="0.5"/>
  <line x1="601.0283" y1="490.4954" x2="656.591" y2="490.4954" stroke="var(--ok-border)" stroke-width="0.9966" opacity="0.5"/>
  <line x1="601.0283" y1="513.018" x2="656.591" y2="513.018" stroke="var(--ok-border)" stroke-width="0.9966" opacity="0.5"/>
  <circle cx="651.0348" cy="535.5405" r="4.2189" fill="var(--ok-fill)" opacity="0.6"/>
  <rect x="1134.4308" y="439.8199" width="77.7878" height="112.6126" rx="6" fill="var(--text)" stroke="var(--text-faint)" stroke-width="1.081" opacity="0.6"/>
  <line x1="1145.5432" y1="467.973" x2="1201.1059" y2="467.973" stroke="var(--primary-border)" stroke-width="0.9966" opacity="0.5"/>
  <line x1="1145.5432" y1="490.4954" x2="1201.1059" y2="490.4954" stroke="var(--primary-border)" stroke-width="0.9966" opacity="0.5"/>
  <line x1="1145.5432" y1="513.018" x2="1201.1059" y2="513.018" stroke="var(--primary-border)" stroke-width="0.9966" opacity="0.5"/>
  <circle cx="1195.5499" cy="535.5405" r="4.2189" fill="var(--primary-fill)" opacity="0.6"/>
  <text x="845.5044" y="484.8648" font-size="15.9004" fill="var(--border)" opacity="0.5" font-family="Courier New, monospace">resource "aws_instance"</text>
  <text x="856.617" y="507.3874" font-size="15.9004" fill="var(--border)" opacity="0.4" font-family="Courier New, monospace">  ami = "..."</text>
  <text x="856.617" y="529.9099" font-size="15.9004" fill="var(--border)" opacity="0.4" font-family="Courier New, monospace">  type = "t2.micro"</text>
  <text x="901.0672" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.9845" fill="var(--border)" letter-spacing="3">TERRAFORM INFRASTRUCTURE AS CODE</text>
</svg>

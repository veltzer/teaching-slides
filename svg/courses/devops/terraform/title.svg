  <polygon points="851.1111,206.25 864.4444,211.25 851.1111,216.2499" fill="var(--ok-fill)" opacity="0.5" />
  <rect x="328.8889" y="355" width="77.7778" height="125" rx="6.1458" fill="var(--text)" stroke="var(--text-faint)" stroke-width="2.1695" opacity="0.6" />
  <line x1="340" y1="386.25" x2="395.5555" y2="386.25" stroke="var(--ok-border)" stroke-width="2" opacity="0.5" />
  <line x1="340" y1="411.25" x2="395.5555" y2="411.25" stroke="var(--ok-border)" stroke-width="2" opacity="0.5" />
  <line x1="340" y1="436.25" x2="395.5555" y2="436.25" stroke="var(--ok-border)" stroke-width="2" opacity="0.5" />

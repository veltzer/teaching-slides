  <path d="M 473.3333 205 L 573.3334 192.5" stroke="var(--ok-border)" stroke-width="2.1695" opacity="0.5" />
  <polygon points="573.3334,187.5 586.6667,192.5 573.3334,197.5" fill="var(--ok-fill)" opacity="0.5" />

  <ellipse cx="656.591" cy="304.6846" rx="66.6753" ry="30.0301" fill="var(--text-muted)" opacity="0.5"/>
  <ellipse cx="634.3658" cy="299.0541" rx="33.3377" ry="20.0201" fill="var(--text-muted)" opacity="0.5"/>
  <ellipse cx="689.9285" cy="293.4235" rx="27.7814" ry="18.0181" fill="var(--text-muted)" opacity="0.5"/>

  <polygon points="684.4444,267.4999 728.8889,242.5 773.3333,267.4999 773.3333,317.5 728.8889,342.5 684.4444,317.5" fill="var(--info-fill)" opacity="0.7" />
  <ellipse cx="395.5555" cy="205" rx="66.6666" ry="33.3334" fill="var(--text-muted)" opacity="0.5" />
  <ellipse cx="373.3333" cy="198.75" rx="33.3334" ry="22.2222" fill="var(--text-muted)" opacity="0.5" />
  <ellipse cx="428.8889" cy="192.5" rx="27.7777" ry="20" fill="var(--text-muted)" opacity="0.5" />

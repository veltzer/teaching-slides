<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="46.2222" y="32" width="495.1111" height="160" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="293.3333" y="78.2222" font-size="19.5556" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">String Functions</text>
  <text x="293.3333" y="119.1111" font-size="16" fill="var(--text)" text-anchor="middle">upper, lower,</text>
  <text x="293.3333" y="158.2222" font-size="16" fill="var(--text)" text-anchor="middle">format, join</text>
  <rect x="596.4444" y="32" width="495.1111" height="160" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="844.4444" y="78.2222" font-size="19.5556" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Numeric Functions</text>
  <text x="844.4444" y="119.1111" font-size="16" fill="var(--text)" text-anchor="middle">min, max, abs,</text>
  <text x="844.4444" y="158.2222" font-size="16" fill="var(--text)" text-anchor="middle">ceil, floor, log</text>
  <rect x="46.2222" y="240" width="495.1111" height="160" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="293.3333" y="286.2222" font-size="19.5556" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Collection Functions</text>
  <text x="293.3333" y="327.1111" font-size="16" fill="var(--text)" text-anchor="middle">length, merge,</text>
  <text x="293.3333" y="366.2222" font-size="16" fill="var(--text)" text-anchor="middle">flatten, keys</text>
  <rect x="596.4444" y="240" width="495.1111" height="160" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="844.4444" y="286.2222" font-size="19.5556" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Encoding Functions</text>
  <text x="844.4444" y="327.1111" font-size="16" fill="var(--text)" text-anchor="middle">jsonencode, base64,</text>
  <text x="844.4444" y="366.2222" font-size="16" fill="var(--text)" text-anchor="middle">yamlencode, csv</text>
  <rect x="46.2222" y="448" width="495.1111" height="160" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="293.3333" y="494.2222" font-size="19.5556" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Filesystem Functions</text>
  <text x="293.3333" y="535.1111" font-size="16" fill="var(--text)" text-anchor="middle">file, fileexists,</text>
  <text x="293.3333" y="574.2222" font-size="16" fill="var(--text)" text-anchor="middle">templatefile</text>
  <rect x="596.4444" y="448" width="495.1111" height="160" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="844.4444" y="494.2222" font-size="19.5556" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Date/Time &amp; Hash</text>
  <text x="844.4444" y="535.1111" font-size="16" fill="var(--text)" text-anchor="middle">timestamp, md5,</text>
  <text x="844.4444" y="574.2222" font-size="16" fill="var(--text)" text-anchor="middle">sha256, uuid</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="620" height="300" font-family="sans-serif">
<rect x="25" y="15" width="270" height="70" fill="#e3f2fd" stroke="#333" stroke-width="1.5" rx="4"/>
<text x="160" y="35" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">String Functions</text>
<text x="160" y="53" font-size="11" font-weight="normal" fill="#222" text-anchor="middle">upper, lower,</text>
<text x="160" y="70" font-size="11" font-weight="normal" fill="#222" text-anchor="middle">format, join</text>
<rect x="325" y="15" width="270" height="70" fill="#e8f5e9" stroke="#333" stroke-width="1.5" rx="4"/>
<text x="460" y="35" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">Numeric Functions</text>
<text x="460" y="53" font-size="11" font-weight="normal" fill="#222" text-anchor="middle">min, max, abs,</text>
<text x="460" y="70" font-size="11" font-weight="normal" fill="#222" text-anchor="middle">ceil, floor, log</text>
<rect x="25" y="115" width="270" height="70" fill="#fff3e0" stroke="#333" stroke-width="1.5" rx="4"/>
<text x="160" y="135" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">Collection Funcs</text>
<text x="160" y="153" font-size="11" font-weight="normal" fill="#222" text-anchor="middle">length, merge,</text>
<text x="160" y="170" font-size="11" font-weight="normal" fill="#222" text-anchor="middle">flatten, keys</text>
<rect x="325" y="115" width="270" height="70" fill="#fce4ec" stroke="#333" stroke-width="1.5" rx="4"/>
<text x="460" y="135" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">Encoding Functions</text>
<text x="460" y="153" font-size="11" font-weight="normal" fill="#222" text-anchor="middle">jsonencode, base64,</text>
<text x="460" y="170" font-size="11" font-weight="normal" fill="#222" text-anchor="middle">yamlencode, csv</text>
<rect x="25" y="215" width="270" height="70" fill="#f3e5f5" stroke="#333" stroke-width="1.5" rx="4"/>
<text x="160" y="235" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">Filesystem Funcs</text>
<text x="160" y="253" font-size="11" font-weight="normal" fill="#222" text-anchor="middle">file, fileexists,</text>
<text x="160" y="270" font-size="11" font-weight="normal" fill="#222" text-anchor="middle">templatefile</text>
<rect x="325" y="215" width="270" height="70" fill="#e8eaf6" stroke="#333" stroke-width="1.5" rx="4"/>
<text x="460" y="235" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">Date/Time &amp; Hash</text>
<text x="460" y="253" font-size="11" font-weight="normal" fill="#222" text-anchor="middle">timestamp, md5,</text>
<text x="460" y="270" font-size="11" font-weight="normal" fill="#222" text-anchor="middle">sha256, uuid</text>
</svg>

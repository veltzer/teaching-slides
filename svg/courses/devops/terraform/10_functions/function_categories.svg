<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="568.367398" height="161.111111" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.598289" filter="url(#shadow)"/>
  <text x="323.673495" y="86.543222" font-size="21.025008" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">String Functions</text>
  <text x="323.673495" y="127.716" font-size="17.20229" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">upper, lower,</text>
  <text x="323.673495" y="167.098778" font-size="17.20229" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">format, join</text>
  <rect x="671.632602" y="40" width="568.367398" height="161.111111" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.598289" filter="url(#shadow)"/>
  <text x="956.326505" y="86.543222" font-size="21.025008" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle" font-family="Arial, sans-serif">Numeric Functions</text>
  <text x="956.326505" y="127.716" font-size="17.20229" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">min, max, abs,</text>
  <text x="956.326505" y="167.098778" font-size="17.20229" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">ceil, floor, log</text>
  <rect x="40" y="249.444444" width="568.367398" height="161.111111" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.598289" filter="url(#shadow)"/>
  <text x="323.673495" y="295.987667" font-size="21.025008" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle" font-family="Arial, sans-serif">Collection Functions</text>
  <text x="323.673495" y="337.160444" font-size="17.20229" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">length, merge,</text>
  <text x="323.673495" y="376.543222" font-size="17.20229" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">flatten, keys</text>
  <rect x="671.632602" y="249.444444" width="568.367398" height="161.111111" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.598289" filter="url(#shadow)"/>
  <text x="956.326505" y="295.987667" font-size="21.025008" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle" font-family="Arial, sans-serif">Encoding Functions</text>
  <text x="956.326505" y="337.160444" font-size="17.20229" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">jsonencode, base64,</text>
  <text x="956.326505" y="376.543222" font-size="17.20229" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">yamlencode, csv</text>
  <rect x="40" y="458.888889" width="568.367398" height="161.111111" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.598289" filter="url(#shadow)"/>
  <text x="323.673495" y="505.432111" font-size="21.025008" font-weight="bold" fill="var(--info-accent)" text-anchor="middle" font-family="Arial, sans-serif">Filesystem Functions</text>
  <text x="323.673495" y="546.604889" font-size="17.20229" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">file, fileexists,</text>
  <text x="323.673495" y="585.987667" font-size="17.20229" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">templatefile</text>
  <rect x="671.632602" y="458.888889" width="568.367398" height="161.111111" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.598289" filter="url(#shadow)"/>
  <text x="956.326505" y="505.432111" font-size="21.025008" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">Date/Time &amp; Hash</text>
  <text x="956.326505" y="546.604889" font-size="17.20229" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">timestamp, md5,</text>
  <text x="956.326505" y="585.987667" font-size="17.20229" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">sha256, uuid</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="342.713598" height="580" rx="9.961879" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="40" y="40" width="342.713598" height="120.143033" rx="9.961879" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="118.714499" width="342.713598" height="41.428536" fill="url(#grad-primary)" rx="9.961879" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="210.854287" y="114.571414" text-anchor="middle" font-size="31.742864" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Provision</text>
  <text x="210.854287" y="300.999948" text-anchor="middle" font-size="28.857241" fill="var(--primary-accent)" font-family="Arial, sans-serif">Terraform</text>
  <text x="210.854287" y="396.285758" text-anchor="middle" font-size="28.857241" fill="var(--primary-accent)" font-family="Arial, sans-serif">Packer</text>
  <text x="210.854287" y="524.71419" text-anchor="middle" font-size="23.08566" fill="var(--text-muted)" font-family="Arial, sans-serif">Create VMs, networks, storage</text>
  <line x1="382.713598" y1="330.000257" x2="464.120641" y2="330.000257" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="468.140742" y="40" width="342.713598" height="580" rx="9.961879" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="468.140742" y="40" width="342.713598" height="120.143033" rx="9.961879" fill="var(--ok-accent)"/>
  <rect x="468.140742" y="118.714499" width="342.713598" height="41.428536" fill="var(--ok-accent)" rx="9.961879"/>
  <text x="640.000054" y="114.571414" text-anchor="middle" font-size="31.742864" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Configure</text>
  <text x="640.000054" y="300.999948" text-anchor="middle" font-size="25.97145" fill="var(--ok-accent)" font-family="Arial, sans-serif">Ansible / Chef / Puppet</text>
  <text x="640.000054" y="524.71419" text-anchor="middle" font-size="23.08566" fill="var(--text-muted)" font-family="Arial, sans-serif">Install SW, configure OS, manage users</text>
  <line x1="810.85434" y1="330.000257" x2="893.266408" y2="330.000257" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="897.286402" y="40" width="342.713598" height="580" rx="9.961879" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="897.286402" y="40" width="342.713598" height="120.143033" rx="9.961879" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="897.286402" y="118.714499" width="342.713598" height="41.428536" fill="url(#grad-warn)" rx="9.961879" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1068.140795" y="114.571414" text-anchor="middle" font-size="31.742864" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Deploy</text>
  <text x="1068.140795" y="300.999948" text-anchor="middle" font-size="25.97145" fill="var(--warn-accent)" font-family="Arial, sans-serif">CI/CD / Jenkins / ArgoCD</text>
  <text x="1068.140795" y="524.71419" text-anchor="middle" font-size="23.08566" fill="var(--text-muted)" font-family="Arial, sans-serif">Deploy apps, update code</text>
</svg>

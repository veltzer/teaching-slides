<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" font-family="Arial, sans-serif">
  <text x="240" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Terraform's Role in the Stack</text>
  <!-- Application Code -->
  <rect x="30" y="45" width="420" height="55" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="240" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Application Code</text>
  <text x="240" y="88" text-anchor="middle" font-size="11" fill="#555">(deployed by CI/CD)</text>
  <!-- Application Configuration -->
  <rect x="30" y="110" width="420" height="55" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="240" y="133" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Application Configuration</text>
  <text x="240" y="153" text-anchor="middle" font-size="11" fill="#555">(Ansible / Chef)</text>
  <!-- Operating System -->
  <rect x="30" y="175" width="420" height="55" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="240" y="198" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Operating System</text>
  <text x="240" y="218" text-anchor="middle" font-size="11" fill="#555">(Packer image)</text>
  <!-- Infrastructure (Terraform) -->
  <rect x="30" y="240" width="420" height="90" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="240" y="263" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90e2">Infrastructure (Terraform)</text>
  <text x="120" y="283" font-size="11" fill="#555">Compute (EC2, VMs)</text>
  <text x="120" y="298" font-size="11" fill="#555">Networking (VPC, subnets, LB)</text>
  <text x="300" y="283" font-size="11" fill="#555">Storage (S3, EBS, RDS)</text>
  <text x="300" y="298" font-size="11" fill="#555">Security (IAM, SG, KMS)</text>
</svg>
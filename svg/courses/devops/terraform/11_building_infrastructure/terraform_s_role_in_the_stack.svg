<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Application Code -->
  <rect x="80" y="80" width="1120" height="118" rx="12" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="3" filter="url(#shadow)"/>
  <text x="640" y="132" text-anchor="middle" font-size="22" font-weight="bold" fill="#1565c0">Application Code</text>
  <text x="640" y="174" text-anchor="middle" font-size="18" fill="#555">(deployed by CI/CD)</text>
  <!-- Application Configuration -->
  <rect x="80" y="218" width="1120" height="118" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3" filter="url(#shadow)"/>
  <text x="640" y="270" text-anchor="middle" font-size="22" font-weight="bold" fill="#2e7d32">Application Configuration</text>
  <text x="640" y="312" text-anchor="middle" font-size="18" fill="#555">(Ansible / Chef)</text>
  <!-- Operating System -->
  <rect x="80" y="356" width="1120" height="118" rx="12" fill="#fff8e1" stroke="#f57c00" stroke-width="3" filter="url(#shadow)"/>
  <text x="640" y="408" text-anchor="middle" font-size="22" font-weight="bold" fill="#e65100">Operating System</text>
  <text x="640" y="450" text-anchor="middle" font-size="18" fill="#555">(Packer image)</text>
  <!-- Infrastructure (Terraform) - highlighted -->
  <rect x="80" y="494" width="1120" height="196" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="5" filter="url(#shadow)"/>
  <text x="640" y="546" text-anchor="middle" font-size="22" font-weight="bold" fill="#1565c0">Infrastructure (Terraform)</text>
  <text x="320" y="590" font-size="18" fill="#555">Compute (EC2, VMs)</text>
  <text x="320" y="622" font-size="18" fill="#555">Networking (VPC, subnets, LB)</text>
  <text x="800" y="590" font-size="18" fill="#555">Storage (S3, EBS, RDS)</text>
  <text x="800" y="622" font-size="18" fill="#555">Security (IAM, SG, KMS)</text>
</svg>

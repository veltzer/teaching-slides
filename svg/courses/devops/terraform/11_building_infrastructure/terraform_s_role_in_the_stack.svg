<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="112.196771" rx="6.968648" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="89.442635" text-anchor="middle" font-size="22.205133" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Application Code</text>
  <text x="640" y="129.377139" text-anchor="middle" font-size="18.167847" fill="var(--text-muted)" font-family="Arial, sans-serif">(deployed by CI/CD)</text>
  <rect x="40" y="171.213151" width="1200" height="112.196771" rx="6.968648" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="220.655786" text-anchor="middle" font-size="22.205133" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Application Configuration</text>
  <text x="640" y="260.590172" text-anchor="middle" font-size="18.167847" fill="var(--text-muted)" font-family="Arial, sans-serif">(Ansible / Chef)</text>
  <rect x="40" y="302.426184" width="1200" height="112.196771" rx="6.968648" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="351.868937" text-anchor="middle" font-size="22.205133" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Operating System</text>
  <text x="640" y="391.803323" text-anchor="middle" font-size="18.167847" fill="var(--text-muted)" font-family="Arial, sans-serif">(Packer image)</text>
  <rect x="40" y="433.639335" width="1200" height="186.360665" rx="6.968648" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="483.08197" text-anchor="middle" font-size="22.205133" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Infrastructure (Terraform)</text>
  <text x="297.142743" y="524.917982" font-size="18.167847" fill="var(--text-muted)" font-family="Arial, sans-serif">Compute (EC2, VMs)</text>
  <text x="297.142743" y="555.344356" font-size="18.167847" fill="var(--text-muted)" font-family="Arial, sans-serif">Networking (VPC, subnets, LB)</text>
  <text x="811.428571" y="524.917982" font-size="18.167847" fill="var(--text-muted)" font-family="Arial, sans-serif">Storage (S3, EBS, RDS)</text>
  <text x="811.428571" y="555.344356" font-size="18.167847" fill="var(--text-muted)" font-family="Arial, sans-serif">Security (IAM, SG, KMS)</text>
</svg>

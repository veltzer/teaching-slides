<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="300" height="580" rx="10.611786" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="40" y="40" width="300" height="130.96776" rx="10.611786" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="124.193581" width="300" height="46.77418" fill="url(#grad-primary)" rx="10.611786" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="189.494842" y="121.854742" text-anchor="middle" font-size="30.739869" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Laptop</text>
  <text x="189.494842" y="367.419255" text-anchor="middle" font-size="33.813751" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Laptop</text>
  <rect x="478.383838" y="40" width="323.232215" height="580" rx="10.611786" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="478.383838" y="40" width="323.232215" height="130.96776" rx="10.611786" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="478.383838" y="124.193581" width="323.232215" height="46.77418" fill="url(#grad-warn)" rx="10.611786" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="121.854742" text-anchor="middle" font-size="30.739869" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Bastion</text>
  <text x="640" y="304.274071" text-anchor="middle" font-size="33.813751" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Bastion</text>
  <text x="640" y="496.048469" text-anchor="middle" font-size="27.665812" fill="var(--text-muted)" font-family="Arial, sans-serif">(public IP)</text>
  <rect x="940" y="40" width="300" height="580" rx="10.611786" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="940" y="40" width="300" height="130.96776" rx="10.611786" fill="var(--ok-accent)" />
  <rect x="940" y="124.193581" width="300" height="46.77418" fill="var(--ok-accent)" rx="10.611786"/>
  <text x="1090.504943" y="121.854742" text-anchor="middle" font-size="30.739869" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Target</text>
  <text x="1090.504943" y="304.274071" text-anchor="middle" font-size="33.813751" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Target</text>
  <text x="1090.504943" y="496.048469" text-anchor="middle" font-size="27.665812" fill="var(--text-muted)" font-family="Arial, sans-serif">(private IP)</text>
  <line x1="340" y1="322.984208" x2="473.333333" y2="322.984208" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="801.616162" y1="322.984208" x2="934.949387" y2="322.984208" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="407.67666" y="262.177279" text-anchor="middle" font-size="27.665812" fill="var(--text-muted)" font-family="Arial, sans-serif">SSH</text>
  <text x="868.282828" y="262.177279" text-anchor="middle" font-size="27.665812" fill="var(--text-muted)" font-family="Arial, sans-serif">SSH</text>
</svg>
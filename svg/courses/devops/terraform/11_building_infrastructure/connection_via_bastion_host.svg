<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Laptop -->
  <rect x="46" y="225" width="297" height="248" rx="12" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="5" filter="url(#shadow)"/>
  <rect x="46" y="225" width="297" height="56" rx="12" fill="url(#grad-accent)"/>
  <rect x="46" y="261" width="297" height="20" fill="url(#grad-accent)"/>
  <text x="194" y="260" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">Laptop</text>
  <text x="194" y="365" text-anchor="middle" font-size="22" font-weight="bold" fill="#1565c0">Laptop</text>
  <!-- Bastion -->
  <rect x="480" y="225" width="320" height="248" rx="12" fill="#fff8e1" stroke="#f57c00" stroke-width="5" filter="url(#shadow)"/>
  <rect x="480" y="225" width="320" height="56" rx="12" fill="#f57c00"/>
  <rect x="480" y="261" width="320" height="20" fill="#f57c00"/>
  <text x="640" y="260" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">Bastion</text>
  <text x="640" y="338" text-anchor="middle" font-size="22" font-weight="bold" fill="#e65100">Bastion</text>
  <text x="640" y="420" text-anchor="middle" font-size="18" fill="#555">(public IP)</text>
  <!-- Target -->
  <rect x="937" y="225" width="297" height="248" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="5" filter="url(#shadow)"/>
  <rect x="937" y="225" width="297" height="56" rx="12" fill="#2e7d32"/>
  <rect x="937" y="261" width="297" height="20" fill="#2e7d32"/>
  <text x="1086" y="260" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">Target</text>
  <text x="1086" y="338" text-anchor="middle" font-size="22" font-weight="bold" fill="#2e7d32">Target</text>
  <text x="1086" y="420" text-anchor="middle" font-size="18" fill="#555">(private IP)</text>
  <!-- Arrows -->
  <line x1="343" y1="346" x2="475" y2="346" stroke="#1e88e5" stroke-width="5" marker-end="url(#arrow-accent)"/>
  <line x1="800" y1="346" x2="932" y2="346" stroke="#2e7d32" stroke-width="5" marker-end="url(#arrow)"/>
  <!-- SSH labels -->
  <text x="410" y="320" text-anchor="middle" font-size="18" fill="#555">SSH</text>
  <text x="866" y="320" text-anchor="middle" font-size="18" fill="#555">SSH</text>
</svg>

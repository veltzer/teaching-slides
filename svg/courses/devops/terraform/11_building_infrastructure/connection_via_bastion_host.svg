<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" font-family="Arial, sans-serif">
  <text x="280" y="25" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Connection via Bastion Host</text>
  <!-- Laptop -->
  <rect x="20" y="50" width="130" height="55" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="85" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Laptop</text>
  <!-- Bastion -->
  <rect x="210" y="50" width="140" height="55" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="280" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Bastion</text>
  <text x="280" y="95" text-anchor="middle" font-size="11" fill="#555">(public IP)</text>
  <!-- Target -->
  <rect x="410" y="50" width="130" height="55" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="475" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Target</text>
  <text x="475" y="95" text-anchor="middle" font-size="11" fill="#555">(private IP)</text>
  <!-- Arrows -->
  <line x1="150" y1="77" x2="208" y2="77" stroke="#4a90e2" stroke-width="2" marker-end="url(#ba)"/>
  <line x1="350" y1="77" x2="408" y2="77" stroke="#28a745" stroke-width="2" marker-end="url(#ba2)"/>
  <text x="180" y="68" text-anchor="middle" font-size="10" fill="#555">SSH</text>
  <text x="380" y="68" text-anchor="middle" font-size="10" fill="#555">SSH</text>
  <defs>
    <marker id="ba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a90e2"/></marker>
    <marker id="ba2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#28a745"/></marker>
  </defs>
</svg>
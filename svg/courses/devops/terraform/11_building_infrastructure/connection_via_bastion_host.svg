<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="300" height="580" rx="10.611786" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="40" y="40" width="300" height="130.96776" rx="10.611786" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="40" y="124.193581" width="300" height="46.77418" fill="var(--primary-fill)" rx="10.611786" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="189.494842" y="121.854742" text-anchor="middle" font-size="30.739869" font-weight="bold" fill="var(--bg)">Laptop</text>
  <text x="189.494842" y="367.419255" text-anchor="middle" font-size="33.813751" font-weight="bold" fill="var(--primary-accent)">Laptop</text>
  <rect x="478.383838" y="40" width="323.232215" height="580" rx="10.611786" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="478.383838" y="40" width="323.232215" height="130.96776" rx="10.611786" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="478.383838" y="124.193581" width="323.232215" height="46.77418" fill="var(--warn-fill)" rx="10.611786" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="121.854742" text-anchor="middle" font-size="30.739869" font-weight="bold" fill="var(--bg)">Bastion</text>
  <text x="640" y="304.274071" text-anchor="middle" font-size="33.813751" font-weight="bold" fill="var(--warn-accent)">Bastion</text>
  <text x="640" y="496.048469" text-anchor="middle" font-size="27.665812" fill="var(--text-muted)">(public IP)</text>
  <rect x="940" y="40" width="300" height="580" rx="10.611786" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="940" y="40" width="300" height="130.96776" rx="10.611786" fill="var(--ok-accent)" />
  <rect x="940" y="124.193581" width="300" height="46.77418" fill="var(--ok-accent)" rx="10.611786"/>
  <text x="1090.504943" y="121.854742" text-anchor="middle" font-size="30.739869" font-weight="bold" fill="var(--bg)">Target</text>
  <text x="1090.504943" y="304.274071" text-anchor="middle" font-size="33.813751" font-weight="bold" fill="var(--ok-accent)">Target</text>
  <text x="1090.504943" y="496.048469" text-anchor="middle" font-size="27.665812" fill="var(--text-muted)">(private IP)</text>
  <line x1="340" y1="322.984208" x2="473.333333" y2="322.984208" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="801.616162" y1="322.984208" x2="934.949387" y2="322.984208" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="407.67666" y="262.177279" text-anchor="middle" font-size="27.665812" fill="var(--text-muted)">SSH</text>
  <text x="868.282828" y="262.177279" text-anchor="middle" font-size="27.665812" fill="var(--text-muted)">SSH</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="567.839196" height="256.538457" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6.673106" filter="url(#shadow)" />
  <rect x="40" y="40" width="567.839196" height="50.192314" rx="6.673106" fill="var(--danger-accent)" />
  <rect x="40" y="73.461543" width="567.839196" height="16.730771" fill="var(--danger-accent)" rx="6.673106"/>
  <text x="322.41206" y="71.602581" font-size="21.263409" font-weight="bold" fill="var(--bg)" text-anchor="middle">Configuration Errors</text>
  <text x="322.41206" y="177.564095" font-size="19.330432" fill="var(--text)" text-anchor="middle">(syntax, types)</text>
  <rect x="672.160804" y="40" width="567.839196" height="256.538457" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6.673106" filter="url(#shadow)" />
  <rect x="672.160804" y="40" width="567.839196" height="50.192314" rx="6.673106" fill="var(--warn-accent)" />
  <rect x="672.160804" y="73.461543" width="567.839196" height="16.730771" fill="var(--warn-accent)" rx="6.673106"/>
  <text x="955.577889" y="71.602581" font-size="21.263409" font-weight="bold" fill="var(--bg)" text-anchor="middle">Provider Errors</text>
  <text x="955.577889" y="177.564095" font-size="19.330432" fill="var(--text)" text-anchor="middle">(API, auth, quota)</text>
  <rect x="40" y="363.461543" width="567.839196" height="256.538457" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6.673106" filter="url(#shadow)" />
  <rect x="40" y="363.461543" width="567.839196" height="50.192314" rx="6.673106" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="396.923086" width="567.839196" height="16.730771" fill="var(--warn-fill)" rx="6.673106" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="322.41206" y="395.064124" font-size="21.263409" font-weight="bold" fill="var(--bg)" text-anchor="middle">State Errors</text>
  <text x="322.41206" y="502.8846" font-size="19.330432" fill="var(--text)" text-anchor="middle">(lock, corrupt, mismatch)</text>
  <rect x="672.160804" y="363.461543" width="567.839196" height="256.538457" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6.673106" filter="url(#shadow)" />
  <rect x="672.160804" y="363.461543" width="567.839196" height="50.192314" rx="6.673106" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="672.160804" y="396.923086" width="567.839196" height="16.730771" fill="var(--ok-fill)" rx="6.673106" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="955.577889" y="395.064124" font-size="21.263409" font-weight="bold" fill="var(--bg)" text-anchor="middle">Dependency Errors</text>
  <text x="955.577889" y="502.8846" font-size="19.330432" fill="var(--text)" text-anchor="middle">(cycles, missing)</text>
</svg>
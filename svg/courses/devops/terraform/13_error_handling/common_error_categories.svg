<svg xmlns="http://www.w3.org/2000/svg" width="600" height="220" font-family="sans-serif">
<rect x="20" y="15" width="265" height="80" fill="#fce4ec" stroke="#333" stroke-width="1.5" rx="4"/>
<text x="152" y="43" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">Configuration Errors</text>
<text x="152" y="65" font-size="12" font-weight="normal" fill="#222" text-anchor="middle">(syntax, types)</text>
<rect x="315" y="15" width="265" height="80" fill="#ffccbc" stroke="#333" stroke-width="1.5" rx="4"/>
<text x="447" y="43" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">Provider Errors</text>
<text x="447" y="65" font-size="12" font-weight="normal" fill="#222" text-anchor="middle">(API, auth, quota)</text>
<rect x="20" y="125" width="265" height="80" fill="#fff9c4" stroke="#333" stroke-width="1.5" rx="4"/>
<text x="152" y="153" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">State Errors</text>
<text x="152" y="175" font-size="12" font-weight="normal" fill="#222" text-anchor="middle">(lock, corrupt, mismatch)</text>
<rect x="315" y="125" width="265" height="80" fill="#dcedc8" stroke="#333" stroke-width="1.5" rx="4"/>
<text x="447" y="153" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">Dependency Errors</text>
<text x="447" y="175" font-size="12" font-weight="normal" fill="#222" text-anchor="middle">(cycles, missing)</text>
</svg>

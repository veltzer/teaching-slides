<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="567.839196" height="256.538457" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.673106" filter="url(#shadow)"/>
  <rect x="40" y="40" width="567.839196" height="50.192314" rx="6.673106" fill="var(--danger-accent)"/>
  <rect x="40" y="73.461543" width="567.839196" height="16.730771" fill="var(--danger-accent)" rx="6.673106"/>
  <text x="322.41206" y="71.602581" font-size="21.263409" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">Configuration Errors</text>
  <text x="322.41206" y="177.564095" font-size="19.330432" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">(syntax, types)</text>
  <rect x="672.160804" y="40" width="567.839196" height="256.538457" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.673106" filter="url(#shadow)"/>
  <rect x="672.160804" y="40" width="567.839196" height="50.192314" rx="6.673106" fill="var(--warn-accent)"/>
  <rect x="672.160804" y="73.461543" width="567.839196" height="16.730771" fill="var(--warn-accent)" rx="6.673106"/>
  <text x="955.577889" y="71.602581" font-size="21.263409" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">Provider Errors</text>
  <text x="955.577889" y="177.564095" font-size="19.330432" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">(API, auth, quota)</text>
  <rect x="40" y="363.461543" width="567.839196" height="256.538457" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.673106" filter="url(#shadow)"/>
  <rect x="40" y="363.461543" width="567.839196" height="50.192314" rx="6.673106" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="396.923086" width="567.839196" height="16.730771" fill="url(#grad-warn)" rx="6.673106" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="322.41206" y="395.064124" font-size="21.263409" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">State Errors</text>
  <text x="322.41206" y="502.8846" font-size="19.330432" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">(lock, corrupt, mismatch)</text>
  <rect x="672.160804" y="363.461543" width="567.839196" height="256.538457" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.673106" filter="url(#shadow)"/>
  <rect x="672.160804" y="363.461543" width="567.839196" height="50.192314" rx="6.673106" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="672.160804" y="396.923086" width="567.839196" height="16.730771" fill="url(#grad-ok)" rx="6.673106" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="955.577889" y="395.064124" font-size="21.263409" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">Dependency Errors</text>
  <text x="955.577889" y="502.8846" font-size="19.330432" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">(cycles, missing)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="211.428449" y="40" width="857.142959" height="55.317948" rx="7.315019" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000071" y="74.364182" font-size="23.308819" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Courier New, monospace">terraform apply</text>
  <line x1="640.000071" y1="95.317948" x2="640.000071" y2="120.462489" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="120.462489" width="1200" height="50.288978" rx="7.315019" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640.000071" y="151.473885" font-size="19.070863" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Read current state</text>
  <line x1="640.000071" y1="170.751467" x2="640.000071" y2="195.896008" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="195.896008" width="1200" height="50.288978" rx="7.315019" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640.000071" y="226.907403" font-size="19.070863" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Compare config vs state</text>
  <line x1="640.000071" y1="246.184985" x2="640.000071" y2="271.329526" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="271.329526" width="1200" height="50.288978" rx="7.315019" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640.000071" y="302.340922" font-size="19.070863" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Generate execution plan</text>
  <line x1="640.000071" y1="321.618504" x2="640.000071" y2="346.763045" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="346.763045" width="1200" height="50.288978" rx="7.315019" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640.000071" y="377.77444" font-size="19.070863" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Show plan to user</text>
  <line x1="640.000071" y1="397.052022" x2="640.000071" y2="422.196563" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="422.196563" width="1200" height="50.288978" rx="7.315019" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000071" y="453.207959" font-size="19.070863" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Wait for confirmation</text>
  <line x1="640.000071" y1="472.485541" x2="640.000071" y2="497.630082" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="497.630082" width="1200" height="50.288978" rx="7.315019" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000071" y="528.641477" font-size="19.070863" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Create / modify / delete resources</text>
  <line x1="640.000071" y1="547.919059" x2="640.000071" y2="573.0636" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="573.0636" width="1200" height="46.9364" rx="7.315019" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000071" y="603.237007" font-size="19.070863" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Update state file and show outputs</text>
</svg>
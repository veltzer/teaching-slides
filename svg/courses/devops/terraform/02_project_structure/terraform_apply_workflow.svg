  <ns0:text x="568.8889" y="292.4444" font-size="16" fill="#222" text-anchor="middle">Generate execution plan</ns0:text>
  <ns0:line x1="568.8889" y1="312.8889" x2="568.8889" y2="339.5556" stroke="#555" stroke-width="2.2222" marker-end="url(#arrow)" />

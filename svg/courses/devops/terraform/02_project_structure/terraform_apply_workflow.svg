<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Header -->
  <rect x="320" y="16" width="640" height="66" rx="8" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="57" font-family="monospace" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">terraform apply</text>
  <line x1="640" y1="82" x2="640" y2="112" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- Steps -->
  <rect x="192" y="112" width="896" height="60" rx="8" fill="url(#grad-surface)" stroke="#555" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="149" font-size="18" fill="#222" text-anchor="middle">Read current state</text>
  <line x1="640" y1="172" x2="640" y2="202" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="192" y="202" width="896" height="60" rx="8" fill="url(#grad-surface)" stroke="#555" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="239" font-size="18" fill="#222" text-anchor="middle">Compare config vs state</text>
  <line x1="640" y1="262" x2="640" y2="292" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="192" y="292" width="896" height="60" rx="8" fill="url(#grad-surface)" stroke="#555" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="329" font-size="18" fill="#222" text-anchor="middle">Generate execution plan</text>
  <line x1="640" y1="352" x2="640" y2="382" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="192" y="382" width="896" height="60" rx="8" fill="url(#grad-surface)" stroke="#555" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="419" font-size="18" fill="#222" text-anchor="middle">Show plan to user</text>
  <line x1="640" y1="442" x2="640" y2="472" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="192" y="472" width="896" height="60" rx="8" fill="#fff8e1" stroke="#f57c00" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="509" font-size="18" fill="#222" text-anchor="middle">Wait for confirmation</text>
  <line x1="640" y1="532" x2="640" y2="562" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="192" y="562" width="896" height="60" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="599" font-size="18" fill="#222" text-anchor="middle">Create / modify / delete resources</text>
  <line x1="640" y1="622" x2="640" y2="652" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="192" y="652" width="896" height="56" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="688" font-size="18" fill="#222" text-anchor="middle">Update state file and show outputs</text>
</svg>

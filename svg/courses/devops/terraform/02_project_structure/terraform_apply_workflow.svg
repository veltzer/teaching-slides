  <ns0:text x="568.8889" y="532.4444" font-size="16" fill="#222" text-anchor="middle">Create / modify / delete resources</ns0:text>
  <ns0:line x1="568.8889" y1="552.8889" x2="568.8889" y2="579.5556" stroke="#555" stroke-width="2.2222" marker-end="url(#arrow)" />
  <ns0:rect x="170.6667" y="579.5556" width="796.4444" height="49.7778" rx="7.1111" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="611.5556" font-size="16" fill="#222" text-anchor="middle">Update state file and show outputs</ns0:text>
</ns0:svg>
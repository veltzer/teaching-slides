<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="431.517129" y="40" width="416.965742" height="71.096871" rx="6.606652" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="83.032314" font-family="monospace" font-size="22.965383" font-weight="bold" fill="var(--bg)" text-anchor="middle">terraform init</text>
  <line x1="640" y1="111.096871" x2="640" y2="146.645132" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="274.910277" y1="146.645132" x2="1005.089618" y2="146.645132" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="274.910277" y1="146.645132" x2="274.910277" y2="180.322554" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="640" y1="146.645132" x2="640" y2="180.322554" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1005.089618" y1="146.645132" x2="1005.089618" y2="180.322554" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="180.322554" width="469.820555" height="65.48389" rx="6.606652" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="274.910277" y="218.677422" font-size="17.224092" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Configure backend</text>
  <line x1="274.910277" y1="245.80656" x2="274.910277" y2="277.612911" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="277.612911" width="469.820555" height="56.128999" rx="6.606652" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="274.910277" y="310.354914" font-size="15.310255" fill="var(--text-muted)" text-anchor="middle">Local or remote state</text>
  <rect x="431.517129" y="180.322554" width="416.965742" height="65.48389" rx="6.606652" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="218.677422" font-size="17.224092" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Download providers</text>
  <line x1="640" y1="245.80656" x2="640" y2="277.612911" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="431.517129" y="277.612911" width="416.965742" height="56.128999" rx="6.606652" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="310.354914" font-size="15.310255" fill="var(--text-muted)" text-anchor="middle">Check version constraints</text>
  <line x1="640" y1="333.74191" x2="640" y2="365.548377" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="431.517129" y="365.548377" width="416.965742" height="56.128999" rx="6.606652" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="398.290264" font-size="15.310255" fill="var(--text-muted)" text-anchor="middle">Download from registry</text>
  <line x1="640" y1="421.677492" x2="640" y2="453.483959" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="431.517129" y="453.483959" width="416.965742" height="56.128999" rx="6.606652" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="486.225846" font-size="15.310255" fill="var(--text-muted)" text-anchor="middle">Verify checksums</text>
  <rect x="796.606852" y="180.322554" width="443.393148" height="65.48389" rx="6.606652" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1017.814029" y="218.677422" font-size="17.224092" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Download modules</text>
  <line x1="1017.814029" y1="245.80656" x2="1017.814029" y2="277.612911" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="796.606852" y="277.612911" width="443.393148" height="56.128999" rx="6.606652" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1017.814029" y="310.354914" font-size="15.310255" fill="var(--text-muted)" text-anchor="middle">From registry or git</text>
  <line x1="640" y1="509.612958" x2="640" y2="556.387181" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="405.089723" y="556.387181" width="469.820555" height="63.612819" rx="6.606652" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="596.613004" font-size="17.224092" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Create lock file</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="440.3125" y="54.5" width="399.375" height="61.2223" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="91.5556" font-family="monospace" font-size="20.8566" font-weight="bold" fill="var(--bg)" text-anchor="middle">terraform init</text>
  <line x1="640" y1="115.7223" x2="640" y2="146.3333" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="290.3125" y1="146.3333" x2="989.6874" y2="146.3333" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="290.3125" y1="146.3333" x2="290.3125" y2="175.3333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="640" y1="146.3333" x2="640" y2="175.3333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="989.6874" y1="146.3333" x2="989.6874" y2="175.3333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="65.3125" y="175.3333" width="450" height="56.3889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="290.3125" y="208.3611" font-size="15.6425" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Configure backend</text>
  <line x1="290.3125" y1="231.7223" x2="290.3125" y2="259.1111" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="65.3125" y="259.1111" width="450" height="48.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="290.3125" y="287.3056" font-size="13.9044" fill="var(--text-muted)" text-anchor="middle">Local or remote state</text>
  <rect x="440.3125" y="175.3333" width="399.375" height="56.3889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="640" y="208.3611" font-size="15.6425" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Download providers</text>
  <line x1="640" y1="231.7223" x2="640" y2="259.1111" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="440.3125" y="259.1111" width="399.375" height="48.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="287.3056" font-size="13.9044" fill="var(--text-muted)" text-anchor="middle">Check version constraints</text>
  <line x1="640" y1="307.4444" x2="640" y2="334.8333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="440.3125" y="334.8333" width="399.375" height="48.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="363.0277" font-size="13.9044" fill="var(--text-muted)" text-anchor="middle">Download from registry</text>
  <line x1="640" y1="383.1667" x2="640" y2="410.5556" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="440.3125" y="410.5556" width="399.375" height="48.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="438.75" font-size="13.9044" fill="var(--text-muted)" text-anchor="middle">Verify checksums</text>
  <rect x="790" y="175.3333" width="424.6875" height="56.3889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1001.875" y="208.3611" font-size="15.6425" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Download modules</text>
  <line x1="1001.875" y1="231.7223" x2="1001.875" y2="259.1111" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="790" y="259.1111" width="424.6875" height="48.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1001.875" y="287.3056" font-size="13.9044" fill="var(--text-muted)" text-anchor="middle">From registry or git</text>
  <line x1="640" y1="458.8889" x2="640" y2="499.1667" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="415" y="499.1667" width="450" height="54.7777" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="533.8056" font-size="15.6425" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Create lock file</text>
</svg>
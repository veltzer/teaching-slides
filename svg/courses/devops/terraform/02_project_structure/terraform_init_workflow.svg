<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="431.517129" y="40" width="416.965742" height="71.096871" rx="6.606652" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="83.032314" font-size="22.965383" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Courier New, monospace">terraform init</text>
  <line x1="640" y1="111.096871" x2="640" y2="146.645132" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="274.910277" y1="146.645132" x2="1005.089618" y2="146.645132" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="274.910277" y1="146.645132" x2="274.910277" y2="180.322554" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="146.645132" x2="640" y2="180.322554" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1005.089618" y1="146.645132" x2="1005.089618" y2="180.322554" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="180.322554" width="469.820555" height="65.48389" rx="6.606652" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="274.910277" y="218.677422" font-size="17.224092" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">Configure backend</text>
  <line x1="274.910277" y1="245.80656" x2="274.910277" y2="277.612911" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="277.612911" width="469.820555" height="56.128999" rx="6.606652" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="274.910277" y="310.354914" font-size="15.310255" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Local or remote state</text>
  <rect x="431.517129" y="180.322554" width="416.965742" height="65.48389" rx="6.606652" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="218.677422" font-size="17.224092" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">Download providers</text>
  <line x1="640" y1="245.80656" x2="640" y2="277.612911" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="431.517129" y="277.612911" width="416.965742" height="56.128999" rx="6.606652" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="310.354914" font-size="15.310255" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Check version constraints</text>
  <line x1="640" y1="333.74191" x2="640" y2="365.548377" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="431.517129" y="365.548377" width="416.965742" height="56.128999" rx="6.606652" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="398.290264" font-size="15.310255" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Download from registry</text>
  <line x1="640" y1="421.677492" x2="640" y2="453.483959" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="431.517129" y="453.483959" width="416.965742" height="56.128999" rx="6.606652" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="486.225846" font-size="15.310255" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Verify checksums</text>
  <rect x="796.606852" y="180.322554" width="443.393148" height="65.48389" rx="6.606652" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1017.814029" y="218.677422" font-size="17.224092" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">Download modules</text>
  <line x1="1017.814029" y1="245.80656" x2="1017.814029" y2="277.612911" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="796.606852" y="277.612911" width="443.393148" height="56.128999" rx="6.606652" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1017.814029" y="310.354914" font-size="15.310255" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">From registry or git</text>
  <line x1="640" y1="509.612958" x2="640" y2="556.387181" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="405.089723" y="556.387181" width="469.820555" height="63.612819" rx="6.606652" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="596.613004" font-size="17.224092" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle" font-family="Arial, sans-serif">Create lock file</text>
</svg>

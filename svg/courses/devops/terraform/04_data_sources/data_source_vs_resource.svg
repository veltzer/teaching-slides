<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#ffffff" />
      <ns0:stop offset="100%" stop-color="#f2f2f2" />
    </ns0:linearGradient>
    <ns0:filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <ns0:feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </ns0:filter>
    <ns0:marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </ns0:marker>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="26.6667" y="26.6667" width="497.7778" height="506.6667" rx="10.6667" fill="#e8f5e9" filter="url(#shadow)" stroke="#2e7d32" stroke-width="1.7778" />
  <ns0:rect x="26.6667" y="26.6667" width="497.7778" height="40.8889" rx="10.6667" fill="#2e7d32" />
  <ns0:rect x="26.6667" y="56.8889" width="497.7778" height="10.6667" fill="#2e7d32" />
  <ns0:text x="275.5556" y="56" font-family="Arial,sans-serif" font-size="17.7778" font-weight="bold" fill="#fff" text-anchor="middle">resource  — Creates / Manages</ns0:text>
  <ns0:text x="44.4444" y="92.4444" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#2e7d32">What it does:</ns0:text>
  <ns0:text x="44.4444" y="110.2222" font-family="Arial,sans-serif" font-size="11.5556" fill="#333">Terraform creates, updates, and destroys</ns0:text>
  <ns0:text x="44.4444" y="126.2222" font-family="Arial,sans-serif" font-size="11.5556" fill="#333">the infrastructure object. It owns the lifecycle.</ns0:text>
  <ns0:rect x="44.4444" y="138.6667" width="462.2222" height="97.7778" rx="6.2222" fill="#fff" stroke="#a5d6a7" stroke-width="0.8889" />
  <ns0:text x="62.2222" y="156.4444" font-family="monospace" font-size="10.6667" fill="#2e7d32">resource "aws_instance" "web" {</ns0:text>
  <ns0:text x="62.2222" y="172.4444" font-family="monospace" font-size="10.6667" fill="#555">  ami           = "ami-0c55b159cbfafe1f0"</ns0:text>
  <ns0:text x="62.2222" y="188.4444" font-family="monospace" font-size="10.6667" fill="#555">  instance_type = "t3.micro"</ns0:text>
  <ns0:text x="62.2222" y="204.4444" font-family="monospace" font-size="10.6667" fill="#555">  tags = { Name = "my-web-server" }</ns0:text>
  <ns0:text x="62.2222" y="220.4444" font-family="monospace" font-size="10.6667" fill="#2e7d32">}</ns0:text>
  <ns0:text x="44.4444" y="257.7778" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#2e7d32">Terraform State interaction:</ns0:text>
  <ns0:rect x="44.4444" y="266.6667" width="462.2222" height="88.8889" rx="6.2222" fill="#c8e6c9" stroke="#2e7d32" stroke-width="0.8889" />
  <ns0:text x="275.5556" y="287.1111" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#1b5e20" text-anchor="middle">Stored in terraform.tfstate</ns0:text>
  <ns0:text x="62.2222" y="306.6667" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">• ID, ARN, all attributes recorded</ns0:text>
  <ns0:text x="62.2222" y="322.6667" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">• terraform plan compares desired vs actual</ns0:text>
  <ns0:text x="62.2222" y="338.6667" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">• terraform destroy removes the real resource</ns0:text>
  <ns0:text x="44.4444" y="376.8889" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#2e7d32">Lifecycle:</ns0:text>
  <ns0:rect x="44.4444" y="385.7778" width="462.2222" height="71.1111" rx="6.2222" fill="#fff" stroke="#a5d6a7" stroke-width="0.8889" />
  <ns0:rect x="62.2222" y="398.2222" width="71.1111" height="24.8889" rx="4.4444" fill="#2e7d32" />
  <ns0:text x="97.7778" y="415.1111" font-family="Arial,sans-serif" font-size="10" fill="#fff" text-anchor="middle">create</ns0:text>
  <ns0:line x1="133.3333" y1="410.6667" x2="168.8889" y2="410.6667" stroke="#555" stroke-width="1.3333" marker-end="url(#arrow)" />
  <ns0:rect x="168.8889" y="398.2222" width="71.1111" height="24.8889" rx="4.4444" fill="#1565c0" />
  <ns0:text x="204.4444" y="415.1111" font-family="Arial,sans-serif" font-size="10" fill="#fff" text-anchor="middle">update</ns0:text>
  <ns0:line x1="240" y1="410.6667" x2="275.5556" y2="410.6667" stroke="#555" stroke-width="1.3333" marker-end="url(#arrow)" />
  <ns0:rect x="275.5556" y="398.2222" width="71.1111" height="24.8889" rx="4.4444" fill="#c62828" />
  <ns0:text x="311.1111" y="415.1111" font-family="Arial,sans-serif" font-size="10" fill="#fff" text-anchor="middle">destroy</ns0:text>
  <ns0:text x="62.2222" y="448.8889" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">terraform apply drives all three phases</ns0:text>
  <ns0:text x="44.4444" y="480" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#2e7d32">Use when:</ns0:text>
  <ns0:text x="44.4444" y="497.7778" font-family="Arial,sans-serif" font-size="11.5556" fill="#333">• You need to create new infrastructure</ns0:text>
  <ns0:text x="44.4444" y="513.7778" font-family="Arial,sans-serif" font-size="11.5556" fill="#333">• You want Terraform to fully own the resource</ns0:text>
  <ns0:rect x="568.8889" y="26.6667" width="542.2222" height="506.6667" rx="10.6667" fill="#e3f2fd" filter="url(#shadow)" stroke="#1565c0" stroke-width="1.7778" />
  <ns0:rect x="568.8889" y="26.6667" width="542.2222" height="40.8889" rx="10.6667" fill="url(#grad-accent)" />
  <ns0:rect x="568.8889" y="56.8889" width="542.2222" height="10.6667" fill="url(#grad-accent)" />
  <ns0:text x="840" y="56" font-family="Arial,sans-serif" font-size="17.7778" font-weight="bold" fill="#fff" text-anchor="middle">data  — Reads Existing Infrastructure</ns0:text>
  <ns0:text x="586.6667" y="92.4444" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#1565c0">What it does:</ns0:text>
  <ns0:text x="586.6667" y="110.2222" font-family="Arial,sans-serif" font-size="11.5556" fill="#333">Terraform queries the provider API to read</ns0:text>
  <ns0:text x="586.6667" y="126.2222" font-family="Arial,sans-serif" font-size="11.5556" fill="#333">attributes of existing resources. Read-only.</ns0:text>
  <ns0:rect x="586.6667" y="138.6667" width="506.6667" height="111.1111" rx="6.2222" fill="#fff" stroke="#90caf9" stroke-width="0.8889" />
  <ns0:text x="604.4444" y="156.4444" font-family="monospace" font-size="10.6667" fill="#1565c0">data "aws_ami" "amazon_linux" {</ns0:text>
  <ns0:text x="604.4444" y="172.4444" font-family="monospace" font-size="10.6667" fill="#555">  most_recent = true</ns0:text>
  <ns0:text x="604.4444" y="188.4444" font-family="monospace" font-size="10.6667" fill="#555">  owners      = ["amazon"]</ns0:text>
  <ns0:text x="604.4444" y="204.4444" font-family="monospace" font-size="10.6667" fill="#555">  filter {</ns0:text>
  <ns0:text x="604.4444" y="220.4444" font-family="monospace" font-size="10.6667" fill="#555">    name   = "name"</ns0:text>
  <ns0:text x="604.4444" y="236.4444" font-family="monospace" font-size="10.6667" fill="#555">    values = ["amzn2-ami-hvm-*"]</ns0:text>
  <ns0:text x="604.4444" y="252.4444" font-family="monospace" font-size="10.6667" fill="#555">  }</ns0:text>
  <ns0:text x="968.8889" y="240.8889" font-family="monospace" font-size="10.6667" fill="#1565c0">}</ns0:text>
  <ns0:text x="586.6667" y="272.8889" font-family="monospace" font-size="10.6667" fill="#333">ami = data.aws_ami.amazon_linux.id</ns0:text>
  <ns0:text x="586.6667" y="302.2222" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#1565c0">Terraform State interaction:</ns0:text>
  <ns0:rect x="586.6667" y="311.1111" width="506.6667" height="88.8889" rx="6.2222" fill="#bbdefb" stroke="#1565c0" stroke-width="0.8889" />
  <ns0:text x="840" y="331.5556" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#0d47a1" text-anchor="middle">NOT stored in tfstate (read-only)</ns0:text>
  <ns0:text x="604.4444" y="351.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">• Fetched fresh on every terraform plan/apply</ns0:text>
  <ns0:text x="604.4444" y="367.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">• Never destroyed by terraform destroy</ns0:text>
  <ns0:text x="604.4444" y="383.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">• Values exposed as data.TYPE.NAME.ATTR</ns0:text>
  <ns0:text x="586.6667" y="421.3333" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#1565c0">Common data sources:</ns0:text>
  <ns0:rect x="586.6667" y="430.2222" width="506.6667" height="80" rx="6.2222" fill="#fff" stroke="#90caf9" stroke-width="0.8889" />
  <ns0:text x="604.4444" y="448" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">• aws_ami — find latest AMI by filter</ns0:text>
  <ns0:text x="604.4444" y="464" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">• aws_availability_zones — list AZs in region</ns0:text>
  <ns0:text x="604.4444" y="480" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">• aws_vpc / aws_subnet — look up existing VPCs</ns0:text>
  <ns0:text x="604.4444" y="496" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">• aws_iam_policy_document — build IAM JSON</ns0:text>
  <ns0:text x="586.6667" y="528.8889" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#1565c0">Use when:</ns0:text>
  <ns0:text x="586.6667" y="546.6667" font-family="Arial,sans-serif" font-size="11.5556" fill="#333">• Infrastructure was created outside Terraform</ns0:text>
  <ns0:text x="586.6667" y="562.6667" font-family="Arial,sans-serif" font-size="11.5556" fill="#333">• You need dynamic values (latest AMI ID, AZs)</ns0:text>
  <ns0:rect x="26.6667" y="556.4444" width="1084.4444" height="56.8889" rx="7.1111" fill="#f5f5f5" filter="url(#shadow)" stroke="#e0e0e0" stroke-width="0.8889" />
  <ns0:text x="568.8889" y="576" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#333" text-anchor="middle">Key Rule: resource owns &amp; mutates • data queries &amp; observes</ns0:text>
  <ns0:text x="568.8889" y="597.3333" font-family="Arial,sans-serif" font-size="11.5556" fill="#555" text-anchor="middle">Combine them: use data sources to find existing infra IDs, then pass those IDs into resources</ns0:text>
</ns0:svg>
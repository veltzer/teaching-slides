<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.316497186031" font-weight="bold" fill="var(--primary-accent)">resource vs data</text>

  <!-- resource column -->
  <rect x="40" y="70.796460176991" width="590" height="472.212389380531" rx="8.10549906201" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="101.592920353982" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.263747655025" font-weight="bold" fill="var(--bg)">resource - creates</text>
  <text x="335" y="127.256637168142" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--bg)">Terraform owns the lifecycle</text>

  <rect x="60" y="147.787610619469" width="550" height="112.920353982301" rx="6.079124296508" fill="var(--code-bg)"/>
  <text x="80" y="171.398230088496" font-family="Courier New, monospace" font-size="13.171435975767" fill="var(--bg)">resource "aws_instance" "web" {</text>
  <text x="80" y="193.982300884956" font-family="Courier New, monospace" font-size="13.171435975767" fill="var(--bg)">  ami           = "ami-0c55b1..."</text>
  <text x="80" y="216.566371681416" font-family="Courier New, monospace" font-size="13.171435975767" fill="var(--bg)">  instance_type = "t3.micro"</text>
  <text x="80" y="239.150442477876" font-family="Courier New, monospace" font-size="13.171435975767" fill="var(--bg)">}</text>

  <text x="60" y="291.504424778761" font-family="Arial, sans-serif" font-size="14.184623358518" font-weight="bold" fill="var(--bg)">State interaction</text>
  <text x="60" y="317.16814159292" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--bg)">Stored in terraform.tfstate</text>
  <text x="60" y="340.778761061947" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--bg)">plan diffs desired vs actual</text>
  <text x="60" y="364.389380530973" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--bg)">destroy removes real object</text>

  <!-- Lifecycle mini-flow -->
  <text x="60" y="404.424778761062" font-family="Arial, sans-serif" font-size="14.184623358518" font-weight="bold" fill="var(--bg)">Lifecycle</text>
  <rect x="60" y="419.823008849558" width="110" height="30.796460176991" rx="4.052749531005" fill="var(--ok-accent)"/>
  <text x="115" y="440.353982300885" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--bg)">create</text>
  <line x1="175" y1="435.221238938053" x2="205" y2="435.221238938053" stroke="var(--bg)" stroke-width="2" marker-end="url(#arrow-white)"/>
  <rect x="210" y="419.823008849558" width="110" height="30.796460176991" rx="4.052749531005" fill="var(--primary-accent)"/>
  <text x="265" y="440.353982300885" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--bg)">update</text>
  <line x1="325" y1="435.221238938053" x2="355" y2="435.221238938053" stroke="var(--bg)" stroke-width="2" marker-end="url(#arrow-white)"/>
  <rect x="360" y="419.823008849558" width="110" height="30.796460176991" rx="4.052749531005" fill="var(--danger-accent)"/>
  <text x="415" y="440.353982300885" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--bg)">destroy</text>

  <text x="60" y="491.681415929204" font-family="Arial, sans-serif" font-size="14.184623358518" font-weight="bold" fill="var(--bg)">Use when</text>
  <text x="60" y="517.345132743363" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--bg)">Creating new infrastructure</text>

  <!-- data column -->
  <rect x="650" y="70.796460176991" width="590" height="472.212389380531" rx="8.10549906201" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="101.592920353982" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.263747655025" font-weight="bold" fill="var(--bg)">data - reads</text>
  <text x="945" y="127.256637168142" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--bg)">Read-only query to provider</text>

  <rect x="670" y="147.787610619469" width="550" height="133.451327433628" rx="6.079124296508" fill="var(--code-bg)"/>
  <text x="690" y="171.398230088496" font-family="Courier New, monospace" font-size="13.171435975767" fill="var(--bg)">data "aws_ami" "amzn" {</text>
  <text x="690" y="193.982300884956" font-family="Courier New, monospace" font-size="13.171435975767" fill="var(--bg)">  most_recent = true</text>
  <text x="690" y="216.566371681416" font-family="Courier New, monospace" font-size="13.171435975767" fill="var(--bg)">  owners      = ["amazon"]</text>
  <text x="690" y="239.150442477876" font-family="Courier New, monospace" font-size="13.171435975767" fill="var(--bg)">}</text>
  <text x="690" y="265.840707964602" font-family="Courier New, monospace" font-size="13.171435975767" fill="var(--bg)">ami = data.aws_ami.amzn.id</text>

  <text x="670" y="312.035398230089" font-family="Arial, sans-serif" font-size="14.184623358518" font-weight="bold" fill="var(--bg)">State interaction</text>
  <text x="670" y="337.699115044248" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--bg)">Not stored in tfstate</text>
  <text x="670" y="361.309734513274" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--bg)">Refetched every plan</text>
  <text x="670" y="384.920353982301" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--bg)">Never destroyed</text>

  <text x="670" y="419.823008849558" font-family="Arial, sans-serif" font-size="14.184623358518" font-weight="bold" fill="var(--bg)">Common sources</text>
  <text x="670" y="445.486725663717" font-family="Courier New, monospace" font-size="12.158248593015" fill="var(--bg)">aws_ami, aws_availability_zones</text>
  <text x="670" y="466.017699115044" font-family="Courier New, monospace" font-size="12.158248593015" fill="var(--bg)">aws_vpc, aws_iam_policy_document</text>

  <text x="670" y="501.946902654867" font-family="Arial, sans-serif" font-size="14.184623358518" font-weight="bold" fill="var(--bg)">Use when</text>
  <text x="670" y="525.557522123894" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--bg)">Referencing existing infra</text>

  <!-- Footer rule -->
  <rect x="40" y="563.53982300885" width="1200" height="56.46017699115" rx="8.10549906201" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="594.336283185841" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.197810741269" font-weight="bold" fill="var(--text)">resource mutates, data observes</text>
</svg>

<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <ns0:defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="var(--bg)" />
  <ns0:rect x="26.6667" y="26.6667" width="497.7778" height="506.6667" rx="10.6667" fill="var(--ok-pale)" filter="url(#shadow)" stroke="var(--ok-dk)" stroke-width="1.7778" />
  <ns0:rect x="26.6667" y="26.6667" width="497.7778" height="40.8889" rx="10.6667" fill="var(--ok-dk)" />
  <ns0:rect x="26.6667" y="56.8889" width="497.7778" height="10.6667" fill="var(--ok-dk)" />
  <ns0:text x="275.5556" y="56" font-family="Arial,sans-serif" font-size="17.7778" font-weight="bold" fill="var(--bg)" text-anchor="middle">resource  — Creates / Manages</ns0:text>
  <ns0:text x="44.4444" y="92.4444" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--ok-dk)">What it does:</ns0:text>
  <ns0:text x="44.4444" y="110.2222" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text-dark)">Terraform creates, updates, and destroys</ns0:text>
  <ns0:text x="44.4444" y="126.2222" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text-dark)">the infrastructure object. It owns the lifecycle.</ns0:text>
  <ns0:rect x="44.4444" y="138.6667" width="462.2222" height="97.7778" rx="6.2222" fill="var(--bg)" stroke="var(--ok-tint)" stroke-width="0.8889" />
  <ns0:text x="62.2222" y="156.4444" font-family="monospace" font-size="10.6667" fill="var(--ok-dk)">resource "aws_instance" "web" {</ns0:text>
  <ns0:text x="62.2222" y="172.4444" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">  ami           = "ami-0c55b159cbfafe1f0"</ns0:text>
  <ns0:text x="62.2222" y="188.4444" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">  instance_type = "t3.micro"</ns0:text>
  <ns0:text x="62.2222" y="204.4444" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">  tags = { Name = "my-web-server" }</ns0:text>
  <ns0:text x="62.2222" y="220.4444" font-family="monospace" font-size="10.6667" fill="var(--ok-dk)">}</ns0:text>
  <ns0:text x="44.4444" y="257.7778" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--ok-dk)">Terraform State interaction:</ns0:text>
  <ns0:rect x="44.4444" y="266.6667" width="462.2222" height="88.8889" rx="6.2222" fill="var(--ok-lt)" stroke="var(--ok-dk)" stroke-width="0.8889" />
  <ns0:text x="275.5556" y="287.1111" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--ok-deep)" text-anchor="middle">Stored in terraform.tfstate</ns0:text>
  <ns0:text x="62.2222" y="306.6667" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-dark)">• ID, ARN, all attributes recorded</ns0:text>
  <ns0:text x="62.2222" y="322.6667" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-dark)">• terraform plan compares desired vs actual</ns0:text>
  <ns0:text x="62.2222" y="338.6667" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-dark)">• terraform destroy removes the real resource</ns0:text>
  <ns0:text x="44.4444" y="376.8889" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--ok-dk)">Lifecycle:</ns0:text>
  <ns0:rect x="44.4444" y="385.7778" width="462.2222" height="71.1111" rx="6.2222" fill="var(--bg)" stroke="var(--ok-tint)" stroke-width="0.8889" />
  <ns0:rect x="62.2222" y="398.2222" width="71.1111" height="24.8889" rx="4.4444" fill="var(--ok-dk)" />
  <ns0:text x="97.7778" y="415.1111" font-family="Arial,sans-serif" font-size="10" fill="var(--bg)" text-anchor="middle">create</ns0:text>
  <ns0:line x1="133.3333" y1="410.6667" x2="168.8889" y2="410.6667" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <ns0:rect x="168.8889" y="398.2222" width="71.1111" height="24.8889" rx="4.4444" fill="var(--primary-dk)" />
  <ns0:text x="204.4444" y="415.1111" font-family="Arial,sans-serif" font-size="10" fill="var(--bg)" text-anchor="middle">update</ns0:text>
  <ns0:line x1="240" y1="410.6667" x2="275.5556" y2="410.6667" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <ns0:rect x="275.5556" y="398.2222" width="71.1111" height="24.8889" rx="4.4444" fill="var(--danger-dk)" />
  <ns0:text x="311.1111" y="415.1111" font-family="Arial,sans-serif" font-size="10" fill="var(--bg)" text-anchor="middle">destroy</ns0:text>
  <ns0:text x="62.2222" y="448.8889" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">terraform apply drives all three phases</ns0:text>
  <ns0:text x="44.4444" y="480" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--ok-dk)">Use when:</ns0:text>
  <ns0:text x="44.4444" y="497.7778" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text-dark)">• You need to create new infrastructure</ns0:text>
  <ns0:text x="44.4444" y="513.7778" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text-dark)">• You want Terraform to fully own the resource</ns0:text>
  <ns0:rect x="568.8889" y="26.6667" width="542.2222" height="506.6667" rx="10.6667" fill="var(--primary-pale)" filter="url(#shadow)" stroke="var(--primary-dk)" stroke-width="1.7778" />
  <ns0:rect x="568.8889" y="26.6667" width="542.2222" height="40.8889" rx="10.6667" fill="url(#grad-primary)" />
  <ns0:rect x="568.8889" y="56.8889" width="542.2222" height="10.6667" fill="url(#grad-primary)" />
  <ns0:text x="840" y="56" font-family="Arial,sans-serif" font-size="17.7778" font-weight="bold" fill="var(--bg)" text-anchor="middle">data  — Reads Existing Infrastructure</ns0:text>
  <ns0:text x="586.6667" y="92.4444" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--primary-dk)">What it does:</ns0:text>
  <ns0:text x="586.6667" y="110.2222" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text-dark)">Terraform queries the provider API to read</ns0:text>
  <ns0:text x="586.6667" y="126.2222" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text-dark)">attributes of existing resources. Read-only.</ns0:text>
  <ns0:rect x="586.6667" y="138.6667" width="506.6667" height="111.1111" rx="6.2222" fill="var(--bg)" stroke="var(--primary-tint)" stroke-width="0.8889" />
  <ns0:text x="604.4444" y="156.4444" font-family="monospace" font-size="10.6667" fill="var(--primary-dk)">data "aws_ami" "amazon_linux" {</ns0:text>
  <ns0:text x="604.4444" y="172.4444" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">  most_recent = true</ns0:text>
  <ns0:text x="604.4444" y="188.4444" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">  owners      = ["amazon"]</ns0:text>
  <ns0:text x="604.4444" y="204.4444" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">  filter {</ns0:text>
  <ns0:text x="604.4444" y="220.4444" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">    name   = "name"</ns0:text>
  <ns0:text x="604.4444" y="236.4444" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">    values = ["amzn2-ami-hvm-*"]</ns0:text>
  <ns0:text x="604.4444" y="252.4444" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">  }</ns0:text>
  <ns0:text x="968.8889" y="240.8889" font-family="monospace" font-size="10.6667" fill="var(--primary-dk)">}</ns0:text>
  <ns0:text x="586.6667" y="272.8889" font-family="monospace" font-size="10.6667" fill="var(--text-dark)">ami = data.aws_ami.amazon_linux.id</ns0:text>
  <ns0:text x="586.6667" y="302.2222" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--primary-dk)">Terraform State interaction:</ns0:text>
  <ns0:rect x="586.6667" y="311.1111" width="506.6667" height="88.8889" rx="6.2222" fill="var(--primary-lt)" stroke="var(--primary-dk)" stroke-width="0.8889" />
  <ns0:text x="840" y="331.5556" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--primary-deep)" text-anchor="middle">NOT stored in tfstate (read-only)</ns0:text>
  <ns0:text x="604.4444" y="351.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-dark)">• Fetched fresh on every terraform plan/apply</ns0:text>
  <ns0:text x="604.4444" y="367.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-dark)">• Never destroyed by terraform destroy</ns0:text>
  <ns0:text x="604.4444" y="383.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-dark)">• Values exposed as data.TYPE.NAME.ATTR</ns0:text>
  <ns0:text x="586.6667" y="421.3333" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--primary-dk)">Common data sources:</ns0:text>
  <ns0:rect x="586.6667" y="430.2222" width="506.6667" height="80" rx="6.2222" fill="var(--bg)" stroke="var(--primary-tint)" stroke-width="0.8889" />
  <ns0:text x="604.4444" y="448" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-dark)">• aws_ami — find latest AMI by filter</ns0:text>
  <ns0:text x="604.4444" y="464" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-dark)">• aws_availability_zones — list AZs in region</ns0:text>
  <ns0:text x="604.4444" y="480" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-dark)">• aws_vpc / aws_subnet — look up existing VPCs</ns0:text>
  <ns0:text x="604.4444" y="496" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-dark)">• aws_iam_policy_document — build IAM JSON</ns0:text>
  <ns0:text x="586.6667" y="528.8889" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--primary-dk)">Use when:</ns0:text>
  <ns0:text x="586.6667" y="546.6667" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text-dark)">• Infrastructure was created outside Terraform</ns0:text>
  <ns0:text x="586.6667" y="562.6667" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text-dark)">• You need dynamic values (latest AMI ID, AZs)</ns0:text>
  <ns0:rect x="26.6667" y="556.4444" width="1084.4444" height="56.8889" rx="7.1111" fill="var(--surface)" filter="url(#shadow)" stroke="var(--border)" stroke-width="0.8889" />
  <ns0:text x="568.8889" y="576" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--text-dark)" text-anchor="middle">Key Rule: resource owns &amp; mutates • data queries &amp; observes</ns0:text>
  <ns0:text x="568.8889" y="597.3333" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text-muted)" text-anchor="middle">Combine them: use data sources to find existing infra IDs, then pass those IDs into resources</ns0:text>
</ns0:svg>
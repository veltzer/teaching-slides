<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="26.6667" y="26.6667" width="497.7778" height="506.6667" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="26.6667" y="26.6667" width="497.7778" height="40.8889" rx="6" fill="var(--ok-accent)" />
  <rect x="26.6667" y="56.8889" width="497.7778" height="10.6667" fill="var(--ok-accent)" rx="6"/>
  <text x="275.5556" y="56" font-family="Arial,sans-serif" font-size="17.7778" font-weight="bold" fill="var(--bg)" text-anchor="middle">resource  — Creates / Manages</text>
  <text x="44.4444" y="92.4444" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--ok-accent)">What it does:</text>
  <text x="44.4444" y="110.2222" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">Terraform creates, updates, and destroys</text>
  <text x="44.4444" y="126.2222" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">the infrastructure object. It owns the lifecycle.</text>
  <rect x="44.4444" y="138.6667" width="462.2222" height="97.7778" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="0.8889" />
  <text x="62.2222" y="156.4444" font-family="monospace" font-size="10.6667" fill="var(--ok-accent)">resource "aws_instance" "web" {</text>
  <text x="62.2222" y="172.4444" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">  ami           = "ami-0c55b159cbfafe1f0"</text>
  <text x="62.2222" y="188.4444" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">  instance_type = "t3.micro"</text>
  <text x="62.2222" y="204.4444" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">  tags = { Name = "my-web-server" }</text>
  <text x="62.2222" y="220.4444" font-family="monospace" font-size="10.6667" fill="var(--ok-accent)">}</text>
  <text x="44.4444" y="257.7778" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--ok-accent)">Terraform State interaction:</text>
  <rect x="44.4444" y="266.6667" width="462.2222" height="88.8889" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="275.5556" y="287.1111" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Stored in terraform.tfstate</text>
  <text x="62.2222" y="306.6667" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• ID, ARN, all attributes recorded</text>
  <text x="62.2222" y="322.6667" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• terraform plan compares desired vs actual</text>
  <text x="62.2222" y="338.6667" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• terraform destroy removes the real resource</text>
  <text x="44.4444" y="376.8889" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--ok-accent)">Lifecycle:</text>
  <rect x="44.4444" y="385.7778" width="462.2222" height="71.1111" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="0.8889" />
  <rect x="62.2222" y="398.2222" width="71.1111" height="24.8889" rx="6" fill="var(--ok-accent)" />
  <text x="97.7778" y="415.1111" font-family="Arial,sans-serif" font-size="10" fill="var(--bg)" text-anchor="middle">create</text>
  <line x1="133.3333" y1="410.6667" x2="168.8889" y2="410.6667" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <rect x="168.8889" y="398.2222" width="71.1111" height="24.8889" rx="6" fill="var(--primary-accent)" />
  <text x="204.4444" y="415.1111" font-family="Arial,sans-serif" font-size="10" fill="var(--bg)" text-anchor="middle">update</text>
  <line x1="240" y1="410.6667" x2="275.5556" y2="410.6667" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <rect x="275.5556" y="398.2222" width="71.1111" height="24.8889" rx="6" fill="var(--danger-accent)" />
  <text x="311.1111" y="415.1111" font-family="Arial,sans-serif" font-size="10" fill="var(--bg)" text-anchor="middle">destroy</text>
  <text x="62.2222" y="448.8889" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">terraform apply drives all three phases</text>
  <text x="44.4444" y="480" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--ok-accent)">Use when:</text>
  <text x="44.4444" y="497.7778" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">• You need to create new infrastructure</text>
  <text x="44.4444" y="513.7778" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">• You want Terraform to fully own the resource</text>
  <rect x="568.8889" y="26.6667" width="542.2222" height="506.6667" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="568.8889" y="26.6667" width="542.2222" height="40.8889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="568.8889" y="56.8889" width="542.2222" height="10.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="840" y="56" font-family="Arial,sans-serif" font-size="17.7778" font-weight="bold" fill="var(--bg)" text-anchor="middle">data  — Reads Existing Infrastructure</text>
  <text x="586.6667" y="92.4444" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--primary-accent)">What it does:</text>
  <text x="586.6667" y="110.2222" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">Terraform queries the provider API to read</text>
  <text x="586.6667" y="126.2222" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">attributes of existing resources. Read-only.</text>
  <rect x="586.6667" y="138.6667" width="506.6667" height="111.1111" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="0.8889" />
  <text x="604.4444" y="156.4444" font-family="monospace" font-size="10.6667" fill="var(--primary-accent)">data "aws_ami" "amazon_linux" {</text>
  <text x="604.4444" y="172.4444" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">  most_recent = true</text>
  <text x="604.4444" y="188.4444" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">  owners      = ["amazon"]</text>
  <text x="604.4444" y="204.4444" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">  filter {</text>
  <text x="604.4444" y="220.4444" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">    name   = "name"</text>
  <text x="604.4444" y="236.4444" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">    values = ["amzn2-ami-hvm-*"]</text>
  <text x="604.4444" y="252.4444" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">  }</text>
  <text x="968.8889" y="240.8889" font-family="monospace" font-size="10.6667" fill="var(--primary-accent)">}</text>
  <text x="586.6667" y="272.8889" font-family="monospace" font-size="10.6667" fill="var(--text)">ami = data.aws_ami.amazon_linux.id</text>
  <text x="586.6667" y="302.2222" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--primary-accent)">Terraform State interaction:</text>
  <rect x="586.6667" y="311.1111" width="506.6667" height="88.8889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="840" y="331.5556" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">NOT stored in tfstate (read-only)</text>
  <text x="604.4444" y="351.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• Fetched fresh on every terraform plan/apply</text>
  <text x="604.4444" y="367.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• Never destroyed by terraform destroy</text>
  <text x="604.4444" y="383.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• Values exposed as data.TYPE.NAME.ATTR</text>
  <text x="586.6667" y="421.3333" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--primary-accent)">Common data sources:</text>
  <rect x="586.6667" y="430.2222" width="506.6667" height="80" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="0.8889" />
  <text x="604.4444" y="448" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• aws_ami — find latest AMI by filter</text>
  <text x="604.4444" y="464" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• aws_availability_zones — list AZs in region</text>
  <text x="604.4444" y="480" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• aws_vpc / aws_subnet — look up existing VPCs</text>
  <text x="604.4444" y="496" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• aws_iam_policy_document — build IAM JSON</text>
  <text x="586.6667" y="528.8889" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--primary-accent)">Use when:</text>
  <text x="586.6667" y="546.6667" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">• Infrastructure was created outside Terraform</text>
  <text x="586.6667" y="562.6667" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">• You need dynamic values (latest AMI ID, AZs)</text>
  <rect x="26.6667" y="556.4444" width="1084.4444" height="56.8889" rx="6" fill="var(--surface)" filter="url(#shadow)" stroke="var(--border)" stroke-width="1" />
  <text x="568.8889" y="576" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--text)" text-anchor="middle">Key Rule: resource owns &amp; mutates • data queries &amp; observes</text>
  <text x="568.8889" y="597.3333" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text-muted)" text-anchor="middle">Combine them: use data sources to find existing infra IDs, then pass those IDs into resources</text>
</svg>
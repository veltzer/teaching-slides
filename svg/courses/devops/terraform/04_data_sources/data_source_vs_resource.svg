<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <!-- resource column -->
  <rect x="40" y="40" width="590" height="498.691588785047" rx="8.32965650973" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="72.523364485981" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.824141274325" font-weight="bold" fill="var(--bg)">resource - creates</text>
  <text x="335" y="99.6261682243" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.535691828312" fill="var(--bg)">Terraform owns the lifecycle</text>

  <rect x="60" y="121.308411214953" width="550" height="119.252336448598" rx="6.247242382298" fill="var(--code-bg)"/>
  <text x="80" y="146.242990654206" font-family="Courier New, monospace" font-size="13.535691828312" fill="var(--bg)">resource "aws_instance" "web" {</text>
  <text x="80" y="170.093457943926" font-family="Courier New, monospace" font-size="13.535691828312" fill="var(--bg)">  ami           = "ami-0c55b1..."</text>
  <text x="80" y="193.943925233645" font-family="Courier New, monospace" font-size="13.535691828312" fill="var(--bg)">  instance_type = "t3.micro"</text>
  <text x="80" y="217.794392523364" font-family="Courier New, monospace" font-size="13.535691828312" fill="var(--bg)">}</text>

  <text x="60" y="273.084112149533" font-family="Arial, sans-serif" font-size="14.576898892028" font-weight="bold" fill="var(--bg)">State interaction</text>
  <text x="60" y="300.18691588785" font-family="Arial, sans-serif" font-size="13.535691828312" fill="var(--bg)">Stored in terraform.tfstate</text>
  <text x="60" y="325.121495327103" font-family="Arial, sans-serif" font-size="13.535691828312" fill="var(--bg)">plan diffs desired vs actual</text>
  <text x="60" y="350.056074766355" font-family="Arial, sans-serif" font-size="13.535691828312" fill="var(--bg)">destroy removes real object</text>

  <!-- Lifecycle mini-flow -->
  <text x="60" y="392.336448598131" font-family="Arial, sans-serif" font-size="14.576898892028" font-weight="bold" fill="var(--bg)">Lifecycle</text>
  <rect x="60" y="408.598130841122" width="110" height="32.523364485981" rx="4.164828254865" fill="var(--ok-accent)"/>
  <text x="115" y="430.280373831776" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.535691828312" fill="var(--bg)">create</text>
  <line x1="175" y1="424.859813084112" x2="205" y2="424.859813084112" stroke="var(--bg)" stroke-width="2" marker-end="url(#arrow-white)"/>
  <rect x="210" y="408.598130841122" width="110" height="32.523364485981" rx="4.164828254865" fill="var(--primary-accent)"/>
  <text x="265" y="430.280373831776" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.535691828312" fill="var(--bg)">update</text>
  <line x1="325" y1="424.859813084112" x2="355" y2="424.859813084112" stroke="var(--bg)" stroke-width="2" marker-end="url(#arrow-white)"/>
  <rect x="360" y="408.598130841122" width="110" height="32.523364485981" rx="4.164828254865" fill="var(--danger-accent)"/>
  <text x="415" y="430.280373831776" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.535691828312" fill="var(--bg)">destroy</text>

  <text x="60" y="484.485981308412" font-family="Arial, sans-serif" font-size="14.576898892028" font-weight="bold" fill="var(--bg)">Use when</text>
  <text x="60" y="511.588785046729" font-family="Arial, sans-serif" font-size="13.535691828312" fill="var(--bg)">Creating new infrastructure</text>

  <!-- data column -->
  <rect x="650" y="40" width="590" height="498.691588785047" rx="8.32965650973" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="72.523364485981" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.824141274325" font-weight="bold" fill="var(--bg)">data - reads</text>
  <text x="945" y="99.6261682243" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.535691828312" fill="var(--bg)">Read-only query to provider</text>

  <rect x="670" y="121.308411214953" width="550" height="140.934579439252" rx="6.247242382298" fill="var(--code-bg)"/>
  <text x="690" y="146.242990654206" font-family="Courier New, monospace" font-size="13.535691828312" fill="var(--bg)">data "aws_ami" "amzn" {</text>
  <text x="690" y="170.093457943926" font-family="Courier New, monospace" font-size="13.535691828312" fill="var(--bg)">  most_recent = true</text>
  <text x="690" y="193.943925233645" font-family="Courier New, monospace" font-size="13.535691828312" fill="var(--bg)">  owners      = ["amazon"]</text>
  <text x="690" y="217.794392523364" font-family="Courier New, monospace" font-size="13.535691828312" fill="var(--bg)">}</text>
  <text x="690" y="245.981308411215" font-family="Courier New, monospace" font-size="13.535691828312" fill="var(--bg)">ami = data.aws_ami.amzn.id</text>

  <text x="670" y="294.766355140188" font-family="Arial, sans-serif" font-size="14.576898892028" font-weight="bold" fill="var(--bg)">State interaction</text>
  <text x="670" y="321.869158878505" font-family="Arial, sans-serif" font-size="13.535691828312" fill="var(--bg)">Not stored in tfstate</text>
  <text x="670" y="346.803738317757" font-family="Arial, sans-serif" font-size="13.535691828312" fill="var(--bg)">Refetched every plan</text>
  <text x="670" y="371.738317757009" font-family="Arial, sans-serif" font-size="13.535691828312" fill="var(--bg)">Never destroyed</text>

  <text x="670" y="408.598130841122" font-family="Arial, sans-serif" font-size="14.576898892028" font-weight="bold" fill="var(--bg)">Common sources</text>
  <text x="670" y="435.700934579439" font-family="Courier New, monospace" font-size="12.494484764595" fill="var(--bg)">aws_ami, aws_availability_zones</text>
  <text x="670" y="457.383177570093" font-family="Courier New, monospace" font-size="12.494484764595" fill="var(--bg)">aws_vpc, aws_iam_policy_document</text>

  <text x="670" y="495.327102803738" font-family="Arial, sans-serif" font-size="14.576898892028" font-weight="bold" fill="var(--bg)">Use when</text>
  <text x="670" y="520.261682242991" font-family="Arial, sans-serif" font-size="13.535691828312" fill="var(--bg)">Referencing existing infra</text>

  <!-- Footer rule -->
  <rect x="40" y="560.373831775701" width="1200" height="59.626168224299" rx="8.32965650973" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="592.897196261683" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.618105955744" font-weight="bold" fill="var(--text)">resource mutates, data observes</text>
</svg>

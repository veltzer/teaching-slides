<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="68.125" y="64.1667" width="525" height="459.1667" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="68.125" y="64.1667" width="525" height="37.0556" rx="6" fill="var(--ok-accent)" />
  <rect x="68.125" y="91.5556" width="525" height="9.6667" fill="var(--ok-accent)" rx="6"/>
  <text x="330.625" y="90.75" font-family="Arial,sans-serif" font-size="17.3806" font-weight="bold" fill="var(--bg)" text-anchor="middle">resource  — Creates / Manages</text>
  <text x="86.875" y="123.7777" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--ok-accent)">What it does:</text>
  <text x="86.875" y="139.8889" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">Terraform creates, updates, and destroys</text>
  <text x="86.875" y="154.3889" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">the infrastructure object. It owns the lifecycle.</text>
  <rect x="86.875" y="165.6667" width="487.5" height="88.6111" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="0.8889" />
  <text x="105.625" y="181.7777" font-family="monospace" font-size="10.4284" fill="var(--ok-accent)">resource "aws_instance" "web" {</text>
  <text x="105.625" y="196.2777" font-family="monospace" font-size="10.4284" fill="var(--text-muted)">  ami           = "ami-0c55b159cbfafe1f0"</text>
  <text x="105.625" y="210.7777" font-family="monospace" font-size="10.4284" fill="var(--text-muted)">  instance_type = "t3.micro"</text>
  <text x="105.625" y="225.2777" font-family="monospace" font-size="10.4284" fill="var(--text-muted)">  tags = { Name = "my-web-server" }</text>
  <text x="105.625" y="239.7777" font-family="monospace" font-size="10.4284" fill="var(--ok-accent)">}</text>
  <text x="86.875" y="273.6111" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--ok-accent)">Terraform State interaction:</text>
  <rect x="86.875" y="281.6667" width="487.5" height="80.5556" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="330.625" y="300.1944" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Stored in terraform.tfstate</text>
  <text x="105.625" y="317.9167" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• ID, ARN, all attributes recorded</text>
  <text x="105.625" y="332.4167" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• terraform plan compares desired vs actual</text>
  <text x="105.625" y="346.9167" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• terraform destroy removes the real resource</text>
  <text x="86.875" y="381.5556" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--ok-accent)">Lifecycle:</text>
  <rect x="86.875" y="389.6111" width="487.5" height="64.4444" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="0.8889" />
  <rect x="105.625" y="400.8889" width="75" height="22.5556" rx="6" fill="var(--ok-accent)" />
  <text x="143.125" y="416.1944" font-family="Arial,sans-serif" font-size="10" fill="var(--bg)" text-anchor="middle">create</text>
  <line x1="180.625" y1="412.1667" x2="218.125" y2="412.1667" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <rect x="218.125" y="400.8889" width="75" height="22.5556" rx="6" fill="var(--primary-accent)" />
  <text x="255.6249" y="416.1944" font-family="Arial,sans-serif" font-size="10" fill="var(--bg)" text-anchor="middle">update</text>
  <line x1="293.125" y1="412.1667" x2="330.625" y2="412.1667" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <rect x="330.625" y="400.8889" width="75" height="22.5556" rx="6" fill="var(--danger-accent)" />
  <text x="368.125" y="416.1944" font-family="Arial,sans-serif" font-size="10" fill="var(--bg)" text-anchor="middle">destroy</text>
  <text x="105.625" y="446.8056" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">terraform apply drives all three phases</text>
  <text x="86.875" y="475" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--ok-accent)">Use when:</text>
  <text x="86.875" y="491.1111" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">• You need to create new infrastructure</text>
  <text x="86.875" y="505.6111" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">• You want Terraform to fully own the resource</text>
  <rect x="640" y="64.1667" width="571.875" height="459.1667" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="640" y="64.1667" width="571.875" height="37.0556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="640" y="91.5556" width="571.875" height="9.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="925.9375" y="90.75" font-family="Arial,sans-serif" font-size="17.3806" font-weight="bold" fill="var(--bg)" text-anchor="middle">data  — Reads Existing Infrastructure</text>
  <text x="658.75" y="123.7777" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--primary-accent)">What it does:</text>
  <text x="658.75" y="139.8889" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">Terraform queries the provider API to read</text>
  <text x="658.75" y="154.3889" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">attributes of existing resources. Read-only.</text>
  <rect x="658.75" y="165.6667" width="534.375" height="100.6944" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="0.8889" />
  <text x="677.4999" y="181.7777" font-family="monospace" font-size="10.4284" fill="var(--primary-accent)">data "aws_ami" "amazon_linux" {</text>
  <text x="677.4999" y="196.2777" font-family="monospace" font-size="10.4284" fill="var(--text-muted)">  most_recent = true</text>
  <text x="677.4999" y="210.7777" font-family="monospace" font-size="10.4284" fill="var(--text-muted)">  owners      = ["amazon"]</text>
  <text x="677.4999" y="225.2777" font-family="monospace" font-size="10.4284" fill="var(--text-muted)">  filter {</text>
  <text x="677.4999" y="239.7777" font-family="monospace" font-size="10.4284" fill="var(--text-muted)">    name   = "name"</text>
  <text x="677.4999" y="254.2777" font-family="monospace" font-size="10.4284" fill="var(--text-muted)">    values = ["amzn2-ami-hvm-*"]</text>
  <text x="677.4999" y="268.7777" font-family="monospace" font-size="10.4284" fill="var(--text-muted)">  }</text>
  <text x="1061.875" y="258.3056" font-family="monospace" font-size="10.4284" fill="var(--primary-accent)">}</text>
  <text x="658.75" y="287.3056" font-family="monospace" font-size="10.4284" fill="var(--text)">ami = data.aws_ami.amazon_linux.id</text>
  <text x="658.75" y="313.8889" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--primary-accent)">Terraform State interaction:</text>
  <rect x="658.75" y="321.9444" width="534.375" height="80.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="925.9375" y="340.4723" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">NOT stored in tfstate (read-only)</text>
  <text x="677.4999" y="358.1944" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• Fetched fresh on every terraform plan/apply</text>
  <text x="677.4999" y="372.6944" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• Never destroyed by terraform destroy</text>
  <text x="677.4999" y="387.1944" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• Values exposed as data.TYPE.NAME.ATTR</text>
  <text x="658.75" y="421.8333" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--primary-accent)">Common data sources:</text>
  <rect x="658.75" y="429.8889" width="534.375" height="72.5" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="0.8889" />
  <text x="677.4999" y="446" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• aws_ami — find latest AMI by filter</text>
  <text x="677.4999" y="460.5" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• aws_availability_zones — list AZs in region</text>
  <text x="677.4999" y="475" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• aws_vpc / aws_subnet — look up existing VPCs</text>
  <text x="677.4999" y="489.5" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• aws_iam_policy_document — build IAM JSON</text>
  <text x="658.75" y="519.3056" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--primary-accent)">Use when:</text>
  <text x="658.75" y="535.4167" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">• Infrastructure was created outside Terraform</text>
  <text x="658.75" y="549.9167" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">• You need dynamic values (latest AMI ID, AZs)</text>
  <rect x="68.125" y="544.2777" width="1143.7499" height="51.5556" rx="6" fill="var(--surface)" filter="url(#shadow)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="562" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--text)" text-anchor="middle">Key Rule: resource owns &amp; mutates • data queries &amp; observes</text>
  <text x="640" y="581.3333" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text-muted)" text-anchor="middle">Combine them: use data sources to find existing infra IDs, then pass those IDs into resources</text>
</svg>
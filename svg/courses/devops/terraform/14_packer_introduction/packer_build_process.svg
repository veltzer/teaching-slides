<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="195.625" y="59.3333" width="888.75" height="61.2223" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="94.7777" text-anchor="middle" font-family="monospace" font-size="17.3806" font-weight="bold" fill="var(--bg)">packer build</text>
  <line x1="640" y1="120.5556" x2="640" y2="136.6667" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="195.625" y="136.6667" width="888.75" height="69.2777" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="164.8611" text-anchor="middle" font-size="15.6425" fill="var(--ok-accent)">1. Launch temporary instance</text>
  <text x="640" y="189.8333" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)">(from source AMI)</text>
  <line x1="640" y1="205.9444" x2="640" y2="222.0556" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="195.625" y="222.0556" width="888.75" height="58" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="255.8889" text-anchor="middle" font-size="15.6425" fill="var(--ok-accent)">2. Connect via SSH/WinRM</text>
  <line x1="640" y1="280.0556" x2="640" y2="296.1667" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="195.625" y="296.1667" width="888.75" height="69.2777" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="324.3611" text-anchor="middle" font-size="15.6425" fill="var(--ok-accent)">3. Run provisioners</text>
  <text x="640" y="350.9444" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)">(install software)</text>
  <line x1="640" y1="365.4444" x2="640" y2="381.5556" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="195.625" y="381.5556" width="888.75" height="58" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="415.3889" text-anchor="middle" font-size="15.6425" fill="var(--ok-accent)">4. Stop instance</text>
  <line x1="640" y1="439.5556" x2="640" y2="455.6667" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="195.625" y="455.6667" width="888.75" height="69.2777" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="483.8611" text-anchor="middle" font-size="15.6425" fill="var(--warn-accent)">5. Create image</text>
  <text x="640" y="510.4444" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)">(AMI snapshot)</text>
  <line x1="640" y1="524.9444" x2="640" y2="541.0556" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="195.625" y="541.0556" width="888.75" height="61.2223" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="578.1111" text-anchor="middle" font-size="15.6425" fill="var(--ok-accent)">6. Terminate instance + output artifact (AMI ID)</text>
</svg>
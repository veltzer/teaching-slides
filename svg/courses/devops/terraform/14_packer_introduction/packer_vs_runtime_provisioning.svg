<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="552.580693" height="580" rx="6.300597" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="40" y="40" width="552.580693" height="48.189903" rx="6.300597" fill="var(--warn-accent)" />
  <rect x="40" y="70.979231" width="552.580693" height="17.210672" fill="var(--warn-accent)" rx="6.300597"/>
  <text x="315.806475" y="70.979231" text-anchor="middle" font-size="18.251361" fill="var(--bg)" font-weight="bold">Without Packer (runtime)</text>
  <rect x="77.741939" y="110.563851" width="438.387134" height="75.727021" rx="6.300597" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="296.451635" y="155.311535" text-anchor="middle" font-size="16.426182" fill="var(--text)">Launch Instance</text>
  <line x1="296.451635" y1="186.290766" x2="296.451635" y2="215.54894" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="77.741939" y="215.54894" width="438.387134" height="75.727021" rx="6.300597" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="296.451635" y="246.528171" text-anchor="middle" font-size="16.426182" fill="var(--text)">Install Software</text>
  <text x="296.451635" y="278.367984" text-anchor="middle" font-size="12.775826" fill="var(--danger-accent)">10 to 20 min</text>
  <line x1="296.451635" y1="291.276068" x2="296.451635" y2="320.534136" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="77.741939" y="320.534136" width="438.387134" height="75.727021" rx="6.300597" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="296.451635" y="365.281926" text-anchor="middle" font-size="16.426182" fill="var(--text)">Configure App</text>
  <line x1="296.451635" y1="396.261157" x2="296.451635" y2="425.519331" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="77.741939" y="425.519331" width="438.387134" height="75.727021" rx="6.300597" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="296.451635" y="471.988178" text-anchor="middle" font-size="16.426182" fill="var(--text)">Ready (slow start)</text>
  <rect x="687.419307" y="40" width="552.580693" height="580" rx="6.300597" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="687.419307" y="40" width="552.580693" height="48.189903" rx="6.300597" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="687.419307" y="70.979231" width="552.580693" height="17.210672" fill="var(--ok-fill)" rx="6.300597" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="963.225886" y="70.979231" text-anchor="middle" font-size="18.251361" fill="var(--bg)" font-weight="bold">With Packer (pre-baked)</text>
  <rect x="722.25802" y="110.563851" width="472.258105" height="75.727021" rx="6.300597" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="958.387073" y="149.28789" text-anchor="middle" font-size="16.426182" fill="var(--text)">Build Image</text>
  <text x="958.387073" y="177.685483" text-anchor="middle" font-size="12.775826" fill="var(--ok-accent)">(once)</text>
  <line x1="958.387073" y1="186.290766" x2="958.387073" y2="215.54894" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="722.25802" y="215.54894" width="472.258105" height="75.727021" rx="6.300597" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="958.387073" y="258.575674" text-anchor="middle" font-size="16.426182" fill="var(--text)">Store Image</text>
  <line x1="958.387073" y1="291.276068" x2="958.387073" y2="320.534136" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="722.25802" y="320.534136" width="472.258105" height="75.727021" rx="6.300597" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="958.387073" y="360.118756" text-anchor="middle" font-size="16.426182" fill="var(--text)">Launch Instance</text>
  <text x="958.387073" y="387.655767" text-anchor="middle" font-size="12.775826" fill="var(--ok-accent)">(fast, &lt; 1 min)</text>
</svg>
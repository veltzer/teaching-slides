<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="58.75" y="54.5" width="535.3125" height="542.9444" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="58.75" y="54.5" width="535.3125" height="45.1111" rx="6" fill="var(--warn-accent)" />
  <rect x="58.75" y="83.5" width="535.3125" height="16.1111" fill="var(--warn-accent)" rx="6"/>
  <text x="325.9375" y="83.5" text-anchor="middle" font-size="17.3806" fill="var(--bg)" font-weight="bold">Without Packer (runtime)</text>
  <rect x="95.3125" y="120.5556" width="424.6875" height="70.8889" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="307.1875" y="162.4444" text-anchor="middle" font-size="15.6425" fill="var(--text)">Launch Instance</text>
  <line x1="307.1875" y1="191.4444" x2="307.1875" y2="218.8333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="95.3125" y="218.8333" width="424.6875" height="70.8889" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="307.1875" y="247.8333" text-anchor="middle" font-size="15.6425" fill="var(--text)">Install Software</text>
  <text x="307.1875" y="277.6389" text-anchor="middle" font-size="12.1663" fill="var(--danger-accent)">10 to 20 min</text>
  <line x1="307.1875" y1="289.7223" x2="307.1875" y2="317.1111" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="95.3125" y="317.1111" width="424.6875" height="70.8889" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="307.1875" y="359" text-anchor="middle" font-size="15.6425" fill="var(--text)">Configure App</text>
  <line x1="307.1875" y1="388" x2="307.1875" y2="415.3889" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="95.3125" y="415.3889" width="424.6875" height="70.8889" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="307.1875" y="458.8889" text-anchor="middle" font-size="15.6425" fill="var(--text)">Ready (slow start)</text>
  <rect x="685.9374" y="54.5" width="535.3125" height="542.9444" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="685.9374" y="54.5" width="535.3125" height="45.1111" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="685.9374" y="83.5" width="535.3125" height="16.1111" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="953.125" y="83.5" text-anchor="middle" font-size="17.3806" fill="var(--bg)" font-weight="bold">With Packer (pre-baked)</text>
  <rect x="719.6874" y="120.5556" width="457.5" height="70.8889" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="948.4374" y="156.8056" text-anchor="middle" font-size="15.6425" fill="var(--text)">Build Image</text>
  <text x="948.4374" y="183.3889" text-anchor="middle" font-size="12.1663" fill="var(--ok-accent)">(once)</text>
  <line x1="948.4374" y1="191.4444" x2="948.4374" y2="218.8333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="719.6874" y="218.8333" width="457.5" height="70.8889" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="948.4374" y="259.1111" text-anchor="middle" font-size="15.6425" fill="var(--text)">Store Image</text>
  <line x1="948.4374" y1="289.7223" x2="948.4374" y2="317.1111" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="719.6874" y="317.1111" width="457.5" height="70.8889" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="948.4374" y="354.1667" text-anchor="middle" font-size="15.6425" fill="var(--text)">Launch Instance</text>
  <text x="948.4374" y="379.9444" text-anchor="middle" font-size="12.1663" fill="var(--ok-accent)">(fast, &lt; 1 min)</text>
</svg>
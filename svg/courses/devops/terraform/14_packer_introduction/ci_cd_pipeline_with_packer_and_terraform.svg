<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="1200" height="64.444526" rx="7.020966" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="77.309895" text-anchor="middle" font-size="18.304244" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">1. Code Change</text>
  <line x1="640" y1="104.444526" x2="640" y2="121.403579" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="121.403579" width="1200" height="64.444526" rx="7.020966" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="158.713474" text-anchor="middle" font-size="18.304244" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">2. Build Application</text>
  <line x1="640" y1="185.848" x2="640" y2="202.807053" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="202.807053" width="1200" height="78.011684" rx="7.020966" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="235.877263" text-anchor="middle" font-size="18.304244" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">3. Packer Build</text>
  <text x="640" y="262.163789" text-anchor="middle" font-size="15.253517" fill="var(--text-muted)" font-family="Arial, sans-serif">(create AMI with app)</text>
  <line x1="640" y1="280.818737" x2="640" y2="297.777895" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="297.777895" width="1200" height="78.011684" rx="7.020966" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="330.848" text-anchor="middle" font-size="18.304244" fill="var(--warn-accent)" font-weight="bold" font-family="Arial, sans-serif">4. Terraform Plan</text>
  <text x="640" y="357.134526" text-anchor="middle" font-size="15.253517" fill="var(--text-muted)" font-family="Arial, sans-serif">(reference new AMI)</text>
  <line x1="640" y1="375.789474" x2="640" y2="392.748526" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="392.748526" width="1200" height="78.011684" rx="7.020966" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="425.818737" text-anchor="middle" font-size="18.304244" fill="var(--warn-accent)" font-weight="bold" font-family="Arial, sans-serif">5. Terraform Apply</text>
  <text x="640" y="452.105263" text-anchor="middle" font-size="15.253517" fill="var(--text-muted)" font-family="Arial, sans-serif">(deploy new instances)</text>
  <line x1="640" y1="470.760316" x2="640" y2="487.719368" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="487.719368" width="1200" height="64.444526" rx="7.020966" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="525.029263" text-anchor="middle" font-size="18.304244" fill="var(--info-accent)" font-weight="bold" font-family="Arial, sans-serif">6. Health Check / Smoke Test</text>
  <line x1="640" y1="552.163789" x2="640" y2="569.122842" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="569.122842" width="1200" height="50.877158" rx="7.020966" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="601.345053" text-anchor="middle" font-size="18.304244" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">7. DNS/LB Switch to New Instances</text>
</svg>
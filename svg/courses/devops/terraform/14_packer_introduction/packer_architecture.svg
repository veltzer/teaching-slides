<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="367.1111" y="19.5556" width="394.6667" height="131.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="564.4444" y="74.6667" text-anchor="middle" font-size="19.5556" fill="var(--primary-accent)" font-weight="bold">Packer Config</text>
  <text x="564.4444" y="113.7778" text-anchor="middle" font-size="16" fill="var(--text-muted)">(.pkr.hcl)</text>
  <line x1="564.4444" y1="151.1111" x2="564.4444" y2="199.1111" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="385.7778" y="199.1111" width="357.3333" height="120.8889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="564.4444" y="266.6667" text-anchor="middle" font-size="19.5556" fill="var(--primary-accent)" font-weight="bold">Packer Core</text>
  <line x1="564.4444" y1="320" x2="564.4444" y2="369.7778" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="201.7778" y1="369.7778" x2="927.1111" y2="369.7778" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="201.7778" y1="369.7778" x2="201.7778" y2="419.5556" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="564.4444" y1="369.7778" x2="564.4444" y2="419.5556" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="927.1111" y1="369.7778" x2="927.1111" y2="419.5556" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="73.7778" y="419.5556" width="256.8889" height="120.8889" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="201.7778" y="469.3333" text-anchor="middle" font-size="17.7778" fill="var(--ok-accent)">Builder</text>
  <text x="201.7778" y="508.4444" text-anchor="middle" font-size="17.7778" fill="var(--ok-accent)">AWS</text>
  <line x1="201.7778" y1="540.4444" x2="201.7778" y2="579.5556" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="73.7778" y="579.5556" width="256.8889" height="53.3333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="201.7778" y="614.2222" text-anchor="middle" font-size="16" fill="var(--ok-accent)">AMI</text>
  <rect x="431.1111" y="419.5556" width="256.8889" height="120.8889" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="560" y="469.3333" text-anchor="middle" font-size="17.7778" fill="var(--warn-accent)">Builder</text>
  <text x="560" y="508.4444" text-anchor="middle" font-size="17.7778" fill="var(--warn-accent)">Azure</text>
  <line x1="560" y1="540.4444" x2="560" y2="579.5556" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="431.1111" y="579.5556" width="256.8889" height="53.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="560" y="614.2222" text-anchor="middle" font-size="16" fill="var(--warn-accent)">VHD</text>
  <rect x="789.3333" y="419.5556" width="256.8889" height="120.8889" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="917.3333" y="469.3333" text-anchor="middle" font-size="17.7778" fill="var(--danger-accent)">Builder</text>
  <text x="917.3333" y="508.4444" text-anchor="middle" font-size="17.7778" fill="var(--danger-accent)">Docker</text>
  <line x1="917.3333" y1="540.4444" x2="917.3333" y2="579.5556" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="789.3333" y="579.5556" width="256.8889" height="53.3333" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="917.3333" y="614.2222" text-anchor="middle" font-size="16" fill="var(--danger-accent)">Image</text>
</svg>
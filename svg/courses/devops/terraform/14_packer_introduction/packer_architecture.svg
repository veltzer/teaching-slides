<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Packer Config -->
  <rect x="413" y="22" width="444" height="148" rx="10" fill="#e3f2fd" stroke="#1e88e5" stroke-width="3" filter="url(#shadow)"/>
  <text x="635" y="84" text-anchor="middle" font-size="22" fill="#1565c0" font-weight="bold">Packer Config</text>
  <text x="635" y="128" text-anchor="middle" font-size="18" fill="#555">(.pkr.hcl)</text>
  <line x1="635" y1="170" x2="635" y2="224" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>
  <!-- Packer Core -->
  <rect x="434" y="224" width="402" height="136" rx="10" fill="#bbdefb" stroke="#1565c0" stroke-width="3" filter="url(#shadow)"/>
  <text x="635" y="300" text-anchor="middle" font-size="22" fill="#1565c0" font-weight="bold">Packer Core</text>
  <!-- Branch lines -->
  <line x1="635" y1="360" x2="635" y2="416" stroke="#555" stroke-width="3"/>
  <line x1="227" y1="416" x2="1043" y2="416" stroke="#555" stroke-width="3"/>
  <line x1="227" y1="416" x2="227" y2="472" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="635" y1="416" x2="635" y2="472" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1043" y1="416" x2="1043" y2="472" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>
  <!-- Builder: AWS -->
  <rect x="83" y="472" width="289" height="136" rx="10" fill="#e8f5e9" stroke="#388e3c" stroke-width="3" filter="url(#shadow)"/>
  <text x="227" y="528" text-anchor="middle" font-size="20" fill="#2e7d32">Builder</text>
  <text x="227" y="572" text-anchor="middle" font-size="20" fill="#2e7d32">AWS</text>
  <line x1="227" y1="608" x2="227" y2="652" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="83" y="652" width="289" height="60" rx="10" fill="#e8f5e9" stroke="#388e3c" stroke-width="3" filter="url(#shadow)"/>
  <text x="227" y="691" text-anchor="middle" font-size="18" fill="#2e7d32">AMI</text>
  <!-- Builder: Azure -->
  <rect x="485" y="472" width="289" height="136" rx="10" fill="#fff8e1" stroke="#f57c00" stroke-width="3" filter="url(#shadow)"/>
  <text x="630" y="528" text-anchor="middle" font-size="20" fill="#e65100">Builder</text>
  <text x="630" y="572" text-anchor="middle" font-size="20" fill="#e65100">Azure</text>
  <line x1="630" y1="608" x2="630" y2="652" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="485" y="652" width="289" height="60" rx="10" fill="#fff8e1" stroke="#f57c00" stroke-width="3" filter="url(#shadow)"/>
  <text x="630" y="691" text-anchor="middle" font-size="18" fill="#e65100">VHD</text>
  <!-- Builder: Docker -->
  <rect x="888" y="472" width="289" height="136" rx="10" fill="#fce4ec" stroke="#c2185b" stroke-width="3" filter="url(#shadow)"/>
  <text x="1032" y="528" text-anchor="middle" font-size="20" fill="#c2185b">Builder</text>
  <text x="1032" y="572" text-anchor="middle" font-size="20" fill="#c2185b">Docker</text>
  <line x1="1032" y1="608" x2="1032" y2="652" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="888" y="652" width="289" height="60" rx="10" fill="#fce4ec" stroke="#c2185b" stroke-width="3" filter="url(#shadow)"/>
  <text x="1032" y="691" text-anchor="middle" font-size="18" fill="#c2185b">Image</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="427.1875" y="57.7223" width="416.25" height="119.2223" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="635.3124" y="107.6667" text-anchor="middle" font-size="19.1186" fill="var(--primary-accent)" font-weight="bold">Packer Config</text>
  <text x="635.3124" y="143.1111" text-anchor="middle" font-size="15.6425" fill="var(--text-muted)">(.pkr.hcl)</text>
  <line x1="635.3124" y1="176.9444" x2="635.3124" y2="220.4444" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="446.875" y="220.4444" width="376.875" height="109.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="635.3124" y="281.6667" text-anchor="middle" font-size="19.1186" fill="var(--primary-accent)" font-weight="bold">Packer Core</text>
  <line x1="635.3124" y1="330" x2="635.3124" y2="375.1111" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="252.8125" y1="375.1111" x2="1017.8125" y2="375.1111" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="252.8125" y1="375.1111" x2="252.8125" y2="420.2223" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="635.3124" y1="375.1111" x2="635.3124" y2="420.2223" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1017.8125" y1="375.1111" x2="1017.8125" y2="420.2223" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="117.8125" y="420.2223" width="270.9375" height="109.5556" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="252.8125" y="465.3333" text-anchor="middle" font-size="17.3806" fill="var(--ok-accent)">Builder</text>
  <text x="252.8125" y="500.7777" text-anchor="middle" font-size="17.3806" fill="var(--ok-accent)">AWS</text>
  <line x1="252.8125" y1="529.7777" x2="252.8125" y2="565.2223" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="117.8125" y="565.2223" width="270.9375" height="48.3333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="252.8125" y="596.6389" text-anchor="middle" font-size="15.6425" fill="var(--ok-accent)">AMI</text>
  <rect x="494.6875" y="420.2223" width="270.9375" height="109.5556" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="630.625" y="465.3333" text-anchor="middle" font-size="17.3806" fill="var(--warn-accent)">Builder</text>
  <text x="630.625" y="500.7777" text-anchor="middle" font-size="17.3806" fill="var(--warn-accent)">Azure</text>
  <line x1="630.625" y1="529.7777" x2="630.625" y2="565.2223" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="494.6875" y="565.2223" width="270.9375" height="48.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="630.625" y="596.6389" text-anchor="middle" font-size="15.6425" fill="var(--warn-accent)">VHD</text>
  <rect x="872.4999" y="420.2223" width="270.9375" height="109.5556" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1007.4999" y="465.3333" text-anchor="middle" font-size="17.3806" fill="var(--danger-accent)">Builder</text>
  <text x="1007.4999" y="500.7777" text-anchor="middle" font-size="17.3806" fill="var(--danger-accent)">Docker</text>
  <line x1="1007.4999" y1="529.7777" x2="1007.4999" y2="565.2223" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="872.4999" y="565.2223" width="270.9375" height="48.3333" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1007.4999" y="596.6389" text-anchor="middle" font-size="15.6425" fill="var(--danger-accent)">Image</text>
</svg>
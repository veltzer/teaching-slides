<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="136.776041" rx="6.319377" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="81.552276" text-anchor="middle" font-size="20.136273" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">Pattern 1: Single State File</text>
  <text x="260.645058" y="116.179227" text-anchor="end" font-size="18.30576" fill="var(--text)" font-family="Arial, sans-serif">all-resources/</text>
  <text x="280" y="116.179227" text-anchor="start" font-size="18.30576" fill="var(--text-muted)" font-family="Arial, sans-serif">→ terraform.tfstate</text>
  <rect x="40" y="197.552233" width="1200" height="207.761167" rx="6.319377" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="239.10451" text-anchor="middle" font-size="20.136273" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">Pattern 2: Per-Environment States</text>
  <text x="260.645058" y="275.462684" text-anchor="end" font-size="18.30576" fill="var(--text)" font-family="Arial, sans-serif">dev/</text>
  <text x="280" y="275.462684" text-anchor="start" font-size="18.30576" fill="var(--text-muted)" font-family="Arial, sans-serif">→ dev.tfstate</text>
  <text x="260.645058" y="318.7464" text-anchor="end" font-size="18.30576" fill="var(--text)" font-family="Arial, sans-serif">staging/</text>
  <text x="280" y="318.7464" text-anchor="start" font-size="18.30576" fill="var(--text-muted)" font-family="Arial, sans-serif">→ staging.tfstate</text>
  <text x="260.645058" y="362.0299" text-anchor="end" font-size="18.30576" fill="var(--text)" font-family="Arial, sans-serif">prod/</text>
  <text x="280" y="362.0299" text-anchor="start" font-size="18.30576" fill="var(--text-muted)" font-family="Arial, sans-serif">→ prod.tfstate</text>
  <rect x="40" y="426.089592" width="1200" height="193.910408" rx="6.319377" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="467.641761" text-anchor="middle" font-size="20.136273" fill="var(--warn-accent)" font-weight="bold" font-family="Arial, sans-serif">Pattern 3: Per-Component States</text>
  <text x="260.645058" y="504.000043" text-anchor="end" font-size="18.30576" fill="var(--text)" font-family="Arial, sans-serif">network/</text>
  <text x="280" y="504.000043" text-anchor="start" font-size="18.30576" fill="var(--text-muted)" font-family="Arial, sans-serif">→ network.tfstate</text>
  <text x="260.645058" y="547.283651" text-anchor="end" font-size="18.30576" fill="var(--text)" font-family="Arial, sans-serif">compute/</text>
  <text x="280" y="547.283651" text-anchor="start" font-size="18.30576" fill="var(--text-muted)" font-family="Arial, sans-serif">→ compute.tfstate</text>
  <text x="260.645058" y="590.567258" text-anchor="end" font-size="18.30576" fill="var(--text)" font-family="Arial, sans-serif">database/</text>
  <text x="280" y="590.567258" text-anchor="start" font-size="18.30576" fill="var(--text-muted)" font-family="Arial, sans-serif">→ database.tfstate</text>
</svg>

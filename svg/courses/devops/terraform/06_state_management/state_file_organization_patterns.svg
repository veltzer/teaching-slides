  <ns0:text x="568.8889" y="225.7778" text-anchor="middle" font-size="19.5556" fill="#2e7d32" font-weight="bold">Pattern 2: Per-Environment States</ns0:text>
  <ns0:text x="220.4444" y="263.1111" text-anchor="end" font-size="17.7778" fill="#333">dev/</ns0:text>
  <ns0:text x="238.2222" y="263.1111" text-anchor="start" font-size="17.7778" fill="#555">→ dev.tfstate</ns0:text>
  <ns0:text x="220.4444" y="307.5556" text-anchor="end" font-size="17.7778" fill="#333">staging/</ns0:text>
  <ns0:text x="238.2222" y="307.5556" text-anchor="start" font-size="17.7778" fill="#555">→ staging.tfstate</ns0:text>
  <ns0:text x="220.4444" y="352" text-anchor="end" font-size="17.7778" fill="#333">prod/</ns0:text>
  <ns0:text x="238.2222" y="352" text-anchor="start" font-size="17.7778" fill="#555">→ prod.tfstate</ns0:text>
  <ns0:rect x="17.7778" y="417.7778" width="1102.2222" height="199.1111" rx="8.8889" fill="#fff8e1" stroke="#f57c00" stroke-width="2.6667" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="460.4444" text-anchor="middle" font-size="19.5556" fill="#e65100" font-weight="bold">Pattern 3: Per-Component States</ns0:text>
  <ns0:text x="220.4444" y="497.7778" text-anchor="end" font-size="17.7778" fill="#333">network/</ns0:text>
  <ns0:text x="238.2222" y="497.7778" text-anchor="start" font-size="17.7778" fill="#555">→ network.tfstate</ns0:text>

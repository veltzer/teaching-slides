  <ns0:text x="568.8889" y="64" text-anchor="middle" font-size="19.5556" fill="#1565c0" font-weight="bold">Pattern 1: Single State File</ns0:text>
  <ns0:text x="220.4444" y="99.5556" text-anchor="end" font-size="17.7778" fill="#333">all-resources/</ns0:text>

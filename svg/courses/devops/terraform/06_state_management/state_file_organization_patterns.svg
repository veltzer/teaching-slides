<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="136.776041" rx="6.319377" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="81.552276" text-anchor="middle" font-size="20.136273" fill="var(--primary-accent)" font-weight="bold">Pattern 1: Single State File</text>
  <text x="260.645058" y="116.179227" text-anchor="end" font-size="18.30576" fill="var(--text)">all-resources/</text>
  <text x="280" y="116.179227" text-anchor="start" font-size="18.30576" fill="var(--text-muted)">→ terraform.tfstate</text>
  <rect x="40" y="197.552233" width="1200" height="207.761167" rx="6.319377" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="239.10451" text-anchor="middle" font-size="20.136273" fill="var(--ok-accent)" font-weight="bold">Pattern 2: Per-Environment States</text>
  <text x="260.645058" y="275.462684" text-anchor="end" font-size="18.30576" fill="var(--text)">dev/</text>
  <text x="280" y="275.462684" text-anchor="start" font-size="18.30576" fill="var(--text-muted)">→ dev.tfstate</text>
  <text x="260.645058" y="318.7464" text-anchor="end" font-size="18.30576" fill="var(--text)">staging/</text>
  <text x="280" y="318.7464" text-anchor="start" font-size="18.30576" fill="var(--text-muted)">→ staging.tfstate</text>
  <text x="260.645058" y="362.0299" text-anchor="end" font-size="18.30576" fill="var(--text)">prod/</text>
  <text x="280" y="362.0299" text-anchor="start" font-size="18.30576" fill="var(--text-muted)">→ prod.tfstate</text>
  <rect x="40" y="426.089592" width="1200" height="193.910408" rx="6.319377" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="467.641761" text-anchor="middle" font-size="20.136273" fill="var(--warn-accent)" font-weight="bold">Pattern 3: Per-Component States</text>
  <text x="260.645058" y="504.000043" text-anchor="end" font-size="18.30576" fill="var(--text)">network/</text>
  <text x="280" y="504.000043" text-anchor="start" font-size="18.30576" fill="var(--text-muted)">→ network.tfstate</text>
  <text x="260.645058" y="547.283651" text-anchor="end" font-size="18.30576" fill="var(--text)">compute/</text>
  <text x="280" y="547.283651" text-anchor="start" font-size="18.30576" fill="var(--text-muted)">→ compute.tfstate</text>
  <text x="260.645058" y="590.567258" text-anchor="end" font-size="18.30576" fill="var(--text)">database/</text>
  <text x="280" y="590.567258" text-anchor="start" font-size="18.30576" fill="var(--text-muted)">→ database.tfstate</text>
</svg>
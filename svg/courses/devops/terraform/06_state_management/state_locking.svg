<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="533.225806" height="580" rx="6.440681" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="306.129032" y="92.155017" text-anchor="middle" font-size="20.522801" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">Without Locking</text>
  <rect x="77.741935" y="146.108584" width="267.096774" height="107.907021" rx="6.440681" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="211.290323" y="210.852774" text-anchor="middle" font-size="16.791392" fill="var(--text)" font-family="Arial, sans-serif">User A: tf apply</text>
  <rect x="77.741935" y="306.17051" width="267.096774" height="107.907021" rx="6.440681" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="211.290323" y="370.9147" text-anchor="middle" font-size="16.791392" fill="var(--text)" font-family="Arial, sans-serif">User B: tf apply</text>
  <line x1="344.83871" y1="200.062038" x2="440.645161" y2="280.992276" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="344.83871" y1="360.123965" x2="440.645161" y2="280.992276" stroke="var(--text-muted)" stroke-width="2"/>
  <rect x="392.258065" y="232.434133" width="152.903226" height="97.116285" rx="6.440681" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="468.709677" y="289.984463" text-anchor="middle" font-size="16.791392" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">CONFLICT!</text>
  <rect x="649.677419" y="40" width="590.322581" height="580" rx="6.440681" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="944.83871" y="92.155017" text-anchor="middle" font-size="20.522801" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">With Locking</text>
  <rect x="678.709574" y="156.899207" width="532.258065" height="170.852774" rx="6.440681" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="944.83871" y="226.139547" text-anchor="middle" font-size="16.791392" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">User A: tf apply</text>
  <text x="944.83871" y="280.992276" text-anchor="middle" font-size="14.925634" fill="var(--ok-accent)" font-family="Arial, sans-serif">→ Acquires lock → Apply → Release</text>
  <rect x="678.709574" y="383.503873" width="532.258065" height="170.852774" rx="6.440681" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="944.83871" y="452.744213" text-anchor="middle" font-size="16.791392" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">User B: tf apply</text>
  <text x="944.83871" y="507.596942" text-anchor="middle" font-size="14.925634" fill="var(--ok-accent)" font-family="Arial, sans-serif">→ Waits → Acquires → Apply</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="533.225852" height="580" rx="6.425755" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="306.129055" y="90.123444" text-anchor="middle" font-size="20.47524" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">Local State</text>
  <rect x="97.096779" y="140.246778" width="210.000018" height="121.728444" rx="6.425755" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="201.612917" y="211.851889" text-anchor="middle" font-size="16.752479" fill="var(--text)" font-family="Arial, sans-serif">Laptop A</text>
  <line x1="307.096797" y1="201.111111" x2="401.935515" y2="201.111111" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="489.032297" y="190.370333" text-anchor="middle" font-size="14.891044" fill="var(--danger-accent)" font-family="Arial, sans-serif">local file</text>
  <rect x="97.096779" y="364.012333" width="210.000018" height="121.728444" rx="6.425755" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="201.612917" y="435.617222" text-anchor="middle" font-size="16.752479" fill="var(--text)" font-family="Arial, sans-serif">Laptop B</text>
  <line x1="307.096797" y1="424.876444" x2="401.935515" y2="424.876444" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="489.032297" y="414.135667" text-anchor="middle" font-size="14.891044" fill="var(--danger-accent)" font-family="Arial, sans-serif">local file</text>
  <text x="430.967776" y="480.370333" text-anchor="middle" font-size="14.891044" fill="var(--danger-accent)" font-family="Arial, sans-serif">(conflict!)</text>
  <rect x="669.032312" y="40" width="570.967688" height="580" rx="6.425755" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="954.516208" y="90.123444" text-anchor="middle" font-size="20.47524" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">Remote State</text>
  <rect x="706.774251" y="140.246778" width="210.000018" height="121.728444" rx="6.425755" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="811.290389" y="211.851889" text-anchor="middle" font-size="16.752479" fill="var(--text)" font-family="Arial, sans-serif">Laptop A</text>
  <line x1="916.774269" y1="201.111111" x2="992.258043" y2="201.111111" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="706.774251" y="364.012333" width="210.000018" height="121.728444" rx="6.425755" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="811.290389" y="435.617222" text-anchor="middle" font-size="16.752479" fill="var(--text)" font-family="Arial, sans-serif">Laptop B</text>
  <line x1="916.774269" y1="424.876444" x2="992.258043" y2="424.876444" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="992.258043" y="186.790111" width="210.000018" height="136.049333" rx="6.425755" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1096.774181" y="249.444444" text-anchor="middle" font-size="16.752479" fill="var(--text)" font-family="Arial, sans-serif">S3 Bucket</text>
  <text x="1096.774181" y="297.777778" text-anchor="middle" font-size="14.891044" fill="var(--text-muted)" font-family="Arial, sans-serif">+ DynamoDB</text>
  <line x1="992.258043" y1="201.111111" x2="992.258043" y2="424.876444" stroke="var(--text-muted)" stroke-width="2"/>
</svg>

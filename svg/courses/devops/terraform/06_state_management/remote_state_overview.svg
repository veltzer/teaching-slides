<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="58.75" y="62.5556" width="516.5625" height="522" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="316.5625" y="107.6667" text-anchor="middle" font-size="19.1186" fill="var(--danger-accent)" font-weight="bold">Local State</text>
  <rect x="114.0625" y="152.7777" width="203.4375" height="109.5556" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="215.3125" y="217.2223" text-anchor="middle" font-size="15.6425" fill="var(--text)">Laptop A</text>
  <line x1="317.5" y1="207.5556" x2="409.375" y2="207.5556" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="493.75" y="197.8889" text-anchor="middle" font-size="13.9044" fill="var(--danger-accent)">local file</text>
  <rect x="114.0625" y="354.1667" width="203.4375" height="109.5556" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="215.3125" y="418.6111" text-anchor="middle" font-size="15.6425" fill="var(--text)">Laptop B</text>
  <line x1="317.5" y1="408.9444" x2="409.375" y2="408.9444" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="493.75" y="399.2777" text-anchor="middle" font-size="13.9044" fill="var(--danger-accent)">local file</text>
  <text x="437.5" y="458.8889" text-anchor="middle" font-size="13.9044" fill="var(--danger-accent)">(conflict!)</text>
  <rect x="668.125" y="62.5556" width="553.1249" height="522" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="944.6875" y="107.6667" text-anchor="middle" font-size="19.1186" fill="var(--ok-accent)" font-weight="bold">Remote State</text>
  <rect x="704.6875" y="152.7777" width="203.4375" height="109.5556" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="805.9375" y="217.2223" text-anchor="middle" font-size="15.6425" fill="var(--text)">Laptop A</text>
  <line x1="908.125" y1="207.5556" x2="981.2499" y2="207.5556" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="704.6875" y="354.1667" width="203.4375" height="109.5556" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="805.9375" y="418.6111" text-anchor="middle" font-size="15.6425" fill="var(--text)">Laptop B</text>
  <line x1="908.125" y1="408.9444" x2="981.2499" y2="408.9444" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="981.2499" y="194.6667" width="203.4375" height="122.4444" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1082.4999" y="251.0556" text-anchor="middle" font-size="15.6425" fill="var(--text)">S3 Bucket</text>
  <text x="1082.4999" y="294.5556" text-anchor="middle" font-size="13.9044" fill="var(--text-muted)">+ DynamoDB</text>
  <line x1="981.2499" y1="207.5556" x2="981.2499" y2="408.9444" stroke="var(--text-muted)" stroke-width="2" />
</svg>
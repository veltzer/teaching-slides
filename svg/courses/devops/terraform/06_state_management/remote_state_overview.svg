<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="533.225852" height="580" rx="6.425755" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="306.129055" y="90.123444" text-anchor="middle" font-size="20.47524" fill="var(--danger-accent)" font-weight="bold">Local State</text>
  <rect x="97.096779" y="140.246778" width="210.000018" height="121.728444" rx="6.425755" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="201.612917" y="211.851889" text-anchor="middle" font-size="16.752479" fill="var(--text)">Laptop A</text>
  <line x1="307.096797" y1="201.111111" x2="401.935515" y2="201.111111" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="489.032297" y="190.370333" text-anchor="middle" font-size="14.891044" fill="var(--danger-accent)">local file</text>
  <rect x="97.096779" y="364.012333" width="210.000018" height="121.728444" rx="6.425755" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="201.612917" y="435.617222" text-anchor="middle" font-size="16.752479" fill="var(--text)">Laptop B</text>
  <line x1="307.096797" y1="424.876444" x2="401.935515" y2="424.876444" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="489.032297" y="414.135667" text-anchor="middle" font-size="14.891044" fill="var(--danger-accent)">local file</text>
  <text x="430.967776" y="480.370333" text-anchor="middle" font-size="14.891044" fill="var(--danger-accent)">(conflict!)</text>
  <rect x="669.032312" y="40" width="570.967688" height="580" rx="6.425755" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="954.516208" y="90.123444" text-anchor="middle" font-size="20.47524" fill="var(--ok-accent)" font-weight="bold">Remote State</text>
  <rect x="706.774251" y="140.246778" width="210.000018" height="121.728444" rx="6.425755" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="811.290389" y="211.851889" text-anchor="middle" font-size="16.752479" fill="var(--text)">Laptop A</text>
  <line x1="916.774269" y1="201.111111" x2="992.258043" y2="201.111111" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="706.774251" y="364.012333" width="210.000018" height="121.728444" rx="6.425755" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="811.290389" y="435.617222" text-anchor="middle" font-size="16.752479" fill="var(--text)">Laptop B</text>
  <line x1="916.774269" y1="424.876444" x2="992.258043" y2="424.876444" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="992.258043" y="186.790111" width="210.000018" height="136.049333" rx="6.425755" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1096.774181" y="249.444444" text-anchor="middle" font-size="16.752479" fill="var(--text)">S3 Bucket</text>
  <text x="1096.774181" y="297.777778" text-anchor="middle" font-size="14.891044" fill="var(--text-muted)">+ DynamoDB</text>
  <line x1="992.258043" y1="201.111111" x2="992.258043" y2="424.876444" stroke="var(--text-muted)" stroke-width="2" />
</svg>
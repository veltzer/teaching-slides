<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Local State panel -->
  <rect x="20" y="28" width="551" height="648" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="3" filter="url(#shadow)"/>
  <text x="295" y="84" text-anchor="middle" font-size="22" fill="#b71c1c" font-weight="bold">Local State</text>
  <!-- Laptop A -->
  <rect x="79" y="140" width="217" height="136" rx="10" fill="#ffcdd2" stroke="#e53935" stroke-width="3"/>
  <text x="187" y="220" text-anchor="middle" font-size="18" fill="#222">Laptop A</text>
  <line x1="296" y1="208" x2="394" y2="208" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="484" y="196" text-anchor="middle" font-size="16" fill="#c62828">local file</text>
  <!-- Laptop B -->
  <rect x="79" y="390" width="217" height="136" rx="10" fill="#ffcdd2" stroke="#e53935" stroke-width="3"/>
  <text x="187" y="470" text-anchor="middle" font-size="18" fill="#222">Laptop B</text>
  <line x1="296" y1="458" x2="394" y2="458" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="484" y="446" text-anchor="middle" font-size="16" fill="#c62828">local file</text>
  <text x="424" y="520" text-anchor="middle" font-size="16" fill="#c62828">(conflict!)</text>
  <!-- Remote State panel -->
  <rect x="670" y="28" width="590" height="648" rx="10" fill="#e8f5e9" stroke="#388e3c" stroke-width="3" filter="url(#shadow)"/>
  <text x="965" y="84" text-anchor="middle" font-size="22" fill="#1b5e20" font-weight="bold">Remote State</text>
  <!-- Laptop A -->
  <rect x="709" y="140" width="217" height="136" rx="10" fill="#c8e6c9" stroke="#43a047" stroke-width="3"/>
  <text x="817" y="220" text-anchor="middle" font-size="18" fill="#222">Laptop A</text>
  <line x1="926" y1="208" x2="1004" y2="208" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>
  <!-- Laptop B -->
  <rect x="709" y="390" width="217" height="136" rx="10" fill="#c8e6c9" stroke="#43a047" stroke-width="3"/>
  <text x="817" y="470" text-anchor="middle" font-size="18" fill="#222">Laptop B</text>
  <line x1="926" y1="458" x2="1004" y2="458" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>
  <!-- S3 bucket -->
  <rect x="1004" y="192" width="217" height="152" rx="10" fill="#fff8e1" stroke="#f57c00" stroke-width="3"/>
  <text x="1112" y="262" text-anchor="middle" font-size="18" fill="#222">S3 Bucket</text>
  <text x="1112" y="316" text-anchor="middle" font-size="16" fill="#555">+ DynamoDB</text>
  <!-- Vertical join line -->
  <line x1="1004" y1="208" x2="1004" y2="458" stroke="#555" stroke-width="3"/>
</svg>

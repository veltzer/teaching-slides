<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="222" y="40" width="836" height="92" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="3" filter="url(#shadow)"/>
  <text x="640" y="94" text-anchor="middle" font-size="22" fill="#1565c0" font-weight="bold">terraform init</text>
  <line x1="640" y1="132" x2="640" y2="168" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="222" y="168" width="836" height="92" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3" filter="url(#shadow)"/>
  <text x="640" y="222" text-anchor="middle" font-size="22" fill="#2e7d32" font-weight="bold">terraform plan</text>
  <line x1="640" y1="260" x2="640" y2="296" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="222" y="296" width="836" height="92" rx="8" fill="#fff8e1" stroke="#f57c00" stroke-width="3" filter="url(#shadow)"/>
  <text x="640" y="350" text-anchor="middle" font-size="22" fill="#e65100" font-weight="bold">terraform apply</text>
  <line x1="640" y1="388" x2="640" y2="424" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="222" y="424" width="836" height="92" rx="8" fill="url(#grad-surface)" stroke="#555" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="478" text-anchor="middle" font-size="22" fill="#333" font-weight="bold">terraform.tfstate (updated)</text>
  <line x1="640" y1="516" x2="640" y2="552" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="222" y="552" width="836" height="96" rx="8" fill="url(#grad-surface)" stroke="#555" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="597" text-anchor="middle" font-size="22" fill="#333" font-weight="bold">terraform.tfstate.backup</text>
  <text x="640" y="632" text-anchor="middle" font-size="16" fill="#555">(previous version)</text>
  <!-- Loop arrow -->
  <text x="1160" y="350" text-anchor="middle" font-size="32" fill="#555">↩</text>
  <text x="1160" y="385" text-anchor="middle" font-size="16" fill="#555">loop</text>
</svg>

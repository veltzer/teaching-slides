  <text x="879.024463" y="426.076267" font-size="11.153618" fill="var(--text)" font-family="Arial, sans-serif">• Deregister (Consul)</text>
  <text x="879.024463" y="442.015201" font-size="11.153618" fill="var(--text)" font-family="Arial, sans-serif">• Remove from LB</text>
  <text x="879.024463" y="457.954135" font-size="11.153618" fill="var(--text)" font-family="Arial, sans-serif">• Drain connections</text>
  <text x="879.024463" y="473.893069" font-size="11.153618" fill="var(--text)" font-family="Arial, sans-serif">• Backup data</text>
  <text x="879.024463" y="489.832002" font-size="11.153618" fill="var(--danger-accent)" font-family="Arial, sans-serif">• Runs BEFORE delete</text>

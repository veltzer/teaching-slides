  <rect x="859.512162" y="199.38934" width="380.487838" height="159.38934" rx="6.417256" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="888.780561" y="224.183066" font-size="12.08305" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">remote-exec:</text>

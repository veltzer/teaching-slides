<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="26.6667" y="62.2222" width="160" height="71.1111" rx="6" fill="var(--surface)" filter="url(#shadow)" stroke="var(--border)" stroke-width="1" />
  <text x="106.6667" y="91.5556" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--text)" text-anchor="middle">terraform</text>
  <text x="106.6667" y="107.5556" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--text)" text-anchor="middle">apply</text>
  <text x="106.6667" y="124.4444" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">(user runs)</text>
  <line x1="186.6667" y1="97.7778" x2="240" y2="97.7778" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="240" y="62.2222" width="160" height="71.1111" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="320" y="91.5556" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Resource</text>
  <text x="320" y="107.5556" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Created</text>
  <text x="320" y="124.4444" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">aws_instance, etc.</text>
  <line x1="400" y1="80" x2="488.8889" y2="80" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="444.4444" y="72.8889" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">when = "create"</text>
  <rect x="488.8889" y="35.5556" width="266.6667" height="128.8889" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="488.8889" y="35.5556" width="266.6667" height="32" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="488.8889" y="56.8889" width="266.6667" height="10.6667" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="622.2222" y="56" font-family="Arial,sans-serif" font-size="14.2222" font-weight="bold" fill="var(--bg)" text-anchor="middle">local-exec provisioner</text>
  <text x="506.6667" y="84.4444" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">Runs on the Terraform machine</text>
  <text x="506.6667" y="100.4444" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">(where you ran terraform apply)</text>
  <rect x="506.6667" y="110.2222" width="231.1111" height="40.8889" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="0.8889" />
  <text x="515.5556" y="126.2222" font-family="monospace" font-size="10" fill="var(--warn-accent)">provisioner "local-exec" {</text>
  <text x="515.5556" y="140.4444" font-family="monospace" font-size="10" fill="var(--text-muted)">  command = "echo ${self.id}"</text>
  <text x="622.2222" y="154.6667" font-family="monospace" font-size="10" fill="var(--warn-accent)">}</text>
  <rect x="773.3333" y="35.5556" width="346.6667" height="128.8889" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="800" y="60.4444" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--warn-accent)">local-exec execution:</text>
  <rect x="791.1111" y="71.1111" width="106.6667" height="44.4444" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="0.8889" />
  <text x="844.4444" y="89.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)" text-anchor="middle">Terraform</text>
  <text x="844.4444" y="105.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)" text-anchor="middle">machine</text>
  <line x1="897.7778" y1="93.3333" x2="960" y2="93.3333" stroke="var(--warn-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="928.8889" y="85.3333" font-family="Arial,sans-serif" font-size="10" fill="var(--warn-accent)" text-anchor="middle">shell exec</text>
  <text x="928.8889" y="104" font-family="Arial,sans-serif" font-size="10" fill="var(--warn-accent)" text-anchor="middle">(local)</text>
  <rect x="960" y="71.1111" width="133.3333" height="44.4444" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="0.8889" />
  <text x="1026.6667" y="89.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)" text-anchor="middle">Script / cmd</text>
  <text x="1026.6667" y="105.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)" text-anchor="middle">runs locally</text>
  <text x="791.1111" y="144" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">Use: trigger Ansible, notify webhook,</text>
  <text x="791.1111" y="158.2222" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">write to inventory file, call CI API</text>
  <line x1="400" y1="115.5556" x2="488.8889" y2="195.5556" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="435.5556" y="161.7778" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">when = "create"</text>
  <rect x="488.8889" y="195.5556" width="266.6667" height="142.2222" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="488.8889" y="195.5556" width="266.6667" height="32" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="488.8889" y="216.8889" width="266.6667" height="10.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="622.2222" y="216" font-family="Arial,sans-serif" font-size="14.2222" font-weight="bold" fill="var(--bg)" text-anchor="middle">remote-exec provisioner</text>
  <text x="506.6667" y="247.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">SSHes into the new resource</text>
  <text x="506.6667" y="263.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">and runs commands on it</text>
  <rect x="506.6667" y="273.7778" width="231.1111" height="53.3333" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="0.8889" />
  <text x="515.5556" y="289.7778" font-family="monospace" font-size="10" fill="var(--primary-accent)">provisioner "remote-exec" {</text>
  <text x="515.5556" y="304" font-family="monospace" font-size="10" fill="var(--text-muted)">  inline = [</text>
  <text x="515.5556" y="318.2222" font-family="monospace" font-size="10" fill="var(--text-muted)">    "sudo apt-get update",</text>
  <text x="622.2222" y="332.4444" font-family="monospace" font-size="10" fill="var(--primary-accent)">] }</text>
  <rect x="773.3333" y="195.5556" width="346.6667" height="160" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="800" y="220.4444" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--primary-accent)">remote-exec execution:</text>
  <rect x="791.1111" y="231.1111" width="97.7778" height="44.4444" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="0.8889" />
  <text x="840" y="249.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)" text-anchor="middle">Terraform</text>
  <text x="840" y="265.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)" text-anchor="middle">machine</text>
  <line x1="888.8889" y1="253.3333" x2="942.2222" y2="253.3333" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="915.5556" y="245.3333" font-family="Arial,sans-serif" font-size="10" fill="var(--primary-accent)" text-anchor="middle">SSH / WinRM</text>
  <rect x="942.2222" y="231.1111" width="142.2222" height="44.4444" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="0.8889" />
  <text x="1013.3333" y="249.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)" text-anchor="middle">Remote host</text>
  <text x="1013.3333" y="265.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)" text-anchor="middle">(new resource)</text>
  <text x="791.1111" y="298.6667" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">Needs: connection block with</text>
  <text x="791.1111" y="314.6667" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">host, user, private_key</text>
  <text x="791.1111" y="332.4444" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">Use: bootstrap software, config management</text>
  <text x="791.1111" y="346.6667" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">before handing off to Ansible/Chef/Puppet</text>
  <line x1="400" y1="97.7778" x2="488.8889" y2="382.2222" stroke="var(--danger-border)" stroke-width="1.7778" stroke-dasharray="5.3333 3.5556" marker-end="url(#arrow)" />
  <text x="449.7778" y="248.8889" font-family="Arial,sans-serif" font-size="10" fill="var(--danger-accent)">when = "destroy"</text>
  <rect x="488.8889" y="373.3333" width="266.6667" height="115.5556" rx="6" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2" />
  <rect x="488.8889" y="373.3333" width="266.6667" height="32" rx="6" fill="var(--danger-accent)" />
  <rect x="488.8889" y="394.6667" width="266.6667" height="10.6667" fill="var(--danger-accent)" rx="6"/>
  <text x="622.2222" y="394.6667" font-family="Arial,sans-serif" font-size="14.2222" font-weight="bold" fill="var(--bg)" text-anchor="middle">destroy-time provisioner</text>
  <text x="506.6667" y="424.8889" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">Runs BEFORE the resource is</text>
  <text x="506.6667" y="440.8889" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">destroyed on terraform destroy</text>
  <rect x="506.6667" y="451.5556" width="231.1111" height="26.6667" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="0.8889" />
  <text x="515.5556" y="463.1111" font-family="monospace" font-size="10" fill="var(--danger-accent)">when = destroy   # in provisioner</text>
  <text x="515.5556" y="478.2222" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">Use: deregister from load balancer,</text>
  <text x="773.3333" y="394.6667" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--danger-accent)">destroy-time use cases:</text>
  <rect x="773.3333" y="403.5556" width="346.6667" height="97.7778" rx="6" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="791.1111" y="423.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• Deregister from service discovery (Consul)</text>
  <text x="791.1111" y="439.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• Remove from load balancer before delete</text>
  <text x="791.1111" y="455.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• Drain connections gracefully</text>
  <text x="791.1111" y="471.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• Backup data before instance termination</text>
  <text x="791.1111" y="487.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--danger-accent)">• Note: runs BEFORE resource is deleted</text>
  <rect x="26.6667" y="546.6667" width="1084.4444" height="71.1111" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="568.8889" y="567.1111" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Provisioners are a last resort — prefer user_data (cloud-init), Packer images, or configuration management tools</text>
  <text x="568.8889" y="586.6667" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text-muted)" text-anchor="middle">Provisioner failures mark the resource as tainted — next apply will destroy and recreate it</text>
  <text x="568.8889" y="604.4444" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text-muted)" text-anchor="middle">Use on_failure = continue to ignore errors, or on_failure = fail (default) to halt</text>
</svg>
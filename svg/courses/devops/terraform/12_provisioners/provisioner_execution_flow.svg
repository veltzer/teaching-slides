<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="68.125" y="96.3889" width="168.75" height="64.4444" rx="6" fill="var(--surface)" filter="url(#shadow)" stroke="var(--border)" stroke-width="1" />
  <text x="152.5" y="122.9723" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--text)" text-anchor="middle">terraform</text>
  <text x="152.5" y="137.4723" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--text)" text-anchor="middle">apply</text>
  <text x="152.5" y="152.7777" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">(user runs)</text>
  <line x1="236.875" y1="128.6111" x2="293.125" y2="128.6111" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="293.125" y="96.3889" width="168.75" height="64.4444" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="377.5" y="122.9723" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Resource</text>
  <text x="377.5" y="137.4723" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Created</text>
  <text x="377.5" y="152.7777" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">aws_instance, etc.</text>
  <line x1="461.875" y1="112.5" x2="555.625" y2="112.5" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="508.7499" y="106.0556" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">when = "create"</text>
  <rect x="555.625" y="72.2223" width="281.25" height="116.8056" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="555.625" y="72.2223" width="281.25" height="29" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="555.625" y="91.5556" width="281.25" height="9.6667" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="696.25" y="90.75" font-family="Arial,sans-serif" font-size="13.9044" font-weight="bold" fill="var(--bg)" text-anchor="middle">local-exec provisioner</text>
  <text x="574.375" y="116.5277" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">Runs on the Terraform machine</text>
  <text x="574.375" y="131.0277" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">(where you ran terraform apply)</text>
  <rect x="574.375" y="139.8889" width="243.75" height="37.0556" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="0.8889" />
  <text x="583.75" y="154.3889" font-family="monospace" font-size="10" fill="var(--warn-accent)">provisioner "local-exec" {</text>
  <text x="583.75" y="167.2777" font-family="monospace" font-size="10" fill="var(--text-muted)">  command = "echo ${self.id}"</text>
  <text x="696.25" y="180.1667" font-family="monospace" font-size="10" fill="var(--warn-accent)">}</text>
  <rect x="855.6249" y="72.2223" width="365.625" height="116.8056" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="883.75" y="94.7777" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--warn-accent)">local-exec execution:</text>
  <rect x="874.375" y="104.4444" width="112.5" height="40.2777" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="0.8889" />
  <text x="930.6249" y="121.3611" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)" text-anchor="middle">Terraform</text>
  <text x="930.6249" y="135.8611" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)" text-anchor="middle">machine</text>
  <line x1="986.875" y1="124.5833" x2="1052.5" y2="124.5833" stroke="var(--warn-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="1019.6875" y="117.3333" font-family="Arial,sans-serif" font-size="10" fill="var(--warn-accent)" text-anchor="middle">shell exec</text>
  <text x="1019.6875" y="134.25" font-family="Arial,sans-serif" font-size="10" fill="var(--warn-accent)" text-anchor="middle">(local)</text>
  <rect x="1052.5" y="104.4444" width="140.625" height="40.2777" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="0.8889" />
  <text x="1122.8125" y="121.3611" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)" text-anchor="middle">Script / cmd</text>
  <text x="1122.8125" y="135.8611" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)" text-anchor="middle">runs locally</text>
  <text x="874.375" y="170.5" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">Use: trigger Ansible, notify webhook,</text>
  <text x="874.375" y="183.3889" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">write to inventory file, call CI API</text>
  <line x1="461.875" y1="144.7223" x2="555.625" y2="217.2223" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="499.375" y="186.6111" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">when = "create"</text>
  <rect x="555.625" y="217.2223" width="281.25" height="128.8889" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="555.625" y="217.2223" width="281.25" height="29" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="555.625" y="236.5556" width="281.25" height="9.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="696.25" y="235.75" font-family="Arial,sans-serif" font-size="13.9044" font-weight="bold" fill="var(--bg)" text-anchor="middle">remote-exec provisioner</text>
  <text x="574.375" y="263.9444" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">SSHes into the new resource</text>
  <text x="574.375" y="278.4444" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">and runs commands on it</text>
  <rect x="574.375" y="288.1111" width="243.75" height="48.3333" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="0.8889" />
  <text x="583.75" y="302.6111" font-family="monospace" font-size="10" fill="var(--primary-accent)">provisioner "remote-exec" {</text>
  <text x="583.75" y="315.5" font-family="monospace" font-size="10" fill="var(--text-muted)">  inline = [</text>
  <text x="583.75" y="328.3889" font-family="monospace" font-size="10" fill="var(--text-muted)">    "sudo apt-get update",</text>
  <text x="696.25" y="341.2777" font-family="monospace" font-size="10" fill="var(--primary-accent)">] }</text>
  <rect x="855.6249" y="217.2223" width="365.625" height="145" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="883.75" y="239.7777" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--primary-accent)">remote-exec execution:</text>
  <rect x="874.375" y="249.4444" width="103.125" height="40.2777" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="0.8889" />
  <text x="925.9375" y="266.3611" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)" text-anchor="middle">Terraform</text>
  <text x="925.9375" y="280.8611" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)" text-anchor="middle">machine</text>
  <line x1="977.5" y1="269.5833" x2="1033.75" y2="269.5833" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="1005.625" y="262.3333" font-family="Arial,sans-serif" font-size="10" fill="var(--primary-accent)" text-anchor="middle">SSH / WinRM</text>
  <rect x="1033.75" y="249.4444" width="150" height="40.2777" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="0.8889" />
  <text x="1108.7499" y="266.3611" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)" text-anchor="middle">Remote host</text>
  <text x="1108.7499" y="280.8611" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)" text-anchor="middle">(new resource)</text>
  <text x="874.375" y="310.6667" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">Needs: connection block with</text>
  <text x="874.375" y="325.1667" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">host, user, private_key</text>
  <text x="874.375" y="341.2777" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">Use: bootstrap software, config management</text>
  <text x="874.375" y="354.1667" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">before handing off to Ansible/Chef/Puppet</text>
  <line x1="461.875" y1="128.6111" x2="555.625" y2="386.3889" stroke="var(--danger-border)" stroke-width="1.7778" stroke-dasharray="5.3333 3.5556" marker-end="url(#arrow)" />
  <text x="514.375" y="265.5556" font-family="Arial,sans-serif" font-size="10" fill="var(--danger-accent)">when = "destroy"</text>
  <rect x="555.625" y="378.3333" width="281.25" height="104.7223" rx="6" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2" />
  <rect x="555.625" y="378.3333" width="281.25" height="29" rx="6" fill="var(--danger-accent)" />
  <rect x="555.625" y="397.6667" width="281.25" height="9.6667" fill="var(--danger-accent)" rx="6"/>
  <text x="696.25" y="397.6667" font-family="Arial,sans-serif" font-size="13.9044" font-weight="bold" fill="var(--bg)" text-anchor="middle">destroy-time provisioner</text>
  <text x="574.375" y="425.0556" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">Runs BEFORE the resource is</text>
  <text x="574.375" y="439.5556" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">destroyed on terraform destroy</text>
  <rect x="574.375" y="449.2223" width="243.75" height="24.1667" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="0.8889" />
  <text x="583.75" y="459.6944" font-family="monospace" font-size="10" fill="var(--danger-accent)">when = destroy   # in provisioner</text>
  <text x="583.75" y="473.3889" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">Use: deregister from load balancer,</text>
  <text x="855.6249" y="397.6667" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--danger-accent)">destroy-time use cases:</text>
  <rect x="855.6249" y="405.7223" width="365.625" height="88.6111" rx="6" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="874.375" y="423.4444" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• Deregister from service discovery (Consul)</text>
  <text x="874.375" y="437.9444" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• Remove from load balancer before delete</text>
  <text x="874.375" y="452.4444" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• Drain connections gracefully</text>
  <text x="874.375" y="466.9444" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• Backup data before instance termination</text>
  <text x="874.375" y="481.4444" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--danger-accent)">• Note: runs BEFORE resource is deleted</text>
  <rect x="68.125" y="535.4167" width="1143.7499" height="64.4444" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="553.9444" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Provisioners are a last resort — prefer user_data (cloud-init), Packer images, or configuration management tools</text>
  <text x="640" y="571.6667" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text-muted)" text-anchor="middle">Provisioner failures mark the resource as tainted — next apply will destroy and recreate it</text>
  <text x="640" y="587.7777" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text-muted)" text-anchor="middle">Use on_failure = continue to ignore errors, or on_failure = fail (default) to halt</text>
</svg>
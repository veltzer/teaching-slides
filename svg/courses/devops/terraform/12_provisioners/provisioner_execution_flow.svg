<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="66.564817" width="175.609771" height="70.839658" rx="6.417256" fill="var(--surface)" filter="url(#shadow)" stroke="var(--border)" stroke-width="1" />
  <text x="127.804886" y="95.786269" font-family="Arial,sans-serif" font-size="13.012376" font-weight="bold" fill="var(--text)" text-anchor="middle">terraform</text>
  <text x="127.804886" y="111.725203" font-family="Arial,sans-serif" font-size="13.012376" font-weight="bold" fill="var(--text)" text-anchor="middle">apply</text>
  <text x="127.804886" y="128.549462" font-family="Arial,sans-serif" font-size="10.695426" fill="var(--text-muted)" text-anchor="middle">(user runs)</text>
  <line x1="215.609771" y1="101.984646" x2="274.146362" y2="101.984646" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="274.146362" y="66.564817" width="175.609771" height="70.839658" rx="6.417256" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="361.951247" y="95.786269" font-family="Arial,sans-serif" font-size="13.012376" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Resource</text>
  <text x="361.951247" y="111.725203" font-family="Arial,sans-serif" font-size="13.012376" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Created</text>
  <text x="361.951247" y="128.549462" font-family="Arial,sans-serif" font-size="10.695426" fill="var(--text-muted)" text-anchor="middle">aws_instance, etc.</text>
  <line x1="449.756133" y1="84.274731" x2="547.317117" y2="84.274731" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="498.536521" y="77.190809" font-family="Arial,sans-serif" font-size="10.695426" fill="var(--text-muted)" text-anchor="middle">when = "create"</text>
  <rect x="547.317117" y="40" width="292.682952" height="128.397017" rx="6.417256" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="547.317117" y="40" width="292.682952" height="31.877868" rx="6.417256" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="547.317117" y="61.251875" width="292.682952" height="10.625993" fill="var(--warn-fill)" rx="6.417256" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="693.658593" y="60.36633" font-family="Arial,sans-serif" font-size="14.871348" font-weight="bold" fill="var(--bg)" text-anchor="middle">local-exec provisioner</text>
  <text x="566.829314" y="88.702127" font-family="Arial,sans-serif" font-size="11.153618" fill="var(--text)">Runs on the Terraform machine</text>
  <text x="566.829314" y="104.641061" font-family="Arial,sans-serif" font-size="11.153618" fill="var(--text-muted)">(where you ran terraform apply)</text>
  <rect x="566.829314" y="114.381619" width="253.658559" height="40.73288" rx="6.417256" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="0.8889" />
  <text x="576.585412" y="130.320553" font-family="monospace" font-size="10.695426" fill="var(--warn-accent)">provisioner "local-exec" {</text>
  <text x="576.585412" y="144.488396" font-family="monospace" font-size="10.695426" fill="var(--text-muted)">  command = "echo ${self.id}"</text>
  <text x="693.658593" y="158.65646" font-family="monospace" font-size="10.695426" fill="var(--warn-accent)">}</text>
  <rect x="859.512162" y="40" width="380.487838" height="128.397017" rx="6.417256" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="888.780561" y="64.793726" font-family="Arial,sans-serif" font-size="12.08305" font-weight="bold" fill="var(--warn-accent)">local-exec execution:</text>
  <rect x="879.024463" y="75.419719" width="117.073181" height="44.274731" rx="6.417256" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="0.8889" />
  <text x="937.560949" y="94.015179" font-family="Arial,sans-serif" font-size="11.153618" fill="var(--text)" text-anchor="middle">Terraform</text>
  <text x="937.560949" y="109.954113" font-family="Arial,sans-serif" font-size="11.153618" fill="var(--text)" text-anchor="middle">machine</text>
  <line x1="996.097644" y1="97.557139" x2="1064.390333" y2="97.557139" stroke="var(--warn-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="1030.243988" y="89.587672" font-family="Arial,sans-serif" font-size="10.695426" fill="var(--warn-accent)" text-anchor="middle">shell exec</text>
  <text x="1030.243988" y="108.183132" font-family="Arial,sans-serif" font-size="10.695426" fill="var(--warn-accent)" text-anchor="middle">(local)</text>
  <rect x="1064.390333" y="75.419719" width="146.341476" height="44.274731" rx="6.417256" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="0.8889" />
  <text x="1137.561071" y="94.015179" font-family="Arial,sans-serif" font-size="11.153618" fill="var(--text)" text-anchor="middle">Script / cmd</text>
  <text x="1137.561071" y="109.954113" font-family="Arial,sans-serif" font-size="11.153618" fill="var(--text)" text-anchor="middle">runs locally</text>
  <text x="879.024463" y="148.030467" font-family="Arial,sans-serif" font-size="10.695426" fill="var(--text-muted)">Use: trigger Ansible, notify webhook,</text>
  <text x="879.024463" y="162.198421" font-family="Arial,sans-serif" font-size="10.695426" fill="var(--text-muted)">write to inventory file, call CI API</text>
  <line x1="449.756133" y1="119.69467" x2="547.317117" y2="199.38934" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="488.780527" y="165.740381" font-family="Arial,sans-serif" font-size="10.695426" fill="var(--text-muted)">when = "create"</text>
  <rect x="547.317117" y="199.38934" width="292.682952" height="141.679425" rx="6.417256" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="547.317117" y="199.38934" width="292.682952" height="31.877868" rx="6.417256" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="547.317117" y="220.641215" width="292.682952" height="10.625993" fill="var(--primary-fill)" rx="6.417256" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="693.658593" y="219.75567" font-family="Arial,sans-serif" font-size="14.871348" font-weight="bold" fill="var(--bg)" text-anchor="middle">remote-exec provisioner</text>
  <text x="566.829314" y="250.747993" font-family="Arial,sans-serif" font-size="11.153618" fill="var(--text)">SSHes into the new resource</text>
  <text x="566.829314" y="266.686927" font-family="Arial,sans-serif" font-size="11.153618" fill="var(--text-muted)">and runs commands on it</text>
  <rect x="566.829314" y="277.312919" width="253.658559" height="53.129743" rx="6.417256" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="0.8889" />
  <text x="576.585412" y="293.251853" font-family="monospace" font-size="10.695426" fill="var(--primary-accent)">provisioner "remote-exec" {</text>
  <text x="576.585412" y="307.419807" font-family="monospace" font-size="10.695426" fill="var(--text-muted)">  inline = [</text>
  <text x="576.585412" y="321.58776" font-family="monospace" font-size="10.695426" fill="var(--text-muted)">    "sudo apt-get update",</text>
  <text x="693.658593" y="335.755604" font-family="monospace" font-size="10.695426" fill="var(--primary-accent)">] }</text>
  <rect x="859.512162" y="199.38934" width="380.487838" height="159.38934" rx="6.417256" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="888.780561" y="224.183066" font-family="Arial,sans-serif" font-size="12.08305" font-weight="bold" fill="var(--primary-accent)">remote-exec execution:</text>
  <rect x="879.024463" y="234.809059" width="107.317082" height="44.274731" rx="6.417256" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="0.8889" />
  <text x="932.683004" y="253.404518" font-family="Arial,sans-serif" font-size="11.153618" fill="var(--text)" text-anchor="middle">Terraform</text>
  <text x="932.683004" y="269.343452" font-family="Arial,sans-serif" font-size="11.153618" fill="var(--text)" text-anchor="middle">machine</text>
  <line x1="986.341545" y1="256.946479" x2="1044.878136" y2="256.946479" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="1015.609841" y="248.977012" font-family="Arial,sans-serif" font-size="10.695426" fill="var(--primary-accent)" text-anchor="middle">SSH / WinRM</text>
  <rect x="1044.878136" y="234.809059" width="156.097575" height="44.274731" rx="6.417256" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="0.8889" />
  <text x="1122.926819" y="253.404518" font-family="Arial,sans-serif" font-size="11.153618" fill="var(--text)" text-anchor="middle">Remote host</text>
  <text x="1122.926819" y="269.343452" font-family="Arial,sans-serif" font-size="11.153618" fill="var(--text)" text-anchor="middle">(new resource)</text>
  <text x="879.024463" y="302.106866" font-family="Arial,sans-serif" font-size="11.153618" fill="var(--text-muted)">Needs: connection block with</text>
  <text x="879.024463" y="318.0458" font-family="Arial,sans-serif" font-size="11.153618" fill="var(--text-muted)">host, user, private_key</text>
  <text x="879.024463" y="335.755604" font-family="Arial,sans-serif" font-size="10.695426" fill="var(--text-muted)">Use: bootstrap software, config management</text>
  <text x="879.024463" y="349.923667" font-family="Arial,sans-serif" font-size="10.695426" fill="var(--text-muted)">before handing off to Ansible/Chef/Puppet</text>
  <line x1="449.756133" y1="101.984646" x2="547.317117" y2="385.343496" stroke="var(--danger-border)" stroke-width="1.7778" stroke-dasharray="5.3333 3.5556" marker-end="url(#arrow)" />
  <text x="504.390284" y="252.519083" font-family="Arial,sans-serif" font-size="10.695426" fill="var(--danger-accent)">when = "destroy"</text>
  <rect x="547.317117" y="376.488484" width="292.682952" height="115.114609" rx="6.417256" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2" />
  <rect x="547.317117" y="376.488484" width="292.682952" height="31.877868" rx="6.417256" fill="var(--danger-accent)" />
  <rect x="547.317117" y="397.740469" width="292.682952" height="10.625993" fill="var(--danger-accent)" rx="6.417256"/>
  <text x="693.658593" y="397.740469" font-family="Arial,sans-serif" font-size="14.871348" font-weight="bold" fill="var(--bg)" text-anchor="middle">destroy-time provisioner</text>
  <text x="566.829314" y="427.847357" font-family="Arial,sans-serif" font-size="11.153618" fill="var(--text)">Runs BEFORE the resource is</text>
  <text x="566.829314" y="443.786291" font-family="Arial,sans-serif" font-size="11.153618" fill="var(--text)">destroyed on terraform destroy</text>
  <rect x="566.829314" y="454.412284" width="253.658559" height="26.564927" rx="6.417256" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="0.8889" />
  <text x="576.585412" y="465.923602" font-family="monospace" font-size="10.695426" fill="var(--danger-accent)">when = destroy   # in provisioner</text>
  <text x="576.585412" y="480.9771" font-family="Arial,sans-serif" font-size="10.695426" fill="var(--text-muted)">Use: deregister from load balancer,</text>
  <text x="859.512162" y="397.740469" font-family="Arial,sans-serif" font-size="12.08305" font-weight="bold" fill="var(--danger-accent)">destroy-time use cases:</text>
  <rect x="859.512162" y="406.595482" width="380.487838" height="97.404584" rx="6.417256" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="879.024463" y="426.076267" font-family="Arial,sans-serif" font-size="11.153618" fill="var(--text)">• Deregister from service discovery (Consul)</text>
  <text x="879.024463" y="442.015201" font-family="Arial,sans-serif" font-size="11.153618" fill="var(--text)">• Remove from load balancer before delete</text>
  <text x="879.024463" y="457.954135" font-family="Arial,sans-serif" font-size="11.153618" fill="var(--text)">• Drain connections gracefully</text>
  <text x="879.024463" y="473.893069" font-family="Arial,sans-serif" font-size="11.153618" fill="var(--text)">• Backup data before instance termination</text>
  <text x="879.024463" y="489.832002" font-family="Arial,sans-serif" font-size="11.153618" fill="var(--danger-accent)">• Note: runs BEFORE resource is deleted</text>
  <rect x="40" y="549.160342" width="1190.243902" height="70.839658" rx="6.417256" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="635.122003" y="569.526672" font-family="Arial,sans-serif" font-size="13.012376" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Provisioners are a last resort — prefer user_data (cloud-init), Packer images, or configuration management tools</text>
  <text x="635.122003" y="589.007677" font-family="Arial,sans-serif" font-size="12.08305" fill="var(--text-muted)" text-anchor="middle">Provisioner failures mark the resource as tainted — next apply will destroy and recreate it</text>
  <text x="635.122003" y="606.717482" font-family="Arial,sans-serif" font-size="12.08305" fill="var(--text-muted)" text-anchor="middle">Use on_failure = continue to ignore errors, or on_failure = fail (default) to halt</text>
</svg>
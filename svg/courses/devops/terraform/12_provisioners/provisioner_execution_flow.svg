  <rect x="547.317117" y="40" width="292.682952" height="31.877868" rx="6.417256" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="547.317117" y="61.251875" width="292.682952" height="10.625993" fill="url(#grad-warn)" rx="6.417256" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="693.658593" y="60.36633" font-size="14.871348" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">local-exec provisioner</text>

<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#ffffff" />
      <ns0:stop offset="100%" stop-color="#f2f2f2" />
    </ns0:linearGradient>
    <ns0:filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <ns0:feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </ns0:filter>
    <ns0:marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </ns0:marker>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="26.6667" y="62.2222" width="160" height="71.1111" rx="8.8889" fill="#f5f5f5" filter="url(#shadow)" stroke="#555" stroke-width="1.7778" />
  <ns0:text x="106.6667" y="91.5556" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#333" text-anchor="middle">terraform</ns0:text>
  <ns0:text x="106.6667" y="107.5556" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#333" text-anchor="middle">apply</ns0:text>
  <ns0:text x="106.6667" y="124.4444" font-family="Arial,sans-serif" font-size="10" fill="#666" text-anchor="middle">(user runs)</ns0:text>
  <ns0:line x1="186.6667" y1="97.7778" x2="240" y2="97.7778" stroke="#555" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:rect x="240" y="62.2222" width="160" height="71.1111" rx="8.8889" fill="#e8f5e9" filter="url(#shadow)" stroke="#2e7d32" stroke-width="1.7778" />
  <ns0:text x="320" y="91.5556" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#2e7d32" text-anchor="middle">Resource</ns0:text>
  <ns0:text x="320" y="107.5556" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#2e7d32" text-anchor="middle">Created</ns0:text>
  <ns0:text x="320" y="124.4444" font-family="Arial,sans-serif" font-size="10" fill="#555" text-anchor="middle">aws_instance, etc.</ns0:text>
  <ns0:line x1="400" y1="80" x2="488.8889" y2="80" stroke="#555" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:text x="444.4444" y="72.8889" font-family="Arial,sans-serif" font-size="10" fill="#555" text-anchor="middle">when = "create"</ns0:text>
  <ns0:rect x="488.8889" y="35.5556" width="266.6667" height="128.8889" rx="8.8889" fill="#fff8e1" filter="url(#shadow)" stroke="#f9a825" stroke-width="1.7778" />
  <ns0:rect x="488.8889" y="35.5556" width="266.6667" height="32" rx="8.8889" fill="#f9a825" />
  <ns0:rect x="488.8889" y="56.8889" width="266.6667" height="10.6667" fill="#f9a825" />
  <ns0:text x="622.2222" y="56" font-family="Arial,sans-serif" font-size="14.2222" font-weight="bold" fill="#fff" text-anchor="middle">local-exec provisioner</ns0:text>
  <ns0:text x="506.6667" y="84.4444" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">Runs on the Terraform machine</ns0:text>
  <ns0:text x="506.6667" y="100.4444" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">(where you ran terraform apply)</ns0:text>
  <ns0:rect x="506.6667" y="110.2222" width="231.1111" height="40.8889" rx="4.4444" fill="#fff" stroke="#ffe082" stroke-width="0.8889" />
  <ns0:text x="515.5556" y="126.2222" font-family="monospace" font-size="10" fill="#f57f17">provisioner "local-exec" {</ns0:text>
  <ns0:text x="515.5556" y="140.4444" font-family="monospace" font-size="10" fill="#555">  command = "echo ${self.id}"</ns0:text>
  <ns0:text x="622.2222" y="154.6667" font-family="monospace" font-size="10" fill="#f57f17">}</ns0:text>
  <ns0:rect x="773.3333" y="35.5556" width="346.6667" height="128.8889" rx="8.8889" fill="#fff8e1" filter="url(#shadow)" stroke="#f9a825" stroke-width="1.3333" />
  <ns0:text x="800" y="60.4444" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#f57f17">local-exec execution:</ns0:text>
  <ns0:rect x="791.1111" y="71.1111" width="106.6667" height="44.4444" rx="5.3333" fill="#fff" stroke="#f9a825" stroke-width="0.8889" />
  <ns0:text x="844.4444" y="89.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="#333" text-anchor="middle">Terraform</ns0:text>
  <ns0:text x="844.4444" y="105.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="#333" text-anchor="middle">machine</ns0:text>
  <ns0:line x1="897.7778" y1="93.3333" x2="960" y2="93.3333" stroke="#f9a825" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:text x="928.8889" y="85.3333" font-family="Arial,sans-serif" font-size="10" fill="#f57f17" text-anchor="middle">shell exec</ns0:text>
  <ns0:text x="928.8889" y="104" font-family="Arial,sans-serif" font-size="10" fill="#f57f17" text-anchor="middle">(local)</ns0:text>
  <ns0:rect x="960" y="71.1111" width="133.3333" height="44.4444" rx="5.3333" fill="#fff" stroke="#f9a825" stroke-width="0.8889" />
  <ns0:text x="1026.6667" y="89.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="#333" text-anchor="middle">Script / cmd</ns0:text>
  <ns0:text x="1026.6667" y="105.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="#333" text-anchor="middle">runs locally</ns0:text>
  <ns0:text x="791.1111" y="144" font-family="Arial,sans-serif" font-size="10" fill="#555">Use: trigger Ansible, notify webhook,</ns0:text>
  <ns0:text x="791.1111" y="158.2222" font-family="Arial,sans-serif" font-size="10" fill="#555">write to inventory file, call CI API</ns0:text>
  <ns0:line x1="400" y1="115.5556" x2="488.8889" y2="195.5556" stroke="#555" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:text x="435.5556" y="161.7778" font-family="Arial,sans-serif" font-size="10" fill="#555">when = "create"</ns0:text>
  <ns0:rect x="488.8889" y="195.5556" width="266.6667" height="142.2222" rx="8.8889" fill="#e3f2fd" filter="url(#shadow)" stroke="#1565c0" stroke-width="1.7778" />
  <ns0:rect x="488.8889" y="195.5556" width="266.6667" height="32" rx="8.8889" fill="url(#grad-accent)" />
  <ns0:rect x="488.8889" y="216.8889" width="266.6667" height="10.6667" fill="url(#grad-accent)" />
  <ns0:text x="622.2222" y="216" font-family="Arial,sans-serif" font-size="14.2222" font-weight="bold" fill="#fff" text-anchor="middle">remote-exec provisioner</ns0:text>
  <ns0:text x="506.6667" y="247.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">SSHes into the new resource</ns0:text>
  <ns0:text x="506.6667" y="263.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">and runs commands on it</ns0:text>
  <ns0:rect x="506.6667" y="273.7778" width="231.1111" height="53.3333" rx="4.4444" fill="#fff" stroke="#90caf9" stroke-width="0.8889" />
  <ns0:text x="515.5556" y="289.7778" font-family="monospace" font-size="10" fill="#1565c0">provisioner "remote-exec" {</ns0:text>
  <ns0:text x="515.5556" y="304" font-family="monospace" font-size="10" fill="#555">  inline = [</ns0:text>
  <ns0:text x="515.5556" y="318.2222" font-family="monospace" font-size="10" fill="#555">    "sudo apt-get update",</ns0:text>
  <ns0:text x="622.2222" y="332.4444" font-family="monospace" font-size="10" fill="#1565c0">] }</ns0:text>
  <ns0:rect x="773.3333" y="195.5556" width="346.6667" height="160" rx="8.8889" fill="#e3f2fd" filter="url(#shadow)" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="800" y="220.4444" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#1565c0">remote-exec execution:</ns0:text>
  <ns0:rect x="791.1111" y="231.1111" width="97.7778" height="44.4444" rx="5.3333" fill="#fff" stroke="#1565c0" stroke-width="0.8889" />
  <ns0:text x="840" y="249.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="#333" text-anchor="middle">Terraform</ns0:text>
  <ns0:text x="840" y="265.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="#333" text-anchor="middle">machine</ns0:text>
  <ns0:line x1="888.8889" y1="253.3333" x2="942.2222" y2="253.3333" stroke="#1565c0" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:text x="915.5556" y="245.3333" font-family="Arial,sans-serif" font-size="10" fill="#1565c0" text-anchor="middle">SSH / WinRM</ns0:text>
  <ns0:rect x="942.2222" y="231.1111" width="142.2222" height="44.4444" rx="5.3333" fill="#fff" stroke="#1565c0" stroke-width="0.8889" />
  <ns0:text x="1013.3333" y="249.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="#333" text-anchor="middle">Remote host</ns0:text>
  <ns0:text x="1013.3333" y="265.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="#333" text-anchor="middle">(new resource)</ns0:text>
  <ns0:text x="791.1111" y="298.6667" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">Needs: connection block with</ns0:text>
  <ns0:text x="791.1111" y="314.6667" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">host, user, private_key</ns0:text>
  <ns0:text x="791.1111" y="332.4444" font-family="Arial,sans-serif" font-size="10" fill="#555">Use: bootstrap software, config management</ns0:text>
  <ns0:text x="791.1111" y="346.6667" font-family="Arial,sans-serif" font-size="10" fill="#555">before handing off to Ansible/Chef/Puppet</ns0:text>
  <ns0:line x1="400" y1="97.7778" x2="488.8889" y2="382.2222" stroke="#c62828" stroke-width="1.7778" stroke-dasharray="5.3333 3.5556" marker-end="url(#arrow)" />
  <ns0:text x="449.7778" y="248.8889" font-family="Arial,sans-serif" font-size="10" fill="#c62828">when = "destroy"</ns0:text>
  <ns0:rect x="488.8889" y="373.3333" width="266.6667" height="115.5556" rx="8.8889" fill="#fce4ec" filter="url(#shadow)" stroke="#c62828" stroke-width="1.7778" />
  <ns0:rect x="488.8889" y="373.3333" width="266.6667" height="32" rx="8.8889" fill="#c62828" />
  <ns0:rect x="488.8889" y="394.6667" width="266.6667" height="10.6667" fill="#c62828" />
  <ns0:text x="622.2222" y="394.6667" font-family="Arial,sans-serif" font-size="14.2222" font-weight="bold" fill="#fff" text-anchor="middle">destroy-time provisioner</ns0:text>
  <ns0:text x="506.6667" y="424.8889" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">Runs BEFORE the resource is</ns0:text>
  <ns0:text x="506.6667" y="440.8889" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">destroyed on terraform destroy</ns0:text>
  <ns0:rect x="506.6667" y="451.5556" width="231.1111" height="26.6667" rx="4.4444" fill="#fff" stroke="#ef9a9a" stroke-width="0.8889" />
  <ns0:text x="515.5556" y="463.1111" font-family="monospace" font-size="10" fill="#c62828">when = destroy   # in provisioner</ns0:text>
  <ns0:text x="515.5556" y="478.2222" font-family="Arial,sans-serif" font-size="10" fill="#555">Use: deregister from load balancer,</ns0:text>
  <ns0:text x="773.3333" y="394.6667" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#c62828">destroy-time use cases:</ns0:text>
  <ns0:rect x="773.3333" y="403.5556" width="346.6667" height="97.7778" rx="7.1111" fill="#fce4ec" filter="url(#shadow)" stroke="#c62828" stroke-width="1.3333" />
  <ns0:text x="791.1111" y="423.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">• Deregister from service discovery (Consul)</ns0:text>
  <ns0:text x="791.1111" y="439.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">• Remove from load balancer before delete</ns0:text>
  <ns0:text x="791.1111" y="455.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">• Drain connections gracefully</ns0:text>
  <ns0:text x="791.1111" y="471.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">• Backup data before instance termination</ns0:text>
  <ns0:text x="791.1111" y="487.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="#c62828">• Note: runs BEFORE resource is deleted</ns0:text>
  <ns0:rect x="26.6667" y="546.6667" width="1084.4444" height="71.1111" rx="7.1111" fill="#fff3e0" filter="url(#shadow)" stroke="#e65100" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="567.1111" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#e65100" text-anchor="middle">Provisioners are a last resort — prefer user_data (cloud-init), Packer images, or configuration management tools</ns0:text>
  <ns0:text x="568.8889" y="586.6667" font-family="Arial,sans-serif" font-size="11.5556" fill="#555" text-anchor="middle">Provisioner failures mark the resource as tainted — next apply will destroy and recreate it</ns0:text>
  <ns0:text x="568.8889" y="604.4444" font-family="Arial,sans-serif" font-size="11.5556" fill="#555" text-anchor="middle">Use on_failure = continue to ignore errors, or on_failure = fail (default) to halt</ns0:text>
</ns0:svg>
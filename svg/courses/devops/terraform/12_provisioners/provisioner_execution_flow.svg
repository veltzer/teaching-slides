    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="var(--bg)" />
  <ns0:rect x="26.6667" y="62.2222" width="160" height="71.1111" rx="8.8889" fill="var(--surface)" filter="url(#shadow)" stroke="var(--text-muted)" stroke-width="1.7778" />
  <ns0:text x="106.6667" y="91.5556" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--text-dark)" text-anchor="middle">terraform</ns0:text>
  <ns0:text x="106.6667" y="107.5556" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--text-dark)" text-anchor="middle">apply</ns0:text>
  <ns0:text x="106.6667" y="124.4444" font-family="Arial,sans-serif" font-size="10" fill="var(--text-mid)" text-anchor="middle">(user runs)</ns0:text>
  <ns0:line x1="186.6667" y1="97.7778" x2="240" y2="97.7778" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:rect x="240" y="62.2222" width="160" height="71.1111" rx="8.8889" fill="var(--ok-pale)" filter="url(#shadow)" stroke="var(--ok-dk)" stroke-width="1.7778" />
  <ns0:text x="320" y="91.5556" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">Resource</ns0:text>
  <ns0:text x="320" y="107.5556" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">Created</ns0:text>
  <ns0:text x="320" y="124.4444" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">aws_instance, etc.</ns0:text>
  <ns0:line x1="400" y1="80" x2="488.8889" y2="80" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:text x="444.4444" y="72.8889" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">when = "create"</ns0:text>
  <ns0:rect x="488.8889" y="35.5556" width="266.6667" height="128.8889" rx="8.8889" fill="var(--warn-pale3)" filter="url(#shadow)" stroke="var(--warn-amber)" stroke-width="1.7778" />
  <ns0:rect x="488.8889" y="35.5556" width="266.6667" height="32" rx="8.8889" fill="var(--warn-amber)" />
  <ns0:rect x="488.8889" y="56.8889" width="266.6667" height="10.6667" fill="var(--warn-amber)" />
  <ns0:text x="622.2222" y="56" font-family="Arial,sans-serif" font-size="14.2222" font-weight="bold" fill="var(--bg)" text-anchor="middle">local-exec provisioner</ns0:text>
  <ns0:text x="506.6667" y="84.4444" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-dark)">Runs on the Terraform machine</ns0:text>
  <ns0:text x="506.6667" y="100.4444" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">(where you ran terraform apply)</ns0:text>
  <ns0:rect x="506.6667" y="110.2222" width="231.1111" height="40.8889" rx="4.4444" fill="var(--bg)" stroke="var(--warn-tint)" stroke-width="0.8889" />
  <ns0:text x="515.5556" y="126.2222" font-family="monospace" font-size="10" fill="var(--warn-mid)">provisioner "local-exec" {</ns0:text>
  <ns0:text x="515.5556" y="140.4444" font-family="monospace" font-size="10" fill="var(--text-muted)">  command = "echo ${self.id}"</ns0:text>
  <ns0:text x="622.2222" y="154.6667" font-family="monospace" font-size="10" fill="var(--warn-mid)">}</ns0:text>
  <ns0:rect x="773.3333" y="35.5556" width="346.6667" height="128.8889" rx="8.8889" fill="var(--warn-pale3)" filter="url(#shadow)" stroke="var(--warn-amber)" stroke-width="1.3333" />
  <ns0:text x="800" y="60.4444" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--warn-mid)">local-exec execution:</ns0:text>
  <ns0:rect x="791.1111" y="71.1111" width="106.6667" height="44.4444" rx="5.3333" fill="var(--bg)" stroke="var(--warn-amber)" stroke-width="0.8889" />
  <ns0:text x="844.4444" y="89.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-dark)" text-anchor="middle">Terraform</ns0:text>
  <ns0:text x="844.4444" y="105.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-dark)" text-anchor="middle">machine</ns0:text>
  <ns0:line x1="897.7778" y1="93.3333" x2="960" y2="93.3333" stroke="var(--warn-amber)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:text x="928.8889" y="85.3333" font-family="Arial,sans-serif" font-size="10" fill="var(--warn-mid)" text-anchor="middle">shell exec</ns0:text>
  <ns0:text x="928.8889" y="104" font-family="Arial,sans-serif" font-size="10" fill="var(--warn-mid)" text-anchor="middle">(local)</ns0:text>
  <ns0:rect x="960" y="71.1111" width="133.3333" height="44.4444" rx="5.3333" fill="var(--bg)" stroke="var(--warn-amber)" stroke-width="0.8889" />
  <ns0:text x="1026.6667" y="89.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-dark)" text-anchor="middle">Script / cmd</ns0:text>
  <ns0:text x="1026.6667" y="105.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-dark)" text-anchor="middle">runs locally</ns0:text>
  <ns0:text x="791.1111" y="144" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">Use: trigger Ansible, notify webhook,</ns0:text>
  <ns0:text x="791.1111" y="158.2222" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">write to inventory file, call CI API</ns0:text>
  <ns0:line x1="400" y1="115.5556" x2="488.8889" y2="195.5556" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:text x="435.5556" y="161.7778" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">when = "create"</ns0:text>
  <ns0:rect x="488.8889" y="195.5556" width="266.6667" height="142.2222" rx="8.8889" fill="var(--primary-pale)" filter="url(#shadow)" stroke="var(--primary-dk)" stroke-width="1.7778" />
  <ns0:rect x="488.8889" y="195.5556" width="266.6667" height="32" rx="8.8889" fill="url(#grad-primary)" />
  <ns0:rect x="488.8889" y="216.8889" width="266.6667" height="10.6667" fill="url(#grad-primary)" />
  <ns0:text x="622.2222" y="216" font-family="Arial,sans-serif" font-size="14.2222" font-weight="bold" fill="var(--bg)" text-anchor="middle">remote-exec provisioner</ns0:text>
  <ns0:text x="506.6667" y="247.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-dark)">SSHes into the new resource</ns0:text>
  <ns0:text x="506.6667" y="263.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">and runs commands on it</ns0:text>
  <ns0:rect x="506.6667" y="273.7778" width="231.1111" height="53.3333" rx="4.4444" fill="var(--bg)" stroke="var(--primary-tint)" stroke-width="0.8889" />
  <ns0:text x="515.5556" y="289.7778" font-family="monospace" font-size="10" fill="var(--primary-dk)">provisioner "remote-exec" {</ns0:text>
  <ns0:text x="515.5556" y="304" font-family="monospace" font-size="10" fill="var(--text-muted)">  inline = [</ns0:text>
  <ns0:text x="515.5556" y="318.2222" font-family="monospace" font-size="10" fill="var(--text-muted)">    "sudo apt-get update",</ns0:text>
  <ns0:text x="622.2222" y="332.4444" font-family="monospace" font-size="10" fill="var(--primary-dk)">] }</ns0:text>
  <ns0:rect x="773.3333" y="195.5556" width="346.6667" height="160" rx="8.8889" fill="var(--primary-pale)" filter="url(#shadow)" stroke="var(--primary-dk)" stroke-width="1.3333" />
  <ns0:text x="800" y="220.4444" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--primary-dk)">remote-exec execution:</ns0:text>
  <ns0:rect x="791.1111" y="231.1111" width="97.7778" height="44.4444" rx="5.3333" fill="var(--bg)" stroke="var(--primary-dk)" stroke-width="0.8889" />
  <ns0:text x="840" y="249.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-dark)" text-anchor="middle">Terraform</ns0:text>
  <ns0:text x="840" y="265.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-dark)" text-anchor="middle">machine</ns0:text>
  <ns0:line x1="888.8889" y1="253.3333" x2="942.2222" y2="253.3333" stroke="var(--primary-dk)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:text x="915.5556" y="245.3333" font-family="Arial,sans-serif" font-size="10" fill="var(--primary-dk)" text-anchor="middle">SSH / WinRM</ns0:text>
  <ns0:rect x="942.2222" y="231.1111" width="142.2222" height="44.4444" rx="5.3333" fill="var(--bg)" stroke="var(--primary-dk)" stroke-width="0.8889" />
  <ns0:text x="1013.3333" y="249.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-dark)" text-anchor="middle">Remote host</ns0:text>
  <ns0:text x="1013.3333" y="265.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-dark)" text-anchor="middle">(new resource)</ns0:text>
  <ns0:text x="791.1111" y="298.6667" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">Needs: connection block with</ns0:text>
  <ns0:text x="791.1111" y="314.6667" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">host, user, private_key</ns0:text>
  <ns0:text x="791.1111" y="332.4444" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">Use: bootstrap software, config management</ns0:text>
  <ns0:text x="791.1111" y="346.6667" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">before handing off to Ansible/Chef/Puppet</ns0:text>
  <ns0:line x1="400" y1="97.7778" x2="488.8889" y2="382.2222" stroke="var(--danger-dk)" stroke-width="1.7778" stroke-dasharray="5.3333 3.5556" marker-end="url(#arrow)" />
  <ns0:text x="449.7778" y="248.8889" font-family="Arial,sans-serif" font-size="10" fill="var(--danger-dk)">when = "destroy"</ns0:text>
  <ns0:rect x="488.8889" y="373.3333" width="266.6667" height="115.5556" rx="8.8889" fill="var(--danger-pale3)" filter="url(#shadow)" stroke="var(--danger-dk)" stroke-width="1.7778" />
  <ns0:rect x="488.8889" y="373.3333" width="266.6667" height="32" rx="8.8889" fill="var(--danger-dk)" />
  <ns0:rect x="488.8889" y="394.6667" width="266.6667" height="10.6667" fill="var(--danger-dk)" />
  <ns0:text x="622.2222" y="394.6667" font-family="Arial,sans-serif" font-size="14.2222" font-weight="bold" fill="var(--bg)" text-anchor="middle">destroy-time provisioner</ns0:text>
  <ns0:text x="506.6667" y="424.8889" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-dark)">Runs BEFORE the resource is</ns0:text>
  <ns0:text x="506.6667" y="440.8889" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-dark)">destroyed on terraform destroy</ns0:text>
  <ns0:rect x="506.6667" y="451.5556" width="231.1111" height="26.6667" rx="4.4444" fill="var(--bg)" stroke="var(--warn-tint)" stroke-width="0.8889" />
  <ns0:text x="515.5556" y="463.1111" font-family="monospace" font-size="10" fill="var(--danger-dk)">when = destroy   # in provisioner</ns0:text>
  <ns0:text x="515.5556" y="478.2222" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">Use: deregister from load balancer,</ns0:text>
  <ns0:text x="773.3333" y="394.6667" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--danger-dk)">destroy-time use cases:</ns0:text>
  <ns0:rect x="773.3333" y="403.5556" width="346.6667" height="97.7778" rx="7.1111" fill="var(--danger-pale3)" filter="url(#shadow)" stroke="var(--danger-dk)" stroke-width="1.3333" />
  <ns0:text x="791.1111" y="423.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-dark)">• Deregister from service discovery (Consul)</ns0:text>
  <ns0:text x="791.1111" y="439.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-dark)">• Remove from load balancer before delete</ns0:text>
  <ns0:text x="791.1111" y="455.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-dark)">• Drain connections gracefully</ns0:text>
  <ns0:text x="791.1111" y="471.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-dark)">• Backup data before instance termination</ns0:text>
  <ns0:text x="791.1111" y="487.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--danger-dk)">• Note: runs BEFORE resource is deleted</ns0:text>
  <ns0:rect x="26.6667" y="546.6667" width="1084.4444" height="71.1111" rx="7.1111" fill="var(--warn-pale)" filter="url(#shadow)" stroke="var(--warn-dk)" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="567.1111" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--warn-dk)" text-anchor="middle">Provisioners are a last resort — prefer user_data (cloud-init), Packer images, or configuration management tools</ns0:text>
  <ns0:text x="568.8889" y="586.6667" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text-muted)" text-anchor="middle">Provisioner failures mark the resource as tainted — next apply will destroy and recreate it</ns0:text>
  <ns0:text x="568.8889" y="604.4444" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text-muted)" text-anchor="middle">Use on_failure = continue to ignore errors, or on_failure = fail (default) to halt</ns0:text>
</ns0:svg>
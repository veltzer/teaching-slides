<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <text x="640" y="42.0779" font-size="28" font-weight="bold" fill="#222" text-anchor="middle">Terraform Variable Priority (Highest → Lowest)</text>
  <text x="20" y="98.1818" font-size="22" fill="#c00" text-anchor="start">▲ Highest priority (wins)</text>
  <rect x="60" y="116.8831" width="1160" height="84.1558" fill="#c62828" stroke="#333" stroke-width="3" rx="8" />
  <text x="100" y="172.987" font-size="26" font-weight="bold" fill="#fff" text-anchor="start">1. -var flag on command line</text>
  <rect x="60" y="205.7143" width="1160" height="84.1558" fill="#e53935" stroke="#333" stroke-width="3" rx="8" />
  <text x="100" y="261.8182" font-size="26" font-weight="bold" fill="#fff" text-anchor="start">2. -var-file flag on command line</text>
  <rect x="60" y="294.5455" width="1160" height="84.1558" fill="#ef5350" stroke="#333" stroke-width="3" rx="8" />
  <text x="100" y="350.6494" font-size="26" font-weight="bold" fill="#fff" text-anchor="start">3. *.auto.tfvars files (alphabetical)</text>
  <rect x="60" y="383.3766" width="1160" height="84.1558" fill="#e57373" stroke="#333" stroke-width="3" rx="8" />
  <text x="100" y="439.4805" font-size="26" font-weight="bold" fill="#222" text-anchor="start">4. terraform.tfvars</text>
  <rect x="60" y="472.2078" width="1160" height="84.1558" fill="#ef9a9a" stroke="#333" stroke-width="3" rx="8" />
  <text x="100" y="528.3117" font-size="26" font-weight="bold" fill="#222" text-anchor="start">5. TF_VAR_ environment variables</text>
  <rect x="60" y="561.039" width="1160" height="84.1558" fill="#ffcdd2" stroke="#333" stroke-width="3" rx="8" />
  <text x="100" y="617.1429" font-size="26" font-weight="bold" fill="#222" text-anchor="start">6. Variable defaults in configuration</text>
  <text x="20" y="677.9221" font-size="22" fill="#666" text-anchor="start">▼ Lowest priority</text>

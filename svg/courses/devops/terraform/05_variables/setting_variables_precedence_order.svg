<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="40" y="40" font-size="18.450885562884" fill="var(--danger-accent)" text-anchor="start" font-family="Arial, sans-serif">Highest priority (wins)</text>
  <rect x="80" y="56.81173779141" width="1160" height="81.9564718691" fill="var(--danger-accent)" stroke="var(--danger-border)" stroke-width="1.7778" rx="7.077213281182"/>
  <text x="120" y="108.297212970605" font-size="22.551068917041" font-weight="bold" fill="var(--bg)" text-anchor="start" font-family="Arial, sans-serif">1. -var flag on command line</text>
  <rect x="80" y="147.173948664929" width="1160" height="81.9564718691" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="7.077213281182" filter="url(#shadow)"/>
  <text x="120" y="198.659553191931" font-size="22.551068917041" font-weight="bold" fill="var(--bg)" text-anchor="start" font-family="Arial, sans-serif">2. -var-file flag on command line</text>
  <rect x="80" y="237.536420407975" width="1160" height="81.9564718691" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="7.077213281182" filter="url(#shadow)"/>
  <text x="120" y="289.02176406545" font-size="22.551068917041" font-weight="bold" fill="var(--bg)" text-anchor="start" font-family="Arial, sans-serif">3. *.auto.tfvars files (alphabetical)</text>
  <rect x="80" y="327.898630194538" width="1160" height="81.9564718691" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="7.077213281182" filter="url(#shadow)"/>
  <text x="120" y="379.384235808497" font-size="22.551068917041" font-weight="bold" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">4. terraform.tfvars</text>
  <rect x="80" y="418.260841068057" width="1160" height="81.9564718691" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.077213281182" filter="url(#shadow)"/>
  <text x="120" y="469.746445595059" font-size="22.551068917041" font-weight="bold" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">5. TF_VAR_ environment variables</text>
  <rect x="80" y="508.623312811104" width="1160" height="81.9564718691" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="7.077213281182" filter="url(#shadow)"/>
  <text x="120" y="560.108656468578" font-size="22.551068917041" font-weight="bold" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">6. Variable defaults in configuration</text>
  <text x="40" y="620" font-size="18.450885562884" fill="var(--text-muted)" text-anchor="start" font-family="Arial, sans-serif">Lowest priority</text>
</svg>

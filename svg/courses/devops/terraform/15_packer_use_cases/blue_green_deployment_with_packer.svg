  <ns0:text x="32" y="48" text-anchor="start" font-size="17.7778" fill="#222" font-weight="bold">Phase 1: Build new AMI</ns0:text>
  <ns0:text x="48.8889" y="74.6667" text-anchor="start" font-size="16" fill="#444">Packer build → AMI v2</ns0:text>
  <ns0:text x="32" y="106.6667" text-anchor="start" font-size="17.7778" fill="#222" font-weight="bold">Phase 2: Deploy alongside old</ns0:text>
  <ns0:text x="48.8889" y="133.3333" text-anchor="start" font-size="16" fill="#444">Terraform creates new ASG with AMI v2; old ASG (AMI v1) still running</ns0:text>
  <ns0:text x="32" y="165.3333" text-anchor="start" font-size="17.7778" fill="#222" font-weight="bold">Phase 3: Switch traffic</ns0:text>
  <ns0:text x="48.8889" y="192" text-anchor="start" font-size="16" fill="#444">Update ALB target group to new ASG</ns0:text>
  <ns0:text x="32" y="224" text-anchor="start" font-size="17.7778" fill="#222" font-weight="bold">Phase 4: Cleanup</ns0:text>
  <ns0:text x="48.8889" y="250.6667" text-anchor="start" font-size="16" fill="#444">Terminate old ASG</ns0:text>
  <ns0:text x="260.4444" y="337.7778" text-anchor="middle" font-size="17.7778" fill="#222" font-weight="bold">Before</ns0:text>

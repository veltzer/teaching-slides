  <ns0:text x="260.4444" y="407.1111" text-anchor="middle" font-size="17.7778" fill="#1565c0" font-weight="bold">ALB</ns0:text>
  <ns0:line x1="260.4444" y1="437.3333" x2="260.4444" y2="497.7778" stroke="#555" stroke-width="2.4" marker-end="url(#arrow)" />
  <ns0:rect x="130.6667" y="497.7778" width="259.5556" height="71.1111" fill="#fff8e1" stroke="#f57c00" stroke-width="2.4" rx="7.1111" filter="url(#shadow)" />
  <ns0:text x="260.4444" y="538.6667" text-anchor="middle" font-size="17.7778" fill="#e65100" font-weight="bold">ASG v1</ns0:text>
  <ns0:text x="747.5556" y="337.7778" text-anchor="middle" font-size="17.7778" fill="#222" font-weight="bold">After</ns0:text>

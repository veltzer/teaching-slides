<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <text x="40" y="40" text-anchor="start" font-size="22.351" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Phase 1: Build new AMI</text>
  <text x="63.974763" y="69.692877" text-anchor="start" font-size="20.115848" fill="var(--text)" font-family="Arial, sans-serif">Packer build → AMI v2</text>
  <text x="40" y="105.324281" text-anchor="start" font-size="22.351" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Phase 2: Deploy alongside old</text>
  <text x="63.974763" y="135.017035" text-anchor="start" font-size="20.115848" fill="var(--text)" font-family="Arial, sans-serif">Terraform creates new ASG with AMI v2; old ASG (AMI v1) still running</text>
  <text x="40" y="170.648439" text-anchor="start" font-size="22.351" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Phase 3: Switch traffic</text>
  <text x="63.974763" y="200.341316" text-anchor="start" font-size="20.115848" fill="var(--text)" font-family="Arial, sans-serif">Update ALB target group to new ASG</text>
  <text x="40" y="235.972719" text-anchor="start" font-size="22.351" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Phase 4: Cleanup</text>
  <text x="63.974763" y="265.665597" text-anchor="start" font-size="20.115848" fill="var(--text)" font-family="Arial, sans-serif">Terminate old ASG</text>
  <text x="364.290086" y="362.66214" text-anchor="middle" font-size="22.351" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Before</text>
  <rect x="180.063091" y="394.334526" width="368.454259" height="79.180842" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.715844" filter="url(#shadow)"/>
  <text x="364.290086" y="439.863474" text-anchor="middle" font-size="22.351" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">ALB</text>
  <line x1="364.290086" y1="473.515368" x2="364.290086" y2="540.819158" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="180.063091" y="540.819158" width="368.454259" height="79.180842" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.715844" filter="url(#shadow)"/>
  <text x="364.290086" y="586.348228" text-anchor="middle" font-size="22.351" fill="var(--warn-accent)" font-weight="bold" font-family="Arial, sans-serif">ASG v1</text>
  <text x="1055.772871" y="362.66214" text-anchor="middle" font-size="22.351" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">After</text>
  <rect x="871.545741" y="394.334526" width="368.454259" height="79.180842" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.715844" filter="url(#shadow)"/>
  <text x="1055.772871" y="439.863474" text-anchor="middle" font-size="22.351" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">ALB</text>
  <line x1="1055.772871" y1="473.515368" x2="1055.772871" y2="540.819158" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="871.545741" y="540.819158" width="368.454259" height="79.180842" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.715844" filter="url(#shadow)"/>
  <text x="1055.772871" y="586.348228" text-anchor="middle" font-size="22.351" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">ASG v2</text>
</svg>
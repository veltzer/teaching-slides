<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <text x="40" y="40" text-anchor="start" font-size="22.351" fill="var(--text)" font-weight="bold">Phase 1: Build new AMI</text>
  <text x="63.974763" y="69.692877" text-anchor="start" font-size="20.115848" fill="var(--text)">Packer build → AMI v2</text>
  <text x="40" y="105.324281" text-anchor="start" font-size="22.351" fill="var(--text)" font-weight="bold">Phase 2: Deploy alongside old</text>
  <text x="63.974763" y="135.017035" text-anchor="start" font-size="20.115848" fill="var(--text)">Terraform creates new ASG with AMI v2; old ASG (AMI v1) still running</text>
  <text x="40" y="170.648439" text-anchor="start" font-size="22.351" fill="var(--text)" font-weight="bold">Phase 3: Switch traffic</text>
  <text x="63.974763" y="200.341316" text-anchor="start" font-size="20.115848" fill="var(--text)">Update ALB target group to new ASG</text>
  <text x="40" y="235.972719" text-anchor="start" font-size="22.351" fill="var(--text)" font-weight="bold">Phase 4: Cleanup</text>
  <text x="63.974763" y="265.665597" text-anchor="start" font-size="20.115848" fill="var(--text)">Terminate old ASG</text>
  <text x="364.290086" y="362.66214" text-anchor="middle" font-size="22.351" fill="var(--text)" font-weight="bold">Before</text>
  <rect x="180.063091" y="394.334526" width="368.454259" height="79.180842" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="7.715844" filter="url(#shadow)" />
  <text x="364.290086" y="439.863474" text-anchor="middle" font-size="22.351" fill="var(--primary-accent)" font-weight="bold">ALB</text>
  <line x1="364.290086" y1="473.515368" x2="364.290086" y2="540.819158" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="180.063091" y="540.819158" width="368.454259" height="79.180842" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="7.715844" filter="url(#shadow)" />
  <text x="364.290086" y="586.348228" text-anchor="middle" font-size="22.351" fill="var(--warn-accent)" font-weight="bold">ASG v1</text>
  <text x="1055.772871" y="362.66214" text-anchor="middle" font-size="22.351" fill="var(--text)" font-weight="bold">After</text>
  <rect x="871.545741" y="394.334526" width="368.454259" height="79.180842" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="7.715844" filter="url(#shadow)" />
  <text x="1055.772871" y="439.863474" text-anchor="middle" font-size="22.351" fill="var(--primary-accent)" font-weight="bold">ALB</text>
  <line x1="1055.772871" y1="473.515368" x2="1055.772871" y2="540.819158" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="871.545741" y="540.819158" width="368.454259" height="79.180842" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.715844" filter="url(#shadow)" />
  <text x="1055.772871" y="586.348228" text-anchor="middle" font-size="22.351" fill="var(--ok-accent)" font-weight="bold">ASG v2</text>
</svg>
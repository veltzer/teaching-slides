<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <text x="266.865672" y="40" text-anchor="middle" font-size="19.915943" fill="var(--text)" font-weight="bold">Mutable</text>
  <rect x="57.910448" y="61.924249" width="417.910448" height="300.962124" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6.875232" filter="url(#shadow)" />
  <text x="266.865672" y="119.725037" text-anchor="middle" font-size="17.924303" fill="var(--text)" font-weight="bold">Server</text>
  <text x="266.865672" y="167.560133" text-anchor="middle" font-size="17.924303" fill="var(--text)">v1 → v1.1 → v1.2</text>
  <text x="266.865672" y="215.395105" text-anchor="middle" font-size="17.924303" fill="var(--text)">← SSH in, modify</text>
  <text x="266.865672" y="263.230201" text-anchor="middle" font-size="17.924303" fill="var(--text)">   in place</text>
  <text x="948.457605" y="40" text-anchor="middle" font-size="19.915943" fill="var(--text)" font-weight="bold">Immutable</text>
  <rect x="712.636816" y="61.924249" width="417.910448" height="127.560133" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6.875232" filter="url(#shadow)" />
  <text x="921.591934" y="119.725037" text-anchor="middle" font-size="17.924303" fill="var(--text)" font-weight="bold">Server v1</text>
  <text x="921.591934" y="157.594441" text-anchor="middle" font-size="17.924303" fill="var(--text)">← Replace entirely</text>
  <rect x="712.636816" y="229.347024" width="417.910448" height="127.560133" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6.875232" filter="url(#shadow)" />
  <text x="921.591934" y="287.147688" text-anchor="middle" font-size="17.924303" fill="var(--text)" font-weight="bold">Server v2</text>
  <text x="921.591934" y="325.017092" text-anchor="middle" font-size="17.924303" fill="var(--text)">← New image</text>
  <rect x="40" y="424.673512" width="1200" height="195.326488" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.875232" />
  <text x="640" y="482.4743" text-anchor="middle" font-size="19.915943" fill="var(--text)" font-weight="bold">Packer enables immutable infrastructure:</text>
  <text x="640" y="542.268077" text-anchor="middle" font-size="17.924303" fill="var(--text)">New code → New image → New servers → Old servers removed</text>
</svg>
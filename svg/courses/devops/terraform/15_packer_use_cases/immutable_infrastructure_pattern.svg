  <text x="640" y="49.5" text-anchor="middle" font-size="25.6" fill="#222222" font-weight="bold">Mutable vs Immutable Infrastructure</text>
  <text x="265.1429" y="108" text-anchor="middle" font-size="23.7714" fill="#222222" font-weight="bold">Mutable</text>
  <rect x="54.8571" y="130.5" width="420.5714" height="292.5" fill="#fff3e0" stroke="#333333" stroke-width="2.7429" rx="7.3143" />
  <text x="265.1429" y="186.75" text-anchor="middle" font-size="21.9429" fill="#222222" font-weight="bold">Server</text>
  <text x="265.1429" y="236.25" text-anchor="middle" font-size="21.9429" fill="#222222">v1 → v1.1 → v1.2</text>
  <text x="265.1429" y="285.75" text-anchor="middle" font-size="21.9429" fill="#222222">← SSH in, modify</text>
  <text x="265.1429" y="335.25" text-anchor="middle" font-size="21.9429" fill="#222222">   in place</text>
  <text x="950.8571" y="108" text-anchor="middle" font-size="23.7714" fill="#222222" font-weight="bold">Immutable</text>
  <rect x="713.1429" y="130.5" width="420.5714" height="123.75" fill="#e8f5e9" stroke="#333333" stroke-width="2.7429" rx="7.3143" />
  <text x="923.4286" y="189" text-anchor="middle" font-size="21.9429" fill="#222222" font-weight="bold">Server v1</text>
  <text x="923.4286" y="225" text-anchor="middle" font-size="21.9429" fill="#222222">← Replace entirely</text>
  <rect x="713.1429" y="299.25" width="420.5714" height="123.75" fill="#e8f5e9" stroke="#333333" stroke-width="2.7429" rx="7.3143" />
  <text x="923.4286" y="355.5" text-anchor="middle" font-size="21.9429" fill="#222222" font-weight="bold">Server v2</text>
  <text x="923.4286" y="391.5" text-anchor="middle" font-size="21.9429" fill="#222222">← New image</text>
  <rect x="36.5714" y="483.75" width="1206.8571" height="180" fill="#f5f5f5" stroke="#333333" stroke-width="2.7429" rx="7.3143" />
  <text x="640" y="533.25" text-anchor="middle" font-size="23.7714" fill="#222222" font-weight="bold">Packer enables immutable infrastructure:</text>
  <text x="640" y="578.25" text-anchor="middle" font-size="21.9429" fill="#222222">New code  →  New image  →  New servers  →  Old servers removed</text>

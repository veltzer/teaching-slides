<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="266.865672" y="40" text-anchor="middle" font-size="19.915943" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Mutable</text>
  <rect x="57.910448" y="61.924249" width="417.910448" height="300.962124" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.875232" filter="url(#shadow)"/>
  <text x="266.865672" y="119.725037" text-anchor="middle" font-size="17.924303" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Server</text>
  <text x="266.865672" y="167.560133" text-anchor="middle" font-size="17.924303" fill="var(--text)" font-family="Arial, sans-serif">v1 → v1.1 → v1.2</text>
  <text x="266.865672" y="215.395105" text-anchor="middle" font-size="17.924303" fill="var(--text)" font-family="Arial, sans-serif">← SSH in, modify</text>
  <text x="266.865672" y="263.230201" text-anchor="middle" font-size="17.924303" fill="var(--text)" font-family="Arial, sans-serif">   in place</text>
  <text x="948.457605" y="40" text-anchor="middle" font-size="19.915943" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Immutable</text>
  <rect x="712.636816" y="61.924249" width="417.910448" height="127.560133" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.875232" filter="url(#shadow)"/>
  <text x="921.591934" y="119.725037" text-anchor="middle" font-size="17.924303" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Server v1</text>
  <text x="921.591934" y="157.594441" text-anchor="middle" font-size="17.924303" fill="var(--text)" font-family="Arial, sans-serif">← Replace entirely</text>
  <rect x="712.636816" y="229.347024" width="417.910448" height="127.560133" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.875232" filter="url(#shadow)"/>
  <text x="921.591934" y="287.147688" text-anchor="middle" font-size="17.924303" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Server v2</text>
  <text x="921.591934" y="325.017092" text-anchor="middle" font-size="17.924303" fill="var(--text)" font-family="Arial, sans-serif">← New image</text>
  <rect x="40" y="424.673512" width="1200" height="195.326488" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.875232"/>
  <text x="640" y="482.4743" text-anchor="middle" font-size="19.915943" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Packer enables immutable infrastructure:</text>
  <text x="640" y="542.268077" text-anchor="middle" font-size="17.924303" fill="var(--text)" font-family="Arial, sans-serif">New code → New image → New servers → Old servers removed</text>
</svg>

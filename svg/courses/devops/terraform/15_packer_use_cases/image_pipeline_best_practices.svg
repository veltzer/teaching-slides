<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="380.226171" y="40" width="519.547554" height="115.999949" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.856851" filter="url(#shadow)"/>
  <text x="640" y="113.263153" text-anchor="middle" font-size="21.848899" fill="var(--warn-accent)" font-weight="bold" font-family="Arial, sans-serif">Source Image (Ubuntu base)</text>
  <line x1="640" y1="156.000076" x2="640" y2="247.579017" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="279.418417" y="247.579017" width="721.163166" height="115.999949" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.856851" filter="url(#shadow)"/>
  <text x="640" y="320.842169" text-anchor="middle" font-size="19.862698" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">Base Image (security hardening, monitoring agents)</text>
  <line x1="640" y1="363.578966" x2="640" y2="410.386036" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="179.579968" y1="410.386036" x2="1100.420032" y2="410.386036" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="179.579968" y1="410.386036" x2="179.579968" y2="467.368474" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="640" y1="410.386036" x2="640" y2="467.368474" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1100.420032" y1="410.386036" x2="1100.420032" y2="467.368474" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="467.368474" width="280.129241" height="152.631526" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.856851" filter="url(#shadow)"/>
  <text x="179.579968" y="536.561353" text-anchor="middle" font-size="19.862698" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">Web Server</text>
  <text x="179.579968" y="589.473644" text-anchor="middle" font-size="19.862698" fill="var(--ok-accent)" font-family="Arial, sans-serif">Image</text>
  <rect x="499.450727" y="467.368474" width="280.129241" height="152.631526" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.856851" filter="url(#shadow)"/>
  <text x="640" y="536.561353" text-anchor="middle" font-size="19.862698" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">API Server</text>
  <text x="640" y="589.473644" text-anchor="middle" font-size="19.862698" fill="var(--ok-accent)" font-family="Arial, sans-serif">Image</text>
  <rect x="959.870759" y="467.368474" width="280.129241" height="152.631526" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.856851" filter="url(#shadow)"/>
  <text x="1100.420032" y="536.561353" text-anchor="middle" font-size="19.862698" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">Worker</text>
  <text x="1100.420032" y="589.473644" text-anchor="middle" font-size="19.862698" fill="var(--ok-accent)" font-family="Arial, sans-serif">Image</text>
</svg>
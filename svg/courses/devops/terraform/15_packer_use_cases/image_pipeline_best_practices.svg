<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Source Image -->
  <rect x="372" y="60" width="536" height="114" fill="#fff8e1" stroke="#f57c00" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <text x="640" y="132" text-anchor="middle" font-size="22" fill="#e65100" font-weight="bold">Source Image (Ubuntu base)</text>
  <line x1="640" y1="174" x2="640" y2="264" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>
  <!-- Base Image -->
  <rect x="268" y="264" width="744" height="114" fill="#e3f2fd" stroke="#1e88e5" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <text x="640" y="336" text-anchor="middle" font-size="20" fill="#1565c0" font-weight="bold">Base Image (security hardening, monitoring agents)</text>
  <!-- Branch lines -->
  <line x1="640" y1="378" x2="640" y2="424" stroke="#555" stroke-width="3"/>
  <line x1="165" y1="424" x2="1115" y2="424" stroke="#555" stroke-width="3"/>
  <line x1="165" y1="424" x2="165" y2="480" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="640" y1="424" x2="640" y2="480" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1115" y1="424" x2="1115" y2="480" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>
  <!-- Web Server Image -->
  <rect x="21" y="480" width="289" height="150" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <text x="165" y="548" text-anchor="middle" font-size="20" fill="#2e7d32" font-weight="bold">Web Server</text>
  <text x="165" y="600" text-anchor="middle" font-size="20" fill="#2e7d32">Image</text>
  <!-- API Server Image -->
  <rect x="495" y="480" width="289" height="150" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <text x="640" y="548" text-anchor="middle" font-size="20" fill="#2e7d32" font-weight="bold">API Server</text>
  <text x="640" y="600" text-anchor="middle" font-size="20" fill="#2e7d32">Image</text>
  <!-- Worker Image -->
  <rect x="970" y="480" width="289" height="150" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <text x="1115" y="548" text-anchor="middle" font-size="20" fill="#2e7d32" font-weight="bold">Worker</text>
  <text x="1115" y="600" text-anchor="middle" font-size="20" fill="#2e7d32">Image</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- AWS AMIs -->
  <rect x="24" y="32" width="579" height="280" fill="#e3f2fd" stroke="#1e88e5" stroke-width="3.6" rx="10" filter="url(#shadow)"/>
  <text x="314" y="142" text-anchor="middle" font-size="26" fill="#1565c0" font-weight="bold">AWS AMIs</text>
  <text x="314" y="200" text-anchor="middle" font-size="22" fill="#333">Production server images</text>
  <!-- Container Images -->
  <rect x="676" y="32" width="579" height="280" fill="#e3f2fd" stroke="#1e88e5" stroke-width="3.6" rx="10" filter="url(#shadow)"/>
  <text x="966" y="142" text-anchor="middle" font-size="26" fill="#1565c0" font-weight="bold">Container Images</text>
  <text x="966" y="200" text-anchor="middle" font-size="22" fill="#333">Docker, ECR, ACR</text>
  <!-- VirtualBox/VMware -->
  <rect x="24" y="408" width="579" height="280" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3.6" rx="10" filter="url(#shadow)"/>
  <text x="314" y="518" text-anchor="middle" font-size="26" fill="#2e7d32" font-weight="bold">VirtualBox/VMware</text>
  <text x="314" y="576" text-anchor="middle" font-size="22" fill="#333">Development VMs, Vagrant</text>
  <!-- Multi-Cloud -->
  <rect x="676" y="408" width="579" height="280" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3.6" rx="10" filter="url(#shadow)"/>
  <text x="966" y="518" text-anchor="middle" font-size="26" fill="#2e7d32" font-weight="bold">Multi-Cloud</text>
  <text x="966" y="576" text-anchor="middle" font-size="22" fill="#333">AWS + Azure + GCP images</text>
</svg>

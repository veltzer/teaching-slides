    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="var(--bg)" />
  <ns0:text x="160" y="23.1111" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Subjects</ns0:text>
  <ns0:rect x="35.5556" y="39.1111" width="248.8889" height="53.3333" rx="5.3333" fill="url(#grad-surface)" stroke="var(--primary-dk)" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="160" y="71.1111" text-anchor="middle" font-family="monospace" font-size="16" fill="var(--text)">User</ns0:text>
  <ns0:rect x="35.5556" y="104.8889" width="248.8889" height="53.3333" rx="5.3333" fill="url(#grad-surface)" stroke="var(--primary-dk)" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="160" y="136.8889" text-anchor="middle" font-family="monospace" font-size="16" fill="var(--text)">Group</ns0:text>
  <ns0:rect x="35.5556" y="170.6667" width="248.8889" height="53.3333" rx="5.3333" fill="url(#grad-surface)" stroke="var(--primary-dk)" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="160" y="202.6667" text-anchor="middle" font-family="monospace" font-size="16" fill="var(--text)">ServiceAccount</ns0:text>
  <ns0:text x="497.7778" y="23.1111" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Binding</ns0:text>
  <ns0:line x1="286.2222" y1="65.7778" x2="371.5556" y2="97.7778" stroke="var(--primary-dk)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <ns0:line x1="286.2222" y1="131.5556" x2="371.5556" y2="112" stroke="var(--primary-dk)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <ns0:line x1="286.2222" y1="197.3333" x2="371.5556" y2="126.2222" stroke="var(--primary-dk)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <ns0:rect x="373.3333" y="71.1111" width="248.8889" height="71.1111" rx="5.3333" fill="url(#grad-primary)" filter="url(#shadow)" />
  <ns0:text x="497.7778" y="103.1111" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="var(--bg)">RoleBinding</ns0:text>
  <ns0:text x="497.7778" y="126.2222" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--primary-lt)">namespaced</ns0:text>
  <ns0:rect x="373.3333" y="177.7778" width="248.8889" height="71.1111" rx="5.3333" fill="url(#grad-surface)" stroke="var(--primary-dk)" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="497.7778" y="209.7778" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="var(--text)">ClusterRoleBinding</ns0:text>
  <ns0:text x="497.7778" y="231.1111" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">cluster-wide</ns0:text>
  <ns0:text x="817.7778" y="23.1111" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Role (defines permissions)</ns0:text>
  <ns0:line x1="624" y1="106.6667" x2="709.3333" y2="106.6667" stroke="var(--primary-dk)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <ns0:line x1="624" y1="213.3333" x2="709.3333" y2="266.6667" stroke="var(--primary-dk)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <ns0:rect x="711.1111" y="53.3333" width="391.1111" height="106.6667" rx="5.3333" fill="url(#grad-surface)" stroke="var(--primary-dk)" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="906.6667" y="81.7778" text-anchor="middle" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--text)">Role (namespace-scoped)</ns0:text>
  <ns0:text x="728.8889" y="103.1111" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">rules:</ns0:text>
  <ns0:text x="728.8889" y="120.8889" font-family="monospace" font-size="12.4444" fill="var(--primary-dk)">- resources: [pods, services]</ns0:text>
  <ns0:text x="728.8889" y="138.6667" font-family="monospace" font-size="12.4444" fill="var(--primary-dk)">  verbs: [get, list, watch]</ns0:text>
  <ns0:rect x="711.1111" y="213.3333" width="391.1111" height="106.6667" rx="5.3333" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="906.6667" y="241.7778" text-anchor="middle" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--text)">ClusterRole (cluster-wide)</ns0:text>
  <ns0:text x="728.8889" y="263.1111" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">rules:</ns0:text>
  <ns0:text x="728.8889" y="280.8889" font-family="monospace" font-size="12.4444" fill="var(--primary-dk)">- resources: [nodes, namespaces]</ns0:text>
  <ns0:text x="728.8889" y="298.6667" font-family="monospace" font-size="12.4444" fill="var(--primary-dk)">  verbs: [get, list]</ns0:text>
  <ns0:rect x="35.5556" y="346.6667" width="497.7778" height="195.5556" rx="5.3333" fill="var(--surface-dark)" stroke="var(--border)" stroke-width="1.3333" />
  <ns0:text x="284.4444" y="373.3333" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="var(--text)">Common Verbs</ns0:text>
  <ns0:text x="53.3333" y="398.2222" font-family="monospace" font-size="13.3333" fill="var(--primary-dk)">get list watch</ns0:text>
  <ns0:text x="213.3333" y="398.2222" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">— read only</ns0:text>
  <ns0:text x="53.3333" y="421.3333" font-family="monospace" font-size="13.3333" fill="var(--primary-dk)">create update patch delete</ns0:text>
  <ns0:text x="53.3333" y="442.6667" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">— write operations</ns0:text>
  <ns0:text x="53.3333" y="464" font-family="monospace" font-size="13.3333" fill="var(--primary-dk)">*</ns0:text>
  <ns0:text x="80" y="464" font-family="sans-serif" font-size="12.4444" fill="var(--danger-dk)">— all verbs (avoid!)</ns0:text>
  <ns0:text x="53.3333" y="494.2222" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Check: <ns0:tspan font-family="monospace">kubectl auth can-i get pods --as=user</ns0:tspan>
  </ns0:text>
  <ns0:text x="53.3333" y="513.7778" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Audit: <ns0:tspan font-family="monospace">kubectl get rolebindings -A</ns0:tspan>
  </ns0:text>
  <ns0:rect x="568.8889" y="346.6667" width="533.3333" height="195.5556" rx="5.3333" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="1.3333" />
  <ns0:text x="835.5556" y="373.3333" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="var(--primary-dk)">Least Privilege Example</ns0:text>
  <ns0:text x="586.6667" y="398.2222" font-family="monospace" font-size="12.4444" fill="var(--text)">apiVersion: rbac.authorization.k8s.io/v1</ns0:text>
  <ns0:text x="586.6667" y="417.7778" font-family="monospace" font-size="12.4444" fill="var(--text)">kind: Role</ns0:text>
  <ns0:text x="586.6667" y="437.3333" font-family="monospace" font-size="12.4444" fill="var(--text)">rules:</ns0:text>
  <ns0:text x="586.6667" y="456.8889" font-family="monospace" font-size="12.4444" fill="var(--primary-dk)">- apiGroups: [""]</ns0:text>
  <ns0:text x="586.6667" y="474.6667" font-family="monospace" font-size="12.4444" fill="var(--primary-dk)">  resources: ["pods"]</ns0:text>
  <ns0:text x="586.6667" y="492.4444" font-family="monospace" font-size="12.4444" fill="var(--primary-dk)">  verbs: ["get", "list"]</ns0:text>
  <ns0:text x="586.6667" y="513.7778" font-family="sans-serif" font-size="11.5556" fill="var(--text-disabled)">read pods only — no write, no secrets</ns0:text>
  <ns0:rect x="35.5556" y="558.2222" width="1066.6667" height="37.3333" rx="5.3333" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="581.3333" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--primary-dk)">Start with no permissions, add only what each service account actually needs — audit regularly</ns0:text>
</ns0:svg>
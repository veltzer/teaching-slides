<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1087.5767" height="474.8286" fill="var(--bg)" rx="5.7089" x="152.4233" y="145.1714"/>
  <text x="305.3636" y="162.3179" text-anchor="middle" font-family="sans-serif" font-size="13.4741" font-weight="bold" fill="var(--text)">Subjects</text>
  <rect x="186.41" y="174.1886" width="237.9075" height="39.569" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="305.3636" y="197.9301" text-anchor="middle" font-family="monospace" font-size="13.4741" fill="var(--text)">User</text>
  <rect x="186.41" y="222.9905" width="237.9075" height="39.569" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="305.3636" y="246.732" text-anchor="middle" font-family="monospace" font-size="13.4741" fill="var(--text)">Group</text>
  <rect x="186.41" y="271.7924" width="237.9075" height="39.569" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="305.3636" y="295.5338" text-anchor="middle" font-family="monospace" font-size="13.4741" fill="var(--text)">ServiceAccount</text>
  <text x="628.2381" y="162.3179" text-anchor="middle" font-family="sans-serif" font-size="13.4741" font-weight="bold" fill="var(--text)">Binding</text>
  <line x1="426.0168" y1="193.9732" x2="507.5849" y2="217.7146" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <line x1="426.0168" y1="242.7751" x2="507.5849" y2="228.2664" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <line x1="426.0168" y1="291.5768" x2="507.5849" y2="238.8181" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="509.2844" y="197.9301" width="237.9075" height="52.7587" rx="5.7089" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="628.2381" y="221.6715" text-anchor="middle" font-family="monospace" font-size="13.4741" font-weight="bold" fill="var(--bg)">RoleBinding</text>
  <text x="628.2381" y="238.8181" text-anchor="middle" font-family="sans-serif" font-size="10.4797" fill="var(--primary-accent)">namespaced</text>
  <rect x="509.2844" y="277.0682" width="237.9075" height="52.7587" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="628.2381" y="300.8096" text-anchor="middle" font-family="monospace" font-size="13.4741" font-weight="bold" fill="var(--text)">ClusterRoleBinding</text>
  <text x="628.2381" y="316.6372" text-anchor="middle" font-family="sans-serif" font-size="10.4797" fill="var(--text-muted)">cluster-wide</text>
  <text x="934.119" y="162.3179" text-anchor="middle" font-family="sans-serif" font-size="13.4741" font-weight="bold" fill="var(--text)">Role (defines permissions)</text>
  <line x1="748.8911" y1="224.3095" x2="830.4594" y2="224.3095" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <line x1="748.8911" y1="303.4475" x2="830.4594" y2="343.0167" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="832.1587" y="184.7404" width="373.8545" height="79.1381" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1019.086" y="205.8439" text-anchor="middle" font-family="monospace" font-size="11.9769" font-weight="bold" fill="var(--text)">Role (namespace-scoped)</text>
  <text x="849.1521" y="221.6715" font-family="monospace" font-size="10.4797" fill="var(--text-muted)">rules:</text>
  <text x="849.1521" y="234.8613" font-family="monospace" font-size="10.4797" fill="var(--primary-accent)">- resources: [pods, services]</text>
  <text x="849.1521" y="248.0509" font-family="monospace" font-size="10.4797" fill="var(--primary-accent)">  verbs: [get, list, watch]</text>
  <rect x="832.1587" y="303.4475" width="373.8545" height="79.1381" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1019.086" y="324.5511" text-anchor="middle" font-family="monospace" font-size="11.9769" font-weight="bold" fill="var(--text)">ClusterRole (cluster-wide)</text>
  <text x="849.1521" y="340.3786" font-family="monospace" font-size="10.4797" fill="var(--text-muted)">rules:</text>
  <text x="849.1521" y="353.5684" font-family="monospace" font-size="10.4797" fill="var(--primary-accent)">- resources: [nodes, namespaces]</text>
  <text x="849.1521" y="366.7581" font-family="monospace" font-size="10.4797" fill="var(--primary-accent)">  verbs: [get, list]</text>
  <rect x="186.41" y="402.3702" width="475.8148" height="145.0866" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="424.3173" y="422.1547" text-anchor="middle" font-family="sans-serif" font-size="11.9769" font-weight="bold" fill="var(--text)">Common Verbs</text>
  <text x="203.4034" y="440.6203" font-family="monospace" font-size="11.2285" fill="var(--primary-accent)">get list watch</text>
  <text x="356.3438" y="440.6203" font-family="sans-serif" font-size="10.4797" fill="var(--text-muted)">— read only</text>
  <text x="203.4034" y="457.7668" font-family="monospace" font-size="11.2285" fill="var(--primary-accent)">create update patch delete</text>
  <text x="203.4034" y="473.5945" font-family="sans-serif" font-size="10.4797" fill="var(--text-muted)">— write operations</text>
  <text x="203.4034" y="489.4221" font-family="monospace" font-size="11.2285" fill="var(--primary-accent)">*</text>
  <text x="228.8935" y="489.4221" font-family="sans-serif" font-size="10.4797" fill="var(--danger-accent)">— all verbs (avoid!)</text>
  <text x="203.4034" y="511.8446" font-family="sans-serif" font-size="10.4797" fill="var(--text-muted)">Check: <tspan font-family="monospace">kubectl auth can-i get pods --as=user</tspan>
  </text>
  <text x="203.4034" y="526.3532" font-family="sans-serif" font-size="10.4797" fill="var(--text-muted)">Audit: <tspan font-family="monospace">kubectl get rolebindings -A</tspan>
  </text>
  <rect x="696.2116" y="402.3702" width="509.8016" height="145.0866" rx="5.7089" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="951.1125" y="422.1547" text-anchor="middle" font-family="sans-serif" font-size="11.9769" font-weight="bold" fill="var(--primary-accent)">Least Privilege Example</text>
  <text x="713.205" y="440.6203" font-family="monospace" font-size="10.4797" fill="var(--text)">apiVersion: rbac.authorization.k8s.io/v1</text>
  <text x="713.205" y="455.1289" font-family="monospace" font-size="10.4797" fill="var(--text)">kind: Role</text>
  <text x="713.205" y="469.6376" font-family="monospace" font-size="10.4797" fill="var(--text)">rules:</text>
  <text x="713.205" y="484.1463" font-family="monospace" font-size="10.4797" fill="var(--primary-accent)">- apiGroups: [""]</text>
  <text x="713.205" y="497.336" font-family="monospace" font-size="10.4797" fill="var(--primary-accent)">  resources: ["pods"]</text>
  <text x="713.205" y="510.5256" font-family="monospace" font-size="10.4797" fill="var(--primary-accent)">  verbs: ["get", "list"]</text>
  <text x="713.205" y="526.3532" font-family="sans-serif" font-size="10" fill="var(--text-faint)">read pods only — no write, no secrets</text>
  <rect x="186.41" y="559.3275" width="1019.6032" height="27.6983" rx="5.7089" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="696.2116" y="576.474" text-anchor="middle" font-family="sans-serif" font-size="11.9769" fill="var(--primary-accent)">Start with no permissions, add only what each service account actually needs — audit regularly</text>
</svg>
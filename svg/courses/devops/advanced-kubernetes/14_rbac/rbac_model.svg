<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6.6276" x="40" y="40"/>
  <text x="208.7498" y="60.9443" text-anchor="middle" font-family="sans-serif" font-size="15.6425" font-weight="bold" fill="var(--text)">Subjects</text>
  <rect x="77.4999" y="75.4443" width="262.5001" height="48.3333" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="208.7498" y="104.4444" text-anchor="middle" font-family="monospace" font-size="15.6425" fill="var(--text)">User</text>
  <rect x="77.4999" y="135.0555" width="262.5001" height="48.3333" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="208.7498" y="164.0556" text-anchor="middle" font-family="monospace" font-size="15.6425" fill="var(--text)">Group</text>
  <rect x="77.4999" y="194.6667" width="262.5001" height="48.3333" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="208.7498" y="223.6667" text-anchor="middle" font-family="monospace" font-size="15.6425" fill="var(--text)">ServiceAccount</text>
  <text x="565" y="60.9443" text-anchor="middle" font-family="sans-serif" font-size="15.6425" font-weight="bold" fill="var(--text)">Binding</text>
  <line x1="341.875" y1="99.6111" x2="431.8748" y2="128.611" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <line x1="341.875" y1="159.2223" x2="431.8748" y2="141.5" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <line x1="341.875" y1="218.8332" x2="431.8748" y2="154.3888" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="433.75" y="104.4444" width="262.5001" height="64.4444" rx="6.6276" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="565" y="133.4444" text-anchor="middle" font-family="monospace" font-size="15.6425" font-weight="bold" fill="var(--bg)">RoleBinding</text>
  <text x="565" y="154.3888" text-anchor="middle" font-family="sans-serif" font-size="12.1662" fill="var(--primary-accent)">namespaced</text>
  <rect x="433.75" y="201.1111" width="262.5001" height="64.4444" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="565" y="230.111" text-anchor="middle" font-family="monospace" font-size="15.6425" font-weight="bold" fill="var(--text)">ClusterRoleBinding</text>
  <text x="565" y="249.4443" text-anchor="middle" font-family="sans-serif" font-size="12.1662" fill="var(--text-muted)">cluster-wide</text>
  <text x="902.4999" y="60.9443" text-anchor="middle" font-family="sans-serif" font-size="15.6425" font-weight="bold" fill="var(--text)">Role (defines permissions)</text>
  <line x1="698.1249" y1="136.6667" x2="788.125" y2="136.6667" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <line x1="698.1249" y1="233.3332" x2="788.125" y2="281.6667" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="790" y="88.3333" width="412.5" height="96.6667" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="996.25" y="114.1111" text-anchor="middle" font-family="monospace" font-size="13.9043" font-weight="bold" fill="var(--text)">Role (namespace-scoped)</text>
  <text x="808.75" y="133.4444" font-family="monospace" font-size="12.1662" fill="var(--text-muted)">rules:</text>
  <text x="808.75" y="149.5556" font-family="monospace" font-size="12.1662" fill="var(--primary-accent)">- resources: [pods, services]</text>
  <text x="808.75" y="165.6666" font-family="monospace" font-size="12.1662" fill="var(--primary-accent)">  verbs: [get, list, watch]</text>
  <rect x="790" y="233.3332" width="412.5" height="96.6667" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="996.25" y="259.1111" text-anchor="middle" font-family="monospace" font-size="13.9043" font-weight="bold" fill="var(--text)">ClusterRole (cluster-wide)</text>
  <text x="808.75" y="278.4443" font-family="monospace" font-size="12.1662" fill="var(--text-muted)">rules:</text>
  <text x="808.75" y="294.5556" font-family="monospace" font-size="12.1662" fill="var(--primary-accent)">- resources: [nodes, namespaces]</text>
  <text x="808.75" y="310.6667" font-family="monospace" font-size="12.1662" fill="var(--primary-accent)">  verbs: [get, list]</text>
  <rect x="77.4999" y="354.1666" width="525" height="177.2223" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="339.9998" y="378.3333" text-anchor="middle" font-family="sans-serif" font-size="13.9043" font-weight="bold" fill="var(--text)">Common Verbs</text>
  <text x="96.2499" y="400.8889" font-family="monospace" font-size="13.0355" fill="var(--primary-accent)">get list watch</text>
  <text x="264.9999" y="400.8889" font-family="sans-serif" font-size="12.1662" fill="var(--text-muted)">— read only</text>
  <text x="96.2499" y="421.8332" font-family="monospace" font-size="13.0355" fill="var(--primary-accent)">create update patch delete</text>
  <text x="96.2499" y="441.1666" font-family="sans-serif" font-size="12.1662" fill="var(--text-muted)">— write operations</text>
  <text x="96.2499" y="460.5" font-family="monospace" font-size="13.0355" fill="var(--primary-accent)">*</text>
  <text x="124.375" y="460.5" font-family="sans-serif" font-size="12.1662" fill="var(--danger-accent)">— all verbs (avoid!)</text>
  <text x="96.2499" y="487.8889" font-family="sans-serif" font-size="12.1662" fill="var(--text-muted)">Check: <tspan font-family="monospace">kubectl auth can-i get pods --as=user</tspan>
  </text>
  <text x="96.2499" y="505.6111" font-family="sans-serif" font-size="12.1662" fill="var(--text-muted)">Audit: <tspan font-family="monospace">kubectl get rolebindings -A</tspan>
  </text>
  <rect x="639.9999" y="354.1666" width="562.5" height="177.2223" rx="6.6276" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="921.2501" y="378.3333" text-anchor="middle" font-family="sans-serif" font-size="13.9043" font-weight="bold" fill="var(--primary-accent)">Least Privilege Example</text>
  <text x="658.75" y="400.8889" font-family="monospace" font-size="12.1662" fill="var(--text)">apiVersion: rbac.authorization.k8s.io/v1</text>
  <text x="658.75" y="418.611" font-family="monospace" font-size="12.1662" fill="var(--text)">kind: Role</text>
  <text x="658.75" y="436.3333" font-family="monospace" font-size="12.1662" fill="var(--text)">rules:</text>
  <text x="658.75" y="454.0556" font-family="monospace" font-size="12.1662" fill="var(--primary-accent)">- apiGroups: [""]</text>
  <text x="658.75" y="470.1667" font-family="monospace" font-size="12.1662" fill="var(--primary-accent)">  resources: ["pods"]</text>
  <text x="658.75" y="486.2777" font-family="monospace" font-size="12.1662" fill="var(--primary-accent)">  verbs: ["get", "list"]</text>
  <text x="658.75" y="505.6111" font-family="sans-serif" font-size="11.6093" fill="var(--text-faint)">read pods only — no write, no secrets</text>
  <rect x="77.4999" y="545.8889" width="1125" height="33.8333" rx="6.6276" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="639.9999" y="566.8333" text-anchor="middle" font-family="sans-serif" font-size="13.9043" fill="var(--primary-accent)">Start with no permissions, add only what each service account actually needs — audit regularly</text>
</svg>
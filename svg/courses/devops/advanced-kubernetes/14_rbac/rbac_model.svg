<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <text x="160" y="23.1111" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Subjects</text>
  <rect x="35.5556" y="39.1111" width="248.8889" height="53.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="160" y="71.1111" text-anchor="middle" font-family="monospace" font-size="16" fill="var(--text)">User</text>
  <rect x="35.5556" y="104.8889" width="248.8889" height="53.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="160" y="136.8889" text-anchor="middle" font-family="monospace" font-size="16" fill="var(--text)">Group</text>
  <rect x="35.5556" y="170.6667" width="248.8889" height="53.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="160" y="202.6667" text-anchor="middle" font-family="monospace" font-size="16" fill="var(--text)">ServiceAccount</text>
  <text x="497.7778" y="23.1111" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Binding</text>
  <line x1="286.2222" y1="65.7778" x2="371.5556" y2="97.7778" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <line x1="286.2222" y1="131.5556" x2="371.5556" y2="112" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <line x1="286.2222" y1="197.3333" x2="371.5556" y2="126.2222" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="373.3333" y="71.1111" width="248.8889" height="71.1111" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="497.7778" y="103.1111" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="var(--bg)">RoleBinding</text>
  <text x="497.7778" y="126.2222" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--primary-accent)">namespaced</text>
  <rect x="373.3333" y="177.7778" width="248.8889" height="71.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="497.7778" y="209.7778" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="var(--text)">ClusterRoleBinding</text>
  <text x="497.7778" y="231.1111" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">cluster-wide</text>
  <text x="817.7778" y="23.1111" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Role (defines permissions)</text>
  <line x1="624" y1="106.6667" x2="709.3333" y2="106.6667" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <line x1="624" y1="213.3333" x2="709.3333" y2="266.6667" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="711.1111" y="53.3333" width="391.1111" height="106.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="906.6667" y="81.7778" text-anchor="middle" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--text)">Role (namespace-scoped)</text>
  <text x="728.8889" y="103.1111" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">rules:</text>
  <text x="728.8889" y="120.8889" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">- resources: [pods, services]</text>
  <text x="728.8889" y="138.6667" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">  verbs: [get, list, watch]</text>
  <rect x="711.1111" y="213.3333" width="391.1111" height="106.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="906.6667" y="241.7778" text-anchor="middle" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--text)">ClusterRole (cluster-wide)</text>
  <text x="728.8889" y="263.1111" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">rules:</text>
  <text x="728.8889" y="280.8889" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">- resources: [nodes, namespaces]</text>
  <text x="728.8889" y="298.6667" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">  verbs: [get, list]</text>
  <rect x="35.5556" y="346.6667" width="497.7778" height="195.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="284.4444" y="373.3333" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="var(--text)">Common Verbs</text>
  <text x="53.3333" y="398.2222" font-family="monospace" font-size="13.3333" fill="var(--primary-accent)">get list watch</text>
  <text x="213.3333" y="398.2222" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">— read only</text>
  <text x="53.3333" y="421.3333" font-family="monospace" font-size="13.3333" fill="var(--primary-accent)">create update patch delete</text>
  <text x="53.3333" y="442.6667" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">— write operations</text>
  <text x="53.3333" y="464" font-family="monospace" font-size="13.3333" fill="var(--primary-accent)">*</text>
  <text x="80" y="464" font-family="sans-serif" font-size="12.4444" fill="var(--danger-accent)">— all verbs (avoid!)</text>
  <text x="53.3333" y="494.2222" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Check: <tspan font-family="monospace">kubectl auth can-i get pods --as=user</tspan>
  </text>
  <text x="53.3333" y="513.7778" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Audit: <tspan font-family="monospace">kubectl get rolebindings -A</tspan>
  </text>
  <rect x="568.8889" y="346.6667" width="533.3333" height="195.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="835.5556" y="373.3333" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="var(--primary-accent)">Least Privilege Example</text>
  <text x="586.6667" y="398.2222" font-family="monospace" font-size="12.4444" fill="var(--text)">apiVersion: rbac.authorization.k8s.io/v1</text>
  <text x="586.6667" y="417.7778" font-family="monospace" font-size="12.4444" fill="var(--text)">kind: Role</text>
  <text x="586.6667" y="437.3333" font-family="monospace" font-size="12.4444" fill="var(--text)">rules:</text>
  <text x="586.6667" y="456.8889" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">- apiGroups: [""]</text>
  <text x="586.6667" y="474.6667" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">  resources: ["pods"]</text>
  <text x="586.6667" y="492.4444" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">  verbs: ["get", "list"]</text>
  <text x="586.6667" y="513.7778" font-family="sans-serif" font-size="11.5556" fill="var(--text-faint)">read pods only — no write, no secrets</text>
  <rect x="35.5556" y="558.2222" width="1066.6667" height="37.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="568.8889" y="581.3333" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--primary-accent)">Start with no permissions, add only what each service account actually needs — audit regularly</text>
</svg>
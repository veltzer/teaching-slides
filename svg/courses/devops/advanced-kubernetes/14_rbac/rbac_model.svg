<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Subjects (left) -->
  <text x="180" y="26" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#212121">Subjects</text>

  <rect x="40" y="44" width="280" height="60" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="180" y="80" text-anchor="middle" font-family="monospace" font-size="18" fill="#212121">User</text>

  <rect x="40" y="118" width="280" height="60" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="180" y="154" text-anchor="middle" font-family="monospace" font-size="18" fill="#212121">Group</text>

  <rect x="40" y="192" width="280" height="60" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="180" y="228" text-anchor="middle" font-family="monospace" font-size="18" fill="#212121">ServiceAccount</text>

  <!-- RoleBinding (middle-left) -->
  <text x="560" y="26" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#212121">Binding</text>

  <line x1="322" y1="74" x2="418" y2="110" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <line x1="322" y1="148" x2="418" y2="126" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <line x1="322" y1="222" x2="418" y2="142" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <rect x="420" y="80" width="280" height="80" rx="6" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="560" y="116" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#ffffff">RoleBinding</text>
  <text x="560" y="142" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#bbdefb">namespaced</text>

  <rect x="420" y="200" width="280" height="80" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="560" y="236" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#212121">ClusterRoleBinding</text>
  <text x="560" y="260" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555555">cluster-wide</text>

  <!-- Role/ClusterRole (right) -->
  <text x="920" y="26" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#212121">Role (defines permissions)</text>

  <line x1="702" y1="120" x2="798" y2="120" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <line x1="702" y1="240" x2="798" y2="300" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <rect x="800" y="60" width="440" height="120" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1020" y="92" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#212121">Role (namespace-scoped)</text>
  <text x="820"  y="116" font-family="monospace" font-size="14" fill="#555555">rules:</text>
  <text x="820"  y="136" font-family="monospace" font-size="14" fill="#1565c0">- resources: [pods, services]</text>
  <text x="820"  y="156" font-family="monospace" font-size="14" fill="#1565c0">  verbs: [get, list, watch]</text>

  <rect x="800" y="240" width="440" height="120" rx="6" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1020" y="272" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#212121">ClusterRole (cluster-wide)</text>
  <text x="820"  y="296" font-family="monospace" font-size="14" fill="#555555">rules:</text>
  <text x="820"  y="316" font-family="monospace" font-size="14" fill="#1565c0">- resources: [nodes, namespaces]</text>
  <text x="820"  y="336" font-family="monospace" font-size="14" fill="#1565c0">  verbs: [get, list]</text>

  <!-- Verbs + Resources summary -->
  <rect x="40" y="390" width="560" height="220" rx="6" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="320" y="420" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#212121">Common Verbs</text>
  <text x="60"  y="448" font-family="monospace" font-size="15" fill="#1565c0">get list watch</text>
  <text x="240" y="448" font-family="sans-serif" font-size="14" fill="#555555">— read only</text>
  <text x="60"  y="474" font-family="monospace" font-size="15" fill="#1565c0">create update patch delete</text>
  <text x="60"  y="498" font-family="sans-serif" font-size="14" fill="#555555">— write operations</text>
  <text x="60"  y="522" font-family="monospace" font-size="15" fill="#1565c0">*</text>
  <text x="90"  y="522" font-family="sans-serif" font-size="14" fill="#c62828">— all verbs (avoid!)</text>
  <text x="60"  y="556" font-family="sans-serif" font-size="14" fill="#555555">Check: <tspan font-family="monospace">kubectl auth can-i get pods --as=user</tspan></text>
  <text x="60"  y="578" font-family="sans-serif" font-size="14" fill="#555555">Audit: <tspan font-family="monospace">kubectl get rolebindings -A</tspan></text>

  <!-- Least privilege example -->
  <rect x="640" y="390" width="600" height="220" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="940" y="420" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1565c0">Least Privilege Example</text>
  <text x="660" y="448" font-family="monospace" font-size="14" fill="#212121">apiVersion: rbac.authorization.k8s.io/v1</text>
  <text x="660" y="470" font-family="monospace" font-size="14" fill="#212121">kind: Role</text>
  <text x="660" y="492" font-family="monospace" font-size="14" fill="#212121">rules:</text>
  <text x="660" y="514" font-family="monospace" font-size="14" fill="#1565c0">- apiGroups: [""]</text>
  <text x="660" y="534" font-family="monospace" font-size="14" fill="#1565c0">  resources: ["pods"]</text>
  <text x="660" y="554" font-family="monospace" font-size="14" fill="#1565c0">  verbs: ["get", "list"]</text>
  <text x="660" y="578" font-family="sans-serif" font-size="13" fill="#9e9e9e">read pods only — no write, no secrets</text>

  <rect x="40" y="628" width="1200" height="42" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="640" y="654" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1565c0">Start with no permissions, add only what each service account actually needs — audit regularly</text>
</svg>

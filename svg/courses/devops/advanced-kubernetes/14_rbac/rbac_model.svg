<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:text x="160" y="23.1111" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#212121">Subjects</ns0:text>
  <ns0:rect x="35.5556" y="39.1111" width="248.8889" height="53.3333" rx="5.3333" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="160" y="71.1111" text-anchor="middle" font-family="monospace" font-size="16" fill="#212121">User</ns0:text>
  <ns0:rect x="35.5556" y="104.8889" width="248.8889" height="53.3333" rx="5.3333" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="160" y="136.8889" text-anchor="middle" font-family="monospace" font-size="16" fill="#212121">Group</ns0:text>
  <ns0:rect x="35.5556" y="170.6667" width="248.8889" height="53.3333" rx="5.3333" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="160" y="202.6667" text-anchor="middle" font-family="monospace" font-size="16" fill="#212121">ServiceAccount</ns0:text>
  <ns0:text x="497.7778" y="23.1111" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#212121">Binding</ns0:text>
  <ns0:line x1="286.2222" y1="65.7778" x2="371.5556" y2="97.7778" stroke="#1565c0" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <ns0:line x1="286.2222" y1="131.5556" x2="371.5556" y2="112" stroke="#1565c0" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <ns0:line x1="286.2222" y1="197.3333" x2="371.5556" y2="126.2222" stroke="#1565c0" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <ns0:rect x="373.3333" y="71.1111" width="248.8889" height="71.1111" rx="5.3333" fill="url(#grad-primary)" filter="url(#shadow)" />
  <ns0:text x="497.7778" y="103.1111" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#ffffff">RoleBinding</ns0:text>
  <ns0:text x="497.7778" y="126.2222" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#bbdefb">namespaced</ns0:text>
  <ns0:rect x="373.3333" y="177.7778" width="248.8889" height="71.1111" rx="5.3333" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="497.7778" y="209.7778" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#212121">ClusterRoleBinding</ns0:text>
  <ns0:text x="497.7778" y="231.1111" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#555555">cluster-wide</ns0:text>
  <ns0:text x="817.7778" y="23.1111" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#212121">Role (defines permissions)</ns0:text>
  <ns0:line x1="624" y1="106.6667" x2="709.3333" y2="106.6667" stroke="#1565c0" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <ns0:line x1="624" y1="213.3333" x2="709.3333" y2="266.6667" stroke="#1565c0" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <ns0:rect x="711.1111" y="53.3333" width="391.1111" height="106.6667" rx="5.3333" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="906.6667" y="81.7778" text-anchor="middle" font-family="monospace" font-size="14.2222" font-weight="bold" fill="#212121">Role (namespace-scoped)</ns0:text>
  <ns0:text x="728.8889" y="103.1111" font-family="monospace" font-size="12.4444" fill="#555555">rules:</ns0:text>
  <ns0:text x="728.8889" y="120.8889" font-family="monospace" font-size="12.4444" fill="#1565c0">- resources: [pods, services]</ns0:text>
  <ns0:text x="728.8889" y="138.6667" font-family="monospace" font-size="12.4444" fill="#1565c0">  verbs: [get, list, watch]</ns0:text>
  <ns0:rect x="711.1111" y="213.3333" width="391.1111" height="106.6667" rx="5.3333" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="906.6667" y="241.7778" text-anchor="middle" font-family="monospace" font-size="14.2222" font-weight="bold" fill="#212121">ClusterRole (cluster-wide)</ns0:text>
  <ns0:text x="728.8889" y="263.1111" font-family="monospace" font-size="12.4444" fill="#555555">rules:</ns0:text>
  <ns0:text x="728.8889" y="280.8889" font-family="monospace" font-size="12.4444" fill="#1565c0">- resources: [nodes, namespaces]</ns0:text>
  <ns0:text x="728.8889" y="298.6667" font-family="monospace" font-size="12.4444" fill="#1565c0">  verbs: [get, list]</ns0:text>
  <ns0:rect x="35.5556" y="346.6667" width="497.7778" height="195.5556" rx="5.3333" fill="#f0f0f0" stroke="#e0e0e0" stroke-width="1.3333" />
  <ns0:text x="284.4444" y="373.3333" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="#212121">Common Verbs</ns0:text>
  <ns0:text x="53.3333" y="398.2222" font-family="monospace" font-size="13.3333" fill="#1565c0">get list watch</ns0:text>
  <ns0:text x="213.3333" y="398.2222" font-family="sans-serif" font-size="12.4444" fill="#555555">— read only</ns0:text>
  <ns0:text x="53.3333" y="421.3333" font-family="monospace" font-size="13.3333" fill="#1565c0">create update patch delete</ns0:text>
  <ns0:text x="53.3333" y="442.6667" font-family="sans-serif" font-size="12.4444" fill="#555555">— write operations</ns0:text>
  <ns0:text x="53.3333" y="464" font-family="monospace" font-size="13.3333" fill="#1565c0">*</ns0:text>
  <ns0:text x="80" y="464" font-family="sans-serif" font-size="12.4444" fill="#c62828">— all verbs (avoid!)</ns0:text>
  <ns0:text x="53.3333" y="494.2222" font-family="sans-serif" font-size="12.4444" fill="#555555">Check: <ns0:tspan font-family="monospace">kubectl auth can-i get pods --as=user</ns0:tspan>
  </ns0:text>
  <ns0:text x="53.3333" y="513.7778" font-family="sans-serif" font-size="12.4444" fill="#555555">Audit: <ns0:tspan font-family="monospace">kubectl get rolebindings -A</ns0:tspan>
  </ns0:text>
  <ns0:rect x="568.8889" y="346.6667" width="533.3333" height="195.5556" rx="5.3333" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="835.5556" y="373.3333" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="#1565c0">Least Privilege Example</ns0:text>
  <ns0:text x="586.6667" y="398.2222" font-family="monospace" font-size="12.4444" fill="#212121">apiVersion: rbac.authorization.k8s.io/v1</ns0:text>
  <ns0:text x="586.6667" y="417.7778" font-family="monospace" font-size="12.4444" fill="#212121">kind: Role</ns0:text>
  <ns0:text x="586.6667" y="437.3333" font-family="monospace" font-size="12.4444" fill="#212121">rules:</ns0:text>
  <ns0:text x="586.6667" y="456.8889" font-family="monospace" font-size="12.4444" fill="#1565c0">- apiGroups: [""]</ns0:text>
  <ns0:text x="586.6667" y="474.6667" font-family="monospace" font-size="12.4444" fill="#1565c0">  resources: ["pods"]</ns0:text>
  <ns0:text x="586.6667" y="492.4444" font-family="monospace" font-size="12.4444" fill="#1565c0">  verbs: ["get", "list"]</ns0:text>
  <ns0:text x="586.6667" y="513.7778" font-family="sans-serif" font-size="11.5556" fill="#9e9e9e">read pods only — no write, no secrets</ns0:text>
  <ns0:rect x="35.5556" y="558.2222" width="1066.6667" height="37.3333" rx="5.3333" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="581.3333" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="#1565c0">Start with no permissions, add only what each service account actually needs — audit regularly</ns0:text>
</ns0:svg>
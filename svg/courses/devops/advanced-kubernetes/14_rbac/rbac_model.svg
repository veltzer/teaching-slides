<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <text x="179.999881" y="40" text-anchor="middle" font-size="17.082199" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Subjects</text>
  <rect x="40" y="56.211176" width="280.000082" height="54.037217" rx="6.552226" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="179.999881" y="88.633641" text-anchor="middle" font-size="17.082199" fill="var(--text)" font-family="Courier New, monospace">User</text>
  <rect x="40" y="122.857223" width="280.000082" height="54.037217" rx="6.552226" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="179.999881" y="155.279687" text-anchor="middle" font-size="17.082199" fill="var(--text)" font-family="Courier New, monospace">Group</text>
  <rect x="40" y="189.503269" width="280.000082" height="54.037217" rx="6.552226" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="179.999881" y="221.925622" text-anchor="middle" font-size="17.082199" fill="var(--text)" font-family="Courier New, monospace">ServiceAccount</text>
  <text x="560.00006" y="40" text-anchor="middle" font-size="17.082199" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Binding</text>
  <line x1="322.000082" y1="83.229953" x2="417.99986" y2="115.652193" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <line x1="322.000082" y1="149.875999" x2="417.99986" y2="130.062252" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <line x1="322.000082" y1="216.52171" x2="417.99986" y2="144.472087" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="420.000073" y="88.633641" width="280.000082" height="72.049623" rx="6.552226" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="560.00006" y="121.055993" text-anchor="middle" font-size="17.082199" font-weight="bold" fill="var(--bg)" font-family="Courier New, monospace">RoleBinding</text>
  <text x="560.00006" y="144.472087" text-anchor="middle" font-size="13.285948" fill="var(--primary-accent)" font-family="Arial, sans-serif">namespaced</text>
  <rect x="420.000073" y="196.708187" width="280.000082" height="72.049623" rx="6.552226" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="560.00006" y="229.130427" text-anchor="middle" font-size="17.082199" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">ClusterRoleBinding</text>
  <text x="560.00006" y="250.745292" text-anchor="middle" font-size="13.285948" fill="var(--text-muted)" font-family="Arial, sans-serif">cluster-wide</text>
  <text x="919.999922" y="40" text-anchor="middle" font-size="17.082199" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Role (defines permissions)</text>
  <line x1="701.999941" y1="124.658564" x2="798.000039" y2="124.658564" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <line x1="701.999941" y1="232.732886" x2="798.000039" y2="286.770327" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="800.000039" y="70.621235" width="439.999961" height="108.074546" rx="6.552226" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1020.00002" y="99.441129" text-anchor="middle" font-size="15.184019" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">Role (namespace-scoped)</text>
  <text x="820.000037" y="121.055993" font-size="13.285948" fill="var(--text-muted)" font-family="Courier New, monospace">rules:</text>
  <text x="820.000037" y="139.068511" font-size="13.285948" fill="var(--primary-accent)" font-family="Courier New, monospace">- resources: [pods, services]</text>
  <text x="820.000037" y="157.080805" font-size="13.285948" fill="var(--primary-accent)" font-family="Courier New, monospace">  verbs: [get, list, watch]</text>
  <rect x="800.000039" y="232.732886" width="439.999961" height="108.074546" rx="6.552226" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1020.00002" y="261.552892" text-anchor="middle" font-size="15.184019" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">ClusterRole (cluster-wide)</text>
  <text x="820.000037" y="283.167645" font-size="13.285948" fill="var(--text-muted)" font-family="Courier New, monospace">rules:</text>
  <text x="820.000037" y="301.180274" font-size="13.285948" fill="var(--primary-accent)" font-family="Courier New, monospace">- resources: [nodes, namespaces]</text>
  <text x="820.000037" y="319.19268" font-size="13.285948" fill="var(--primary-accent)" font-family="Courier New, monospace">  verbs: [get, list]</text>
  <rect x="40" y="367.826097" width="559.99995" height="198.136686" rx="6.552226" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="319.999868" y="394.844761" text-anchor="middle" font-size="15.184019" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Common Verbs</text>
  <text x="59.999998" y="420.062196" font-size="14.235257" fill="var(--primary-accent)" font-family="Courier New, monospace">get list watch</text>
  <text x="239.999982" y="420.062196" font-size="13.285948" fill="var(--text-muted)" font-family="Arial, sans-serif">— read only</text>
  <text x="59.999998" y="443.478178" font-size="14.235257" fill="var(--primary-accent)" font-family="Courier New, monospace">create update patch delete</text>
  <text x="59.999998" y="465.093155" font-size="13.285948" fill="var(--text-muted)" font-family="Arial, sans-serif">— write operations</text>
  <text x="59.999998" y="486.708131" font-size="14.235257" fill="var(--primary-accent)" font-family="Courier New, monospace">*</text>
  <text x="90.000102" y="486.708131" font-size="13.285948" fill="var(--danger-accent)" font-family="Arial, sans-serif">— all verbs (avoid!)</text>
  <text x="59.999998" y="517.329254" font-size="13.285948" fill="var(--text-muted)" font-family="Arial, sans-serif">Check: <tspan font-family="Courier New, monospace" fill="var(--text)">kubectl auth can-i get pods --as=user</tspan>
  </text>
  <text x="59.999998" y="537.142889" font-size="13.285948" fill="var(--text-muted)" font-family="Arial, sans-serif">Audit: <tspan font-family="Courier New, monospace" fill="var(--text)">kubectl get rolebindings -A</tspan>
  </text>
  <rect x="639.999947" y="367.826097" width="599.999947" height="198.136686" rx="6.552226" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940.000133" y="394.844761" text-anchor="middle" font-size="15.184019" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Least Privilege Example</text>
  <text x="660.000052" y="420.062196" font-size="13.285948" fill="var(--text)" font-family="Courier New, monospace">apiVersion: rbac.authorization.k8s.io/v1</text>
  <text x="660.000052" y="439.875719" font-size="13.285948" fill="var(--text)" font-family="Courier New, monospace">kind: Role</text>
  <text x="660.000052" y="459.689466" font-size="13.285948" fill="var(--text)" font-family="Courier New, monospace">rules:</text>
  <text x="660.000052" y="479.503213" font-size="13.285948" fill="var(--primary-accent)" font-family="Courier New, monospace">- apiGroups: [""]</text>
  <text x="660.000052" y="497.515619" font-size="13.285948" fill="var(--primary-accent)" font-family="Courier New, monospace">  resources: ["pods"]</text>
  <text x="660.000052" y="515.527913" font-size="13.285948" fill="var(--primary-accent)" font-family="Courier New, monospace">  verbs: ["get", "list"]</text>
  <text x="660.000052" y="537.142889" font-size="12.677793" fill="var(--text-faint)" font-family="Arial, sans-serif">read pods only — no write, no secrets</text>
  <rect x="40" y="582.173959" width="1199.999893" height="37.826041" rx="6.552226" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.999947" y="605.590053" text-anchor="middle" font-size="15.184019" fill="var(--primary-accent)" font-family="Arial, sans-serif">Start with no permissions, add only what each service account actually needs — audit regularly</text>
</svg>
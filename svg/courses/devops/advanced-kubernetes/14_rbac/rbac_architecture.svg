<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="92.7273" width="257.1428" height="527.2727" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="168.5715" y="208.7273" font-size="28.9784" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Subject</text>
  <text x="168.5715" y="303.6364" font-size="26.5636" font-weight="normal" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">User</text>
  <text x="168.5715" y="388" font-size="26.5636" font-weight="normal" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Group</text>
  <text x="168.5715" y="472.3636" font-size="24.1487" font-weight="normal" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">ServiceAccount</text>
  <rect x="382.8572" y="92.7273" width="428.5714" height="527.2727" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="597.1429" y="208.7273" font-size="28.9784" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Binding</text>
  <text x="597.1429" y="303.6364" font-size="26.5636" font-weight="normal" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">RoleBinding</text>
  <text x="597.1429" y="388" font-size="24.1487" font-weight="normal" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">(namespace)</text>
  <text x="597.1429" y="482.9091" font-size="26.5636" font-weight="normal" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">ClusterRoleBinding</text>
  <text x="597.1429" y="567.2727" font-size="24.1487" font-weight="normal" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">(cluster-wide)</text>
  <rect x="918.5714" y="92.7273" width="321.4286" height="210.9091" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1079.2857" y="166.5455" font-size="28.9784" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Role</text>
  <text x="1079.2857" y="250.9091" font-size="24.1487" font-weight="normal" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">namespace perms</text>
  <rect x="918.5714" y="409.0909" width="321.4286" height="210.9091" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1079.2857" y="482.9091" font-size="28.9784" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">ClusterRole</text>
  <text x="1079.2857" y="567.2727" font-size="24.1487" font-weight="normal" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">cluster-wide perms</text>
  <line x1="297.1429" y1="356.3636" x2="378.5715" y2="356.3636" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="811.4286" y1="250.9091" x2="914.2858" y2="198.1818" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="811.4286" y1="461.8182" x2="914.2858" y2="514.5455" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="168.5715" y="40" font-size="26.5636" font-weight="bold" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">WHO (Subject)</text>
  <text x="597.1429" y="40" font-size="26.5636" font-weight="bold" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">WHAT (Verb+Resource)</text>
  <text x="1079.2857" y="40" font-size="26.5636" font-weight="bold" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">WHERE</text>
</svg>

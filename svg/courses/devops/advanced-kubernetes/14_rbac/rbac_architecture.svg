<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="92.7273" width="257.1428" height="527.2727" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="168.5715" y="208.7273" font-size="28.9784" font-weight="bold" fill="var(--text)" text-anchor="middle">Subject</text>
  <text x="168.5715" y="303.6364" font-size="26.5636" font-weight="normal" fill="var(--text)" text-anchor="middle">User</text>
  <text x="168.5715" y="388" font-size="26.5636" font-weight="normal" fill="var(--text)" text-anchor="middle">Group</text>
  <text x="168.5715" y="472.3636" font-size="24.1487" font-weight="normal" fill="var(--text)" text-anchor="middle">ServiceAccount</text>
  <rect x="382.8572" y="92.7273" width="428.5714" height="527.2727" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="597.1429" y="208.7273" font-size="28.9784" font-weight="bold" fill="var(--text)" text-anchor="middle">Binding</text>
  <text x="597.1429" y="303.6364" font-size="26.5636" font-weight="normal" fill="var(--text)" text-anchor="middle">RoleBinding</text>
  <text x="597.1429" y="388" font-size="24.1487" font-weight="normal" fill="var(--text)" text-anchor="middle">(namespace)</text>
  <text x="597.1429" y="482.9091" font-size="26.5636" font-weight="normal" fill="var(--text)" text-anchor="middle">ClusterRoleBinding</text>
  <text x="597.1429" y="567.2727" font-size="24.1487" font-weight="normal" fill="var(--text)" text-anchor="middle">(cluster-wide)</text>
  <rect x="918.5714" y="92.7273" width="321.4286" height="210.9091" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1079.2857" y="166.5455" font-size="28.9784" font-weight="bold" fill="var(--text)" text-anchor="middle">Role</text>
  <text x="1079.2857" y="250.9091" font-size="24.1487" font-weight="normal" fill="var(--text)" text-anchor="middle">namespace perms</text>
  <rect x="918.5714" y="409.0909" width="321.4286" height="210.9091" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1079.2857" y="482.9091" font-size="28.9784" font-weight="bold" fill="var(--text)" text-anchor="middle">ClusterRole</text>
  <text x="1079.2857" y="567.2727" font-size="24.1487" font-weight="normal" fill="var(--text)" text-anchor="middle">cluster-wide perms</text>
  <line x1="297.1429" y1="356.3636" x2="378.5715" y2="356.3636" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="811.4286" y1="250.9091" x2="914.2858" y2="198.1818" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="811.4286" y1="461.8182" x2="914.2858" y2="514.5455" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="168.5715" y="40" font-size="26.5636" font-weight="bold" fill="var(--text-muted)" text-anchor="middle">WHO (Subject)</text>
  <text x="597.1429" y="40" font-size="26.5636" font-weight="bold" fill="var(--text-muted)" text-anchor="middle">WHAT (Verb+Resource)</text>
  <text x="1079.2857" y="40" font-size="26.5636" font-weight="bold" fill="var(--text-muted)" text-anchor="middle">WHERE</text>
</svg>
  <line x1="784.5161" y1="360" x2="883.6129" y2="320" stroke="#555" stroke-width="3.0968" marker-end="url(#arrow)" />
  <line x1="784.5161" y1="520" x2="883.6129" y2="560" stroke="#555" stroke-width="3.0968" marker-end="url(#arrow)" />
  <text x="165.1613" y="200" font-size="22.7097" font-weight="bold" fill="#555" text-anchor="middle">WHO (Subject)</text>

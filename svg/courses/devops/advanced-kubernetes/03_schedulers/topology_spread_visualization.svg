<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,23.2258 6.7879,0" fill="#555" />
    </marker>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,23.2258 6.7879,0" fill="#555" />
    </marker>
  </defs>
  <text x="655.3847" y="40" text-anchor="middle" font-size="25.0293" fill="var(--text)" font-weight="bold">maxSkew: 1, topologyKey: zone</text>
  <rect x="40" y="68.1344" width="358.9743" height="281.3433" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="218.4615" y="52.9851" text-anchor="middle" font-size="25.0293" fill="var(--text)" font-weight="bold">Zone A</text>
  <rect x="81.0256" y="100.597" width="276.9231" height="86.5671" rx="6" fill="var(--bg)" stroke="var(--text-muted)" stroke-width="2.7642" />
  <text x="218.4615" y="154.7015" text-anchor="middle" font-size="25.0293" fill="var(--text)">web-1</text>
  <rect x="81.0256" y="213.1343" width="276.9231" height="86.5671" rx="6" fill="var(--bg)" stroke="var(--text-muted)" stroke-width="2.7642" />
  <text x="218.4615" y="267.2388" text-anchor="middle" font-size="25.0293" fill="var(--text)">web-4</text>
  <text x="218.4615" y="392.7611" text-anchor="middle" font-size="23.104" fill="var(--text-muted)">2 pods</text>
  <rect x="460.5128" y="68.1344" width="358.9743" height="281.3433" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="638.9744" y="52.9851" text-anchor="middle" font-size="25.0293" fill="var(--text)" font-weight="bold">Zone B</text>
  <rect x="501.5386" y="100.597" width="276.9231" height="86.5671" rx="6" fill="var(--bg)" stroke="var(--text-muted)" stroke-width="2.7642" />
  <text x="638.9744" y="154.7015" text-anchor="middle" font-size="25.0293" fill="var(--text)">web-2</text>
  <rect x="501.5386" y="213.1343" width="276.9231" height="86.5671" rx="6" fill="var(--bg)" stroke="var(--text-muted)" stroke-width="2.7642" />
  <text x="638.9744" y="267.2388" text-anchor="middle" font-size="25.0293" fill="var(--text)">web-5</text>
  <text x="638.9744" y="392.7611" text-anchor="middle" font-size="23.104" fill="var(--text-muted)">2 pods</text>
  <rect x="881.0257" y="68.1344" width="358.9743" height="281.3433" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1059.4872" y="52.9851" text-anchor="middle" font-size="25.0293" fill="var(--text)" font-weight="bold">Zone C</text>
  <rect x="922.0513" y="100.597" width="276.9231" height="86.5671" rx="6" fill="var(--bg)" stroke="var(--text-muted)" stroke-width="2.7642" />
  <text x="1059.4872" y="154.7015" text-anchor="middle" font-size="25.0293" fill="var(--text)">web-3</text>
  <rect x="922.0513" y="213.1343" width="276.9231" height="86.5671" rx="6" fill="var(--bg)" stroke="var(--text-muted)" stroke-width="2.7642" />
  <text x="1059.4872" y="267.2388" text-anchor="middle" font-size="25.0293" fill="var(--text)">web-6</text>
  <text x="1059.4872" y="392.7611" text-anchor="middle" font-size="23.104" fill="var(--text-muted)">2 pods</text>
  <text x="655.3847" y="464.1792" text-anchor="middle" font-size="23.104" fill="var(--text)">Balanced! maxSkew=1 means difference between any two zones ≤ 1.</text>
  <rect x="142.564" y="494.4776" width="1005.1283" height="125.5224" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="645.1282" y="539.9253" text-anchor="middle" font-size="23.104" fill="var(--danger-accent)">Violation example: Zone A = 2 pods, Zone C = 0 pods</text>
  <text x="645.1282" y="581.0447" text-anchor="middle" font-size="23.104" fill="var(--danger-accent)">skew = 2 − 0 = 2 &gt; maxSkew(1) → VIOLATION</text>
</svg>
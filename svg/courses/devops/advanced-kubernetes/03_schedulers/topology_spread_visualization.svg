<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,23.2258 6.7879,0" fill="#555" />
    </marker>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,23.2258 6.7879,0" fill="#555" />
    </marker>
  </defs>
  <text x="608.1226" y="48.5517" text-anchor="middle" font-size="23.9563" fill="var(--text)" font-weight="bold">maxSkew: 1, topologyKey: zone</text>
  <rect x="55.2839" y="77.2414" width="322.4892" height="286.8966" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="215.6071" y="61.7931" text-anchor="middle" font-size="23.9563" fill="var(--text)" font-weight="bold">Zone A</text>
  <rect x="92.1398" y="110.3448" width="248.7774" height="88.2758" rx="6" fill="var(--bg)" stroke="var(--text-muted)" stroke-width="2.7642" />
  <text x="215.6071" y="165.5172" text-anchor="middle" font-size="23.9563" fill="var(--text)">web-1</text>
  <rect x="92.1398" y="225.1034" width="248.7774" height="88.2758" rx="6" fill="var(--bg)" stroke="var(--text-muted)" stroke-width="2.7642" />
  <text x="215.6071" y="280.2758" text-anchor="middle" font-size="23.9563" fill="var(--text)">web-4</text>
  <text x="215.6071" y="408.2758" text-anchor="middle" font-size="22.1135" fill="var(--text-muted)">2 pods</text>
  <rect x="433.057" y="77.2414" width="322.4892" height="286.8966" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="593.3802" y="61.7931" text-anchor="middle" font-size="23.9563" fill="var(--text)" font-weight="bold">Zone B</text>
  <rect x="469.913" y="110.3448" width="248.7774" height="88.2758" rx="6" fill="var(--bg)" stroke="var(--text-muted)" stroke-width="2.7642" />
  <text x="593.3802" y="165.5172" text-anchor="middle" font-size="23.9563" fill="var(--text)">web-2</text>
  <rect x="469.913" y="225.1034" width="248.7774" height="88.2758" rx="6" fill="var(--bg)" stroke="var(--text-muted)" stroke-width="2.7642" />
  <text x="593.3802" y="280.2758" text-anchor="middle" font-size="23.9563" fill="var(--text)">web-5</text>
  <text x="593.3802" y="408.2758" text-anchor="middle" font-size="22.1135" fill="var(--text-muted)">2 pods</text>
  <rect x="810.8301" y="77.2414" width="322.4892" height="286.8966" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="971.1533" y="61.7931" text-anchor="middle" font-size="23.9563" fill="var(--text)" font-weight="bold">Zone C</text>
  <rect x="847.686" y="110.3448" width="248.7774" height="88.2758" rx="6" fill="var(--bg)" stroke="var(--text-muted)" stroke-width="2.7642" />
  <text x="971.1533" y="165.5172" text-anchor="middle" font-size="23.9563" fill="var(--text)">web-3</text>
  <rect x="847.686" y="225.1034" width="248.7774" height="88.2758" rx="6" fill="var(--bg)" stroke="var(--text-muted)" stroke-width="2.7642" />
  <text x="971.1533" y="280.2758" text-anchor="middle" font-size="23.9563" fill="var(--text)">web-6</text>
  <text x="971.1533" y="408.2758" text-anchor="middle" font-size="22.1135" fill="var(--text-muted)">2 pods</text>
  <text x="608.1226" y="481.1035" text-anchor="middle" font-size="22.1135" fill="var(--text)">Balanced! maxSkew=1 means difference between any two zones ≤ 1.</text>
  <rect x="147.4236" y="512" width="902.9699" height="128" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="598.9086" y="558.3448" text-anchor="middle" font-size="22.1135" fill="var(--danger-accent)">Violation example: Zone A = 2 pods, Zone C = 0 pods</text>
  <text x="598.9086" y="600.2758" text-anchor="middle" font-size="22.1135" fill="var(--danger-accent)">skew = 2 − 0 = 2 &gt; maxSkew(1) → VIOLATION</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="655.3847" y="40" text-anchor="middle" font-size="25.0293" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">maxSkew: 1, topologyKey: zone</text>
  <rect x="40" y="68.1344" width="358.9743" height="281.3433" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="218.4615" y="52.9851" text-anchor="middle" font-size="25.0293" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Zone A</text>
  <rect x="81.0256" y="100.597" width="276.9231" height="86.5671" rx="6" fill="var(--bg)" stroke="var(--text-muted)" stroke-width="2.7642"/>
  <text x="218.4615" y="154.7015" text-anchor="middle" font-size="25.0293" fill="var(--text)" font-family="Arial, sans-serif">web-1</text>
  <rect x="81.0256" y="213.1343" width="276.9231" height="86.5671" rx="6" fill="var(--bg)" stroke="var(--text-muted)" stroke-width="2.7642"/>
  <text x="218.4615" y="267.2388" text-anchor="middle" font-size="25.0293" fill="var(--text)" font-family="Arial, sans-serif">web-4</text>
  <text x="218.4615" y="392.7611" text-anchor="middle" font-size="23.104" fill="var(--text-muted)" font-family="Arial, sans-serif">2 pods</text>
  <rect x="460.5128" y="68.1344" width="358.9743" height="281.3433" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="638.9744" y="52.9851" text-anchor="middle" font-size="25.0293" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Zone B</text>
  <rect x="501.5386" y="100.597" width="276.9231" height="86.5671" rx="6" fill="var(--bg)" stroke="var(--text-muted)" stroke-width="2.7642"/>
  <text x="638.9744" y="154.7015" text-anchor="middle" font-size="25.0293" fill="var(--text)" font-family="Arial, sans-serif">web-2</text>
  <rect x="501.5386" y="213.1343" width="276.9231" height="86.5671" rx="6" fill="var(--bg)" stroke="var(--text-muted)" stroke-width="2.7642"/>
  <text x="638.9744" y="267.2388" text-anchor="middle" font-size="25.0293" fill="var(--text)" font-family="Arial, sans-serif">web-5</text>
  <text x="638.9744" y="392.7611" text-anchor="middle" font-size="23.104" fill="var(--text-muted)" font-family="Arial, sans-serif">2 pods</text>
  <rect x="881.0257" y="68.1344" width="358.9743" height="281.3433" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1059.4872" y="52.9851" text-anchor="middle" font-size="25.0293" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Zone C</text>
  <rect x="922.0513" y="100.597" width="276.9231" height="86.5671" rx="6" fill="var(--bg)" stroke="var(--text-muted)" stroke-width="2.7642"/>
  <text x="1059.4872" y="154.7015" text-anchor="middle" font-size="25.0293" fill="var(--text)" font-family="Arial, sans-serif">web-3</text>
  <rect x="922.0513" y="213.1343" width="276.9231" height="86.5671" rx="6" fill="var(--bg)" stroke="var(--text-muted)" stroke-width="2.7642"/>
  <text x="1059.4872" y="267.2388" text-anchor="middle" font-size="25.0293" fill="var(--text)" font-family="Arial, sans-serif">web-6</text>
  <text x="1059.4872" y="392.7611" text-anchor="middle" font-size="23.104" fill="var(--text-muted)" font-family="Arial, sans-serif">2 pods</text>
  <text x="655.3847" y="464.1792" text-anchor="middle" font-size="23.104" fill="var(--text)" font-family="Arial, sans-serif">Balanced! maxSkew=1 means difference between any two zones ≤ 1.</text>
  <rect x="142.564" y="494.4776" width="1005.1283" height="125.5224" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="645.1282" y="539.9253" text-anchor="middle" font-size="23.104" fill="var(--danger-accent)" font-family="Arial, sans-serif">Violation example: Zone A = 2 pods, Zone C = 0 pods</text>
  <text x="645.1282" y="581.0447" text-anchor="middle" font-size="23.104" fill="var(--danger-accent)" font-family="Arial, sans-serif">skew = 2 − 0 = 2 &gt; maxSkew(1) → VIOLATION</text>
</svg>

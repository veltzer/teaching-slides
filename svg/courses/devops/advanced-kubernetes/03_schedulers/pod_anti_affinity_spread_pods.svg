  <text x="223.0303" y="306" text-anchor="middle" font-size="25.2121" fill="#222">Web-1</text>
  <rect x="455.7576" y="90" width="378.1818" height="427.5" rx="7.7576" fill="#f5f5f5" stroke="#333" stroke-width="2.9091" />
  <text x="643.8788" y="63" text-anchor="middle" font-size="23.2727" fill="#555">Node 2</text>
  <rect x="513.9394" y="171" width="252.1212" height="225" rx="7.7576" fill="#e3f2fd" stroke="#333" stroke-width="2.9091" />
  <text x="640" y="306" text-anchor="middle" font-size="25.2121" fill="#222">Web-2</text>
  <rect x="872.7273" y="90" width="378.1818" height="427.5" rx="7.7576" fill="#f5f5f5" stroke="#333" stroke-width="2.9091" />

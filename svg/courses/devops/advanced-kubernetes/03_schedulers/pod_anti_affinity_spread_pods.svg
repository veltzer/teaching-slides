  <text x="1056.9697" y="306" text-anchor="middle" font-size="25.2121" fill="#222">Web-3</text>
  <text x="640" y="630" text-anchor="middle" font-size="23.2727" fill="#333333">One web pod per node (anti-affinity on hostname)</text>
</svg>
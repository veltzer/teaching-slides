<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <text x="626.0465" y="40" text-anchor="middle" font-size="26.9869" fill="var(--text)" font-family="Arial, sans-serif">New Pod Created (spec.nodeName is empty)</text>
  <line x1="626.0465" y1="48.7349" x2="626.0465" y2="92.4097" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="319.0698" y="92.4097" width="613.9536" height="97.8313" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="626.0465" y="132.5903" text-anchor="middle" font-size="29.0628" fill="var(--text)" font-family="Arial, sans-serif">Scheduling Queue</text>
  <text x="626.0465" y="162.2891" text-anchor="middle" font-size="24.911" fill="var(--text-muted)" font-family="Arial, sans-serif"/>
  <line x1="626.0465" y1="190.241" x2="626.0465" y2="235.6626" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="235.6626" width="530.2325" height="97.8313" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="305.1163" y="277.5904" text-anchor="middle" font-size="29.0628" fill="var(--text)" font-family="Arial, sans-serif">Filter Phase</text>
  <text x="305.1163" y="307.2891" text-anchor="middle" font-size="22.835" fill="var(--text-muted)" font-family="Arial, sans-serif">(Predicates)</text>
  <line x1="570.2325" y1="284.5783" x2="695.8139" y2="284.5783" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="695.8139" y="235.6626" width="544.1861" height="97.8313" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="966.5117" y="277.5904" text-anchor="middle" font-size="29.0628" fill="var(--text)" font-family="Arial, sans-serif">Feasible Nodes</text>
  <text x="966.5117" y="307.2891" text-anchor="middle" font-size="22.835" fill="var(--text-muted)" font-family="Arial, sans-serif">(candidates)</text>
  <line x1="966.5117" y1="333.494" x2="966.5117" y2="378.9156" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="695.8139" y="378.9156" width="544.1861" height="97.8313" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="966.5117" y="420.8434" text-anchor="middle" font-size="29.0628" fill="var(--text)" font-family="Arial, sans-serif">Score Phase</text>
  <text x="966.5117" y="450.5421" text-anchor="middle" font-size="22.835" fill="var(--text-muted)" font-family="Arial, sans-serif">(Priorities)</text>
  <line x1="966.5117" y1="476.7469" x2="966.5117" y2="522.1687" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="695.8139" y="522.1687" width="544.1861" height="97.8313" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="966.5117" y="564.0963" text-anchor="middle" font-size="29.0628" fill="var(--text)" font-family="Arial, sans-serif">Bind Phase</text>
  <text x="966.5117" y="593.7952" text-anchor="middle" font-size="22.835" fill="var(--text-muted)" font-family="Arial, sans-serif">(Assign Node)</text>
</svg>
  <line x1="876.6061" y1="336" x2="876.6061" y2="380.5714" stroke="#555" stroke-width="2.5714" marker-end="url(#arr)" />
  <rect x="688.4848" y="380.5714" width="378.1818" height="96" rx="6.8571" fill="#e3f2fd" stroke="#333" stroke-width="2.5714" />
  <text x="876.6061" y="421.7143" text-anchor="middle" font-size="24" fill="#222">Score Phase</text>
  <text x="876.6061" y="450.8571" text-anchor="middle" font-size="18.8571" fill="#555">(Priorities)</text>
  <line x1="876.6061" y1="476.5714" x2="876.6061" y2="521.1429" stroke="#555" stroke-width="2.5714" marker-end="url(#arr)" />
  <rect x="688.4848" y="521.1429" width="378.1818" height="96" rx="6.8571" fill="#fff3e0" stroke="#333" stroke-width="2.5714" />

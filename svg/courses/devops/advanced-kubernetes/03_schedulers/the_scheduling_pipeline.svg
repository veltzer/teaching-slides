<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 6.7879,0" fill="#555" />
    </marker>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 6.7879,0" fill="#555" />
    </marker>
  </defs>
  <text x="640" y="48" text-anchor="middle" font-size="22.2857" fill="var(--text-darker)">New Pod Created (spec.nodeName is empty)</text>
  <line x1="640" y1="56.5714" x2="640" y2="99.4286" stroke="var(--text-muted)" stroke-width="2.5714" marker-end="url(#arr)" />
  <rect x="426.6667" y="99.4286" width="426.6667" height="96" rx="6.8571" fill="var(--primary-pale)" stroke="var(--text-dark)" stroke-width="2.5714" />
  <text x="640" y="138.8571" text-anchor="middle" font-size="24" fill="var(--text-darker)">Scheduling Queue</text>
  <text x="640" y="168" text-anchor="middle" font-size="20.5714" fill="var(--text-muted)" />
  <line x1="640" y1="195.4286" x2="640" y2="240" stroke="var(--text-muted)" stroke-width="2.5714" marker-end="url(#arr)" />
  <rect x="232.7273" y="240" width="368.4848" height="96" rx="6.8571" fill="var(--primary-pale)" stroke="var(--text-dark)" stroke-width="2.5714" />
  <text x="416.9697" y="281.1429" text-anchor="middle" font-size="24" fill="var(--text-darker)">Filter Phase</text>
  <text x="416.9697" y="310.2857" text-anchor="middle" font-size="18.8571" fill="var(--text-muted)">(Predicates)</text>
  <line x1="601.2121" y1="288" x2="688.4848" y2="288" stroke="var(--text-muted)" stroke-width="2.5714" marker-end="url(#arr)" />
  <rect x="688.4848" y="240" width="378.1818" height="96" rx="6.8571" fill="var(--ok-pale)" stroke="var(--text-dark)" stroke-width="2.5714" />
  <text x="876.6061" y="281.1429" text-anchor="middle" font-size="24" fill="var(--text-darker)">Feasible Nodes</text>
  <text x="876.6061" y="310.2857" text-anchor="middle" font-size="18.8571" fill="var(--text-muted)">(candidates)</text>
  <line x1="876.6061" y1="336" x2="876.6061" y2="380.5714" stroke="var(--text-muted)" stroke-width="2.5714" marker-end="url(#arr)" />
  <rect x="688.4848" y="380.5714" width="378.1818" height="96" rx="6.8571" fill="var(--primary-pale)" stroke="var(--text-dark)" stroke-width="2.5714" />
  <text x="876.6061" y="421.7143" text-anchor="middle" font-size="24" fill="var(--text-darker)">Score Phase</text>
  <text x="876.6061" y="450.8571" text-anchor="middle" font-size="18.8571" fill="var(--text-muted)">(Priorities)</text>
  <line x1="876.6061" y1="476.5714" x2="876.6061" y2="521.1429" stroke="var(--text-muted)" stroke-width="2.5714" marker-end="url(#arr)" />
  <rect x="688.4848" y="521.1429" width="378.1818" height="96" rx="6.8571" fill="var(--warn-pale)" stroke="var(--text-dark)" stroke-width="2.5714" />
  <text x="876.6061" y="562.2857" text-anchor="middle" font-size="24" fill="var(--text-darker)">Bind Phase</text>
  <text x="876.6061" y="591.4286" text-anchor="middle" font-size="18.8571" fill="var(--text-muted)">(Assign Node)</text>
</svg>
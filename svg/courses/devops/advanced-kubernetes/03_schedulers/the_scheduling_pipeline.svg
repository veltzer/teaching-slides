<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 6.7879,0" fill="#555" />
    </marker>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 6.7879,0" fill="#555" />
    </marker>
  </defs>
  <text x="640" y="48" text-anchor="middle" font-size="22.2857" fill="var(--text)">New Pod Created (spec.nodeName is empty)</text>
  <line x1="640" y1="56.5714" x2="640" y2="99.4286" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="426.6667" y="99.4286" width="426.6667" height="96" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="138.8571" text-anchor="middle" font-size="24" fill="var(--text)">Scheduling Queue</text>
  <text x="640" y="168" text-anchor="middle" font-size="20.5714" fill="var(--text-muted)" />
  <line x1="640" y1="195.4286" x2="640" y2="240" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="232.7273" y="240" width="368.4848" height="96" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="416.9697" y="281.1429" text-anchor="middle" font-size="24" fill="var(--text)">Filter Phase</text>
  <text x="416.9697" y="310.2857" text-anchor="middle" font-size="18.8571" fill="var(--text-muted)">(Predicates)</text>
  <line x1="601.2121" y1="288" x2="688.4848" y2="288" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="688.4848" y="240" width="378.1818" height="96" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="876.6061" y="281.1429" text-anchor="middle" font-size="24" fill="var(--text)">Feasible Nodes</text>
  <text x="876.6061" y="310.2857" text-anchor="middle" font-size="18.8571" fill="var(--text-muted)">(candidates)</text>
  <line x1="876.6061" y1="336" x2="876.6061" y2="380.5714" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="688.4848" y="380.5714" width="378.1818" height="96" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="876.6061" y="421.7143" text-anchor="middle" font-size="24" fill="var(--text)">Score Phase</text>
  <text x="876.6061" y="450.8571" text-anchor="middle" font-size="18.8571" fill="var(--text-muted)">(Priorities)</text>
  <line x1="876.6061" y1="476.5714" x2="876.6061" y2="521.1429" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="688.4848" y="521.1429" width="378.1818" height="96" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="876.6061" y="562.2857" text-anchor="middle" font-size="24" fill="var(--text)">Bind Phase</text>
  <text x="876.6061" y="591.4286" text-anchor="middle" font-size="18.8571" fill="var(--text-muted)">(Assign Node)</text>
</svg>
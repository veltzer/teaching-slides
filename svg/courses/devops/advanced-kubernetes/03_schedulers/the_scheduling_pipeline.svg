<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 6.7879,0" fill="#555" />
    </marker>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 6.7879,0" fill="#555" />
    </marker>
  </defs>
  <text x="626.0465" y="40" text-anchor="middle" font-size="26.9869" fill="var(--text)">New Pod Created (spec.nodeName is empty)</text>
  <line x1="626.0465" y1="48.7349" x2="626.0465" y2="92.4097" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="319.0698" y="92.4097" width="613.9536" height="97.8313" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="626.0465" y="132.5903" text-anchor="middle" font-size="29.0628" fill="var(--text)">Scheduling Queue</text>
  <text x="626.0465" y="162.2891" text-anchor="middle" font-size="24.911" fill="var(--text-muted)" />
  <line x1="626.0465" y1="190.241" x2="626.0465" y2="235.6626" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="40" y="235.6626" width="530.2325" height="97.8313" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="305.1163" y="277.5904" text-anchor="middle" font-size="29.0628" fill="var(--text)">Filter Phase</text>
  <text x="305.1163" y="307.2891" text-anchor="middle" font-size="22.835" fill="var(--text-muted)">(Predicates)</text>
  <line x1="570.2325" y1="284.5783" x2="695.8139" y2="284.5783" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="695.8139" y="235.6626" width="544.1861" height="97.8313" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="966.5117" y="277.5904" text-anchor="middle" font-size="29.0628" fill="var(--text)">Feasible Nodes</text>
  <text x="966.5117" y="307.2891" text-anchor="middle" font-size="22.835" fill="var(--text-muted)">(candidates)</text>
  <line x1="966.5117" y1="333.494" x2="966.5117" y2="378.9156" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="695.8139" y="378.9156" width="544.1861" height="97.8313" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="966.5117" y="420.8434" text-anchor="middle" font-size="29.0628" fill="var(--text)">Score Phase</text>
  <text x="966.5117" y="450.5421" text-anchor="middle" font-size="22.835" fill="var(--text-muted)">(Priorities)</text>
  <line x1="966.5117" y1="476.7469" x2="966.5117" y2="522.1687" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="695.8139" y="522.1687" width="544.1861" height="97.8313" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="966.5117" y="564.0963" text-anchor="middle" font-size="29.0628" fill="var(--text)">Bind Phase</text>
  <text x="966.5117" y="593.7952" text-anchor="middle" font-size="22.835" fill="var(--text-muted)">(Assign Node)</text>
</svg>
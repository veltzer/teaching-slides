<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="24.8791" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Canary Deployment Phases</text>
  <rect x="40" y="61.7499" width="1200" height="108.75" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="66.087" y="90.7499" font-size="20.2142" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Phase 1: 5% canary</text>
  <rect x="66.087" y="102.35" width="991.3044" height="23.2" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1083.4782" y="121.2" font-size="17.1044" fill="var(--text-muted)" font-family="Arial, sans-serif">95% v1</text>
  <rect x="66.087" y="131.3499" width="52.1739" height="23.2" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1083.4782" y="150.2" font-size="17.1044" fill="var(--text-muted)" font-family="Arial, sans-serif">5% v2</text>
  <rect x="40" y="185" width="1200" height="108.75" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="66.087" y="213.9999" font-size="20.2142" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Phase 2: 25% canary (metrics look good)</text>
  <rect x="66.087" y="225.5999" width="782.6087" height="23.2" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1083.4782" y="244.45" font-size="17.1044" fill="var(--text-muted)" font-family="Arial, sans-serif">75% v1</text>
  <rect x="66.087" y="254.5999" width="260.8696" height="23.2" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1083.4782" y="273.45" font-size="17.1044" fill="var(--text-muted)" font-family="Arial, sans-serif">25% v2</text>
  <rect x="40" y="308.25" width="1200" height="108.75" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="66.087" y="337.2499" font-size="20.2142" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Phase 3: 50% canary</text>
  <rect x="66.087" y="348.8499" width="521.7391" height="23.2" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1083.4782" y="367.7" font-size="17.1044" fill="var(--text-muted)" font-family="Arial, sans-serif">50% v1</text>
  <rect x="66.087" y="377.8499" width="521.7391" height="23.2" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1083.4782" y="396.6999" font-size="17.1044" fill="var(--text-muted)" font-family="Arial, sans-serif">50% v2</text>
  <rect x="40" y="431.5" width="1200" height="94.25" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="66.087" y="460.4999" font-size="20.2142" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Phase 4: 100% new version</text>
  <rect x="66.087" y="474.9999" width="1043.4782" height="23.2" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1083.4782" y="493.85" font-size="17.1044" fill="var(--text-muted)" font-family="Arial, sans-serif">100% v2</text>
  <rect x="40" y="547.5" width="521.7391" height="72.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="66.087" y="562" width="39.1304" height="17.4" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="118.2609" y="577.95" font-size="17.1044" fill="var(--text-muted)" font-family="Arial, sans-serif">v1 (current)</text>
  <rect x="66.087" y="588.0999" width="39.1304" height="17.4" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="118.2609" y="604.0499" font-size="17.1044" fill="var(--text-muted)" font-family="Arial, sans-serif">v2 (canary)</text>
</svg>
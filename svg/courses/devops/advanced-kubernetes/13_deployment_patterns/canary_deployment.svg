<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="588.9673" y="37.6471" text-anchor="middle" font-size="24.0941" font-weight="bold" fill="var(--text)">Canary Deployment Phases</text>
  <rect x="47.1174" y="60.2352" width="1083.6998" height="112.9412" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="70.6761" y="90.3529" font-size="19.5764" font-weight="bold" fill="var(--text)">Phase 1: 5% canary</text>
  <rect x="70.6761" y="102.4" width="895.2303" height="24.0941" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="989.465" y="121.9765" font-size="16.5647" fill="var(--text-muted)">95% v1</text>
  <rect x="70.6761" y="132.5176" width="47.1174" height="24.0941" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="989.465" y="152.0941" font-size="16.5647" fill="var(--text-muted)">5% v2</text>
  <rect x="47.1174" y="188.2353" width="1083.6998" height="112.9412" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="70.6761" y="218.3529" font-size="19.5764" font-weight="bold" fill="var(--text)">Phase 2: 25% canary (metrics look good)</text>
  <rect x="70.6761" y="230.3999" width="706.7607" height="24.0941" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="989.465" y="249.9765" font-size="16.5647" fill="var(--text-muted)">75% v1</text>
  <rect x="70.6761" y="260.5176" width="235.5869" height="24.0941" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="989.465" y="280.0941" font-size="16.5647" fill="var(--text-muted)">25% v2</text>
  <rect x="47.1174" y="316.2353" width="1083.6998" height="112.9412" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="70.6761" y="346.3529" font-size="19.5764" font-weight="bold" fill="var(--text)">Phase 3: 50% canary</text>
  <rect x="70.6761" y="358.3999" width="471.1738" height="24.0941" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="989.465" y="377.9765" font-size="16.5647" fill="var(--text-muted)">50% v1</text>
  <rect x="70.6761" y="388.5176" width="471.1738" height="24.0941" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="989.465" y="408.094" font-size="16.5647" fill="var(--text-muted)">50% v2</text>
  <rect x="47.1174" y="444.2353" width="1083.6998" height="97.8823" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="70.6761" y="474.3529" font-size="19.5764" font-weight="bold" fill="var(--text)">Phase 4: 100% new version</text>
  <rect x="70.6761" y="489.4117" width="942.3476" height="24.0941" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="989.465" y="508.9882" font-size="16.5647" fill="var(--text-muted)">100% v2</text>
  <rect x="47.1174" y="564.7059" width="471.1738" height="75.2941" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="70.6761" y="579.7647" width="35.338" height="18.0706" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="117.7935" y="596.3294" font-size="16.5647" fill="var(--text-muted)">v1 (current)</text>
  <rect x="70.6761" y="606.8705" width="35.338" height="18.0706" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="117.7935" y="623.4352" font-size="16.5647" fill="var(--text-muted)">v2 (canary)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="112.986992747516" rx="6.115765749489" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="66.087" y="70.129864732671" font-size="20.604218668888" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Phase 1: 5% canary</text>
  <rect x="66.087" y="82.181914521825" width="991.3044" height="24.103891786137" rx="6.115765749489" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1083.4782" y="101.766326598061" font-size="17.434417280927" fill="var(--text-muted)" font-family="Arial, sans-serif">95% v1</text>
  <rect x="66.087" y="112.31167535841" width="52.1739" height="24.103891786137" rx="6.115765749489" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1083.4782" y="131.896191330732" font-size="17.434417280927" fill="var(--text-muted)" font-family="Arial, sans-serif">5% v2</text>
  <rect x="40" y="168.052029009937" width="1200" height="112.986992747516" rx="6.115765749489" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="66.087" y="198.181789846522" font-size="20.604218668888" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Phase 2: 25% canary (metrics look good)</text>
  <rect x="66.087" y="210.233735739591" width="782.6087" height="24.103891786137" rx="6.115765749489" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1083.4782" y="229.818251711912" font-size="17.434417280927" fill="var(--text-muted)" font-family="Arial, sans-serif">75% v1</text>
  <rect x="66.087" y="240.363600472261" width="260.8696" height="24.103891786137" rx="6.115765749489" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1083.4782" y="259.948116444583" font-size="17.434417280927" fill="var(--text-muted)" font-family="Arial, sans-serif">25% v2</text>
  <rect x="40" y="296.103954123788" width="1200" height="112.986992747516" rx="6.115765749489" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="66.087" y="326.233714960374" font-size="20.604218668888" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Phase 3: 50% canary</text>
  <rect x="66.087" y="338.285660853442" width="521.7391" height="24.103891786137" rx="6.115765749489" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1083.4782" y="357.870176825763" font-size="17.434417280927" fill="var(--text-muted)" font-family="Arial, sans-serif">50% v1</text>
  <rect x="66.087" y="368.415525586113" width="521.7391" height="24.103891786137" rx="6.115765749489" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1083.4782" y="387.999937662349" font-size="17.434417280927" fill="var(--text-muted)" font-family="Arial, sans-serif">50% v2</text>
  <rect x="40" y="424.155879237639" width="1200" height="97.92206038118" rx="6.115765749489" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="66.087" y="454.285640074225" font-size="20.604218668888" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Phase 4: 100% new version</text>
  <rect x="66.087" y="469.35057244056" width="1043.4782" height="24.103891786137" rx="6.115765749489" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1083.4782" y="488.935088412882" font-size="17.434417280927" fill="var(--text-muted)" font-family="Arial, sans-serif">100% v2</text>
  <rect x="40" y="544.675338168323" width="521.7391" height="75.324661831677" rx="6.115765749489" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="66.087" y="559.740270534658" width="39.1304" height="18.077918839603" rx="6.115765749489" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="118.2609" y="576.311696137627" font-size="17.434417280927" fill="var(--text-muted)" font-family="Arial, sans-serif">v1 (current)</text>
  <rect x="66.087" y="586.857044897977" width="39.1304" height="18.077918839603" rx="6.115765749489" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="118.2609" y="603.428470500946" font-size="17.434417280927" fill="var(--text-muted)" font-family="Arial, sans-serif">v2 (canary)</text>
</svg>

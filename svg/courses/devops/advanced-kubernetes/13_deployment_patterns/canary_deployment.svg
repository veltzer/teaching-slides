  <rect x="47.1174" y="188.2353" width="1083.6998" height="112.9412" rx="7.5294" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.2588" />
  <text x="70.6761" y="218.3529" font-size="19.5764" font-weight="bold" fill="var(--text-dark)">Phase 2: 25% canary (metrics look good)</text>

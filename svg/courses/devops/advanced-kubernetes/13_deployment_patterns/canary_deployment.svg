  <rect x="47.1174" y="316.2353" width="1083.6998" height="112.9412" rx="7.5294" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.2588" />
  <text x="70.6761" y="346.3529" font-size="19.5764" font-weight="bold" fill="var(--text-dark)">Phase 3: 50% canary</text>
  <rect x="70.6761" y="358.3999" width="471.1738" height="24.0941" rx="4.5177" fill="var(--primary-bright)" />
  <text x="989.465" y="377.9765" font-size="16.5647" fill="var(--text-muted)">50% v1</text>
  <rect x="70.6761" y="388.5176" width="471.1738" height="24.0941" rx="4.5177" fill="var(--ok-bright)" />
  <text x="989.465" y="408.094" font-size="16.5647" fill="var(--text-muted)">50% v2</text>
  <rect x="47.1174" y="444.2353" width="1083.6998" height="97.8823" rx="7.5294" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.2588" />
  <text x="70.6761" y="474.3529" font-size="19.5764" font-weight="bold" fill="var(--text-dark)">Phase 4: 100% new version</text>
  <rect x="70.6761" y="489.4117" width="942.3476" height="24.0941" rx="4.5177" fill="var(--ok-bright)" />
  <text x="989.465" y="508.9882" font-size="16.5647" fill="var(--text-muted)">100% v2</text>
  <rect x="47.1174" y="564.7059" width="471.1738" height="75.2941" rx="7.5294" fill="var(--surface-light)" stroke="var(--border-faint)" stroke-width="1.5059" />
  <rect x="70.6761" y="579.7647" width="35.338" height="18.0706" rx="3.0117" fill="var(--primary-bright)" />
  <text x="117.7935" y="596.3294" font-size="16.5647" fill="var(--text-muted)">v1 (current)</text>

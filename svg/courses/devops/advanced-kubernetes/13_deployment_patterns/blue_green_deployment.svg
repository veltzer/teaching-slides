<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="500.000047" height="223.076922994083" rx="7.060180671558" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="289.999855" y="95.769354056189" text-anchor="middle" font-size="31.823059011307" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Blue (current v1)</text>
  <text x="289.999855" y="140.384615239645" text-anchor="middle" font-size="27.276890526995" fill="var(--text-muted)" font-family="Arial, sans-serif">Deployment: web-blue</text>
  <text x="289.999855" y="185.000000269231" text-anchor="middle" font-size="27.276890526995" fill="var(--text-muted)" font-family="Arial, sans-serif">replicas: 3</text>
  <text x="289.999855" y="229.615385298816" text-anchor="middle" font-size="25.003748170899" fill="var(--primary-accent)" font-family="Arial, sans-serif">active</text>
  <rect x="739.999953" y="40" width="500.000047" height="223.076922994083" rx="7.060180671558" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="989.999808" y="95.769354056189" text-anchor="middle" font-size="31.823059011307" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Green (new v2)</text>
  <text x="989.999808" y="140.384615239645" text-anchor="middle" font-size="27.276890526995" fill="var(--text-muted)" font-family="Arial, sans-serif">Deployment: web-green</text>
  <text x="989.999808" y="185.000000269231" text-anchor="middle" font-size="27.276890526995" fill="var(--text-muted)" font-family="Arial, sans-serif">replicas: 3</text>
  <text x="989.999808" y="229.615385298816" text-anchor="middle" font-size="25.003748170899" fill="var(--ok-accent)" font-family="Arial, sans-serif">standby</text>
  <rect x="414.999838" y="352.307691976331" width="449.999986" height="111.538461497041" rx="7.060180671558" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.999944" y="419.23076952071" text-anchor="middle" font-size="31.823059011307" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Service (web)</text>
  <line x1="289.999855" y1="263.076922994083" x2="514.999848" y2="352.307691976331" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="989.999808" y1="263.076922994083" x2="764.999927" y2="352.307691976331" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="9.6969 5.8181" marker-end="url(#arrow)"/>
  <rect x="189.999958" y="508.461538502958" width="899.999972" height="111.538461497041" rx="7.060180671558" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.999944" y="557.538462035503" text-anchor="middle" font-size="27.276890526995" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Switch: Change service selector</text>
  <text x="639.999944" y="597.692430254414" text-anchor="middle" font-size="27.276890526995" fill="var(--text-muted)" font-family="Arial, sans-serif">from version=blue to version=green</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

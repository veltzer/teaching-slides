<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="20.9331" y="19.394" width="1130.3895" height="620.606" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="586.1279" y="77.5758" text-anchor="middle" font-size="31.0303" font-weight="bold" fill="var(--text)">Blue-Green Deployment</text>
  <rect x="83.7326" y="116.3636" width="418.6628" height="193.9394" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="293.0639" y="164.8485" text-anchor="middle" font-size="27.1516" font-weight="bold" fill="var(--primary-accent)">Blue (current v1)</text>
  <text x="293.0639" y="203.6363" text-anchor="middle" font-size="23.2728" fill="var(--text-muted)">Deployment: web-blue</text>
  <text x="293.0639" y="242.4242" text-anchor="middle" font-size="23.2728" fill="var(--text-muted)">replicas: 3</text>
  <text x="293.0639" y="281.2121" text-anchor="middle" font-size="21.3333" fill="var(--primary-accent)">active</text>
  <rect x="669.8605" y="116.3636" width="418.6628" height="193.9394" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="879.1918" y="164.8485" text-anchor="middle" font-size="27.1516" font-weight="bold" fill="var(--ok-accent)">Green (new v2)</text>
  <text x="879.1918" y="203.6363" text-anchor="middle" font-size="23.2728" fill="var(--text-muted)">Deployment: web-green</text>
  <text x="879.1918" y="242.4242" text-anchor="middle" font-size="23.2728" fill="var(--text-muted)">replicas: 3</text>
  <text x="879.1918" y="281.2121" text-anchor="middle" font-size="21.3333" fill="var(--ok-accent)">standby</text>
  <rect x="397.7296" y="387.8787" width="376.7965" height="96.9697" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="586.1279" y="446.0605" text-anchor="middle" font-size="27.1516" font-weight="bold" fill="var(--text)">Service (web)</text>
  <line x1="293.0639" y1="310.303" x2="481.4622" y2="387.8787" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arw)" />
  <line x1="879.1918" y1="310.303" x2="690.7936" y2="387.8787" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="9.6969 5.8181" marker-end="url(#arw2)" />
  <rect x="209.3314" y="523.6363" width="753.593" height="96.9697" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="586.1279" y="566.3029" text-anchor="middle" font-size="23.2728" font-weight="bold" fill="var(--text)">Switch: Change service selector</text>
  <text x="586.1279" y="601.2121" text-anchor="middle" font-size="23.2728" fill="var(--text-muted)">from version=blue to version=green</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 22.8571 10.5882 L 0 21.1765 z" fill="#4a90e2" />
    </marker>
    <marker id="arw2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 22.8571 10.5882 L 0 21.1765 z" fill="#28a745" />
    </marker>
  </defs>
</svg>
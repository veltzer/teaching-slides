<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="540" height="320" rx="5" fill="#f8f9fa" stroke="#4a90e2" stroke-width="2"/>
  <text x="280" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Blue-Green Deployment</text>
  <!-- Blue deployment -->
  <rect x="40" y="60" width="200" height="100" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="140" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a90e2">Blue (current v1)</text>
  <text x="140" y="105" text-anchor="middle" font-size="12" fill="#555">Deployment: web-blue</text>
  <text x="140" y="125" text-anchor="middle" font-size="12" fill="#555">replicas: 3</text>
  <text x="140" y="145" text-anchor="middle" font-size="11" fill="#4a90e2">active</text>
  <!-- Green deployment -->
  <rect x="320" y="60" width="200" height="100" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="420" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#28a745">Green (new v2)</text>
  <text x="420" y="105" text-anchor="middle" font-size="12" fill="#555">Deployment: web-green</text>
  <text x="420" y="125" text-anchor="middle" font-size="12" fill="#555">replicas: 3</text>
  <text x="420" y="145" text-anchor="middle" font-size="11" fill="#28a745">standby</text>
  <!-- Service -->
  <rect x="190" y="200" width="180" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="280" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Service (web)</text>
  <!-- Arrows -->
  <line x1="140" y1="160" x2="230" y2="200" stroke="#4a90e2" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="420" y1="160" x2="330" y2="200" stroke="#28a745" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arw2)"/>
  <!-- Switch label -->
  <rect x="100" y="270" width="360" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="280" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Switch: Change service selector</text>
  <text x="280" y="310" text-anchor="middle" font-size="12" fill="#555">from version=blue to version=green</text>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a90e2"/>
    </marker>
    <marker id="arw2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#28a745"/>
    </marker>
  </defs>
</svg>
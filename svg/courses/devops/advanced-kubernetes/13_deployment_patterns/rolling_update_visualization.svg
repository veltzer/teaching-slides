<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="Arial, sans-serif">
  <text x="290" y="25" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Rolling Update (maxSurge: 1, maxUnavailable: 1, replicas: 4)</text>
  <!-- Step 1 -->
  <rect x="10" y="40" width="560" height="60" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="20" y="58" font-size="12" font-weight="bold" fill="#333">Step 1: Create 1 new (surge), terminate 1 old</text>
  <rect x="20" y="65" width="70" height="25" rx="3" fill="#4a90e2"/><text x="55" y="82" text-anchor="middle" font-size="10" fill="#fff">v1</text>
  <rect x="100" y="65" width="70" height="25" rx="3" fill="#4a90e2"/><text x="135" y="82" text-anchor="middle" font-size="10" fill="#fff">v1</text>
  <rect x="180" y="65" width="70" height="25" rx="3" fill="#4a90e2"/><text x="215" y="82" text-anchor="middle" font-size="10" fill="#fff">v1</text>
  <rect x="260" y="65" width="70" height="25" rx="3" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/><text x="295" y="82" text-anchor="middle" font-size="10" fill="#dc3545">TERM</text>
  <rect x="340" y="65" width="70" height="25" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/><text x="375" y="82" text-anchor="middle" font-size="10" fill="#28a745">v2 INIT</text>
  <!-- Step 2 -->
  <rect x="10" y="110" width="560" height="60" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="20" y="128" font-size="12" font-weight="bold" fill="#333">Step 2: v2 ready, create next, terminate old</text>
  <rect x="20" y="135" width="70" height="25" rx="3" fill="#4a90e2"/><text x="55" y="152" text-anchor="middle" font-size="10" fill="#fff">v1</text>
  <rect x="100" y="135" width="70" height="25" rx="3" fill="#4a90e2"/><text x="135" y="152" text-anchor="middle" font-size="10" fill="#fff">v1</text>
  <rect x="180" y="135" width="70" height="25" rx="3" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/><text x="215" y="152" text-anchor="middle" font-size="10" fill="#dc3545">TERM</text>
  <rect x="260" y="135" width="70" height="25" rx="3" fill="#28a745"/><text x="295" y="152" text-anchor="middle" font-size="10" fill="#fff">v2</text>
  <rect x="340" y="135" width="70" height="25" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/><text x="375" y="152" text-anchor="middle" font-size="10" fill="#28a745">v2 INIT</text>
  <!-- Step 3 -->
  <rect x="10" y="180" width="560" height="60" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="20" y="198" font-size="12" font-weight="bold" fill="#333">Step 3: Continue rolling</text>
  <rect x="20" y="205" width="70" height="25" rx="3" fill="#4a90e2"/><text x="55" y="222" text-anchor="middle" font-size="10" fill="#fff">v1</text>
  <rect x="100" y="205" width="70" height="25" rx="3" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/><text x="135" y="222" text-anchor="middle" font-size="10" fill="#dc3545">TERM</text>
  <rect x="180" y="205" width="70" height="25" rx="3" fill="#28a745"/><text x="215" y="222" text-anchor="middle" font-size="10" fill="#fff">v2</text>
  <rect x="260" y="205" width="70" height="25" rx="3" fill="#28a745"/><text x="295" y="222" text-anchor="middle" font-size="10" fill="#fff">v2</text>
  <rect x="340" y="205" width="70" height="25" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/><text x="375" y="222" text-anchor="middle" font-size="10" fill="#28a745">v2 INIT</text>
  <!-- Step 4 -->
  <rect x="10" y="250" width="560" height="60" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="20" y="268" font-size="12" font-weight="bold" fill="#333">Step 4: Almost done</text>
  <rect x="20" y="275" width="70" height="25" rx="3" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/><text x="55" y="292" text-anchor="middle" font-size="10" fill="#dc3545">TERM</text>
  <rect x="100" y="275" width="70" height="25" rx="3" fill="#28a745"/><text x="135" y="292" text-anchor="middle" font-size="10" fill="#fff">v2</text>
  <rect x="180" y="275" width="70" height="25" rx="3" fill="#28a745"/><text x="215" y="292" text-anchor="middle" font-size="10" fill="#fff">v2</text>
  <rect x="260" y="275" width="70" height="25" rx="3" fill="#28a745"/><text x="295" y="292" text-anchor="middle" font-size="10" fill="#fff">v2</text>
  <rect x="340" y="275" width="70" height="25" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/><text x="375" y="292" text-anchor="middle" font-size="10" fill="#28a745">v2 INIT</text>
  <!-- Step 5 -->
  <rect x="10" y="320" width="560" height="60" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="20" y="338" font-size="12" font-weight="bold" fill="#333">Step 5: Final state</text>
  <rect x="20" y="345" width="70" height="25" rx="3" fill="#28a745"/><text x="55" y="362" text-anchor="middle" font-size="10" fill="#fff">v2</text>
  <rect x="100" y="345" width="70" height="25" rx="3" fill="#28a745"/><text x="135" y="362" text-anchor="middle" font-size="10" fill="#fff">v2</text>
  <rect x="180" y="345" width="70" height="25" rx="3" fill="#28a745"/><text x="215" y="362" text-anchor="middle" font-size="10" fill="#fff">v2</text>
  <rect x="260" y="345" width="70" height="25" rx="3" fill="#28a745"/><text x="295" y="362" text-anchor="middle" font-size="10" fill="#fff">v2</text>
  <!-- Legend -->
  <rect x="420" y="330" width="140" height="50" rx="5" fill="#f8f9fa" stroke="#ccc" stroke-width="1"/>
  <rect x="430" y="340" width="12" height="12" rx="2" fill="#4a90e2"/><text x="447" y="350" font-size="10" fill="#555">v1 (old)</text>
  <rect x="430" y="356" width="12" height="12" rx="2" fill="#28a745"/><text x="447" y="366" font-size="10" fill="#555">v2 (new)</text>
</svg>
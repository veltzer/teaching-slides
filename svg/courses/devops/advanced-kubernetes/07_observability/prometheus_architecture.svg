<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 7,0" fill="#555" />
    </marker>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 7,0" fill="#555" />
    </marker>
  </defs>
  <rect x="40" y="40" width="364.7059" height="110.8824" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="221.1765" y="86.0588" text-anchor="middle" font-size="25.3503" fill="var(--text)">App Pod</text>
  <text x="221.1765" y="118.4706" text-anchor="middle" font-size="21.4502" fill="var(--text-muted)">/metrics</text>
  <rect x="557.647" y="40" width="364.7059" height="110.8824" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="738.8236" y="86.0588" text-anchor="middle" font-size="25.3503" fill="var(--text)">Node Exporter</text>
  <line x1="557.647" y1="94.5882" x2="404.7058" y2="94.5882" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <line x1="221.1765" y1="150.8824" x2="221.1765" y2="270.2941" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="738.8236" y1="150.8824" x2="738.8236" y2="270.2941" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="221.1765" y1="270.2941" x2="510.5883" y2="270.2941" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="738.8236" y1="270.2941" x2="510.5883" y2="270.2941" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="510.5883" y1="270.2941" x2="510.5883" y2="278.8235" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="275.2941" y="278.8235" width="458.8236" height="170.5882" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="503.5295" y="321.4706" text-anchor="middle" font-size="25.3503" fill="var(--text)">Prometheus Server</text>
  <rect x="322.3529" y="338.5295" width="364.7059" height="68.2353" rx="6" fill="var(--bg)" stroke="var(--text-muted)" stroke-width="2.6667" />
  <text x="503.5295" y="381.1765" text-anchor="middle" font-size="21.4502" fill="var(--text)">TSDB (Time Series DB)</text>
  <line x1="734.1177" y1="364.1176" x2="828.2353" y2="364.1176" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="828.2353" y="278.8235" width="411.7647" height="170.5882" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1032.9413" y="321.4706" text-anchor="middle" font-size="25.3503" fill="var(--text)">Alertmanager</text>
  <text x="1032.9413" y="360.7059" text-anchor="middle" font-size="21.4502" fill="var(--text-muted)">→ Slack</text>
  <text x="1032.9413" y="388" text-anchor="middle" font-size="21.4502" fill="var(--text-muted)">→ PagerDuty</text>
  <text x="1032.9413" y="415.2941" text-anchor="middle" font-size="21.4502" fill="var(--text-muted)">→ Email</text>
  <line x1="503.5295" y1="449.4118" x2="503.5295" y2="509.1176" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="275.2941" y="509.1176" width="458.8236" height="110.8824" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="503.5295" y="555.1764" text-anchor="middle" font-size="27.3003" fill="var(--text)" font-weight="bold">Grafana</text>
  <text x="503.5295" y="589.2941" text-anchor="middle" font-size="21.4502" fill="var(--text-muted)">(Dashboards)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 7,0" fill="#555" />
    </marker>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 7,0" fill="#555" />
    </marker>
  </defs>
  <rect x="37.5309" y="35.5555" width="290.8642" height="115.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="182.0247" y="83.5555" text-anchor="middle" font-size="23.1111" fill="var(--text)">App Pod</text>
  <text x="182.0247" y="117.3333" text-anchor="middle" font-size="19.5555" fill="var(--text-muted)">/metrics</text>
  <rect x="450.3703" y="35.5555" width="290.8642" height="115.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="594.8642" y="83.5555" text-anchor="middle" font-size="23.1111" fill="var(--text)">Node Exporter</text>
  <line x1="450.3703" y1="92.4444" x2="328.395" y2="92.4444" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <line x1="182.0247" y1="151.1111" x2="182.0247" y2="275.5555" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="594.8642" y1="151.1111" x2="594.8642" y2="275.5555" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="182.0247" y1="275.5555" x2="412.8395" y2="275.5555" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="594.8642" y1="275.5555" x2="412.8395" y2="275.5555" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="412.8395" y1="275.5555" x2="412.8395" y2="284.4444" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="225.1852" y="284.4444" width="365.9259" height="177.7778" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="407.2099" y="328.8889" text-anchor="middle" font-size="23.1111" fill="var(--text)">Prometheus Server</text>
  <rect x="262.716" y="346.6667" width="290.8642" height="71.1111" rx="6" fill="var(--bg)" stroke="var(--text-muted)" stroke-width="2.6667" />
  <text x="407.2099" y="391.1111" text-anchor="middle" font-size="19.5555" fill="var(--text)">TSDB (Time Series DB)</text>
  <line x1="591.1111" y1="373.3333" x2="666.1728" y2="373.3333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="666.1728" y="284.4444" width="328.395" height="177.7778" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="829.4321" y="328.8889" text-anchor="middle" font-size="23.1111" fill="var(--text)">Alertmanager</text>
  <text x="829.4321" y="369.7778" text-anchor="middle" font-size="19.5555" fill="var(--text-muted)">→ Slack</text>
  <text x="829.4321" y="398.2222" text-anchor="middle" font-size="19.5555" fill="var(--text-muted)">→ PagerDuty</text>
  <text x="829.4321" y="426.6666" text-anchor="middle" font-size="19.5555" fill="var(--text-muted)">→ Email</text>
  <line x1="407.2099" y1="462.2222" x2="407.2099" y2="524.4444" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="225.1852" y="524.4444" width="365.9259" height="115.5556" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="407.2099" y="572.4444" text-anchor="middle" font-size="24.8889" fill="var(--text)" font-weight="bold">Grafana</text>
  <text x="407.2099" y="608" text-anchor="middle" font-size="19.5555" fill="var(--text-muted)">(Dashboards)</text>
</svg>
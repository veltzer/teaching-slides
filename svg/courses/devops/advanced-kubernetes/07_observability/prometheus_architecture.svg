<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <rect x="40" y="40" width="364.7059" height="110.8824" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="221.1765" y="86.0588" text-anchor="middle" font-size="25.3503" fill="var(--text)" font-family="Arial, sans-serif">App Pod</text>
  <text x="221.1765" y="118.4706" text-anchor="middle" font-size="21.4502" fill="var(--text-muted)" font-family="Arial, sans-serif">/metrics</text>
  <rect x="557.647" y="40" width="364.7059" height="110.8824" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="738.8236" y="86.0588" text-anchor="middle" font-size="25.3503" fill="var(--text)" font-family="Arial, sans-serif">Node Exporter</text>
  <line x1="557.647" y1="94.5882" x2="404.7058" y2="94.5882" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="221.1765" y1="150.8824" x2="221.1765" y2="270.2941" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="738.8236" y1="150.8824" x2="738.8236" y2="270.2941" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="221.1765" y1="270.2941" x2="510.5883" y2="270.2941" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="738.8236" y1="270.2941" x2="510.5883" y2="270.2941" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="510.5883" y1="270.2941" x2="510.5883" y2="278.8235" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="275.2941" y="278.8235" width="458.8236" height="170.5882" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="503.5295" y="321.4706" text-anchor="middle" font-size="25.3503" fill="var(--text)" font-family="Arial, sans-serif">Prometheus Server</text>
  <rect x="322.3529" y="338.5295" width="364.7059" height="68.2353" rx="6" fill="var(--bg)" stroke="var(--text-muted)" stroke-width="2.6667" />
  <text x="503.5295" y="381.1765" text-anchor="middle" font-size="21.4502" fill="var(--text)" font-family="Arial, sans-serif">TSDB (Time Series DB)</text>
  <line x1="734.1177" y1="364.1176" x2="828.2353" y2="364.1176" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="828.2353" y="278.8235" width="411.7647" height="170.5882" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1032.9413" y="321.4706" text-anchor="middle" font-size="25.3503" fill="var(--text)" font-family="Arial, sans-serif">Alertmanager</text>
  <text x="1032.9413" y="360.7059" text-anchor="middle" font-size="21.4502" fill="var(--text-muted)" font-family="Arial, sans-serif">→ Slack</text>
  <text x="1032.9413" y="388" text-anchor="middle" font-size="21.4502" fill="var(--text-muted)" font-family="Arial, sans-serif">→ PagerDuty</text>
  <text x="1032.9413" y="415.2941" text-anchor="middle" font-size="21.4502" fill="var(--text-muted)" font-family="Arial, sans-serif">→ Email</text>
  <line x1="503.5295" y1="449.4118" x2="503.5295" y2="509.1176" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="275.2941" y="509.1176" width="458.8236" height="110.8824" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="503.5295" y="555.1764" text-anchor="middle" font-size="27.3003" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Grafana</text>
  <text x="503.5295" y="589.2941" text-anchor="middle" font-size="21.4502" fill="var(--text-muted)" font-family="Arial, sans-serif">(Dashboards)</text>
</svg>
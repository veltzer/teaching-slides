<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="766.3158" y="40" text-anchor="middle" font-size="29.9106" font-weight="bold" fill="var(--text)">How ReplicaSets Handle Failures</text>
  <text x="40" y="95.6164" font-size="26.1718" font-weight="bold" fill="var(--primary-accent)">T0: 3 replicas running</text>
  <rect x="103.1578" y="111.5069" width="315.7894" height="79.4521" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="261.0525" y="159.1781" text-anchor="middle" font-size="24.3023" fill="var(--text)">Pod1</text>
  <rect x="513.6842" y="111.5069" width="315.7894" height="79.4521" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="671.5789" y="159.1781" text-anchor="middle" font-size="24.3023" fill="var(--text)">Pod2</text>
  <rect x="924.2106" y="111.5069" width="315.7894" height="79.4521" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1082.1053" y="159.1781" text-anchor="middle" font-size="24.3023" fill="var(--text)">Pod3</text>
  <text x="40" y="254.5206" font-size="26.1718" font-weight="bold" fill="var(--danger-accent)">T1: Pod2 crashes</text>
  <rect x="103.1578" y="270.411" width="315.7894" height="79.4521" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="261.0525" y="318.0822" text-anchor="middle" font-size="24.3023" fill="var(--text)">Pod1</text>
  <rect x="513.6842" y="270.411" width="315.7894" height="79.4521" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="671.5789" y="318.0822" text-anchor="middle" font-size="33.6493" fill="var(--danger-accent)">XX</text>
  <rect x="924.2106" y="270.411" width="315.7894" height="79.4521" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1082.1053" y="318.0822" text-anchor="middle" font-size="24.3023" fill="var(--text)">Pod3</text>
  <text x="40" y="413.4247" font-size="26.1718" font-weight="bold" fill="var(--ok-accent)">T2: ReplicaSet creates Pod4</text>
  <rect x="103.1578" y="429.3151" width="315.7894" height="79.4521" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="261.0525" y="476.9863" text-anchor="middle" font-size="24.3023" fill="var(--text)">Pod1</text>
  <rect x="513.6842" y="429.3151" width="315.7894" height="79.4521" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="671.5789" y="476.9863" text-anchor="middle" font-size="24.3023" fill="var(--primary-accent)">Pod4</text>
  <rect x="924.2106" y="429.3151" width="315.7894" height="79.4521" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1082.1053" y="476.9863" text-anchor="middle" font-size="24.3023" fill="var(--text)">Pod3</text>
  <text x="766.3158" y="588.2192" text-anchor="middle" font-size="22.4329" fill="var(--text-muted)">ReplicaSet controller detects desired != actual</text>
  <text x="766.3158" y="620" text-anchor="middle" font-size="22.4329" fill="var(--text-muted)">and automatically creates a replacement pod</text>
</svg>
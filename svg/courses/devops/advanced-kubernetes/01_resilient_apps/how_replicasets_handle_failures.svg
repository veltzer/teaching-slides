<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="766.3158" y="40" text-anchor="middle" font-size="29.9106" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">How ReplicaSets Handle Failures</text>
  <text x="40" y="95.6164" font-size="26.1718" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">T0: 3 replicas running</text>
  <rect x="103.1578" y="111.5069" width="315.7894" height="79.4521" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="261.0525" y="159.1781" text-anchor="middle" font-size="24.3023" fill="var(--text)" font-family="Arial, sans-serif">Pod1</text>
  <rect x="513.6842" y="111.5069" width="315.7894" height="79.4521" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="671.5789" y="159.1781" text-anchor="middle" font-size="24.3023" fill="var(--text)" font-family="Arial, sans-serif">Pod2</text>
  <rect x="924.2106" y="111.5069" width="315.7894" height="79.4521" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1082.1053" y="159.1781" text-anchor="middle" font-size="24.3023" fill="var(--text)" font-family="Arial, sans-serif">Pod3</text>
  <text x="40" y="254.5206" font-size="26.1718" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">T1: Pod2 crashes</text>
  <rect x="103.1578" y="270.411" width="315.7894" height="79.4521" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="261.0525" y="318.0822" text-anchor="middle" font-size="24.3023" fill="var(--text)" font-family="Arial, sans-serif">Pod1</text>
  <rect x="513.6842" y="270.411" width="315.7894" height="79.4521" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="671.5789" y="318.0822" text-anchor="middle" font-size="33.6493" fill="var(--danger-accent)" font-family="Arial, sans-serif">XX</text>
  <rect x="924.2106" y="270.411" width="315.7894" height="79.4521" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1082.1053" y="318.0822" text-anchor="middle" font-size="24.3023" fill="var(--text)" font-family="Arial, sans-serif">Pod3</text>
  <text x="40" y="413.4247" font-size="26.1718" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">T2: ReplicaSet creates Pod4</text>
  <rect x="103.1578" y="429.3151" width="315.7894" height="79.4521" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="261.0525" y="476.9863" text-anchor="middle" font-size="24.3023" fill="var(--text)" font-family="Arial, sans-serif">Pod1</text>
  <rect x="513.6842" y="429.3151" width="315.7894" height="79.4521" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="671.5789" y="476.9863" text-anchor="middle" font-size="24.3023" fill="var(--primary-accent)" font-family="Arial, sans-serif">Pod4</text>
  <rect x="924.2106" y="429.3151" width="315.7894" height="79.4521" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1082.1053" y="476.9863" text-anchor="middle" font-size="24.3023" fill="var(--text)" font-family="Arial, sans-serif">Pod3</text>
  <text x="766.3158" y="588.2192" text-anchor="middle" font-size="22.4329" fill="var(--text-muted)" font-family="Arial, sans-serif">ReplicaSet controller detects desired != actual</text>
  <text x="766.3158" y="620" text-anchor="middle" font-size="22.4329" fill="var(--text-muted)" font-family="Arial, sans-serif">and automatically creates a replacement pod</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="22.5434" y="19.394" width="1127.169" height="620.606" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="586.1279" y="77.5758" text-anchor="middle" font-size="31.0303" font-weight="bold" fill="var(--primary-accent)">Resilient Application</text>
  <rect x="67.6302" y="106.6667" width="473.411" height="106.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="304.3356" y="151.2727" text-anchor="middle" font-size="25.2121" font-weight="bold" fill="var(--text)">ReplicaSet</text>
  <text x="304.3356" y="190.0606" text-anchor="middle" font-size="23.2728" fill="var(--text-muted)">(3+ pods)</text>
  <rect x="608.6713" y="106.6667" width="495.9544" height="106.6667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="856.6484" y="151.2727" text-anchor="middle" font-size="25.2121" font-weight="bold" fill="var(--text)">Resource Management</text>
  <text x="856.6484" y="190.0606" text-anchor="middle" font-size="23.2728" fill="var(--text-muted)">requests + limits</text>
  <rect x="67.6302" y="242.4242" width="473.411" height="106.6667" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="304.3356" y="287.0303" text-anchor="middle" font-size="25.2121" font-weight="bold" fill="var(--text)">Probes</text>
  <text x="304.3356" y="325.8181" text-anchor="middle" font-size="23.2728" fill="var(--text-muted)">L + R + S</text>
  <rect x="608.6713" y="242.4242" width="495.9544" height="106.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="856.6484" y="287.0303" text-anchor="middle" font-size="25.2121" font-weight="bold" fill="var(--text)">PodDisruptionBudget</text>
  <text x="856.6484" y="325.8181" text-anchor="middle" font-size="23.2728" fill="var(--text-muted)">minAvailable: 2</text>
  <rect x="67.6302" y="378.1818" width="473.411" height="106.6667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="304.3356" y="422.7879" text-anchor="middle" font-size="25.2121" font-weight="bold" fill="var(--text)">Anti-Affinity</text>
  <text x="304.3356" y="461.5757" text-anchor="middle" font-size="23.2728" fill="var(--text-muted)">spread across nodes</text>
  <rect x="608.6713" y="378.1818" width="495.9544" height="106.6667" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="856.6484" y="422.7879" text-anchor="middle" font-size="25.2121" font-weight="bold" fill="var(--text)">Topology Spread</text>
  <text x="856.6484" y="461.5757" text-anchor="middle" font-size="23.2728" fill="var(--text-muted)">Constraints</text>
</svg>
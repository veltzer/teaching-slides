<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="39.834571" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Resilient Application</text>
  <rect x="40" y="81.428571" width="547.826087" height="151.904762" rx="7.721873" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="313.912935" y="144.952229" text-anchor="middle" font-size="32.36546" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">ReplicaSet</text>
  <text x="313.912935" y="200.190476" text-anchor="middle" font-size="29.875928" fill="var(--text-muted)" font-family="Arial, sans-serif">(3+ pods)</text>
  <rect x="666.086957" y="81.428571" width="573.913043" height="151.904762" rx="7.721873" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="953.04337" y="144.952229" text-anchor="middle" font-size="32.36546" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Resource Management</text>
  <text x="953.04337" y="200.190476" text-anchor="middle" font-size="29.875928" fill="var(--text-muted)" font-family="Arial, sans-serif">requests + limits</text>
  <rect x="40" y="274.761752" width="547.826087" height="151.904762" rx="7.721873" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="313.912935" y="338.285714" text-anchor="middle" font-size="32.36546" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Probes</text>
  <text x="313.912935" y="393.523657" text-anchor="middle" font-size="29.875928" fill="var(--text-muted)" font-family="Arial, sans-serif">L + R + S</text>
  <rect x="666.086957" y="274.761752" width="573.913043" height="151.904762" rx="7.721873" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="953.04337" y="338.285714" text-anchor="middle" font-size="32.36546" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">PodDisruptionBudget</text>
  <text x="953.04337" y="393.523657" text-anchor="middle" font-size="29.875928" fill="var(--text-muted)" font-family="Arial, sans-serif">minAvailable: 2</text>
  <rect x="40" y="468.095238" width="547.826087" height="151.904762" rx="7.721873" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="313.912935" y="531.619048" text-anchor="middle" font-size="32.36546" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Anti-Affinity</text>
  <text x="313.912935" y="586.85699" text-anchor="middle" font-size="29.875928" fill="var(--text-muted)" font-family="Arial, sans-serif">spread across nodes</text>
  <rect x="666.086957" y="468.095238" width="573.913043" height="151.904762" rx="7.721873" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="953.04337" y="531.619048" text-anchor="middle" font-size="32.36546" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Topology Spread</text>
  <text x="953.04337" y="586.85699" text-anchor="middle" font-size="29.875928" fill="var(--text-muted)" font-family="Arial, sans-serif">Constraints</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <text x="639.999943589751" y="40" text-anchor="middle" font-size="49.51194864368" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Node (4 CPU)</text>
  <rect x="40" y="89.014182701829" width="307.692299013808" height="285.915379141061" rx="8.022178315697" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="193.846205917153" y="203.380397738527" text-anchor="middle" font-size="49.51194864368" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">250m</text>
  <text x="193.846205917153" y="293.239521424308" text-anchor="middle" font-size="42.438794022729" fill="var(--text-muted)" font-family="Arial, sans-serif">Pod A</text>
  <rect x="409.230803944769" y="89.014182701829" width="338.461495069039" height="285.915379141061" rx="8.022178315697" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="578.461551479288" y="203.380397738527" text-anchor="middle" font-size="49.51194864368" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">500m</text>
  <text x="578.461551479288" y="293.239521424308" text-anchor="middle" font-size="42.438794022729" fill="var(--text-muted)" font-family="Arial, sans-serif">Pod B</text>
  <rect x="809.230803944769" y="89.014182701829" width="430.769196055231" height="285.915379141061" rx="8.022178315697" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1024.615401972384" y="203.380397738527" text-anchor="middle" font-size="49.51194864368" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">1000m</text>
  <text x="1024.615401972384" y="293.239521424308" text-anchor="middle" font-size="42.438794022729" fill="var(--text-muted)" font-family="Arial, sans-serif">Pod C</text>
  <rect x="40" y="456.619760712154" width="1199.999887179502" height="163.380239287846" rx="8.022178315697" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="639.999943589751" y="558.732350848054" text-anchor="middle" font-size="45.975371333204" fill="var(--text)" font-family="Arial, sans-serif">Remaining: 2250m allocatable</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="626.0465" y="40" text-anchor="middle" font-size="42.8186" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">What Makes an App Resilient</text>
  <rect x="40" y="78.6667" width="362.7907" height="154.6667" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="221.3954" y="150.8444" text-anchor="middle" font-size="32.1139" fill="var(--text)" font-family="Arial, sans-serif">Pod A-1</text>
  <text x="221.3954" y="197.2445" text-anchor="middle" font-size="29.4377" fill="var(--ok-accent)" font-family="Arial, sans-serif">(healthy)</text>
  <rect x="458.6047" y="78.6667" width="362.7907" height="154.6667" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="150.8444" text-anchor="middle" font-size="32.1139" fill="var(--text)" font-family="Arial, sans-serif">Pod A-2</text>
  <text x="640" y="197.2445" text-anchor="middle" font-size="29.4377" fill="var(--ok-accent)" font-family="Arial, sans-serif">(healthy)</text>
  <rect x="877.2093" y="78.6667" width="362.7907" height="154.6667" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1058.6047" y="150.8444" text-anchor="middle" font-size="32.1139" fill="var(--text)" font-family="Arial, sans-serif">Pod A-3</text>
  <text x="1058.6047" y="197.2445" text-anchor="middle" font-size="29.4377" fill="var(--ok-accent)" font-family="Arial, sans-serif">(healthy)</text>
  <line x1="221.3954" y1="233.3334" x2="640" y2="336.4444" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="640" y1="233.3334" x2="640" y2="336.4444" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="1058.6047" y1="233.3334" x2="640" y2="336.4444" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="444.6511" y="336.4444" width="390.6976" height="128.8889" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="413.7779" text-anchor="middle" font-size="37.4662" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Service</text>
  <text x="640" y="568.4445" text-anchor="middle" font-size="32.1139" fill="var(--text-muted)" font-family="Arial, sans-serif">Multiple healthy pods behind a Service</text>
  <text x="640" y="620" text-anchor="middle" font-size="32.1139" fill="var(--text-muted)" font-family="Arial, sans-serif">provide high availability</text>
</svg>

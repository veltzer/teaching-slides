<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="362.7907" height="165.714331632656" rx="6.210590225294" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="221.3954" y="117.3332547619" text-anchor="middle" font-size="33.241045572678" fill="var(--text)" font-family="Arial, sans-serif">Pod A-1</text>
  <text x="221.3954" y="167.047650680274" text-anchor="middle" font-size="30.470915312523" fill="var(--ok-accent)" font-family="Arial, sans-serif">(healthy)</text>
  <rect x="458.6047" y="40" width="362.7907" height="165.714331632656" rx="6.210590225294" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="117.3332547619" text-anchor="middle" font-size="33.241045572678" fill="var(--text)" font-family="Arial, sans-serif">Pod A-2</text>
  <text x="640" y="167.047650680274" text-anchor="middle" font-size="30.470915312523" fill="var(--ok-accent)" font-family="Arial, sans-serif">(healthy)</text>
  <rect x="877.2093" y="40" width="362.7907" height="165.714331632656" rx="6.210590225294" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1058.6047" y="117.3332547619" text-anchor="middle" font-size="33.241045572678" fill="var(--text)" font-family="Arial, sans-serif">Pod A-3</text>
  <text x="1058.6047" y="167.047650680274" text-anchor="middle" font-size="30.470915312523" fill="var(--ok-accent)" font-family="Arial, sans-serif">(healthy)</text>
  <line x1="221.3954" y1="205.714331632656" x2="640" y2="316.190409863941" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="640" y1="205.714331632656" x2="640" y2="316.190409863941" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="1058.6047" y1="205.714331632656" x2="640" y2="316.190409863941" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="444.6511" y="316.190409863941" width="390.6976" height="138.095258503403" rx="6.210590225294" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="399.047736394565" text-anchor="middle" font-size="38.781202583151" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Service</text>
  <text x="640" y="564.761960884357" text-anchor="middle" font-size="33.241045572678" fill="var(--text-muted)" font-family="Arial, sans-serif">Multiple healthy pods behind a Service</text>
  <text x="640" y="620" text-anchor="middle" font-size="33.241045572678" fill="var(--text-muted)" font-family="Arial, sans-serif">provide high availability</text>
</svg>

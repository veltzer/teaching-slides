<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" font-family="Arial, sans-serif">
  <text x="250" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">What Makes an App Resilient</text>
  <rect x="40" y="40" width="130" height="60" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="105" y="68" text-anchor="middle" font-size="12" fill="#333">Pod A-1</text>
  <text x="105" y="86" text-anchor="middle" font-size="11" fill="#28a745">(healthy)</text>
  <rect x="190" y="40" width="130" height="60" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="255" y="68" text-anchor="middle" font-size="12" fill="#333">Pod A-2</text>
  <text x="255" y="86" text-anchor="middle" font-size="11" fill="#28a745">(healthy)</text>
  <rect x="340" y="40" width="130" height="60" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="405" y="68" text-anchor="middle" font-size="12" fill="#333">Pod A-3</text>
  <text x="405" y="86" text-anchor="middle" font-size="11" fill="#28a745">(healthy)</text>
  <line x1="105" y1="100" x2="255" y2="140" stroke="#4a90e2" stroke-width="2"/>
  <line x1="255" y1="100" x2="255" y2="140" stroke="#4a90e2" stroke-width="2"/>
  <line x1="405" y1="100" x2="255" y2="140" stroke="#4a90e2" stroke-width="2"/>
  <rect x="185" y="140" width="140" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="255" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a90e2">Service</text>
  <text x="255" y="230" text-anchor="middle" font-size="12" fill="#666">Multiple healthy pods behind a Service</text>
  <text x="255" y="250" text-anchor="middle" font-size="12" fill="#666">provide high availability</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="61.4285" y="40" width="492.8571" height="76.603769597722" rx="6.167473864494" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="307.8571" y="90.339665304377" text-anchor="middle" font-size="24.242592310397" fill="var(--text)" font-family="Arial, sans-serif">Is the container running?</text>
  <line x1="307.8571" y1="116.603875258094" x2="189.9999" y2="193.207539195444" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="200.7142" y="162.566031356355" font-size="20.513018073306" fill="var(--ok-accent)" font-family="Arial, sans-serif">YES</text>
  <line x1="307.8571" y1="116.603875258094" x2="875.7142" y2="193.207539195444" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="618.5713" y="162.566031356355" font-size="20.513018073306" fill="var(--danger-accent)" font-family="Arial, sans-serif">NO</text>
  <rect x="40" y="193.207539195444" width="428.5714" height="76.603769597722" rx="6.167473864494" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="254.2857" y="243.54720449982" text-anchor="middle" font-size="22.377856587467" fill="var(--text)" font-family="Arial, sans-serif">Liveness Probe passes</text>
  <line x1="254.2857" y1="269.811308793165" x2="147.1428" y2="346.415184051259" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="254.2857" y1="269.811308793165" x2="532.8571" y2="346.415184051259" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="346.415184051259" width="385.7143" height="76.603769597722" rx="6.167473864494" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="232.8571" y="394.566094752578" text-anchor="middle" font-size="20.513018073306" fill="var(--text)" font-family="Arial, sans-serif">Is it ready for traffic?</text>
  <line x1="147.1428" y1="423.018953648981" x2="147.1428" y2="510.565967960132" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="114.9999" y="477.735916838729" font-size="18.648179559145" fill="var(--ok-accent)" font-family="Arial, sans-serif">YES</text>
  <line x1="297.1429" y1="423.018953648981" x2="297.1429" y2="510.565967960132" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="318.5714" y="477.735916838729" font-size="18.648179559145" fill="var(--danger-accent)" font-family="Arial, sans-serif">NO</text>
  <rect x="40" y="510.565967960132" width="214.2858" height="109.434032039868" rx="6.167473864494" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="147.1428" y="556.528335379137" text-anchor="middle" font-size="18.648179559145" fill="var(--text)" font-family="Arial, sans-serif">Readiness</text>
  <text x="147.1428" y="591.547246763969" text-anchor="middle" font-size="18.648179559145" fill="var(--ok-accent)" font-family="Arial, sans-serif">Pod gets traffic</text>
  <rect x="275.7143" y="510.565967960132" width="257.1429" height="109.434032039868" rx="6.167473864494" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="404.2857" y="556.528335379137" text-anchor="middle" font-size="18.648179559145" fill="var(--text)" font-family="Arial, sans-serif">Readiness fails</text>
  <text x="404.2857" y="591.547246763969" text-anchor="middle" font-size="18.648179559145" fill="var(--danger-accent)" font-family="Arial, sans-serif">Removed from SVC</text>
  <rect x="468.5714" y="346.415184051259" width="300" height="109.434032039868" rx="6.167473864494" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="618.5713" y="390.188691206835" text-anchor="middle" font-size="20.513018073306" fill="var(--text)" font-family="Arial, sans-serif">Liveness fails</text>
  <text x="618.5713" y="429.58500613741" text-anchor="middle" font-size="18.648179559145" fill="var(--danger-accent)" font-family="Arial, sans-serif">Kill &amp; restart</text>
  <rect x="747.1428" y="193.207539195444" width="471.4285" height="76.603769597722" rx="6.167473864494" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="982.857" y="243.54720449982" text-anchor="middle" font-size="22.377856587467" fill="var(--text)" font-family="Arial, sans-serif">Container is starting</text>
  <line x1="875.7142" y1="269.811308793165" x2="875.7142" y2="346.415184051259" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1090" y1="269.811308793165" x2="1090" y2="346.415184051259" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="747.1428" y="346.415184051259" width="257.1429" height="98.490576005695" rx="6.167473864494" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="875.7142" y="390.188691206835" text-anchor="middle" font-size="18.648179559145" fill="var(--text)" font-family="Arial, sans-serif">Startup passes</text>
  <text x="875.7142" y="423.018953648981" text-anchor="middle" font-size="18.648179559145" fill="var(--ok-accent)" font-family="Arial, sans-serif">Enable probes</text>
  <rect x="1025.7142" y="346.415184051259" width="214.2858" height="98.490576005695" rx="6.167473864494" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1132.8571" y="390.188691206835" text-anchor="middle" font-size="18.648179559145" fill="var(--text)" font-family="Arial, sans-serif">Startup fails</text>
  <text x="1132.8571" y="423.018953648981" text-anchor="middle" font-size="18.648179559145" fill="var(--danger-accent)" font-family="Arial, sans-serif">Kill container</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="29.0269" font-weight="bold" fill="var(--text)">Probe Decision Tree</text>
  <rect x="61.4285" y="71.0714" width="492.8571" height="72.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="307.8571" y="118.7143" text-anchor="middle" font-size="23.5843" fill="var(--text)">Is the container running?</text>
  <line x1="307.8571" y1="143.5715" x2="189.9999" y2="216.0714" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="200.7142" y="187.0714" font-size="19.956" fill="var(--ok-accent)">YES</text>
  <line x1="307.8571" y1="143.5715" x2="875.7142" y2="216.0714" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="618.5713" y="187.0714" font-size="19.956" fill="var(--danger-accent)">NO</text>
  <rect x="40" y="216.0714" width="428.5714" height="72.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="254.2857" y="263.7143" text-anchor="middle" font-size="21.7702" fill="var(--text)">Liveness Probe passes</text>
  <line x1="254.2857" y1="288.5714" x2="147.1428" y2="361.0715" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="254.2857" y1="288.5714" x2="532.8571" y2="361.0715" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="361.0715" width="385.7143" height="72.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="232.8571" y="406.6429" text-anchor="middle" font-size="19.956" fill="var(--text)">Is it ready for traffic?</text>
  <line x1="147.1428" y1="433.5715" x2="147.1428" y2="516.4285" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="114.9999" y="485.3572" font-size="18.1418" fill="var(--ok-accent)">YES</text>
  <line x1="297.1429" y1="433.5715" x2="297.1429" y2="516.4285" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="318.5714" y="485.3572" font-size="18.1418" fill="var(--danger-accent)">NO</text>
  <rect x="40" y="516.4285" width="214.2858" height="103.5715" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="147.1428" y="559.9286" text-anchor="middle" font-size="18.1418" fill="var(--text)">Readiness</text>
  <text x="147.1428" y="593.0715" text-anchor="middle" font-size="18.1418" fill="var(--ok-accent)">Pod gets traffic</text>
  <rect x="275.7143" y="516.4285" width="257.1429" height="103.5715" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="404.2857" y="559.9286" text-anchor="middle" font-size="18.1418" fill="var(--text)">Readiness fails</text>
  <text x="404.2857" y="593.0715" text-anchor="middle" font-size="18.1418" fill="var(--danger-accent)">Removed from SVC</text>
  <rect x="468.5714" y="361.0715" width="300" height="103.5715" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="618.5713" y="402.5" text-anchor="middle" font-size="19.956" fill="var(--text)">Liveness fails</text>
  <text x="618.5713" y="439.7858" text-anchor="middle" font-size="18.1418" fill="var(--danger-accent)">Kill &amp; restart</text>
  <rect x="747.1428" y="216.0714" width="471.4285" height="72.5" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="982.857" y="263.7143" text-anchor="middle" font-size="21.7702" fill="var(--text)">Container is starting</text>
  <line x1="875.7142" y1="288.5714" x2="875.7142" y2="361.0715" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1090" y1="288.5714" x2="1090" y2="361.0715" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="747.1428" y="361.0715" width="257.1429" height="93.2143" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="875.7142" y="402.5" text-anchor="middle" font-size="18.1418" fill="var(--text)">Startup passes</text>
  <text x="875.7142" y="433.5715" text-anchor="middle" font-size="18.1418" fill="var(--ok-accent)">Enable probes</text>
  <rect x="1025.7142" y="361.0715" width="214.2858" height="93.2143" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1132.8571" y="402.5" text-anchor="middle" font-size="18.1418" fill="var(--text)">Startup fails</text>
  <text x="1132.8571" y="433.5715" text-anchor="middle" font-size="18.1418" fill="var(--danger-accent)">Kill container</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="Arial, sans-serif">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a90e2"/></marker></defs>
  <text x="290" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Probe Decision Tree</text>
  <rect x="20" y="40" width="230" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="135" y="63" text-anchor="middle" font-size="13" fill="#333">Is the container running?</text>
  <line x1="135" y1="75" x2="80" y2="110" stroke="#28a745" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="85" y="96" font-size="11" fill="#28a745">YES</text>
  <line x1="135" y1="75" x2="400" y2="110" stroke="#dc3545" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="280" y="96" font-size="11" fill="#dc3545">NO</text>
  <rect x="10" y="110" width="200" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="110" y="133" text-anchor="middle" font-size="12" fill="#333">Liveness Probe passes</text>
  <line x1="110" y1="145" x2="60" y2="180" stroke="#28a745" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="110" y1="145" x2="240" y2="180" stroke="#dc3545" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="10" y="180" width="180" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="100" y="202" text-anchor="middle" font-size="11" fill="#333">Is it ready for traffic?</text>
  <line x1="60" y1="215" x2="60" y2="255" stroke="#28a745" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="45" y="240" font-size="10" fill="#28a745">YES</text>
  <line x1="130" y1="215" x2="130" y2="255" stroke="#dc3545" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="140" y="240" font-size="10" fill="#dc3545">NO</text>
  <rect x="10" y="255" width="100" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="60" y="276" text-anchor="middle" font-size="10" fill="#333">Readiness</text>
  <text x="60" y="292" text-anchor="middle" font-size="10" fill="#28a745">Pod gets traffic</text>
  <rect x="120" y="255" width="120" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="180" y="276" text-anchor="middle" font-size="10" fill="#333">Readiness fails</text>
  <text x="180" y="292" text-anchor="middle" font-size="10" fill="#856404">Removed from SVC</text>
  <rect x="210" y="180" width="140" height="50" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="280" y="200" text-anchor="middle" font-size="11" fill="#333">Liveness fails</text>
  <text x="280" y="218" text-anchor="middle" font-size="10" fill="#dc3545">Kill &amp; restart</text>
  <rect x="340" y="110" width="220" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="450" y="133" text-anchor="middle" font-size="12" fill="#333">Container is starting</text>
  <line x1="400" y1="145" x2="400" y2="180" stroke="#28a745" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="145" x2="500" y2="180" stroke="#dc3545" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="340" y="180" width="120" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="400" y="200" text-anchor="middle" font-size="10" fill="#333">Startup passes</text>
  <text x="400" y="215" text-anchor="middle" font-size="10" fill="#28a745">Enable probes</text>
  <rect x="470" y="180" width="100" height="45" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="520" y="200" text-anchor="middle" font-size="10" fill="#333">Startup fails</text>
  <text x="520" y="215" text-anchor="middle" font-size="10" fill="#dc3545">Kill container</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40.9091" text-anchor="middle" font-size="26.1818" font-weight="bold" fill="var(--text)">Probe Decision Tree</text>
  <rect x="44.1379" y="65.4545" width="507.5862" height="57.2727" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="297.931" y="103.0909" text-anchor="middle" font-size="21.2727" fill="var(--text)">Is the container running?</text>
  <line x1="297.931" y1="122.7273" x2="176.5517" y2="180" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="187.5862" y="157.0909" font-size="18" fill="var(--ok-accent)">YES</text>
  <line x1="297.931" y1="122.7273" x2="882.7586" y2="180" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="617.931" y="157.0909" font-size="18" fill="var(--danger-accent)">NO</text>
  <rect x="22.069" y="180" width="441.3793" height="57.2727" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="242.7586" y="217.6364" text-anchor="middle" font-size="19.6364" fill="var(--text)">Liveness Probe passes</text>
  <line x1="242.7586" y1="237.2727" x2="132.4138" y2="294.5455" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="242.7586" y1="237.2727" x2="529.6552" y2="294.5455" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="22.069" y="294.5455" width="397.2414" height="57.2727" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="220.6897" y="330.5455" text-anchor="middle" font-size="18" fill="var(--text)">Is it ready for traffic?</text>
  <line x1="132.4138" y1="351.8182" x2="132.4138" y2="417.2727" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="99.3103" y="392.7273" font-size="16.3636" fill="var(--ok-accent)">YES</text>
  <line x1="286.8966" y1="351.8182" x2="286.8966" y2="417.2727" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="308.9655" y="392.7273" font-size="16.3636" fill="var(--danger-accent)">NO</text>
  <rect x="22.069" y="417.2727" width="220.6897" height="81.8182" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="132.4138" y="451.6364" text-anchor="middle" font-size="16.3636" fill="var(--text)">Readiness</text>
  <text x="132.4138" y="477.8182" text-anchor="middle" font-size="16.3636" fill="var(--ok-accent)">Pod gets traffic</text>
  <rect x="264.8276" y="417.2727" width="264.8276" height="81.8182" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="397.2414" y="451.6364" text-anchor="middle" font-size="16.3636" fill="var(--text)">Readiness fails</text>
  <text x="397.2414" y="477.8182" text-anchor="middle" font-size="16.3636" fill="var(--danger-accent)">Removed from SVC</text>
  <rect x="463.4483" y="294.5455" width="308.9655" height="81.8182" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="617.931" y="327.2727" text-anchor="middle" font-size="18" fill="var(--text)">Liveness fails</text>
  <text x="617.931" y="356.7273" text-anchor="middle" font-size="16.3636" fill="var(--danger-accent)">Kill &amp; restart</text>
  <rect x="750.3448" y="180" width="485.5172" height="57.2727" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="993.1034" y="217.6364" text-anchor="middle" font-size="19.6364" fill="var(--text)">Container is starting</text>
  <line x1="882.7586" y1="237.2727" x2="882.7586" y2="294.5455" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1103.4483" y1="237.2727" x2="1103.4483" y2="294.5455" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="750.3448" y="294.5455" width="264.8276" height="73.6364" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="882.7586" y="327.2727" text-anchor="middle" font-size="16.3636" fill="var(--text)">Startup passes</text>
  <text x="882.7586" y="351.8182" text-anchor="middle" font-size="16.3636" fill="var(--ok-accent)">Enable probes</text>
  <rect x="1037.2414" y="294.5455" width="220.6897" height="73.6364" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1147.5862" y="327.2727" text-anchor="middle" font-size="16.3636" fill="var(--text)">Startup fails</text>
  <text x="1147.5862" y="351.8182" text-anchor="middle" font-size="16.3636" fill="var(--danger-accent)">Kill container</text>
</svg>
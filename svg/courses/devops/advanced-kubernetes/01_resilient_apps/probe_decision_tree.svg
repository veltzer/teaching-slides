<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
  </defs>
  <text x="640" y="40.9091" text-anchor="middle" font-size="26.1818" font-weight="bold" fill="#333">Probe Decision Tree</text>
  <rect x="44.1379" y="65.4545" width="507.5862" height="57.2727" rx="8.1818" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2727" />
  <text x="297.931" y="103.0909" text-anchor="middle" font-size="21.2727" fill="#333">Is the container running?</text>
  <line x1="297.931" y1="122.7273" x2="176.5517" y2="180" stroke="#28a745" stroke-width="3.2727" marker-end="url(#arrow)" />
  <text x="187.5862" y="157.0909" font-size="18" fill="#28a745">YES</text>
  <line x1="297.931" y1="122.7273" x2="882.7586" y2="180" stroke="#dc3545" stroke-width="3.2727" marker-end="url(#arrow)" />
  <text x="617.931" y="157.0909" font-size="18" fill="#dc3545">NO</text>
  <rect x="22.069" y="180" width="441.3793" height="57.2727" rx="8.1818" fill="#d4edda" stroke="#28a745" stroke-width="3.2727" />
  <text x="242.7586" y="217.6364" text-anchor="middle" font-size="19.6364" fill="#333">Liveness Probe passes</text>
  <line x1="242.7586" y1="237.2727" x2="132.4138" y2="294.5455" stroke="#28a745" stroke-width="3.2727" marker-end="url(#arrow)" />
  <line x1="242.7586" y1="237.2727" x2="529.6552" y2="294.5455" stroke="#dc3545" stroke-width="3.2727" marker-end="url(#arrow)" />
  <rect x="22.069" y="294.5455" width="397.2414" height="57.2727" rx="8.1818" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2727" />
  <text x="220.6897" y="330.5455" text-anchor="middle" font-size="18" fill="#333">Is it ready for traffic?</text>
  <line x1="132.4138" y1="351.8182" x2="132.4138" y2="417.2727" stroke="#28a745" stroke-width="3.2727" marker-end="url(#arrow)" />
  <text x="99.3103" y="392.7273" font-size="16.3636" fill="#28a745">YES</text>
  <line x1="286.8966" y1="351.8182" x2="286.8966" y2="417.2727" stroke="#dc3545" stroke-width="3.2727" marker-end="url(#arrow)" />
  <text x="308.9655" y="392.7273" font-size="16.3636" fill="#dc3545">NO</text>
  <rect x="22.069" y="417.2727" width="220.6897" height="81.8182" rx="8.1818" fill="#d4edda" stroke="#28a745" stroke-width="3.2727" />
  <text x="132.4138" y="451.6364" text-anchor="middle" font-size="16.3636" fill="#333">Readiness</text>
  <text x="132.4138" y="477.8182" text-anchor="middle" font-size="16.3636" fill="#28a745">Pod gets traffic</text>
  <rect x="264.8276" y="417.2727" width="264.8276" height="81.8182" rx="8.1818" fill="#fff3cd" stroke="#ffc107" stroke-width="3.2727" />
  <text x="397.2414" y="451.6364" text-anchor="middle" font-size="16.3636" fill="#333">Readiness fails</text>
  <text x="397.2414" y="477.8182" text-anchor="middle" font-size="16.3636" fill="#bf360c">Removed from SVC</text>
  <rect x="463.4483" y="294.5455" width="308.9655" height="81.8182" rx="8.1818" fill="#f8d7da" stroke="#dc3545" stroke-width="3.2727" />
  <text x="617.931" y="327.2727" text-anchor="middle" font-size="18" fill="#333">Liveness fails</text>
  <text x="617.931" y="356.7273" text-anchor="middle" font-size="16.3636" fill="#dc3545">Kill &amp; restart</text>
  <rect x="750.3448" y="180" width="485.5172" height="57.2727" rx="8.1818" fill="#fff3cd" stroke="#ffc107" stroke-width="3.2727" />
  <text x="993.1034" y="217.6364" text-anchor="middle" font-size="19.6364" fill="#333">Container is starting</text>
  <line x1="882.7586" y1="237.2727" x2="882.7586" y2="294.5455" stroke="#28a745" stroke-width="3.2727" marker-end="url(#arrow)" />
  <line x1="1103.4483" y1="237.2727" x2="1103.4483" y2="294.5455" stroke="#dc3545" stroke-width="3.2727" marker-end="url(#arrow)" />
  <rect x="750.3448" y="294.5455" width="264.8276" height="73.6364" rx="8.1818" fill="#d4edda" stroke="#28a745" stroke-width="2.4545" />
  <text x="882.7586" y="327.2727" text-anchor="middle" font-size="16.3636" fill="#333">Startup passes</text>
  <text x="882.7586" y="351.8182" text-anchor="middle" font-size="16.3636" fill="#28a745">Enable probes</text>
  <rect x="1037.2414" y="294.5455" width="220.6897" height="73.6364" rx="8.1818" fill="#f8d7da" stroke="#dc3545" stroke-width="2.4545" />
  <text x="1147.5862" y="327.2727" text-anchor="middle" font-size="16.3636" fill="#333">Startup fails</text>
  <text x="1147.5862" y="351.8182" text-anchor="middle" font-size="16.3636" fill="#dc3545">Kill container</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 14.8966 L 24.381 7.4483 z" fill="#555" />
    </marker>
  </defs>
  <rect x="378.2559" y="23.7037" width="465.5457" height="154.074" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="611.0287" y="87.7037" font-family="sans-serif" font-size="30.8148" font-weight="bold" fill="var(--text)" text-anchor="middle">YAML File</text>
  <text x="611.0287" y="132.7407" font-family="sans-serif" font-size="26.074" fill="var(--text-muted)" text-anchor="middle">(desired state – local)</text>
  <line x1="611.0287" y1="177.7778" x2="611.0287" y2="237.037" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="625.577" y="220.4445" font-family="sans-serif" font-size="26.074" fill="var(--text)">kubectl apply -f</text>
  <rect x="174.5796" y="237.037" width="872.8982" height="402.963" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="611.0287" y="289.1852" font-family="sans-serif" font-size="30.8148" font-weight="bold" fill="var(--text)" text-anchor="middle">Three-Way Merge</text>
  <text x="218.2245" y="355.5555" font-family="sans-serif" font-size="28.4444" fill="var(--text)">1. Last-applied-config</text>
  <text x="261.8694" y="398.2221" font-family="sans-serif" font-size="26.074" fill="var(--text-muted)">(annotation on object)</text>
  <text x="218.2245" y="455.1111" font-family="sans-serif" font-size="28.4444" fill="var(--text)">2. Live object state</text>
  <text x="218.2245" y="512" font-family="sans-serif" font-size="28.4444" fill="var(--text)">3. New desired state</text>
  <line x1="203.6762" y1="535.7036" x2="1018.3813" y2="535.7036" stroke="var(--text-faint)" stroke-width="2" />
  <text x="218.2245" y="578.3703" font-family="sans-serif" font-size="28.4444" fill="var(--text)">Result: Strategic merge patch</text>
  <text x="218.2245" y="618.6666" font-family="sans-serif" font-size="26.074" fill="var(--text-muted)">sent to API server</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 39.2727 L 16.5161 19.6364 z" fill="#555" />
    </marker>
  </defs>
  <rect x="20.6452" y="130.9091" width="340.6452" height="458.1818" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="189.9355" y="294.5455" font-family="sans-serif" font-size="26.8387" font-weight="bold" fill="var(--text)" text-anchor="middle">Git Repo</text>
  <text x="41.2903" y="412.3636" font-family="monospace" font-size="22.7097" fill="var(--text-muted)">manifests/  kustomize/</text>
  <text x="41.2903" y="517.0909" font-family="monospace" font-size="22.7097" fill="var(--text-muted)">helm/</text>
  <line x1="361.2903" y1="360" x2="454.1935" y2="360" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="454.1935" y="130.9091" width="340.6452" height="458.1818" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="623.4839" y="294.5455" font-family="sans-serif" font-size="26.8387" font-weight="bold" fill="var(--text)" text-anchor="middle">ArgoCD</text>
  <text x="474.8387" y="412.3636" font-family="sans-serif" font-size="22.7097" fill="var(--text-muted)">Sync desired state</text>
  <text x="474.8387" y="517.0909" font-family="sans-serif" font-size="22.7097" fill="var(--text-muted)">to cluster</text>
  <line x1="794.8387" y1="360" x2="887.7419" y2="360" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="887.7419" y="130.9091" width="361.2903" height="458.1818" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1067.3548" y="294.5455" font-family="sans-serif" font-size="26.8387" font-weight="bold" fill="var(--text)" text-anchor="middle">Kubernetes Cluster</text>
  <text x="908.3871" y="412.3636" font-family="sans-serif" font-size="22.7097" fill="var(--text-muted)">Actual state matches</text>
  <text x="908.3871" y="517.0909" font-family="sans-serif" font-size="22.7097" fill="var(--text-muted)">desired state</text>
</svg>
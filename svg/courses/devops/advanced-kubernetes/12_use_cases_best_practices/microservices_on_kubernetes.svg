<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 520" font-family="Arial, sans-serif">
  <!-- Ingress Controller -->
  <rect x="150" y="10" width="320" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="310" y="38" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Ingress Controller</text>
  <!-- Lines from Ingress -->
  <line x1="240" y1="55" x2="170" y2="90" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="55" x2="440" y2="90" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Frontend -->
  <rect x="100" y="90" width="140" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="170" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Frontend</text>
  <text x="170" y="130" text-anchor="middle" font-size="11" fill="#555">(3 pods)</text>
  <!-- API Gateway -->
  <rect x="370" y="90" width="140" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="440" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">API Gateway</text>
  <text x="440" y="130" text-anchor="middle" font-size="11" fill="#555">(3 pods)</text>
  <!-- Lines from Frontend and API Gateway to services -->
  <line x1="170" y1="140" x2="80" y2="200" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="140" x2="230" y2="200" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="140" x2="380" y2="200" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="140" x2="530" y2="200" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Services row -->
  <rect x="20" y="200" width="120" height="55" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="80" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">User Service</text>
  <text x="80" y="242" text-anchor="middle" font-size="11" fill="#555">(3 replicas)</text>
  <rect x="170" y="200" width="120" height="55" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="230" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Order Svc</text>
  <text x="230" y="242" text-anchor="middle" font-size="11" fill="#555">(5 replicas)</text>
  <rect x="320" y="200" width="120" height="55" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="380" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Payment</text>
  <text x="380" y="242" text-anchor="middle" font-size="11" fill="#555">(3 replicas)</text>
  <rect x="470" y="200" width="130" height="55" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="535" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Notification</text>
  <text x="535" y="242" text-anchor="middle" font-size="11" fill="#555">(2 replicas)</text>
  <!-- Lines to data stores -->
  <line x1="80" y1="255" x2="80" y2="310" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="230" y1="255" x2="230" y2="310" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="255" x2="380" y2="310" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="535" y1="255" x2="535" y2="310" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Data stores -->
  <rect x="20" y="310" width="120" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="80" y="333" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Postgres</text>
  <text x="80" y="350" text-anchor="middle" font-size="10" fill="#555">(StatefulSet)</text>
  <rect x="170" y="310" width="120" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="230" y="333" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">MongoDB</text>
  <text x="230" y="350" text-anchor="middle" font-size="10" fill="#555">(StatefulSet)</text>
  <rect x="320" y="310" width="120" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="380" y="333" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Stripe</text>
  <text x="380" y="350" text-anchor="middle" font-size="10" fill="#555">(External)</text>
  <rect x="470" y="310" width="130" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="535" y="333" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Kafka</text>
  <text x="535" y="350" text-anchor="middle" font-size="10" fill="#555">(StatefulSet)</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a90e2"/>
    </marker>
  </defs>
</svg>
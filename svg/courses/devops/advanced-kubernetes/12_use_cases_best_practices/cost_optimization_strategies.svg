<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="82.857125575506" rx="6.852482333135" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="92.1738" y="78.114282770448" font-size="22.037927124832" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">1. Right-size resources</text>
  <text x="144.347817" y="107.942805011906" font-size="20.342736839424" fill="var(--text-muted)" font-family="Arial, sans-serif">Use VPA recommendations</text>
  <rect x="40" y="139.428526704888" width="1200" height="82.857125575506" rx="6.852482333135" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="92.1738" y="177.542929403935" font-size="22.037927124832" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">2. Use spot/preemptible instances</text>
  <text x="144.347817" y="207.371331716794" font-size="20.342736839424" fill="var(--text-muted)" font-family="Arial, sans-serif">Non-critical, fault-tolerant workloads</text>
  <rect x="40" y="238.857053409775" width="1200" height="82.857125575506" rx="6.852482333135" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="92.1738" y="276.971456108823" font-size="22.037927124832" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">3. Cluster Autoscaler</text>
  <text x="144.347817" y="306.799978350281" font-size="20.342736839424" fill="var(--text-muted)" font-family="Arial, sans-serif">Scale down idle nodes</text>
  <rect x="40" y="338.285701086119" width="1200" height="82.857125575506" rx="6.852482333135" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="92.1738" y="376.39998281371" font-size="22.037927124832" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">4. KEDA - Scale to zero</text>
  <text x="144.347817" y="406.228624983767" font-size="20.342736839424" fill="var(--text-muted)" font-family="Arial, sans-serif">Dev/staging environments</text>
  <rect x="40" y="437.714347719606" width="1200" height="82.857125575506" rx="6.852482333135" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="92.1738" y="475.828510561455" font-size="22.037927124832" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">5. Resource quotas</text>
  <text x="144.347817" y="505.657271617254" font-size="20.342736839424" fill="var(--text-muted)" font-family="Arial, sans-serif">Prevent over-provisioning</text>
  <rect x="40" y="537.142874424494" width="1200" height="82.857125575506" rx="6.852482333135" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="92.1738" y="575.257157194942" font-size="22.037927124832" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">6. Namespace-level budgets</text>
  <text x="144.347817" y="605.085799364999" font-size="20.342736839424" fill="var(--text-muted)" font-family="Arial, sans-serif">Cost allocation and chargebacks</text>
</svg>

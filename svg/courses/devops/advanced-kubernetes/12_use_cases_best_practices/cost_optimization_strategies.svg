<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="22.3892" y="14.8837" width="1119.4594" height="625.1163" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="582.1189" y="59.5348" text-anchor="middle" font-size="23.8139" font-weight="bold" fill="var(--primary-accent)">Cost Optimization</text>
  <rect x="67.1676" y="81.8605" width="1029.9027" height="74.4186" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="111.9459" y="116.0931" font-size="19.3488" font-weight="bold" fill="var(--text)">1. Right-size resources</text>
  <text x="156.7243" y="142.8837" font-size="17.8605" fill="var(--text-muted)">Use VPA recommendations</text>
  <rect x="67.1676" y="171.1628" width="1029.9027" height="74.4186" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="111.9459" y="205.3954" font-size="19.3488" font-weight="bold" fill="var(--text)">2. Use spot/preemptible instances</text>
  <text x="156.7243" y="232.186" font-size="17.8605" fill="var(--text-muted)">Non-critical, fault-tolerant workloads</text>
  <rect x="67.1676" y="260.4651" width="1029.9027" height="74.4186" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="111.9459" y="294.6977" font-size="19.3488" font-weight="bold" fill="var(--text)">3. Cluster Autoscaler</text>
  <text x="156.7243" y="321.4884" font-size="17.8605" fill="var(--text-muted)">Scale down idle nodes</text>
  <rect x="67.1676" y="349.7675" width="1029.9027" height="74.4186" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="111.9459" y="384" font-size="19.3488" font-weight="bold" fill="var(--text)">4. KEDA - Scale to zero</text>
  <text x="156.7243" y="410.7908" font-size="17.8605" fill="var(--text-muted)">Dev/staging environments</text>
  <rect x="67.1676" y="439.0698" width="1029.9027" height="74.4186" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="111.9459" y="473.3023" font-size="19.3488" font-weight="bold" fill="var(--text)">5. Resource quotas</text>
  <text x="156.7243" y="500.0931" font-size="17.8605" fill="var(--text-muted)">Prevent over-provisioning</text>
  <rect x="67.1676" y="528.3721" width="1029.9027" height="74.4186" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="111.9459" y="562.6047" font-size="19.3488" font-weight="bold" fill="var(--text)">6. Namespace-level budgets</text>
  <text x="156.7243" y="589.3954" font-size="17.8605" fill="var(--text-muted)">Cost allocation and chargebacks</text>
</svg>
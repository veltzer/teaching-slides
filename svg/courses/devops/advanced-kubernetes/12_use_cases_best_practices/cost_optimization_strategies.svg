<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="500" height="420" rx="5" fill="#f9f9f9" stroke="#4a90e2" stroke-width="2"/>
  <text x="260" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a90e2">Cost Optimization</text>
  <rect x="30" y="55" width="460" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="50" y="78" font-size="13" font-weight="bold" fill="#333">1. Right-size resources</text>
  <text x="70" y="96" font-size="12" fill="#666">Use VPA recommendations</text>
  <rect x="30" y="115" width="460" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="50" y="138" font-size="13" font-weight="bold" fill="#333">2. Use spot/preemptible instances</text>
  <text x="70" y="156" font-size="12" fill="#666">Non-critical, fault-tolerant workloads</text>
  <rect x="30" y="175" width="460" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="50" y="198" font-size="13" font-weight="bold" fill="#333">3. Cluster Autoscaler</text>
  <text x="70" y="216" font-size="12" fill="#666">Scale down idle nodes</text>
  <rect x="30" y="235" width="460" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="50" y="258" font-size="13" font-weight="bold" fill="#333">4. KEDA - Scale to zero</text>
  <text x="70" y="276" font-size="12" fill="#666">Dev/staging environments</text>
  <rect x="30" y="295" width="460" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="50" y="318" font-size="13" font-weight="bold" fill="#333">5. Resource quotas</text>
  <text x="70" y="336" font-size="12" fill="#666">Prevent over-provisioning</text>
  <rect x="30" y="355" width="460" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="50" y="378" font-size="13" font-weight="bold" fill="#333">6. Namespace-level budgets</text>
  <text x="70" y="396" font-size="12" fill="#666">Cost allocation and chargebacks</text>
</svg>

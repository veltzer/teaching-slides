<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:rect x="22.3892" y="14.8837" width="1119.4594" height="625.1163" rx="7.4418" fill="#f9f9f9" stroke="#4a90e2" stroke-width="2.9767" />
  <ns0:text x="582.1189" y="59.5348" text-anchor="middle" font-size="23.8139" font-weight="bold" fill="#4a90e2">Cost Optimization</ns0:text>
  <ns0:rect x="67.1676" y="81.8605" width="1029.9027" height="74.4186" rx="7.4418" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.2325" />
  <ns0:text x="111.9459" y="116.0931" font-size="19.3488" font-weight="bold" fill="#333">1. Right-size resources</ns0:text>
  <ns0:text x="156.7243" y="142.8837" font-size="17.8605" fill="#666">Use VPA recommendations</ns0:text>
  <ns0:rect x="67.1676" y="171.1628" width="1029.9027" height="74.4186" rx="7.4418" fill="#d4edda" stroke="#28a745" stroke-width="2.2325" />
  <ns0:text x="111.9459" y="205.3954" font-size="19.3488" font-weight="bold" fill="#333">2. Use spot/preemptible instances</ns0:text>
  <ns0:text x="156.7243" y="232.186" font-size="17.8605" fill="#666">Non-critical, fault-tolerant workloads</ns0:text>
  <ns0:rect x="67.1676" y="260.4651" width="1029.9027" height="74.4186" rx="7.4418" fill="#fff3cd" stroke="#ffc107" stroke-width="2.2325" />
  <ns0:text x="111.9459" y="294.6977" font-size="19.3488" font-weight="bold" fill="#333">3. Cluster Autoscaler</ns0:text>
  <ns0:text x="156.7243" y="321.4884" font-size="17.8605" fill="#666">Scale down idle nodes</ns0:text>
  <ns0:rect x="67.1676" y="349.7675" width="1029.9027" height="74.4186" rx="7.4418" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.2325" />
  <ns0:text x="111.9459" y="384" font-size="19.3488" font-weight="bold" fill="#333">4. KEDA - Scale to zero</ns0:text>
  <ns0:text x="156.7243" y="410.7908" font-size="17.8605" fill="#666">Dev/staging environments</ns0:text>
  <ns0:rect x="67.1676" y="439.0698" width="1029.9027" height="74.4186" rx="7.4418" fill="#d4edda" stroke="#28a745" stroke-width="2.2325" />
  <ns0:text x="111.9459" y="473.3023" font-size="19.3488" font-weight="bold" fill="#333">5. Resource quotas</ns0:text>
  <ns0:text x="156.7243" y="500.0931" font-size="17.8605" fill="#666">Prevent over-provisioning</ns0:text>
  <ns0:rect x="67.1676" y="528.3721" width="1029.9027" height="74.4186" rx="7.4418" fill="#fff3cd" stroke="#ffc107" stroke-width="2.2325" />
  <ns0:text x="111.9459" y="562.6047" font-size="19.3488" font-weight="bold" fill="#333">6. Namespace-level budgets</ns0:text>
  <ns0:text x="156.7243" y="589.3954" font-size="17.8605" fill="#666">Cost allocation and chargebacks</ns0:text>
</ns0:svg>
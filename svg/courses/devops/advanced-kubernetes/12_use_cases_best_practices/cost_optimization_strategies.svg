<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <rect x="24.6154" y="16.3636" width="1230.7692" height="687.2727" rx="8.1818" fill="#f9f9f9" stroke="#4a90e2" stroke-width="3.2727" />
  <text x="640" y="65.4545" text-anchor="middle" font-size="26.1818" font-weight="bold" fill="#4a90e2">Cost Optimization</text>
  <rect x="73.8462" y="90" width="1132.3077" height="81.8182" rx="8.1818" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.4545" />
  <text x="123.0769" y="127.6364" font-size="21.2727" font-weight="bold" fill="#333">1. Right-size resources</text>
  <text x="172.3077" y="157.0909" font-size="19.6364" fill="#666">Use VPA recommendations</text>
  <rect x="73.8462" y="188.1818" width="1132.3077" height="81.8182" rx="8.1818" fill="#d4edda" stroke="#28a745" stroke-width="2.4545" />
  <text x="123.0769" y="225.8182" font-size="21.2727" font-weight="bold" fill="#333">2. Use spot/preemptible instances</text>
  <text x="172.3077" y="255.2727" font-size="19.6364" fill="#666">Non-critical, fault-tolerant workloads</text>
  <rect x="73.8462" y="286.3636" width="1132.3077" height="81.8182" rx="8.1818" fill="#fff3cd" stroke="#ffc107" stroke-width="2.4545" />
  <text x="123.0769" y="324" font-size="21.2727" font-weight="bold" fill="#333">3. Cluster Autoscaler</text>
  <text x="172.3077" y="353.4545" font-size="19.6364" fill="#666">Scale down idle nodes</text>
  <rect x="73.8462" y="384.5455" width="1132.3077" height="81.8182" rx="8.1818" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.4545" />
  <text x="123.0769" y="422.1818" font-size="21.2727" font-weight="bold" fill="#333">4. KEDA - Scale to zero</text>
  <text x="172.3077" y="451.6364" font-size="19.6364" fill="#666">Dev/staging environments</text>
  <rect x="73.8462" y="482.7273" width="1132.3077" height="81.8182" rx="8.1818" fill="#d4edda" stroke="#28a745" stroke-width="2.4545" />
  <text x="123.0769" y="520.3636" font-size="21.2727" font-weight="bold" fill="#333">5. Resource quotas</text>
  <text x="172.3077" y="549.8182" font-size="19.6364" fill="#666">Prevent over-provisioning</text>
  <rect x="73.8462" y="580.9091" width="1132.3077" height="81.8182" rx="8.1818" fill="#fff3cd" stroke="#ffc107" stroke-width="2.4545" />
  <text x="123.0769" y="618.5455" font-size="21.2727" font-weight="bold" fill="#333">6. Namespace-level budgets</text>
  <text x="172.3077" y="648" font-size="19.6364" fill="#666">Cost allocation and chargebacks</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="31.457608746341" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Disaster Recovery Plan</text>
  <rect x="40" y="73.623195127075" width="1200" height="92.463786599458" rx="6.735623884021" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="92.173804347826" y="110.608709766859" font-size="24.467153758707" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">1. etcd backup (every 30 min)</text>
  <text x="144.347826086957" y="145.913064650288" font-size="20.971814004493" fill="var(--text-muted)" font-family="Arial, sans-serif">Stored in S3/GCS with encryption</text>
  <rect x="40" y="182.898463348019" width="1200" height="92.463786599458" rx="6.735623884021" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="92.173804347826" y="219.883977987802" font-size="24.467153758707" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">2. Velero backup (daily)</text>
  <text x="144.347826086957" y="255.188332871231" font-size="20.971814004493" fill="var(--text-muted)" font-family="Arial, sans-serif">Cluster state + persistent volumes</text>
  <rect x="40" y="292.173847511014" width="1200" height="92.463786599458" rx="6.735623884021" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="92.173804347826" y="329.159478092849" font-size="24.467153758707" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">3. Multi-region cluster setup</text>
  <text x="144.347826086957" y="364.463832976278" font-size="20.971814004493" fill="var(--text-muted)" font-family="Arial, sans-serif">Active-passive or active-active</text>
  <rect x="40" y="401.449231674009" width="1200" height="92.463786599458" rx="6.735623884021" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="92.173804347826" y="438.434862255845" font-size="24.467153758707" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">4. GitOps repo is source of truth</text>
  <text x="144.347826086957" y="473.739217139274" font-size="20.971814004493" fill="var(--text-muted)" font-family="Arial, sans-serif">Rebuild cluster from Git</text>
  <rect x="40" y="519.130414618774" width="573.913152173913" height="100.869585381226" rx="6.735623884021" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="326.956413043478" y="561.15952446967" text-anchor="middle" font-size="24.467153758707" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">RPO</text>
  <text x="326.956413043478" y="599.826082923755" text-anchor="middle" font-size="22.7194838816" fill="var(--text-muted)" font-family="Arial, sans-serif">&lt; 30 minutes</text>
  <rect x="666.086847826087" y="519.130414618774" width="573.913152173913" height="100.869585381226" rx="6.735623884021" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="953.043369565217" y="561.15952446967" text-anchor="middle" font-size="24.467153758707" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">RTO</text>
  <text x="953.043369565217" y="599.826082923755" text-anchor="middle" font-size="22.7194838816" fill="var(--text-muted)" font-family="Arial, sans-serif">&lt; 2 hours</text>
</svg>

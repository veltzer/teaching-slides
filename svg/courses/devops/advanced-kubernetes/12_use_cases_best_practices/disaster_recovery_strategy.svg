<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="90.75" text-anchor="middle" font-size="28.022" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Disaster Recovery Plan</text>
  <rect x="88.0001" y="119.75" width="1104" height="79.75" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="136" y="151.65" font-size="21.795" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">1. etcd backup (every 30 min)</text>
  <text x="184.0001" y="182.1" font-size="18.6814" fill="var(--text-muted)" font-family="Arial, sans-serif">Stored in S3/GCS with encryption</text>
  <rect x="88.0001" y="213.9999" width="1104" height="79.75" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="136" y="245.8999" font-size="21.795" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">2. Velero backup (daily)</text>
  <text x="184.0001" y="276.3499" font-size="18.6814" fill="var(--text-muted)" font-family="Arial, sans-serif">Cluster state + persistent volumes</text>
  <rect x="88.0001" y="308.2499" width="1104" height="79.75" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="136" y="340.15" font-size="21.795" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">3. Multi-region cluster setup</text>
  <text x="184.0001" y="370.6" font-size="18.6814" fill="var(--text-muted)" font-family="Arial, sans-serif">Active-passive or active-active</text>
  <rect x="88.0001" y="402.4999" width="1104" height="79.75" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="136" y="434.4" font-size="21.795" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">4. GitOps repo is source of truth</text>
  <text x="184.0001" y="464.85" font-size="18.6814" fill="var(--text-muted)" font-family="Arial, sans-serif">Rebuild cluster from Git</text>
  <rect x="88.0001" y="503.9999" width="528.0001" height="87" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="352" y="540.25" text-anchor="middle" font-size="21.795" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">RPO</text>
  <text x="352" y="573.5999" text-anchor="middle" font-size="20.2382" fill="var(--text-muted)" font-family="Arial, sans-serif">&lt; 30 minutes</text>
  <rect x="664" y="503.9999" width="528.0001" height="87" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="928" y="540.25" text-anchor="middle" font-size="21.795" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">RTO</text>
  <text x="928" y="573.5999" text-anchor="middle" font-size="20.2382" fill="var(--text-muted)" font-family="Arial, sans-serif">&lt; 2 hours</text>
</svg>

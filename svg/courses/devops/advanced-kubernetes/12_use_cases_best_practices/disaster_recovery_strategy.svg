<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="500" height="400" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="260" y="45" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Disaster Recovery Plan</text>
  <!-- Step 1 -->
  <rect x="30" y="65" width="460" height="55" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="50" y="87" font-size="14" font-weight="bold" fill="#333">1. etcd backup (every 30 min)</text>
  <text x="70" y="108" font-size="12" fill="#555">Stored in S3/GCS with encryption</text>
  <!-- Step 2 -->
  <rect x="30" y="130" width="460" height="55" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="50" y="152" font-size="14" font-weight="bold" fill="#333">2. Velero backup (daily)</text>
  <text x="70" y="173" font-size="12" fill="#555">Cluster state + persistent volumes</text>
  <!-- Step 3 -->
  <rect x="30" y="195" width="460" height="55" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="50" y="217" font-size="14" font-weight="bold" fill="#333">3. Multi-region cluster setup</text>
  <text x="70" y="238" font-size="12" fill="#555">Active-passive or active-active</text>
  <!-- Step 4 -->
  <rect x="30" y="260" width="460" height="55" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="50" y="282" font-size="14" font-weight="bold" fill="#333">4. GitOps repo is source of truth</text>
  <text x="70" y="303" font-size="12" fill="#555">Rebuild cluster from Git</text>
  <!-- RPO/RTO -->
  <rect x="30" y="330" width="220" height="60" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="140" y="355" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">RPO</text>
  <text x="140" y="378" text-anchor="middle" font-size="13" fill="#555">&lt; 30 minutes</text>
  <rect x="270" y="330" width="220" height="60" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="380" y="355" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">RTO</text>
  <text x="380" y="378" text-anchor="middle" font-size="13" fill="#555">&lt; 2 hours</text>
</svg>
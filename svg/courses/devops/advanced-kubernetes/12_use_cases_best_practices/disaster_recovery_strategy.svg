  <ns0:rect x="67.2421" y="101.4634" width="1031.0443" height="85.8536" rx="7.8049" fill="#d4edda" stroke="#28a745" stroke-width="2.3414" />
  <ns0:text x="112.07" y="135.8049" font-size="21.8537" font-weight="bold" fill="#333">1. etcd backup (every 30 min)</ns0:text>
  <ns0:text x="156.8981" y="168.5854" font-size="18.7317" fill="#555">Stored in S3/GCS with encryption</ns0:text>
  <ns0:rect x="67.2421" y="202.9268" width="1031.0443" height="85.8536" rx="7.8049" fill="#d4edda" stroke="#28a745" stroke-width="2.3414" />
  <ns0:text x="112.07" y="237.2682" font-size="21.8537" font-weight="bold" fill="#333">2. Velero backup (daily)</ns0:text>
  <ns0:text x="156.8981" y="270.0487" font-size="18.7317" fill="#555">Cluster state + persistent volumes</ns0:text>
  <ns0:rect x="67.2421" y="304.3902" width="1031.0443" height="85.8536" rx="7.8049" fill="#d4edda" stroke="#28a745" stroke-width="2.3414" />
  <ns0:text x="112.07" y="338.7317" font-size="21.8537" font-weight="bold" fill="#333">3. Multi-region cluster setup</ns0:text>
  <ns0:text x="156.8981" y="371.5122" font-size="18.7317" fill="#555">Active-passive or active-active</ns0:text>
  <ns0:rect x="67.2421" y="405.8536" width="1031.0443" height="85.8536" rx="7.8049" fill="#d4edda" stroke="#28a745" stroke-width="2.3414" />
  <ns0:text x="112.07" y="440.1951" font-size="21.8537" font-weight="bold" fill="#333">4. GitOps repo is source of truth</ns0:text>
  <ns0:text x="156.8981" y="472.9756" font-size="18.7317" fill="#555">Rebuild cluster from Git</ns0:text>
  <ns0:rect x="67.2421" y="515.1219" width="493.1082" height="93.6585" rx="7.8049" fill="#fff3cd" stroke="#ffc107" stroke-width="2.3414" />
  <ns0:text x="313.7961" y="554.1463" text-anchor="middle" font-size="21.8537" font-weight="bold" fill="#333">RPO</ns0:text>
  <ns0:text x="313.7961" y="590.0487" text-anchor="middle" font-size="20.2927" fill="#555">&lt; 30 minutes</ns0:text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="22.414" y="15.6098" width="1120.7003" height="624.3902" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="582.7642" y="70.2439" text-anchor="middle" font-size="28.0975" font-weight="bold" fill="var(--text)">Disaster Recovery Plan</text>
  <rect x="67.2421" y="101.4634" width="1031.0443" height="85.8536" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="112.07" y="135.8049" font-size="21.8537" font-weight="bold" fill="var(--text)">1. etcd backup (every 30 min)</text>
  <text x="156.8981" y="168.5854" font-size="18.7317" fill="var(--text-muted)">Stored in S3/GCS with encryption</text>
  <rect x="67.2421" y="202.9268" width="1031.0443" height="85.8536" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="112.07" y="237.2682" font-size="21.8537" font-weight="bold" fill="var(--text)">2. Velero backup (daily)</text>
  <text x="156.8981" y="270.0487" font-size="18.7317" fill="var(--text-muted)">Cluster state + persistent volumes</text>
  <rect x="67.2421" y="304.3902" width="1031.0443" height="85.8536" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="112.07" y="338.7317" font-size="21.8537" font-weight="bold" fill="var(--text)">3. Multi-region cluster setup</text>
  <text x="156.8981" y="371.5122" font-size="18.7317" fill="var(--text-muted)">Active-passive or active-active</text>
  <rect x="67.2421" y="405.8536" width="1031.0443" height="85.8536" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="112.07" y="440.1951" font-size="21.8537" font-weight="bold" fill="var(--text)">4. GitOps repo is source of truth</text>
  <text x="156.8981" y="472.9756" font-size="18.7317" fill="var(--text-muted)">Rebuild cluster from Git</text>
  <rect x="67.2421" y="515.1219" width="493.1082" height="93.6585" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="313.7961" y="554.1463" text-anchor="middle" font-size="21.8537" font-weight="bold" fill="var(--text)">RPO</text>
  <text x="313.7961" y="590.0487" text-anchor="middle" font-size="20.2927" fill="var(--text-muted)">&lt; 30 minutes</text>
  <rect x="605.1782" y="515.1219" width="493.1082" height="93.6585" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="851.7322" y="554.1463" text-anchor="middle" font-size="21.8537" font-weight="bold" fill="var(--text)">RTO</text>
  <text x="851.7322" y="590.0487" text-anchor="middle" font-size="20.2927" fill="var(--text-muted)">&lt; 2 hours</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="28.8279" font-weight="bold" fill="var(--text)">Cluster API (CAPI) Overview</text>
  <rect x="40" y="65.9702" width="1200" height="346.2686" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="639.9999" y="109.2538" text-anchor="middle" font-size="25.2244" font-weight="bold" fill="var(--primary-accent)">Management Cluster</text>
  <rect x="90" y="135.224" width="500" height="95.2239" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="340" y="178.5075" text-anchor="middle" font-size="21.6209" fill="var(--text)">CAPI Core Controllers</text>
  <rect x="664.9999" y="135.224" width="525" height="95.2239" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="927.4999" y="169.8508" text-anchor="middle" font-size="21.6209" fill="var(--text)">Infrastructure Provider</text>
  <text x="927.4999" y="201.015" text-anchor="middle" font-size="19.8191" fill="var(--text-muted)">(AWS, Azure, vSphere)</text>
  <rect x="90" y="256.418" width="500" height="95.2239" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="340" y="299.7015" text-anchor="middle" font-size="21.6209" fill="var(--text)">Bootstrap Provider</text>
  <text x="340" y="330.8657" text-anchor="middle" font-size="19.8191" fill="var(--text-muted)">(kubeadm)</text>
  <rect x="664.9999" y="256.418" width="525" height="95.2239" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="927.4999" y="299.7015" text-anchor="middle" font-size="21.6209" fill="var(--text)">Control Plane Provider</text>
  <text x="927.4999" y="330.8657" text-anchor="middle" font-size="19.8191" fill="var(--text-muted)">(KubeadmCP)</text>
  <text x="639.9999" y="455.5224" text-anchor="middle" font-size="23.4226" fill="var(--text-muted)">manages</text>
  <line x1="364.9999" y1="412.2389" x2="364.9999" y2="516.1194" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="639.9999" y1="412.2389" x2="639.9999" y2="516.1194" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="915" y1="412.2389" x2="915" y2="516.1194" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="189.9999" y="516.1194" width="300" height="103.8806" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="340" y="564.5971" text-anchor="middle" font-size="23.4226" fill="var(--text)">Cluster 1</text>
  <text x="340" y="599.2239" text-anchor="middle" font-size="19.8191" fill="var(--text-muted)">(dev)</text>
  <rect x="539.9999" y="516.1194" width="300" height="103.8806" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="690" y="564.5971" text-anchor="middle" font-size="23.4226" fill="var(--text)">Cluster 2</text>
  <text x="690" y="599.2239" text-anchor="middle" font-size="19.8191" fill="var(--text-muted)">(stg)</text>
  <rect x="889.9999" y="516.1194" width="300" height="103.8806" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1039.9999" y="564.5971" text-anchor="middle" font-size="23.4226" fill="var(--text)">Cluster 3</text>
  <text x="1039.9999" y="599.2239" text-anchor="middle" font-size="19.8191" fill="var(--text-muted)">(prd)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="28.8279" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Cluster API (CAPI) Overview</text>
  <rect x="40" y="65.9702" width="1200" height="346.2686" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="109.2538" text-anchor="middle" font-size="25.2244" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Management Cluster</text>
  <rect x="90" y="135.224" width="500" height="95.2239" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="178.5075" text-anchor="middle" font-size="21.6209" fill="var(--text)" font-family="Arial, sans-serif">CAPI Core Controllers</text>
  <rect x="664.9999" y="135.224" width="525" height="95.2239" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="927.4999" y="169.8508" text-anchor="middle" font-size="21.6209" fill="var(--text)" font-family="Arial, sans-serif">Infrastructure Provider</text>
  <text x="927.4999" y="201.015" text-anchor="middle" font-size="19.8191" fill="var(--text-muted)" font-family="Arial, sans-serif">(AWS, Azure, vSphere)</text>
  <rect x="90" y="256.418" width="500" height="95.2239" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="299.7015" text-anchor="middle" font-size="21.6209" fill="var(--text)" font-family="Arial, sans-serif">Bootstrap Provider</text>
  <text x="340" y="330.8657" text-anchor="middle" font-size="19.8191" fill="var(--text-muted)" font-family="Arial, sans-serif">(kubeadm)</text>
  <rect x="664.9999" y="256.418" width="525" height="95.2239" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="927.4999" y="299.7015" text-anchor="middle" font-size="21.6209" fill="var(--text)" font-family="Arial, sans-serif">Control Plane Provider</text>
  <text x="927.4999" y="330.8657" text-anchor="middle" font-size="19.8191" fill="var(--text-muted)" font-family="Arial, sans-serif">(KubeadmCP)</text>
  <text x="639.9999" y="455.5224" text-anchor="middle" font-size="23.4226" fill="var(--text-muted)" font-family="Arial, sans-serif">manages</text>
  <line x1="364.9999" y1="412.2389" x2="364.9999" y2="516.1194" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="639.9999" y1="412.2389" x2="639.9999" y2="516.1194" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="915" y1="412.2389" x2="915" y2="516.1194" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="189.9999" y="516.1194" width="300" height="103.8806" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="564.5971" text-anchor="middle" font-size="23.4226" fill="var(--text)" font-family="Arial, sans-serif">Cluster 1</text>
  <text x="340" y="599.2239" text-anchor="middle" font-size="19.8191" fill="var(--text-muted)" font-family="Arial, sans-serif">(dev)</text>
  <rect x="539.9999" y="516.1194" width="300" height="103.8806" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="690" y="564.5971" text-anchor="middle" font-size="23.4226" fill="var(--text)" font-family="Arial, sans-serif">Cluster 2</text>
  <text x="690" y="599.2239" text-anchor="middle" font-size="19.8191" fill="var(--text-muted)" font-family="Arial, sans-serif">(stg)</text>
  <rect x="889.9999" y="516.1194" width="300" height="103.8806" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1039.9999" y="564.5971" text-anchor="middle" font-size="23.4226" fill="var(--text)" font-family="Arial, sans-serif">Cluster 3</text>
  <text x="1039.9999" y="599.2239" text-anchor="middle" font-size="19.8191" fill="var(--text-muted)" font-family="Arial, sans-serif">(prd)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="42.8571" text-anchor="middle" font-size="27.4286" font-weight="bold" fill="var(--text)">Kubeadm Architecture</text>
  <rect x="137.1429" y="68.5714" width="1005.7143" height="342.8571" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="111.4286" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--primary-accent)">Control Plane Node</text>
  <rect x="182.8571" y="137.1429" width="297.1429" height="68.5714" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="331.4286" y="180" text-anchor="middle" font-size="20.5714" fill="var(--text)">etcd</text>
  <rect x="525.7143" y="137.1429" width="388.5714" height="68.5714" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="720" y="180" text-anchor="middle" font-size="20.5714" fill="var(--text)">kube-apiserver</text>
  <rect x="182.8571" y="222.8571" width="388.5714" height="68.5714" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="377.1429" y="265.7143" text-anchor="middle" font-size="20.5714" fill="var(--text)">kube-controller-manager</text>
  <rect x="617.1429" y="222.8571" width="320" height="68.5714" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="777.1429" y="265.7143" text-anchor="middle" font-size="20.5714" fill="var(--text)">kube-scheduler</text>
  <rect x="182.8571" y="308.5714" width="297.1429" height="68.5714" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="331.4286" y="351.4286" text-anchor="middle" font-size="20.5714" fill="var(--text)">kubelet</text>
  <rect x="525.7143" y="308.5714" width="388.5714" height="68.5714" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="720" y="351.4286" text-anchor="middle" font-size="20.5714" fill="var(--text)">kube-proxy</text>
  <line x1="388.5714" y1="411.4286" x2="388.5714" y2="471.4286" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="640" y1="411.4286" x2="640" y2="471.4286" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="891.4286" y1="411.4286" x2="891.4286" y2="471.4286" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="182.8571" y="471.4286" width="320" height="102.8571" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="342.8571" y="519.4286" text-anchor="middle" font-size="22.2857" font-weight="bold" fill="var(--text)">Worker 1</text>
  <text x="342.8571" y="553.7143" text-anchor="middle" font-size="18.8571" fill="var(--text-muted)">kubelet, proxy</text>
  <rect x="548.5714" y="471.4286" width="320" height="102.8571" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="708.5714" y="519.4286" text-anchor="middle" font-size="22.2857" font-weight="bold" fill="var(--text)">Worker 2</text>
  <text x="708.5714" y="553.7143" text-anchor="middle" font-size="18.8571" fill="var(--text-muted)">kubelet, proxy</text>
  <rect x="914.2857" y="471.4286" width="320" height="102.8571" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1074.2857" y="519.4286" text-anchor="middle" font-size="22.2857" font-weight="bold" fill="var(--text)">Worker 3</text>
  <text x="1074.2857" y="553.7143" text-anchor="middle" font-size="18.8571" fill="var(--text-muted)">kubelet, proxy</text>
</svg>
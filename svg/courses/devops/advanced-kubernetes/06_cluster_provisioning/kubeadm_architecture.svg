<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="590" y="40" text-anchor="middle" font-size="29.9678" font-weight="bold" fill="var(--text)">Kubeadm Architecture</text>
  <rect x="40" y="68.0645" width="1100.0001" height="374.1935" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="590" y="114.8388" text-anchor="middle" font-size="26.2218" font-weight="bold" fill="var(--primary-accent)">Control Plane Node</text>
  <rect x="89.9999" y="142.9033" width="325.0001" height="74.8387" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="252.5" y="189.6775" text-anchor="middle" font-size="22.4758" fill="var(--text)">etcd</text>
  <rect x="465" y="142.9033" width="425" height="74.8387" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="677.5" y="189.6775" text-anchor="middle" font-size="22.4758" fill="var(--text)">kube-apiserver</text>
  <rect x="89.9999" y="236.4516" width="425" height="74.8387" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="302.5" y="283.2259" text-anchor="middle" font-size="22.4758" fill="var(--text)">kube-controller-manager</text>
  <rect x="565" y="236.4516" width="350" height="74.8387" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="740" y="283.2259" text-anchor="middle" font-size="22.4758" fill="var(--text)">kube-scheduler</text>
  <rect x="89.9999" y="330" width="325.0001" height="74.8387" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="252.5" y="376.7743" text-anchor="middle" font-size="22.4758" fill="var(--text)">kubelet</text>
  <rect x="465" y="330" width="425" height="74.8387" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="677.5" y="376.7743" text-anchor="middle" font-size="22.4758" fill="var(--text)">kube-proxy</text>
  <line x1="314.9999" y1="442.2581" x2="314.9999" y2="507.742" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="590" y1="442.2581" x2="590" y2="507.742" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="865" y1="442.2581" x2="865" y2="507.742" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="89.9999" y="507.742" width="350" height="112.258" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="264.9999" y="560.1291" text-anchor="middle" font-size="24.3488" font-weight="bold" fill="var(--text)">Worker 1</text>
  <text x="264.9999" y="597.5484" text-anchor="middle" font-size="20.6028" fill="var(--text-muted)">kubelet, proxy</text>
  <rect x="489.9999" y="507.742" width="350" height="112.258" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="665" y="560.1291" text-anchor="middle" font-size="24.3488" font-weight="bold" fill="var(--text)">Worker 2</text>
  <text x="665" y="597.5484" text-anchor="middle" font-size="20.6028" fill="var(--text-muted)">kubelet, proxy</text>
  <rect x="890" y="507.742" width="350" height="112.258" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1065" y="560.1291" text-anchor="middle" font-size="24.3488" font-weight="bold" fill="var(--text)">Worker 3</text>
  <text x="1065" y="597.5484" text-anchor="middle" font-size="20.6028" fill="var(--text-muted)">kubelet, proxy</text>
</svg>
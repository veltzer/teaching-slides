<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="590" y="40" text-anchor="middle" font-size="29.9678" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Kubeadm Architecture</text>
  <rect x="40" y="68.0645" width="1100.0001" height="374.1935" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="590" y="114.8388" text-anchor="middle" font-size="26.2218" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Control Plane Node</text>
  <rect x="89.9999" y="142.9033" width="325.0001" height="74.8387" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="252.5" y="189.6775" text-anchor="middle" font-size="22.4758" fill="var(--text)" font-family="Arial, sans-serif">etcd</text>
  <rect x="465" y="142.9033" width="425" height="74.8387" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="677.5" y="189.6775" text-anchor="middle" font-size="22.4758" fill="var(--text)" font-family="Arial, sans-serif">kube-apiserver</text>
  <rect x="89.9999" y="236.4516" width="425" height="74.8387" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="302.5" y="283.2259" text-anchor="middle" font-size="22.4758" fill="var(--text)" font-family="Arial, sans-serif">kube-controller-manager</text>
  <rect x="565" y="236.4516" width="350" height="74.8387" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="740" y="283.2259" text-anchor="middle" font-size="22.4758" fill="var(--text)" font-family="Arial, sans-serif">kube-scheduler</text>
  <rect x="89.9999" y="330" width="325.0001" height="74.8387" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="252.5" y="376.7743" text-anchor="middle" font-size="22.4758" fill="var(--text)" font-family="Arial, sans-serif">kubelet</text>
  <rect x="465" y="330" width="425" height="74.8387" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="677.5" y="376.7743" text-anchor="middle" font-size="22.4758" fill="var(--text)" font-family="Arial, sans-serif">kube-proxy</text>
  <line x1="314.9999" y1="442.2581" x2="314.9999" y2="507.742" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="590" y1="442.2581" x2="590" y2="507.742" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="865" y1="442.2581" x2="865" y2="507.742" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="89.9999" y="507.742" width="350" height="112.258" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="264.9999" y="560.1291" text-anchor="middle" font-size="24.3488" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Worker 1</text>
  <text x="264.9999" y="597.5484" text-anchor="middle" font-size="20.6028" fill="var(--text-muted)" font-family="Arial, sans-serif">kubelet, proxy</text>
  <rect x="489.9999" y="507.742" width="350" height="112.258" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="665" y="560.1291" text-anchor="middle" font-size="24.3488" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Worker 2</text>
  <text x="665" y="597.5484" text-anchor="middle" font-size="20.6028" fill="var(--text-muted)" font-family="Arial, sans-serif">kubelet, proxy</text>
  <rect x="890" y="507.742" width="350" height="112.258" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1065" y="560.1291" text-anchor="middle" font-size="24.3488" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Worker 3</text>
  <text x="1065" y="597.5484" text-anchor="middle" font-size="20.6028" fill="var(--text-muted)" font-family="Arial, sans-serif">kubelet, proxy</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="248.6956" y="40" width="782.6086" height="187.647014013843" rx="6.259110847525" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="118.470575432527" text-anchor="middle" font-size="36.565203978668" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Load Balancer</text>
  <text x="639.9999" y="186.705971972314" text-anchor="middle" font-size="30.939828104455" fill="var(--text-muted)" font-family="Courier New, monospace">k8s-api.example.com</text>
  <line x1="431.3043" y1="227.647014013843" x2="222.6086" y2="381.176438581317" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="639.9999" y1="227.647014013843" x2="639.9999" y2="381.176438581317" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="848.6956" y1="227.647014013843" x2="1057.3913" y2="381.176438581317" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="40" y="381.176438581317" width="365.2174" height="238.823561418683" rx="6.259110847525" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="222.6086" y="476.70586314879" text-anchor="middle" font-size="36.565203978668" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Master1</text>
  <text x="222.6086" y="551.764603460213" text-anchor="middle" font-size="33.752568200818" fill="var(--text-muted)" font-family="Arial, sans-serif">etcd</text>
  <rect x="457.3912" y="381.176438581317" width="365.2174" height="238.823561418683" rx="6.259110847525" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="476.70586314879" text-anchor="middle" font-size="36.565203978668" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Master2</text>
  <text x="639.9999" y="551.764603460213" text-anchor="middle" font-size="33.752568200818" fill="var(--text-muted)" font-family="Arial, sans-serif">etcd</text>
  <rect x="874.7826" y="381.176438581317" width="365.2174" height="238.823561418683" rx="6.259110847525" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1057.3913" y="476.70586314879" text-anchor="middle" font-size="36.565203978668" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Master3</text>
  <text x="1057.3913" y="551.764603460213" text-anchor="middle" font-size="33.752568200818" fill="var(--text-muted)" font-family="Arial, sans-serif">etcd</text>
</svg>

  <text x="803.6363" y="333.7662" text-anchor="middle" font-size="20.5806" fill="var(--text)">Task 6</text>
  <text x="994.5454" y="333.7662" font-size="18.8655" fill="var(--text-muted)">wave 2</text>
  <text x="40" y="409.0909" font-size="22.2957" font-weight="bold" fill="var(--danger-accent)">Work queue (completions=null, parallelism=5):</text>
  <rect x="40" y="424.1558" width="218.1818" height="60.2597" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="149.0909" y="461.8181" text-anchor="middle" font-size="18.8655" fill="var(--text)">W-1</text>

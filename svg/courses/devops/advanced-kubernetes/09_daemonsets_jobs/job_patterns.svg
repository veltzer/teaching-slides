  <rect x="449.0909" y="552.2078" width="381.8181" height="67.7922" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="586.8571" text-anchor="middle" font-size="20.5806" fill="var(--text)">Work Queue</text>
  <text x="640" y="609.4545" text-anchor="middle" font-size="17.1504" fill="var(--text-muted)">(external)</text>
</svg>
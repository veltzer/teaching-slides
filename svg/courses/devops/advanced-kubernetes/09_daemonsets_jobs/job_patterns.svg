<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="721.8182" y="40" text-anchor="middle" font-size="27.4408" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Job Patterns</text>
  <text x="40" y="85.1948" font-size="22.2957" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Non-parallel Job (completions=1, parallelism=1):</text>
  <rect x="40" y="100.2597" width="272.7272" height="60.2597" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="176.3636" y="137.9221" text-anchor="middle" font-size="20.5806" fill="var(--text)" font-family="Arial, sans-serif">Task 1</text>
  <line x1="312.7273" y1="130.3896" x2="421.8181" y2="130.3896" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="462.7272" y="137.9221" font-size="20.5806" fill="var(--ok-accent)" font-family="Arial, sans-serif">Done</text>
  <text x="40" y="205.7143" font-size="22.2957" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Parallel with fixed completions (completions=6, parallelism=3):</text>
  <rect x="40" y="220.7792" width="272.7272" height="60.2597" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="176.3636" y="258.4415" text-anchor="middle" font-size="20.5806" fill="var(--text)" font-family="Arial, sans-serif">Task 1</text>
  <rect x="353.6364" y="220.7792" width="272.7272" height="60.2597" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="258.4415" text-anchor="middle" font-size="20.5806" fill="var(--text)" font-family="Arial, sans-serif">Task 2</text>
  <rect x="667.2727" y="220.7792" width="272.7272" height="60.2597" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="803.6363" y="258.4415" text-anchor="middle" font-size="20.5806" fill="var(--text)" font-family="Arial, sans-serif">Task 3</text>
  <text x="994.5454" y="258.4415" font-size="18.8655" fill="var(--text-muted)" font-family="Arial, sans-serif">wave 1</text>
  <rect x="40" y="296.1038" width="272.7272" height="60.2597" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="176.3636" y="333.7662" text-anchor="middle" font-size="20.5806" fill="var(--text)" font-family="Arial, sans-serif">Task 4</text>
  <rect x="353.6364" y="296.1038" width="272.7272" height="60.2597" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="333.7662" text-anchor="middle" font-size="20.5806" fill="var(--text)" font-family="Arial, sans-serif">Task 5</text>
  <rect x="667.2727" y="296.1038" width="272.7272" height="60.2597" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="803.6363" y="333.7662" text-anchor="middle" font-size="20.5806" fill="var(--text)" font-family="Arial, sans-serif">Task 6</text>
  <text x="994.5454" y="333.7662" font-size="18.8655" fill="var(--text-muted)" font-family="Arial, sans-serif">wave 2</text>
  <text x="40" y="409.0909" font-size="22.2957" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Work queue (completions=null, parallelism=5):</text>
  <rect x="40" y="424.1558" width="218.1818" height="60.2597" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="149.0909" y="461.8181" text-anchor="middle" font-size="18.8655" fill="var(--text)" font-family="Arial, sans-serif">W-1</text>
  <rect x="285.4545" y="424.1558" width="218.1818" height="60.2597" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="394.5455" y="461.8181" text-anchor="middle" font-size="18.8655" fill="var(--text)" font-family="Arial, sans-serif">W-2</text>
  <rect x="530.9091" y="424.1558" width="218.1818" height="60.2597" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="461.8181" text-anchor="middle" font-size="18.8655" fill="var(--text)" font-family="Arial, sans-serif">W-3</text>
  <rect x="776.3636" y="424.1558" width="218.1818" height="60.2597" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="885.4546" y="461.8181" text-anchor="middle" font-size="18.8655" fill="var(--text)" font-family="Arial, sans-serif">W-4</text>
  <rect x="1021.8182" y="424.1558" width="218.1818" height="60.2597" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1130.909" y="461.8181" text-anchor="middle" font-size="18.8655" fill="var(--text)" font-family="Arial, sans-serif">W-5</text>
  <line x1="149.0909" y1="484.4156" x2="640" y2="552.2078" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="394.5455" y1="484.4156" x2="640" y2="552.2078" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="640" y1="484.4156" x2="640" y2="552.2078" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="885.4546" y1="484.4156" x2="640" y2="552.2078" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="1130.909" y1="484.4156" x2="640" y2="552.2078" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="449.0909" y="552.2078" width="381.8181" height="67.7922" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="586.8571" text-anchor="middle" font-size="20.5806" fill="var(--text)" font-family="Arial, sans-serif">Work Queue</text>
  <text x="640" y="609.4545" text-anchor="middle" font-size="17.1504" fill="var(--text-muted)" font-family="Arial, sans-serif">(external)</text>
</svg>

  <text x="640" y="461.8181" text-anchor="middle" font-size="18.8655" fill="var(--text)">W-3</text>
  <rect x="776.3636" y="424.1558" width="218.1818" height="60.2597" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="885.4546" y="461.8181" text-anchor="middle" font-size="18.8655" fill="var(--text)">W-4</text>

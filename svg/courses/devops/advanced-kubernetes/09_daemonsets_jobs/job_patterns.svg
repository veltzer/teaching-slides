  <rect x="40" y="100.2597" width="272.7272" height="60.2597" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="176.3636" y="137.9221" text-anchor="middle" font-size="20.5806" fill="var(--text)">Task 1</text>
  <line x1="312.7273" y1="130.3896" x2="421.8181" y2="130.3896" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="462.7272" y="137.9221" font-size="20.5806" fill="var(--ok-accent)">Done</text>
  <text x="40" y="205.7143" font-size="22.2957" font-weight="bold" fill="var(--ok-accent)">Parallel with fixed completions (completions=6, parallelism=3):</text>
  <rect x="40" y="220.7792" width="272.7272" height="60.2597" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="176.3636" y="258.4415" text-anchor="middle" font-size="20.5806" fill="var(--text)">Task 1</text>
  <rect x="353.6364" y="220.7792" width="272.7272" height="60.2597" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="258.4415" text-anchor="middle" font-size="20.5806" fill="var(--text)">Task 2</text>
  <rect x="667.2727" y="220.7792" width="272.7272" height="60.2597" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="803.6363" y="258.4415" text-anchor="middle" font-size="20.5806" fill="var(--text)">Task 3</text>
  <text x="994.5454" y="258.4415" font-size="18.8655" fill="var(--text-muted)">wave 1</text>
  <rect x="40" y="296.1038" width="272.7272" height="60.2597" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="176.3636" y="333.7662" text-anchor="middle" font-size="20.5806" fill="var(--text)">Task 4</text>

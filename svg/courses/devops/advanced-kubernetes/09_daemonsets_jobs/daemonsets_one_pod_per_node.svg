<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="650.9091" y="40" text-anchor="middle" font-size="34.1789" font-weight="bold" fill="var(--text)">DaemonSets: One Pod Per Node</text>
  <rect x="40" y="74.1176" width="370.909" height="432.1569" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="225.4545" y="130.9803" text-anchor="middle" font-size="27.7704" font-weight="bold" fill="var(--primary-accent)">Node 1</text>
  <rect x="83.6363" y="153.7255" width="283.6365" height="90.9804" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="225.4545" y="210.5882" text-anchor="middle" font-size="25.6342" fill="var(--text)">App Pods</text>
  <rect x="83.6363" y="267.451" width="283.6365" height="113.7255" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="225.4545" y="319.7647" text-anchor="middle" font-size="25.6342" font-weight="bold" fill="var(--danger-accent)">DaemonSet</text>
  <text x="225.4545" y="358.4314" text-anchor="middle" font-size="23.4981" fill="var(--text)">Pod</text>
  <rect x="454.5454" y="74.1176" width="370.909" height="432.1569" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="130.9803" text-anchor="middle" font-size="27.7704" font-weight="bold" fill="var(--primary-accent)">Node 2</text>
  <rect x="498.1817" y="153.7255" width="283.6365" height="90.9804" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="210.5882" text-anchor="middle" font-size="25.6342" fill="var(--text)">App Pods</text>
  <rect x="498.1817" y="267.451" width="283.6365" height="113.7255" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="319.7647" text-anchor="middle" font-size="25.6342" font-weight="bold" fill="var(--danger-accent)">DaemonSet</text>
  <text x="640" y="358.4314" text-anchor="middle" font-size="23.4981" fill="var(--text)">Pod</text>
  <rect x="869.091" y="74.1176" width="370.909" height="432.1569" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1054.5455" y="130.9803" text-anchor="middle" font-size="27.7704" font-weight="bold" fill="var(--primary-accent)">Node 3</text>
  <rect x="912.7273" y="153.7255" width="283.6365" height="90.9804" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1054.5455" y="210.5882" text-anchor="middle" font-size="25.6342" fill="var(--text)">App Pods</text>
  <rect x="912.7273" y="267.451" width="283.6365" height="113.7255" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1054.5455" y="319.7647" text-anchor="middle" font-size="25.6342" font-weight="bold" fill="var(--danger-accent)">DaemonSet</text>
  <text x="1054.5455" y="358.4314" text-anchor="middle" font-size="23.4981" fill="var(--text)">Pod</text>
  <text x="650.9091" y="574.5098" text-anchor="middle" font-size="25.6342" fill="var(--text)">Exactly one DaemonSet pod per node.</text>
  <text x="650.9091" y="620" text-anchor="middle" font-size="25.6342" fill="var(--text-muted)">New node added = DaemonSet pod auto-created.</text>
</svg>
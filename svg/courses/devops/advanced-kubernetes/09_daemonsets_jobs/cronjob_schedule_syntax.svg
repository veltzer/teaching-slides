  <ns0:text x="890.006" y="266.8169" font-size="21.6338" fill="#4a90e2">day of week (0-6)</ns0:text>
  <ns0:text x="608.9515" y="306.4789" text-anchor="middle" font-size="43.2676" font-family="monospace" font-weight="bold" fill="#333">* * * * *</ns0:text>

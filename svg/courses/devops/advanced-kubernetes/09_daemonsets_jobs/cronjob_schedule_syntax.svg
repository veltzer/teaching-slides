<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="608.9515" y="45.0704" text-anchor="middle" font-size="28.8451" font-weight="bold" fill="var(--text-dark)">CronJob Schedule Syntax</text>
  <rect x="70.2637" y="72.1127" width="1077.3757" height="252.3944" rx="9.0141" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="3.6057" />
  <text x="187.3697" y="122.5915" font-size="21.6338" fill="var(--primary-bright)">minute (0-59)</text>
  <text x="363.0288" y="158.6478" font-size="21.6338" fill="var(--primary-bright)">hour (0-23)</text>
  <text x="538.6878" y="194.7042" font-size="21.6338" fill="var(--primary-bright)">day of month (1-31)</text>
  <text x="714.3469" y="230.7605" font-size="21.6338" fill="var(--primary-bright)">month (1-12)</text>
  <text x="890.006" y="266.8169" font-size="21.6338" fill="var(--primary-bright)">day of week (0-6)</text>
  <text x="608.9515" y="306.4789" text-anchor="middle" font-size="43.2676" font-family="monospace" font-weight="bold" fill="var(--text-dark)">* * * * *</text>
  <line x1="459.0557" y1="279.4366" x2="187.3697" y2="126.1972" stroke="var(--primary-bright)" stroke-width="1.8028" stroke-dasharray="5.4084 5.4084" />
  <line x1="534.0036" y1="279.4366" x2="363.0288" y2="162.2535" stroke="var(--primary-bright)" stroke-width="1.8028" stroke-dasharray="5.4084 5.4084" />
  <line x1="608.9515" y1="279.4366" x2="538.6878" y2="198.3099" stroke="var(--primary-bright)" stroke-width="1.8028" stroke-dasharray="5.4084 5.4084" />
  <line x1="683.8993" y1="279.4366" x2="714.3469" y2="234.3662" stroke="var(--primary-bright)" stroke-width="1.8028" stroke-dasharray="5.4084 5.4084" />
  <line x1="758.8473" y1="279.4366" x2="890.006" y2="270.4225" stroke="var(--primary-bright)" stroke-width="1.8028" stroke-dasharray="5.4084 5.4084" />
  <text x="93.6848" y="378.5915" font-size="25.2394" font-weight="bold" fill="var(--text-dark)">Examples:</text>
  <rect x="93.6848" y="396.6197" width="468.4242" height="54.0845" rx="9.0141" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.8028" />
  <text x="117.106" y="432.676" font-size="21.6338" font-family="monospace" fill="var(--text-dark)">"0 * * * *"</text>
  <text x="608.9515" y="432.676" font-size="21.6338" fill="var(--text-mid)">Every hour</text>
  <rect x="93.6848" y="459.7183" width="468.4242" height="54.0845" rx="9.0141" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.8028" />
  <text x="117.106" y="495.7746" font-size="21.6338" font-family="monospace" fill="var(--text-dark)">"*/15 * * * *"</text>
  <text x="608.9515" y="495.7746" font-size="21.6338" fill="var(--text-mid)">Every 15 minutes</text>
  <rect x="93.6848" y="522.8169" width="468.4242" height="54.0845" rx="9.0141" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="1.8028" />
  <text x="117.106" y="558.8732" font-size="21.6338" font-family="monospace" fill="var(--text-dark)">"0 2 * * *"</text>
  <text x="608.9515" y="558.8732" font-size="21.6338" fill="var(--text-mid)">Daily at 2 AM</text>
  <rect x="93.6848" y="585.9155" width="468.4242" height="54.0845" rx="9.0141" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="1.8028" />
  <text x="117.106" y="621.9718" font-size="21.6338" font-family="monospace" fill="var(--text-dark)">"0 0 * * 0"</text>
  <text x="608.9515" y="621.9718" font-size="21.6338" fill="var(--text-mid)">Weekly on Sunday</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="47.3684" text-anchor="middle" font-size="30.3158" font-weight="bold" fill="#333">CronJob Schedule Syntax</text>
  <rect x="73.8462" y="75.7895" width="1132.3077" height="265.2632" rx="9.4737" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.7895" />
  <text x="196.9231" y="128.8421" font-size="22.7368" fill="#4a90e2">minute (0-59)</text>
  <text x="381.5385" y="166.7368" font-size="22.7368" fill="#4a90e2">hour (0-23)</text>
  <text x="566.1538" y="204.6316" font-size="22.7368" fill="#4a90e2">day of month (1-31)</text>
  <text x="750.7692" y="242.5263" font-size="22.7368" fill="#4a90e2">month (1-12)</text>
  <text x="935.3846" y="280.4211" font-size="22.7368" fill="#4a90e2">day of week (0-6)</text>
  <text x="640" y="322.1053" text-anchor="middle" font-size="45.4737" font-family="monospace" font-weight="bold" fill="#333">* * * * *</text>
  <line x1="482.4615" y1="293.6842" x2="196.9231" y2="132.6316" stroke="#4a90e2" stroke-width="1.8947" stroke-dasharray="5.6842 5.6842" />
  <line x1="561.2308" y1="293.6842" x2="381.5385" y2="170.5263" stroke="#4a90e2" stroke-width="1.8947" stroke-dasharray="5.6842 5.6842" />
  <line x1="640" y1="293.6842" x2="566.1538" y2="208.4211" stroke="#4a90e2" stroke-width="1.8947" stroke-dasharray="5.6842 5.6842" />
  <line x1="718.7692" y1="293.6842" x2="750.7692" y2="246.3158" stroke="#4a90e2" stroke-width="1.8947" stroke-dasharray="5.6842 5.6842" />
  <line x1="797.5385" y1="293.6842" x2="935.3846" y2="284.2105" stroke="#4a90e2" stroke-width="1.8947" stroke-dasharray="5.6842 5.6842" />
  <text x="98.4615" y="397.8947" font-size="26.5263" font-weight="bold" fill="#333">Examples:</text>
  <rect x="98.4615" y="416.8421" width="492.3077" height="56.8421" rx="9.4737" fill="#d4edda" stroke="#28a745" stroke-width="1.8947" />
  <text x="123.0769" y="454.7368" font-size="22.7368" font-family="monospace" fill="#333">"0 * * * *"</text>
  <text x="640" y="454.7368" font-size="22.7368" fill="#666">Every hour</text>
  <rect x="98.4615" y="483.1579" width="492.3077" height="56.8421" rx="9.4737" fill="#d4edda" stroke="#28a745" stroke-width="1.8947" />
  <text x="123.0769" y="521.0526" font-size="22.7368" font-family="monospace" fill="#333">"*/15 * * * *"</text>
  <text x="640" y="521.0526" font-size="22.7368" fill="#666">Every 15 minutes</text>
  <rect x="98.4615" y="549.4737" width="492.3077" height="56.8421" rx="9.4737" fill="#fff3cd" stroke="#ffc107" stroke-width="1.8947" />
  <text x="123.0769" y="587.3684" font-size="22.7368" font-family="monospace" fill="#333">"0 2 * * *"</text>
  <text x="640" y="587.3684" font-size="22.7368" fill="#666">Daily at 2 AM</text>
  <rect x="98.4615" y="615.7895" width="492.3077" height="56.8421" rx="9.4737" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.8947" />
  <text x="123.0769" y="653.6842" font-size="22.7368" font-family="monospace" fill="#333">"0 0 * * 0"</text>
  <text x="640" y="653.6842" font-size="22.7368" fill="#666">Weekly on Sunday</text>
</svg>
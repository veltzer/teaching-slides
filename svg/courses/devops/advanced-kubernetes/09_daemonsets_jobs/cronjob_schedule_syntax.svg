<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="30.058" font-weight="bold" fill="var(--text)">CronJob Schedule Syntax</text>
  <rect x="40" y="66.3637" width="1200" height="246.0606" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="170.4347" y="115.5757" font-size="22.5435" fill="var(--primary-accent)">minute (0-59)</text>
  <text x="366.0869" y="150.7272" font-size="22.5435" fill="var(--primary-accent)">hour (0-23)</text>
  <text x="561.739" y="185.8788" font-size="22.5435" fill="var(--primary-accent)">day of month (1-31)</text>
  <text x="757.3912" y="221.0303" font-size="22.5435" fill="var(--primary-accent)">month (1-12)</text>
  <text x="953.0434" y="256.1818" font-size="22.5435" fill="var(--primary-accent)">day of week (0-6)</text>
  <text x="639.9999" y="294.8485" text-anchor="middle" font-size="45.087" font-family="monospace" font-weight="bold" fill="var(--text)">* * * * *</text>
  <line x1="473.0434" y1="268.4848" x2="170.4347" y2="119.0909" stroke="var(--primary-border)" stroke-width="1.8028" stroke-dasharray="5.4084 5.4084" />
  <line x1="556.5217" y1="268.4848" x2="366.0869" y2="154.2424" stroke="var(--primary-border)" stroke-width="1.8028" stroke-dasharray="5.4084 5.4084" />
  <line x1="639.9999" y1="268.4848" x2="561.739" y2="189.394" stroke="var(--primary-border)" stroke-width="1.8028" stroke-dasharray="5.4084 5.4084" />
  <line x1="723.4781" y1="268.4848" x2="757.3912" y2="224.5455" stroke="var(--primary-border)" stroke-width="1.8028" stroke-dasharray="5.4084 5.4084" />
  <line x1="806.9565" y1="268.4848" x2="953.0434" y2="259.6969" stroke="var(--primary-border)" stroke-width="1.8028" stroke-dasharray="5.4084 5.4084" />
  <text x="66.0868" y="365.1515" font-size="26.3007" font-weight="bold" fill="var(--text)">Examples:</text>
  <rect x="66.0868" y="382.7273" width="521.7391" height="52.7273" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="92.1738" y="417.8787" font-size="22.5435" font-family="monospace" fill="var(--text)">"0 * * * *"</text>
  <text x="639.9999" y="417.8787" font-size="22.5435" fill="var(--text-muted)">Every hour</text>
  <rect x="66.0868" y="444.2424" width="521.7391" height="52.7273" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="92.1738" y="479.3939" font-size="22.5435" font-family="monospace" fill="var(--text)">"*/15 * * * *"</text>
  <text x="639.9999" y="479.3939" font-size="22.5435" fill="var(--text-muted)">Every 15 minutes</text>
  <rect x="66.0868" y="505.7576" width="521.7391" height="52.7273" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="92.1738" y="540.9091" font-size="22.5435" font-family="monospace" fill="var(--text)">"0 2 * * *"</text>
  <text x="639.9999" y="540.9091" font-size="22.5435" fill="var(--text-muted)">Daily at 2 AM</text>
  <rect x="66.0868" y="567.2727" width="521.7391" height="52.7273" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="92.1738" y="602.4242" font-size="22.5435" font-family="monospace" fill="var(--text)">"0 0 * * 0"</text>
  <text x="639.9999" y="602.4242" font-size="22.5435" fill="var(--text-muted)">Weekly on Sunday</text>
</svg>
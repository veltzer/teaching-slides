  <ns0:line x1="534.0036" y1="279.4366" x2="363.0288" y2="162.2535" stroke="#4a90e2" stroke-width="1.8028" stroke-dasharray="5.4084 5.4084" />
  <ns0:line x1="608.9515" y1="279.4366" x2="538.6878" y2="198.3099" stroke="#4a90e2" stroke-width="1.8028" stroke-dasharray="5.4084 5.4084" />
  <ns0:line x1="683.8993" y1="279.4366" x2="714.3469" y2="234.3662" stroke="#4a90e2" stroke-width="1.8028" stroke-dasharray="5.4084 5.4084" />
  <ns0:line x1="758.8473" y1="279.4366" x2="890.006" y2="270.4225" stroke="#4a90e2" stroke-width="1.8028" stroke-dasharray="5.4084 5.4084" />
  <ns0:text x="93.6848" y="378.5915" font-size="25.2394" font-weight="bold" fill="#333">Examples:</ns0:text>
  <ns0:rect x="93.6848" y="396.6197" width="468.4242" height="54.0845" rx="9.0141" fill="#d4edda" stroke="#28a745" stroke-width="1.8028" />
  <ns0:text x="117.106" y="432.676" font-size="21.6338" font-family="monospace" fill="#333">"0 * * * *"</ns0:text>
  <ns0:text x="608.9515" y="432.676" font-size="21.6338" fill="#666">Every hour</ns0:text>
  <ns0:rect x="93.6848" y="459.7183" width="468.4242" height="54.0845" rx="9.0141" fill="#d4edda" stroke="#28a745" stroke-width="1.8028" />
  <ns0:text x="117.106" y="495.7746" font-size="21.6338" font-family="monospace" fill="#333">"*/15 * * * *"</ns0:text>
  <ns0:text x="608.9515" y="495.7746" font-size="21.6338" fill="#666">Every 15 minutes</ns0:text>
  <ns0:rect x="93.6848" y="522.8169" width="468.4242" height="54.0845" rx="9.0141" fill="#fff3cd" stroke="#ffc107" stroke-width="1.8028" />
  <ns0:text x="117.106" y="558.8732" font-size="21.6338" font-family="monospace" fill="#333">"0 2 * * *"</ns0:text>
  <ns0:text x="608.9515" y="558.8732" font-size="21.6338" fill="#666">Daily at 2 AM</ns0:text>
  <ns0:rect x="93.6848" y="585.9155" width="468.4242" height="54.0845" rx="9.0141" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.8028" />
  <ns0:text x="117.106" y="621.9718" font-size="21.6338" font-family="monospace" fill="#333">"0 0 * * 0"</ns0:text>
  <ns0:text x="608.9515" y="621.9718" font-size="21.6338" fill="#666">Weekly on Sunday</ns0:text>
</ns0:svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:text x="608.9515" y="45.0704" text-anchor="middle" font-size="28.8451" font-weight="bold" fill="#333">CronJob Schedule Syntax</ns0:text>
  <ns0:rect x="70.2637" y="72.1127" width="1077.3757" height="252.3944" rx="9.0141" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.6057" />
  <ns0:text x="187.3697" y="122.5915" font-size="21.6338" fill="#4a90e2">minute (0-59)</ns0:text>

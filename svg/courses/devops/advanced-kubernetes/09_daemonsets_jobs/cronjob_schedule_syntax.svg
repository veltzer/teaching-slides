<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="Arial, sans-serif">
  <text x="260" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">CronJob Schedule Syntax</text>
  <rect x="30" y="40" width="460" height="140" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="80" y="68" font-size="12" fill="#4a90e2">minute (0-59)</text>
  <text x="155" y="88" font-size="12" fill="#4a90e2">hour (0-23)</text>
  <text x="230" y="108" font-size="12" fill="#4a90e2">day of month (1-31)</text>
  <text x="305" y="128" font-size="12" fill="#4a90e2">month (1-12)</text>
  <text x="380" y="148" font-size="12" fill="#4a90e2">day of week (0-6)</text>
  <text x="260" y="170" text-anchor="middle" font-size="24" font-family="monospace" font-weight="bold" fill="#333">* * * * *</text>
  <line x1="196" y1="155" x2="80" y2="70" stroke="#4a90e2" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="228" y1="155" x2="155" y2="90" stroke="#4a90e2" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="260" y1="155" x2="230" y2="110" stroke="#4a90e2" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="292" y1="155" x2="305" y2="130" stroke="#4a90e2" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="324" y1="155" x2="380" y2="150" stroke="#4a90e2" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="40" y="210" font-size="14" font-weight="bold" fill="#333">Examples:</text>
  <rect x="40" y="220" width="200" height="30" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="50" y="240" font-size="12" font-family="monospace" fill="#333">"0 * * * *"</text>
  <text x="260" y="240" font-size="12" fill="#666">Every hour</text>
  <rect x="40" y="255" width="200" height="30" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="50" y="275" font-size="12" font-family="monospace" fill="#333">"*/15 * * * *"</text>
  <text x="260" y="275" font-size="12" fill="#666">Every 15 minutes</text>
  <rect x="40" y="290" width="200" height="30" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="50" y="310" font-size="12" font-family="monospace" fill="#333">"0 2 * * *"</text>
  <text x="260" y="310" font-size="12" fill="#666">Daily at 2 AM</text>
  <rect x="40" y="325" width="200" height="30" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="50" y="345" font-size="12" font-family="monospace" fill="#333">"0 0 * * 0"</text>
  <text x="260" y="345" font-size="12" fill="#666">Weekly on Sunday</text>
</svg>

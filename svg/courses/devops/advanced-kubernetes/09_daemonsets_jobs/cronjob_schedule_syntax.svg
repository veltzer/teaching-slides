<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="257.777801058204" rx="6.141196141572" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="170.4347" y="91.555434497341" font-size="23.074009202922" fill="var(--primary-accent)" font-family="Arial, sans-serif">minute (0-59)</text>
  <text x="366.0869" y="128.380819682524" font-size="23.074009202922" fill="var(--primary-accent)" font-family="Arial, sans-serif">hour (0-23)</text>
  <text x="561.739" y="165.206309629625" font-size="23.074009202922" fill="var(--primary-accent)" font-family="Arial, sans-serif">day of month (1-31)</text>
  <text x="757.3912" y="202.031694814809" font-size="23.074009202922" fill="var(--primary-accent)" font-family="Arial, sans-serif">month (1-12)</text>
  <text x="953.0434" y="238.857079999993" font-size="23.074009202922" fill="var(--primary-accent)" font-family="Arial, sans-serif">day of week (0-6)</text>
  <text x="639.9999" y="279.365056084653" text-anchor="middle" font-size="46.148018405844" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">* * * * *</text>
  <line x1="473.0434" y1="251.745938624328" x2="170.4347" y2="95.238025396817" stroke="var(--primary-border)" stroke-width="1.8028" stroke-dasharray="5.4084 5.4084"/>
  <line x1="556.5217" y1="251.745938624328" x2="366.0869" y2="132.063410582001" stroke="var(--primary-border)" stroke-width="1.8028" stroke-dasharray="5.4084 5.4084"/>
  <line x1="639.9999" y1="251.745938624328" x2="561.739" y2="168.888900529102" stroke="var(--primary-border)" stroke-width="1.8028" stroke-dasharray="5.4084 5.4084"/>
  <line x1="723.4781" y1="251.745938624328" x2="757.3912" y2="205.714285714286" stroke="var(--primary-border)" stroke-width="1.8028" stroke-dasharray="5.4084 5.4084"/>
  <line x1="806.9565" y1="251.745938624328" x2="953.0434" y2="242.539566137553" stroke="var(--primary-border)" stroke-width="1.8028" stroke-dasharray="5.4084 5.4084"/>
  <text x="66.0868" y="353.015826455021" font-size="26.919626226775" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Examples:</text>
  <rect x="66.0868" y="371.428571428571" width="521.7391" height="55.238130158734" rx="6.141196141572" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="92.1738" y="408.253851851838" font-size="23.074009202922" fill="var(--text)" font-family="Courier New, monospace">"0 * * * *"</text>
  <text x="639.9999" y="408.253851851838" font-size="23.074009202922" fill="var(--text-muted)" font-family="Arial, sans-serif">Every hour</text>
  <rect x="66.0868" y="435.872969312164" width="521.7391" height="55.238130158734" rx="6.141196141572" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="92.1738" y="472.698354497348" font-size="23.074009202922" fill="var(--text)" font-family="Courier New, monospace">"*/15 * * * *"</text>
  <text x="639.9999" y="472.698354497348" font-size="23.074009202922" fill="var(--text-muted)" font-family="Arial, sans-serif">Every 15 minutes</text>
  <rect x="66.0868" y="500.317471957673" width="521.7391" height="55.238130158734" rx="6.141196141572" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="92.1738" y="537.142857142857" font-size="23.074009202922" fill="var(--text)" font-family="Courier New, monospace">"0 2 * * *"</text>
  <text x="639.9999" y="537.142857142857" font-size="23.074009202922" fill="var(--text-muted)" font-family="Arial, sans-serif">Daily at 2 AM</text>
  <rect x="66.0868" y="564.761869841266" width="521.7391" height="55.238130158734" rx="6.141196141572" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="92.1738" y="601.58725502645" font-size="23.074009202922" fill="var(--text)" font-family="Courier New, monospace">"0 0 * * 0"</text>
  <text x="639.9999" y="601.58725502645" font-size="23.074009202922" fill="var(--text-muted)" font-family="Arial, sans-serif">Weekly on Sunday</text>
</svg>

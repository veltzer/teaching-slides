<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="608.9515" y="45.0704" text-anchor="middle" font-size="28.8451" font-weight="bold" fill="var(--text)">CronJob Schedule Syntax</text>
  <rect x="70.2637" y="72.1127" width="1077.3757" height="252.3944" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="187.3697" y="122.5915" font-size="21.6338" fill="var(--primary-accent)">minute (0-59)</text>
  <text x="363.0288" y="158.6478" font-size="21.6338" fill="var(--primary-accent)">hour (0-23)</text>
  <text x="538.6878" y="194.7042" font-size="21.6338" fill="var(--primary-accent)">day of month (1-31)</text>
  <text x="714.3469" y="230.7605" font-size="21.6338" fill="var(--primary-accent)">month (1-12)</text>
  <text x="890.006" y="266.8169" font-size="21.6338" fill="var(--primary-accent)">day of week (0-6)</text>
  <text x="608.9515" y="306.4789" text-anchor="middle" font-size="43.2676" font-family="monospace" font-weight="bold" fill="var(--text)">* * * * *</text>
  <line x1="459.0557" y1="279.4366" x2="187.3697" y2="126.1972" stroke="var(--primary-border)" stroke-width="1.8028" stroke-dasharray="5.4084 5.4084" />
  <line x1="534.0036" y1="279.4366" x2="363.0288" y2="162.2535" stroke="var(--primary-border)" stroke-width="1.8028" stroke-dasharray="5.4084 5.4084" />
  <line x1="608.9515" y1="279.4366" x2="538.6878" y2="198.3099" stroke="var(--primary-border)" stroke-width="1.8028" stroke-dasharray="5.4084 5.4084" />
  <line x1="683.8993" y1="279.4366" x2="714.3469" y2="234.3662" stroke="var(--primary-border)" stroke-width="1.8028" stroke-dasharray="5.4084 5.4084" />
  <line x1="758.8473" y1="279.4366" x2="890.006" y2="270.4225" stroke="var(--primary-border)" stroke-width="1.8028" stroke-dasharray="5.4084 5.4084" />
  <text x="93.6848" y="378.5915" font-size="25.2394" font-weight="bold" fill="var(--text)">Examples:</text>
  <rect x="93.6848" y="396.6197" width="468.4242" height="54.0845" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="117.106" y="432.676" font-size="21.6338" font-family="monospace" fill="var(--text)">"0 * * * *"</text>
  <text x="608.9515" y="432.676" font-size="21.6338" fill="var(--text-muted)">Every hour</text>
  <rect x="93.6848" y="459.7183" width="468.4242" height="54.0845" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="117.106" y="495.7746" font-size="21.6338" font-family="monospace" fill="var(--text)">"*/15 * * * *"</text>
  <text x="608.9515" y="495.7746" font-size="21.6338" fill="var(--text-muted)">Every 15 minutes</text>
  <rect x="93.6848" y="522.8169" width="468.4242" height="54.0845" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="117.106" y="558.8732" font-size="21.6338" font-family="monospace" fill="var(--text)">"0 2 * * *"</text>
  <text x="608.9515" y="558.8732" font-size="21.6338" fill="var(--text-muted)">Daily at 2 AM</text>
  <rect x="93.6848" y="585.9155" width="468.4242" height="54.0845" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="117.106" y="621.9718" font-size="21.6338" font-family="monospace" fill="var(--text)">"0 0 * * 0"</text>
  <text x="608.9515" y="621.9718" font-size="21.6338" fill="var(--text-muted)">Weekly on Sunday</text>
</svg>
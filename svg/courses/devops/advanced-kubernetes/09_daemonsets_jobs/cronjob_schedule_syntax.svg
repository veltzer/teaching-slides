<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="30.058" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">CronJob Schedule Syntax</text>
  <rect x="40" y="66.3637" width="1200" height="246.0606" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="170.4347" y="115.5757" font-size="22.5435" fill="var(--primary-accent)" font-family="Arial, sans-serif">minute (0-59)</text>
  <text x="366.0869" y="150.7272" font-size="22.5435" fill="var(--primary-accent)" font-family="Arial, sans-serif">hour (0-23)</text>
  <text x="561.739" y="185.8788" font-size="22.5435" fill="var(--primary-accent)" font-family="Arial, sans-serif">day of month (1-31)</text>
  <text x="757.3912" y="221.0303" font-size="22.5435" fill="var(--primary-accent)" font-family="Arial, sans-serif">month (1-12)</text>
  <text x="953.0434" y="256.1818" font-size="22.5435" fill="var(--primary-accent)" font-family="Arial, sans-serif">day of week (0-6)</text>
  <text x="639.9999" y="294.8485" text-anchor="middle" font-size="45.087" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">* * * * *</text>
  <line x1="473.0434" y1="268.4848" x2="170.4347" y2="119.0909" stroke="var(--primary-border)" stroke-width="1.8028" stroke-dasharray="5.4084 5.4084" />
  <line x1="556.5217" y1="268.4848" x2="366.0869" y2="154.2424" stroke="var(--primary-border)" stroke-width="1.8028" stroke-dasharray="5.4084 5.4084" />
  <line x1="639.9999" y1="268.4848" x2="561.739" y2="189.394" stroke="var(--primary-border)" stroke-width="1.8028" stroke-dasharray="5.4084 5.4084" />
  <line x1="723.4781" y1="268.4848" x2="757.3912" y2="224.5455" stroke="var(--primary-border)" stroke-width="1.8028" stroke-dasharray="5.4084 5.4084" />
  <line x1="806.9565" y1="268.4848" x2="953.0434" y2="259.6969" stroke="var(--primary-border)" stroke-width="1.8028" stroke-dasharray="5.4084 5.4084" />
  <text x="66.0868" y="365.1515" font-size="26.3007" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Examples:</text>
  <rect x="66.0868" y="382.7273" width="521.7391" height="52.7273" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="92.1738" y="417.8787" font-size="22.5435" fill="var(--text)" font-family="Courier New, monospace">"0 * * * *"</text>
  <text x="639.9999" y="417.8787" font-size="22.5435" fill="var(--text-muted)" font-family="Arial, sans-serif">Every hour</text>
  <rect x="66.0868" y="444.2424" width="521.7391" height="52.7273" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="92.1738" y="479.3939" font-size="22.5435" fill="var(--text)" font-family="Courier New, monospace">"*/15 * * * *"</text>
  <text x="639.9999" y="479.3939" font-size="22.5435" fill="var(--text-muted)" font-family="Arial, sans-serif">Every 15 minutes</text>
  <rect x="66.0868" y="505.7576" width="521.7391" height="52.7273" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="92.1738" y="540.9091" font-size="22.5435" fill="var(--text)" font-family="Courier New, monospace">"0 2 * * *"</text>
  <text x="639.9999" y="540.9091" font-size="22.5435" fill="var(--text-muted)" font-family="Arial, sans-serif">Daily at 2 AM</text>
  <rect x="66.0868" y="567.2727" width="521.7391" height="52.7273" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="92.1738" y="602.4242" font-size="22.5435" fill="var(--text)" font-family="Courier New, monospace">"0 0 * * 0"</text>
  <text x="639.9999" y="602.4242" font-size="22.5435" fill="var(--text-muted)" font-family="Arial, sans-serif">Weekly on Sunday</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" font-family="Arial, sans-serif">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a90e2"/></marker></defs>
  <text x="200" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Combining Autoscalers</text>
  <rect x="100" y="40" width="200" height="40" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="200" y="65" text-anchor="middle" font-size="13" fill="#333">Traffic Spike</text>
  <line x1="200" y1="80" x2="200" y2="110" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="80" y="110" width="240" height="55" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="200" y="133" text-anchor="middle" font-size="14" font-weight="bold" fill="#28a745">HPA</text>
  <text x="200" y="153" text-anchor="middle" font-size="12" fill="#333">Scale pods to handle load</text>
  <line x1="200" y1="165" x2="200" y2="195" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="195" width="280" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="200" y="220" text-anchor="middle" font-size="13" fill="#333">Pods pending (no resources)</text>
  <line x1="200" y1="235" x2="200" y2="265" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="80" y="265" width="240" height="55" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="200" y="288" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a90e2">Cluster Autoscaler</text>
  <text x="200" y="308" text-anchor="middle" font-size="12" fill="#333">Add nodes</text>
  <line x1="200" y1="320" x2="200" y2="350" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="90" y="350" width="220" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="200" y="375" text-anchor="middle" font-size="13" fill="#28a745">New nodes ready</text>
  <line x1="200" y1="390" x2="200" y2="415" stroke="#28a745" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="200" y="435" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">Pods scheduled</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="22.6341" font-weight="bold" fill="var(--text)">Combining Autoscalers</text>
  <rect x="363.3605" y="61.2194" width="553.2791" height="56.5853" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="640" y="96.5853" text-anchor="middle" font-size="18.3902" fill="var(--text)">Traffic Spike</text>
  <line x1="640" y1="117.8049" x2="640" y2="160.2439" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="308.0325" y="160.2439" width="663.9349" height="77.8048" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640" y="192.7805" text-anchor="middle" font-size="19.8049" font-weight="bold" fill="var(--ok-accent)">HPA</text>
  <text x="640" y="221.0731" text-anchor="middle" font-size="16.9756" fill="var(--text)">Scale pods to handle load</text>
  <line x1="640" y1="238.0488" x2="640" y2="280.4878" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="252.7046" y="280.4878" width="774.5908" height="56.5853" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="315.8537" text-anchor="middle" font-size="18.3902" fill="var(--text)">Pods pending (no resources)</text>
  <line x1="640" y1="337.0732" x2="640" y2="379.5122" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="308.0325" y="379.5122" width="663.9349" height="77.8048" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="412.0487" text-anchor="middle" font-size="19.8049" font-weight="bold" fill="var(--primary-accent)">Cluster Autoscaler</text>
  <text x="640" y="440.3414" text-anchor="middle" font-size="16.9756" fill="var(--text)">Add nodes</text>
  <line x1="640" y1="457.3171" x2="640" y2="499.7561" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="335.6965" y="499.7561" width="608.607" height="56.5853" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640" y="535.122" text-anchor="middle" font-size="18.3902" fill="var(--ok-accent)">New nodes ready</text>
  <line x1="640" y1="556.3415" x2="640" y2="591.7073" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="640" y="620" text-anchor="middle" font-size="18.3902" font-weight="bold" fill="var(--ok-accent)">Pods scheduled</text>
</svg>
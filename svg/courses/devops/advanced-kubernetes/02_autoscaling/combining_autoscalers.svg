<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <text x="640" y="40" text-anchor="middle" font-size="22.490038" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Combining Autoscalers: HPA + Cluster Autoscaler</text>

  <rect x="40" y="60.900901" width="1200" height="83.603604" rx="6.133647" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="97.477477" text-anchor="middle" font-size="19.423214" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">1. Traffic spike</text>
  <text x="640" y="125.693694" text-anchor="middle" font-size="15.334117" fill="var(--danger-text)" font-family="Arial, sans-serif">CPU or custom metric crosses the HPA target value</text>

  <line x1="640" y1="149.72973" x2="640" y2="181.081081" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="186.306306" width="1200" height="83.603604" rx="6.133647" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="222.882883" text-anchor="middle" font-size="19.423214" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">2. HPA scales pods</text>
  <text x="640" y="251.099099" text-anchor="middle" font-size="15.334117" fill="var(--ok-text)" font-family="Arial, sans-serif">Deployment replicas increase to absorb the load</text>

  <line x1="640" y1="275.135135" x2="640" y2="306.486486" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="311.711712" width="1200" height="83.603604" rx="6.133647" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="348.288288" text-anchor="middle" font-size="19.423214" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">3. Pods go Pending</text>
  <text x="640" y="376.504505" text-anchor="middle" font-size="15.334117" fill="var(--warn-text)" font-family="Arial, sans-serif">Scheduler has no node with room — event FailedScheduling</text>

  <line x1="640" y1="400.540541" x2="640" y2="431.891892" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="437.117117" width="1200" height="83.603604" rx="6.133647" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="473.693694" text-anchor="middle" font-size="19.423214" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">4. Cluster Autoscaler adds nodes</text>
  <text x="640" y="501.90991" text-anchor="middle" font-size="15.334117" fill="var(--primary-text)" font-family="Arial, sans-serif">Sees pending pods, scales the matching node group up</text>

  <line x1="640" y1="525.945946" x2="640" y2="536.396396" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="541.621622" width="1200" height="78.378378" rx="6.133647" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="576.108108" text-anchor="middle" font-size="19.423214" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">5. Pods scheduled, spike absorbed</text>
  <text x="640" y="604.324324" text-anchor="middle" font-size="15.334117" fill="var(--info-text)" font-family="Arial, sans-serif">On cooldown both scalers shrink back down</text>
</svg>

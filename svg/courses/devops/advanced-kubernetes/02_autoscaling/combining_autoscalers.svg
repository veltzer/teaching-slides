<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <text x="640" y="65" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--text)">Combining Autoscalers: HPA + Cluster Autoscaler</text>

  <rect x="40" y="85" width="1200" height="80" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="640" y="120" text-anchor="middle" font-size="19" font-weight="bold" fill="var(--danger-text)">1. Traffic spike</text>
  <text x="640" y="147" text-anchor="middle" font-size="15" fill="var(--danger-text)">CPU or custom metric crosses the HPA target value</text>

  <line x1="640" y1="170" x2="640" y2="200" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="205" width="1200" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="240" text-anchor="middle" font-size="19" font-weight="bold" fill="var(--ok-text)">2. HPA scales pods</text>
  <text x="640" y="267" text-anchor="middle" font-size="15" fill="var(--ok-text)">Deployment replicas increase to absorb the load</text>

  <line x1="640" y1="290" x2="640" y2="320" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="325" width="1200" height="80" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="360" text-anchor="middle" font-size="19" font-weight="bold" fill="var(--warn-text)">3. Pods go Pending</text>
  <text x="640" y="387" text-anchor="middle" font-size="15" fill="var(--warn-text)">Scheduler has no node with room — event FailedScheduling</text>

  <line x1="640" y1="410" x2="640" y2="440" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="445" width="1200" height="80" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="480" text-anchor="middle" font-size="19" font-weight="bold" fill="var(--primary-text)">4. Cluster Autoscaler adds nodes</text>
  <text x="640" y="507" text-anchor="middle" font-size="15" fill="var(--primary-text)">Sees pending pods, scales the matching node group up</text>

  <line x1="640" y1="530" x2="640" y2="540" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="545" width="1200" height="75" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="578" text-anchor="middle" font-size="19" font-weight="bold" fill="var(--info-text)">5. Pods scheduled, spike absorbed</text>
  <text x="640" y="605" text-anchor="middle" font-size="15" fill="var(--info-text)">On cooldown both scalers shrink back down</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="1200" height="86.728972389204" rx="6.247242706574" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="77.943924642239" text-anchor="middle" font-size="19.782933709703" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">1. Traffic spike</text>
  <text x="640" y="107.214953497895" text-anchor="middle" font-size="15.618106257174" fill="var(--danger-text)" font-family="Arial, sans-serif">CPU or custom metric crosses the HPA target value</text>

  <line x1="640" y1="132.149532904184" x2="640" y2="164.672897031444" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="170.093457546423" width="1200" height="86.728972389204" rx="6.247242706574" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="208.037383226046" text-anchor="middle" font-size="19.782933709703" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">2. HPA scales pods</text>
  <text x="640" y="237.308411044318" text-anchor="middle" font-size="15.618106257174" fill="var(--ok-text)" font-family="Arial, sans-serif">Deployment replicas increase to absorb the load</text>

  <line x1="640" y1="262.242990450607" x2="640" y2="294.766354577867" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="300.18691613023" width="1200" height="86.728972389204" rx="6.247242706574" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="338.130840772469" text-anchor="middle" font-size="19.782933709703" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">3. Pods go Pending</text>
  <text x="640" y="367.401869628125" text-anchor="middle" font-size="15.618106257174" fill="var(--warn-text)" font-family="Arial, sans-serif">Scheduler has no node with room — event FailedScheduling</text>

  <line x1="640" y1="392.336449034413" x2="640" y2="424.859813161673" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="430.280373676653" width="1200" height="86.728972389204" rx="6.247242706574" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="468.224299356276" text-anchor="middle" font-size="19.782933709703" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">4. Cluster Autoscaler adds nodes</text>
  <text x="640" y="497.495327174548" text-anchor="middle" font-size="15.618106257174" fill="var(--primary-text)" font-family="Arial, sans-serif">Sees pending pods, scales the matching node group up</text>

  <line x1="640" y1="522.429906580837" x2="640" y2="533.271027610796" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="538.691589163158" width="1200" height="81.308410836842" rx="6.247242706574" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="574.467289599406" text-anchor="middle" font-size="19.782933709703" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">5. Pods scheduled, spike absorbed</text>
  <text x="640" y="603.738317417678" text-anchor="middle" font-size="15.618106257174" fill="var(--info-text)" font-family="Arial, sans-serif">On cooldown both scalers shrink back down</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-size="22.490038" font-weight="bold" fill="var(--text)">Combining Autoscalers: HPA + Cluster Autoscaler</text>

  <rect x="40" y="60.900901" width="1200" height="83.603604" rx="6.133647" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="97.477477" text-anchor="middle" font-size="19.423214" font-weight="bold" fill="var(--danger-text)">1. Traffic spike</text>
  <text x="640" y="125.693694" text-anchor="middle" font-size="15.334117" fill="var(--danger-text)">CPU or custom metric crosses the HPA target value</text>

  <line x1="640" y1="149.72973" x2="640" y2="181.081081" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="186.306306" width="1200" height="83.603604" rx="6.133647" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="222.882883" text-anchor="middle" font-size="19.423214" font-weight="bold" fill="var(--ok-text)">2. HPA scales pods</text>
  <text x="640" y="251.099099" text-anchor="middle" font-size="15.334117" fill="var(--ok-text)">Deployment replicas increase to absorb the load</text>

  <line x1="640" y1="275.135135" x2="640" y2="306.486486" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="311.711712" width="1200" height="83.603604" rx="6.133647" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="348.288288" text-anchor="middle" font-size="19.423214" font-weight="bold" fill="var(--warn-text)">3. Pods go Pending</text>
  <text x="640" y="376.504505" text-anchor="middle" font-size="15.334117" fill="var(--warn-text)">Scheduler has no node with room — event FailedScheduling</text>

  <line x1="640" y1="400.540541" x2="640" y2="431.891892" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="437.117117" width="1200" height="83.603604" rx="6.133647" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="473.693694" text-anchor="middle" font-size="19.423214" font-weight="bold" fill="var(--primary-text)">4. Cluster Autoscaler adds nodes</text>
  <text x="640" y="501.90991" text-anchor="middle" font-size="15.334117" fill="var(--primary-text)">Sees pending pods, scales the matching node group up</text>

  <line x1="640" y1="525.945946" x2="640" y2="536.396396" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="541.621622" width="1200" height="78.378378" rx="6.133647" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="576.108108" text-anchor="middle" font-size="19.423214" font-weight="bold" fill="var(--info-text)">5. Pods scheduled, spike absorbed</text>
  <text x="640" y="604.324324" text-anchor="middle" font-size="15.334117" fill="var(--info-text)">On cooldown both scalers shrink back down</text>
</svg>

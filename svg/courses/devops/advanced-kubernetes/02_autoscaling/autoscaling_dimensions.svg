<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="42.2462" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Autoscaling Dimensions</text>
  <rect x="373.3333" y="91.1765" width="533.3333" height="170.5882" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="169.6471" text-anchor="middle" font-size="34.3252" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Cluster Autoscaler</text>
  <text x="640" y="227.6471" text-anchor="middle" font-size="29.0444" fill="var(--text-muted)" font-family="Arial, sans-serif">(Add/Remove Nodes)</text>
  <line x1="440" y1="261.7647" x2="262.2223" y2="398.2353" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="640" y1="261.7647" x2="640" y2="398.2353" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="840" y1="261.7647" x2="1017.7777" y2="398.2353" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="40" y="398.2353" width="444.4444" height="221.7647" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="262.2223" y="493.7647" text-anchor="middle" font-size="36.9656" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">HPA</text>
  <text x="262.2223" y="562" text-anchor="middle" font-size="29.0444" fill="var(--text)" font-family="Arial, sans-serif">More/Fewer Pod Replicas</text>
  <rect x="528.8889" y="398.2353" width="222.2223" height="221.7647" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="493.7647" text-anchor="middle" font-size="36.9656" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">VPA</text>
  <text x="640" y="562" text-anchor="middle" font-size="29.0444" fill="var(--text)" font-family="Arial, sans-serif">Bigger/Smaller</text>
  <rect x="795.5556" y="398.2353" width="444.4444" height="221.7647" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1017.7777" y="493.7647" text-anchor="middle" font-size="36.9656" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">KEDA</text>
  <text x="1017.7777" y="562" text-anchor="middle" font-size="29.0444" fill="var(--text)" font-family="Arial, sans-serif">Event-driven Scaling</text>
</svg>
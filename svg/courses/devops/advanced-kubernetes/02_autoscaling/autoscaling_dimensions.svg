<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <text x="640" y="60" text-anchor="middle" font-size="35.3103" font-weight="bold" fill="#333">Autoscaling Dimensions</text>
  <rect x="375.1724" y="96" width="529.6552" height="120" rx="11.0345" fill="#e8f4f8" stroke="#4a90e2" stroke-width="4.4138" />
  <text x="640" y="151.2" text-anchor="middle" font-size="28.6897" font-weight="bold" fill="#4a90e2">Cluster Autoscaler</text>
  <text x="640" y="192" text-anchor="middle" font-size="24.2759" fill="#666">(Add/Remove Nodes)</text>
  <line x1="441.3793" y1="216" x2="264.8276" y2="312" stroke="#4a90e2" stroke-width="4.4138" />
  <line x1="640" y1="216" x2="640" y2="312" stroke="#4a90e2" stroke-width="4.4138" />
  <line x1="838.6207" y1="216" x2="1015.1724" y2="312" stroke="#4a90e2" stroke-width="4.4138" />
  <rect x="44.1379" y="312" width="441.3793" height="156" rx="11.0345" fill="#d4edda" stroke="#28a745" stroke-width="4.4138" />
  <text x="264.8276" y="379.2" text-anchor="middle" font-size="30.8966" font-weight="bold" fill="#28a745">HPA</text>
  <text x="264.8276" y="427.2" text-anchor="middle" font-size="24.2759" fill="#333">More/Fewer Pod Replicas</text>
  <rect x="529.6552" y="312" width="220.6897" height="156" rx="11.0345" fill="#fff3cd" stroke="#ffc107" stroke-width="4.4138" />
  <text x="640" y="379.2" text-anchor="middle" font-size="30.8966" font-weight="bold" fill="#bf360c">VPA</text>
  <text x="640" y="427.2" text-anchor="middle" font-size="24.2759" fill="#333">Bigger/Smaller</text>
  <rect x="794.4828" y="312" width="441.3793" height="156" rx="11.0345" fill="#e8f4f8" stroke="#4a90e2" stroke-width="4.4138" />
  <text x="1015.1724" y="379.2" text-anchor="middle" font-size="30.8966" font-weight="bold" fill="#4a90e2">KEDA</text>
  <text x="1015.1724" y="427.2" text-anchor="middle" font-size="24.2759" fill="#333">Event-driven Scaling</text>
</svg>
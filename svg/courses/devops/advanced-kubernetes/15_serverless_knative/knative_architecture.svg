<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640" y="40" text-anchor="middle" font-size="37.735297" font-weight="bold" fill="var(--primary-accent)">Knative</text>
  <rect x="40" y="72.830237" width="573.913043" height="372.075526" rx="7.290976" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="326.956522" y="127.547119" text-anchor="middle" font-size="29.349581" font-weight="bold" fill="var(--text)">Knative Serving</text>
  <text x="92.173913" y="182.264136" font-size="25.156662" fill="var(--text-muted)">Request-driven</text>
  <text x="92.173913" y="226.037831" font-size="25.156662" fill="var(--text-muted)">Auto-scaling</text>
  <text x="92.173913" y="269.811254" font-size="25.156662" fill="var(--text-muted)">Scale to zero</text>
  <text x="92.173913" y="313.584949" font-size="25.156662" fill="var(--text-muted)">Revisions</text>
  <text x="92.173913" y="357.358509" font-size="25.156662" fill="var(--text-muted)">Traffic splitting</text>
  <rect x="666.086957" y="72.830237" width="573.913043" height="372.075526" rx="7.290976" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="953.043478" y="127.547119" text-anchor="middle" font-size="29.349581" font-weight="bold" fill="var(--text)">Knative Eventing</text>
  <text x="718.260978" y="182.264136" font-size="25.156662" fill="var(--text-muted)">Event-driven</text>
  <text x="718.260978" y="226.037831" font-size="25.156662" fill="var(--text-muted)">Pub/Sub</text>
  <text x="718.260978" y="269.811254" font-size="25.156662" fill="var(--text-muted)">Sources</text>
  <text x="718.260978" y="313.584949" font-size="25.156662" fill="var(--text-muted)">Brokers</text>
  <text x="718.260978" y="357.358509" font-size="25.156662" fill="var(--text-muted)">Triggers</text>
  <rect x="40" y="488.679186" width="1200" height="131.320814" rx="7.290976" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="547.773532" text-anchor="middle" font-size="29.349581" font-weight="bold" fill="var(--text)">Kubernetes Cluster</text>
  <text x="640" y="593.735892" text-anchor="middle" font-size="25.156662" fill="var(--text-muted)">+ Networking (Istio / Kourier / Contour)</text>
  <line x1="326.956522" y1="444.905763" x2="326.956522" y2="484.301993" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#ka)" />
  <line x1="953.043478" y1="444.905763" x2="953.043478" y2="484.301993" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#ka2)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="ka" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 24.6154 9.4737 L 0 18.9474 z" fill="#4a90e2" />
    </marker>
    <marker id="ka2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 24.6154 9.4737 L 0 18.9474 z" fill="#28a745" />
    </marker>
  </defs>
</svg>
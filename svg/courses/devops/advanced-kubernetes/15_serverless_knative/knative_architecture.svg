<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="Arial, sans-serif">
  <!-- Outer Knative box -->
  <rect x="10" y="10" width="500" height="360" rx="5" fill="#f8f9fa" stroke="#4a90e2" stroke-width="2"/>
  <text x="260" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#4a90e2">Knative</text>
  <!-- Serving -->
  <rect x="30" y="55" width="220" height="170" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="140" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Knative Serving</text>
  <text x="50" y="105" font-size="12" fill="#555">Request-driven</text>
  <text x="50" y="125" font-size="12" fill="#555">Auto-scaling</text>
  <text x="50" y="145" font-size="12" fill="#555">Scale to zero</text>
  <text x="50" y="165" font-size="12" fill="#555">Revisions</text>
  <text x="50" y="185" font-size="12" fill="#555">Traffic splitting</text>
  <!-- Eventing -->
  <rect x="270" y="55" width="220" height="170" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="380" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Knative Eventing</text>
  <text x="290" y="105" font-size="12" fill="#555">Event-driven</text>
  <text x="290" y="125" font-size="12" fill="#555">Pub/Sub</text>
  <text x="290" y="145" font-size="12" fill="#555">Sources</text>
  <text x="290" y="165" font-size="12" fill="#555">Brokers</text>
  <text x="290" y="185" font-size="12" fill="#555">Triggers</text>
  <!-- Kubernetes Cluster -->
  <rect x="30" y="245" width="460" height="60" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="260" y="272" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Kubernetes Cluster</text>
  <text x="260" y="293" text-anchor="middle" font-size="12" fill="#555">+ Networking (Istio / Kourier / Contour)</text>
  <!-- Arrows -->
  <line x1="140" y1="225" x2="140" y2="243" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#ka)"/>
  <line x1="380" y1="225" x2="380" y2="243" stroke="#28a745" stroke-width="1.5" marker-end="url(#ka2)"/>
  <defs>
    <marker id="ka" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a90e2"/>
    </marker>
    <marker id="ka2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#28a745"/>
    </marker>
  </defs>
</svg>
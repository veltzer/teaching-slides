<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640" y="40" text-anchor="middle" font-size="37.735297" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Knative</text>
  <rect x="40" y="72.830237" width="573.913043" height="372.075526" rx="7.290976" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="326.956522" y="127.547119" text-anchor="middle" font-size="29.349581" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Knative Serving</text>
  <text x="92.173913" y="182.264136" font-size="25.156662" fill="var(--text-muted)" font-family="Arial, sans-serif">Request-driven</text>
  <text x="92.173913" y="226.037831" font-size="25.156662" fill="var(--text-muted)" font-family="Arial, sans-serif">Auto-scaling</text>
  <text x="92.173913" y="269.811254" font-size="25.156662" fill="var(--text-muted)" font-family="Arial, sans-serif">Scale to zero</text>
  <text x="92.173913" y="313.584949" font-size="25.156662" fill="var(--text-muted)" font-family="Arial, sans-serif">Revisions</text>
  <text x="92.173913" y="357.358509" font-size="25.156662" fill="var(--text-muted)" font-family="Arial, sans-serif">Traffic splitting</text>
  <rect x="666.086957" y="72.830237" width="573.913043" height="372.075526" rx="7.290976" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="953.043478" y="127.547119" text-anchor="middle" font-size="29.349581" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Knative Eventing</text>
  <text x="718.260978" y="182.264136" font-size="25.156662" fill="var(--text-muted)" font-family="Arial, sans-serif">Event-driven</text>
  <text x="718.260978" y="226.037831" font-size="25.156662" fill="var(--text-muted)" font-family="Arial, sans-serif">Pub/Sub</text>
  <text x="718.260978" y="269.811254" font-size="25.156662" fill="var(--text-muted)" font-family="Arial, sans-serif">Sources</text>
  <text x="718.260978" y="313.584949" font-size="25.156662" fill="var(--text-muted)" font-family="Arial, sans-serif">Brokers</text>
  <text x="718.260978" y="357.358509" font-size="25.156662" fill="var(--text-muted)" font-family="Arial, sans-serif">Triggers</text>
  <rect x="40" y="488.679186" width="1200" height="131.320814" rx="7.290976" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="547.773532" text-anchor="middle" font-size="29.349581" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Kubernetes Cluster</text>
  <text x="640" y="593.735892" text-anchor="middle" font-size="25.156662" fill="var(--text-muted)" font-family="Arial, sans-serif">+ Networking (Istio / Kourier / Contour)</text>
  <line x1="326.956522" y1="444.905763" x2="326.956522" y2="484.301993" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="953.043478" y1="444.905763" x2="953.043478" y2="484.301993" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="22.4717" y="17.2973" width="1123.585" height="622.7027" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="584.2642" y="69.1892" text-anchor="middle" font-size="31.1352" font-weight="bold" fill="var(--primary-accent)">Knative</text>
  <rect x="67.4151" y="95.1351" width="494.3774" height="294.0541" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="314.6038" y="138.3783" text-anchor="middle" font-size="24.2162" font-weight="bold" fill="var(--text)">Knative Serving</text>
  <text x="112.3585" y="181.6216" font-size="20.7567" fill="var(--text-muted)">Request-driven</text>
  <text x="112.3585" y="216.2162" font-size="20.7567" fill="var(--text-muted)">Auto-scaling</text>
  <text x="112.3585" y="250.8107" font-size="20.7567" fill="var(--text-muted)">Scale to zero</text>
  <text x="112.3585" y="285.4054" font-size="20.7567" fill="var(--text-muted)">Revisions</text>
  <text x="112.3585" y="320" font-size="20.7567" fill="var(--text-muted)">Traffic splitting</text>
  <rect x="606.7359" y="95.1351" width="494.3774" height="294.0541" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="853.9246" y="138.3783" text-anchor="middle" font-size="24.2162" font-weight="bold" fill="var(--text)">Knative Eventing</text>
  <text x="651.6794" y="181.6216" font-size="20.7567" fill="var(--text-muted)">Event-driven</text>
  <text x="651.6794" y="216.2162" font-size="20.7567" fill="var(--text-muted)">Pub/Sub</text>
  <text x="651.6794" y="250.8107" font-size="20.7567" fill="var(--text-muted)">Sources</text>
  <text x="651.6794" y="285.4054" font-size="20.7567" fill="var(--text-muted)">Brokers</text>
  <text x="651.6794" y="320" font-size="20.7567" fill="var(--text-muted)">Triggers</text>
  <rect x="67.4151" y="423.7837" width="1033.6982" height="103.7838" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="584.2642" y="470.4864" text-anchor="middle" font-size="24.2162" font-weight="bold" fill="var(--text)">Kubernetes Cluster</text>
  <text x="584.2642" y="506.8108" text-anchor="middle" font-size="20.7567" fill="var(--text-muted)">+ Networking (Istio / Kourier / Contour)</text>
  <line x1="314.6038" y1="389.1892" x2="314.6038" y2="420.3243" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#ka)" />
  <line x1="853.9246" y1="389.1892" x2="853.9246" y2="420.3243" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#ka2)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="ka" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 24.6154 9.4737 L 0 18.9474 z" fill="#4a90e2" />
    </marker>
    <marker id="ka2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 24.6154 9.4737 L 0 18.9474 z" fill="#28a745" />
    </marker>
  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640.000054" y="40" text-anchor="middle" font-size="32.662175" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Knative Service</text>
  <rect x="40" y="69.491484" width="1200" height="275.2542" rx="6.715615" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000054" y="112.745708" text-anchor="middle" font-size="28.579529" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Configuration</text>
  <rect x="92.173908" y="138.305063" width="495.652129" height="167.118642" rx="6.715615" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="339.999973" y="183.525408" text-anchor="middle" font-size="26.538094" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Revision 1</text>
  <text x="144.347817" y="226.779632" font-size="22.455336" fill="var(--text-muted)" font-family="Arial, sans-serif">image: v1</text>
  <text x="144.347817" y="262.169482" font-size="22.455336" fill="var(--text-muted)" font-family="Arial, sans-serif">env: ...</text>
  <rect x="666.087009" y="138.305063" width="495.652129" height="167.118642" rx="6.715615" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="913.912964" y="183.525408" text-anchor="middle" font-size="26.538094" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Revision 2</text>
  <text x="718.260917" y="226.779632" font-size="22.455336" fill="var(--text-muted)" font-family="Arial, sans-serif">image: v2</text>
  <text x="718.260917" y="262.169482" font-size="22.455336" fill="var(--text-muted)" font-family="Arial, sans-serif">env: ...</text>
  <rect x="40" y="384.067779" width="1200" height="235.932221" rx="6.715615" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000054" y="433.220253" text-anchor="middle" font-size="28.579529" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Route</text>
  <text x="640.000054" y="482.372842" text-anchor="middle" font-size="26.538094" fill="var(--text-muted)" font-family="Arial, sans-serif">Traffic:</text>
  <rect x="222.608679" y="505.966076" width="391.304312" height="49.152589" rx="6.715615" fill="url(#grad-primary)" opacity="0.9" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="418.260727" y="539.389689" text-anchor="middle" font-size="24.496771" fill="var(--bg)" font-family="Arial, sans-serif">90% → Revision 1</text>
  <rect x="666.087009" y="505.966076" width="391.304312" height="49.152589" rx="6.715615" fill="url(#grad-ok)" opacity="0.9" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="861.739165" y="539.389689" text-anchor="middle" font-size="24.496771" fill="var(--bg)" font-family="Arial, sans-serif">10% → Revision 2</text>
</svg>

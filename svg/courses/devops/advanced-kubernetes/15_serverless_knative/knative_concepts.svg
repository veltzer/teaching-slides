<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="22.5055" y="18.2857" width="1125.2747" height="621.7143" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="585.1429" y="64" text-anchor="middle" font-size="29.2571" font-weight="bold" fill="var(--primary-accent)">Knative Service</text>
  <rect x="67.5165" y="91.4286" width="1035.2528" height="256" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="585.1429" y="131.6571" text-anchor="middle" font-size="25.6" font-weight="bold" fill="var(--text)">Configuration</text>
  <rect x="112.5275" y="155.4286" width="427.6044" height="155.4286" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="326.3297" y="197.4857" text-anchor="middle" font-size="23.7714" font-weight="bold" fill="var(--text)">Revision 1</text>
  <text x="157.5385" y="237.7143" font-size="20.1143" fill="var(--text-muted)">image: v1</text>
  <text x="157.5385" y="270.6286" font-size="20.1143" fill="var(--text-muted)">env: ...</text>
  <rect x="607.6484" y="155.4286" width="427.6044" height="155.4286" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="821.4505" y="197.4857" text-anchor="middle" font-size="23.7714" font-weight="bold" fill="var(--text)">Revision 2</text>
  <text x="652.6594" y="237.7143" font-size="20.1143" fill="var(--text-muted)">image: v2</text>
  <text x="652.6594" y="270.6286" font-size="20.1143" fill="var(--text-muted)">env: ...</text>
  <rect x="67.5165" y="384" width="1035.2528" height="219.4286" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="585.1429" y="429.7143" text-anchor="middle" font-size="25.6" font-weight="bold" fill="var(--text)">Route</text>
  <text x="585.1429" y="475.4286" text-anchor="middle" font-size="23.7714" fill="var(--text-muted)">Traffic:</text>
  <rect x="225.0549" y="497.3714" width="337.5824" height="45.7143" rx="6" fill="var(--primary-fill)" opacity="0.9" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="393.8461" y="528.4571" text-anchor="middle" font-size="21.9429" fill="var(--bg)">90% → Revision 1</text>
  <rect x="607.6484" y="497.3714" width="337.5824" height="45.7143" rx="6" fill="var(--ok-fill)" opacity="0.9" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="776.4396" y="528.4571" text-anchor="middle" font-size="21.9429" fill="var(--bg)">10% → Revision 2</text>
</svg>
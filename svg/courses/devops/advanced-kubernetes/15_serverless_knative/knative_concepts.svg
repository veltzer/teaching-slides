<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.000054" y="40" text-anchor="middle" font-size="32.662175" font-weight="bold" fill="var(--primary-accent)">Knative Service</text>
  <rect x="40" y="69.491484" width="1200" height="275.2542" rx="6.715615" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000054" y="112.745708" text-anchor="middle" font-size="28.579529" font-weight="bold" fill="var(--text)">Configuration</text>
  <rect x="92.173908" y="138.305063" width="495.652129" height="167.118642" rx="6.715615" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="339.999973" y="183.525408" text-anchor="middle" font-size="26.538094" font-weight="bold" fill="var(--text)">Revision 1</text>
  <text x="144.347817" y="226.779632" font-size="22.455336" fill="var(--text-muted)">image: v1</text>
  <text x="144.347817" y="262.169482" font-size="22.455336" fill="var(--text-muted)">env: ...</text>
  <rect x="666.087009" y="138.305063" width="495.652129" height="167.118642" rx="6.715615" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="913.912964" y="183.525408" text-anchor="middle" font-size="26.538094" font-weight="bold" fill="var(--text)">Revision 2</text>
  <text x="718.260917" y="226.779632" font-size="22.455336" fill="var(--text-muted)">image: v2</text>
  <text x="718.260917" y="262.169482" font-size="22.455336" fill="var(--text-muted)">env: ...</text>
  <rect x="40" y="384.067779" width="1200" height="235.932221" rx="6.715615" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000054" y="433.220253" text-anchor="middle" font-size="28.579529" font-weight="bold" fill="var(--text)">Route</text>
  <text x="640.000054" y="482.372842" text-anchor="middle" font-size="26.538094" fill="var(--text-muted)">Traffic:</text>
  <rect x="222.608679" y="505.966076" width="391.304312" height="49.152589" rx="6.715615" fill="var(--primary-fill)" opacity="0.9" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="418.260727" y="539.389689" text-anchor="middle" font-size="24.496771" fill="var(--bg)">90% → Revision 1</text>
  <rect x="666.087009" y="505.966076" width="391.304312" height="49.152589" rx="6.715615" fill="var(--ok-fill)" opacity="0.9" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="861.739165" y="539.389689" text-anchor="middle" font-size="24.496771" fill="var(--bg)">10% → Revision 2</text>
</svg>
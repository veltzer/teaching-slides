<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="Arial, sans-serif">
  <!-- Outer: Knative Service -->
  <rect x="10" y="10" width="500" height="340" rx="5" fill="#f8f9fa" stroke="#4a90e2" stroke-width="2"/>
  <text x="260" y="35" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a90e2">Knative Service</text>
  <!-- Configuration -->
  <rect x="30" y="50" width="460" height="140" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="260" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Configuration</text>
  <!-- Revision 1 -->
  <rect x="50" y="85" width="190" height="85" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="145" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Revision 1</text>
  <text x="70" y="130" font-size="11" fill="#555">image: v1</text>
  <text x="70" y="148" font-size="11" fill="#555">env: ...</text>
  <!-- Revision 2 -->
  <rect x="270" y="85" width="190" height="85" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="365" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Revision 2</text>
  <text x="290" y="130" font-size="11" fill="#555">image: v2</text>
  <text x="290" y="148" font-size="11" fill="#555">env: ...</text>
  <!-- Route -->
  <rect x="30" y="210" width="460" height="120" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="260" y="235" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Route</text>
  <text x="260" y="260" text-anchor="middle" font-size="13" fill="#555">Traffic:</text>
  <rect x="100" y="272" width="150" height="25" rx="3" fill="#4a90e2" opacity="0.9"/>
  <text x="175" y="289" text-anchor="middle" font-size="12" fill="#fff">90% → Revision 1</text>
  <rect x="270" y="272" width="150" height="25" rx="3" fill="#28a745" opacity="0.9"/>
  <text x="345" y="289" text-anchor="middle" font-size="12" fill="#fff">10% → Revision 2</text>
</svg>
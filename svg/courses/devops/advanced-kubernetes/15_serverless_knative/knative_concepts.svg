  <text x="585.1429" y="131.6571" text-anchor="middle" font-size="25.6" font-weight="bold" fill="var(--text-dark)">Configuration</text>
  <rect x="112.5275" y="155.4286" width="427.6044" height="155.4286" rx="9.1429" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.7429" />
  <text x="326.3297" y="197.4857" text-anchor="middle" font-size="23.7714" font-weight="bold" fill="var(--text-dark)">Revision 1</text>
  <text x="157.5385" y="237.7143" font-size="20.1143" fill="var(--text-muted)">image: v1</text>
  <text x="157.5385" y="270.6286" font-size="20.1143" fill="var(--text-muted)">env: ...</text>
  <rect x="607.6484" y="155.4286" width="427.6044" height="155.4286" rx="9.1429" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.7429" />
  <text x="821.4505" y="197.4857" text-anchor="middle" font-size="23.7714" font-weight="bold" fill="var(--text-dark)">Revision 2</text>
  <text x="652.6594" y="237.7143" font-size="20.1143" fill="var(--text-muted)">image: v2</text>
  <text x="652.6594" y="270.6286" font-size="20.1143" fill="var(--text-muted)">env: ...</text>
  <rect x="67.5165" y="384" width="1035.2528" height="219.4286" rx="9.1429" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="3.6571" />
  <text x="585.1429" y="429.7143" text-anchor="middle" font-size="25.6" font-weight="bold" fill="var(--text-dark)">Route</text>
  <text x="585.1429" y="475.4286" text-anchor="middle" font-size="23.7714" fill="var(--text-muted)">Traffic:</text>
  <rect x="225.0549" y="497.3714" width="337.5824" height="45.7143" rx="5.4857" fill="var(--primary-bright)" opacity="0.9" />
  <text x="393.8461" y="528.4571" text-anchor="middle" font-size="21.9429" fill="var(--bg)">90% → Revision 1</text>
  <rect x="607.6484" y="497.3714" width="337.5824" height="45.7143" rx="5.4857" fill="var(--ok-bright)" opacity="0.9" />
  <text x="776.4396" y="528.4571" text-anchor="middle" font-size="21.9429" fill="var(--bg)">10% → Revision 2</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="598.1395" y="40" text-anchor="middle" font-size="25.2125" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Scale to Zero</text>
  <rect x="402.7906" y="61.7499" width="390.6976" height="50.75" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="598.1395" y="95.1" text-anchor="middle" font-size="20.4851" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Request arrives</text>
  <line x1="598.1395" y1="112.5" x2="598.1395" y2="148.75" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="319.0697" y="148.75" width="558.1394" height="87" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="598.1395" y="185" text-anchor="middle" font-size="20.4851" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Activator</text>
  <text x="598.1395" y="213.9999" text-anchor="middle" font-size="17.3336" fill="var(--text-muted)" font-family="Arial, sans-serif">(always running, buffers request)</text>
  <line x1="598.1395" y1="235.75" x2="598.1395" y2="279.2499" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <polygon points="598.1395,279.2499 793.4883,322.75 598.1395,366.25 402.7906,322.75" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="3.0117" />
  <text x="598.1395" y="328.55" text-anchor="middle" font-size="18.9094" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Pod exists?</text>
  <line x1="793.4883" y1="322.75" x2="1044.6512" y2="322.75" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="905.1162" y="311.1499" font-size="17.3336" fill="var(--ok-accent)" font-family="Arial, sans-serif">YES</text>
  <rect x="960.9302" y="293.7499" width="279.0698" height="57.9999" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100.465" y="328.55" text-anchor="middle" font-size="17.3336" fill="var(--text)" font-family="Arial, sans-serif">Forward</text>
  <line x1="598.1395" y1="366.25" x2="598.1395" y2="409.7499" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="639.9999" y="392.35" font-size="17.3336" fill="var(--danger-accent)" font-family="Arial, sans-serif">NO</text>
  <rect x="319.0697" y="409.7499" width="558.1394" height="79.75" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="598.1395" y="441.6499" text-anchor="middle" font-size="18.9094" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Create pod</text>
  <text x="598.1395" y="470.65" text-anchor="middle" font-size="17.3336" fill="var(--text-muted)" font-family="Arial, sans-serif">Wait for ready, then forward</text>
  <rect x="40" y="518.5" width="1116.2791" height="101.5" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="598.1395" y="554.75" text-anchor="middle" font-size="18.9094" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">No requests for grace period (default: 30s)</text>
  <text x="598.1395" y="583.75" text-anchor="middle" font-size="18.9094" fill="var(--text-muted)" font-family="Arial, sans-serif">Scale to 0 pods - No compute costs!</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
</svg>
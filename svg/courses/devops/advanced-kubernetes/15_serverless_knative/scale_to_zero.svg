<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="402.7906" y="40" width="390.6976" height="52.727263282174" rx="6.115765749489" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="598.1395" y="74.649448338657" text-anchor="middle" font-size="20.880345492477" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Request arrives</text>
  <line x1="598.1395" y1="92.727367178259" x2="598.1395" y2="130.389698094098" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="319.0697" y="130.389698094098" width="558.1394" height="90.389594198013" rx="6.115765749489" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="598.1395" y="168.052029009937" text-anchor="middle" font-size="20.880345492477" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Activator</text>
  <text x="598.1395" y="198.181789846522" text-anchor="middle" font-size="17.668039532558" fill="var(--text-muted)" font-family="Arial, sans-serif">(always running, buffers request)</text>
  <line x1="598.1395" y1="220.779292292111" x2="598.1395" y2="265.973985495032" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <polygon points="598.1395,265.973985495032 793.4883,311.168886490123 598.1395,356.36368358913 402.7906,311.168886490123" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="3.0117"/>
  <text x="598.1395" y="317.194859436658" text-anchor="middle" font-size="19.274243477232" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Pod exists?</text>
  <line x1="793.4883" y1="311.168886490123" x2="1044.6512" y2="311.168886490123" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="905.1162" y="299.11683670097" font-size="17.668039532558" fill="var(--ok-accent)" font-family="Arial, sans-serif">YES</text>
  <rect x="960.9302" y="281.038917861367" width="279.0698" height="60.259625569257" rx="6.115765749489" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100.465" y="317.194859436658" text-anchor="middle" font-size="17.668039532558" fill="var(--text)" font-family="Arial, sans-serif">Forward</text>
  <line x1="598.1395" y1="356.36368358913" x2="598.1395" y2="401.558376792051" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="639.9999" y="383.480561848534" font-size="17.668039532558" fill="var(--danger-accent)" font-family="Arial, sans-serif">NO</text>
  <rect x="319.0697" y="401.558376792051" width="558.1394" height="82.857128014845" rx="6.115765749489" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="598.1395" y="434.701227997989" text-anchor="middle" font-size="19.274243477232" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Create pod</text>
  <text x="598.1395" y="464.831196626745" text-anchor="middle" font-size="17.668039532558" fill="var(--text-muted)" font-family="Arial, sans-serif">Wait for ready, then forward</text>
  <rect x="40" y="514.545473435652" width="1116.2791" height="105.454526564348" rx="6.115765749489" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="598.1395" y="552.20780435149" text-anchor="middle" font-size="19.274243477232" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">No requests for grace period (default: 30s)</text>
  <text x="598.1395" y="582.337669084161" text-anchor="middle" font-size="19.274243477232" fill="var(--text-muted)" font-family="Arial, sans-serif">Scale to 0 pods - No compute costs!</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" font-family="Arial, sans-serif">
  <text x="240" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Scale to Zero</text>
  <!-- Request arrives -->
  <rect x="170" y="40" width="140" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="240" y="63" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Request arrives</text>
  <line x1="240" y1="75" x2="240" y2="100" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#s0a)"/>
  <!-- Activator -->
  <rect x="140" y="100" width="200" height="60" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="240" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Activator</text>
  <text x="240" y="145" text-anchor="middle" font-size="11" fill="#555">(always running, buffers request)</text>
  <line x1="240" y1="160" x2="240" y2="190" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#s0a)"/>
  <!-- Decision diamond -->
  <polygon points="240,190 310,220 240,250 170,220" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="240" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Pod exists?</text>
  <!-- YES path -->
  <line x1="310" y1="220" x2="400" y2="220" stroke="#28a745" stroke-width="1.5" marker-end="url(#s0g)"/>
  <text x="350" y="212" font-size="11" fill="#28a745">YES</text>
  <rect x="370" y="200" width="100" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="420" y="224" text-anchor="middle" font-size="11" fill="#333">Forward</text>
  <!-- NO path -->
  <line x1="240" y1="250" x2="240" y2="280" stroke="#dc3545" stroke-width="1.5" marker-end="url(#s0r)"/>
  <text x="255" y="268" font-size="11" fill="#dc3545">NO</text>
  <rect x="140" y="280" width="200" height="55" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="240" y="302" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Create pod</text>
  <text x="240" y="322" text-anchor="middle" font-size="11" fill="#555">Wait for ready, then forward</text>
  <!-- Scale to zero section -->
  <rect x="40" y="355" width="400" height="70" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="240" y="380" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">No requests for grace period (default: 30s)</text>
  <text x="240" y="400" text-anchor="middle" font-size="12" fill="#555">Scale to 0 pods - No compute costs!</text>
  <defs>
    <marker id="s0a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a90e2"/></marker>
    <marker id="s0g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#28a745"/></marker>
    <marker id="s0r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc3545"/></marker>
  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="598.1395" y="40" text-anchor="middle" font-size="25.2125" font-weight="bold" fill="var(--text)">Scale to Zero</text>
  <rect x="402.7906" y="61.7499" width="390.6976" height="50.75" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="598.1395" y="95.1" text-anchor="middle" font-size="20.4851" font-weight="bold" fill="var(--text)">Request arrives</text>
  <line x1="598.1395" y1="112.5" x2="598.1395" y2="148.75" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#s0a)" />
  <rect x="319.0697" y="148.75" width="558.1394" height="87" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="598.1395" y="185" text-anchor="middle" font-size="20.4851" font-weight="bold" fill="var(--text)">Activator</text>
  <text x="598.1395" y="213.9999" text-anchor="middle" font-size="17.3336" fill="var(--text-muted)">(always running, buffers request)</text>
  <line x1="598.1395" y1="235.75" x2="598.1395" y2="279.2499" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#s0a)" />
  <polygon points="598.1395,279.2499 793.4883,322.75 598.1395,366.25 402.7906,322.75" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="3.0117" />
  <text x="598.1395" y="328.55" text-anchor="middle" font-size="18.9094" font-weight="bold" fill="var(--text)">Pod exists?</text>
  <line x1="793.4883" y1="322.75" x2="1044.6512" y2="322.75" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#s0g)" />
  <text x="905.1162" y="311.1499" font-size="17.3336" fill="var(--ok-accent)">YES</text>
  <rect x="960.9302" y="293.7499" width="279.0698" height="57.9999" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100.465" y="328.55" text-anchor="middle" font-size="17.3336" fill="var(--text)">Forward</text>
  <line x1="598.1395" y1="366.25" x2="598.1395" y2="409.7499" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#s0r)" />
  <text x="639.9999" y="392.35" font-size="17.3336" fill="var(--danger-accent)">NO</text>
  <rect x="319.0697" y="409.7499" width="558.1394" height="79.75" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="598.1395" y="441.6499" text-anchor="middle" font-size="18.9094" font-weight="bold" fill="var(--text)">Create pod</text>
  <text x="598.1395" y="470.65" text-anchor="middle" font-size="17.3336" fill="var(--text-muted)">Wait for ready, then forward</text>
  <rect x="40" y="518.5" width="1116.2791" height="101.5" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="598.1395" y="554.75" text-anchor="middle" font-size="18.9094" font-weight="bold" fill="var(--text)">No requests for grace period (default: 30s)</text>
  <text x="598.1395" y="583.75" text-anchor="middle" font-size="18.9094" fill="var(--text-muted)">Scale to 0 pods - No compute costs!</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="s0a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 26.6667 8.1818 L 0 16.3636 z" fill="#4a90e2" />
    </marker>
    <marker id="s0g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 26.6667 8.1818 L 0 16.3636 z" fill="#28a745" />
    </marker>
    <marker id="s0r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 26.6667 8.1818 L 0 16.3636 z" fill="#dc3545" />
    </marker>
  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="576.09" y="40.5063" text-anchor="middle" font-size="25.9241" font-weight="bold" fill="var(--text)">Why Serverless on Kubernetes</text>
  <rect x="44.3146" y="72.9114" width="1063.5508" height="89.1139" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="88.6292" y="110.1772" font-size="21.0633" font-weight="bold" fill="var(--danger-accent)">Traditional Kubernetes</text>
  <text x="88.6292" y="142.5823" font-size="19.443" fill="var(--text-muted)">Pods always running → costs even when idle</text>
  <rect x="44.3146" y="178.2278" width="1063.5508" height="89.1139" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="88.6292" y="215.4937" font-size="21.0633" font-weight="bold" fill="var(--ok-accent)">Serverless (Knative)</text>
  <text x="88.6292" y="247.8987" font-size="19.443" fill="var(--text-muted)">Scale to zero → pay only for actual usage</text>
  <rect x="44.3146" y="291.6456" width="1063.5508" height="324.0506" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="576.09" y="332.1519" text-anchor="middle" font-size="22.6835" font-weight="bold" fill="var(--text)">Request Rate Over Time</text>
  <line x1="132.9438" y1="356.4557" x2="132.9438" y2="534.6835" stroke="var(--text)" stroke-width="2" />
  <line x1="132.9438" y1="534.6835" x2="1019.2362" y2="534.6835" stroke="var(--text)" stroke-width="2" marker-end="url(#wsa)" />
  <text x="110.7865" y="364.557" text-anchor="end" font-size="16.2025" fill="var(--text-muted)">High</text>
  <text x="110.7865" y="534.6835" text-anchor="end" font-size="16.2025" fill="var(--text-muted)">Low</text>
  <polyline points="132.9438,518.481 221.573,469.8734 288.045,421.2658 332.3597,453.6709 398.8315,502.2785 465.3035,453.6709 531.7754,405.0633 576.09,437.4684 620.4047,486.0759 686.8765,437.4684 753.3485,421.2658 797.6631,469.8734 864.135,502.2785 930.607,518.481 997.0789,526.5823" fill="none" stroke="var(--primary-border)" stroke-width="3.2405" />
  <rect x="132.9438" y="558.9873" width="864.135" height="19.443" rx="6" fill="var(--danger-fill)" opacity="0.7" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="132.9438" y="599.4937" font-size="17.8228" fill="var(--danger-accent)">Traditional: always running $$$</text>
  <rect x="177.2585" y="558.9873" width="132.9438" height="19.443" rx="6" fill="var(--ok-fill)" opacity="0.0" stroke="var(--ok-border)" stroke-width="2"/>
  <g>
    <rect x="132.9438" y="550.8861" width="0" height="0" fill="none" rx="6"/>
  </g>
  <text x="132.9438" y="640" font-size="17.8228" fill="var(--ok-accent)">Serverless: pay per use $</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="wsa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 24.6154 9 L 0 18 z" fill="#333" />
    </marker>
  </defs>
</svg>
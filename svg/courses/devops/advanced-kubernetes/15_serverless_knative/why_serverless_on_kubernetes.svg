<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="1200" height="91.142848081632" rx="6.169047433086" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="90" y="78.114231951016" font-size="22.626934992531" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Traditional Kubernetes</text>
  <text x="90" y="111.257143461225" font-size="20.886338259286" fill="var(--text-muted)" font-family="Arial, sans-serif">Pods always running → costs even when idle</text>
  <rect x="40" y="147.714198122441" width="1200" height="91.142848081632" rx="6.169047433086" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="90" y="185.828535787752" font-size="22.626934992531" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Serverless (Knative)</text>
  <text x="90" y="218.971341583666" font-size="20.886338259286" fill="var(--text-muted)" font-family="Arial, sans-serif">Scale to zero → pay only for actual usage</text>
  <rect x="40" y="263.714282693877" width="1200" height="331.428586530614" rx="6.169047433086" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="305.142869224491" text-anchor="middle" font-size="24.367428908319" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Request Rate Over Time</text>
  <line x1="140" y1="330" x2="140" y2="512.285696163264" stroke="var(--text)" stroke-width="2"/>
  <line x1="140" y1="512.285696163264" x2="1140" y2="512.285696163264" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="115" y="338.2857807347" text-anchor="end" font-size="17.40535042771" fill="var(--text-muted)" font-family="Arial, sans-serif">High</text>
  <text x="115" y="512.285696163264" text-anchor="end" font-size="17.40535042771" fill="var(--text-muted)" font-family="Arial, sans-serif">Low</text>
  <polyline points="140,495.714240408159 239.9999,445.999978857141 315,396.285717306123 365.0001,429.428628816332 440,479.14289036735 515,429.428628816332 590,379.714261551018 640,412.857173061227 690.0001,462.57132889795 765,412.857173061227 840,396.285717306123 890,445.999978857141 965,479.14289036735 1040.0001,495.714240408159 1115,504.000021142859" fill="none" stroke="var(--primary-border)" stroke-width="3.2405"/>
  <rect x="140" y="537.142826938773" width="975" height="19.885704620407" rx="6.169047433086" fill="url(#grad-danger)" opacity="0.7" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="578.571413469386" font-size="19.145947160955" fill="var(--danger-accent)" font-family="Arial, sans-serif">Traditional: always running $$$</text>
  <rect x="190.0001" y="537.142826938773" width="149.9999" height="19.885704620407" rx="6.169047433086" fill="url(#grad-ok)" opacity="0.0" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <g>
    <rect x="140" y="528.857151918368" width="0" height="0" fill="none" rx="6.169047433086"/>
  </g>
  <text x="140" y="620" font-size="19.145947160955" fill="var(--ok-accent)" font-family="Arial, sans-serif">Serverless: pay per use $</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640" y="40" text-anchor="middle" font-size="27.0855" font-weight="bold" fill="var(--text)">Why Serverless on Kubernetes</text>
  <rect x="40" y="71.3514" width="1200" height="86.2162" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="90" y="107.4054" font-size="22.0069" font-weight="bold" fill="var(--danger-accent)">Traditional Kubernetes</text>
  <text x="90" y="138.7568" font-size="20.314" fill="var(--text-muted)">Pods always running → costs even when idle</text>
  <rect x="40" y="173.2432" width="1200" height="86.2162" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="90" y="209.2973" font-size="22.0069" font-weight="bold" fill="var(--ok-accent)">Serverless (Knative)</text>
  <text x="90" y="240.6486" font-size="20.314" fill="var(--text-muted)">Scale to zero → pay only for actual usage</text>
  <rect x="40" y="282.973" width="1200" height="313.5135" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="322.1622" text-anchor="middle" font-size="23.6997" font-weight="bold" fill="var(--text)">Request Rate Over Time</text>
  <line x1="140" y1="345.6757" x2="140" y2="518.1081" stroke="var(--text)" stroke-width="2" />
  <line x1="140" y1="518.1081" x2="1140" y2="518.1081" stroke="var(--text)" stroke-width="2" marker-end="url(#wsa)" />
  <text x="115" y="353.5136" text-anchor="end" font-size="16.9284" fill="var(--text-muted)">High</text>
  <text x="115" y="518.1081" text-anchor="end" font-size="16.9284" fill="var(--text-muted)">Low</text>
  <polyline points="140,502.4324 239.9999,455.4054 315,408.3784 365.0001,439.7298 440,486.7568 515,439.7298 590,392.7027 640,424.0541 690.0001,471.081 765,424.0541 840,408.3784 890,455.4054 965,486.7568 1040.0001,502.4324 1115,510.2703" fill="none" stroke="var(--primary-border)" stroke-width="3.2405" />
  <rect x="140" y="541.6216" width="975" height="18.8108" rx="6" fill="var(--danger-fill)" opacity="0.7" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="140" y="580.8108" font-size="18.6213" fill="var(--danger-accent)">Traditional: always running $$$</text>
  <rect x="190.0001" y="541.6216" width="149.9999" height="18.8108" rx="6" fill="var(--ok-fill)" opacity="0.0" stroke="var(--ok-border)" stroke-width="2"/>
  <g>
    <rect x="140" y="533.7838" width="0" height="0" fill="none" rx="6"/>
  </g>
  <text x="140" y="620" font-size="18.6213" fill="var(--ok-accent)">Serverless: pay per use $</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="wsa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 24.6154 9 L 0 18 z" fill="#333" />
    </marker>
  </defs>
</svg>
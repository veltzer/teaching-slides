  <rect x="132.9438" y="558.9873" width="864.135" height="19.443" rx="3.2405" fill="var(--danger-bright)" opacity="0.7" />
  <text x="132.9438" y="599.4937" font-size="17.8228" fill="var(--danger-bright)">Traditional: always running $$$</text>
  <rect x="177.2585" y="558.9873" width="132.9438" height="19.443" rx="3.2405" fill="var(--ok-bright)" opacity="0.0" />

  <text x="576.09" y="40.5063" text-anchor="middle" font-size="25.9241" font-weight="bold" fill="var(--text-dark)">Why Serverless on Kubernetes</text>
  <rect x="44.3146" y="72.9114" width="1063.5508" height="89.1139" rx="8.1013" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="2.4304" />
  <text x="88.6292" y="110.1772" font-size="21.0633" font-weight="bold" fill="var(--danger-bright)">Traditional Kubernetes</text>
  <text x="88.6292" y="142.5823" font-size="19.443" fill="var(--text-muted)">Pods always running → costs even when idle</text>
  <rect x="44.3146" y="178.2278" width="1063.5508" height="89.1139" rx="8.1013" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.4304" />
  <text x="88.6292" y="215.4937" font-size="21.0633" font-weight="bold" fill="var(--ok-bright)">Serverless (Knative)</text>
  <text x="88.6292" y="247.8987" font-size="19.443" fill="var(--text-muted)">Scale to zero → pay only for actual usage</text>
  <rect x="44.3146" y="291.6456" width="1063.5508" height="324.0506" rx="8.1013" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="3.2405" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="45" text-anchor="middle" font-size="28.8" font-weight="bold" fill="#333">Why Serverless on Kubernetes</text>
  <rect x="49.2308" y="81" width="1181.5385" height="99" rx="9" fill="#f8d7da" stroke="#dc3545" stroke-width="2.7" />
  <text x="98.4615" y="122.4" font-size="23.4" font-weight="bold" fill="#dc3545">Traditional Kubernetes</text>
  <text x="98.4615" y="158.4" font-size="21.6" fill="#555">Pods always running → costs even when idle</text>
  <rect x="49.2308" y="198" width="1181.5385" height="99" rx="9" fill="#d4edda" stroke="#28a745" stroke-width="2.7" />
  <text x="98.4615" y="239.4" font-size="23.4" font-weight="bold" fill="#28a745">Serverless (Knative)</text>
  <text x="98.4615" y="275.4" font-size="21.6" fill="#555">Scale to zero → pay only for actual usage</text>
  <rect x="49.2308" y="324" width="1181.5385" height="360" rx="9" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.6" />
  <text x="640" y="369" text-anchor="middle" font-size="25.2" font-weight="bold" fill="#333">Request Rate Over Time</text>
  <line x1="147.6923" y1="396" x2="147.6923" y2="594" stroke="#333" stroke-width="2.7" />
  <line x1="147.6923" y1="594" x2="1132.3077" y2="594" stroke="#333" stroke-width="2.7" marker-end="url(#wsa)" />
  <text x="123.0769" y="405" text-anchor="end" font-size="18" fill="#555">High</text>
  <text x="123.0769" y="594" text-anchor="end" font-size="18" fill="#555">Low</text>
  <polyline points="147.6923,576 246.1538,522 320,468 369.2308,504 443.0769,558 516.9231,504 590.7692,450 640,486 689.2308,540 763.0769,486 836.9231,468 886.1538,522 960,558 1033.8462,576 1107.6923,585" fill="none" stroke="#4a90e2" stroke-width="3.6" />
  <rect x="147.6923" y="621" width="960" height="21.6" rx="3.6" fill="#dc3545" opacity="0.7" />
  <text x="147.6923" y="666" font-size="19.8" fill="#dc3545">Traditional: always running $$$</text>
  <rect x="196.9231" y="621" width="147.6923" height="21.6" rx="3.6" fill="#28a745" opacity="0.0" />
  <g>
    <rect x="147.6923" y="612" width="0" height="0" fill="none" />
  </g>
  <text x="147.6923" y="711" font-size="19.8" fill="#28a745">Serverless: pay per use $</text>

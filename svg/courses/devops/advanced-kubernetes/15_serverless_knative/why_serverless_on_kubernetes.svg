<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640" y="40" text-anchor="middle" font-size="27.0855" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Why Serverless on Kubernetes</text>
  <rect x="40" y="71.3514" width="1200" height="86.2162" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="90" y="107.4054" font-size="22.0069" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Traditional Kubernetes</text>
  <text x="90" y="138.7568" font-size="20.314" fill="var(--text-muted)" font-family="Arial, sans-serif">Pods always running → costs even when idle</text>
  <rect x="40" y="173.2432" width="1200" height="86.2162" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="90" y="209.2973" font-size="22.0069" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Serverless (Knative)</text>
  <text x="90" y="240.6486" font-size="20.314" fill="var(--text-muted)" font-family="Arial, sans-serif">Scale to zero → pay only for actual usage</text>
  <rect x="40" y="282.973" width="1200" height="313.5135" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="322.1622" text-anchor="middle" font-size="23.6997" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Request Rate Over Time</text>
  <line x1="140" y1="345.6757" x2="140" y2="518.1081" stroke="var(--text)" stroke-width="2"/>
  <line x1="140" y1="518.1081" x2="1140" y2="518.1081" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="115" y="353.5136" text-anchor="end" font-size="16.9284" fill="var(--text-muted)" font-family="Arial, sans-serif">High</text>
  <text x="115" y="518.1081" text-anchor="end" font-size="16.9284" fill="var(--text-muted)" font-family="Arial, sans-serif">Low</text>
  <polyline points="140,502.4324 239.9999,455.4054 315,408.3784 365.0001,439.7298 440,486.7568 515,439.7298 590,392.7027 640,424.0541 690.0001,471.081 765,424.0541 840,408.3784 890,455.4054 965,486.7568 1040.0001,502.4324 1115,510.2703" fill="none" stroke="var(--primary-border)" stroke-width="3.2405"/>
  <rect x="140" y="541.6216" width="975" height="18.8108" rx="6" fill="url(#grad-danger)" opacity="0.7" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="580.8108" font-size="18.6213" fill="var(--danger-accent)" font-family="Arial, sans-serif">Traditional: always running $$$</text>
  <rect x="190.0001" y="541.6216" width="149.9999" height="18.8108" rx="6" fill="url(#grad-ok)" opacity="0.0" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <g>
    <rect x="140" y="533.7838" width="0" height="0" fill="none" rx="6"/>
  </g>
  <text x="140" y="620" font-size="18.6213" fill="var(--ok-accent)" font-family="Arial, sans-serif">Serverless: pay per use $</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:text x="576.09" y="40.5063" text-anchor="middle" font-size="25.9241" font-weight="bold" fill="#333">Why Serverless on Kubernetes</ns0:text>
  <ns0:rect x="44.3146" y="72.9114" width="1063.5508" height="89.1139" rx="8.1013" fill="#f8d7da" stroke="#dc3545" stroke-width="2.4304" />
  <ns0:text x="88.6292" y="110.1772" font-size="21.0633" font-weight="bold" fill="#dc3545">Traditional Kubernetes</ns0:text>
  <ns0:text x="88.6292" y="142.5823" font-size="19.443" fill="#555">Pods always running → costs even when idle</ns0:text>
  <ns0:rect x="44.3146" y="178.2278" width="1063.5508" height="89.1139" rx="8.1013" fill="#d4edda" stroke="#28a745" stroke-width="2.4304" />
  <ns0:text x="88.6292" y="215.4937" font-size="21.0633" font-weight="bold" fill="#28a745">Serverless (Knative)</ns0:text>
  <ns0:text x="88.6292" y="247.8987" font-size="19.443" fill="#555">Scale to zero → pay only for actual usage</ns0:text>
  <ns0:rect x="44.3146" y="291.6456" width="1063.5508" height="324.0506" rx="8.1013" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2405" />
  <ns0:text x="576.09" y="332.1519" text-anchor="middle" font-size="22.6835" font-weight="bold" fill="#333">Request Rate Over Time</ns0:text>
  <ns0:line x1="132.9438" y1="356.4557" x2="132.9438" y2="534.6835" stroke="#333" stroke-width="2.4304" />
  <ns0:line x1="132.9438" y1="534.6835" x2="1019.2362" y2="534.6835" stroke="#333" stroke-width="2.4304" marker-end="url(#wsa)" />
  <ns0:text x="110.7865" y="364.557" text-anchor="end" font-size="16.2025" fill="#555">High</ns0:text>
  <ns0:text x="110.7865" y="534.6835" text-anchor="end" font-size="16.2025" fill="#555">Low</ns0:text>
  <ns0:polyline points="132.9438,518.481 221.573,469.8734 288.045,421.2658 332.3597,453.6709 398.8315,502.2785 465.3035,453.6709 531.7754,405.0633 576.09,437.4684 620.4047,486.0759 686.8765,437.4684 753.3485,421.2658 797.6631,469.8734 864.135,502.2785 930.607,518.481 997.0789,526.5823" fill="none" stroke="#4a90e2" stroke-width="3.2405" />
  <ns0:rect x="132.9438" y="558.9873" width="864.135" height="19.443" rx="3.2405" fill="#dc3545" opacity="0.7" />
  <ns0:text x="132.9438" y="599.4937" font-size="17.8228" fill="#dc3545">Traditional: always running $$$</ns0:text>
  <ns0:rect x="177.2585" y="558.9873" width="132.9438" height="19.443" rx="3.2405" fill="#28a745" opacity="0.0" />
  <ns0:g>
    <ns0:rect x="132.9438" y="550.8861" width="0" height="0" fill="none" />
  </ns0:g>
  <ns0:text x="132.9438" y="640" font-size="17.8228" fill="#28a745">Serverless: pay per use $</ns0:text>

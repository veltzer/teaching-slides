<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:text x="576.09" y="40.5063" text-anchor="middle" font-size="25.9241" font-weight="bold" fill="#333">Why Serverless on Kubernetes</ns0:text>
  <ns0:rect x="44.3146" y="72.9114" width="1063.5508" height="89.1139" rx="8.1013" fill="#f8d7da" stroke="#dc3545" stroke-width="2.4304" />
  <ns0:text x="88.6292" y="110.1772" font-size="21.0633" font-weight="bold" fill="#dc3545">Traditional Kubernetes</ns0:text>
  <ns0:text x="88.6292" y="142.5823" font-size="19.443" fill="#555">Pods always running → costs even when idle</ns0:text>
  <ns0:rect x="44.3146" y="178.2278" width="1063.5508" height="89.1139" rx="8.1013" fill="#d4edda" stroke="#28a745" stroke-width="2.4304" />
  <ns0:text x="88.6292" y="215.4937" font-size="21.0633" font-weight="bold" fill="#28a745">Serverless (Knative)</ns0:text>
  <ns0:text x="88.6292" y="247.8987" font-size="19.443" fill="#555">Scale to zero → pay only for actual usage</ns0:text>
  <ns0:rect x="44.3146" y="291.6456" width="1063.5508" height="324.0506" rx="8.1013" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2405" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640" y="47.3684" text-anchor="middle" font-size="30.3158" font-weight="bold" fill="var(--text)">Event-Driven Architecture</text>
  <rect x="45.7143" y="85.2632" width="274.2857" height="94.7368" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="182.8571" y="142.1053" text-anchor="middle" font-size="24.6316" font-weight="bold" fill="var(--text)">API Gateway</text>
  <rect x="411.4286" y="85.2632" width="800" height="94.7368" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="811.4286" y="128.8421" text-anchor="middle" font-size="26.5263" font-weight="bold" fill="var(--text)">Broker</text>
  <text x="811.4286" y="161.0526" text-anchor="middle" font-size="20.8421" fill="var(--text-muted)">(receives CloudEvents)</text>
  <line x1="320" y1="132.6316" x2="406.8571" y2="132.6316" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr)" />
  <line x1="594.2857" y1="180" x2="594.2857" y2="265.2632" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arr3)" />
  <line x1="811.4286" y1="180" x2="811.4286" y2="265.2632" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arr3)" />
  <line x1="1051.4286" y1="180" x2="1051.4286" y2="265.2632" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arr3)" />
  <rect x="445.7143" y="265.2632" width="297.1429" height="94.7368" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="594.2857" y="306.9474" text-anchor="middle" font-size="22.7368" font-weight="bold" fill="var(--text)">Trigger: order.*</text>
  <rect x="674.2857" y="265.2632" width="274.2857" height="94.7368" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="811.4286" y="306.9474" text-anchor="middle" font-size="22.7368" font-weight="bold" fill="var(--text)">Trigger: payment.*</text>
  <rect x="914.2857" y="265.2632" width="297.1429" height="94.7368" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1062.8571" y="306.9474" text-anchor="middle" font-size="22.7368" font-weight="bold" fill="var(--text)">Trigger: *.created</text>
  <line x1="594.2857" y1="360" x2="594.2857" y2="454.7368" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr)" />
  <line x1="811.4286" y1="360" x2="811.4286" y2="454.7368" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr)" />
  <line x1="1062.8571" y1="360" x2="1062.8571" y2="454.7368" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="445.7143" y="454.7368" width="297.1429" height="113.6842" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="594.2857" y="502.1053" text-anchor="middle" font-size="22.7368" font-weight="bold" fill="var(--text)">Order Service</text>
  <text x="594.2857" y="540" text-anchor="middle" font-size="20.8421" fill="var(--ok-accent)">(scale to 0)</text>
  <rect x="674.2857" y="454.7368" width="274.2857" height="113.6842" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="811.4286" y="502.1053" text-anchor="middle" font-size="22.7368" font-weight="bold" fill="var(--text)">Payment Service</text>
  <text x="811.4286" y="540" text-anchor="middle" font-size="20.8421" fill="var(--ok-accent)">(scale to 0)</text>
  <rect x="914.2857" y="454.7368" width="297.1429" height="113.6842" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1062.8571" y="502.1053" text-anchor="middle" font-size="22.7368" font-weight="bold" fill="var(--text)">Analytics Service</text>
  <text x="1062.8571" y="540" text-anchor="middle" font-size="20.8421" fill="var(--ok-accent)">(scale to 0)</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 22.8571 9.4737 L 0 18.9474 z" fill="#4a90e2" />
    </marker>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 22.8571 9.4737 L 0 18.9474 z" fill="#ffc107" />
    </marker>
  </defs>
</svg>
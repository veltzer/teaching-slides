<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="651.7647" y="40" text-anchor="middle" font-size="32.4517" font-weight="bold" fill="var(--text)">Event-Driven Architecture</text>
  <rect x="40" y="82.1819" width="282.3529" height="105.4545" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="181.1764" y="145.4546" text-anchor="middle" font-size="26.367" font-weight="bold" fill="var(--text)">API Gateway</text>
  <rect x="416.4706" y="82.1819" width="823.5294" height="105.4545" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="828.2353" y="130.6909" text-anchor="middle" font-size="28.3952" font-weight="bold" fill="var(--text)">Broker</text>
  <text x="828.2353" y="166.5455" text-anchor="middle" font-size="22.3105" fill="var(--text-muted)">(receives CloudEvents)</text>
  <line x1="322.3529" y1="134.9091" x2="411.7646" y2="134.9091" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr)" />
  <line x1="604.7058" y1="187.6364" x2="604.7058" y2="282.5455" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arr3)" />
  <line x1="828.2353" y1="187.6364" x2="828.2353" y2="282.5455" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arr3)" />
  <line x1="1075.2941" y1="187.6364" x2="1075.2941" y2="282.5455" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arr3)" />
  <rect x="451.7647" y="282.5455" width="305.8824" height="105.4545" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="604.7058" y="328.9455" text-anchor="middle" font-size="24.3387" font-weight="bold" fill="var(--text)">Trigger: order.*</text>
  <rect x="687.0588" y="282.5455" width="282.3529" height="105.4545" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="828.2353" y="328.9455" text-anchor="middle" font-size="24.3387" font-weight="bold" fill="var(--text)">Trigger: payment.*</text>
  <rect x="934.1176" y="282.5455" width="305.8824" height="105.4545" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1087.0588" y="328.9455" text-anchor="middle" font-size="24.3387" font-weight="bold" fill="var(--text)">Trigger: *.created</text>
  <line x1="604.7058" y1="388" x2="604.7058" y2="493.4545" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr)" />
  <line x1="828.2353" y1="388" x2="828.2353" y2="493.4545" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr)" />
  <line x1="1087.0588" y1="388" x2="1087.0588" y2="493.4545" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="451.7647" y="493.4545" width="305.8824" height="126.5455" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="604.7058" y="546.1819" text-anchor="middle" font-size="24.3387" font-weight="bold" fill="var(--text)">Order Service</text>
  <text x="604.7058" y="588.3637" text-anchor="middle" font-size="22.3105" fill="var(--ok-accent)">(scale to 0)</text>
  <rect x="687.0588" y="493.4545" width="282.3529" height="126.5455" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="828.2353" y="546.1819" text-anchor="middle" font-size="24.3387" font-weight="bold" fill="var(--text)">Payment Service</text>
  <text x="828.2353" y="588.3637" text-anchor="middle" font-size="22.3105" fill="var(--ok-accent)">(scale to 0)</text>
  <rect x="934.1176" y="493.4545" width="305.8824" height="126.5455" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1087.0588" y="546.1819" text-anchor="middle" font-size="24.3387" font-weight="bold" fill="var(--text)">Analytics Service</text>
  <text x="1087.0588" y="588.3637" text-anchor="middle" font-size="22.3105" fill="var(--ok-accent)">(scale to 0)</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 22.8571 9.4737 L 0 18.9474 z" fill="#4a90e2" />
    </marker>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 22.8571 9.4737 L 0 18.9474 z" fill="#ffc107" />
    </marker>
  </defs>
</svg>
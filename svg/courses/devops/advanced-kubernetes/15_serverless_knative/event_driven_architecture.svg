<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="651.7647" y="40" text-anchor="middle" font-size="32.4517" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Event-Driven Architecture</text>
  <rect x="40" y="82.1819" width="282.3529" height="105.4545" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="181.1764" y="145.4546" text-anchor="middle" font-size="26.367" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">API Gateway</text>
  <rect x="416.4706" y="82.1819" width="823.5294" height="105.4545" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="828.2353" y="130.6909" text-anchor="middle" font-size="28.3952" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Broker</text>
  <text x="828.2353" y="166.5455" text-anchor="middle" font-size="22.3105" fill="var(--text-muted)" font-family="Arial, sans-serif">(receives CloudEvents)</text>
  <line x1="322.3529" y1="134.9091" x2="411.7646" y2="134.9091" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="604.7058" y1="187.6364" x2="604.7058" y2="282.5455" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="828.2353" y1="187.6364" x2="828.2353" y2="282.5455" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1075.2941" y1="187.6364" x2="1075.2941" y2="282.5455" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="451.7647" y="282.5455" width="305.8824" height="105.4545" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="604.7058" y="328.9455" text-anchor="middle" font-size="24.3387" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Trigger: order.*</text>
  <rect x="687.0588" y="282.5455" width="282.3529" height="105.4545" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="828.2353" y="328.9455" text-anchor="middle" font-size="24.3387" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Trigger: payment.*</text>
  <rect x="934.1176" y="282.5455" width="305.8824" height="105.4545" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1087.0588" y="328.9455" text-anchor="middle" font-size="24.3387" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Trigger: *.created</text>
  <line x1="604.7058" y1="388" x2="604.7058" y2="493.4545" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="828.2353" y1="388" x2="828.2353" y2="493.4545" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1087.0588" y1="388" x2="1087.0588" y2="493.4545" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="451.7647" y="493.4545" width="305.8824" height="126.5455" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="604.7058" y="546.1819" text-anchor="middle" font-size="24.3387" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Order Service</text>
  <text x="604.7058" y="588.3637" text-anchor="middle" font-size="22.3105" fill="var(--ok-accent)" font-family="Arial, sans-serif">(scale to 0)</text>
  <rect x="687.0588" y="493.4545" width="282.3529" height="126.5455" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="828.2353" y="546.1819" text-anchor="middle" font-size="24.3387" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Payment Service</text>
  <text x="828.2353" y="588.3637" text-anchor="middle" font-size="22.3105" fill="var(--ok-accent)" font-family="Arial, sans-serif">(scale to 0)</text>
  <rect x="934.1176" y="493.4545" width="305.8824" height="126.5455" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1087.0588" y="546.1819" text-anchor="middle" font-size="24.3387" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Analytics Service</text>
  <text x="1087.0588" y="588.3637" text-anchor="middle" font-size="22.3105" fill="var(--ok-accent)" font-family="Arial, sans-serif">(scale to 0)</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
</svg>
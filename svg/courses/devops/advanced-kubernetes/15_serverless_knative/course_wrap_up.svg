<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="33.0052" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Course Wrap Up</text>
  <rect x="40" y="75.1515" width="1200" height="158.1818" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="86.1539" y="119.091" font-size="25.6707" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Day 1: Deploying Resilient Apps &amp; Extending Kubernetes</text>
  <text x="109.2308" y="154.2425" font-size="20.1698" fill="var(--text-muted)" font-family="Arial, sans-serif">ReplicaSets, StatefulSets, Resources, Probes</text>
  <text x="109.2308" y="180.6061" font-size="20.1698" fill="var(--text-muted)" font-family="Arial, sans-serif">HPA, Cluster Autoscaler, KEDA</text>
  <text x="109.2308" y="206.9697" font-size="20.1698" fill="var(--text-muted)" font-family="Arial, sans-serif">Schedulers, Controllers, Operators, Init Containers, CRDs</text>
  <rect x="40" y="250.909" width="1200" height="175.7576" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="86.1539" y="294.8484" font-size="25.6707" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Day 2: Cluster Provisioning, Observability &amp; Service Mesh</text>
  <text x="109.2308" y="330" font-size="20.1698" fill="var(--text-muted)" font-family="Arial, sans-serif">kubeadm, Cluster API</text>
  <text x="109.2308" y="356.3636" font-size="20.1698" fill="var(--text-muted)" font-family="Arial, sans-serif">Prometheus, OpenTelemetry, Istio, NetworkPolicies</text>
  <text x="109.2308" y="382.7273" font-size="20.1698" fill="var(--text-muted)" font-family="Arial, sans-serif">DaemonSets, Jobs, CronJobs, Volumes, ConfigMaps, Secrets</text>
  <rect x="40" y="444.2424" width="1200" height="175.7576" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="86.1539" y="488.1818" font-size="25.6707" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Day 3: Advanced Admin, RBAC &amp; Serverless</text>
  <text x="109.2308" y="523.3333" font-size="20.1698" fill="var(--text-muted)" font-family="Arial, sans-serif">Declarative config, Kustomize, Helm</text>
  <text x="109.2308" y="549.697" font-size="20.1698" fill="var(--text-muted)" font-family="Arial, sans-serif">Best practices, deployment patterns</text>
  <text x="109.2308" y="576.0606" font-size="20.1698" fill="var(--text-muted)" font-family="Arial, sans-serif">RBAC deep dive, Knative Serving &amp; Eventing</text>
</svg>
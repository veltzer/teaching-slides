  <ns0:text x="85.7849" y="133.3334" font-size="24.8889" font-weight="bold" fill="#4a90e2">Day 1: Deploying Resilient Apps &amp; Extending Kubernetes</ns0:text>
  <ns0:text x="107.231" y="168.8889" font-size="19.5555" fill="#555">ReplicaSets, StatefulSets, Resources, Probes</ns0:text>
  <ns0:text x="107.231" y="195.5556" font-size="19.5555" fill="#555">HPA, Cluster Autoscaler, KEDA</ns0:text>
  <ns0:text x="107.231" y="222.2222" font-size="19.5555" fill="#555">Schedulers, Controllers, Operators, Init Containers, CRDs</ns0:text>
  <ns0:rect x="42.8924" y="266.6666" width="1115.2027" height="177.7778" rx="8.8889" fill="#d4edda" stroke="#28a745" stroke-width="3.5556" />
  <ns0:text x="85.7849" y="311.111" font-size="24.8889" font-weight="bold" fill="#28a745">Day 2: Cluster Provisioning, Observability &amp; Service Mesh</ns0:text>
  <ns0:text x="107.231" y="346.6667" font-size="19.5555" fill="#555">kubeadm, Cluster API</ns0:text>
  <ns0:text x="107.231" y="373.3333" font-size="19.5555" fill="#555">Prometheus, OpenTelemetry, Istio, NetworkPolicies</ns0:text>
  <ns0:text x="107.231" y="400" font-size="19.5555" fill="#555">DaemonSets, Jobs, CronJobs, Volumes, ConfigMaps, Secrets</ns0:text>
  <ns0:rect x="42.8924" y="462.2222" width="1115.2027" height="177.7778" rx="8.8889" fill="#fff3cd" stroke="#ffc107" stroke-width="3.5556" />
  <ns0:text x="85.7849" y="506.6666" font-size="24.8889" font-weight="bold" fill="#bf360c">Day 3: Advanced Admin, RBAC &amp; Serverless</ns0:text>
  <ns0:text x="107.231" y="542.2222" font-size="19.5555" fill="#555">Declarative config, Kustomize, Helm</ns0:text>
  <ns0:text x="107.231" y="568.8889" font-size="19.5555" fill="#555">Best practices, deployment patterns</ns0:text>
  <ns0:text x="107.231" y="595.5555" font-size="19.5555" fill="#555">RBAC deep dive, Knative Serving &amp; Eventing</ns0:text>

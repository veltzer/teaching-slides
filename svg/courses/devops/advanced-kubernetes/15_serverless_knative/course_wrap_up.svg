<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="600.4938" y="53.3333" text-anchor="middle" font-size="32" font-weight="bold" fill="var(--text)">Course Wrap Up</text>
  <rect x="42.8924" y="88.8888" width="1115.2027" height="160" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="85.7849" y="133.3334" font-size="24.8889" font-weight="bold" fill="var(--primary-accent)">Day 1: Deploying Resilient Apps &amp; Extending Kubernetes</text>
  <text x="107.231" y="168.8889" font-size="19.5555" fill="var(--text-muted)">ReplicaSets, StatefulSets, Resources, Probes</text>
  <text x="107.231" y="195.5556" font-size="19.5555" fill="var(--text-muted)">HPA, Cluster Autoscaler, KEDA</text>
  <text x="107.231" y="222.2222" font-size="19.5555" fill="var(--text-muted)">Schedulers, Controllers, Operators, Init Containers, CRDs</text>
  <rect x="42.8924" y="266.6666" width="1115.2027" height="177.7778" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="85.7849" y="311.111" font-size="24.8889" font-weight="bold" fill="var(--ok-accent)">Day 2: Cluster Provisioning, Observability &amp; Service Mesh</text>
  <text x="107.231" y="346.6667" font-size="19.5555" fill="var(--text-muted)">kubeadm, Cluster API</text>
  <text x="107.231" y="373.3333" font-size="19.5555" fill="var(--text-muted)">Prometheus, OpenTelemetry, Istio, NetworkPolicies</text>
  <text x="107.231" y="400" font-size="19.5555" fill="var(--text-muted)">DaemonSets, Jobs, CronJobs, Volumes, ConfigMaps, Secrets</text>
  <rect x="42.8924" y="462.2222" width="1115.2027" height="177.7778" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="85.7849" y="506.6666" font-size="24.8889" font-weight="bold" fill="var(--danger-accent)">Day 3: Advanced Admin, RBAC &amp; Serverless</text>
  <text x="107.231" y="542.2222" font-size="19.5555" fill="var(--text-muted)">Declarative config, Kustomize, Helm</text>
  <text x="107.231" y="568.8889" font-size="19.5555" fill="var(--text-muted)">Best practices, deployment patterns</text>
  <text x="107.231" y="595.5555" font-size="19.5555" fill="var(--text-muted)">RBAC deep dive, Knative Serving &amp; Eventing</text>
</svg>
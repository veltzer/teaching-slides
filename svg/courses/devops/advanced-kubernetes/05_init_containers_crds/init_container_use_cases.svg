<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" font-size="27.817978126391" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Pod Lifecycle</text>
  <rect x="60.000061999996" y="76.679812401379" width="279.999938000004" height="183.399295208491" rx="6.586007416637" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="200.000082666661" y="122.529577903104" font-size="23.844091017983" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Init 1</text>
  <text x="200.000082666661" y="168.379343404828" font-size="23.844091017983" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Clone repo</text>
  <line x1="340.000103333326" y1="168.379343404828" x2="420.000144666657" y2="168.379343404828" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="420.000144666657" y="76.679812401379" width="279.999938000004" height="183.399295208491" rx="6.586007416637" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="560.000061999996" y="122.529577903104" font-size="23.844091017983" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Init 2</text>
  <text x="560.000061999996" y="168.379343404828" font-size="23.844091017983" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Migrate DB</text>
  <line x1="700.000082666661" y1="168.379343404828" x2="780.000123999992" y2="168.379343404828" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="780.000123999992" y="76.679812401379" width="420.000061999996" height="183.399295208491" rx="6.586007416637" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="990" y="122.529577903104" font-size="23.844091017983" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">App Container</text>
  <text x="990" y="168.379343404828" font-size="23.844091017983" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Main workload</text>
  <line x1="40" y1="299.051291685539" x2="1240" y2="299.051291685539" stroke="var(--text-faint)" stroke-width="1.8069" stroke-dasharray="7.2277"/>
  <text x="60.000061999996" y="344.90117378806" font-size="25.831089455582" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Common patterns:</text>
  <text x="60.000061999996" y="390.750939289785" font-size="23.844091017983" fill="var(--text)" font-family="Arial, sans-serif">• Wait for dependencies</text>
  <text x="60.000061999996" y="436.600704791509" font-size="23.844091017983" fill="var(--text)" font-family="Arial, sans-serif">• Download / prepare configs</text>
  <text x="60.000061999996" y="482.450470293233" font-size="23.844091017983" fill="var(--text)" font-family="Arial, sans-serif">• Clone source code</text>
  <text x="60.000061999996" y="528.300352395754" font-size="23.844091017983" fill="var(--text)" font-family="Arial, sans-serif">• Database migrations</text>
  <text x="60.000061999996" y="574.150234498276" font-size="23.844091017983" fill="var(--text)" font-family="Arial, sans-serif">• Register with service mesh</text>
  <text x="60.000061999996" y="620" font-size="23.844091017983" fill="var(--text)" font-family="Arial, sans-serif">• Seed data</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="83.2543" font-size="25.3428" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Pod Lifecycle</text>
  <rect x="78.7097" y="114.7119" width="270.9677" height="157.2882" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="214.1936" y="154.0339" font-size="21.7225" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Init 1</text>
  <text x="214.1936" y="193.3559" font-size="21.7225" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Clone repo</text>
  <line x1="349.6775" y1="193.3559" x2="427.0969" y2="193.3559" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="427.0969" y="114.7119" width="270.9677" height="157.2882" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="562.5807" y="154.0339" font-size="21.7225" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Init 2</text>
  <text x="562.5807" y="193.3559" font-size="21.7225" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Migrate DB</text>
  <line x1="698.0646" y1="193.3559" x2="775.484" y2="193.3559" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="775.484" y="114.7119" width="406.4517" height="157.2882" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="978.7097" y="154.0339" font-size="21.7225" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">App Container</text>
  <text x="978.7097" y="193.3559" font-size="21.7225" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Main workload</text>
  <line x1="59.3548" y1="305.4237" x2="1220.6452" y2="305.4237" stroke="var(--text-faint)" stroke-width="1.8069" stroke-dasharray="7.2277"/>
  <text x="78.7097" y="344.7458" font-size="23.5327" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Common patterns:</text>
  <text x="78.7097" y="384.0678" font-size="21.7225" fill="var(--text)" font-family="Arial, sans-serif">• Wait for dependencies</text>
  <text x="78.7097" y="423.3898" font-size="21.7225" fill="var(--text)" font-family="Arial, sans-serif">• Download / prepare configs</text>
  <text x="78.7097" y="462.7118" font-size="21.7225" fill="var(--text)" font-family="Arial, sans-serif">• Clone source code</text>
  <text x="78.7097" y="502.0339" font-size="21.7225" fill="var(--text)" font-family="Arial, sans-serif">• Database migrations</text>
  <text x="78.7097" y="541.356" font-size="21.7225" fill="var(--text)" font-family="Arial, sans-serif">• Register with service mesh</text>
  <text x="78.7097" y="580.678" font-size="21.7225" fill="var(--text)" font-family="Arial, sans-serif">• Seed data</text>
</svg>

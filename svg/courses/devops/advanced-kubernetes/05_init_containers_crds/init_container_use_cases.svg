<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 13.9355 L 16 6.9677 z" fill="#555" />
    </marker>
  </defs>
  <rect x="18.0692" y="20.9836" width="1120.2914" height="619.0164" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="578.2149" y="67.1476" font-family="sans-serif" font-size="25.2969" font-weight="bold" fill="var(--text)" text-anchor="middle">Pod Lifecycle</text>
  <rect x="54.2077" y="100.7213" width="252.969" height="167.8689" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="180.6922" y="142.6885" font-family="sans-serif" font-size="21.6831" font-weight="bold" fill="var(--text)" text-anchor="middle">Init 1</text>
  <text x="180.6922" y="184.6557" font-family="sans-serif" font-size="21.6831" fill="var(--text-muted)" text-anchor="middle">Clone repo</text>
  <line x1="307.1767" y1="184.6557" x2="379.4536" y2="184.6557" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="379.4536" y="100.7213" width="252.969" height="167.8689" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="505.9381" y="142.6885" font-family="sans-serif" font-size="21.6831" font-weight="bold" fill="var(--text)" text-anchor="middle">Init 2</text>
  <text x="505.9381" y="184.6557" font-family="sans-serif" font-size="21.6831" fill="var(--text-muted)" text-anchor="middle">Migrate DB</text>
  <line x1="632.4226" y1="184.6557" x2="704.6995" y2="184.6557" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="704.6995" y="100.7213" width="379.4536" height="167.8689" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="894.4262" y="142.6885" font-family="sans-serif" font-size="21.6831" font-weight="bold" fill="var(--text)" text-anchor="middle">App Container</text>
  <text x="894.4262" y="184.6557" font-family="sans-serif" font-size="21.6831" fill="var(--text-muted)" text-anchor="middle">Main workload</text>
  <line x1="36.1384" y1="304.2623" x2="1120.2914" y2="304.2623" stroke="var(--text-faint)" stroke-width="1.8069" stroke-dasharray="7.2277" />
  <text x="54.2077" y="346.2295" font-family="sans-serif" font-size="23.49" font-weight="bold" fill="var(--text)">Common patterns:</text>
  <text x="54.2077" y="388.1967" font-family="sans-serif" font-size="21.6831" fill="var(--text)">• Wait for dependencies</text>
  <text x="54.2077" y="430.1639" font-family="sans-serif" font-size="21.6831" fill="var(--text)">• Download / prepare configs</text>
  <text x="54.2077" y="472.1311" font-family="sans-serif" font-size="21.6831" fill="var(--text)">• Clone source code</text>
  <text x="54.2077" y="514.0984" font-family="sans-serif" font-size="21.6831" fill="var(--text)">• Database migrations</text>
  <text x="54.2077" y="556.0656" font-family="sans-serif" font-size="21.6831" fill="var(--text)">• Register with service mesh</text>
  <text x="54.2077" y="598.0328" font-family="sans-serif" font-size="21.6831" fill="var(--text)">• Seed data</text>
</svg>
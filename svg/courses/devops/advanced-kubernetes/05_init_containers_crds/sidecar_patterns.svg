<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrf" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 13.0909 L 18.963 6.5455 z" fill="#555" />
    </marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 18.963 0 L 18.963 13.0909 L 0 6.5455 z" fill="#555" />
    </marker>
  </defs>
  <rect x="21.7284" y="20" width="1129.8766" height="620" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="586.6667" y="64" font-family="sans-serif" font-size="28" font-weight="bold" fill="var(--text)" text-anchor="middle">Pod</text>
  <rect x="65.1852" y="90" width="282.4691" height="120" rx="6" fill="var(--bg)" stroke="var(--text-muted)" stroke-width="3" />
  <text x="206.4198" y="140" font-family="sans-serif" font-size="24" font-weight="bold" fill="var(--text)" text-anchor="middle">App</text>
  <text x="206.4198" y="176" font-family="sans-serif" font-size="22" fill="var(--text-muted)" text-anchor="middle">Container</text>
  <line x1="347.6544" y1="150" x2="478.0247" y2="150" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrf)" />
  <rect x="478.0247" y="90" width="369.3828" height="120" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="662.7161" y="136" font-family="sans-serif" font-size="24" font-weight="bold" fill="var(--text)" text-anchor="middle">Log Shipper</text>
  <text x="662.7161" y="172" font-family="sans-serif" font-size="22" fill="var(--text-muted)" text-anchor="middle">(Sidecar)</text>
  <rect x="65.1852" y="260" width="282.4691" height="120" rx="6" fill="var(--bg)" stroke="var(--text-muted)" stroke-width="3" />
  <text x="206.4198" y="310" font-family="sans-serif" font-size="24" font-weight="bold" fill="var(--text)" text-anchor="middle">App</text>
  <text x="206.4198" y="346" font-family="sans-serif" font-size="22" fill="var(--text-muted)" text-anchor="middle">Container</text>
  <line x1="478.0247" y1="320" x2="347.6544" y2="320" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrf)" />
  <rect x="478.0247" y="260" width="434.5679" height="120" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="695.3086" y="304" font-family="sans-serif" font-size="24" font-weight="bold" fill="var(--text)" text-anchor="middle">Service Mesh Proxy</text>
  <text x="695.3086" y="340" font-family="sans-serif" font-size="22" fill="var(--text-muted)" text-anchor="middle">(Sidecar – Envoy)</text>
  <rect x="65.1852" y="430" width="282.4691" height="120" rx="6" fill="var(--bg)" stroke="var(--text-muted)" stroke-width="3" />
  <text x="206.4198" y="480" font-family="sans-serif" font-size="24" font-weight="bold" fill="var(--text)" text-anchor="middle">App</text>
  <text x="206.4198" y="516" font-family="sans-serif" font-size="22" fill="var(--text-muted)" text-anchor="middle">Container</text>
  <line x1="478.0247" y1="490.0001" x2="347.6544" y2="490.0001" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrf)" />
  <rect x="478.0247" y="430" width="369.3828" height="120" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="662.7161" y="476" font-family="sans-serif" font-size="24" font-weight="bold" fill="var(--text)" text-anchor="middle">Config Reloader</text>
  <text x="662.7161" y="512.0001" font-family="sans-serif" font-size="22" fill="var(--text-muted)" text-anchor="middle">(Sidecar)</text>
</svg>
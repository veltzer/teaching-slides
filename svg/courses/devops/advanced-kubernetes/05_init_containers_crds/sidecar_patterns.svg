<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="778.46154871795" y="40" font-size="36.399811968956" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Pod</text>
  <rect x="40" y="71.028828633845" width="399.999911111101" height="143.209909617434" rx="7.82525204012" fill="var(--bg)" stroke="var(--text-muted)" stroke-width="3"/>
  <text x="240.000022222225" y="130.699613676775" font-size="31.199801567428" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">App</text>
  <text x="240.000022222225" y="173.662548290403" font-size="28.599861577099" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Container</text>
  <line x1="440.000044444449" y1="142.633719656559" x2="624.6153982906" y2="142.633719656559" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="624.6153982906" y="71.028828633845" width="523.077124786347" height="143.209909617434" rx="7.82525204012" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="886.153827350425" y="125.925869227257" font-size="31.199801567428" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Log Shipper</text>
  <text x="886.153827350425" y="168.888803840885" font-size="28.599861577099" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">(Sidecar)</text>
  <rect x="40" y="273.909395722203" width="399.999911111101" height="143.209909617434" rx="7.82525204012" fill="var(--bg)" stroke="var(--text-muted)" stroke-width="3"/>
  <text x="240.000022222225" y="333.580180765133" font-size="31.199801567428" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">App</text>
  <text x="240.000022222225" y="376.543115378761" font-size="28.599861577099" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Container</text>
  <line x1="624.6153982906" y1="345.514414316922" x2="440.000044444449" y2="345.514414316922" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="624.6153982906" y="273.909395722203" width="615.3846017094" height="143.209909617434" rx="7.82525204012" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="932.307565811952" y="326.419691662861" font-size="31.199801567428" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Service Mesh Proxy</text>
  <text x="932.307565811952" y="369.38262627649" font-size="28.599861577099" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">(Sidecar – Envoy)</text>
  <rect x="40" y="476.790090382566" width="399.999911111101" height="143.209909617434" rx="7.82525204012" fill="var(--bg)" stroke="var(--text-muted)" stroke-width="3"/>
  <text x="240.000022222225" y="536.460875425497" font-size="31.199801567428" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">App</text>
  <text x="240.000022222225" y="579.423810039125" font-size="28.599861577099" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Container</text>
  <line x1="624.6153982906" y1="548.395108977286" x2="440.000044444449" y2="548.395108977286" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="624.6153982906" y="476.790090382566" width="523.077124786347" height="143.209909617434" rx="7.82525204012" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="886.153827350425" y="531.687130975979" font-size="31.199801567428" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Config Reloader</text>
  <text x="886.153827350425" y="574.650320733618" font-size="28.599861577099" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">(Sidecar)</text>
</svg>

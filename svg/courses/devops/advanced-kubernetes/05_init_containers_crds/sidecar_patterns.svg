<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrf" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 13.0909 L 18.963 6.5455 z" fill="#555" />
    </marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 18.963 0 L 18.963 13.0909 L 0 6.5455 z" fill="#555" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="81.1613" font-family="sans-serif" font-size="27.9095" font-weight="bold" fill="var(--text)" text-anchor="middle">Pod</text>
  <rect x="86.1539" y="105.4839" width="299.9999" height="112.2581" rx="6" fill="var(--bg)" stroke="var(--text-muted)" stroke-width="3" />
  <text x="236.1539" y="152.2581" font-family="sans-serif" font-size="23.9224" font-weight="bold" fill="var(--text)" text-anchor="middle">App</text>
  <text x="236.1539" y="185.9355" font-family="sans-serif" font-size="21.9289" fill="var(--text-muted)" text-anchor="middle">Container</text>
  <line x1="386.1539" y1="161.6129" x2="524.6154" y2="161.6129" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrf)" />
  <rect x="524.6154" y="105.4839" width="392.3078" height="112.2581" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="720.7692" y="148.5161" font-family="sans-serif" font-size="23.9224" font-weight="bold" fill="var(--text)" text-anchor="middle">Log Shipper</text>
  <text x="720.7692" y="182.1935" font-family="sans-serif" font-size="21.9289" fill="var(--text-muted)" text-anchor="middle">(Sidecar)</text>
  <rect x="86.1539" y="264.5161" width="299.9999" height="112.2581" rx="6" fill="var(--bg)" stroke="var(--text-muted)" stroke-width="3" />
  <text x="236.1539" y="311.2903" font-family="sans-serif" font-size="23.9224" font-weight="bold" fill="var(--text)" text-anchor="middle">App</text>
  <text x="236.1539" y="344.9677" font-family="sans-serif" font-size="21.9289" fill="var(--text-muted)" text-anchor="middle">Container</text>
  <line x1="524.6154" y1="320.6452" x2="386.1539" y2="320.6452" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrf)" />
  <rect x="524.6154" y="264.5161" width="461.5384" height="112.2581" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="755.3845" y="305.6774" font-family="sans-serif" font-size="23.9224" font-weight="bold" fill="var(--text)" text-anchor="middle">Service Mesh Proxy</text>
  <text x="755.3845" y="339.3548" font-family="sans-serif" font-size="21.9289" fill="var(--text-muted)" text-anchor="middle">(Sidecar – Envoy)</text>
  <rect x="86.1539" y="423.5484" width="299.9999" height="112.2581" rx="6" fill="var(--bg)" stroke="var(--text-muted)" stroke-width="3" />
  <text x="236.1539" y="470.3226" font-family="sans-serif" font-size="23.9224" font-weight="bold" fill="var(--text)" text-anchor="middle">App</text>
  <text x="236.1539" y="504" font-family="sans-serif" font-size="21.9289" fill="var(--text-muted)" text-anchor="middle">Container</text>
  <line x1="524.6154" y1="479.6775" x2="386.1539" y2="479.6775" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrf)" />
  <rect x="524.6154" y="423.5484" width="392.3078" height="112.2581" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="720.7692" y="466.5806" font-family="sans-serif" font-size="23.9224" font-weight="bold" fill="var(--text)" text-anchor="middle">Config Reloader</text>
  <text x="720.7692" y="500.2582" font-family="sans-serif" font-size="21.9289" fill="var(--text-muted)" text-anchor="middle">(Sidecar)</text>
</svg>
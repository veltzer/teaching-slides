<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="81.1613" font-size="27.9095" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Pod</text>
  <rect x="86.1539" y="105.4839" width="299.9999" height="112.2581" rx="6" fill="var(--bg)" stroke="var(--text-muted)" stroke-width="3"/>
  <text x="236.1539" y="152.2581" font-size="23.9224" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">App</text>
  <text x="236.1539" y="185.9355" font-size="21.9289" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Container</text>
  <line x1="386.1539" y1="161.6129" x2="524.6154" y2="161.6129" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="524.6154" y="105.4839" width="392.3078" height="112.2581" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="720.7692" y="148.5161" font-size="23.9224" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Log Shipper</text>
  <text x="720.7692" y="182.1935" font-size="21.9289" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">(Sidecar)</text>
  <rect x="86.1539" y="264.5161" width="299.9999" height="112.2581" rx="6" fill="var(--bg)" stroke="var(--text-muted)" stroke-width="3"/>
  <text x="236.1539" y="311.2903" font-size="23.9224" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">App</text>
  <text x="236.1539" y="344.9677" font-size="21.9289" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Container</text>
  <line x1="524.6154" y1="320.6452" x2="386.1539" y2="320.6452" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="524.6154" y="264.5161" width="461.5384" height="112.2581" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="755.3845" y="305.6774" font-size="23.9224" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Service Mesh Proxy</text>
  <text x="755.3845" y="339.3548" font-size="21.9289" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">(Sidecar – Envoy)</text>
  <rect x="86.1539" y="423.5484" width="299.9999" height="112.2581" rx="6" fill="var(--bg)" stroke="var(--text-muted)" stroke-width="3"/>
  <text x="236.1539" y="470.3226" font-size="23.9224" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">App</text>
  <text x="236.1539" y="504" font-size="21.9289" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Container</text>
  <line x1="524.6154" y1="479.6775" x2="386.1539" y2="479.6775" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="524.6154" y="423.5484" width="392.3078" height="112.2581" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="720.7692" y="466.5806" font-size="23.9224" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Config Reloader</text>
  <text x="720.7692" y="500.2582" font-size="21.9289" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">(Sidecar)</text>
</svg>

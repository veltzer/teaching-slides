<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 7.2258,0" fill="#555" />
    </marker>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 7.2258,0" fill="#555" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="311.3497" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="75.5828" text-anchor="middle" font-size="24.659" fill="var(--primary-accent)" font-weight="bold">Control Plane</text>
  <rect x="80" y="93.3742" width="1119.9999" height="231.2883" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="132.5153" text-anchor="middle" font-size="24.659" fill="var(--primary-accent)" font-weight="bold">istiod</text>
  <rect x="180" y="150.3067" width="260" height="142.3313" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="309.9999" y="209.0184" text-anchor="middle" font-size="21.1363" fill="var(--text)">Pilot</text>
  <text x="309.9999" y="241.0429" text-anchor="middle" font-size="19.3749" fill="var(--text-muted)">(config)</text>
  <rect x="540" y="150.3067" width="260" height="142.3313" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="669.9999" y="209.0184" text-anchor="middle" font-size="21.1363" fill="var(--text)">Citadel</text>
  <text x="669.9999" y="241.0429" text-anchor="middle" font-size="19.3749" fill="var(--text-muted)">(certs)</text>
  <rect x="920" y="150.3067" width="260" height="142.3313" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1049.9999" y="209.0184" text-anchor="middle" font-size="21.1363" fill="var(--text)">Galley</text>
  <text x="1049.9999" y="241.0429" text-anchor="middle" font-size="19.3749" fill="var(--text-muted)">(validate)</text>
  <line x1="640" y1="351.3497" x2="640" y2="404.7239" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="739.9999" y="385.1534" text-anchor="middle" font-size="19.3749" fill="var(--text-muted)">pushes config</text>
  <rect x="140" y="413.6196" width="290" height="169.0184" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="283.9999" y="463.4356" text-anchor="middle" font-size="21.1363" fill="var(--text)">Envoy Proxy</text>
  <text x="283.9999" y="495.4601" text-anchor="middle" font-size="19.3749" fill="var(--text-muted)">(sidecar)</text>
  <rect x="500" y="413.6196" width="290" height="169.0184" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="643.9999" y="463.4356" text-anchor="middle" font-size="21.1363" fill="var(--text)">Envoy Proxy</text>
  <text x="643.9999" y="495.4601" text-anchor="middle" font-size="19.3749" fill="var(--text-muted)">(sidecar)</text>
  <rect x="860" y="413.6196" width="290" height="169.0184" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1003.9999" y="463.4356" text-anchor="middle" font-size="21.1363" fill="var(--text)">Envoy Proxy</text>
  <text x="1003.9999" y="495.4601" text-anchor="middle" font-size="19.3749" fill="var(--text-muted)">(sidecar)</text>
  <text x="640" y="620" text-anchor="middle" font-size="22.8976" fill="var(--info-accent)" font-weight="bold">Data Plane</text>
</svg>
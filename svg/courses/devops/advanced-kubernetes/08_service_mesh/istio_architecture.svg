<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 7.2258,0" fill="#555" />
    </marker>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 7.2258,0" fill="#555" />
    </marker>
  </defs>
  <rect x="20.6452" y="18" width="1238.7097" height="315" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="54" text-anchor="middle" font-size="25.2" fill="var(--primary-accent)" font-weight="bold">Control Plane</text>
  <rect x="61.9355" y="72" width="1156.129" height="234" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="111.6" text-anchor="middle" font-size="25.2" fill="var(--primary-accent)" font-weight="bold">istiod</text>
  <rect x="165.1613" y="129.6" width="268.3871" height="144" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="299.3548" y="189" text-anchor="middle" font-size="21.6" fill="var(--text)">Pilot</text>
  <text x="299.3548" y="221.4" text-anchor="middle" font-size="19.8" fill="var(--text-muted)">(config)</text>
  <rect x="536.7742" y="129.6" width="268.3871" height="144" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="670.9677" y="189" text-anchor="middle" font-size="21.6" fill="var(--text)">Citadel</text>
  <text x="670.9677" y="221.4" text-anchor="middle" font-size="19.8" fill="var(--text-muted)">(certs)</text>
  <rect x="929.0323" y="129.6" width="268.3871" height="144" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1063.2258" y="189" text-anchor="middle" font-size="21.6" fill="var(--text)">Galley</text>
  <text x="1063.2258" y="221.4" text-anchor="middle" font-size="19.8" fill="var(--text-muted)">(validate)</text>
  <line x1="640" y1="333" x2="640" y2="387" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="743.2258" y="367.2" text-anchor="middle" font-size="19.8" fill="var(--text-muted)">pushes config</text>
  <rect x="123.871" y="396" width="299.3548" height="171" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="272.5161" y="446.4" text-anchor="middle" font-size="21.6" fill="var(--text)">Envoy Proxy</text>
  <text x="272.5161" y="478.8" text-anchor="middle" font-size="19.8" fill="var(--text-muted)">(sidecar)</text>
  <rect x="495.4839" y="396" width="299.3548" height="171" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="644.129" y="446.4" text-anchor="middle" font-size="21.6" fill="var(--text)">Envoy Proxy</text>
  <text x="644.129" y="478.8" text-anchor="middle" font-size="19.8" fill="var(--text-muted)">(sidecar)</text>
  <rect x="867.0968" y="396" width="299.3548" height="171" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="1015.7419" y="446.4" text-anchor="middle" font-size="21.6" fill="var(--text)">Envoy Proxy</text>
  <text x="1015.7419" y="478.8" text-anchor="middle" font-size="19.8" fill="var(--text-muted)">(sidecar)</text>
  <text x="640" y="604.8" text-anchor="middle" font-size="23.4" fill="var(--info-accent)" font-weight="bold">Data Plane</text>
</svg>
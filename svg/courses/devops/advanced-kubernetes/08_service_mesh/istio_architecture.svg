<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <rect x="40" y="40" width="1200" height="311.3497" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="75.5828" text-anchor="middle" font-size="24.659" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">Control Plane</text>
  <rect x="80" y="93.3742" width="1119.9999" height="231.2883" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="132.5153" text-anchor="middle" font-size="24.659" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">istiod</text>
  <rect x="180" y="150.3067" width="260" height="142.3313" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="309.9999" y="209.0184" text-anchor="middle" font-size="21.1363" fill="var(--text)" font-family="Arial, sans-serif">Pilot</text>
  <text x="309.9999" y="241.0429" text-anchor="middle" font-size="19.3749" fill="var(--text-muted)" font-family="Arial, sans-serif">(config)</text>
  <rect x="540" y="150.3067" width="260" height="142.3313" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="669.9999" y="209.0184" text-anchor="middle" font-size="21.1363" fill="var(--text)" font-family="Arial, sans-serif">Citadel</text>
  <text x="669.9999" y="241.0429" text-anchor="middle" font-size="19.3749" fill="var(--text-muted)" font-family="Arial, sans-serif">(certs)</text>
  <rect x="920" y="150.3067" width="260" height="142.3313" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1049.9999" y="209.0184" text-anchor="middle" font-size="21.1363" fill="var(--text)" font-family="Arial, sans-serif">Galley</text>
  <text x="1049.9999" y="241.0429" text-anchor="middle" font-size="19.3749" fill="var(--text-muted)" font-family="Arial, sans-serif">(validate)</text>
  <line x1="640" y1="351.3497" x2="640" y2="404.7239" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="739.9999" y="385.1534" text-anchor="middle" font-size="19.3749" fill="var(--text-muted)" font-family="Arial, sans-serif">pushes config</text>
  <rect x="140" y="413.6196" width="290" height="169.0184" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="283.9999" y="463.4356" text-anchor="middle" font-size="21.1363" fill="var(--text)" font-family="Arial, sans-serif">Envoy Proxy</text>
  <text x="283.9999" y="495.4601" text-anchor="middle" font-size="19.3749" fill="var(--text-muted)" font-family="Arial, sans-serif">(sidecar)</text>
  <rect x="500" y="413.6196" width="290" height="169.0184" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="643.9999" y="463.4356" text-anchor="middle" font-size="21.1363" fill="var(--text)" font-family="Arial, sans-serif">Envoy Proxy</text>
  <text x="643.9999" y="495.4601" text-anchor="middle" font-size="19.3749" fill="var(--text-muted)" font-family="Arial, sans-serif">(sidecar)</text>
  <rect x="860" y="413.6196" width="290" height="169.0184" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1003.9999" y="463.4356" text-anchor="middle" font-size="21.1363" fill="var(--text)" font-family="Arial, sans-serif">Envoy Proxy</text>
  <text x="1003.9999" y="495.4601" text-anchor="middle" font-size="19.3749" fill="var(--text-muted)" font-family="Arial, sans-serif">(sidecar)</text>
  <text x="640" y="620" text-anchor="middle" font-size="22.8976" fill="var(--info-accent)" font-weight="bold" font-family="Arial, sans-serif">Data Plane</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,19.4595 6.8923,0" fill="#555" />
    </marker>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,19.4595 6.8923,0" fill="#555" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="76.2499" text-anchor="middle" font-size="25.8586" fill="var(--text)" font-weight="bold">production namespace</text>
  <rect x="87.619" y="121.5624" width="247.619" height="117.8125" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="211.4285" y="170.5" text-anchor="middle" font-size="24.0115" fill="var(--text)">frontend</text>
  <line x1="335.2381" y1="179.5625" x2="440" y2="179.5625" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="386.6666" y="166.8749" text-anchor="middle" font-size="18.4705" fill="var(--text-muted)">8080</text>
  <rect x="440" y="103.4375" width="380.9524" height="280.9375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="630.4761" y="145.125" text-anchor="middle" font-size="24.0115" fill="var(--text)" font-weight="bold">api-server</text>
  <text x="630.4761" y="184.9999" text-anchor="middle" font-size="20.3174" fill="var(--text-muted)">Ingress:</text>
  <text x="630.4761" y="214" text-anchor="middle" font-size="20.3174" fill="var(--text-muted)">  from: frontend</text>
  <text x="630.4761" y="242.9999" text-anchor="middle" font-size="20.3174" fill="var(--text-muted)">  port: 8080</text>
  <text x="630.4761" y="279.2499" text-anchor="middle" font-size="20.3174" fill="var(--text-muted)">Egress:</text>
  <text x="630.4761" y="308.25" text-anchor="middle" font-size="20.3174" fill="var(--text-muted)">  to: database</text>
  <text x="630.4761" y="337.2499" text-anchor="middle" font-size="20.3174" fill="var(--text-muted)">  port: 5432</text>
  <line x1="630.4761" y1="384.375" x2="630.4761" y2="447.8125" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="668.5714" y="424.2499" text-anchor="middle" font-size="18.4705" fill="var(--text-muted)">5432</text>
  <rect x="440" y="447.8125" width="380.9524" height="117.8125" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="630.4761" y="498.5625" text-anchor="middle" font-size="24.0115" fill="var(--text)">database</text>
  <text x="630.4761" y="533" text-anchor="middle" font-size="20.3174" fill="var(--text-muted)">port: 5432</text>
  <text x="87.619" y="610.9375" text-anchor="start" font-size="20.3174" fill="var(--danger-accent)">✗ backend → api-server (BLOCKED)   ✗ api-server → internet (BLOCKED)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.854226236055" font-weight="bold" fill="var(--text)">Service Mesh: Sidecar Proxy</text>

  <rect x="40" y="86.194690265487" width="558.620689655172" height="349.026548672566" rx="14.427113118027" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="3" filter="url(#shadow)"/>
  <text x="319.310344827586" y="122.12389380531" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.549145437464" font-weight="bold" fill="var(--primary-text)">Pod A</text>
  <rect x="81.379310344828" y="147.787610619469" width="206.896551724138" height="102.654867256637" rx="8.244064638873" fill="url(#grad-info)" filter="url(#shadow)"/>
  <text x="184.827586206897" y="188.849557522124" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.427113118027" font-weight="bold" fill="var(--info-text)">app container</text>
  <text x="184.827586206897" y="214.513274336283" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.366096958309" fill="var(--info-text)">localhost only</text>
  <rect x="329.655172413793" y="147.787610619469" width="227.586206896552" height="102.654867256637" rx="8.244064638873" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="443.448275862069" y="188.849557522124" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.427113118027" font-weight="bold" fill="var(--warn-text)">Envoy sidecar</text>
  <text x="443.448275862069" y="214.513274336283" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.366096958309" fill="var(--warn-text)">handles network</text>
  <text x="60.689655172414" y="291.504424778761" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--primary-text)">Sidecar handles:</text>
  <text x="60.689655172414" y="317.16814159292" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--primary-text)">- mTLS encryption</text>
  <text x="60.689655172414" y="342.83185840708" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--primary-text)">- Retries / timeouts</text>
  <text x="60.689655172414" y="368.495575221239" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--primary-text)">- Telemetry</text>
  <text x="60.689655172414" y="394.159292035398" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--primary-text)">- Routing rules</text>

  <path d="M 614.137931034483 209.380530973451 L 676.206896551724 209.380530973451" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="645.172413793103" y="193.982300884956" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.33558887845" font-weight="bold" fill="var(--text-muted)">mTLS</text>

  <rect x="681.379310344828" y="86.194690265487" width="558.620689655172" height="349.026548672566" rx="14.427113118027" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="3" filter="url(#shadow)"/>
  <text x="960.689655172414" y="122.12389380531" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.549145437464" font-weight="bold" fill="var(--primary-text)">Pod B</text>
  <rect x="722.758620689655" y="147.787610619469" width="227.586206896552" height="102.654867256637" rx="8.244064638873" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="836.551724137931" y="188.849557522124" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.427113118027" font-weight="bold" fill="var(--warn-text)">Envoy sidecar</text>
  <rect x="991.724137931035" y="147.787610619469" width="206.896551724138" height="102.654867256637" rx="8.244064638873" fill="url(#grad-info)" filter="url(#shadow)"/>
  <text x="1095.172413793103" y="188.849557522124" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.427113118027" font-weight="bold" fill="var(--info-text)">app container</text>

  <text x="702.068965517241" y="291.504424778761" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--primary-text)">App is unaware of:</text>
  <text x="702.068965517241" y="317.16814159292" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--primary-text)">- TLS / certs</text>
  <text x="702.068965517241" y="342.83185840708" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--primary-text)">- Service discovery</text>
  <text x="702.068965517241" y="368.495575221239" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--primary-text)">- Observability injection</text>

  <rect x="40" y="466.017699115044" width="1200" height="153.982300884956" rx="10.305080798591" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="501.946902654867" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.488129277745" font-weight="bold" fill="var(--text)">Istio, Linkerd, Consul Connect</text>
  <text x="640" y="532.743362831858" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--text-muted)">Cost: more containers, more memory, more complexity</text>
  <text x="640" y="563.53982300885" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--text-muted)">Worth it: large microservice fleets, compliance needs</text>
  <text x="640" y="594.336283185841" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.396605038168" font-style="italic" fill="var(--text-muted)">eBPF-based meshes (Cilium) are an alternative</text>
</svg>

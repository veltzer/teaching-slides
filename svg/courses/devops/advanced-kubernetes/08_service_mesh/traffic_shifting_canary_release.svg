<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="40" y="83" font-size="26" font-weight="bold" fill="var(--text)">Step 1: 100% v1</text>
  <text x="260" y="77" font-size="22" fill="var(--primary-accent)" text-anchor="end">v1</text>
  <rect x="280" y="55" width="860" height="50" rx="6" fill="var(--border)"/>
  <rect x="280" y="55" width="860.0" height="50" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1150" y="88" font-size="22" fill="var(--primary-accent)" text-anchor="end">100%</text>
  <text x="260" y="140" font-size="22" fill="var(--ok-accent)" text-anchor="end">v2</text>
  <rect x="280" y="117" width="860" height="50" rx="6" fill="var(--border)"/>
  <text x="1150" y="150" font-size="22" fill="var(--ok-accent)" text-anchor="end">0%</text>
  <text x="40" y="228" font-size="26" fill="var(--text)">Step 2: 90/10 split</text>
  <text x="260" y="222" font-size="22" fill="var(--primary-accent)" text-anchor="end">v1</text>
  <rect x="280" y="200" width="860" height="50" rx="6" fill="var(--border)"/>
  <rect x="280" y="200" width="774.0" height="50" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1150" y="233" font-size="22" fill="var(--primary-accent)" text-anchor="end">90%</text>
  <text x="260" y="285" font-size="22" fill="var(--ok-accent)" text-anchor="end">v2</text>
  <rect x="280" y="262" width="860" height="50" rx="6" fill="var(--border)"/>
  <rect x="280" y="262" width="86.0" height="50" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1150" y="295" font-size="22" fill="var(--ok-accent)" text-anchor="end">10%</text>
  <text x="40" y="373" font-size="26" fill="var(--text)">Step 3: 50/50 split</text>
  <text x="260" y="367" font-size="22" fill="var(--primary-accent)" text-anchor="end">v1</text>
  <rect x="280" y="345" width="860" height="50" rx="6" fill="var(--border)"/>
  <rect x="280" y="345" width="430.0" height="50" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1150" y="378" font-size="22" fill="var(--primary-accent)" text-anchor="end">50%</text>
  <text x="260" y="430" font-size="22" fill="var(--ok-accent)" text-anchor="end">v2</text>
  <rect x="280" y="407" width="860" height="50" rx="6" fill="var(--border)"/>
  <rect x="280" y="407" width="430.0" height="50" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1150" y="440" font-size="22" fill="var(--ok-accent)" text-anchor="end">50%</text>
  <text x="40" y="518" font-size="26" font-weight="bold" fill="var(--text)">Step 4: 100% v2</text>
  <text x="260" y="512" font-size="22" fill="var(--primary-accent)" text-anchor="end">v1</text>
  <rect x="280" y="490" width="860" height="50" rx="6" fill="var(--border)"/>
  <text x="1150" y="523" font-size="22" fill="var(--primary-accent)" text-anchor="end">0%</text>
  <text x="260" y="575" font-size="22" fill="var(--ok-accent)" text-anchor="end">v2</text>
  <rect x="280" y="552" width="860" height="50" rx="6" fill="var(--border)"/>
  <rect x="280" y="552" width="860.0" height="50" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1150" y="585" font-size="22" fill="var(--ok-accent)" text-anchor="end">100%</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="40" y="69.689214" font-size="27.837025" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Step 1: 100% v1</text>
  <text x="277.837838" y="63.327239" font-size="23.554406" fill="var(--primary-accent)" text-anchor="end" font-family="Arial, sans-serif">v1</text>
  <rect x="299.459459" y="40" width="929.72973" height="53.016453" rx="6.423929" fill="var(--border)"/>
  <rect x="299.459459" y="40" width="929.72973" height="53.016453" rx="6.423929" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1240" y="74.990859" font-size="23.554406" fill="var(--primary-accent)" text-anchor="end" font-family="Arial, sans-serif">100%</text>
  <text x="277.837838" y="130.127971" font-size="23.554406" fill="var(--ok-accent)" text-anchor="end" font-family="Arial, sans-serif">v2</text>
  <rect x="299.459459" y="105.740402" width="929.72973" height="53.016453" rx="6.423929" fill="var(--border)"/>
  <text x="1240" y="140.731261" font-size="23.554406" fill="var(--ok-accent)" text-anchor="end" font-family="Arial, sans-serif">0%</text>
  <text x="40" y="223.436929" font-size="27.837025" fill="var(--text)" font-family="Arial, sans-serif">Step 2: 90/10 split</text>
  <text x="277.837838" y="217.074954" font-size="23.554406" fill="var(--primary-accent)" text-anchor="end" font-family="Arial, sans-serif">v1</text>
  <rect x="299.459459" y="193.747715" width="929.72973" height="53.016453" rx="6.423929" fill="var(--border)"/>
  <rect x="299.459459" y="193.747715" width="836.756757" height="53.016453" rx="6.423929" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1240" y="228.738574" font-size="23.554406" fill="var(--primary-accent)" text-anchor="end" font-family="Arial, sans-serif">90%</text>
  <text x="277.837838" y="283.875686" font-size="23.554406" fill="var(--ok-accent)" text-anchor="end" font-family="Arial, sans-serif">v2</text>
  <rect x="299.459459" y="259.488117" width="929.72973" height="53.016453" rx="6.423929" fill="var(--border)"/>
  <rect x="299.459459" y="259.488117" width="92.972973" height="53.016453" rx="6.423929" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1240" y="294.478976" font-size="23.554406" fill="var(--ok-accent)" text-anchor="end" font-family="Arial, sans-serif">10%</text>
  <text x="40" y="377.184644" font-size="27.837025" fill="var(--text)" font-family="Arial, sans-serif">Step 3: 50/50 split</text>
  <text x="277.837838" y="370.822669" font-size="23.554406" fill="var(--primary-accent)" text-anchor="end" font-family="Arial, sans-serif">v1</text>
  <rect x="299.459459" y="347.49543" width="929.72973" height="53.016453" rx="6.423929" fill="var(--border)"/>
  <rect x="299.459459" y="347.49543" width="464.864865" height="53.016453" rx="6.423929" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1240" y="382.486289" font-size="23.554406" fill="var(--primary-accent)" text-anchor="end" font-family="Arial, sans-serif">50%</text>
  <text x="277.837838" y="437.6234" font-size="23.554406" fill="var(--ok-accent)" text-anchor="end" font-family="Arial, sans-serif">v2</text>
  <rect x="299.459459" y="413.235832" width="929.72973" height="53.016453" rx="6.423929" fill="var(--border)"/>
  <rect x="299.459459" y="413.235832" width="464.864865" height="53.016453" rx="6.423929" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1240" y="448.226691" font-size="23.554406" fill="var(--ok-accent)" text-anchor="end" font-family="Arial, sans-serif">50%</text>
  <text x="40" y="530.932358" font-size="27.837025" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Step 4: 100% v2</text>
  <text x="277.837838" y="524.570384" font-size="23.554406" fill="var(--primary-accent)" text-anchor="end" font-family="Arial, sans-serif">v1</text>
  <rect x="299.459459" y="501.243144" width="929.72973" height="53.016453" rx="6.423929" fill="var(--border)"/>
  <text x="1240" y="536.234004" font-size="23.554406" fill="var(--primary-accent)" text-anchor="end" font-family="Arial, sans-serif">0%</text>
  <text x="277.837838" y="591.371115" font-size="23.554406" fill="var(--ok-accent)" text-anchor="end" font-family="Arial, sans-serif">v2</text>
  <rect x="299.459459" y="566.983547" width="929.72973" height="53.016453" rx="6.423929" fill="var(--border)"/>
  <rect x="299.459459" y="566.983547" width="929.72973" height="53.016453" rx="6.423929" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1240" y="601.974406" font-size="23.554406" fill="var(--ok-accent)" text-anchor="end" font-family="Arial, sans-serif">100%</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,23.2258 7,0" fill="#555" />
    </marker>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,23.2258 7,0" fill="#555" />
    </marker>
  </defs>
  <text x="38.5392" y="85.035" text-anchor="start" font-size="25.0505" fill="var(--text)" font-weight="bold">Step 1: 100% v1</text>
  <text x="144.5221" y="129.7902" text-anchor="start" font-size="23.1235" fill="var(--primary-accent)">v1</text>
  <rect x="192.6962" y="102.937" width="578.0885" height="35.8042" rx="6" fill="var(--border)" stroke="var(--border)" stroke-width="2.8904" />
  <rect x="192.6962" y="102.937" width="578.0885" height="35.8042" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="790.0543" y="132.028" text-anchor="start" font-size="23.1235" fill="var(--primary-accent)">100%</text>
  <text x="144.5221" y="174.5455" text-anchor="start" font-size="23.1235" fill="var(--ok-accent)">v2</text>
  <rect x="192.6962" y="147.6923" width="578.0885" height="35.8042" rx="6" fill="var(--border)" stroke="var(--border)" stroke-width="2.8904" />
  <text x="790.0543" y="176.7832" text-anchor="start" font-size="23.1235" fill="var(--ok-accent)">0%</text>
  <text x="38.5392" y="237.2027" text-anchor="start" font-size="25.0505" fill="var(--text)">Step 2: 90/10 split</text>
  <text x="144.5221" y="281.9581" text-anchor="start" font-size="23.1235" fill="var(--primary-accent)">v1</text>
  <rect x="192.6962" y="255.1049" width="578.0885" height="35.8042" rx="6" fill="var(--border)" stroke="var(--border)" stroke-width="2.8904" />
  <rect x="192.6962" y="255.1049" width="520.2797" height="35.8042" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="790.0543" y="284.1957" text-anchor="start" font-size="23.1235" fill="var(--primary-accent)">90%</text>
  <text x="144.5221" y="326.7133" text-anchor="start" font-size="23.1235" fill="var(--ok-accent)">v2</text>
  <rect x="192.6962" y="299.8601" width="578.0885" height="35.8042" rx="6" fill="var(--border)" stroke="var(--border)" stroke-width="2.8904" />
  <rect x="192.6962" y="299.8601" width="57.8089" height="35.8042" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="790.0543" y="328.9511" text-anchor="start" font-size="23.1235" fill="var(--ok-accent)">10%</text>
  <text x="38.5392" y="389.3706" text-anchor="start" font-size="25.0505" fill="var(--text)">Step 3: 50/50 split</text>
  <text x="144.5221" y="434.1258" text-anchor="start" font-size="23.1235" fill="var(--primary-accent)">v1</text>
  <rect x="192.6962" y="407.2727" width="578.0885" height="35.8042" rx="6" fill="var(--border)" stroke="var(--border)" stroke-width="2.8904" />
  <rect x="192.6962" y="407.2727" width="289.0443" height="35.8042" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="790.0543" y="436.3636" text-anchor="start" font-size="23.1235" fill="var(--primary-accent)">50%</text>
  <text x="144.5221" y="478.8811" text-anchor="start" font-size="23.1235" fill="var(--ok-accent)">v2</text>
  <rect x="192.6962" y="452.028" width="578.0885" height="35.8042" rx="6" fill="var(--border)" stroke="var(--border)" stroke-width="2.8904" />
  <rect x="192.6962" y="452.028" width="289.0443" height="35.8042" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="790.0543" y="481.1188" text-anchor="start" font-size="23.1235" fill="var(--ok-accent)">50%</text>
  <text x="38.5392" y="541.5384" text-anchor="start" font-size="25.0505" fill="var(--text)" font-weight="bold">Step 4: 100% v2</text>
  <text x="144.5221" y="586.2936" text-anchor="start" font-size="23.1235" fill="var(--primary-accent)">v1</text>
  <rect x="192.6962" y="559.4406" width="578.0885" height="35.8042" rx="6" fill="var(--border)" stroke="var(--border)" stroke-width="2.8904" />
  <text x="790.0543" y="588.5314" text-anchor="start" font-size="23.1235" fill="var(--primary-accent)">0%</text>
  <text x="144.5221" y="631.0489" text-anchor="start" font-size="23.1235" fill="var(--ok-accent)">v2</text>
  <rect x="192.6962" y="604.1958" width="578.0885" height="35.8042" rx="6" fill="var(--border)" stroke="var(--border)" stroke-width="2.8904" />
  <rect x="192.6962" y="604.1958" width="578.0885" height="35.8042" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="790.0543" y="633.2867" text-anchor="start" font-size="23.1235" fill="var(--ok-accent)">100%</text>
</svg>
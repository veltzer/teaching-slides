<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,23.2258 7,0" fill="#555" />
    </marker>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,23.2258 7,0" fill="#555" />
    </marker>
  </defs>
  <text x="247.2917" y="40" text-anchor="start" font-size="26.1806" fill="var(--text)" font-weight="bold">Step 1: 100% v1</text>
  <text x="358.0556" y="86.7741" text-anchor="start" font-size="24.1666" fill="var(--primary-accent)">v1</text>
  <rect x="408.4028" y="58.7096" width="604.1666" height="37.4194" rx="6" fill="var(--border)" stroke="var(--border)" stroke-width="2.8904" />
  <rect x="408.4028" y="58.7096" width="604.1666" height="37.4194" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1032.7083" y="89.1129" text-anchor="start" font-size="24.1666" fill="var(--primary-accent)">100%</text>
  <text x="358.0556" y="133.5484" text-anchor="start" font-size="24.1666" fill="var(--ok-accent)">v2</text>
  <rect x="408.4028" y="105.4838" width="604.1666" height="37.4194" rx="6" fill="var(--border)" stroke="var(--border)" stroke-width="2.8904" />
  <text x="1032.7083" y="135.887" text-anchor="start" font-size="24.1666" fill="var(--ok-accent)">0%</text>
  <text x="247.2917" y="199.0321" text-anchor="start" font-size="26.1806" fill="var(--text)">Step 2: 90/10 split</text>
  <text x="358.0556" y="245.8065" text-anchor="start" font-size="24.1666" fill="var(--primary-accent)">v1</text>
  <rect x="408.4028" y="217.7419" width="604.1666" height="37.4194" rx="6" fill="var(--border)" stroke="var(--border)" stroke-width="2.8904" />
  <rect x="408.4028" y="217.7419" width="543.75" height="37.4194" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1032.7083" y="248.145" text-anchor="start" font-size="24.1666" fill="var(--primary-accent)">90%</text>
  <text x="358.0556" y="292.5806" text-anchor="start" font-size="24.1666" fill="var(--ok-accent)">v2</text>
  <rect x="408.4028" y="264.5161" width="604.1666" height="37.4194" rx="6" fill="var(--border)" stroke="var(--border)" stroke-width="2.8904" />
  <rect x="408.4028" y="264.5161" width="60.4167" height="37.4194" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1032.7083" y="294.9194" text-anchor="start" font-size="24.1666" fill="var(--ok-accent)">10%</text>
  <text x="247.2917" y="358.0645" text-anchor="start" font-size="26.1806" fill="var(--text)">Step 3: 50/50 split</text>
  <text x="358.0556" y="404.8386" text-anchor="start" font-size="24.1666" fill="var(--primary-accent)">v1</text>
  <rect x="408.4028" y="376.7741" width="604.1666" height="37.4194" rx="6" fill="var(--border)" stroke="var(--border)" stroke-width="2.8904" />
  <rect x="408.4028" y="376.7741" width="302.0834" height="37.4194" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1032.7083" y="407.1774" text-anchor="start" font-size="24.1666" fill="var(--primary-accent)">50%</text>
  <text x="358.0556" y="451.6129" text-anchor="start" font-size="24.1666" fill="var(--ok-accent)">v2</text>
  <rect x="408.4028" y="423.5484" width="604.1666" height="37.4194" rx="6" fill="var(--border)" stroke="var(--border)" stroke-width="2.8904" />
  <rect x="408.4028" y="423.5484" width="302.0834" height="37.4194" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1032.7083" y="453.9515" text-anchor="start" font-size="24.1666" fill="var(--ok-accent)">50%</text>
  <text x="247.2917" y="517.0967" text-anchor="start" font-size="26.1806" fill="var(--text)" font-weight="bold">Step 4: 100% v2</text>
  <text x="358.0556" y="563.8709" text-anchor="start" font-size="24.1666" fill="var(--primary-accent)">v1</text>
  <rect x="408.4028" y="535.8065" width="604.1666" height="37.4194" rx="6" fill="var(--border)" stroke="var(--border)" stroke-width="2.8904" />
  <text x="1032.7083" y="566.2096" text-anchor="start" font-size="24.1666" fill="var(--primary-accent)">0%</text>
  <text x="358.0556" y="610.6451" text-anchor="start" font-size="24.1666" fill="var(--ok-accent)">v2</text>
  <rect x="408.4028" y="582.5806" width="604.1666" height="37.4194" rx="6" fill="var(--border)" stroke="var(--border)" stroke-width="2.8904" />
  <rect x="408.4028" y="582.5806" width="604.1666" height="37.4194" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1032.7083" y="612.9839" text-anchor="start" font-size="24.1666" fill="var(--ok-accent)">100%</text>
</svg>
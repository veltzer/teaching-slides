<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,21.1765 6.8923,0" fill="#555" />
    </marker>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,21.1765 6.8923,0" fill="#555" />
    </marker>
  </defs>
  <rect x="40" y="40" width="571.4285" height="580" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="325.7142" y="82.5333" text-anchor="middle" font-size="24.0568" fill="var(--warn-accent)" font-weight="bold">Without Service Mesh</text>
  <rect x="78.0953" y="117.3334" width="133.3334" height="96.6668" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="144.7619" y="175.3333" text-anchor="middle" font-size="22.2063" fill="var(--text)">App A</text>
  <line x1="211.4286" y1="165.6666" x2="240" y2="165.6666" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="240" y="117.3334" width="133.3334" height="96.6668" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="306.6667" y="175.3333" text-anchor="middle" font-size="22.2063" fill="var(--text)">App B</text>
  <line x1="373.3334" y1="165.6666" x2="401.9048" y2="165.6666" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="401.9048" y="117.3334" width="133.3334" height="96.6668" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="468.5714" y="175.3333" text-anchor="middle" font-size="22.2063" fill="var(--text)">App C</text>
  <text x="325.7142" y="262.3333" text-anchor="middle" font-size="20.3557" fill="var(--text-muted)">Each app handles:</text>
  <text x="325.7142" y="295.2" text-anchor="middle" font-size="20.3557" fill="var(--text-muted)">retries, timeouts, auth,</text>
  <text x="325.7142" y="328.0667" text-anchor="middle" font-size="20.3557" fill="var(--text-muted)">logging, tracing, TLS...</text>
  <rect x="649.5238" y="40" width="590.4762" height="580" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="944.7619" y="82.5333" text-anchor="middle" font-size="24.0568" fill="var(--ok-accent)" font-weight="bold">With Service Mesh</text>
  <rect x="678.0952" y="117.3334" width="133.3334" height="77.3334" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="744.7619" y="163.7333" text-anchor="middle" font-size="22.2063" fill="var(--text)">App A</text>
  <rect x="678.0952" y="210.1333" width="133.3334" height="69.6" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="744.7619" y="252.6666" text-anchor="middle" font-size="20.3557" fill="var(--info-accent)">Proxy</text>
  <line x1="811.4286" y1="244.9333" x2="849.5238" y2="244.9333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="849.5238" y="117.3334" width="133.3334" height="77.3334" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="916.1905" y="163.7333" text-anchor="middle" font-size="22.2063" fill="var(--text)">App B</text>
  <rect x="849.5238" y="210.1333" width="133.3334" height="69.6" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="916.1905" y="252.6666" text-anchor="middle" font-size="20.3557" fill="var(--info-accent)">Proxy</text>
  <line x1="982.857" y1="244.9333" x2="1020.9524" y2="244.9333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="1020.9524" y="117.3334" width="133.3334" height="77.3334" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1087.6189" y="163.7333" text-anchor="middle" font-size="22.2063" fill="var(--text)">App C</text>
  <rect x="1020.9524" y="210.1333" width="133.3334" height="69.6" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1087.6189" y="252.6666" text-anchor="middle" font-size="20.3557" fill="var(--info-accent)">Proxy</text>
  <text x="944.7619" y="326.1333" text-anchor="middle" font-size="20.3557" fill="var(--text-muted)">Proxies handle all</text>
  <text x="944.7619" y="357.0666" text-anchor="middle" font-size="20.3557" fill="var(--text-muted)">cross-cutting concerns</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="571.4285" height="580" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="325.7142" y="82.5333" text-anchor="middle" font-size="24.0568" fill="var(--warn-accent)" font-weight="bold" font-family="Arial, sans-serif">Without Service Mesh</text>
  <rect x="78.0953" y="117.3334" width="133.3334" height="96.6668" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="144.7619" y="175.3333" text-anchor="middle" font-size="22.2063" fill="var(--text)" font-family="Arial, sans-serif">App A</text>
  <line x1="211.4286" y1="165.6666" x2="240" y2="165.6666" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="240" y="117.3334" width="133.3334" height="96.6668" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="306.6667" y="175.3333" text-anchor="middle" font-size="22.2063" fill="var(--text)" font-family="Arial, sans-serif">App B</text>
  <line x1="373.3334" y1="165.6666" x2="401.9048" y2="165.6666" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="401.9048" y="117.3334" width="133.3334" height="96.6668" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="468.5714" y="175.3333" text-anchor="middle" font-size="22.2063" fill="var(--text)" font-family="Arial, sans-serif">App C</text>
  <text x="325.7142" y="262.3333" text-anchor="middle" font-size="20.3557" fill="var(--text-muted)" font-family="Arial, sans-serif">Each app handles:</text>
  <text x="325.7142" y="295.2" text-anchor="middle" font-size="20.3557" fill="var(--text-muted)" font-family="Arial, sans-serif">retries, timeouts, auth,</text>
  <text x="325.7142" y="328.0667" text-anchor="middle" font-size="20.3557" fill="var(--text-muted)" font-family="Arial, sans-serif">logging, tracing, TLS...</text>
  <rect x="649.5238" y="40" width="590.4762" height="580" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="944.7619" y="82.5333" text-anchor="middle" font-size="24.0568" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">With Service Mesh</text>
  <rect x="678.0952" y="117.3334" width="133.3334" height="77.3334" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="744.7619" y="163.7333" text-anchor="middle" font-size="22.2063" fill="var(--text)" font-family="Arial, sans-serif">App A</text>
  <rect x="678.0952" y="210.1333" width="133.3334" height="69.6" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="744.7619" y="252.6666" text-anchor="middle" font-size="20.3557" fill="var(--info-accent)" font-family="Arial, sans-serif">Proxy</text>
  <line x1="811.4286" y1="244.9333" x2="849.5238" y2="244.9333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="849.5238" y="117.3334" width="133.3334" height="77.3334" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="916.1905" y="163.7333" text-anchor="middle" font-size="22.2063" fill="var(--text)" font-family="Arial, sans-serif">App B</text>
  <rect x="849.5238" y="210.1333" width="133.3334" height="69.6" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="916.1905" y="252.6666" text-anchor="middle" font-size="20.3557" fill="var(--info-accent)" font-family="Arial, sans-serif">Proxy</text>
  <line x1="982.857" y1="244.9333" x2="1020.9524" y2="244.9333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1020.9524" y="117.3334" width="133.3334" height="77.3334" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1087.6189" y="163.7333" text-anchor="middle" font-size="22.2063" fill="var(--text)" font-family="Arial, sans-serif">App C</text>
  <rect x="1020.9524" y="210.1333" width="133.3334" height="69.6" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1087.6189" y="252.6666" text-anchor="middle" font-size="20.3557" fill="var(--info-accent)" font-family="Arial, sans-serif">Proxy</text>
  <text x="944.7619" y="326.1333" text-anchor="middle" font-size="20.3557" fill="var(--text-muted)" font-family="Arial, sans-serif">Proxies handle all</text>
  <text x="944.7619" y="357.0666" text-anchor="middle" font-size="20.3557" fill="var(--text-muted)" font-family="Arial, sans-serif">cross-cutting concerns</text>
</svg>

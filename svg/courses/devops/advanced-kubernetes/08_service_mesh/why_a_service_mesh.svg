<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,21.1765 6.8923,0" fill="#555" />
    </marker>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,21.1765 6.8923,0" fill="#555" />
    </marker>
  </defs>
  <rect x="19.1982" y="20.6452" width="575.947" height="619.3548" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="307.1717" y="66.0645" text-anchor="middle" font-size="24.9577" fill="var(--warn-accent)" font-weight="bold">Without Service Mesh</text>
  <rect x="57.5947" y="103.2259" width="134.3877" height="103.2259" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="124.7885" y="165.1613" text-anchor="middle" font-size="23.0379" fill="var(--text)">App A</text>
  <line x1="191.9824" y1="154.8387" x2="220.7797" y2="154.8387" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="220.7797" y="103.2259" width="134.3877" height="103.2259" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="287.9735" y="165.1613" text-anchor="middle" font-size="23.0379" fill="var(--text)">App B</text>
  <line x1="355.1674" y1="154.8387" x2="383.9647" y2="154.8387" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="383.9647" y="103.2259" width="134.3877" height="103.2259" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="451.1585" y="165.1613" text-anchor="middle" font-size="23.0379" fill="var(--text)">App C</text>
  <text x="307.1717" y="258.0645" text-anchor="middle" font-size="21.118" fill="var(--text-muted)">Each app handles:</text>
  <text x="307.1717" y="293.1613" text-anchor="middle" font-size="21.118" fill="var(--text-muted)">retries, timeouts, auth,</text>
  <text x="307.1717" y="328.2581" text-anchor="middle" font-size="21.118" fill="var(--text-muted)">logging, tracing, TLS...</text>
  <rect x="633.5418" y="20.6452" width="595.1453" height="619.3548" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="931.1144" y="66.0645" text-anchor="middle" font-size="24.9577" fill="var(--ok-accent)" font-weight="bold">With Service Mesh</text>
  <rect x="662.3391" y="103.2259" width="134.3877" height="82.5807" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="729.5329" y="152.7742" text-anchor="middle" font-size="23.0379" fill="var(--text)">App A</text>
  <rect x="662.3391" y="202.3226" width="134.3877" height="74.3226" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="729.5329" y="247.7419" text-anchor="middle" font-size="21.118" fill="var(--info-accent)">Proxy</text>
  <line x1="796.7268" y1="239.4839" x2="835.1232" y2="239.4839" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="835.1232" y="103.2259" width="134.3877" height="82.5807" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="902.3171" y="152.7742" text-anchor="middle" font-size="23.0379" fill="var(--text)">App B</text>
  <rect x="835.1232" y="202.3226" width="134.3877" height="74.3226" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="902.3171" y="247.7419" text-anchor="middle" font-size="21.118" fill="var(--info-accent)">Proxy</text>
  <line x1="969.5108" y1="239.4839" x2="1007.9074" y2="239.4839" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="1007.9074" y="103.2259" width="134.3877" height="82.5807" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1075.1011" y="152.7742" text-anchor="middle" font-size="23.0379" fill="var(--text)">App C</text>
  <rect x="1007.9074" y="202.3226" width="134.3877" height="74.3226" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="1075.1011" y="247.7419" text-anchor="middle" font-size="21.118" fill="var(--info-accent)">Proxy</text>
  <text x="931.1144" y="326.1935" text-anchor="middle" font-size="21.118" fill="var(--text-muted)">Proxies handle all</text>
  <text x="931.1144" y="359.2258" text-anchor="middle" font-size="21.118" fill="var(--text-muted)">cross-cutting concerns</text>
</svg>
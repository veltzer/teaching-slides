<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Kubernetes wheel (heptagonal helm) -->
  <g transform="translate(400,185)">
    <circle cx="0" cy="0" r="90" fill="none" stroke="#326ce5" stroke-width="3" opacity="0.8"/>
    <circle cx="0" cy="0" r="25" fill="#326ce5" opacity="0.9"/>
    <circle cx="0" cy="0" r="15" fill="#fff" opacity="0.9"/>
    <!-- Spokes -->
    <line x1="0" y1="-25" x2="0" y2="-85" stroke="#326ce5" stroke-width="4" opacity="0.8"/>
    <line x1="22" y1="-11" x2="78" y2="-38" stroke="#326ce5" stroke-width="4" opacity="0.8"/>
    <line x1="22" y1="11" x2="78" y2="38" stroke="#326ce5" stroke-width="4" opacity="0.8"/>
    <line x1="0" y1="25" x2="0" y2="85" stroke="#326ce5" stroke-width="4" opacity="0.8"/>
    <line x1="-22" y1="11" x2="-78" y2="38" stroke="#326ce5" stroke-width="4" opacity="0.8"/>
    <line x1="-22" y1="-11" x2="-78" y2="-38" stroke="#326ce5" stroke-width="4" opacity="0.8"/>
    <!-- Outer pods -->
    <circle cx="0" cy="-90" r="12" fill="#326ce5" opacity="0.7"/>
    <circle cx="82" cy="-42" r="12" fill="#326ce5" opacity="0.7"/>
    <circle cx="82" cy="42" r="12" fill="#326ce5" opacity="0.7"/>
    <circle cx="0" cy="90" r="12" fill="#326ce5" opacity="0.7"/>
    <circle cx="-82" cy="42" r="12" fill="#326ce5" opacity="0.7"/>
    <circle cx="-82" cy="-42" r="12" fill="#326ce5" opacity="0.7"/>
  </g>
  <!-- Advanced overlay: mesh lines connecting pods -->
  <g opacity="0.25" stroke="#7b68ee" stroke-width="1">
    <line x1="400" y1="95" x2="482" y2="143"/>
    <line x1="482" y1="143" x2="482" y2="227"/>
    <line x1="482" y1="227" x2="400" y2="275"/>
    <line x1="400" y1="275" x2="318" y2="227"/>
    <line x1="318" y1="227" x2="318" y2="143"/>
    <line x1="318" y1="143" x2="400" y2="95"/>
    <!-- Cross mesh -->
    <line x1="400" y1="95" x2="400" y2="275"/>
    <line x1="318" y1="143" x2="482" y2="227"/>
    <line x1="482" y1="143" x2="318" y2="227"/>
  </g>
  <!-- Gear icons for "advanced" -->
  <g transform="translate(140,160)" fill="none" stroke="#7b68ee" stroke-width="2" opacity="0.5">
    <circle cx="0" cy="0" r="18"/>
    <circle cx="0" cy="0" r="8"/>
    <rect x="-3" y="-25" width="6" height="12" rx="2" fill="#7b68ee"/>
    <rect x="-3" y="13" width="6" height="12" rx="2" fill="#7b68ee"/>
    <rect x="-25" y="-3" width="12" height="6" rx="2" fill="#7b68ee"/>
    <rect x="13" y="-3" width="12" height="6" rx="2" fill="#7b68ee"/>
  </g>
  <g transform="translate(660,200)" fill="none" stroke="#7b68ee" stroke-width="2" opacity="0.5">
    <circle cx="0" cy="0" r="22"/>
    <circle cx="0" cy="0" r="10"/>
    <rect x="-3" y="-30" width="6" height="14" rx="2" fill="#7b68ee"/>
    <rect x="-3" y="16" width="6" height="14" rx="2" fill="#7b68ee"/>
    <rect x="-30" y="-3" width="14" height="6" rx="2" fill="#7b68ee"/>
    <rect x="16" y="-3" width="14" height="6" rx="2" fill="#7b68ee"/>
  </g>
  <!-- Decorative particles -->
  <circle cx="80" cy="60" r="2" fill="#326ce5" opacity="0.4"/>
  <circle cx="720" cy="80" r="3" fill="#7b68ee" opacity="0.3"/>
  <circle cx="100" cy="340" r="2" fill="#326ce5" opacity="0.3"/>
  <circle cx="700" cy="350" r="2" fill="#7b68ee" opacity="0.4"/>
  <!-- Bottom accent -->
  <rect x="300" y="370" width="200" height="3" rx="1.5" fill="#326ce5" opacity="0.5"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="url(#bg)" rx="6" x="40" y="40"/>
  <g transform="translate(400,185)">
    <circle cx="40" cy="40" r="125.14" fill="none" stroke="var(--primary-border)" stroke-width="4.2667" opacity="0.8"/>
    <circle cx="40" cy="40" r="34.7612" fill="var(--primary-fill)" opacity="0.9"/>
    <circle cx="40" cy="40" r="20.8566" fill="var(--bg)" opacity="0.9"/>
    <line x1="40" y1="3.75" x2="40" y2="-83.25" stroke="var(--primary-border)" stroke-width="2" opacity="0.8"/>
    <line x1="73" y1="24.05" x2="157" y2="-15.1" stroke="var(--primary-border)" stroke-width="2" opacity="0.8"/>
    <line x1="73" y1="55.95" x2="157" y2="95.1" stroke="var(--primary-border)" stroke-width="2" opacity="0.8"/>
    <line x1="40" y1="76.2499" x2="40" y2="163.25" stroke="var(--primary-border)" stroke-width="2" opacity="0.8"/>
    <line x1="7" y1="55.95" x2="-76.9999" y2="95.1" stroke="var(--primary-border)" stroke-width="2" opacity="0.8"/>
    <line x1="7" y1="24.05" x2="-76.9999" y2="-15.1" stroke="var(--primary-border)" stroke-width="2" opacity="0.8"/>
    <circle cx="40" cy="-90.5" r="16.6854" fill="var(--primary-fill)" opacity="0.7"/>
    <circle cx="163" cy="-20.9001" r="16.6854" fill="var(--primary-fill)" opacity="0.7"/>
    <circle cx="163" cy="100.9" r="16.6854" fill="var(--primary-fill)" opacity="0.7"/>
    <circle cx="40" cy="170.4999" r="16.6854" fill="var(--primary-fill)" opacity="0.7"/>
    <circle cx="-83" cy="100.9" r="16.6854" fill="var(--primary-fill)" opacity="0.7"/>
    <circle cx="-83" cy="-20.9001" r="16.6854" fill="var(--primary-fill)" opacity="0.7"/>
  </g>
  <g opacity="0.25" stroke="var(--primary-border)" stroke-width="1.4222">
    <line x1="640.0001" y1="177.7499" x2="762.9999" y2="247.35"/>
    <line x1="762.9999" y1="247.35" x2="762.9999" y2="369.1499"/>
    <line x1="762.9999" y1="369.1499" x2="640.0001" y2="438.75"/>
    <line x1="640.0001" y1="438.75" x2="517.0001" y2="369.1499"/>
    <line x1="517.0001" y1="369.1499" x2="517.0001" y2="247.35"/>
    <line x1="517.0001" y1="247.35" x2="640.0001" y2="177.7499"/>
    <line x1="640.0001" y1="177.7499" x2="640.0001" y2="438.75"/>
    <line x1="517.0001" y1="247.35" x2="762.9999" y2="369.1499"/>
    <line x1="762.9999" y1="247.35" x2="517.0001" y2="369.1499"/>
  </g>
  <g transform="translate(140,160)" fill="none" stroke="var(--primary-border)" stroke-width="2.8444" opacity="0.5">
    <circle cx="40" cy="40" r="25.028"/>
    <circle cx="40" cy="40" r="11.1236"/>
    <rect x="35.4999" y="3.75" width="9" height="17.4" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <rect x="35.4999" y="58.85" width="9" height="17.4" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <rect x="2.4999" y="35.65" width="18" height="8.7" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <rect x="59.5" y="35.65" width="18" height="8.7" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  </g>
  <g transform="translate(660,200)" fill="none" stroke="var(--primary-border)" stroke-width="2.8444" opacity="0.5">
    <circle cx="40" cy="40" r="30.5897"/>
    <circle cx="40" cy="40" r="13.9044"/>
    <rect x="35.4999" y="-3.5001" width="9" height="20.3" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <rect x="35.4999" y="63.1999" width="9" height="20.3" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <rect x="-5" y="35.65" width="20.9999" height="8.7" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <rect x="64.0001" y="35.65" width="20.9999" height="8.7" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  </g>
  <circle cx="160.0001" cy="127" r="2.7808" fill="var(--primary-fill)" opacity="0.4"/>
  <circle cx="1119.9999" cy="156" r="4.1713" fill="var(--primary-fill)" opacity="0.3"/>
  <circle cx="190" cy="533" r="2.7808" fill="var(--primary-fill)" opacity="0.3"/>
  <circle cx="1090" cy="547.5" r="2.7808" fill="var(--primary-fill)" opacity="0.4"/>
  <rect x="490" y="576.4999" width="299.9999" height="4.35" rx="6" fill="url(#grad-primary)" opacity="0.5" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
</svg>

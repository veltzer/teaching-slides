<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 18.7826 L 18.2857 9.3913 z" fill="#555" />
    </marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 18.2857 0 L 18.2857 18.7826 L 0 9.3913 z" fill="#555" />
    </marker>
  </defs>
  <rect x="20.9552" y="28.6995" width="481.9702" height="373.0941" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="261.9403" y="91.8385" font-family="sans-serif" font-size="25.1463" font-weight="bold" fill="var(--text-muted)" text-anchor="middle">Administrator</text>
  <text x="261.9403" y="149.2377" font-family="sans-serif" font-size="27.2418" font-weight="bold" fill="var(--text)" text-anchor="middle">PersistentVolume (PV)</text>
  <text x="41.9105" y="206.6368" font-family="monospace" font-size="23.0508" fill="var(--text)">capacity:    100Gi</text>
  <text x="41.9105" y="258.2959" font-family="monospace" font-size="23.0508" fill="var(--text)">accessMode:  RWO</text>
  <text x="41.9105" y="309.9552" font-family="monospace" font-size="23.0508" fill="var(--text)">storageClass: ssd</text>
  <rect x="649.612" y="28.6995" width="502.9254" height="373.0941" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="901.0747" y="91.8385" font-family="sans-serif" font-size="25.1463" font-weight="bold" fill="var(--text-muted)" text-anchor="middle">Developer</text>
  <text x="901.0747" y="149.2377" font-family="sans-serif" font-size="27.2418" font-weight="bold" fill="var(--text)" text-anchor="middle">PVC</text>
  <text x="670.5673" y="206.6368" font-family="monospace" font-size="23.0508" fill="var(--text)">request:      50Gi</text>
  <text x="670.5673" y="258.2959" font-family="monospace" font-size="23.0508" fill="var(--text)">accessMode:   RWO</text>
  <text x="670.5673" y="309.9552" font-family="monospace" font-size="23.0508" fill="var(--text)">storageClass:  ssd</text>
  <line x1="502.9254" y1="215.2466" x2="649.612" y2="215.2466" stroke="var(--text-muted)" stroke-width="2" marker-start="url(#arrb)" marker-end="url(#arr)" />
  <line x1="261.9403" y1="401.7937" x2="261.9403" y2="502.2421" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="62.8657" y="502.2421" width="398.1493" height="137.7579" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="261.9403" y="565.3812" font-family="sans-serif" font-size="27.2418" font-weight="bold" fill="var(--text)" text-anchor="middle">Actual Storage</text>
  <text x="261.9403" y="614.1703" font-family="sans-serif" font-size="23.0508" fill="var(--text-muted)" text-anchor="middle">(EBS, NFS, etc.)</text>
</svg>
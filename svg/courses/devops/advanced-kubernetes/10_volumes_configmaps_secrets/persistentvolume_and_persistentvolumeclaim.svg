<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 18.7826 L 18.2857 9.3913 z" fill="#555" />
    </marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 18.2857 0 L 18.2857 18.7826 L 0 9.3913 z" fill="#555" />
    </marker>
  </defs>
  <rect x="40" y="40" width="511.1111" height="353.9905" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="295.5556" y="99.9061" font-family="sans-serif" font-size="25.2237" font-weight="bold" fill="var(--text-muted)" text-anchor="middle">Administrator</text>
  <text x="295.5556" y="154.3663" font-family="sans-serif" font-size="27.3256" font-weight="bold" fill="var(--text)" text-anchor="middle">PersistentVolume (PV)</text>
  <text x="62.2223" y="208.8264" font-family="monospace" font-size="23.1217" fill="var(--text)">capacity:    100Gi</text>
  <text x="62.2223" y="257.8403" font-family="monospace" font-size="23.1217" fill="var(--text)">accessMode:  RWO</text>
  <text x="62.2223" y="306.8545" font-family="monospace" font-size="23.1217" fill="var(--text)">storageClass: ssd</text>
  <rect x="706.6667" y="40" width="533.3333" height="353.9905" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="973.3333" y="99.9061" font-family="sans-serif" font-size="25.2237" font-weight="bold" fill="var(--text-muted)" text-anchor="middle">Developer</text>
  <text x="973.3333" y="154.3663" font-family="sans-serif" font-size="27.3256" font-weight="bold" fill="var(--text)" text-anchor="middle">PVC</text>
  <text x="728.889" y="208.8264" font-family="monospace" font-size="23.1217" fill="var(--text)">request:      50Gi</text>
  <text x="728.889" y="257.8403" font-family="monospace" font-size="23.1217" fill="var(--text)">accessMode:   RWO</text>
  <text x="728.889" y="306.8545" font-family="monospace" font-size="23.1217" fill="var(--text)">storageClass:  ssd</text>
  <line x1="551.1111" y1="216.9953" x2="706.6667" y2="216.9953" stroke="var(--text-muted)" stroke-width="2" marker-start="url(#arrb)" marker-end="url(#arr)" />
  <line x1="295.5556" y1="393.9906" x2="295.5556" y2="489.2957" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="84.4445" y="489.2957" width="422.2222" height="130.7043" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="295.5556" y="549.2019" font-family="sans-serif" font-size="27.3256" font-weight="bold" fill="var(--text)" text-anchor="middle">Actual Storage</text>
  <text x="295.5556" y="595.4929" font-family="sans-serif" font-size="23.1217" fill="var(--text-muted)" text-anchor="middle">(EBS, NFS, etc.)</text>
</svg>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <ns0:marker id="arr" markerWidth="18.2857" markerHeight="18.7826" refX="16" refY="9.3913" orient="auto">
      <ns0:path d="M 0 0 L 0 18.7826 L 18.2857 9.3913 z" fill="#555" />
    </ns0:marker>
    <ns0:marker id="arrb" markerWidth="18.2857" markerHeight="18.7826" refX="2.2857" refY="9.3913" orient="auto">
      <ns0:path d="M 18.2857 0 L 18.2857 18.7826 L 0 9.3913 z" fill="#555" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect x="20.9552" y="28.6995" width="481.9702" height="373.0941" rx="8.3821" fill="var(--surface)" stroke="var(--text-dark)" stroke-width="3.1433" />
  <ns0:text x="261.9403" y="91.8385" font-family="sans-serif" font-size="25.1463" font-weight="bold" fill="var(--text-muted)" text-anchor="middle">Administrator</ns0:text>
  <ns0:text x="261.9403" y="149.2377" font-family="sans-serif" font-size="27.2418" font-weight="bold" fill="var(--text-darker)" text-anchor="middle">PersistentVolume (PV)</ns0:text>
  <ns0:text x="41.9105" y="206.6368" font-family="monospace" font-size="23.0508" fill="var(--text-dark)">capacity:    100Gi</ns0:text>
  <ns0:text x="41.9105" y="258.2959" font-family="monospace" font-size="23.0508" fill="var(--text-dark)">accessMode:  RWO</ns0:text>
  <ns0:text x="41.9105" y="309.9552" font-family="monospace" font-size="23.0508" fill="var(--text-dark)">storageClass: ssd</ns0:text>
  <ns0:rect x="649.612" y="28.6995" width="502.9254" height="373.0941" rx="8.3821" fill="var(--primary-pale)" stroke="var(--text-dark)" stroke-width="3.1433" />
  <ns0:text x="901.0747" y="91.8385" font-family="sans-serif" font-size="25.1463" font-weight="bold" fill="var(--text-muted)" text-anchor="middle">Developer</ns0:text>
  <ns0:text x="901.0747" y="149.2377" font-family="sans-serif" font-size="27.2418" font-weight="bold" fill="var(--text-darker)" text-anchor="middle">PVC</ns0:text>
  <ns0:text x="670.5673" y="206.6368" font-family="monospace" font-size="23.0508" fill="var(--text-dark)">request:      50Gi</ns0:text>
  <ns0:text x="670.5673" y="258.2959" font-family="monospace" font-size="23.0508" fill="var(--text-dark)">accessMode:   RWO</ns0:text>
  <ns0:text x="670.5673" y="309.9552" font-family="monospace" font-size="23.0508" fill="var(--text-dark)">storageClass:  ssd</ns0:text>
  <ns0:line x1="502.9254" y1="215.2466" x2="649.612" y2="215.2466" stroke="var(--text-muted)" stroke-width="3.1433" marker-start="url(#arrb)" marker-end="url(#arr)" />
  <ns0:line x1="261.9403" y1="401.7937" x2="261.9403" y2="502.2421" stroke="var(--text-muted)" stroke-width="3.1433" marker-end="url(#arr)" />
  <ns0:rect x="62.8657" y="502.2421" width="398.1493" height="137.7579" rx="8.3821" fill="var(--warn-pale)" stroke="var(--text-dark)" stroke-width="3.1433" />
  <ns0:text x="261.9403" y="565.3812" font-family="sans-serif" font-size="27.2418" font-weight="bold" fill="var(--text-darker)" text-anchor="middle">Actual Storage</ns0:text>
  <ns0:text x="261.9403" y="614.1703" font-family="sans-serif" font-size="23.0508" fill="var(--text-muted)" text-anchor="middle">(EBS, NFS, etc.)</ns0:text>
</ns0:svg>
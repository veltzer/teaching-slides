<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="511.1111" height="353.9905" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="295.5556" y="99.9061" font-size="25.2237" font-weight="bold" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Administrator</text>
  <text x="295.5556" y="154.3663" font-size="27.3256" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">PersistentVolume (PV)</text>
  <text x="62.2223" y="208.8264" font-size="23.1217" fill="var(--text)" font-family="Courier New, monospace">capacity:    100Gi</text>
  <text x="62.2223" y="257.8403" font-size="23.1217" fill="var(--text)" font-family="Courier New, monospace">accessMode:  RWO</text>
  <text x="62.2223" y="306.8545" font-size="23.1217" fill="var(--text)" font-family="Courier New, monospace">storageClass: ssd</text>
  <rect x="706.6667" y="40" width="533.3333" height="353.9905" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="973.3333" y="99.9061" font-size="25.2237" font-weight="bold" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Developer</text>
  <text x="973.3333" y="154.3663" font-size="27.3256" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">PVC</text>
  <text x="728.889" y="208.8264" font-size="23.1217" fill="var(--text)" font-family="Courier New, monospace">request:      50Gi</text>
  <text x="728.889" y="257.8403" font-size="23.1217" fill="var(--text)" font-family="Courier New, monospace">accessMode:   RWO</text>
  <text x="728.889" y="306.8545" font-size="23.1217" fill="var(--text)" font-family="Courier New, monospace">storageClass:  ssd</text>
  <line x1="551.1111" y1="216.9953" x2="706.6667" y2="216.9953" stroke="var(--text-muted)" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="295.5556" y1="393.9906" x2="295.5556" y2="489.2957" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="84.4445" y="489.2957" width="422.2222" height="130.7043" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="295.5556" y="549.2019" font-size="27.3256" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Actual Storage</text>
  <text x="295.5556" y="595.4929" font-size="23.1217" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">(EBS, NFS, etc.)</text>
</svg>

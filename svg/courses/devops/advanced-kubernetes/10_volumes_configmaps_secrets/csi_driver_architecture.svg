<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="639.999892857143" y="40" font-size="29.36566499982" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Kubernetes</text>
  <rect x="40" y="78.189230232527" width="278.571428571429" height="119.341517316133" rx="6.666666288255" fill="var(--bg)" stroke="var(--text-muted)" stroke-width="2.8476"/>
  <text x="179.285607142857" y="149.794209758001" font-size="27.268109563326" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">kubelet</text>
  <line x1="318.571321428571" y1="137.859988890593" x2="425.714285714286" y2="137.859988890593" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="425.714285714286" y="78.189230232527" width="450" height="262.551361140757" rx="6.666666288255" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="650.714285714286" y="130.699594641738" font-size="25.170554126831" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">CSI Node Plugin</text>
  <text x="650.714285714286" y="173.662536266492" font-size="23.072998690336" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">(DaemonSet)</text>
  <text x="447.14275" y="230.946496841607" font-size="23.072998690336" fill="var(--text)" font-family="Courier New, monospace">NodeStageVolume()</text>
  <text x="447.14275" y="273.909553692686" font-size="23.072998690336" fill="var(--text)" font-family="Courier New, monospace">NodePublishVolume()</text>
  <rect x="40" y="405.185176649902" width="514.285714285714" height="214.814823350098" rx="6.666666288255" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="297.14275" y="457.695425832788" font-size="25.170554126831" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">CSI Controller Plugin</text>
  <text x="297.14275" y="495.884656065315" font-size="23.072998690336" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">(Deployment)</text>
  <text x="61.428464285714" y="543.621424308622" font-size="23.072998690336" fill="var(--text)" font-family="Courier New, monospace">CreateVolume()</text>
  <text x="61.428464285714" y="584.197452624101" font-size="23.072998690336" fill="var(--text)" font-family="Courier New, monospace">DeleteVolume()  ControllerPublish()</text>
  <rect x="597.142857142857" y="405.185176649902" width="642.857142857143" height="214.814823350098" rx="6.666666288255" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="918.571428571429" y="457.695425832788" font-size="25.170554126831" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">External Sidecars</text>
  <text x="618.571428571429" y="505.432078849771" font-size="23.072998690336" fill="var(--text)" font-family="Courier New, monospace">Provisioner   Attacher</text>
  <text x="618.571428571429" y="553.168616640429" font-size="23.072998690336" fill="var(--text)" font-family="Courier New, monospace">Resizer       Snapshotter</text>
</svg>

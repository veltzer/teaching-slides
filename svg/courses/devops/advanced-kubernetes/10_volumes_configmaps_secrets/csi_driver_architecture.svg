<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 14.4 L 16.5161 7.2 z" fill="#555" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="639.9999" y="85.5714" font-family="sans-serif" font-size="26.4291" font-weight="bold" fill="var(--text)" text-anchor="middle">Kubernetes</text>
  <rect x="80" y="118.7142" width="260" height="103.5714" rx="6" fill="var(--bg)" stroke="var(--text-muted)" stroke-width="2.8476" />
  <text x="209.9999" y="180.8571" font-family="sans-serif" font-size="24.5413" font-weight="bold" fill="var(--text)" text-anchor="middle">kubelet</text>
  <line x1="339.9999" y1="170.4999" x2="440" y2="170.4999" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="440" y="118.7142" width="420" height="227.8571" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="650" y="164.2857" font-family="sans-serif" font-size="22.6535" font-weight="bold" fill="var(--text)" text-anchor="middle">CSI Node Plugin</text>
  <text x="650" y="201.5714" font-family="sans-serif" font-size="20.7657" fill="var(--text-muted)" text-anchor="middle">(DaemonSet)</text>
  <text x="459.9999" y="251.2857" font-family="monospace" font-size="20.7657" fill="var(--text)">NodeStageVolume()</text>
  <text x="459.9999" y="288.5715" font-family="monospace" font-size="20.7657" fill="var(--text)">NodePublishVolume()</text>
  <rect x="80" y="402.5" width="480" height="186.4286" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="319.9999" y="448.0714" font-family="sans-serif" font-size="22.6535" font-weight="bold" fill="var(--text)" text-anchor="middle">CSI Controller Plugin</text>
  <text x="319.9999" y="481.2142" font-family="sans-serif" font-size="20.7657" fill="var(--text-muted)" text-anchor="middle">(Deployment)</text>
  <text x="99.9999" y="522.6429" font-family="monospace" font-size="20.7657" fill="var(--text)">CreateVolume()</text>
  <text x="99.9999" y="557.8571" font-family="monospace" font-size="20.7657" fill="var(--text)">DeleteVolume()  ControllerPublish()</text>
  <rect x="600" y="402.5" width="600" height="186.4286" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="900" y="448.0714" font-family="sans-serif" font-size="22.6535" font-weight="bold" fill="var(--text)" text-anchor="middle">External Sidecars</text>
  <text x="620" y="489.5" font-family="monospace" font-size="20.7657" fill="var(--text)">Provisioner   Attacher</text>
  <text x="620" y="530.9285" font-family="monospace" font-size="20.7657" fill="var(--text)">Resizer       Snapshotter</text>
</svg>
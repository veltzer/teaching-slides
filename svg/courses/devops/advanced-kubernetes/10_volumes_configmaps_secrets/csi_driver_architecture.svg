<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 14.4 L 16.5161 7.2 z" fill="#555" />
    </marker>
  </defs>
  <rect x="18.9841" y="22.069" width="1139.0434" height="617.931" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="588.5057" y="70.6207" font-family="sans-serif" font-size="26.5777" font-weight="bold" fill="var(--text)" text-anchor="middle">Kubernetes</text>
  <rect x="56.9522" y="105.931" width="246.7927" height="110.3448" rx="6" fill="var(--bg)" stroke="var(--text-muted)" stroke-width="2.8476" />
  <text x="180.3485" y="172.1379" font-family="sans-serif" font-size="24.6793" font-weight="bold" fill="var(--text)" text-anchor="middle">kubelet</text>
  <line x1="303.7449" y1="161.1034" x2="398.6652" y2="161.1034" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="398.6652" y="105.931" width="398.6652" height="242.7586" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="597.9978" y="154.4828" font-family="sans-serif" font-size="22.7809" font-weight="bold" fill="var(--text)" text-anchor="middle">CSI Node Plugin</text>
  <text x="597.9978" y="194.2069" font-family="sans-serif" font-size="20.8825" fill="var(--text-muted)" text-anchor="middle">(DaemonSet)</text>
  <text x="417.6492" y="247.1724" font-family="monospace" font-size="20.8825" fill="var(--text)">NodeStageVolume()</text>
  <text x="417.6492" y="286.8966" font-family="monospace" font-size="20.8825" fill="var(--text)">NodePublishVolume()</text>
  <rect x="56.9522" y="408.2759" width="455.6174" height="198.6207" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="284.7608" y="456.8276" font-family="sans-serif" font-size="22.7809" font-weight="bold" fill="var(--text)" text-anchor="middle">CSI Controller Plugin</text>
  <text x="284.7608" y="492.1379" font-family="sans-serif" font-size="20.8825" fill="var(--text-muted)" text-anchor="middle">(Deployment)</text>
  <text x="75.9362" y="536.2759" font-family="monospace" font-size="20.8825" fill="var(--text)">CreateVolume()</text>
  <text x="75.9362" y="573.7931" font-family="monospace" font-size="20.8825" fill="var(--text)">DeleteVolume()  ControllerPublish()</text>
  <rect x="550.5377" y="408.2759" width="569.5217" height="198.6207" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="835.2985" y="456.8276" font-family="sans-serif" font-size="22.7809" font-weight="bold" fill="var(--text)" text-anchor="middle">External Sidecars</text>
  <text x="569.5217" y="500.9655" font-family="monospace" font-size="20.8825" fill="var(--text)">Provisioner   Attacher</text>
  <text x="569.5217" y="545.1034" font-family="monospace" font-size="20.8825" fill="var(--text)">Resizer       Snapshotter</text>
</svg>
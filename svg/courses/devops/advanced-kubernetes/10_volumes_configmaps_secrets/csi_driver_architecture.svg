    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="16.5161" markerHeight="14.4" refX="14.4516" refY="7.2" orient="auto">
      <path d="M 0 0 L 0 14.4 L 16.5161 7.2 z" fill="#555" />
    </marker>
  </defs>
  <rect x="18.9841" y="22.069" width="1139.0434" height="617.931" rx="7.5937" fill="var(--primary-pale)" stroke="var(--text-dark)" stroke-width="2.8476" />
  <text x="588.5057" y="70.6207" font-family="sans-serif" font-size="26.5777" font-weight="bold" fill="var(--text-darker)" text-anchor="middle">Kubernetes</text>
  <rect x="56.9522" y="105.931" width="246.7927" height="110.3448" rx="7.5937" fill="var(--bg)" stroke="var(--text-muted)" stroke-width="2.8476" />
  <text x="180.3485" y="172.1379" font-family="sans-serif" font-size="24.6793" font-weight="bold" fill="var(--text-darker)" text-anchor="middle">kubelet</text>
  <line x1="303.7449" y1="161.1034" x2="398.6652" y2="161.1034" stroke="var(--text-muted)" stroke-width="2.8476" marker-end="url(#arr)" />
  <rect x="398.6652" y="105.931" width="398.6652" height="242.7586" rx="7.5937" fill="var(--warn-pale)" stroke="var(--text-muted)" stroke-width="2.8476" />
  <text x="597.9978" y="154.4828" font-family="sans-serif" font-size="22.7809" font-weight="bold" fill="var(--text-darker)" text-anchor="middle">CSI Node Plugin</text>
  <text x="597.9978" y="194.2069" font-family="sans-serif" font-size="20.8825" fill="var(--text-muted)" text-anchor="middle">(DaemonSet)</text>
  <text x="417.6492" y="247.1724" font-family="monospace" font-size="20.8825" fill="var(--text-dark)">NodeStageVolume()</text>
  <text x="417.6492" y="286.8966" font-family="monospace" font-size="20.8825" fill="var(--text-dark)">NodePublishVolume()</text>
  <rect x="56.9522" y="408.2759" width="455.6174" height="198.6207" rx="7.5937" fill="var(--ok-pale)" stroke="var(--text-muted)" stroke-width="2.8476" />
  <text x="284.7608" y="456.8276" font-family="sans-serif" font-size="22.7809" font-weight="bold" fill="var(--text-darker)" text-anchor="middle">CSI Controller Plugin</text>
  <text x="284.7608" y="492.1379" font-family="sans-serif" font-size="20.8825" fill="var(--text-muted)" text-anchor="middle">(Deployment)</text>
  <text x="75.9362" y="536.2759" font-family="monospace" font-size="20.8825" fill="var(--text-dark)">CreateVolume()</text>
  <text x="75.9362" y="573.7931" font-family="monospace" font-size="20.8825" fill="var(--text-dark)">DeleteVolume()  ControllerPublish()</text>
  <rect x="550.5377" y="408.2759" width="569.5217" height="198.6207" rx="7.5937" fill="var(--ok-pale)" stroke="var(--text-muted)" stroke-width="2.8476" />
  <text x="835.2985" y="456.8276" font-family="sans-serif" font-size="22.7809" font-weight="bold" fill="var(--text-darker)" text-anchor="middle">External Sidecars</text>
  <text x="569.5217" y="500.9655" font-family="monospace" font-size="20.8825" fill="var(--text-dark)">Provisioner   Attacher</text>
  <text x="569.5217" y="545.1034" font-family="monospace" font-size="20.8825" fill="var(--text-dark)">Resizer       Snapshotter</text>

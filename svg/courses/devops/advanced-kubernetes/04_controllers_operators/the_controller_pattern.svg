<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="80" y="117.8295" width="390.6977" height="124.8061" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6.1047" />
  <text x="275.3488" y="167.7521" font-size="32.4497" font-weight="bold" fill="var(--text)" text-anchor="middle">Observe</text>
  <text x="275.3488" y="212.6823" font-size="29.9535" font-weight="normal" fill="var(--text)" text-anchor="middle">Current State</text>
  <rect x="653.0233" y="117.8295" width="390.6977" height="149.7674" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6.1047" />
  <text x="848.372" y="167.7521" font-size="32.4497" font-weight="bold" fill="var(--text)" text-anchor="middle">Compare</text>
  <text x="848.372" y="207.69" font-size="29.9535" font-weight="normal" fill="var(--text)" text-anchor="middle">Desired vs</text>
  <text x="848.372" y="245.1318" font-size="29.9535" font-weight="normal" fill="var(--text)" text-anchor="middle">Actual</text>
  <rect x="653.0233" y="417.3644" width="390.6977" height="124.8061" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6.1047" />
  <text x="848.372" y="467.2869" font-size="32.4497" font-weight="bold" fill="var(--text)" text-anchor="middle">Act</text>
  <text x="848.372" y="507.2248" font-size="29.9535" font-weight="normal" fill="var(--text)" text-anchor="middle">(Reconcile)</text>
  <line x1="470.6977" y1="180.2327" x2="647.814" y2="180.2327" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="848.372" y1="267.5969" x2="848.372" y2="412.3722" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 653.0233 479.7675 Q 340.4651 479.7675 340.4651 317.5194 Q 340.4651 117.8295 80 180.2327" stroke="var(--text-muted)" stroke-width="3.68" fill="none" marker-end="url(#arrow)" />
  <text x="1200" y="180.2327" font-size="27.4573" fill="var(--text-muted)" />
</svg>
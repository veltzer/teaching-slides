<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="418.6047" height="170.5881" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="249.3022" y="108.2355" font-size="39.269" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Observe</text>
  <text x="249.3022" y="169.6473" font-size="36.2481" font-weight="normal" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Current State</text>
  <rect x="653.9535" y="40" width="418.6047" height="204.7059" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="863.2555" y="108.2355" font-size="39.269" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Compare</text>
  <text x="863.2555" y="162.8236" font-size="36.2481" font-weight="normal" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Desired vs</text>
  <text x="863.2555" y="214" font-size="36.2481" font-weight="normal" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Actual</text>
  <rect x="653.9535" y="449.4119" width="418.6047" height="170.5881" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="863.2555" y="517.6472" font-size="39.269" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Act</text>
  <text x="863.2555" y="572.2353" font-size="36.2481" font-weight="normal" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">(Reconcile)</text>
  <line x1="458.6045" y1="125.2943" x2="648.3721" y2="125.2943" stroke="var(--text-muted)" stroke-width="1.921" marker-end="url(#arrow)" />
  <line x1="863.2555" y1="244.7059" x2="863.2555" y2="442.5883" stroke="var(--text-muted)" stroke-width="1.921" marker-end="url(#arrow)" />
  <path d="M 653.9535 534.706 Q 319.0697 534.706 319.0697 312.9412 Q 319.0697 40 40 125.2943" stroke="var(--text-muted)" stroke-width="3.5347" fill="none" marker-end="url(#arrow)" />
  <text x="1240" y="125.2943" font-size="33.2273" fill="var(--text-muted)" font-family="Arial, sans-serif"/>
</svg>
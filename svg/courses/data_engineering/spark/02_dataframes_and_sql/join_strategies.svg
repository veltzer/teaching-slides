<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.982753492379" font-weight="bold" fill="var(--text)">Spark Join Strategies</text>

  <rect x="40" y="102.142857142857" width="393.103448275862" height="227.857142857143" rx="10.350983390135" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="236.551724137931" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.631770102244" font-weight="bold" fill="var(--info-text)">Broadcast hash join</text>
  <text x="236.551724137931" y="169.464285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--info-text)">small table → all executors</text>
  <text x="236.551724137931" y="193.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--info-text)">no shuffle, hash lookup</text>
  <text x="236.551724137931" y="231.607142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" font-weight="bold" fill="var(--info-text)">when small &lt; ~10 MB</text>
  <text x="236.551724137931" y="262.678571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--ok-accent)">+ fastest by far</text>
  <text x="236.551724137931" y="288.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--danger-accent)">- driver memory limit</text>

  <rect x="443.448275862069" y="102.142857142857" width="393.103448275862" height="227.857142857143" rx="10.350983390135" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.631770102244" font-weight="bold" fill="var(--warn-text)">Sort-merge join</text>
  <text x="640" y="169.464285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--warn-text)">shuffle both sides</text>
  <text x="640" y="193.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--warn-text)">sort, merge by key</text>
  <text x="640" y="231.607142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" font-weight="bold" fill="var(--warn-text)">default for big-vs-big</text>
  <text x="640" y="262.678571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--ok-accent)">+ scales linearly</text>
  <text x="640" y="288.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--danger-accent)">- shuffle is expensive</text>

  <rect x="846.896551724138" y="102.142857142857" width="393.103448275862" height="227.857142857143" rx="10.350983390135" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1043.448275862069" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.631770102244" font-weight="bold" fill="var(--primary-text)">Shuffle hash join</text>
  <text x="1043.448275862069" y="169.464285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--primary-text)">shuffle both</text>
  <text x="1043.448275862069" y="193.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--primary-text)">build hash on smaller side</text>
  <text x="1043.448275862069" y="231.607142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" font-weight="bold" fill="var(--primary-text)">smaller side fits memory</text>
  <text x="1043.448275862069" y="262.678571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--ok-accent)">+ no sort cost</text>
  <text x="1043.448275862069" y="288.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--danger-accent)">- memory hungry</text>

  <rect x="60.689655172414" y="371.428571428571" width="1158.620689655173" height="248.571428571429" rx="10.350983390135" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="402.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.561573424217" font-weight="bold" fill="var(--text)">Skew defense</text>
  <text x="81.379310344828" y="445" font-family="Arial, sans-serif" font-size="14.491376746189" fill="var(--text)">Hot key fills one partition</text>
  <text x="81.379310344828" y="478" font-family="Arial, sans-serif" font-size="14.491376746189" fill="var(--text)">One task drags the stage</text>
  <text x="81.379310344828" y="515" font-family="Arial, sans-serif" font-size="14.491376746189" font-weight="bold" fill="var(--ok-accent)">Fixes:</text>
  <text x="81.379310344828" y="545" font-family="Arial, sans-serif" font-size="14.491376746189" fill="var(--text-muted)">Salt the key</text>
  <text x="81.379310344828" y="575" font-family="Arial, sans-serif" font-size="14.491376746189" fill="var(--text-muted)">Adaptive query execution helps</text>
</svg>

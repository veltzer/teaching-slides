<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="629.473684210526" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.77236574717" font-weight="bold" fill="var(--text)">Modeling Approaches</text>

  <text x="292.631578947368" y="99.074074074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.265975533693" font-weight="bold" fill="var(--text-muted)">Star Schema</text>
  <text x="966.315789473684" y="99.074074074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.265975533693" font-weight="bold" fill="var(--text-muted)">Wide Tables</text>
  <line x1="629.473684210526" y1="82.962962962963" x2="629.473684210526" y2="620" stroke="var(--border)" stroke-width="2" stroke-dasharray="6 6"/>

  <rect x="208.421052631579" y="233.333333333333" width="168.421052631579" height="85.925925925926" rx="8.506390213477" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="292.631578947368" y="270.925925925926" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.949481650269" font-weight="bold" fill="var(--primary-text)">fact_orders</text>
  <text x="292.631578947368" y="295.62962962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.696286543531" fill="var(--primary-text)">order_id, fk's, amt</text>

  <rect x="40" y="147.407407407407" width="147.368421052632" height="64.444444444444" rx="6.379792660108" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="113.684210526316" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8228840969" font-weight="bold" fill="var(--info-text)">dim_user</text>

  <rect x="408.421052631579" y="147.407407407407" width="147.368421052632" height="64.444444444444" rx="6.379792660108" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="482.105263157895" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8228840969" font-weight="bold" fill="var(--info-text)">dim_product</text>

  <rect x="40" y="340.740740740741" width="147.368421052632" height="64.444444444444" rx="6.379792660108" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="113.684210526316" y="378.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8228840969" font-weight="bold" fill="var(--info-text)">dim_time</text>

  <rect x="408.421052631579" y="340.740740740741" width="147.368421052632" height="64.444444444444" rx="6.379792660108" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="482.105263157895" y="378.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8228840969" font-weight="bold" fill="var(--info-text)">dim_store</text>

  <line x1="187.368421052632" y1="179.62962962963" x2="208.421052631579" y2="265.555555555556" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="408.421052631579" y1="179.62962962963" x2="376.842105263158" y2="265.555555555556" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="187.368421052632" y1="372.962962962963" x2="208.421052631579" y2="287.037037037037" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="408.421052631579" y1="372.962962962963" x2="376.842105263158" y2="287.037037037037" stroke="var(--text-muted)" stroke-width="2"/>

  <text x="292.631578947368" y="453.518518518519" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.886182873585" font-weight="bold" fill="var(--text)">Properties</text>
  <text x="40" y="485.740740740741" font-family="Arial, sans-serif" font-size="13.8228840969" fill="var(--ok-accent)">+ classic, well-understood</text>
  <text x="40" y="510.444444444444" font-family="Arial, sans-serif" font-size="13.8228840969" fill="var(--ok-accent)">+ small storage</text>
  <text x="40" y="539.444444444444" font-family="Arial, sans-serif" font-size="13.8228840969" fill="var(--danger-accent)">- joins required for analytics</text>
  <text x="40" y="564.148148148148" font-family="Arial, sans-serif" font-size="13.8228840969" font-weight="bold" fill="var(--text)">Use: classical DW</text>

  <rect x="692.631578947368" y="190.37037037037" width="547.368421052632" height="214.814814814815" rx="10.632987766846" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="966.315789473684" y="227.962962962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.012780426954" font-weight="bold" fill="var(--primary-text)">orders_enriched</text>
  <text x="713.684210526316" y="260.185185185185" font-family="Arial, sans-serif" font-size="12.759585320216" fill="var(--primary-text)">order_id, user_id, user_name, user_email,</text>
  <text x="713.684210526316" y="287.037037037037" font-family="Arial, sans-serif" font-size="12.759585320216" fill="var(--primary-text)">user_segment, product_id, product_name,</text>
  <text x="713.684210526316" y="313.888888888889" font-family="Arial, sans-serif" font-size="12.759585320216" fill="var(--primary-text)">product_category, store_region, order_date,</text>
  <text x="713.684210526316" y="340.740740740741" font-family="Arial, sans-serif" font-size="12.759585320216" fill="var(--primary-text)">order_year, order_month, amount, ...</text>
  <text x="713.684210526316" y="372.962962962963" font-family="Arial, sans-serif" font-size="12.759585320216" fill="var(--primary-text)">(50+ pre-joined columns)</text>

  <text x="966.315789473684" y="453.518518518519" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.886182873585" font-weight="bold" fill="var(--text)">Properties</text>
  <text x="692.631578947368" y="485.740740740741" font-family="Arial, sans-serif" font-size="13.8228840969" fill="var(--ok-accent)">+ no joins, fast scans</text>
  <text x="692.631578947368" y="510.444444444444" font-family="Arial, sans-serif" font-size="13.8228840969" fill="var(--ok-accent)">+ analyst-friendly</text>
  <text x="692.631578947368" y="539.444444444444" font-family="Arial, sans-serif" font-size="13.8228840969" fill="var(--danger-accent)">- big storage</text>
  <text x="692.631578947368" y="564.148148148148" font-family="Arial, sans-serif" font-size="13.8228840969" font-weight="bold" fill="var(--text)">Use: lakehouse</text>
</svg>

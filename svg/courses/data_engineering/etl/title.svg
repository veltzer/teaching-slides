<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="intro">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
<rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
<text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">ETL</text>
<text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Mark Veltzer</text>
<g font-family="Arial, sans-serif" text-anchor="middle">
  <line x1="275" y1="252" x2="360" y2="312" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="275" y1="312" x2="360" y2="312" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="275" y1="372" x2="360" y2="312" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="435" y1="348" x2="435" y2="420" stroke="var(--info-fill)" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="625" y1="348" x2="625" y2="420" stroke="var(--info-fill)" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="815" y1="348" x2="815" y2="420" stroke="var(--info-fill)" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="1045" y1="364" x2="1045" y2="420" stroke="var(--info-fill)" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="895" y1="312" x2="951" y2="312" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="963,312 951,306 951,318" fill="var(--text-muted)"/>
  <rect x="135" y="230" width="140" height="44" rx="22" fill="var(--primary-fill)"/>
  <text x="205" y="258" font-size="17" fill="var(--primary-text)">Database</text>
  <rect x="135" y="290" width="140" height="44" rx="22" fill="var(--primary-fill)"/>
  <text x="205" y="318" font-size="17" fill="var(--primary-text)">API</text>
  <rect x="135" y="350" width="140" height="44" rx="22" fill="var(--primary-fill)"/>
  <text x="205" y="378" font-size="17" fill="var(--primary-text)">Files</text>
  <polygon points="345,276 495,276 515,312 495,348 345,348 365,312" fill="var(--warn-fill)"/>
  <text x="435" y="318" font-size="19" font-weight="bold" fill="var(--warn-text)">Extract</text>
  <polygon points="535,276 685,276 705,312 685,348 535,348 555,312" fill="var(--danger-fill)"/>
  <text x="625" y="318" font-size="19" font-weight="bold" fill="var(--danger-text)">Transform</text>
  <polygon points="725,276 875,276 895,312 875,348 725,348 745,312" fill="var(--ok-fill)"/>
  <text x="815" y="318" font-size="19" font-weight="bold" fill="var(--ok-text)">Load</text>
  <ellipse cx="1045" cy="350" rx="80" ry="14" fill="var(--info-fill)"/>
  <rect x="965" y="274" width="160" height="76" fill="var(--info-fill)"/>
  <ellipse cx="1045" cy="274" rx="80" ry="14" fill="var(--info-accent)"/>
  <text x="1045" y="324" font-size="18" font-weight="bold" fill="var(--info-text)">Warehouse</text>
  <rect x="345" y="420" width="780" height="44" rx="22" fill="none" stroke="var(--info-fill)" stroke-width="2"/>
  <text x="735" y="448" font-size="17" fill="var(--surface)">Orchestrator: schedule • retry • backfill • monitor</text>
  <text x="640" y="505" font-size="16" fill="var(--text-faint)">extraction • transformation • loading • orchestration • data quality</text>
</g>
<text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">mark.veltzer@gmail.com</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="629.830508474576" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.736087274791" font-weight="bold" fill="var(--text)">Data Pipeline Steps</text>
  <rect x="40" y="102.142857142857" width="284.745762711864" height="517.857142857143" rx="10.262888312425" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="182.372881355932" y="143.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.473198962366" font-weight="bold" fill="var(--info-text)">Source</text>
  <text x="60.338983050847" y="185" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--info-text)">Apps, DBs, files</text>
  <text x="60.338983050847" y="216.071428571429" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--info-text)">SaaS APIs</text>
  <text x="60.338983050847" y="247.142857142857" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--info-text)">Event streams</text>
  <path d="M 329.830508474576 361.071428571429 L 380.677966101695 361.071428571429" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="385.762711864407" y="102.142857142857" width="284.745762711864" height="517.857142857143" rx="10.262888312425" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="528.135593220339" y="143.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.473198962366" font-weight="bold" fill="var(--primary-text)">Land</text>
  <text x="406.101694915254" y="185" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--primary-text)">Raw zone</text>
  <text x="406.101694915254" y="216.071428571429" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--primary-text)">Immutable copy</text>
  <text x="406.101694915254" y="247.142857142857" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--primary-text)">Source-of-truth</text>
  <path d="M 675.593220338983 361.071428571429 L 726.440677966102 361.071428571429" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="731.525423728814" y="102.142857142857" width="284.745762711864" height="517.857142857143" rx="10.262888312425" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="873.898305084746" y="143.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.473198962366" font-weight="bold" fill="var(--warn-text)">Transform</text>
  <text x="751.864406779661" y="185" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--warn-text)">Clean and join</text>
  <text x="751.864406779661" y="216.071428571429" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--warn-text)">Conform models</text>
  <text x="751.864406779661" y="247.142857142857" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--warn-text)">Add metrics</text>
  <path d="M 1021.35593220339 361.071428571429 L 1072.203389830509 361.071428571429" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1077.28813559322" y="102.142857142857" width="162.71186440678" height="517.857142857143" rx="10.262888312425" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1158.64406779661" y="143.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.473198962366" font-weight="bold" fill="var(--ok-text)">Serve</text>
  <text x="1092.542372881356" y="185" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--ok-text)">BI tools</text>
  <text x="1092.542372881356" y="216.071428571429" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--ok-text)">Dashboards</text>
  <text x="1092.542372881356" y="247.142857142857" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--ok-text)">Apps and ML</text>
</svg>

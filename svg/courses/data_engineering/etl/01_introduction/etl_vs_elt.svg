<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="629.473684210526" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.235882783068" font-weight="bold" fill="var(--text)">ETL vs ELT</text>

  <text x="292.631578947368" y="102.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.971050758124" font-weight="bold" fill="var(--text-muted)">ETL (extract, transform, load)</text>
  <text x="966.315789473684" y="102.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.971050758124" font-weight="bold" fill="var(--text-muted)">ELT (extract, load, transform)</text>

  <line x1="629.473684210526" y1="81.428571428571" x2="629.473684210526" y2="599.285714285714" stroke="var(--border)" stroke-width="2" stroke-dasharray="6 6"/>

  <rect x="40" y="143.571428571429" width="189.473684210526" height="72.5" rx="8.353109366591" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="134.736842105263" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.706218733181" font-weight="bold" fill="var(--info-text)">Source</text>

  <rect x="261.052631578947" y="143.571428571429" width="231.578947368421" height="72.5" rx="8.353109366591" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="376.842105263158" y="174.642857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.706218733181" font-weight="bold" fill="var(--warn-text)">Transform</text>
  <text x="376.842105263158" y="197.428571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--warn-text)">staging server</text>

  <rect x="524.210526315789" y="143.571428571429" width="63.157894736842" height="72.5" rx="8.353109366591" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="555.789473684211" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.617941391534" font-weight="bold" fill="var(--primary-text)">DW</text>

  <path d="M 229.473684210526 179.821428571429 L 261.052631578947 179.821428571429" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 492.631578947368 179.821428571429 L 524.210526315789 179.821428571429" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="292.631578947368" y="257.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.617941391534" font-weight="bold" fill="var(--text)">Properties</text>
  <text x="40" y="288.571428571429" font-family="Arial, sans-serif" font-size="14.617941391534" fill="var(--text-muted)">- Dedicated compute</text>
  <text x="40" y="313.428571428571" font-family="Arial, sans-serif" font-size="14.617941391534" fill="var(--text-muted)">- Slower iteration</text>
  <text x="40" y="338.285714285714" font-family="Arial, sans-serif" font-size="14.617941391534" fill="var(--text-muted)">- Less raw kept</text>
  <text x="40" y="380" font-family="Arial, sans-serif" font-size="14.617941391534" fill="var(--ok-accent)">+ masking pre-warehouse</text>
  <text x="40" y="405" font-family="Arial, sans-serif" font-size="14.617941391534" fill="var(--ok-accent)">+ format control</text>
  <text x="40" y="430" font-family="Arial, sans-serif" font-size="14.617941391534" fill="var(--ok-accent)">+ smaller DW cost</text>

  <text x="292.631578947368" y="495.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.617941391534" font-weight="bold" fill="var(--text)">When to use</text>
  <text x="40" y="524.714285714286" font-family="Arial, sans-serif" font-size="14.617941391534" fill="var(--text-muted)">Masking, air-gap, format gaps</text>

  <rect x="692.631578947368" y="143.571428571429" width="189.473684210526" height="72.5" rx="8.353109366591" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="787.368421052632" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.706218733181" font-weight="bold" fill="var(--info-text)">Source</text>

  <rect x="913.684210526316" y="143.571428571429" width="105.263157894737" height="72.5" rx="8.353109366591" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="966.315789473684" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.617941391534" font-weight="bold" fill="var(--primary-text)">DW (raw)</text>

  <rect x="1061.052631578948" y="143.571428571429" width="178.947368421053" height="72.5" rx="8.353109366591" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1150.526315789474" y="174.642857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.706218733181" font-weight="bold" fill="var(--warn-text)">Transform</text>
  <text x="1150.526315789474" y="197.428571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--warn-text)">in warehouse</text>

  <path d="M 882.105263157895 179.821428571429 L 913.684210526316 179.821428571429" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1018.947368421053 179.821428571429 L 1061.052631578948 179.821428571429" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="966.315789473684" y="257.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.617941391534" font-weight="bold" fill="var(--text)">Properties</text>
  <text x="692.631578947368" y="288.571428571429" font-family="Arial, sans-serif" font-size="14.617941391534" fill="var(--text-muted)">- Raw landed first</text>
  <text x="692.631578947368" y="313.428571428571" font-family="Arial, sans-serif" font-size="14.617941391534" fill="var(--text-muted)">- DW compute</text>
  <text x="692.631578947368" y="338.285714285714" font-family="Arial, sans-serif" font-size="14.617941391534" fill="var(--text-muted)">- Faster iteration</text>
  <text x="692.631578947368" y="380" font-family="Arial, sans-serif" font-size="14.617941391534" fill="var(--ok-accent)">+ replay transforms</text>
  <text x="692.631578947368" y="405" font-family="Arial, sans-serif" font-size="14.617941391534" fill="var(--ok-accent)">+ SQL-first</text>
  <text x="692.631578947368" y="430" font-family="Arial, sans-serif" font-size="14.617941391534" fill="var(--ok-accent)">+ simpler ops</text>

  <text x="966.315789473684" y="495.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.617941391534" font-weight="bold" fill="var(--text)">When to use</text>
  <text x="692.631578947368" y="524.714285714286" font-family="Arial, sans-serif" font-size="14.617941391534" fill="var(--text-muted)">Default for new pipelines</text>

  <text x="629.473684210526" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--text-muted)">Most teams use ELT today; ETL still fits compliance and air-gapped scenarios</text>
</svg>

  <rect x="40" y="454.285714285714" width="558.620689655172" height="165.714285714286" rx="10.350983390135" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="319.310344827586" y="485.357142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.561573424217" font-weight="bold" fill="var(--text)">Edge semantics</text>
  <text x="60.689655172414" y="514.357142857143" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--text-muted)">Dependency: must complete first</text>
  <text x="60.689655172414" y="537.142857142857" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--text-muted)">No edge: parallel execution</text>
  <text x="60.689655172414" y="559.928571428572" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--text-muted)">Failure stops downstream branches</text>
  <text x="60.689655172414" y="594.107142857143" font-family="Arial, sans-serif" font-size="13.456278407176" font-weight="bold" fill="var(--ok-accent)">Retries per task, idempotent code</text>

  <rect x="640" y="454.285714285714" width="558.620689655172" height="165.714285714286" rx="10.350983390135" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="919.310344827586" y="485.357142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.561573424217" font-weight="bold" fill="var(--text)">Backfills</text>
  <text x="660.689655172414" y="514.357142857143" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--text-muted)">Run for past partitions</text>
  <text x="660.689655172414" y="537.142857142857" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--text-muted)">Parallelize where independent</text>
  <text x="660.689655172414" y="559.928571428572" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--text-muted)">Track watermark</text>
  <text x="660.689655172414" y="594.107142857143" font-family="Arial, sans-serif" font-size="13.456278407176" font-weight="bold" fill="var(--ok-accent)">Resumable from failures</text>

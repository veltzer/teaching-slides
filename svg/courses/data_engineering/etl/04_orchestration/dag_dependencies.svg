  <text x="122.758620689655" y="159.107142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.491376746189" font-weight="bold" fill="var(--info-text)">extract_a</text>

  <rect x="40" y="226.428571428571" width="165.51724137931" height="62.142857142857" rx="8.280786712108" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="122.758620689655" y="262.678571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.491376746189" font-weight="bold" fill="var(--info-text)">extract_b</text>

  <rect x="40" y="330" width="165.51724137931" height="62.142857142857" rx="8.280786712108" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="122.758620689655" y="366.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.491376746189" font-weight="bold" fill="var(--info-text)">extract_c</text>

  <rect x="288.275862068966" y="174.642857142857" width="165.51724137931" height="62.142857142857" rx="8.280786712108" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="371.034482758621" y="210.892857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.491376746189" font-weight="bold" fill="var(--warn-text)">validate</text>

  <rect x="288.275862068966" y="330" width="165.51724137931" height="62.142857142857" rx="8.280786712108" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="371.034482758621" y="366.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.491376746189" font-weight="bold" fill="var(--warn-text)">validate</text>

  <rect x="536.551724137931" y="226.428571428571" width="186.206896551724" height="82.857142857143" rx="8.280786712108" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="629.655172413793" y="262.678571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.491376746189" font-weight="bold" fill="var(--primary-text)">transform</text>
  <text x="629.655172413793" y="286.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.421180068162" fill="var(--primary-text)">join &amp; conform</text>

  <rect x="805.51724137931" y="226.428571428571" width="186.206896551724" height="82.857142857143" rx="8.280786712108" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="898.620689655173" y="262.678571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.491376746189" font-weight="bold" fill="var(--primary-text)">aggregate</text>
  <text x="898.620689655173" y="286.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.421180068162" fill="var(--primary-text)">build gold</text>

  <rect x="1074.48275862069" y="226.428571428571" width="165.51724137931" height="82.857142857143" rx="8.280786712108" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1157.241379310345" y="262.678571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.491376746189" font-weight="bold" fill="var(--ok-text)">notify</text>
  <text x="1157.241379310345" y="286.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.421180068162" fill="var(--ok-text)">webhook</text>

  <path d="M 205.51724137931 153.928571428571 L 288.275862068966 200.535714285714" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 205.51724137931 257.5 L 288.275862068966 216.071428571429" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

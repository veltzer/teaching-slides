<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">dbt CI/CD Pipeline Steps</text>

  <rect x="40" y="80" width="290" height="540" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">1. Lint and Parse</text>
  <text x="60" y="160" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">SQLFluff format</text>
  <text x="60" y="190" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">dbt parse compiles</text>
  <text x="60" y="220" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Catches syntax</text>
  <text x="60" y="250" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">No warehouse needed</text>
  <text x="60" y="290" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--info-text)">Fastest feedback</text>
  <text x="60" y="340" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">Run on every push</text>

  <rect x="345" y="80" width="290" height="540" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">2. Slim CI</text>
  <text x="365" y="160" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">state:modified+</text>
  <text x="365" y="190" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Build only changes</text>
  <text x="365" y="220" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Compare to manifest</text>
  <text x="365" y="250" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Schema in PR DB</text>
  <text x="365" y="290" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--primary-text)">Cuts CI minutes</text>
  <text x="365" y="340" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">Defer to prod artifact</text>

  <rect x="650" y="80" width="290" height="540" rx="10" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="795" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">3. Run Tests</text>
  <text x="670" y="160" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">dbt build command</text>
  <text x="670" y="190" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Run plus tests</text>
  <text x="670" y="220" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Stop on first failure</text>
  <text x="670" y="250" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Block PR merge</text>
  <text x="670" y="290" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--warn-text)">Quality gate</text>
  <text x="670" y="340" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">Annotate the PR</text>

  <rect x="955" y="80" width="285" height="540" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">4. Deploy</text>
  <text x="975" y="160" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Merge to main</text>
  <text x="975" y="190" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Production target</text>
  <text x="975" y="220" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Build artifact</text>
  <text x="975" y="250" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Update manifest</text>
  <text x="975" y="290" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--ok-text)">Schedule downstream</text>
  <text x="975" y="340" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">Tag and notify</text>
</svg>

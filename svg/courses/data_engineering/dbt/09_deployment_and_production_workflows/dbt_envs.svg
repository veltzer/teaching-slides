<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <metadata><type>regular</type></metadata>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">dbt Environments and Schedules</text>
  <rect x="40" y="80" width="290" height="540" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Dev</text>
  <text x="60" y="155" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Per-developer schema</text>
  <text x="60" y="185" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Run locally on subset</text>
  <text x="60" y="215" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">No production impact</text>
  <rect x="345" y="80" width="290" height="540" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">CI</text>
  <text x="365" y="155" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Slim CI runs only changed</text>
  <text x="365" y="185" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Tests pass before merge</text>
  <text x="365" y="215" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Sample data or full</text>
  <rect x="650" y="80" width="290" height="540" rx="10" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="795" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Prod</text>
  <text x="670" y="155" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Scheduled hourly / daily</text>
  <text x="670" y="185" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Tests = blocking gate</text>
  <text x="670" y="215" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Alerts on failure</text>
  <rect x="955" y="80" width="285" height="540" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Orchestrators</text>
  <text x="975" y="155" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Airflow, Dagster</text>
  <text x="975" y="185" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">dbt Cloud built-in</text>
  <text x="975" y="215" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">cron only for tiny shops</text>
</svg>

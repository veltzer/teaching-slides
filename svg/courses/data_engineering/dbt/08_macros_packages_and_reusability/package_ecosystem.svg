<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <metadata><type>regular</type></metadata>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">dbt Package Ecosystem</text>
  <rect x="40" y="80" width="382" height="540" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="231" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">dbt_utils</text>
  <text x="60" y="160" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Generic helper macros</text>
  <text x="60" y="190" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">surrogate_key, dedup</text>
  <text x="60" y="220" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Almost every project uses</text>
  <rect x="448" y="80" width="382" height="540" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">dbt_expectations</text>
  <text x="468" y="160" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Richer data tests</text>
  <text x="468" y="190" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Distributions, ranges</text>
  <text x="468" y="220" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Inspired by Great Expectations</text>
  <rect x="856" y="80" width="382" height="540" rx="10" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1047" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Source-specific</text>
  <text x="876" y="160" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Stripe, Salesforce, ad packs</text>
  <text x="876" y="190" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Pre-built models</text>
  <text x="876" y="220" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Skip the boilerplate</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">When to Use dbt Seeds</text>

  <rect x="40" y="80" width="290" height="540" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="185" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Lookup Tables</text>
  <text x="60" y="160" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Country codes</text>
  <text x="60" y="190" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Currency rates ref</text>
  <text x="60" y="220" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Department lookup</text>
  <text x="60" y="250" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Product taxonomy</text>
  <text x="60" y="290" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--ok-text)">Stable reference data</text>
  <text x="60" y="340" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">Versioned in git</text>

  <rect x="345" y="80" width="290" height="540" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="490" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Mappings</text>
  <text x="365" y="160" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Source-to-canonical</text>
  <text x="365" y="190" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">SKU translations</text>
  <text x="365" y="220" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Region grouping</text>
  <text x="365" y="250" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Category collapsing</text>
  <text x="365" y="290" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--info-text)">Business rules in CSV</text>
  <text x="365" y="340" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">Reviewed by analysts</text>

  <rect x="650" y="80" width="290" height="540" rx="10" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="795" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Test Fixtures</text>
  <text x="670" y="160" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Sample input data</text>
  <text x="670" y="190" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Expected output</text>
  <text x="670" y="220" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">unit_tests fixtures</text>
  <text x="670" y="250" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Repeatable snapshots</text>
  <text x="670" y="290" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--warn-text)">Catch logic regressions</text>
  <text x="670" y="340" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">Small dataset only</text>

  <rect x="955" y="80" width="285" height="540" rx="10" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1097" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--danger-text)">Anti-Pattern</text>
  <text x="975" y="160" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Big production data</text>
  <text x="975" y="190" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Frequent updates</text>
  <text x="975" y="220" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Files over 1 MB</text>
  <text x="975" y="250" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Sensitive PII</text>
  <text x="975" y="290" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--danger-text)">Use a source instead</text>
  <text x="975" y="340" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">Or seed-loader pattern</text>
</svg>

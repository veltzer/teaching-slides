<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <metadata><type>regular</type></metadata>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Sources and Seeds</text>
  <rect x="40" y="80" width="585" height="540" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="332" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Sources</text>
  <text x="60" y="160" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Tables loaded by something else</text>
  <text x="60" y="190" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Declared in YAML</text>
  <text x="60" y="220" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Referenced via source('schema','table')</text>
  <text x="60" y="270" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--info-text)">Why bother</text>
  <text x="60" y="300" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Lineage starts from raw data</text>
  <text x="60" y="330" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Freshness checks built in</text>
  <text x="60" y="360" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Rename without breaking refs</text>
  <rect x="640" y="80" width="600" height="540" rx="10" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">Seeds</text>
  <text x="660" y="160" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">Small CSV files in the repo</text>
  <text x="660" y="190" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">dbt seed loads them as tables</text>
  <text x="660" y="220" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">Use ref('seed_name')</text>
  <text x="660" y="270" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--warn-text)">Right tool for</text>
  <text x="660" y="300" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Country codes, mappings</text>
  <text x="660" y="330" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Reference data &lt; 1000 rows</text>
  <text x="660" y="360" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Not for big data ingestion</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <metadata><type>regular</type></metadata>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Where dbt Sits in ELT</text>
  <rect x="40" y="80" width="290" height="540" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Extract</text>
  <text x="60" y="155" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Pull from sources</text>
  <text x="60" y="185" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Fivetran, Airbyte</text>
  <text x="60" y="215" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Custom scripts</text>
  <rect x="345" y="80" width="290" height="540" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Load</text>
  <text x="365" y="155" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Into the warehouse</text>
  <text x="365" y="185" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Snowflake, BigQuery</text>
  <text x="365" y="215" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Raw schema</text>
  <rect x="650" y="80" width="290" height="540" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="795" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Transform (dbt)</text>
  <text x="670" y="155" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">SQL select-based models</text>
  <text x="670" y="185" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">DAG of dependencies</text>
  <text x="670" y="215" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Tests + docs included</text>
  <rect x="955" y="80" width="285" height="540" rx="10" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Serve</text>
  <text x="975" y="155" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">BI tools, ML models</text>
  <text x="975" y="185" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Dashboards, reports</text>
  <text x="975" y="215" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Reverse ETL</text>
</svg>

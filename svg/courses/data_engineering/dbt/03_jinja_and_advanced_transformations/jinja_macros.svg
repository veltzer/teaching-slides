<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <metadata><type>regular</type></metadata>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Jinja, Macros, and Refs</text>
  <rect x="40" y="80" width="382" height="540" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="231" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Jinja templates</text>
  <text x="60" y="160" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Loops, conditionals, vars</text>
  <text x="60" y="190" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Compiled to SQL</text>
  <text x="60" y="220" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Runs at compile, not query</text>
  <rect x="448" y="80" width="382" height="540" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">ref + source</text>
  <text x="468" y="160" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">ref('model') resolves dep</text>
  <text x="468" y="190" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">source(...) for raw tables</text>
  <text x="468" y="220" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Builds the DAG</text>
  <rect x="856" y="80" width="382" height="540" rx="10" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1047" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Macros</text>
  <text x="876" y="160" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Reusable SQL functions</text>
  <text x="876" y="190" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">dbt_utils package built-ins</text>
  <text x="876" y="220" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">DRY across models</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs/>

  <text x="640" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Slowly Changing Dimensions</text>

  <rect x="60" y="100" width="370" height="500" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="245" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">Type 1: overwrite</text>
  <rect x="80" y="160" width="330" height="120" rx="6" fill="var(--surface)"/>
  <text x="100" y="185" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">id | name  | city</text>
  <text x="100" y="210" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">1  | Alice | NYC</text>
  <text x="100" y="240" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">// Alice moves to SF:</text>
  <text x="100" y="265" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">1  | Alice | SF</text>
  <text x="80" y="320" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">- Lose history</text>
  <text x="80" y="345" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">- Simplest</text>
  <text x="80" y="395" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="var(--primary-text)">For non-historical attrs</text>

  <rect x="455" y="100" width="370" height="500" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-text)">Type 2: history rows</text>
  <rect x="475" y="160" width="330" height="180" rx="6" fill="var(--surface)"/>
  <text x="495" y="185" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">id | city | from | to</text>
  <text x="495" y="210" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">1  | NYC  | Jan  | Mar</text>
  <text x="495" y="235" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">1  | SF   | Mar  | NULL</text>
  <text x="495" y="280" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">NULL "to" = current row</text>
  <text x="495" y="305" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Or is_current flag</text>
  <text x="475" y="380" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">- Full history</text>
  <text x="475" y="405" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">- Most common</text>
  <text x="475" y="430" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">- Need surrogate key</text>
  <text x="475" y="475" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-text)">dbt snapshot does this</text>
  <text x="475" y="525" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="var(--ok-text)">For audit, historical reports</text>

  <rect x="850" y="100" width="370" height="500" rx="10" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1035" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-text)">Type 3: prev column</text>
  <rect x="870" y="160" width="330" height="120" rx="6" fill="var(--surface)"/>
  <text x="890" y="185" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">id | city | prev_city</text>
  <text x="890" y="210" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">1  | NYC  | NULL</text>
  <text x="890" y="240" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">// after move:</text>
  <text x="890" y="265" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">1  | SF   | NYC</text>
  <text x="870" y="320" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">- One previous only</text>
  <text x="870" y="345" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">- Compact</text>
  <text x="870" y="395" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="var(--warn-text)">Rarely the right choice</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.378891504872" font-weight="bold" fill="var(--text)">Slowly Changing Dimensions</text>

  <rect x="40" y="87.889908256881" width="382.758620689655" height="532.110091743119" rx="10.49246125174" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="231.379310344828" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.886430253132" font-weight="bold" fill="var(--primary-text)">Type 1: overwrite</text>
  <rect x="60.689655172414" y="151.743119266055" width="341.379310344828" height="127.706422018349" rx="6.295476751044" fill="var(--surface)"/>
  <text x="81.379310344828" y="178.348623853211" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">id | name  | city</text>
  <text x="81.379310344828" y="204.954128440367" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">1  | Alice | NYC</text>
  <text x="81.379310344828" y="236.880733944954" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">// Alice moves to SF:</text>
  <text x="81.379310344828" y="263.48623853211" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">1  | Alice | SF</text>
  <text x="60.689655172414" y="322.018348623853" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--primary-text)">- Lose history</text>
  <text x="60.689655172414" y="348.623853211009" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--primary-text)">- Simplest</text>
  <text x="60.689655172414" y="401.834862385321" font-family="Arial, sans-serif" font-size="12.590953502088" font-style="italic" fill="var(--primary-text)">For non-historical attrs</text>

  <rect x="448.620689655172" y="87.889908256881" width="382.758620689655" height="532.110091743119" rx="10.49246125174" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.886430253132" font-weight="bold" fill="var(--ok-text)">Type 2: history rows</text>
  <rect x="469.310344827586" y="151.743119266055" width="341.379310344828" height="191.559633027523" rx="6.295476751044" fill="var(--surface)"/>
  <text x="490" y="178.348623853211" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">id | city | from | to</text>
  <text x="490" y="204.954128440367" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">1  | NYC  | Jan  | Mar</text>
  <text x="490" y="231.559633027523" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">1  | SF   | Mar  | NULL</text>
  <text x="490" y="279.449541284404" font-family="Arial, sans-serif" font-size="12.590953502088" fill="var(--text-muted)">NULL "to" = current row</text>
  <text x="490" y="306.05504587156" font-family="Arial, sans-serif" font-size="12.590953502088" fill="var(--text-muted)">Or is_current flag</text>
  <text x="469.310344827586" y="385.871559633028" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">- Full history</text>
  <text x="469.310344827586" y="412.477064220184" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">- Most common</text>
  <text x="469.310344827586" y="439.082568807339" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">- Need surrogate key</text>
  <text x="469.310344827586" y="486.97247706422" font-family="Arial, sans-serif" font-size="13.640199627262" font-weight="bold" fill="var(--ok-text)">dbt snapshot does this</text>
  <text x="469.310344827586" y="540.183486238532" font-family="Arial, sans-serif" font-size="12.590953502088" font-style="italic" fill="var(--ok-text)">For audit, historical reports</text>

  <rect x="857.241379310345" y="87.889908256881" width="382.758620689655" height="532.110091743119" rx="10.49246125174" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1048.620689655173" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.886430253132" font-weight="bold" fill="var(--warn-text)">Type 3: prev column</text>
  <rect x="877.931034482759" y="151.743119266055" width="341.379310344828" height="127.706422018349" rx="6.295476751044" fill="var(--surface)"/>
  <text x="898.620689655172" y="178.348623853211" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">id | city | prev_city</text>
  <text x="898.620689655172" y="204.954128440367" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">1  | NYC  | NULL</text>
  <text x="898.620689655172" y="236.880733944954" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">// after move:</text>
  <text x="898.620689655172" y="263.48623853211" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">1  | SF   | NYC</text>
  <text x="877.931034482759" y="322.018348623853" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">- One previous only</text>
  <text x="877.931034482759" y="348.623853211009" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">- Compact</text>
  <text x="877.931034482759" y="401.834862385321" font-family="Arial, sans-serif" font-size="12.590953502088" font-style="italic" fill="var(--warn-text)">Rarely the right choice</text>
</svg>

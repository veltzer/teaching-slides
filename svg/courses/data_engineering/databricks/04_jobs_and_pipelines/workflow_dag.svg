  <text x="147.142857142857" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.164008115914" font-weight="bold" fill="var(--info-text)">ingest_orders</text>
  <text x="147.142857142857" y="211.851851851852" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--info-text)">notebook task</text>

  <rect x="40" y="276.296296296296" width="214.285714285714" height="85.925925925926" rx="10.727505072446" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="147.142857142857" y="313.888888888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.164008115914" font-weight="bold" fill="var(--info-text)">ingest_users</text>
  <text x="147.142857142857" y="340.740740740741" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--info-text)">notebook task</text>

  <rect x="361.428571428571" y="211.851851851852" width="214.285714285714" height="85.925925925926" rx="10.727505072446" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="468.571428571428" y="249.444444444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.164008115914" font-weight="bold" fill="var(--warn-text)">build_silver</text>
  <text x="468.571428571428" y="276.296296296296" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--warn-text)">SQL task</text>

  <rect x="682.857142857143" y="147.407407407407" width="214.285714285714" height="85.925925925926" rx="10.727505072446" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="790" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.164008115914" font-weight="bold" fill="var(--primary-text)">build_gold_kpi</text>
  <text x="790" y="211.851851851852" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--primary-text)">SQL task</text>

  <rect x="682.857142857143" y="276.296296296296" width="214.285714285714" height="85.925925925926" rx="10.727505072446" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="790" y="313.888888888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.164008115914" font-weight="bold" fill="var(--primary-text)">train_model</text>
  <text x="790" y="340.740740740741" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--primary-text)">notebook task</text>

  <rect x="1004.285714285714" y="211.851851851852" width="214.285714285714" height="85.925925925926" rx="10.727505072446" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1111.428571428571" y="249.444444444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.164008115914" font-weight="bold" fill="var(--ok-text)">notify_team</text>
  <text x="1111.428571428571" y="276.296296296296" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--ok-text)">webhook</text>

  <path d="M 254.285714285714 190.37037037037 L 361.428571428571 244.074074074074" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 254.285714285714 319.259259259259 L 361.428571428571 265.555555555556" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 575.714285714286 244.074074074074 L 682.857142857143 190.37037037037" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 575.714285714286 265.555555555556 L 682.857142857143 319.259259259259" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 897.142857142857 190.37037037037 L 1004.285714285714 244.074074074074" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 897.142857142857 319.259259259259 L 1004.285714285714 265.555555555556" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="426.666666666667" width="578.571428571429" height="193.333333333333" rx="10.727505072446" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="329.285714285714" y="458.888888888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.164008115914" font-weight="bold" fill="var(--text)">Per-task config</text>
  <text x="61.428571428571" y="488.962962962963" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--text-muted)">cluster: shared or job-scoped</text>
  <text x="61.428571428571" y="512.592592592593" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--text-muted)">retries: with exponential backoff</text>
  <text x="61.428571428571" y="536.222222222222" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--text-muted)">timeout: hard cap</text>
  <text x="61.428571428571" y="559.851851851852" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--text-muted)">notification: success and failure</text>
  <text x="61.428571428571" y="593.148148148148" font-family="Arial, sans-serif" font-size="13.94575659418" font-weight="bold" fill="var(--ok-accent)">Defined as JSON, versioned in git</text>

  <rect x="661.428571428571" y="426.666666666667" width="578.571428571429" height="193.333333333333" rx="10.727505072446" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="950.714285714286" y="458.888888888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.164008115914" font-weight="bold" fill="var(--text)">Triggers</text>
  <text x="682.857142857143" y="488.962962962963" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--text-muted)">Cron: hourly, nightly</text>
  <text x="682.857142857143" y="512.592592592593" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--text-muted)">File arrival: cloud event</text>
  <text x="682.857142857143" y="536.222222222222" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--text-muted)">API: external systems</text>
  <text x="682.857142857143" y="559.851851851852" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--text-muted)">Continuous: streaming</text>
  <text x="682.857142857143" y="593.148148148148" font-family="Arial, sans-serif" font-size="13.94575659418" font-weight="bold" fill="var(--ok-accent)">Replaces external orchestrator</text>
</svg>

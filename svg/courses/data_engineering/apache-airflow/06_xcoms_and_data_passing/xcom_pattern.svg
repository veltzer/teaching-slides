<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs/>

  <text x="640" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">XCom: Data Between Tasks</text>

  <rect x="60" y="100" width="240" height="100" rx="8" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">extract_task</text>
  <text x="180" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--info-text)">return file_path</text>
  <text x="180" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--info-text)">(small string)</text>

  <path d="M 302 150 L 432 150" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="367" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="var(--text-muted)">XCom push</text>

  <rect x="440" y="100" width="280" height="100" rx="8" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="580" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn-text)">Metadata DB</text>
  <text x="580" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-text)">Stored as serialized value</text>
  <text x="580" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-text)">Keyed by dag_id, task_id</text>

  <path d="M 722 150 L 852 150" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="787" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="var(--text-muted)">XCom pull</text>

  <rect x="860" y="100" width="240" height="100" rx="8" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="980" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-text)">transform_task</text>
  <text x="980" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">read file_path</text>

  <rect x="60" y="240" width="560" height="200" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-text)">Use XCom for</text>
  <text x="80" y="305" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">- Small metadata (file paths, IDs)</text>
  <text x="80" y="330" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">- Counts, status, primary keys</text>
  <text x="80" y="355" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">- Job IDs from external systems</text>
  <text x="80" y="395" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--ok-text)">Default backend: SQL row</text>

  <rect x="660" y="240" width="560" height="200" rx="10" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--danger-text)">Don't use for</text>
  <text x="680" y="305" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">- Large dataframes</text>
  <text x="680" y="330" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">- File contents</text>
  <text x="680" y="355" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">- Anything &gt; few KB</text>
  <text x="680" y="395" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--danger-text)">DB grows fast</text>

  <rect x="60" y="470" width="1160" height="150" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Pattern: pass references, not data</text>
  <text x="640" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Task A writes file to S3 -&gt; XCom contains the S3 URL</text>
  <text x="640" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Task B reads from S3</text>
  <text x="640" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--text-muted)">For real data: custom XCom backend (S3, Redis)</text>
</svg>

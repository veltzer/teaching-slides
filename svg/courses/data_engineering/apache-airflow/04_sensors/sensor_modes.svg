<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.378891504872" font-weight="bold" fill="var(--text)">Airflow Sensor Modes</text>

  <rect x="40" y="87.889908256881" width="382.758620689655" height="532.110091743119" rx="10.49246125174" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="231.379310344828" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.98492250348" font-weight="bold" fill="var(--danger-text)">poke (default)</text>
  <text x="60.689655172414" y="162.385321100917" font-family="Arial, sans-serif" font-size="14.689445752436" font-weight="bold" fill="var(--danger-text)">Holds a worker slot</text>
  <text x="60.689655172414" y="194.311926605505" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--danger-text)">Sensor sleeps + checks</text>
  <text x="60.689655172414" y="220.917431192661" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--danger-text)">Worker stays busy waiting</text>
  <text x="60.689655172414" y="279.449541284404" font-family="Arial, sans-serif" font-size="14.689445752436" font-weight="bold" fill="var(--danger-text)">Problems</text>
  <text x="60.689655172414" y="311.376146788991" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--danger-text)">- Eats slot for hours</text>
  <text x="60.689655172414" y="337.981651376147" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--danger-text)">- Many sensors = deadlock</text>
  <text x="60.689655172414" y="364.587155963303" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--danger-text)">- Wastes resources</text>
  <text x="60.689655172414" y="417.798165137615" font-family="Arial, sans-serif" font-size="14.689445752436" font-weight="bold" fill="var(--danger-text)">When OK</text>
  <text x="60.689655172414" y="449.724770642202" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--danger-text)">Short waits (seconds)</text>
  <text x="60.689655172414" y="476.330275229358" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--danger-text)">Few concurrent sensors</text>

  <rect x="448.620689655172" y="87.889908256881" width="382.758620689655" height="532.110091743119" rx="10.49246125174" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.98492250348" font-weight="bold" fill="var(--warn-text)">reschedule</text>
  <text x="469.310344827586" y="162.385321100917" font-family="Arial, sans-serif" font-size="14.689445752436" font-weight="bold" fill="var(--warn-text)">Releases worker between checks</text>
  <text x="469.310344827586" y="199.633027522936" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">Check, free slot, scheduler</text>
  <text x="469.310344827586" y="220.917431192661" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">queues recheck later</text>
  <text x="469.310344827586" y="279.449541284404" font-family="Arial, sans-serif" font-size="14.689445752436" font-weight="bold" fill="var(--warn-text)">Wins</text>
  <text x="469.310344827586" y="320" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">- Frees worker</text>
  <text x="469.310344827586" y="355" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">- Scales further</text>
  <text x="469.310344827586" y="417.798165137615" font-family="Arial, sans-serif" font-size="14.689445752436" font-weight="bold" fill="var(--warn-text)">When OK</text>
  <text x="469.310344827586" y="449.724770642202" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">Minutes between checks</text>
  <text x="469.310344827586" y="476.330275229358" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">Daily/hourly waits</text>

  <rect x="857.241379310345" y="87.889908256881" width="382.758620689655" height="532.110091743119" rx="10.49246125174" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1048.620689655173" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.98492250348" font-weight="bold" fill="var(--ok-text)">deferrable (2.2+)</text>
  <text x="877.931034482759" y="162.385321100917" font-family="Arial, sans-serif" font-size="14.689445752436" font-weight="bold" fill="var(--ok-text)">Triggerer process polls async</text>
  <text x="877.931034482759" y="199.633027522936" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">No worker held at all</text>
  <text x="877.931034482759" y="220.917431192661" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">Single triggerer = many tasks</text>
  <text x="877.931034482759" y="279.449541284404" font-family="Arial, sans-serif" font-size="14.689445752436" font-weight="bold" fill="var(--ok-text)">Wins</text>
  <text x="877.931034482759" y="311.376146788991" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">- Best resource usage</text>
  <text x="877.931034482759" y="337.981651376147" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">- Thousands concurrent</text>
  <text x="877.931034482759" y="364.587155963303" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">- Fast event-driven resume</text>
  <text x="877.931034482759" y="417.798165137615" font-family="Arial, sans-serif" font-size="14.689445752436" font-weight="bold" fill="var(--ok-text)">When</text>
  <text x="877.931034482759" y="449.724770642202" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">Long waits at scale</text>
  <text x="877.931034482759" y="476.330275229358" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">Async-aware operators</text>
</svg>

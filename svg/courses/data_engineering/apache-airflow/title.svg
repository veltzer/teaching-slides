<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="intro">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
<rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
<text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">Apache Airflow</text>
<text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Workflow orchestration</text>
<g font-family="Arial, sans-serif" text-anchor="middle">
  <line x1="260" y1="320" x2="308" y2="320" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="320,320 306,313 306,327" fill="var(--text-muted)"/>
  <line x1="480" y1="320" x2="530" y2="267" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="540,257 525,262 535,272" fill="var(--text-muted)"/>
  <line x1="480" y1="320" x2="530" y2="373" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="540,383 525,378 535,368" fill="var(--text-muted)"/>
  <line x1="700" y1="257" x2="750" y2="310" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="760,320 745,315 755,305" fill="var(--text-muted)"/>
  <line x1="700" y1="383" x2="750" y2="330" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="760,320 745,325 755,335" fill="var(--text-muted)"/>
  <line x1="920" y1="320" x2="968" y2="320" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="980,320 966,313 966,327" fill="var(--text-muted)"/>
  <rect x="100" y="295" width="160" height="50" rx="8" fill="var(--info-fill)"/>
  <text x="180" y="326" font-size="17" font-family="monospace" fill="var(--info-text)">wait_for_file</text>
  <rect x="320" y="295" width="160" height="50" rx="8" fill="var(--ok-fill)"/>
  <text x="400" y="326" font-size="18" font-family="monospace" fill="var(--ok-text)">extract</text>
  <rect x="540" y="232" width="160" height="50" rx="8" fill="var(--ok-fill)"/>
  <text x="620" y="263" font-size="18" font-family="monospace" fill="var(--ok-text)">clean</text>
  <rect x="540" y="358" width="160" height="50" rx="8" fill="var(--warn-fill)"/>
  <text x="620" y="389" font-size="18" font-family="monospace" fill="var(--warn-text)">enrich</text>
  <rect x="760" y="295" width="160" height="50" rx="8" fill="var(--text-muted)"/>
  <text x="840" y="326" font-size="18" font-family="monospace" fill="var(--surface)">load</text>
  <rect x="980" y="295" width="160" height="50" rx="8" fill="var(--text-muted)"/>
  <text x="1060" y="326" font-size="18" font-family="monospace" fill="var(--surface)">notify</text>
  <rect x="415" y="447" width="18" height="18" rx="3" fill="var(--info-fill)"/>
  <text x="441" y="461" font-size="15" text-anchor="start" fill="var(--text-faint)">sensor</text>
  <rect x="527" y="447" width="18" height="18" rx="3" fill="var(--ok-fill)"/>
  <text x="553" y="461" font-size="15" text-anchor="start" fill="var(--text-faint)">success</text>
  <rect x="647" y="447" width="18" height="18" rx="3" fill="var(--warn-fill)"/>
  <text x="673" y="461" font-size="15" text-anchor="start" fill="var(--text-faint)">running</text>
  <rect x="765" y="447" width="18" height="18" rx="3" fill="var(--text-muted)"/>
  <text x="791" y="461" font-size="15" text-anchor="start" fill="var(--text-faint)">queued</text>
</g>
<text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">DAGs • operators • sensors • XComs</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.495762407505" font-weight="bold" fill="var(--text)">Micro-Partitions and Pruning</text>

  <text x="640" y="91.785714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.854721375717" fill="var(--text-muted)">Table physically split into immutable micro-partitions (50-500MB compressed)</text>

  <rect x="40" y="143.571428571429" width="171.428571428571" height="124.285714285714" rx="8.427360687859" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="125.714285714286" y="174.642857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" font-weight="bold" fill="var(--info-text)">MP1</text>
  <text x="125.714285714286" y="200.535714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.641041031788" fill="var(--info-text)">date: 2026-01</text>
  <text x="125.714285714286" y="223.321428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.641041031788" fill="var(--info-text)">amt: $5-$1k</text>
  <text x="125.714285714286" y="247.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.641041031788" fill="var(--info-text)">region: NA</text>

  <rect x="232.857142857143" y="143.571428571429" width="171.428571428571" height="124.285714285714" rx="8.427360687859" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="318.571428571429" y="174.642857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" font-weight="bold" fill="var(--info-text)">MP2</text>
  <text x="318.571428571429" y="200.535714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.641041031788" fill="var(--info-text)">date: 2026-02</text>
  <text x="318.571428571429" y="223.321428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.641041031788" fill="var(--info-text)">amt: $10-$2k</text>
  <text x="318.571428571429" y="247.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.641041031788" fill="var(--info-text)">region: EU</text>

  <rect x="425.714285714286" y="143.571428571429" width="171.428571428571" height="124.285714285714" rx="8.427360687859" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="511.428571428571" y="174.642857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" font-weight="bold" fill="var(--ok-text)">MP3 (read)</text>
  <text x="511.428571428571" y="200.535714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.641041031788" fill="var(--ok-text)">date: 2026-03</text>
  <text x="511.428571428571" y="223.321428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.641041031788" fill="var(--ok-text)">amt: $50-$5k</text>
  <text x="511.428571428571" y="247.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.641041031788" fill="var(--ok-text)">region: NA</text>

  <rect x="618.571428571429" y="143.571428571429" width="171.428571428571" height="124.285714285714" rx="8.427360687859" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="704.285714285714" y="174.642857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" font-weight="bold" fill="var(--ok-text)">MP4 (read)</text>
  <text x="704.285714285714" y="200.535714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.641041031788" fill="var(--ok-text)">date: 2026-04</text>
  <text x="704.285714285714" y="223.321428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.641041031788" fill="var(--ok-text)">amt: $100-$3k</text>
  <text x="704.285714285714" y="247.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.641041031788" fill="var(--ok-text)">region: NA</text>

  <rect x="811.428571428571" y="143.571428571429" width="171.428571428571" height="124.285714285714" rx="8.427360687859" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="897.142857142857" y="174.642857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" font-weight="bold" fill="var(--info-text)">MP5</text>
  <text x="897.142857142857" y="200.535714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.641041031788" fill="var(--info-text)">date: 2026-05</text>
  <text x="897.142857142857" y="223.321428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.641041031788" fill="var(--info-text)">amt: $1k-$10k</text>
  <text x="897.142857142857" y="247.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.641041031788" fill="var(--info-text)">region: APAC</text>

  <rect x="1004.285714285714" y="143.571428571429" width="171.428571428571" height="124.285714285714" rx="8.427360687859" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="174.642857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" font-weight="bold" fill="var(--info-text)">MP6</text>
  <text x="1090" y="200.535714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.641041031788" fill="var(--info-text)">date: 2026-06</text>
  <text x="1090" y="223.321428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.641041031788" fill="var(--info-text)">amt: $20-$1k</text>
  <text x="1090" y="247.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.641041031788" fill="var(--info-text)">region: EU</text>

  <rect x="40" y="330" width="1200" height="82.857142857143" rx="10.534200859823" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="366.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.854721375717" font-weight="bold" fill="var(--warn-text)">Query: WHERE date BETWEEN '2026-03' AND '2026-04' AND region = 'NA'</text>
  <text x="640" y="392.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--warn-text)">Only MP3 and MP4 read — others skipped via metadata</text>

  <rect x="40" y="454.285714285714" width="1200" height="165.714285714286" rx="10.534200859823" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="485.357142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.854721375717" font-weight="bold" fill="var(--text)">How pruning works</text>
  <text x="640" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--text-muted)">Each partition tracks min/max per column</text>
  <text x="640" y="552" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--text-muted)">Skip when filter does not overlap</text>
  <text x="640" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" font-weight="bold" fill="var(--ok-accent)">Watch bytes-scanned metric</text>
</svg>

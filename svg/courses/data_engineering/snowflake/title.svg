<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="intro">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
<rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
<text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">Snowflake</text>
<text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Mark Veltzer</text>
<g font-family="Arial, sans-serif" text-anchor="middle">
  <text x="182" y="228" text-anchor="end" font-size="17" fill="var(--text-faint)">Services</text>
  <text x="182" y="310" text-anchor="end" font-size="17" fill="var(--text-faint)">Compute</text>
  <text x="182" y="415" text-anchor="end" font-size="17" fill="var(--text-faint)">Storage</text>
  <line x1="340" y1="244" x2="340" y2="272" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="670" y1="244" x2="670" y2="272" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="1000" y1="244" x2="1000" y2="272" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="340" y1="340" x2="340" y2="368" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="670" y1="340" x2="670" y2="368" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="1000" y1="340" x2="1000" y2="368" stroke="var(--text-muted)" stroke-width="2"/>
  <rect x="200" y="200" width="940" height="44" rx="10" fill="var(--primary-accent)"/>
  <text x="670" y="228" font-size="18" fill="var(--primary-text)">Metadata • Optimizer • Security • Result Cache</text>
  <rect x="200" y="272" width="280" height="68" rx="10" fill="var(--ok-fill)"/>
  <text x="340" y="312" font-size="18" fill="var(--ok-text)">Warehouse S</text>
  <rect x="530" y="272" width="280" height="68" rx="10" fill="var(--ok-accent)"/>
  <text x="670" y="312" font-size="18" fill="var(--ok-text)">Warehouse M</text>
  <rect x="860" y="272" width="280" height="68" rx="10" fill="var(--ok-fill)"/>
  <text x="1000" y="312" font-size="18" fill="var(--ok-text)">Warehouse L</text>
  <rect x="200" y="368" width="940" height="88" rx="10" fill="var(--info-accent)"/>
  <text x="670" y="394" font-size="17" fill="var(--info-text)">Micro-Partitions</text>
  <rect x="239" y="406" width="70" height="34" rx="4" fill="var(--info-fill)"/>
  <rect x="327" y="406" width="70" height="34" rx="4" fill="var(--info-fill)"/>
  <rect x="415" y="406" width="70" height="34" rx="4" fill="var(--info-fill)"/>
  <rect x="503" y="406" width="70" height="34" rx="4" fill="var(--info-fill)"/>
  <rect x="591" y="406" width="70" height="34" rx="4" fill="var(--info-fill)"/>
  <rect x="679" y="406" width="70" height="34" rx="4" fill="var(--info-fill)"/>
  <rect x="767" y="406" width="70" height="34" rx="4" fill="var(--info-fill)"/>
  <rect x="855" y="406" width="70" height="34" rx="4" fill="var(--info-fill)"/>
  <rect x="943" y="406" width="70" height="34" rx="4" fill="var(--info-fill)"/>
  <rect x="1031" y="406" width="70" height="34" rx="4" fill="var(--info-fill)"/>
  <text x="640" y="505" font-size="16" fill="var(--text-faint)">tables &amp; storage • loading &amp; unloading • query performance • security &amp; sharing</text>
</g>
<text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">mark.veltzer@gmail.com</text>
</svg>

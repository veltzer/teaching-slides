<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.245046200557" font-weight="bold" fill="var(--text)">Data Lake vs Warehouse vs Lakehouse</text>

  <rect x="40" y="103.272727272727" width="393.103448275862" height="485.090909090909" rx="10.444659357342" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="443.448275862069" y="103.272727272727" width="393.103448275862" height="485.090909090909" rx="10.444659357342" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="846.896551724138" y="103.272727272727" width="393.103448275862" height="485.090909090909" rx="10.444659357342" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>

  <text x="236.551724137931" y="145.454545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.978250586152" font-weight="bold" fill="var(--text)">Data Lake</text>
  <text x="640" y="145.454545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.978250586152" font-weight="bold" fill="var(--text)">Data Warehouse</text>
  <text x="1043.448275862069" y="145.454545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.978250586152" font-weight="bold" fill="var(--text)">Lakehouse</text>

  <rect x="81.379310344828" y="187.636363636364" width="310.344827586207" height="63.272727272727" rx="8.355727485873" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="236.551724137931" y="224.545454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.622523100279" font-weight="bold" fill="var(--info-text)">Object storage</text>

  <rect x="81.379310344828" y="272" width="310.344827586207" height="63.272727272727" rx="8.355727485873" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="236.551724137931" y="298.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.578057164544" font-weight="bold" fill="var(--warn-text)">Raw files (any format)</text>
  <text x="236.551724137931" y="319.454545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--warn-text)">No transactions</text>

  <text x="236.551724137931" y="377.454545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.622523100279" fill="var(--text-muted)">+ cheap, flexible</text>
  <text x="236.551724137931" y="400.654545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.622523100279" fill="var(--text-muted)">+ any workload</text>
  <text x="236.551724137931" y="423.854545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.622523100279" fill="var(--danger-accent)">- schema chaos</text>
  <text x="236.551724137931" y="447.054545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.622523100279" fill="var(--danger-accent)">- no ACID</text>
  <text x="236.551724137931" y="470.254545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.622523100279" fill="var(--danger-accent)">- slow BI</text>

  <rect x="484.827586206897" y="187.636363636364" width="310.344827586207" height="63.272727272727" rx="8.355727485873" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="224.545454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.622523100279" font-weight="bold" fill="var(--info-text)">Proprietary storage</text>

  <rect x="484.827586206897" y="272" width="310.344827586207" height="63.272727272727" rx="8.355727485873" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="298.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.578057164544" font-weight="bold" fill="var(--warn-text)">Curated tables</text>
  <text x="640" y="319.454545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--warn-text)">Strong SQL, ACID</text>

  <text x="640" y="377.454545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.622523100279" fill="var(--text-muted)">+ fast BI</text>
  <text x="640" y="400.654545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.622523100279" fill="var(--text-muted)">+ governance</text>
  <text x="640" y="423.854545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.622523100279" fill="var(--danger-accent)">- expensive at scale</text>
  <text x="640" y="447.054545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.622523100279" fill="var(--danger-accent)">- vendor lock</text>
  <text x="640" y="470.254545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.622523100279" fill="var(--danger-accent)">- not for ML raw</text>

  <rect x="888.275862068966" y="187.636363636364" width="310.344827586207" height="63.272727272727" rx="8.355727485873" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1043.448275862069" y="224.545454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.622523100279" font-weight="bold" fill="var(--info-text)">Object storage</text>

  <rect x="888.275862068966" y="272" width="310.344827586207" height="63.272727272727" rx="8.355727485873" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1043.448275862069" y="298.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.578057164544" font-weight="bold" fill="var(--ok-text)">Open table format</text>
  <text x="1043.448275862069" y="319.454545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--ok-text)">ACID + schema</text>

  <text x="1043.448275862069" y="377.454545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.622523100279" fill="var(--text-muted)">+ one copy of data</text>
  <text x="1043.448275862069" y="400.654545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.622523100279" fill="var(--text-muted)">+ open formats</text>
  <text x="1043.448275862069" y="423.854545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.622523100279" fill="var(--text-muted)">+ BI and ML both</text>
  <text x="1043.448275862069" y="447.054545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.622523100279" fill="var(--text-muted)">+ multi-engine</text>
  <text x="1043.448275862069" y="470.254545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.622523100279" fill="var(--ok-accent)">+ best of both</text>

  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.666989036013" fill="var(--text-muted)">Lakehouse: warehouse semantics on lake economics</text>
</svg>

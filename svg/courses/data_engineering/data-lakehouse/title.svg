<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="intro">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
<rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
<text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">Data Lakehouse</text>
<text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Mark Veltzer</text>
<g font-family="Arial, sans-serif" text-anchor="middle">
  <text x="170" y="241" font-size="18" fill="var(--text-faint)">ingest</text>
  <line x1="208" y1="235" x2="252" y2="235" stroke="var(--text-faint)" stroke-width="3"/>
  <polygon points="252,227 266,235 252,243" fill="var(--text-faint)"/>
  <rect x="270" y="208" width="220" height="54" rx="27" fill="var(--warn-accent)"/>
  <text x="380" y="241" font-size="20" fill="var(--warn-text)">Bronze</text>
  <line x1="494" y1="235" x2="512" y2="235" stroke="var(--text-faint)" stroke-width="3"/>
  <polygon points="512,227 526,235 512,243" fill="var(--text-faint)"/>
  <rect x="530" y="208" width="220" height="54" rx="27" fill="var(--primary-fill)"/>
  <text x="640" y="241" font-size="20" fill="var(--primary-text)">Silver</text>
  <line x1="754" y1="235" x2="772" y2="235" stroke="var(--text-faint)" stroke-width="3"/>
  <polygon points="772,227 786,235 772,243" fill="var(--text-faint)"/>
  <rect x="790" y="208" width="220" height="54" rx="27" fill="var(--warn-fill)"/>
  <text x="900" y="241" font-size="20" fill="var(--warn-text)">Gold</text>
  <line x1="1014" y1="235" x2="1046" y2="235" stroke="var(--text-faint)" stroke-width="3"/>
  <polygon points="1046,227 1060,235 1046,243" fill="var(--text-faint)"/>
  <text x="1112" y="241" font-size="18" fill="var(--text-faint)">BI &amp; ML</text>
  <rect x="150" y="292" width="980" height="48" rx="8" fill="var(--info-fill)"/>
  <text x="640" y="322" font-size="18" fill="var(--info-text)">Open table format: Iceberg, Delta Lake, Hudi</text>
  <rect x="150" y="348" width="980" height="48" rx="8" fill="var(--ok-fill)"/>
  <text x="640" y="378" font-size="18" fill="var(--ok-text)">Columnar files: Parquet, ORC</text>
  <rect x="150" y="404" width="980" height="48" rx="8" fill="var(--primary-accent)"/>
  <text x="640" y="434" font-size="18" fill="var(--primary-text)">Object storage</text>
  <text x="640" y="505" font-size="16" fill="var(--text-faint)">lake vs warehouse • file &amp; table formats • medallion layers • ingestion • quality &amp; lineage • operations</text>
</g>
<text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">mark.veltzer@gmail.com</text>
</svg>

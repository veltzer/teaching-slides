<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="629.473684210526" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.500466300751" font-weight="bold" fill="var(--text)">Lineage and Data Quality</text>

  <rect x="40" y="103.272727272727" width="189.473684210526" height="63.272727272727" rx="8.428704657357" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="134.736842105263" y="140.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.750233150375" font-weight="bold" fill="var(--info-text)">orders source</text>

  <rect x="40" y="208.727272727273" width="189.473684210526" height="63.272727272727" rx="8.428704657357" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="134.736842105263" y="245.636363636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.750233150375" font-weight="bold" fill="var(--info-text)">users source</text>

  <rect x="40" y="314.181818181818" width="189.473684210526" height="63.272727272727" rx="8.428704657357" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="134.736842105263" y="351.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.750233150375" font-weight="bold" fill="var(--info-text)">products source</text>

  <rect x="355.789473684211" y="156" width="189.473684210526" height="63.272727272727" rx="8.428704657357" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="450.526315789474" y="192.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.750233150375" font-weight="bold" fill="var(--warn-text)">orders_clean</text>

  <rect x="355.789473684211" y="261.454545454545" width="189.473684210526" height="63.272727272727" rx="8.428704657357" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="450.526315789474" y="298.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.750233150375" font-weight="bold" fill="var(--warn-text)">users_dim</text>

  <rect x="671.578947368421" y="208.727272727273" width="231.578947368421" height="84.363636363636" rx="10.535880821697" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="787.368421052632" y="240.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.803821232545" font-weight="bold" fill="var(--primary-text)">orders_enriched</text>
  <text x="787.368421052632" y="269.890909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.696645068206" fill="var(--primary-text)">silver layer</text>

  <rect x="1008.421052631579" y="187.636363636364" width="231.578947368421" height="63.272727272727" rx="8.428704657357" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1124.21052631579" y="224.545454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.750233150375" font-weight="bold" fill="var(--ok-text)">revenue_dashboard</text>

  <rect x="1008.421052631579" y="272" width="231.578947368421" height="63.272727272727" rx="8.428704657357" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1124.21052631579" y="308.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.750233150375" font-weight="bold" fill="var(--ok-text)">churn_model</text>

  <path d="M 229.473684210526 134.909090909091 L 355.789473684211 182.363636363636" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 229.473684210526 240.363636363636 L 355.789473684211 287.818181818182" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 229.473684210526 345.818181818182 L 355.789473684211 287.818181818182" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 545.263157894737 187.636363636364 L 671.578947368421 240.363636363636" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 545.263157894737 293.090909090909 L 671.578947368421 261.454545454545" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 903.157894736842 240.363636363636 L 1008.421052631579 219.272727272727" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 903.157894736842 261.454545454545 L 1008.421052631579 303.636363636364" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="419.636363636364" width="568.421052631579" height="200.363636363636" rx="10.535880821697" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="324.210526315789" y="451.272727272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.857409314715" font-weight="bold" fill="var(--text)">Lineage uses</text>
  <text x="61.052631578947" y="480.8" font-family="Arial, sans-serif" font-size="13.696645068206" fill="var(--text-muted)">Impact analysis: who breaks if I change?</text>
  <text x="61.052631578947" y="504" font-family="Arial, sans-serif" font-size="13.696645068206" fill="var(--text-muted)">Root cause: which source is wrong?</text>
  <text x="61.052631578947" y="527.2" font-family="Arial, sans-serif" font-size="13.696645068206" fill="var(--text-muted)">Compliance audits: where did this come from?</text>
  <text x="61.052631578947" y="550.4" font-family="Arial, sans-serif" font-size="13.696645068206" fill="var(--text-muted)">Cost attribution: per dataset</text>
  <text x="61.052631578947" y="583.090909090909" font-family="Arial, sans-serif" font-size="13.696645068206" font-weight="bold" fill="var(--ok-accent)">Captured automatically by tooling</text>

  <rect x="650.526315789474" y="419.636363636364" width="568.421052631579" height="200.363636363636" rx="10.535880821697" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="934.736842105263" y="451.272727272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.857409314715" font-weight="bold" fill="var(--text)">Quality checks per node</text>
  <text x="671.578947368421" y="480.8" font-family="Arial, sans-serif" font-size="13.696645068206" fill="var(--text-muted)">not-null on critical columns</text>
  <text x="671.578947368421" y="504" font-family="Arial, sans-serif" font-size="13.696645068206" fill="var(--text-muted)">uniqueness on keys</text>
  <text x="671.578947368421" y="527.2" font-family="Arial, sans-serif" font-size="13.696645068206" fill="var(--text-muted)">range checks on metrics</text>
  <text x="671.578947368421" y="550.4" font-family="Arial, sans-serif" font-size="13.696645068206" fill="var(--text-muted)">referential integrity</text>
  <text x="671.578947368421" y="583.090909090909" font-family="Arial, sans-serif" font-size="13.696645068206" font-weight="bold" fill="var(--danger-accent)">Block downstream on critical fail</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.762697824931" font-weight="bold" fill="var(--text)">Snapshots and Time Travel</text>

  <line x1="40" y1="187.636363636364" x2="1240" y2="187.636363636364" stroke="var(--text)" stroke-width="2"/>

  <rect x="61.428571428571" y="156" width="128.571428571429" height="63.272727272727" rx="8.50362794998" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="125.714285714286" y="182.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.818395418718" font-weight="bold" fill="var(--info-text)">v1</text>
  <text x="125.714285714286" y="205.563636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.692488431223" fill="var(--info-text)">10:00</text>

  <rect x="254.285714285714" y="156" width="128.571428571429" height="63.272727272727" rx="8.50362794998" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="318.571428571429" y="182.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.818395418718" font-weight="bold" fill="var(--info-text)">v2</text>
  <text x="318.571428571429" y="205.563636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.692488431223" fill="var(--info-text)">10:15 +rows</text>

  <rect x="447.142857142857" y="156" width="128.571428571429" height="63.272727272727" rx="8.50362794998" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="511.428571428571" y="182.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.818395418718" font-weight="bold" fill="var(--info-text)">v3</text>
  <text x="511.428571428571" y="205.563636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.692488431223" fill="var(--info-text)">10:30 schema</text>

  <rect x="640" y="156" width="128.571428571429" height="63.272727272727" rx="8.50362794998" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="704.285714285714" y="182.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.818395418718" font-weight="bold" fill="var(--info-text)">v4</text>
  <text x="704.285714285714" y="205.563636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.692488431223" fill="var(--info-text)">11:00 update</text>

  <rect x="832.857142857143" y="156" width="128.571428571429" height="63.272727272727" rx="8.50362794998" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="897.142857142857" y="182.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.818395418718" font-weight="bold" fill="var(--warn-text)">v5</text>
  <text x="897.142857142857" y="205.563636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.692488431223" fill="var(--warn-text)">11:30 BAD</text>

  <rect x="1025.714285714286" y="156" width="128.571428571429" height="63.272727272727" rx="8.50362794998" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="182.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.818395418718" font-weight="bold" fill="var(--ok-text)">v6 (current)</text>
  <text x="1090" y="205.563636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.692488431223" fill="var(--ok-text)">12:00 fixed</text>

  <text x="640" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.007255899961" font-weight="bold" fill="var(--text)">Each commit creates an immutable snapshot</text>

  <rect x="40" y="314.181818181818" width="578.571428571429" height="126.545454545455" rx="10.629534937476" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="329.285714285714" y="345.818181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.007255899961" font-weight="bold" fill="var(--primary-text)">Read as-of v3</text>
  <text x="329.285714285714" y="377.454545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.818395418718" fill="var(--primary-text)">SELECT * FROM t VERSION AS OF 3</text>
  <text x="329.285714285714" y="403.818181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.818395418718" fill="var(--primary-text)">reproduces past results</text>
  <text x="329.285714285714" y="424.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.818395418718" fill="var(--primary-text)">audits, debugging, recovery</text>

  <rect x="661.428571428571" y="314.181818181818" width="578.571428571429" height="126.545454545455" rx="10.629534937476" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950.714285714286" y="345.818181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.007255899961" font-weight="bold" fill="var(--ok-text)">Restore from v4</text>
  <text x="950.714285714286" y="377.454545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.818395418718" fill="var(--ok-text)">RESTORE TABLE t TO VERSION 4</text>
  <text x="950.714285714286" y="403.818181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.818395418718" fill="var(--ok-text)">undo the bad commit</text>
  <text x="950.714285714286" y="424.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.818395418718" fill="var(--ok-text)">no full reload needed</text>

  <rect x="40" y="482.909090909091" width="1200" height="137.090909090909" rx="10.629534937476" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="514.545454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.007255899961" font-weight="bold" fill="var(--text)">Bounded by retention</text>
  <text x="640" y="544.072727272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.881348912466" fill="var(--text-muted)">Older snapshots vacuumed to reclaim cost</text>
  <text x="640" y="569.381818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.881348912466" fill="var(--text-muted)">Default 7-30 days; tune to compliance and storage budget</text>
  <text x="640" y="598.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.818395418718" fill="var(--text-muted)">Compaction merges files without losing history</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.495762407505" font-weight="bold" fill="var(--text)">Medallion: Bronze, Silver, Gold</text>

  <rect x="40" y="102.142857142857" width="364.285714285714" height="186.428571428571" rx="10.534200859823" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="222.142857142857" y="143.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.175241891611" font-weight="bold" fill="var(--warn-text)">Bronze</text>
  <text x="222.142857142857" y="179.821428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--warn-text)">raw landing</text>
  <text x="222.142857142857" y="210.892857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--warn-text)">append-only</text>
  <text x="222.142857142857" y="234.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--warn-text)">minimal transform</text>
  <text x="222.142857142857" y="258.535714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--warn-text)">lineage to source</text>

  <rect x="457.857142857143" y="102.142857142857" width="364.285714285714" height="186.428571428571" rx="10.534200859823" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="143.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.175241891611" font-weight="bold" fill="var(--info-text)">Silver</text>
  <text x="640" y="179.821428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--info-text)">cleaned &amp; conformed</text>
  <text x="640" y="210.892857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--info-text)">schema enforced</text>
  <text x="640" y="234.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--info-text)">quality checked</text>
  <text x="640" y="258.535714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--info-text)">joined &amp; deduplicated</text>

  <rect x="875.714285714286" y="102.142857142857" width="364.285714285714" height="186.428571428571" rx="10.534200859823" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1057.857142857143" y="143.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.175241891611" font-weight="bold" fill="var(--ok-text)">Gold</text>
  <text x="1057.857142857143" y="179.821428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--ok-text)">business-ready</text>
  <text x="1057.857142857143" y="210.892857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--ok-text)">aggregated</text>
  <text x="1057.857142857143" y="234.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--ok-text)">domain models</text>
  <text x="1057.857142857143" y="258.535714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--ok-text)">tuned for queries</text>

  <path d="M 404.285714285714 195.357142857143 L 457.857142857143 195.357142857143" fill="none" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 822.142857142857 195.357142857143 L 875.714285714286 195.357142857143" fill="none" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="40" y="330" width="364.285714285714" height="82.857142857143" rx="8.427360687859" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="222.142857142857" y="361.071428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" font-weight="bold" fill="var(--text)">Source of truth</text>
  <text x="222.142857142857" y="386.964285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text-muted)">raw history, replayable</text>
  <text x="222.142857142857" y="407.678571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text-muted)">never throw away</text>

  <rect x="457.857142857143" y="330" width="364.285714285714" height="82.857142857143" rx="8.427360687859" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="361.071428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" font-weight="bold" fill="var(--text)">Consumer-friendly</text>
  <text x="640" y="386.964285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text-muted)">data scientists work here</text>
  <text x="640" y="407.678571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text-muted)">stable contracts</text>

  <rect x="875.714285714286" y="330" width="364.285714285714" height="82.857142857143" rx="8.427360687859" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1057.857142857143" y="361.071428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" font-weight="bold" fill="var(--text)">BI &amp; dashboards</text>
  <text x="1057.857142857143" y="386.964285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" font-weight="bold" fill="var(--text)">executives see this</text>
  <text x="1057.857142857143" y="407.678571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text-muted)">tight SLAs</text>

  <rect x="40" y="454.285714285714" width="1200" height="165.714285714286" rx="10.534200859823" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="490.535714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.961561547682" font-weight="bold" fill="var(--primary-text)">Layered build, separate SLAs per layer</text>
  <text x="640" y="521.607142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--primary-text)">Bronze: hourly arrivals tolerated</text>
  <text x="640" y="547.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--primary-text)">Silver: daily refresh, schema strict</text>
  <text x="640" y="573.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--primary-text)">Gold: tied to business KPI deadlines</text>
  <text x="640" y="604.464285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--primary-text)">Each layer reproducible from the layer below</text>
</svg>

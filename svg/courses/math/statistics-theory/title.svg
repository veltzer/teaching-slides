<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>

  <text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">Statistical Theory</text>
  <text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">probability, estimation, and the mathematics of inference</text>

  <!-- the central limit theorem: skewed samples, Gaussian limit -->
  <line x1="220" y1="500" x2="660" y2="500" stroke="var(--surface)" stroke-width="2"/>
  <line x1="220" y1="230" x2="220" y2="500" stroke="var(--surface)" stroke-width="2"/>
  <!-- skewed population (faint) -->
  <path d="M230,495 C260,290 300,250 360,300 C440,360 540,470 650,492" fill="none" stroke="var(--text-faint)" stroke-width="3" stroke-dasharray="6 6"/>
  <!-- normal limit (solid) -->
  <path d="M230,490 C360,490 380,250 440,250 C500,250 520,490 650,492" fill="none" stroke="var(--ok-fill)" stroke-width="4"/>

  <!-- likelihood curve with peak at the MLE -->
  <line x1="760" y1="500" x2="1060" y2="500" stroke="var(--surface)" stroke-width="2"/>
  <line x1="760" y1="230" x2="760" y2="500" stroke="var(--surface)" stroke-width="2"/>
  <path d="M770,495 C850,490 880,270 910,270 C940,270 970,490 1050,495" fill="none" stroke="var(--primary-fill)" stroke-width="4"/>
  <line x1="910" y1="270" x2="910" y2="500" stroke="var(--surface)" stroke-width="2" stroke-dasharray="5 5"/>
  <ellipse cx="910" cy="270" rx="9" ry="9" fill="var(--primary-fill)"/>

  <!-- abstract symbols -->
  <text x="270" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--surface)">(&#937;, F, P)</text>
  <text x="640" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">measure &#183; random variables &#183; expectation &#183; convergence &#183; LLN/CLT &#183; sufficiency &#183; MLE &#183; Neyman&#8211;Pearson &#183; linear models</text>
  <text x="1010" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--surface)">E[X], I(&#952;)</text>
</svg>

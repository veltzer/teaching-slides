<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="intro">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>

  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>

  <text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">Statistical Theory</text>
  <text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">probability, estimation, and the mathematics of inference</text>

  <!-- the central limit theorem: skewed samples, Gaussian limit -->
  <line x1="220" y1="500" x2="660" y2="500" stroke="var(--surface)" stroke-width="2"/>
  <line x1="220" y1="230" x2="220" y2="500" stroke="var(--surface)" stroke-width="2"/>
  <!-- skewed population (faint) -->
  <path d="M230,495 C260,290 300,250 360,300 C440,360 540,470 650,492" fill="none" stroke="var(--text-faint)" stroke-width="3" stroke-dasharray="6 6"/>
  <!-- normal limit (solid) -->
  <path d="M230,490 C360,490 380,250 440,250 C500,250 520,490 650,492" fill="none" stroke="var(--ok-fill)" stroke-width="4"/>

  <!-- likelihood curve with peak at the MLE -->
  <line x1="760" y1="500" x2="1060" y2="500" stroke="var(--surface)" stroke-width="2"/>
  <line x1="760" y1="230" x2="760" y2="500" stroke="var(--surface)" stroke-width="2"/>
  <path d="M770,495 C850,490 880,270 910,270 C940,270 970,490 1050,495" fill="none" stroke="var(--primary-fill)" stroke-width="4"/>
  <line x1="910" y1="270" x2="910" y2="500" stroke="var(--surface)" stroke-width="2" stroke-dasharray="5 5"/>
  <ellipse cx="910" cy="270" rx="9" ry="9" fill="var(--primary-fill)"/>

  <!-- abstract symbols -->
  <text x="270" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--surface)">(Ω, F, P)</text>
  <text x="640" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">measure · random variables · expectation · convergence · LLN/CLT · sufficiency · MLE · Neyman–Pearson · linear models</text>
  <text x="1010" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--surface)">E[X], I(θ)</text>
</svg>

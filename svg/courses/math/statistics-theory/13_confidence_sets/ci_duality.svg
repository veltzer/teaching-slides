  <text x="900" y="286.371681415929" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--ok-accent)">9 of 10 cover</text>
  <text x="900" y="306.902654867257" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--ok-accent)">≈ nominal 95%</text>

  <rect x="40" y="578.938053097345" width="1200" height="41.061946902655" rx="6.079124296508" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="607.681415929204" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.197810741269" font-weight="bold" fill="var(--info-text)">Duality: 95% CI for θ = set of θ₀ that a level-0.05 test would NOT reject</text>
</svg>

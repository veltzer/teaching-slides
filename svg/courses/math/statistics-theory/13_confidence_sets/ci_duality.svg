  <text x="640" y="75.929203539823" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.21099812402" font-weight="bold" fill="var(--danger-accent)">true θ</text>
  <text x="640" y="573.805309734513" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--text-muted)">parameter axis</text>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.316497186031" font-weight="bold" fill="var(--text)">Six distributions, six shapes, six stories</text>

  <rect x="40" y="81.061946902655" width="385" height="261.769911504425" rx="6.079124296508" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="232" y="111.858407079646" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.224185506772" font-weight="bold" fill="var(--primary-text)">Bernoulli / Binomial</text>
  <line x1="80" y1="291.504424778761" x2="385" y2="291.504424778761" stroke="var(--primary-text)" stroke-width="2"/>
  <rect x="100" y="276.106194690266" width="22" height="15.398230088496" fill="var(--primary-text)"/>
  <rect x="135" y="255.575221238938" width="22" height="35.929203539823" fill="var(--primary-text)"/>
  <rect x="170" y="224.778761061947" width="22" height="66.725663716814" fill="var(--primary-text)"/>
  <rect x="205" y="188.849557522124" width="22" height="102.654867256637" fill="var(--primary-text)"/>
  <rect x="240" y="168.318584070796" width="22" height="123.185840707965" fill="var(--primary-text)"/>
  <rect x="275" y="209.380530973451" width="22" height="82.12389380531" fill="var(--primary-text)"/>
  <rect x="310" y="245.309734513274" width="22" height="46.194690265487" fill="var(--primary-text)"/>
  <rect x="345" y="270.973451327434" width="22" height="20.530973451327" fill="var(--primary-text)"/>
  <text x="232" y="327.433628318584" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--primary-text)">counts of successes in n trials</text>

  <rect x="447" y="81.061946902655" width="386" height="261.769911504425" rx="6.079124296508" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="111.858407079646" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.224185506772" font-weight="bold" fill="var(--ok-text)">Poisson</text>
  <line x1="487" y1="291.504424778761" x2="833" y2="291.504424778761" stroke="var(--ok-text)" stroke-width="2"/>
  <rect x="505" y="178.58407079646" width="22" height="112.920353982301" fill="var(--ok-text)"/>
  <rect x="540" y="158.053097345133" width="22" height="133.451327433628" fill="var(--ok-text)"/>
  <rect x="575" y="188.849557522124" width="22" height="102.654867256637" fill="var(--ok-text)"/>
  <rect x="610" y="214.513274336283" width="22" height="76.991150442478" fill="var(--ok-text)"/>
  <rect x="645" y="235.044247787611" width="22" height="56.46017699115" fill="var(--ok-text)"/>
  <rect x="680" y="255.575221238938" width="22" height="35.929203539823" fill="var(--ok-text)"/>
  <rect x="715" y="268.920353982301" width="22" height="22.58407079646" fill="var(--ok-text)"/>
  <rect x="750" y="279.185840707965" width="22" height="12.318584070796" fill="var(--ok-text)"/>
  <rect x="785" y="284.318584070796" width="22" height="7.185840707965" fill="var(--ok-text)"/>
  <text x="640" y="327.433628318584" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--ok-text)">rare-event counts (rate λ)</text>

  <rect x="855" y="81.061946902655" width="385" height="261.769911504425" rx="6.079124296508" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1047" y="111.858407079646" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.224185506772" font-weight="bold" fill="var(--warn-text)">Geometric / Negative binomial</text>
  <line x1="895" y1="291.504424778761" x2="1240" y2="291.504424778761" stroke="var(--warn-text)" stroke-width="2"/>
  <rect x="910" y="158.053097345133" width="28" height="133.451327433628" fill="var(--warn-text)"/>
  <rect x="950" y="199.115044247788" width="28" height="92.389380530973" fill="var(--warn-text)"/>
  <rect x="990" y="226.83185840708" width="28" height="64.672566371681" fill="var(--warn-text)"/>
  <rect x="1030" y="248.389380530973" width="28" height="43.115044247788" fill="var(--warn-text)"/>
  <rect x="1070" y="262.761061946903" width="28" height="28.743362831858" fill="var(--warn-text)"/>
  <rect x="1110" y="273.026548672566" width="28" height="18.477876106195" fill="var(--warn-text)"/>
  <rect x="1150" y="279.185840707965" width="28" height="12.318584070796" fill="var(--warn-text)"/>
  <rect x="1190" y="284.318584070796" width="28" height="7.185840707965" fill="var(--warn-text)"/>
  <text x="1047" y="327.433628318584" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--warn-text)">trials until first success</text>

  <rect x="40" y="363.362831858407" width="385" height="256.637168141593" rx="6.079124296508" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="232" y="394.159292035398" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.224185506772" font-weight="bold" fill="var(--info-text)">Normal (Gaussian)</text>
  <line x1="80" y1="563.53982300885" x2="385" y2="563.53982300885" stroke="var(--info-text)" stroke-width="2"/>
  <path d="M 80 563.53982300885 Q 140 560.46017699115 175 532.743362831858 Q 215 476.283185840708 232 424.955752212389 Q 250 476.283185840708 290 532.743362831858 Q 325 560.46017699115 385 563.53982300885 Z" fill="var(--info-text)" fill-opacity="0.6"/>
  <text x="232" y="599.469026548673" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--info-text)">the limit shape (CLT) — bell curve</text>

  <rect x="447" y="363.362831858407" width="386" height="256.637168141593" rx="6.079124296508" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="394.159292035398" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.224185506772" font-weight="bold" fill="var(--danger-text)">Exponential / Gamma</text>
  <line x1="487" y1="563.53982300885" x2="833" y2="563.53982300885" stroke="var(--danger-text)" stroke-width="2"/>
  <path d="M 487 424.955752212389 Q 530 455.752212389381 580 507.079646017699 Q 640 548.141592920354 720 560.46017699115 Q 780 563.53982300885 833 563.53982300885" fill="none" stroke="var(--danger-text)" stroke-width="3"/>
  <path d="M 487 424.955752212389 Q 530 455.752212389381 580 507.079646017699 Q 640 548.141592920354 720 560.46017699115 Q 780 563.53982300885 833 563.53982300885 L 833 563.53982300885 L 487 563.53982300885 Z" fill="var(--danger-text)" fill-opacity="0.4"/>
  <text x="640" y="599.469026548673" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--danger-text)">waiting times — memoryless tails</text>

  <rect x="855" y="363.362831858407" width="385" height="256.637168141593" rx="6.079124296508" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1047" y="394.159292035398" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.224185506772" font-weight="bold" fill="var(--text)">Beta / Uniform</text>
  <line x1="895" y1="563.53982300885" x2="1240" y2="563.53982300885" stroke="var(--text)" stroke-width="2"/>
  <path d="M 895 563.53982300885 Q 920 563.53982300885 950 476.283185840708 Q 1000 404.424778761062 1047 399.29203539823 Q 1100 404.424778761062 1145 476.283185840708 Q 1180 563.53982300885 1240 563.53982300885 Z" fill="var(--text-muted)" fill-opacity="0.4" stroke="var(--text-muted)" stroke-width="2"/>
  <text x="1047" y="599.469026548673" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--text-muted)">supports on [0, 1] — priors on probabilities</text>
</svg>

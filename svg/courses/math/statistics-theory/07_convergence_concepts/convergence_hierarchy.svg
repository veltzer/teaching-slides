<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="632.405063291139" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.46991509399" font-weight="bold" fill="var(--text)">Convergence modes: strict hierarchy</text>

  <rect x="40" y="86.194690265487" width="273.417721518987" height="184.778761061947" rx="6.117478773497" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="176.708860759494" y="122.12389380531" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.372016116075" font-weight="bold" fill="var(--danger-text)">Almost sure</text>
  <text x="176.708860759494" y="152.920353982301" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.293696933744" fill="var(--danger-text)">Xₙ → X a.s.</text>
  <text x="176.708860759494" y="188.849557522124" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.274117138161" fill="var(--danger-text)">P(Xₙ → X) = 1</text>
  <text x="176.708860759494" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.274117138161" font-style="italic" fill="var(--danger-text)">strongest — SLLN</text>

  <rect x="384.303797468354" y="86.194690265487" width="273.417721518987" height="184.778761061947" rx="6.117478773497" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="521.012658227848" y="122.12389380531" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.372016116075" font-weight="bold" fill="var(--warn-text)">Lᵡ / mean-square</text>
  <text x="521.012658227848" y="152.920353982301" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.293696933744" fill="var(--warn-text)">Xₙ → X in Lᵢ</text>
  <text x="521.012658227848" y="188.849557522124" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.274117138161" fill="var(--warn-text)">E[|Xₙ − X|ᵢ] → 0</text>
  <text x="521.012658227848" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.274117138161" font-style="italic" fill="var(--warn-text)">controls moments, not paths</text>

  <rect x="728.607594936709" y="86.194690265487" width="273.417721518987" height="184.778761061947" rx="6.117478773497" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="865.316455696203" y="122.12389380531" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.372016116075" font-weight="bold" fill="var(--primary-text)">In probability</text>
  <text x="865.316455696203" y="152.920353982301" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.293696933744" fill="var(--primary-text)">Xₙ → X in P</text>
  <text x="865.316455696203" y="188.849557522124" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.274117138161" fill="var(--primary-text)">P(|Xₙ − X| &gt; ε) → 0</text>
  <text x="865.316455696203" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.274117138161" font-style="italic" fill="var(--primary-text)">WLLN — weaker than a.s.</text>

  <rect x="971.645569620253" y="312.035398230089" width="268.354430379747" height="184.778761061947" rx="6.117478773497" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1105.316455696202" y="347.964601769912" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.372016116075" font-weight="bold" fill="var(--info-text)">In distribution</text>
  <text x="1105.316455696202" y="378.761061946903" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.293696933744" fill="var(--info-text)">Xₙ ➝ X</text>
  <text x="1105.316455696202" y="414.690265486726" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.274117138161" fill="var(--info-text)">Fₙ(x) → F(x)</text>
  <text x="1105.316455696202" y="450.619469026549" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.274117138161" fill="var(--info-text)">at continuity points</text>
  <text x="1105.316455696202" y="486.548672566372" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.274117138161" font-style="italic" fill="var(--info-text)">weakest — CLT lives here</text>

  <line x1="313.417721518987" y1="178.58407079646" x2="384.303797468354" y2="178.58407079646" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="657.721518987342" y1="178.58407079646" x2="728.607594936709" y2="178.58407079646" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="865.316455696203" y1="270.973451327434" x2="986.835443037975" y2="373.628318584071" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="348.860759493671" y="168.318584070796" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.234957546995" fill="var(--text-muted)">implies</text>
  <text x="693.164556962025" y="168.318584070796" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.234957546995" fill="var(--text-muted)">implies</text>

  <rect x="40" y="312.035398230089" width="617.721518987342" height="184.778761061947" rx="6.117478773497" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="348.860759493671" y="353.097345132743" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.352436320492" font-weight="bold" fill="var(--ok-text)">Counter-examples matter</text>
  <text x="348.860759493671" y="389.026548672566" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.293696933744" fill="var(--ok-text)">In P does NOT imply a.s.</text>
  <text x="348.860759493671" y="419.823008849558" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.293696933744" fill="var(--ok-text)">"typewriter" wanders forever</text>
  <text x="348.860759493671" y="450.619469026549" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.293696933744" fill="var(--ok-text)">yet mass shrinks to zero</text>
  <text x="348.860759493671" y="481.41592920354" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.274117138161" font-style="italic" fill="var(--ok-text)">all four modes differ</text>

  <rect x="40" y="537.87610619469" width="1200" height="82.12389380531" rx="6.117478773497" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="632.405063291139" y="573.805309734513" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.293696933744" font-weight="bold" fill="var(--text)">a.s. ⇒ in P ⇒ in distribution  ·  Lᵡ ⇒ in P  ·  reverse needs UI</text>
  <text x="632.405063291139" y="604.601769911504" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.254537342578" font-style="italic" fill="var(--text-muted)">picking the mode is half the work</text>
</svg>

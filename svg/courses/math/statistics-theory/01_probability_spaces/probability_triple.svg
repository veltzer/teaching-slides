<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.821872493111" font-weight="bold" fill="var(--text)">The probability triple (Ω, F, P)</text>

  <rect x="40" y="82.56880733945" width="380" height="457.614678899083" rx="6.189662883026" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="135.779816513761" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.885093454119" font-weight="bold" fill="var(--primary-text)">Ω</text>
  <text x="230" y="173.02752293578" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.632209610085" font-weight="bold" fill="var(--primary-text)">sample space</text>
  <text x="230" y="220.917431192661" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.505767688068" fill="var(--primary-text)">set of all outcomes ω</text>
  <text x="230" y="274.128440366972" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.474157207564" fill="var(--primary-text)">coin: {H, T}</text>
  <text x="230" y="306.05504587156" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.474157207564" fill="var(--primary-text)">die: {1..6}</text>
  <text x="230" y="337.981651376147" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.474157207564" fill="var(--primary-text)">height: ℝ</text>
  <text x="230" y="444.403669724771" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" font-style="italic" fill="var(--primary-text)">"what could possibly happen"</text>

  <rect x="450" y="82.56880733945" width="380" height="457.614678899083" rx="6.189662883026" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="135.779816513761" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.885093454119" font-weight="bold" fill="var(--info-text)">F</text>
  <text x="640" y="173.02752293578" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.632209610085" font-weight="bold" fill="var(--info-text)">σ-algebra of events</text>
  <text x="640" y="220.917431192661" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.505767688068" fill="var(--info-text)">subsets we can measure</text>
  <text x="640" y="274.128440366972" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.474157207564" fill="var(--info-text)">contains Ω</text>
  <text x="640" y="306.05504587156" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.474157207564" fill="var(--info-text)">closed under complement</text>
  <text x="640" y="337.981651376147" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.474157207564" fill="var(--info-text)">closed under countable unions</text>
  <text x="640" y="385.871559633028" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.474157207564" fill="var(--info-text)">on ℝ: Borel sets B(ℝ)</text>
  <text x="640" y="444.403669724771" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" font-style="italic" fill="var(--info-text)">"questions we are allowed to ask"</text>

  <rect x="860" y="82.56880733945" width="380" height="457.614678899083" rx="6.189662883026" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="135.779816513761" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.885093454119" font-weight="bold" fill="var(--ok-text)">P</text>
  <text x="1050" y="173.02752293578" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.632209610085" font-weight="bold" fill="var(--ok-text)">probability measure</text>
  <text x="1050" y="220.917431192661" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.505767688068" fill="var(--ok-text)">P : F → [0, 1]</text>
  <text x="1050" y="274.128440366972" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.474157207564" fill="var(--ok-text)">(A1) P(A) ≥ 0</text>
  <text x="1050" y="306.05504587156" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.474157207564" fill="var(--ok-text)">(A2) P(Ω) = 1</text>
  <text x="1050" y="337.981651376147" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.474157207564" fill="var(--ok-text)">(A3) countable additivity</text>
  <text x="1050" y="385.871559633028" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.474157207564" fill="var(--ok-text)">on disjoint A₁, A₂, ...</text>
  <text x="1050" y="444.403669724771" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" font-style="italic" fill="var(--ok-text)">"how much weight each event gets"</text>

  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.474157207564" fill="var(--text-muted)">Kolmogorov (1933): three axioms; everything else is a theorem.</text>
</svg>

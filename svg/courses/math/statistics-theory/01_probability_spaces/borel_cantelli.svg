<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.316497186031" font-weight="bold" fill="var(--text)">Borel–Cantelli: a sharp 0–1 dichotomy</text>

  <rect x="40" y="86.194690265487" width="595" height="533.805309734513" rx="6.079124296508" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="337" y="127.256637168142" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.263747655025" font-weight="bold" fill="var(--ok-text)">Part 1 (no assumptions)</text>
  <text x="337" y="168.318584070796" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.237372889523" fill="var(--ok-text)">Σ P(Aₙ) &lt; ∞</text>

  <line x1="80" y1="445.486725663717" x2="595" y2="445.486725663717" stroke="var(--ok-text)" stroke-width="2"/>
  <line x1="80" y1="219.646017699115" x2="80" y2="445.486725663717" stroke="var(--ok-text)" stroke-width="2"/>
  <path d="M 80 240.176991150443 Q 150 270.973451327434 220 353.097345132743 Q 290 414.690265486726 380 435.221238938053 Q 470 443.433628318584 595 445.486725663717" fill="none" stroke="var(--ok-text)" stroke-width="3"/>
  <path d="M 80 240.176991150443 Q 150 270.973451327434 220 353.097345132743 Q 290 414.690265486726 380 435.221238938053 Q 470 443.433628318584 595 445.486725663717 L 595 445.486725663717 L 80 445.486725663717 Z" fill="var(--ok-text)" fill-opacity="0.35"/>
  <text x="337" y="471.150442477876" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--ok-text)">probabilities shrink fast enough</text>

  <text x="337" y="512.212389380531" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.263747655025" font-weight="bold" fill="var(--ok-text)">⇒ P(Aₙ infinitely often) = 0</text>
  <text x="337" y="553.274336283186" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--ok-text)">eventually Aₙ stops happening — almost surely</text>
  <text x="337" y="584.070796460177" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" font-style="italic" fill="var(--ok-text)">e.g. P(Aₙ) = 1/n² ⇒ finite total mass</text>
  <text x="337" y="609.734513274336" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" font-style="italic" fill="var(--ok-text)">Markov bound: a one-line proof</text>

  <rect x="655" y="86.194690265487" width="585" height="533.805309734513" rx="6.079124296508" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="947" y="127.256637168142" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.263747655025" font-weight="bold" fill="var(--danger-text)">Part 2 (needs independence)</text>
  <text x="947" y="168.318584070796" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.237372889523" fill="var(--danger-text)">Σ P(Aₙ) = ∞</text>

  <line x1="695" y1="445.486725663717" x2="1210" y2="445.486725663717" stroke="var(--danger-text)" stroke-width="2"/>
  <line x1="695" y1="219.646017699115" x2="695" y2="445.486725663717" stroke="var(--danger-text)" stroke-width="2"/>
  <path d="M 695 342.83185840708 Q 800 332.566371681416 900 312.035398230089 Q 1000 286.371681415929 1100 260.70796460177 Q 1170 245.309734513274 1210 240.176991150443" fill="none" stroke="var(--danger-text)" stroke-width="3"/>
  <path d="M 695 342.83185840708 Q 800 332.566371681416 900 312.035398230089 Q 1000 286.371681415929 1100 260.70796460177 Q 1170 245.309734513274 1210 240.176991150443 L 1210 445.486725663717 L 695 445.486725663717 Z" fill="var(--danger-text)" fill-opacity="0.35"/>
  <text x="947" y="471.150442477876" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--danger-text)">probabilities don't shrink fast enough</text>

  <text x="947" y="512.212389380531" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.263747655025" font-weight="bold" fill="var(--danger-text)">⇒ P(Aₙ infinitely often) = 1</text>
  <text x="947" y="553.274336283186" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--danger-text)">Aₙ keeps happening forever — almost surely</text>
  <text x="947" y="584.070796460177" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" font-style="italic" fill="var(--danger-text)">e.g. P(Aₙ) = 1/n ⇒ divergent series</text>
  <text x="947" y="609.734513274336" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" font-style="italic" fill="var(--danger-text)">independence is essential here</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.316497186031" font-weight="bold" fill="var(--text)">MLE: find θ that makes the data most plausible</text>

  <line x1="120" y1="507.079646017699" x2="1160" y2="507.079646017699" stroke="var(--text)" stroke-width="2"/>
  <line x1="120" y1="106.725663716814" x2="120" y2="507.079646017699" stroke="var(--text)" stroke-width="2"/>
  <text x="1170" y="532.743362831858" font-family="Arial, sans-serif" font-size="15.197810741269" font-weight="bold" fill="var(--text)">θ</text>
  <text x="105" y="101.592920353982" text-anchor="end" font-family="Arial, sans-serif" font-size="15.197810741269" font-weight="bold" fill="var(--text)">L(θ)</text>

  <path d="M 140 496.814159292035 Q 220 491.681415929204 290 466.017699115044 Q 360 424.955752212389 420 353.097345132743 Q 480 260.70796460177 550 183.716814159292 Q 620 132.389380530973 680 188.849557522124 Q 740 270.973451327434 790 353.097345132743 Q 850 424.955752212389 920 466.017699115044 Q 990 491.681415929204 1140 501.946902654867" fill="none" stroke="var(--primary-fill)" stroke-width="4"/>

  <line x1="640" y1="147.787610619469" x2="640" y2="507.079646017699" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="6 6"/>
  <ellipse cx="640" cy="147.787610619469" rx="11" ry="11.29203539823" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="132.389380530973" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.224185506772" font-weight="bold" fill="var(--primary-accent)">peak: θ̂ᵒ₄ᵀ</text>
  <text x="640" y="532.743362831858" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--text-muted)">θ̂ᵒ₄ᵀ</text>

  <line x1="450" y1="312.035398230089" x2="450" y2="507.079646017699" stroke="var(--text-faint)" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="830" y1="312.035398230089" x2="830" y2="507.079646017699" stroke="var(--text-faint)" stroke-width="1" stroke-dasharray="4 4"/>
  <ellipse cx="450" cy="312.035398230089" rx="6" ry="6.159292035398" fill="var(--warn-fill)"/>
  <ellipse cx="830" cy="312.035398230089" rx="6" ry="6.159292035398" fill="var(--warn-fill)"/>
  <text x="450" y="532.743362831858" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--text-muted)">other θ</text>
  <text x="830" y="532.743362831858" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--text-muted)">other θ</text>

  <rect x="40" y="553.274336283186" width="600" height="66.725663716814" rx="6.079124296508" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="584.070796460177" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.21099812402" font-weight="bold" fill="var(--primary-text)">L(θ) = ∏ᵢ f(xᵢ ; θ)     ℓ(θ) = ∑ᵢ log f(xᵢ ; θ)</text>
  <text x="340" y="607.681415929204" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" font-style="italic" fill="var(--primary-text)">work with the log — turns products into sums, avoids underflow</text>

  <rect x="660" y="553.274336283186" width="580" height="66.725663716814" rx="6.079124296508" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="584.070796460177" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.21099812402" font-weight="bold" fill="var(--ok-text)">Asymptotics: √n (θ̂ − θ) ➝ N(0, I(θ)⁻¹)</text>
  <text x="950" y="607.681415929204" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" font-style="italic" fill="var(--ok-text)">Fisher information — the variance you'd get if you knew θ</text>

  <text x="950" y="168.318584070796" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--text-muted)">• consistency: θ̂ → θ₀</text>
  <text x="950" y="197.061946902655" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--text-muted)">• asymptotic normal</text>
  <text x="950" y="225.805309734513" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--text-muted)">• asymptotic efficient</text>
  <text x="950" y="254.548672566372" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--text-muted)">• invariant: MLE of g(θ) is g(θ̂)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.534586728656" font-weight="bold" fill="var(--text)">LLN and CLT: two laws, one sample average</text>

  <rect x="40" y="87.027027027027" width="595" height="532.972972972973" rx="6.133646682164" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="337" y="123.603603603604" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.423214493519" font-weight="bold" fill="var(--primary-text)">Law of Large Numbers</text>
  <text x="337" y="154.954954954955" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.356391152437" fill="var(--primary-text)">X̄ₙ → μ    (a.s., or in P)</text>

  <line x1="90" y1="431.891891891892" x2="600" y2="431.891891891892" stroke="var(--primary-text)" stroke-width="2"/>
  <line x1="90" y1="212.432432432432" x2="90" y2="431.891891891892" stroke="var(--primary-text)" stroke-width="2"/>
  <line x1="90" y1="322.162162162162" x2="600" y2="322.162162162162" stroke="var(--primary-text)" stroke-width="1" stroke-dasharray="6 6"/>
  <text x="80" y="327.387387387387" text-anchor="end" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--primary-text)">μ</text>
  <text x="80" y="426.666666666667" text-anchor="end" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--primary-text)">0</text>
  <path d="M 95 233.333333333333 L 115 379.63963963964 L 135 285.585585585586 L 155 358.738738738739 L 175 301.261261261261 L 195 337.837837837838 L 215 314.846846846847 L 240 327.387387387387 L 270 319.027027027027 L 300 324.252252252252 L 340 322.162162162162 L 400 322.162162162162 L 460 322.162162162162 L 530 322.162162162162 L 600 322.162162162162" fill="none" stroke="var(--primary-text)" stroke-width="2"/>
  <text x="337" y="468.468468468468" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" font-style="italic" fill="var(--primary-text)">noisy at small n, locks onto μ eventually</text>
  <text x="337" y="515.495495495495" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--primary-text)">Weak: X̄ₙ → μ in probability</text>
  <text x="337" y="546.846846846847" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--primary-text)">Strong: X̄ₙ → μ almost surely</text>
  <text x="337" y="588.648648648649" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" font-weight="bold" fill="var(--primary-text)">tells you WHERE the average ends up</text>

  <rect x="655" y="87.027027027027" width="585" height="532.972972972973" rx="6.133646682164" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="947" y="123.603603603604" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.423214493519" font-weight="bold" fill="var(--ok-text)">Central Limit Theorem</text>
  <text x="947" y="154.954954954955" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.356391152437" fill="var(--ok-text)">√n (X̄ₙ − μ) ➝ N(0, σ²)</text>

  <line x1="700" y1="431.891891891892" x2="1210" y2="431.891891891892" stroke="var(--ok-text)" stroke-width="2"/>
  <line x1="700" y1="212.432432432432" x2="700" y2="431.891891891892" stroke="var(--ok-text)" stroke-width="2"/>
  <path d="M 700 431.891891891892 Q 770 426.666666666667 830 400.540540540541 Q 890 358.738738738739 947 228.108108108108 Q 1004 358.738738738739 1064 400.540540540541 Q 1124 426.666666666667 1210 431.891891891892 Z" fill="var(--ok-text)" fill-opacity="0.5" stroke="var(--ok-text)" stroke-width="2"/>
  <path d="M 730 431.891891891892 L 730 410.990990990991 L 770 410.990990990991 L 770 379.63963963964 L 810 379.63963963964 L 810 337.837837837838 L 850 337.837837837838 L 850 285.585585585586 L 890 285.585585585586 L 890 243.783783783784 L 947 238.558558558559 L 1004 243.783783783784 L 1004 285.585585585586 L 1044 285.585585585586 L 1044 337.837837837838 L 1084 337.837837837838 L 1084 379.63963963964 L 1124 379.63963963964 L 1124 410.990990990991 L 1164 410.990990990991 L 1164 431.891891891892" fill="none" stroke="var(--ok-text)" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="947" y="468.468468468468" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" font-style="italic" fill="var(--ok-text)">any starting distribution (with finite variance)</text>
  <text x="947" y="515.495495495495" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--ok-text)">scaled fluctuation converges to Gaussian</text>
  <text x="947" y="546.846846846847" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--ok-text)">SE shrinks at rate 1 / √n</text>
  <text x="947" y="588.648648648649" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" font-weight="bold" fill="var(--ok-text)">tells you HOW NOISY the average is</text>
</svg>

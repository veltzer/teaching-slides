<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.316497186031" font-weight="bold" fill="var(--text)">Bias, variance, MSE: how an estimator can be wrong</text>

  <ellipse cx="232" cy="229.911504424779" rx="160" ry="164.247787610619" fill="none" stroke="var(--text-muted)" stroke-width="2"/>
  <ellipse cx="232" cy="229.911504424779" rx="100" ry="102.654867256637" fill="none" stroke="var(--text-muted)" stroke-width="2"/>
  <ellipse cx="232" cy="229.911504424779" rx="45" ry="46.194690265487" fill="var(--ok-fill)" fill-opacity="0.25" stroke="var(--ok-border)" stroke-width="2"/>
  <ellipse cx="232" cy="229.911504424779" rx="8" ry="8.212389380531" fill="var(--ok-border)"/>
  <ellipse cx="228" cy="235.044247787611" rx="5" ry="5.132743362832" fill="var(--primary-fill)"/>
  <ellipse cx="240" cy="221.699115044248" rx="5" ry="5.132743362832" fill="var(--primary-fill)"/>
  <ellipse cx="220" cy="224.778761061947" rx="5" ry="5.132743362832" fill="var(--primary-fill)"/>
  <ellipse cx="237" cy="238.12389380531" rx="5" ry="5.132743362832" fill="var(--primary-fill)"/>
  <ellipse cx="225" cy="242.230088495575" rx="5" ry="5.132743362832" fill="var(--primary-fill)"/>
  <text x="232" y="86.194690265487" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.237372889523" font-weight="bold" fill="var(--text)">Low bias, low variance</text>
  <text x="232" y="414.690265486726" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--text-muted)">tight cluster on target</text>
  <text x="232" y="440.353982300885" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" font-style="italic" fill="var(--ok-accent)">the goal</text>

  <ellipse cx="640" cy="229.911504424779" rx="160" ry="164.247787610619" fill="none" stroke="var(--text-muted)" stroke-width="2"/>
  <ellipse cx="640" cy="229.911504424779" rx="100" ry="102.654867256637" fill="none" stroke="var(--text-muted)" stroke-width="2"/>
  <ellipse cx="640" cy="229.911504424779" rx="45" ry="46.194690265487" fill="var(--warn-fill)" fill-opacity="0.25" stroke="var(--warn-border)" stroke-width="2"/>
  <ellipse cx="640" cy="229.911504424779" rx="8" ry="8.212389380531" fill="var(--warn-border)"/>
  <ellipse cx="580" cy="188.849557522124" rx="5" ry="5.132743362832" fill="var(--primary-fill)"/>
  <ellipse cx="700" cy="270.973451327434" rx="5" ry="5.132743362832" fill="var(--primary-fill)"/>
  <ellipse cx="620" cy="281.238938053097" rx="5" ry="5.132743362832" fill="var(--primary-fill)"/>
  <ellipse cx="690" cy="199.115044247788" rx="5" ry="5.132743362832" fill="var(--primary-fill)"/>
  <ellipse cx="560" cy="250.442477876106" rx="5" ry="5.132743362832" fill="var(--primary-fill)"/>
  <text x="640" y="86.194690265487" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.237372889523" font-weight="bold" fill="var(--text)">Low bias, high variance</text>
  <text x="640" y="414.690265486726" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--text-muted)">centered, but scattered</text>
  <text x="640" y="440.353982300885" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" font-style="italic" fill="var(--warn-accent)">unbiased but noisy — need more n</text>

  <ellipse cx="1048" cy="229.911504424779" rx="160" ry="164.247787610619" fill="none" stroke="var(--text-muted)" stroke-width="2"/>
  <ellipse cx="1048" cy="229.911504424779" rx="100" ry="102.654867256637" fill="none" stroke="var(--text-muted)" stroke-width="2"/>
  <ellipse cx="1048" cy="229.911504424779" rx="45" ry="46.194690265487" fill="var(--danger-fill)" fill-opacity="0.25" stroke="var(--danger-border)" stroke-width="2"/>
  <ellipse cx="1048" cy="229.911504424779" rx="8" ry="8.212389380531" fill="var(--danger-border)"/>
  <ellipse cx="1130" cy="168.318584070796" rx="5" ry="5.132743362832" fill="var(--primary-fill)"/>
  <ellipse cx="1138" cy="178.58407079646" rx="5" ry="5.132743362832" fill="var(--primary-fill)"/>
  <ellipse cx="1125" cy="183.716814159292" rx="5" ry="5.132743362832" fill="var(--primary-fill)"/>
  <ellipse cx="1140" cy="163.185840707965" rx="5" ry="5.132743362832" fill="var(--primary-fill)"/>
  <ellipse cx="1132" cy="188.849557522124" rx="5" ry="5.132743362832" fill="var(--primary-fill)"/>
  <text x="1048" y="86.194690265487" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.237372889523" font-weight="bold" fill="var(--text)">High bias, low variance</text>
  <text x="1048" y="414.690265486726" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--text-muted)">tight cluster, but offset</text>
  <text x="1048" y="440.353982300885" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" font-style="italic" fill="var(--danger-accent)">consistently wrong</text>

  <rect x="40" y="471.150442477876" width="1200" height="148.849557522124" rx="6.079124296508" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="507.079646017699" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.263747655025" font-weight="bold" fill="var(--info-text)">MSE = Bias² + Variance</text>
  <text x="640" y="543.008849557522" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.197810741269" fill="var(--info-text)">E[(θ̂ − θ)²] = (E[θ̂] − θ)² + Var(θ̂)</text>
  <text x="640" y="578.938053097345" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--info-text)">unbiased is not the same as good — a biased estimator with much lower variance can win on MSE</text>
  <text x="640" y="604.601769911504" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" font-style="italic" fill="var(--info-text)">this trade is the whole story of regularization (ridge, lasso, shrinkage)</text>
</svg>

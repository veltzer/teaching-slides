<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.316497186031" font-weight="bold" fill="var(--text)">Bayes' theorem: turn the conditional around</text>

  <rect x="40" y="75.929203539823" width="540" height="205.309734513274" rx="6.079124296508" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="310" y="111.858407079646" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.237372889523" font-weight="bold" fill="var(--primary-text)">What you have</text>
  <text x="310" y="152.920353982301" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.224185506772" fill="var(--primary-text)">P(B | A) — the forward model</text>
  <text x="310" y="188.849557522124" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.197810741269" fill="var(--primary-text)">"if A is true, how often we see B"</text>
  <text x="310" y="229.911504424779" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.197810741269" fill="var(--primary-text)">P(A) — the prior on A</text>
  <text x="310" y="260.70796460177" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.197810741269" fill="var(--primary-text)">P(B) — total evidence</text>

  <rect x="700" y="75.929203539823" width="540" height="205.309734513274" rx="6.079124296508" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="970" y="111.858407079646" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.237372889523" font-weight="bold" fill="var(--ok-text)">What you want</text>
  <text x="970" y="152.920353982301" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.224185506772" fill="var(--ok-text)">P(A | B) — the inverse</text>
  <text x="970" y="188.849557522124" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.197810741269" fill="var(--ok-text)">"given evidence B, how likely is A"</text>
  <text x="970" y="235.044247787611" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" font-style="italic" fill="var(--ok-text)">the answer to the actual question</text>

  <line x1="580" y1="178.58407079646" x2="700" y2="178.58407079646" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="640" y="168.318584070796" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--text-muted)">Bayes</text>

  <rect x="160" y="322.300884955752" width="960" height="102.654867256637" rx="6.079124296508" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="363.362831858407" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.342871951533" font-weight="bold" fill="var(--info-text)">P(A | B) = P(B | A) · P(A) / P(B)</text>
  <text x="640" y="399.29203539823" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.197810741269" fill="var(--info-text)">posterior   =   likelihood × prior   /   marginal evidence</text>

  <rect x="40" y="466.017699115044" width="1200" height="153.982300884956" rx="6.079124296508" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="501.946902654867" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.224185506772" font-weight="bold" fill="var(--warn-text)">Classic trap: rare disease, accurate test</text>
  <text x="640" y="537.87610619469" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.197810741269" fill="var(--warn-text)">P(disease) = 0.001, P(positive | disease) = 0.99, P(positive | healthy) = 0.05</text>
  <text x="640" y="573.805309734513" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.197810741269" fill="var(--warn-text)">P(disease | positive) ≈ 0.99 × 0.001 / 0.051 ≈ 1.9%</text>
  <text x="640" y="604.601769911504" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" font-style="italic" fill="var(--warn-text)">forward and inverse differ by orders of magnitude when the prior is small</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.822117064936" fill="var(--text)" font-weight="bold">Five named traps to look out for</text>
  <rect x="40" y="127.547169811321" width="578.571428571429" height="82.075471698113" rx="8.662588023613" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="329.285714285714" y="164.207547169811" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.656470059033" font-weight="bold" fill="var(--danger-text)">p-hacking</text>
  <text x="329.285714285714" y="187.188679245283" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.076705538371" fill="var(--danger-text)">test 20 things; one will be 'significant' by chance</text>
  <rect x="661.428571428571" y="127.547169811321" width="578.571428571429" height="82.075471698113" rx="8.662588023613" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950.714285714286" y="164.207547169811" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.656470059033" font-weight="bold" fill="var(--danger-text)">multiple comparisons</text>
  <text x="950.714285714286" y="187.188679245283" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.076705538371" fill="var(--danger-text)">every extra metric is another lottery ticket</text>
  <rect x="40" y="242.452830188679" width="578.571428571429" height="82.075471698113" rx="8.662588023613" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="329.285714285714" y="279.11320754717" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.656470059033" font-weight="bold" fill="var(--warn-text)">Simpson's paradox</text>
  <text x="329.285714285714" y="302.094339622641" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.076705538371" fill="var(--warn-text)">subgroup pattern reverses when pooled</text>
  <rect x="661.428571428571" y="242.452830188679" width="578.571428571429" height="82.075471698113" rx="8.662588023613" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950.714285714286" y="279.11320754717" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.656470059033" font-weight="bold" fill="var(--warn-text)">survivorship bias</text>
  <text x="950.714285714286" y="302.094339622641" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.076705538371" fill="var(--warn-text)">you only see the units that made it</text>
  <rect x="40" y="357.358490566038" width="578.571428571429" height="82.075471698113" rx="8.662588023613" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="329.285714285714" y="394.018867924528" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.656470059033" font-weight="bold" fill="var(--info-text)">regression to the mean</text>
  <text x="329.285714285714" y="417" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.076705538371" fill="var(--info-text)">extreme → less extreme, by chance alone</text>
  <rect x="661.428571428571" y="357.358490566038" width="578.571428571429" height="82.075471698113" rx="8.662588023613" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950.714285714286" y="394.018867924528" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.656470059033" font-weight="bold" fill="var(--primary-text)">Goodhart's law</text>
  <text x="950.714285714286" y="417" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.076705538371" fill="var(--primary-text)">metric becomes target → metric stops measuring</text>
  <rect x="40" y="510.566037735849" width="1200" height="109.433962264151" rx="8.662588023613" fill="var(--code-bg)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="548.867924528302" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.49082305313" fill="var(--surface)" font-weight="bold">name the trap to spot the trap</text>
  <text x="640" y="587.169811320755" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.159529041323" fill="var(--text-faint)" font-style="italic">knowing what to call them is half the defense</text>
</svg>

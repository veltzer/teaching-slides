<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="611.428571428571" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.330726682938" fill="var(--text)" font-weight="bold">Peeking ruins the false-positive rate</text>
  <line x1="40" y1="573.6" x2="1228.571428571428" y2="573.6" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="40" y1="132.8" x2="40" y2="573.6" stroke="var(--text-muted)" stroke-width="2"/>
  <text x="611.428571428571" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.119553343688" fill="var(--text-muted)">number of times you 'check' the p-value</text>
  <rect x="131.428571428571" y="544.6" width="114.285714285714" height="29" rx="4.605586669625" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="188.571428571429" y="596.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.119553343688" fill="var(--text)">1</text>
  <text x="188.571428571429" y="535.32" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.968156676282" fill="var(--text)" font-weight="bold">~4%</text>
  <rect x="314.285714285714" y="486.6" width="114.285714285714" height="87" rx="4.605586669625" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="371.428571428571" y="596.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.119553343688" fill="var(--text)">5</text>
  <text x="371.428571428571" y="477.32" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.968156676282" fill="var(--text)" font-weight="bold">~12%</text>
  <rect x="497.142857142857" y="446" width="114.285714285714" height="127.6" rx="4.605586669625" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="554.285714285714" y="596.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.119553343688" fill="var(--text)">10</text>
  <text x="554.285714285714" y="436.72" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.968156676282" fill="var(--text)" font-weight="bold">~18%</text>
  <rect x="680" y="405.4" width="114.285714285714" height="168.2" rx="4.605586669625" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="737.142857142857" y="596.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.119553343688" fill="var(--text)">20</text>
  <text x="737.142857142857" y="396.12" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.968156676282" fill="var(--text)" font-weight="bold">~24%</text>
  <rect x="862.857142857143" y="347.4" width="114.285714285714" height="226.2" rx="4.605586669625" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="920" y="596.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.119553343688" fill="var(--text)">50</text>
  <text x="920" y="338.12" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.968156676282" fill="var(--text)" font-weight="bold">~32%</text>
  <rect x="1045.714285714286" y="289.4" width="114.285714285714" height="284.2" rx="4.605586669625" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="1102.857142857143" y="596.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.119553343688" fill="var(--text)">100</text>
  <text x="1102.857142857143" y="280.12" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.968156676282" fill="var(--text)" font-weight="bold">~41%</text>
  <line x1="40" y1="538.8" x2="1228.571428571428" y2="538.8" stroke="var(--ok-fill)" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="1240" y="543.44" text-anchor="end" font-family="Arial, sans-serif" font-size="14.968156676282" fill="var(--ok-fill)">nominal α = 5%</text>
  <text x="611.428571428571" y="179.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.725140013313" fill="var(--text)" font-weight="bold">real Type I error rate ↑ with each peek</text>
  <text x="611.428571428571" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.119553343688" fill="var(--text-muted)" font-style="italic">→ pre-register the sample size, or use a sequential test</text>
</svg>

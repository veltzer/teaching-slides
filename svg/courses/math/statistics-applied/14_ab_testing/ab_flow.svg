<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="626.899563318777" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.560614993904" fill="var(--text)" font-weight="bold">An A/B test, end to end</text>
  <rect x="40" y="215.094339622641" width="178.165938864629" height="120.377358490566" rx="8.56749636142" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="129.082969432314" y="264.339622641509" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.064055677662" fill="var(--primary-text)" font-weight="bold">define metric +</text>
  <text x="129.082969432314" y="297.169811320755" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.922181587307" fill="var(--primary-text)">MDE</text>
  <rect x="244.366812227074" y="215.094339622641" width="178.165938864629" height="120.377358490566" rx="8.56749636142" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="333.449781659389" y="264.339622641509" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.064055677662" fill="var(--info-text)" font-weight="bold">power calc </text>
  <text x="333.449781659389" y="297.169811320755" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.922181587307" fill="var(--info-text)">arr; sample size</text>
  <rect x="448.733624454148" y="215.094339622641" width="178.165938864629" height="120.377358490566" rx="8.56749636142" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="537.816593886463" y="264.339622641509" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.064055677662" fill="var(--info-text)" font-weight="bold">randomize</text>
  <text x="537.816593886463" y="297.169811320755" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.922181587307" fill="var(--info-text)">A / B</text>
  <rect x="653.100436681223" y="215.094339622641" width="178.165938864629" height="120.377358490566" rx="8.56749636142" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="742.183406113537" y="264.339622641509" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.064055677662" fill="var(--warn-text)" font-weight="bold">run for the</text>
  <text x="742.183406113537" y="297.169811320755" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.922181587307" fill="var(--warn-text)">planned window</text>
  <rect x="857.467248908297" y="215.094339622641" width="178.165938864629" height="120.377358490566" rx="8.56749636142" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="946.550218340611" y="264.339622641509" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.064055677662" fill="var(--ok-text)" font-weight="bold">analyze ONCE</text>
  <text x="946.550218340611" y="297.169811320755" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.922181587307" fill="var(--ok-text)">at the end</text>
  <rect x="1061.834061135371" y="215.094339622641" width="178.165938864629" height="120.377358490566" rx="8.56749636142" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1150.917030567686" y="264.339622641509" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.064055677662" fill="var(--danger-text)" font-weight="bold">decision</text>
  <path d="M 218.165938864629 275.283018867925 L 244.366812227074 275.283018867925" fill="none" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 422.532751091703 275.283018867925 L 448.733624454148 275.283018867925" fill="none" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 626.899563318777 275.283018867925 L 653.100436681223 275.283018867925" fill="none" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 831.266375545852 275.283018867925 L 857.467248908297 275.283018867925" fill="none" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 1035.633187772926 275.283018867925 L 1061.834061135371 275.283018867925" fill="none" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="40" y="433.962264150943" width="1173.799126637555" height="186.037735849057" rx="8.56749636142" fill="var(--code-bg)" stroke="var(--border)" stroke-width="2"/>
  <text x="626.899563318777" y="475.547169811321" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.418740903549" fill="var(--surface)" font-weight="bold">the four classic blunders</text>
  <text x="626.899563318777" y="510.566037735849" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.993118632485" fill="var(--text-faint)">• peeking and stopping early at p &lt; 0.05</text>
  <text x="626.899563318777" y="537.924528301887" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.993118632485" fill="var(--text-faint)">• picking the metric after seeing results</text>
  <text x="626.899563318777" y="565.283018867925" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.993118632485" fill="var(--text-faint)">• running too short to escape day-of-week effects</text>
  <text x="626.899563318777" y="592.641509433962" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.993118632485" fill="var(--text-faint)">• ignoring sample ratio mismatch</text>
</svg>

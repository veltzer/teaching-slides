<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="649.83606557377" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.19432670981" fill="var(--text)" font-weight="bold">How the standard families relate</text>
  <rect x="40" y="153.333333333333" width="196.72131147541" height="93.333333333333" rx="9.161573349022" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="138.360655737705" y="206.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.177950029416" font-weight="bold" fill="var(--primary-text)">Bernoulli</text>
  <rect x="295.737704918033" y="153.333333333333" width="196.72131147541" height="93.333333333333" rx="9.161573349022" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="394.098360655738" y="206.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.177950029416" font-weight="bold" fill="var(--primary-text)">Binomial</text>
  <rect x="551.475409836066" y="153.333333333333" width="196.72131147541" height="93.333333333333" rx="9.161573349022" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="649.83606557377" y="206.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.177950029416" font-weight="bold" fill="var(--info-text)">Poisson</text>
  <rect x="40" y="393.333333333333" width="196.72131147541" height="93.333333333333" rx="9.161573349022" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="138.360655737705" y="446.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.177950029416" font-weight="bold" fill="var(--info-text)">Geometric</text>
  <rect x="295.737704918033" y="393.333333333333" width="196.72131147541" height="93.333333333333" rx="9.161573349022" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="394.098360655738" y="446.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.177950029416" font-weight="bold" fill="var(--warn-text)">Exponential</text>
  <rect x="551.475409836066" y="393.333333333333" width="196.72131147541" height="93.333333333333" rx="9.161573349022" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="649.83606557377" y="446.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.177950029416" font-weight="bold" fill="var(--warn-text)">Gamma</text>
  <rect x="807.213114754098" y="273.333333333333" width="196.72131147541" height="93.333333333333" rx="9.161573349022" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="905.573770491803" y="326.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.177950029416" font-weight="bold" fill="var(--ok-text)">Normal</text>
  <rect x="807.213114754098" y="526.666666666667" width="196.72131147541" height="93.333333333333" rx="9.161573349022" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="905.573770491803" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.177950029416" font-weight="bold" fill="var(--ok-text)">Chi-square</text>
  <rect x="1043.27868852459" y="273.333333333333" width="196.72131147541" height="93.333333333333" rx="9.161573349022" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1141.639344262295" y="326.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.177950029416" font-weight="bold" fill="var(--ok-text)">Student t</text>
  <rect x="1043.27868852459" y="526.666666666667" width="196.72131147541" height="93.333333333333" rx="9.161573349022" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1141.639344262295" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.177950029416" font-weight="bold" fill="var(--ok-text)">F</text>
  <path d="M 179.672131147541 200 L 352.786885245902 200" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="266.229508196721" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.597163354905" fill="var(--text-muted)" font-style="italic">n trials</text>
  <path d="M 435.409836065574 200 L 608.524590163934 200" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="521.967213114754" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.597163354905" fill="var(--text-muted)" font-style="italic">n→∞, p→0</text>
  <path d="M 138.360655737705 256 L 138.360655737705 384" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="138.360655737705" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.597163354905" fill="var(--text-muted)" font-style="italic">until 1st</text>
  <path d="M 179.672131147541 440 L 352.786885245902 440" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="266.229508196721" y="432" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.597163354905" fill="var(--text-muted)" font-style="italic">continuous limit</text>
  <path d="M 435.409836065574 440 L 608.524590163934 440" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="521.967213114754" y="432" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.597163354905" fill="var(--text-muted)" font-style="italic">sum of k</text>
  <path d="M 615.901639344262 231.866666666667 L 428.032786885246 408.133333333333" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="521.967213114754" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.597163354905" fill="var(--text-muted)" font-style="italic">inter-arrival</text>
  <path d="M 688.393442622951 460.133333333333 L 867.016393442623 553.2" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="777.704918032787" y="498.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.597163354905" fill="var(--text-muted)" font-style="italic">shape n/2</text>
  <path d="M 434.819672131148 209.6 L 864.852459016393 310.4" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="649.83606557377" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.597163354905" fill="var(--text-muted)" font-style="italic">CLT</text>
  <path d="M 905.573770491803 376 L 905.573770491803 517.333333333333" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="905.573770491803" y="438.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.597163354905" fill="var(--text-muted)" font-style="italic">sum of squares</text>
  <path d="M 946.885245901639 320 L 1100.327868852459 320" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1023.606557377049" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.597163354905" fill="var(--text-muted)" font-style="italic">Z / √(χ²/n)</text>
  <path d="M 946.885245901639 573.333333333333 L 1100.327868852459 573.333333333333" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1023.606557377049" y="565.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.597163354905" fill="var(--text-muted)" font-style="italic">ratio</text>
</svg>

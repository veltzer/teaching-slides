<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.656470059033" fill="var(--text)" font-weight="bold">Sampling methods: each has a failure mode</text>
  <rect x="40" y="127.547169811321" width="578.571428571429" height="109.433962264151" rx="8.662588023613" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="329.285714285714" y="177.88679245283" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.822117064936" font-weight="bold" fill="var(--ok-text)">simple random</text>
  <text x="329.285714285714" y="203.056603773585" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.242352544275" fill="var(--ok-text)">every unit equally likely</text>
  <rect x="661.428571428571" y="127.547169811321" width="578.571428571429" height="109.433962264151" rx="8.662588023613" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950.714285714286" y="177.88679245283" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.822117064936" font-weight="bold" fill="var(--primary-text)">stratified</text>
  <text x="950.714285714286" y="203.056603773585" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.242352544275" fill="var(--primary-text)">by group, proportional</text>
  <rect x="40" y="302.641509433962" width="578.571428571429" height="109.433962264151" rx="8.662588023613" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="329.285714285714" y="352.981132075472" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.822117064936" font-weight="bold" fill="var(--info-text)">cluster</text>
  <text x="329.285714285714" y="378.150943396226" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.242352544275" fill="var(--info-text)">pick whole groups</text>
  <rect x="661.428571428571" y="302.641509433962" width="578.571428571429" height="109.433962264151" rx="8.662588023613" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950.714285714286" y="352.981132075472" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.822117064936" font-weight="bold" fill="var(--danger-text)">convenience</text>
  <text x="950.714285714286" y="378.150943396226" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.242352544275" fill="var(--danger-text)">whoever's easy — BIASED</text>
  <rect x="40" y="510.566037735849" width="1200" height="109.433962264151" rx="8.662588023613" fill="var(--code-bg)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="548.867924528302" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.49082305313" fill="var(--surface)" font-weight="bold">sample size controls precision; sampling METHOD controls bias</text>
  <text x="640" y="587.169811320755" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.242352544275" fill="var(--text-faint)" font-style="italic">more data won't rescue a biased method</text>
</svg>

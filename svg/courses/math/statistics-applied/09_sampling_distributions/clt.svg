  <text x="640" y="570.63829787234" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.947980485981" fill="var(--text-muted)" font-style="italic">raw population can be anything; the distribution of the mean approaches normal</text>
  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.818115120249" fill="var(--text-muted)" font-style="italic">and the spread shrinks like 1 / √n</text>

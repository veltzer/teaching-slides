<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.491407877643" fill="var(--text)" font-weight="bold">Box plot: five-number summary at a glance</text>
  <line x1="40" y1="534.074074074074" x2="1240" y2="534.074074074074" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="132.307692307692" y1="254.814814814815" x2="132.307692307692" y2="448.148148148148" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="132.307692307692" y1="351.481481481482" x2="340" y2="351.481481481482" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="1147.692307692308" y1="254.814814814815" x2="1147.692307692308" y2="448.148148148148" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="847.692307692308" y1="351.481481481482" x2="1147.692307692308" y2="351.481481481482" stroke="var(--text-muted)" stroke-width="2"/>
  <rect x="340" y="254.814814814815" width="507.692307692308" height="193.333333333333" rx="6.679474875721" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <line x1="570.769230769231" y1="254.814814814815" x2="570.769230769231" y2="448.148148148148" stroke="var(--surface)" stroke-width="5"/>
  <ellipse cx="1193.846153846154" cy="351.481481481482" rx="13.846153846154" ry="12.888888888889" fill="var(--danger-fill)"/>
  <line x1="132.307692307692" y1="448.148148148148" x2="132.307692307692" y2="501.851851851852" stroke="var(--text-muted)" stroke-width="1.5"/>
  <text x="132.307692307692" y="488.962962962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.698687189302" fill="var(--text)" font-weight="bold">min (whisker)</text>
  <line x1="340" y1="254.814814814815" x2="340" y2="211.851851851852" stroke="var(--text-muted)" stroke-width="1.5"/>
  <text x="340" y="198.962962962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.698687189302" fill="var(--text)" font-weight="bold">Q1</text>
  <line x1="570.769230769231" y1="254.814814814815" x2="570.769230769231" y2="190.37037037037" stroke="var(--text-muted)" stroke-width="1.5"/>
  <text x="570.769230769231" y="177.481481481481" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.698687189302" fill="var(--text)" font-weight="bold">median</text>
  <line x1="847.692307692308" y1="254.814814814815" x2="847.692307692308" y2="211.851851851852" stroke="var(--text-muted)" stroke-width="1.5"/>
  <text x="847.692307692308" y="198.962962962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.698687189302" fill="var(--text)" font-weight="bold">Q3</text>
  <line x1="1147.692307692308" y1="448.148148148148" x2="1147.692307692308" y2="501.851851851852" stroke="var(--text-muted)" stroke-width="1.5"/>
  <text x="1147.692307692308" y="488.962962962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.698687189302" fill="var(--text)" font-weight="bold">Q3+1.5·IQR</text>
  <line x1="1193.846153846154" y1="351.481481481482" x2="1193.846153846154" y2="598.518518518518" stroke="var(--text-muted)" stroke-width="1.5"/>
  <text x="1193.846153846154" y="585.62962962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.698687189302" fill="var(--text)" font-weight="bold">outlier</text>
  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.585441376682" fill="var(--text-muted)" font-style="italic">IQR = Q3 − Q1 (middle 50% of the data)</text>
</svg>

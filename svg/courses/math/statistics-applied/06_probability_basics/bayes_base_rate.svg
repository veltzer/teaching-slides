<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.279807063957" fill="var(--text)" font-weight="bold">Bayes ’ theorem: positive test, rare disease</text>
  <rect x="536.551724137931" y="94.716981132075" width="206.896551724138" height="65.660377358491" rx="8.511922825583" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="134.842767295597" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.279807063957" font-weight="bold" fill="var(--primary-text)">10 000 people</text>
  <path d="M 598.620689655172 160.377358490566 L 267.586206896552 258.867924528302" fill="none" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 681.379310344828 160.377358490566 L 1012.413793103448 258.867924528302" fill="none" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="381.379310344828" y="226.037735849057" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.89586494477" fill="var(--text)">1% sick → 100</text>
  <text x="888.275862068966" y="226.037735849057" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.89586494477" fill="var(--text)">99% healthy → 9 900</text>
  <rect x="102.068965517241" y="258.867924528302" width="331.034482758621" height="65.660377358491" rx="8.511922825583" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="267.586206896552" y="298.993710691824" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.279807063957" font-weight="bold" fill="var(--danger-text)">100 sick</text>
  <rect x="846.896551724138" y="258.867924528302" width="331.034482758621" height="65.660377358491" rx="8.511922825583" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1012.413793103448" y="298.993710691824" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.279807063957" font-weight="bold" fill="var(--ok-text)">9 900 healthy</text>
  <path d="M 184.827586206897 324.528301886792 L 122.758620689655 423.018867924528" fill="none" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 350.344827586207 324.528301886792 L 412.413793103448 423.018867924528" fill="none" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 929.655172413793 324.528301886792 L 888.275862068966 423.018867924528" fill="none" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 1095.172413793103 324.528301886792 L 1157.241379310345 423.018867924528" fill="none" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="40" y="423.018867924528" width="165.51724137931" height="65.660377358491" rx="8.511922825583" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="122.758620689655" y="451.471698113208" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.279807063957" font-weight="bold" fill="var(--danger-text)">99 + </text>
  <text x="122.758620689655" y="474.452830188679" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.831874591572" fill="var(--danger-text)">test +</text>
  <rect x="329.655172413793" y="423.018867924528" width="165.51724137931" height="65.660377358491" rx="8.511922825583" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="412.413793103448" y="451.471698113208" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.279807063957" font-weight="bold" fill="var(--ok-text)">1 -</text>
  <text x="412.413793103448" y="474.452830188679" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.831874591572" fill="var(--ok-text)">test -</text>
  <rect x="784.827586206897" y="423.018867924528" width="206.896551724138" height="65.660377358491" rx="8.511922825583" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="888.275862068966" y="451.471698113208" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.279807063957" font-weight="bold" fill="var(--warn-text)">198 +</text>
  <text x="888.275862068966" y="474.452830188679" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.831874591572" fill="var(--warn-text)">5% FPR</text>
  <rect x="1074.48275862069" y="423.018867924528" width="165.51724137931" height="65.660377358491" rx="8.511922825583" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1157.241379310345" y="463.14465408805" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.279807063957" font-weight="bold" fill="var(--ok-text)">9 702 -</text>
  <rect x="40" y="532.452830188679" width="1200" height="87.547169811321" rx="8.511922825583" fill="var(--code-bg)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="570.754716981132" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.087836004364" fill="var(--surface)" font-weight="bold">of the 99 + 198 = 297 positives, only 99 are actually sick</text>
  <text x="640" y="603.584905660377" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.959855297968" fill="var(--text-faint)" font-style="italic">P(sick | +) ≈ 33% — the base rate dominates</text>
</svg>

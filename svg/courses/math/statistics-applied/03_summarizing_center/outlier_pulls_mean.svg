<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.062391868188" fill="var(--text)" font-weight="bold">One outlier drags the mean. The median doesn't budge.</text>
  <line x1="40" y1="293.75" x2="1240" y2="293.75" stroke="var(--text-muted)" stroke-width="3"/>
  <ellipse cx="195.555555555556" cy="293.75" rx="15.555555555556" ry="12.6875" fill="var(--primary-fill)"/>
  <ellipse cx="262.222222222222" cy="293.75" rx="15.555555555556" ry="12.6875" fill="var(--primary-fill)"/>
  <ellipse cx="306.666666666667" cy="293.75" rx="15.555555555556" ry="12.6875" fill="var(--primary-fill)"/>
  <ellipse cx="340" cy="293.75" rx="15.555555555556" ry="12.6875" fill="var(--primary-fill)"/>
  <ellipse cx="373.333333333333" cy="293.75" rx="15.555555555556" ry="12.6875" fill="var(--primary-fill)"/>
  <ellipse cx="395.555555555556" cy="293.75" rx="15.555555555556" ry="12.6875" fill="var(--primary-fill)"/>
  <ellipse cx="417.777777777778" cy="293.75" rx="15.555555555556" ry="12.6875" fill="var(--primary-fill)"/>
  <ellipse cx="440" cy="293.75" rx="15.555555555556" ry="12.6875" fill="var(--primary-fill)"/>
  <ellipse cx="484.444444444444" cy="293.75" rx="15.555555555556" ry="12.6875" fill="var(--primary-fill)"/>
  <ellipse cx="528.888888888889" cy="293.75" rx="15.555555555556" ry="12.6875" fill="var(--primary-fill)"/>
  <line x1="395.555555555556" y1="203.125" x2="395.555555555556" y2="311.875" stroke="var(--warn-fill)" stroke-width="4"/>
  <text x="395.555555555556" y="189.53125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.048527008591" fill="var(--warn-fill)" font-weight="bold">median</text>
  <line x1="374.444444444444" y1="339.0625" x2="374.444444444444" y2="402.5" stroke="var(--danger-fill)" stroke-width="4"/>
  <text x="374.444444444444" y="420.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.048527008591" fill="var(--danger-fill)" font-weight="bold">mean</text>
  <text x="640" y="484.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.05545943839" fill="var(--text-muted)">⇓ now add one outlier at 200</text>
  <line x1="40" y1="529.375" x2="1240" y2="529.375" stroke="var(--text-muted)" stroke-width="3"/>
  <ellipse cx="295.555555555556" cy="529.375" rx="11.111111111111" ry="9.0625" fill="var(--primary-fill)"/>
  <ellipse cx="328.888888888889" cy="529.375" rx="11.111111111111" ry="9.0625" fill="var(--primary-fill)"/>
  <ellipse cx="351.111111111111" cy="529.375" rx="11.111111111111" ry="9.0625" fill="var(--primary-fill)"/>
  <ellipse cx="367.777777777778" cy="529.375" rx="11.111111111111" ry="9.0625" fill="var(--primary-fill)"/>
  <ellipse cx="384.444444444444" cy="529.375" rx="11.111111111111" ry="9.0625" fill="var(--primary-fill)"/>
  <ellipse cx="395.555555555556" cy="529.375" rx="11.111111111111" ry="9.0625" fill="var(--primary-fill)"/>
  <ellipse cx="406.666666666667" cy="529.375" rx="11.111111111111" ry="9.0625" fill="var(--primary-fill)"/>
  <ellipse cx="417.777777777778" cy="529.375" rx="11.111111111111" ry="9.0625" fill="var(--primary-fill)"/>
  <ellipse cx="440" cy="529.375" rx="11.111111111111" ry="9.0625" fill="var(--primary-fill)"/>
  <ellipse cx="462.222222222222" cy="529.375" rx="11.111111111111" ry="9.0625" fill="var(--primary-fill)"/>
  <ellipse cx="1173.333333333333" cy="529.375" rx="14.444444444444" ry="11.78125" fill="var(--danger-fill)"/>
  <text x="1173.333333333333" y="511.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.045060793692" fill="var(--danger-fill)">outlier</text>
  <line x1="395.555555555556" y1="456.875" x2="395.555555555556" y2="547.5" stroke="var(--warn-fill)" stroke-width="4"/>
  <text x="395.555555555556" y="446" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.045060793692" fill="var(--warn-fill)">median (unchanged)</text>
  <line x1="456.666666666667" y1="565.625" x2="456.666666666667" y2="601.875" stroke="var(--danger-fill)" stroke-width="4"/>
  <text x="456.666666666667" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.045060793692" fill="var(--danger-fill)">mean ⇒ pulled right</text>
</svg>

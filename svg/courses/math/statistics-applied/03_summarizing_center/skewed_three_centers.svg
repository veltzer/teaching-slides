<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.264916252402" fill="var(--text)" font-weight="bold">Mean, median, mode on a right-skewed distribution</text>
  <line x1="40" y1="553.076923076923" x2="1240" y2="553.076923076923" stroke="var(--text-muted)" stroke-width="2"/>
  <rect x="62.222222222222" y="497.307692307692" width="60" height="55.769230769231" rx="2.22649162524" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <rect x="128.888888888889" y="430.384615384615" width="60" height="122.692307692308" rx="2.22649162524" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <rect x="195.555555555556" y="330" width="60" height="223.076923076923" rx="2.22649162524" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <rect x="262.222222222222" y="263.076923076923" width="60" height="290" rx="2.22649162524" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <rect x="328.888888888889" y="218.461538461538" width="60" height="334.615384615385" rx="2.22649162524" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <rect x="395.555555555556" y="240.769230769231" width="60" height="312.307692307692" rx="2.22649162524" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <rect x="462.222222222222" y="296.538461538462" width="60" height="256.538461538462" rx="2.22649162524" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <rect x="528.888888888889" y="352.307692307692" width="60" height="200.769230769231" rx="2.22649162524" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <rect x="595.555555555556" y="396.923076923077" width="60" height="156.153846153846" rx="2.22649162524" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <rect x="662.222222222222" y="435.961538461538" width="60" height="117.115384615385" rx="2.22649162524" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <rect x="728.888888888889" y="469.423076923077" width="60" height="83.653846153846" rx="2.22649162524" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <rect x="795.555555555556" y="491.730769230769" width="60" height="61.346153846154" rx="2.22649162524" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <rect x="862.222222222222" y="508.461538461539" width="60" height="44.615384615385" rx="2.22649162524" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <rect x="928.888888888889" y="521.846153846154" width="60" height="31.230769230769" rx="2.22649162524" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <rect x="995.555555555556" y="530.769230769231" width="60" height="22.307692307692" rx="2.22649162524" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <rect x="1062.222222222222" y="537.461538461539" width="60" height="15.615384615385" rx="2.22649162524" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <rect x="1128.888888888889" y="541.923076923077" width="60" height="11.153846153846" rx="2.22649162524" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <line x1="358.888888888889" y1="218.461538461538" x2="358.888888888889" y2="553.076923076923" stroke="var(--ok-fill)" stroke-width="4" stroke-dasharray="6 4"/>
  <text x="358.888888888889" y="207.307692307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.811933001922" fill="var(--ok-fill)" font-weight="bold">mode</text>
  <line x1="425.555555555556" y1="218.461538461538" x2="425.555555555556" y2="553.076923076923" stroke="var(--warn-fill)" stroke-width="4" stroke-dasharray="6 4"/>
  <text x="425.555555555556" y="207.307692307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.811933001922" fill="var(--warn-fill)" font-weight="bold">median</text>
  <line x1="558.888888888889" y1="218.461538461538" x2="558.888888888889" y2="553.076923076923" stroke="var(--danger-fill)" stroke-width="4" stroke-dasharray="6 4"/>
  <text x="558.888888888889" y="207.307692307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.811933001922" fill="var(--danger-fill)" font-weight="bold">mean</text>
  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.698687189302" fill="var(--text-muted)" font-style="italic">on a right-skewed variable: mode &lt; median &lt; mean</text>
</svg>

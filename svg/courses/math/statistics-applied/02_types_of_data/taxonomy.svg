<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="536.551724137931" y="40" width="206.896551724138" height="76.603773584906" rx="8.511922825583" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="85.59748427673" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.279807063957" font-weight="bold" fill="var(--primary-text)">data</text>
  <path d="M 640 116.603773584906 L 308.965517241379 204.150943396226" fill="none" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 640 116.603773584906 L 971.034482758621 204.150943396226" fill="none" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="164.137931034483" y="204.150943396226" width="289.655172413793" height="76.603773584906" rx="8.511922825583" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="308.965517241379" y="249.748427672956" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.279807063957" font-weight="bold" fill="var(--info-text)">categorical</text>
  <rect x="826.206896551724" y="204.150943396226" width="289.655172413793" height="76.603773584906" rx="8.511922825583" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="971.034482758621" y="249.748427672956" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.279807063957" font-weight="bold" fill="var(--warn-text)">numerical</text>
  <path d="M 246.896551724138 280.754716981132 L 112.413793103448 379.245283018868" fill="none" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 371.034482758621 280.754716981132 L 371.034482758621 379.245283018868" fill="none" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="40" y="379.245283018868" width="206.896551724138" height="65.660377358491" rx="8.511922825583" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="143.448275862069" y="417.911949685535" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.023845651166" font-weight="bold" fill="var(--info-text)">nominal</text>
  <rect x="277.931034482759" y="379.245283018868" width="206.896551724138" height="65.660377358491" rx="8.511922825583" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="381.379310344828" y="417.911949685535" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.023845651166" font-weight="bold" fill="var(--info-text)">ordinal</text>
  <path d="M 908.965517241379 280.754716981132 L 805.51724137931 379.245283018868" fill="none" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 1033.103448275862 280.754716981132 L 1136.551724137931 379.245283018868" fill="none" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="702.068965517241" y="379.245283018868" width="206.896551724138" height="65.660377358491" rx="8.511922825583" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="805.51724137931" y="417.911949685535" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.023845651166" font-weight="bold" fill="var(--warn-text)">discrete</text>
  <rect x="960.689655172414" y="379.245283018868" width="206.896551724138" height="65.660377358491" rx="8.511922825583" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1064.137931034483" y="417.911949685535" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.023845651166" font-weight="bold" fill="var(--warn-text)">continuous</text>
  <text x="143.448275862069" y="499.622641509434" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.831874591572" fill="var(--text-muted)">browser, color</text>
  <text x="381.379310344828" y="499.622641509434" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.831874591572" fill="var(--text-muted)">rating 1–5</text>
  <text x="805.51724137931" y="499.622641509434" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.831874591572" fill="var(--text-muted)">click count</text>
  <text x="1064.137931034483" y="499.622641509434" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.831874591572" fill="var(--text-muted)">weight, time</text>
  <rect x="40" y="565.283018867925" width="1200" height="54.716981132075" rx="8.511922825583" fill="var(--code-bg)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="599.207547169811" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.151826357562" font-weight="bold" fill="var(--text)">legal: mode &lt; median &lt; mean &lt; ratios</text>
  <text x="640" y="595.924528301887" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.959855297968" fill="var(--surface)" font-weight="bold">legal operations: mode &lt; median &lt; mean &lt; ratios</text>
</svg>

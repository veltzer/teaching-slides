<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.050085101858" fill="var(--text)" font-weight="bold">Interaction plots: parallel or not?</text>
  <rect x="40" y="129.230769230769" width="578.571428571429" height="423.846153846154" rx="8.745485491585" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="329.285714285714" y="112.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.397785296721" fill="var(--ok-fill)" font-weight="bold">no interaction</text>
  <line x1="72.142857142857" y1="508.461538461539" x2="597.142857142857" y2="508.461538461539" stroke="var(--text-faint)" stroke-width="1.5"/>
  <line x1="72.142857142857" y1="173.846153846154" x2="72.142857142857" y2="508.461538461539" stroke="var(--text-faint)" stroke-width="1.5"/>
  <line x1="147.142857142857" y1="419.230769230769" x2="532.857142857143" y2="307.692307692308" stroke="var(--primary-fill)" stroke-width="4"/>
  <line x1="147.142857142857" y1="463.846153846154" x2="532.857142857143" y2="352.307692307692" stroke="var(--info-fill)" stroke-width="4"/>
  <ellipse cx="147.142857142857" cy="419.230769230769" rx="8.571428571429" ry="8.923076923077" fill="var(--primary-fill)"/>
  <ellipse cx="532.857142857143" cy="307.692307692308" rx="8.571428571429" ry="8.923076923077" fill="var(--primary-fill)"/>
  <ellipse cx="147.142857142857" cy="463.846153846154" rx="8.571428571429" ry="8.923076923077" fill="var(--info-fill)"/>
  <ellipse cx="532.857142857143" cy="352.307692307692" rx="8.571428571429" ry="8.923076923077" fill="var(--info-fill)"/>
  <text x="147.142857142857" y="530.769230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.118228237377" fill="var(--text-muted)">level 1</text>
  <text x="532.857142857143" y="530.769230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.118228237377" fill="var(--text-muted)">level 2</text>
  <text x="554.285714285714" y="240.769230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.118228237377" fill="var(--primary-fill)" font-weight="bold">B = high</text>
  <text x="554.285714285714" y="285.384615384615" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.118228237377" fill="var(--info-fill)" font-weight="bold">B = low</text>
  <rect x="661.428571428571" y="129.230769230769" width="578.571428571429" height="423.846153846154" rx="8.745485491585" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="950.714285714286" y="112.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.397785296721" fill="var(--danger-fill)" font-weight="bold">interaction (lines cross)</text>
  <line x1="693.571428571429" y1="508.461538461539" x2="1218.571428571428" y2="508.461538461539" stroke="var(--text-faint)" stroke-width="1.5"/>
  <line x1="693.571428571429" y1="173.846153846154" x2="693.571428571429" y2="508.461538461539" stroke="var(--text-faint)" stroke-width="1.5"/>
  <line x1="768.571428571429" y1="463.846153846154" x2="1154.285714285714" y2="263.076923076923" stroke="var(--primary-fill)" stroke-width="4"/>
  <line x1="768.571428571429" y1="263.076923076923" x2="1154.285714285714" y2="441.538461538462" stroke="var(--info-fill)" stroke-width="4"/>
  <ellipse cx="768.571428571429" cy="463.846153846154" rx="8.571428571429" ry="8.923076923077" fill="var(--primary-fill)"/>
  <ellipse cx="1154.285714285714" cy="263.076923076923" rx="8.571428571429" ry="8.923076923077" fill="var(--primary-fill)"/>
  <ellipse cx="768.571428571429" cy="263.076923076923" rx="8.571428571429" ry="8.923076923077" fill="var(--info-fill)"/>
  <ellipse cx="1154.285714285714" cy="441.538461538462" rx="8.571428571429" ry="8.923076923077" fill="var(--info-fill)"/>
  <text x="768.571428571429" y="530.769230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.118228237377" fill="var(--text-muted)">level 1</text>
  <text x="1154.285714285714" y="530.769230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.118228237377" fill="var(--text-muted)">level 2</text>
  <text x="1165" y="229.615384615385" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.118228237377" fill="var(--primary-fill)" font-weight="bold">B = high</text>
  <text x="1165" y="274.230769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.118228237377" fill="var(--info-fill)" font-weight="bold">B = low</text>
  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.397785296721" fill="var(--text-muted)" font-style="italic">non-parallel lines → the effect of one factor depends on the other</text>
</svg>

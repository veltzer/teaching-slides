<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.455010144893" fill="var(--text)" font-weight="bold">Types I / II / III sums of squares (unbalanced)</text>
  <rect x="40" y="125.925925925926" width="1200" height="494.074074074074" rx="8.582004057957" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="168.888888888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.164008115914" fill="var(--text-muted)" font-style="italic">in unbalanced designs the factors share variance</text>
  <rect x="82.857142857143" y="211.851851851852" width="214.285714285714" height="96.666666666667" rx="8.582004057957" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="268.061728395062" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.600511159382" font-weight="bold" fill="var(--primary-text)">Type I</text>
  <text x="340" y="249.444444444444" text-anchor="start" font-family="Arial, sans-serif" font-size="19.309509130404" fill="var(--text)" font-weight="bold">Sequential</text>
  <text x="340" y="281.666666666667" text-anchor="start" font-family="Arial, sans-serif" font-size="15.018507101425" fill="var(--text-muted)">depends on the order predictors are entered</text>
  <rect x="82.857142857143" y="330" width="214.285714285714" height="96.666666666667" rx="8.582004057957" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="386.20987654321" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.600511159382" font-weight="bold" fill="var(--info-text)">Type II</text>
  <text x="340" y="367.592592592593" text-anchor="start" font-family="Arial, sans-serif" font-size="19.309509130404" fill="var(--text)" font-weight="bold">Each main effect after the other main effects</text>
  <text x="340" y="399.814814814815" text-anchor="start" font-family="Arial, sans-serif" font-size="15.018507101425" fill="var(--text-muted)">not after interactions</text>
  <rect x="82.857142857143" y="448.148148148148" width="214.285714285714" height="96.666666666667" rx="8.582004057957" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="504.358024691358" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.600511159382" font-weight="bold" fill="var(--warn-text)">Type III</text>
  <text x="340" y="485.740740740741" text-anchor="start" font-family="Arial, sans-serif" font-size="19.309509130404" fill="var(--text)" font-weight="bold">Each effect after EVERYTHING else</text>
  <text x="340" y="517.962962962963" text-anchor="start" font-family="Arial, sans-serif" font-size="15.018507101425" fill="var(--text-muted)">interactions included</text>
  <text x="640" y="598.518518518518" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.09125760867" fill="var(--text)" font-style="italic">default to Type II or Type III; design balanced if you can</text>
</svg>

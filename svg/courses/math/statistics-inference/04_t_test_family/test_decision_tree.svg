<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.298221281347" fill="var(--text)" font-weight="bold">Choosing the right t-test</text>
  <rect x="536.551724137931" y="93.703703703704" width="206.896551724138" height="75.185185185185" rx="8.432740427116" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="138.456790123457" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.081851067789" font-weight="bold" fill="var(--primary-text)">two groups?</text>
  <path d="M 598.620689655172 168.888888888889 L 350.344827586207 265.555555555556" fill="none" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="412.413793103448" y="211.851851851852" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203194063" fill="var(--text-muted)">no — one group</text>
  <path d="M 681.379310344828 168.888888888889 L 929.655172413793 265.555555555556" fill="none" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="846.896551724138" y="211.851851851852" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203194063" fill="var(--text-muted)">yes — two groups</text>
  <rect x="205.51724137931" y="265.555555555556" width="289.655172413793" height="85.925925925926" rx="8.432740427116" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="350.344827586207" y="304.222222222222" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.081851067789" font-weight="bold" fill="var(--info-text)">one-sample t-test</text>
  <text x="350.344827586207" y="326.777777777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203194063" fill="var(--info-text)">test x̄ vs reference</text>
  <rect x="784.827586206897" y="265.555555555556" width="289.655172413793" height="85.925925925926" rx="8.432740427116" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="929.655172413793" y="315.679012345679" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.081851067789" font-weight="bold" fill="var(--info-text)">matched pairs?</text>
  <path d="M 826.206896551724 351.481481481482 L 681.379310344828 448.148148148148" fill="none" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="743.448275862069" y="394.444444444445" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203194063" fill="var(--text-muted)">yes</text>
  <path d="M 1033.103448275862 351.481481481482 L 1115.862068965517 448.148148148148" fill="none" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1115.862068965517" y="394.444444444445" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203194063" fill="var(--text-muted)">no</text>
  <rect x="536.551724137931" y="448.148148148148" width="289.655172413793" height="85.925925925926" rx="8.432740427116" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="681.379310344828" y="486.814814814815" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.081851067789" font-weight="bold" fill="var(--ok-text)">paired t-test</text>
  <text x="681.379310344828" y="509.37037037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203194063" fill="var(--ok-text)">on the differences</text>
  <rect x="1002.068965517241" y="448.148148148148" width="237.931034482759" height="85.925925925926" rx="8.432740427116" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1121.034482758621" y="486.814814814815" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.081851067789" font-weight="bold" fill="var(--warn-text)">Welch's t-test</text>
  <text x="1121.034482758621" y="509.37037037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203194063" fill="var(--warn-text)">default, no equal-var</text>
  <rect x="40" y="566.296296296296" width="1200" height="53.703703703704" rx="8.432740427116" fill="var(--code-bg)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="600.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.811388300842" fill="var(--surface)">always pair p with the effect size (Cohen's d) and the difference's CI</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.656470059033" fill="var(--text)" font-weight="bold">Observed vs expected, summed over cells</text>
  <rect x="104.285714285714" y="138.490566037736" width="1071.428571428571" height="306.415094339623" rx="8.662588023613" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="404.285714285714" y="182.264150943396" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.325176047226" fill="var(--text)" font-weight="bold">yes</text>
  <text x="704.285714285714" y="182.264150943396" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.325176047226" fill="var(--text)" font-weight="bold">no</text>
  <text x="1004.285714285714" y="182.264150943396" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.159529041323" fill="var(--text-muted)">row total</text>
  <text x="190" y="258.867924528302" text-anchor="start" font-family="Arial, sans-serif" font-size="16.242352544275" fill="var(--text)" font-weight="bold">desktop</text>
  <text x="190" y="357.358490566038" text-anchor="start" font-family="Arial, sans-serif" font-size="16.242352544275" fill="var(--text)" font-weight="bold">mobile</text>
  <rect x="340" y="226.037735849057" width="235.714285714286" height="76.603773584906" rx="6.49694101771" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="457.857142857143" y="264.339622641509" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.242352544275" fill="var(--ok-text)" font-weight="bold">obs 200</text>
  <text x="457.857142857143" y="286.22641509434" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.076705538371" fill="var(--ok-text)" font-style="italic">exp 175</text>
  <rect x="618.571428571429" y="226.037735849057" width="235.714285714286" height="76.603773584906" rx="6.49694101771" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="736.428571428571" y="264.339622641509" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.242352544275" fill="var(--primary-text)" font-weight="bold">obs 1800</text>
  <text x="736.428571428571" y="286.22641509434" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.076705538371" fill="var(--primary-text)" font-style="italic">exp 1825</text>
  <rect x="340" y="324.528301886792" width="235.714285714286" height="76.603773584906" rx="6.49694101771" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="457.857142857143" y="362.830188679245" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.242352544275" fill="var(--danger-text)" font-weight="bold">obs 150</text>
  <text x="457.857142857143" y="384.716981132075" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.076705538371" fill="var(--danger-text)" font-style="italic">exp 175</text>
  <rect x="618.571428571429" y="324.528301886792" width="235.714285714286" height="76.603773584906" rx="6.49694101771" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="736.428571428571" y="362.830188679245" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.242352544275" fill="var(--primary-text)" font-weight="bold">obs 2350</text>
  <text x="736.428571428571" y="384.716981132075" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.076705538371" fill="var(--primary-text)" font-style="italic">exp 2325</text>
  <text x="1004.285714285714" y="264.339622641509" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.159529041323" fill="var(--text-muted)">2000</text>
  <text x="1004.285714285714" y="362.830188679245" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.159529041323" fill="var(--text-muted)">2500</text>
  <rect x="40" y="466.792452830189" width="1200" height="153.207547169811" rx="8.662588023613" fill="var(--code-bg)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="526.981132075472" text-anchor="middle" font-family="Arial, sans-serif" font-size="34.650352094453" fill="var(--surface)" font-weight="bold">χ² = Σ (obs - exp)² / exp</text>
  <text x="640" y="581.698113207547" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.325176047226" fill="var(--text-faint)">df = (rows-1)(cols-1) = 1  → compare to χ²₁</text>
</svg>

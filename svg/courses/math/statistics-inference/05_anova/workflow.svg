<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.756040706459" fill="var(--text)" font-weight="bold">ANOVA workflow</text>
  <rect x="40" y="225.6" width="214.285714285714" height="139.2" rx="8.918680235486" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="147.142857142857" y="283.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.067030529845" fill="var(--primary-text)" font-weight="bold">k groups</text>
  <rect x="286.428571428571" y="225.6" width="214.285714285714" height="139.2" rx="8.918680235486" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="393.571428571429" y="283.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.067030529845" fill="var(--info-text)" font-weight="bold">F-test</text>
  <rect x="532.857142857143" y="225.6" width="214.285714285714" height="139.2" rx="8.918680235486" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="283.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.067030529845" fill="var(--warn-text)" font-weight="bold">significant?</text>
  <rect x="779.285714285714" y="225.6" width="214.285714285714" height="139.2" rx="8.918680235486" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="886.428571428571" y="283.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.067030529845" fill="var(--ok-text)" font-weight="bold">Tukey's HSD</text>
  <text x="886.428571428571" y="318.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.492855382666" fill="var(--ok-text)">(pairwise)</text>
  <rect x="1025.714285714286" y="225.6" width="214.285714285714" height="139.2" rx="8.918680235486" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1132.857142857143" y="283.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.067030529845" fill="var(--primary-text)" font-weight="bold">done</text>
  <path d="M 254.285714285714 295.2 L 286.428571428571 295.2" fill="none" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 500.714285714286 295.2 L 532.857142857143 295.2" fill="none" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 747.142857142857 295.2 L 779.285714285714 295.2" fill="none" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 993.571428571429 295.2 L 1025.714285714286 295.2" fill="none" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 725.714285714286 364.8 L 725.714285714286 480.8" fill="none" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="747.142857142857" y="422.8" text-anchor="start" font-family="Arial, sans-serif" font-size="14.492855382666" fill="var(--text-muted)">if p &lt; α</text>
  <rect x="618.571428571429" y="480.8" width="214.285714285714" height="81.2" rx="8.918680235486" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="725.714285714286" y="529.133333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.296700588716" font-weight="bold" fill="var(--danger-text)">yes → HSD</text>
  <path d="M 725.714285714286 562 L 1218.571428571428 422.8" fill="none" stroke="var(--text)" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="104.285714285714" y="538.8" text-anchor="start" font-family="Arial, sans-serif" font-size="15.607690412101" fill="var(--text-muted)">non-parametric alternative: Kruskal-Wallis</text>
  <text x="104.285714285714" y="573.6" text-anchor="start" font-family="Arial, sans-serif" font-size="15.607690412101" fill="var(--text-muted)">unequal variances? Use Welch's ANOVA</text>
  <text x="104.285714285714" y="620" text-anchor="start" font-family="Arial, sans-serif" font-size="15.607690412101" fill="var(--text-muted)">report η² or ω² (effect size) alongside p</text>
</svg>

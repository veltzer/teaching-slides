<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#c4cdd6"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bd7d75"/><stop offset="100%" stop-color="#7d3f38"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#555555"/></marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/></marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/></marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/></marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/></marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/></marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/></marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Curse of Dimensionality</text>
  <rect x="40" y="80" width="280" height="540" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">d = 1</text>
  <rect x="70" y="150" width="220" height="30" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="73" y="153" width="4" height="24" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="95" y="153" width="4" height="24" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="117" y="153" width="4" height="24" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="139" y="153" width="4" height="24" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="161" y="153" width="4" height="24" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="183" y="153" width="4" height="24" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="205" y="153" width="4" height="24" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="227" y="153" width="4" height="24" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="249" y="153" width="4" height="24" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="271" y="153" width="4" height="24" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">10 samples cover line</text>
  <text x="60" y="290" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--primary-text)">Density: 10 points / unit</text>
  <text x="60" y="360" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-text)">ε-neighbourhood: linear in ε</text>
  <text x="60" y="440" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-text)">Far ≫ near — works</text>
  <text x="60" y="530" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">Manageable</text>
  <rect x="345" y="80" width="280" height="540" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">d = 2</text>
  <rect x="375" y="150" width="220" height="220" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="378" y="153" width="4" height="4" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="400" y="263" width="4" height="4" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="444" y="241" width="4" height="4" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="466" y="351" width="4" height="4" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="488" y="219" width="4" height="4" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="510" y="329" width="4" height="4" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="532" y="197" width="4" height="4" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="554" y="307" width="4" height="4" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="576" y="175" width="4" height="4" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">Need 100 samples for same density</text>
  <text x="365" y="445" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--warn-text)">Density: 10² = 100 / unit²</text>
  <text x="365" y="495" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Most space is empty</text>
  <text x="365" y="545" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-text)">kNN, clustering degrade</text>
  <text x="365" y="610" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-text)">Sparse — bad</text>
  <rect x="650" y="80" width="280" height="540" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="790" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-text)">d = 3</text>
  <rect x="680" y="150" width="220" height="220" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="790" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">10³ = 1000 / unit³</text>
  <text x="790" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">Cube of voids — points isolated</text>
  <text x="670" y="445" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--danger-text)">Density: 10³ / unit³</text>
  <text x="670" y="495" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Volume mostly on faces</text>
  <text x="670" y="545" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--danger-text)">Distance metrics fail</text>
  <text x="670" y="610" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--danger-text)">Bad — exponential</text>
  <rect x="955" y="80" width="285" height="540" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">d = 100+</text>
  <text x="975" y="170" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Need 10¹⁰⁰ samples to cover</text>
  <text x="975" y="230" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Implications:</text>
  <text x="975" y="265" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">• kNN unreliable</text>
  <text x="975" y="300" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">• Overfitting easy</text>
  <text x="975" y="335" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">• Most directions noise</text>
  <text x="975" y="395" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Mitigations:</text>
  <text x="975" y="430" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">• PCA / embeddings</text>
  <text x="975" y="465" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">• Regularisation (L1, L2)</text>
  <text x="975" y="500" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">• Trees ignore irrelevant dims</text>
  <text x="975" y="565" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Manifold hypothesis:</text>
  <text x="975" y="600" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">data lives on low-dim subspace</text>
</svg>

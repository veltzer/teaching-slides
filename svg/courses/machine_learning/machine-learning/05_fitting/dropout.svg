<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="340" height="580" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="210" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Full network</text>
  <ellipse cx="100" cy="180" rx="20" ry="20" fill="var(--primary-fill)"/>
  <ellipse cx="100" cy="280" rx="20" ry="20" fill="var(--primary-fill)"/>
  <ellipse cx="100" cy="380" rx="20" ry="20" fill="var(--primary-fill)"/>
  <ellipse cx="100" cy="480" rx="20" ry="20" fill="var(--primary-fill)"/>
  <ellipse cx="220" cy="180" rx="20" ry="20" fill="var(--ok-fill)"/>
  <ellipse cx="220" cy="280" rx="20" ry="20" fill="var(--ok-fill)"/>
  <ellipse cx="220" cy="380" rx="20" ry="20" fill="var(--ok-fill)"/>
  <ellipse cx="220" cy="480" rx="20" ry="20" fill="var(--ok-fill)"/>
  <ellipse cx="340" cy="280" rx="20" ry="20" fill="var(--warn-fill)"/>
  <ellipse cx="340" cy="380" rx="20" ry="20" fill="var(--warn-fill)"/>
  <line x1="120" y1="180" x2="200" y2="180" stroke="var(--text)" stroke-width="1"/>
  <line x1="120" y1="180" x2="200" y2="280" stroke="var(--text)" stroke-width="1"/>
  <line x1="120" y1="180" x2="200" y2="380" stroke="var(--text)" stroke-width="1"/>
  <line x1="120" y1="180" x2="200" y2="480" stroke="var(--text)" stroke-width="1"/>
  <line x1="120" y1="280" x2="200" y2="180" stroke="var(--text)" stroke-width="1"/>
  <line x1="120" y1="280" x2="200" y2="280" stroke="var(--text)" stroke-width="1"/>
  <line x1="120" y1="280" x2="200" y2="380" stroke="var(--text)" stroke-width="1"/>
  <line x1="120" y1="280" x2="200" y2="480" stroke="var(--text)" stroke-width="1"/>
  <line x1="120" y1="380" x2="200" y2="180" stroke="var(--text)" stroke-width="1"/>
  <line x1="120" y1="380" x2="200" y2="280" stroke="var(--text)" stroke-width="1"/>
  <line x1="120" y1="380" x2="200" y2="380" stroke="var(--text)" stroke-width="1"/>
  <line x1="120" y1="380" x2="200" y2="480" stroke="var(--text)" stroke-width="1"/>
  <line x1="120" y1="480" x2="200" y2="180" stroke="var(--text)" stroke-width="1"/>
  <line x1="120" y1="480" x2="200" y2="280" stroke="var(--text)" stroke-width="1"/>
  <line x1="120" y1="480" x2="200" y2="380" stroke="var(--text)" stroke-width="1"/>
  <line x1="120" y1="480" x2="200" y2="480" stroke="var(--text)" stroke-width="1"/>
  <line x1="240" y1="180" x2="320" y2="280" stroke="var(--text)" stroke-width="1"/>
  <line x1="240" y1="280" x2="320" y2="280" stroke="var(--text)" stroke-width="1"/>
  <line x1="240" y1="380" x2="320" y2="280" stroke="var(--text)" stroke-width="1"/>
  <line x1="240" y1="480" x2="320" y2="280" stroke="var(--text)" stroke-width="1"/>
  <line x1="240" y1="180" x2="320" y2="380" stroke="var(--text)" stroke-width="1"/>
  <line x1="240" y1="280" x2="320" y2="380" stroke="var(--text)" stroke-width="1"/>
  <line x1="240" y1="380" x2="320" y2="380" stroke="var(--text)" stroke-width="1"/>
  <line x1="240" y1="480" x2="320" y2="380" stroke="var(--text)" stroke-width="1"/>
  <text x="210" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">all units active</text>
  <rect x="400" y="40" width="340" height="580" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="570" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Dropout (training)</text>
  <ellipse cx="460" cy="180" rx="20" ry="20" fill="var(--primary-fill)"/>
  <ellipse cx="460" cy="280" rx="20" ry="20" fill="none" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="3 3"/>
  <ellipse cx="460" cy="380" rx="20" ry="20" fill="var(--primary-fill)"/>
  <ellipse cx="460" cy="480" rx="20" ry="20" fill="none" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="3 3"/>
  <ellipse cx="580" cy="180" rx="20" ry="20" fill="none" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="3 3"/>
  <ellipse cx="580" cy="280" rx="20" ry="20" fill="var(--ok-fill)"/>
  <ellipse cx="580" cy="380" rx="20" ry="20" fill="var(--ok-fill)"/>
  <ellipse cx="580" cy="480" rx="20" ry="20" fill="none" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="3 3"/>
  <ellipse cx="700" cy="280" rx="20" ry="20" fill="var(--warn-fill)"/>
  <ellipse cx="700" cy="380" rx="20" ry="20" fill="var(--warn-fill)"/>
  <line x1="480" y1="180" x2="560" y2="280" stroke="var(--text)" stroke-width="1"/>
  <line x1="480" y1="180" x2="560" y2="380" stroke="var(--text)" stroke-width="1"/>
  <line x1="480" y1="380" x2="560" y2="280" stroke="var(--text)" stroke-width="1"/>
  <line x1="480" y1="380" x2="560" y2="380" stroke="var(--text)" stroke-width="1"/>
  <line x1="600" y1="280" x2="680" y2="280" stroke="var(--text)" stroke-width="1"/>
  <line x1="600" y1="380" x2="680" y2="280" stroke="var(--text)" stroke-width="1"/>
  <line x1="600" y1="280" x2="680" y2="380" stroke="var(--text)" stroke-width="1"/>
  <line x1="600" y1="380" x2="680" y2="380" stroke="var(--text)" stroke-width="1"/>
  <text x="570" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">random units zeroed each step</text>
  <rect x="760" y="40" width="480" height="580" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1000" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Dropout</text>
  <text x="780" y="140" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Randomly zero units</text>
  <text x="780" y="175" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">During training only</text>
  <text x="780" y="210" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Probability p (e.g. 0.5)</text>
  <text x="780" y="265" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Why it works:</text>
  <text x="780" y="300" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Forces redundancy</text>
  <text x="780" y="335" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Prevents co-adaptation</text>
  <text x="780" y="370" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Like ensembling networks</text>
  <text x="780" y="425" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">At inference:</text>
  <text x="780" y="460" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">All units active</text>
  <text x="780" y="495" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Scale weights or activations</text>
  <text x="780" y="550" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Standard practice:</text>
  <text x="780" y="585" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">In nearly every deep net</text>
</svg>

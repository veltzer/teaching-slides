<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>
  </defs>
  <rect x="40" y="40" width="395" height="580" rx="10" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="237" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--warn-text)">Underfitting</text>
  <text x="60" y="130" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Model too simple</text>
  <text x="60" y="165" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">High bias</text>
  <text x="60" y="200" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Train error high</text>
  <text x="60" y="235" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Test error high</text>
  <text x="60" y="270" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Gap is small</text>
  <text x="60" y="320" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn-text)">Fix:</text>
  <text x="60" y="350" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">More features</text>
  <text x="60" y="385" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">More capacity</text>
  <text x="60" y="420" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Deeper model</text>
  <text x="60" y="455" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Longer training</text>
  <text x="60" y="490" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Less regularisation</text>
  <rect x="445" y="40" width="395" height="580" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="642" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--ok-text)">Just Right</text>
  <text x="465" y="130" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Captures real signal</text>
  <text x="465" y="165" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Ignores noise</text>
  <text x="465" y="200" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Train error low</text>
  <text x="465" y="235" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Test error low</text>
  <text x="465" y="270" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Small gap</text>
  <text x="465" y="320" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-text)">Sweet spot:</text>
  <text x="465" y="350" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Cross-validated</text>
  <text x="465" y="385" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Tuned hyperparameters</text>
  <text x="465" y="420" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Right capacity</text>
  <text x="465" y="455" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Generalises well</text>
  <text x="465" y="490" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Stable across folds</text>
  <rect x="850" y="40" width="390" height="580" rx="10" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--danger-text)">Overfitting</text>
  <text x="870" y="130" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">Model too complex</text>
  <text x="870" y="165" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">High variance</text>
  <text x="870" y="200" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">Train error low</text>
  <text x="870" y="235" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">Test error high</text>
  <text x="870" y="270" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">Big gap</text>
  <text x="870" y="320" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--danger-text)">Fix:</text>
  <text x="870" y="350" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">More data</text>
  <text x="870" y="385" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">Regularisation</text>
  <text x="870" y="420" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">Early stopping</text>
  <text x="870" y="455" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">Simpler model</text>
  <text x="870" y="490" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">Ensembling</text>
</svg>

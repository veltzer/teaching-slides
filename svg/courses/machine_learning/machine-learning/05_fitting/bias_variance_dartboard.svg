<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata><type>regular</type></metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #c4cdd6; --border: #6b7280; --text: #212121;
        --text-muted: #555555; --text-faint: #888888; --code-bg: #1a1a2e;
        --shadow: #00000044; --black: #000000;
        --primary-fill: #5a7a9c; --primary-border: #3d5a7d; --primary-text: #ffffff; --primary-accent: #243b59;
        --ok-fill: #7a9a6a; --ok-border: #5a7a4d; --ok-text: #ffffff; --ok-accent: #385030;
        --warn-fill: #c8924a; --warn-border: #9c6e2e; --warn-text: #ffffff; --warn-accent: #5a3f12;
        --danger-fill: #a86058; --danger-border: #7d3f38; --danger-text: #ffffff; --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e; --info-border: #574a68; --info-text: #ffffff; --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
  </defs>
  <rect x="40" y="40" width="280" height="280" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="180" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Low bias, low variance</text>
  <ellipse cx="180" cy="200" rx="100" ry="100" fill="none" stroke="var(--border)" stroke-width="1"/>
  <ellipse cx="180" cy="200" rx="65" ry="65" fill="none" stroke="var(--border)" stroke-width="1"/>
  <ellipse cx="180" cy="200" rx="30" ry="30" fill="none" stroke="var(--border)" stroke-width="1"/>
  <ellipse cx="180" cy="200" rx="6" ry="6" fill="var(--ok-border)"/>
  <ellipse cx="175" cy="195" rx="4" ry="4" fill="var(--ok-fill)"/>
  <ellipse cx="185" cy="205" rx="4" ry="4" fill="var(--ok-fill)"/>
  <ellipse cx="178" cy="207" rx="4" ry="4" fill="var(--ok-fill)"/>
  <ellipse cx="184" cy="195" rx="4" ry="4" fill="var(--ok-fill)"/>
  <text x="180" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">accurate and consistent</text>
  <rect x="340" y="40" width="280" height="280" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="480" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Low bias, high variance</text>
  <ellipse cx="480" cy="200" rx="100" ry="100" fill="none" stroke="var(--border)" stroke-width="1"/>
  <ellipse cx="480" cy="200" rx="65" ry="65" fill="none" stroke="var(--border)" stroke-width="1"/>
  <ellipse cx="480" cy="200" rx="30" ry="30" fill="none" stroke="var(--border)" stroke-width="1"/>
  <ellipse cx="480" cy="200" rx="6" ry="6" fill="var(--ok-border)"/>
  <ellipse cx="430" cy="180" rx="4" ry="4" fill="var(--danger-fill)"/>
  <ellipse cx="510" cy="160" rx="4" ry="4" fill="var(--danger-fill)"/>
  <ellipse cx="455" cy="240" rx="4" ry="4" fill="var(--danger-fill)"/>
  <ellipse cx="525" cy="245" rx="4" ry="4" fill="var(--danger-fill)"/>
  <text x="480" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">centred but scattered (overfit)</text>
  <rect x="640" y="40" width="280" height="280" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="780" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">High bias, low variance</text>
  <ellipse cx="780" cy="200" rx="100" ry="100" fill="none" stroke="var(--border)" stroke-width="1"/>
  <ellipse cx="780" cy="200" rx="65" ry="65" fill="none" stroke="var(--border)" stroke-width="1"/>
  <ellipse cx="780" cy="200" rx="30" ry="30" fill="none" stroke="var(--border)" stroke-width="1"/>
  <ellipse cx="780" cy="200" rx="6" ry="6" fill="var(--ok-border)"/>
  <ellipse cx="855" cy="265" rx="4" ry="4" fill="var(--warn-fill)"/>
  <ellipse cx="850" cy="270" rx="4" ry="4" fill="var(--warn-fill)"/>
  <ellipse cx="858" cy="262" rx="4" ry="4" fill="var(--warn-fill)"/>
  <ellipse cx="852" cy="265" rx="4" ry="4" fill="var(--warn-fill)"/>
  <text x="780" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">consistent but off-target (underfit)</text>
  <rect x="940" y="40" width="300" height="280" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--info-text)">High bias, high variance</text>
  <ellipse cx="1090" cy="200" rx="100" ry="100" fill="none" stroke="var(--info-text)" stroke-width="1"/>
  <ellipse cx="1090" cy="200" rx="65" ry="65" fill="none" stroke="var(--info-text)" stroke-width="1"/>
  <ellipse cx="1090" cy="200" rx="30" ry="30" fill="none" stroke="var(--info-text)" stroke-width="1"/>
  <ellipse cx="1090" cy="200" rx="6" ry="6" fill="var(--info-text)"/>
  <ellipse cx="1030" cy="260" rx="4" ry="4" fill="var(--danger-fill)"/>
  <ellipse cx="1170" cy="255" rx="4" ry="4" fill="var(--danger-fill)"/>
  <ellipse cx="1140" cy="290" rx="4" ry="4" fill="var(--danger-fill)"/>
  <ellipse cx="1055" cy="280" rx="4" ry="4" fill="var(--danger-fill)"/>
  <text x="1090" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">worst case</text>
  <rect x="40" y="350" width="1200" height="270" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">The Bias-Variance Tradeoff</text>
  <text x="60" y="445" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Bias: how far the average prediction is from truth (centre).</text>
  <text x="60" y="480" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Variance: how much predictions wobble across different training sets (spread).</text>
  <text x="60" y="515" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Total error = bias² + variance + irreducible noise.</text>
  <text x="60" y="565" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Reduce bias: more capacity, more features, deeper model.</text>
  <text x="60" y="600" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Reduce variance: more data, regularisation, ensembling, simpler model.</text>
</svg>

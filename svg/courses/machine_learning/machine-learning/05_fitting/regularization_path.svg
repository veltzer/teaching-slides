<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata><type>regular</type></metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #c4cdd6; --border: #6b7280; --text: #212121;
        --text-muted: #555555; --text-faint: #888888; --code-bg: #1a1a2e;
        --shadow: #00000044; --black: #000000;
        --primary-fill: #5a7a9c; --primary-border: #3d5a7d; --primary-text: #ffffff; --primary-accent: #243b59;
        --ok-fill: #7a9a6a; --ok-border: #5a7a4d; --ok-text: #ffffff; --ok-accent: #385030;
        --warn-fill: #c8924a; --warn-border: #9c6e2e; --warn-text: #ffffff; --warn-accent: #5a3f12;
        --danger-fill: #a86058; --danger-border: #7d3f38; --danger-text: #ffffff; --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e; --info-border: #574a68; --info-text: #ffffff; --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
  </defs>
  <rect x="40" y="40" width="700" height="580" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="390" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Regularisation path: coefs vs λ</text>
  <line x1="100" y1="120" x2="100" y2="540" stroke="var(--text)" stroke-width="2"/>
  <line x1="100" y1="320" x2="700" y2="320" stroke="var(--text)" stroke-width="2"/>
  <text x="60" y="335" font-family="Arial, sans-serif" font-size="14" fill="var(--text)" transform="rotate(-90 60 335)">coefficient</text>
  <text x="395" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">log(λ)  →  more regularisation</text>
  <path d="M 110 200 Q 250 240 400 290 Q 550 315 690 320" stroke="var(--primary-border)" stroke-width="3" fill="none"/>
  <text x="120" y="195" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-border)">w₁</text>
  <path d="M 110 250 Q 250 280 400 305 Q 550 318 690 320" stroke="var(--ok-border)" stroke-width="3" fill="none"/>
  <text x="120" y="245" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-border)">w₂</text>
  <path d="M 110 420 Q 250 380 400 340 Q 550 322 690 320" stroke="var(--warn-border)" stroke-width="3" fill="none"/>
  <text x="120" y="430" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-border)">w₃</text>
  <path d="M 110 460 Q 250 420 400 360 Q 550 325 690 320" stroke="var(--danger-border)" stroke-width="3" fill="none"/>
  <text x="120" y="475" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-border)">w₄</text>
  <text x="60" y="580" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">All coefs shrink toward zero as λ grows (Ridge)</text>
  <text x="60" y="605" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Lasso would set some exactly to zero (sparsity)</text>
  <rect x="760" y="40" width="480" height="580" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Pick λ via CV</text>
  <text x="780" y="140" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Cross-validate over a grid</text>
  <text x="780" y="175" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Plot validation error vs λ</text>
  <text x="780" y="210" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Pick the λ that minimises it</text>
  <text x="780" y="265" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">λ too small:</text>
  <text x="780" y="300" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Coefs free, model overfits</text>
  <text x="780" y="355" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">λ too large:</text>
  <text x="780" y="390" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Coefs zero, model underfits</text>
  <text x="780" y="445" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">sklearn helpers:</text>
  <text x="780" y="480" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">RidgeCV, LassoCV</text>
  <text x="780" y="515" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">ElasticNetCV</text>
  <text x="780" y="570" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">One-standard-error rule:</text>
  <text x="780" y="600" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Pick simplest λ within 1 SE of best</text>
</svg>

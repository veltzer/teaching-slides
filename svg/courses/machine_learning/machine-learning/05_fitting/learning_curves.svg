<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="395" height="580" rx="10" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="237" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--warn-text)">Underfit</text>
  <text x="237" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Both curves high, close</text>
  <line x1="80" y1="160" x2="80" y2="380" stroke="var(--warn-text)" stroke-width="2"/>
  <line x1="80" y1="380" x2="395" y2="380" stroke="var(--warn-text)" stroke-width="2"/>
  <text x="60" y="270" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)" transform="rotate(-90 60 270)">Error</text>
  <text x="237" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Training size</text>
  <path d="M 100 200 Q 200 220 380 240" stroke="var(--warn-text)" stroke-width="3" fill="none"/>
  <path d="M 100 220 Q 200 240 380 260" stroke="var(--warn-text)" stroke-width="3" fill="none" stroke-dasharray="6 4"/>
  <text x="60" y="450" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Solid: validation</text>
  <text x="60" y="475" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Dashed: training</text>
  <text x="60" y="520" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">More data won't help</text>
  <text x="60" y="550" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Increase capacity</text>
  <rect x="445" y="40" width="395" height="580" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="642" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--ok-text)">Just Right</text>
  <text x="642" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Both curves low, close</text>
  <line x1="485" y1="160" x2="485" y2="380" stroke="var(--ok-text)" stroke-width="2"/>
  <line x1="485" y1="380" x2="800" y2="380" stroke="var(--ok-text)" stroke-width="2"/>
  <text x="465" y="270" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)" transform="rotate(-90 465 270)">Error</text>
  <text x="642" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Training size</text>
  <path d="M 505 200 Q 600 290 785 320" stroke="var(--ok-text)" stroke-width="3" fill="none"/>
  <path d="M 505 250 Q 600 310 785 330" stroke="var(--ok-text)" stroke-width="3" fill="none" stroke-dasharray="6 4"/>
  <text x="465" y="450" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Solid: validation</text>
  <text x="465" y="475" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Dashed: training</text>
  <text x="465" y="520" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Curves converge low</text>
  <text x="465" y="550" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Generalises well</text>
  <rect x="850" y="40" width="390" height="580" rx="10" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1045" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--danger-text)">Overfit</text>
  <text x="1045" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">Big gap, both wrong-shaped</text>
  <line x1="890" y1="160" x2="890" y2="380" stroke="var(--danger-text)" stroke-width="2"/>
  <line x1="890" y1="380" x2="1200" y2="380" stroke="var(--danger-text)" stroke-width="2"/>
  <text x="870" y="270" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)" transform="rotate(-90 870 270)">Error</text>
  <text x="1045" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Training size</text>
  <path d="M 910 200 Q 1000 250 1190 280" stroke="var(--danger-text)" stroke-width="3" fill="none"/>
  <path d="M 910 350 Q 1000 360 1190 365" stroke="var(--danger-text)" stroke-width="3" fill="none" stroke-dasharray="6 4"/>
  <text x="870" y="450" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Solid: validation</text>
  <text x="870" y="475" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Dashed: training</text>
  <text x="870" y="520" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Gap shrinks with more data</text>
  <text x="870" y="550" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Add regularisation</text>
</svg>

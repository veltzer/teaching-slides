<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata><type>regular</type></metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #c4cdd6; --border: #6b7280; --text: #212121;
        --text-muted: #555555; --text-faint: #888888; --code-bg: #1a1a2e;
        --shadow: #00000044; --black: #000000;
        --primary-fill: #5a7a9c; --primary-border: #3d5a7d; --primary-text: #ffffff; --primary-accent: #243b59;
        --ok-fill: #7a9a6a; --ok-border: #5a7a4d; --ok-text: #ffffff; --ok-accent: #385030;
        --warn-fill: #c8924a; --warn-border: #9c6e2e; --warn-text: #ffffff; --warn-accent: #5a3f12;
        --danger-fill: #a86058; --danger-border: #7d3f38; --danger-text: #ffffff; --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e; --info-border: #574a68; --info-text: #ffffff; --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
  </defs>
  <rect x="40" y="40" width="700" height="580" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="390" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">PCA: project onto principal components</text>
  <line x1="100" y1="120" x2="100" y2="540" stroke="var(--text)" stroke-width="2"/>
  <line x1="100" y1="540" x2="700" y2="540" stroke="var(--text)" stroke-width="2"/>
  <text x="395" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">x</text>
  <text x="60" y="335" font-family="Arial, sans-serif" font-size="14" fill="var(--text)" transform="rotate(-90 60 335)">y</text>
  <ellipse cx="200" cy="450" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="250" cy="420" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="300" cy="400" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="350" cy="370" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="400" cy="340" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="450" cy="310" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="500" cy="290" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="550" cy="260" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="600" cy="240" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="220" cy="430" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="280" cy="380" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="380" cy="360" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="430" cy="290" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="480" cy="320" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="540" cy="280" rx="6" ry="6" fill="var(--primary-fill)"/>
  <line x1="180" y1="475" x2="650" y2="220" stroke="var(--ok-border)" stroke-width="3"/>
  <text x="540" y="200" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-border)">PC1 (most variance)</text>
  <line x1="370" y1="450" x2="430" y2="290" stroke="var(--warn-border)" stroke-width="3"/>
  <text x="380" y="475" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-border)">PC2</text>
  <text x="60" y="585" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">PC1 captures most variance; PC2 perpendicular, smaller</text>
  <text x="60" y="610" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Drop PC2 to reduce dimensions</text>
  <rect x="760" y="40" width="480" height="580" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Principal Component Analysis</text>
  <text x="780" y="140" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Linear, deterministic</text>
  <text x="780" y="175" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Eigenvectors of covariance</text>
  <text x="780" y="210" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Projects to top-k axes</text>
  <text x="780" y="265" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Use for:</text>
  <text x="780" y="300" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Visualisation (2D / 3D)</text>
  <text x="780" y="335" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Speed up downstream models</text>
  <text x="780" y="370" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Denoising</text>
  <text x="780" y="425" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Choose k by:</text>
  <text x="780" y="460" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Cumulative explained variance</text>
  <text x="780" y="495" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Scree plot elbow</text>
  <text x="780" y="550" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Watch out:</text>
  <text x="780" y="585" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Always scale features first</text>
</svg>

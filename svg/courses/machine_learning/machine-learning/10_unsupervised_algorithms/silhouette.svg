<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#c4cdd6"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bd7d75"/><stop offset="100%" stop-color="#7d3f38"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#555555"/></marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/></marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/></marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/></marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/></marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/></marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/></marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Silhouette Score</text>
  <rect x="40" y="80" width="1200" height="100" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--primary-text)">s(i) = (b − a) / max(a, b)</text>
  <text x="640" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">a = mean intra-cluster distance — b = mean nearest-cluster distance</text>
  <rect x="40" y="200" width="380" height="280" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--ok-text)">s ≈ 1</text>
  <text x="60" y="270" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Tight cluster</text>
  <text x="60" y="300" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Far from neighbours</text>
  <text x="60" y="330" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Confidently assigned</text>
  <rect x="70" y="360" width="320" height="100" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="100" y="380" width="60" height="60" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="120" y="400" width="12" height="12" rx="6" fill="var(--ok-accent)" stroke="var(--ok-border)" stroke-width="1"/>
  <rect x="140" y="410" width="12" height="12" rx="6" fill="var(--ok-accent)" stroke="var(--ok-border)" stroke-width="1"/>
  <rect x="280" y="380" width="60" height="60" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="300" y="400" width="12" height="12" rx="6" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="1"/>
  <text x="170" y="470" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">a small, b large</text>
  <rect x="450" y="200" width="380" height="280" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--warn-text)">s ≈ 0</text>
  <text x="470" y="270" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">On the boundary</text>
  <text x="470" y="300" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">Could be either cluster</text>
  <text x="470" y="330" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">Ambiguous</text>
  <rect x="480" y="360" width="320" height="100" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="540" y="380" width="60" height="60" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="640" y="400" width="12" height="12" rx="6" fill="var(--warn-accent)" stroke="var(--warn-border)" stroke-width="1"/>
  <rect x="680" y="380" width="60" height="60" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">a ≈ b</text>
  <rect x="860" y="200" width="380" height="280" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--danger-text)">s ≈ −1</text>
  <text x="880" y="270" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">Closer to OTHER cluster</text>
  <text x="880" y="300" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">Misclassified</text>
  <text x="880" y="330" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">Wrong assignment</text>
  <rect x="890" y="360" width="320" height="100" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="920" y="380" width="60" height="60" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1100" y="380" width="60" height="60" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1110" y="400" width="12" height="12" rx="6" fill="var(--ok-accent)" stroke="var(--ok-border)" stroke-width="1"/>
  <text x="1050" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">wrong cluster</text>
  <rect x="40" y="510" width="1200" height="110" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Average s across all points → cluster-quality metric</text>
  <text x="640" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Use to pick k: try several, choose the highest mean silhouette</text>
  <text x="640" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Plot per-cluster silhouettes to spot weak / overlapping clusters</text>
</svg>

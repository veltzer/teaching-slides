<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#c4cdd6"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bd7d75"/><stop offset="100%" stop-color="#7d3f38"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#555555"/></marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/></marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/></marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/></marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/></marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/></marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/></marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Distance Metrics</text>
  <rect x="40" y="80" width="290" height="540" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">Euclidean (L2)</text>
  <rect x="60" y="145" width="250" height="180" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="85" y="200" width="12" height="12" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="245" y="280" width="12" height="12" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <line x1="91" y1="206" x2="251" y2="286" stroke="var(--primary-accent)" stroke-width="3"/>
  <text x="180" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--primary-text)">√Σ (xᵢ−yᵢ)²</text>
  <text x="60" y="360" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Sensitive to scale</text>
  <text x="60" y="390" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Normalise first</text>
  <text x="60" y="430" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-text)">Use for:</text>
  <text x="60" y="460" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">  k-means, kNN</text>
  <text x="60" y="490" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">  geometric data</text>
  <text x="60" y="540" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-text)">Curse of dim hits hard</text>
  <rect x="345" y="80" width="290" height="540" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-text)">Manhattan (L1)</text>
  <rect x="365" y="145" width="250" height="180" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="390" y="200" width="12" height="12" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="550" y="280" width="12" height="12" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <line x1="396" y1="206" x2="396" y2="286" stroke="var(--ok-accent)" stroke-width="3"/>
  <line x1="396" y1="286" x2="556" y2="286" stroke="var(--ok-accent)" stroke-width="3"/>
  <text x="490" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--ok-text)">Σ |xᵢ−yᵢ|</text>
  <text x="365" y="360" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Sum of axis steps</text>
  <text x="365" y="390" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Robust to outliers</text>
  <text x="365" y="430" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-text)">Use for:</text>
  <text x="365" y="460" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">  high-dim, sparse</text>
  <text x="365" y="490" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">  L1 regression</text>
  <text x="365" y="540" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-text)">Sometimes wins</text>
  <rect x="650" y="80" width="290" height="540" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="795" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-text)">Cosine</text>
  <rect x="670" y="145" width="250" height="180" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <line x1="700" y1="290" x2="870" y2="170" stroke="var(--warn-accent)" stroke-width="3" marker-end="url(#arrow-warn)"/>
  <line x1="700" y1="290" x2="880" y2="250" stroke="var(--warn-accent)" stroke-width="3" marker-end="url(#arrow-warn)"/>
  <text x="795" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-text)">θ</text>
  <text x="795" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-text)">x · y / (||x|| ||y||)</text>
  <text x="670" y="360" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Angle, range [-1, 1]</text>
  <text x="670" y="390" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Length-invariant</text>
  <text x="670" y="430" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-text)">Use for:</text>
  <text x="670" y="460" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">  text, embeddings</text>
  <text x="670" y="490" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">  recommenders</text>
  <text x="670" y="540" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-text)">Standard for search</text>
  <rect x="955" y="80" width="285" height="540" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--info-text)">Other distances</text>
  <text x="975" y="155" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Hamming</text>
  <text x="975" y="185" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">  bit / category mismatch</text>
  <text x="975" y="230" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Jaccard</text>
  <text x="975" y="260" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">  set overlap</text>
  <text x="975" y="305" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Mahalanobis</text>
  <text x="975" y="335" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">  scale-invariant</text>
  <text x="975" y="365" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">  via covariance Σ⁻¹</text>
  <text x="975" y="410" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Edit / Levenshtein</text>
  <text x="975" y="440" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">  string similarity</text>
  <text x="975" y="485" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Earth Mover</text>
  <text x="975" y="515" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">  distribution-aware</text>
  <text x="975" y="565" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--info-text)">Choose by semantics</text>
  <text x="975" y="600" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">— don't default to L2</text>
</svg>

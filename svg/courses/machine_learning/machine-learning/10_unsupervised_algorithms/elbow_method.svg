<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#c4cdd6"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bd7d75"/><stop offset="100%" stop-color="#7d3f38"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#555555"/></marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/></marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/></marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/></marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/></marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/></marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/></marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Elbow Method for k</text>
  <rect x="40" y="80" width="800" height="540" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="440" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Inertia (within-cluster sum of squares) vs k</text>
  <line x1="120" y1="560" x2="800" y2="560" stroke="var(--text)" stroke-width="2"/>
  <line x1="120" y1="560" x2="120" y2="160" stroke="var(--text)" stroke-width="2"/>
  <text x="440" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Number of clusters k</text>
  <text x="60" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Inertia</text>
  <path d="M 170 220 L 240 290 L 310 360 L 380 420 L 450 470 L 520 490 L 590 500 L 660 506 L 730 510" fill="none" stroke="var(--primary-border)" stroke-width="4"/>
  <rect x="164" y="214" width="12" height="12" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="234" y="284" width="12" height="12" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="304" y="354" width="12" height="12" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="374" y="414" width="12" height="12" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="444" y="464" width="12" height="12" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="514" y="484" width="12" height="12" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="584" y="494" width="12" height="12" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="654" y="500" width="12" height="12" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="724" y="504" width="12" height="12" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="370" y="410" width="24" height="24" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <line x1="400" y1="350" x2="470" y2="270" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <text x="490" y="260" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--danger-accent)">Elbow ≈ k = 4</text>
  <text x="170" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">2</text>
  <text x="240" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">3</text>
  <text x="310" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">4</text>
  <text x="380" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">5</text>
  <text x="450" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">6</text>
  <text x="520" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">7</text>
  <text x="590" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">8</text>
  <text x="660" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">9</text>
  <text x="730" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">10</text>
  <rect x="870" y="80" width="370" height="540" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1055" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">How to read it</text>
  <text x="890" y="155" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">More clusters always lower</text>
  <text x="890" y="185" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">inertia (more centroids).</text>
  <text x="890" y="230" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--info-text)">Look for a 'kink' where</text>
  <text x="890" y="260" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--info-text)">extra clusters stop helping.</text>
  <text x="890" y="305" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Often visual / subjective</text>
  <text x="890" y="350" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--info-text)">Better diagnostics:</text>
  <text x="890" y="380" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">  Silhouette score</text>
  <text x="890" y="410" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">  Gap statistic</text>
  <text x="890" y="440" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">  Davies-Bouldin index</text>
  <text x="890" y="470" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">  Calinski-Harabasz</text>
  <text x="890" y="510" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--info-text)">Domain knowledge wins</text>
  <text x="890" y="545" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">if k is given by the use case.</text>
  <text x="890" y="590" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Cluster stability across runs</text>
  <text x="890" y="615" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">is a sanity check.</text>
</svg>

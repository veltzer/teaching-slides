<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata><type>regular</type></metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #c4cdd6; --border: #6b7280; --text: #212121;
        --text-muted: #555555; --text-faint: #888888; --code-bg: #1a1a2e;
        --shadow: #00000044; --black: #000000;
        --primary-fill: #5a7a9c; --primary-border: #3d5a7d; --primary-text: #ffffff; --primary-accent: #243b59;
        --ok-fill: #7a9a6a; --ok-border: #5a7a4d; --ok-text: #ffffff; --ok-accent: #385030;
        --warn-fill: #c8924a; --warn-border: #9c6e2e; --warn-text: #ffffff; --warn-accent: #5a3f12;
        --danger-fill: #a86058; --danger-border: #7d3f38; --danger-text: #ffffff; --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e; --info-border: #574a68; --info-text: #ffffff; --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
  </defs>
  <rect x="40" y="40" width="700" height="580" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="390" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Density-based clustering</text>
  <ellipse cx="200" cy="200" rx="80" ry="50" fill="none" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="4 4"/>
  <ellipse cx="170" cy="180" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="200" cy="190" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="230" cy="200" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="180" cy="220" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="220" cy="180" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="250" cy="220" rx="6" ry="6" fill="var(--primary-fill)"/>
  <text x="200" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">cluster 1</text>
  <ellipse cx="500" cy="280" rx="100" ry="60" fill="none" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="4 4"/>
  <ellipse cx="450" cy="260" rx="6" ry="6" fill="var(--ok-fill)"/>
  <ellipse cx="490" cy="270" rx="6" ry="6" fill="var(--ok-fill)"/>
  <ellipse cx="510" cy="290" rx="6" ry="6" fill="var(--ok-fill)"/>
  <ellipse cx="540" cy="280" rx="6" ry="6" fill="var(--ok-fill)"/>
  <ellipse cx="470" cy="300" rx="6" ry="6" fill="var(--ok-fill)"/>
  <ellipse cx="530" cy="260" rx="6" ry="6" fill="var(--ok-fill)"/>
  <ellipse cx="560" cy="290" rx="6" ry="6" fill="var(--ok-fill)"/>
  <text x="500" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">cluster 2</text>
  <ellipse cx="300" cy="450" rx="120" ry="50" fill="none" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="4 4"/>
  <ellipse cx="220" cy="440" rx="6" ry="6" fill="var(--warn-fill)"/>
  <ellipse cx="260" cy="450" rx="6" ry="6" fill="var(--warn-fill)"/>
  <ellipse cx="300" cy="460" rx="6" ry="6" fill="var(--warn-fill)"/>
  <ellipse cx="340" cy="450" rx="6" ry="6" fill="var(--warn-fill)"/>
  <ellipse cx="380" cy="440" rx="6" ry="6" fill="var(--warn-fill)"/>
  <ellipse cx="280" cy="470" rx="6" ry="6" fill="var(--warn-fill)"/>
  <ellipse cx="320" cy="445" rx="6" ry="6" fill="var(--warn-fill)"/>
  <text x="300" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">cluster 3 (irregular shape)</text>
  <ellipse cx="630" cy="500" rx="6" ry="6" fill="var(--danger-border)"/>
  <ellipse cx="650" cy="470" rx="6" ry="6" fill="var(--danger-border)"/>
  <ellipse cx="670" cy="510" rx="6" ry="6" fill="var(--danger-border)"/>
  <text x="640" y="555" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-border)">noise (outliers)</text>
  <text x="60" y="580" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Two parameters: eps (radius) and min_samples (density threshold)</text>
  <text x="60" y="605" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Finds arbitrary-shape clusters; labels sparse points as noise</text>
  <rect x="760" y="40" width="480" height="580" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">DBSCAN</text>
  <text x="780" y="140" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Density-Based Spatial</text>
  <text x="780" y="175" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Clustering of Apps with Noise</text>
  <text x="780" y="230" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">vs k-means:</text>
  <text x="780" y="265" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">No k upfront</text>
  <text x="780" y="300" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Non-spherical clusters</text>
  <text x="780" y="335" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Built-in outlier detection</text>
  <text x="780" y="390" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Watch out:</text>
  <text x="780" y="425" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Sensitive to eps</text>
  <text x="780" y="460" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Bad for varying density</text>
  <text x="780" y="495" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Suffers in high dimensions</text>
  <text x="780" y="550" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Variant:</text>
  <text x="780" y="585" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">HDBSCAN handles density</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata><type>regular</type></metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #c4cdd6; --border: #6b7280; --text: #212121;
        --text-muted: #555555; --text-faint: #888888; --code-bg: #1a1a2e;
        --shadow: #00000044; --black: #000000;
        --primary-fill: #5a7a9c; --primary-border: #3d5a7d; --primary-text: #ffffff; --primary-accent: #243b59;
        --ok-fill: #7a9a6a; --ok-border: #5a7a4d; --ok-text: #ffffff; --ok-accent: #385030;
        --warn-fill: #c8924a; --warn-border: #9c6e2e; --warn-text: #ffffff; --warn-accent: #5a3f12;
        --danger-fill: #a86058; --danger-border: #7d3f38; --danger-text: #ffffff; --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e; --info-border: #574a68; --info-text: #ffffff; --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
  </defs>
  <rect x="40" y="40" width="700" height="580" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="390" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Gaussian Mixture Model</text>
  <ellipse cx="220" cy="220" rx="120" ry="60" fill="none" stroke="var(--primary-border)" stroke-width="2"/>
  <ellipse cx="220" cy="220" rx="80" ry="40" fill="none" stroke="var(--primary-border)" stroke-width="1.5"/>
  <ellipse cx="220" cy="220" rx="40" ry="20" fill="none" stroke="var(--primary-border)" stroke-width="1"/>
  <ellipse cx="220" cy="220" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="180" cy="200" rx="5" ry="5" fill="var(--primary-fill)"/>
  <ellipse cx="240" cy="240" rx="5" ry="5" fill="var(--primary-fill)"/>
  <ellipse cx="270" cy="210" rx="5" ry="5" fill="var(--primary-fill)"/>
  <ellipse cx="200" cy="250" rx="5" ry="5" fill="var(--primary-fill)"/>
  <text x="220" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">component 1: μ₁, Σ₁, π₁</text>
  <ellipse cx="500" cy="380" rx="80" ry="120" fill="none" stroke="var(--ok-border)" stroke-width="2"/>
  <ellipse cx="500" cy="380" rx="55" ry="80" fill="none" stroke="var(--ok-border)" stroke-width="1.5"/>
  <ellipse cx="500" cy="380" rx="25" ry="40" fill="none" stroke="var(--ok-border)" stroke-width="1"/>
  <ellipse cx="500" cy="380" rx="6" ry="6" fill="var(--ok-fill)"/>
  <ellipse cx="490" cy="350" rx="5" ry="5" fill="var(--ok-fill)"/>
  <ellipse cx="510" cy="410" rx="5" ry="5" fill="var(--ok-fill)"/>
  <ellipse cx="495" cy="430" rx="5" ry="5" fill="var(--ok-fill)"/>
  <ellipse cx="505" cy="320" rx="5" ry="5" fill="var(--ok-fill)"/>
  <text x="500" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">component 2: μ₂, Σ₂, π₂</text>
  <text x="60" y="580" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Soft assignment: each point has probability of belonging to each component</text>
  <text x="60" y="605" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Ellipses can be elongated, unlike k-means' spheres</text>
  <rect x="760" y="40" width="480" height="580" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">GMM via EM</text>
  <text x="780" y="140" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">E-step:</text>
  <text x="780" y="175" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Compute responsibilities</text>
  <text x="780" y="210" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">P(component | point)</text>
  <text x="780" y="265" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">M-step:</text>
  <text x="780" y="300" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Update μ, Σ, π</text>
  <text x="780" y="335" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Maximise expected log-lik</text>
  <text x="780" y="390" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">vs k-means:</text>
  <text x="780" y="425" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Soft assignments</text>
  <text x="780" y="460" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Elliptical clusters</text>
  <text x="780" y="495" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Probabilistic output</text>
  <text x="780" y="550" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Watch out:</text>
  <text x="780" y="585" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Local optima, sensitive init</text>
</svg>

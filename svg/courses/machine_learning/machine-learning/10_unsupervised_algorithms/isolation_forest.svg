<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata><type>regular</type></metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #c4cdd6; --border: #6b7280; --text: #212121;
        --text-muted: #555555; --text-faint: #888888; --code-bg: #1a1a2e;
        --shadow: #00000044; --black: #000000;
        --primary-fill: #5a7a9c; --primary-border: #3d5a7d; --primary-text: #ffffff; --primary-accent: #243b59;
        --ok-fill: #7a9a6a; --ok-border: #5a7a4d; --ok-text: #ffffff; --ok-accent: #385030;
        --warn-fill: #c8924a; --warn-border: #9c6e2e; --warn-text: #ffffff; --warn-accent: #5a3f12;
        --danger-fill: #a86058; --danger-border: #7d3f38; --danger-text: #ffffff; --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e; --info-border: #574a68; --info-text: #ffffff; --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
  </defs>
  <rect x="40" y="40" width="700" height="580" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="390" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Anomalies isolate quickly</text>
  <ellipse cx="280" cy="350" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="320" cy="370" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="300" cy="380" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="290" cy="400" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="310" cy="410" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="270" cy="380" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="330" cy="395" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="285" cy="365" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="305" cy="395" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="295" cy="370" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="600" cy="180" rx="10" ry="10" fill="var(--danger-border)"/>
  <text x="610" y="170" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-border)">anomaly</text>
  <line x1="100" y1="280" x2="700" y2="280" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="710" y="285" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">cut 1</text>
  <line x1="450" y1="120" x2="450" y2="280" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="455" y="135" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">cut 2</text>
  <text x="60" y="540" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Pick a random feature, then a random split.</text>
  <text x="60" y="565" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Anomalies sit in sparse regions and isolate in just a few cuts.</text>
  <text x="60" y="595" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Score = 2 ^ (-avg path length / normaliser)</text>
  <rect x="760" y="40" width="480" height="580" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Isolation Forest</text>
  <text x="780" y="140" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Build random trees</text>
  <text x="780" y="175" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Random feature, random split</text>
  <text x="780" y="210" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Path length to leaf is the score</text>
  <text x="780" y="265" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Why it works:</text>
  <text x="780" y="300" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Anomalies are easy to split off</text>
  <text x="780" y="335" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Normal points sit deep in trees</text>
  <text x="780" y="390" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Strengths:</text>
  <text x="780" y="425" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Fast on big data</text>
  <text x="780" y="460" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Linear-time training</text>
  <text x="780" y="495" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">No distance computation</text>
  <text x="780" y="550" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Hyperparameters:</text>
  <text x="780" y="585" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">contamination, n_estimators</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata><type>regular</type></metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #c4cdd6; --border: #6b7280; --text: #212121;
        --text-muted: #555555; --text-faint: #888888; --code-bg: #1a1a2e;
        --shadow: #00000044; --black: #000000;
        --primary-fill: #5a7a9c; --primary-border: #3d5a7d; --primary-text: #ffffff; --primary-accent: #243b59;
        --ok-fill: #7a9a6a; --ok-border: #5a7a4d; --ok-text: #ffffff; --ok-accent: #385030;
        --warn-fill: #c8924a; --warn-border: #9c6e2e; --warn-text: #ffffff; --warn-accent: #5a3f12;
        --danger-fill: #a86058; --danger-border: #7d3f38; --danger-text: #ffffff; --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e; --info-border: #574a68; --info-text: #ffffff; --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
  </defs>
  <rect x="40" y="40" width="700" height="160" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="390" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Rule:  bread, butter  →  jam</text>
  <text x="60" y="135" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Antecedent → consequent</text>
  <text x="60" y="170" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">"if cart has X, also Y"</text>
  <rect x="40" y="220" width="225" height="400" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="152" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Support</text>
  <text x="60" y="305" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">P(A ∧ B)</text>
  <text x="60" y="340" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Items appearing together</text>
  <text x="60" y="425" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-text)">Example:</text>
  <text x="60" y="460" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">15 of 100 have all three</text>
  <text x="60" y="525" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Support = 0.15</text>
  <text x="60" y="580" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Filter via min_support</text>
  <rect x="277" y="220" width="225" height="400" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="389" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Confidence</text>
  <text x="295" y="305" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">P(B | A)</text>
  <text x="295" y="370" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Given A, also B?</text>
  <text x="295" y="425" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-text)">Example:</text>
  <text x="295" y="490" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">75% also have jam</text>
  <text x="295" y="525" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Confidence = 0.75</text>
  <text x="295" y="610" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Ignores P(B)</text>
  <rect x="514" y="220" width="226" height="400" rx="10" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="627" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">Lift</text>
  <text x="532" y="305" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">P(B|A) / P(B)</text>
  <text x="532" y="370" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Boost over baseline</text>
  <text x="532" y="425" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn-text)">Reading:</text>
  <text x="532" y="460" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">&gt; 1: positive</text>
  <text x="532" y="490" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">= 1: independent</text>
  <text x="532" y="525" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">&lt; 1: negative</text>
  <text x="532" y="610" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Best to rank rules</text>
  <rect x="760" y="40" width="480" height="580" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Algorithms</text>
  <text x="780" y="140" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Apriori:</text>
  <text x="780" y="175" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Frequent itemsets</text>
  <text x="780" y="245" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Prune by support</text>
  <text x="780" y="300" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">FP-Growth:</text>
  <text x="780" y="335" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Faster, FP-tree</text>
  <text x="780" y="425" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Uses:</text>
  <text x="780" y="460" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Market basket</text>
  <text x="780" y="495" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Recommendations</text>
  <text x="780" y="530" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Clickstream</text>
  <text x="780" y="585" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">mlxtend</text>
</svg>

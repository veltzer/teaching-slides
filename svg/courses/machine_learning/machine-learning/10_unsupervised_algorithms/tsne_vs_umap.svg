<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata><type>regular</type></metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #c4cdd6; --border: #6b7280; --text: #212121;
        --text-muted: #555555; --text-faint: #888888; --code-bg: #1a1a2e;
        --shadow: #00000044; --black: #000000;
        --primary-fill: #5a7a9c; --primary-border: #3d5a7d; --primary-text: #ffffff; --primary-accent: #243b59;
        --ok-fill: #7a9a6a; --ok-border: #5a7a4d; --ok-text: #ffffff; --ok-accent: #385030;
        --warn-fill: #c8924a; --warn-border: #9c6e2e; --warn-text: #ffffff; --warn-accent: #5a3f12;
        --danger-fill: #a86058; --danger-border: #7d3f38; --danger-text: #ffffff; --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e; --info-border: #574a68; --info-text: #ffffff; --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
  </defs>
  <rect x="40" y="40" width="395" height="580" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="237" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--primary-text)">PCA</text>
  <text x="237" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">linear, deterministic</text>
  <text x="60" y="170" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-text)">Strengths:</text>
  <text x="60" y="205" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Fast, scales well</text>
  <text x="60" y="240" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Closed form</text>
  <text x="60" y="275" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Inverse transform exists</text>
  <text x="60" y="310" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Globally consistent</text>
  <text x="60" y="365" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-text)">Limits:</text>
  <text x="60" y="400" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Linear only</text>
  <text x="60" y="435" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Misses nonlinear manifolds</text>
  <text x="60" y="490" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-text)">Use when:</text>
  <text x="60" y="525" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Need interpretable axes</text>
  <text x="60" y="560" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Pre-processing pipeline</text>
  <text x="60" y="595" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Numeric, scaled inputs</text>
  <rect x="445" y="40" width="395" height="580" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="642" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--ok-text)">t-SNE</text>
  <text x="642" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">nonlinear, stochastic</text>
  <text x="465" y="170" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-text)">Strengths:</text>
  <text x="465" y="205" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Reveals local structure</text>
  <text x="465" y="240" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Pretty visualisations</text>
  <text x="465" y="275" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Famous in ML papers</text>
  <text x="465" y="330" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-text)">Limits:</text>
  <text x="465" y="365" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Slow on big data</text>
  <text x="465" y="400" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Distorts global distances</text>
  <text x="465" y="435" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Different runs differ</text>
  <text x="465" y="470" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">No transform on new data</text>
  <text x="465" y="525" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-text)">Hyperparameter:</text>
  <text x="465" y="560" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">perplexity (5 to 50)</text>
  <text x="465" y="595" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Visualisation only</text>
  <rect x="850" y="40" width="390" height="580" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--info-text)">UMAP</text>
  <text x="1045" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">nonlinear, faster</text>
  <text x="870" y="170" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Strengths:</text>
  <text x="870" y="205" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Faster than t-SNE</text>
  <text x="870" y="240" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Preserves more global</text>
  <text x="870" y="275" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Has transform method</text>
  <text x="870" y="310" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Modern default for viz</text>
  <text x="870" y="365" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Hyperparameters:</text>
  <text x="870" y="400" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">n_neighbors (local vs global)</text>
  <text x="870" y="435" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">min_dist (cluster spread)</text>
  <text x="870" y="490" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Use when:</text>
  <text x="870" y="525" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Visualising embeddings</text>
  <text x="870" y="560" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Many classes</text>
  <text x="870" y="595" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">pip install umap-learn</text>
</svg>

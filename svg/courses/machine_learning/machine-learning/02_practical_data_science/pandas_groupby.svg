<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#c4cdd6"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bd7d75"/><stop offset="100%" stop-color="#7d3f38"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#555555"/></marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/></marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/></marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/></marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/></marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/></marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/></marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">pandas GroupBy: Split — Apply — Combine</text>
  <rect x="40" y="80" width="280" height="540" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="180" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">DataFrame</text>
  <text x="80" y="145" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)">key</text>
  <text x="220" y="145" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)">value</text>
  <text x="80" y="180" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">A</text>
  <text x="220" y="180" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">10</text>
  <text x="80" y="210" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">B</text>
  <text x="220" y="210" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">20</text>
  <text x="80" y="240" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">A</text>
  <text x="220" y="240" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">30</text>
  <text x="80" y="270" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">C</text>
  <text x="220" y="270" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">5</text>
  <text x="80" y="300" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">B</text>
  <text x="220" y="300" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">15</text>
  <text x="80" y="330" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">A</text>
  <text x="220" y="330" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">25</text>
  <text x="80" y="360" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">C</text>
  <text x="220" y="360" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">8</text>
  <text x="180" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text-muted)">Step 1: Split</text>
  <line x1="320" y1="350" x2="380" y2="350" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="390" y="80" width="240" height="170" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="510" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">Group A</text>
  <text x="510" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">10</text>
  <text x="510" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">30</text>
  <text x="510" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">25</text>
  <text x="510" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-text)">→ sum 65</text>
  <rect x="390" y="270" width="240" height="170" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="510" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-text)">Group B</text>
  <text x="510" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">20</text>
  <text x="510" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">15</text>
  <text x="510" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-text)">→ sum 35</text>
  <rect x="390" y="460" width="240" height="160" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="510" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-text)">Group C</text>
  <text x="510" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">5</text>
  <text x="510" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">8</text>
  <text x="510" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-text)">→ sum 13</text>
  <line x1="640" y1="350" x2="700" y2="350" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="670" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Step 2: Apply</text>
  <rect x="710" y="80" width="280" height="540" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="850" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--info-text)">Result</text>
  <text x="750" y="160" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--info-text)">key</text>
  <text x="890" y="160" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--info-text)">sum</text>
  <text x="750" y="200" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">A</text>
  <text x="890" y="200" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">65</text>
  <text x="750" y="230" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">B</text>
  <text x="890" y="230" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">35</text>
  <text x="750" y="260" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">C</text>
  <text x="890" y="260" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">13</text>
  <text x="850" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Step 3: Combine</text>
  <rect x="1010" y="80" width="230" height="540" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1125" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--danger-text)">Aggregations</text>
  <text x="1030" y="150" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">sum</text>
  <text x="1030" y="180" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">mean</text>
  <text x="1030" y="210" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">median</text>
  <text x="1030" y="240" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">count</text>
  <text x="1030" y="270" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">min</text>
  <text x="1030" y="300" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">max</text>
  <text x="1030" y="330" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">std</text>
  <text x="1030" y="360" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">first</text>
  <text x="1030" y="390" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">last</text>
  <text x="1030" y="420" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">agg(custom)</text>
  <text x="1125" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--danger-text)">df.groupby('key')</text>
  <text x="1125" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">.value.sum()</text>
  <text x="1125" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">Vectorised — fast</text>
  <text x="1125" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">Multi-key supported</text>
  <text x="1125" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">Like SQL GROUP BY</text>
</svg>

  <text x="640" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--info-text)">Rule: align from the right — 1's and missing dims stretch</text>
  <text x="640" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">(3, 4) and (4,) → (3, 4); (3, 1) and (1, 4) → (3, 4)</text>
  <rect x="40" y="460" width="1200" height="160" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--danger-text)">Why care</text>
  <text x="640" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">No Python loops; runs in compiled C</text>
  <text x="640" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">Virtual replication, no copy</text>
  <text x="640" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Same idea powers pandas, jax, torch</text>

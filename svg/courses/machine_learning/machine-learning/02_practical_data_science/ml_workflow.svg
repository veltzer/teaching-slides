<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.854226236055" font-weight="bold" fill="var(--text)">ML Project Workflow</text>

  <rect x="40" y="86.194690265487" width="206.896551724138" height="102.654867256637" rx="10.305080798591" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="143.448275862069" y="122.12389380531" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.488129277745" font-weight="bold" fill="var(--info-text)">1. Frame</text>
  <text x="143.448275862069" y="147.787610619469" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.366096958309" fill="var(--info-text)">problem -&gt; ML task</text>
  <text x="143.448275862069" y="168.318584070796" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.366096958309" fill="var(--info-text)">define metric</text>

  <path d="M 248.965517241379 137.522123893805 L 311.034482758621 137.522123893805" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="319.310344827586" y="86.194690265487" width="206.896551724138" height="102.654867256637" rx="10.305080798591" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="422.758620689655" y="122.12389380531" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.488129277745" font-weight="bold" fill="var(--primary-text)">2. Data</text>
  <text x="422.758620689655" y="147.787610619469" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.366096958309" fill="var(--primary-text)">collect, clean</text>
  <text x="422.758620689655" y="168.318584070796" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.366096958309" fill="var(--primary-text)">explore, split</text>

  <path d="M 528.275862068966 137.522123893805 L 590.344827586207 137.522123893805" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="598.620689655172" y="86.194690265487" width="206.896551724138" height="102.654867256637" rx="10.305080798591" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="702.068965517241" y="122.12389380531" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.488129277745" font-weight="bold" fill="var(--warn-text)">3. Features</text>
  <text x="702.068965517241" y="147.787610619469" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.366096958309" fill="var(--warn-text)">engineer, encode</text>
  <text x="702.068965517241" y="168.318584070796" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.366096958309" fill="var(--warn-text)">scale</text>

  <path d="M 807.586206896552 137.522123893805 L 869.655172413793 137.522123893805" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="877.931034482759" y="86.194690265487" width="206.896551724138" height="102.654867256637" rx="10.305080798591" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="981.379310344828" y="122.12389380531" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.488129277745" font-weight="bold" fill="var(--ok-text)">4. Train</text>
  <text x="981.379310344828" y="147.787610619469" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.366096958309" fill="var(--ok-text)">baseline first</text>
  <text x="981.379310344828" y="168.318584070796" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.366096958309" fill="var(--ok-text)">tune later</text>

  <path d="M 981.379310344828 209.380530973451 Q 981.379310344828 270.973451327434 702.068965517241 270.973451327434" stroke="var(--text)" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect x="598.620689655172" y="270.973451327434" width="206.896551724138" height="102.654867256637" rx="10.305080798591" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="702.068965517241" y="306.902654867257" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.488129277745" font-weight="bold" fill="var(--info-text)">5. Evaluate</text>
  <text x="702.068965517241" y="332.566371681416" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.366096958309" fill="var(--info-text)">on holdout set</text>
  <text x="702.068965517241" y="353.097345132743" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.366096958309" fill="var(--info-text)">vs baseline</text>

  <path d="M 702.068965517241 373.628318584071 L 702.068965517241 414.690265486726" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="598.620689655172" y="424.955752212389" width="206.896551724138" height="102.654867256637" rx="10.305080798591" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="702.068965517241" y="460.884955752212" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.488129277745" font-weight="bold" fill="var(--danger-text)">6. Deploy</text>
  <text x="702.068965517241" y="486.548672566372" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.366096958309" fill="var(--danger-text)">prod inference</text>
  <text x="702.068965517241" y="507.079646017699" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.366096958309" fill="var(--danger-text)">monitor drift</text>

  <path d="M 598.620689655172 476.283185840708 Q 184.827586206897 476.283185840708 143.448275862069 209.380530973451" stroke="var(--text)" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrow)"/>
  <text x="184.827586206897" y="471.150442477876" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--text-muted)">retrain on drift</text>

  <rect x="40" y="558.407079646018" width="1200" height="61.592920353982" rx="8.244064638873" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="589.203539823009" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.427113118027" font-weight="bold" fill="var(--text)">Most projects fail at framing or data, not modelling</text>
  <text x="640" y="611.787610619469" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--text-muted)">Spend 80% of time at the left</text>
</svg>

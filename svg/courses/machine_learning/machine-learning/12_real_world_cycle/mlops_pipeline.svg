<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata><type>regular</type></metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #c4cdd6; --border: #6b7280; --text: #212121;
        --text-muted: #555555; --text-faint: #888888; --code-bg: #1a1a2e;
        --shadow: #00000044; --black: #000000;
        --primary-fill: #5a7a9c; --primary-border: #3d5a7d; --primary-text: #ffffff; --primary-accent: #243b59;
        --ok-fill: #7a9a6a; --ok-border: #5a7a4d; --ok-text: #ffffff; --ok-accent: #385030;
        --warn-fill: #c8924a; --warn-border: #9c6e2e; --warn-text: #ffffff; --warn-accent: #5a3f12;
        --danger-fill: #a86058; --danger-border: #7d3f38; --danger-text: #ffffff; --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e; --info-border: #574a68; --info-text: #ffffff; --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
  </defs>
  <line x1="40" y1="40" x2="1240" y2="40" stroke="var(--border)" stroke-width="1"/>
  <text x="40" y="80" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--text)">MLOps lifecycle</text>
  <rect x="40" y="120" width="200" height="120" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">Data</text>
  <text x="140" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">ingest, validate</text>
  <text x="140" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">feature store</text>
  <line x1="240" y1="180" x2="290" y2="180" stroke="var(--text)" stroke-width="2"/>
  <rect x="290" y="120" width="200" height="120" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="390" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">Train</text>
  <text x="390" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">experiment, tune</text>
  <text x="390" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">version artefacts</text>
  <line x1="490" y1="180" x2="540" y2="180" stroke="var(--text)" stroke-width="2"/>
  <rect x="540" y="120" width="200" height="120" rx="10" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-text)">Evaluate</text>
  <text x="640" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">tests, metrics</text>
  <text x="640" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">subgroup checks</text>
  <line x1="740" y1="180" x2="790" y2="180" stroke="var(--text)" stroke-width="2"/>
  <rect x="790" y="120" width="200" height="120" rx="10" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="890" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-text)">Register</text>
  <text x="890" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">model registry</text>
  <text x="890" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">stage: dev/prod</text>
  <line x1="990" y1="180" x2="1040" y2="180" stroke="var(--text)" stroke-width="2"/>
  <rect x="1040" y="120" width="200" height="120" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1140" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-text)">Deploy</text>
  <text x="1140" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">canary, shadow</text>
  <text x="1140" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">rollback ready</text>
  <line x1="1140" y1="240" x2="1140" y2="300" stroke="var(--text)" stroke-width="2"/>
  <line x1="1140" y1="300" x2="640" y2="300" stroke="var(--text)" stroke-width="2"/>
  <line x1="640" y1="300" x2="640" y2="350" stroke="var(--text)" stroke-width="2"/>
  <rect x="540" y="350" width="200" height="120" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--info-text)">Monitor</text>
  <text x="640" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">drift, decay</text>
  <text x="640" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">alerts</text>
  <line x1="540" y1="410" x2="490" y2="410" stroke="var(--text)" stroke-width="2"/>
  <line x1="490" y1="410" x2="490" y2="240" stroke="var(--text)" stroke-width="2"/>
  <text x="40" y="540" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Underneath:</text>
  <text x="60" y="580" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">Version control: code + data + models</text>
  <text x="60" y="610" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">Reproducible builds, automated tests, rollback paths</text>
  <text x="700" y="540" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Tools:</text>
  <text x="720" y="580" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">MLflow, DVC, Weights &amp; Biases</text>
  <text x="720" y="610" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">Kubeflow, SageMaker, Vertex AI</text>
  <line x1="40" y1="620" x2="1240" y2="620" stroke="var(--border)" stroke-width="1"/>
</svg>

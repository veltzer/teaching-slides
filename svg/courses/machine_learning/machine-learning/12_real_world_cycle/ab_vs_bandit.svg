<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="595" height="580" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="337" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">A/B Test</text>
  <text x="337" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">fixed split, statistical rigour</text>
  <text x="60" y="170" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-text)">How:</text>
  <text x="60" y="205" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Random assignment 50/50</text>
  <text x="60" y="240" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Run for predetermined N</text>
  <text x="60" y="275" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Compare with stat test</text>
  <text x="60" y="330" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-text)">Pros:</text>
  <text x="60" y="365" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Clean causal estimate</text>
  <text x="60" y="400" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Confidence intervals</text>
  <text x="60" y="435" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Industry default</text>
  <text x="60" y="490" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-text)">Cons:</text>
  <text x="60" y="525" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Half traffic on losing arm</text>
  <text x="60" y="560" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Slow when traffic precious</text>
  <text x="60" y="610" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-text)">Use: high-stakes changes</text>
  <rect x="645" y="40" width="595" height="580" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="942" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Multi-Armed Bandit</text>
  <text x="942" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">adaptive, exploit better arms</text>
  <text x="665" y="170" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-text)">How:</text>
  <text x="665" y="205" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Allocate more to winners</text>
  <text x="665" y="240" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Thompson sampling, UCB</text>
  <text x="665" y="275" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Or Epsilon-greedy</text>
  <text x="665" y="330" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-text)">Pros:</text>
  <text x="665" y="365" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Less wasted traffic</text>
  <text x="665" y="400" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Continuous, no fixed end</text>
  <text x="665" y="435" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Many arms in parallel</text>
  <text x="665" y="490" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-text)">Cons:</text>
  <text x="665" y="525" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Looser inference</text>
  <text x="665" y="560" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Harder when reward delayed</text>
  <text x="665" y="610" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-text)">Use: many candidates, fast feedback</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#c4cdd6"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bd7d75"/><stop offset="100%" stop-color="#7d3f38"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#555555"/></marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/></marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/></marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/></marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/></marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/></marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/></marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Binary vs Multi-Class Classification</text>
  <rect x="40" y="80" width="580" height="540" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--primary-text)">Binary</text>
  <text x="330" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Two classes — yes / no</text>
  <rect x="80" y="175" width="500" height="240" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="114" y="204" width="12" height="12" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="144" y="244" width="12" height="12" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="174" y="214" width="12" height="12" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="134" y="274" width="12" height="12" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="104" y="254" width="12" height="12" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="164" y="294" width="12" height="12" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="194" y="234" width="12" height="12" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="129" y="304" width="12" height="12" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="414" y="354" width="12" height="12" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="444" y="314" width="12" height="12" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="474" y="374" width="12" height="12" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="504" y="334" width="12" height="12" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="384" y="364" width="12" height="12" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="514" y="294" width="12" height="12" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="459" y="389" width="12" height="12" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="534" y="354" width="12" height="12" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <line x1="220" y1="175" x2="380" y2="415" stroke="var(--primary-accent)" stroke-width="3" stroke-dasharray="6,3"/>
  <text x="330" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">One decision boundary</text>
  <text x="60" y="480" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--primary-text)">Output: P(positive class)</text>
  <text x="60" y="510" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Threshold typically 0.5</text>
  <text x="60" y="540" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Loss: binary cross-entropy</text>
  <text x="60" y="570" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Activation: sigmoid</text>
  <text x="60" y="600" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--primary-text)">Examples: spam, fraud, churn</text>
  <rect x="660" y="80" width="580" height="540" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--info-text)">Multi-Class</text>
  <text x="950" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">K classes — one chosen</text>
  <rect x="700" y="175" width="500" height="240" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="734" y="204" width="12" height="12" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="764" y="244" width="12" height="12" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="794" y="214" width="12" height="12" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="754" y="274" width="12" height="12" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="724" y="224" width="12" height="12" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="944" y="194" width="12" height="12" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="994" y="224" width="12" height="12" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="954" y="254" width="12" height="12" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="984" y="274" width="12" height="12" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1014" y="204" width="12" height="12" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1094" y="354" width="12" height="12" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1124" y="314" width="12" height="12" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1144" y="374" width="12" height="12" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1074" y="394" width="12" height="12" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1164" y="344" width="12" height="12" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <line x1="870" y1="175" x2="870" y2="415" stroke="var(--info-accent)" stroke-width="2" stroke-dasharray="4,2"/>
  <line x1="1050" y1="175" x2="1050" y2="415" stroke="var(--info-accent)" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="950" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Multiple decision regions</text>
  <text x="680" y="480" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--info-text)">Output: vector of K probabilities</text>
  <text x="680" y="510" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Sums to 1 (softmax)</text>
  <text x="680" y="540" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Loss: categorical cross-entropy</text>
  <text x="680" y="570" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Argmax to pick the class</text>
  <text x="680" y="600" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--info-text)">Examples: digits, language, species</text>
</svg>

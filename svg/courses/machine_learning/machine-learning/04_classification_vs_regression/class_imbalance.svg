<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#c4cdd6"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bd7d75"/><stop offset="100%" stop-color="#7d3f38"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#555555"/></marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/></marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/></marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/></marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/></marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/></marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/></marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Class Imbalance</text>
  <rect x="40" y="80" width="1200" height="80" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="40" y="80" width="1140" height="80" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="610" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--primary-text)">Majority class — 95%</text>
  <rect x="1180" y="80" width="60" height="80" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1210" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--danger-text)">5%</text>
  <rect x="40" y="175" width="1200" height="60" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">A constant 'predict majority' classifier scores 95% accuracy</text>
  <rect x="40" y="250" width="380" height="370" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--danger-text)">What goes wrong</text>
  <text x="60" y="325" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Accuracy is misleading</text>
  <text x="60" y="355" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Rare class often the goal</text>
  <text x="60" y="385" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Model favors majority</text>
  <text x="60" y="415" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Training sees few positives</text>
  <text x="60" y="445" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Decision boundary biased</text>
  <text x="60" y="485" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--danger-text)">Examples:</text>
  <text x="60" y="515" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">• Fraud</text>
  <text x="60" y="545" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">• Disease screening</text>
  <text x="60" y="575" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">• Manufacturing defects</text>
  <text x="60" y="605" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">• Click prediction</text>
  <rect x="450" y="250" width="380" height="370" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-text)">Better metrics</text>
  <text x="470" y="325" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Precision / Recall</text>
  <text x="470" y="355" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">F1 score</text>
  <text x="470" y="385" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">PR-AUC (better than ROC for rare)</text>
  <text x="470" y="415" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Confusion matrix</text>
  <text x="470" y="445" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Cost-weighted error</text>
  <text x="470" y="485" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Calibration plot</text>
  <text x="470" y="525" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-text)">Always measure on the rare</text>
  <text x="470" y="555" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-text)">class — the majority is easy</text>
  <rect x="860" y="250" width="380" height="370" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--info-text)">Mitigations</text>
  <text x="880" y="325" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Class weights in loss</text>
  <text x="880" y="355" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Oversample minority (SMOTE)</text>
  <text x="880" y="385" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Undersample majority</text>
  <text x="880" y="415" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Threshold tuning</text>
  <text x="880" y="445" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Anomaly-detection framing</text>
  <text x="880" y="485" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Collect more rare examples</text>
  <text x="880" y="525" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Cost-sensitive learning</text>
  <text x="880" y="565" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--info-text)">Stratified k-fold for evaluation</text>
  <text x="880" y="595" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--info-text)">Don't oversample before split!</text>
</svg>

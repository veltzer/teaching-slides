<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata><type>regular</type></metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #c4cdd6; --border: #6b7280; --text: #212121;
        --text-muted: #555555; --text-faint: #888888; --code-bg: #1a1a2e;
        --shadow: #00000044; --black: #000000;
        --primary-fill: #5a7a9c; --primary-border: #3d5a7d; --primary-text: #ffffff; --primary-accent: #243b59;
        --ok-fill: #7a9a6a; --ok-border: #5a7a4d; --ok-text: #ffffff; --ok-accent: #385030;
        --warn-fill: #c8924a; --warn-border: #9c6e2e; --warn-text: #ffffff; --warn-accent: #5a3f12;
        --danger-fill: #a86058; --danger-border: #7d3f38; --danger-text: #ffffff; --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e; --info-border: #574a68; --info-text: #ffffff; --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
  </defs>
  <rect x="40" y="40" width="700" height="580" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="390" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Score distribution per class</text>
  <line x1="100" y1="120" x2="100" y2="500" stroke="var(--text)" stroke-width="2"/>
  <line x1="100" y1="500" x2="700" y2="500" stroke="var(--text)" stroke-width="2"/>
  <text x="60" y="320" font-family="Arial, sans-serif" font-size="14" fill="var(--text)" transform="rotate(-90 60 320)">density</text>
  <text x="395" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">predicted score</text>
  <text x="100" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">0</text>
  <text x="700" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">1</text>
  <path d="M 100 500 Q 180 500 220 350 Q 260 200 280 200 Q 300 200 340 350 Q 380 500 460 500" stroke="var(--ok-border)" stroke-width="3" fill="none"/>
  <text x="240" y="180" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-border)">negatives</text>
  <path d="M 340 500 Q 420 500 460 350 Q 500 200 520 200 Q 540 200 580 350 Q 620 500 700 500" stroke="var(--danger-border)" stroke-width="3" fill="none"/>
  <text x="495" y="180" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-border)">positives</text>
  <line x1="400" y1="120" x2="400" y2="500" stroke="var(--warn-border)" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="410" y="135" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-border)">threshold</text>
  <text x="200" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">predicted negative</text>
  <text x="600" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">predicted positive</text>
  <text x="60" y="600" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Threshold left → more positives → more recall, less precision</text>
  <text x="60" y="618" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Threshold right → fewer positives → more precision, less recall</text>
  <rect x="760" y="40" width="480" height="580" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Pick by business cost</text>
  <text x="780" y="140" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">FN expensive (miss critical):</text>
  <text x="780" y="175" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Cancer screening</text>
  <text x="780" y="210" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Fraud detection</text>
  <text x="780" y="245" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">→ low threshold, high recall</text>
  <text x="780" y="300" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">FP expensive (false alarm):</text>
  <text x="780" y="335" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Spam filter (legit lost)</text>
  <text x="780" y="370" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Loan approval</text>
  <text x="780" y="405" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">→ high threshold, high precision</text>
  <text x="780" y="460" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Method:</text>
  <text x="780" y="495" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Sweep thresholds on val</text>
  <text x="780" y="530" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Maximise expected utility</text>
  <text x="780" y="585" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Document the choice</text>
</svg>

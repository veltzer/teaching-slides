<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>
  </defs>
  <rect x="40" y="40" width="585" height="280" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="332" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Multi-Class</text>
  <text x="60" y="120" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">One label per example</text>
  <text x="60" y="155" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Classes are exclusive</text>
  <text x="60" y="190" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Example: digit 0–9</text>
  <text x="60" y="225" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Use softmax output</text>
  <text x="60" y="260" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Pick argmax probability</text>
  <text x="60" y="295" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Confusion matrix grows with k</text>
  <rect x="655" y="40" width="585" height="280" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="947" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Multi-Label</text>
  <text x="675" y="120" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Many labels per example</text>
  <text x="675" y="155" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Labels are independent</text>
  <text x="675" y="190" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Example: tags on a photo</text>
  <text x="675" y="225" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">One sigmoid per label</text>
  <text x="675" y="260" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Threshold each independently</text>
  <text x="675" y="295" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Hamming loss / per-label F1</text>
  <rect x="40" y="340" width="585" height="280" rx="10" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="332" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">When Multi-Class</text>
  <text x="60" y="420" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Categorical decisions</text>
  <text x="60" y="455" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Mutually exclusive states</text>
  <text x="60" y="490" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Spam / not spam</text>
  <text x="60" y="525" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Routing to one queue</text>
  <text x="60" y="560" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Diagnosis with one disease</text>
  <text x="60" y="595" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Picking one product</text>
  <rect x="655" y="340" width="585" height="280" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="947" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">When Multi-Label</text>
  <text x="675" y="420" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Tagging tasks</text>
  <text x="675" y="455" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Topic detection</text>
  <text x="675" y="490" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Genre prediction</text>
  <text x="675" y="525" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Comorbidities</text>
  <text x="675" y="560" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Multi-attribute search</text>
  <text x="675" y="595" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Recommendations</text>
</svg>

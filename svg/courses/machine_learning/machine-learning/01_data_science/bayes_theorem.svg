<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#c4cdd6"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bd7d75"/><stop offset="100%" stop-color="#7d3f38"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#555555"/></marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/></marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/></marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/></marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/></marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/></marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/></marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Bayes' Theorem</text>
  <rect x="40" y="80" width="1200" height="130" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="var(--primary-text)">P(A | B) = P(B | A) · P(A) / P(B)</text>
  <text x="640" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--primary-text)">Posterior = Likelihood × Prior / Evidence</text>
  <rect x="40" y="230" width="290" height="200" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Prior P(A)</text>
  <text x="60" y="305" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Belief before data</text>
  <text x="60" y="335" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Base rate</text>
  <text x="60" y="365" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Disease incidence</text>
  <text x="60" y="395" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Updated by evidence</text>
  <rect x="345" y="230" width="290" height="200" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Likelihood P(B|A)</text>
  <text x="365" y="305" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">How likely the data</text>
  <text x="365" y="335" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Given the hypothesis</text>
  <text x="365" y="365" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Test sensitivity</text>
  <text x="365" y="395" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">From experiments</text>
  <rect x="650" y="230" width="290" height="200" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="795" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Evidence P(B)</text>
  <text x="670" y="305" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Total probability of B</text>
  <text x="670" y="335" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Marginal</text>
  <text x="670" y="365" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Sum over hypotheses</text>
  <text x="670" y="395" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Normalising constant</text>
  <rect x="955" y="230" width="285" height="200" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--danger-text)">Posterior P(A|B)</text>
  <text x="975" y="305" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Belief after data</text>
  <text x="975" y="335" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Updated estimate</text>
  <text x="975" y="365" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Goal of inference</text>
  <text x="975" y="395" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Feeds into decisions</text>
  <rect x="40" y="450" width="1200" height="170" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Worked example — disease test</text>
  <text x="640" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">1% prevalence — 99% sensitivity — 95% specificity</text>
  <text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">Positive test result: P(disease | positive) ≈ 17%</text>
  <text x="640" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Most positives are false positives because the prior is tiny</text>
  <text x="640" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Bayes resolves the base-rate fallacy</text>
</svg>

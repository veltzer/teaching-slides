<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#c4cdd6"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bd7d75"/><stop offset="100%" stop-color="#7d3f38"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#555555"/></marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/></marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/></marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/></marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/></marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/></marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/></marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Hypothesis Testing</text>
  <rect x="40" y="80" width="580" height="260" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Null Hypothesis H₀</text>
  <text x="60" y="170" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Default: effect = 0</text>
  <text x="60" y="220" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Reject if data unlikely under H₀</text>
  <text x="60" y="290" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-text)">Example: drug = placebo</text>
  <rect x="660" y="80" width="580" height="260" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Alternative H₁</text>
  <text x="680" y="170" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">What we suspect is true</text>
  <text x="680" y="220" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Effect ≠ 0; needs evidence</text>
  <text x="680" y="290" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-text)">Example: drug &gt; placebo</text>
  <rect x="40" y="360" width="380" height="260" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-text)">Type I Error (α)</text>
  <text x="60" y="440" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Reject H₀ when it is true</text>
  <text x="60" y="475" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">False positive — convict innocent</text>
  <text x="60" y="510" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Set α (typically 0.05)</text>
  <text x="60" y="560" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-text)">Tolerance for being wrong</text>
  <rect x="450" y="360" width="380" height="260" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--danger-text)">Type II Error (β)</text>
  <text x="470" y="440" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Fail to reject H₀ when false</text>
  <text x="470" y="475" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">False negative — miss real effect</text>
  <text x="470" y="510" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">1 − β = power</text>
  <text x="470" y="560" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--danger-text)">Bigger sample → more power</text>
  <rect x="860" y="360" width="380" height="260" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--info-text)">p-value</text>
  <text x="880" y="440" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">P(data | H₀)</text>
  <text x="880" y="475" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">If p &lt; α, reject H₀</text>
  <text x="880" y="510" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Depends on sample size</text>
  <text x="880" y="560" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--info-text)">Small p ≠ big effect</text>
</svg>

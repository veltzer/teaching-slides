<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata><type>regular</type></metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #c4cdd6; --border: #6b7280; --text: #212121;
        --text-muted: #555555; --text-faint: #888888; --code-bg: #1a1a2e;
        --shadow: #00000044; --black: #000000;
        --primary-fill: #5a7a9c; --primary-border: #3d5a7d; --primary-text: #ffffff; --primary-accent: #243b59;
        --ok-fill: #7a9a6a; --ok-border: #5a7a4d; --ok-text: #ffffff; --ok-accent: #385030;
        --warn-fill: #c8924a; --warn-border: #9c6e2e; --warn-text: #ffffff; --warn-accent: #5a3f12;
        --danger-fill: #a86058; --danger-border: #7d3f38; --danger-text: #ffffff; --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e; --info-border: #574a68; --info-text: #ffffff; --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
  </defs>
  <rect x="40" y="40" width="160" height="80" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="120" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">x₁</text>
  <rect x="40" y="180" width="160" height="80" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="120" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">x₂</text>
  <rect x="40" y="320" width="160" height="80" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="120" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">x₃</text>
  <rect x="40" y="460" width="160" height="80" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="120" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">bias = 1</text>
  <line x1="200" y1="80" x2="380" y2="290" stroke="var(--text)" stroke-width="2"/>
  <text x="270" y="170" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">w₁</text>
  <line x1="200" y1="220" x2="380" y2="300" stroke="var(--text)" stroke-width="2"/>
  <text x="270" y="245" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">w₂</text>
  <line x1="200" y1="360" x2="380" y2="320" stroke="var(--text)" stroke-width="2"/>
  <text x="270" y="335" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">w₃</text>
  <line x1="200" y1="500" x2="380" y2="340" stroke="var(--text)" stroke-width="2"/>
  <text x="270" y="430" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">b</text>
  <rect x="380" y="270" width="160" height="80" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="460" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-text)">Σ wᵢxᵢ + b</text>
  <text x="460" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">weighted sum</text>
  <line x1="540" y1="310" x2="620" y2="310" stroke="var(--text)" stroke-width="2"/>
  <rect x="620" y="270" width="160" height="80" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="700" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">step / sign</text>
  <text x="700" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">activation</text>
  <line x1="780" y1="310" x2="900" y2="310" stroke="var(--text)" stroke-width="2"/>
  <text x="920" y="315" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">→ ŷ ∈ {0, 1}</text>
  <text x="40" y="600" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Update: wᵢ ← wᵢ + (y − ŷ) · xᵢ on each error. Repeat over the data.</text>
  <rect x="800" y="40" width="440" height="220" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1020" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Perceptron</text>
  <text x="820" y="135" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Original neural unit (1958)</text>
  <text x="820" y="170" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Linear binary classifier</text>
  <text x="820" y="205" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Updates only on mistakes</text>
  <text x="820" y="240" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Building block of MLPs</text>
  <rect x="800" y="380" width="440" height="240" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1020" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Limits</text>
  <text x="820" y="475" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Only linearly separable</text>
  <text x="820" y="510" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">No probabilities</text>
  <text x="820" y="545" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Can oscillate forever</text>
  <text x="820" y="580" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Stack to make MLPs</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata><type>regular</type></metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #c4cdd6; --border: #6b7280; --text: #212121;
        --text-muted: #555555; --text-faint: #888888; --code-bg: #1a1a2e;
        --shadow: #00000044; --black: #000000;
        --primary-fill: #5a7a9c; --primary-border: #3d5a7d; --primary-text: #ffffff; --primary-accent: #243b59;
        --ok-fill: #7a9a6a; --ok-border: #5a7a4d; --ok-text: #ffffff; --ok-accent: #385030;
        --warn-fill: #c8924a; --warn-border: #9c6e2e; --warn-text: #ffffff; --warn-accent: #5a3f12;
        --danger-fill: #a86058; --danger-border: #7d3f38; --danger-text: #ffffff; --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e; --info-border: #574a68; --info-text: #ffffff; --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
  </defs>
  <rect x="40" y="40" width="700" height="580" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <ellipse cx="200" cy="200" rx="10" ry="10" fill="var(--primary-fill)"/>
  <ellipse cx="240" cy="240" rx="10" ry="10" fill="var(--primary-fill)"/>
  <ellipse cx="180" cy="280" rx="10" ry="10" fill="var(--primary-fill)"/>
  <ellipse cx="280" cy="180" rx="10" ry="10" fill="var(--primary-fill)"/>
  <ellipse cx="220" cy="320" rx="10" ry="10" fill="var(--primary-fill)"/>
  <ellipse cx="320" cy="240" rx="10" ry="10" fill="var(--primary-fill)"/>
  <ellipse cx="500" cy="380" rx="10" ry="10" fill="var(--ok-fill)"/>
  <ellipse cx="540" cy="420" rx="10" ry="10" fill="var(--ok-fill)"/>
  <ellipse cx="480" cy="460" rx="10" ry="10" fill="var(--ok-fill)"/>
  <ellipse cx="580" cy="380" rx="10" ry="10" fill="var(--ok-fill)"/>
  <ellipse cx="520" cy="500" rx="10" ry="10" fill="var(--ok-fill)"/>
  <ellipse cx="620" cy="440" rx="10" ry="10" fill="var(--ok-fill)"/>
  <ellipse cx="380" cy="320" rx="14" ry="14" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <ellipse cx="380" cy="320" rx="120" ry="120" fill="none" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="380" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">new point</text>
  <text x="60" y="540" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">Find k nearest training points</text>
  <text x="60" y="570" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">Vote for classification, average for regression</text>
  <rect x="760" y="40" width="480" height="580" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">k-Nearest Neighbours</text>
  <text x="780" y="140" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">No training step</text>
  <text x="780" y="175" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Store all training data</text>
  <text x="780" y="210" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Predict by lookup</text>
  <text x="780" y="265" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Choose k:</text>
  <text x="780" y="300" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Small k: noisy, low bias</text>
  <text x="780" y="335" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Large k: smooth, high bias</text>
  <text x="780" y="370" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Tune via cross-validation</text>
  <text x="780" y="425" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Distance:</text>
  <text x="780" y="460" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Euclidean default</text>
  <text x="780" y="495" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Always scale features first</text>
  <text x="780" y="550" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Watch out:</text>
  <text x="780" y="585" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Slow at inference for large data</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata><type>regular</type></metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #c4cdd6; --border: #6b7280; --text: #212121;
        --text-muted: #555555; --text-faint: #888888; --code-bg: #1a1a2e;
        --shadow: #00000044; --black: #000000;
        --primary-fill: #5a7a9c; --primary-border: #3d5a7d; --primary-text: #ffffff; --primary-accent: #243b59;
        --ok-fill: #7a9a6a; --ok-border: #5a7a4d; --ok-text: #ffffff; --ok-accent: #385030;
        --warn-fill: #c8924a; --warn-border: #9c6e2e; --warn-text: #ffffff; --warn-accent: #5a3f12;
        --danger-fill: #a86058; --danger-border: #7d3f38; --danger-text: #ffffff; --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e; --info-border: #574a68; --info-text: #ffffff; --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
  </defs>
  <rect x="40" y="40" width="700" height="580" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <line x1="100" y1="80" x2="100" y2="560" stroke="var(--text)" stroke-width="2"/>
  <line x1="100" y1="560" x2="700" y2="560" stroke="var(--text)" stroke-width="2"/>
  <text x="50" y="320" font-family="Arial, sans-serif" font-size="16" fill="var(--text)" transform="rotate(-90 50 320)">y</text>
  <text x="395" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">x</text>
  <ellipse cx="160" cy="500" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="220" cy="470" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="280" cy="430" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="340" cy="420" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="400" cy="370" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="460" cy="340" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="520" cy="290" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="580" cy="250" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="640" cy="210" rx="6" ry="6" fill="var(--primary-fill)"/>
  <line x1="120" y1="520" x2="680" y2="180" stroke="var(--ok-border)" stroke-width="3"/>
  <line x1="160" y1="500" x2="160" y2="500" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="220" y1="470" x2="220" y2="495" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="280" y1="430" x2="280" y2="460" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="340" y1="420" x2="340" y2="425" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="400" y1="370" x2="400" y2="395" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="460" y1="340" x2="460" y2="362" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="520" y1="290" x2="520" y2="328" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="580" y1="250" x2="580" y2="295" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="640" y1="210" x2="640" y2="262" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="100" y="120" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Dashed: residuals (errors)</text>
  <text x="100" y="140" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Line minimises sum of squared residuals</text>
  <rect x="760" y="40" width="480" height="580" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Linear Regression</text>
  <text x="780" y="140" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Model: y = w · x + b</text>
  <text x="780" y="175" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Find w that minimises</text>
  <text x="780" y="210" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">sum of squared errors</text>
  <text x="780" y="265" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Solve via:</text>
  <text x="780" y="300" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Closed form (normal eqn)</text>
  <text x="780" y="335" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Gradient descent</text>
  <text x="780" y="390" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Use when:</text>
  <text x="780" y="425" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Linear relationship</text>
  <text x="780" y="460" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Need a baseline</text>
  <text x="780" y="495" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Interpretability matters</text>
  <text x="780" y="550" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Watch out:</text>
  <text x="780" y="585" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Outliers move the line</text>
</svg>

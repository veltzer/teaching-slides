<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata><type>regular</type></metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #c4cdd6; --border: #6b7280; --text: #212121;
        --text-muted: #555555; --text-faint: #888888; --code-bg: #1a1a2e;
        --shadow: #00000044; --black: #000000;
        --primary-fill: #5a7a9c; --primary-border: #3d5a7d; --primary-text: #ffffff; --primary-accent: #243b59;
        --ok-fill: #7a9a6a; --ok-border: #5a7a4d; --ok-text: #ffffff; --ok-accent: #385030;
        --warn-fill: #c8924a; --warn-border: #9c6e2e; --warn-text: #ffffff; --warn-accent: #5a3f12;
        --danger-fill: #a86058; --danger-border: #7d3f38; --danger-text: #ffffff; --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e; --info-border: #574a68; --info-text: #ffffff; --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
  </defs>
  <rect x="40" y="40" width="700" height="580" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="60" y="80" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Loss landscape</text>
  <ellipse cx="390" cy="380" rx="280" ry="180" fill="none" stroke="var(--text-faint)" stroke-width="1"/>
  <ellipse cx="390" cy="380" rx="220" ry="140" fill="none" stroke="var(--text-faint)" stroke-width="1"/>
  <ellipse cx="390" cy="380" rx="160" ry="100" fill="none" stroke="var(--text-faint)" stroke-width="1"/>
  <ellipse cx="390" cy="380" rx="100" ry="60" fill="none" stroke="var(--text-faint)" stroke-width="1"/>
  <ellipse cx="390" cy="380" rx="40" ry="24" fill="none" stroke="var(--text-faint)" stroke-width="1"/>
  <ellipse cx="390" cy="380" rx="6" ry="6" fill="var(--ok-border)"/>
  <text x="400" y="370" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-border)">minimum</text>
  <ellipse cx="120" cy="180" rx="8" ry="8" fill="var(--danger-border)"/>
  <text x="135" y="175" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">start</text>
  <line x1="120" y1="180" x2="170" y2="240" stroke="var(--danger-border)" stroke-width="2"/>
  <line x1="170" y1="240" x2="180" y2="200" stroke="var(--danger-border)" stroke-width="2"/>
  <line x1="180" y1="200" x2="240" y2="280" stroke="var(--danger-border)" stroke-width="2"/>
  <line x1="240" y1="280" x2="220" y2="320" stroke="var(--danger-border)" stroke-width="2"/>
  <line x1="220" y1="320" x2="290" y2="350" stroke="var(--danger-border)" stroke-width="2"/>
  <line x1="290" y1="350" x2="280" y2="400" stroke="var(--danger-border)" stroke-width="2"/>
  <line x1="280" y1="400" x2="340" y2="370" stroke="var(--danger-border)" stroke-width="2"/>
  <line x1="340" y1="370" x2="370" y2="395" stroke="var(--danger-border)" stroke-width="2"/>
  <line x1="370" y1="395" x2="385" y2="378" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="60" y="540" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Each red step: w ← w − η · ∇loss(sample)</text>
  <text x="60" y="570" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Noisy path, but converges in expectation</text>
  <rect x="760" y="40" width="480" height="580" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Stochastic Gradient Descent</text>
  <text x="780" y="140" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">One sample (or mini-batch)</text>
  <text x="780" y="175" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Compute gradient, take step</text>
  <text x="780" y="210" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Repeat until converged</text>
  <text x="780" y="265" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Learning rate η:</text>
  <text x="780" y="300" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Too high: diverges</text>
  <text x="780" y="335" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Too low: too slow</text>
  <text x="780" y="370" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Tune carefully</text>
  <text x="780" y="425" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Tricks:</text>
  <text x="780" y="460" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Momentum, Nesterov</text>
  <text x="780" y="495" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Adam, AdaGrad, RMSprop</text>
  <text x="780" y="550" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Why SGD wins:</text>
  <text x="780" y="585" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Scales to millions of rows</text>
</svg>

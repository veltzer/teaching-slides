<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata><type>regular</type></metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #c4cdd6; --border: #6b7280; --text: #212121;
        --text-muted: #555555; --text-faint: #888888; --code-bg: #1a1a2e;
        --shadow: #00000044; --black: #000000;
        --primary-fill: #5a7a9c; --primary-border: #3d5a7d; --primary-text: #ffffff; --primary-accent: #243b59;
        --ok-fill: #7a9a6a; --ok-border: #5a7a4d; --ok-text: #ffffff; --ok-accent: #385030;
        --warn-fill: #c8924a; --warn-border: #9c6e2e; --warn-text: #ffffff; --warn-accent: #5a3f12;
        --danger-fill: #a86058; --danger-border: #7d3f38; --danger-text: #ffffff; --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e; --info-border: #574a68; --info-text: #ffffff; --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
  </defs>
  <rect x="40" y="40" width="700" height="280" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="390" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Bayes' Theorem</text>
  <text x="390" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="var(--primary-text)">P(class | features) =</text>
  <text x="390" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="var(--primary-text)">P(features | class) · P(class) / P(features)</text>
  <text x="390" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Pick the class with the highest posterior</text>
  <text x="390" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Naive: assume features independent given the class</text>
  <rect x="40" y="340" width="225" height="280" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="152" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Gaussian NB</text>
  <text x="60" y="430" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Continuous features</text>
  <text x="60" y="465" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Per-class mean and variance</text>
  <text x="60" y="500" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Numeric inputs</text>
  <text x="60" y="555" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-text)">sklearn:</text>
  <text x="60" y="585" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">GaussianNB</text>
  <rect x="277" y="340" width="225" height="280" rx="10" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="389" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Multinomial NB</text>
  <text x="295" y="430" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Counts</text>
  <text x="295" y="465" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Word frequencies</text>
  <text x="295" y="500" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Standard for text</text>
  <text x="295" y="555" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn-text)">sklearn:</text>
  <text x="295" y="585" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">MultinomialNB</text>
  <rect x="514" y="340" width="226" height="280" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="627" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Bernoulli NB</text>
  <text x="532" y="430" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Binary features</text>
  <text x="532" y="465" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Word present / absent</text>
  <text x="532" y="500" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Short text</text>
  <text x="532" y="555" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">sklearn:</text>
  <text x="532" y="585" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">BernoulliNB</text>
  <rect x="760" y="40" width="480" height="580" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Why It Works</text>
  <text x="780" y="140" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Independence rarely true</text>
  <text x="780" y="175" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">But ranking is robust</text>
  <text x="780" y="210" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Fast: counts, not gradients</text>
  <text x="780" y="245" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Tiny memory footprint</text>
  <text x="780" y="300" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Strong baseline for:</text>
  <text x="780" y="335" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Spam classification</text>
  <text x="780" y="370" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Document classification</text>
  <text x="780" y="405" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Sentiment analysis</text>
  <text x="780" y="460" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Watch out:</text>
  <text x="780" y="495" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Probabilities can be extreme</text>
  <text x="780" y="530" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Use Laplace smoothing</text>
  <text x="780" y="585" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Calibrate before relying on probs</text>
</svg>

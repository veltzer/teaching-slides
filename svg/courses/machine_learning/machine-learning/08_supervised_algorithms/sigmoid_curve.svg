<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata><type>regular</type></metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #c4cdd6; --border: #6b7280; --text: #212121;
        --text-muted: #555555; --text-faint: #888888; --code-bg: #1a1a2e;
        --shadow: #00000044; --black: #000000;
        --primary-fill: #5a7a9c; --primary-border: #3d5a7d; --primary-text: #ffffff; --primary-accent: #243b59;
        --ok-fill: #7a9a6a; --ok-border: #5a7a4d; --ok-text: #ffffff; --ok-accent: #385030;
        --warn-fill: #c8924a; --warn-border: #9c6e2e; --warn-text: #ffffff; --warn-accent: #5a3f12;
        --danger-fill: #a86058; --danger-border: #7d3f38; --danger-text: #ffffff; --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e; --info-border: #574a68; --info-text: #ffffff; --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
  </defs>
  <rect x="40" y="40" width="700" height="580" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <line x1="100" y1="80" x2="100" y2="560" stroke="var(--text)" stroke-width="2"/>
  <line x1="100" y1="560" x2="700" y2="560" stroke="var(--text)" stroke-width="2"/>
  <line x1="100" y1="320" x2="700" y2="320" stroke="var(--text-faint)" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="400" y1="80" x2="400" y2="560" stroke="var(--text-faint)" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="80" y="110" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">1</text>
  <text x="80" y="325" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">0.5</text>
  <text x="80" y="565" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">0</text>
  <text x="50" y="320" font-family="Arial, sans-serif" font-size="16" fill="var(--text)" transform="rotate(-90 50 320)">P(y=1)</text>
  <text x="395" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">w · x + b</text>
  <path d="M 110 555 C 250 555 350 530 400 320 C 450 110 550 85 690 85" stroke="var(--primary-border)" stroke-width="4" fill="none"/>
  <text x="120" y="180" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Sigmoid:</text>
  <text x="120" y="210" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">σ(z) = 1 / (1 + exp(-z))</text>
  <text x="120" y="245" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">Maps reals to (0, 1)</text>
  <rect x="760" y="40" width="480" height="580" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Logistic Regression</text>
  <text x="780" y="140" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Linear score, then sigmoid</text>
  <text x="780" y="175" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Output is a probability</text>
  <text x="780" y="210" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Threshold at 0.5 by default</text>
  <text x="780" y="265" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Loss: log loss</text>
  <text x="780" y="300" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">−[y log p + (1−y) log(1−p)]</text>
  <text x="780" y="355" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Strengths:</text>
  <text x="780" y="390" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Calibrated probabilities</text>
  <text x="780" y="425" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Interpretable weights</text>
  <text x="780" y="460" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Fast, scalable</text>
  <text x="780" y="515" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Multi-class:</text>
  <text x="780" y="550" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Use softmax instead</text>
  <text x="780" y="585" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Outputs sum to 1</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata><type>regular</type></metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #c4cdd6; --border: #6b7280; --text: #212121;
        --text-muted: #555555; --text-faint: #888888; --code-bg: #1a1a2e;
        --shadow: #00000044; --black: #000000;
        --primary-fill: #5a7a9c; --primary-border: #3d5a7d; --primary-text: #ffffff; --primary-accent: #243b59;
        --ok-fill: #7a9a6a; --ok-border: #5a7a4d; --ok-text: #ffffff; --ok-accent: #385030;
        --warn-fill: #c8924a; --warn-border: #9c6e2e; --warn-text: #ffffff; --warn-accent: #5a3f12;
        --danger-fill: #a86058; --danger-border: #7d3f38; --danger-text: #ffffff; --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e; --info-border: #574a68; --info-text: #ffffff; --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
  </defs>
  <rect x="40" y="40" width="700" height="580" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="60" y="85" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Stage 1: predict the mean</text>
  <line x1="80" y1="120" x2="700" y2="120" stroke="var(--text-faint)" stroke-width="1"/>
  <line x1="80" y1="150" x2="700" y2="150" stroke="var(--primary-border)" stroke-width="3"/>
  <ellipse cx="200" cy="120" rx="6" ry="6" fill="var(--text)"/>
  <ellipse cx="320" cy="135" rx="6" ry="6" fill="var(--text)"/>
  <ellipse cx="440" cy="170" rx="6" ry="6" fill="var(--text)"/>
  <ellipse cx="560" cy="190" rx="6" ry="6" fill="var(--text)"/>
  <text x="60" y="220" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Stage 2: tree fits residuals</text>
  <line x1="80" y1="260" x2="700" y2="260" stroke="var(--text-faint)" stroke-width="1"/>
  <path d="M 80 290 L 250 290 L 250 250 L 450 250 L 450 280 L 700 280" stroke="var(--ok-border)" stroke-width="3" fill="none"/>
  <ellipse cx="200" cy="260" rx="6" ry="6" fill="var(--text)"/>
  <ellipse cx="320" cy="275" rx="6" ry="6" fill="var(--text)"/>
  <ellipse cx="440" cy="290" rx="6" ry="6" fill="var(--text)"/>
  <ellipse cx="560" cy="295" rx="6" ry="6" fill="var(--text)"/>
  <text x="60" y="350" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Stage 3: another tree on remaining errors</text>
  <line x1="80" y1="390" x2="700" y2="390" stroke="var(--text-faint)" stroke-width="1"/>
  <path d="M 80 400 L 200 400 L 200 380 L 350 380 L 350 410 L 500 410 L 500 395 L 700 395" stroke="var(--warn-border)" stroke-width="3" fill="none"/>
  <ellipse cx="200" cy="395" rx="6" ry="6" fill="var(--text)"/>
  <ellipse cx="320" cy="385" rx="6" ry="6" fill="var(--text)"/>
  <ellipse cx="440" cy="400" rx="6" ry="6" fill="var(--text)"/>
  <ellipse cx="560" cy="395" rx="6" ry="6" fill="var(--text)"/>
  <text x="60" y="470" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Sum: getting closer to the data</text>
  <line x1="80" y1="510" x2="700" y2="510" stroke="var(--text-faint)" stroke-width="1"/>
  <path d="M 80 520 Q 200 500 320 510 Q 440 520 700 530" stroke="var(--danger-border)" stroke-width="3" fill="none"/>
  <ellipse cx="200" cy="500" rx="6" ry="6" fill="var(--text)"/>
  <ellipse cx="320" cy="510" rx="6" ry="6" fill="var(--text)"/>
  <ellipse cx="440" cy="525" rx="6" ry="6" fill="var(--text)"/>
  <ellipse cx="560" cy="530" rx="6" ry="6" fill="var(--text)"/>
  <text x="60" y="600" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Each tree predicts the residual of all previous trees combined</text>
  <rect x="760" y="40" width="480" height="580" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Gradient Boosting</text>
  <text x="780" y="140" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">F(x) = F₀ + Σ ηᵢ · hᵢ(x)</text>
  <text x="780" y="175" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">F₀: initial guess (mean)</text>
  <text x="780" y="210" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">hᵢ: tree fitting gradient</text>
  <text x="780" y="245" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">η: learning rate (shrinkage)</text>
  <text x="780" y="300" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Hyperparameters:</text>
  <text x="780" y="335" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">learning_rate (η)</text>
  <text x="780" y="370" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">n_estimators</text>
  <text x="780" y="405" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">max_depth (shallow)</text>
  <text x="780" y="440" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">subsample, colsample</text>
  <text x="780" y="495" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Tradeoff:</text>
  <text x="780" y="530" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Lower η → more trees</text>
  <text x="780" y="565" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Lower η → better generalisation</text>
  <text x="780" y="600" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Use early stopping</text>
</svg>

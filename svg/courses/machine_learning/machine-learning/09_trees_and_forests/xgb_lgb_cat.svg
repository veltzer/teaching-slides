<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata><type>regular</type></metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #c4cdd6; --border: #6b7280; --text: #212121;
        --text-muted: #555555; --text-faint: #888888; --code-bg: #1a1a2e;
        --shadow: #00000044; --black: #000000;
        --primary-fill: #5a7a9c; --primary-border: #3d5a7d; --primary-text: #ffffff; --primary-accent: #243b59;
        --ok-fill: #7a9a6a; --ok-border: #5a7a4d; --ok-text: #ffffff; --ok-accent: #385030;
        --warn-fill: #c8924a; --warn-border: #9c6e2e; --warn-text: #ffffff; --warn-accent: #5a3f12;
        --danger-fill: #a86058; --danger-border: #7d3f38; --danger-text: #ffffff; --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e; --info-border: #574a68; --info-text: #ffffff; --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
  </defs>
  <rect x="40" y="40" width="395" height="580" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="237" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--primary-text)">XGBoost</text>
  <text x="237" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Tianqi Chen, 2014</text>
  <text x="60" y="170" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-text)">Why famous:</text>
  <text x="60" y="205" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Won countless Kaggles</text>
  <text x="60" y="240" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Sparse-aware splits</text>
  <text x="60" y="275" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">L1 + L2 regularisation</text>
  <text x="60" y="330" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-text)">Tree growth:</text>
  <text x="60" y="365" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Level-wise (depth-first)</text>
  <text x="60" y="400" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Fixed depth, balanced</text>
  <text x="60" y="455" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-text)">Best for:</text>
  <text x="60" y="490" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Structured tabular data</text>
  <text x="60" y="525" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Small to medium datasets</text>
  <text x="60" y="580" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-text)">pip install xgboost</text>
  <rect x="445" y="40" width="395" height="580" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="642" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--ok-text)">LightGBM</text>
  <text x="642" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Microsoft, 2017</text>
  <text x="465" y="170" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-text)">Why fast:</text>
  <text x="465" y="205" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Histogram-based splits</text>
  <text x="465" y="240" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">GOSS (gradient sampling)</text>
  <text x="465" y="275" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">EFB (feature bundling)</text>
  <text x="465" y="330" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-text)">Tree growth:</text>
  <text x="465" y="365" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Leaf-wise (best-first)</text>
  <text x="465" y="400" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Deeper, asymmetric</text>
  <text x="465" y="455" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-text)">Best for:</text>
  <text x="465" y="490" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Large datasets</text>
  <text x="465" y="525" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">High-cardinality categoricals</text>
  <text x="465" y="580" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-text)">pip install lightgbm</text>
  <rect x="850" y="40" width="390" height="580" rx="10" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--warn-text)">CatBoost</text>
  <text x="1045" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Yandex, 2017</text>
  <text x="870" y="170" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn-text)">Why special:</text>
  <text x="870" y="205" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Native categorical handling</text>
  <text x="870" y="240" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Ordered boosting</text>
  <text x="870" y="275" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">No leakage from target enc</text>
  <text x="870" y="330" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn-text)">Tree growth:</text>
  <text x="870" y="365" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Symmetric (oblivious)</text>
  <text x="870" y="400" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Fast inference</text>
  <text x="870" y="455" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn-text)">Best for:</text>
  <text x="870" y="490" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Categorical-heavy data</text>
  <text x="870" y="525" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Less tuning needed</text>
  <text x="870" y="580" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn-text)">pip install catboost</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata><type>regular</type></metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #c4cdd6; --border: #6b7280; --text: #212121;
        --text-muted: #555555; --text-faint: #888888; --code-bg: #1a1a2e;
        --shadow: #00000044; --black: #000000;
        --primary-fill: #5a7a9c; --primary-border: #3d5a7d; --primary-text: #ffffff; --primary-accent: #243b59;
        --ok-fill: #7a9a6a; --ok-border: #5a7a4d; --ok-text: #ffffff; --ok-accent: #385030;
        --warn-fill: #c8924a; --warn-border: #9c6e2e; --warn-text: #ffffff; --warn-accent: #5a3f12;
        --danger-fill: #a86058; --danger-border: #7d3f38; --danger-text: #ffffff; --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e; --info-border: #574a68; --info-text: #ffffff; --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
  </defs>
  <rect x="40" y="40" width="700" height="580" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <rect x="60" y="80" width="180" height="80" rx="5" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="150" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">tree 1 vote: A</text>
  <text x="150" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">sees random 60% rows</text>
  <rect x="280" y="80" width="180" height="80" rx="5" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="370" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">tree 2 vote: B</text>
  <text x="370" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">random feature subset</text>
  <rect x="500" y="80" width="180" height="80" rx="5" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="590" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">tree 3 vote: A</text>
  <text x="590" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">different sample</text>
  <rect x="60" y="200" width="180" height="80" rx="5" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="150" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">tree 4 vote: A</text>
  <rect x="280" y="200" width="180" height="80" rx="5" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="370" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">tree 5 vote: B</text>
  <rect x="500" y="200" width="180" height="80" rx="5" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="590" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">tree 6 vote: A</text>
  <rect x="60" y="320" width="180" height="80" rx="5" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="150" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">tree 7 vote: A</text>
  <rect x="280" y="320" width="180" height="80" rx="5" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="370" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">tree 8 vote: A</text>
  <rect x="500" y="320" width="180" height="80" rx="5" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="590" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">tree N vote: A</text>
  <rect x="180" y="460" width="400" height="100" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="380" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Majority Vote</text>
  <text x="380" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--ok-text)">predict A (7 of 9)</text>
  <text x="60" y="600" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Errors of individual trees average out — strong baseline</text>
  <rect x="760" y="40" width="480" height="580" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Random Forest</text>
  <text x="780" y="140" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Bagging + random features</text>
  <text x="780" y="175" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Decorrelates the trees</text>
  <text x="780" y="210" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Lower variance ensemble</text>
  <text x="780" y="265" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Hyperparameters:</text>
  <text x="780" y="300" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">n_estimators (more is better)</text>
  <text x="780" y="335" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">max_features (per-split)</text>
  <text x="780" y="370" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">max_depth (cap trees)</text>
  <text x="780" y="405" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">min_samples_leaf</text>
  <text x="780" y="460" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Strengths:</text>
  <text x="780" y="495" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Robust default</text>
  <text x="780" y="530" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Little tuning</text>
  <text x="780" y="565" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Out-of-bag estimate free</text>
  <text x="780" y="600" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Parallelisable</text>
</svg>

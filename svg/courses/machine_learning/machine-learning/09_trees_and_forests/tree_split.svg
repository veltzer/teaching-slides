<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata><type>regular</type></metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #c4cdd6; --border: #6b7280; --text: #212121;
        --text-muted: #555555; --text-faint: #888888; --code-bg: #1a1a2e;
        --shadow: #00000044; --black: #000000;
        --primary-fill: #5a7a9c; --primary-border: #3d5a7d; --primary-text: #ffffff; --primary-accent: #243b59;
        --ok-fill: #7a9a6a; --ok-border: #5a7a4d; --ok-text: #ffffff; --ok-accent: #385030;
        --warn-fill: #c8924a; --warn-border: #9c6e2e; --warn-text: #ffffff; --warn-accent: #5a3f12;
        --danger-fill: #a86058; --danger-border: #7d3f38; --danger-text: #ffffff; --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e; --info-border: #574a68; --info-text: #ffffff; --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
  </defs>
  <rect x="40" y="40" width="700" height="580" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="60" y="80" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Choose split that maximises gain</text>
  <line x1="80" y1="120" x2="80" y2="500" stroke="var(--text)" stroke-width="2"/>
  <line x1="80" y1="500" x2="700" y2="500" stroke="var(--text)" stroke-width="2"/>
  <line x1="400" y1="120" x2="400" y2="500" stroke="var(--danger-border)" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="410" y="140" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-border)">split here</text>
  <ellipse cx="180" cy="200" rx="8" ry="8" fill="var(--ok-fill)"/>
  <ellipse cx="220" cy="180" rx="8" ry="8" fill="var(--ok-fill)"/>
  <ellipse cx="260" cy="220" rx="8" ry="8" fill="var(--ok-fill)"/>
  <ellipse cx="300" cy="200" rx="8" ry="8" fill="var(--ok-fill)"/>
  <ellipse cx="200" cy="240" rx="8" ry="8" fill="var(--ok-fill)"/>
  <ellipse cx="340" cy="240" rx="8" ry="8" fill="var(--ok-fill)"/>
  <ellipse cx="280" cy="180" rx="8" ry="8" fill="var(--ok-fill)"/>
  <ellipse cx="160" cy="240" rx="8" ry="8" fill="var(--ok-fill)"/>
  <ellipse cx="240" cy="280" rx="8" ry="8" fill="var(--primary-fill)"/>
  <ellipse cx="320" cy="300" rx="8" ry="8" fill="var(--primary-fill)"/>
  <ellipse cx="180" cy="320" rx="8" ry="8" fill="var(--primary-fill)"/>
  <ellipse cx="280" cy="350" rx="8" ry="8" fill="var(--primary-fill)"/>
  <ellipse cx="500" cy="400" rx="8" ry="8" fill="var(--primary-fill)"/>
  <ellipse cx="540" cy="380" rx="8" ry="8" fill="var(--primary-fill)"/>
  <ellipse cx="600" cy="420" rx="8" ry="8" fill="var(--primary-fill)"/>
  <ellipse cx="480" cy="450" rx="8" ry="8" fill="var(--primary-fill)"/>
  <ellipse cx="560" cy="460" rx="8" ry="8" fill="var(--primary-fill)"/>
  <ellipse cx="620" cy="380" rx="8" ry="8" fill="var(--primary-fill)"/>
  <ellipse cx="660" cy="420" rx="8" ry="8" fill="var(--primary-fill)"/>
  <ellipse cx="520" cy="440" rx="8" ry="8" fill="var(--primary-fill)"/>
  <ellipse cx="450" cy="180" rx="8" ry="8" fill="var(--ok-fill)"/>
  <ellipse cx="500" cy="220" rx="8" ry="8" fill="var(--primary-fill)"/>
  <ellipse cx="550" cy="190" rx="8" ry="8" fill="var(--ok-fill)"/>
  <text x="200" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">Left: mostly green</text>
  <text x="550" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">Right: mostly blue</text>
  <text x="60" y="580" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Tree picks the feature/threshold that best separates classes</text>
  <text x="60" y="605" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Then recurses on each side until stopping criterion</text>
  <rect x="760" y="40" width="480" height="580" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Split Selection</text>
  <text x="780" y="140" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Try every feature</text>
  <text x="780" y="175" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Try every threshold</text>
  <text x="780" y="210" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Pick the best gain</text>
  <text x="780" y="265" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Gain criteria:</text>
  <text x="780" y="300" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Gini impurity</text>
  <text x="780" y="335" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Entropy / info gain</text>
  <text x="780" y="370" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Variance reduction (regression)</text>
  <text x="780" y="425" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Greedy:</text>
  <text x="780" y="460" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Local best, not global</text>
  <text x="780" y="495" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">May miss optimum tree</text>
  <text x="780" y="550" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Numeric features:</text>
  <text x="780" y="585" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Sort, try midpoints</text>
</svg>

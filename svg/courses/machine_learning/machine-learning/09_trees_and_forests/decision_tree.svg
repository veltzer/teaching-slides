<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="350" y="40" width="240" height="80" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="470" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">Age &lt; 30 ?</text>
  <text x="470" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">root: 1000 samples</text>
  <line x1="420" y1="120" x2="220" y2="200" stroke="var(--text)" stroke-width="2"/>
  <text x="290" y="170" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">yes</text>
  <line x1="520" y1="120" x2="720" y2="200" stroke="var(--text)" stroke-width="2"/>
  <text x="630" y="170" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">no</text>
  <rect x="100" y="200" width="240" height="80" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="220" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">Income &gt; 50k ?</text>
  <text x="220" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">400 samples</text>
  <rect x="600" y="200" width="240" height="80" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="720" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">Owns home ?</text>
  <text x="720" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">600 samples</text>
  <line x1="160" y1="280" x2="120" y2="380" stroke="var(--text)" stroke-width="2"/>
  <text x="115" y="340" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">yes</text>
  <line x1="280" y1="280" x2="320" y2="380" stroke="var(--text)" stroke-width="2"/>
  <text x="305" y="340" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">no</text>
  <line x1="660" y1="280" x2="620" y2="380" stroke="var(--text)" stroke-width="2"/>
  <text x="615" y="340" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">yes</text>
  <line x1="780" y1="280" x2="820" y2="380" stroke="var(--text)" stroke-width="2"/>
  <text x="805" y="340" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">no</text>
  <rect x="50" y="380" width="180" height="80" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="140" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-text)">Approve</text>
  <text x="140" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">220 / 30</text>
  <rect x="240" y="380" width="180" height="80" rx="10" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="330" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--danger-text)">Reject</text>
  <text x="330" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">25 / 125</text>
  <rect x="540" y="380" width="180" height="80" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="630" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-text)">Approve</text>
  <text x="630" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">300 / 50</text>
  <rect x="730" y="380" width="180" height="80" rx="10" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="820" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--danger-text)">Reject</text>
  <text x="820" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">60 / 190</text>
  <text x="40" y="540" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Greedy top-down construction</text>
  <text x="40" y="570" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">At each node, pick the feature/threshold with the most information gain</text>
  <text x="40" y="600" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Use Gini or entropy for classification, variance reduction for regression</text>
  <rect x="960" y="40" width="280" height="580" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1100" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">How It Works</text>
  <text x="980" y="140" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Greedy top-down splits</text>
  <text x="980" y="175" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Pick best feature each step</text>
  <text x="980" y="210" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Maximise information gain</text>
  <text x="980" y="245" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Use Gini or entropy</text>
  <text x="980" y="300" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Stopping criteria:</text>
  <text x="980" y="335" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">max_depth</text>
  <text x="980" y="370" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">min_samples_leaf</text>
  <text x="980" y="405" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">min_impurity_decrease</text>
  <text x="980" y="460" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Strengths:</text>
  <text x="980" y="495" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Interpretable</text>
  <text x="980" y="530" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">No scaling needed</text>
  <text x="980" y="565" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Mixed data types</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="700" height="580" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="60" y="80" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Feature importance</text>
  <text x="60" y="135" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">income</text>
  <rect x="200" y="115" width="500" height="30" rx="3" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="1"/>
  <text x="710" y="135" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">0.42</text>
  <text x="60" y="195" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">credit score</text>
  <rect x="200" y="175" width="370" height="30" rx="3" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="1"/>
  <text x="580" y="195" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">0.31</text>
  <text x="60" y="255" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">age</text>
  <rect x="200" y="235" width="180" height="30" rx="3" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="1"/>
  <text x="390" y="255" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">0.15</text>
  <text x="60" y="315" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">debt ratio</text>
  <rect x="200" y="295" width="100" height="30" rx="3" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="1"/>
  <text x="310" y="315" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">0.08</text>
  <text x="60" y="375" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">tenure</text>
  <rect x="200" y="355" width="40" height="30" rx="3" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="1"/>
  <text x="250" y="375" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">0.03</text>
  <text x="60" y="435" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">zipcode</text>
  <rect x="200" y="415" width="20" height="30" rx="3" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="1"/>
  <text x="230" y="435" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">0.01</text>
  <text x="60" y="510" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Bar lengths come from a trained model (e.g. random forest)</text>
  <text x="60" y="540" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Drop low-importance features for speed and interpretability</text>
  <text x="60" y="600" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Beware: tree-based importance can be misleading on correlated features</text>
  <rect x="760" y="40" width="480" height="580" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1000" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Methods</text>
  <text x="780" y="140" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Tree-based (Gini gain):</text>
  <text x="780" y="175" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Free with the model</text>
  <text x="780" y="210" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Biased toward high-cardinality</text>
  <text x="780" y="265" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Permutation importance:</text>
  <text x="780" y="300" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Shuffle one column, retest</text>
  <text x="780" y="335" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Model-agnostic</text>
  <text x="780" y="370" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">More reliable</text>
  <text x="780" y="425" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">SHAP values:</text>
  <text x="780" y="460" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Per-prediction attribution</text>
  <text x="780" y="495" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Game-theoretic basis</text>
  <text x="780" y="530" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Best for explanations</text>
  <text x="780" y="585" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Use shap library</text>
</svg>

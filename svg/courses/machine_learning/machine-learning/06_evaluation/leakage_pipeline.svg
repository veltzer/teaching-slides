<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#c4cdd6"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bd7d75"/><stop offset="100%" stop-color="#7d3f38"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#555555"/></marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/></marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/></marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/></marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/></marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/></marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/></marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Pipelines Prevent Data Leakage</text>
  <rect x="40" y="80" width="580" height="270" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-text)">Wrong: leak the test set</text>
  <text x="60" y="160" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">1. mean / std on FULL data</text>
  <text x="60" y="195" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">2. Scale all rows</text>
  <text x="60" y="230" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">3. Split, train, evaluate</text>
  <text x="60" y="280" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--danger-text)">Test stats leaked into training</text>
  <text x="60" y="315" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--danger-text)">Optimistic scores</text>
  <rect x="660" y="80" width="580" height="270" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Right: pipeline + split first</text>
  <text x="680" y="160" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">1. Split train / test</text>
  <text x="680" y="195" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">2. Pipeline: scaler + model</text>
  <text x="680" y="230" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">3. fit on TRAIN, predict on TEST</text>
  <text x="680" y="280" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-text)">Scaler stats from train only</text>
  <text x="680" y="315" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-text)">Honest scores</text>
  <rect x="40" y="380" width="1200" height="80" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--info-text)">from sklearn.pipeline import Pipeline</text>
  <text x="640" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Pipeline([('scaler', StandardScaler()), ('clf', LogisticRegression())])</text>
  <rect x="40" y="480" width="1200" height="140" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Other leakage sources to guard against</text>
  <text x="640" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">• Target encoding without CV</text>
  <text x="640" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">• Imputing on full dataset</text>
  <text x="640" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">• Time-series random split</text>
</svg>

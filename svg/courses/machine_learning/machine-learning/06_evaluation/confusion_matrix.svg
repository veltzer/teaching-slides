<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>
  </defs>
  <line x1="40" y1="40" x2="1240" y2="40" stroke="var(--border)" stroke-width="1"/>
  <text x="40" y="65" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Confusion Matrix</text>
  <text x="320" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Predicted</text>
  <text x="160" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">Pos</text>
  <text x="480" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">Neg</text>
  <text x="60" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)" transform="rotate(-90 60 360)">Actual</text>
  <text x="100" y="270" text-anchor="end" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">Pos</text>
  <text x="100" y="450" text-anchor="end" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">Neg</text>
  <text x="40" y="620" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Diagonal cells are correct predictions; off-diagonal are errors</text>
  <rect x="120" y="180" width="320" height="180" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="280" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">TP</text>
  <text x="280" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">True Positive</text>
  <text x="280" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Predicted pos, was pos</text>
  <rect x="450" y="180" width="320" height="180" rx="10" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="610" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-text)">FN</text>
  <text x="610" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">False Negative</text>
  <text x="610" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Predicted neg, was pos</text>
  <rect x="120" y="370" width="320" height="180" rx="10" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="280" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-text)">FP</text>
  <text x="280" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">False Positive</text>
  <text x="280" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Predicted pos, was neg</text>
  <rect x="450" y="370" width="320" height="180" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="610" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">TN</text>
  <text x="610" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">True Negative</text>
  <text x="610" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Predicted neg, was neg</text>
  <rect x="820" y="60" width="420" height="560" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1030" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Derived Metrics</text>
  <text x="840" y="160" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Accuracy = (TP+TN)/all</text>
  <text x="840" y="200" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Precision = TP / (TP+FP)</text>
  <text x="840" y="240" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Recall = TP / (TP+FN)</text>
  <text x="840" y="280" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">F1 = 2 P R / (P + R)</text>
  <text x="840" y="320" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Specificity = TN / (TN+FP)</text>
  <text x="840" y="380" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">FN expensive: maximise recall</text>
  <text x="840" y="420" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">FP expensive: maximise precision</text>
  <text x="840" y="480" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Threshold tunes the tradeoff</text>
  <text x="840" y="515" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Slice by subgroup</text>
  <text x="840" y="550" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Imbalanced: prefer F1 / AUC-PR</text>
</svg>

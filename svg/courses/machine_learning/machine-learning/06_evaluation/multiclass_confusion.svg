<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata><type>regular</type></metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #c4cdd6; --border: #6b7280; --text: #212121;
        --text-muted: #555555; --text-faint: #888888; --code-bg: #1a1a2e;
        --shadow: #00000044; --black: #000000;
        --primary-fill: #5a7a9c; --primary-border: #3d5a7d; --primary-text: #ffffff; --primary-accent: #243b59;
        --ok-fill: #7a9a6a; --ok-border: #5a7a4d; --ok-text: #ffffff; --ok-accent: #385030;
        --warn-fill: #c8924a; --warn-border: #9c6e2e; --warn-text: #ffffff; --warn-accent: #5a3f12;
        --danger-fill: #a86058; --danger-border: #7d3f38; --danger-text: #ffffff; --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e; --info-border: #574a68; --info-text: #ffffff; --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bd7d75"/><stop offset="100%" stop-color="#7d3f38"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
  </defs>
  <line x1="40" y1="40" x2="1240" y2="40" stroke="var(--border)" stroke-width="1"/>
  <text x="40" y="65" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Multi-class confusion matrix (4 classes)</text>
  <text x="320" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Predicted</text>
  <text x="160" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">A</text>
  <text x="260" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">B</text>
  <text x="360" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">C</text>
  <text x="460" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">D</text>
  <text x="60" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)" transform="rotate(-90 60 380)">Actual</text>
  <text x="100" y="220" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">A</text>
  <text x="100" y="320" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">B</text>
  <text x="100" y="420" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">C</text>
  <text x="100" y="520" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">D</text>
  <rect x="110" y="180" width="100" height="80" rx="5" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="160" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">82</text>
  <rect x="210" y="180" width="100" height="80" rx="5" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="260" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--warn-text)">5</text>
  <rect x="310" y="180" width="100" height="80" rx="5" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="360" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--warn-text)">8</text>
  <rect x="410" y="180" width="100" height="80" rx="5" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="460" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--warn-text)">5</text>
  <rect x="110" y="280" width="100" height="80" rx="5" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="160" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--warn-text)">3</text>
  <rect x="210" y="280" width="100" height="80" rx="5" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="260" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">75</text>
  <rect x="310" y="280" width="100" height="80" rx="5" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="360" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--warn-text)">10</text>
  <rect x="410" y="280" width="100" height="80" rx="5" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="460" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--warn-text)">12</text>
  <rect x="110" y="380" width="100" height="80" rx="5" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="160" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--warn-text)">6</text>
  <rect x="210" y="380" width="100" height="80" rx="5" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="260" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--warn-text)">12</text>
  <rect x="310" y="380" width="100" height="80" rx="5" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="360" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">68</text>
  <rect x="410" y="380" width="100" height="80" rx="5" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="460" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--warn-text)">14</text>
  <rect x="110" y="480" width="100" height="80" rx="5" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="160" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--warn-text)">4</text>
  <rect x="210" y="480" width="100" height="80" rx="5" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="260" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--warn-text)">9</text>
  <rect x="310" y="480" width="100" height="80" rx="5" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="360" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--warn-text)">15</text>
  <rect x="410" y="480" width="100" height="80" rx="5" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="460" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">72</text>
  <text x="40" y="600" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Diagonal: correct.  Off-diagonal: confusion patterns to investigate.</text>
  <line x1="40" y1="620" x2="1240" y2="620" stroke="var(--border)" stroke-width="1"/>
  <rect x="540" y="180" width="700" height="200" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="890" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Per-class metrics</text>
  <text x="560" y="270" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Compute precision, recall, F1 per class</text>
  <text x="560" y="305" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Then macro / micro / weighted average</text>
  <text x="560" y="340" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">classification_report() prints all of them</text>
  <rect x="540" y="400" width="700" height="220" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="890" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Averaging modes</text>
  <text x="560" y="490" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Macro: simple mean of per-class scores</text>
  <text x="560" y="525" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Micro: pool counts then compute</text>
  <text x="560" y="560" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Weighted: by class frequency</text>
  <text x="560" y="595" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Pick by what fairness you want</text>
</svg>

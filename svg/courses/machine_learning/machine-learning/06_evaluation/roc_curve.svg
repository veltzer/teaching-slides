<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="640" height="580" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <line x1="120" y1="80" x2="120" y2="540" stroke="var(--text)" stroke-width="2"/>
  <line x1="120" y1="540" x2="640" y2="540" stroke="var(--text)" stroke-width="2"/>
  <line x1="120" y1="540" x2="640" y2="80" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M 120 540 Q 160 200 350 110 Q 470 80 640 80" stroke="var(--primary-border)" stroke-width="4" fill="none"/>
  <path d="M 120 540 Q 200 360 380 240 Q 500 160 640 80" stroke="var(--ok-border)" stroke-width="4" fill="none"/>
  <path d="M 120 540 Q 240 460 420 380 Q 540 320 640 80" stroke="var(--warn-border)" stroke-width="4" fill="none"/>
  <text x="380" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">False Positive Rate</text>
  <text x="80" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)" transform="rotate(-90 80 320)">True Positive Rate</text>
  <text x="120" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">0</text>
  <text x="640" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">1</text>
  <text x="105" y="540" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">0</text>
  <text x="105" y="85" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">1</text>
  <rect x="700" y="40" width="540" height="580" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="970" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Reading the ROC</text>
  <line x1="725" y1="135" x2="765" y2="135" stroke="var(--primary-border)" stroke-width="4"/>
  <text x="780" y="140" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Excellent classifier (AUC ≈ 0.95)</text>
  <line x1="725" y1="180" x2="765" y2="180" stroke="var(--ok-border)" stroke-width="4"/>
  <text x="780" y="185" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Decent classifier (AUC ≈ 0.80)</text>
  <line x1="725" y1="225" x2="765" y2="225" stroke="var(--warn-border)" stroke-width="4"/>
  <text x="780" y="230" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Weak classifier (AUC ≈ 0.65)</text>
  <line x1="725" y1="270" x2="765" y2="270" stroke="var(--text-faint)" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="780" y="275" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Random (AUC = 0.5)</text>
  <text x="725" y="335" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Up and to the left = better</text>
  <text x="725" y="375" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Sweep all thresholds</text>
  <text x="725" y="410" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">AUC summarises curve</text>
  <text x="725" y="445" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Threshold-independent</text>
  <text x="725" y="500" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">For imbalanced data:</text>
  <text x="725" y="535" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Prefer Precision-Recall curve</text>
  <text x="725" y="570" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">AUC-PR more discriminative</text>
</svg>

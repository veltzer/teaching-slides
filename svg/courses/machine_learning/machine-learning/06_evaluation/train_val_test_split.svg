<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata><type>regular</type></metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #c4cdd6; --border: #6b7280; --text: #212121;
        --text-muted: #555555; --text-faint: #888888; --code-bg: #1a1a2e;
        --shadow: #00000044; --black: #000000;
        --primary-fill: #5a7a9c; --primary-border: #3d5a7d; --primary-text: #ffffff; --primary-accent: #243b59;
        --ok-fill: #7a9a6a; --ok-border: #5a7a4d; --ok-text: #ffffff; --ok-accent: #385030;
        --warn-fill: #c8924a; --warn-border: #9c6e2e; --warn-text: #ffffff; --warn-accent: #5a3f12;
        --danger-fill: #a86058; --danger-border: #7d3f38; --danger-text: #ffffff; --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e; --info-border: #574a68; --info-text: #ffffff; --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
  </defs>
  <line x1="40" y1="40" x2="1240" y2="40" stroke="var(--border)" stroke-width="1"/>
  <text x="40" y="80" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--text)">All data</text>
  <rect x="40" y="100" width="1200" height="80" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <rect x="40" y="240" width="700" height="80" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="390" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Train (70%)</text>
  <rect x="745" y="240" width="245" height="80" rx="10" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="867" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Validate (15%)</text>
  <rect x="995" y="240" width="245" height="80" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1117" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Test (15%)</text>
  <rect x="40" y="360" width="380" height="260" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Train</text>
  <text x="60" y="445" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Fit model weights</text>
  <text x="60" y="480" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Used many times</text>
  <text x="60" y="515" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Largest portion</text>
  <text x="60" y="570" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Where the model</text>
  <text x="60" y="600" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">"learns"</text>
  <rect x="440" y="360" width="380" height="260" rx="10" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Validate</text>
  <text x="460" y="445" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Choose hyperparameters</text>
  <text x="460" y="480" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Pick the best model</text>
  <text x="460" y="515" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Used many times</text>
  <text x="460" y="570" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Risk of overfitting</text>
  <text x="460" y="600" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Use cross-validation</text>
  <rect x="840" y="360" width="400" height="260" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1040" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Test</text>
  <text x="860" y="445" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Final estimate of error</text>
  <text x="860" y="480" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Used ONCE</text>
  <text x="860" y="515" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Sacred holdout</text>
  <text x="860" y="570" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Never tune on it</text>
  <text x="860" y="600" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Or you've leaked</text>
</svg>

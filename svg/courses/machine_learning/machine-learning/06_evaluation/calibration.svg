<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata><type>regular</type></metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #c4cdd6; --border: #6b7280; --text: #212121;
        --text-muted: #555555; --text-faint: #888888; --code-bg: #1a1a2e;
        --shadow: #00000044; --black: #000000;
        --primary-fill: #5a7a9c; --primary-border: #3d5a7d; --primary-text: #ffffff; --primary-accent: #243b59;
        --ok-fill: #7a9a6a; --ok-border: #5a7a4d; --ok-text: #ffffff; --ok-accent: #385030;
        --warn-fill: #c8924a; --warn-border: #9c6e2e; --warn-text: #ffffff; --warn-accent: #5a3f12;
        --danger-fill: #a86058; --danger-border: #7d3f38; --danger-text: #ffffff; --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e; --info-border: #574a68; --info-text: #ffffff; --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
  </defs>
  <rect x="40" y="40" width="700" height="580" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="390" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Reliability diagram</text>
  <line x1="120" y1="120" x2="120" y2="540" stroke="var(--text)" stroke-width="2"/>
  <line x1="120" y1="540" x2="700" y2="540" stroke="var(--text)" stroke-width="2"/>
  <line x1="120" y1="540" x2="700" y2="120" stroke="var(--text)" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="650" y="115" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">perfect calibration</text>
  <text x="100" y="125" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">1</text>
  <text x="100" y="545" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">0</text>
  <text x="120" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">0</text>
  <text x="700" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">1</text>
  <text x="395" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">predicted probability</text>
  <text x="80" y="335" font-family="Arial, sans-serif" font-size="14" fill="var(--text)" transform="rotate(-90 80 335)">observed frequency</text>
  <path d="M 180 530 L 240 510 L 300 470 L 360 410 L 420 360 L 480 280 L 540 220 L 600 160 L 660 130" stroke="var(--ok-border)" stroke-width="3" fill="none"/>
  <ellipse cx="180" cy="530" rx="5" ry="5" fill="var(--ok-border)"/>
  <ellipse cx="240" cy="510" rx="5" ry="5" fill="var(--ok-border)"/>
  <ellipse cx="300" cy="470" rx="5" ry="5" fill="var(--ok-border)"/>
  <ellipse cx="360" cy="410" rx="5" ry="5" fill="var(--ok-border)"/>
  <ellipse cx="420" cy="360" rx="5" ry="5" fill="var(--ok-border)"/>
  <ellipse cx="480" cy="280" rx="5" ry="5" fill="var(--ok-border)"/>
  <ellipse cx="540" cy="220" rx="5" ry="5" fill="var(--ok-border)"/>
  <ellipse cx="600" cy="160" rx="5" ry="5" fill="var(--ok-border)"/>
  <ellipse cx="660" cy="130" rx="5" ry="5" fill="var(--ok-border)"/>
  <text x="240" y="495" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-border)">well calibrated</text>
  <path d="M 180 540 L 240 535 L 300 490 L 360 380 L 420 290 L 480 200 L 540 160 L 600 145 L 660 135" stroke="var(--danger-border)" stroke-width="3" fill="none"/>
  <text x="500" y="180" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-border)">overconfident</text>
  <text x="60" y="615" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Plot bin midpoints vs observed positive rate</text>
  <rect x="760" y="40" width="480" height="580" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Calibration</text>
  <text x="780" y="140" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Predicted prob = real freq</text>
  <text x="780" y="175" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Important when probs used</text>
  <text x="780" y="210" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">downstream (cost, ranking)</text>
  <text x="780" y="265" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Often miscalibrated:</text>
  <text x="780" y="300" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Random forests (overconfident)</text>
  <text x="780" y="335" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Boosting (overconfident)</text>
  <text x="780" y="370" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Naive Bayes (extreme)</text>
  <text x="780" y="425" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Fix on a held-out set:</text>
  <text x="780" y="460" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Platt scaling (logistic)</text>
  <text x="780" y="495" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Isotonic (non-parametric)</text>
  <text x="780" y="550" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Metrics:</text>
  <text x="780" y="585" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Brier score, ECE</text>
</svg>

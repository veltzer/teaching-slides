<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata><type>regular</type></metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #c4cdd6; --border: #6b7280; --text: #212121;
        --text-muted: #555555; --text-faint: #888888; --code-bg: #1a1a2e;
        --shadow: #00000044; --black: #000000;
        --primary-fill: #5a7a9c; --primary-border: #3d5a7d; --primary-text: #ffffff; --primary-accent: #243b59;
        --ok-fill: #7a9a6a; --ok-border: #5a7a4d; --ok-text: #ffffff; --ok-accent: #385030;
        --warn-fill: #c8924a; --warn-border: #9c6e2e; --warn-text: #ffffff; --warn-accent: #5a3f12;
        --danger-fill: #a86058; --danger-border: #7d3f38; --danger-text: #ffffff; --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e; --info-border: #574a68; --info-text: #ffffff; --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
  </defs>
  <rect x="40" y="40" width="700" height="580" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="390" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Precision-Recall Curve</text>
  <line x1="120" y1="120" x2="120" y2="540" stroke="var(--text)" stroke-width="2"/>
  <line x1="120" y1="540" x2="700" y2="540" stroke="var(--text)" stroke-width="2"/>
  <line x1="120" y1="500" x2="700" y2="500" stroke="var(--text-faint)" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="700" y="495" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">baseline = positive class rate</text>
  <text x="100" y="125" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">1</text>
  <text x="100" y="545" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">0</text>
  <text x="120" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">0</text>
  <text x="700" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">1</text>
  <text x="395" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Recall</text>
  <text x="80" y="335" font-family="Arial, sans-serif" font-size="14" fill="var(--text)" transform="rotate(-90 80 335)">Precision</text>
  <path d="M 120 130 Q 250 140 400 200 Q 550 320 700 530" stroke="var(--primary-border)" stroke-width="4" fill="none"/>
  <path d="M 120 200 Q 250 240 400 320 Q 550 420 700 530" stroke="var(--ok-border)" stroke-width="4" fill="none"/>
  <path d="M 120 350 Q 250 400 400 460 Q 550 490 700 530" stroke="var(--warn-border)" stroke-width="4" fill="none"/>
  <line x1="150" y1="160" x2="190" y2="160" stroke="var(--primary-border)" stroke-width="4"/>
  <text x="200" y="165" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">excellent (AUC-PR ≈ 0.92)</text>
  <line x1="150" y1="200" x2="190" y2="200" stroke="var(--ok-border)" stroke-width="4"/>
  <text x="200" y="205" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">decent (AUC-PR ≈ 0.65)</text>
  <line x1="150" y1="240" x2="190" y2="240" stroke="var(--warn-border)" stroke-width="4"/>
  <text x="200" y="245" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">weak (AUC-PR ≈ 0.35)</text>
  <text x="60" y="615" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Better for imbalanced data than ROC</text>
  <rect x="760" y="40" width="480" height="580" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">When to use PR over ROC</text>
  <text x="780" y="140" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">PR is right when:</text>
  <text x="780" y="175" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Positive class is rare</text>
  <text x="780" y="210" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">FP and FN have different costs</text>
  <text x="780" y="245" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">You care about positives</text>
  <text x="780" y="300" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Common pitfall:</text>
  <text x="780" y="335" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">ROC looks great on imbalanced</text>
  <text x="780" y="370" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">PR reveals the real picture</text>
  <text x="780" y="425" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Average precision (AP):</text>
  <text x="780" y="460" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Common scalar summary</text>
  <text x="780" y="495" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Used in object detection</text>
  <text x="780" y="550" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">sklearn:</text>
  <text x="780" y="585" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">precision_recall_curve, AP</text>
</svg>

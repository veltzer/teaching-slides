<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#c4cdd6"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bd7d75"/><stop offset="100%" stop-color="#7d3f38"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#555555"/></marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/></marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/></marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/></marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/></marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/></marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/></marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Gradient Descent</text>
  <line x1="80" y1="500" x2="1200" y2="500" stroke="var(--text)" stroke-width="2"/>
  <line x1="80" y1="500" x2="80" y2="80" stroke="var(--text)" stroke-width="2"/>
  <text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">weight w</text>
  <text x="40" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">loss</text>
  <path d="M 110 130 Q 280 480 640 480 Q 1000 480 1170 130" fill="none" stroke="var(--primary-border)" stroke-width="4"/>
  <rect x="168" y="248" width="24" height="24" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--warn-text)">•</text>
  <text x="180" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)">w₀</text>
  <rect x="258" y="368" width="24" height="24" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="270" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--warn-text)">•</text>
  <text x="270" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)">w₁</text>
  <rect x="378" y="428" width="24" height="24" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="390" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--warn-text)">•</text>
  <text x="390" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)">w₂</text>
  <rect x="518" y="458" width="24" height="24" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="530" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--warn-text)">•</text>
  <text x="530" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)">w₃</text>
  <rect x="628" y="468" width="24" height="24" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--ok-text)">•</text>
  <text x="640" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)">w*</text>
  <line x1="195" y1="260" x2="255" y2="380" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <line x1="285" y1="380" x2="375" y2="440" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <line x1="405" y1="440" x2="515" y2="470" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <line x1="545" y1="470" x2="625" y2="480" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <rect x="750" y="130" width="460" height="250" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="980" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">w ← w − η · ∇L(w)</text>
  <text x="770" y="200" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">η: learning rate (step size)</text>
  <text x="770" y="230" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">∇L: gradient — direction of steepest ascent</text>
  <text x="770" y="260" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Move opposite the gradient → go downhill</text>
  <text x="770" y="290" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Stop when ∇L ≈ 0 or progress stalls</text>
  <text x="770" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--info-text)">Too small η: slow</text>
  <text x="770" y="355" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--info-text)">Too large η: overshoots and diverges</text>
  <rect x="40" y="555" width="1200" height="65" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-text)">Variants: SGD, momentum, RMSprop, Adam, AdamW</text>
  <text x="640" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Most modern training is some flavour of gradient descent</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#c4cdd6"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bd7d75"/><stop offset="100%" stop-color="#7d3f38"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#555555"/></marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/></marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/></marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/></marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/></marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/></marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/></marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Supervised vs Unsupervised Learning</text>
  <rect x="40" y="80" width="580" height="540" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--primary-text)">Supervised</text>
  <text x="330" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Inputs X with labels y</text>
  <rect x="80" y="170" width="500" height="200" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <line x1="80" y1="170" x2="580" y2="170" stroke="var(--primary-text)" stroke-width="1"/>
  <line x1="80" y1="370" x2="580" y2="370" stroke="var(--primary-text)" stroke-width="1"/>
  <rect x="115" y="245" width="10" height="10" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="155" y="205" width="10" height="10" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="195" y="195" width="10" height="10" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="135" y="275" width="10" height="10" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="215" y="255" width="10" height="10" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="175" y="225" width="10" height="10" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="235" y="245" width="10" height="10" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="375" y="325" width="10" height="10" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="415" y="275" width="10" height="10" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="455" y="305" width="10" height="10" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="495" y="285" width="10" height="10" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="435" y="345" width="10" height="10" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="385" y="295" width="10" height="10" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="515" y="255" width="10" height="10" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <line x1="280" y1="170" x2="360" y2="370" stroke="var(--primary-text)" stroke-width="3" stroke-dasharray="6,3"/>
  <text x="330" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-text)">Goal: predict y from X</text>
  <text x="60" y="430" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-text)">Examples:</text>
  <text x="60" y="460" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">• Spam: email → spam/ham</text>
  <text x="60" y="485" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">• Credit risk: profile → default</text>
  <text x="60" y="510" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">• House price: features → $</text>
  <text x="60" y="540" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Algorithms: regression, trees, SVM,</text>
  <text x="60" y="565" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">neural nets, kNN, naive Bayes</text>
  <text x="60" y="600" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-text)">Needs labelled data — often expensive</text>
  <rect x="660" y="80" width="580" height="540" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--info-text)">Unsupervised</text>
  <text x="950" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Inputs X — no labels</text>
  <line x1="700" y1="170" x2="1200" y2="170" stroke="var(--info-text)" stroke-width="1"/>
  <line x1="700" y1="370" x2="1200" y2="370" stroke="var(--info-text)" stroke-width="1"/>
  <rect x="735" y="255" width="10" height="10" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="775" y="215" width="10" height="10" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="815" y="205" width="10" height="10" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="755" y="275" width="10" height="10" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="835" y="245" width="10" height="10" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="795" y="230" width="10" height="10" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="855" y="260" width="10" height="10" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="995" y="325" width="10" height="10" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1035" y="295" width="10" height="10" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1075" y="305" width="10" height="10" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1115" y="285" width="10" height="10" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1055" y="345" width="10" height="10" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1005" y="315" width="10" height="10" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1135" y="275" width="10" height="10" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="935" y="355" width="10" height="10" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="955" y="195" width="10" height="10" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="895" y="295" width="10" height="10" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <ellipse cx="800" cy="250" rx="80" ry="50" fill="none" stroke="var(--info-text)" stroke-width="3" stroke-dasharray="6,3"/>
  <ellipse cx="1070" cy="320" rx="90" ry="50" fill="none" stroke="var(--info-text)" stroke-width="3" stroke-dasharray="6,3"/>
  <text x="950" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Goal: discover structure in X</text>
  <text x="680" y="430" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--info-text)">Examples:</text>
  <text x="680" y="460" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">• Customer segmentation</text>
  <text x="680" y="485" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">• Anomaly detection</text>
  <text x="680" y="510" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">• Topic discovery in text</text>
  <text x="680" y="540" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Algorithms: k-means, DBSCAN,</text>
  <text x="680" y="565" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">PCA, t-SNE, GMM, autoencoders</text>
  <text x="680" y="600" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--info-text)">Hard to evaluate — no ground truth</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.245046200557" font-weight="bold" fill="var(--text)">Three Flavors of ML</text>

  <rect x="40" y="92.727272727273" width="382.758620689655" height="527.272727272727" rx="10.444659357342" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="231.379310344828" y="129.636363636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.978250586152" font-weight="bold" fill="var(--primary-text)">Supervised</text>
  <text x="60.689655172414" y="166.545454545455" font-family="Arial, sans-serif" font-size="14.622523100279" font-weight="bold" fill="var(--primary-text)">Labeled data</text>
  <text x="60.689655172414" y="192.909090909091" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--primary-text)">x -&gt; y pairs given</text>

  <text x="60.689655172414" y="240.363636363636" font-family="Arial, sans-serif" font-size="14.622523100279" font-weight="bold" fill="var(--primary-text)">Tasks</text>
  <text x="60.689655172414" y="266.727272727273" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--primary-text)">- Classification (spam?)</text>
  <text x="60.689655172414" y="293.090909090909" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--primary-text)">- Regression (price?)</text>

  <text x="60.689655172414" y="340.545454545455" font-family="Arial, sans-serif" font-size="14.622523100279" font-weight="bold" fill="var(--primary-text)">Algorithms</text>
  <text x="60.689655172414" y="366.909090909091" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--primary-text)">- Linear regression</text>
  <text x="60.689655172414" y="393.272727272727" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--primary-text)">- Random forest</text>
  <text x="60.689655172414" y="419.636363636364" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--primary-text)">- Gradient boosting</text>
  <text x="60.689655172414" y="446" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--primary-text)">- Neural networks</text>

  <text x="60.689655172414" y="504" font-family="Arial, sans-serif" font-size="13.578057164544" font-style="italic" fill="var(--primary-text)">Most production ML</text>

  <rect x="448.620689655172" y="92.727272727273" width="382.758620689655" height="527.272727272727" rx="10.444659357342" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="129.636363636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.978250586152" font-weight="bold" fill="var(--ok-text)">Unsupervised</text>
  <text x="469.310344827586" y="166.545454545455" font-family="Arial, sans-serif" font-size="14.622523100279" font-weight="bold" fill="var(--ok-text)">No labels</text>
  <text x="469.310344827586" y="192.909090909091" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--ok-text)">Find structure in x</text>

  <text x="469.310344827586" y="240.363636363636" font-family="Arial, sans-serif" font-size="14.622523100279" font-weight="bold" fill="var(--ok-text)">Tasks</text>
  <text x="469.310344827586" y="266.727272727273" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--ok-text)">- Clustering</text>
  <text x="469.310344827586" y="293.090909090909" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--ok-text)">- Dimensionality reduce</text>
  <text x="469.310344827586" y="319.454545454545" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--ok-text)">- Anomaly detection</text>

  <text x="469.310344827586" y="366.909090909091" font-family="Arial, sans-serif" font-size="14.622523100279" font-weight="bold" fill="var(--ok-text)">Algorithms</text>
  <text x="469.310344827586" y="393.272727272727" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--ok-text)">- K-means</text>
  <text x="469.310344827586" y="419.636363636364" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--ok-text)">- DBSCAN</text>
  <text x="469.310344827586" y="446" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--ok-text)">- PCA, t-SNE, UMAP</text>
  <text x="469.310344827586" y="472.363636363636" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--ok-text)">- Autoencoders</text>

  <text x="469.310344827586" y="525.090909090909" font-family="Arial, sans-serif" font-size="13.578057164544" font-style="italic" fill="var(--ok-text)">Exploration, embeddings</text>

  <rect x="857.241379310345" y="92.727272727273" width="382.758620689655" height="527.272727272727" rx="10.444659357342" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1048.620689655173" y="129.636363636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.978250586152" font-weight="bold" fill="var(--warn-text)">Reinforcement</text>
  <text x="877.931034482759" y="166.545454545455" font-family="Arial, sans-serif" font-size="14.622523100279" font-weight="bold" fill="var(--warn-text)">Reward signal</text>
  <text x="877.931034482759" y="192.909090909091" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--warn-text)">Agent acts, environment</text>
  <text x="877.931034482759" y="214" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--warn-text)">responds, learn policy</text>

  <text x="877.931034482759" y="261.454545454545" font-family="Arial, sans-serif" font-size="14.622523100279" font-weight="bold" fill="var(--warn-text)">Tasks</text>
  <text x="877.931034482759" y="287.818181818182" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--warn-text)">- Game playing</text>
  <text x="877.931034482759" y="314.181818181818" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--warn-text)">- Robotics</text>
  <text x="877.931034482759" y="340.545454545455" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--warn-text)">- LLM alignment (RLHF)</text>

  <text x="877.931034482759" y="388" font-family="Arial, sans-serif" font-size="14.622523100279" font-weight="bold" fill="var(--warn-text)">Algorithms</text>
  <text x="877.931034482759" y="414.363636363636" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--warn-text)">- Q-learning</text>
  <text x="877.931034482759" y="440.727272727273" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--warn-text)">- Policy gradient</text>
  <text x="877.931034482759" y="467.090909090909" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--warn-text)">- PPO</text>

  <text x="877.931034482759" y="525.090909090909" font-family="Arial, sans-serif" font-size="13.578057164544" font-style="italic" fill="var(--warn-text)">Sequential decisions</text>
</svg>

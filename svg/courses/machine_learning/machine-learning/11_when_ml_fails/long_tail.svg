<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata><type>regular</type></metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #c4cdd6; --border: #6b7280; --text: #212121;
        --text-muted: #555555; --text-faint: #888888; --code-bg: #1a1a2e;
        --shadow: #00000044; --black: #000000;
        --primary-fill: #5a7a9c; --primary-border: #3d5a7d; --primary-text: #ffffff; --primary-accent: #243b59;
        --ok-fill: #7a9a6a; --ok-border: #5a7a4d; --ok-text: #ffffff; --ok-accent: #385030;
        --warn-fill: #c8924a; --warn-border: #9c6e2e; --warn-text: #ffffff; --warn-accent: #5a3f12;
        --danger-fill: #a86058; --danger-border: #7d3f38; --danger-text: #ffffff; --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e; --info-border: #574a68; --info-text: #ffffff; --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bd7d75"/><stop offset="100%" stop-color="#7d3f38"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
  </defs>
  <rect x="40" y="40" width="700" height="580" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="390" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Frequency vs case</text>
  <line x1="100" y1="120" x2="100" y2="540" stroke="var(--text)" stroke-width="2"/>
  <line x1="100" y1="540" x2="700" y2="540" stroke="var(--text)" stroke-width="2"/>
  <text x="60" y="335" font-family="Arial, sans-serif" font-size="14" fill="var(--text)" transform="rotate(-90 60 335)">frequency</text>
  <text x="395" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">case (sorted)</text>
  <path d="M 110 200 Q 150 200 200 280 Q 250 380 300 470 Q 400 520 700 535" stroke="var(--primary-border)" stroke-width="4" fill="none"/>
  <rect x="110" y="180" width="170" height="360" fill="url(#grad-ok)" opacity="0.4" filter="url(#shadow)"/>
  <text x="160" y="370" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">head: 90%</text>
  <text x="160" y="395" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">model handles well</text>
  <rect x="280" y="430" width="420" height="110" fill="url(#grad-danger)" opacity="0.4" filter="url(#shadow)"/>
  <text x="380" y="475" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">tail: 10% — but matters</text>
  <text x="380" y="500" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">few examples each</text>
  <text x="380" y="525" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">model fails on these</text>
  <text x="60" y="615" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Power-law everywhere: search queries, user types, edge cases</text>
  <rect x="760" y="40" width="480" height="580" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">The Long Tail</text>
  <text x="780" y="140" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Common cases: 90% of traffic</text>
  <text x="780" y="175" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Rare cases: 10% of traffic</text>
  <text x="780" y="210" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">but possibly the riskiest</text>
  <text x="780" y="265" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Why ML struggles:</text>
  <text x="780" y="300" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Few examples to learn from</text>
  <text x="780" y="335" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Average metric hides them</text>
  <text x="780" y="370" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Each case is different</text>
  <text x="780" y="425" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Strategies:</text>
  <text x="780" y="460" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Hybrid system: rules + ML</text>
  <text x="780" y="495" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Human in the loop for rares</text>
  <text x="780" y="530" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Up-sample minority classes</text>
  <text x="780" y="585" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Slice metrics by segment</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="395" height="580" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="237" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Demographic parity</text>
  <text x="60" y="135" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Equal rate across groups</text>
  <text x="60" y="200" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">P(ŷ=1 | A=a) constant</text>
  <text x="60" y="265" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-text)">Pros:</text>
  <text x="60" y="300" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Easy to verify</text>
  <text x="60" y="335" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Cuts disparate impact</text>
  <text x="60" y="395" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-text)">Cons:</text>
  <text x="60" y="430" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Ignores group base rates</text>
  <text x="60" y="525" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-text)">Use when:</text>
  <text x="60" y="560" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Label bias suspected</text>
  <rect x="445" y="40" width="395" height="580" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="642" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Equalised odds</text>
  <text x="465" y="135" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Equal FPR + FNR per group</text>
  <text x="465" y="200" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">P(ŷ | y, A=a) constant</text>
  <text x="465" y="265" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-text)">Pros:</text>
  <text x="465" y="300" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Equal errors</text>
  <text x="465" y="335" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Honours base rates</text>
  <text x="465" y="395" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-text)">Cons:</text>
  <text x="465" y="430" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Conflicts with parity</text>
  <text x="465" y="525" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-text)">Use when:</text>
  <text x="465" y="595" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Errors hurt people</text>
  <rect x="850" y="40" width="390" height="580" rx="10" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1045" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">The impossibility</text>
  <text x="870" y="135" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Defs are incompatible</text>
  <text x="870" y="225" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn-text)">Different base rates:</text>
  <text x="870" y="260" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Pick: parity, odds, or</text>
  <text x="870" y="295" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">predictive parity</text>
  <text x="870" y="385" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn-text)">So:</text>
  <text x="870" y="420" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Pick by stakes</text>
  <text x="870" y="455" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Make it explicit</text>
  <text x="870" y="550" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn-text)">Tools:</text>
  <text x="870" y="585" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Fairlearn, AIF360</text>
</svg>

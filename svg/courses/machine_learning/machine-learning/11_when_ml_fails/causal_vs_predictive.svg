<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="595" height="580" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="337" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Predictive (correlation)</text>
  <text x="60" y="135" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">"Will this customer churn?"</text>
  <text x="60" y="170" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">"Will this loan default?"</text>
  <text x="60" y="225" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-text)">What ML does well:</text>
  <text x="60" y="260" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Find patterns in features</text>
  <text x="60" y="295" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Score probabilities</text>
  <text x="60" y="330" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Rank candidates</text>
  <text x="60" y="385" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-text)">Assumes:</text>
  <text x="60" y="420" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Future ≈ past</text>
  <text x="60" y="455" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">No interventions made</text>
  <text x="60" y="510" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-text)">Tools:</text>
  <text x="60" y="545" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">scikit-learn, XGBoost, etc.</text>
  <text x="60" y="600" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-text)">Says: "what is likely"</text>
  <rect x="645" y="40" width="595" height="580" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="942" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Causal (intervention)</text>
  <text x="665" y="135" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">"Will calling reduce churn?"</text>
  <text x="665" y="170" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">"Will lowering rate prevent default?"</text>
  <text x="665" y="225" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-text)">What's hard:</text>
  <text x="665" y="260" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Counterfactuals (what if?)</text>
  <text x="665" y="295" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Confounders</text>
  <text x="665" y="330" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Selection bias</text>
  <text x="665" y="385" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-text)">Methods:</text>
  <text x="665" y="420" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Randomised experiments (A/B)</text>
  <text x="665" y="455" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Propensity score matching</text>
  <text x="665" y="490" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Difference-in-differences</text>
  <text x="665" y="525" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Uplift modelling</text>
  <text x="665" y="580" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-text)">Says: "what would happen if"</text>
  <text x="665" y="615" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Tools: DoWhy, EconML</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata><type>regular</type></metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #c4cdd6; --border: #6b7280; --text: #212121;
        --text-muted: #555555; --text-faint: #888888; --code-bg: #1a1a2e;
        --shadow: #00000044; --black: #000000;
        --primary-fill: #5a7a9c; --primary-border: #3d5a7d; --primary-text: #ffffff; --primary-accent: #243b59;
        --ok-fill: #7a9a6a; --ok-border: #5a7a4d; --ok-text: #ffffff; --ok-accent: #385030;
        --warn-fill: #c8924a; --warn-border: #9c6e2e; --warn-text: #ffffff; --warn-accent: #5a3f12;
        --danger-fill: #a86058; --danger-border: #7d3f38; --danger-text: #ffffff; --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e; --info-border: #574a68; --info-text: #ffffff; --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
  </defs>
  <rect x="40" y="40" width="700" height="580" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="390" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Train and prod distributions diverge</text>
  <line x1="100" y1="120" x2="100" y2="540" stroke="var(--text)" stroke-width="2"/>
  <line x1="100" y1="540" x2="700" y2="540" stroke="var(--text)" stroke-width="2"/>
  <text x="395" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">feature value</text>
  <text x="60" y="335" font-family="Arial, sans-serif" font-size="14" fill="var(--text)" transform="rotate(-90 60 335)">density</text>
  <path d="M 110 540 Q 200 540 220 350 Q 250 220 280 220 Q 310 220 340 350 Q 360 540 450 540" stroke="var(--ok-border)" stroke-width="3" fill="none"/>
  <text x="280" y="200" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-border)">training distribution</text>
  <path d="M 350 540 Q 450 540 470 350 Q 500 220 530 220 Q 560 220 590 350 Q 610 540 690 540" stroke="var(--danger-border)" stroke-width="3" fill="none"/>
  <text x="510" y="200" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-border)">production distribution</text>
  <text x="60" y="615" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Model degrades silently as the world changes</text>
  <rect x="760" y="40" width="480" height="580" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Distribution Shift</text>
  <text x="780" y="140" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Covariate shift:</text>
  <text x="780" y="175" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">P(X) changes, P(y|X) same</text>
  <text x="780" y="210" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">User base shifts</text>
  <text x="780" y="265" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Concept drift:</text>
  <text x="780" y="300" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">P(y|X) changes too</text>
  <text x="780" y="335" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Behaviour itself shifts</text>
  <text x="780" y="390" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Detect:</text>
  <text x="780" y="425" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">KS / chi² tests on features</text>
  <text x="780" y="460" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Performance monitoring</text>
  <text x="780" y="495" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Population stability index</text>
  <text x="780" y="550" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Respond:</text>
  <text x="780" y="585" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Retrain, recalibrate, alert</text>
</svg>

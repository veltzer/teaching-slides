<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata><type>regular</type></metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #c4cdd6; --border: #6b7280; --text: #212121;
        --text-muted: #555555; --text-faint: #888888; --code-bg: #1a1a2e;
        --shadow: #00000044; --black: #000000;
        --primary-fill: #5a7a9c; --primary-border: #3d5a7d; --primary-text: #ffffff; --primary-accent: #243b59;
        --ok-fill: #7a9a6a; --ok-border: #5a7a4d; --ok-text: #ffffff; --ok-accent: #385030;
        --warn-fill: #c8924a; --warn-border: #9c6e2e; --warn-text: #ffffff; --warn-accent: #5a3f12;
        --danger-fill: #a86058; --danger-border: #7d3f38; --danger-text: #ffffff; --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e; --info-border: #574a68; --info-text: #ffffff; --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
  </defs>
  <rect x="40" y="40" width="340" height="580" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="210" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Hour as integer</text>
  <line x1="80" y1="500" x2="350" y2="500" stroke="var(--text)" stroke-width="2"/>
  <line x1="80" y1="500" x2="80" y2="150" stroke="var(--text)" stroke-width="2"/>
  <text x="80" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">0</text>
  <text x="350" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">23</text>
  <text x="210" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">hour</text>
  <line x1="90" y1="490" x2="350" y2="170" stroke="var(--primary-border)" stroke-width="3"/>
  <ellipse cx="80" cy="500" rx="5" ry="5" fill="var(--primary-border)"/>
  <ellipse cx="350" cy="170" rx="5" ry="5" fill="var(--primary-border)"/>
  <text x="80" y="595" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-border)">23 and 0 are far apart</text>
  <text x="80" y="615" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-border)">though they're adjacent</text>
  <rect x="400" y="40" width="340" height="580" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="570" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Hour as sin/cos</text>
  <ellipse cx="570" cy="350" rx="160" ry="160" fill="none" stroke="var(--text)" stroke-width="2"/>
  <line x1="570" y1="350" x2="570" y2="180" stroke="var(--ok-border)" stroke-width="2"/>
  <ellipse cx="570" cy="180" rx="6" ry="6" fill="var(--ok-fill)"/>
  <text x="580" y="185" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-border)">0:00</text>
  <ellipse cx="730" cy="350" rx="6" ry="6" fill="var(--ok-fill)"/>
  <text x="745" y="355" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-border)">6:00</text>
  <ellipse cx="570" cy="510" rx="6" ry="6" fill="var(--ok-fill)"/>
  <text x="580" y="525" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-border)">12:00</text>
  <ellipse cx="410" cy="350" rx="6" ry="6" fill="var(--ok-fill)"/>
  <text x="375" y="355" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-border)">18:00</text>
  <ellipse cx="708" cy="263" rx="6" ry="6" fill="var(--ok-fill)"/>
  <ellipse cx="675" cy="207" rx="6" ry="6" fill="var(--ok-fill)"/>
  <text x="400" y="595" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-border)">23 and 0 are now neighbours</text>
  <text x="400" y="615" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-border)">on the unit circle</text>
  <rect x="760" y="40" width="480" height="580" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Cyclical Encoding</text>
  <text x="780" y="140" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Two new features per cycle:</text>
  <text x="780" y="180" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">hour_sin = sin(2π · h / 24)</text>
  <text x="780" y="220" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">hour_cos = cos(2π · h / 24)</text>
  <text x="780" y="280" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Apply to:</text>
  <text x="780" y="315" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Hour (period 24)</text>
  <text x="780" y="350" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Day-of-week (period 7)</text>
  <text x="780" y="385" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Month (period 12)</text>
  <text x="780" y="420" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Compass bearing (period 360)</text>
  <text x="780" y="475" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Why two:</text>
  <text x="780" y="510" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Sine alone is ambiguous</text>
  <text x="780" y="545" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">sin(π/2) = sin(π/2)... → ambig</text>
  <text x="780" y="580" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Pair locates the angle</text>
  <text x="780" y="615" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Trees benefit too</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata><type>regular</type></metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #c4cdd6; --border: #6b7280; --text: #212121;
        --text-muted: #555555; --text-faint: #888888; --code-bg: #1a1a2e;
        --shadow: #00000044; --black: #000000;
        --primary-fill: #5a7a9c; --primary-border: #3d5a7d; --primary-text: #ffffff; --primary-accent: #243b59;
        --ok-fill: #7a9a6a; --ok-border: #5a7a4d; --ok-text: #ffffff; --ok-accent: #385030;
        --warn-fill: #c8924a; --warn-border: #9c6e2e; --warn-text: #ffffff; --warn-accent: #5a3f12;
        --danger-fill: #a86058; --danger-border: #7d3f38; --danger-text: #ffffff; --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e; --info-border: #574a68; --info-text: #ffffff; --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
  </defs>
  <rect x="40" y="40" width="340" height="580" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="210" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Before scaling</text>
  <line x1="80" y1="120" x2="80" y2="540" stroke="var(--text)" stroke-width="2"/>
  <line x1="80" y1="540" x2="350" y2="540" stroke="var(--text)" stroke-width="2"/>
  <text x="60" y="335" font-family="Arial, sans-serif" font-size="12" fill="var(--text)" transform="rotate(-90 60 335)">income (k$)</text>
  <text x="210" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">age</text>
  <ellipse cx="120" cy="180" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="180" cy="200" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="240" cy="220" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="300" cy="180" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="150" cy="160" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="210" cy="190" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="270" cy="210" rx="6" ry="6" fill="var(--primary-fill)"/>
  <text x="210" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Range: 25-65 years</text>
  <text x="210" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Range: 30-200k income</text>
  <text x="170" y="440" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-border)">income dominates</text>
  <text x="170" y="465" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-border)">distance metrics</text>
  <rect x="400" y="40" width="340" height="580" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="570" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">After scaling</text>
  <line x1="440" y1="120" x2="440" y2="540" stroke="var(--text)" stroke-width="2"/>
  <line x1="440" y1="540" x2="710" y2="540" stroke="var(--text)" stroke-width="2"/>
  <text x="420" y="335" font-family="Arial, sans-serif" font-size="12" fill="var(--text)" transform="rotate(-90 420 335)">scaled income</text>
  <text x="570" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">scaled age</text>
  <ellipse cx="490" cy="320" rx="6" ry="6" fill="var(--ok-fill)"/>
  <ellipse cx="540" cy="380" rx="6" ry="6" fill="var(--ok-fill)"/>
  <ellipse cx="600" cy="440" rx="6" ry="6" fill="var(--ok-fill)"/>
  <ellipse cx="650" cy="320" rx="6" ry="6" fill="var(--ok-fill)"/>
  <ellipse cx="510" cy="280" rx="6" ry="6" fill="var(--ok-fill)"/>
  <ellipse cx="570" cy="350" rx="6" ry="6" fill="var(--ok-fill)"/>
  <ellipse cx="630" cy="410" rx="6" ry="6" fill="var(--ok-fill)"/>
  <text x="570" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Both have mean 0, std 1</text>
  <text x="570" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Both contribute equally</text>
  <rect x="760" y="40" width="480" height="580" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Scaling methods</text>
  <text x="780" y="140" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">StandardScaler:</text>
  <text x="780" y="175" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">(x − mean) / std</text>
  <text x="780" y="210" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Default for most models</text>
  <text x="780" y="265" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">MinMaxScaler:</text>
  <text x="780" y="300" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">to [0, 1] range</text>
  <text x="780" y="335" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">For neural nets</text>
  <text x="780" y="390" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">RobustScaler:</text>
  <text x="780" y="425" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Median + IQR</text>
  <text x="780" y="460" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Outlier-resistant</text>
  <text x="780" y="515" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Required for:</text>
  <text x="780" y="550" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">SVM, kNN, neural nets</text>
  <text x="780" y="600" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Skip for tree-based models</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#c4cdd6"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bd7d75"/><stop offset="100%" stop-color="#7d3f38"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#555555"/></marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/></marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/></marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/></marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/></marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/></marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/></marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Binning Continuous Features</text>
  <line x1="80" y1="200" x2="1200" y2="200" stroke="var(--text)" stroke-width="2"/>
  <text x="80" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">0</text>
  <text x="1200" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">100</text>
  <text x="640" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Continuous: age in years</text>
  <text x="640" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">Bins divide the range into groups</text>
  <rect x="80" y="270" width="270" height="100" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="215" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Child</text>
  <text x="215" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">0–12</text>
  <rect x="360" y="270" width="270" height="100" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="495" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Teen</text>
  <text x="495" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">13–19</text>
  <rect x="640" y="270" width="270" height="100" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="775" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Adult</text>
  <text x="775" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">20–64</text>
  <rect x="920" y="270" width="270" height="100" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1055" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Senior</text>
  <text x="1055" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">65+</text>
  <rect x="40" y="400" width="380" height="220" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Equal-width</text>
  <text x="60" y="475" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Cut range into N intervals</text>
  <text x="60" y="505" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Simple and intuitive</text>
  <text x="60" y="535" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Empty bins on skewed data</text>
  <text x="60" y="575" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--ok-text)">pd.cut(x, bins=10)</text>
  <rect x="450" y="400" width="380" height="220" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Equal-frequency</text>
  <text x="470" y="475" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">Same N points per bin</text>
  <text x="470" y="505" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">Quantile-based</text>
  <text x="470" y="535" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">Robust to skew</text>
  <text x="470" y="575" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--warn-text)">pd.qcut(x, q=10)</text>
  <rect x="860" y="400" width="380" height="220" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Why bin</text>
  <text x="880" y="475" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Tames outliers</text>
  <text x="880" y="505" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Linear models capture nonlinear</text>
  <text x="880" y="535" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Interaction-friendly</text>
  <text x="880" y="575" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--info-text)">Loses info — trees don't need</text>
</svg>

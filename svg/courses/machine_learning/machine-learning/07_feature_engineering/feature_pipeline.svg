<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#c4cdd6"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bd7d75"/><stop offset="100%" stop-color="#7d3f38"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#555555"/></marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/></marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/></marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/></marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/></marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/></marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/></marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Feature Pipeline</text>
  <rect x="40.0" y="100" width="165" height="90" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="122.5" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">Raw data</text>
  <line x1="210.0" y1="145" x2="242.0" y2="145" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="247.0" y="100" width="165" height="90" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="329.5" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-text)">Clean</text>
  <line x1="417.0" y1="145" x2="449.0" y2="145" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="454.0" y="100" width="165" height="90" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="536.5" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-text)">Transform</text>
  <line x1="624.0" y1="145" x2="656.0" y2="145" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="661.0" y="100" width="165" height="90" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="743.5" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--info-text)">Encode</text>
  <line x1="831.0" y1="145" x2="863.0" y2="145" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="868.0" y="100" width="165" height="90" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950.5" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--danger-text)">Select</text>
  <line x1="1038.0" y1="145" x2="1070.0" y2="145" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1075.0" y="100" width="165" height="90" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1157.5" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">Model</text>
  <rect x="40" y="220" width="380" height="400" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Clean</text>
  <text x="60" y="295" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Drop duplicates</text>
  <text x="60" y="325" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Fix types</text>
  <text x="60" y="355" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Impute missing</text>
  <text x="60" y="385" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Cap outliers</text>
  <text x="60" y="415" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Standardise units</text>
  <text x="60" y="460" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Transform</text>
  <text x="60" y="495" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Log / sqrt / Box-Cox</text>
  <text x="60" y="525" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Polynomial features</text>
  <text x="60" y="555" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Binning</text>
  <text x="60" y="585" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Scaling: MinMax / Z</text>
  <text x="60" y="615" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Date diffs / cyclical</text>
  <rect x="450" y="220" width="380" height="400" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Encode (categorical)</text>
  <text x="470" y="295" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Label</text>
  <text x="470" y="325" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">One-hot</text>
  <text x="470" y="355" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Ordinal</text>
  <text x="470" y="385" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Target / mean</text>
  <text x="470" y="415" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Frequency</text>
  <text x="470" y="445" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Hash</text>
  <text x="470" y="475" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Embedding</text>
  <text x="470" y="520" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--info-text)">Text:</text>
  <text x="470" y="550" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">TF-IDF</text>
  <text x="470" y="580" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Word vectors</text>
  <text x="470" y="610" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Tokeniser + transformer</text>
  <rect x="860" y="220" width="380" height="400" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--danger-text)">Select</text>
  <text x="880" y="295" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--danger-text)">Filter:</text>
  <text x="880" y="325" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">  variance, χ², MI, corr</text>
  <text x="880" y="365" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--danger-text)">Wrapper:</text>
  <text x="880" y="395" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">  forward / backward / RFE</text>
  <text x="880" y="435" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--danger-text)">Embedded:</text>
  <text x="880" y="465" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">  L1, tree importance</text>
  <text x="880" y="510" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--danger-text)">Why select:</text>
  <text x="880" y="540" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">  curse of dim</text>
  <text x="880" y="570" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">  faster training</text>
  <text x="880" y="600" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">  interpretability</text>
</svg>

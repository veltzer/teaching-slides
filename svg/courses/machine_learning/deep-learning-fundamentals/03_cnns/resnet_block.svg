<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="781.176470588235" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="38.548840084955" font-weight="bold" fill="var(--text)">ResNet Block: y = F(x) + x</text>

  <rect x="604.705882352941" y="104.444444444444" width="352.941176470588" height="64.444444444444" rx="8.26046573249" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="781.176470588235" y="144.185185185185" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.534885774968" font-weight="bold" fill="var(--warn-text)">Input x</text>

  <rect x="428.235294117647" y="222.592592592593" width="352.941176470588" height="64.444444444444" rx="8.26046573249" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="604.705882352941" y="262.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.781397197471" font-weight="bold" fill="var(--primary-text)">Conv 3x3</text>

  <rect x="428.235294117647" y="308.518518518519" width="352.941176470588" height="64.444444444444" rx="8.26046573249" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="604.705882352941" y="348.259259259259" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.781397197471" font-weight="bold" fill="var(--primary-text)">BN + ReLU</text>

  <rect x="428.235294117647" y="394.444444444444" width="352.941176470588" height="64.444444444444" rx="8.26046573249" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="604.705882352941" y="434.185185185185" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.781397197471" font-weight="bold" fill="var(--primary-text)">Conv 3x3</text>

  <rect x="428.235294117647" y="480.37037037037" width="352.941176470588" height="64.444444444444" rx="8.26046573249" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="604.705882352941" y="520.111111111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.781397197471" font-weight="bold" fill="var(--primary-text)">BN</text>

  <ellipse cx="781.176470588235" cy="587.777777777778" rx="70.588235294118" ry="32.222222222222" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="781.176470588235" y="596.37037037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.288374352465" font-weight="bold" fill="var(--ok-text)">+</text>

  <line x1="604.705882352941" y1="168.888888888889" x2="604.705882352941" y2="217.222222222222" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="604.705882352941" y1="287.037037037037" x2="604.705882352941" y2="303.148148148148" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="604.705882352941" y1="372.962962962963" x2="604.705882352941" y2="389.074074074074" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="604.705882352941" y1="458.888888888889" x2="604.705882352941" y2="475" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="604.705882352941" y1="544.814814814815" x2="731.764705882353" y2="582.407407407407" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M 957.647058823529 136.666666666667 L 1169.411764705882 136.666666666667 L 1169.411764705882 587.777777777778 L 851.764705882353 587.777777777778" stroke="var(--ok-border)" stroke-width="3" fill="none" marker-end="url(#arrow-ok)"/>
  <text x="1240" y="372.962962962963" font-family="Arial, sans-serif" font-size="22.027908619974" font-weight="bold" fill="var(--ok-border)">identity shortcut</text>
  <text x="1240" y="403.037037037037" font-family="Arial, sans-serif" font-size="17.897675753729" fill="var(--text-muted)">passes x straight through</text>

  <text x="40" y="276.296296296296" font-family="Arial, sans-serif" font-size="22.027908619974" fill="var(--text)">F(x) = the residual branch</text>
  <text x="40" y="306.37037037037" font-family="Arial, sans-serif" font-size="19.274420042477" fill="var(--text-muted)">learns the small delta</text>
  <text x="40" y="336.444444444444" font-family="Arial, sans-serif" font-size="19.274420042477" fill="var(--text-muted)">to add to x</text>

  <text x="40" y="501.851851851852" font-family="Arial, sans-serif" font-size="19.274420042477" fill="var(--text-muted)">Easy gradient path back —</text>
  <text x="40" y="528.703703703704" font-family="Arial, sans-serif" font-size="19.274420042477" fill="var(--text-muted)">100+ layer nets trainable.</text>
</svg>

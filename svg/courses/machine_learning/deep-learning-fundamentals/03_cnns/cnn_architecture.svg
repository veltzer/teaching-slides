  <text x="624.070796460177" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="31.392462879865" font-weight="bold" fill="var(--text)">Typical CNN Architecture</text>

  <rect x="40" y="217.551020408163" width="148.672566371681" height="213.061224489796" rx="6.7269563314" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="114.336283185841" y="276.734693877551" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.180868994199" font-weight="bold" fill="var(--info-text)">Image</text>
  <text x="114.336283185841" y="318.163265306122" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.575072051366" fill="var(--info-text)">224x224x3</text>

  <rect x="231.150442477876" y="241.224489795918" width="127.433628318584" height="165.714285714286" rx="6.7269563314" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="294.867256637168" y="294.489795918367" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.938550217066" font-weight="bold" fill="var(--primary-text)">Conv +</text>
  <text x="294.867256637168" y="324.081632653061" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.938550217066" font-weight="bold" fill="var(--primary-text)">ReLU</text>
  <text x="294.867256637168" y="365.510204081633" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.453912662799" fill="var(--primary-text)">112x112x64</text>

  <rect x="401.061946902655" y="264.897959183673" width="106.194690265487" height="118.367346938776" rx="6.7269563314" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="454.159292035398" y="312.244897959184" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.938550217066" font-weight="bold" fill="var(--warn-text)">Pool</text>
  <text x="454.159292035398" y="347.755102040816" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.453912662799" fill="var(--warn-text)">56x56x64</text>

  <rect x="549.734513274336" y="276.734693877551" width="106.194690265487" height="94.69387755102" rx="6.7269563314" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="602.83185840708" y="318.163265306122" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.696231439933" font-weight="bold" fill="var(--primary-text)">Conv+ReLU</text>
  <text x="602.83185840708" y="347.755102040816" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.332753274233" fill="var(--primary-text)">28x28x128</text>

  <rect x="698.407079646018" y="288.571428571429" width="95.575221238938" height="71.020408163265" rx="6.7269563314" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="746.194690265487" y="318.163265306122" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.696231439933" font-weight="bold" fill="var(--warn-text)">Pool</text>
  <text x="746.194690265487" y="341.836734693878" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.332753274233" fill="var(--warn-text)">14x14x128</text>

  <rect x="836.460176991151" y="294.489795918367" width="106.194690265487" height="59.183673469388" rx="6.7269563314" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="889.557522123894" y="318.163265306122" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.575072051366" font-weight="bold" fill="var(--info-text)">Flatten</text>
  <text x="889.557522123894" y="341.836734693878" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.332753274233" fill="var(--info-text)">25088</text>

  <rect x="985.132743362832" y="276.734693877551" width="106.194690265487" height="94.69387755102" rx="6.7269563314" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1038.230088495576" y="318.163265306122" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.696231439933" font-weight="bold" fill="var(--primary-text)">Dense</text>
  <text x="1038.230088495576" y="347.755102040816" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.332753274233" fill="var(--primary-text)">256</text>

  <rect x="1133.805309734513" y="264.897959183673" width="106.194690265487" height="118.367346938776" rx="6.7269563314" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1186.902654867257" y="318.163265306122" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.696231439933" font-weight="bold" fill="var(--ok-text)">Softmax</text>
  <text x="1186.902654867257" y="347.755102040816" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.332753274233" fill="var(--ok-text)">N classes</text>

  <line x1="188.672566371681" y1="324.081632653061" x2="231.150442477876" y2="324.081632653061" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="358.58407079646" y1="324.081632653061" x2="401.061946902655" y2="324.081632653061" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="507.256637168142" y1="324.081632653061" x2="549.734513274336" y2="324.081632653061" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="655.929203539823" y1="324.081632653061" x2="698.407079646018" y2="324.081632653061" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="793.982300884956" y1="324.081632653061" x2="836.460176991151" y2="324.081632653061" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="942.654867256637" y1="324.081632653061" x2="985.132743362832" y2="324.081632653061" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1091.327433628319" y1="324.081632653061" x2="1133.805309734513" y2="324.081632653061" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="284.247787610619" y="513.469387755102" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.817390828499" font-style="italic" fill="var(--text-muted)">spatial size shrinks</text>
  <text x="963.893805309735" y="513.469387755102" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.817390828499" font-style="italic" fill="var(--text-muted)">channels grow, then classify</text>

  <text x="624.070796460177" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.938550217066" fill="var(--text-muted)">Stack conv + pool blocks; flatten or global-pool; small dense head for classification.</text>
</svg>

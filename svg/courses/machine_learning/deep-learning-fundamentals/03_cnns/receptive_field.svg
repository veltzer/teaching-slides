<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.954011755682" font-weight="bold" fill="var(--text)">Receptive field: each layer sees more of the image</text>

  <rect x="40" y="87.027027027027" width="279.310344827586" height="532.972972972973" rx="6.23850293892" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="179.655172413793" y="123.603603603604" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.675758326941" font-weight="bold" fill="var(--primary-text)">Input pixel</text>
  <text x="179.655172413793" y="154.954954954955" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--primary-text)">single 1×1</text>
  <rect x="81.379310344828" y="191.531531531532" width="196.551724137931" height="198.558558558559" fill="var(--primary-text)" fill-opacity="0.18" stroke="var(--primary-text)" stroke-width="1"/>
  <rect x="174.48275862069" y="285.585585585586" width="10.344827586207" height="10.45045045045" fill="var(--primary-text)" stroke="var(--primary-text)" stroke-width="2"/>
  <text x="179.655172413793" y="426.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--primary-text)">RF = 1×1</text>
  <text x="179.655172413793" y="468.468468468468" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" font-style="italic" fill="var(--primary-text)">sees one pixel</text>
  <text x="179.655172413793" y="562.522522522523" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--primary-text)">edges, textures</text>

  <rect x="340" y="87.027027027027" width="279.310344827586" height="532.972972972973" rx="6.23850293892" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="479.655172413793" y="123.603603603604" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.675758326941" font-weight="bold" fill="var(--info-text)">After conv 1 (3×3)</text>
  <text x="479.655172413793" y="154.954954954955" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--info-text)">RF = 3×3</text>
  <rect x="381.379310344828" y="191.531531531532" width="196.551724137931" height="198.558558558559" fill="var(--info-text)" fill-opacity="0.18" stroke="var(--info-text)" stroke-width="1"/>
  <rect x="458.965517241379" y="264.684684684685" width="41.379310344828" height="41.801801801802" fill="var(--info-text)" stroke="var(--info-text)" stroke-width="2"/>
  <text x="479.655172413793" y="426.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--info-text)">RF = 3×3</text>
  <text x="479.655172413793" y="468.468468468468" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" font-style="italic" fill="var(--info-text)">corners</text>
  <text x="479.655172413793" y="562.522522522523" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--info-text)">simple shapes</text>

  <rect x="640" y="87.027027027027" width="279.310344827586" height="532.972972972973" rx="6.23850293892" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="779.655172413793" y="123.603603603604" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.675758326941" font-weight="bold" fill="var(--ok-text)">After conv 2 + pool</text>
  <text x="779.655172413793" y="154.954954954955" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--ok-text)">RF grows quickly</text>
  <rect x="681.379310344828" y="191.531531531532" width="196.551724137931" height="198.558558558559" fill="var(--ok-text)" fill-opacity="0.18" stroke="var(--ok-text)" stroke-width="1"/>
  <rect x="733.103448275862" y="238.558558558559" width="93.103448275862" height="94.054054054054" fill="var(--ok-text)" stroke="var(--ok-text)" stroke-width="2"/>
  <text x="779.655172413793" y="426.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--ok-text)">RF ≈ 9×9</text>
  <text x="779.655172413793" y="468.468468468468" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" font-style="italic" fill="var(--ok-text)">parts of objects</text>
  <text x="779.655172413793" y="562.522522522523" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--ok-text)">eyes, wheels, fur</text>

  <rect x="940" y="87.027027027027" width="300" height="532.972972972973" rx="6.23850293892" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="123.603603603604" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.675758326941" font-weight="bold" fill="var(--warn-text)">Deep layers</text>
  <text x="1090" y="154.954954954955" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--warn-text)">RF covers whole image</text>
  <rect x="986.551724137931" y="191.531531531532" width="206.896551724138" height="198.558558558559" fill="var(--warn-text)" fill-opacity="0.18" stroke="var(--warn-text)" stroke-width="1"/>
  <rect x="986.551724137931" y="191.531531531532" width="206.896551724138" height="198.558558558559" fill="var(--warn-text)" fill-opacity="0.5" stroke="var(--warn-text)" stroke-width="2"/>
  <text x="1090" y="426.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--warn-text)">RF = full image</text>
  <text x="1090" y="468.468468468468" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" font-style="italic" fill="var(--warn-text)">whole objects, scene</text>
  <text x="1090" y="562.522522522523" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--warn-text)">"dog", "cat", "car"</text>

  <line x1="319.310344827586" y1="290.810810810811" x2="340" y2="290.810810810811" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="619.310344827586" y1="290.810810810811" x2="640" y2="290.810810810811" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="919.310344827586" y1="290.810810810811" x2="940" y2="290.810810810811" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
</svg>

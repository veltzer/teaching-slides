<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.495762407505" font-weight="bold" fill="var(--text)">Feature Extraction vs Fine-Tuning</text>

  <rect x="40" y="91.785714285714" width="578.571428571429" height="486.785714285714" rx="10.534200859823" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="329.285714285714" y="128.035714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.175241891611" font-weight="bold" fill="var(--primary-border)">Feature Extraction</text>

  <rect x="168.571428571429" y="164.285714285714" width="321.428571428571" height="62.142857142857" rx="6.320520515894" fill="var(--surface)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="329.285714285714" y="195.357142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.854721375717" font-weight="bold" fill="var(--text)">Backbone layer 1</text>
  <text x="329.285714285714" y="216.071428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" font-style="italic" fill="var(--text-muted)">frozen</text>

  <rect x="168.571428571429" y="247.142857142857" width="321.428571428571" height="62.142857142857" rx="6.320520515894" fill="var(--surface)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="329.285714285714" y="278.214285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.854721375717" font-weight="bold" fill="var(--text)">Backbone layer 2</text>
  <text x="329.285714285714" y="298.928571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" font-style="italic" fill="var(--text-muted)">frozen</text>

  <rect x="168.571428571429" y="330" width="321.428571428571" height="62.142857142857" rx="6.320520515894" fill="var(--surface)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="329.285714285714" y="361.071428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.854721375717" font-weight="bold" fill="var(--text)">Backbone layer 3</text>
  <text x="329.285714285714" y="381.785714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" font-style="italic" fill="var(--text-muted)">frozen</text>

  <rect x="168.571428571429" y="412.857142857143" width="321.428571428571" height="82.857142857143" rx="6.320520515894" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="329.285714285714" y="449.107142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.961561547682" font-weight="bold" fill="var(--ok-text)">New head</text>
  <text x="329.285714285714" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--ok-text)">only this trains</text>

  <text x="329.285714285714" y="542.321428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" font-style="italic" fill="var(--text-muted)">cheap, fast, small data ok</text>

  <rect x="661.428571428571" y="91.785714285714" width="578.571428571429" height="486.785714285714" rx="10.534200859823" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="950.714285714286" y="128.035714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.175241891611" font-weight="bold" fill="var(--ok-border)">Fine-Tuning</text>

  <rect x="790" y="164.285714285714" width="321.428571428571" height="62.142857142857" rx="6.320520515894" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" opacity="0.5"/>
  <text x="950.714285714286" y="195.357142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.854721375717" font-weight="bold" fill="var(--primary-text)">Backbone layer 1</text>
  <text x="950.714285714286" y="216.071428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--primary-text)">tiny lr (or frozen)</text>

  <rect x="790" y="247.142857142857" width="321.428571428571" height="62.142857142857" rx="6.320520515894" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" opacity="0.7"/>
  <text x="950.714285714286" y="278.214285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.854721375717" font-weight="bold" fill="var(--primary-text)">Backbone layer 2</text>
  <text x="950.714285714286" y="298.928571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--primary-text)">small lr</text>

  <rect x="790" y="330" width="321.428571428571" height="62.142857142857" rx="6.320520515894" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950.714285714286" y="361.071428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.854721375717" font-weight="bold" fill="var(--warn-text)">Backbone layer 3</text>
  <text x="950.714285714286" y="381.785714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--warn-text)">moderate lr</text>

  <rect x="790" y="412.857142857143" width="321.428571428571" height="82.857142857143" rx="6.320520515894" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950.714285714286" y="449.107142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.961561547682" font-weight="bold" fill="var(--ok-text)">New head</text>
  <text x="950.714285714286" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--ok-text)">full lr</text>

  <text x="950.714285714286" y="542.321428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" font-style="italic" fill="var(--text-muted)">stronger, needs more data and care</text>

  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.854721375717" fill="var(--text-muted)">Discriminative learning rates: lower deep in the backbone, higher near the new head.</text>
</svg>

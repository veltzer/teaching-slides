<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.534586728656" font-weight="bold" fill="var(--text)">Three freezing strategies</text>

  <rect x="40" y="87.027027027027" width="380" height="532.972972972973" rx="6.133646682164" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="230" y="123.603603603604" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.400940046492" font-weight="bold" fill="var(--text)">Feature extractor</text>
  <text x="230" y="149.72972972973" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" font-style="italic" fill="var(--text-muted)">small target dataset</text>

  <rect x="80" y="191.531531531532" width="300" height="52.252252252252" rx="6.133646682164" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="224.972972972973" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" font-weight="bold" fill="var(--danger-text)">classifier head (train)</text>
  <rect x="80" y="259.459459459459" width="300" height="52.252252252252" rx="6.133646682164" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="230" y="292.900900900901" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--text-muted)">frozen layer</text>
  <rect x="80" y="327.387387387387" width="300" height="52.252252252252" rx="6.133646682164" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="230" y="360.828828828829" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--text-muted)">frozen layer</text>
  <rect x="80" y="395.315315315315" width="300" height="52.252252252252" rx="6.133646682164" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="230" y="428.756756756757" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--text-muted)">frozen layer</text>
  <rect x="80" y="463.243243243243" width="300" height="52.252252252252" rx="6.133646682164" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="230" y="496.684684684685" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--text-muted)">frozen layer</text>

  <text x="230" y="562.522522522523" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--text)">fast, low memory</text>
  <text x="230" y="588.648648648649" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--text)">a few hundred labels</text>
  <text x="230" y="614.774774774775" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.267293364328" font-style="italic" fill="var(--text-muted)">domain matches pretrain</text>

  <rect x="450" y="87.027027027027" width="380" height="532.972972972973" rx="6.133646682164" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="123.603603603604" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.400940046492" font-weight="bold" fill="var(--text)">Fine-tune top layers</text>
  <text x="640" y="149.72972972973" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" font-style="italic" fill="var(--text-muted)">medium target dataset</text>

  <rect x="490" y="191.531531531532" width="300" height="52.252252252252" rx="6.133646682164" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="224.972972972973" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" font-weight="bold" fill="var(--danger-text)">classifier head (train)</text>
  <rect x="490" y="259.459459459459" width="300" height="52.252252252252" rx="6.133646682164" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="292.900900900901" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" font-weight="bold" fill="var(--warn-text)">top block (low LR)</text>
  <rect x="490" y="327.387387387387" width="300" height="52.252252252252" rx="6.133646682164" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="360.828828828829" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" font-weight="bold" fill="var(--warn-text)">middle block (low LR)</text>
  <rect x="490" y="395.315315315315" width="300" height="52.252252252252" rx="6.133646682164" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="428.756756756757" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--text-muted)">frozen layer</text>
  <rect x="490" y="463.243243243243" width="300" height="52.252252252252" rx="6.133646682164" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="496.684684684685" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--text-muted)">frozen layer</text>

  <text x="640" y="562.522522522523" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--text)">LR for unfrozen = 0.1× head</text>
  <text x="640" y="588.648648648649" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--text)">thousands of labels</text>
  <text x="640" y="614.774774774775" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.267293364328" font-style="italic" fill="var(--text-muted)">good default</text>

  <rect x="860" y="87.027027027027" width="380" height="532.972972972973" rx="6.133646682164" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1050" y="123.603603603604" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.400940046492" font-weight="bold" fill="var(--text)">Full fine-tune</text>
  <text x="1050" y="149.72972972973" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" font-style="italic" fill="var(--text-muted)">large dataset / new domain</text>

  <rect x="900" y="191.531531531532" width="300" height="52.252252252252" rx="6.133646682164" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="224.972972972973" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" font-weight="bold" fill="var(--danger-text)">classifier head (train)</text>
  <rect x="900" y="259.459459459459" width="300" height="52.252252252252" rx="6.133646682164" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="292.900900900901" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" font-weight="bold" fill="var(--danger-text)">top block (train)</text>
  <rect x="900" y="327.387387387387" width="300" height="52.252252252252" rx="6.133646682164" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="360.828828828829" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" font-weight="bold" fill="var(--danger-text)">middle block (train)</text>
  <rect x="900" y="395.315315315315" width="300" height="52.252252252252" rx="6.133646682164" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="428.756756756757" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" font-weight="bold" fill="var(--danger-text)">lower block (train)</text>
  <rect x="900" y="463.243243243243" width="300" height="52.252252252252" rx="6.133646682164" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="496.684684684685" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" font-weight="bold" fill="var(--danger-text)">first block (train)</text>

  <text x="1050" y="562.522522522523" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--text)">tens of thousands+ labels</text>
  <text x="1050" y="588.648648648649" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--text)">watch for catastrophic forgetting</text>
  <text x="1050" y="614.774774774775" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.267293364328" font-style="italic" fill="var(--text-muted)">discriminative LR — deeper = smaller</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.316497186031" font-weight="bold" fill="var(--text)">LSTM: three gates around a cell state</text>

  <rect x="40" y="75.929203539823" width="1200" height="390.088495575221" rx="6.079124296508" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="1"/>

  <line x1="80" y1="147.787610619469" x2="1200" y2="147.787610619469" stroke="var(--primary-border)" stroke-width="4"/>
  <line x1="80" y1="147.787610619469" x2="80" y2="106.725663716814" stroke="var(--primary-border)" stroke-width="3" marker-end="url(#arrow-primary)"/>
  <line x1="1200" y1="147.787610619469" x2="1240" y2="147.787610619469" stroke="var(--primary-border)" stroke-width="4"/>
  <text x="60" y="142.654867256637" text-anchor="end" font-family="Arial, sans-serif" font-size="14.184623358518" font-weight="bold" fill="var(--primary-accent)">cₜ₋₁</text>
  <text x="1230" y="168.318584070796" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" font-weight="bold" fill="var(--primary-accent)">cₜ</text>
  <text x="640" y="132.389380530973" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" font-style="italic" fill="var(--primary-accent)">cell state — long-term memory</text>

  <line x1="80" y1="424.955752212389" x2="1200" y2="424.955752212389" stroke="var(--info-border)" stroke-width="2"/>
  <text x="60" y="424.955752212389" text-anchor="end" font-family="Arial, sans-serif" font-size="14.184623358518" font-weight="bold" fill="var(--info-accent)">hₜ₋₁</text>
  <text x="1230" y="424.955752212389" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" font-weight="bold" fill="var(--info-accent)">hₜ</text>
  <text x="640" y="450.619469026549" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" font-style="italic" fill="var(--info-accent)">hidden state — output at step t</text>

  <rect x="180" y="209.380530973451" width="200" height="184.778761061947" rx="6.079124296508" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="280" y="245.309734513274" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.224185506772" font-weight="bold" fill="var(--danger-text)">Forget gate</text>
  <text x="280" y="276.106194690266" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.197810741269" fill="var(--danger-text)">fₜ = σ(W₌ · [h, x])</text>
  <text x="280" y="312.035398230089" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--danger-text)">multiplied onto c</text>
  <text x="280" y="337.699115044248" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" font-style="italic" fill="var(--danger-text)">what to drop from c</text>
  <text x="280" y="373.628318584071" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.158248593015" fill="var(--danger-text)"/>

  <rect x="450" y="209.380530973451" width="200" height="184.778761061947" rx="6.079124296508" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="550" y="245.309734513274" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.224185506772" font-weight="bold" fill="var(--ok-text)">Input gate</text>
  <text x="550" y="276.106194690266" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.197810741269" fill="var(--ok-text)">iₜ = σ(Wᵢ · [h, x])</text>
  <text x="550" y="312.035398230089" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--ok-text)">+ candidate c̃</text>
  <text x="550" y="337.699115044248" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" font-style="italic" fill="var(--ok-text)"/>
  <text x="550" y="373.628318584071" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.158248593015" fill="var(--ok-text)"/>

  <rect x="720" y="209.380530973451" width="200" height="184.778761061947" rx="6.079124296508" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="820" y="245.309734513274" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.224185506772" font-weight="bold" fill="var(--info-text)">Update c</text>
  <text x="820" y="281.238938053097" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.197810741269" fill="var(--info-text)">cₜ = f ⊙ cₜ₋₁</text>
  <text x="820" y="306.902654867257" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.197810741269" fill="var(--info-text)">+ i ⊙ c̃</text>
  <text x="820" y="347.964601769912" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" font-style="italic" fill="var(--info-text)"/>
  <text x="820" y="373.628318584071" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.158248593015" fill="var(--info-text)">additive ⇒ gradients flow</text>

  <rect x="990" y="209.380530973451" width="200" height="184.778761061947" rx="6.079124296508" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="245.309734513274" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.224185506772" font-weight="bold" fill="var(--warn-text)">Output gate</text>
  <text x="1090" y="276.106194690266" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.197810741269" fill="var(--warn-text)">oₜ = σ(Wₒ · [h, x])</text>
  <text x="1090" y="312.035398230089" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--warn-text)">h = o ⊙ tanh(c)</text>
  <text x="1090" y="337.699115044248" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" font-style="italic" fill="var(--warn-text)"/>
  <text x="1090" y="373.628318584071" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.158248593015" fill="var(--warn-text)"/>

  <rect x="40" y="486.548672566372" width="1200" height="133.451327433628" rx="6.079124296508" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="522.477876106195" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.224185506772" font-weight="bold" fill="var(--primary-text)">Why this beats vanilla RNN</text>
  <text x="640" y="553.274336283186" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--primary-text)">additive path on c ⇒ gradients survive long sequences</text>
  <text x="640" y="580.991150442478" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--primary-text)">gates pick per-step what to keep, write, or read</text>
  <text x="640" y="607.681415929204" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" font-style="italic" fill="var(--primary-text)">GRU: same idea, two gates, fewer params</text>
</svg>

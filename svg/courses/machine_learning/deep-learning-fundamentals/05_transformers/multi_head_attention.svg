  <text x="652.765957446808" y="132.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.884873705863" font-weight="bold" fill="var(--info-text)">Input (Q, K, V)</text>

  <rect x="40" y="219.272727272727" width="229.787234042553" height="84.363636363636" rx="6.961624568621" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="154.893617021277" y="258.290909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.884873705863" font-weight="bold" fill="var(--warn-text)">Head 1</text>
  <text x="154.893617021277" y="284.654545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.083519898679" fill="var(--warn-text)">Attention(Q1,K1,V1)</text>

  <rect x="346.382978723404" y="219.272727272727" width="229.787234042553" height="84.363636363636" rx="6.961624568621" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="461.276595744681" y="258.290909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.884873705863" font-weight="bold" fill="var(--warn-text)">Head 2</text>
  <text x="461.276595744681" y="284.654545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.083519898679" fill="var(--warn-text)">Attention(Q2,K2,V2)</text>

  <rect x="652.765957446808" y="219.272727272727" width="229.787234042553" height="84.363636363636" rx="6.961624568621" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="767.659574468085" y="258.290909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.884873705863" font-weight="bold" fill="var(--warn-text)">Head 3</text>
  <text x="767.659574468085" y="284.654545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.083519898679" fill="var(--warn-text)">Attention(Q3,K3,V3)</text>

  <rect x="959.148936170213" y="219.272727272727" width="280.851063829787" height="84.363636363636" rx="6.961624568621" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1099.574468085106" y="258.290909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.884873705863" font-weight="bold" fill="var(--warn-text)">Head h</text>
  <text x="1099.574468085106" y="284.654545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.083519898679" fill="var(--warn-text)">Attention(Qh,Kh,Vh)</text>

  <line x1="601.702127659574" y1="156" x2="154.893617021277" y2="214" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="627.234042553192" y1="156" x2="461.276595744681" y2="214" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="678.297872340426" y1="156" x2="767.659574468085" y2="214" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="703.829787234043" y1="156" x2="1099.574468085106" y2="214" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="320.851063829787" y="388" width="638.297872340426" height="84.363636363636" rx="6.961624568621" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="427.018181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.884873705863" font-weight="bold" fill="var(--primary-text)">Concatenate</text>
  <text x="640" y="453.381818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.083519898679" fill="var(--primary-text)">stack head outputs along the feature axis</text>

  <line x1="154.893617021277" y1="303.636363636364" x2="410.212765957447" y2="382.727272727273" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="461.276595744681" y1="303.636363636364" x2="550.63829787234" y2="382.727272727273" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="767.659574468085" y1="303.636363636364" x2="742.127659574468" y2="382.727272727273" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1099.574468085106" y1="303.636363636364" x2="882.553191489362" y2="382.727272727273" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="474.042553191489" y="504" width="331.914893617021" height="63.272727272727" rx="6.961624568621" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="544.072727272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.884873705863" font-weight="bold" fill="var(--ok-text)">Output Projection W_o</text>
  <line x1="640" y1="472.363636363636" x2="640" y2="498.727272727273" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="652.765957446808" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.404061421553" fill="var(--text-muted)">Heads focus on different patterns; concat + project blends them back.</text>

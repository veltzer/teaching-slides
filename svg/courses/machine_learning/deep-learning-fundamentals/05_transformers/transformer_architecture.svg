<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.588198052228" font-weight="bold" fill="var(--text)">Encoder-Decoder Transformer</text>

  <rect x="40" y="104.444444444444" width="444.444444444444" height="515.555555555556" rx="10.924356447224" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="262.222222222222" y="136.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.848712894448" font-weight="bold" fill="var(--primary-border)">Encoder Stack</text>

  <rect x="106.666666666667" y="179.62962962963" width="311.111111111111" height="53.703703703704" rx="6.554613868335" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="262.222222222222" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.478970315559" fill="var(--info-text)">Embedding + Position</text>

  <rect x="106.666666666667" y="276.296296296296" width="311.111111111111" height="53.703703703704" rx="6.554613868335" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="262.222222222222" y="310.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.478970315559" fill="var(--warn-text)">Self-Attention</text>

  <rect x="106.666666666667" y="351.481481481482" width="311.111111111111" height="53.703703703704" rx="6.554613868335" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="262.222222222222" y="385.851851851852" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.478970315559" fill="var(--ok-text)">Feedforward</text>

  <rect x="106.666666666667" y="437.407407407408" width="311.111111111111" height="53.703703703704" rx="6.554613868335" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="262.222222222222" y="471.777777777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.478970315559" fill="var(--warn-text)">Self-Attention</text>

  <rect x="106.666666666667" y="512.592592592593" width="311.111111111111" height="53.703703703704" rx="6.554613868335" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="262.222222222222" y="546.962962962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.478970315559" fill="var(--ok-text)">Feedforward</text>

  <text x="262.222222222222" y="603.888888888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.201663381391" font-style="italic" fill="var(--text-muted)">N layers</text>

  <rect x="795.555555555556" y="104.444444444444" width="444.444444444444" height="515.555555555556" rx="10.924356447224" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="1017.777777777778" y="136.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.848712894448" font-weight="bold" fill="var(--primary-border)">Decoder Stack</text>

  <rect x="862.222222222222" y="179.62962962963" width="311.111111111111" height="53.703703703704" rx="6.554613868335" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1017.777777777778" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.478970315559" fill="var(--info-text)">Output Embedding + Position</text>

  <rect x="862.222222222222" y="265.555555555556" width="311.111111111111" height="53.703703703704" rx="6.554613868335" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1017.777777777778" y="299.925925925926" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.294099026114" fill="var(--warn-text)">Masked Self-Attention</text>

  <rect x="862.222222222222" y="340.740740740741" width="311.111111111111" height="53.703703703704" rx="6.554613868335" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1017.777777777778" y="375.111111111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.294099026114" fill="var(--primary-text)">Cross-Attention to Encoder</text>

  <rect x="862.222222222222" y="415.925925925926" width="311.111111111111" height="53.703703703704" rx="6.554613868335" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1017.777777777778" y="450.296296296296" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.478970315559" fill="var(--ok-text)">Feedforward</text>

  <rect x="862.222222222222" y="501.851851851852" width="311.111111111111" height="53.703703703704" rx="6.554613868335" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1017.777777777778" y="536.222222222222" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.478970315559" fill="var(--info-text)">Linear + Softmax</text>

  <text x="1017.777777777778" y="603.888888888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.201663381391" font-style="italic" fill="var(--text-muted)">N layers + output head</text>

  <path d="M 417.777777777778 367.592592592593 Q 595.555555555556 233.333333333333 862.222222222222 367.592592592593" stroke="var(--primary-border)" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="640" y="244.074074074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.294099026114" font-weight="bold" fill="var(--primary-border)">encoder K, V</text>
</svg>

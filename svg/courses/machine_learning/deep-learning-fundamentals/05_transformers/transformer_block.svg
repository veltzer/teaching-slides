<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="740" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="36.787679096857" font-weight="bold" fill="var(--text)">Transformer Block</text>

  <rect x="506.666666666667" y="91.785714285714" width="466.666666666667" height="51.785714285714" rx="7.883074092184" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="740" y="124.928571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.649222276551" font-weight="bold" fill="var(--info-text)">Input</text>

  <rect x="506.666666666667" y="174.642857142857" width="466.666666666667" height="62.142857142857" rx="7.883074092184" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="740" y="212.964285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.02153091249" font-weight="bold" fill="var(--warn-text)">Multi-Head Self-Attention</text>

  <ellipse cx="740" cy="278.214285714286" rx="83.333333333333" ry="25.892857142857" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="740" y="286.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.649222276551" font-weight="bold" fill="var(--text)">Add</text>

  <rect x="506.666666666667" y="330" width="466.666666666667" height="51.785714285714" rx="7.883074092184" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="740" y="363.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.02153091249" font-weight="bold" fill="var(--primary-text)">Layer Norm</text>

  <rect x="506.666666666667" y="412.857142857143" width="466.666666666667" height="62.142857142857" rx="7.883074092184" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="740" y="450.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.02153091249" font-weight="bold" fill="var(--ok-text)">Feedforward (MLP)</text>

  <ellipse cx="740" cy="516.428571428571" rx="83.333333333333" ry="25.892857142857" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="740" y="524.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.649222276551" font-weight="bold" fill="var(--text)">Add</text>

  <rect x="506.666666666667" y="568.214285714286" width="466.666666666667" height="51.785714285714" rx="7.883074092184" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="740" y="601.357142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.02153091249" font-weight="bold" fill="var(--primary-text)">Layer Norm + Output</text>

  <line x1="740" y1="143.571428571429" x2="740" y2="169.464285714286" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="740" y1="236.785714285714" x2="740" y2="255.428571428571" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="740" y1="301" x2="740" y2="324.821428571429" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="740" y1="381.785714285714" x2="740" y2="407.678571428571" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="740" y1="475" x2="740" y2="493.642857142857" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="740" y1="539.214285714286" x2="740" y2="563.035714285714" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M 1006.666666666667 117.678571428571 Q 1140 117.678571428571 1140 278.214285714286 Q 1140 278.214285714286 840 278.214285714286" stroke="var(--danger-border)" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="1240" y="200.535714285714" font-family="Arial, sans-serif" font-size="18.393839548429" font-weight="bold" fill="var(--danger-border)">residual</text>

  <path d="M 1006.666666666667 355.892857142857 Q 1140 355.892857142857 1140 516.428571428571 Q 1140 516.428571428571 840 516.428571428571" stroke="var(--danger-border)" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="1240" y="438.75" font-family="Arial, sans-serif" font-size="18.393839548429" font-weight="bold" fill="var(--danger-border)">residual</text>

  <text x="40" y="361.071428571429" font-family="Arial, sans-serif" font-size="19.707685230459" fill="var(--text-muted)">Attention sublayer</text>
  <text x="40" y="390.071428571429" font-family="Arial, sans-serif" font-size="17.079993866398" fill="var(--text-muted)">tokens mix info</text>
  <text x="40" y="452.214285714286" font-family="Arial, sans-serif" font-size="19.707685230459" fill="var(--text-muted)">MLP sublayer</text>
  <text x="40" y="481.214285714286" font-family="Arial, sans-serif" font-size="17.079993866398" fill="var(--text-muted)">per-token nonlinearity</text>
</svg>

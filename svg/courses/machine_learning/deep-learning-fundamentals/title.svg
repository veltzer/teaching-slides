<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="intro">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--code-bg)"/>
  <text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">Deep Learning Fundamentals</text>
  <text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">From perceptrons to transformers</text>

  <g transform="translate(140,290)">
    <circle cx="40" cy="40" r="16" fill="var(--primary-fill)" opacity="0.85"/>
    <circle cx="40" cy="120" r="16" fill="var(--primary-fill)" opacity="0.85"/>
    <circle cx="40" cy="200" r="16" fill="var(--primary-fill)" opacity="0.85"/>
    <circle cx="160" cy="20" r="16" fill="var(--warn-fill)" opacity="0.85"/>
    <circle cx="160" cy="90" r="16" fill="var(--warn-fill)" opacity="0.85"/>
    <circle cx="160" cy="160" r="16" fill="var(--warn-fill)" opacity="0.85"/>
    <circle cx="160" cy="230" r="16" fill="var(--warn-fill)" opacity="0.85"/>
    <circle cx="280" cy="40" r="16" fill="var(--info-fill)" opacity="0.85"/>
    <circle cx="280" cy="120" r="16" fill="var(--info-fill)" opacity="0.85"/>
    <circle cx="280" cy="200" r="16" fill="var(--info-fill)" opacity="0.85"/>
    <circle cx="400" cy="80" r="16" fill="var(--ok-fill)" opacity="0.85"/>
    <circle cx="400" cy="160" r="16" fill="var(--ok-fill)" opacity="0.85"/>
    <line x1="56" y1="40" x2="144" y2="20" stroke="var(--text-faint)" stroke-width="1" opacity="0.5"/>
    <line x1="56" y1="40" x2="144" y2="90" stroke="var(--text-faint)" stroke-width="1" opacity="0.5"/>
    <line x1="56" y1="40" x2="144" y2="160" stroke="var(--text-faint)" stroke-width="1" opacity="0.5"/>
    <line x1="56" y1="40" x2="144" y2="230" stroke="var(--text-faint)" stroke-width="1" opacity="0.5"/>
    <line x1="56" y1="120" x2="144" y2="20" stroke="var(--text-faint)" stroke-width="1" opacity="0.5"/>
    <line x1="56" y1="120" x2="144" y2="90" stroke="var(--text-faint)" stroke-width="1" opacity="0.5"/>
    <line x1="56" y1="120" x2="144" y2="160" stroke="var(--text-faint)" stroke-width="1" opacity="0.5"/>
    <line x1="56" y1="120" x2="144" y2="230" stroke="var(--text-faint)" stroke-width="1" opacity="0.5"/>
    <line x1="56" y1="200" x2="144" y2="20" stroke="var(--text-faint)" stroke-width="1" opacity="0.5"/>
    <line x1="56" y1="200" x2="144" y2="90" stroke="var(--text-faint)" stroke-width="1" opacity="0.5"/>
    <line x1="56" y1="200" x2="144" y2="160" stroke="var(--text-faint)" stroke-width="1" opacity="0.5"/>
    <line x1="56" y1="200" x2="144" y2="230" stroke="var(--text-faint)" stroke-width="1" opacity="0.5"/>
    <line x1="176" y1="20" x2="264" y2="40" stroke="var(--text-faint)" stroke-width="1" opacity="0.5"/>
    <line x1="176" y1="20" x2="264" y2="120" stroke="var(--text-faint)" stroke-width="1" opacity="0.5"/>
    <line x1="176" y1="20" x2="264" y2="200" stroke="var(--text-faint)" stroke-width="1" opacity="0.5"/>
    <line x1="176" y1="90" x2="264" y2="40" stroke="var(--text-faint)" stroke-width="1" opacity="0.5"/>
    <line x1="176" y1="90" x2="264" y2="120" stroke="var(--text-faint)" stroke-width="1" opacity="0.5"/>
    <line x1="176" y1="90" x2="264" y2="200" stroke="var(--text-faint)" stroke-width="1" opacity="0.5"/>
    <line x1="176" y1="160" x2="264" y2="40" stroke="var(--text-faint)" stroke-width="1" opacity="0.5"/>
    <line x1="176" y1="160" x2="264" y2="120" stroke="var(--text-faint)" stroke-width="1" opacity="0.5"/>
    <line x1="176" y1="160" x2="264" y2="200" stroke="var(--text-faint)" stroke-width="1" opacity="0.5"/>
    <line x1="176" y1="230" x2="264" y2="40" stroke="var(--text-faint)" stroke-width="1" opacity="0.5"/>
    <line x1="176" y1="230" x2="264" y2="120" stroke="var(--text-faint)" stroke-width="1" opacity="0.5"/>
    <line x1="176" y1="230" x2="264" y2="200" stroke="var(--text-faint)" stroke-width="1" opacity="0.5"/>
    <line x1="296" y1="40" x2="384" y2="80" stroke="var(--text-faint)" stroke-width="1" opacity="0.5"/>
    <line x1="296" y1="40" x2="384" y2="160" stroke="var(--text-faint)" stroke-width="1" opacity="0.5"/>
    <line x1="296" y1="120" x2="384" y2="80" stroke="var(--text-faint)" stroke-width="1" opacity="0.5"/>
    <line x1="296" y1="120" x2="384" y2="160" stroke="var(--text-faint)" stroke-width="1" opacity="0.5"/>
    <line x1="296" y1="200" x2="384" y2="80" stroke="var(--text-faint)" stroke-width="1" opacity="0.5"/>
    <line x1="296" y1="200" x2="384" y2="160" stroke="var(--text-faint)" stroke-width="1" opacity="0.5"/>
  </g>

  <g transform="translate(740,310)">
    <rect x="0" y="0" width="320" height="40" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="160" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">Foundations &amp; Frameworks</text>
    <rect x="0" y="50" width="320" height="40" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
    <text x="160" y="77" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--warn-text)">CNNs and RNNs</text>
    <rect x="0" y="100" width="320" height="40" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
    <text x="160" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--info-text)">Transformers</text>
    <rect x="0" y="150" width="320" height="40" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
    <text x="160" y="177" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--ok-text)">Transfer Learning</text>
    <rect x="0" y="200" width="320" height="40" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
    <text x="160" y="227" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--danger-text)">GANs and Diffusion</text>
  </g>
</svg>

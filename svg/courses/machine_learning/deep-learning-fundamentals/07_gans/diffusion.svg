<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="715" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="33.061713855711" font-weight="bold" fill="var(--text)">Diffusion Models</text>

  <rect x="40" y="162.692307692308" width="200" height="178.461538461538" rx="7.084652969081" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="257.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.615509896937" font-weight="bold" fill="var(--ok-text)">x_0</text>
  <text x="140" y="290.961538461538" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.350081433009" fill="var(--ok-text)">clean image</text>

  <rect x="290" y="162.692307692308" width="200" height="178.461538461538" rx="7.084652969081" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" opacity="0.75"/>
  <text x="390" y="257.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.615509896937" font-weight="bold" fill="var(--ok-text)">x_1</text>
  <text x="390" y="290.961538461538" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.350081433009" fill="var(--ok-text)">+ noise</text>

  <rect x="540" y="162.692307692308" width="200" height="178.461538461538" rx="7.084652969081" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" opacity="0.6"/>
  <text x="640" y="257.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.615509896937" font-weight="bold" fill="var(--primary-text)">x_2</text>
  <text x="640" y="290.961538461538" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.350081433009" fill="var(--primary-text)">noisier</text>

  <rect x="790" y="162.692307692308" width="200" height="178.461538461538" rx="7.084652969081" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" opacity="0.4"/>
  <text x="890" y="257.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.615509896937" font-weight="bold" fill="var(--primary-text)">...</text>

  <rect x="1040" y="162.692307692308" width="200" height="178.461538461538" rx="7.084652969081" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" opacity="0.3"/>
  <text x="1140" y="257.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.615509896937" font-weight="bold" fill="var(--info-text)">x_T</text>
  <text x="1140" y="290.961538461538" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.350081433009" fill="var(--info-text)">pure noise</text>

  <line x1="240" y1="229.615384615385" x2="290" y2="229.615384615385" stroke="var(--danger-border)" stroke-width="3" marker-end="url(#arrow-danger)"/>
  <line x1="490" y1="229.615384615385" x2="540" y2="229.615384615385" stroke="var(--danger-border)" stroke-width="3" marker-end="url(#arrow-danger)"/>
  <line x1="740" y1="229.615384615385" x2="790" y2="229.615384615385" stroke="var(--danger-border)" stroke-width="3" marker-end="url(#arrow-danger)"/>
  <line x1="990" y1="229.615384615385" x2="1040" y2="229.615384615385" stroke="var(--danger-border)" stroke-width="3" marker-end="url(#arrow-danger)"/>

  <text x="640" y="140.384615384615" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.892407917549" font-weight="bold" fill="var(--danger-border)">Forward: add noise (fixed)</text>

  <line x1="290" y1="408.076923076923" x2="240" y2="408.076923076923" stroke="var(--ok-border)" stroke-width="3" marker-end="url(#arrow-ok)"/>
  <line x1="540" y1="408.076923076923" x2="490" y2="408.076923076923" stroke="var(--ok-border)" stroke-width="3" marker-end="url(#arrow-ok)"/>
  <line x1="790" y1="408.076923076923" x2="740" y2="408.076923076923" stroke="var(--ok-border)" stroke-width="3" marker-end="url(#arrow-ok)"/>
  <line x1="1040" y1="408.076923076923" x2="990" y2="408.076923076923" stroke="var(--ok-border)" stroke-width="3" marker-end="url(#arrow-ok)"/>

  <text x="640" y="452.692307692308" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.892407917549" font-weight="bold" fill="var(--ok-border)">Reverse: denoise (learned)</text>

  <rect x="290" y="508.461538461538" width="950" height="111.538461538462" rx="7.084652969081" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="765" y="547.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.892407917549" fill="var(--text)">Train: predict the noise added at random timestep t</text>
  <text x="765" y="575.384615384615" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.892407917549" fill="var(--text)">Sample: start from pure noise, run reverse steps to get x_0</text>
  <text x="765" y="608.846153846154" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.530856927856" font-style="italic" fill="var(--text-muted)">Stable training, slow inference — basis of Stable Diffusion and friends</text>
</svg>

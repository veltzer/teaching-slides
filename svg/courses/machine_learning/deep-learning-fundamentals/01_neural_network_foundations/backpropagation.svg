<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="663.076923076923" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="32.722610390512" font-weight="bold" fill="var(--text)">Backpropagation</text>

  <rect x="40" y="193.877551020408" width="230.769230769231" height="142.040816326531" rx="7.011987940824" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="155.384615384615" y="253.061224489796" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.37329313608" font-weight="bold" fill="var(--primary-text)">Input</text>
  <text x="155.384615384615" y="294.489795918367" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.361305195256" fill="var(--primary-text)">x</text>

  <rect x="363.076923076923" y="193.877551020408" width="230.769230769231" height="142.040816326531" rx="7.011987940824" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="478.461538461538" y="253.061224489796" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.37329313608" font-weight="bold" fill="var(--primary-text)">Layer 1</text>
  <text x="478.461538461538" y="294.489795918367" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.361305195256" fill="var(--primary-text)">h1 = f(W1 x)</text>

  <rect x="686.153846153846" y="193.877551020408" width="230.769230769231" height="142.040816326531" rx="7.011987940824" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="801.538461538461" y="253.061224489796" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.37329313608" font-weight="bold" fill="var(--primary-text)">Layer 2</text>
  <text x="801.538461538461" y="294.489795918367" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.361305195256" fill="var(--primary-text)">y = g(W2 h1)</text>

  <rect x="1009.230769230769" y="193.877551020408" width="230.769230769231" height="142.040816326531" rx="7.011987940824" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1124.615384615385" y="253.061224489796" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.37329313608" font-weight="bold" fill="var(--danger-text)">Loss</text>
  <text x="1124.615384615385" y="294.489795918367" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.361305195256" fill="var(--danger-text)">L(y, target)</text>

  <line x1="270.769230769231" y1="241.224489795918" x2="363.076923076923" y2="241.224489795918" stroke="var(--primary-border)" stroke-width="3" marker-end="url(#arrow-primary)"/>
  <line x1="593.846153846154" y1="241.224489795918" x2="686.153846153846" y2="241.224489795918" stroke="var(--primary-border)" stroke-width="3" marker-end="url(#arrow-primary)"/>
  <line x1="916.923076923077" y1="241.224489795918" x2="1009.230769230769" y2="241.224489795918" stroke="var(--primary-border)" stroke-width="3" marker-end="url(#arrow-primary)"/>
  <text x="663.076923076923" y="170.204081632653" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.698634508864" font-weight="bold" fill="var(--primary-border)">Forward pass</text>

  <line x1="1009.230769230769" y1="406.938775510204" x2="916.923076923077" y2="406.938775510204" stroke="var(--danger-border)" stroke-width="3" marker-end="url(#arrow-danger)"/>
  <line x1="686.153846153846" y1="406.938775510204" x2="593.846153846154" y2="406.938775510204" stroke="var(--danger-border)" stroke-width="3" marker-end="url(#arrow-danger)"/>
  <line x1="363.076923076923" y1="406.938775510204" x2="270.769230769231" y2="406.938775510204" stroke="var(--danger-border)" stroke-width="3" marker-end="url(#arrow-danger)"/>
  <text x="663.076923076923" y="460.204081632653" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.698634508864" font-weight="bold" fill="var(--danger-border)">Backward pass: dL/dW computed via chain rule</text>

  <text x="663.076923076923" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.698634508864" fill="var(--text-muted)">Forward computes outputs; backward computes gradients of every weight.</text>
</svg>

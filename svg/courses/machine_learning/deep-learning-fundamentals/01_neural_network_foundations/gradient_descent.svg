<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.875417480775" font-weight="bold" fill="var(--text)">Gradient Descent</text>

  <path d="M 40 510.566037735849 Q 317.777777777778 72.830188679245 640 346.415094339623 T 1240 182.264150943396" stroke="var(--primary-border)" stroke-width="3" fill="none"/>

  <ellipse cx="151.111111111111" cy="433.962264150943" rx="15.555555555556" ry="15.320754716981" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <ellipse cx="284.444444444444" cy="313.584905660377" rx="15.555555555556" ry="15.320754716981" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <ellipse cx="440" cy="258.867924528302" rx="15.555555555556" ry="15.320754716981" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <ellipse cx="617.777777777778" cy="324.528301886792" rx="15.555555555556" ry="15.320754716981" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <ellipse cx="795.555555555556" cy="379.245283018868" rx="15.555555555556" ry="15.320754716981" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <ellipse cx="973.333333333333" cy="346.415094339623" rx="15.555555555556" ry="15.320754716981" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <ellipse cx="1128.888888888889" cy="269.811320754717" rx="15.555555555556" ry="15.320754716981" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>

  <line x1="151.111111111111" y1="433.962264150943" x2="284.444444444444" y2="313.584905660377" stroke="var(--danger-border)" stroke-width="2"/>
  <line x1="284.444444444444" y1="313.584905660377" x2="440" y2="258.867924528302" stroke="var(--danger-border)" stroke-width="2"/>
  <line x1="440" y1="258.867924528302" x2="617.777777777778" y2="324.528301886792" stroke="var(--danger-border)" stroke-width="2"/>
  <line x1="617.777777777778" y1="324.528301886792" x2="795.555555555556" y2="379.245283018868" stroke="var(--danger-border)" stroke-width="2"/>
  <line x1="795.555555555556" y1="379.245283018868" x2="973.333333333333" y2="346.415094339623" stroke="var(--danger-border)" stroke-width="2"/>
  <line x1="973.333333333333" y1="346.415094339623" x2="1128.888888888889" y2="269.811320754717" stroke="var(--danger-border)" stroke-width="2"/>

  <text x="151.111111111111" y="499.622641509434" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6430957033" fill="var(--text-muted)">start</text>
  <text x="1128.888888888889" y="226.037735849057" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6430957033" fill="var(--text-muted)">minimum</text>
  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6430957033" fill="var(--text-muted)">Each step moves opposite the local gradient. Step size controls speed and stability.</text>
</svg>

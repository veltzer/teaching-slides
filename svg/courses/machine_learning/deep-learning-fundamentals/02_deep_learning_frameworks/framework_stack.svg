<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="649.83606557377" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.223781065033" font-weight="bold" fill="var(--text)">The deep learning stack</text>

  <rect x="59.672131147541" y="86.607142857143" width="1180.327868852459" height="88.035714285714" rx="6.055945266258" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="649.83606557377" y="122.857142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.167835798775" font-weight="bold" fill="var(--ok-text)">Your code: model + training loop</text>
  <text x="649.83606557377" y="153.928571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.12121474356" font-style="italic" fill="var(--ok-text)">~ 200 lines of Python</text>

  <rect x="59.672131147541" y="190.178571428571" width="1180.327868852459" height="88.035714285714" rx="6.055945266258" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="649.83606557377" y="226.428571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.167835798775" font-weight="bold" fill="var(--primary-text)">High-level API: PyTorch Lightning, Keras, Hugging Face Transformers</text>
  <text x="649.83606557377" y="257.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.12121474356" font-style="italic" fill="var(--primary-text)">distributed, ckpts, mixed precision</text>

  <rect x="59.672131147541" y="293.75" width="1180.327868852459" height="88.035714285714" rx="6.055945266258" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="649.83606557377" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.167835798775" font-weight="bold" fill="var(--info-text)">Tensor + autograd: PyTorch, JAX, TensorFlow</text>
  <text x="649.83606557377" y="361.071428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.12121474356" font-style="italic" fill="var(--info-text)">n-dim arrays, autograd, accelerator dispatch</text>

  <rect x="59.672131147541" y="397.321428571429" width="1180.327868852459" height="88.035714285714" rx="6.055945266258" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="649.83606557377" y="433.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.167835798775" font-weight="bold" fill="var(--warn-text)">Kernel library: cuDNN, cuBLAS, MIOpen, oneDNN</text>
  <text x="649.83606557377" y="464.642857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.12121474356" font-style="italic" fill="var(--warn-text)">hand-tuned conv/matmul/attention per chip</text>

  <rect x="59.672131147541" y="500.892857142857" width="1180.327868852459" height="88.035714285714" rx="6.055945266258" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="649.83606557377" y="537.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.167835798775" font-weight="bold" fill="var(--danger-text)">Hardware: NVIDIA / AMD / TPU / NPU</text>
  <text x="649.83606557377" y="568.214285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.12121474356" font-style="italic" fill="var(--danger-text)">tensor cores, HBM, NVLink</text>

  <line x1="40" y1="86.607142857143" x2="40" y2="588.928571428572" stroke="var(--text-muted)" stroke-width="2"/>
  <text x="15" y="345" text-anchor="end" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text-muted)" transform="rotate(-90 15 345)">application → metal</text>

  <text x="649.83606557377" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.130538954603" font-style="italic" fill="var(--text-muted)">drop a layer only when you need that control</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="618.571428571429" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.907832626165" font-weight="bold" fill="var(--text)">The Frameworks Landscape</text>

  <rect x="40" y="130.980392156863" width="278.571428571429" height="227.450980392157" rx="6.623106991321" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="179.285714285714" y="182.156862745098" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.284725634844" font-weight="bold" fill="var(--warn-text)">TensorFlow</text>
  <text x="179.285714285714" y="227.647058823529" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.453916313083" fill="var(--warn-text)">Google</text>
  <text x="179.285714285714" y="261.764705882353" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.453916313083" fill="var(--warn-text)">Production focus</text>
  <text x="179.285714285714" y="295.882352941176" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.453916313083" fill="var(--warn-text)">TFLite, TF Serving</text>
  <text x="179.285714285714" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.453916313083" fill="var(--warn-text)">Mobile, edge, web</text>

  <rect x="382.857142857143" y="130.980392156863" width="278.571428571429" height="227.450980392157" rx="6.623106991321" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="522.142857142857" y="182.156862745098" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.284725634844" font-weight="bold" fill="var(--primary-text)">PyTorch</text>
  <text x="522.142857142857" y="227.647058823529" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.453916313083" fill="var(--primary-text)">Meta</text>
  <text x="522.142857142857" y="261.764705882353" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.453916313083" fill="var(--primary-text)">Research dominant</text>
  <text x="522.142857142857" y="295.882352941176" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.453916313083" fill="var(--primary-text)">Eager by default</text>
  <text x="522.142857142857" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.453916313083" fill="var(--primary-text)">Pythonic feel</text>

  <rect x="725.714285714286" y="130.980392156863" width="278.571428571429" height="227.450980392157" rx="6.623106991321" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="865" y="182.156862745098" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.284725634844" font-weight="bold" fill="var(--info-text)">JAX</text>
  <text x="865" y="227.647058823529" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.453916313083" fill="var(--info-text)">Google</text>
  <text x="865" y="261.764705882353" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.453916313083" fill="var(--info-text)">Functional, composable</text>
  <text x="865" y="295.882352941176" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.453916313083" fill="var(--info-text)">XLA compilation</text>
  <text x="865" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.453916313083" fill="var(--info-text)">TPU friendly</text>

  <rect x="1068.571428571429" y="130.980392156863" width="171.428571428571" height="227.450980392157" rx="6.623106991321" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1154.285714285714" y="182.156862745098" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.284725634844" font-weight="bold" fill="var(--ok-text)">Keras</text>
  <text x="1154.285714285714" y="227.647058823529" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.453916313083" fill="var(--ok-text)">High level</text>
  <text x="1154.285714285714" y="261.764705882353" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.453916313083" fill="var(--ok-text)">Multi-backend</text>
  <text x="1154.285714285714" y="295.882352941176" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.453916313083" fill="var(--ok-text)">Beginner friendly</text>

  <rect x="40" y="415.294117647059" width="1200" height="204.705882352941" rx="6.623106991321" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="460.78431372549" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.077023304404" font-weight="bold" fill="var(--text)">Shared building blocks</text>
  <text x="640" y="500.588235294118" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.557767478303" fill="var(--text)">Tensors, automatic differentiation, GPU acceleration, layers, optimizers</text>
  <text x="640" y="540.392156862745" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.557767478303" fill="var(--text)">APIs are converging: master one and the others come quickly</text>
  <text x="640" y="591.56862745098" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.557767478303" font-style="italic" fill="var(--text-muted)">Ecosystem and team preference often matter more than features</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
  </defs>

  <text x="40" y="40" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">A Kanban board with WIP limits</text>

  <!-- Backlog column -->
  <rect x="40" y="80" width="240" height="540" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="160" y="115" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Backlog</text>
  <text x="160" y="138" text-anchor="middle" font-size="12" fill="var(--text-muted)" font-family="Arial, sans-serif">no limit</text>
  <rect x="60" y="160" width="200" height="50" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="4" filter="url(#shadow)"/>
  <text x="160" y="190" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">add product detail page</text>
  <rect x="60" y="220" width="200" height="50" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="4" filter="url(#shadow)"/>
  <text x="160" y="250" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">checkout flow polish</text>
  <rect x="60" y="280" width="200" height="50" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="4" filter="url(#shadow)"/>
  <text x="160" y="310" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">password reset email</text>
  <rect x="60" y="340" width="200" height="50" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="4" filter="url(#shadow)"/>
  <text x="160" y="370" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">i18n &#8594; french</text>
  <rect x="60" y="400" width="200" height="50" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="4" filter="url(#shadow)"/>
  <text x="160" y="430" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">audit-log feature</text>

  <!-- To Do column -->
  <rect x="300" y="80" width="240" height="540" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="420" y="115" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">To Do</text>
  <text x="420" y="138" text-anchor="middle" font-size="12" fill="var(--text-muted)" font-family="Arial, sans-serif">WIP &#8804; 4</text>
  <rect x="320" y="160" width="200" height="50" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="4" filter="url(#shadow)"/>
  <text x="420" y="190" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">login rate-limit</text>
  <rect x="320" y="220" width="200" height="50" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="4" filter="url(#shadow)"/>
  <text x="420" y="250" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">cart abandon email</text>

  <!-- In Progress -->
  <rect x="560" y="80" width="240" height="540" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="680" y="115" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">In Progress</text>
  <text x="680" y="138" text-anchor="middle" font-size="12" fill="var(--text-muted)" font-family="Arial, sans-serif">WIP &#8804; 3</text>
  <rect x="580" y="160" width="200" height="50" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="4" filter="url(#shadow)"/>
  <text x="680" y="190" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">payment retry logic</text>
  <rect x="580" y="220" width="200" height="50" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="4" filter="url(#shadow)"/>
  <text x="680" y="250" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">search filter UI</text>
  <rect x="580" y="280" width="200" height="50" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="4" filter="url(#shadow)"/>
  <text x="680" y="310" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">migrate to PG 16</text>

  <!-- Review -->
  <rect x="820" y="80" width="200" height="540" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="920" y="115" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Review</text>
  <text x="920" y="138" text-anchor="middle" font-size="12" fill="var(--text-muted)" font-family="Arial, sans-serif">WIP &#8804; 2</text>
  <rect x="840" y="160" width="160" height="50" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="4" filter="url(#shadow)"/>
  <text x="920" y="190" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">SSO refactor</text>

  <!-- Done -->
  <rect x="1040" y="80" width="200" height="540" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="1140" y="115" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Done</text>
  <text x="1140" y="138" text-anchor="middle" font-size="12" fill="var(--text-muted)" font-family="Arial, sans-serif">this week</text>
  <rect x="1060" y="160" width="160" height="50" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="4" filter="url(#shadow)"/>
  <text x="1140" y="190" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">2FA recovery</text>
  <rect x="1060" y="220" width="160" height="50" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="4" filter="url(#shadow)"/>
  <text x="1140" y="250" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">webhook signing</text>
  <rect x="1060" y="280" width="160" height="50" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="4" filter="url(#shadow)"/>
  <text x="1140" y="310" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">image CDN cutover</text>
</svg>

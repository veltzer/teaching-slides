<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>

  <text x="40" y="40" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">A Kanban board with WIP limits</text>

  <!-- Backlog column -->
  <rect x="40" y="80" width="240" height="540" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="160" y="115" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Backlog</text>
  <text x="160" y="138" text-anchor="middle" font-size="12" fill="var(--text-muted)" font-family="Arial, sans-serif">no limit</text>
  <rect x="60" y="160" width="200" height="50" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="4"/>
  <text x="160" y="190" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">add product detail page</text>
  <rect x="60" y="220" width="200" height="50" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="4"/>
  <text x="160" y="250" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">checkout flow polish</text>
  <rect x="60" y="280" width="200" height="50" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="4"/>
  <text x="160" y="310" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">password reset email</text>
  <rect x="60" y="340" width="200" height="50" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="4"/>
  <text x="160" y="370" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">i18n → french</text>
  <rect x="60" y="400" width="200" height="50" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="4"/>
  <text x="160" y="430" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">audit-log feature</text>

  <!-- To Do column -->
  <rect x="300" y="80" width="240" height="540" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="420" y="115" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">To Do</text>
  <text x="420" y="138" text-anchor="middle" font-size="12" fill="var(--text-muted)" font-family="Arial, sans-serif">WIP ≤ 4</text>
  <rect x="320" y="160" width="200" height="50" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="4"/>
  <text x="420" y="190" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">login rate-limit</text>
  <rect x="320" y="220" width="200" height="50" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="4"/>
  <text x="420" y="250" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">cart abandon email</text>

  <!-- In Progress -->
  <rect x="560" y="80" width="240" height="540" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="680" y="115" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">In Progress</text>
  <text x="680" y="138" text-anchor="middle" font-size="12" fill="var(--text-muted)" font-family="Arial, sans-serif">WIP ≤ 3</text>
  <rect x="580" y="160" width="200" height="50" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="4"/>
  <text x="680" y="190" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">payment retry logic</text>
  <rect x="580" y="220" width="200" height="50" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="4"/>
  <text x="680" y="250" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">search filter UI</text>
  <rect x="580" y="280" width="200" height="50" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="4"/>
  <text x="680" y="310" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">migrate to PG 16</text>

  <!-- Review -->
  <rect x="820" y="80" width="200" height="540" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="920" y="115" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Review</text>
  <text x="920" y="138" text-anchor="middle" font-size="12" fill="var(--text-muted)" font-family="Arial, sans-serif">WIP ≤ 2</text>
  <rect x="840" y="160" width="160" height="50" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="4"/>
  <text x="920" y="190" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">SSO refactor</text>

  <!-- Done -->
  <rect x="1040" y="80" width="200" height="540" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="1140" y="115" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Done</text>
  <text x="1140" y="138" text-anchor="middle" font-size="12" fill="var(--text-muted)" font-family="Arial, sans-serif">this week</text>
  <rect x="1060" y="160" width="160" height="50" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="4"/>
  <text x="1140" y="190" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">2FA recovery</text>
  <rect x="1060" y="220" width="160" height="50" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="4"/>
  <text x="1140" y="250" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">webhook signing</text>
  <rect x="1060" y="280" width="160" height="50" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="4"/>
  <text x="1140" y="310" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">image CDN cutover</text>
</svg>

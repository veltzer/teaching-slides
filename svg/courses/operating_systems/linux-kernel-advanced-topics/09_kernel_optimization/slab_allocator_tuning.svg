<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="174" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="639.9999" y="141.5" text-anchor="middle" font-size="36.269" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">SLAB Cache</text>
  <rect x="87.9999" y="98" width="144" height="87" fill="url(#grad-primary)" stroke="var(--primary-border)" rx="6" stroke-width="2"/>
  <rect x="256" y="98" width="144" height="87" fill="url(#grad-primary)" stroke="var(--primary-border)" rx="6" stroke-width="2"/>
  <rect x="424" y="98" width="144" height="87" fill="url(#grad-ok)" stroke="var(--ok-border)" rx="6" stroke-width="2"/>
  <rect x="591.9999" y="98" width="144" height="87" fill="url(#grad-primary)" stroke="var(--primary-border)" rx="6" stroke-width="2"/>
  <rect x="760" y="98" width="144" height="87" fill="url(#grad-ok)" stroke="var(--ok-border)" rx="6" stroke-width="2"/>
  <rect x="927.9999" y="98" width="144" height="87" fill="url(#grad-ok)" stroke="var(--ok-border)" rx="6" stroke-width="2"/>
  <rect x="1095.9999" y="98" width="144" height="87" fill="url(#grad-danger)" stroke="var(--danger-border)" rx="6" stroke-width="2"/>
  <text x="159.9999" y="156.0001" text-anchor="middle" font-size="31.0877" font-family="Arial, sans-serif" fill="var(--primary-text)">Used</text>
  <text x="496" y="156.0001" text-anchor="middle" font-size="31.0877" font-family="Arial, sans-serif" fill="var(--ok-text)">Free</text>
  <text x="1167.9999" y="156.0001" text-anchor="middle" font-size="31.0877" font-family="Arial, sans-serif" fill="var(--danger-text)">Partial</text>
  <rect x="159.9999" y="417" width="288" height="116" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="303.9999" y="489.5" text-anchor="middle" font-size="36.269" font-family="Arial, sans-serif" fill="var(--primary-text)">SLUB</text>
  <rect x="496" y="417" width="288" height="116" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="639.9999" y="489.5" text-anchor="middle" font-size="36.269" font-family="Arial, sans-serif" fill="var(--ok-text)">SLAB</text>
  <rect x="832" y="417" width="288" height="116" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6"/>
  <text x="976" y="489.5" text-anchor="middle" font-size="36.269" font-family="Arial, sans-serif" fill="var(--warn-text)">SLOB</text>
  <text x="303.9999" y="620" text-anchor="middle" font-size="31.0877" font-family="Arial, sans-serif" fill="var(--text)">Default</text>
  <text x="639.9999" y="620" text-anchor="middle" font-size="31.0877" font-family="Arial, sans-serif" fill="var(--text)">Cache-friendly</text>
  <text x="976" y="620" text-anchor="middle" font-size="31.0877" font-family="Arial, sans-serif" fill="var(--text)">Minimal</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="28.753498" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Optimization Trade-offs: Pick Two</text>
  <rect x="40" y="71.636364" width="385" height="442.909091" rx="6.161464" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="232" y="145.454545" text-anchor="middle" font-size="32.86114" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Speed</text>
  <text x="232" y="219.272727" text-anchor="middle" font-size="20.538213" fill="var(--danger-text)" font-family="Arial, sans-serif">Fast hot paths</text>
  <text x="232" y="282.545455" text-anchor="middle" font-size="18.484391" fill="var(--danger-text)" font-family="Arial, sans-serif">low latency</text>
  <text x="232" y="388" text-anchor="middle" font-size="16.43057" fill="var(--danger-text)" font-family="Arial, sans-serif">inline, prefetch, cache</text>
  <rect x="445" y="71.636364" width="385" height="442.909091" rx="6.161464" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="637" y="145.454545" text-anchor="middle" font-size="32.86114" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Size</text>
  <text x="637" y="219.272727" text-anchor="middle" font-size="20.538213" fill="var(--ok-text)" font-family="Arial, sans-serif">Small footprint</text>
  <text x="637" y="282.545455" text-anchor="middle" font-size="18.484391" fill="var(--ok-text)" font-family="Arial, sans-serif">fits in cache or ROM</text>
  <text x="637" y="388" text-anchor="middle" font-size="16.43057" fill="var(--ok-text)" font-family="Arial, sans-serif">tight loops, shared code</text>
  <rect x="850" y="71.636364" width="385" height="442.909091" rx="6.161464" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1042" y="145.454545" text-anchor="middle" font-size="32.86114" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Features</text>
  <text x="1042" y="219.272727" text-anchor="middle" font-size="20.538213" fill="var(--primary-text)" font-family="Arial, sans-serif">Rich capability</text>
  <text x="1042" y="282.545455" text-anchor="middle" font-size="18.484391" fill="var(--primary-text)" font-family="Arial, sans-serif">many knobs, options</text>
  <text x="1042" y="388" text-anchor="middle" font-size="16.43057" fill="var(--primary-text)" font-family="Arial, sans-serif">more branches, more code</text>
  <rect x="40" y="535.636364" width="1200" height="84.363636" rx="6.161464" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="572.545455" text-anchor="middle" font-size="18.484391" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Choose any two. Optimising one axis almost always costs another.</text>
  <text x="640" y="604.181818" text-anchor="middle" font-size="15.40366" fill="var(--text-muted)" font-family="Arial, sans-serif">Inlining grows code size; features add branches; compact code slows hot paths.</text>
</svg>

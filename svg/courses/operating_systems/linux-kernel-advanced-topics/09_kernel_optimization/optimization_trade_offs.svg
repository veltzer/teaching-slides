<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="70" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--text)">Optimization Trade-offs: Pick Two</text>
  <rect x="40" y="100" width="385" height="420" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="232" y="170" text-anchor="middle" font-size="32" font-weight="bold" fill="var(--danger-text)">Speed</text>
  <text x="232" y="240" text-anchor="middle" font-size="20" fill="var(--danger-text)">Fast hot paths</text>
  <text x="232" y="300" text-anchor="middle" font-size="18" fill="var(--danger-text)">low latency</text>
  <text x="232" y="400" text-anchor="middle" font-size="16" fill="var(--danger-text)">inline, prefetch, cache</text>
  <rect x="445" y="100" width="385" height="420" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="637" y="170" text-anchor="middle" font-size="32" font-weight="bold" fill="var(--ok-text)">Size</text>
  <text x="637" y="240" text-anchor="middle" font-size="20" fill="var(--ok-text)">Small footprint</text>
  <text x="637" y="300" text-anchor="middle" font-size="18" fill="var(--ok-text)">fits in cache or ROM</text>
  <text x="637" y="400" text-anchor="middle" font-size="16" fill="var(--ok-text)">tight loops, shared code</text>
  <rect x="850" y="100" width="385" height="420" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1042" y="170" text-anchor="middle" font-size="32" font-weight="bold" fill="var(--primary-text)">Features</text>
  <text x="1042" y="240" text-anchor="middle" font-size="20" fill="var(--primary-text)">Rich capability</text>
  <text x="1042" y="300" text-anchor="middle" font-size="18" fill="var(--primary-text)">many knobs, options</text>
  <text x="1042" y="400" text-anchor="middle" font-size="16" fill="var(--primary-text)">more branches, more code</text>
  <rect x="40" y="540" width="1200" height="80" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="575" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)">Choose any two. Optimising one axis almost always costs another.</text>
  <text x="640" y="605" text-anchor="middle" font-size="15" fill="var(--text-muted)">Inlining grows code size; features add branches; compact code slows hot paths.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="300.8695" y="40" width="782.6087" height="99.9999" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="692.1739" y="100.0002" text-anchor="middle" font-size="33.5702" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Kconfig (menuconfig)</text>
  <rect x="40" y="199.9999" width="365.2175" height="99.9999" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="222.6086" y="260.0001" text-anchor="middle" font-size="29.3738" font-family="Arial, sans-serif" fill="var(--info-text)">Toolchain</text>
  <rect x="457.3913" y="199.9999" width="365.2175" height="99.9999" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="260.0001" text-anchor="middle" font-size="29.3738" font-family="Arial, sans-serif" fill="var(--ok-text)">Packages</text>
  <rect x="874.7825" y="199.9999" width="365.2175" height="99.9999" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1057.3914" y="260.0001" text-anchor="middle" font-size="29.3738" font-family="Arial, sans-serif" fill="var(--warn-text)">Filesystem</text>
  <rect x="300.8695" y="360.0002" width="782.6087" height="99.9999" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="692.1739" y="420" text-anchor="middle" font-size="33.5702" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Make</text>
  <rect x="300.8695" y="520.0001" width="782.6087" height="99.9999" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="692.1739" y="579.9997" text-anchor="middle" font-size="33.5702" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Output Images</text>
  <path d="M 692.1739 140.0001 L 222.6086 199.9999" stroke="var(--text-muted)" stroke-width="1.0753" marker-end="url(#arrow)"/>
  <path d="M 692.1739 140.0001 L 639.9999 199.9999" stroke="var(--text-muted)" stroke-width="1.0753" marker-end="url(#arrow)"/>
  <path d="M 692.1739 140.0001 L 1057.3914 199.9999" stroke="var(--text-muted)" stroke-width="1.0753" marker-end="url(#arrow)"/>
  <path d="M 222.6086 300 L 639.9999 360.0002" stroke="var(--text-muted)" stroke-width="1.0753" marker-end="url(#arrow)"/>
  <path d="M 639.9999 300 L 692.1739 360.0002" stroke="var(--text-muted)" stroke-width="1.0753" marker-end="url(#arrow)"/>
  <path d="M 1057.3914 300 L 744.3479 360.0002" stroke="var(--text-muted)" stroke-width="1.0753" marker-end="url(#arrow)"/>
  <path d="M 692.1739 459.9999 L 692.1739 520.0001" stroke="var(--text-muted)" stroke-width="1.0753" marker-end="url(#arrow)"/>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="54" text-anchor="middle" font-weight="bold">Typical Boot Timeline</text>
  <rect x="80" y="144" width="128" height="108" fill="#FFE6E6" stroke="black" />
  <text x="144" y="207" text-anchor="middle">Power On</text>
  <rect x="240" y="144" width="160" height="108" fill="#E6F2FF" stroke="black" />
  <text x="320" y="207" text-anchor="middle">Bootloader</text>
  <rect x="432" y="144" width="192" height="108" fill="#E6FFE6" stroke="black" />
  <text x="528" y="207" text-anchor="middle">Kernel Init</text>
  <rect x="656" y="144" width="160" height="108" fill="#FFFFE6" stroke="black" />
  <text x="736" y="207" text-anchor="middle">Drivers</text>
  <rect x="848" y="144" width="160" height="108" fill="#FFE6FF" stroke="black" />
  <text x="928" y="207" text-anchor="middle">Userspace</text>
  <rect x="1040" y="144" width="160" height="108" fill="#E6E6E6" stroke="black" />
  <text x="1120" y="207" text-anchor="middle">Application</text>
  <text x="144" y="324">0ms</text>
  <text x="320" y="324">100ms</text>
  <text x="528" y="324">500ms</text>
  <text x="736" y="324">800ms</text>
  <text x="928" y="324">1200ms</text>
  <text x="1120" y="324">1500ms</text>
  <line x1="80" y1="360" x2="1200" y2="360" stroke="black" />
  <text x="640" y="432" text-anchor="middle">Time →</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Typical Boot Timeline</text>
  <rect x="40" y="178.0952" width="137.1429" height="165.7143" fill="url(#grad-danger)" stroke="var(--danger-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <text x="108.5714" y="274.7619" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--danger-text)">Power On</text>
  <rect x="211.4286" y="178.0952" width="171.4286" height="165.7143" fill="url(#grad-primary)" stroke="var(--primary-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <text x="297.1429" y="274.7619" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--primary-text)">Bootloader</text>
  <rect x="417.1429" y="178.0952" width="205.7143" height="165.7143" fill="url(#grad-ok)" stroke="var(--ok-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <text x="520" y="274.7619" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--ok-text)">Kernel Init</text>
  <rect x="657.1429" y="178.0952" width="171.4286" height="165.7143" fill="url(#grad-warn)" stroke="var(--warn-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <text x="742.8571" y="274.7619" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--warn-text)">Drivers</text>
  <rect x="862.8571" y="178.0952" width="171.4286" height="165.7143" fill="url(#grad-info)" stroke="var(--info-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <text x="948.5714" y="274.7619" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--info-text)">Userspace</text>
  <rect x="1068.5714" y="178.0952" width="171.4286" height="165.7143" fill="var(--border)" stroke="var(--black)" rx="6"/>
  <text x="1154.2857" y="274.7619" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--text)">Application</text>
  <text x="108.5714" y="454.2857" font-family="Arial, sans-serif" fill="var(--text)">0ms</text>
  <text x="297.1429" y="454.2857" font-family="Arial, sans-serif" fill="var(--text)">100ms</text>
  <text x="520" y="454.2857" font-family="Arial, sans-serif" fill="var(--text)">500ms</text>
  <text x="742.8571" y="454.2857" font-family="Arial, sans-serif" fill="var(--text)">800ms</text>
  <text x="948.5714" y="454.2857" font-family="Arial, sans-serif" fill="var(--text)">1200ms</text>
  <text x="1154.2857" y="454.2857" font-family="Arial, sans-serif" fill="var(--text)">1500ms</text>
  <line x1="40" y1="509.5238" x2="1240" y2="509.5238" stroke="var(--black)"/>
  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--text)">Time →</text>
</svg>

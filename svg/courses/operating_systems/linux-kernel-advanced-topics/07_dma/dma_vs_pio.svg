<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="54" text-anchor="middle" font-weight="bold">PIO vs DMA Transfer</text>
  <g id="pio">
    <text x="320" y="126">PIO:</text>
    <rect x="160" y="162" width="128" height="108" fill="#FFE6E6" stroke="black" />
    <text x="224" y="225" text-anchor="middle">CPU</text>
    <rect x="160" y="360" width="128" height="108" fill="#E6F2FF" stroke="black" />
    <text x="224" y="423" text-anchor="middle">Memory</text>
    <rect x="400" y="360" width="128" height="108" fill="#E6FFE6" stroke="black" />
    <text x="464" y="423" text-anchor="middle">Device</text>
    <line x1="224" y1="270" x2="224" y2="360" stroke="red" stroke-width="3.2" marker-end="url(#redarrow)" />
    <line x1="224" y1="270" x2="464" y2="360" stroke="red" stroke-width="3.2" marker-end="url(#redarrow)" />
  </g>
  <g id="dma">
    <text x="800" y="126">DMA:</text>
    <rect x="720" y="162" width="128" height="108" fill="#FFE6E6" stroke="black" />
    <text x="784" y="225" text-anchor="middle">CPU</text>
    <rect x="640" y="360" width="128" height="108" fill="#E6F2FF" stroke="black" />
    <text x="704" y="423" text-anchor="middle">Memory</text>
    <rect x="880" y="360" width="128" height="108" fill="#E6FFE6" stroke="black" />
    <text x="944" y="423" text-anchor="middle">Device</text>
    <line x1="768" y1="414" x2="880" y2="414" stroke="green" stroke-width="4.8" marker-end="url(#greenarrow)" />
    <text x="784" y="306" fill="gray">CPU Idle</text>
  </g>
  <defs>
    <marker id="redarrow" markerWidth="16" markerHeight="18" refX="14.4" refY="5.4" orient="auto">
      <polygon points="0,18 4.8,0" fill="red" />
    </marker>
    <marker id="greenarrow" markerWidth="16" markerHeight="18" refX="14.4" refY="5.4" orient="auto">
      <polygon points="0,18 4.8,0" fill="green" />
    </marker>
  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="719.2453" y="40" text-anchor="middle" font-weight="bold">PIO vs DMA Transfer</text>
  <g id="pio">
    <text x="266.4151" y="140.8695">PIO:</text>
    <rect x="40" y="191.3044" width="181.1321" height="151.3044" fill="var(--danger-fill)" stroke="var(--danger-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
    <text x="130.5661" y="279.5652" text-anchor="middle">CPU</text>
    <rect x="40" y="468.6956" width="181.1321" height="151.3044" fill="var(--primary-fill)" stroke="var(--primary-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
    <text x="130.5661" y="556.9566" text-anchor="middle">Memory</text>
    <rect x="379.6227" y="468.6956" width="181.1321" height="151.3044" fill="var(--ok-fill)" stroke="var(--ok-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
    <text x="470.1887" y="556.9566" text-anchor="middle">Device</text>
    <line x1="130.5661" y1="342.6087" x2="130.5661" y2="468.6956" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#redarrow)" />
    <line x1="130.5661" y1="342.6087" x2="470.1887" y2="468.6956" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#redarrow)" />
  </g>
  <g id="dma">
    <text x="945.6604" y="140.8695">DMA:</text>
    <rect x="832.4528" y="191.3044" width="181.1321" height="151.3044" fill="var(--danger-fill)" stroke="var(--danger-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
    <text x="923.0189" y="279.5652" text-anchor="middle">CPU</text>
    <rect x="719.2453" y="468.6956" width="181.1321" height="151.3044" fill="var(--primary-fill)" stroke="var(--primary-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
    <text x="809.8113" y="556.9566" text-anchor="middle">Memory</text>
    <rect x="1058.8679" y="468.6956" width="181.1321" height="151.3044" fill="var(--ok-fill)" stroke="var(--ok-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
    <text x="1149.4339" y="556.9566" text-anchor="middle">Device</text>
    <line x1="900.3773" y1="544.3478" x2="1058.8679" y2="544.3478" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#greenarrow)" />
    <text x="923.0189" y="393.0434" fill="var(--text-faint)">CPU Idle</text>
  </g>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="redarrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.8,0" fill="red" />
    </marker>
    <marker id="greenarrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.8,0" fill="green" />
    </marker>
  </defs>
</svg>
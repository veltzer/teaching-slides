<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="707.6329" y="80" text-anchor="middle" font-weight="bold">PIO vs DMA Transfer</text>
  <g id="pio">
    <text x="321.1594" y="166.9565">PIO:</text>
    <rect x="127.9227" y="210.4348" width="154.5894" height="130.4348" fill="var(--danger-fill)" stroke="var(--danger-border)" rx="7.2464" stroke-width="2"/>
    <text x="205.2174" y="286.5217" text-anchor="middle">CPU</text>
    <rect x="127.9227" y="449.5652" width="154.5894" height="130.4348" fill="var(--primary-fill)" stroke="var(--primary-border)" rx="7.2464" stroke-width="2"/>
    <text x="205.2174" y="525.6522" text-anchor="middle">Memory</text>
    <rect x="417.7778" y="449.5652" width="154.5894" height="130.4348" fill="var(--ok-fill)" stroke="var(--ok-border)" rx="7.2464" stroke-width="2"/>
    <text x="495.0725" y="525.6522" text-anchor="middle">Device</text>
    <line x1="205.2174" y1="340.8696" x2="205.2174" y2="449.5652" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#redarrow)" />
    <line x1="205.2174" y1="340.8696" x2="495.0725" y2="449.5652" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#redarrow)" />
  </g>
  <g id="dma">
    <text x="900.8696" y="166.9565">DMA:</text>
    <rect x="804.2512" y="210.4348" width="154.5894" height="130.4348" fill="var(--danger-fill)" stroke="var(--danger-border)" rx="7.2464" stroke-width="2"/>
    <text x="881.5459" y="286.5217" text-anchor="middle">CPU</text>
    <rect x="707.6329" y="449.5652" width="154.5894" height="130.4348" fill="var(--primary-fill)" stroke="var(--primary-border)" rx="7.2464" stroke-width="2"/>
    <text x="784.9275" y="525.6522" text-anchor="middle">Memory</text>
    <rect x="997.4879" y="449.5652" width="154.5894" height="130.4348" fill="var(--ok-fill)" stroke="var(--ok-border)" rx="7.2464" stroke-width="2"/>
    <text x="1074.7826" y="525.6522" text-anchor="middle">Device</text>
    <line x1="862.2222" y1="514.7826" x2="997.4879" y2="514.7826" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#greenarrow)" />
    <text x="881.5459" y="384.3478" fill="var(--text-faint)">CPU Idle</text>
  </g>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="redarrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.8,0" fill="red" />
    </marker>
    <marker id="greenarrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.8,0" fill="green" />
    </marker>
  </defs>
</svg>
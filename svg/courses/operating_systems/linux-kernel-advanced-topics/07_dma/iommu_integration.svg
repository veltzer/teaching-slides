<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="360" height="320" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="var(--danger-text)">Device</text>
  <text x="220" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--danger-text)">NIC / GPU / NVMe</text>
  <text x="220" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">Issues DMA with</text>
  <text x="220" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">I/O virtual addresses</text>
  <text x="220" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">cannot see real RAM</text>

  <rect x="460" y="40" width="360" height="320" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="var(--primary-text)">IOMMU</text>
  <text x="640" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">Intel VT-d / AMD-Vi</text>
  <text x="640" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Translates IOVA to PA</text>
  <text x="640" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Enforces per-device</text>
  <text x="640" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">page permissions</text>
  <text x="640" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">page tables + IOTLB</text>

  <rect x="880" y="40" width="360" height="320" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1060" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="var(--ok-text)">Memory</text>
  <text x="1060" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--ok-text)">System RAM</text>
  <text x="1060" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Physical frames</text>
  <text x="1060" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">allocated by kernel</text>
  <text x="1060" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">protected from stray DMA</text>

  <line x1="400" y1="200" x2="458" y2="200" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="820" y1="200" x2="878" y2="200" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <text x="429" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">IOVA</text>
  <text x="849" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">PA</text>

  <rect x="40" y="400" width="390" height="220" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="235" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Why it exists</text>
  <text x="235" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">Isolates buggy or</text>
  <text x="235" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">malicious devices.</text>
  <text x="235" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">Enables safe passthrough</text>
  <text x="235" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">to virtual machines.</text>
  <text x="235" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">VFIO, DPDK, SR-IOV build on it</text>

  <rect x="445" y="400" width="390" height="220" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Kernel API</text>
  <text x="640" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">dma_map_single / _sg</text>
  <text x="640" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">returns a dma_addr_t</text>
  <text x="640" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">Drivers never touch IOVA;</text>
  <text x="640" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">DMA API hides IOMMU setup.</text>

  <rect x="850" y="400" width="390" height="220" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1045" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Cost</text>
  <text x="1045" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">IOTLB miss = walk</text>
  <text x="1045" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">page tables.</text>
  <text x="1045" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">Batch mappings; use</text>
  <text x="1045" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">hugepages where possible.</text>
</svg>

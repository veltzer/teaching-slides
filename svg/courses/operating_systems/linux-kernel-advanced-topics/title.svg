<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <circle cx="640" cy="315.5" r="194.6621" fill="none" stroke="var(--warn-border)" stroke-width="4.2667" opacity="0.3" />
  <circle cx="640" cy="315.5" r="139.0443" fill="none" stroke="var(--danger-border)" stroke-width="4.2667" opacity="0.4" />
  <circle cx="640" cy="315.5" r="83.4266" fill="none" stroke="var(--ok-border)" stroke-width="4.2667" opacity="0.5" />
  <circle cx="640" cy="315.5" r="34.7611" fill="var(--ok-fill)" opacity="0.4" />
  <text x="640" y="322.75" text-anchor="middle" font-size="15.2948" fill="var(--ok-accent)" opacity="0.8" font-family="Courier New, monospace">kernel</text>
  <text x="640" y="214" text-anchor="middle" font-size="13.9044" fill="var(--danger-accent)" opacity="0.6" font-family="Courier New, monospace">drivers</text>
  <text x="640" y="156" text-anchor="middle" font-size="13.9044" fill="var(--warn-accent)" opacity="0.5" font-family="Courier New, monospace">userspace</text>
  <ellipse cx="220" cy="272" rx="52.5" ry="58" fill="var(--text)" stroke="var(--surface)" stroke-width="2.8444" opacity="0.7" />
  <circle cx="220" cy="221.25" r="30.5898" fill="var(--text)" stroke="var(--surface)" stroke-width="2.8444" opacity="0.7" />
  <circle cx="208" cy="214" r="5.5618" fill="var(--bg)" />
  <circle cx="231.9999" cy="214" r="5.5618" fill="var(--bg)" />
  <polygon points="220,225.6 212.5,240.1 227.5,240.1" fill="var(--warn-fill)" opacity="0.8" />
  <ellipse cx="190" cy="301" rx="18" ry="7.7333" fill="var(--warn-fill)" opacity="0.6" />
  <ellipse cx="250" cy="301" rx="18" ry="7.7333" fill="var(--warn-fill)" opacity="0.6" />
  <rect x="970" y="214" width="120" height="116" rx="6" fill="var(--text)" stroke="var(--primary-border)" stroke-width="2.8444" opacity="0.6" />
  <rect x="1000" y="243" width="60" height="58" rx="6" fill="url(#grad-primary)" opacity="0.3" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <line x1="970" y1="250.25" x2="947.4999" y2="250.25" stroke="var(--primary-border)" stroke-width="2" opacity="0.5" />
  <line x1="970" y1="272" x2="947.4999" y2="272" stroke="var(--primary-border)" stroke-width="2" opacity="0.5" />
  <line x1="970" y1="293.75" x2="947.4999" y2="293.75" stroke="var(--primary-border)" stroke-width="2" opacity="0.5" />
  <line x1="1090" y1="250.25" x2="1112.5" y2="250.25" stroke="var(--primary-border)" stroke-width="2" opacity="0.5" />
  <line x1="1090" y1="272" x2="1112.5" y2="272" stroke="var(--primary-border)" stroke-width="2" opacity="0.5" />
  <line x1="1090" y1="293.75" x2="1112.5" y2="293.75" stroke="var(--primary-border)" stroke-width="2" opacity="0.5" />
  <line x1="1007.4999" y1="214" x2="1007.4999" y2="192.25" stroke="var(--primary-border)" stroke-width="2" opacity="0.5" />
  <line x1="1030" y1="214" x2="1030" y2="192.25" stroke="var(--primary-border)" stroke-width="2" opacity="0.5" />
  <line x1="1052.5" y1="214" x2="1052.5" y2="192.25" stroke="var(--primary-border)" stroke-width="2" opacity="0.5" />
  <line x1="1007.4999" y1="330" x2="1007.4999" y2="351.75" stroke="var(--primary-border)" stroke-width="2" opacity="0.5" />
  <line x1="1030" y1="330" x2="1030" y2="351.75" stroke="var(--primary-border)" stroke-width="2" opacity="0.5" />
  <line x1="1052.5" y1="330" x2="1052.5" y2="351.75" stroke="var(--primary-border)" stroke-width="2" opacity="0.5" />
  <rect x="970" y="402.5" width="120" height="29" rx="6" fill="url(#grad-info)" opacity="0.3" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="970" y="438.75" width="120" height="29" rx="6" fill="url(#grad-info)" opacity="0.4" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="970" y="475" width="120" height="29" rx="6" fill="url(#grad-info)" opacity="0.5" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="591" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.028" fill="var(--border)" letter-spacing="3">LINUX KERNEL ADVANCED TOPICS</text>
</svg>
  <rect x="881.7778" y="440" width="113.7778" height="32" rx="6" fill="var(--info-fill)" opacity="0.4" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="881.7778" y="480" width="113.7778" height="32" rx="6" fill="var(--info-fill)" opacity="0.5" stroke="var(--info-border)" stroke-width="2"/>
  <text x="568.8889" y="608" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.6" fill="var(--border)" letter-spacing="3">LINUX KERNEL ADVANCED TOPICS</text>

  <rect x="910.2222" y="224" width="56.8889" height="64" rx="6" fill="var(--primary-fill)" opacity="0.3" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="881.7778" y1="232" x2="860.4444" y2="232" stroke="var(--primary-border)" stroke-width="2" opacity="0.5" />

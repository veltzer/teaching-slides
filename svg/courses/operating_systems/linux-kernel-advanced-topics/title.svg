  <line x1="995.5556" y1="280" x2="1016.8889" y2="280" stroke="var(--primary-border)" stroke-width="2" opacity="0.5" />
  <line x1="917.3333" y1="192" x2="917.3333" y2="168" stroke="var(--primary-border)" stroke-width="2" opacity="0.5" />

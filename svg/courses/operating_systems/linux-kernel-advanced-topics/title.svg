  <line x1="700" y1="175" x2="715" y2="175" stroke="#74c0fc" stroke-width="2" opacity="0.5"/>
  <line x1="645" y1="120" x2="645" y2="105" stroke="#74c0fc" stroke-width="2" opacity="0.5"/>
  <line x1="660" y1="120" x2="660" y2="105" stroke="#74c0fc" stroke-width="2" opacity="0.5"/>
  <line x1="675" y1="120" x2="675" y2="105" stroke="#74c0fc" stroke-width="2" opacity="0.5"/>

  <text x="737.255824" y="374.0827" text-anchor="middle">Memory</text>
  <rect x="1077.523458" y="278.927" width="162.476542" height="162.476" rx="14.000023" fill="var(--ok-fill)" stroke="var(--black)" filter="url(#shadow)"/>
  <text x="1158.765829" y="374.0827" text-anchor="middle">Chosen</text>
  <rect x="40" y="490.019" width="129.981433" height="129.981" rx="14.000023" fill="var(--warn-fill)" stroke="var(--black)" filter="url(#shadow)"/>
  <text x="104.990717" y="568.9271" text-anchor="middle">UART</text>
  <rect x="250.755703" y="490.019" width="129.981433" height="129.981" rx="14.000023" fill="var(--warn-fill)" stroke="var(--black)" filter="url(#shadow)"/>
  <text x="315.745919" y="568.9271" text-anchor="middle">I2C</text>
  <rect x="461.510405" y="490.019" width="129.981433" height="129.981" rx="14.000023" fill="var(--warn-fill)" stroke="var(--black)" filter="url(#shadow)"/>
  <text x="526.500722" y="568.9271" text-anchor="middle">SPI</text>

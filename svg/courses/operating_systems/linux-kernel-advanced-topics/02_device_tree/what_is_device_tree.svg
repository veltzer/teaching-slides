<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="639.769999" y="40" width="194.97165" height="194.971" rx="14.000023" fill="url(#grad-primary)" stroke="var(--black)" filter="url(#shadow)"/>
  <text x="737.255824" y="151.4033" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Root</text>
  <rect x="234.507648" y="278.927" width="162.476542" height="162.476" rx="14.000023" fill="url(#grad-ok)" stroke="var(--black)" filter="url(#shadow)"/>
  <text x="315.745919" y="374.0827" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--ok-text)">SoC</text>
  <rect x="656.018053" y="278.927" width="162.476542" height="162.476" rx="14.000023" fill="url(#grad-ok)" stroke="var(--black)" filter="url(#shadow)"/>
  <text x="737.255824" y="374.0827" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--ok-text)">Memory</text>
  <rect x="1077.523458" y="278.927" width="162.476542" height="162.476" rx="14.000023" fill="url(#grad-ok)" stroke="var(--black)" filter="url(#shadow)"/>
  <text x="1158.765829" y="374.0827" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--ok-text)">Chosen</text>
  <rect x="40" y="490.019" width="129.981433" height="129.981" rx="14.000023" fill="url(#grad-warn)" stroke="var(--black)" filter="url(#shadow)"/>
  <text x="104.990717" y="568.9271" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--warn-text)">UART</text>
  <rect x="250.755703" y="490.019" width="129.981433" height="129.981" rx="14.000023" fill="url(#grad-warn)" stroke="var(--black)" filter="url(#shadow)"/>
  <text x="315.745919" y="568.9271" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--warn-text)">I2C</text>
  <rect x="461.510405" y="490.019" width="129.981433" height="129.981" rx="14.000023" fill="url(#grad-warn)" stroke="var(--black)" filter="url(#shadow)"/>
  <text x="526.500722" y="568.9271" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--warn-text)">SPI</text>
  <line x1="737.255824" y1="220.9904" x2="315.745919" y2="290.5777" stroke="var(--black)" stroke-width="2"/>
  <line x1="737.255824" y1="220.9904" x2="737.255824" y2="290.5777" stroke="var(--black)" stroke-width="2"/>
  <line x1="737.255824" y1="220.9904" x2="1158.765829" y2="290.5777" stroke="var(--black)" stroke-width="2"/>
  <line x1="315.745919" y1="429.7524" x2="104.990717" y2="499.3398" stroke="var(--black)" stroke-width="2"/>
  <line x1="315.745919" y1="429.7524" x2="315.745919" y2="499.3398" stroke="var(--black)" stroke-width="2"/>
  <line x1="315.745919" y1="429.7524" x2="526.500722" y2="499.3398" stroke="var(--black)" stroke-width="2"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <circle cx="737.2535" cy="137.4857" r="97.4857" fill="var(--primary-fill)" stroke="var(--black)" />
  <text x="737.2535" y="151.4033" text-anchor="middle" fill="var(--bg)">Root</text>
  <circle cx="315.745" cy="360.1652" r="81.2379" fill="var(--ok-fill)" stroke="var(--black)" />
  <text x="315.745" y="374.0827" text-anchor="middle">SoC</text>
  <circle cx="737.2535" cy="360.1652" r="81.2379" fill="var(--ok-fill)" stroke="var(--black)" />
  <text x="737.2535" y="374.0827" text-anchor="middle">Memory</text>
  <circle cx="1158.7621" cy="360.1652" r="81.2379" fill="var(--ok-fill)" stroke="var(--black)" />
  <text x="1158.7621" y="374.0827" text-anchor="middle">Chosen</text>
  <circle cx="104.9905" cy="555.0095" r="64.9905" fill="var(--warn-fill)" stroke="var(--black)" />
  <text x="104.9905" y="568.9271" text-anchor="middle">UART</text>
  <circle cx="315.745" cy="555.0095" r="64.9905" fill="var(--warn-fill)" stroke="var(--black)" />
  <text x="315.745" y="568.9271" text-anchor="middle">I2C</text>
  <circle cx="526.4991" cy="555.0095" r="64.9905" fill="var(--warn-fill)" stroke="var(--black)" />
  <text x="526.4991" y="568.9271" text-anchor="middle">SPI</text>
  <line x1="737.2535" y1="220.9904" x2="315.745" y2="290.5777" stroke="var(--black)" stroke-width="2" />
  <line x1="737.2535" y1="220.9904" x2="737.2535" y2="290.5777" stroke="var(--black)" stroke-width="2" />
  <line x1="737.2535" y1="220.9904" x2="1158.7621" y2="290.5777" stroke="var(--black)" stroke-width="2" />
  <line x1="315.745" y1="429.7524" x2="104.9905" y2="499.3398" stroke="var(--black)" stroke-width="2" />
  <line x1="315.745" y1="429.7524" x2="315.745" y2="499.3398" stroke="var(--black)" stroke-width="2" />
  <line x1="315.745" y1="429.7524" x2="526.4991" y2="499.3398" stroke="var(--black)" stroke-width="2" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.999775" y="40" text-anchor="middle" font-weight="bold">Linux Block Layer</text>
  <rect x="40" y="85.789395" width="1199.99985" height="76.315769" fill="var(--danger-fill)" stroke="var(--danger-border)" rx="7.725555" stroke-width="2"/>
  <text x="639.999775" y="131.578901" text-anchor="middle">Filesystem (ext4, xfs, btrfs)</text>
  <rect x="40" y="177.368407" width="1199.99985" height="76.315769" fill="var(--primary-fill)" stroke="var(--primary-border)" rx="7.725555" stroke-width="2"/>
  <text x="639.999775" y="223.157802" text-anchor="middle">VFS Layer</text>
  <rect x="40" y="268.947307" width="1199.99985" height="76.315769" fill="var(--ok-fill)" stroke="var(--ok-border)" rx="7.725555" stroke-width="2"/>
  <text x="639.999775" y="314.736924" text-anchor="middle">Block Layer Core</text>
  <rect x="40" y="360.526319" width="585.000077" height="76.315769" fill="var(--warn-fill)" stroke="var(--warn-border)" rx="7.725555" stroke-width="2"/>
  <text x="330.999964" y="406.315824" text-anchor="middle">I/O Scheduler</text>
  <rect x="654.999923" y="360.526319" width="585.000077" height="76.315769" fill="var(--info-fill)" stroke="var(--info-border)" rx="7.725555" stroke-width="2"/>
  <text x="945.999887" y="406.315824" text-anchor="middle">Device Mapper</text>
  <rect x="40" y="452.10522" width="1199.99985" height="76.315769" fill="var(--border)" stroke="var(--black)" rx="7.725555"/>
  <text x="639.999775" y="497.894725" text-anchor="middle">Block Device Driver</text>
  <rect x="40" y="543.684231" width="1199.99985" height="76.315769" fill="var(--border)" stroke="var(--black)" rx="7.725555"/>
  <text x="639.999775" y="589.473626" text-anchor="middle">Hardware (HDD, SSD, NVMe)</text>
</svg>
  <rect x="517.3945" y="217.931" width="245.2108" height="86.207" fill="var(--danger-fill)" stroke="var(--danger-border)" rx="7.8544" stroke-width="2"/>
  <text x="640" y="269.6551" text-anchor="middle" font-size="24.1379">Configure</text>
  <rect x="823.908" y="217.931" width="245.2108" height="86.207" fill="var(--primary-fill)" stroke="var(--primary-border)" rx="7.8544" stroke-width="2"/>
  <text x="946.5134" y="269.6551" text-anchor="middle" font-size="24.1379">Compile</text>
  <rect x="364.1379" y="355.8621" width="245.2108" height="86.207" fill="var(--ok-fill)" stroke="var(--ok-border)" rx="7.8544" stroke-width="2"/>
  <text x="486.7432" y="407.5861" text-anchor="middle" font-size="24.1379">Install</text>
  <rect x="670.6513" y="355.8621" width="245.2108" height="86.207" fill="var(--surface)" stroke="var(--border)" rx="7.8544" stroke-width="1"/>
  <text x="793.2566" y="407.5861" text-anchor="middle" font-size="24.1379">Package</text>
  <rect x="517.3945" y="493.793" width="245.2108" height="86.207" fill="var(--info-fill)" stroke="var(--info-border)" rx="7.8544" stroke-width="2"/>
  <text x="640" y="545.5172" text-anchor="middle" font-size="24.1379">Image</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="342.8573" height="100.0001" fill="url(#grad-primary)" stroke="var(--primary-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <text x="211.4284" y="99.9999" text-anchor="middle" font-size="30.7408" font-family="Arial, sans-serif" fill="var(--primary-text)">Parse</text>
  <rect x="468.5714" y="40" width="342.8573" height="100.0001" fill="url(#grad-info)" stroke="var(--info-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="99.9999" text-anchor="middle" font-size="30.7408" font-family="Arial, sans-serif" fill="var(--info-text)">Fetch</text>
  <rect x="897.1427" y="40" width="342.8573" height="100.0001" fill="url(#grad-ok)" stroke="var(--ok-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <text x="1068.5714" y="99.9999" text-anchor="middle" font-size="30.7408" font-family="Arial, sans-serif" fill="var(--ok-text)">Unpack</text>
  <rect x="40" y="200" width="342.8573" height="100.0001" fill="url(#grad-warn)" stroke="var(--warn-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <text x="211.4284" y="260" text-anchor="middle" font-size="30.7408" font-family="Arial, sans-serif" fill="var(--warn-text)">Patch</text>
  <rect x="468.5714" y="200" width="342.8573" height="100.0001" fill="url(#grad-danger)" stroke="var(--danger-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="260" text-anchor="middle" font-size="30.7408" font-family="Arial, sans-serif" fill="var(--danger-text)">Configure</text>
  <rect x="897.1427" y="200" width="342.8573" height="100.0001" fill="url(#grad-primary)" stroke="var(--primary-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <text x="1068.5714" y="260" text-anchor="middle" font-size="30.7408" font-family="Arial, sans-serif" fill="var(--primary-text)">Compile</text>
  <rect x="254.2856" y="360.0003" width="342.8573" height="100.0001" fill="url(#grad-ok)" stroke="var(--ok-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <text x="425.714" y="420.0001" text-anchor="middle" font-size="30.7408" font-family="Arial, sans-serif" fill="var(--ok-text)">Install</text>
  <rect x="682.8572" y="360.0003" width="342.8573" height="100.0001" fill="var(--surface)" stroke="var(--border)" rx="6" stroke-width="1"/>
  <text x="854.2856" y="420.0001" text-anchor="middle" font-size="30.7408" font-family="Arial, sans-serif" fill="var(--text)">Package</text>
  <rect x="468.5714" y="519.9999" width="342.8573" height="100.0001" fill="url(#grad-info)" stroke="var(--info-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="580.0001" text-anchor="middle" font-size="30.7408" font-family="Arial, sans-serif" fill="var(--info-text)">Image</text>
  <path d="M 382.8571 89.9997 L 468.5714 89.9997" stroke="var(--text-muted)" stroke-width="1.2043" marker-end="url(#arrow)"/>
  <path d="M 811.4284 89.9997 L 897.1427 89.9997" stroke="var(--text-muted)" stroke-width="1.2043" marker-end="url(#arrow)"/>
  <path d="M 211.4284 139.9999 L 211.4284 200" stroke="var(--text-muted)" stroke-width="1.2043" marker-end="url(#arrow)"/>
  <path d="M 382.8571 249.9998 L 468.5714 249.9998" stroke="var(--text-muted)" stroke-width="1.2043" marker-end="url(#arrow)"/>
  <path d="M 811.4284 249.9998 L 897.1427 249.9998" stroke="var(--text-muted)" stroke-width="1.2043" marker-end="url(#arrow)"/>
  <path d="M 1068.5714 299.9999 L 854.2856 360.0003" stroke="var(--text-muted)" stroke-width="1.2043" marker-end="url(#arrow)"/>
  <path d="M 211.4284 299.9999 L 425.714 360.0003" stroke="var(--text-muted)" stroke-width="1.2043" marker-end="url(#arrow)"/>
  <path d="M 597.1428 410 L 682.8572 410" stroke="var(--text-muted)" stroke-width="1.2043" marker-end="url(#arrow)"/>
  <path d="M 854.2856 460 L 640 519.9999" stroke="var(--text-muted)" stroke-width="1.2043" marker-end="url(#arrow)"/>
  <path d="M 425.714 460 L 640 519.9999" stroke="var(--text-muted)" stroke-width="1.2043" marker-end="url(#arrow)"/>
</svg>

  <rect x="312.1951" y="171.2195" width="187.3171" height="65.8537" fill="var(--danger-fill)" stroke="var(--danger-border)" rx="6" stroke-width="2"/>
  <text x="405.8537" y="210.7317" text-anchor="middle" font-size="18.439">Configure</text>
  <rect x="546.3415" y="171.2195" width="187.3171" height="65.8537" fill="var(--primary-fill)" stroke="var(--primary-border)" rx="6" stroke-width="2"/>
  <text x="640" y="210.7317" text-anchor="middle" font-size="18.439">Compile</text>
  <rect x="195.122" y="276.5854" width="187.3171" height="65.8537" fill="var(--ok-fill)" stroke="var(--ok-border)" rx="6" stroke-width="2"/>
  <text x="288.7805" y="316.0975" text-anchor="middle" font-size="18.439">Install</text>
  <rect x="429.2683" y="276.5854" width="187.3171" height="65.8537" fill="var(--surface)" stroke="var(--border)" rx="6" stroke-width="1"/>
  <text x="522.9268" y="316.0975" text-anchor="middle" font-size="18.439">Package</text>
  <rect x="312.1951" y="381.9512" width="187.3171" height="65.8537" fill="var(--info-fill)" stroke="var(--info-border)" rx="6" stroke-width="2"/>
  <text x="405.8537" y="421.4634" text-anchor="middle" font-size="18.439">Image</text>

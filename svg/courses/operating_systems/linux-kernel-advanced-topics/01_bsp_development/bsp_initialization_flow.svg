<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="490" y="40" width="300" height="47.598771" rx="6.482147" fill="var(--text)" />
  <text x="640" y="69.088211" text-anchor="middle" font-family="sans-serif" font-size="18.777266" font-weight="bold" fill="var(--bg)">Power On / Reset</text>
  <line x1="640" y1="89.361786" x2="640" y2="119.331285" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="390" y="121.0943" width="499.999893" height="58.176312" rx="6.482147" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="145.775084" text-anchor="middle" font-family="sans-serif" font-size="16.899497" font-weight="bold" fill="var(--bg)">1. CPU Initialisation</text>
  <text x="640" y="166.930057" text-anchor="middle" font-family="sans-serif" font-size="13.143957" fill="var(--primary-accent)">Exception vectors · cache disable · privileged mode</text>
  <line x1="640" y1="181.033518" x2="640" y2="207.477207" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="390" y="209.240112" width="499.999893" height="58.176312" rx="6.482147" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="233.921005" text-anchor="middle" font-family="sans-serif" font-size="16.899497" font-weight="bold" fill="var(--text)">2. Memory Controller</text>
  <text x="640" y="255.075978" text-anchor="middle" font-family="sans-serif" font-size="13.143957" fill="var(--text-muted)">DRAM init · timing calibration · ECC setup</text>
  <line x1="640" y1="269.179439" x2="640" y2="295.623128" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="390" y="297.386033" width="499.999893" height="58.176312" rx="6.482147" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="322.066926" text-anchor="middle" font-family="sans-serif" font-size="16.899497" font-weight="bold" fill="var(--text)">3. Clock &amp; PLL Configuration</text>
  <text x="640" y="343.221899" text-anchor="middle" font-family="sans-serif" font-size="13.143957" fill="var(--text-muted)">CPU freq · bus freq · peripheral clocks</text>
  <line x1="640" y1="357.325141" x2="640" y2="383.76894" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="390" y="385.531954" width="499.999893" height="58.176312" rx="6.482147" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="410.212738" text-anchor="middle" font-family="sans-serif" font-size="16.899497" font-weight="bold" fill="var(--text)">4. Pin Mux (IOMUX)</text>
  <text x="640" y="431.367711" text-anchor="middle" font-family="sans-serif" font-size="13.143957" fill="var(--text-muted)">Assign GPIO pins to UART / SPI / I²C / etc.</text>
  <line x1="640" y1="445.471063" x2="640" y2="471.914861" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="390" y="473.677766" width="499.999893" height="58.176312" rx="6.482147" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="498.358659" text-anchor="middle" font-family="sans-serif" font-size="16.899497" font-weight="bold" fill="var(--text)">5. Interrupt Controller (GIC/NVIC)</text>
  <text x="640" y="519.513632" text-anchor="middle" font-family="sans-serif" font-size="13.143957" fill="var(--text-muted)">Enable IRQs · set priorities · map vectors</text>
  <line x1="640" y1="533.616984" x2="640" y2="560.060782" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="390" y="561.823688" width="499.999893" height="58.176312" rx="6.482147" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="586.504581" text-anchor="middle" font-family="sans-serif" font-size="16.899497" font-weight="bold" fill="var(--bg)">6. Hand off to Kernel</text>
  <text x="640" y="607.659554" text-anchor="middle" font-family="sans-serif" font-size="13.143957" fill="var(--primary-accent)">Jump to kernel entry · pass device tree blob</text>
  <rect x="949.999893" y="121.0943" width="290" height="246.808492" rx="6.482147" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1094.999893" y="145.775084" text-anchor="middle" font-family="sans-serif" font-size="14.082896" font-weight="bold" fill="var(--text)">Who does this?</text>
  <text x="970" y="168.693071" font-family="sans-serif" font-size="13.143957" fill="var(--text-muted)">Bootloader (U-Boot / SPL)</text>
  <text x="970" y="188.085139" font-family="monospace" font-size="12.205234" fill="var(--primary-accent)">board_init_f()</text>
  <text x="970" y="205.714411" font-family="monospace" font-size="12.205234" fill="var(--primary-accent)">board_init_r()</text>
  <line x1="949.999893" y1="219.817653" x2="1240" y2="219.817653" stroke="var(--border)" stroke-width="0.8889" />
  <text x="970" y="240.972626" font-family="sans-serif" font-size="13.143957" fill="var(--text-muted)">Device Tree specifies:</text>
  <text x="970" y="260.364803" font-family="monospace" font-size="12.205234" fill="var(--primary-accent)">• compatible strings</text>
  <text x="970" y="277.993856" font-family="monospace" font-size="12.205234" fill="var(--primary-accent)">• reg addresses</text>
  <text x="970" y="295.623128" font-family="monospace" font-size="12.205234" fill="var(--primary-accent)">• clock frequencies</text>
  <text x="970" y="313.25229" font-family="monospace" font-size="12.205234" fill="var(--primary-accent)">• pinmux config</text>
  <text x="970" y="341.458884" font-family="sans-serif" font-size="12.205234" fill="var(--text-faint)">Order matters — clocks before</text>
  <text x="970" y="357.325141" font-family="sans-serif" font-size="12.205234" fill="var(--text-faint)">peripherals that depend on them</text>
  <rect x="40" y="121.0943" width="300" height="88.145921" rx="6.482147" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="145.775084" text-anchor="middle" font-family="sans-serif" font-size="13.143957" font-weight="bold" fill="var(--primary-accent)">BSP components</text>
  <text x="60" y="166.930057" font-family="monospace" font-size="12.205234" fill="var(--text)">board/vendor/board.c</text>
  <text x="60" y="184.559328" font-family="monospace" font-size="12.205234" fill="var(--text)">arch/arm/mach-xxx/</text>
  <text x="60" y="202.188491" font-family="monospace" font-size="12.205234" fill="var(--text)">arch/xxx/board/dts/</text>
</svg>
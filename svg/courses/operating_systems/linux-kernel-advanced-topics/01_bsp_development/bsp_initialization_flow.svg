<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="435.5556" y="12.4444" width="266.6667" height="48" rx="6" fill="var(--text)" filter="url(#shadow)" />
  <text x="568.8889" y="41.7778" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--bg)">Power On / Reset</text>
  <line x1="568.8889" y1="62.2222" x2="568.8889" y2="92.4444" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="346.6667" y="94.2222" width="444.4444" height="58.6667" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="568.8889" y="119.1111" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">1. CPU Initialisation</text>
  <text x="568.8889" y="140.4444" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--primary-accent)">Exception vectors · cache disable · privileged mode</text>
  <line x1="568.8889" y1="154.6667" x2="568.8889" y2="181.3333" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="346.6667" y="183.1111" width="444.4444" height="58.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="568.8889" y="208" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--text)">2. Memory Controller</text>
  <text x="568.8889" y="229.3333" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">DRAM init · timing calibration · ECC setup</text>
  <line x1="568.8889" y1="243.5556" x2="568.8889" y2="270.2222" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="346.6667" y="272" width="444.4444" height="58.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="568.8889" y="296.8889" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--text)">3. Clock &amp; PLL Configuration</text>
  <text x="568.8889" y="318.2222" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">CPU freq · bus freq · peripheral clocks</text>
  <line x1="568.8889" y1="332.4444" x2="568.8889" y2="359.1111" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="346.6667" y="360.8889" width="444.4444" height="58.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="568.8889" y="385.7778" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--text)">4. Pin Mux (IOMUX)</text>
  <text x="568.8889" y="407.1111" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Assign GPIO pins to UART / SPI / I²C / etc.</text>
  <line x1="568.8889" y1="421.3333" x2="568.8889" y2="448" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="346.6667" y="449.7778" width="444.4444" height="58.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="568.8889" y="474.6667" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--text)">5. Interrupt Controller (GIC/NVIC)</text>
  <text x="568.8889" y="496" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Enable IRQs · set priorities · map vectors</text>
  <line x1="568.8889" y1="510.2222" x2="568.8889" y2="536.8889" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="346.6667" y="538.6667" width="444.4444" height="58.6667" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="568.8889" y="563.5556" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">6. Hand off to Kernel</text>
  <text x="568.8889" y="584.8889" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--primary-accent)">Jump to kernel entry · pass device tree blob</text>
  <rect x="844.4444" y="94.2222" width="257.7778" height="248.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="973.3333" y="119.1111" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--text)">Who does this?</text>
  <text x="862.2222" y="142.2222" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Bootloader (U-Boot / SPL)</text>
  <text x="862.2222" y="161.7778" font-family="monospace" font-size="11.5556" fill="var(--primary-accent)">board_init_f()</text>
  <text x="862.2222" y="179.5556" font-family="monospace" font-size="11.5556" fill="var(--primary-accent)">board_init_r()</text>
  <line x1="844.4444" y1="193.7778" x2="1102.2222" y2="193.7778" stroke="var(--border)" stroke-width="0.8889" />
  <text x="862.2222" y="215.1111" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Device Tree specifies:</text>
  <text x="862.2222" y="234.6667" font-family="monospace" font-size="11.5556" fill="var(--primary-accent)">• compatible strings</text>
  <text x="862.2222" y="252.4444" font-family="monospace" font-size="11.5556" fill="var(--primary-accent)">• reg addresses</text>
  <text x="862.2222" y="270.2222" font-family="monospace" font-size="11.5556" fill="var(--primary-accent)">• clock frequencies</text>
  <text x="862.2222" y="288" font-family="monospace" font-size="11.5556" fill="var(--primary-accent)">• pinmux config</text>
  <text x="862.2222" y="316.4444" font-family="sans-serif" font-size="11.5556" fill="var(--text-faint)">Order matters — clocks before</text>
  <text x="862.2222" y="332.4444" font-family="sans-serif" font-size="11.5556" fill="var(--text-faint)">peripherals that depend on them</text>
  <rect x="35.5556" y="94.2222" width="266.6667" height="88.8889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="168.8889" y="119.1111" text-anchor="middle" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="var(--primary-accent)">BSP components</text>
  <text x="53.3333" y="140.4444" font-family="monospace" font-size="11.5556" fill="var(--text)">board/vendor/board.c</text>
  <text x="53.3333" y="158.2222" font-family="monospace" font-size="11.5556" fill="var(--text)">arch/arm/mach-xxx/</text>
  <text x="53.3333" y="176" font-family="monospace" font-size="11.5556" fill="var(--text)">arch/xxx/board/dts/</text>
</svg>
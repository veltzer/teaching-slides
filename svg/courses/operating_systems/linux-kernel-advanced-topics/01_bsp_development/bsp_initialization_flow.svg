<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#ffffff" />
      <ns0:stop offset="100%" stop-color="#f2f2f2" />
    </ns0:linearGradient>
    <ns0:filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <ns0:feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </ns0:filter>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="435.5556" y="12.4444" width="266.6667" height="48" rx="5.3333" fill="#212121" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="41.7778" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="#ffffff">Power On / Reset</ns0:text>
  <ns0:line x1="568.8889" y1="62.2222" x2="568.8889" y2="92.4444" stroke="#1565c0" stroke-width="1.7778" marker-end="url(#arrow-accent)" />
  <ns0:rect x="346.6667" y="94.2222" width="444.4444" height="58.6667" rx="5.3333" fill="url(#grad-accent)" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="119.1111" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">1. CPU Initialisation</ns0:text>
  <ns0:text x="568.8889" y="140.4444" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#bbdefb">Exception vectors · cache disable · privileged mode</ns0:text>
  <ns0:line x1="568.8889" y1="154.6667" x2="568.8889" y2="181.3333" stroke="#1565c0" stroke-width="1.7778" marker-end="url(#arrow-accent)" />
  <ns0:rect x="346.6667" y="183.1111" width="444.4444" height="58.6667" rx="5.3333" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="208" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#212121">2. Memory Controller</ns0:text>
  <ns0:text x="568.8889" y="229.3333" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#555555">DRAM init · timing calibration · ECC setup</ns0:text>
  <ns0:line x1="568.8889" y1="243.5556" x2="568.8889" y2="270.2222" stroke="#1565c0" stroke-width="1.7778" marker-end="url(#arrow-accent)" />
  <ns0:rect x="346.6667" y="272" width="444.4444" height="58.6667" rx="5.3333" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="296.8889" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#212121">3. Clock &amp; PLL Configuration</ns0:text>
  <ns0:text x="568.8889" y="318.2222" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#555555">CPU freq · bus freq · peripheral clocks</ns0:text>
  <ns0:line x1="568.8889" y1="332.4444" x2="568.8889" y2="359.1111" stroke="#1565c0" stroke-width="1.7778" marker-end="url(#arrow-accent)" />
  <ns0:rect x="346.6667" y="360.8889" width="444.4444" height="58.6667" rx="5.3333" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="385.7778" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#212121">4. Pin Mux (IOMUX)</ns0:text>
  <ns0:text x="568.8889" y="407.1111" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#555555">Assign GPIO pins to UART / SPI / I²C / etc.</ns0:text>
  <ns0:line x1="568.8889" y1="421.3333" x2="568.8889" y2="448" stroke="#1565c0" stroke-width="1.7778" marker-end="url(#arrow-accent)" />
  <ns0:rect x="346.6667" y="449.7778" width="444.4444" height="58.6667" rx="5.3333" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="474.6667" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#212121">5. Interrupt Controller (GIC/NVIC)</ns0:text>
  <ns0:text x="568.8889" y="496" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#555555">Enable IRQs · set priorities · map vectors</ns0:text>
  <ns0:line x1="568.8889" y1="510.2222" x2="568.8889" y2="536.8889" stroke="#1565c0" stroke-width="1.7778" marker-end="url(#arrow-accent)" />
  <ns0:rect x="346.6667" y="538.6667" width="444.4444" height="58.6667" rx="5.3333" fill="url(#grad-accent)" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="563.5556" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">6. Hand off to Kernel</ns0:text>
  <ns0:text x="568.8889" y="584.8889" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#bbdefb">Jump to kernel entry · pass device tree blob</ns0:text>
  <ns0:rect x="844.4444" y="94.2222" width="257.7778" height="248.8889" rx="5.3333" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.3333" />
  <ns0:text x="973.3333" y="119.1111" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="#212121">Who does this?</ns0:text>
  <ns0:text x="862.2222" y="142.2222" font-family="sans-serif" font-size="12.4444" fill="#555555">Bootloader (U-Boot / SPL)</ns0:text>
  <ns0:text x="862.2222" y="161.7778" font-family="monospace" font-size="11.5556" fill="#1565c0">board_init_f()</ns0:text>
  <ns0:text x="862.2222" y="179.5556" font-family="monospace" font-size="11.5556" fill="#1565c0">board_init_r()</ns0:text>
  <ns0:line x1="844.4444" y1="193.7778" x2="1102.2222" y2="193.7778" stroke="#e0e0e0" stroke-width="0.8889" />
  <ns0:text x="862.2222" y="215.1111" font-family="sans-serif" font-size="12.4444" fill="#555555">Device Tree specifies:</ns0:text>
  <ns0:text x="862.2222" y="234.6667" font-family="monospace" font-size="11.5556" fill="#1565c0">• compatible strings</ns0:text>
  <ns0:text x="862.2222" y="252.4444" font-family="monospace" font-size="11.5556" fill="#1565c0">• reg addresses</ns0:text>
  <ns0:text x="862.2222" y="270.2222" font-family="monospace" font-size="11.5556" fill="#1565c0">• clock frequencies</ns0:text>
  <ns0:text x="862.2222" y="288" font-family="monospace" font-size="11.5556" fill="#1565c0">• pinmux config</ns0:text>
  <ns0:text x="862.2222" y="316.4444" font-family="sans-serif" font-size="11.5556" fill="#9e9e9e">Order matters — clocks before</ns0:text>
  <ns0:text x="862.2222" y="332.4444" font-family="sans-serif" font-size="11.5556" fill="#9e9e9e">peripherals that depend on them</ns0:text>
  <ns0:rect x="35.5556" y="94.2222" width="266.6667" height="88.8889" rx="5.3333" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="168.8889" y="119.1111" text-anchor="middle" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="#1565c0">BSP components</ns0:text>
  <ns0:text x="53.3333" y="140.4444" font-family="monospace" font-size="11.5556" fill="#212121">board/vendor/board.c</ns0:text>
  <ns0:text x="53.3333" y="158.2222" font-family="monospace" font-size="11.5556" fill="#212121">arch/arm/mach-xxx/</ns0:text>
  <ns0:text x="53.3333" y="176" font-family="monospace" font-size="11.5556" fill="#212121">arch/xxx/board/dts/</ns0:text>
</ns0:svg>
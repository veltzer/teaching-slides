<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Power-on at top -->
  <rect x="490" y="14" width="300" height="54" rx="6" fill="#212121" filter="url(#shadow)"/>
  <text x="640" y="47" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff">Power On / Reset</text>

  <line x1="640" y1="70" x2="640" y2="104" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <!-- 6 sequential init steps -->
  <!-- Step 1 -->
  <rect x="390" y="106" width="500" height="66" rx="6" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="134" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffffff">1. CPU Initialisation</text>
  <text x="640" y="158" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#bbdefb">Exception vectors · cache disable · privileged mode</text>
  <line x1="640" y1="174" x2="640" y2="204" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <!-- Step 2 -->
  <rect x="390" y="206" width="500" height="66" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="234" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#212121">2. Memory Controller</text>
  <text x="640" y="258" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555555">DRAM init · timing calibration · ECC setup</text>
  <line x1="640" y1="274" x2="640" y2="304" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <!-- Step 3 -->
  <rect x="390" y="306" width="500" height="66" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="334" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#212121">3. Clock &amp; PLL Configuration</text>
  <text x="640" y="358" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555555">CPU freq · bus freq · peripheral clocks</text>
  <line x1="640" y1="374" x2="640" y2="404" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <!-- Step 4 -->
  <rect x="390" y="406" width="500" height="66" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="434" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#212121">4. Pin Mux (IOMUX)</text>
  <text x="640" y="458" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555555">Assign GPIO pins to UART / SPI / I²C / etc.</text>
  <line x1="640" y1="474" x2="640" y2="504" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <!-- Step 5 -->
  <rect x="390" y="506" width="500" height="66" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="534" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#212121">5. Interrupt Controller (GIC/NVIC)</text>
  <text x="640" y="558" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555555">Enable IRQs · set priorities · map vectors</text>
  <line x1="640" y1="574" x2="640" y2="604" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <!-- Step 6 -->
  <rect x="390" y="606" width="500" height="66" rx="6" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="634" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffffff">6. Hand off to Kernel</text>
  <text x="640" y="658" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#bbdefb">Jump to kernel entry · pass device tree blob</text>

  <!-- Annotations on right -->
  <rect x="950" y="106" width="290" height="280" rx="6" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="1095" y="134" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#212121">Who does this?</text>
  <text x="970"  y="160" font-family="sans-serif" font-size="14" fill="#555555">Bootloader (U-Boot / SPL)</text>
  <text x="970"  y="182" font-family="monospace" font-size="13" fill="#1565c0">board_init_f()</text>
  <text x="970"  y="202" font-family="monospace" font-size="13" fill="#1565c0">board_init_r()</text>
  <line x1="950" y1="218" x2="1240" y2="218" stroke="#e0e0e0" stroke-width="1"/>
  <text x="970"  y="242" font-family="sans-serif" font-size="14" fill="#555555">Device Tree specifies:</text>
  <text x="970"  y="264" font-family="monospace" font-size="13" fill="#1565c0">• compatible strings</text>
  <text x="970"  y="284" font-family="monospace" font-size="13" fill="#1565c0">• reg addresses</text>
  <text x="970"  y="304" font-family="monospace" font-size="13" fill="#1565c0">• clock frequencies</text>
  <text x="970"  y="324" font-family="monospace" font-size="13" fill="#1565c0">• pinmux config</text>
  <text x="970"  y="356" font-family="sans-serif" font-size="13" fill="#9e9e9e">Order matters — clocks before</text>
  <text x="970"  y="374" font-family="sans-serif" font-size="13" fill="#9e9e9e">peripherals that depend on them</text>

  <!-- Left annotation: BSP -->
  <rect x="40" y="106" width="300" height="100" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="190" y="134" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1565c0">BSP components</text>
  <text x="60"  y="158" font-family="monospace" font-size="13" fill="#212121">board/vendor/board.c</text>
  <text x="60"  y="178" font-family="monospace" font-size="13" fill="#212121">arch/arm/mach-xxx/</text>
  <text x="60"  y="198" font-family="monospace" font-size="13" fill="#212121">arch/xxx/board/dts/</text>
</svg>

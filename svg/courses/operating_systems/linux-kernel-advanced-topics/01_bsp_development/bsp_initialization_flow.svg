<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="499.375" y="51.2777" width="281.25" height="43.5" rx="6" fill="var(--text)" filter="url(#shadow)" />
  <text x="640" y="77.8611" text-anchor="middle" font-family="sans-serif" font-size="17.3806" font-weight="bold" fill="var(--bg)">Power On / Reset</text>
  <line x1="640" y1="96.3889" x2="640" y2="123.7777" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="405.625" y="125.3889" width="468.7499" height="53.1667" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="147.9444" text-anchor="middle" font-family="sans-serif" font-size="15.6425" font-weight="bold" fill="var(--bg)">1. CPU Initialisation</text>
  <text x="640" y="167.2777" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--primary-accent)">Exception vectors · cache disable · privileged mode</text>
  <line x1="640" y1="180.1667" x2="640" y2="204.3333" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="405.625" y="205.9444" width="468.7499" height="53.1667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="640" y="228.5" text-anchor="middle" font-family="sans-serif" font-size="15.6425" font-weight="bold" fill="var(--text)">2. Memory Controller</text>
  <text x="640" y="247.8333" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">DRAM init · timing calibration · ECC setup</text>
  <line x1="640" y1="260.7223" x2="640" y2="284.8889" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="405.625" y="286.5" width="468.7499" height="53.1667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="640" y="309.0556" text-anchor="middle" font-family="sans-serif" font-size="15.6425" font-weight="bold" fill="var(--text)">3. Clock &amp; PLL Configuration</text>
  <text x="640" y="328.3889" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">CPU freq · bus freq · peripheral clocks</text>
  <line x1="640" y1="341.2777" x2="640" y2="365.4444" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="405.625" y="367.0556" width="468.7499" height="53.1667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="640" y="389.6111" text-anchor="middle" font-family="sans-serif" font-size="15.6425" font-weight="bold" fill="var(--text)">4. Pin Mux (IOMUX)</text>
  <text x="640" y="408.9444" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">Assign GPIO pins to UART / SPI / I²C / etc.</text>
  <line x1="640" y1="421.8333" x2="640" y2="446" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="405.625" y="447.6111" width="468.7499" height="53.1667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="640" y="470.1667" text-anchor="middle" font-family="sans-serif" font-size="15.6425" font-weight="bold" fill="var(--text)">5. Interrupt Controller (GIC/NVIC)</text>
  <text x="640" y="489.5" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">Enable IRQs · set priorities · map vectors</text>
  <line x1="640" y1="502.3889" x2="640" y2="526.5556" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="405.625" y="528.1667" width="468.7499" height="53.1667" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="550.7223" text-anchor="middle" font-family="sans-serif" font-size="15.6425" font-weight="bold" fill="var(--bg)">6. Hand off to Kernel</text>
  <text x="640" y="570.0556" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--primary-accent)">Jump to kernel entry · pass device tree blob</text>
  <rect x="930.6249" y="125.3889" width="271.875" height="225.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1066.5624" y="147.9444" text-anchor="middle" font-family="sans-serif" font-size="13.0354" font-weight="bold" fill="var(--text)">Who does this?</text>
  <text x="949.375" y="168.8889" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">Bootloader (U-Boot / SPL)</text>
  <text x="949.375" y="186.6111" font-family="monospace" font-size="11.2974" fill="var(--primary-accent)">board_init_f()</text>
  <text x="949.375" y="202.7223" font-family="monospace" font-size="11.2974" fill="var(--primary-accent)">board_init_r()</text>
  <line x1="930.6249" y1="215.6111" x2="1202.5" y2="215.6111" stroke="var(--border)" stroke-width="0.8889" />
  <text x="949.375" y="234.9444" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">Device Tree specifies:</text>
  <text x="949.375" y="252.6667" font-family="monospace" font-size="11.2974" fill="var(--primary-accent)">• compatible strings</text>
  <text x="949.375" y="268.7777" font-family="monospace" font-size="11.2974" fill="var(--primary-accent)">• reg addresses</text>
  <text x="949.375" y="284.8889" font-family="monospace" font-size="11.2974" fill="var(--primary-accent)">• clock frequencies</text>
  <text x="949.375" y="301" font-family="monospace" font-size="11.2974" fill="var(--primary-accent)">• pinmux config</text>
  <text x="949.375" y="326.7777" font-family="sans-serif" font-size="11.2974" fill="var(--text-faint)">Order matters — clocks before</text>
  <text x="949.375" y="341.2777" font-family="sans-serif" font-size="11.2974" fill="var(--text-faint)">peripherals that depend on them</text>
  <rect x="77.5" y="125.3889" width="281.25" height="80.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="218.125" y="147.9444" text-anchor="middle" font-family="sans-serif" font-size="12.1663" font-weight="bold" fill="var(--primary-accent)">BSP components</text>
  <text x="96.25" y="167.2777" font-family="monospace" font-size="11.2974" fill="var(--text)">board/vendor/board.c</text>
  <text x="96.25" y="183.3889" font-family="monospace" font-size="11.2974" fill="var(--text)">arch/arm/mach-xxx/</text>
  <text x="96.25" y="199.5" font-family="monospace" font-size="11.2974" fill="var(--text)">arch/xxx/board/dts/</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="358.523726" height="388.543911" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="11.896462" filter="url(#shadow)"/>
  <text x="219.261863" y="259.611593" text-anchor="middle" font-size="37.907281" fill="var(--warn-accent)" font-family="Arial, sans-serif">Vendor BSP</text>
  <rect x="460.738025" y="40" width="358.523726" height="388.543911" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="11.896462" filter="url(#shadow)"/>
  <text x="640" y="259.611593" text-anchor="middle" font-size="37.907281" fill="var(--primary-accent)" font-family="Arial, sans-serif">Custom Code</text>
  <rect x="881.476274" y="40" width="358.523726" height="388.543911" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="11.896462" filter="url(#shadow)"/>
  <text x="1060.738137" y="259.611593" text-anchor="middle" font-size="37.907281" fill="var(--ok-accent)" font-family="Arial, sans-serif">Product BSP</text>
  <line x1="398.523726" y1="234.271779" x2="460.738025" y2="234.271779" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="819.261863" y1="234.271779" x2="881.476274" y2="234.271779" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="219.261863" y="620" text-anchor="middle" font-size="32.73807" fill="var(--text-muted)" font-family="Arial, sans-serif">Updates</text>
  <text x="640" y="620" text-anchor="middle" font-size="32.73807" fill="var(--text-muted)" font-family="Arial, sans-serif">Features</text>
  <text x="1060.738137" y="620" text-anchor="middle" font-size="32.73807" fill="var(--text-muted)" font-family="Arial, sans-serif">Release</text>
  <line x1="219.261863" y1="428.543911" x2="219.261863" y2="552.427284" stroke="var(--text-faint)" stroke-width="1.7778" stroke-dasharray="8.8889 7.1111"/>
  <line x1="640" y1="428.543911" x2="640" y2="552.427284" stroke="var(--text-faint)" stroke-width="1.7778" stroke-dasharray="8.8889 7.1111"/>
  <line x1="1060.738137" y1="428.543911" x2="1060.738137" y2="552.427284" stroke="var(--text-faint)" stroke-width="1.7778" stroke-dasharray="8.8889 7.1111"/>
</svg>

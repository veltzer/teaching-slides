<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="320" y="32" width="640" height="64" fill="#FF6347" stroke="black" />
  <text x="640" y="72" text-anchor="middle">0x00000000 - Boot ROM</text>
  <rect x="320" y="96" width="640" height="64" fill="#FFA500" stroke="black" />
  <text x="640" y="136" text-anchor="middle">0x40000000 - SRAM</text>
  <rect x="320" y="160" width="640" height="96" fill="#4169E1" stroke="black" />
  <text x="640" y="216" text-anchor="middle" fill="white">0x80000000 - DDR Base</text>
  <rect x="320" y="256" width="640" height="64" fill="#32CD32" stroke="black" />
  <text x="640" y="296" text-anchor="middle">0x80008000 - Kernel</text>
  <rect x="320" y="320" width="640" height="64" fill="#87CEEB" stroke="black" />
  <text x="640" y="360" text-anchor="middle">0x88000000 - Device Tree</text>
  <rect x="320" y="384" width="640" height="64" fill="#98FB98" stroke="black" />
  <text x="640" y="424" text-anchor="middle">0x88100000 - Initramfs</text>
  <rect x="320" y="448" width="640" height="160" fill="#FFE4B5" stroke="black" />
  <text x="640" y="536" text-anchor="middle">0x90000000 - User Space</text>
  <rect x="320" y="608" width="640" height="64" fill="#DDA0DD" stroke="black" />
  <text x="640" y="648" text-anchor="middle">0xF0000000 - Peripherals</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="55.238068" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="9.071148" filter="url(#shadow)"/>
  <text x="640.000199" y="74.984007" text-anchor="middle" font-size="23.649239" fill="var(--danger-accent)" font-family="Arial, sans-serif">0x00000000 - Boot ROM</text>
  <rect x="40" y="99.841155" width="1200" height="55.238068" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="9.071148" filter="url(#shadow)"/>
  <text x="640.000199" y="134.82539" text-anchor="middle" font-size="23.649239" fill="var(--warn-accent)" font-family="Arial, sans-serif">0x40000000 - SRAM</text>
  <rect x="40" y="159.682538" width="1200" height="79.17453" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="9.071148" filter="url(#shadow)"/>
  <text x="640.000199" y="203.873061" text-anchor="middle" font-size="23.649239" fill="var(--bg)" font-family="Arial, sans-serif">0x80000000 - DDR Base</text>
  <rect x="40" y="244.380955" width="1200" height="55.238068" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="9.071148" filter="url(#shadow)"/>
  <text x="640.000199" y="279.365076" text-anchor="middle" font-size="23.649239" fill="var(--ok-accent)" font-family="Arial, sans-serif">0x80008000 - Kernel</text>
  <rect x="40" y="304.222223" width="1200" height="55.238068" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="9.071148" filter="url(#shadow)"/>
  <text x="640.000199" y="339.206459" text-anchor="middle" font-size="23.649239" fill="var(--primary-accent)" font-family="Arial, sans-serif">0x88000000 - Device Tree</text>
  <rect x="40" y="364.063607" width="1200" height="55.238068" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="9.071148" filter="url(#shadow)"/>
  <text x="640.000199" y="399.047614" text-anchor="middle" font-size="23.649239" fill="var(--info-accent)" font-family="Arial, sans-serif">0x88100000 - Initramfs</text>
  <rect x="40" y="423.904761" width="1200" height="133.492141" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="9.071148" filter="url(#shadow)"/>
  <text x="640.000199" y="497.555519" text-anchor="middle" font-size="23.649239" fill="var(--ok-accent)" font-family="Arial, sans-serif">0x90000000 - User Space</text>
  <rect x="40" y="564.761932" width="1200" height="55.238068" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="9.071148" filter="url(#shadow)"/>
  <text x="640.000199" y="599.746053" text-anchor="middle" font-size="23.649239" fill="var(--info-accent)" font-family="Arial, sans-serif">0xF0000000 - Peripherals</text>
</svg>

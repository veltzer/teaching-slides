<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="55.238068" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="9.071148" filter="url(#shadow)" />
  <text x="640.000199" y="74.984007" text-anchor="middle" font-size="23.649239" fill="var(--danger-accent)">0x00000000 - Boot ROM</text>
  <rect x="40" y="99.841155" width="1200" height="55.238068" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="9.071148" filter="url(#shadow)" />
  <text x="640.000199" y="134.82539" text-anchor="middle" font-size="23.649239" fill="var(--warn-accent)">0x40000000 - SRAM</text>
  <rect x="40" y="159.682538" width="1200" height="79.17453" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="9.071148" filter="url(#shadow)" />
  <text x="640.000199" y="203.873061" text-anchor="middle" font-size="23.649239" fill="var(--bg)">0x80000000 - DDR Base</text>
  <rect x="40" y="244.380955" width="1200" height="55.238068" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="9.071148" filter="url(#shadow)" />
  <text x="640.000199" y="279.365076" text-anchor="middle" font-size="23.649239" fill="var(--ok-accent)">0x80008000 - Kernel</text>
  <rect x="40" y="304.222223" width="1200" height="55.238068" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="9.071148" filter="url(#shadow)" />
  <text x="640.000199" y="339.206459" text-anchor="middle" font-size="23.649239" fill="var(--primary-accent)">0x88000000 - Device Tree</text>
  <rect x="40" y="364.063607" width="1200" height="55.238068" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="9.071148" filter="url(#shadow)" />
  <text x="640.000199" y="399.047614" text-anchor="middle" font-size="23.649239" fill="var(--info-accent)">0x88100000 - Initramfs</text>
  <rect x="40" y="423.904761" width="1200" height="133.492141" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="9.071148" filter="url(#shadow)" />
  <text x="640.000199" y="497.555519" text-anchor="middle" font-size="23.649239" fill="var(--ok-accent)">0x90000000 - User Space</text>
  <rect x="40" y="564.761932" width="1200" height="55.238068" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="9.071148" filter="url(#shadow)" />
  <text x="640.000199" y="599.746053" text-anchor="middle" font-size="23.649239" fill="var(--info-accent)">0xF0000000 - Peripherals</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="508.888828" width="1200" height="111.111172" fill="var(--text-muted)" stroke="var(--text)" stroke-width="1.7778" rx="7.339158" filter="url(#shadow)" />
  <text x="640" y="573.333241" text-anchor="middle" font-size="22.322783" fill="var(--bg)">Hardware (SoC, Memory, Peripherals)</text>
  <rect x="40" y="353.333241" width="390.508475" height="111.111172" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="7.339158" filter="url(#shadow)" />
  <text x="235.254237" y="417.777655" text-anchor="middle" font-size="20.196751" fill="var(--bg)">Bootloader</text>
  <rect x="456.949153" y="353.333241" width="366.101695" height="111.111172" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="7.339158" filter="url(#shadow)" />
  <text x="640" y="417.777655" text-anchor="middle" font-size="20.196751" fill="var(--bg)">Device Tree</text>
  <rect x="849.491525" y="353.333241" width="390.508475" height="111.111172" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="7.339158" filter="url(#shadow)" />
  <text x="1044.745763" y="417.777655" text-anchor="middle" font-size="20.196751" fill="var(--bg)">Drivers</text>
  <rect x="40" y="195.555448" width="1200" height="111.111172" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.339158" filter="url(#shadow)" />
  <text x="640" y="260" text-anchor="middle" font-size="22.322783" fill="var(--ok-accent)">Linux Kernel</text>
  <rect x="40" y="40" width="571.525424" height="111.111172" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="7.339158" filter="url(#shadow)" />
  <text x="325.762712" y="104.444276" text-anchor="middle" font-size="20.196751" fill="var(--warn-accent)">Root Filesystem</text>
  <rect x="668.474576" y="40" width="571.525424" height="111.111172" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="7.339158" filter="url(#shadow)" />
  <text x="954.237288" y="104.444276" text-anchor="middle" font-size="20.196751" fill="var(--warn-accent)">Applications</text>
</svg>
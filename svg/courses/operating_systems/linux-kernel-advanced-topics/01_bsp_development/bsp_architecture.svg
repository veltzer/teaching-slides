<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="508.888828" width="1200" height="111.111172" fill="var(--text-muted)" stroke="var(--text)" stroke-width="1.7778" rx="7.339158"/>
  <text x="640" y="573.333241" text-anchor="middle" font-size="22.322783" fill="var(--bg)" font-family="Arial, sans-serif">Hardware (SoC, Memory, Peripherals)</text>
  <rect x="40" y="353.333241" width="390.508475" height="111.111172" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.339158" filter="url(#shadow)"/>
  <text x="235.254237" y="417.777655" text-anchor="middle" font-size="20.196751" fill="var(--bg)" font-family="Arial, sans-serif">Bootloader</text>
  <rect x="456.949153" y="353.333241" width="366.101695" height="111.111172" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.339158" filter="url(#shadow)"/>
  <text x="640" y="417.777655" text-anchor="middle" font-size="20.196751" fill="var(--bg)" font-family="Arial, sans-serif">Device Tree</text>
  <rect x="849.491525" y="353.333241" width="390.508475" height="111.111172" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.339158" filter="url(#shadow)"/>
  <text x="1044.745763" y="417.777655" text-anchor="middle" font-size="20.196751" fill="var(--bg)" font-family="Arial, sans-serif">Drivers</text>
  <rect x="40" y="195.555448" width="1200" height="111.111172" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.339158" filter="url(#shadow)"/>
  <text x="640" y="260" text-anchor="middle" font-size="22.322783" fill="var(--ok-accent)" font-family="Arial, sans-serif">Linux Kernel</text>
  <rect x="40" y="40" width="571.525424" height="111.111172" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.339158" filter="url(#shadow)"/>
  <text x="325.762712" y="104.444276" text-anchor="middle" font-size="20.196751" fill="var(--warn-accent)" font-family="Arial, sans-serif">Root Filesystem</text>
  <rect x="668.474576" y="40" width="571.525424" height="111.111172" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.339158" filter="url(#shadow)"/>
  <text x="954.237288" y="104.444276" text-anchor="middle" font-size="20.196751" fill="var(--warn-accent)" font-family="Arial, sans-serif">Applications</text>
</svg>

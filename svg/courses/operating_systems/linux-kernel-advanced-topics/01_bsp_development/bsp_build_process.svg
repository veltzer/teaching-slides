<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="358.523726" height="82.554728" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="7.293922" filter="url(#shadow)" />
  <text x="219.261863" y="89.744396" text-anchor="middle" font-size="22.185195" fill="var(--warn-accent)">Sources</text>
  <rect x="460.738025" y="40" width="358.523726" height="82.554728" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="7.293922" filter="url(#shadow)" />
  <text x="640" y="89.744396" text-anchor="middle" font-size="22.185195" fill="var(--warn-accent)">Patches</text>
  <rect x="881.476274" y="40" width="358.523726" height="82.554728" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="7.293922" filter="url(#shadow)" />
  <text x="1060.738137" y="89.744396" text-anchor="middle" font-size="22.185195" fill="var(--warn-accent)">Config</text>
  <line x1="219.261863" y1="122.554728" x2="640" y2="205.109455" stroke="var(--text-faint)" stroke-width="1.7778" />
  <line x1="640" y1="122.554728" x2="640" y2="205.109455" stroke="var(--text-faint)" stroke-width="1.7778" />
  <line x1="1060.738137" y1="122.554728" x2="640" y2="205.109455" stroke="var(--text-faint)" stroke-width="1.7778" />
  <rect x="460.738025" y="205.109455" width="358.523726" height="82.554728" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="7.293922" filter="url(#shadow)" />
  <text x="640" y="254.853983" text-anchor="middle" font-size="22.185195" fill="var(--primary-accent)">Build System</text>
  <line x1="640" y1="287.664315" x2="640" y2="363.868719" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="189.73638" y="363.868719" width="297.363796" height="82.554728" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.293922" filter="url(#shadow)" />
  <text x="338.418278" y="413.613115" text-anchor="middle" font-size="20.072267" fill="var(--ok-accent)">Bootloader</text>
  <rect x="506.080844" y="363.868719" width="297.363796" height="82.554728" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.293922" filter="url(#shadow)" />
  <text x="654.762742" y="413.613115" text-anchor="middle" font-size="20.072267" fill="var(--ok-accent)">Kernel</text>
  <rect x="822.425308" y="363.868719" width="297.363796" height="82.554728" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.293922" filter="url(#shadow)" />
  <text x="971.107206" y="413.613115" text-anchor="middle" font-size="20.072267" fill="var(--ok-accent)">RootFS</text>
  <line x1="338.418278" y1="446.423447" x2="640" y2="537.445272" stroke="var(--text-faint)" stroke-width="1.7778" />
  <line x1="654.762742" y1="446.423447" x2="640" y2="537.445272" stroke="var(--text-faint)" stroke-width="1.7778" />
  <line x1="971.107206" y1="446.423447" x2="640" y2="537.445272" stroke="var(--text-faint)" stroke-width="1.7778" />
  <rect x="460.738025" y="537.445272" width="358.523726" height="82.554728" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="7.293922" filter="url(#shadow)" />
  <text x="640" y="587.189799" text-anchor="middle" font-size="22.185195" fill="var(--bg)">BSP Image</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Inputs row -->
  <rect x="56" y="40" width="340" height="78" fill="#fff8e1" stroke="#f57c00" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="226" y="87" text-anchor="middle" font-size="21" fill="#e65100">Sources</text>
  <rect x="455" y="40" width="340" height="78" fill="#fff8e1" stroke="#f57c00" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="625" y="87" text-anchor="middle" font-size="21" fill="#e65100">Patches</text>
  <rect x="854" y="40" width="340" height="78" fill="#fff8e1" stroke="#f57c00" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="1024" y="87" text-anchor="middle" font-size="21" fill="#e65100">Config</text>
  <!-- Lines to build system -->
  <line x1="226" y1="118" x2="625" y2="196" stroke="#aaaaaa" stroke-width="2"/>
  <line x1="625" y1="118" x2="625" y2="196" stroke="#aaaaaa" stroke-width="2"/>
  <line x1="1024" y1="118" x2="625" y2="196" stroke="#aaaaaa" stroke-width="2"/>
  <!-- Build system -->
  <rect x="455" y="196" width="340" height="78" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="625" y="243" text-anchor="middle" font-size="21" fill="#0d47a1">Build System</text>
  <!-- Arrow down -->
  <line x1="625" y1="274" x2="625" y2="346" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- Outputs row -->
  <rect x="198" y="346" width="282" height="78" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="339" y="393" text-anchor="middle" font-size="19" fill="#1b5e20">Bootloader</text>
  <rect x="498" y="346" width="282" height="78" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="639" y="393" text-anchor="middle" font-size="19" fill="#1b5e20">Kernel</text>
  <rect x="798" y="346" width="282" height="78" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="939" y="393" text-anchor="middle" font-size="19" fill="#1b5e20">RootFS</text>
  <!-- Lines to image -->
  <line x1="339" y1="424" x2="625" y2="510" stroke="#aaaaaa" stroke-width="2"/>
  <line x1="639" y1="424" x2="625" y2="510" stroke="#aaaaaa" stroke-width="2"/>
  <line x1="939" y1="424" x2="625" y2="510" stroke="#aaaaaa" stroke-width="2"/>
  <!-- BSP Image -->
  <rect x="455" y="510" width="340" height="78" fill="url(#grad-accent)" stroke="#1565c0" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="625" y="557" text-anchor="middle" font-size="21" fill="#ffffff">BSP Image</text>
</svg>

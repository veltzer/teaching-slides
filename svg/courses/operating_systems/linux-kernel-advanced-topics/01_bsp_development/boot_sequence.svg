<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="1200" height="57.999964" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="13.145343" filter="url(#shadow)"/>
  <text x="640.000198" y="75.766482" text-anchor="middle" font-size="36.174891" fill="var(--danger-accent)" font-family="Arial, sans-serif">Power On</text>
  <line x1="640.000198" y1="97.999964" x2="640.000198" y2="127.000006" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="127.000006" width="1200" height="57.999964" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="13.145343" filter="url(#shadow)"/>
  <text x="640.000198" y="162.766488" text-anchor="middle" font-size="36.174891" fill="var(--warn-accent)" font-family="Arial, sans-serif">ROM Code</text>
  <line x1="640.000198" y1="184.99997" x2="640.000198" y2="214.000012" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="214.000012" width="1200" height="57.999964" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="13.145343" filter="url(#shadow)"/>
  <text x="640.000198" y="249.766494" text-anchor="middle" font-size="36.174891" fill="var(--warn-accent)" font-family="Arial, sans-serif">SPL/MLO</text>
  <line x1="640.000198" y1="271.999976" x2="640.000198" y2="301.000018" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="301.000018" width="1200" height="57.999964" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="13.145343" filter="url(#shadow)"/>
  <text x="640.000198" y="336.7665" text-anchor="middle" font-size="36.174891" fill="var(--bg)" font-family="Arial, sans-serif">U-Boot</text>
  <line x1="640.000198" y1="358.999982" x2="640.000198" y2="388.000024" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="388.000024" width="1200" height="57.999964" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="13.145343" filter="url(#shadow)"/>
  <text x="640.000198" y="423.766506" text-anchor="middle" font-size="36.174891" fill="var(--ok-accent)" font-family="Arial, sans-serif">Kernel</text>
  <line x1="640.000198" y1="445.999988" x2="640.000198" y2="475.00003" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="475.00003" width="1200" height="57.999964" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="13.145343" filter="url(#shadow)"/>
  <text x="640.000198" y="510.766512" text-anchor="middle" font-size="36.174891" fill="var(--primary-accent)" font-family="Arial, sans-serif">Init</text>
  <line x1="640.000198" y1="532.999994" x2="640.000198" y2="562.000036" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="562.000036" width="1200" height="57.999964" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="13.145343" filter="url(#shadow)"/>
  <text x="640.000198" y="597.766518" text-anchor="middle" font-size="36.174891" fill="var(--ok-accent)" font-family="Arial, sans-serif">Userspace</text>
</svg>
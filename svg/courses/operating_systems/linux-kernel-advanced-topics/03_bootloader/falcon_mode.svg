<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <text x="640" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="var(--text)">Normal vs Falcon Boot Path</text>

  <rect x="40" y="100" width="1200" height="230" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="80" y="145" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--text)">Normal</text>
  <text x="80" y="175" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">SPL loads U-Boot, U-Boot loads kernel — flexible, slower</text>

  <rect x="80" y="200" width="320" height="110" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="240" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--danger-text)">SPL</text>

  <rect x="480" y="200" width="320" height="110" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--primary-text)">U-Boot</text>

  <rect x="880" y="200" width="320" height="110" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1040" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--ok-text)">Kernel</text>

  <line x1="400" y1="255" x2="480" y2="255" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="255" x2="880" y2="255" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="360" width="1200" height="260" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="80" y="405" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--text)">Falcon</text>
  <text x="80" y="435" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">SPL jumps directly to kernel — fast boot for fixed hardware</text>

  <rect x="120" y="465" width="440" height="130" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="340" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--danger-text)">SPL</text>

  <rect x="720" y="465" width="440" height="130" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="940" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--ok-text)">Kernel</text>

  <line x1="560" y1="530" x2="720" y2="530" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">skip U-Boot</text>
</svg>

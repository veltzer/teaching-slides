<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-weight="bold">Normal vs Falcon Mode</text>
  <text x="320" y="168">Normal:</text>
  <rect x="80" y="192" width="128" height="120" fill="#FFE6E6" stroke="black" />
  <text x="144" y="264" text-anchor="middle">SPL</text>
  <rect x="240" y="192" width="128" height="120" fill="#E6F2FF" stroke="black" />
  <text x="304" y="264" text-anchor="middle">U-Boot</text>
  <rect x="400" y="192" width="128" height="120" fill="#E6FFE6" stroke="black" />
  <text x="464" y="264" text-anchor="middle">Kernel</text>
  <text x="320" y="432">Falcon:</text>
  <rect x="80" y="456" width="128" height="120" fill="#FFE6E6" stroke="black" />
  <text x="144" y="528" text-anchor="middle">SPL</text>
  <rect x="240" y="456" width="128" height="120" fill="#E6FFE6" stroke="black" />
  <text x="304" y="528" text-anchor="middle">Kernel</text>
  <line x1="208" y1="252" x2="240" y2="252" stroke="black" marker-end="url(#arrow)" />
  <line x1="368" y1="252" x2="400" y2="252" stroke="black" marker-end="url(#arrow)" />
  <line x1="208" y1="516" x2="240" y2="516" stroke="black" marker-end="url(#arrow)" />
  <defs>
    <marker id="arrow" markerWidth="16" markerHeight="24" refX="14.4" refY="7.2" orient="auto">
      <polygon points="0,24 4.8,0" />
    </marker>
  </defs>
</svg>
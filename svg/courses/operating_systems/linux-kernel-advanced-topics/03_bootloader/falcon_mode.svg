<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="1200" height="256.538462189349" rx="6.336706445031" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="80" y="90.192307244822" font-family="Arial, sans-serif" font-size="25.346824751682" font-weight="bold" fill="var(--text)">Normal</text>
  <text x="80" y="123.653846113166" font-family="Arial, sans-serif" font-size="16.897883167788" fill="var(--text-muted)">SPL loads U-Boot, U-Boot loads kernel — flexible, slower</text>

  <rect x="80" y="151.538461131657" width="320" height="122.692307773669" rx="6.336706445031" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="224.038461660503" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.459060918987" font-weight="bold" fill="var(--danger-text)">SPL</text>

  <rect x="480" y="151.538461131657" width="320" height="122.692307773669" rx="6.336706445031" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="224.038461660503" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.459060918987" font-weight="bold" fill="var(--primary-text)">U-Boot</text>

  <rect x="880" y="151.538461131657" width="320" height="122.692307773669" rx="6.336706445031" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1040" y="224.038461660503" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.459060918987" font-weight="bold" fill="var(--ok-text)">Kernel</text>

  <line x1="400" y1="212.884615018491" x2="480" y2="212.884615018491" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="212.884615018491" x2="880" y2="212.884615018491" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="330" width="1200" height="290" rx="6.336706445031" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="80" y="380.192307244822" font-family="Arial, sans-serif" font-size="25.346824751682" font-weight="bold" fill="var(--text)">Falcon</text>
  <text x="80" y="413.653846113166" font-family="Arial, sans-serif" font-size="16.897883167788" fill="var(--text-muted)">SPL jumps directly to kernel — fast boot for fixed hardware</text>

  <rect x="120" y="447.115384981509" width="440" height="145" rx="6.336706445031" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="530.769231094675" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.57129605785" font-weight="bold" fill="var(--danger-text)">SPL</text>

  <rect x="720" y="447.115384981509" width="440" height="145" rx="6.336706445031" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="530.769231094675" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.57129605785" font-weight="bold" fill="var(--ok-text)">Kernel</text>

  <line x1="560" y1="519.615384452663" x2="720" y2="519.615384452663" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="502.884615018491" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785648028925" fill="var(--text-muted)">skip U-Boot</text>
</svg>

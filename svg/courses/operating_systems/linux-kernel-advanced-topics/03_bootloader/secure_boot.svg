<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="682.857143" y="40" text-anchor="middle" font-size="28.422828" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Secure Boot Chain of Trust</text>
  <rect x="40" y="95.769231" width="283.928571" height="457.307692" rx="6.559114" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="181.964286" y="285.384615" text-anchor="middle" font-size="34.981942" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">ROM</text>
  <text x="181.964286" y="352.307692" text-anchor="middle" font-size="19.677342" fill="var(--danger-text)" font-family="Arial, sans-serif">Root of trust</text>
  <line x1="329.285714" y1="324.423077" x2="340" y2="324.423077" stroke="var(--ok-border)" stroke-width="3" marker-end="url(#arrow-ok)"/>
  <text x="334.642857" y="313.269231" text-anchor="middle" font-size="15.3046" fill="var(--text-muted)" font-family="Arial, sans-serif">verifies</text>
  <rect x="345.357143" y="95.769231" width="283.928571" height="457.307692" rx="6.559114" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="487.321429" y="285.384615" text-anchor="middle" font-size="34.981942" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">SPL</text>
  <text x="487.321429" y="352.307692" text-anchor="middle" font-size="19.677342" fill="var(--primary-text)" font-family="Arial, sans-serif">signed, verified</text>
  <line x1="634.642857" y1="324.423077" x2="645.357143" y2="324.423077" stroke="var(--ok-border)" stroke-width="3" marker-end="url(#arrow-ok)"/>
  <text x="640" y="313.269231" text-anchor="middle" font-size="15.3046" fill="var(--text-muted)" font-family="Arial, sans-serif">verifies</text>
  <rect x="650.714286" y="95.769231" width="283.928571" height="457.307692" rx="6.559114" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="792.678571" y="285.384615" text-anchor="middle" font-size="34.981942" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">U-Boot</text>
  <text x="792.678571" y="352.307692" text-anchor="middle" font-size="19.677342" fill="var(--info-text)" font-family="Arial, sans-serif">signed, verified</text>
  <line x1="940" y1="324.423077" x2="950.714286" y2="324.423077" stroke="var(--ok-border)" stroke-width="3" marker-end="url(#arrow-ok)"/>
  <text x="945.357143" y="313.269231" text-anchor="middle" font-size="15.3046" fill="var(--text-muted)" font-family="Arial, sans-serif">verifies</text>
  <rect x="956.071429" y="95.769231" width="283.928571" height="457.307692" rx="6.559114" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1098.035714" y="285.384615" text-anchor="middle" font-size="34.981942" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Kernel</text>
  <text x="1098.035714" y="352.307692" text-anchor="middle" font-size="19.677342" fill="var(--ok-text)" font-family="Arial, sans-serif">signed, verified</text>
  <text x="682.857143" y="620" text-anchor="middle" font-size="19.677342" fill="var(--text-muted)" font-family="Arial, sans-serif">Each stage verifies the signature of the next</text>
</svg>

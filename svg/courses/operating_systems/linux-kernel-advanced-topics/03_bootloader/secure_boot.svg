<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
  </defs>
  <text x="682.857143" y="40" text-anchor="middle" font-size="28.422828" font-weight="bold" fill="var(--text)">Secure Boot Chain of Trust</text>
  <rect x="40" y="95.769231" width="283.928571" height="457.307692" rx="6.559114" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="181.964286" y="285.384615" text-anchor="middle" font-size="34.981942" font-weight="bold" fill="var(--danger-text)">ROM</text>
  <text x="181.964286" y="352.307692" text-anchor="middle" font-size="19.677342" fill="var(--danger-text)">Root of trust</text>
  <line x1="329.285714" y1="324.423077" x2="340" y2="324.423077" stroke="var(--ok-border)" stroke-width="3" marker-end="url(#arrow-ok)"/>
  <text x="334.642857" y="313.269231" text-anchor="middle" font-size="15.3046" fill="var(--text-muted)">verifies</text>
  <rect x="345.357143" y="95.769231" width="283.928571" height="457.307692" rx="6.559114" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="487.321429" y="285.384615" text-anchor="middle" font-size="34.981942" font-weight="bold" fill="var(--primary-text)">SPL</text>
  <text x="487.321429" y="352.307692" text-anchor="middle" font-size="19.677342" fill="var(--primary-text)">signed, verified</text>
  <line x1="634.642857" y1="324.423077" x2="645.357143" y2="324.423077" stroke="var(--ok-border)" stroke-width="3" marker-end="url(#arrow-ok)"/>
  <text x="640" y="313.269231" text-anchor="middle" font-size="15.3046" fill="var(--text-muted)">verifies</text>
  <rect x="650.714286" y="95.769231" width="283.928571" height="457.307692" rx="6.559114" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="792.678571" y="285.384615" text-anchor="middle" font-size="34.981942" font-weight="bold" fill="var(--info-text)">U-Boot</text>
  <text x="792.678571" y="352.307692" text-anchor="middle" font-size="19.677342" fill="var(--info-text)">signed, verified</text>
  <line x1="940" y1="324.423077" x2="950.714286" y2="324.423077" stroke="var(--ok-border)" stroke-width="3" marker-end="url(#arrow-ok)"/>
  <text x="945.357143" y="313.269231" text-anchor="middle" font-size="15.3046" fill="var(--text-muted)">verifies</text>
  <rect x="956.071429" y="95.769231" width="283.928571" height="457.307692" rx="6.559114" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1098.035714" y="285.384615" text-anchor="middle" font-size="34.981942" font-weight="bold" fill="var(--ok-text)">Kernel</text>
  <text x="1098.035714" y="352.307692" text-anchor="middle" font-size="19.677342" fill="var(--ok-text)">signed, verified</text>
  <text x="682.857143" y="620" text-anchor="middle" font-size="19.677342" fill="var(--text-muted)">Each stage verifies the signature of the next</text>
</svg>

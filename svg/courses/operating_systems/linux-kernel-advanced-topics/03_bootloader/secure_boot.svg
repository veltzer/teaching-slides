<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
  </defs>
  <text x="640" y="60" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--text)">Secure Boot Chain of Trust</text>
  <rect x="40" y="110" width="265" height="410" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="172.5" y="280" text-anchor="middle" font-size="32" font-weight="bold" fill="var(--danger-text)">ROM</text>
  <text x="172.5" y="340" text-anchor="middle" font-size="18" fill="var(--danger-text)">Root of trust</text>
  <line x1="310" y1="315" x2="320" y2="315" stroke="var(--ok-border)" stroke-width="3" marker-end="url(#arrow-ok)"/>
  <text x="315.0" y="305" text-anchor="middle" font-size="14" fill="var(--text-muted)">verifies</text>
  <rect x="325" y="110" width="265" height="410" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="457.5" y="280" text-anchor="middle" font-size="32" font-weight="bold" fill="var(--primary-text)">SPL</text>
  <text x="457.5" y="340" text-anchor="middle" font-size="18" fill="var(--primary-text)">signed, verified</text>
  <line x1="595" y1="315" x2="605" y2="315" stroke="var(--ok-border)" stroke-width="3" marker-end="url(#arrow-ok)"/>
  <text x="600.0" y="305" text-anchor="middle" font-size="14" fill="var(--text-muted)">verifies</text>
  <rect x="610" y="110" width="265" height="410" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="742.5" y="280" text-anchor="middle" font-size="32" font-weight="bold" fill="var(--info-text)">U-Boot</text>
  <text x="742.5" y="340" text-anchor="middle" font-size="18" fill="var(--info-text)">signed, verified</text>
  <line x1="880" y1="315" x2="890" y2="315" stroke="var(--ok-border)" stroke-width="3" marker-end="url(#arrow-ok)"/>
  <text x="885.0" y="305" text-anchor="middle" font-size="14" fill="var(--text-muted)">verifies</text>
  <rect x="895" y="110" width="265" height="410" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1027.5" y="280" text-anchor="middle" font-size="32" font-weight="bold" fill="var(--ok-text)">Kernel</text>
  <text x="1027.5" y="340" text-anchor="middle" font-size="18" fill="var(--ok-text)">signed, verified</text>
  <text x="640" y="580" text-anchor="middle" font-size="18" fill="var(--text-muted)">Each stage verifies the signature of the next</text>
</svg>

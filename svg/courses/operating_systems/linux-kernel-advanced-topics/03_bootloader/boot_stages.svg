<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="80" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Linux Boot Stages: From Power-On to Kernel</text>

  <rect x="40" y="160" width="280" height="320" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--danger-text)">ROM Boot</text>
  <text x="180" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--danger-text)">Stage 0</text>
  <text x="180" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">Runs from SoC mask ROM</text>
  <text x="180" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">Minimal CPU init</text>
  <text x="180" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">Finds boot device</text>
  <text x="180" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">Loads SPL into SRAM</text>

  <rect x="340" y="160" width="280" height="320" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--primary-text)">SPL / MLO</text>
  <text x="480" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">Stage 1</text>
  <text x="480" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Small secondary loader</text>
  <text x="480" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Initializes DRAM</text>
  <text x="480" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Sets up clocks</text>
  <text x="480" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Loads U-Boot</text>

  <rect x="640" y="160" width="280" height="320" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="780" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--ok-text)">U-Boot</text>
  <text x="780" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--ok-text)">Stage 2</text>
  <text x="780" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Full bootloader</text>
  <text x="780" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Drivers, network, env</text>
  <text x="780" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Loads kernel + dtb</text>
  <text x="780" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Jumps to kernel</text>

  <rect x="940" y="160" width="300" height="320" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--warn-text)">Kernel</text>
  <text x="1090" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--warn-text)">Stage 3</text>
  <text x="1090" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Decompresses itself</text>
  <text x="1090" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Parses device tree</text>
  <text x="1090" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Mounts rootfs</text>
  <text x="1090" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Starts PID 1 (init)</text>

  <line x1="320" y1="320" x2="340" y2="320" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="620" y1="320" x2="640" y2="320" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="920" y1="320" x2="940" y2="320" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="510" width="1200" height="110" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Each stage bootstraps the next: more hardware initialized, more memory available</text>
  <text x="640" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--info-text)">ROM (bytes) to SPL (KB in SRAM) to U-Boot (MB in DRAM) to Kernel (full system)</text>
</svg>

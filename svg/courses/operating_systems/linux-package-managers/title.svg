<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <g transform="translate(0,60)">
    <rect x="340" y="127" width="600" height="406" rx="6" fill="var(--black)" stroke="var(--text)" stroke-width="2.8"/>
    <rect x="340" y="127" width="600" height="43.5" rx="6" fill="var(--text)"/>
    <rect x="340" y="156" width="600" height="14.5" fill="var(--text)" rx="6"/>
    <circle cx="370" cy="148.75" r="8.3" fill="var(--danger-fill)"/>
    <circle cx="400" cy="148.75" r="8.3" fill="var(--warn-fill)"/>
    <circle cx="430" cy="148.75" r="8.3" fill="var(--ok-fill)"/>
    <text x="640" y="154.5" text-anchor="middle" font-size="16" fill="var(--text-faint)" font-family="Arial, sans-serif">Terminal</text>
    <text x="370" y="206" font-size="18" fill="var(--ok-accent)" font-family="Courier New, monospace">$ apt install nginx</text>
    <text x="370" y="232" font-size="18" fill="var(--border)" font-family="Courier New, monospace">Setting up nginx ...</text>
    <text x="370" y="266" font-size="18" fill="var(--ok-accent)" font-family="Courier New, monospace">$ dnf upgrade --refresh</text>
    <text x="370" y="292" font-size="18" fill="var(--border)" font-family="Courier New, monospace">Complete!</text>
    <text x="370" y="326" font-size="18" fill="var(--ok-accent)" font-family="Courier New, monospace">$ flatpak install gimp</text>
    <text x="370" y="360" font-size="18" fill="var(--ok-accent)" font-family="Courier New, monospace">$ pipx install black</text>
    <text x="370" y="386" font-size="18" fill="var(--border)" font-family="Courier New, monospace">installed package black</text>
    <text x="370" y="420" font-size="18" fill="var(--ok-accent)" font-family="Courier New, monospace">$ cargo install ripgrep</text>
    <text x="370" y="454" font-size="18" fill="var(--ok-accent)" font-family="Courier New, monospace">$ snap refresh</text>
    <text x="370" y="488" font-size="18" fill="var(--ok-accent)" font-family="Courier New, monospace">$ _</text>
    <rect x="145" y="214" width="120" height="87" rx="6" fill="none" stroke="var(--border)" stroke-width="1" opacity="0.5"/>
    <text x="205" y="250" text-anchor="middle" font-size="13" fill="var(--primary-accent)" font-family="Arial, sans-serif">apt</text>
    <text x="205" y="282" text-anchor="middle" font-size="22" fill="var(--primary-accent)" opacity="0.7" font-family="Arial, sans-serif">.deb</text>
    <rect x="145" y="344" width="120" height="87" rx="6" fill="none" stroke="var(--border)" stroke-width="1" opacity="0.5"/>
    <text x="205" y="380" text-anchor="middle" font-size="13" fill="var(--primary-accent)" font-family="Arial, sans-serif">dnf</text>
    <text x="205" y="412" text-anchor="middle" font-size="22" fill="var(--primary-accent)" opacity="0.7" font-family="Arial, sans-serif">.rpm</text>
    <rect x="1015" y="214" width="120" height="87" rx="6" fill="none" stroke="var(--border)" stroke-width="1" opacity="0.5"/>
    <text x="1075" y="250" text-anchor="middle" font-size="13" fill="var(--primary-accent)" font-family="Arial, sans-serif">flatpak</text>
    <text x="1075" y="282" text-anchor="middle" font-size="22" fill="var(--primary-accent)" opacity="0.7" font-family="Arial, sans-serif">snap</text>
    <rect x="1015" y="344" width="120" height="87" rx="6" fill="none" stroke="var(--border)" stroke-width="1" opacity="0.5"/>
    <text x="1075" y="380" text-anchor="middle" font-size="13" fill="var(--primary-accent)" font-family="Arial, sans-serif">pip / cargo</text>
    <text x="1075" y="412" text-anchor="middle" font-size="22" fill="var(--primary-accent)" opacity="0.7" font-family="Arial, sans-serif">npm / go</text>
  </g>
  <text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">Linux Package Managers</text>
  <text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">From apt to cargo to flatpak</text>
</svg>

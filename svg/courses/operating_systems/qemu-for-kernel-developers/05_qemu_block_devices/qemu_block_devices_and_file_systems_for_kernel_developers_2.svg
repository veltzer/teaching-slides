<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="30.807319" font-weight="bold" fill="var(--text)">QEMU Block Layer Stack</text>

  <rect x="40" y="71.636364" width="780" height="126.545455" rx="6.161464" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="430" y="124.363636" text-anchor="middle" font-size="24.645855" font-weight="bold" fill="var(--primary-text)">Guest Kernel Block Layer</text>
  <text x="430" y="166.545455" text-anchor="middle" font-size="18.484391" fill="var(--primary-text)">bio submission, I/O scheduler, bounce buffers</text>
  <rect x="840" y="71.636364" width="400" height="126.545455" rx="6.161464" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1040" y="119.090909" text-anchor="middle" font-size="20.538213" font-weight="bold" fill="var(--text)">Guest</text>
  <text x="1040" y="161.272727" text-anchor="middle" font-size="16.43057" fill="var(--text-muted)">kernel code in the VM</text>

  <line x1="430" y1="198.181818" x2="430" y2="224.545455" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="229.818182" width="780" height="126.545455" rx="6.161464" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="430" y="282.545455" text-anchor="middle" font-size="24.645855" font-weight="bold" fill="var(--info-text)">Device Frontend</text>
  <text x="430" y="324.727273" text-anchor="middle" font-size="18.484391" fill="var(--info-text)">virtio-blk, virtio-scsi, NVMe emulation</text>
  <rect x="840" y="229.818182" width="400" height="126.545455" rx="6.161464" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1040" y="277.272727" text-anchor="middle" font-size="20.538213" font-weight="bold" fill="var(--text)">Boundary</text>
  <text x="1040" y="319.454545" text-anchor="middle" font-size="16.43057" fill="var(--text-muted)">guest to hypervisor</text>

  <line x1="430" y1="356.363636" x2="430" y2="382.727273" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="388" width="780" height="126.545455" rx="6.161464" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="430" y="440.727273" text-anchor="middle" font-size="24.645855" font-weight="bold" fill="var(--ok-text)">QEMU Block Driver</text>
  <text x="430" y="482.909091" text-anchor="middle" font-size="18.484391" fill="var(--ok-text)">qcow2 / raw / format graph, snapshots, backing</text>
  <rect x="840" y="388" width="400" height="126.545455" rx="6.161464" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1040" y="435.454545" text-anchor="middle" font-size="20.538213" font-weight="bold" fill="var(--text)">QEMU</text>
  <text x="1040" y="477.636364" text-anchor="middle" font-size="16.43057" fill="var(--text-muted)">user-space process</text>

  <line x1="430" y1="514.545455" x2="430" y2="540.909091" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="546.181818" width="780" height="73.818182" rx="6.161464" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="430" y="593.636364" text-anchor="middle" font-size="22.592034" font-weight="bold" fill="var(--danger-text)">Host I/O: AIO / io_uring / thread pool</text>
  <rect x="840" y="546.181818" width="400" height="73.818182" rx="6.161464" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1040" y="593.636364" text-anchor="middle" font-size="20.538213" font-weight="bold" fill="var(--text)">Host kernel</text>
</svg>

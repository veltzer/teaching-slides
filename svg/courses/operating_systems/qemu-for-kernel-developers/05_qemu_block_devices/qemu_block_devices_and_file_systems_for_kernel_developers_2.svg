<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="30.807319" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">QEMU Block Layer Stack</text>

  <rect x="40" y="71.636364" width="780" height="126.545455" rx="6.161464" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="430" y="124.363636" text-anchor="middle" font-size="24.645855" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Guest Kernel Block Layer</text>
  <text x="430" y="166.545455" text-anchor="middle" font-size="18.484391" fill="var(--primary-text)" font-family="Arial, sans-serif">bio submission, I/O scheduler, bounce buffers</text>
  <rect x="840" y="71.636364" width="400" height="126.545455" rx="6.161464" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1040" y="119.090909" text-anchor="middle" font-size="20.538213" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Guest</text>
  <text x="1040" y="161.272727" text-anchor="middle" font-size="16.43057" fill="var(--text-muted)" font-family="Arial, sans-serif">kernel code in the VM</text>

  <line x1="430" y1="198.181818" x2="430" y2="224.545455" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="229.818182" width="780" height="126.545455" rx="6.161464" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="430" y="282.545455" text-anchor="middle" font-size="24.645855" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Device Frontend</text>
  <text x="430" y="324.727273" text-anchor="middle" font-size="18.484391" fill="var(--info-text)" font-family="Arial, sans-serif">virtio-blk, virtio-scsi, NVMe emulation</text>
  <rect x="840" y="229.818182" width="400" height="126.545455" rx="6.161464" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1040" y="277.272727" text-anchor="middle" font-size="20.538213" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Boundary</text>
  <text x="1040" y="319.454545" text-anchor="middle" font-size="16.43057" fill="var(--text-muted)" font-family="Arial, sans-serif">guest to hypervisor</text>

  <line x1="430" y1="356.363636" x2="430" y2="382.727273" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="388" width="780" height="126.545455" rx="6.161464" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="430" y="440.727273" text-anchor="middle" font-size="24.645855" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">QEMU Block Driver</text>
  <text x="430" y="482.909091" text-anchor="middle" font-size="18.484391" fill="var(--ok-text)" font-family="Arial, sans-serif">qcow2 / raw / format graph, snapshots, backing</text>
  <rect x="840" y="388" width="400" height="126.545455" rx="6.161464" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1040" y="435.454545" text-anchor="middle" font-size="20.538213" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">QEMU</text>
  <text x="1040" y="477.636364" text-anchor="middle" font-size="16.43057" fill="var(--text-muted)" font-family="Arial, sans-serif">user-space process</text>

  <line x1="430" y1="514.545455" x2="430" y2="540.909091" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="546.181818" width="780" height="73.818182" rx="6.161464" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="430" y="593.636364" text-anchor="middle" font-size="22.592034" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Host I/O: AIO / io_uring / thread pool</text>
  <rect x="840" y="546.181818" width="400" height="73.818182" rx="6.161464" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1040" y="593.636364" text-anchor="middle" font-size="20.538213" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Host kernel</text>
</svg>

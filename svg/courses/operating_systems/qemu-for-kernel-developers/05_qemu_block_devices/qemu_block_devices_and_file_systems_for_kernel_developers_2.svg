<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="780" height="133.84615441568" rx="6.336706445031" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="430" y="95.769230036982" text-anchor="middle" font-size="25.346824751682" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Guest Kernel Block Layer</text>
  <text x="430" y="140.384615547337" text-anchor="middle" font-size="19.010118306651" fill="var(--primary-text)" font-family="Arial, sans-serif">bio submission, I/O scheduler, bounce buffers</text>
  <rect x="840" y="40" width="400" height="133.84615441568" rx="6.336706445031" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1040" y="90.192307244822" text-anchor="middle" font-size="21.122354473956" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Guest</text>
  <text x="1040" y="134.807691697485" text-anchor="middle" font-size="16.897883167788" fill="var(--text-muted)" font-family="Arial, sans-serif">kernel code in the VM</text>

  <line x1="430" y1="173.846153357988" x2="430" y2="201.730769434172" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="40" y="207.307692226331" width="780" height="133.84615441568" rx="6.336706445031" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="430" y="263.076923321006" text-anchor="middle" font-size="25.346824751682" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Device Frontend</text>
  <text x="430" y="307.692307773669" text-anchor="middle" font-size="19.010118306651" fill="var(--info-text)" font-family="Arial, sans-serif">virtio-blk, virtio-scsi, NVMe emulation</text>
  <rect x="840" y="207.307692226331" width="400" height="133.84615441568" rx="6.336706445031" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1040" y="257.499999471154" text-anchor="middle" font-size="21.122354473956" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Boundary</text>
  <text x="1040" y="302.115383923817" text-anchor="middle" font-size="16.897883167788" fill="var(--text-muted)" font-family="Arial, sans-serif">guest to hypervisor</text>

  <line x1="430" y1="341.153845584319" x2="430" y2="369.038461660503" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="40" y="374.615384452663" width="780" height="133.84615441568" rx="6.336706445031" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="430" y="430.384615547337" text-anchor="middle" font-size="25.346824751682" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">QEMU Block Driver</text>
  <text x="430" y="475" text-anchor="middle" font-size="19.010118306651" fill="var(--ok-text)" font-family="Arial, sans-serif">qcow2 / raw / format graph, snapshots, backing</text>
  <rect x="840" y="374.615384452663" width="400" height="133.84615441568" rx="6.336706445031" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1040" y="424.807691697485" text-anchor="middle" font-size="21.122354473956" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">QEMU</text>
  <text x="1040" y="469.42307720784" text-anchor="middle" font-size="16.897883167788" fill="var(--text-muted)" font-family="Arial, sans-serif">user-space process</text>

  <line x1="430" y1="508.461538868343" x2="430" y2="536.346153886834" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="40" y="541.923076678994" width="780" height="78.076923321006" rx="6.336706445031" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="430" y="592.115384981509" text-anchor="middle" font-size="23.234589612819" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Host I/O: AIO / io_uring / thread pool</text>
  <rect x="840" y="541.923076678994" width="400" height="78.076923321006" rx="6.336706445031" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1040" y="592.115384981509" text-anchor="middle" font-size="21.122354473956" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Host kernel</text>
</svg>

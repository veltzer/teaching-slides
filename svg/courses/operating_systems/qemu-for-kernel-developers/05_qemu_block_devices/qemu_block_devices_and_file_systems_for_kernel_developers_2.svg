<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="54" text-anchor="middle" font-size="25.6" font-weight="bold">QEMU Block Layer Stack</text>
  <rect x="362.6667" y="90" width="554.6667" height="108" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="162" text-anchor="middle" font-size="23.4667">Guest Kernel Block Layer (bio)</text>
  <rect x="362.6667" y="234" width="554.6667" height="108" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="306" text-anchor="middle" font-size="23.4667">Device Frontend (virtio-blk/SCSI)</text>
  <rect x="362.6667" y="378" width="554.6667" height="108" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="450" text-anchor="middle" font-size="23.4667">QEMU Block Driver (qcow2/raw)</text>
  <rect x="362.6667" y="522" width="554.6667" height="108" fill="#ffebee" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="594" text-anchor="middle" font-size="23.4667">Host I/O (AIO / io_uring / thread)</text>
  <line x1="640" y1="198" x2="640" y2="234" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowd1_04_qemu_block_devices)" />
  <line x1="640" y1="342" x2="640" y2="378" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowd1_04_qemu_block_devices)" />
  <line x1="640" y1="486" x2="640" y2="522" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowd1_04_qemu_block_devices)" />
  <text x="981.3333" y="162" text-anchor="start" font-size="21.3333" fill="#555">Guest</text>
  <text x="981.3333" y="306" text-anchor="start" font-size="21.3333" fill="#555">Boundary</text>
  <line x1="938.6667" y1="216" x2="1152" y2="216" stroke="#999" stroke-width="2.1333" stroke-dasharray="8.5333" />
  <text x="981.3333" y="450" text-anchor="start" font-size="21.3333" fill="#555">QEMU</text>
  <text x="981.3333" y="594" text-anchor="start" font-size="21.3333" fill="#555">Host</text>
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arrowd1_04_qemu_block_devices" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />

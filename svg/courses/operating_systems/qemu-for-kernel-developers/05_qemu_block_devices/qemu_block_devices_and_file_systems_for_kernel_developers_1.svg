<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="273.2673" height="312.307692307692" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.336706254344" filter="url(#shadow)"/>
  <text x="175.4455" y="129.230769230769" text-anchor="middle" font-size="27.571431359736" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">qcow2</text>
  <text x="175.4455" y="196.153846153846" text-anchor="middle" font-size="25.064841589059" font-family="Arial, sans-serif" fill="var(--primary-text)">Copy-on-write</text>
  <text x="175.4455" y="254.153846153846" text-anchor="middle" font-size="25.064841589059" font-family="Arial, sans-serif" fill="var(--primary-text)">Snapshots</text>
  <text x="175.4455" y="312.153846153846" text-anchor="middle" font-size="25.064841589059" fill="var(--text-muted)" font-family="Arial, sans-serif">Thin provision</text>
  <rect x="348.911" y="40" width="273.2673" height="312.307692307692" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.336706254344" filter="url(#shadow)"/>
  <text x="484.3565" y="129.230769230769" text-anchor="middle" font-size="27.571431359736" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">raw</text>
  <text x="484.3565" y="196.153846153846" text-anchor="middle" font-size="25.064841589059" font-family="Arial, sans-serif" fill="var(--info-text)">Direct access</text>
  <text x="484.3565" y="254.153846153846" text-anchor="middle" font-size="25.064841589059" font-family="Arial, sans-serif" fill="var(--info-text)">Best perf</text>
  <text x="484.3565" y="312.153846153846" text-anchor="middle" font-size="25.064841589059" fill="var(--text-muted)" font-family="Arial, sans-serif">No features</text>
  <rect x="657.8218" y="40" width="273.2673" height="312.307692307692" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.336706254344" filter="url(#shadow)"/>
  <text x="793.2674" y="129.230769230769" text-anchor="middle" font-size="27.571431359736" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">NBD</text>
  <text x="793.2674" y="196.153846153846" text-anchor="middle" font-size="25.064841589059" font-family="Arial, sans-serif" fill="var(--ok-text)">Network block</text>
  <text x="793.2674" y="254.153846153846" text-anchor="middle" font-size="25.064841589059" font-family="Arial, sans-serif" fill="var(--ok-text)">Remote storage</text>
  <text x="793.2674" y="312.153846153846" text-anchor="middle" font-size="25.064841589059" fill="var(--text-muted)" font-family="Arial, sans-serif">TCP/Unix sock</text>
  <rect x="966.7327" y="40" width="273.2673" height="312.307692307692" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.336706254344" filter="url(#shadow)"/>
  <text x="1102.1783" y="129.230769230769" text-anchor="middle" font-size="27.571431359736" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Host Device</text>
  <text x="1102.1783" y="196.153846153846" text-anchor="middle" font-size="25.064841589059" font-family="Arial, sans-serif" fill="var(--warn-text)">/dev/sdX</text>
  <text x="1102.1783" y="254.153846153846" text-anchor="middle" font-size="25.064841589059" font-family="Arial, sans-serif" fill="var(--warn-text)">Passthrough</text>
  <text x="1102.1783" y="312.153846153846" text-anchor="middle" font-size="25.064841589059" fill="var(--text-muted)" font-family="Arial, sans-serif">Direct I/O</text>
  <line x1="175.4455" y1="374.615384615385" x2="175.4455" y2="486.153846153846" stroke="var(--text)" stroke-width="2"/>
  <line x1="484.3565" y1="374.615384615385" x2="484.3565" y2="486.153846153846" stroke="var(--text)" stroke-width="2"/>
  <line x1="793.2674" y1="374.615384615385" x2="793.2674" y2="486.153846153846" stroke="var(--text)" stroke-width="2"/>
  <line x1="1102.1783" y1="374.615384615385" x2="1102.1783" y2="486.153846153846" stroke="var(--text)" stroke-width="2"/>
  <rect x="40" y="486.153846153846" width="1200" height="133.846153846154" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.336706254344" filter="url(#shadow)"/>
  <text x="638.8119" y="575.384615384615" text-anchor="middle" font-size="27.571431359736" font-family="Arial, sans-serif" fill="var(--danger-text)">Device Frontend: IDE / SCSI / virtio-blk / NVMe</text>
</svg>

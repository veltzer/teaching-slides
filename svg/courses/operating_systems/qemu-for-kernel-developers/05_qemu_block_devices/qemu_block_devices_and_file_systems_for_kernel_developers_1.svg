<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="729.109" y="40" text-anchor="middle" font-size="28.4796" font-weight="bold">QEMU Storage Backends</text>
  <rect x="40" y="100" width="273.2673" height="280" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="175.4455" y="180" text-anchor="middle" font-size="26.1064" font-weight="bold">qcow2</text>
  <text x="175.4455" y="240" text-anchor="middle" font-size="23.733">Copy-on-write</text>
  <text x="175.4455" y="292" text-anchor="middle" font-size="23.733">Snapshots</text>
  <text x="175.4455" y="344" text-anchor="middle" font-size="23.733" fill="var(--text-muted)">Thin provision</text>
  <rect x="348.911" y="100" width="273.2673" height="280" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="484.3565" y="180" text-anchor="middle" font-size="26.1064" font-weight="bold">raw</text>
  <text x="484.3565" y="240" text-anchor="middle" font-size="23.733">Direct access</text>
  <text x="484.3565" y="292" text-anchor="middle" font-size="23.733">Best perf</text>
  <text x="484.3565" y="344" text-anchor="middle" font-size="23.733" fill="var(--text-muted)">No features</text>
  <rect x="657.8218" y="100" width="273.2673" height="280" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="793.2674" y="180" text-anchor="middle" font-size="26.1064" font-weight="bold">NBD</text>
  <text x="793.2674" y="240" text-anchor="middle" font-size="23.733">Network block</text>
  <text x="793.2674" y="292" text-anchor="middle" font-size="23.733">Remote storage</text>
  <text x="793.2674" y="344" text-anchor="middle" font-size="23.733" fill="var(--text-muted)">TCP/Unix sock</text>
  <rect x="966.7327" y="100" width="273.2673" height="280" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1102.1783" y="180" text-anchor="middle" font-size="26.1064" font-weight="bold">Host Device</text>
  <text x="1102.1783" y="240" text-anchor="middle" font-size="23.733">/dev/sdX</text>
  <text x="1102.1783" y="292" text-anchor="middle" font-size="23.733">Passthrough</text>
  <text x="1102.1783" y="344" text-anchor="middle" font-size="23.733" fill="var(--text-muted)">Direct I/O</text>
  <line x1="175.4455" y1="400" x2="175.4455" y2="500" stroke="var(--text)" stroke-width="2" />
  <line x1="484.3565" y1="400" x2="484.3565" y2="500" stroke="var(--text)" stroke-width="2" />
  <line x1="793.2674" y1="400" x2="793.2674" y2="500" stroke="var(--text)" stroke-width="2" />
  <line x1="1102.1783" y1="400" x2="1102.1783" y2="500" stroke="var(--text)" stroke-width="2" />
  <rect x="40" y="500" width="1200" height="120" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="638.8119" y="580" text-anchor="middle" font-size="26.1064">Device Frontend: IDE / SCSI / virtio-blk / NVMe</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="384.9057" height="421.8182" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="232.4528" y="145.4545" text-anchor="middle" font-size="29.2578" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Guest VM</text>
  <rect x="62.6415" y="198.1818" width="158.4905" height="210.9091" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6"/>
  <text x="141.8868" y="282.5455" text-anchor="middle" font-size="26.5979" font-family="Arial, sans-serif" fill="var(--warn-text)">virtio-net</text>
  <text x="141.8868" y="356.3636" text-anchor="middle" font-size="26.5979" font-family="Arial, sans-serif" fill="var(--warn-text)">Guest NIC</text>
  <rect x="243.7736" y="198.1818" width="158.4905" height="210.9091" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6"/>
  <text x="323.0188" y="282.5455" text-anchor="middle" font-size="26.5979" font-family="Arial, sans-serif" fill="var(--warn-text)">eth0</text>
  <text x="323.0188" y="356.3636" text-anchor="middle" font-size="26.5979" font-family="Arial, sans-serif" fill="var(--warn-text)">10.0.2.15</text>
  <rect x="515.4717" y="145.4545" width="316.9812" height="316.3636" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6"/>
  <text x="673.9622" y="250.9091" text-anchor="middle" font-size="29.2578" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">QEMU SLIRP</text>
  <text x="673.9622" y="340.5455" text-anchor="middle" font-size="26.5979" font-family="Arial, sans-serif" fill="var(--info-text)">User-mode NAT</text>
  <text x="673.9622" y="409.0909" text-anchor="middle" font-size="26.5979" font-family="Arial, sans-serif" fill="var(--info-text)">10.0.2.2 (gw)</text>
  <rect x="923.0188" y="145.4545" width="316.9812" height="316.3636" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="1081.5094" y="250.9091" text-anchor="middle" font-size="29.2578" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Host Network</text>
  <text x="1081.5094" y="340.5455" text-anchor="middle" font-size="26.5979" font-family="Arial, sans-serif" fill="var(--ok-text)">Host NIC / Internet</text>
  <line x1="424.9056" y1="303.6364" x2="515.4717" y2="303.6364" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="832.4527" y1="303.6364" x2="923.0188" y2="303.6364" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="673.9622" y="620" text-anchor="middle" font-size="26.5979" fill="var(--text-muted)" font-family="Arial, sans-serif">-net nic,model=virtio -net user,hostfwd=tcp::2222-:22</text>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="206.8965" height="227.8571" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="143.4483" y="122.8571" text-anchor="middle" font-size="24.7912" font-weight="bold">QEMU</text>
  <text x="143.4483" y="185" text-anchor="middle" font-size="22.5374">Loads kernel</text>
  <text x="143.4483" y="238.8571" text-anchor="middle" font-size="22.5374">(-kernel flag)</text>
  <rect x="308.9656" y="40" width="206.8965" height="227.8571" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="412.4138" y="122.8571" text-anchor="middle" font-size="24.7912" font-weight="bold">BIOS/UEFI</text>
  <text x="412.4138" y="185" text-anchor="middle" font-size="22.5374">Firmware</text>
  <text x="412.4138" y="238.8571" text-anchor="middle" font-size="22.5374">Init</text>
  <rect x="577.9311" y="40" width="206.8965" height="227.8571" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="681.3794" y="122.8571" text-anchor="middle" font-size="24.7912" font-weight="bold">Kernel</text>
  <text x="681.3794" y="185" text-anchor="middle" font-size="22.5374">Decompresses</text>
  <text x="681.3794" y="238.8571" text-anchor="middle" font-size="22.5374">&amp; boots</text>
  <rect x="846.8966" y="40" width="206.8965" height="227.8571" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="950.3449" y="122.8571" text-anchor="middle" font-size="24.7912" font-weight="bold">initramfs</text>
  <text x="950.3449" y="185" text-anchor="middle" font-size="22.5374">Early</text>
  <text x="950.3449" y="238.8571" text-anchor="middle" font-size="22.5374">userspace</text>
  <rect x="1033.1035" y="392.1429" width="206.8965" height="227.8571" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1136.5518" y="475" text-anchor="middle" font-size="24.7912" font-weight="bold">Root FS</text>
  <text x="1136.5518" y="537.1429" text-anchor="middle" font-size="22.5374">Full system</text>
  <text x="1136.5518" y="591" text-anchor="middle" font-size="22.5374">running</text>
  <line x1="246.8966" y1="151.8571" x2="308.9656" y2="151.8571" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd0_02_qemu_basic_usage)" />
  <line x1="515.8621" y1="151.8571" x2="577.9311" y2="151.8571" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd0_02_qemu_basic_usage)" />
  <line x1="784.8276" y1="151.8571" x2="846.8966" y2="151.8571" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd0_02_qemu_basic_usage)" />
  <line x1="1053.7932" y1="267.8571" x2="1136.5518" y2="392.1429" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd0_02_qemu_basic_usage)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd0_02_qemu_basic_usage" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="634.6903" y="40" text-anchor="middle" font-size="25.2405" font-weight="bold">QEMU Device Model Architecture</text>
  <rect x="273.6282" y="75.1516" width="722.1239" height="105.4546" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="634.6903" y="145.4546" text-anchor="middle" font-size="23.1372">Guest Driver (e.g. virtio-net, e1000)</text>
  <rect x="273.6282" y="215.7576" width="722.1239" height="105.4546" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="634.6903" y="286.0606" text-anchor="middle" font-size="23.1372">PCI Bus / MMIO / Port I/O Interface</text>
  <rect x="40" y="373.9394" width="276.1061" height="158.1818" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="178.053" y="437.2121" text-anchor="middle" font-size="21.0337" font-weight="bold">Emulated</text>
  <text x="178.053" y="496.9697" text-anchor="middle" font-size="21.0337">e1000, IDE, AC97</text>
  <rect x="347.9645" y="373.9394" width="276.1061" height="158.1818" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="486.0177" y="437.2121" text-anchor="middle" font-size="21.0337" font-weight="bold">Paravirtual</text>
  <text x="486.0177" y="496.9697" text-anchor="middle" font-size="21.0337">virtio-net, blk, gpu</text>
  <rect x="655.9291" y="373.9394" width="276.1061" height="158.1818" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="793.9823" y="437.2121" text-anchor="middle" font-size="21.0337" font-weight="bold">Passthrough</text>
  <text x="793.9823" y="496.9697" text-anchor="middle" font-size="21.0337">VFIO / PCI assign</text>
  <rect x="963.8939" y="373.9394" width="276.1061" height="158.1818" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1101.9468" y="437.2121" text-anchor="middle" font-size="21.0337" font-weight="bold">QOM</text>
  <text x="1101.9468" y="496.9697" text-anchor="middle" font-size="21.0337">Object Model</text>
  <line x1="634.6903" y1="180.6061" x2="634.6903" y2="215.7576" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd0_07_qemu_device_models)" />
  <line x1="178.053" y1="321.2122" x2="178.053" y2="373.9394" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd0_07_qemu_device_models)" />
  <line x1="486.0177" y1="321.2122" x2="486.0177" y2="373.9394" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd0_07_qemu_device_models)" />
  <line x1="793.9823" y1="321.2122" x2="793.9823" y2="373.9394" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd0_07_qemu_device_models)" />
  <line x1="1101.9468" y1="321.2122" x2="1101.9468" y2="373.9394" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd0_07_qemu_device_models)" />
  <text x="634.6903" y="620" text-anchor="middle" font-size="21.0337" fill="var(--text-muted)">-device virtio-net-pci,netdev=net0 -device e1000,netdev=net1</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd0_07_qemu_device_models" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
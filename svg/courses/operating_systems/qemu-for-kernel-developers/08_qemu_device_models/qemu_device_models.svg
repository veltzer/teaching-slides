<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="632.0988" y="53.3333" text-anchor="middle" font-size="25.284" font-weight="bold">QEMU Device Model Architecture</text>
  <rect x="273.9094" y="88.8889" width="716.3786" height="106.6667" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="632.0988" y="160" text-anchor="middle" font-size="23.177">Guest Driver (e.g. virtio-net, e1000)</text>
  <rect x="273.9094" y="231.1111" width="716.3786" height="106.6667" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="632.0988" y="302.2222" text-anchor="middle" font-size="23.177">PCI Bus / MMIO / Port I/O Interface</text>
  <rect x="42.14" y="391.1111" width="273.9094" height="160" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="179.0946" y="455.1111" text-anchor="middle" font-size="21.0699" font-weight="bold">Emulated</text>
  <text x="179.0946" y="515.5556" text-anchor="middle" font-size="21.0699">e1000, IDE, AC97</text>
  <rect x="347.6543" y="391.1111" width="273.9094" height="160" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="484.6091" y="455.1111" text-anchor="middle" font-size="21.0699" font-weight="bold">Paravirtual</text>
  <text x="484.6091" y="515.5556" text-anchor="middle" font-size="21.0699">virtio-net, blk, gpu</text>
  <rect x="653.1687" y="391.1111" width="273.9094" height="160" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="790.1235" y="455.1111" text-anchor="middle" font-size="21.0699" font-weight="bold">Passthrough</text>
  <text x="790.1235" y="515.5556" text-anchor="middle" font-size="21.0699">VFIO / PCI assign</text>
  <rect x="958.6832" y="391.1111" width="273.9094" height="160" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="1095.6378" y="455.1111" text-anchor="middle" font-size="21.0699" font-weight="bold">QOM</text>
  <text x="1095.6378" y="515.5556" text-anchor="middle" font-size="21.0699">Object Model</text>
  <line x1="632.0988" y1="195.5556" x2="632.0988" y2="231.1111" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd0_07_qemu_device_models)" />
  <line x1="179.0946" y1="337.7778" x2="179.0946" y2="391.1111" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd0_07_qemu_device_models)" />
  <line x1="484.6091" y1="337.7778" x2="484.6091" y2="391.1111" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd0_07_qemu_device_models)" />
  <line x1="790.1235" y1="337.7778" x2="790.1235" y2="391.1111" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd0_07_qemu_device_models)" />
  <line x1="1095.6378" y1="337.7778" x2="1095.6378" y2="391.1111" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd0_07_qemu_device_models)" />
  <text x="632.0988" y="640" text-anchor="middle" font-size="21.0699" fill="var(--text-muted)">-device virtio-net-pci,netdev=net0 -device e1000,netdev=net1</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd0_07_qemu_device_models" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
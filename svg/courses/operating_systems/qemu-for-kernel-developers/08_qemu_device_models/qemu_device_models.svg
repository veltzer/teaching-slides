<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="634.6903" y="40" text-anchor="middle" font-size="25.2405" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">QEMU Device Model Architecture</text>
  <rect x="273.6282" y="75.1516" width="722.1239" height="105.4546" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="634.6903" y="145.4546" text-anchor="middle" font-size="23.1372" font-family="Arial, sans-serif" fill="var(--primary-text)">Guest Driver (e.g. virtio-net, e1000)</text>
  <rect x="273.6282" y="215.7576" width="722.1239" height="105.4546" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="634.6903" y="286.0606" text-anchor="middle" font-size="23.1372" font-family="Arial, sans-serif" fill="var(--info-text)">PCI Bus / MMIO / Port I/O Interface</text>
  <rect x="40" y="373.9394" width="276.1061" height="158.1818" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="178.053" y="437.2121" text-anchor="middle" font-size="21.0337" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Emulated</text>
  <text x="178.053" y="496.9697" text-anchor="middle" font-size="21.0337" font-family="Arial, sans-serif" fill="var(--ok-text)">e1000, IDE, AC97</text>
  <rect x="347.9645" y="373.9394" width="276.1061" height="158.1818" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="486.0177" y="437.2121" text-anchor="middle" font-size="21.0337" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Paravirtual</text>
  <text x="486.0177" y="496.9697" text-anchor="middle" font-size="21.0337" font-family="Arial, sans-serif" fill="var(--warn-text)">virtio-net, blk, gpu</text>
  <rect x="655.9291" y="373.9394" width="276.1061" height="158.1818" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="793.9823" y="437.2121" text-anchor="middle" font-size="21.0337" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Passthrough</text>
  <text x="793.9823" y="496.9697" text-anchor="middle" font-size="21.0337" font-family="Arial, sans-serif" fill="var(--danger-text)">VFIO / PCI assign</text>
  <rect x="963.8939" y="373.9394" width="276.1061" height="158.1818" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1101.9468" y="437.2121" text-anchor="middle" font-size="21.0337" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">QOM</text>
  <text x="1101.9468" y="496.9697" text-anchor="middle" font-size="21.0337" font-family="Arial, sans-serif" fill="var(--primary-text)">Object Model</text>
  <line x1="634.6903" y1="180.6061" x2="634.6903" y2="215.7576" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="178.053" y1="321.2122" x2="178.053" y2="373.9394" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="486.0177" y1="321.2122" x2="486.0177" y2="373.9394" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="793.9823" y1="321.2122" x2="793.9823" y2="373.9394" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1101.9468" y1="321.2122" x2="1101.9468" y2="373.9394" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="634.6903" y="620" text-anchor="middle" font-size="21.0337" fill="var(--text-muted)" font-family="Arial, sans-serif">-device virtio-net-pci,netdev=net0 -device e1000,netdev=net1</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="115.6522" width="242.2019" height="252.1739" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="161.101" y="216.5217" text-anchor="middle" font-size="28.2182" font-weight="bold">qemu-system</text>
  <text x="161.101" y="302.2609" text-anchor="middle" font-size="25.6528">Command</text>
  <rect x="359.2661" y="40" width="242.2019" height="201.7391" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="480.367" y="166.087" text-anchor="middle" font-size="25.6528">-kernel bzImage</text>
  <rect x="359.2661" y="266.9565" width="242.2019" height="201.7391" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="480.367" y="393.0435" text-anchor="middle" font-size="25.6528">-m 512 -smp 2</text>
  <rect x="678.5321" y="115.6522" width="242.2019" height="252.1739" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="799.633" y="216.5217" text-anchor="middle" font-size="28.2182" font-weight="bold">VM Instance</text>
  <text x="799.633" y="302.2609" text-anchor="middle" font-size="25.6528">Running</text>
  <rect x="997.7981" y="40" width="242.2019" height="176.5217" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1118.8991" y="150.9565" text-anchor="middle" font-size="25.6528">Serial Console</text>
  <rect x="997.7981" y="241.7391" width="242.2019" height="176.5217" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1118.8991" y="352.6957" text-anchor="middle" font-size="25.6528">QEMU Monitor</text>
  <line x1="282.2019" y1="241.7391" x2="359.2661" y2="140.8696" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_01_qemu_intro)" />
  <line x1="282.2019" y1="241.7391" x2="359.2661" y2="367.8261" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_01_qemu_intro)" />
  <line x1="601.4679" y1="241.7391" x2="678.5321" y2="241.7391" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_01_qemu_intro)" />
  <line x1="920.734" y1="191.3043" x2="997.7981" y2="125.7391" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_01_qemu_intro)" />
  <line x1="920.734" y1="292.1739" x2="997.7981" y2="327.4783" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_01_qemu_intro)" />
  <text x="678.5321" y="620" text-anchor="middle" font-size="25.6528" fill="var(--text-muted)">qemu-system-x86_64 -kernel bzImage -m 512 -smp 2 -nographic</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd1_01_qemu_intro" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="54" text-anchor="middle" font-size="25.6" font-weight="bold">QEMU Main Loop / Event Loop</text>
  <rect x="42.6667" y="108" width="256" height="198" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="170.6667" y="180" text-anchor="middle" font-size="21.3333" font-weight="bold">I/O Handlers</text>
  <text x="170.6667" y="234" text-anchor="middle" font-size="21.3333">fd read/write</text>
  <text x="170.6667" y="280.8" text-anchor="middle" font-size="21.3333">select/poll/epoll</text>
  <rect x="341.3333" y="108" width="256" height="198" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="469.3333" y="180" text-anchor="middle" font-size="21.3333" font-weight="bold">Timers</text>
  <text x="469.3333" y="234" text-anchor="middle" font-size="21.3333">QEMU clocks</text>
  <text x="469.3333" y="280.8" text-anchor="middle" font-size="21.3333">ns resolution</text>
  <rect x="640" y="108" width="256" height="198" fill="#fff3e0" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="768" y="180" text-anchor="middle" font-size="21.3333" font-weight="bold">BH (Bottom</text>
  <text x="768" y="234" text-anchor="middle" font-size="21.3333">Halves)</text>
  <text x="768" y="280.8" text-anchor="middle" font-size="21.3333">Deferred work</text>
  <rect x="938.6667" y="108" width="256" height="198" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1066.6667" y="180" text-anchor="middle" font-size="21.3333" font-weight="bold">vCPU Threads</text>
  <text x="1066.6667" y="234" text-anchor="middle" font-size="21.3333">TCG or KVM</text>
  <text x="1066.6667" y="280.8" text-anchor="middle" font-size="21.3333">Per-CPU thread</text>
  <rect x="213.3333" y="396" width="853.3333" height="144" fill="#ffebee" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="460.8" text-anchor="middle" font-size="23.4667" font-weight="bold">main_loop_wait()</text>
  <text x="640" y="514.8" text-anchor="middle" font-size="21.3333">Poll fds, run timers, execute BHs, dispatch events</text>
  <line x1="170.6667" y1="306" x2="170.6667" y2="396" stroke="#333" stroke-width="3.2" marker-end="url(#arrowd0_09_qemu_internals)" />
  <line x1="469.3333" y1="306" x2="469.3333" y2="396" stroke="#333" stroke-width="3.2" marker-end="url(#arrowd0_09_qemu_internals)" />
  <line x1="768" y1="306" x2="768" y2="396" stroke="#333" stroke-width="3.2" marker-end="url(#arrowd0_09_qemu_internals)" />
  <line x1="1066.6667" y1="306" x2="1066.6667" y2="396" stroke="#333" stroke-width="3.2" marker-end="url(#arrowd0_09_qemu_internals)" />
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arrowd0_09_qemu_internals" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
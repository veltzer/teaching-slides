<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:text x="632.0988" y="53.3333" text-anchor="middle" font-size="25.284" font-weight="bold">TCG Translation Pipeline</ns0:text>
  <ns0:rect x="21.0699" y="106.6667" width="231.7696" height="195.5556" fill="#e3f2fd" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="136.9548" y="177.7778" text-anchor="middle" font-size="21.0699" font-weight="bold">Guest Code</ns0:text>
  <ns0:text x="136.9548" y="231.1111" text-anchor="middle" font-size="21.0699">(e.g. ARM)</ns0:text>
  <ns0:text x="136.9548" y="277.3333" text-anchor="middle" font-size="21.0699">Basic block</ns0:text>
  <ns0:rect x="316.0494" y="106.6667" width="231.7696" height="195.5556" fill="#f3e5f5" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="431.9341" y="177.7778" text-anchor="middle" font-size="21.0699" font-weight="bold">TCG Frontend</ns0:text>
  <ns0:text x="431.9341" y="231.1111" text-anchor="middle" font-size="21.0699">Decode guest</ns0:text>
  <ns0:text x="431.9341" y="277.3333" text-anchor="middle" font-size="21.0699">to TCG ops</ns0:text>
  <ns0:rect x="611.0288" y="106.6667" width="231.7696" height="195.5556" fill="#fff3e0" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="726.9136" y="177.7778" text-anchor="middle" font-size="21.0699" font-weight="bold">TCG IR</ns0:text>
  <ns0:text x="726.9136" y="231.1111" text-anchor="middle" font-size="21.0699">Intermediate</ns0:text>
  <ns0:text x="726.9136" y="277.3333" text-anchor="middle" font-size="21.0699">Representation</ns0:text>
  <ns0:rect x="906.0082" y="106.6667" width="231.7696" height="195.5556" fill="#e8f5e9" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="1021.893" y="177.7778" text-anchor="middle" font-size="21.0699" font-weight="bold">TCG Backend</ns0:text>
  <ns0:text x="1021.893" y="231.1111" text-anchor="middle" font-size="21.0699">Emit host</ns0:text>
  <ns0:text x="1021.893" y="277.3333" text-anchor="middle" font-size="21.0699">(e.g. x86_64)</ns0:text>
  <ns0:rect x="463.5391" y="391.1111" width="337.1193" height="160" fill="#ffebee" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="632.0988" y="462.2222" text-anchor="middle" font-size="21.0699" font-weight="bold">Translation Block</ns0:text>
  <ns0:text x="632.0988" y="515.5556" text-anchor="middle" font-size="21.0699">Cache (TB cache)</ns0:text>
  <ns0:line x1="252.8395" y1="202.6667" x2="316.0494" y2="202.6667" stroke="#333" stroke-width="4.214" marker-end="url(#arrowd1_09_qemu_internals)" />
  <ns0:line x1="547.819" y1="202.6667" x2="611.0288" y2="202.6667" stroke="#333" stroke-width="4.214" marker-end="url(#arrowd1_09_qemu_internals)" />
  <ns0:line x1="842.7983" y1="202.6667" x2="906.0082" y2="202.6667" stroke="#333" stroke-width="4.214" marker-end="url(#arrowd1_09_qemu_internals)" />
  <ns0:line x1="1021.893" y1="302.2222" x2="800.6585" y2="391.1111" stroke="#333" stroke-width="3.1605" marker-end="url(#arrowd1_09_qemu_internals)" />
  <ns0:text x="632.0988" y="640" text-anchor="middle" font-size="21.0699" fill="#555">Guest ISA -&gt; TCG ops -&gt; Host ISA (JIT compiled)</ns0:text>
  <ns0:defs>

    <!-- Gradients -->

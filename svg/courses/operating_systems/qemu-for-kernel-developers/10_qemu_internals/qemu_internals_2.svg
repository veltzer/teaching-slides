<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="632.0988" y="53.3333" text-anchor="middle" font-size="25.284" font-weight="bold">TCG Translation Pipeline</text>
  <rect x="21.0699" y="106.6667" width="231.7696" height="195.5556" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="136.9548" y="177.7778" text-anchor="middle" font-size="21.0699" font-weight="bold">Guest Code</text>
  <text x="136.9548" y="231.1111" text-anchor="middle" font-size="21.0699">(e.g. ARM)</text>
  <text x="136.9548" y="277.3333" text-anchor="middle" font-size="21.0699">Basic block</text>
  <rect x="316.0494" y="106.6667" width="231.7696" height="195.5556" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="431.9341" y="177.7778" text-anchor="middle" font-size="21.0699" font-weight="bold">TCG Frontend</text>
  <text x="431.9341" y="231.1111" text-anchor="middle" font-size="21.0699">Decode guest</text>
  <text x="431.9341" y="277.3333" text-anchor="middle" font-size="21.0699">to TCG ops</text>
  <rect x="611.0288" y="106.6667" width="231.7696" height="195.5556" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="726.9136" y="177.7778" text-anchor="middle" font-size="21.0699" font-weight="bold">TCG IR</text>
  <text x="726.9136" y="231.1111" text-anchor="middle" font-size="21.0699">Intermediate</text>
  <text x="726.9136" y="277.3333" text-anchor="middle" font-size="21.0699">Representation</text>
  <rect x="906.0082" y="106.6667" width="231.7696" height="195.5556" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1021.893" y="177.7778" text-anchor="middle" font-size="21.0699" font-weight="bold">TCG Backend</text>
  <text x="1021.893" y="231.1111" text-anchor="middle" font-size="21.0699">Emit host</text>
  <text x="1021.893" y="277.3333" text-anchor="middle" font-size="21.0699">(e.g. x86_64)</text>
  <rect x="463.5391" y="391.1111" width="337.1193" height="160" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="632.0988" y="462.2222" text-anchor="middle" font-size="21.0699" font-weight="bold">Translation Block</text>
  <text x="632.0988" y="515.5556" text-anchor="middle" font-size="21.0699">Cache (TB cache)</text>
  <line x1="252.8395" y1="202.6667" x2="316.0494" y2="202.6667" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_09_qemu_internals)" />
  <line x1="547.819" y1="202.6667" x2="611.0288" y2="202.6667" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_09_qemu_internals)" />
  <line x1="842.7983" y1="202.6667" x2="906.0082" y2="202.6667" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_09_qemu_internals)" />
  <line x1="1021.893" y1="302.2222" x2="800.6585" y2="391.1111" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_09_qemu_internals)" />
  <text x="632.0988" y="640" text-anchor="middle" font-size="21.0699" fill="var(--text-muted)">Guest ISA -&gt; TCG ops -&gt; Host ISA (JIT compiled)</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd1_09_qemu_internals" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
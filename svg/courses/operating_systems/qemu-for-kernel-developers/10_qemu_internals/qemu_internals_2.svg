<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="696.6038" y="40" text-anchor="middle" font-size="26.0606" font-weight="bold">TCG Translation Pipeline</text>
  <rect x="40" y="92.7273" width="249.0566" height="193.3334" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="164.5284" y="163.0304" text-anchor="middle" font-size="21.7171" font-weight="bold">Guest Code</text>
  <text x="164.5284" y="215.7576" text-anchor="middle" font-size="21.7171">(e.g. ARM)</text>
  <text x="164.5284" y="261.4545" text-anchor="middle" font-size="21.7171">Basic block</text>
  <rect x="356.9812" y="92.7273" width="249.0566" height="193.3334" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="481.5094" y="163.0304" text-anchor="middle" font-size="21.7171" font-weight="bold">TCG Frontend</text>
  <text x="481.5094" y="215.7576" text-anchor="middle" font-size="21.7171">Decode guest</text>
  <text x="481.5094" y="261.4545" text-anchor="middle" font-size="21.7171">to TCG ops</text>
  <rect x="673.9623" y="92.7273" width="249.0566" height="193.3334" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="798.4906" y="163.0304" text-anchor="middle" font-size="21.7171" font-weight="bold">TCG IR</text>
  <text x="798.4906" y="215.7576" text-anchor="middle" font-size="21.7171">Intermediate</text>
  <text x="798.4906" y="261.4545" text-anchor="middle" font-size="21.7171">Representation</text>
  <rect x="990.9434" y="92.7273" width="249.0566" height="193.3334" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1115.4717" y="163.0304" text-anchor="middle" font-size="21.7171" font-weight="bold">TCG Backend</text>
  <text x="1115.4717" y="215.7576" text-anchor="middle" font-size="21.7171">Emit host</text>
  <text x="1115.4717" y="261.4545" text-anchor="middle" font-size="21.7171">(e.g. x86_64)</text>
  <rect x="515.4717" y="373.9394" width="362.2641" height="158.1818" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="696.6038" y="444.2424" text-anchor="middle" font-size="21.7171" font-weight="bold">Translation Block</text>
  <text x="696.6038" y="496.9697" text-anchor="middle" font-size="21.7171">Cache (TB cache)</text>
  <line x1="289.0566" y1="187.6364" x2="356.9812" y2="187.6364" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_09_qemu_internals)" />
  <line x1="606.0378" y1="187.6364" x2="673.9623" y2="187.6364" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_09_qemu_internals)" />
  <line x1="923.0188" y1="187.6364" x2="990.9434" y2="187.6364" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_09_qemu_internals)" />
  <line x1="1115.4717" y1="286.0606" x2="877.7359" y2="373.9394" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_09_qemu_internals)" />
  <text x="696.6038" y="620" text-anchor="middle" font-size="21.7171" fill="var(--text-muted)">Guest ISA -&gt; TCG ops -&gt; Host ISA (JIT compiled)</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd1_09_qemu_internals" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
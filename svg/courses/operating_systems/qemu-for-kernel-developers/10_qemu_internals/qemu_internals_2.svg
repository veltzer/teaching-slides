<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="696.6038" y="40" text-anchor="middle" font-size="26.0606" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">TCG Translation Pipeline</text>
  <rect x="40" y="92.7273" width="249.0566" height="193.3334" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="164.5284" y="163.0304" text-anchor="middle" font-size="21.7171" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Guest Code</text>
  <text x="164.5284" y="215.7576" text-anchor="middle" font-size="21.7171" font-family="Arial, sans-serif" fill="var(--primary-text)">(e.g. ARM)</text>
  <text x="164.5284" y="261.4545" text-anchor="middle" font-size="21.7171" font-family="Arial, sans-serif" fill="var(--primary-text)">Basic block</text>
  <rect x="356.9812" y="92.7273" width="249.0566" height="193.3334" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="481.5094" y="163.0304" text-anchor="middle" font-size="21.7171" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">TCG Frontend</text>
  <text x="481.5094" y="215.7576" text-anchor="middle" font-size="21.7171" font-family="Arial, sans-serif" fill="var(--info-text)">Decode guest</text>
  <text x="481.5094" y="261.4545" text-anchor="middle" font-size="21.7171" font-family="Arial, sans-serif" fill="var(--info-text)">to TCG ops</text>
  <rect x="673.9623" y="92.7273" width="249.0566" height="193.3334" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="798.4906" y="163.0304" text-anchor="middle" font-size="21.7171" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">TCG IR</text>
  <text x="798.4906" y="215.7576" text-anchor="middle" font-size="21.7171" font-family="Arial, sans-serif" fill="var(--warn-text)">Intermediate</text>
  <text x="798.4906" y="261.4545" text-anchor="middle" font-size="21.7171" font-family="Arial, sans-serif" fill="var(--warn-text)">Representation</text>
  <rect x="990.9434" y="92.7273" width="249.0566" height="193.3334" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1115.4717" y="163.0304" text-anchor="middle" font-size="21.7171" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">TCG Backend</text>
  <text x="1115.4717" y="215.7576" text-anchor="middle" font-size="21.7171" font-family="Arial, sans-serif" fill="var(--ok-text)">Emit host</text>
  <text x="1115.4717" y="261.4545" text-anchor="middle" font-size="21.7171" font-family="Arial, sans-serif" fill="var(--ok-text)">(e.g. x86_64)</text>
  <rect x="515.4717" y="373.9394" width="362.2641" height="158.1818" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="696.6038" y="444.2424" text-anchor="middle" font-size="21.7171" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Translation Block</text>
  <text x="696.6038" y="496.9697" text-anchor="middle" font-size="21.7171" font-family="Arial, sans-serif" fill="var(--danger-text)">Cache (TB cache)</text>
  <line x1="289.0566" y1="187.6364" x2="356.9812" y2="187.6364" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="606.0378" y1="187.6364" x2="673.9623" y2="187.6364" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="923.0188" y1="187.6364" x2="990.9434" y2="187.6364" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1115.4717" y1="286.0606" x2="877.7359" y2="373.9394" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="696.6038" y="620" text-anchor="middle" font-size="21.7171" fill="var(--text-muted)" font-family="Arial, sans-serif">Guest ISA -&gt; TCG ops -&gt; Host ISA (JIT compiled)</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
</svg>
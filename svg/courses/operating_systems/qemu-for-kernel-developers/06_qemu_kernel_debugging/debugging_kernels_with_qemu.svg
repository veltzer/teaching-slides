<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="63.199913599994" width="349.0909" height="417.600064800004" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.235383122261" filter="url(#shadow)"/>
  <text x="214.5454" y="156" text-anchor="middle" font-size="26.94257085603" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">GDB (Host)</text>
  <rect x="61.8181" y="193.119926559995" width="305.4546" height="102.079987039999" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.235383122261" filter="url(#shadow)"/>
  <text x="214.5454" y="267.35999568" text-anchor="middle" font-size="24.493208442554" font-family="Arial, sans-serif" fill="var(--warn-text)">target remote :1234</text>
  <rect x="61.8181" y="318.399935199996" width="305.4546" height="102.079987039999" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.235383122261" filter="url(#shadow)"/>
  <text x="214.5454" y="392.64000432" text-anchor="middle" font-size="24.493208442554" font-family="Arial, sans-serif" fill="var(--warn-text)">vmlinux (symbols)</text>
  <rect x="498.1818" y="63.199913599994" width="152.7272" height="417.600064800004" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.235383122261" filter="url(#shadow)"/>
  <text x="574.5454" y="179.200021600001" text-anchor="middle" font-size="24.493208442554" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">GDB</text>
  <text x="574.5454" y="248.799978399998" text-anchor="middle" font-size="24.493208442554" font-family="Arial, sans-serif" fill="var(--info-text)">Stub</text>
  <text x="574.5454" y="318.399935199996" text-anchor="middle" font-size="24.493208442554" font-family="Arial, sans-serif" fill="var(--info-text)">:1234</text>
  <rect x="738.1818" y="40" width="501.8182" height="464" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.235383122261" filter="url(#shadow)"/>
  <text x="989.0909" y="132.799978399999" text-anchor="middle" font-size="26.94257085603" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">QEMU VM</text>
  <rect x="760" y="179.200021600001" width="218.1818" height="139.200021600001" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.235383122261" filter="url(#shadow)"/>
  <text x="869.0909" y="272" text-anchor="middle" font-size="24.493208442554" font-family="Arial, sans-serif" fill="var(--danger-text)">Guest Kernel</text>
  <rect x="1000" y="179.200021600001" width="218.1818" height="139.200021600001" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.235383122261" filter="url(#shadow)"/>
  <text x="1109.0909" y="272" text-anchor="middle" font-size="24.493208442554" font-family="Arial, sans-serif" fill="var(--warn-text)">vCPU (paused)</text>
  <text x="989.0909" y="434.399935199995" text-anchor="middle" font-size="24.493208442554" font-family="Arial, sans-serif" fill="var(--ok-text)">qemu-system-x86_64 -s -S -kernel vmlinux</text>
  <line x1="389.0909" y1="272" x2="498.1818" y2="272" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650.9091" y1="272" x2="738.1818" y2="272" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="443.6363" y="239.519969759998" text-anchor="middle" font-size="24.493208442554" fill="var(--text-muted)" font-family="Arial, sans-serif">TCP</text>
  <text x="650.9091" y="620" text-anchor="middle" font-size="24.493208442554" fill="var(--text-muted)" font-family="Arial, sans-serif">-s = gdbserver on :1234 | -S = freeze CPU at startup</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

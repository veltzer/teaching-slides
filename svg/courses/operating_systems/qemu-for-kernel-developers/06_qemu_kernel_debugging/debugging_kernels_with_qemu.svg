<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="54" text-anchor="middle" font-size="25.6" font-weight="bold">GDB + QEMU Kernel Debug Setup</text>
  <rect x="42.6667" y="108" width="341.3333" height="324" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="213.3333" y="180" text-anchor="middle" font-size="23.4667" font-weight="bold">GDB (Host)</text>
  <rect x="64" y="208.8" width="298.6667" height="79.2" fill="#fff3e0" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="213.3333" y="266.4" text-anchor="middle" font-size="21.3333">target remote :1234</text>
  <rect x="64" y="306" width="298.6667" height="79.2" fill="#fff3e0" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="213.3333" y="363.6" text-anchor="middle" font-size="21.3333">vmlinux (symbols)</text>
  <rect x="490.6667" y="108" width="149.3333" height="324" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="565.3333" y="198" text-anchor="middle" font-size="21.3333" font-weight="bold">GDB</text>
  <text x="565.3333" y="252" text-anchor="middle" font-size="21.3333">Stub</text>
  <text x="565.3333" y="306" text-anchor="middle" font-size="21.3333">:1234</text>
  <rect x="725.3333" y="90" width="490.6667" height="360" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="970.6667" y="162" text-anchor="middle" font-size="23.4667" font-weight="bold">QEMU VM</text>
  <rect x="746.6667" y="198" width="213.3333" height="108" fill="#ffebee" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="853.3333" y="270" text-anchor="middle" font-size="21.3333">Guest Kernel</text>
  <rect x="981.3333" y="198" width="213.3333" height="108" fill="#fff3e0" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="1088" y="270" text-anchor="middle" font-size="21.3333">vCPU (paused)</text>
  <text x="970.6667" y="396" text-anchor="middle" font-size="21.3333">qemu-system-x86_64 -s -S -kernel vmlinux</text>
  <line x1="384" y1="270" x2="490.6667" y2="270" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowd0_05_qemu_kernel_debugging)" />
  <line x1="640" y1="270" x2="725.3333" y2="270" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowd0_05_qemu_kernel_debugging)" />
  <text x="437.3333" y="244.8" text-anchor="middle" font-size="21.3333" fill="#555">TCP</text>
  <text x="640" y="540" text-anchor="middle" font-size="21.3333" fill="#555">-s = gdbserver on :1234 | -S = freeze CPU at startup</text>
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arrowd0_05_qemu_kernel_debugging" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
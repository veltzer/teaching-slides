<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640" y="54" text-anchor="middle" font-size="25.6" font-weight="bold">QEMU Tracing Architecture</text>
  <rect x="42.6667" y="108" width="298.6667" height="216" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="192" y="180" text-anchor="middle" font-size="23.4667" font-weight="bold">Trace Events</text>
  <text x="192" y="234" text-anchor="middle" font-size="21.3333">trace-events file</text>
  <text x="192" y="280.8" text-anchor="middle" font-size="21.3333">trace_foo(args)</text>
  <rect x="405.3333" y="90" width="341.3333" height="270" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="576" y="162" text-anchor="middle" font-size="23.4667" font-weight="bold">Trace Backends</text>
  <rect x="426.6667" y="198" width="128" height="79.2" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="490.6667" y="252" text-anchor="middle" font-size="21.3333">log</text>
  <rect x="576" y="198" width="128" height="79.2" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="640" y="252" text-anchor="middle" font-size="21.3333">ftrace</text>
  <rect x="426.6667" y="288" width="128" height="64.8" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="490.6667" y="334.8" text-anchor="middle" font-size="21.3333">dtrace</text>
  <rect x="576" y="288" width="128" height="64.8" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="640" y="334.8" text-anchor="middle" font-size="21.3333">simple</text>
  <rect x="810.6667" y="108" width="213.3333" height="216" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="917.3333" y="180" text-anchor="middle" font-size="23.4667" font-weight="bold">Output</text>
  <text x="917.3333" y="234" text-anchor="middle" font-size="21.3333">Trace log file</text>
  <text x="917.3333" y="280.8" text-anchor="middle" font-size="21.3333">or stderr</text>
  <rect x="1088" y="108" width="170.6667" height="216" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="1173.3333" y="180" text-anchor="middle" font-size="23.4667" font-weight="bold">Analysis</text>
  <text x="1173.3333" y="234" text-anchor="middle" font-size="21.3333">simpletrace</text>
  <text x="1173.3333" y="280.8" text-anchor="middle" font-size="21.3333">scripts</text>
  <line x1="341.3333" y1="216" x2="405.3333" y2="216" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd0_08_advanced_qemu_features_for_kernel_development)" />
  <line x1="746.6667" y1="216" x2="810.6667" y2="216" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd0_08_advanced_qemu_features_for_kernel_development)" />
  <line x1="1024" y1="216" x2="1088" y2="216" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd0_08_advanced_qemu_features_for_kernel_development)" />
  <text x="640" y="468" text-anchor="middle" font-size="21.3333" fill="var(--text-muted)">-trace events=trace.cfg -trace file=trace.log</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd0_08_advanced_qemu_features_for_kernel_development" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="629.4737" y="40" text-anchor="middle" font-size="30.1008" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">QEMU Tracing Architecture</text>
  <rect x="40" y="115.6522" width="294.7369" height="302.6087" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="187.3684" y="216.5217" text-anchor="middle" font-size="27.5924" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Trace Events</text>
  <text x="187.3684" y="292.1739" text-anchor="middle" font-size="25.0839" font-family="Arial, sans-serif" fill="var(--primary-text)">trace-events file</text>
  <text x="187.3684" y="357.7391" text-anchor="middle" font-size="25.0839" font-family="Arial, sans-serif" fill="var(--primary-text)">trace_foo(args)</text>
  <rect x="397.8947" y="90.4348" width="336.8421" height="378.2609" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="566.3158" y="191.3043" text-anchor="middle" font-size="27.5924" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Trace Backends</text>
  <rect x="418.9474" y="241.7391" width="126.3158" height="110.9565" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="482.1053" y="317.3913" text-anchor="middle" font-size="25.0839" font-family="Arial, sans-serif" fill="var(--warn-text)">log</text>
  <rect x="566.3158" y="241.7391" width="126.3158" height="110.9565" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="629.4737" y="317.3913" text-anchor="middle" font-size="25.0839" font-family="Arial, sans-serif" fill="var(--ok-text)">ftrace</text>
  <rect x="418.9474" y="367.8261" width="126.3158" height="90.7826" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="482.1053" y="433.3913" text-anchor="middle" font-size="25.0839" font-family="Arial, sans-serif" fill="var(--danger-text)">dtrace</text>
  <rect x="566.3158" y="367.8261" width="126.3158" height="90.7826" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="629.4737" y="433.3913" text-anchor="middle" font-size="25.0839" font-family="Arial, sans-serif" fill="var(--primary-text)">simple</text>
  <rect x="797.8947" y="115.6522" width="210.5263" height="302.6087" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="903.1578" y="216.5217" text-anchor="middle" font-size="27.5924" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Output</text>
  <text x="903.1578" y="292.1739" text-anchor="middle" font-size="25.0839" font-family="Arial, sans-serif" fill="var(--ok-text)">Trace log file</text>
  <text x="903.1578" y="357.7391" text-anchor="middle" font-size="25.0839" font-family="Arial, sans-serif" fill="var(--ok-text)">or stderr</text>
  <rect x="1071.5789" y="115.6522" width="168.4211" height="302.6087" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1155.7894" y="216.5217" text-anchor="middle" font-size="27.5924" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Analysis</text>
  <text x="1155.7894" y="292.1739" text-anchor="middle" font-size="25.0839" font-family="Arial, sans-serif" fill="var(--warn-text)">simpletrace</text>
  <text x="1155.7894" y="357.7391" text-anchor="middle" font-size="25.0839" font-family="Arial, sans-serif" fill="var(--warn-text)">scripts</text>
  <line x1="334.7368" y1="266.9565" x2="397.8947" y2="266.9565" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="734.7368" y1="266.9565" x2="797.8947" y2="266.9565" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1008.421" y1="266.9565" x2="1071.5789" y2="266.9565" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="629.4737" y="620" text-anchor="middle" font-size="25.0839" fill="var(--text-muted)" font-family="Arial, sans-serif">-trace events=trace.cfg -trace file=trace.log</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
</svg>
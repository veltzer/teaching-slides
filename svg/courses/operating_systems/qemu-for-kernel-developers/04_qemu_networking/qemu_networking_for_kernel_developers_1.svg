<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="25.703" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">QEMU Network Models</text>
  <rect x="40" y="96.129" width="268.9655" height="280.6452" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="174.4828" y="170.9677" text-anchor="middle" font-size="23.5611" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">User (SLIRP)</text>
  <text x="174.4828" y="227.0968" text-anchor="middle" font-size="21.4191" font-family="Arial, sans-serif" fill="var(--primary-text)">Built-in NAT</text>
  <text x="174.4828" y="283.2258" text-anchor="middle" font-size="21.4191" font-family="Arial, sans-serif" fill="var(--primary-text)">No root needed</text>
  <text x="174.4828" y="339.3548" text-anchor="middle" font-size="21.4191" fill="var(--text-muted)" font-family="Arial, sans-serif">Limited perf</text>
  <rect x="350.3448" y="96.129" width="268.9655" height="280.6452" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="484.8276" y="170.9677" text-anchor="middle" font-size="23.5611" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">TAP</text>
  <text x="484.8276" y="227.0968" text-anchor="middle" font-size="21.4191" font-family="Arial, sans-serif" fill="var(--info-text)">L2 access</text>
  <text x="484.8276" y="283.2258" text-anchor="middle" font-size="21.4191" font-family="Arial, sans-serif" fill="var(--info-text)">Kernel tap device</text>
  <text x="484.8276" y="339.3548" text-anchor="middle" font-size="21.4191" fill="var(--text-muted)" font-family="Arial, sans-serif">Root required</text>
  <rect x="660.6897" y="96.129" width="268.9655" height="280.6452" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="795.1725" y="170.9677" text-anchor="middle" font-size="23.5611" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Bridge</text>
  <text x="795.1725" y="227.0968" text-anchor="middle" font-size="21.4191" font-family="Arial, sans-serif" fill="var(--ok-text)">Full LAN access</text>
  <text x="795.1725" y="283.2258" text-anchor="middle" font-size="21.4191" font-family="Arial, sans-serif" fill="var(--ok-text)">Host bridge + tap</text>
  <text x="795.1725" y="339.3548" text-anchor="middle" font-size="21.4191" fill="var(--text-muted)" font-family="Arial, sans-serif">Most flexible</text>
  <rect x="971.0345" y="96.129" width="268.9655" height="280.6452" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1105.5173" y="170.9677" text-anchor="middle" font-size="23.5611" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">VDE</text>
  <text x="1105.5173" y="227.0968" text-anchor="middle" font-size="21.4191" font-family="Arial, sans-serif" fill="var(--warn-text)">Virtual switch</text>
  <text x="1105.5173" y="283.2258" text-anchor="middle" font-size="21.4191" font-family="Arial, sans-serif" fill="var(--warn-text)">Multi-VM setups</text>
  <text x="1105.5173" y="339.3548" text-anchor="middle" font-size="21.4191" fill="var(--text-muted)" font-family="Arial, sans-serif">User-space</text>
  <line x1="174.4828" y1="414.1935" x2="174.4828" y2="507.7419" stroke="var(--text)" stroke-width="2"/>
  <line x1="484.8276" y1="414.1935" x2="484.8276" y2="507.7419" stroke="var(--text)" stroke-width="2"/>
  <line x1="795.1725" y1="414.1935" x2="795.1725" y2="507.7419" stroke="var(--text)" stroke-width="2"/>
  <line x1="1105.5173" y1="414.1935" x2="1105.5173" y2="507.7419" stroke="var(--text)" stroke-width="2"/>
  <rect x="40" y="507.7419" width="1200" height="112.2581" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="582.5806" text-anchor="middle" font-size="23.5611" font-family="Arial, sans-serif" fill="var(--danger-text)">Guest Virtual NIC: e1000 / rtl8139 / virtio-net</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <text x="640" y="54" text-anchor="middle" font-size="25.6" font-weight="bold">QEMU Network Models</text>
  <rect x="21.3333" y="108" width="277.3333" height="270" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="160" y="180" text-anchor="middle" font-size="23.4667" font-weight="bold">User (SLIRP)</text>
  <text x="160" y="234" text-anchor="middle" font-size="21.3333">Built-in NAT</text>
  <text x="160" y="288" text-anchor="middle" font-size="21.3333">No root needed</text>
  <text x="160" y="342" text-anchor="middle" font-size="21.3333" fill="#666">Limited perf</text>
  <rect x="341.3333" y="108" width="277.3333" height="270" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="480" y="180" text-anchor="middle" font-size="23.4667" font-weight="bold">TAP</text>
  <text x="480" y="234" text-anchor="middle" font-size="21.3333">L2 access</text>
  <text x="480" y="288" text-anchor="middle" font-size="21.3333">Kernel tap device</text>
  <text x="480" y="342" text-anchor="middle" font-size="21.3333" fill="#666">Root required</text>
  <rect x="661.3333" y="108" width="277.3333" height="270" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="800" y="180" text-anchor="middle" font-size="23.4667" font-weight="bold">Bridge</text>
  <text x="800" y="234" text-anchor="middle" font-size="21.3333">Full LAN access</text>
  <text x="800" y="288" text-anchor="middle" font-size="21.3333">Host bridge + tap</text>
  <text x="800" y="342" text-anchor="middle" font-size="21.3333" fill="#666">Most flexible</text>
  <rect x="981.3333" y="108" width="277.3333" height="270" fill="#fff3e0" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1120" y="180" text-anchor="middle" font-size="23.4667" font-weight="bold">VDE</text>
  <text x="1120" y="234" text-anchor="middle" font-size="21.3333">Virtual switch</text>
  <text x="1120" y="288" text-anchor="middle" font-size="21.3333">Multi-VM setups</text>
  <text x="1120" y="342" text-anchor="middle" font-size="21.3333" fill="#666">User-space</text>
  <line x1="160" y1="414" x2="160" y2="504" stroke="#333" stroke-width="3.2" />
  <line x1="480" y1="414" x2="480" y2="504" stroke="#333" stroke-width="3.2" />
  <line x1="800" y1="414" x2="800" y2="504" stroke="#333" stroke-width="3.2" />
  <line x1="1120" y1="414" x2="1120" y2="504" stroke="#333" stroke-width="3.2" />
  <rect x="21.3333" y="504" width="1237.3333" height="108" fill="#ffebee" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="640" y="576" text-anchor="middle" font-size="23.4667">Guest Virtual NIC: e1000 / rtl8139 / virtio-net</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="25.703" font-weight="bold">QEMU Network Models</text>
  <rect x="40" y="96.129" width="268.9655" height="280.6452" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="174.4828" y="170.9677" text-anchor="middle" font-size="23.5611" font-weight="bold">User (SLIRP)</text>
  <text x="174.4828" y="227.0968" text-anchor="middle" font-size="21.4191">Built-in NAT</text>
  <text x="174.4828" y="283.2258" text-anchor="middle" font-size="21.4191">No root needed</text>
  <text x="174.4828" y="339.3548" text-anchor="middle" font-size="21.4191" fill="var(--text-muted)">Limited perf</text>
  <rect x="350.3448" y="96.129" width="268.9655" height="280.6452" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="484.8276" y="170.9677" text-anchor="middle" font-size="23.5611" font-weight="bold">TAP</text>
  <text x="484.8276" y="227.0968" text-anchor="middle" font-size="21.4191">L2 access</text>
  <text x="484.8276" y="283.2258" text-anchor="middle" font-size="21.4191">Kernel tap device</text>
  <text x="484.8276" y="339.3548" text-anchor="middle" font-size="21.4191" fill="var(--text-muted)">Root required</text>
  <rect x="660.6897" y="96.129" width="268.9655" height="280.6452" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="795.1725" y="170.9677" text-anchor="middle" font-size="23.5611" font-weight="bold">Bridge</text>
  <text x="795.1725" y="227.0968" text-anchor="middle" font-size="21.4191">Full LAN access</text>
  <text x="795.1725" y="283.2258" text-anchor="middle" font-size="21.4191">Host bridge + tap</text>
  <text x="795.1725" y="339.3548" text-anchor="middle" font-size="21.4191" fill="var(--text-muted)">Most flexible</text>
  <rect x="971.0345" y="96.129" width="268.9655" height="280.6452" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1105.5173" y="170.9677" text-anchor="middle" font-size="23.5611" font-weight="bold">VDE</text>
  <text x="1105.5173" y="227.0968" text-anchor="middle" font-size="21.4191">Virtual switch</text>
  <text x="1105.5173" y="283.2258" text-anchor="middle" font-size="21.4191">Multi-VM setups</text>
  <text x="1105.5173" y="339.3548" text-anchor="middle" font-size="21.4191" fill="var(--text-muted)">User-space</text>
  <line x1="174.4828" y1="414.1935" x2="174.4828" y2="507.7419" stroke="var(--text)" stroke-width="2" />
  <line x1="484.8276" y1="414.1935" x2="484.8276" y2="507.7419" stroke="var(--text)" stroke-width="2" />
  <line x1="795.1725" y1="414.1935" x2="795.1725" y2="507.7419" stroke="var(--text)" stroke-width="2" />
  <line x1="1105.5173" y1="414.1935" x2="1105.5173" y2="507.7419" stroke="var(--text)" stroke-width="2" />
  <rect x="40" y="507.7419" width="1200" height="112.2581" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="582.5806" text-anchor="middle" font-size="23.5611">Guest Virtual NIC: e1000 / rtl8139 / virtio-net</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="54" text-anchor="middle" font-size="25.6" font-weight="bold">QEMU Network Models</text>
  <rect x="21.3333" y="108" width="277.3333" height="270" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="160" y="180" text-anchor="middle" font-size="23.4667" font-weight="bold">User (SLIRP)</text>
  <text x="160" y="234" text-anchor="middle" font-size="21.3333">Built-in NAT</text>
  <text x="160" y="288" text-anchor="middle" font-size="21.3333">No root needed</text>
  <text x="160" y="342" text-anchor="middle" font-size="21.3333" fill="var(--text-muted)">Limited perf</text>
  <rect x="341.3333" y="108" width="277.3333" height="270" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="480" y="180" text-anchor="middle" font-size="23.4667" font-weight="bold">TAP</text>
  <text x="480" y="234" text-anchor="middle" font-size="21.3333">L2 access</text>
  <text x="480" y="288" text-anchor="middle" font-size="21.3333">Kernel tap device</text>
  <text x="480" y="342" text-anchor="middle" font-size="21.3333" fill="var(--text-muted)">Root required</text>
  <rect x="661.3333" y="108" width="277.3333" height="270" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="800" y="180" text-anchor="middle" font-size="23.4667" font-weight="bold">Bridge</text>
  <text x="800" y="234" text-anchor="middle" font-size="21.3333">Full LAN access</text>
  <text x="800" y="288" text-anchor="middle" font-size="21.3333">Host bridge + tap</text>
  <text x="800" y="342" text-anchor="middle" font-size="21.3333" fill="var(--text-muted)">Most flexible</text>
  <rect x="981.3333" y="108" width="277.3333" height="270" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="1120" y="180" text-anchor="middle" font-size="23.4667" font-weight="bold">VDE</text>
  <text x="1120" y="234" text-anchor="middle" font-size="21.3333">Virtual switch</text>
  <text x="1120" y="288" text-anchor="middle" font-size="21.3333">Multi-VM setups</text>
  <text x="1120" y="342" text-anchor="middle" font-size="21.3333" fill="var(--text-muted)">User-space</text>
  <line x1="160" y1="414" x2="160" y2="504" stroke="var(--text)" stroke-width="2" />
  <line x1="480" y1="414" x2="480" y2="504" stroke="var(--text)" stroke-width="2" />
  <line x1="800" y1="414" x2="800" y2="504" stroke="var(--text)" stroke-width="2" />
  <line x1="1120" y1="414" x2="1120" y2="504" stroke="var(--text)" stroke-width="2" />
  <rect x="21.3333" y="504" width="1237.3333" height="108" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="640" y="576" text-anchor="middle" font-size="23.4667">Guest Virtual NIC: e1000 / rtl8139 / virtio-net</text>
</svg>
  <rect x="726.1539" y="230.0481" width="193.8462" height="181.7308" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="823.0769" y="302.7404" text-anchor="middle" font-size="23.6923" font-weight="bold">br0</text>
  <text x="823.0769" y="364.5288" text-anchor="middle" font-size="21.5384">Host Bridge</text>
  <rect x="984.6154" y="230.0481" width="215.3846" height="181.7308" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />

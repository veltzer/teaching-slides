  <line x1="424.6154" y1="320.9135" x2="489.2307" y2="320.9135" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_03_qemu_networking)" />
  <line x1="661.5385" y1="320.9135" x2="726.1539" y2="320.9135" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_03_qemu_networking)" />
  <line x1="920" y1="320.9135" x2="984.6154" y2="320.9135" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_03_qemu_networking)" />
  <text x="661.5385" y="520.8173" text-anchor="middle" font-size="21.5384" fill="var(--text-muted)">-netdev tap,id=net0,ifname=tap0 -device virtio-net,netdev=net0</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>

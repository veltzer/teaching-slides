<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="369.2308" height="488.420895567896" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.30788922405" filter="url(#shadow)"/>
  <text x="224.6154" y="162.105472576139" text-anchor="middle" font-size="31.784192222145" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Guest VM</text>
  <rect x="63.0769" y="223.157987811617" width="138.4616" height="213.684134903061" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.30788922405" filter="url(#shadow)"/>
  <text x="132.3076" y="326.947484764522" text-anchor="middle" font-size="28.894653300095" font-family="Arial, sans-serif" fill="var(--warn-text)">eth0</text>
  <text x="132.3076" y="400.210613573391" text-anchor="middle" font-size="28.894653300095" font-family="Arial, sans-serif" fill="var(--warn-text)">virtio-net</text>
  <rect x="247.6924" y="223.157987811617" width="138.4616" height="213.684134903061" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.30788922405" filter="url(#shadow)"/>
  <text x="316.923" y="326.947484764522" text-anchor="middle" font-size="28.894653300095" font-family="Arial, sans-serif" fill="var(--warn-text)">IP:</text>
  <text x="316.923" y="400.210613573391" text-anchor="middle" font-size="28.894653300095" font-family="Arial, sans-serif" fill="var(--warn-text)">192.168.1.10</text>
  <rect x="478.4615" y="131.579104432104" width="184.6154" height="305.26312880887" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.30788922405" filter="url(#shadow)"/>
  <text x="570.7693" y="253.684355955652" text-anchor="middle" font-size="31.784192222145" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">tap0</text>
  <text x="570.7693" y="357.473631855965" text-anchor="middle" font-size="28.894653300095" font-family="Arial, sans-serif" fill="var(--info-text)">Kernel TAP</text>
  <rect x="732.3078" y="131.579104432104" width="207.6924" height="305.26312880887" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.30788922405" filter="url(#shadow)"/>
  <text x="836.1538" y="253.684355955652" text-anchor="middle" font-size="31.784192222145" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">br0</text>
  <text x="836.1538" y="357.473631855965" text-anchor="middle" font-size="28.894653300095" font-family="Arial, sans-serif" fill="var(--ok-text)">Host Bridge</text>
  <rect x="1009.2308" y="131.579104432104" width="230.7692" height="305.26312880887" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.30788922405" filter="url(#shadow)"/>
  <text x="1124.6155" y="253.684355955652" text-anchor="middle" font-size="31.784192222145" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">eth0 (Host)</text>
  <text x="1124.6155" y="357.473631855965" text-anchor="middle" font-size="28.894653300095" font-family="Arial, sans-serif" fill="var(--danger-text)">Physical NIC</text>
  <line x1="409.2308" y1="284.210613573391" x2="478.4615" y2="284.210613573391" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="663.077" y1="284.210613573391" x2="732.3078" y2="284.210613573391" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="940" y1="284.210613573391" x2="1009.2308" y2="284.210613573391" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="663.077" y="620" text-anchor="middle" font-size="28.894653300095" fill="var(--text-muted)" font-family="Arial, sans-serif">-netdev tap,id=net0,ifname=tap0 -device virtio-net,netdev=net0</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

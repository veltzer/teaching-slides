  <rect x="101.5384" y="284.5673" width="129.2308" height="127.2115" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="166.1538" y="346.3558" text-anchor="middle" font-size="21.5384">eth0</text>
  <text x="166.1538" y="389.9712" text-anchor="middle" font-size="21.5384">virtio-net</text>
  <rect x="273.8462" y="284.5673" width="129.2308" height="127.2115" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />

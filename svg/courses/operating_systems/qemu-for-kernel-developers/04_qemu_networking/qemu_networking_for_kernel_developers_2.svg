<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="663.077" y="40" text-anchor="middle" font-size="32.9814" font-weight="bold">TAP Networking Setup</text>
  <rect x="40" y="95.238" width="369.2308" height="441.9047" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="224.6154" y="205.7144" text-anchor="middle" font-size="30.2328" font-weight="bold">Guest VM</text>
  <rect x="63.0769" y="260.9524" width="138.4616" height="193.3333" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="132.3076" y="354.8572" text-anchor="middle" font-size="27.4843">eth0</text>
  <text x="132.3076" y="421.1429" text-anchor="middle" font-size="27.4843">virtio-net</text>
  <rect x="247.6924" y="260.9524" width="138.4616" height="193.3333" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="316.923" y="354.8572" text-anchor="middle" font-size="27.4843">IP:</text>
  <text x="316.923" y="421.1429" text-anchor="middle" font-size="27.4843">192.168.1.10</text>
  <rect x="478.4615" y="178.0953" width="184.6154" height="276.1905" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="570.7693" y="288.5715" text-anchor="middle" font-size="30.2328" font-weight="bold">tap0</text>
  <text x="570.7693" y="382.4761" text-anchor="middle" font-size="27.4843">Kernel TAP</text>
  <rect x="732.3078" y="178.0953" width="207.6924" height="276.1905" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="836.1538" y="288.5715" text-anchor="middle" font-size="30.2328" font-weight="bold">br0</text>
  <text x="836.1538" y="382.4761" text-anchor="middle" font-size="27.4843">Host Bridge</text>
  <rect x="1009.2308" y="178.0953" width="230.7692" height="276.1905" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1124.6155" y="288.5715" text-anchor="middle" font-size="30.2328" font-weight="bold">eth0 (Host)</text>
  <text x="1124.6155" y="382.4761" text-anchor="middle" font-size="27.4843">Physical NIC</text>
  <line x1="409.2308" y1="316.1905" x2="478.4615" y2="316.1905" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_03_qemu_networking)" />
  <line x1="663.077" y1="316.1905" x2="732.3078" y2="316.1905" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_03_qemu_networking)" />
  <line x1="940" y1="316.1905" x2="1009.2308" y2="316.1905" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_03_qemu_networking)" />
  <text x="663.077" y="620" text-anchor="middle" font-size="27.4843" fill="var(--text-muted)">-netdev tap,id=net0,ifname=tap0 -device virtio-net,netdev=net0</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd1_03_qemu_networking" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f23"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Virtual machine box -->
  <rect x="250" y="70" width="300" height="260" rx="12" fill="none" stroke="#ff6e00" stroke-width="2.5"/>
  <text x="400" y="55" text-anchor="middle" font-size="14" fill="#ff6e00" font-family="monospace">QEMU Virtual Machine</text>
  <!-- Inner kernel box -->
  <rect x="280" y="100" width="240" height="120" rx="8" fill="#1a0a00" stroke="#ff9e00" stroke-width="1.5"/>
  <text x="400" y="130" text-anchor="middle" font-size="16" fill="#ff9e00" font-weight="bold">Linux Kernel</text>
  <text x="400" y="155" text-anchor="middle" font-size="11" fill="#cc7a00" font-family="monospace">vmlinuz / bzImage</text>
  <!-- Kernel subsystems -->
  <rect x="295" y="170" width="60" height="35" rx="4" fill="#ff6e00" opacity="0.2"/>
  <text x="325" y="192" text-anchor="middle" font-size="9" fill="#ff9e00">sched</text>
  <rect x="365" y="170" width="60" height="35" rx="4" fill="#ff6e00" opacity="0.2"/>
  <text x="395" y="192" text-anchor="middle" font-size="9" fill="#ff9e00">mm</text>
  <rect x="435" y="170" width="60" height="35" rx="4" fill="#ff6e00" opacity="0.2"/>
  <text x="465" y="192" text-anchor="middle" font-size="9" fill="#ff9e00">vfs</text>
  <!-- Virtual hardware -->
  <rect x="280" y="235" width="70" height="30" rx="4" fill="#331a00" stroke="#ff6e00" stroke-width="1"/>
  <text x="315" y="254" text-anchor="middle" font-size="9" fill="#ff9e00">vCPU</text>
  <rect x="360" y="235" width="70" height="30" rx="4" fill="#331a00" stroke="#ff6e00" stroke-width="1"/>
  <text x="395" y="254" text-anchor="middle" font-size="9" fill="#ff9e00">vRAM</text>
  <rect x="440" y="235" width="70" height="30" rx="4" fill="#331a00" stroke="#ff6e00" stroke-width="1"/>
  <text x="475" y="254" text-anchor="middle" font-size="9" fill="#ff9e00">virtio</text>
  <!-- GDB debugger on left -->
  <rect x="50" y="130" width="140" height="100" rx="8" fill="#0a1628" stroke="#4a9eff" stroke-width="1.5"/>
  <text x="120" y="155" text-anchor="middle" font-size="13" fill="#4a9eff" font-weight="bold">GDB</text>
  <text x="120" y="175" text-anchor="middle" font-size="10" fill="#6db3ff" font-family="monospace">(gdb) break</text>
  <text x="120" y="192" text-anchor="middle" font-size="10" fill="#6db3ff" font-family="monospace">start_kernel</text>
  <text x="120" y="212" text-anchor="middle" font-size="10" fill="#4a9eff" font-family="monospace">Breakpoint 1</text>
  <!-- Arrow from GDB to VM -->
  <line x1="190" y1="180" x2="245" y2="180" stroke="#4a9eff" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="245,175 255,180 245,185" fill="#4a9eff"/>
  <!-- Host system on right -->
  <rect x="610" y="130" width="140" height="100" rx="8" fill="#0a1628" stroke="#27c93f" stroke-width="1.5"/>
  <text x="680" y="155" text-anchor="middle" font-size="13" fill="#27c93f" font-weight="bold">Host</text>
  <text x="680" y="175" text-anchor="middle" font-size="10" fill="#27c93f" font-family="monospace">$ qemu-system</text>
  <text x="680" y="192" text-anchor="middle" font-size="10" fill="#27c93f" font-family="monospace">-kernel bzImage</text>
  <text x="680" y="212" text-anchor="middle" font-size="10" fill="#27c93f" font-family="monospace">-s -S -nographic</text>
  <!-- Arrow from host to VM -->
  <line x1="610" y1="180" x2="555" y2="180" stroke="#27c93f" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="555,175 545,180 555,185" fill="#27c93f"/>
</svg>

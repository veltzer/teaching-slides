<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <rect x="415" y="141.5" width="450" height="377" rx="6" fill="none" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="119.75" text-anchor="middle" font-size="19.4662" fill="var(--warn-accent)" font-family="Courier New, monospace">QEMU Virtual Machine</text>
  <rect x="460" y="185" width="360" height="174" rx="6" fill="var(--black)" stroke="var(--warn-border)" stroke-width="2.1333"/>
  <text x="640" y="228.5" text-anchor="middle" font-size="22.2471" fill="var(--warn-accent)" font-weight="bold" font-family="Arial, sans-serif">Linux Kernel</text>
  <text x="640" y="264.75" text-anchor="middle" font-size="15.2948" fill="var(--warn-accent)" font-family="Courier New, monospace">vmlinuz / bzImage</text>
  <rect x="482.5" y="286.5" width="90" height="50.75" rx="6" fill="var(--warn-accent)" opacity="0.2"/>
  <text x="527.5" y="318.4" text-anchor="middle" font-size="13.9044" fill="var(--warn-accent)" font-family="Arial, sans-serif">sched</text>
  <rect x="587.5" y="286.5" width="90" height="50.75" rx="6" fill="var(--warn-accent)" opacity="0.2"/>
  <text x="632.5" y="318.4" text-anchor="middle" font-size="13.9044" fill="var(--warn-accent)" font-family="Arial, sans-serif">mm</text>
  <rect x="692.5" y="286.5" width="90" height="50.75" rx="6" fill="var(--warn-accent)" opacity="0.2"/>
  <text x="737.5" y="318.4" text-anchor="middle" font-size="13.9044" fill="var(--warn-accent)" font-family="Arial, sans-serif">vfs</text>
  <rect x="460" y="380.75" width="105" height="43.5" rx="6" fill="var(--text)" stroke="var(--warn-border)" stroke-width="1.4222"/>
  <text x="512.5" y="408.3" text-anchor="middle" font-size="13.9044" fill="var(--warn-accent)" font-family="Arial, sans-serif">vCPU</text>
  <rect x="580" y="380.75" width="105" height="43.5" rx="6" fill="var(--text)" stroke="var(--warn-border)" stroke-width="1.4222"/>
  <text x="632.5" y="408.3" text-anchor="middle" font-size="13.9044" fill="var(--warn-accent)" font-family="Arial, sans-serif">vRAM</text>
  <rect x="700" y="380.75" width="105" height="43.5" rx="6" fill="var(--text)" stroke="var(--warn-border)" stroke-width="1.4222"/>
  <text x="752.5" y="408.3" text-anchor="middle" font-size="13.9044" fill="var(--warn-accent)" font-family="Arial, sans-serif">virtio</text>
  <rect x="115" y="228.5" width="210" height="145" rx="6" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="2.1333"/>
  <text x="220" y="264.75" text-anchor="middle" font-size="18.0758" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">GDB</text>
  <text x="220" y="293.75" text-anchor="middle" font-size="13.9044" fill="var(--primary-accent)" font-family="Courier New, monospace">(gdb) break</text>
  <text x="220" y="318.4" text-anchor="middle" font-size="13.9044" fill="var(--primary-accent)" font-family="Courier New, monospace">start_kernel</text>
  <text x="220" y="347.4" text-anchor="middle" font-size="13.9044" fill="var(--primary-accent)" font-family="Courier New, monospace">Breakpoint 1</text>
  <line x1="325" y1="301" x2="407.4999" y2="301" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="7.1111 4.2667"/>
  <polygon points="407.4999,293.75 422.5,301 407.4999,308.25" fill="var(--primary-fill)"/>
  <rect x="955" y="228.5" width="210" height="145" rx="6" fill="var(--code-bg)" stroke="var(--ok-border)" stroke-width="2.1333"/>
  <text x="1060" y="264.75" text-anchor="middle" font-size="18.0758" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">Host</text>
  <text x="1060" y="293.75" text-anchor="middle" font-size="13.9044" fill="var(--ok-accent)" font-family="Courier New, monospace">$ qemu-system</text>
  <text x="1060" y="318.4" text-anchor="middle" font-size="13.9044" fill="var(--ok-accent)" font-family="Courier New, monospace">-kernel bzImage</text>
  <text x="1060" y="347.4" text-anchor="middle" font-size="13.9044" fill="var(--ok-accent)" font-family="Courier New, monospace">-s -S -nographic</text>
  <line x1="955" y1="301" x2="872.4999" y2="301" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="7.1111 4.2667"/>
  <polygon points="872.4999,293.75 857.5,301 872.4999,308.25" fill="var(--ok-fill)"/>
  <text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">Qemu For Kernel Developers</text>
</svg>

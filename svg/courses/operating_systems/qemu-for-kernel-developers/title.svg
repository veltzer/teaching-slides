<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="bg" x1="0" y1="0" x2="1.6" y2="1.8">
      <stop offset="0%" stop-color="#1a1a2e" />
      <stop offset="100%" stop-color="#1a1a2e" />
    </linearGradient>
  </defs>
  <rect width="1137.7778" height="640" fill="url(#bg)" rx="6"/>
  <rect x="355.5556" y="112" width="426.6667" height="416" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
  <text x="568.8889" y="88" text-anchor="middle" font-size="19.9111" fill="var(--warn-accent)" font-family="monospace">QEMU Virtual Machine</text>
  <rect x="398.2222" y="160" width="341.3333" height="192" rx="6" fill="var(--black)" stroke="var(--warn-border)" stroke-width="2.1333" />
  <text x="568.8889" y="208" text-anchor="middle" font-size="22.7556" fill="var(--warn-accent)" font-weight="bold">Linux Kernel</text>
  <text x="568.8889" y="248" text-anchor="middle" font-size="15.6444" fill="var(--warn-accent)" font-family="monospace">vmlinuz / bzImage</text>
  <rect x="419.5556" y="272" width="85.3333" height="56" rx="6" fill="var(--warn-accent)" opacity="0.2" />
  <text x="462.2222" y="307.2" text-anchor="middle" font-size="14.2222" fill="var(--warn-accent)">sched</text>
  <rect x="519.1111" y="272" width="85.3333" height="56" rx="6" fill="var(--warn-accent)" opacity="0.2" />
  <text x="561.7778" y="307.2" text-anchor="middle" font-size="14.2222" fill="var(--warn-accent)">mm</text>
  <rect x="618.6667" y="272" width="85.3333" height="56" rx="6" fill="var(--warn-accent)" opacity="0.2" />
  <text x="661.3333" y="307.2" text-anchor="middle" font-size="14.2222" fill="var(--warn-accent)">vfs</text>
  <rect x="398.2222" y="376" width="99.5556" height="48" rx="6" fill="var(--text)" stroke="var(--warn-border)" stroke-width="1.4222" />
  <text x="448" y="406.4" text-anchor="middle" font-size="14.2222" fill="var(--warn-accent)">vCPU</text>
  <rect x="512" y="376" width="99.5556" height="48" rx="6" fill="var(--text)" stroke="var(--warn-border)" stroke-width="1.4222" />
  <text x="561.7778" y="406.4" text-anchor="middle" font-size="14.2222" fill="var(--warn-accent)">vRAM</text>
  <rect x="625.7778" y="376" width="99.5556" height="48" rx="6" fill="var(--text)" stroke="var(--warn-border)" stroke-width="1.4222" />
  <text x="675.5556" y="406.4" text-anchor="middle" font-size="14.2222" fill="var(--warn-accent)">virtio</text>
  <rect x="71.1111" y="208" width="199.1111" height="160" rx="6" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="2.1333" />
  <text x="170.6667" y="248" text-anchor="middle" font-size="18.4889" fill="var(--primary-accent)" font-weight="bold">GDB</text>
  <text x="170.6667" y="280" text-anchor="middle" font-size="14.2222" fill="var(--primary-accent)" font-family="monospace">(gdb) break</text>
  <text x="170.6667" y="307.2" text-anchor="middle" font-size="14.2222" fill="var(--primary-accent)" font-family="monospace">start_kernel</text>
  <text x="170.6667" y="339.2" text-anchor="middle" font-size="14.2222" fill="var(--primary-accent)" font-family="monospace">Breakpoint 1</text>
  <line x1="270.2222" y1="288" x2="348.4444" y2="288" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="7.1111 4.2667" />
  <polygon points="348.4444,280 362.6667,288 348.4444,296" fill="var(--primary-fill)" />
  <rect x="867.5556" y="208" width="199.1111" height="160" rx="6" fill="var(--code-bg)" stroke="var(--ok-border)" stroke-width="2.1333" />
  <text x="967.1111" y="248" text-anchor="middle" font-size="18.4889" fill="var(--ok-accent)" font-weight="bold">Host</text>
  <text x="967.1111" y="280" text-anchor="middle" font-size="14.2222" fill="var(--ok-accent)" font-family="monospace">$ qemu-system</text>
  <text x="967.1111" y="307.2" text-anchor="middle" font-size="14.2222" fill="var(--ok-accent)" font-family="monospace">-kernel bzImage</text>
  <text x="967.1111" y="339.2" text-anchor="middle" font-size="14.2222" fill="var(--ok-accent)" font-family="monospace">-s -S -nographic</text>
  <line x1="867.5556" y1="288" x2="789.3333" y2="288" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="7.1111 4.2667" />
  <polygon points="789.3333,280 775.1111,288 789.3333,296" fill="var(--ok-fill)" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="621.8181" y="40" text-anchor="middle" font-size="26.1844" font-weight="bold">QEMU/KVM Architecture</text>
  <rect x="40" y="73.1428" width="1163.6364" height="116" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="621.8181" y="149.3714" text-anchor="middle" font-size="24.0023">Guest OS (Kernel + User Processes)</text>
  <rect x="40" y="222.2858" width="557.5757" height="116" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="318.7878" y="298.5143" text-anchor="middle" font-size="24.0023">QEMU (Userspace) - Device I/O</text>
  <rect x="646.0605" y="222.2858" width="557.5757" height="116" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="924.8485" y="298.5143" text-anchor="middle" font-size="24.0023">KVM Kernel Module</text>
  <rect x="40" y="371.4286" width="1163.6364" height="116" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="621.8181" y="447.6571" text-anchor="middle" font-size="24.0023">Host Linux Kernel</text>
  <rect x="40" y="520.5715" width="1163.6364" height="99.4285" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="621.8181" y="586.8572" text-anchor="middle" font-size="24.0023">Hardware: CPU (VT-x/AMD-V) + EPT/NPT + IOMMU</text>
  <line x1="318.7878" y1="189.1429" x2="318.7878" y2="222.2858" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd0_06_qemu_virtualization)" />
  <line x1="924.8485" y1="189.1429" x2="924.8485" y2="222.2858" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd0_06_qemu_virtualization)" />
  <line x1="318.7878" y1="338.2857" x2="318.7878" y2="371.4286" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd0_06_qemu_virtualization)" />
  <line x1="924.8485" y1="338.2857" x2="924.8485" y2="371.4286" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd0_06_qemu_virtualization)" />
  <line x1="621.8181" y1="487.4286" x2="621.8181" y2="520.5715" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd0_06_qemu_virtualization)" />
  <text x="1240" y="149.3714" text-anchor="start" font-size="21.8203" fill="var(--text-muted)">Ring 3</text>
  <text x="1240" y="298.5143" text-anchor="start" font-size="21.8203" fill="var(--text-muted)">Ring 0</text>
  <text x="1240" y="586.8572" text-anchor="start" font-size="21.8203" fill="var(--text-muted)">Ring -1</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd0_06_qemu_virtualization" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
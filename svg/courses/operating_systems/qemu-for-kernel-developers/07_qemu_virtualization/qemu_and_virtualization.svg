<svg width="600" height="200" xmlns="http://www.w3.org/2000/svg">
  <text x="300" y="15" text-anchor="middle" font-size="12" font-weight="bold">QEMU/KVM Architecture</text>
  <rect x="60" y="25" width="480" height="35" fill="#e3f2fd" stroke="#333" stroke-width="2" rx="5"/>
  <text x="300" y="48" text-anchor="middle" font-size="11">Guest OS (Kernel + User Processes)</text>
  <rect x="60" y="70" width="230" height="35" fill="#f3e5f5" stroke="#333" stroke-width="2" rx="5"/>
  <text x="175" y="93" text-anchor="middle" font-size="11">QEMU (Userspace) - Device I/O</text>

  <line x1="175" y1="60" x2="175" y2="70" stroke="#333" stroke-width="1.5" marker-end="url(#arrowd0_06_qemu_virtualization)"/>
  <line x1="425" y1="60" x2="425" y2="70" stroke="#333" stroke-width="1.5" marker-end="url(#arrowd0_06_qemu_virtualization)"/>
  <line x1="175" y1="105" x2="175" y2="115" stroke="#333" stroke-width="1.5" marker-end="url(#arrowd0_06_qemu_virtualization)"/>
  <line x1="425" y1="105" x2="425" y2="115" stroke="#333" stroke-width="1.5" marker-end="url(#arrowd0_06_qemu_virtualization)"/>
  <line x1="300" y1="150" x2="300" y2="160" stroke="#333" stroke-width="1.5" marker-end="url(#arrowd0_06_qemu_virtualization)"/>
  <text x="555" y="48" text-anchor="start" font-size="9" fill="#555">Ring 3</text>

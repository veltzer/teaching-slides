  <text x="568.8889" y="629.3333" font-family="Arial, sans-serif" font-size="11.7333" text-anchor="middle">Handle Failures</text>
  <line x1="632.8889" y1="544" x2="739.5556" y2="576" stroke="var(--text-faint)" stroke-width="1.0667" />
  <rect x="668.4444" y="560" width="142.2222" height="32" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="739.5556" y="581.3333" font-family="Arial, sans-serif" font-size="11.7333" text-anchor="middle">Provide Controls</text>
</svg>
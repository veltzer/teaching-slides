  <circle cx="853.3333" cy="160" r="48" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.1333" />
  <text x="853.3333" y="165.3333" font-family="Arial, sans-serif" font-size="12.8" font-weight="bold" text-anchor="middle" fill="var(--bg)">Reliability</text>
  <line x1="917.3333" y1="128" x2="1024" y2="85.3333" stroke="var(--text-faint)" stroke-width="1.0667" />
  <rect x="952.8889" y="64" width="142.2222" height="32" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1024" y="85.3333" font-family="Arial, sans-serif" font-size="11.7333" text-anchor="middle">Handle Errors</text>
  <line x1="917.3333" y1="160" x2="1038.2222" y2="160" stroke="var(--text-faint)" stroke-width="1.0667" />
  <rect x="967.1111" y="144" width="142.2222" height="32" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1038.2222" y="165.3333" font-family="Arial, sans-serif" font-size="11.7333" text-anchor="middle">Implement Retry</text>

  <rect x="747.6923" y="539.4444" width="153.8461" height="32.2222" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="824.6155" y="560.9259" font-family="Arial, sans-serif" font-size="12.2457" text-anchor="middle" fill="var(--info-text)">Provide Controls</text>
</svg>
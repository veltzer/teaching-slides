  <rect x="924.4444" y="218.6667" width="199.1111" height="32" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1024" y="240" font-family="Arial, sans-serif" font-size="11.7333" text-anchor="middle">Consider Device State</text>

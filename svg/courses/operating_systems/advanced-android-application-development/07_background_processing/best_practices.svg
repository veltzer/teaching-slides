  <circle cx="284.4444" cy="160" r="48" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.1333" />
  <text x="284.4444" y="154.6667" font-family="Arial, sans-serif" font-size="12.8" font-weight="bold" text-anchor="middle" fill="var(--bg)">Battery</text>
  <text x="284.4444" y="170.6667" font-family="Arial, sans-serif" font-size="12.8" font-weight="bold" text-anchor="middle" fill="var(--bg)">Life</text>
  <line x1="220.4444" y1="128" x2="113.7778" y2="85.3333" stroke="var(--text-faint)" stroke-width="1.0667" />
  <rect x="28.4444" y="64" width="170.6667" height="32" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="113.7778" y="85.3333" font-family="Arial, sans-serif" font-size="11.7333" text-anchor="middle">Optimize Scheduling</text>

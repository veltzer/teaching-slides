  <rect x="282.212" y="86.5706" width="100.192" height="100.192" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2.1333" filter="url(#shadow)"/>
  <text x="332.3077" y="131.2963" font-family="Arial, sans-serif" font-size="13.3589" font-weight="bold" text-anchor="middle" fill="var(--bg)">Battery</text>
  <text x="332.3077" y="147.4074" font-family="Arial, sans-serif" font-size="13.3589" font-weight="bold" text-anchor="middle" fill="var(--bg)">Life</text>
  <line x1="263.0769" y1="104.4444" x2="147.6924" y2="61.4814" stroke="var(--text-faint)" stroke-width="1.0667" />
  <rect x="55.3846" y="40" width="184.6154" height="32.2222" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="147.6924" y="61.4814" font-family="Arial, sans-serif" font-size="12.2457" text-anchor="middle" fill="var(--primary-text)">Optimize Scheduling</text>
  <line x1="263.0769" y1="136.6667" x2="132.3078" y2="136.6667" stroke="var(--text-faint)" stroke-width="1.0667" />
  <rect x="40" y="120.5556" width="169.2307" height="32.2222" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="124.6154" y="142.037" font-family="Arial, sans-serif" font-size="12.2457" text-anchor="middle" fill="var(--primary-text)">Batch Operations</text>

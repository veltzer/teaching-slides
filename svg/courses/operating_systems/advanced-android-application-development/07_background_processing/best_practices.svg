  <rect x="14.2222" y="144" width="156.4444" height="32" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="92.4444" y="165.3333" font-family="Arial, sans-serif" font-size="11.7333" text-anchor="middle">Batch Operations</text>
  <line x1="220.4444" y1="192" x2="113.7778" y2="234.6667" stroke="var(--text-faint)" stroke-width="1.0667" />
  <rect x="35.5556" y="218.6667" width="149.3333" height="32" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="109.5111" y="240" font-family="Arial, sans-serif" font-size="11.7333" text-anchor="middle">Use Constraints</text>

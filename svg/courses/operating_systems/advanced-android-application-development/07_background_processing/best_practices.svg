  <rect x="63.077" y="195.7408" width="161.5384" height="32.2222" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="143.0769" y="217.2222" font-family="Arial, sans-serif" font-size="12.2457" text-anchor="middle" fill="var(--primary-text)">Use Constraints</text>
  <line x1="747.6923" y1="244.0741" x2="947.6923" y2="136.6667" stroke="var(--text-muted)" stroke-width="2" />
  <rect x="897.596" y="86.5706" width="100.192" height="100.192" rx="14" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2.1333" filter="url(#shadow)"/>
  <text x="947.6923" y="142.037" font-family="Arial, sans-serif" font-size="13.3589" font-weight="bold" text-anchor="middle" fill="var(--bg)">Reliability</text>
  <line x1="1016.9231" y1="104.4444" x2="1132.3077" y2="61.4814" stroke="var(--text-faint)" stroke-width="1.0667" />
  <rect x="1055.3847" y="40" width="153.8461" height="32.2222" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1132.3077" y="61.4814" font-family="Arial, sans-serif" font-size="12.2457" text-anchor="middle" fill="var(--warn-text)">Handle Errors</text>

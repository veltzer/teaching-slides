  <text x="568.8889" y="517.3333" font-family="Arial, sans-serif" font-size="12.8" font-weight="bold" text-anchor="middle" fill="var(--bg)">User</text>
  <text x="568.8889" y="533.3333" font-family="Arial, sans-serif" font-size="12.8" font-weight="bold" text-anchor="middle" fill="var(--bg)">Experience</text>

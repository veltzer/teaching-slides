  <rect x="1070.7693" y="120.5556" width="153.8461" height="32.2222" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1147.6923" y="142.037" font-family="Arial, sans-serif" font-size="12.2457" text-anchor="middle" fill="var(--warn-text)">Implement Retry</text>
  <line x1="1016.9231" y1="168.8889" x2="1132.3077" y2="211.8519" stroke="var(--text-faint)" stroke-width="1.0667" />

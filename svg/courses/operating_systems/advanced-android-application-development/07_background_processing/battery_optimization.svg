<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,12 5.6,0" fill="#666" />
    </marker>
  </defs>
  <rect x="453.3333" y="95.5" width="373.3333" height="84" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640" y="144.5" font-family="Arial, sans-serif" font-size="22.4" font-weight="bold" text-anchor="middle" fill="var(--bg)">Battery Optimization</text>
  <line x1="453.3333" y1="179.5" x2="266.6667" y2="305.5" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="80" y="305.5" width="261.3333" height="70" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="210.6667" y="347.5" font-family="Arial, sans-serif" font-size="19.6" font-weight="bold" text-anchor="middle" fill="var(--bg)">Deferred Execution</text>
  <line x1="210.6667" y1="375.5" x2="210.6667" y2="487.5" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="98.6667" y="501.5" width="224" height="63" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="210.6667" y="540.7" font-family="Arial, sans-serif" font-size="18.2" text-anchor="middle">WorkManager</text>
  <line x1="640" y1="179.5" x2="640" y2="305.5" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="490.6667" y="319.5" width="298.6667" height="70" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="361.5" font-family="Arial, sans-serif" font-size="19.6" font-weight="bold" text-anchor="middle" fill="var(--bg)">Batched Operations</text>
  <line x1="640" y1="389.5" x2="640" y2="487.5" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="490.6667" y="501.5" width="298.6667" height="63" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="540.7" font-family="Arial, sans-serif" font-size="18.2" text-anchor="middle">Background Tasks</text>
  <line x1="826.6667" y1="179.5" x2="1013.3333" y2="305.5" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="938.6667" y="305.5" width="261.3333" height="70" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="1069.3333" y="347.5" font-family="Arial, sans-serif" font-size="19.6" font-weight="bold" text-anchor="middle" fill="var(--bg)">Network Efficiency</text>
  <line x1="1069.3333" y1="375.5" x2="1069.3333" y2="487.5" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="957.3333" y="501.5" width="224" height="63" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1069.3333" y="540.7" font-family="Arial, sans-serif" font-size="18.2" text-anchor="middle">Data Sync</text>
</svg>
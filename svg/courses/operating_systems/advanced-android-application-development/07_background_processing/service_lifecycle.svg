<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <circle cx="51.2258" cy="73.1272" r="11.2258" fill="var(--black)" />
  <line x1="67.0762" y1="73.1272" x2="209.729" y2="73.1272" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="229.5419" y="40" width="198.129" height="66.2544" rx="5.9968" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="328.6064" y="79.7526" font-family="Arial, sans-serif" font-size="19.6451" font-weight="bold" text-anchor="middle" fill="var(--bg)">onCreate</text>
  <line x1="427.671" y1="73.1272" x2="625.8" y2="73.1272" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="526.7355" y="59.8763" font-family="Arial, sans-serif" font-size="15.4354" text-anchor="middle">startService()</text>
  <rect x="645.6129" y="40" width="277.3806" height="66.2544" rx="5.9968" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="784.3032" y="79.7526" font-family="Arial, sans-serif" font-size="19.6451" font-weight="bold" text-anchor="middle" fill="var(--bg)">onStartCommand</text>
  <line x1="784.3032" y1="106.2544" x2="784.3032" y2="437.5256" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="883.3677" y="271.8899" font-family="Arial, sans-serif" font-size="15.4354">stopService()</text>
  <line x1="328.6064" y1="106.2544" x2="328.6064" y2="205.6357" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="328.6064" y1="205.6357" x2="1022.0581" y2="205.6357" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="675.3323" y="192.3848" font-family="Arial, sans-serif" font-size="15.4354" text-anchor="middle">bindService()</text>
  <rect x="1041.871" y="172.5085" width="198.129" height="66.2544" rx="5.9968" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1140.9355" y="212.2611" font-family="Arial, sans-serif" font-size="19.6451" font-weight="bold" text-anchor="middle" fill="var(--bg)">onBind</text>
  <line x1="1140.9355" y1="238.7629" x2="1140.9355" y2="305.0171" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="1240" y="271.8899" font-family="Arial, sans-serif" font-size="15.4354">unbindService()</text>
  <rect x="1041.871" y="318.268" width="198.129" height="66.2544" rx="5.9968" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="1140.9355" y="358.0205" font-family="Arial, sans-serif" font-size="19.6451" font-weight="bold" text-anchor="middle" fill="var(--bg)">onUnbind</text>
  <line x1="1041.871" y1="351.3951" x2="922.9934" y2="437.5256" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="685.2388" y="450.7765" width="198.129" height="66.2544" rx="5.9968" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="784.3032" y="490.5291" font-family="Arial, sans-serif" font-size="19.6451" font-weight="bold" text-anchor="middle" fill="var(--bg)">onDestroy</text>
  <line x1="784.3032" y1="517.0309" x2="784.3032" y2="583.2851" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <circle cx="784.3032" cy="603.1613" r="11.2258" fill="var(--black)" />
  <circle cx="784.3032" cy="603.1613" r="16.8387" fill="none" stroke="var(--black)" stroke-width="2.4" />
</svg>
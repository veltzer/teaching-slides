<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="61.901385" width="22.4516" height="22.451585" rx="11.225796" fill="var(--black)"/>
  <line x1="67.0762" y1="73.127177" x2="209.729" y2="73.127177" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="229.5419" y="40" width="198.129" height="66.254354" rx="5.996798" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="328.6064" y="79.752573" font-family="Arial, sans-serif" font-size="19.645093" font-weight="bold" text-anchor="middle" fill="var(--bg)">onCreate</text>
  <line x1="427.671" y1="73.127177" x2="625.8" y2="73.127177" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="526.7355" y="59.876286" font-family="Arial, sans-serif" font-size="15.435395" text-anchor="middle" fill="var(--text)">startService()</text>
  <rect x="645.6129" y="40" width="277.3806" height="66.254354" rx="5.996798" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="784.3032" y="79.752573" font-family="Arial, sans-serif" font-size="19.645093" font-weight="bold" text-anchor="middle" fill="var(--bg)">onStartCommand</text>
  <line x1="784.3032" y1="106.254354" x2="784.3032" y2="437.525326" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="883.3677" y="271.88974" font-family="Arial, sans-serif" font-size="15.435395" fill="var(--text)">stopService()</text>
  <line x1="328.6064" y1="106.254354" x2="328.6064" y2="205.635586" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="328.6064" y1="205.635586" x2="1022.0581" y2="205.635586" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="675.3323" y="192.384695" font-family="Arial, sans-serif" font-size="15.435395" text-anchor="middle" fill="var(--text)">bindService()</text>
  <rect x="1041.871" y="172.508409" width="198.129" height="66.254354" rx="5.996798" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1140.9355" y="212.260981" font-family="Arial, sans-serif" font-size="19.645093" font-weight="bold" text-anchor="middle" fill="var(--bg)">onBind</text>
  <line x1="1140.9355" y1="238.762763" x2="1140.9355" y2="305.016917" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1240" y="271.88974" font-family="Arial, sans-serif" font-size="15.435395" fill="var(--text)">unbindService()</text>
  <rect x="1041.871" y="318.267808" width="198.129" height="66.254354" rx="5.996798" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1140.9355" y="358.020281" font-family="Arial, sans-serif" font-size="19.645093" font-weight="bold" text-anchor="middle" fill="var(--bg)">onUnbind</text>
  <line x1="1041.871" y1="351.394885" x2="922.9934" y2="437.525326" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="685.2388" y="450.776217" width="198.129" height="66.254354" rx="5.996798" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="784.3032" y="490.528789" font-family="Arial, sans-serif" font-size="19.645093" font-weight="bold" text-anchor="middle" fill="var(--bg)">onDestroy</text>
  <line x1="784.3032" y1="517.030571" x2="784.3032" y2="583.284725" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="773.077" y="591.934619" width="22.4516" height="22.451585" rx="11.225796" fill="var(--black)"/>
  <rect x="767.464" y="586.322623" width="33.6774" height="33.677377" rx="13.999995" fill="none" stroke="var(--black)" stroke-width="2.4"/>
</svg>

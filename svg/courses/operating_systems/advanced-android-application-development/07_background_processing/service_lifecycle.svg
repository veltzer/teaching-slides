<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
  </defs>
  <circle cx="160" cy="120" r="9.6" fill="#000" />
  <line x1="172.8" y1="120" x2="288" y2="120" stroke="#666" stroke-width="2.4" marker-end="url(#arrow)" />
  <rect x="304" y="90" width="160" height="60" rx="24" fill="#4CAF50" stroke="#2E7D32" stroke-width="2.4" />
  <text x="384" y="126" font-family="Arial, sans-serif" font-size="16.8" font-weight="bold" text-anchor="middle" fill="white">onCreate</text>
  <line x1="464" y1="120" x2="624" y2="120" stroke="#666" stroke-width="2.4" marker-end="url(#arrow)" />
  <text x="544" y="108" font-family="Arial, sans-serif" font-size="13.2" text-anchor="middle">startService()</text>
  <rect x="640" y="90" width="224" height="60" rx="24" fill="#2196F3" stroke="#1565C0" stroke-width="2.4" />
  <text x="752" y="126" font-family="Arial, sans-serif" font-size="16.8" font-weight="bold" text-anchor="middle" fill="white">onStartCommand</text>
  <line x1="752" y1="150" x2="752" y2="450" stroke="#666" stroke-width="2.4" marker-end="url(#arrow)" />
  <text x="832" y="300" font-family="Arial, sans-serif" font-size="13.2">stopService()</text>
  <line x1="384" y1="150" x2="384" y2="240" stroke="#666" stroke-width="2.4" />
  <line x1="384" y1="240" x2="944" y2="240" stroke="#666" stroke-width="2.4" marker-end="url(#arrow)" />
  <text x="664" y="228" font-family="Arial, sans-serif" font-size="13.2" text-anchor="middle">bindService()</text>
  <rect x="960" y="210" width="160" height="60" rx="24" fill="#FF9800" stroke="#E65100" stroke-width="2.4" />
  <text x="1040" y="246" font-family="Arial, sans-serif" font-size="16.8" font-weight="bold" text-anchor="middle" fill="white">onBind</text>
  <line x1="1040" y1="270" x2="1040" y2="330" stroke="#666" stroke-width="2.4" marker-end="url(#arrow)" />
  <text x="1120" y="300" font-family="Arial, sans-serif" font-size="13.2">unbindService()</text>
  <rect x="960" y="342" width="160" height="60" rx="24" fill="#9C27B0" stroke="#6A1B9A" stroke-width="2.4" />
  <text x="1040" y="378" font-family="Arial, sans-serif" font-size="16.8" font-weight="bold" text-anchor="middle" fill="white">onUnbind</text>
  <line x1="960" y1="372" x2="864" y2="450" stroke="#666" stroke-width="2.4" marker-end="url(#arrow)" />
  <rect x="672" y="462" width="160" height="60" rx="24" fill="#F44336" stroke="#C62828" stroke-width="2.4" />
  <text x="752" y="498" font-family="Arial, sans-serif" font-size="16.8" font-weight="bold" text-anchor="middle" fill="white">onDestroy</text>
  <line x1="752" y1="522" x2="752" y2="582" stroke="#666" stroke-width="2.4" marker-end="url(#arrow)" />
  <circle cx="752" cy="600" r="9.6" fill="#000" />
  <circle cx="752" cy="600" r="14.4" fill="none" stroke="#000" stroke-width="2.4" />
</svg>
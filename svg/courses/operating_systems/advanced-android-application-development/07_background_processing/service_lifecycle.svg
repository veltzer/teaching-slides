<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <circle cx="51.8812" cy="73.1808" r="11.2318" fill="var(--black)" />
  <line x1="67.7228" y1="73.1808" x2="210.297" y2="73.1808" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="230.099" y="40" width="198.0198" height="66.3616" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="329.1089" y="79.8169" font-family="Arial, sans-serif" font-size="19.6556" font-weight="bold" text-anchor="middle" fill="var(--bg)">onCreate</text>
  <line x1="428.1188" y1="73.1808" x2="626.1386" y2="73.1808" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="527.1287" y="59.9085" font-family="Arial, sans-serif" font-size="15.4437" text-anchor="middle">startService()</text>
  <rect x="645.9406" y="40" width="277.2277" height="66.3616" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="784.5545" y="79.8169" font-family="Arial, sans-serif" font-size="19.6556" font-weight="bold" text-anchor="middle" fill="var(--bg)">onStartCommand</text>
  <line x1="784.5545" y1="106.3616" x2="784.5545" y2="438.1693" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="883.5644" y="272.2654" font-family="Arial, sans-serif" font-size="15.4437">stopService()</text>
  <line x1="329.1089" y1="106.3616" x2="329.1089" y2="205.9039" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="329.1089" y1="205.9039" x2="1022.1782" y2="205.9039" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="675.6436" y="192.6316" font-family="Arial, sans-serif" font-size="15.4437" text-anchor="middle">bindService()</text>
  <rect x="1041.9802" y="172.7231" width="198.0198" height="66.3616" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1140.9901" y="212.54" font-family="Arial, sans-serif" font-size="19.6556" font-weight="bold" text-anchor="middle" fill="var(--bg)">onBind</text>
  <line x1="1140.9901" y1="239.0847" x2="1140.9901" y2="305.4462" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="1240" y="272.2654" font-family="Arial, sans-serif" font-size="15.4437">unbindService()</text>
  <rect x="1041.9802" y="318.7185" width="198.0198" height="66.3616" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="1140.9901" y="358.5355" font-family="Arial, sans-serif" font-size="19.6556" font-weight="bold" text-anchor="middle" fill="var(--bg)">onUnbind</text>
  <line x1="1041.9802" y1="351.8993" x2="923.1683" y2="438.1693" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="685.5446" y="451.4416" width="198.0198" height="66.3616" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="784.5545" y="491.2586" font-family="Arial, sans-serif" font-size="19.6556" font-weight="bold" text-anchor="middle" fill="var(--bg)">onDestroy</text>
  <line x1="784.5545" y1="517.8032" x2="784.5545" y2="584.1648" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <circle cx="784.5545" cy="604.0732" r="11.2318" fill="var(--black)" />
  <circle cx="784.5545" cy="604.0732" r="16.8477" fill="none" stroke="var(--black)" stroke-width="2.4" />
</svg>
  <text x="974.2282" y="161.0989" font-family="Arial, sans-serif" font-size="16.1322" font-weight="bold" text-anchor="middle" fill="var(--bg)">WorkManager</text>
  <line x1="1046.7114" y1="116.4835" x2="1151.4094" y2="65.4945" stroke="var(--text-faint)" stroke-width="1.2"/>
  <rect x="1070.8725" y="40" width="153.0201" height="38.2418" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>

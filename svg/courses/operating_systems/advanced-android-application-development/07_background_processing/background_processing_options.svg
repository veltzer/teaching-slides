<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <circle cx="640" cy="360" r="90" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="3.6" />
  <text x="640" y="354" font-family="Arial, sans-serif" font-size="16.8" font-weight="bold" text-anchor="middle" fill="var(--bg)">Background</text>
  <text x="640" y="378" font-family="Arial, sans-serif" font-size="16.8" font-weight="bold" text-anchor="middle" fill="var(--bg)">Processing</text>
  <line x1="512" y1="300" x2="320" y2="180" stroke="var(--text-muted)" stroke-width="2" />
  <circle cx="320" cy="180" r="54" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.4" />
  <text x="320" y="186" font-family="Arial, sans-serif" font-size="15.6" font-weight="bold" text-anchor="middle" fill="var(--bg)">Services</text>
  <line x1="248" y1="144" x2="144" y2="96" stroke="var(--text-faint)" stroke-width="1.2" />
  <rect x="48" y="72" width="176" height="36" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="136" y="96" font-family="Arial, sans-serif" font-size="13.2" text-anchor="middle">Foreground Service</text>
  <line x1="248" y1="180" x2="128" y2="180" stroke="var(--text-faint)" stroke-width="1.2" />
  <rect x="32" y="162" width="176" height="36" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="120" y="186" font-family="Arial, sans-serif" font-size="13.2" text-anchor="middle">Background Service</text>
  <line x1="248" y1="216" x2="144" y2="264" stroke="var(--text-faint)" stroke-width="1.2" />
  <rect x="56" y="246" width="160" height="36" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="136" y="270" font-family="Arial, sans-serif" font-size="13.2" text-anchor="middle">Bound Service</text>
  <line x1="768" y1="300" x2="960" y2="180" stroke="var(--text-muted)" stroke-width="2" />
  <circle cx="960" cy="180" r="54" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.4" />
  <text x="960" y="186" font-family="Arial, sans-serif" font-size="15.6" font-weight="bold" text-anchor="middle" fill="var(--bg)">WorkManager</text>
  <line x1="1032" y1="144" x2="1136" y2="96" stroke="var(--text-faint)" stroke-width="1.2" />
  <rect x="1056" y="72" width="152" height="36" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1131.2" y="96" font-family="Arial, sans-serif" font-size="13.2" text-anchor="middle">One-time Work</text>
  <line x1="1032" y1="180" x2="1152" y2="180" stroke="var(--text-faint)" stroke-width="1.2" />
  <rect x="1072" y="162" width="152" height="36" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1147.2" y="186" font-family="Arial, sans-serif" font-size="13.2" text-anchor="middle">Periodic Work</text>
  <line x1="1032" y1="216" x2="1136" y2="264" stroke="var(--text-faint)" stroke-width="1.2" />
  <rect x="1064" y="246" width="144" height="36" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1136" y="270" font-family="Arial, sans-serif" font-size="13.2" text-anchor="middle">Chained Work</text>
  <line x1="512" y1="420" x2="320" y2="540" stroke="var(--text-muted)" stroke-width="2" />
  <circle cx="320" cy="540" r="54" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2.4" />
  <text x="320" y="534" font-family="Arial, sans-serif" font-size="15.6" font-weight="bold" text-anchor="middle" fill="var(--bg)">Broadcast</text>
  <text x="320" y="552" font-family="Arial, sans-serif" font-size="15.6" font-weight="bold" text-anchor="middle" fill="var(--bg)">Receiver</text>
  <line x1="248" y1="516" x2="144" y2="480" stroke="var(--text-faint)" stroke-width="1.2" />
  <rect x="56" y="462" width="160" height="36" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="136" y="486" font-family="Arial, sans-serif" font-size="13.2" text-anchor="middle">System Events</text>
  <line x1="248" y1="564" x2="144" y2="600" stroke="var(--text-faint)" stroke-width="1.2" />
  <rect x="56" y="582" width="160" height="36" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="136" y="606" font-family="Arial, sans-serif" font-size="13.2" text-anchor="middle">Custom Events</text>
  <line x1="768" y1="420" x2="960" y2="540" stroke="var(--text-muted)" stroke-width="2" />
  <circle cx="960" cy="540" r="54" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2.4" />
  <text x="960" y="534" font-family="Arial, sans-serif" font-size="15.6" font-weight="bold" text-anchor="middle" fill="var(--bg)">Alarm</text>
  <text x="960" y="552" font-family="Arial, sans-serif" font-size="15.6" font-weight="bold" text-anchor="middle" fill="var(--bg)">Manager</text>
  <line x1="1032" y1="516" x2="1136" y2="480" stroke="var(--text-faint)" stroke-width="1.2" />
  <rect x="1064" y="462" width="144" height="36" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1136" y="486" font-family="Arial, sans-serif" font-size="13.2" text-anchor="middle">Exact Alarms</text>
  <line x1="1032" y1="564" x2="1136" y2="600" stroke="var(--text-faint)" stroke-width="1.2" />
  <rect x="1056" y="582" width="160" height="36" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1136" y="606" font-family="Arial, sans-serif" font-size="13.2" text-anchor="middle">Inexact Alarms</text>
</svg>
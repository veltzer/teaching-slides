  <text x="128.5906" y="161.0989" font-family="Arial, sans-serif" font-size="13.6504" text-anchor="middle" fill="var(--primary-text)">Background Service</text>
  <line x1="257.4497" y1="192.967" x2="152.7517" y2="243.956" stroke="var(--text-faint)" stroke-width="1.2"/>
  <rect x="64.1611" y="224.8352" width="161.0738" height="38.2418" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="144.698" y="250.3297" font-family="Arial, sans-serif" font-size="13.6504" text-anchor="middle" fill="var(--primary-text)">Bound Service</text>

  <line x1="257.4497" y1="116.4835" x2="152.7517" y2="65.4945" stroke="var(--text-faint)" stroke-width="1.2"/>
  <rect x="56.1074" y="40" width="177.1812" height="38.2418" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="144.698" y="65.4945" font-family="Arial, sans-serif" font-size="13.6504" text-anchor="middle" fill="var(--primary-text)">Foreground Service</text>

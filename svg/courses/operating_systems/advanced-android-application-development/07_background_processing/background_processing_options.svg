  <line x1="1046.7114" y1="192.967" x2="1151.4094" y2="243.956" stroke="var(--text-faint)" stroke-width="1.2"/>
  <rect x="1078.9262" y="224.8352" width="144.9664" height="38.2418" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>

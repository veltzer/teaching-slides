<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Four pillars -->
  <rect x="40" y="40" width="294.915254237288" height="250.810810810811" rx="8.24721110845" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="187.457627118644" y="87.027027027027" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.618027771125" font-weight="bold" fill="var(--ok-text)">Sandbox</text>
  <text x="187.457627118644" y="128.828828828829" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--ok-text)">UID per app</text>
  <text x="187.457627118644" y="160.18018018018" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--ok-text)">Own process</text>
  <text x="187.457627118644" y="191.531531531532" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--ok-text)">SELinux</text>
  <text x="187.457627118644" y="222.882882882883" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--ok-text)">Kernel isolation</text>
  <text x="187.457627118644" y="261.54954954955" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.401718051231" fill="var(--ok-text)">seccomp</text>

  <rect x="345.084745762712" y="40" width="294.915254237288" height="250.810810810811" rx="8.24721110845" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="492.542372881356" y="87.027027027027" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.618027771125" font-weight="bold" fill="var(--primary-text)">Permissions</text>
  <text x="492.542372881356" y="128.828828828829" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--primary-text)">Install-time</text>
  <text x="492.542372881356" y="160.18018018018" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--primary-text)">Runtime</text>
  <text x="492.542372881356" y="191.531531531532" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--primary-text)">One-time grants</text>
  <text x="492.542372881356" y="222.882882882883" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--primary-text)">Scoped storage</text>
  <text x="492.542372881356" y="261.54954954955" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.401718051231" fill="var(--primary-text)">User revocable</text>

  <rect x="650.169491525424" y="40" width="294.915254237288" height="250.810810810811" rx="8.24721110845" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="797.627118644068" y="87.027027027027" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.618027771125" font-weight="bold" fill="var(--warn-text)">Encryption</text>
  <text x="797.627118644068" y="128.828828828829" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--warn-text)">FBE</text>
  <text x="797.627118644068" y="160.18018018018" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--warn-text)">Keystore</text>
  <text x="797.627118644068" y="191.531531531532" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--warn-text)">BiometricPrompt</text>
  <text x="797.627118644068" y="222.882882882883" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--warn-text)">TLS default</text>
  <text x="797.627118644068" y="261.54954954955" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.401718051231" fill="var(--warn-text)">Hardware keys</text>

  <rect x="955.254237288136" y="40" width="284.745762711864" height="250.810810810811" rx="8.24721110845" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097.627118644068" y="87.027027027027" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.618027771125" font-weight="bold" fill="var(--info-text)">Integrity</text>
  <text x="1097.627118644068" y="128.828828828829" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--info-text)">Signed APKs</text>
  <text x="1097.627118644068" y="160.18018018018" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--info-text)">Play Integrity</text>
  <text x="1097.627118644068" y="191.531531531532" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--info-text)">Verified Boot</text>
  <text x="1097.627118644068" y="222.882882882883" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--info-text)">Attestation</text>
  <text x="1097.627118644068" y="261.54954954955" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.401718051231" fill="var(--info-text)">R8 obfuscation</text>

  <!-- Permission flow -->
  <rect x="40" y="322.162162162162" width="1200" height="177.657657657658" rx="8.24721110845" fill="var(--surface)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="358.738738738739" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.556224994012" font-weight="bold" fill="var(--primary-accent)">Runtime flow</text>

  <rect x="70.508474576271" y="384.864864864865" width="233.898305084746" height="83.603603603604" rx="6.185408331337" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="187.457627118644" y="435.027027027027" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4944222169" font-weight="bold" fill="var(--ok-text)">Check</text>

  <rect x="355.254237288136" y="384.864864864865" width="233.898305084746" height="83.603603603604" rx="6.185408331337" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="472.203389830508" y="435.027027027027" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4944222169" font-weight="bold" fill="var(--primary-text)">Request</text>

  <rect x="640" y="384.864864864865" width="233.898305084746" height="83.603603603604" rx="6.185408331337" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="756.949152542373" y="435.027027027027" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4944222169" font-weight="bold" fill="var(--warn-text)">Handle</text>

  <rect x="924.745762711864" y="384.864864864865" width="284.745762711864" height="83.603603603604" rx="6.185408331337" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1067.118644067796" y="435.027027027027" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4944222169" font-weight="bold" fill="var(--info-text)">Proceed</text>

  <line x1="304.406779661017" y1="426.666666666667" x2="355.254237288136" y2="426.666666666667" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="589.152542372881" y1="426.666666666667" x2="640" y2="426.666666666667" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="873.898305084746" y1="426.666666666667" x2="924.745762711864" y2="426.666666666667" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Principles -->
  <rect x="40" y="525.945945945946" width="1200" height="94.054054054054" rx="8.24721110845" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="562.522522522523" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4944222169" font-weight="bold" fill="var(--danger-text)">Principles</text>
  <text x="640" y="599.099099099099" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--danger-text)">Least privilege. Defense in depth. Keystore for secrets.</text>
</svg>

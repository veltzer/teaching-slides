  <rect x="56.2162" y="253.0612" width="129.7297" height="35.5103" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="121.081" y="276.7347" font-family="Arial, sans-serif" font-size="14.398" text-anchor="middle" fill="var(--primary-text)">Relations</text>

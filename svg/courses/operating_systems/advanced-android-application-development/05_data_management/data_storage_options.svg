  <rect x="892.334" y="92.2956" width="143.98" height="143.98" rx="14" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2.3925" filter="url(#shadow)"/>
  <text x="964.3243" y="158.3673" font-family="Arial, sans-serif" font-size="16.7977" font-weight="bold" text-anchor="middle" fill="var(--bg)">Shared</text>

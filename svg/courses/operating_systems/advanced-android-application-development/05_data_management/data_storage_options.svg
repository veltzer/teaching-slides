  <line x1="1061.6216" y1="116.9388" x2="1158.9189" y2="57.7551" stroke="var(--text-faint)" stroke-width="1.1963"/>
  <rect x="1077.8378" y="40" width="162.1622" height="35.5103" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>

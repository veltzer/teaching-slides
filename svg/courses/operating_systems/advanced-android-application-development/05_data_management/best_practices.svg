<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="400" y="60" width="480" height="72" rx="12" fill="#4CAF50" stroke="#2E7D32" stroke-width="2.4" />
  <text x="640" y="102" font-family="Arial, sans-serif" font-size="21.6" font-weight="bold" text-anchor="middle" fill="white">Data Management Best Practices</text>
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arrow3" markerWidth="16" markerHeight="8.4" refX="16" refY="4.2" orient="auto">
      <polygon points="0,12 5.6,0" fill="#666" />
    </marker>
  </defs>
  <line x1="320" y1="132" x2="160" y2="216" stroke="#666" stroke-width="2.4" marker-end="url(#arrow)" />
  <rect x="48" y="228" width="320" height="60" rx="9.6" fill="#2196F3" stroke="#1565C0" stroke-width="2.4" />
  <text x="208" y="264" font-family="Arial, sans-serif" font-size="16.8" font-weight="bold" text-anchor="middle" fill="white">Use Room for Complex Data</text>
  <line x1="480" y1="132" x2="320" y2="324" stroke="#666" stroke-width="2.4" marker-end="url(#arrow)" />
  <rect x="48" y="336" width="384" height="60" rx="9.6" fill="#FF9800" stroke="#E65100" stroke-width="2.4" />
  <text x="240" y="372" font-family="Arial, sans-serif" font-size="16.8" font-weight="bold" text-anchor="middle" fill="white">SharedPreferences for Simple Data</text>
  <line x1="640" y1="132" x2="640" y2="432" stroke="#666" stroke-width="2.4" marker-end="url(#arrow)" />
  <rect x="448" y="444" width="384" height="60" rx="9.6" fill="#9C27B0" stroke="#6A1B9A" stroke-width="2.4" />
  <text x="640" y="480" font-family="Arial, sans-serif" font-size="16.8" font-weight="bold" text-anchor="middle" fill="white">Implement Proper Migration</text>
  <line x1="800" y1="132" x2="960" y2="324" stroke="#666" stroke-width="2.4" marker-end="url(#arrow)" />
  <rect x="848" y="336" width="224" height="60" rx="9.6" fill="#F44336" stroke="#C62828" stroke-width="2.4" />
  <text x="960" y="372" font-family="Arial, sans-serif" font-size="16.8" font-weight="bold" text-anchor="middle" fill="white">Regular Backups</text>
  <line x1="960" y1="132" x2="1120" y2="216" stroke="#666" stroke-width="2.4" marker-end="url(#arrow)" />
  <rect x="992" y="228" width="240" height="60" rx="9.6" fill="#2196f3" stroke="#0d47a1" stroke-width="2.4" />
  <text x="1112" y="264" font-family="Arial, sans-serif" font-size="16.8" font-weight="bold" text-anchor="middle" fill="white">Handle Edge Cases</text>
  <line x1="640" y1="132" x2="640" y2="564" stroke="#666" stroke-width="2.4" marker-end="url(#arrow)" />
  <rect x="520" y="576" width="240" height="60" rx="9.6" fill="#555555" stroke="#333333" stroke-width="2.4" />
  <text x="640" y="612" font-family="Arial, sans-serif" font-size="16.8" font-weight="bold" text-anchor="middle" fill="white">Optimize Queries</text>
</svg>
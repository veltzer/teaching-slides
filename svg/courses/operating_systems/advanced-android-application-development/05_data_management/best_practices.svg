<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="396.7568" y="40" width="486.4865" height="72.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640" y="82.2917" font-family="Arial, sans-serif" font-size="21.8208" font-weight="bold" text-anchor="middle" fill="var(--bg)">Data Management Best Practices</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,12 5.6,0" fill="#666" />
    </marker>
  </defs>
  <line x1="315.6757" y1="112.5" x2="153.5135" y2="197.0833" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="209.1667" width="324.3243" height="60.4167" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="202.1622" y="245.4167" font-family="Arial, sans-serif" font-size="16.9718" font-weight="bold" text-anchor="middle" fill="var(--bg)">Use Room for Complex Data</text>
  <line x1="477.8378" y1="112.5" x2="315.6757" y2="305.8333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="317.9167" width="389.1892" height="60.4167" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="234.5946" y="354.1667" font-family="Arial, sans-serif" font-size="16.9718" font-weight="bold" text-anchor="middle" fill="var(--bg)">SharedPreferences for Simple Data</text>
  <line x1="640" y1="112.5" x2="640" y2="414.5833" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="445.4054" y="426.6667" width="389.1892" height="60.4167" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="640" y="462.9167" font-family="Arial, sans-serif" font-size="16.9718" font-weight="bold" text-anchor="middle" fill="var(--bg)">Implement Proper Migration</text>
  <line x1="802.1622" y1="112.5" x2="964.3243" y2="305.8333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="850.8108" y="317.9167" width="227.027" height="60.4167" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="964.3243" y="354.1667" font-family="Arial, sans-serif" font-size="16.9718" font-weight="bold" text-anchor="middle" fill="var(--bg)">Regular Backups</text>
  <line x1="964.3243" y1="112.5" x2="1126.4865" y2="197.0833" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="996.7568" y="209.1667" width="243.2432" height="60.4167" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1118.3784" y="245.4167" font-family="Arial, sans-serif" font-size="16.9718" font-weight="bold" text-anchor="middle" fill="var(--bg)">Handle Edge Cases</text>
  <line x1="640" y1="112.5" x2="640" y2="547.5" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="518.3784" y="559.5833" width="243.2432" height="60.4167" rx="6" fill="var(--text-muted)" stroke="var(--text)" stroke-width="2.4" />
  <text x="640" y="595.8333" font-family="Arial, sans-serif" font-size="16.9718" font-weight="bold" text-anchor="middle" fill="var(--bg)">Optimize Queries</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="77.5758" y="58.1818" width="186.1818" height="69.8182" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="170.6667" y="98.9091" font-family="Arial, sans-serif" font-size="18.6182" font-weight="bold" text-anchor="middle" fill="var(--bg)">Old Schema</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,12 5.6,0" fill="#666" />
    </marker>
  </defs>
  <line x1="263.7576" y1="93.0909" x2="465.4545" y2="232.7273" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="496.4848" y="209.4545" width="217.2121" height="69.8182" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="605.0909" y="250.1818" font-family="Arial, sans-serif" font-size="18.6182" font-weight="bold" text-anchor="middle" fill="var(--bg)">Migration Plan</text>
  <line x1="713.697" y1="232.7273" x2="915.3939" y2="93.0909" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="930.9091" y="58.1818" width="186.1818" height="69.8182" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1024" y="98.9091" font-family="Arial, sans-serif" font-size="18.6182" font-weight="bold" text-anchor="middle" fill="var(--bg)">New Schema</text>
  <line x1="543.0303" y1="279.2727" x2="310.303" y2="418.9091" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="155.1515" y="430.5455" width="186.1818" height="69.8182" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="248.2424" y="471.2727" font-family="Arial, sans-serif" font-size="18.6182" font-weight="bold" text-anchor="middle" fill="var(--bg)">Data Backup</text>
  <line x1="667.1515" y1="279.2727" x2="899.8788" y2="418.9091" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="853.3333" y="430.5455" width="201.697" height="69.8182" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="954.1818" y="471.2727" font-family="Arial, sans-serif" font-size="18.6182" font-weight="bold" text-anchor="middle" fill="var(--bg)">Version Update</text>
  <line x1="954.1818" y1="500.3636" x2="744.7273" y2="558.5455" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="589.5758" y="570.1818" width="217.2121" height="69.8182" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="698.1818" y="610.9091" font-family="Arial, sans-serif" font-size="18.6182" font-weight="bold" text-anchor="middle" fill="var(--bg)">Schema Validation</text>
  <line x1="589.5758" y1="605.0909" x2="387.8788" y2="605.0909" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="155.1515" y="570.1818" width="217.2121" height="69.8182" rx="6" fill="var(--text-muted)" stroke="var(--text)" stroke-width="2.3273" />
  <text x="263.7576" y="610.9091" font-family="Arial, sans-serif" font-size="18.6182" font-weight="bold" text-anchor="middle" fill="var(--bg)">Migration Testing</text>
</svg>
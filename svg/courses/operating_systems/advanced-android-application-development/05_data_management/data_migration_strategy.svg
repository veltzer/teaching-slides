<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="214.9254" height="69.6" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="147.4627" y="80.6" font-family="Arial, sans-serif" font-size="19.9725" font-weight="bold" text-anchor="middle" fill="var(--bg)">Old Schema</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <line x1="254.9254" y1="74.8" x2="487.7611" y2="214" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="523.582" y="190.8" width="250.7463" height="69.6" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="648.9552" y="231.4" font-family="Arial, sans-serif" font-size="19.9725" font-weight="bold" text-anchor="middle" fill="var(--bg)">Migration Plan</text>
  <line x1="774.3284" y1="214" x2="1007.1641" y2="74.8" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1025.0746" y="40" width="214.9254" height="69.6" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1132.5373" y="80.6" font-family="Arial, sans-serif" font-size="19.9725" font-weight="bold" text-anchor="middle" fill="var(--bg)">New Schema</text>
  <line x1="577.3134" y1="260.4" x2="308.6566" y2="399.6" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="129.5522" y="411.2001" width="214.9254" height="69.6" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="237.0149" y="451.8" font-family="Arial, sans-serif" font-size="19.9725" font-weight="bold" text-anchor="middle" fill="var(--bg)">Data Backup</text>
  <line x1="720.597" y1="260.4" x2="989.2537" y2="399.6" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="935.5223" y="411.2001" width="232.8359" height="69.6" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1051.9403" y="451.8" font-family="Arial, sans-serif" font-size="19.9725" font-weight="bold" text-anchor="middle" fill="var(--bg)">Version Update</text>
  <line x1="1051.9403" y1="480.8" x2="810.1493" y2="538.8" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="631.0448" y="550.4" width="250.7463" height="69.6" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="756.4179" y="591" font-family="Arial, sans-serif" font-size="19.9725" font-weight="bold" text-anchor="middle" fill="var(--bg)">Schema Validation</text>
  <line x1="631.0448" y1="585.2" x2="398.2089" y2="585.2" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="129.5522" y="550.4" width="250.7463" height="69.6" rx="6" fill="var(--text-muted)" stroke="var(--text)" stroke-width="2.3273"/>
  <text x="254.9254" y="591" font-family="Arial, sans-serif" font-size="19.9725" font-weight="bold" text-anchor="middle" fill="var(--bg)">Migration Testing</text>
</svg>

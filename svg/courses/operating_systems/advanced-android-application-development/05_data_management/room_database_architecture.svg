<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="501.9608" y="43.0252" width="143.4174" height="64.5378" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="573.6695" y="80.6723" font-family="Arial, sans-serif" font-size="17.2101" font-weight="bold" text-anchor="middle" fill="var(--bg)">Entity</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,12 5.6,0" fill="#666" />
    </marker>
  </defs>
  <line x1="573.6695" y1="107.563" x2="573.6695" y2="150.5882" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="501.9608" y="161.3445" width="143.4174" height="64.5378" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="573.6695" y="198.9916" font-family="Arial, sans-serif" font-size="17.2101" font-weight="bold" text-anchor="middle" fill="var(--bg)">DAO</text>
  <line x1="573.6695" y1="225.8824" x2="573.6695" y2="268.9076" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="501.9608" y="279.6639" width="143.4174" height="64.5378" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="573.6695" y="317.3109" font-family="Arial, sans-serif" font-size="17.2101" font-weight="bold" text-anchor="middle" fill="var(--bg)">Database</text>
  <line x1="573.6695" y1="344.2017" x2="573.6695" y2="387.2269" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="501.9608" y="397.9832" width="143.4174" height="64.5378" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="573.6695" y="435.6303" font-family="Arial, sans-serif" font-size="17.2101" font-weight="bold" text-anchor="middle" fill="var(--bg)">Repository</text>
  <line x1="573.6695" y1="462.521" x2="573.6695" y2="505.5462" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="501.9608" y="516.3025" width="143.4174" height="64.5378" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="573.6695" y="553.9496" font-family="Arial, sans-serif" font-size="17.2101" font-weight="bold" text-anchor="middle" fill="var(--bg)">ViewModel</text>
  <line x1="573.6695" y1="580.8403" x2="573.6695" y2="623.8655" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="573.6695" y="640" font-family="Arial, sans-serif" font-size="15.0588" font-style="italic" text-anchor="middle" fill="var(--text-muted)">UI Layer</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="440" y="40" width="400" height="79.607843306421" rx="6.398529432114" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="91.17647115917" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.461273892103" font-weight="bold" fill="var(--warn-text)">SQLite Database</text>

  <line x1="640" y1="125.294117520185" x2="640" y2="159.411764959631" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="440" y="165.098039173395" width="400" height="79.607843306421" rx="6.398529432114" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="216.274510332564" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.461273892103" font-weight="bold" fill="var(--primary-text)">DAO — @Query / @Insert / @Update</text>

  <line x1="640" y1="250.392156693579" x2="640" y2="284.509804133026" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="440" y="290.19607834679" width="400" height="79.607843306421" rx="6.398529432114" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="341.372549505959" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.461273892103" font-weight="bold" fill="var(--info-text)">Repository</text>

  <line x1="640" y1="375.490195866974" x2="640" y2="409.607843306421" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="440" y="415.294117520184" width="400" height="79.607843306421" rx="6.398529432114" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="466.470588679354" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.461273892103" font-weight="bold" fill="var(--danger-text)">ViewModel (exposes Flow / LiveData)</text>

  <line x1="640" y1="500.588235040369" x2="640" y2="534.705882479815" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="440" y="540.392156693579" width="400" height="79.607843306421" rx="6.398529432114" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="591.568627852749" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.461273892103" font-weight="bold" fill="var(--ok-text)">UI Layer (Compose / Fragment)</text>

  <rect x="40" y="40" width="340" height="580" rx="6.398529432114" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="210" y="91.17647115917" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.328431094223" font-weight="bold" fill="var(--text)">Why the layers?</text>
  <text x="210" y="153.725490745867" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901662109" fill="var(--text-muted)">DAO: compile-time checked SQL</text>
  <text x="210" y="210.588235040369" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901662109" fill="var(--text-muted)">Repo: combine local + remote</text>
  <text x="210" y="267.450980413303" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901662109" fill="var(--text-muted)">ViewModel: survives rotation</text>
  <text x="210" y="324.313725786236" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901662109" fill="var(--text-muted)">UI: observes state, no I/O</text>

  <rect x="900" y="40" width="340" height="580" rx="6.398529432114" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1070" y="91.17647115917" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.328431094223" font-weight="bold" fill="var(--text)">Key benefits</text>
  <text x="1070" y="153.725490745867" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901662109" fill="var(--text-muted)">testable in isolation</text>
  <text x="1070" y="210.588235040369" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901662109" fill="var(--text-muted)">schema migrations tracked</text>
  <text x="1070" y="267.450980413303" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901662109" fill="var(--text-muted)">reactive queries via Flow</text>
  <text x="1070" y="324.313725786236" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901662109" fill="var(--text-muted)">works offline-first</text>
</svg>

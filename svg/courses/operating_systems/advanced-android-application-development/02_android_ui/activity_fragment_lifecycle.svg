<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1087.5767" height="474.8286" fill="var(--bg)" rx="5.7089" x="152.4233" y="145.1714"/>
  <text x="390.3306" y="160.9989" text-anchor="middle" font-family="sans-serif" font-size="13.4741" font-weight="bold" fill="var(--text)">Activity Lifecycle</text>
  <rect x="288.3704" y="168.9128" width="203.9206" height="29.0173" rx="5.7089" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="390.3306" y="187.3784" text-anchor="middle" font-family="monospace" font-size="11.9769" font-weight="bold" fill="var(--bg)">onCreate()</text>
  <line x1="390.3306" y1="199.2491" x2="390.3306" y2="217.7146" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="288.3704" y="219.0337" width="203.9206" height="29.0173" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="390.3306" y="237.4991" text-anchor="middle" font-family="monospace" font-size="11.9769" fill="var(--text)">onStart()</text>
  <line x1="390.3306" y1="249.3698" x2="390.3306" y2="267.8354" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="288.3704" y="269.1544" width="203.9206" height="29.0173" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="390.3306" y="287.6199" text-anchor="middle" font-family="monospace" font-size="11.9769" fill="var(--text)">onResume()</text>
  <rect x="262.8802" y="307.4045" width="254.9008" height="29.0173" rx="5.7089" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="390.3306" y="325.8701" text-anchor="middle" font-family="sans-serif" font-size="10.4797" font-weight="bold" fill="var(--ok-accent)">RUNNING (visible + interactive)</text>
  <line x1="390.3306" y1="299.4907" x2="390.3306" y2="308.7234" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <line x1="390.3306" y1="337.7408" x2="390.3306" y2="353.5684" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="288.3704" y="354.8874" width="203.9206" height="29.0173" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="390.3306" y="373.353" text-anchor="middle" font-family="monospace" font-size="11.9769" fill="var(--text-muted)">onPause()</text>
  <line x1="390.3306" y1="385.2237" x2="390.3306" y2="403.6891" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="288.3704" y="405.0082" width="203.9206" height="29.0173" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="390.3306" y="423.4737" text-anchor="middle" font-family="monospace" font-size="11.9769" fill="var(--text-muted)">onStop()</text>
  <line x1="390.3306" y1="435.3444" x2="390.3306" y2="453.81" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="288.3704" y="455.1289" width="203.9206" height="29.0173" rx="5.7089" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="390.3306" y="473.5945" text-anchor="middle" font-family="monospace" font-size="11.9769" fill="var(--danger-accent)">onDestroy()</text>
  <path d="M 288.3704 420.8358 Q 203.4034 435.3444 203.4034 369.396 Q 203.4034 257.2836 288.3704 250.6888" stroke="var(--primary-border)" stroke-width="1.3333" fill="none" stroke-dasharray="3.5556 2.6667" marker-end="url(#arrow-primary)" />
  <text x="177.9133" y="349.6115" font-family="monospace" font-size="10" fill="var(--primary-accent)" transform="rotate(-90 30 310)">onRestart()</text>
  <text x="917.1256" y="160.9989" text-anchor="middle" font-family="sans-serif" font-size="13.4741" font-weight="bold" fill="var(--text)">Fragment Lifecycle (extra callbacks)</text>
  <rect x="781.1785" y="168.9128" width="271.8942" height="29.0173" rx="5.7089" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="917.1256" y="187.3784" text-anchor="middle" font-family="monospace" font-size="11.2285" font-weight="bold" fill="var(--bg)">onAttach() → onCreate()</text>
  <line x1="917.1256" y1="199.2491" x2="917.1256" y2="217.7146" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="781.1785" y="219.0337" width="271.8942" height="29.0173" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="917.1256" y="237.4991" text-anchor="middle" font-family="monospace" font-size="11.2285" fill="var(--text)">onCreateView()</text>
  <line x1="917.1256" y1="249.3698" x2="917.1256" y2="267.8354" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="781.1785" y="269.1544" width="271.8942" height="29.0173" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="917.1256" y="287.6199" text-anchor="middle" font-family="monospace" font-size="11.2285" fill="var(--text)">onViewCreated()</text>
  <line x1="917.1256" y1="299.4907" x2="917.1256" y2="308.7234" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="755.6884" y="308.7234" width="322.8744" height="29.0173" rx="5.7089" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="917.1256" y="327.189" text-anchor="middle" font-family="sans-serif" font-size="10.4797" font-weight="bold" fill="var(--ok-accent)">onStart() → onResume() [same as Activity]</text>
  <line x1="917.1256" y1="339.0597" x2="917.1256" y2="354.8874" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="781.1785" y="356.2062" width="271.8942" height="29.0173" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="917.1256" y="374.6718" text-anchor="middle" font-family="monospace" font-size="11.2285" fill="var(--text-muted)">onPause() → onStop()</text>
  <line x1="917.1256" y1="386.5426" x2="917.1256" y2="405.0082" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="781.1785" y="406.3271" width="271.8942" height="29.0173" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="917.1256" y="424.7927" text-anchor="middle" font-family="monospace" font-size="11.2285" fill="var(--text-muted)">onDestroyView()</text>
  <line x1="917.1256" y1="436.6634" x2="917.1256" y2="455.1289" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="781.1785" y="456.448" width="271.8942" height="29.0173" rx="5.7089" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="917.1256" y="474.9134" text-anchor="middle" font-family="monospace" font-size="11.2285" fill="var(--danger-accent)">onDestroy() → onDetach()</text>
  <rect x="177.9133" y="511.8446" width="1036.5965" height="79.1381" rx="5.7089" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="696.2116" y="530.3101" text-anchor="middle" font-family="sans-serif" font-size="11.9769" font-weight="bold" fill="var(--primary-accent)">Key differences: Fragment has extra callbacks</text>
  <text x="194.9067" y="548.7757" font-family="sans-serif" font-size="10.4797" fill="var(--text-muted)">• <tspan font-family="monospace">onAttach()</tspan> — fragment associated with host activity</text>
  <text x="194.9067" y="563.2844" font-family="sans-serif" font-size="10.4797" fill="var(--text-muted)">• <tspan font-family="monospace">onCreateView()</tspan> — inflate fragment layout (return View)</text>
  <text x="194.9067" y="577.793" font-family="sans-serif" font-size="10.4797" fill="var(--text-muted)">• <tspan font-family="monospace">onViewCreated()</tspan> — safe to access views, setup observers</text>
  <text x="730.1983" y="548.7757" font-family="sans-serif" font-size="10.4797" fill="var(--text-muted)">• <tspan font-family="monospace">onDestroyView()</tspan> — nullify view bindings here to avoid leaks</text>
  <text x="730.1983" y="563.2844" font-family="sans-serif" font-size="10.4797" fill="var(--text-muted)">• <tspan font-family="monospace">onDetach()</tspan> — fragment disassociated from activity</text>
  <text x="730.1983" y="577.793" font-family="sans-serif" font-size="10.4797" fill="var(--text-muted)">• Fragment can survive activity rotation (retain instance)</text>
</svg>
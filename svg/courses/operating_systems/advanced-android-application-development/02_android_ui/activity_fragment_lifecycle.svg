<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <text x="302.4999" y="59.3332" text-anchor="middle" font-family="sans-serif" font-size="15.6425" font-weight="bold" fill="var(--text)">Activity Lifecycle</text>
  <rect x="190" y="69" width="225" height="35.4444" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="302.4999" y="91.5556" text-anchor="middle" font-family="monospace" font-size="13.9043" font-weight="bold" fill="var(--bg)">onCreate()</text>
  <line x1="302.4999" y1="106.0556" x2="302.4999" y2="128.611" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="190" y="130.2223" width="225" height="35.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="302.4999" y="152.7777" text-anchor="middle" font-family="monospace" font-size="13.9043" fill="var(--text)">onStart()</text>
  <line x1="302.4999" y1="167.2777" x2="302.4999" y2="189.8333" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="190" y="191.4444" width="225" height="35.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="302.4999" y="213.9999" text-anchor="middle" font-family="monospace" font-size="13.9043" fill="var(--text)">onResume()</text>
  <rect x="161.8749" y="238.1667" width="281.25" height="35.4444" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="302.4999" y="260.7223" text-anchor="middle" font-family="sans-serif" font-size="12.1662" font-weight="bold" fill="var(--ok-accent)">RUNNING (visible + interactive)</text>
  <line x1="302.4999" y1="228.5" x2="302.4999" y2="239.7777" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <line x1="302.4999" y1="275.2223" x2="302.4999" y2="294.5556" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="190" y="296.1667" width="225" height="35.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="302.4999" y="318.7223" text-anchor="middle" font-family="monospace" font-size="13.9043" fill="var(--text-muted)">onPause()</text>
  <line x1="302.4999" y1="333.2223" x2="302.4999" y2="355.7777" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="190" y="357.3889" width="225" height="35.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="302.4999" y="379.9444" text-anchor="middle" font-family="monospace" font-size="13.9043" fill="var(--text-muted)">onStop()</text>
  <line x1="302.4999" y1="394.4444" x2="302.4999" y2="417" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="190" y="418.611" width="225" height="35.4444" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="302.4999" y="441.1666" text-anchor="middle" font-family="monospace" font-size="13.9043" fill="var(--danger-accent)">onDestroy()</text>
  <path d="M 190 376.7222 Q 96.2499 394.4444 96.2499 313.8889 Q 96.2499 176.9443 190 168.8888" stroke="var(--primary-border)" stroke-width="1.3333" fill="none" stroke-dasharray="3.5556 2.6667" marker-end="url(#arrow-primary)" />
  <text x="68.1249" y="289.7222" font-family="monospace" font-size="11.6093" fill="var(--primary-accent)" transform="rotate(-90 30 310)">onRestart()</text>
  <text x="883.7499" y="59.3332" text-anchor="middle" font-family="sans-serif" font-size="15.6425" font-weight="bold" fill="var(--text)">Fragment Lifecycle (extra callbacks)</text>
  <rect x="733.7499" y="69" width="300" height="35.4444" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="883.7499" y="91.5556" text-anchor="middle" font-family="monospace" font-size="13.0355" font-weight="bold" fill="var(--bg)">onAttach() → onCreate()</text>
  <line x1="883.7499" y1="106.0556" x2="883.7499" y2="128.611" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="733.7499" y="130.2223" width="300" height="35.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="883.7499" y="152.7777" text-anchor="middle" font-family="monospace" font-size="13.0355" fill="var(--text)">onCreateView()</text>
  <line x1="883.7499" y1="167.2777" x2="883.7499" y2="189.8333" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="733.7499" y="191.4444" width="300" height="35.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="883.7499" y="213.9999" text-anchor="middle" font-family="monospace" font-size="13.0355" fill="var(--text)">onViewCreated()</text>
  <line x1="883.7499" y1="228.5" x2="883.7499" y2="239.7777" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="705.6249" y="239.7777" width="356.2501" height="35.4444" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="883.7499" y="262.3333" text-anchor="middle" font-family="sans-serif" font-size="12.1662" font-weight="bold" fill="var(--ok-accent)">onStart() → onResume() [same as Activity]</text>
  <line x1="883.7499" y1="276.8333" x2="883.7499" y2="296.1667" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="733.7499" y="297.7776" width="300" height="35.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="883.7499" y="320.3332" text-anchor="middle" font-family="monospace" font-size="13.0355" fill="var(--text-muted)">onPause() → onStop()</text>
  <line x1="883.7499" y1="334.8333" x2="883.7499" y2="357.3889" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="733.7499" y="359" width="300" height="35.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="883.7499" y="381.5556" text-anchor="middle" font-family="monospace" font-size="13.0355" fill="var(--text-muted)">onDestroyView()</text>
  <line x1="883.7499" y1="396.0556" x2="883.7499" y2="418.611" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="733.7499" y="420.2223" width="300" height="35.4444" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="883.7499" y="442.7777" text-anchor="middle" font-family="monospace" font-size="13.0355" fill="var(--danger-accent)">onDestroy() → onDetach()</text>
  <rect x="68.1249" y="487.8889" width="1143.75" height="96.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="639.9999" y="510.4444" text-anchor="middle" font-family="sans-serif" font-size="13.9043" font-weight="bold" fill="var(--primary-accent)">Key differences: Fragment has extra callbacks</text>
  <text x="86.8749" y="533" font-family="sans-serif" font-size="12.1662" fill="var(--text-muted)">• <tspan font-family="monospace">onAttach()</tspan> — fragment associated with host activity</text>
  <text x="86.8749" y="550.7223" font-family="sans-serif" font-size="12.1662" fill="var(--text-muted)">• <tspan font-family="monospace">onCreateView()</tspan> — inflate fragment layout (return View)</text>
  <text x="86.8749" y="568.4444" font-family="sans-serif" font-size="12.1662" fill="var(--text-muted)">• <tspan font-family="monospace">onViewCreated()</tspan> — safe to access views, setup observers</text>
  <text x="677.4999" y="533" font-family="sans-serif" font-size="12.1662" fill="var(--text-muted)">• <tspan font-family="monospace">onDestroyView()</tspan> — nullify view bindings here to avoid leaks</text>
  <text x="677.4999" y="550.7223" font-family="sans-serif" font-size="12.1662" fill="var(--text-muted)">• <tspan font-family="monospace">onDetach()</tspan> — fragment disassociated from activity</text>
  <text x="677.4999" y="568.4444" font-family="sans-serif" font-size="12.1662" fill="var(--text-muted)">• Fragment can survive activity rotation (retain instance)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <text x="248.8889" y="21.3333" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Activity Lifecycle</text>
  <rect x="142.2222" y="32" width="213.3333" height="39.1111" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="248.8889" y="56.8889" text-anchor="middle" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--bg)">onCreate()</text>
  <line x1="248.8889" y1="72.8889" x2="248.8889" y2="97.7778" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="142.2222" y="99.5556" width="213.3333" height="39.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="248.8889" y="124.4444" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--text)">onStart()</text>
  <line x1="248.8889" y1="140.4444" x2="248.8889" y2="165.3333" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="142.2222" y="167.1111" width="213.3333" height="39.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="248.8889" y="192" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--text)">onResume()</text>
  <rect x="115.5556" y="218.6667" width="266.6667" height="39.1111" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="248.8889" y="243.5556" text-anchor="middle" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="var(--ok-accent)">RUNNING (visible + interactive)</text>
  <line x1="248.8889" y1="208" x2="248.8889" y2="220.4444" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <line x1="248.8889" y1="259.5556" x2="248.8889" y2="280.8889" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="142.2222" y="282.6667" width="213.3333" height="39.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="248.8889" y="307.5556" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--text-muted)">onPause()</text>
  <line x1="248.8889" y1="323.5556" x2="248.8889" y2="348.4444" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="142.2222" y="350.2222" width="213.3333" height="39.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="248.8889" y="375.1111" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--text-muted)">onStop()</text>
  <line x1="248.8889" y1="391.1111" x2="248.8889" y2="416" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="142.2222" y="417.7778" width="213.3333" height="39.1111" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="248.8889" y="442.6667" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--danger-accent)">onDestroy()</text>
  <path d="M 142.2222 371.5556 Q 53.3333 391.1111 53.3333 302.2222 Q 53.3333 151.1111 142.2222 142.2222" stroke="var(--primary-border)" stroke-width="1.3333" fill="none" stroke-dasharray="3.5556 2.6667" marker-end="url(#arrow-primary)" />
  <text x="26.6667" y="275.5556" font-family="monospace" font-size="10.6667" fill="var(--primary-accent)" transform="rotate(-90 30 310)">onRestart()</text>
  <text x="800" y="21.3333" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Fragment Lifecycle (extra callbacks)</text>
  <rect x="657.7778" y="32" width="284.4444" height="39.1111" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="800" y="56.8889" text-anchor="middle" font-family="monospace" font-size="13.3333" font-weight="bold" fill="var(--bg)">onAttach() → onCreate()</text>
  <line x1="800" y1="72.8889" x2="800" y2="97.7778" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="657.7778" y="99.5556" width="284.4444" height="39.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="800" y="124.4444" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--text)">onCreateView()</text>
  <line x1="800" y1="140.4444" x2="800" y2="165.3333" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="657.7778" y="167.1111" width="284.4444" height="39.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="800" y="192" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--text)">onViewCreated()</text>
  <line x1="800" y1="208" x2="800" y2="220.4444" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="631.1111" y="220.4444" width="337.7778" height="39.1111" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="800" y="245.3333" text-anchor="middle" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="var(--ok-accent)">onStart() → onResume() [same as Activity]</text>
  <line x1="800" y1="261.3333" x2="800" y2="282.6667" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="657.7778" y="284.4444" width="284.4444" height="39.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="800" y="309.3333" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--text-muted)">onPause() → onStop()</text>
  <line x1="800" y1="325.3333" x2="800" y2="350.2222" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="657.7778" y="352" width="284.4444" height="39.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="800" y="376.8889" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--text-muted)">onDestroyView()</text>
  <line x1="800" y1="392.8889" x2="800" y2="417.7778" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="657.7778" y="419.5556" width="284.4444" height="39.1111" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="800" y="444.4444" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--danger-accent)">onDestroy() → onDetach()</text>
  <rect x="26.6667" y="494.2222" width="1084.4444" height="106.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="568.8889" y="519.1111" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="var(--primary-accent)">Key differences: Fragment has extra callbacks</text>
  <text x="44.4444" y="544" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">• <tspan font-family="monospace">onAttach()</tspan> — fragment associated with host activity</text>
  <text x="44.4444" y="563.5556" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">• <tspan font-family="monospace">onCreateView()</tspan> — inflate fragment layout (return View)</text>
  <text x="44.4444" y="583.1111" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">• <tspan font-family="monospace">onViewCreated()</tspan> — safe to access views, setup observers</text>
  <text x="604.4444" y="544" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">• <tspan font-family="monospace">onDestroyView()</tspan> — nullify view bindings here to avoid leaks</text>
  <text x="604.4444" y="563.5556" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">• <tspan font-family="monospace">onDetach()</tspan> — fragment disassociated from activity</text>
  <text x="604.4444" y="583.1111" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">• Fragment can survive activity rotation (retain instance)</text>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#ffffff" />
      <ns0:stop offset="100%" stop-color="#f2f2f2" />
    </ns0:linearGradient>
    <ns0:filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <ns0:feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </ns0:filter>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
    <ns0:marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:text x="248.8889" y="21.3333" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#212121">Activity Lifecycle</ns0:text>
  <ns0:rect x="142.2222" y="32" width="213.3333" height="39.1111" rx="5.3333" fill="url(#grad-accent)" filter="url(#shadow)" />
  <ns0:text x="248.8889" y="56.8889" text-anchor="middle" font-family="monospace" font-size="14.2222" font-weight="bold" fill="#ffffff">onCreate()</ns0:text>
  <ns0:line x1="248.8889" y1="72.8889" x2="248.8889" y2="97.7778" stroke="#1565c0" stroke-width="1.7778" marker-end="url(#arrow-accent)" />
  <ns0:rect x="142.2222" y="99.5556" width="213.3333" height="39.1111" rx="5.3333" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="248.8889" y="124.4444" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="#212121">onStart()</ns0:text>
  <ns0:line x1="248.8889" y1="140.4444" x2="248.8889" y2="165.3333" stroke="#1565c0" stroke-width="1.7778" marker-end="url(#arrow-accent)" />
  <ns0:rect x="142.2222" y="167.1111" width="213.3333" height="39.1111" rx="5.3333" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="248.8889" y="192" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="#212121">onResume()</ns0:text>
  <ns0:rect x="115.5556" y="218.6667" width="266.6667" height="39.1111" rx="5.3333" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="248.8889" y="243.5556" text-anchor="middle" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="#1b5e20">RUNNING (visible + interactive)</ns0:text>
  <ns0:line x1="248.8889" y1="208" x2="248.8889" y2="220.4444" stroke="#1565c0" stroke-width="1.7778" marker-end="url(#arrow-accent)" />
  <ns0:line x1="248.8889" y1="259.5556" x2="248.8889" y2="280.8889" stroke="#555555" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:rect x="142.2222" y="282.6667" width="213.3333" height="39.1111" rx="5.3333" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="248.8889" y="307.5556" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="#555555">onPause()</ns0:text>
  <ns0:line x1="248.8889" y1="323.5556" x2="248.8889" y2="348.4444" stroke="#555555" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:rect x="142.2222" y="350.2222" width="213.3333" height="39.1111" rx="5.3333" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="248.8889" y="375.1111" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="#555555">onStop()</ns0:text>
  <ns0:line x1="248.8889" y1="391.1111" x2="248.8889" y2="416" stroke="#555555" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:rect x="142.2222" y="417.7778" width="213.3333" height="39.1111" rx="5.3333" fill="#ffcdd2" stroke="#c62828" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="248.8889" y="442.6667" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="#c62828">onDestroy()</ns0:text>
  <ns0:path d="M 142.2222 371.5556 Q 53.3333 391.1111 53.3333 302.2222 Q 53.3333 151.1111 142.2222 142.2222" stroke="#1565c0" stroke-width="1.3333" fill="none" stroke-dasharray="3.5556 2.6667" marker-end="url(#arrow-accent)" />
  <ns0:text x="26.6667" y="275.5556" font-family="monospace" font-size="10.6667" fill="#1565c0" transform="rotate(-90 30 310)">onRestart()</ns0:text>
  <ns0:text x="800" y="21.3333" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#212121">Fragment Lifecycle (extra callbacks)</ns0:text>
  <ns0:rect x="657.7778" y="32" width="284.4444" height="39.1111" rx="5.3333" fill="url(#grad-accent)" filter="url(#shadow)" />
  <ns0:text x="800" y="56.8889" text-anchor="middle" font-family="monospace" font-size="13.3333" font-weight="bold" fill="#ffffff">onAttach() → onCreate()</ns0:text>
  <ns0:line x1="800" y1="72.8889" x2="800" y2="97.7778" stroke="#1565c0" stroke-width="1.7778" marker-end="url(#arrow-accent)" />
  <ns0:rect x="657.7778" y="99.5556" width="284.4444" height="39.1111" rx="5.3333" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="800" y="124.4444" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="#212121">onCreateView()</ns0:text>
  <ns0:line x1="800" y1="140.4444" x2="800" y2="165.3333" stroke="#1565c0" stroke-width="1.7778" marker-end="url(#arrow-accent)" />
  <ns0:rect x="657.7778" y="167.1111" width="284.4444" height="39.1111" rx="5.3333" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="800" y="192" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="#212121">onViewCreated()</ns0:text>
  <ns0:line x1="800" y1="208" x2="800" y2="220.4444" stroke="#1565c0" stroke-width="1.7778" marker-end="url(#arrow-accent)" />
  <ns0:rect x="631.1111" y="220.4444" width="337.7778" height="39.1111" rx="5.3333" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="800" y="245.3333" text-anchor="middle" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="#1b5e20">onStart() → onResume() [same as Activity]</ns0:text>
  <ns0:line x1="800" y1="261.3333" x2="800" y2="282.6667" stroke="#555555" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:rect x="657.7778" y="284.4444" width="284.4444" height="39.1111" rx="5.3333" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="800" y="309.3333" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="#555555">onPause() → onStop()</ns0:text>
  <ns0:line x1="800" y1="325.3333" x2="800" y2="350.2222" stroke="#555555" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:rect x="657.7778" y="352" width="284.4444" height="39.1111" rx="5.3333" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="800" y="376.8889" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="#555555">onDestroyView()</ns0:text>
  <ns0:line x1="800" y1="392.8889" x2="800" y2="417.7778" stroke="#555555" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:rect x="657.7778" y="419.5556" width="284.4444" height="39.1111" rx="5.3333" fill="#ffcdd2" stroke="#c62828" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="800" y="444.4444" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="#c62828">onDestroy() → onDetach()</ns0:text>
  <ns0:rect x="26.6667" y="494.2222" width="1084.4444" height="106.6667" rx="5.3333" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="519.1111" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="#1565c0">Key differences: Fragment has extra callbacks</ns0:text>
  <ns0:text x="44.4444" y="544" font-family="sans-serif" font-size="12.4444" fill="#555555">• <ns0:tspan font-family="monospace">onAttach()</ns0:tspan> — fragment associated with host activity</ns0:text>
  <ns0:text x="44.4444" y="563.5556" font-family="sans-serif" font-size="12.4444" fill="#555555">• <ns0:tspan font-family="monospace">onCreateView()</ns0:tspan> — inflate fragment layout (return View)</ns0:text>
  <ns0:text x="44.4444" y="583.1111" font-family="sans-serif" font-size="12.4444" fill="#555555">• <ns0:tspan font-family="monospace">onViewCreated()</ns0:tspan> — safe to access views, setup observers</ns0:text>
  <ns0:text x="604.4444" y="544" font-family="sans-serif" font-size="12.4444" fill="#555555">• <ns0:tspan font-family="monospace">onDestroyView()</ns0:tspan> — nullify view bindings here to avoid leaks</ns0:text>
  <ns0:text x="604.4444" y="563.5556" font-family="sans-serif" font-size="12.4444" fill="#555555">• <ns0:tspan font-family="monospace">onDetach()</ns0:tspan> — fragment disassociated from activity</ns0:text>
  <ns0:text x="604.4444" y="583.1111" font-family="sans-serif" font-size="12.4444" fill="#555555">• Fragment can survive activity rotation (retain instance)</ns0:text>
</ns0:svg>
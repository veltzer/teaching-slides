<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="400" y="40" width="480.0001" height="134.8837" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="120.9302" text-anchor="middle" font-size="33.5856" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Layout Inspector</text>
  <rect x="40" y="309.7674" width="288" height="107.907" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="184" y="377.2093" text-anchor="middle" font-size="28.7876" font-family="Arial, sans-serif" fill="var(--info-text)">View Hierarchy</text>
  <rect x="496" y="309.7674" width="336.0001" height="107.907" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="664" y="377.2093" text-anchor="middle" font-size="28.7876" font-family="Arial, sans-serif" fill="var(--ok-text)">Performance Metrics</text>
  <rect x="952" y="309.7674" width="288" height="107.907" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1096" y="377.2093" text-anchor="middle" font-size="28.7876" font-family="Arial, sans-serif" fill="var(--warn-text)">Layout Bounds</text>
  <rect x="40" y="525.5814" width="288" height="94.4186" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="184" y="584.9302" text-anchor="middle" font-size="26.3887" font-family="Arial, sans-serif" fill="var(--primary-text)">3D View</text>
  <rect x="496" y="525.5814" width="336.0001" height="94.4186" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="664" y="584.9302" text-anchor="middle" font-size="26.3887" font-family="Arial, sans-serif" fill="var(--ok-text)">Rendering Stats</text>
  <rect x="952" y="525.5814" width="288" height="94.4186" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1096" y="584.9302" text-anchor="middle" font-size="26.3887" font-family="Arial, sans-serif" fill="var(--danger-text)">Overdraw</text>
  <line x1="520" y1="174.8837" x2="184" y2="309.7674" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="174.8837" x2="664" y2="309.7674" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="174.8837" x2="1096" y2="309.7674" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="184" y1="417.6744" x2="184" y2="525.5814" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="664" y1="417.6744" x2="664" y2="525.5814" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1096" y1="417.6744" x2="1096" y2="525.5814" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

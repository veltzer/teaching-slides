<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <ellipse cx="610.4919" cy="305.1429" rx="189.6956" ry="82.8571" fill="var(--primary-fill)" stroke="var(--text)" stroke-width="3.5069"/>
  <text x="610.4919" y="305.1429" text-anchor="middle" font-size="24.8219" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">UI Best</text>
  <text x="610.4919" y="338.2857" text-anchor="middle" font-size="24.8219" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Practices</text>
  <ellipse cx="256.3935" cy="147.7143" rx="161.2411" ry="58" fill="var(--info-fill)" stroke="var(--text)" stroke-width="3.5069"/>
  <text x="256.3935" y="156" text-anchor="middle" font-size="21.276" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Layout Optimization</text>
  <ellipse cx="964.5902" cy="147.7143" rx="142.2716" ry="58" fill="var(--ok-fill)" stroke="var(--text)" stroke-width="3.5069"/>
  <text x="964.5902" y="156" text-anchor="middle" font-size="21.276" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Custom Views</text>
  <ellipse cx="610.4919" cy="512.2857" rx="142.2716" ry="58" fill="var(--warn-fill)" stroke="var(--text)" stroke-width="3.5069"/>
  <text x="610.4919" y="520.5714" text-anchor="middle" font-size="21.276" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">ViewBinding</text>
  <rect x="79.3443" y="40" width="216.3935" height="41.4286" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="187.541" y="68.1715" text-anchor="middle" font-size="17.7299" font-family="Arial, sans-serif" fill="var(--danger-text)">Flatten Hierarchy</text>
  <rect x="40" y="214" width="196.7213" height="41.4286" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="138.3608" y="242.1715" text-anchor="middle" font-size="17.7299" font-family="Arial, sans-serif" fill="var(--danger-text)">Avoid Overdraw</text>
  <rect x="276.0656" y="214" width="236.0655" height="41.4286" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="394.0983" y="242.1715" text-anchor="middle" font-size="17.7299" font-family="Arial, sans-serif" fill="var(--danger-text)">Use ConstraintLayout</text>
  <rect x="826.8854" y="40" width="196.7213" height="41.4286" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="925.2459" y="68.1715" text-anchor="middle" font-size="17.7299" font-family="Arial, sans-serif" fill="var(--ok-text)">Proper Lifecycle</text>
  <rect x="1043.2787" y="98" width="196.7213" height="41.4286" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1141.6394" y="126.1715" text-anchor="middle" font-size="17.7299" font-family="Arial, sans-serif" fill="var(--ok-text)">Efficient Drawing</text>
  <rect x="944.9181" y="214" width="216.3935" height="41.4286" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1053.1147" y="242.1715" text-anchor="middle" font-size="17.7299" font-family="Arial, sans-serif" fill="var(--ok-text)">State Management</text>
  <rect x="374.4263" y="562" width="157.3771" height="41.4286" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="453.1147" y="590.1714" text-anchor="middle" font-size="17.7299" font-family="Arial, sans-serif" fill="var(--warn-text)">Null Safety</text>
  <rect x="571.1476" y="578.5714" width="157.3771" height="41.4286" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="649.8361" y="606.7429" text-anchor="middle" font-size="17.7299" font-family="Arial, sans-serif" fill="var(--warn-text)">Type Safety</text>
  <rect x="767.869" y="562" width="167.2131" height="41.4286" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="850.4919" y="590.1714" text-anchor="middle" font-size="17.7299" font-family="Arial, sans-serif" fill="var(--warn-text)">Performance</text>
  <line x1="453.1147" y1="280.2858" x2="256.3935" y2="197.4286" stroke="var(--text)" stroke-width="2"/>
  <line x1="767.869" y1="280.2858" x2="964.5902" y2="197.4286" stroke="var(--text)" stroke-width="2"/>
  <line x1="610.4919" y1="379.7143" x2="610.4919" y2="454.2857" stroke="var(--text)" stroke-width="2"/>

  <line x1="167.869" y1="205.7143" x2="138.3608" y2="214" stroke="var(--text-muted)" stroke-width="1.7534"/>
  <line x1="344.9181" y1="205.7143" x2="394.0983" y2="214" stroke="var(--text-muted)" stroke-width="1.7534"/>
  <line x1="925.2459" y1="98" x2="925.2459" y2="81.4286" stroke="var(--text-muted)" stroke-width="1.7534"/>
  <line x1="1023.6065" y1="131.1429" x2="1043.2787" y2="122.8572" stroke="var(--text-muted)" stroke-width="1.7534"/>
  <line x1="1003.9345" y1="197.4286" x2="1053.1147" y2="214" stroke="var(--text-muted)" stroke-width="1.7534"/>
  <line x1="531.8033" y1="537.1428" x2="453.1147" y2="562" stroke="var(--text-muted)" stroke-width="1.7534"/>
  <line x1="610.4919" y1="562" x2="649.8361" y2="578.5714" stroke="var(--text-muted)" stroke-width="1.7534"/>
  <line x1="689.1804" y1="537.1428" x2="767.869" y2="562" stroke="var(--text-muted)" stroke-width="1.7534"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#888888"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="247.619048" height="110" rx="5.8554" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="163.809524" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.469802" font-weight="bold" fill="var(--primary-text)">Constructor</text>
  <text x="163.809524" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.662601" fill="var(--primary-text)">read attrs, allocate</text>
  <text x="163.809524" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.662601" fill="var(--primary-text)">Paint objects</text>

  <rect x="325.714286" y="40" width="285.714286" height="110" rx="5.8554" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="468.571429" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.469802" font-weight="bold" fill="var(--info-text)">onAttachedToWindow</text>
  <text x="468.571429" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.662601" fill="var(--info-text)">register listeners,</text>
  <text x="468.571429" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.662601" fill="var(--info-text)">start animations</text>

  <rect x="649.52381" y="40" width="247.619048" height="110" rx="5.8554" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="773.333333" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.469802" font-weight="bold" fill="var(--ok-text)">onMeasure</text>
  <text x="773.333333" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.662601" fill="var(--ok-text)">compute width/height</text>
  <text x="773.333333" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.662601" fill="var(--ok-text)">from MeasureSpec</text>

  <rect x="935.238095" y="40" width="247.619048" height="110" rx="5.8554" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1059.047619" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.469802" font-weight="bold" fill="var(--warn-text)">onLayout</text>
  <text x="1059.047619" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.662601" fill="var(--warn-text)">position children</text>
  <text x="1059.047619" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.662601" fill="var(--warn-text)">(ViewGroup only)</text>

  <line x1="287.619048" y1="95" x2="325.714286" y2="95" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="611.428571" y1="95" x2="649.52381" y2="95" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="897.142857" y1="95" x2="935.238095" y2="95" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="1059.047619" y1="150" x2="1059.047619" y2="200" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="1059.047619" y1="200" x2="773.333333" y2="200" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="773.333333" y1="200" x2="773.333333" y2="250" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="649.52381" y="260" width="247.619048" height="120" rx="5.8554" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="773.333333" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.469802" font-weight="bold" fill="var(--danger-text)">onDraw</text>
  <text x="773.333333" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.662601" fill="var(--danger-text)">canvas.drawRect/Path/Text</text>
  <text x="773.333333" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.662601" fill="var(--danger-text)">no allocations on hot path</text>

  <path d="M 897.142857 290 Q 992.380952 260 992.380952 320 Q 992.380952 370 897.142857 350" stroke="var(--text-muted)" stroke-width="2" fill="none" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <text x="1011.428571" y="325" font-family="Arial, sans-serif" font-size="13.662601" fill="var(--text-muted)">invalidate()</text>
  <text x="1011.428571" y="345" font-family="Arial, sans-serif" font-size="13.662601" fill="var(--text-muted)">redraws</text>

  <path d="M 649.52381 290 Q 554.285714 260 554.285714 320 Q 554.285714 370 649.52381 350" stroke="var(--text-muted)" stroke-width="2" fill="none" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <text x="411.428571" y="325" font-family="Arial, sans-serif" font-size="13.662601" fill="var(--text-muted)">requestLayout()</text>
  <text x="411.428571" y="345" font-family="Arial, sans-serif" font-size="13.662601" fill="var(--text-muted)">re-measures</text>

  <line x1="773.333333" y1="380" x2="773.333333" y2="430" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="306.666667" y="440" width="933.333333" height="80" rx="5.8554" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="773.333333" y="478" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.518001" font-weight="bold" fill="var(--info-text)">Touch &amp; events</text>
  <text x="773.333333" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.662601" fill="var(--info-text)">onTouchEvent / onKeyDown — handle interaction, then invalidate</text>

  <rect x="40" y="540" width="1142.857143" height="80" rx="5.8554" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="611.428571" y="578" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.469802" font-weight="bold" fill="var(--danger-text)">onDetachedFromWindow</text>
  <text x="611.428571" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.662601" fill="var(--danger-text)">unregister listeners, cancel animations, release resources</text>
</svg>

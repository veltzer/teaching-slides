<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="247.619048" height="110" rx="5.8554" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="163.809524" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.469802" font-weight="bold" fill="var(--primary-text)">Constructor</text>
  <text x="163.809524" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.662601" fill="var(--primary-text)">read attrs, allocate</text>
  <text x="163.809524" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.662601" fill="var(--primary-text)">Paint objects</text>

  <rect x="325.714286" y="40" width="285.714286" height="110" rx="5.8554" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="468.571429" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.469802" font-weight="bold" fill="var(--info-text)">onAttachedToWindow</text>
  <text x="468.571429" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.662601" fill="var(--info-text)">register listeners,</text>
  <text x="468.571429" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.662601" fill="var(--info-text)">start animations</text>

  <rect x="649.52381" y="40" width="247.619048" height="110" rx="5.8554" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="773.333333" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.469802" font-weight="bold" fill="var(--ok-text)">onMeasure</text>
  <text x="773.333333" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.662601" fill="var(--ok-text)">compute width/height</text>
  <text x="773.333333" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.662601" fill="var(--ok-text)">from MeasureSpec</text>

  <rect x="935.238095" y="40" width="247.619048" height="110" rx="5.8554" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1059.047619" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.469802" font-weight="bold" fill="var(--warn-text)">onLayout</text>
  <text x="1059.047619" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.662601" fill="var(--warn-text)">position children</text>
  <text x="1059.047619" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.662601" fill="var(--warn-text)">(ViewGroup only)</text>

  <line x1="287.619048" y1="95" x2="325.714286" y2="95" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="611.428571" y1="95" x2="649.52381" y2="95" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="897.142857" y1="95" x2="935.238095" y2="95" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <line x1="1059.047619" y1="150" x2="1059.047619" y2="200" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="1059.047619" y1="200" x2="773.333333" y2="200" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="773.333333" y1="200" x2="773.333333" y2="250" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="649.52381" y="260" width="247.619048" height="120" rx="5.8554" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="773.333333" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.469802" font-weight="bold" fill="var(--danger-text)">onDraw</text>
  <text x="773.333333" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.662601" fill="var(--danger-text)">canvas.drawRect/Path/Text</text>
  <text x="773.333333" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.662601" fill="var(--danger-text)">no allocations on hot path</text>

  <path d="M 897.142857 290 Q 992.380952 260 992.380952 320 Q 992.380952 370 897.142857 350" stroke="var(--text-muted)" stroke-width="2" fill="none" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <text x="1011.428571" y="325" font-family="Arial, sans-serif" font-size="13.662601" fill="var(--text-muted)">invalidate()</text>
  <text x="1011.428571" y="345" font-family="Arial, sans-serif" font-size="13.662601" fill="var(--text-muted)">redraws</text>

  <path d="M 649.52381 290 Q 554.285714 260 554.285714 320 Q 554.285714 370 649.52381 350" stroke="var(--text-muted)" stroke-width="2" fill="none" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <text x="411.428571" y="325" font-family="Arial, sans-serif" font-size="13.662601" fill="var(--text-muted)">requestLayout()</text>
  <text x="411.428571" y="345" font-family="Arial, sans-serif" font-size="13.662601" fill="var(--text-muted)">re-measures</text>

  <line x1="773.333333" y1="380" x2="773.333333" y2="430" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="306.666667" y="440" width="933.333333" height="80" rx="5.8554" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="773.333333" y="478" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.518001" font-weight="bold" fill="var(--info-text)">Touch &amp; events</text>
  <text x="773.333333" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.662601" fill="var(--info-text)">onTouchEvent / onKeyDown — handle interaction, then invalidate</text>

  <rect x="40" y="540" width="1142.857143" height="80" rx="5.8554" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="611.428571" y="578" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.469802" font-weight="bold" fill="var(--danger-text)">onDetachedFromWindow</text>
  <text x="611.428571" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.662601" fill="var(--danger-text)">unregister listeners, cancel animations, release resources</text>
</svg>

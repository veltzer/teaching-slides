<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#888888"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="260" height="110" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="170" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Constructor</text>
  <text x="170" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">read attrs, allocate</text>
  <text x="170" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Paint objects</text>

  <rect x="340" y="40" width="300" height="110" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="490" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">onAttachedToWindow</text>
  <text x="490" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">register listeners,</text>
  <text x="490" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">start animations</text>

  <rect x="680" y="40" width="260" height="110" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="810" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">onMeasure</text>
  <text x="810" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">compute width/height</text>
  <text x="810" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">from MeasureSpec</text>

  <rect x="980" y="40" width="260" height="110" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1110" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">onLayout</text>
  <text x="1110" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">position children</text>
  <text x="1110" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">(ViewGroup only)</text>

  <line x1="300" y1="95" x2="340" y2="95" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="95" x2="680" y2="95" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="940" y1="95" x2="980" y2="95" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="1110" y1="150" x2="1110" y2="200" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="1110" y1="200" x2="810" y2="200" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="810" y1="200" x2="810" y2="250" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="680" y="260" width="260" height="120" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="810" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-text)">onDraw</text>
  <text x="810" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">canvas.drawRect/Path/Text</text>
  <text x="810" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">no allocations on hot path</text>

  <path d="M 940 290 Q 1040 260 1040 320 Q 1040 370 940 350" stroke="var(--text-muted)" stroke-width="2" fill="none" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <text x="1060" y="325" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">invalidate()</text>
  <text x="1060" y="345" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">redraws</text>

  <path d="M 680 290 Q 580 260 580 320 Q 580 370 680 350" stroke="var(--text-muted)" stroke-width="2" fill="none" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <text x="430" y="325" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">requestLayout()</text>
  <text x="430" y="345" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">re-measures</text>

  <line x1="810" y1="380" x2="810" y2="430" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="320" y="440" width="980" height="80" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="810" y="478" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Touch &amp; events</text>
  <text x="810" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">onTouchEvent / onKeyDown — handle interaction, then invalidate</text>

  <rect x="40" y="540" width="1200" height="80" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="640" y="578" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-text)">onDetachedFromWindow</text>
  <text x="640" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">unregister listeners, cancel animations, release resources</text>
</svg>

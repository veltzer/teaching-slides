<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="220" y="40" width="239.9999" height="59.1837" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340.0001" y="75.5102" font-family="Arial, sans-serif" font-size="18.6548" font-weight="bold" text-anchor="middle" fill="var(--bg)">Network Request</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <line x1="340.0001" y1="99.1836" x2="340.0001" y2="158.3673" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 340.0001 170.204 L 440 205.7143 L 340.0001 241.2244 L 240 205.7143 Z" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.3704"/>
  <text x="340.0001" y="211.6326" font-family="Arial, sans-serif" font-size="18.6548" font-weight="bold" text-anchor="middle" fill="var(--bg)">Success?</text>
  <line x1="440" y1="205.7143" x2="620" y2="205.7143" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="530" y="193.8775" font-family="Arial, sans-serif" font-size="15.9898" fill="var(--ok-accent)">Yes</text>
  <rect x="640" y="176.1225" width="220" height="59.1837" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="750" y="211.6326" font-family="Arial, sans-serif" font-size="18.6548" font-weight="bold" text-anchor="middle" fill="var(--bg)">Parse Response</text>
  <line x1="750" y1="235.3061" x2="750" y2="300.4081" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 750 312.2449 L 850 347.7551 L 750 383.2653 L 650 347.7551 Z" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.3704"/>
  <text x="750" y="353.6734" font-family="Arial, sans-serif" font-size="18.6548" font-weight="bold" text-anchor="middle" fill="var(--bg)">Valid Data?</text>
  <line x1="850" y1="347.7551" x2="1020" y2="347.7551" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="930" y="335.9184" font-family="Arial, sans-serif" font-size="15.9898" fill="var(--ok-accent)">Yes</text>
  <rect x="1040" y="318.1633" width="200" height="59.1837" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1139.9999" y="353.6734" font-family="Arial, sans-serif" font-size="18.6548" font-weight="bold" text-anchor="middle" fill="var(--bg)">Update UI</text>
  <line x1="750" y1="383.2653" x2="750" y2="454.2857" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="780" y="418.7755" font-family="Arial, sans-serif" font-size="15.9898" fill="var(--danger-accent)">No</text>
  <rect x="640" y="466.1224" width="220" height="59.1837" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="750" y="501.6327" font-family="Arial, sans-serif" font-size="18.6548" font-weight="bold" text-anchor="middle" fill="var(--bg)">Show Error</text>
  <line x1="240" y1="205.7143" x2="60" y2="205.7143" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="60" y1="205.7143" x2="60" y2="347.7551" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="60" y1="347.7551" x2="220" y2="347.7551" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="140.0001" y="193.8775" font-family="Arial, sans-serif" font-size="15.9898" fill="var(--danger-accent)">No</text>
  <rect x="240" y="318.1633" width="200" height="59.1837" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340.0001" y="353.6734" font-family="Arial, sans-serif" font-size="18.6548" font-weight="bold" text-anchor="middle" fill="var(--bg)">Handle Error</text>
  <line x1="340.0001" y1="377.3469" x2="340.0001" y2="430.6123" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="220" y="442.4489" width="239.9999" height="59.1837" rx="6" fill="var(--text-muted)" stroke="var(--text)" stroke-width="2.3704"/>
  <text x="340.0001" y="477.9592" font-family="Arial, sans-serif" font-size="18.6548" font-weight="bold" text-anchor="middle" fill="var(--bg)">Check Error Type</text>
  <line x1="220" y1="501.6327" x2="160" y2="560.8163" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="40" y="572.6531" width="200" height="47.3469" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140.0001" y="602.2449" font-family="Arial, sans-serif" font-size="15.9898" text-anchor="middle" fill="var(--warn-text)">Network Error</text>
  <line x1="340.0001" y1="501.6327" x2="340.0001" y2="560.8163" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="240" y="572.6531" width="200" height="47.3469" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340.0001" y="602.2449" font-family="Arial, sans-serif" font-size="15.9898" text-anchor="middle" fill="var(--warn-text)">Server Error</text>
  <line x1="460" y1="501.6327" x2="520" y2="560.8163" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="440" y="572.6531" width="200" height="47.3469" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="540.0001" y="602.2449" font-family="Arial, sans-serif" font-size="15.9898" text-anchor="middle" fill="var(--warn-text)">Auth Error</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="220" y="40" width="239.9999" height="59.1837" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340.0001" y="75.5102" font-family="Arial, sans-serif" font-size="18.6548" font-weight="bold" text-anchor="middle" fill="var(--bg)">Network Request</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowErr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,12 5.6,0" fill="#666" />
    </marker>
  </defs>
  <line x1="340.0001" y1="99.1836" x2="340.0001" y2="158.3673" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrowErr)" />
  <path d="M 340.0001 170.204 L 440 205.7143 L 340.0001 241.2244 L 240 205.7143 Z" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.3704" />
  <text x="340.0001" y="211.6326" font-family="Arial, sans-serif" font-size="18.6548" font-weight="bold" text-anchor="middle" fill="var(--bg)">Success?</text>
  <line x1="440" y1="205.7143" x2="620" y2="205.7143" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrowErr)" />
  <text x="530" y="193.8775" font-family="Arial, sans-serif" font-size="15.9898" fill="var(--ok-accent)">Yes</text>
  <rect x="640" y="176.1225" width="220" height="59.1837" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="750" y="211.6326" font-family="Arial, sans-serif" font-size="18.6548" font-weight="bold" text-anchor="middle" fill="var(--bg)">Parse Response</text>
  <line x1="750" y1="235.3061" x2="750" y2="300.4081" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrowErr)" />
  <path d="M 750 312.2449 L 850 347.7551 L 750 383.2653 L 650 347.7551 Z" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.3704" />
  <text x="750" y="353.6734" font-family="Arial, sans-serif" font-size="18.6548" font-weight="bold" text-anchor="middle" fill="var(--bg)">Valid Data?</text>
  <line x1="850" y1="347.7551" x2="1020" y2="347.7551" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrowErr)" />
  <text x="930" y="335.9184" font-family="Arial, sans-serif" font-size="15.9898" fill="var(--ok-accent)">Yes</text>
  <rect x="1040" y="318.1633" width="200" height="59.1837" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1139.9999" y="353.6734" font-family="Arial, sans-serif" font-size="18.6548" font-weight="bold" text-anchor="middle" fill="var(--bg)">Update UI</text>
  <line x1="750" y1="383.2653" x2="750" y2="454.2857" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrowErr)" />
  <text x="780" y="418.7755" font-family="Arial, sans-serif" font-size="15.9898" fill="var(--danger-accent)">No</text>
  <rect x="640" y="466.1224" width="220" height="59.1837" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="750" y="501.6327" font-family="Arial, sans-serif" font-size="18.6548" font-weight="bold" text-anchor="middle" fill="var(--bg)">Show Error</text>
  <line x1="240" y1="205.7143" x2="60" y2="205.7143" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="60" y1="205.7143" x2="60" y2="347.7551" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="60" y1="347.7551" x2="220" y2="347.7551" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrowErr)" />
  <text x="140.0001" y="193.8775" font-family="Arial, sans-serif" font-size="15.9898" fill="var(--danger-accent)">No</text>
  <rect x="240" y="318.1633" width="200" height="59.1837" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340.0001" y="353.6734" font-family="Arial, sans-serif" font-size="18.6548" font-weight="bold" text-anchor="middle" fill="var(--bg)">Handle Error</text>
  <line x1="340.0001" y1="377.3469" x2="340.0001" y2="430.6123" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrowErr)" />
  <rect x="220" y="442.4489" width="239.9999" height="59.1837" rx="6" fill="var(--text-muted)" stroke="var(--text)" stroke-width="2.3704" />
  <text x="340.0001" y="477.9592" font-family="Arial, sans-serif" font-size="18.6548" font-weight="bold" text-anchor="middle" fill="var(--bg)">Check Error Type</text>
  <line x1="220" y1="501.6327" x2="160" y2="560.8163" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrowErr)" />
  <rect x="40" y="572.6531" width="200" height="47.3469" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140.0001" y="602.2449" font-family="Arial, sans-serif" font-size="15.9898" text-anchor="middle">Network Error</text>
  <line x1="340.0001" y1="501.6327" x2="340.0001" y2="560.8163" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrowErr)" />
  <rect x="240" y="572.6531" width="200" height="47.3469" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340.0001" y="602.2449" font-family="Arial, sans-serif" font-size="15.9898" text-anchor="middle">Server Error</text>
  <line x1="460" y1="501.6327" x2="520" y2="560.8163" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrowErr)" />
  <rect x="440" y="572.6531" width="200" height="47.3469" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="540.0001" y="602.2449" font-family="Arial, sans-serif" font-size="15.9898" text-anchor="middle">Auth Error</text>
</svg>
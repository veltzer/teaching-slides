  <rect x="1095.9999" y="40" width="128" height="31.6364" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1160" y="61.0909" font-family="Arial, sans-serif" font-size="13.4991" text-anchor="middle" fill="var(--warn-text)">Caching</text>

  <rect x="48.0001" y="192.9091" width="167.9999" height="31.6364" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="131.2" y="214" font-family="Arial, sans-serif" font-size="13.4991" text-anchor="middle" fill="var(--primary-text)">Data Encryption</text>

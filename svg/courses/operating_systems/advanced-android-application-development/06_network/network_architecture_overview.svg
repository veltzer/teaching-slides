<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="658.75" y="40" width="187.5" height="59.1837" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="752.5" y="75.5102" font-family="Arial, sans-serif" font-size="18.0624" font-weight="bold" text-anchor="middle" fill="var(--bg)">Android App</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowNet" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,12 5.6,0" fill="#666" />
    </marker>
  </defs>
  <line x1="752.5" y1="99.1837" x2="752.5" y2="146.5306" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrowNet)" />
  <rect x="658.75" y="158.3673" width="187.5" height="59.1837" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="752.5" y="193.8776" font-family="Arial, sans-serif" font-size="18.0624" font-weight="bold" text-anchor="middle" fill="var(--bg)">Network Layer</text>
  <line x1="752.5" y1="217.551" x2="752.5" y2="264.898" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrowNet)" />
  <rect x="658.75" y="276.7347" width="187.5" height="59.1837" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="752.5" y="312.2449" font-family="Arial, sans-serif" font-size="18.0624" font-weight="bold" text-anchor="middle" fill="var(--bg)">Retrofit Client</text>
  <line x1="752.5" y1="335.9184" x2="752.5" y2="383.2653" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrowNet)" />
  <rect x="658.75" y="395.102" width="187.5" height="59.1837" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="752.5" y="430.6122" font-family="Arial, sans-serif" font-size="18.0624" font-weight="bold" text-anchor="middle" fill="var(--bg)">OkHttp Client</text>
  <line x1="752.5" y1="454.2857" x2="752.5" y2="501.6327" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrowNet)" />
  <ellipse cx="752.5" cy="548.9796" rx="84.375" ry="35.5102" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.4" />
  <text x="752.5" y="554.898" font-family="Arial, sans-serif" font-size="18.0624" font-weight="bold" text-anchor="middle" fill="var(--bg)">Internet</text>
  <line x1="658.75" y1="187.9592" x2="471.25" y2="187.9592" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrowNet)" />
  <rect x="283.75" y="158.3673" width="168.75" height="59.1837" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="368.125" y="193.8776" font-family="Arial, sans-serif" font-size="18.0624" font-weight="bold" text-anchor="middle" fill="var(--bg)">WebSocket</text>
  <line x1="846.25" y1="187.9592" x2="1033.75" y2="187.9592" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrowNet)" />
  <rect x="1052.5" y="158.3673" width="187.5" height="59.1837" rx="6" fill="var(--text-muted)" stroke="var(--text)" stroke-width="2.4" />
  <text x="1146.25" y="193.8776" font-family="Arial, sans-serif" font-size="18.0624" font-weight="bold" text-anchor="middle" fill="var(--bg)">Image Loading</text>
  <line x1="658.75" y1="424.6939" x2="471.25" y2="424.6939" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrowNet)" />
  <rect x="283.75" y="395.102" width="168.75" height="59.1837" rx="6" fill="var(--text-muted)" stroke="var(--text-muted)" stroke-width="2.4" />
  <text x="368.125" y="430.6122" font-family="Arial, sans-serif" font-size="18.0624" font-weight="bold" text-anchor="middle" fill="var(--bg)">Interceptors</text>
  <line x1="283.75" y1="424.6939" x2="152.5" y2="359.5918" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrowNet)" />
  <rect x="40" y="324.0816" width="187.5" height="47.3469" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="133.75" y="353.6735" font-family="Arial, sans-serif" font-size="15.4821" text-anchor="middle">Authentication</text>
  <line x1="283.75" y1="454.2857" x2="152.5" y2="501.6327" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrowNet)" />
  <rect x="40" y="489.7959" width="187.5" height="47.3469" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="133.75" y="519.3878" font-family="Arial, sans-serif" font-size="15.4821" text-anchor="middle">Caching</text>
  <line x1="368.125" y1="454.2857" x2="368.125" y2="560.8163" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrowNet)" />
  <rect x="274.375" y="572.6531" width="187.5" height="47.3469" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="368.125" y="602.2449" font-family="Arial, sans-serif" font-size="15.4821" text-anchor="middle">Logging</text>
</svg>
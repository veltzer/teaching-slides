<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="47.0588" y="176.4706" width="75.2941" height="35.2941" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="84.7059" y="197.6471" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="var(--bg)">Request</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowCache" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,12 5.6,0" fill="#666" />
    </marker>
  </defs>
  <line x1="122.3529" y1="194.1176" x2="188.2353" y2="194.1176" stroke="var(--text-muted)" stroke-width="1.4118" marker-end="url(#arrowCache)" />
  <path d="M 235.2941 176.4706 L 282.3529 194.1176 L 235.2941 211.7647 L 188.2353 194.1176 Z" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.4118" />
  <text x="235.2941" y="194.1176" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="var(--bg)">Cache</text>
  <text x="235.2941" y="204.7059" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="var(--bg)">Valid?</text>
  <line x1="235.2941" y1="176.4706" x2="235.2941" y2="127.0588" stroke="var(--text-muted)" stroke-width="1.4118" marker-end="url(#arrowCache)" />
  <text x="254.1176" y="151.7647" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)">Yes</text>
  <rect x="188.2353" y="91.7647" width="94.1176" height="35.2941" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="235.2941" y="112.9412" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="var(--bg)">Use Cache</text>
  <line x1="282.3529" y1="194.1176" x2="357.6471" y2="194.1176" stroke="var(--text-muted)" stroke-width="1.4118" marker-end="url(#arrowCache)" />
  <text x="320" y="187.0588" font-family="Arial, sans-serif" font-size="10" fill="var(--danger-accent)">No</text>
  <rect x="367.0588" y="176.4706" width="112.9412" height="35.2941" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="423.5294" y="197.6471" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="var(--bg)">Network Request</text>
  <line x1="480" y1="194.1176" x2="545.8824" y2="194.1176" stroke="var(--text-muted)" stroke-width="1.4118" marker-end="url(#arrowCache)" />
  <path d="M 592.9412 176.4706 L 640 194.1176 L 592.9412 211.7647 L 545.8824 194.1176 Z" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.4118" />
  <text x="592.9412" y="197.6471" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="var(--bg)">Success?</text>
  <line x1="592.9412" y1="176.4706" x2="592.9412" y2="127.0588" stroke="var(--text-muted)" stroke-width="1.4118" marker-end="url(#arrowCache)" />
  <text x="611.7647" y="151.7647" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)">Yes</text>
  <rect x="541.1765" y="91.7647" width="103.5294" height="35.2941" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="592.9412" y="112.9412" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="var(--bg)">Update Cache</text>
  <line x1="592.9412" y1="211.7647" x2="592.9412" y2="261.1765" stroke="var(--text-muted)" stroke-width="1.4118" marker-end="url(#arrowCache)" />
  <text x="611.7647" y="236.4706" font-family="Arial, sans-serif" font-size="10" fill="var(--danger-accent)">No</text>
  <rect x="536.4706" y="268.2353" width="112.9412" height="35.2941" rx="6" fill="var(--text-muted)" stroke="var(--text)" stroke-width="1.4118" />
  <text x="592.9412" y="289.4118" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="var(--bg)">Use Stale Cache</text>
</svg>
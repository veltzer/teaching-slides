<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="80" y="290.625" width="140" height="65.625" rx="11.1562" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="150.0001" y="330.0001" font-family="Arial, sans-serif" font-size="18.5937" font-weight="bold" text-anchor="middle" fill="var(--bg)">Request</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowCache" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,12 5.6,0" fill="#666" />
    </marker>
  </defs>
  <line x1="220" y1="323.4374" x2="342.5" y2="323.4374" stroke="var(--text-muted)" stroke-width="1.4118" marker-end="url(#arrowCache)" />
  <path d="M 430 290.625 L 517.4999 323.4374 L 430 356.25 L 342.5 323.4374 Z" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.4118" />
  <text x="430" y="323.4374" font-family="Arial, sans-serif" font-size="18.5937" font-weight="bold" text-anchor="middle" fill="var(--bg)">Cache</text>
  <text x="430" y="343.125" font-family="Arial, sans-serif" font-size="18.5937" font-weight="bold" text-anchor="middle" fill="var(--bg)">Valid?</text>
  <line x1="430" y1="290.625" x2="430" y2="198.75" stroke="var(--text-muted)" stroke-width="1.4118" marker-end="url(#arrowCache)" />
  <text x="464.9999" y="244.6875" font-family="Arial, sans-serif" font-size="18.5937" fill="var(--ok-accent)">Yes</text>
  <rect x="342.5" y="133.125" width="174.9999" height="65.625" rx="11.1562" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="430" y="172.5001" font-family="Arial, sans-serif" font-size="18.5937" font-weight="bold" text-anchor="middle" fill="var(--bg)">Use Cache</text>
  <line x1="517.4999" y1="323.4374" x2="657.5001" y2="323.4374" stroke="var(--text-muted)" stroke-width="1.4118" marker-end="url(#arrowCache)" />
  <text x="587.5" y="310.3125" font-family="Arial, sans-serif" font-size="18.5937" fill="var(--danger-accent)">No</text>
  <rect x="674.9999" y="290.625" width="210" height="65.625" rx="11.1562" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="780" y="330.0001" font-family="Arial, sans-serif" font-size="18.5937" font-weight="bold" text-anchor="middle" fill="var(--bg)">Network Request</text>
  <line x1="885" y1="323.4374" x2="1007.5" y2="323.4374" stroke="var(--text-muted)" stroke-width="1.4118" marker-end="url(#arrowCache)" />
  <path d="M 1095 290.625 L 1182.4999 323.4374 L 1095 356.25 L 1007.5 323.4374 Z" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.4118" />
  <text x="1095" y="330.0001" font-family="Arial, sans-serif" font-size="18.5937" font-weight="bold" text-anchor="middle" fill="var(--bg)">Success?</text>
  <line x1="1095" y1="290.625" x2="1095" y2="198.75" stroke="var(--text-muted)" stroke-width="1.4118" marker-end="url(#arrowCache)" />
  <text x="1129.9999" y="244.6875" font-family="Arial, sans-serif" font-size="18.5937" fill="var(--ok-accent)">Yes</text>
  <rect x="998.75" y="133.125" width="192.5" height="65.625" rx="11.1562" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1095" y="172.5001" font-family="Arial, sans-serif" font-size="18.5937" font-weight="bold" text-anchor="middle" fill="var(--bg)">Update Cache</text>
  <line x1="1095" y1="356.25" x2="1095" y2="448.1251" stroke="var(--text-muted)" stroke-width="1.4118" marker-end="url(#arrowCache)" />
  <text x="1129.9999" y="402.1875" font-family="Arial, sans-serif" font-size="18.5937" fill="var(--danger-accent)">No</text>
  <rect x="990" y="461.25" width="210" height="65.625" rx="11.1562" fill="var(--text-muted)" stroke="var(--text)" stroke-width="1.4118" />
  <text x="1095" y="500.6251" font-family="Arial, sans-serif" font-size="18.5937" font-weight="bold" text-anchor="middle" fill="var(--bg)">Use Stale Cache</text>
</svg>
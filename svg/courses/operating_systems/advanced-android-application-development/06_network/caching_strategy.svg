<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="272.0001" width="150" height="96.6667" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="115.0001" y="330.0001" font-family="Arial, sans-serif" font-size="23.3588" font-weight="bold" text-anchor="middle" fill="var(--bg)">Request</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <line x1="190" y1="320.3332" x2="321.25" y2="320.3332" stroke="var(--text-muted)" stroke-width="0.4136" marker-end="url(#arrow)"/>
  <path d="M 415 272.0001 L 508.7498 320.3332 L 415 368.6668 L 321.25 320.3332 Z" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="0.4136"/>
  <text x="415" y="320.3332" font-family="Arial, sans-serif" font-size="23.3588" font-weight="bold" text-anchor="middle" fill="var(--bg)">Cache</text>
  <text x="415" y="349.3335" font-family="Arial, sans-serif" font-size="23.3588" font-weight="bold" text-anchor="middle" fill="var(--bg)">Valid?</text>
  <line x1="415" y1="272.0001" x2="415" y2="136.6667" stroke="var(--text-muted)" stroke-width="0.4136" marker-end="url(#arrow)"/>
  <text x="452.5" y="204.3334" font-family="Arial, sans-serif" font-size="23.3588" fill="var(--ok-accent)">Yes</text>
  <rect x="321.25" y="40" width="187.4998" height="96.6667" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="415" y="98.0003" font-family="Arial, sans-serif" font-size="23.3588" font-weight="bold" text-anchor="middle" fill="var(--bg)">Use Cache</text>
  <line x1="508.7498" y1="320.3332" x2="658.7501" y2="320.3332" stroke="var(--text-muted)" stroke-width="0.4136" marker-end="url(#arrow)"/>
  <text x="583.75" y="301.0001" font-family="Arial, sans-serif" font-size="23.3588" fill="var(--danger-accent)">No</text>
  <rect x="677.5" y="272.0001" width="225" height="96.6667" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="790" y="330.0001" font-family="Arial, sans-serif" font-size="23.3588" font-weight="bold" text-anchor="middle" fill="var(--bg)">Network Request</text>
  <line x1="902.4999" y1="320.3332" x2="1033.7501" y2="320.3332" stroke="var(--text-muted)" stroke-width="0.4136" marker-end="url(#arrow)"/>
  <path d="M 1127.5001 272.0001 L 1221.2499 320.3332 L 1127.5001 368.6668 L 1033.7501 320.3332 Z" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="0.4136"/>
  <text x="1127.5001" y="330.0001" font-family="Arial, sans-serif" font-size="23.3588" font-weight="bold" text-anchor="middle" fill="var(--bg)">Success?</text>
  <line x1="1127.5001" y1="272.0001" x2="1127.5001" y2="136.6667" stroke="var(--text-muted)" stroke-width="0.4136" marker-end="url(#arrow)"/>
  <text x="1164.9999" y="204.3334" font-family="Arial, sans-serif" font-size="23.3588" fill="var(--ok-accent)">Yes</text>
  <rect x="1024.375" y="40" width="206.2501" height="96.6667" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1127.5001" y="98.0003" font-family="Arial, sans-serif" font-size="23.3588" font-weight="bold" text-anchor="middle" fill="var(--bg)">Update Cache</text>
  <line x1="1127.5001" y1="368.6668" x2="1127.5001" y2="504.0002" stroke="var(--text-muted)" stroke-width="0.4136" marker-end="url(#arrow)"/>
  <text x="1164.9999" y="436.3332" font-family="Arial, sans-serif" font-size="23.3588" fill="var(--danger-accent)">No</text>
  <rect x="1015" y="523.3333" width="225" height="96.6667" rx="6" fill="var(--text-muted)" stroke="var(--text)" stroke-width="0.4136"/>
  <text x="1127.5001" y="581.3336" font-family="Arial, sans-serif" font-size="23.3588" font-weight="bold" text-anchor="middle" fill="var(--bg)">Use Stale Cache</text>
</svg>

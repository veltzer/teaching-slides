<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.190036" font-weight="bold" fill="var(--text)">Integration best practices — adopting ML, AR, notifications, deep links</text>

  <!-- 2x3 grid of practice cards -->
  <rect x="40" y="82.962963" width="393.103448" height="161.111111" rx="8.43274" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="236.551724" y="120.555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.973666" font-weight="bold" fill="var(--primary-text)">Fail gracefully</text>
  <text x="236.551724" y="158.148148" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--primary-text)">Check feature availability before use</text>
  <text x="236.551724" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--primary-text)">(Play Services, ARCore, ML Kit)</text>
  <text x="236.551724" y="217.222222" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--primary-text)">Always provide a fallback path</text>

  <rect x="443.448276" y="82.962963" width="393.103448" height="161.111111" rx="8.43274" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="120.555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.973666" font-weight="bold" fill="var(--ok-text)">Ask permissions in context</text>
  <text x="640" y="158.148148" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--ok-text)">Request runtime permissions just-in-time</text>
  <text x="640" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--ok-text)">Explain why before the system dialog</text>
  <text x="640" y="217.222222" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--ok-text)">Handle deny &amp; permanent-deny states</text>

  <rect x="846.896552" y="82.962963" width="393.103448" height="161.111111" rx="8.43274" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1043.448276" y="120.555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.973666" font-weight="bold" fill="var(--warn-text)">Keep work off the main thread</text>
  <text x="1043.448276" y="158.148148" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--warn-text)">ML inference, image decoding, AR tracking</text>
  <text x="1043.448276" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--warn-text)">— all on coroutines / WorkManager</text>
  <text x="1043.448276" y="217.222222" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--warn-text)">Never block UI rendering</text>

  <rect x="40" y="276.296296" width="393.103448" height="161.111111" rx="8.43274" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="236.551724" y="313.888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.973666" font-weight="bold" fill="var(--info-text)">Secure deep links</text>
  <text x="236.551724" y="351.481481" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--info-text)">Use App Links with verified domains</text>
  <text x="236.551724" y="378.333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--info-text)">Validate every parameter</text>
  <text x="236.551724" y="410.555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--info-text)">Never trust intent data blindly</text>

  <rect x="443.448276" y="276.296296" width="393.103448" height="161.111111" rx="8.43274" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="313.888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.973666" font-weight="bold" fill="var(--danger-text)">Respect privacy &amp; battery</text>
  <text x="640" y="351.481481" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--danger-text)">On-device ML when possible</text>
  <text x="640" y="378.333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--danger-text)">Disclose data collection up front</text>
  <text x="640" y="410.555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--danger-text)">Stop sensors, cameras, AR when hidden</text>

  <rect x="846.896552" y="276.296296" width="393.103448" height="161.111111" rx="8.43274" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1043.448276" y="313.888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.973666" font-weight="bold" fill="var(--primary-text)">Test on real devices</text>
  <text x="1043.448276" y="351.481481" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--primary-text)">Camera, AR, notifications behave</text>
  <text x="1043.448276" y="378.333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--primary-text)">differently across OEMs + API levels</text>
  <text x="1043.448276" y="410.555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--primary-text)">Emulators miss edge cases</text>

  <!-- Bottom summary strip -->
  <rect x="40" y="469.62963" width="1200" height="150.37037" rx="8.43274" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="507.222222" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.865481" font-weight="bold" fill="var(--text)">Guiding principle</text>
  <text x="640" y="544.814815" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.757296" fill="var(--text-muted)">Advanced features should feel invisible when they work</text>
  <text x="640" y="571.666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.757296" fill="var(--text-muted)">and degrade cleanly when they don't.</text>
  <text x="640" y="603.888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--text-faint)">Integrate behind an abstraction so you can swap providers without a UI rewrite.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="360" height="580" rx="8.44894167246" fill="var(--surface)" stroke="var(--border)"/>
  <text x="220" y="79.038461538462" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.010118763033" font-weight="bold" fill="var(--text)">Profiler Tools</text>

  <rect x="70" y="106.923076923077" width="300" height="66.923076923077" rx="6.336706254345" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220" y="134.807692307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" font-weight="bold" fill="var(--primary-text)">CPU</text>
  <text x="220" y="160.461538461538" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--primary-text)">Flame charts</text>

  <rect x="70" y="190.576923076923" width="300" height="66.923076923077" rx="6.336706254345" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220" y="218.461538461538" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" font-weight="bold" fill="var(--info-text)">Memory</text>
  <text x="220" y="244.115384615385" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--info-text)">Heap, leaks</text>

  <rect x="70" y="274.230769230769" width="300" height="66.923076923077" rx="6.336706254345" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220" y="302.115384615384" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" font-weight="bold" fill="var(--warn-text)">Network</text>
  <text x="220" y="327.769230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--warn-text)">Timing, size</text>

  <rect x="70" y="357.884615384615" width="300" height="66.923076923077" rx="6.336706254345" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220" y="385.769230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" font-weight="bold" fill="var(--danger-text)">Energy</text>
  <text x="220" y="411.423076923077" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--danger-text)">Battery, wakes</text>

  <rect x="70" y="441.538461538461" width="300" height="66.923076923077" rx="6.336706254345" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220" y="469.423076923077" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" font-weight="bold" fill="var(--ok-text)">Perfetto</text>
  <text x="220" y="495.076923076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--ok-text)">Frame jank</text>

  <rect x="430" y="106.923076923077" width="120" height="55.769230769231" rx="6.336706254345" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="140.384615384616" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" font-weight="bold" fill="var(--primary-text)">Measure</text>
  <line x1="490" y1="166.038461538461" x2="490" y2="212.884615384615" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="430" y="218.461538461538" width="120" height="55.769230769231" rx="6.336706254345" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="251.923076923077" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" font-weight="bold" fill="var(--warn-text)">Identify</text>
  <line x1="490" y1="277.576923076922" x2="490" y2="324.423076923077" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="430" y="330" width="120" height="55.769230769231" rx="6.336706254345" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="363.461538461538" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" font-weight="bold" fill="var(--info-text)">Optimize</text>
  <line x1="490" y1="389.115384615385" x2="490" y2="435.961538461538" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="430" y="441.538461538461" width="120" height="55.769230769231" rx="6.336706254345" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" font-weight="bold" fill="var(--ok-text)">Verify</text>

  <rect x="600" y="40" width="640" height="580" rx="8.44894167246" fill="var(--surface)" stroke="var(--border)"/>
  <text x="920" y="79.038461538462" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.010118763033" font-weight="bold" fill="var(--text)">Key Metrics</text>

  <rect x="630" y="106.923076923077" width="280" height="100.384615384616" rx="6.336706254345" fill="var(--bg)" stroke="var(--border)"/>
  <text x="770" y="140.384615384616" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.841765635861" font-weight="bold" fill="var(--primary-accent)">Frame time</text>
  <text x="770" y="173.846153846153" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--text-muted)">&lt; 16 ms (60 fps)</text>

  <rect x="930" y="106.923076923077" width="280" height="100.384615384616" rx="6.336706254345" fill="var(--bg)" stroke="var(--border)"/>
  <text x="1070" y="140.384615384616" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.841765635861" font-weight="bold" fill="var(--ok-accent)">Startup</text>
  <text x="1070" y="173.846153846153" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--text-muted)">cold &lt; 2s</text>

  <rect x="630" y="229.615384615384" width="280" height="100.384615384616" rx="6.336706254345" fill="var(--bg)" stroke="var(--border)"/>
  <text x="770" y="263.076923076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.841765635861" font-weight="bold" fill="var(--info-accent)">Memory</text>
  <text x="770" y="296.538461538461" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--text-muted)">Watch GC, leaks</text>

  <rect x="930" y="229.615384615384" width="280" height="100.384615384616" rx="6.336706254345" fill="var(--bg)" stroke="var(--border)"/>
  <text x="1070" y="263.076923076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.841765635861" font-weight="bold" fill="var(--warn-accent)">Network</text>
  <text x="1070" y="296.538461538461" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--text-muted)">Batch, compress</text>

  <rect x="630" y="352.307692307692" width="580" height="245.384615384616" rx="6.336706254345" fill="var(--bg)" stroke="var(--border)"/>
  <text x="920" y="396.923076923077" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" font-weight="bold" fill="var(--text)">Rules</text>
  <text x="920" y="447.115384615385" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--text-muted)">Profile release on real devices</text>
  <text x="920" y="486.153846153846" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--text-muted)">Never optimize by guess</text>
  <text x="920" y="525.192307692307" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--text-muted)">Fix biggest, re-measure</text>
  <text x="920" y="564.230769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--text-muted)">CI benchmarks catch regressions</text>
</svg>

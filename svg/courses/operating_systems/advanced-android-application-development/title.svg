<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Android robot -->
  <!-- Head -->
  <rect x="340" y="100" width="120" height="80" rx="40" fill="#3ddc84"/>
  <!-- Eyes -->
  <circle cx="370" cy="130" r="6" fill="#1a1a2e"/>
  <circle cx="430" cy="130" r="6" fill="#1a1a2e"/>
  <!-- Antennae -->
  <line x1="365" y1="100" x2="350" y2="75" stroke="#3ddc84" stroke-width="4" stroke-linecap="round"/>
  <line x1="435" y1="100" x2="450" y2="75" stroke="#3ddc84" stroke-width="4" stroke-linecap="round"/>
  <!-- Body -->
  <rect x="340" y="185" width="120" height="100" rx="10" fill="#3ddc84"/>
  <!-- Arms -->
  <rect x="305" y="190" width="25" height="70" rx="12" fill="#3ddc84"/>
  <rect x="470" y="190" width="25" height="70" rx="12" fill="#3ddc84"/>
  <!-- Legs -->
  <rect x="360" y="290" width="25" height="50" rx="12" fill="#3ddc84"/>
  <rect x="415" y="290" width="25" height="50" rx="12" fill="#3ddc84"/>
  <!-- Code brackets on left -->
  <text x="120" y="150" font-size="60" fill="#bb86fc" opacity="0.6" font-family="monospace">{</text>
  <text x="130" y="210" font-size="16" fill="#03dac6" opacity="0.7" font-family="monospace">class App</text>
  <text x="130" y="235" font-size="16" fill="#cf6679" opacity="0.7" font-family="monospace">  extends</text>
  <text x="130" y="260" font-size="16" fill="#03dac6" opacity="0.7" font-family="monospace">  Activity</text>
  <text x="120" y="310" font-size="60" fill="#bb86fc" opacity="0.6" font-family="monospace">}</text>
  <!-- Architecture boxes on right -->
  <rect x="570" y="100" width="150" height="35" rx="5" fill="#bb86fc" opacity="0.3"/>
  <text x="645" y="122" text-anchor="middle" font-size="12" fill="#bb86fc">UI Layer</text>
  <rect x="570" y="145" width="150" height="35" rx="5" fill="#03dac6" opacity="0.3"/>
  <text x="645" y="167" text-anchor="middle" font-size="12" fill="#03dac6">ViewModel</text>
  <rect x="570" y="190" width="150" height="35" rx="5" fill="#cf6679" opacity="0.3"/>
  <text x="645" y="212" text-anchor="middle" font-size="12" fill="#cf6679">Repository</text>
  <rect x="570" y="235" width="150" height="35" rx="5" fill="#3ddc84" opacity="0.3"/>
  <text x="645" y="257" text-anchor="middle" font-size="12" fill="#3ddc84">Data Layer</text>
  <!-- Connecting arrows -->
  <line x1="645" y1="135" x2="645" y2="145" stroke="#888" stroke-width="1.5"/>
  <line x1="645" y1="180" x2="645" y2="190" stroke="#888" stroke-width="1.5"/>
  <line x1="645" y1="225" x2="645" y2="235" stroke="#888" stroke-width="1.5"/>
</svg>

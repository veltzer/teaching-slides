<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="bg" x1="0" y1="0" x2="1.6" y2="1.8">
      <stop offset="0%" stop-color="#1a1a2e" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
  </defs>
  <rect width="1137.7778" height="640" fill="url(#bg)" rx="6"/>
  <rect x="483.5556" y="160" width="170.6667" height="128" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <circle cx="526.2222" cy="208" r="8.5333" fill="var(--code-bg)" />
  <circle cx="611.5556" cy="208" r="8.5333" fill="var(--code-bg)" />
  <line x1="519.1111" y1="160" x2="497.7778" y2="120" stroke="var(--ok-border)" stroke-width="2" stroke-linecap="round" />
  <line x1="618.6667" y1="160" x2="640" y2="120" stroke="var(--ok-border)" stroke-width="2" stroke-linecap="round" />
  <rect x="483.5556" y="296" width="170.6667" height="160" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="433.7778" y="304" width="35.5556" height="112" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="668.4444" y="304" width="35.5556" height="112" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="512" y="464" width="35.5556" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="590.2222" y="464" width="35.5556" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="170.6667" y="240" font-size="85.3333" fill="var(--info-accent)" opacity="0.6" font-family="monospace">{</text>
  <text x="184.8889" y="336" font-size="22.7556" fill="var(--primary-accent)" opacity="0.7" font-family="monospace">class App</text>
  <text x="184.8889" y="376" font-size="22.7556" fill="var(--danger-accent)" opacity="0.7" font-family="monospace">  extends</text>
  <text x="184.8889" y="416" font-size="22.7556" fill="var(--primary-accent)" opacity="0.7" font-family="monospace">  Activity</text>
  <text x="170.6667" y="496" font-size="85.3333" fill="var(--info-accent)" opacity="0.6" font-family="monospace">}</text>
  <rect x="810.6667" y="160" width="213.3333" height="56" rx="6" fill="var(--info-fill)" opacity="0.3" stroke="var(--info-border)" stroke-width="2"/>
  <text x="917.3333" y="195.2" text-anchor="middle" font-size="17.0667" fill="var(--info-accent)">UI Layer</text>
  <rect x="810.6667" y="232" width="213.3333" height="56" rx="6" fill="var(--primary-fill)" opacity="0.3" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="917.3333" y="267.2" text-anchor="middle" font-size="17.0667" fill="var(--primary-accent)">ViewModel</text>
  <rect x="810.6667" y="304" width="213.3333" height="56" rx="6" fill="var(--danger-fill)" opacity="0.3" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="917.3333" y="339.2" text-anchor="middle" font-size="17.0667" fill="var(--danger-accent)">Repository</text>
  <rect x="810.6667" y="376" width="213.3333" height="56" rx="6" fill="var(--ok-fill)" opacity="0.3" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="917.3333" y="411.2" text-anchor="middle" font-size="17.0667" fill="var(--ok-accent)">Data Layer</text>
  <line x1="917.3333" y1="216" x2="917.3333" y2="232" stroke="var(--text-faint)" stroke-width="2" />
  <line x1="917.3333" y1="288" x2="917.3333" y2="304" stroke="var(--text-faint)" stroke-width="2" />
  <line x1="917.3333" y1="360" x2="917.3333" y2="376" stroke="var(--text-faint)" stroke-width="2" />
</svg>
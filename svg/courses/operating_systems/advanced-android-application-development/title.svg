<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="bg" x1="0" y1="0" x2="1.6" y2="1.8">
      <stop offset="0%" stop-color="#1a1a2e" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="url(#bg)" rx="6" x="40" y="40"/>
  <rect x="550" y="185" width="180" height="116" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="595" cy="228.5" r="8.3426" fill="var(--code-bg)" />
  <circle cx="685" cy="228.5" r="8.3426" fill="var(--code-bg)" />
  <line x1="587.5" y1="185" x2="565" y2="148.75" stroke="var(--ok-border)" stroke-width="2" stroke-linecap="round" />
  <line x1="692.5" y1="185" x2="715" y2="148.75" stroke="var(--ok-border)" stroke-width="2" stroke-linecap="round" />
  <rect x="550" y="308.25" width="180" height="145" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="497.5" y="315.5" width="37.5" height="101.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="744.9999" y="315.5" width="37.5" height="101.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="580" y="460.5" width="37.5" height="72.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="662.5" y="460.5" width="37.5" height="72.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220" y="257.5" font-size="83.4266" fill="var(--info-accent)" opacity="0.6" font-family="monospace">{</text>
  <text x="235" y="344.5" font-size="22.2471" fill="var(--primary-accent)" opacity="0.7" font-family="monospace">class App</text>
  <text x="235" y="380.75" font-size="22.2471" fill="var(--danger-accent)" opacity="0.7" font-family="monospace">  extends</text>
  <text x="235" y="417" font-size="22.2471" fill="var(--primary-accent)" opacity="0.7" font-family="monospace">  Activity</text>
  <text x="220" y="489.5" font-size="83.4266" fill="var(--info-accent)" opacity="0.6" font-family="monospace">}</text>
  <rect x="895" y="185" width="225" height="50.75" rx="6" fill="var(--info-fill)" opacity="0.3" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1007.4999" y="216.9" text-anchor="middle" font-size="16.6854" fill="var(--info-accent)">UI Layer</text>
  <rect x="895" y="250.25" width="225" height="50.75" rx="6" fill="var(--primary-fill)" opacity="0.3" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1007.4999" y="282.15" text-anchor="middle" font-size="16.6854" fill="var(--primary-accent)">ViewModel</text>
  <rect x="895" y="315.5" width="225" height="50.75" rx="6" fill="var(--danger-fill)" opacity="0.3" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1007.4999" y="347.4" text-anchor="middle" font-size="16.6854" fill="var(--danger-accent)">Repository</text>
  <rect x="895" y="380.75" width="225" height="50.75" rx="6" fill="var(--ok-fill)" opacity="0.3" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1007.4999" y="412.65" text-anchor="middle" font-size="16.6854" fill="var(--ok-accent)">Data Layer</text>
  <line x1="1007.4999" y1="235.75" x2="1007.4999" y2="250.25" stroke="var(--text-faint)" stroke-width="2" />
  <line x1="1007.4999" y1="301" x2="1007.4999" y2="315.5" stroke="var(--text-faint)" stroke-width="2" />
  <line x1="1007.4999" y1="366.25" x2="1007.4999" y2="380.75" stroke="var(--text-faint)" stroke-width="2" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="522.594" y="212.594" width="234.811" height="234.811" rx="14" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="3.6" filter="url(#shadow)"/>
  <text x="640" y="337.1509" font-family="Arial, sans-serif" font-size="23.4811" font-weight="bold" text-anchor="middle" fill="var(--bg)">Deployment Steps</text>
  <line x1="456.4164" y1="258.4917" x2="115.4752" y2="115.4752" stroke="var(--text-muted)" stroke-width="2" />
  <rect x="40" y="40" width="150.95" height="150.95" rx="14" fill="var(--primary-fill)" stroke="var(--ok-border)" stroke-width="2.4" filter="url(#shadow)"/>
  <text x="115.4752" y="108.3245" font-family="Arial, sans-serif" font-size="20.1268" font-weight="bold" text-anchor="middle" fill="var(--bg)">App</text>
  <text x="115.4752" y="129.7768" font-family="Arial, sans-serif" font-size="20.1268" font-weight="bold" text-anchor="middle" fill="var(--bg)">Bundle</text>
  <line x1="823.5836" y1="258.4917" x2="1164.5248" y2="115.4752" stroke="var(--text-muted)" stroke-width="2" />
  <rect x="1089.05" y="40" width="150.95" height="150.95" rx="14" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.4" filter="url(#shadow)"/>
  <text x="1164.5248" y="122.6261" font-family="Arial, sans-serif" font-size="20.1268" font-weight="bold" text-anchor="middle" fill="var(--bg)">Signing</text>
  <line x1="456.4164" y1="401.5083" x2="115.4752" y2="544.5248" stroke="var(--text-muted)" stroke-width="2" />
  <rect x="40" y="469.05" width="150.95" height="150.95" rx="14" fill="var(--info-fill)" stroke="var(--danger-border)" stroke-width="2.4" filter="url(#shadow)"/>
  <text x="115.4752" y="537.3739" font-family="Arial, sans-serif" font-size="20.1268" font-weight="bold" text-anchor="middle" fill="var(--bg)">Play</text>
  <text x="115.4752" y="558.8264" font-family="Arial, sans-serif" font-size="20.1268" font-weight="bold" text-anchor="middle" fill="var(--bg)">Console</text>
  <line x1="823.5836" y1="401.5083" x2="1164.5248" y2="544.5248" stroke="var(--text-muted)" stroke-width="2" />
  <rect x="1089.05" y="469.05" width="150.95" height="150.95" rx="14" fill="var(--danger-fill)" stroke="var(--warn-border)" stroke-width="2.4" filter="url(#shadow)"/>
  <text x="1164.5248" y="551.6755" font-family="Arial, sans-serif" font-size="20.1268" font-weight="bold" text-anchor="middle" fill="var(--bg)">Monitoring</text>
</svg>
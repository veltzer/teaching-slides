<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <text x="634.871795" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.30754" font-weight="bold" fill="var(--text)">Deployment overview — from source commit to Play Store release</text>

  <!-- Horizontal pipeline: 5 stages across the middle -->
  <rect x="40" y="215.09434" width="205.128205" height="120.377358" rx="8.475469" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="142.564103" y="264.339623" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.188673" font-weight="bold" fill="var(--ok-text)">Build</text>
  <text x="142.564103" y="297.169811" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.772637" fill="var(--ok-text)">Gradle + R8 shrink</text>
  <text x="142.564103" y="319.056604" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.772637" fill="var(--ok-text)">generate AAB</text>

  <line x1="245.128205" y1="275.283019" x2="278.974359" y2="275.283019" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="286.153846" y="215.09434" width="205.128205" height="120.377358" rx="8.475469" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="388.717949" y="264.339623" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.188673" font-weight="bold" fill="var(--primary-text)">Test</text>
  <text x="388.717949" y="297.169811" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.772637" fill="var(--primary-text)">unit + instrumentation</text>
  <text x="388.717949" y="319.056604" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.772637" fill="var(--primary-text)">Firebase Test Lab</text>

  <line x1="491.282051" y1="275.283019" x2="525.128205" y2="275.283019" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="532.307692" y="215.09434" width="205.128205" height="120.377358" rx="8.475469" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="634.871795" y="264.339623" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.188673" font-weight="bold" fill="var(--warn-text)">Sign</text>
  <text x="634.871795" y="297.169811" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.772637" fill="var(--warn-text)">release keystore</text>
  <text x="634.871795" y="319.056604" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.772637" fill="var(--warn-text)">Play App Signing</text>

  <line x1="737.435897" y1="275.283019" x2="771.282051" y2="275.283019" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="778.461538" y="215.09434" width="205.128205" height="120.377358" rx="8.475469" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="881.025641" y="264.339623" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.188673" font-weight="bold" fill="var(--info-text)">Upload</text>
  <text x="881.025641" y="297.169811" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.772637" fill="var(--info-text)">Play Console API</text>
  <text x="881.025641" y="319.056604" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.772637" fill="var(--info-text)">internal / closed track</text>

  <line x1="983.589744" y1="275.283019" x2="1017.435897" y2="275.283019" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1024.615385" y="215.09434" width="205.128205" height="120.377358" rx="8.475469" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1127.179487" y="264.339623" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.188673" font-weight="bold" fill="var(--danger-text)">Release</text>
  <text x="1127.179487" y="297.169811" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.772637" fill="var(--danger-text)">staged rollout</text>
  <text x="1127.179487" y="319.056604" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.772637" fill="var(--danger-text)">monitor crashes</text>

  <!-- Top panel: inputs -->
  <rect x="40" y="72.830189" width="1189.74359" height="109.433962" rx="8.475469" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="634.871795" y="105.660377" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.950938" font-weight="bold" fill="var(--text)">Inputs</text>
  <text x="183.589744" y="143.962264" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.772637" fill="var(--text-muted)">source + version code</text>
  <text x="429.74359" y="143.962264" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.772637" fill="var(--text-muted)">ProGuard rules</text>
  <text x="675.897436" y="143.962264" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.772637" fill="var(--text-muted)">signing config / secrets</text>
  <text x="922.051282" y="143.962264" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.772637" fill="var(--text-muted)">listing + screenshots</text>
  <text x="1127.179487" y="143.962264" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.772637" fill="var(--text-muted)">rollout policy</text>

  <!-- Bottom panel: outputs / monitoring -->
  <rect x="40" y="379.245283" width="1189.74359" height="240.754717" rx="8.475469" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="634.871795" y="412.075472" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.950938" font-weight="bold" fill="var(--text)">Post-release monitoring</text>

  <rect x="81.025641" y="433.962264" width="266.666667" height="164.150943" rx="6.356602" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="214.358974" y="466.792453" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.832071" font-weight="bold" fill="var(--danger-accent)">Crashlytics</text>
  <text x="214.358974" y="499.622642" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.713204" fill="var(--text-muted)">crash-free users</text>
  <text x="214.358974" y="521.509434" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.713204" fill="var(--text-muted)">exception stack traces</text>
  <text x="214.358974" y="543.396226" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.713204" fill="var(--text-muted)">velocity alerts</text>

  <rect x="378.461538" y="433.962264" width="266.666667" height="164.150943" rx="6.356602" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="511.794872" y="466.792453" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.832071" font-weight="bold" fill="var(--primary-accent)">Play Console vitals</text>
  <text x="511.794872" y="499.622642" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.713204" fill="var(--text-muted)">ANR rate, slow start</text>
  <text x="511.794872" y="521.509434" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.713204" fill="var(--text-muted)">battery, permissions</text>
  <text x="511.794872" y="543.396226" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.713204" fill="var(--text-muted)">bad-behaviour thresholds</text>

  <rect x="675.897436" y="433.962264" width="266.666667" height="164.150943" rx="6.356602" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="809.230769" y="466.792453" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.832071" font-weight="bold" fill="var(--ok-accent)">Analytics</text>
  <text x="809.230769" y="499.622642" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.713204" fill="var(--text-muted)">install / uninstall</text>
  <text x="809.230769" y="521.509434" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.713204" fill="var(--text-muted)">feature adoption</text>
  <text x="809.230769" y="543.396226" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.713204" fill="var(--text-muted)">funnel conversion</text>

  <rect x="973.333333" y="433.962264" width="266.666667" height="164.150943" rx="6.356602" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="1106.666667" y="466.792453" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.832071" font-weight="bold" fill="var(--warn-accent)">Rollback plan</text>
  <text x="1106.666667" y="499.622642" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.713204" fill="var(--text-muted)">halt staged rollout</text>
  <text x="1106.666667" y="521.509434" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.713204" fill="var(--text-muted)">ship hotfix build</text>
  <text x="1106.666667" y="543.396226" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.713204" fill="var(--text-muted)">remote config kill-switch</text>
</svg>

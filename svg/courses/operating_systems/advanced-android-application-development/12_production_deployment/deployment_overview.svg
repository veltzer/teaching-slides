<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <!-- Horizontal pipeline: 5 stages across the middle -->
  <rect x="40" y="190.8000001484" width="205.128205" height="127.5999995548" rx="8.726029412098" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="142.564103" y="243.000000159" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.815074045026" font-weight="bold" fill="var(--ok-text)">Build</text>
  <text x="142.564103" y="277.7999994594" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.179797665963" fill="var(--ok-text)">Gradle + R8 shrink</text>
  <text x="142.564103" y="301.000000053" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.179797665963" fill="var(--ok-text)">generate AAB</text>

  <line x1="245.128205" y1="254.5999999258" x2="278.974359" y2="254.5999999258" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="286.153846" y="190.8000001484" width="205.128205" height="127.5999995548" rx="8.726029412098" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="388.717949" y="243.000000159" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.815074045026" font-weight="bold" fill="var(--primary-text)">Test</text>
  <text x="388.717949" y="277.7999994594" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.179797665963" fill="var(--primary-text)">unit + instrumentation</text>
  <text x="388.717949" y="301.000000053" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.179797665963" fill="var(--primary-text)">Firebase Test Lab</text>

  <line x1="491.282051" y1="254.5999999258" x2="525.128205" y2="254.5999999258" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="532.307692" y="190.8000001484" width="205.128205" height="127.5999995548" rx="8.726029412098" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="634.871795" y="243.000000159" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.815074045026" font-weight="bold" fill="var(--warn-text)">Sign</text>
  <text x="634.871795" y="277.7999994594" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.179797665963" fill="var(--warn-text)">release keystore</text>
  <text x="634.871795" y="301.000000053" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.179797665963" fill="var(--warn-text)">Play App Signing</text>

  <line x1="737.435897" y1="254.5999999258" x2="771.282051" y2="254.5999999258" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="778.461538" y="190.8000001484" width="205.128205" height="127.5999995548" rx="8.726029412098" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="881.025641" y="243.000000159" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.815074045026" font-weight="bold" fill="var(--info-text)">Upload</text>
  <text x="881.025641" y="277.7999994594" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.179797665963" fill="var(--info-text)">Play Console API</text>
  <text x="881.025641" y="301.000000053" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.179797665963" fill="var(--info-text)">internal / closed track</text>

  <line x1="983.589744" y1="254.5999999258" x2="1017.435897" y2="254.5999999258" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="1024.615385" y="190.8000001484" width="205.128205" height="127.5999995548" rx="8.726029412098" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1127.179487" y="243.000000159" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.815074045026" font-weight="bold" fill="var(--danger-text)">Release</text>
  <text x="1127.179487" y="277.7999994594" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.179797665963" fill="var(--danger-text)">staged rollout</text>
  <text x="1127.179487" y="301.000000053" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.179797665963" fill="var(--danger-text)">monitor crashes</text>

  <!-- Top panel: inputs -->
  <rect x="40" y="40" width="1189.74359" height="115.999999788" rx="8.726029412098" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="634.871795" y="74.7999993004" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.452058824195" font-weight="bold" fill="var(--text)">Inputs</text>
  <text x="183.589744" y="115.3999995442" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.179797665963" fill="var(--text-muted)">source + version code</text>
  <text x="429.74359" y="115.3999995442" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.179797665963" fill="var(--text-muted)">ProGuard rules</text>
  <text x="675.897436" y="115.3999995442" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.179797665963" fill="var(--text-muted)">signing config / secrets</text>
  <text x="922.051282" y="115.3999995442" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.179797665963" fill="var(--text-muted)">listing + screenshots</text>
  <text x="1127.179487" y="115.3999995442" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.179797665963" fill="var(--text-muted)">rollout policy</text>

  <!-- Bottom panel: outputs / monitoring -->
  <rect x="40" y="364.7999998304" width="1189.74359" height="255.2000001696" rx="8.726029412098" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="634.871795" y="399.6000001908" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.452058824195" font-weight="bold" fill="var(--text)">Post-release monitoring</text>

  <rect x="81.025641" y="422.7999997244" width="266.666667" height="173.999999682" rx="6.544522316464" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="214.358974" y="457.6000000848" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.270551728562" font-weight="bold" fill="var(--danger-accent)">Crashlytics</text>
  <text x="214.358974" y="492.4000004452" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.089044632928" fill="var(--text-muted)">crash-free users</text>
  <text x="214.358974" y="515.5999999788" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.089044632928" fill="var(--text-muted)">exception stack traces</text>
  <text x="214.358974" y="538.7999995124" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.089044632928" fill="var(--text-muted)">velocity alerts</text>

  <rect x="378.461538" y="422.7999997244" width="266.666667" height="173.999999682" rx="6.544522316464" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="511.794872" y="457.6000000848" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.270551728562" font-weight="bold" fill="var(--primary-accent)">Play Console vitals</text>
  <text x="511.794872" y="492.4000004452" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.089044632928" fill="var(--text-muted)">ANR rate, slow start</text>
  <text x="511.794872" y="515.5999999788" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.089044632928" fill="var(--text-muted)">battery, permissions</text>
  <text x="511.794872" y="538.7999995124" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.089044632928" fill="var(--text-muted)">bad-behaviour thresholds</text>

  <rect x="675.897436" y="422.7999997244" width="266.666667" height="173.999999682" rx="6.544522316464" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="809.230769" y="457.6000000848" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.270551728562" font-weight="bold" fill="var(--ok-accent)">Analytics</text>
  <text x="809.230769" y="492.4000004452" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.089044632928" fill="var(--text-muted)">install / uninstall</text>
  <text x="809.230769" y="515.5999999788" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.089044632928" fill="var(--text-muted)">feature adoption</text>
  <text x="809.230769" y="538.7999995124" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.089044632928" fill="var(--text-muted)">funnel conversion</text>

  <rect x="973.333333" y="422.7999997244" width="266.666667" height="173.999999682" rx="6.544522316464" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="1106.666667" y="457.6000000848" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.270551728562" font-weight="bold" fill="var(--warn-accent)">Rollback plan</text>
  <text x="1106.666667" y="492.4000004452" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.089044632928" fill="var(--text-muted)">halt staged rollout</text>
  <text x="1106.666667" y="515.5999999788" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.089044632928" fill="var(--text-muted)">ship hotfix build</text>
  <text x="1106.666667" y="538.7999995124" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.089044632928" fill="var(--text-muted)">remote config kill-switch</text>
</svg>

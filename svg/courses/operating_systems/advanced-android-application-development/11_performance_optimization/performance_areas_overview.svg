<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="390" height="180.566037735849" rx="8.368855109814" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="78.301886792453" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.829923997081" font-weight="bold" fill="var(--primary-text)">Startup</text>
  <text x="235" y="116.603773584905" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.599389553447" fill="var(--primary-text)">Cold/warm/hot</text>
  <text x="235" y="149.433962264151" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.599389553447" fill="var(--primary-text)">Baseline Profiles</text>
  <text x="235" y="182.264150943396" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.599389553447" fill="var(--primary-text)">Splash API</text>

  <rect x="445" y="40" width="390" height="180.566037735849" rx="8.368855109814" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="78.301886792453" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.829923997081" font-weight="bold" fill="var(--ok-text)">Rendering</text>
  <text x="640" y="116.603773584905" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.599389553447" fill="var(--ok-text)">60/90/120 fps</text>
  <text x="640" y="149.433962264151" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.599389553447" fill="var(--ok-text)">Avoid overdraw</text>
  <text x="640" y="182.264150943396" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.599389553447" fill="var(--ok-text)">Compose keys</text>

  <rect x="850" y="40" width="390" height="180.566037735849" rx="8.368855109814" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="78.301886792453" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.829923997081" font-weight="bold" fill="var(--warn-text)">Memory</text>
  <text x="1045" y="116.603773584905" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.599389553447" fill="var(--warn-text)">LeakCanary</text>
  <text x="1045" y="149.433962264151" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.599389553447" fill="var(--warn-text)">Right-size bitmaps</text>
  <text x="1045" y="182.264150943396" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.599389553447" fill="var(--warn-text)">Release on Stop</text>

  <rect x="40" y="242.452830188679" width="390" height="180.566037735849" rx="8.368855109814" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="280.754716981132" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.829923997081" font-weight="bold" fill="var(--danger-text)">Battery</text>
  <text x="235" y="319.056603773585" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.599389553447" fill="var(--danger-text)">Doze, buckets</text>
  <text x="235" y="351.88679245283" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.599389553447" fill="var(--danger-text)">WorkManager</text>
  <text x="235" y="384.716981132075" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.599389553447" fill="var(--danger-text)">Coalesce syncs</text>

  <rect x="445" y="242.452830188679" width="390" height="180.566037735849" rx="8.368855109814" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="280.754716981132" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.829923997081" font-weight="bold" fill="var(--info-text)">Network / I/O</text>
  <text x="640" y="319.056603773585" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.599389553447" fill="var(--info-text)">Cache, paginate</text>
  <text x="640" y="351.88679245283" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.599389553447" fill="var(--info-text)">HTTP/2, gRPC</text>
  <text x="640" y="384.716981132075" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.599389553447" fill="var(--info-text)">Retry w/ jitter</text>

  <rect x="850" y="242.452830188679" width="390" height="180.566037735849" rx="8.368855109814" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="280.754716981132" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.829923997081" font-weight="bold" fill="var(--primary-text)">App Size</text>
  <text x="1045" y="319.056603773585" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.599389553447" fill="var(--primary-text)">App Bundles</text>
  <text x="1045" y="351.88679245283" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.599389553447" fill="var(--primary-text)">R8 shrink</text>
  <text x="1045" y="384.716981132075" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.599389553447" fill="var(--primary-text)">Vector drawables</text>

  <!-- Workflow -->
  <text x="640" y="472.264150943396" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.829923997081" font-weight="bold" fill="var(--text)">Workflow</text>

  <rect x="70" y="499.622641509434" width="250" height="87.547169811321" rx="6.27664133236" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="195" y="552.150943396226" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.737710219627" font-weight="bold" fill="var(--ok-text)">Measure</text>

  <rect x="360" y="499.622641509434" width="250" height="87.547169811321" rx="6.27664133236" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485" y="552.150943396226" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.737710219627" font-weight="bold" fill="var(--primary-text)">Analyze</text>

  <rect x="650" y="499.622641509434" width="250" height="87.547169811321" rx="6.27664133236" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="775" y="552.150943396226" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.737710219627" font-weight="bold" fill="var(--warn-text)">Optimize</text>

  <rect x="940" y="499.622641509434" width="265" height="87.547169811321" rx="6.27664133236" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1072" y="552.150943396226" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.737710219627" font-weight="bold" fill="var(--info-text)">Verify</text>

  <line x1="320" y1="543.396226415094" x2="360" y2="543.396226415094" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="610" y1="543.396226415094" x2="650" y2="543.396226415094" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="900" y1="543.396226415094" x2="940" y2="543.396226415094" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.599389553447" fill="var(--text-muted)">Tools: Profiler, Perfetto, Macrobenchmark</text>
</svg>

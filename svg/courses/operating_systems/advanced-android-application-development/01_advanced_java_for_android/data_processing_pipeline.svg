<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <rect x="40" y="40" width="260" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="170" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--primary-text)">Source</text>
  <text x="170" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">list.stream()</text>
  <text x="170" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Collection</text>
  <text x="170" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Array</text>
  <text x="170" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Generator</text>
  <text x="170" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Produces a stream</text>
  <text x="170" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">of elements.</text>
  <text x="170" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="var(--primary-text)">1</text>

  <line x1="305" y1="330" x2="365" y2="330" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="370" y="40" width="300" height="580" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="520" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--info-text)">Intermediate</text>
  <text x="520" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">filter()</text>
  <text x="520" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">map()</text>
  <text x="520" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">sorted()</text>
  <text x="520" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">distinct()</text>
  <text x="520" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">limit()</text>
  <text x="520" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Lazy. Each call returns</text>
  <text x="520" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">a new stream without</text>
  <text x="520" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">running any work yet.</text>
  <text x="520" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="var(--info-text)">2</text>

  <line x1="675" y1="330" x2="735" y2="330" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="740" y="40" width="260" height="580" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="870" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--warn-text)">Terminal</text>
  <text x="870" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">collect()</text>
  <text x="870" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">reduce()</text>
  <text x="870" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">count()</text>
  <text x="870" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">forEach()</text>
  <text x="870" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Triggers execution.</text>
  <text x="870" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Consumes the stream</text>
  <text x="870" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">exactly once.</text>
  <text x="870" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="var(--warn-text)">3</text>

  <line x1="1005" y1="330" x2="1065" y2="330" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1070" y="40" width="170" height="580" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1155" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Result</text>
  <text x="1155" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">List</text>
  <text x="1155" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Map</text>
  <text x="1155" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Sum</text>
  <text x="1155" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Side effect</text>
  <text x="1155" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">Final value</text>
  <text x="1155" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">you can use.</text>
  <text x="1155" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="var(--ok-text)">4</text>
</svg>

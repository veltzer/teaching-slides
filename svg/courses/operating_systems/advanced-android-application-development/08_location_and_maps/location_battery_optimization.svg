<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="595" height="290" rx="10.363754503432" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="337" y="77.592592592592" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758106177" font-weight="bold" fill="var(--text)">Priority vs drain</text>

  <rect x="70" y="104.444444444444" width="535" height="37.592592592592" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="85" y="129.148148148148" font-family="Arial, sans-serif" font-size="14.509256304804" font-weight="bold" fill="var(--danger-text)">HIGH_ACCURACY</text>
  <text x="595" y="129.148148148148" text-anchor="end" font-family="Arial, sans-serif" font-size="13.472880854461" fill="var(--danger-text)">GPS+WiFi+cell</text>

  <rect x="70" y="152.777777777778" width="420" height="37.592592592592" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="85" y="177.481481481481" font-family="Arial, sans-serif" font-size="14.509256304804" font-weight="bold" fill="var(--warn-text)">BALANCED</text>
  <text x="480" y="177.481481481481" text-anchor="end" font-family="Arial, sans-serif" font-size="13.472880854461" fill="var(--warn-text)">~100 m</text>

  <rect x="70" y="201.111111111111" width="280" height="37.592592592592" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="85" y="225.814814814815" font-family="Arial, sans-serif" font-size="14.509256304804" font-weight="bold" fill="var(--primary-text)">LOW_POWER</text>
  <text x="340" y="225.814814814815" text-anchor="end" font-family="Arial, sans-serif" font-size="13.472880854461" fill="var(--primary-text)">~10 km</text>

  <rect x="70" y="249.444444444445" width="160" height="37.592592592592" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="85" y="274.148148148147" font-family="Arial, sans-serif" font-size="14.509256304804" font-weight="bold" fill="var(--ok-text)">PASSIVE</text>

  <text x="337" y="313.888888888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854461" fill="var(--text-faint)">Longer bar: more accurate, more drain</text>

  <rect x="655" y="40" width="585" height="290" rx="10.363754503432" fill="var(--surface)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="947" y="77.592592592592" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758106177" font-weight="bold" fill="var(--primary-accent)">Tactics</text>
  <text x="680" y="118.407407407407" font-family="Arial, sans-serif" font-size="14.509256304804" fill="var(--text)">Pick weakest priority</text>
  <text x="680" y="150.629629629629" font-family="Arial, sans-serif" font-size="14.509256304804" fill="var(--text)">Larger interval</text>
  <text x="680" y="182.851851851852" font-family="Arial, sans-serif" font-size="14.509256304804" fill="var(--text)">Stop when backgrounded</text>
  <text x="680" y="215.074074074074" font-family="Arial, sans-serif" font-size="14.509256304804" fill="var(--text)">Use geofencing</text>
  <text x="680" y="247.296296296296" font-family="Arial, sans-serif" font-size="14.509256304804" fill="var(--text)">Batch with WorkManager</text>
  <text x="680" y="279.518518518518" font-family="Arial, sans-serif" font-size="14.509256304804" fill="var(--text)">Cache last-known</text>

  <rect x="40" y="356.851851851852" width="390" height="171.851851851852" rx="10.363754503432" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="394.444444444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.618382655834" font-weight="bold" fill="var(--ok-text)">Fused Provider</text>
  <text x="235" y="426.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854461" fill="var(--ok-text)">Fuses GPS/WiFi/cell</text>
  <text x="235" y="453.518518518518" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854461" fill="var(--ok-text)">Respects Doze</text>
  <text x="235" y="487.888888888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854461" fill="var(--ok-text)">Default</text>

  <rect x="445" y="356.851851851852" width="390" height="171.851851851852" rx="10.363754503432" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="394.444444444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.618382655834" font-weight="bold" fill="var(--info-text)">Geofence</text>
  <text x="640" y="426.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854461" fill="var(--info-text)">Callback on enter/exit</text>
  <text x="640" y="453.518518518518" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854461" fill="var(--info-text)">No polling</text>

  <rect x="850" y="356.851851851852" width="390" height="171.851851851852" rx="10.363754503432" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="394.444444444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.618382655834" font-weight="bold" fill="var(--warn-text)">Activity Recognition</text>
  <text x="1045" y="426.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854461" fill="var(--warn-text)">Still / walk / drive</text>
  <text x="1045" y="453.518518518518" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854461" fill="var(--warn-text)">Skip GPS when still</text>

  <rect x="40" y="560.925925925926" width="1200" height="59.074074074074" rx="10.363754503432" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="598.518518518519" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545631755148" font-weight="bold" fill="var(--primary-text)">Ask for the least, as rarely as you can</text>
</svg>

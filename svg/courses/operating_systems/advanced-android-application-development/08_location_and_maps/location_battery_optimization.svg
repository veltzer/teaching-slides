<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.668233" font-weight="bold" fill="var(--text)">Location Battery Optimization</text>

  <!-- Accuracy vs drain axis -->
  <rect x="40" y="81.801802" width="595" height="271.711712" rx="8.178196" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="337" y="118.378378" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.40094" font-weight="bold" fill="var(--text)">Priority vs battery cost</text>

  <rect x="70" y="144.504505" width="535" height="35.531532" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="85" y="168.540541" font-family="Arial, sans-serif" font-size="14.311842" font-weight="bold" fill="var(--danger-text)">HIGH_ACCURACY</text>
  <text x="595" y="168.540541" text-anchor="end" font-family="Arial, sans-serif" font-size="13.289568" fill="var(--danger-text)">GPS + WiFi + cell — highest drain</text>

  <rect x="70" y="190.486486" width="420" height="35.531532" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="85" y="214.522523" font-family="Arial, sans-serif" font-size="14.311842" font-weight="bold" fill="var(--warn-text)">BALANCED_POWER</text>
  <text x="480" y="214.522523" text-anchor="end" font-family="Arial, sans-serif" font-size="13.289568" fill="var(--warn-text)">~100 m, WiFi + cell</text>

  <rect x="70" y="236.468468" width="280" height="35.531532" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="85" y="260.504505" font-family="Arial, sans-serif" font-size="14.311842" font-weight="bold" fill="var(--primary-text)">LOW_POWER</text>
  <text x="340" y="260.504505" text-anchor="end" font-family="Arial, sans-serif" font-size="13.289568" fill="var(--primary-text)">~10 km, cell only</text>

  <rect x="70" y="282.45045" width="160" height="35.531532" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="85" y="306.486486" font-family="Arial, sans-serif" font-size="14.311842" font-weight="bold" fill="var(--ok-text)">PASSIVE</text>
  <text x="220" y="306.486486" text-anchor="end" font-family="Arial, sans-serif" font-size="13.289568" fill="var(--ok-text)">piggyback</text>

  <text x="337" y="343.063063" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.267293" fill="var(--text-faint)">Longer bar = more accurate = more battery</text>

  <!-- Tactics -->
  <rect x="655" y="81.801802" width="585" height="271.711712" rx="8.178196" fill="var(--surface)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="947" y="118.378378" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.40094" font-weight="bold" fill="var(--primary-accent)">Tactics that cut drain</text>
  <text x="680" y="154.954955" font-family="Arial, sans-serif" font-size="14.311842" fill="var(--text)">• Pick the weakest priority that works</text>
  <text x="680" y="186.306306" font-family="Arial, sans-serif" font-size="14.311842" fill="var(--text)">• Raise interval and smallestDisplacement</text>
  <text x="680" y="217.657658" font-family="Arial, sans-serif" font-size="14.311842" fill="var(--text)">• Stop updates when Activity is in background</text>
  <text x="680" y="249.009009" font-family="Arial, sans-serif" font-size="14.311842" fill="var(--text)">• Use geofencing and activity recognition</text>
  <text x="680" y="280.36036" font-family="Arial, sans-serif" font-size="14.311842" fill="var(--text)">• Batch passive updates with WorkManager</text>
  <text x="680" y="311.711712" font-family="Arial, sans-serif" font-size="14.311842" fill="var(--text)">• Cache last-known location for instant UI</text>

  <!-- APIs row -->
  <rect x="40" y="384.864865" width="390" height="156.756757" rx="8.178196" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="421.441441" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.356391" font-weight="bold" fill="var(--ok-text)">FusedLocationProvider</text>
  <text x="235" y="452.792793" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289568" fill="var(--ok-text)">System fuses GPS/WiFi/cell</text>
  <text x="235" y="478.918919" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289568" fill="var(--ok-text)">Respects Doze and battery</text>
  <text x="235" y="510.27027" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289568" fill="var(--ok-text)">Default for most apps</text>

  <rect x="445" y="384.864865" width="390" height="156.756757" rx="8.178196" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="421.441441" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.356391" font-weight="bold" fill="var(--info-text)">Geofence API</text>
  <text x="640" y="452.792793" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289568" fill="var(--info-text)">Callback only on enter/exit</text>
  <text x="640" y="478.918919" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289568" fill="var(--info-text)">No polling needed</text>
  <text x="640" y="510.27027" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289568" fill="var(--info-text)">Great for zone triggers</text>

  <rect x="850" y="384.864865" width="390" height="156.756757" rx="8.178196" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="421.441441" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.356391" font-weight="bold" fill="var(--warn-text)">Activity Recognition</text>
  <text x="1045" y="452.792793" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289568" fill="var(--warn-text)">Still, walk, drive</text>
  <text x="1045" y="478.918919" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289568" fill="var(--warn-text)">Skip GPS while stationary</text>
  <text x="1045" y="510.27027" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289568" fill="var(--warn-text)">Adapt interval to motion</text>

  <!-- Rule of thumb -->
  <rect x="40" y="572.972973" width="1200" height="47.027027" rx="8.178196" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="604.324324" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.334117" font-weight="bold" fill="var(--primary-text)">Rule: every location fix is battery — ask for the least you can, as rarely as you can.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.227078547234" font-weight="bold" fill="var(--text)">Location Battery Optimization</text>

  <rect x="40" y="70.526315789474" width="595" height="274.736842105263" rx="10.087337902782" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="337" y="106.140350877193" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208225008" font-weight="bold" fill="var(--text)">Priority vs drain</text>

  <rect x="70" y="131.578947368421" width="535" height="35.614035087719" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="85" y="154.982456140351" font-family="Arial, sans-serif" font-size="14.122273063895" font-weight="bold" fill="var(--danger-text)">HIGH_ACCURACY</text>
  <text x="595" y="154.982456140351" text-anchor="end" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--danger-text)">GPS+WiFi+cell</text>

  <rect x="70" y="177.368421052632" width="420" height="35.614035087719" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="85" y="200.771929824561" font-family="Arial, sans-serif" font-size="14.122273063895" font-weight="bold" fill="var(--warn-text)">BALANCED</text>
  <text x="480" y="200.771929824561" text-anchor="end" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--warn-text)">~100 m</text>

  <rect x="70" y="223.157894736842" width="280" height="35.614035087719" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="85" y="246.561403508772" font-family="Arial, sans-serif" font-size="14.122273063895" font-weight="bold" fill="var(--primary-text)">LOW_POWER</text>
  <text x="340" y="246.561403508772" text-anchor="end" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--primary-text)">~10 km</text>

  <rect x="70" y="268.947368421053" width="160" height="35.614035087719" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="85" y="292.350877192982" font-family="Arial, sans-serif" font-size="14.122273063895" font-weight="bold" fill="var(--ok-text)">PASSIVE</text>

  <text x="337" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--text-faint)">Longer bar: more accurate, more drain</text>

  <rect x="655" y="70.526315789474" width="585" height="274.736842105263" rx="10.087337902782" fill="var(--surface)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="947" y="106.140350877193" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208225008" font-weight="bold" fill="var(--primary-accent)">Tactics</text>
  <text x="680" y="144.80701754386" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--text)">Pick weakest priority</text>
  <text x="680" y="175.333333333333" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--text)">Larger interval</text>
  <text x="680" y="205.859649122807" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--text)">Stop when backgrounded</text>
  <text x="680" y="236.385964912281" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--text)">Use geofencing</text>
  <text x="680" y="266.912280701754" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--text)">Batch with WorkManager</text>
  <text x="680" y="297.438596491228" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--text)">Cache last-known</text>

  <rect x="40" y="370.701754385965" width="390" height="162.80701754386" rx="10.087337902782" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="406.315789473684" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.14847443473" font-weight="bold" fill="var(--ok-text)">Fused Provider</text>
  <text x="235" y="436.842105263158" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--ok-text)">Fuses GPS/WiFi/cell</text>
  <text x="235" y="462.280701754386" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--ok-text)">Respects Doze</text>
  <text x="235" y="494.842105263158" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--ok-text)">Default</text>

  <rect x="445" y="370.701754385965" width="390" height="162.80701754386" rx="10.087337902782" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="406.315789473684" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.14847443473" font-weight="bold" fill="var(--info-text)">Geofence</text>
  <text x="640" y="436.842105263158" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--info-text)">Callback on enter/exit</text>
  <text x="640" y="462.280701754386" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--info-text)">No polling</text>

  <rect x="850" y="370.701754385965" width="390" height="162.80701754386" rx="10.087337902782" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="406.315789473684" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.14847443473" font-weight="bold" fill="var(--warn-text)">Activity Recognition</text>
  <text x="1045" y="436.842105263158" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--warn-text)">Still / walk / drive</text>
  <text x="1045" y="462.280701754386" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--warn-text)">Skip GPS when still</text>

  <rect x="40" y="564.035087719298" width="1200" height="55.964912280702" rx="10.087337902782" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="599.649122807018" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131006854174" font-weight="bold" fill="var(--primary-text)">Ask for the least, as rarely as you can</text>
</svg>

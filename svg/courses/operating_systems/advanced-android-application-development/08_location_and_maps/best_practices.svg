<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="522.594" y="212.594" width="234.811" height="234.811" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="3.6" filter="url(#shadow)"/>
  <text x="640" y="337.1509" font-family="Arial, sans-serif" font-size="23.4811" font-weight="bold" text-anchor="middle" fill="var(--bg)">Map Features</text>
  <line x1="456.4164" y1="258.4917" x2="115.4752" y2="115.4752" stroke="var(--text-muted)" stroke-width="2" />
  <rect x="40" y="40" width="150.95" height="150.95" rx="14" fill="url(#grad-primary)" stroke="var(--ok-border)" stroke-width="2.4" filter="url(#shadow)"/>
  <text x="115.4752" y="122.6261" font-family="Arial, sans-serif" font-size="20.1268" font-weight="bold" text-anchor="middle" fill="var(--bg)">Markers</text>
  <line x1="823.5836" y1="258.4917" x2="1164.5248" y2="115.4752" stroke="var(--text-muted)" stroke-width="2" />
  <rect x="1089.05" y="40" width="150.95" height="150.95" rx="14" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2.4" filter="url(#shadow)"/>
  <text x="1164.5248" y="122.6261" font-family="Arial, sans-serif" font-size="20.1268" font-weight="bold" text-anchor="middle" fill="var(--bg)">Overlays</text>
  <line x1="456.4164" y1="401.5083" x2="115.4752" y2="544.5248" stroke="var(--text-muted)" stroke-width="2" />
  <rect x="40" y="469.05" width="150.95" height="150.95" rx="14" fill="url(#grad-info)" stroke="var(--danger-border)" stroke-width="2.4" filter="url(#shadow)"/>
  <text x="115.4752" y="551.6755" font-family="Arial, sans-serif" font-size="20.1268" font-weight="bold" text-anchor="middle" fill="var(--bg)">Routes</text>
  <line x1="823.5836" y1="401.5083" x2="1164.5248" y2="544.5248" stroke="var(--text-muted)" stroke-width="2" />
  <rect x="1089.05" y="469.05" width="150.95" height="150.95" rx="14" fill="url(#grad-danger)" stroke="var(--warn-border)" stroke-width="2.4" filter="url(#shadow)"/>
  <text x="1164.5248" y="551.6755" font-family="Arial, sans-serif" font-size="20.1268" font-weight="bold" text-anchor="middle" fill="var(--bg)">Gestures</text>
</svg>
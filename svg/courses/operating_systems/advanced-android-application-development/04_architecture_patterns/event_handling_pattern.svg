<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="218.4615" width="181.132" height="223.0769" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="130.5659" y="352.3077" text-anchor="middle" font-size="34.2532" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">View</text>
  <rect x="379.6227" y="218.4615" width="226.4151" height="223.0769" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="492.8302" y="352.3077" text-anchor="middle" font-size="34.2532" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">ViewModel</text>
  <rect x="764.5283" y="218.4615" width="181.132" height="223.0769" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="855.0944" y="352.3077" text-anchor="middle" font-size="34.2532" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">UseCase</text>
  <rect x="1058.868" y="218.4615" width="181.132" height="223.0769" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1149.4341" y="352.3077" text-anchor="middle" font-size="34.2532" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">View</text>
  <line x1="221.132" y1="329.9999" x2="379.6227" y2="329.9999" stroke="var(--primary-border)" stroke-width="0.6584" marker-end="url(#arrow)"/>
  <text x="300.3773" y="307.6923" text-anchor="middle" font-size="26.9133" fill="var(--primary-accent)" font-family="Arial, sans-serif">Event</text>
  <line x1="606.0378" y1="329.9999" x2="764.5283" y2="329.9999" stroke="var(--danger-border)" stroke-width="0.6584" marker-end="url(#arrow)"/>
  <text x="685.2831" y="307.6923" text-anchor="middle" font-size="26.9133" fill="var(--danger-accent)" font-family="Arial, sans-serif">Command</text>
  <path d="M 855.0944 441.5385 Q 855.0944 553.077 492.8302 553.077 Q 492.8302 508.4616 492.8302 441.5385" stroke="var(--ok-border)" stroke-width="0.7803" fill="none" marker-end="url(#arrow)"/>
  <text x="673.9622" y="620" text-anchor="middle" font-size="26.9133" fill="var(--ok-accent)" font-family="Arial, sans-serif">Result</text>
  <path d="M 492.8302 218.4615 Q 492.8302 62.3076 1149.4341 62.3076 Q 1149.4341 151.5384 1149.4341 218.4615" stroke="var(--warn-border)" stroke-width="0.7803" fill="none" marker-end="url(#arrow)"/>
  <text x="821.1322" y="40" text-anchor="middle" font-size="26.9133" fill="var(--warn-accent)" font-family="Arial, sans-serif">State</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

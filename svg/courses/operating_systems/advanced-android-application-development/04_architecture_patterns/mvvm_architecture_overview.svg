<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="80" y="284.64" width="224" height="151.2" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="10.5" />
  <text x="192" y="375.36" text-anchor="middle" font-size="31.36" font-weight="bold">View</text>
  <rect x="528" y="284.64" width="224" height="151.2" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="10.5" />
  <text x="640" y="375.36" text-anchor="middle" font-size="31.36" font-weight="bold">ViewModel</text>
  <rect x="976" y="284.64" width="224" height="151.2" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="10.5" />
  <text x="1088" y="375.36" text-anchor="middle" font-size="31.36" font-weight="bold">Model</text>
  <line x1="304" y1="360.24" x2="528" y2="360.24" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_mvvm)" />
  <line x1="528" y1="390.48" x2="304" y2="390.48" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_mvvm)" />
  <line x1="752" y1="360.24" x2="976" y2="360.24" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_mvvm)" />
  <line x1="976" y1="390.48" x2="752" y2="390.48" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_mvvm)" />
  <path d="M 192 284.64 Q 192 163.68 640 163.68 Q 640 224.16 640 284.64" stroke="var(--primary-border)" stroke-width="2.56" fill="none" stroke-dasharray="6.4 6.4" marker-end="url(#arrow_mvvm)" />
  <text x="416" y="148.56" text-anchor="middle" font-size="24.64" fill="var(--primary-accent)">Observes</text>
  <path d="M 640 435.84 Q 640 526.56 1088 526.56 Q 1088 496.32 1088 435.84" stroke="var(--danger-border)" stroke-width="2.56" fill="none" marker-end="url(#arrow_mvvm)" />
  <text x="864" y="571.92" text-anchor="middle" font-size="24.64" fill="var(--danger-accent)">Updates</text>
  <path d="M 1088 284.64 Q 1088 103.2 640 103.2 Q 640 163.68 640 284.64" stroke="var(--ok-border)" stroke-width="2.56" fill="none" stroke-dasharray="6.4 6.4" marker-end="url(#arrow_mvvm)" />
  <text x="864" y="88.08" text-anchor="middle" font-size="24.64" fill="var(--ok-accent)">Notifies</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow_mvvm" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 17.28 L 19.2 8.64 z" fill="#333" />
    </marker>
  </defs>
</svg>
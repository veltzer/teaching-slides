<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="275.625" width="240" height="181.2501" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="160.0001" y="384.375" text-anchor="middle" font-size="35.5404" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">View</text>
  <rect x="520" y="275.625" width="240" height="181.2501" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640.0001" y="384.375" text-anchor="middle" font-size="35.5404" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">ViewModel</text>
  <rect x="1000" y="275.625" width="240" height="181.2501" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1120.0001" y="384.375" text-anchor="middle" font-size="35.5404" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Model</text>
  <line x1="280" y1="366.25" x2="520" y2="366.25" stroke="var(--text)" stroke-width="0.6921" marker-end="url(#arrow)"/>
  <line x1="520" y1="402.5" x2="280" y2="402.5" stroke="var(--text)" stroke-width="0.6921" marker-end="url(#arrow)"/>
  <line x1="760" y1="366.25" x2="1000" y2="366.25" stroke="var(--text)" stroke-width="0.6921" marker-end="url(#arrow)"/>
  <line x1="1000" y1="402.5" x2="760" y2="402.5" stroke="var(--text)" stroke-width="0.6921" marker-end="url(#arrow)"/>
  <path d="M 160.0001 275.625 Q 160.0001 130.625 640.0001 130.625 Q 640.0001 203.1249 640.0001 275.625" stroke="var(--primary-border)" stroke-width="0.8858" fill="none" stroke-dasharray="2.2145 2.2145" marker-end="url(#arrow)"/>
  <text x="400.0001" y="112.4999" text-anchor="middle" font-size="27.9245" fill="var(--primary-accent)" font-family="Arial, sans-serif">Observes</text>
  <path d="M 640.0001 456.8749 Q 640.0001 565.6249 1120.0001 565.6249 Q 1120.0001 529.375 1120.0001 456.8749" stroke="var(--danger-border)" stroke-width="0.8858" fill="none" marker-end="url(#arrow)"/>
  <text x="880.0001" y="620" text-anchor="middle" font-size="27.9245" fill="var(--danger-accent)" font-family="Arial, sans-serif">Updates</text>
  <path d="M 1120.0001 275.625 Q 1120.0001 58.125 640.0001 58.125 Q 640.0001 130.625 640.0001 275.625" stroke="var(--ok-border)" stroke-width="0.8858" fill="none" stroke-dasharray="2.2145 2.2145" marker-end="url(#arrow)"/>
  <text x="880.0001" y="40" text-anchor="middle" font-size="27.9245" fill="var(--ok-accent)" font-family="Arial, sans-serif">Notifies</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

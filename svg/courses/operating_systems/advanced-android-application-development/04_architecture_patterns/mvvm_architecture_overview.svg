<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="64" y="172.8" width="128" height="86.4" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="128" y="224.64" text-anchor="middle" font-size="17.92" font-weight="bold">View</text>
  <rect x="320" y="172.8" width="128" height="86.4" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="384" y="224.64" text-anchor="middle" font-size="17.92" font-weight="bold">ViewModel</text>
  <rect x="576" y="172.8" width="128" height="86.4" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="640" y="224.64" text-anchor="middle" font-size="17.92" font-weight="bold">Model</text>
  <line x1="192" y1="216" x2="320" y2="216" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_mvvm)" />
  <line x1="320" y1="233.28" x2="192" y2="233.28" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_mvvm)" />
  <line x1="448" y1="216" x2="576" y2="216" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_mvvm)" />
  <line x1="576" y1="233.28" x2="448" y2="233.28" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_mvvm)" />
  <path d="M 128 172.8 Q 128 103.68 384 103.68 Q 384 138.24 384 172.8" stroke="var(--primary-border)" stroke-width="2.56" fill="none" stroke-dasharray="6.4 6.4" marker-end="url(#arrow_mvvm)" />
  <text x="256" y="95.04" text-anchor="middle" font-size="14.08" fill="var(--primary-accent)">Observes</text>
  <path d="M 384 259.2 Q 384 311.04 640 311.04 Q 640 293.76 640 259.2" stroke="var(--danger-border)" stroke-width="2.56" fill="none" marker-end="url(#arrow_mvvm)" />
  <text x="512" y="336.96" text-anchor="middle" font-size="14.08" fill="var(--danger-accent)">Updates</text>
  <path d="M 640 172.8 Q 640 69.12 384 69.12 Q 384 103.68 384 172.8" stroke="var(--ok-border)" stroke-width="2.56" fill="none" stroke-dasharray="6.4 6.4" marker-end="url(#arrow_mvvm)" />
  <text x="512" y="60.48" text-anchor="middle" font-size="14.08" fill="var(--ok-accent)">Notifies</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow_mvvm" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 17.28 L 19.2 8.64 z" fill="#333" />
    </marker>
  </defs>
</svg>
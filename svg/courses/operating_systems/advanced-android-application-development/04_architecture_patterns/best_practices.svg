  <rect x="1045.3333" y="54" width="192" height="45" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="1141.3333" y="84.6" text-anchor="middle" font-size="18">Dagger Setup</text>

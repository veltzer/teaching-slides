  <rect x="1002.6667" y="594" width="234.6667" height="45" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="1120" y="624.6" text-anchor="middle" font-size="18">Recovery Strategies</text>

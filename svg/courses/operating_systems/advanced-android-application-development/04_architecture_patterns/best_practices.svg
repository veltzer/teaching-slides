  <rect x="1024" y="216" width="213.3333" height="45" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="1130.6667" y="246.6" text-anchor="middle" font-size="18">Scope Management</text>
  <rect x="64" y="450" width="149.3333" height="45" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="138.6667" y="480.6" text-anchor="middle" font-size="18">Unit Tests</text>
  <rect x="42.6667" y="504" width="192" height="45" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />

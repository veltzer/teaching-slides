  <text x="128" y="624.6" text-anchor="middle" font-size="18">UI Tests</text>
  <rect x="1045.3333" y="450" width="170.6667" height="45" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="320" y="48" width="640" height="96" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="640" y="104" text-anchor="middle" font-size="22.4" font-weight="bold">Presentation Layer</text>
  <rect x="320" y="192" width="640" height="96" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="640" y="248" text-anchor="middle" font-size="22.4" font-weight="bold">Domain Layer</text>
  <rect x="320" y="336" width="640" height="96" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="640" y="392" text-anchor="middle" font-size="22.4" font-weight="bold">Data Layer</text>
  <rect x="320" y="480" width="640" height="96" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="640" y="536" text-anchor="middle" font-size="22.4" font-weight="bold">Framework</text>
  <line x1="640" y1="144" x2="640" y2="192" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_clean)" />
  <line x1="640" y1="288" x2="640" y2="336" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_clean)" />
  <line x1="640" y1="432" x2="640" y2="480" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_clean)" />
  <rect x="42.6667" y="64" width="234.6667" height="56" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="160" y="88" text-anchor="middle" font-size="17.6">Activities/Fragments</text>
  <text x="160" y="108.8" text-anchor="middle" font-size="16">UI</text>
  <rect x="1002.6667" y="64" width="213.3333" height="56" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="1109.3333" y="88" text-anchor="middle" font-size="17.6">ViewModels</text>
  <text x="1109.3333" y="108.8" text-anchor="middle" font-size="16">Presenters</text>
  <rect x="42.6667" y="208" width="234.6667" height="56" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="160" y="232" text-anchor="middle" font-size="17.6">Use Cases</text>
  <text x="160" y="252.8" text-anchor="middle" font-size="16">Business Logic</text>
  <rect x="1002.6667" y="208" width="213.3333" height="56" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="1109.3333" y="232" text-anchor="middle" font-size="17.6">Entities</text>
  <text x="1109.3333" y="252.8" text-anchor="middle" font-size="16">Domain Models</text>
  <rect x="42.6667" y="352" width="234.6667" height="56" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="160" y="376" text-anchor="middle" font-size="17.6">Repositories</text>
  <text x="160" y="396.8" text-anchor="middle" font-size="16">Data Sources</text>
  <rect x="1002.6667" y="352" width="213.3333" height="56" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1109.3333" y="376" text-anchor="middle" font-size="17.6">Models</text>
  <text x="1109.3333" y="396.8" text-anchor="middle" font-size="16">DTOs</text>
  <rect x="42.6667" y="496" width="234.6667" height="56" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="160" y="520" text-anchor="middle" font-size="17.6">Android Framework</text>
  <text x="160" y="540.8" text-anchor="middle" font-size="16">System APIs</text>
  <rect x="1002.6667" y="496" width="213.3333" height="56" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="1109.3333" y="520" text-anchor="middle" font-size="17.6">External Libraries</text>
  <text x="1109.3333" y="540.8" text-anchor="middle" font-size="16">Third Party</text>
  <line x1="320" y1="96" x2="277.3333" y2="91.2" stroke="var(--text-muted)" stroke-width="1.6" marker-end="url(#arrow_clean)" />
  <line x1="960" y1="96" x2="1002.6667" y2="91.2" stroke="var(--text-muted)" stroke-width="1.6" marker-end="url(#arrow_clean)" />
  <line x1="320" y1="240" x2="277.3333" y2="235.2" stroke="var(--text-muted)" stroke-width="1.6" marker-end="url(#arrow_clean)" />
  <line x1="960" y1="240" x2="1002.6667" y2="235.2" stroke="var(--text-muted)" stroke-width="1.6" marker-end="url(#arrow_clean)" />
  <line x1="320" y1="384" x2="277.3333" y2="379.2" stroke="var(--text-muted)" stroke-width="1.6" marker-end="url(#arrow_clean)" />
  <line x1="960" y1="384" x2="1002.6667" y2="379.2" stroke="var(--text-muted)" stroke-width="1.6" marker-end="url(#arrow_clean)" />
  <line x1="320" y1="528" x2="277.3333" y2="523.2" stroke="var(--text-muted)" stroke-width="1.6" marker-end="url(#arrow_clean)" />
  <line x1="960" y1="528" x2="1002.6667" y2="523.2" stroke="var(--text-muted)" stroke-width="1.6" marker-end="url(#arrow_clean)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow_clean" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 9.6 L 19.2 4.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
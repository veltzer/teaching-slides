  <text x="1162.2222" y="230.9538" text-anchor="middle" font-size="18.2925" font-family="Arial, sans-serif" fill="var(--danger-text)">Error</text>
  <rect x="40" y="468.3077" width="155.5555" height="44.6154" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="117.7778" y="498.6462" text-anchor="middle" font-size="18.2925" font-family="Arial, sans-serif" fill="var(--ok-text)">Scale</text>
  <rect x="40" y="521.8462" width="155.5555" height="44.6154" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="117.7778" y="552.1846" text-anchor="middle" font-size="18.2925" font-family="Arial, sans-serif" fill="var(--ok-text)">Hierarchy</text>
  <rect x="40" y="575.3846" width="155.5555" height="44.6154" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>

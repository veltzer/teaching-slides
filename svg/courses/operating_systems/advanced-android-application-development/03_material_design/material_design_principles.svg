  <text x="1162.2222" y="552.1846" text-anchor="middle" font-size="18.2925" font-family="Arial, sans-serif" fill="var(--warn-text)">Meaningful</text>
  <rect x="1084.4445" y="575.3846" width="155.5555" height="44.6154" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>

  <rect x="704" y="528" width="234.6667" height="72" fill="#fce4ec" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="821.3333" y="576" text-anchor="middle" font-size="23.4667">Frame Animation</text>
  <line x1="533.3333" y1="192" x2="256" y2="312" stroke="#333" stroke-width="4.2667" marker-end="url(#arrow_anim)" />
  <line x1="640" y1="192" x2="618.6667" y2="312" stroke="#333" stroke-width="4.2667" marker-end="url(#arrow_anim)" />
  <line x1="746.6667" y1="192" x2="992" y2="312" stroke="#333" stroke-width="4.2667" marker-end="url(#arrow_anim)" />
  <line x1="213.3333" y1="408" x2="149.3333" y2="528" stroke="#333" stroke-width="4.2667" marker-end="url(#arrow_anim)" />
  <line x1="298.6667" y1="408" x2="384" y2="528" stroke="#333" stroke-width="4.2667" marker-end="url(#arrow_anim)" />
  <line x1="576" y1="408" x2="565.3333" y2="528" stroke="#333" stroke-width="4.2667" marker-end="url(#arrow_anim)" />
  <line x1="661.3333" y1="408" x2="821.3333" y2="528" stroke="#333" stroke-width="4.2667" marker-end="url(#arrow_anim)" />
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">

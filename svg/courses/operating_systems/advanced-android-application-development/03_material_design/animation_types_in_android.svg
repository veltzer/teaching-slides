<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="455.3846" y="40" width="461.5385" height="131.8182" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="686.1538" y="119.0909" text-anchor="middle" font-size="32.557" fill="var(--bg)" font-weight="bold">Android Animations</text>
  <rect x="109.2308" y="303.6364" width="323.077" height="105.4545" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="270.7692" y="369.5455" text-anchor="middle" font-size="27.9059">Property Animation</text>
  <rect x="524.6154" y="303.6364" width="276.9231" height="105.4545" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="663.0769" y="369.5455" text-anchor="middle" font-size="27.9059">View Animation</text>
  <rect x="893.8461" y="303.6364" width="346.1539" height="105.4545" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1066.9231" y="369.5455" text-anchor="middle" font-size="27.9059">Transition Animation</text>
  <rect x="40" y="540.9091" width="230.7692" height="79.0909" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="155.3845" y="593.6364" text-anchor="middle" font-size="25.5805">ValueAnimator</text>
  <rect x="293.8461" y="540.9091" width="230.7692" height="79.0909" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="409.2307" y="593.6364" text-anchor="middle" font-size="25.5805">ObjectAnimator</text>
  <rect x="478.4615" y="540.9091" width="253.8462" height="79.0909" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="605.3846" y="593.6364" text-anchor="middle" font-size="25.5805">Tween Animation</text>
  <rect x="755.3846" y="540.9091" width="253.8462" height="79.0909" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="882.3076" y="593.6364" text-anchor="middle" font-size="25.5805">Frame Animation</text>
  <line x1="570.7692" y1="171.8182" x2="270.7692" y2="303.6364" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_anim)" />
  <line x1="686.1538" y1="171.8182" x2="663.0769" y2="303.6364" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_anim)" />
  <line x1="801.5385" y1="171.8182" x2="1066.9231" y2="303.6364" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_anim)" />
  <line x1="224.6153" y1="409.0909" x2="155.3845" y2="540.9091" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_anim)" />
  <line x1="316.9231" y1="409.0909" x2="409.2307" y2="540.9091" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_anim)" />
  <line x1="616.9231" y1="409.0909" x2="605.3846" y2="540.9091" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_anim)" />
  <line x1="709.2307" y1="409.0909" x2="882.3076" y2="540.9091" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_anim)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow_anim" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 14.4 L 19.2 7.2 z" fill="#333" />
    </marker>
  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="455.3846" y="40" width="461.5385" height="131.8182" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="686.1538" y="119.0909" text-anchor="middle" font-size="32.557" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Android Animations</text>
  <rect x="109.2308" y="303.6364" width="323.077" height="105.4545" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="270.7692" y="369.5455" text-anchor="middle" font-size="27.9059" font-family="Arial, sans-serif" fill="var(--primary-text)">Property Animation</text>
  <rect x="524.6154" y="303.6364" width="276.9231" height="105.4545" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="663.0769" y="369.5455" text-anchor="middle" font-size="27.9059" font-family="Arial, sans-serif" fill="var(--info-text)">View Animation</text>
  <rect x="893.8461" y="303.6364" width="346.1539" height="105.4545" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1066.9231" y="369.5455" text-anchor="middle" font-size="27.9059" font-family="Arial, sans-serif" fill="var(--ok-text)">Transition Animation</text>
  <rect x="40" y="540.9091" width="230.7692" height="79.0909" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="155.3845" y="593.6364" text-anchor="middle" font-size="25.5805" font-family="Arial, sans-serif" fill="var(--primary-text)">ValueAnimator</text>
  <rect x="293.8461" y="540.9091" width="230.7692" height="79.0909" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="409.2307" y="593.6364" text-anchor="middle" font-size="25.5805" font-family="Arial, sans-serif" fill="var(--primary-text)">ObjectAnimator</text>
  <rect x="478.4615" y="540.9091" width="253.8462" height="79.0909" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="605.3846" y="593.6364" text-anchor="middle" font-size="25.5805" font-family="Arial, sans-serif" fill="var(--danger-text)">Tween Animation</text>
  <rect x="755.3846" y="540.9091" width="253.8462" height="79.0909" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="882.3076" y="593.6364" text-anchor="middle" font-size="25.5805" font-family="Arial, sans-serif" fill="var(--danger-text)">Frame Animation</text>
  <line x1="570.7692" y1="171.8182" x2="270.7692" y2="303.6364" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="686.1538" y1="171.8182" x2="663.0769" y2="303.6364" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="801.5385" y1="171.8182" x2="1066.9231" y2="303.6364" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="224.6153" y1="409.0909" x2="155.3845" y2="540.9091" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="316.9231" y1="409.0909" x2="409.2307" y2="540.9091" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="616.9231" y1="409.0909" x2="605.3846" y2="540.9091" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="709.2307" y1="409.0909" x2="882.3076" y2="540.9091" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

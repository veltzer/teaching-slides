<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="800" height="76.0656" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="440" y="87.5411" text-anchor="middle" font-size="30.9585" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Material Design Best Practices</text>
  <rect x="173.3334" y="173.1148" width="533.3333" height="66.5574" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="440" y="214.9508" text-anchor="middle" font-size="26.5359" font-family="Arial, sans-serif" fill="var(--primary-text)">Consistent Spacing</text>
  <rect x="173.3334" y="268.1967" width="533.3333" height="66.5574" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="440" y="310.0328" text-anchor="middle" font-size="26.5359" font-family="Arial, sans-serif" fill="var(--info-text)">Color Hierarchy</text>
  <rect x="173.3334" y="363.2788" width="533.3333" height="66.5574" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="440" y="405.1148" text-anchor="middle" font-size="26.5359" font-family="Arial, sans-serif" fill="var(--ok-text)">Typography Scale</text>
  <rect x="173.3334" y="458.3606" width="533.3333" height="66.5574" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="440" y="500.1967" text-anchor="middle" font-size="26.5359" font-family="Arial, sans-serif" fill="var(--warn-text)">Meaningful Motion</text>
  <rect x="173.3334" y="553.4426" width="533.3333" height="66.5574" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="440" y="595.2786" text-anchor="middle" font-size="26.5359" font-family="Arial, sans-serif" fill="var(--danger-text)">Accessibility</text>
  <rect x="706.6667" y="553.4426" width="533.3333" height="66.5574" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="973.3333" y="595.2786" text-anchor="middle" font-size="26.5359" font-family="Arial, sans-serif" fill="var(--primary-text)">Dark Theme Support</text>
  <line x1="440" y1="116.0656" x2="440" y2="173.1148" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="440" y1="239.6721" x2="440" y2="268.1967" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="440" y1="334.7541" x2="440" y2="363.2788" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="440" y1="429.8361" x2="440" y2="458.3606" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="440" y1="524.918" x2="440" y2="553.4426" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="706.6667" y1="585.7705" x2="706.6667" y2="585.7705" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
</svg>
  <line x1="639.9999" y1="171.8181" x2="524.6154" y2="303.6364" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="732.3078" y1="171.8181" x2="824.6154" y2="303.6364" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />

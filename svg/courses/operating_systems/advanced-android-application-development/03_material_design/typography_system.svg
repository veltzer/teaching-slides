  <rect x="109.2308" y="303.6364" width="230.7692" height="105.4545" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="224.6153" y="369.5454" text-anchor="middle" font-size="29.0654" font-family="Arial, sans-serif" fill="var(--primary-text)">Headlines</text>

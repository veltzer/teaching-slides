  <text x="224.6153" y="593.6364" text-anchor="middle" font-size="26.6433" font-family="Arial, sans-serif" fill="var(--primary-text)">H2</text>
  <rect x="293.8461" y="540.9091" width="115.3846" height="79.0909" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="351.5384" y="593.6364" text-anchor="middle" font-size="26.6433" font-family="Arial, sans-serif" fill="var(--primary-text)">H3</text>
  <rect x="651.5384" y="540.9091" width="138.4616" height="79.0909" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="720.7692" y="593.6364" text-anchor="middle" font-size="26.6433" font-family="Arial, sans-serif" fill="var(--ok-text)">Body 1</text>
  <rect x="801.5385" y="540.9091" width="138.4616" height="79.0909" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="870.7692" y="593.6364" text-anchor="middle" font-size="26.6433" font-family="Arial, sans-serif" fill="var(--ok-text)">Body 2</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#c4cdd6"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bd7d75"/><stop offset="100%" stop-color="#7d3f38"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#555555"/></marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/></marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/></marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/></marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/></marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/></marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/></marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.445488940547" font-weight="bold" fill="var(--text)">Research, Prototype, Evaluate, Scale</text>

  <rect x="40" y="60.900900900901" width="215" height="83.603603603604" rx="8.178195576219" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="147" y="97.477477477477" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.356391152437" font-weight="bold" fill="var(--ok-text)">Research</text>
  <text x="147" y="123.603603603604" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.267293364328" fill="var(--ok-text)">survey docs</text>
  <line x1="255" y1="102.702702702703" x2="290" y2="102.702702702703" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="295" y="60.900900900901" width="215" height="83.603603603604" rx="8.178195576219" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="402" y="97.477477477477" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.356391152437" font-weight="bold" fill="var(--primary-text)">Prototype</text>
  <text x="402" y="123.603603603604" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.267293364328" fill="var(--primary-text)">spike branch</text>
  <line x1="510" y1="102.702702702703" x2="545" y2="102.702702702703" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="550" y="60.900900900901" width="215" height="83.603603603604" rx="8.178195576219" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="657" y="97.477477477477" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.356391152437" font-weight="bold" fill="var(--warn-text)">Evaluate</text>
  <text x="657" y="123.603603603604" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.267293364328" fill="var(--warn-text)">fit vs cost</text>
  <line x1="765" y1="102.702702702703" x2="800" y2="102.702702702703" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="805" y="60.900900900901" width="215" height="83.603603603604" rx="8.178195576219" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="912" y="97.477477477477" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.356391152437" font-weight="bold" fill="var(--info-text)">Integrate</text>
  <text x="912" y="123.603603603604" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.267293364328" fill="var(--info-text)">feature flag</text>
  <line x1="1020" y1="102.702702702703" x2="1055" y2="102.702702702703" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1060" y="60.900900900901" width="180" height="83.603603603604" rx="8.178195576219" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1150" y="97.477477477477" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.356391152437" font-weight="bold" fill="var(--danger-text)">Scale</text>
  <text x="1150" y="123.603603603604" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.267293364328" fill="var(--danger-text)">monitor</text>

  <rect x="40" y="181.081081081081" width="290" height="209.009009009009" rx="8.178195576219" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="185" y="217.657657657658" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.356391152437" font-weight="bold" fill="var(--primary-accent)">Privacy first</text>
  <text x="185" y="254.234234234234" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--text-muted)">on-device ML</text>
  <text x="185" y="285.585585585586" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--text-muted)">minimize data</text>
  <text x="185" y="316.936936936937" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--text-muted)">explicit consent</text>
  <text x="185" y="348.288288288288" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--text-muted)">Data Safety form</text>

  <rect x="340" y="181.081081081081" width="290" height="209.009009009009" rx="8.178195576219" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="485" y="217.657657657658" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.356391152437" font-weight="bold" fill="var(--ok-accent)">Feature flags</text>
  <text x="485" y="254.234234234234" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--text-muted)">ship dark</text>
  <text x="485" y="285.585585585586" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--text-muted)">kill switch</text>
  <text x="485" y="316.936936936937" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--text-muted)">A/B by cohort</text>
  <text x="485" y="348.288288288288" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--text-muted)">Remote Config</text>

  <rect x="640" y="181.081081081081" width="290" height="209.009009009009" rx="8.178195576219" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="785" y="217.657657657658" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.356391152437" font-weight="bold" fill="var(--warn-accent)">Modern tooling</text>
  <text x="785" y="254.234234234234" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--text-muted)">Compose + KMP</text>
  <text x="785" y="285.585585585586" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--text-muted)">Gradle catalogs</text>
  <text x="785" y="316.936936936937" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--text-muted)">Baseline Profiles</text>
  <text x="785" y="348.288288288288" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--text-muted)">KSP over kapt</text>

  <rect x="940" y="181.081081081081" width="300" height="209.009009009009" rx="8.178195576219" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1090" y="217.657657657658" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.356391152437" font-weight="bold" fill="var(--danger-accent)">Observability</text>
  <text x="1090" y="254.234234234234" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--text-muted)">feature metrics</text>
  <text x="1090" y="285.585585585586" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--text-muted)">crash dashboards</text>
  <text x="1090" y="316.936936936937" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--text-muted)">journey tracing</text>
  <text x="1090" y="348.288288288288" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--text-muted)">perf budgets</text>

  <rect x="40" y="421.441441441441" width="1200" height="198.558558558559" rx="8.178195576219" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="468.468468468468" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.400940046492" font-weight="bold" fill="var(--info-text)">Adopt deliberately</text>
  <text x="640" y="510.27027027027" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--info-text)">Start from real user problems</text>
  <text x="640" y="546.846846846847" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--info-text)">Prototype cheaply, measure impact</text>
  <text x="640" y="583.423423423423" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--info-text)">Be ready to roll back</text>
</svg>

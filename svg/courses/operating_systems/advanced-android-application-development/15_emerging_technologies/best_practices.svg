<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.190036" font-weight="bold" fill="var(--text)">Best practices for emerging tech — research, prototype, evaluate, scale</text>

  <!-- Top horizontal pipeline -->
  <rect x="40" y="82.962963" width="217.241379" height="85.925926" rx="8.43274" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="148.62069" y="120.555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.919573" font-weight="bold" fill="var(--ok-text)">Research</text>
  <text x="148.62069" y="147.407407" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.649111" fill="var(--ok-text)">survey docs &amp; demos</text>

  <line x1="257.241379" y1="125.925926" x2="288.275862" y2="125.925926" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="295.517241" y="82.962963" width="217.241379" height="85.925926" rx="8.43274" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="404.137931" y="120.555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.919573" font-weight="bold" fill="var(--primary-text)">Prototype</text>
  <text x="404.137931" y="147.407407" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.649111" fill="var(--primary-text)">isolated spike branch</text>

  <line x1="512.758621" y1="125.925926" x2="543.793103" y2="125.925926" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="551.034483" y="82.962963" width="217.241379" height="85.925926" rx="8.43274" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="659.655172" y="120.555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.919573" font-weight="bold" fill="var(--warn-text)">Evaluate</text>
  <text x="659.655172" y="147.407407" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.649111" fill="var(--warn-text)">measure fit vs cost</text>

  <line x1="768.275862" y1="125.925926" x2="799.310345" y2="125.925926" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="806.551724" y="82.962963" width="217.241379" height="85.925926" rx="8.43274" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="915.172414" y="120.555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.919573" font-weight="bold" fill="var(--info-text)">Integrate</text>
  <text x="915.172414" y="147.407407" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.649111" fill="var(--info-text)">behind feature flag</text>

  <line x1="1023.793103" y1="125.925926" x2="1054.827586" y2="125.925926" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1062.068966" y="82.962963" width="177.931034" height="85.925926" rx="8.43274" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1151.034483" y="120.555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.919573" font-weight="bold" fill="var(--danger-text)">Scale</text>
  <text x="1151.034483" y="147.407407" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.649111" fill="var(--danger-text)">monitor &amp; iterate</text>

  <!-- 4 best-practice cards below -->
  <rect x="40" y="211.851852" width="289.655172" height="193.333333" rx="8.43274" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="184.827586" y="244.074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.865481" font-weight="bold" fill="var(--primary-accent)">Privacy first</text>
  <text x="184.827586" y="276.296296" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--text-muted)">prefer on-device ML</text>
  <text x="184.827586" y="303.148148" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--text-muted)">minimize data collected</text>
  <text x="184.827586" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--text-muted)">explicit user consent</text>
  <text x="184.827586" y="362.222222" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--text-muted)">follow Data Safety section</text>
  <text x="184.827586" y="389.074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.649111" fill="var(--text-faint)">regulations move fast</text>

  <rect x="340" y="211.851852" width="289.655172" height="193.333333" rx="8.43274" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="484.827586" y="244.074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.865481" font-weight="bold" fill="var(--ok-accent)">Feature flags</text>
  <text x="484.827586" y="276.296296" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--text-muted)">ship dark, enable for %</text>
  <text x="484.827586" y="303.148148" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--text-muted)">kill-switch for incidents</text>
  <text x="484.827586" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--text-muted)">A/B experiments by cohort</text>
  <text x="484.827586" y="362.222222" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--text-muted)">clean up stale flags</text>
  <text x="484.827586" y="389.074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.649111" fill="var(--text-faint)">Remote Config / Firebase</text>

  <rect x="640" y="211.851852" width="289.655172" height="193.333333" rx="8.43274" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="784.827586" y="244.074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.865481" font-weight="bold" fill="var(--warn-accent)">Modern tooling</text>
  <text x="784.827586" y="276.296296" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--text-muted)">Compose + KMP stack</text>
  <text x="784.827586" y="303.148148" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--text-muted)">Gradle version catalogs</text>
  <text x="784.827586" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--text-muted)">Baseline Profiles in CI</text>
  <text x="784.827586" y="362.222222" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--text-muted)">KSP over kapt</text>
  <text x="784.827586" y="389.074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.649111" fill="var(--text-faint)">adopt incrementally</text>

  <rect x="940" y="211.851852" width="300" height="193.333333" rx="8.43274" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1090" y="244.074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.865481" font-weight="bold" fill="var(--danger-accent)">Observability</text>
  <text x="1090" y="276.296296" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--text-muted)">metrics for new features</text>
  <text x="1090" y="303.148148" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--text-muted)">crash + ANR dashboards</text>
  <text x="1090" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--text-muted)">user-journey tracing</text>
  <text x="1090" y="362.222222" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--text-muted)">perf budgets enforced</text>
  <text x="1090" y="389.074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.649111" fill="var(--text-faint)">unknown-unknowns surface</text>

  <!-- Bottom: guiding principle banner -->
  <rect x="40" y="437.407407" width="1200" height="182.592593" rx="8.43274" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="480.37037" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.973666" font-weight="bold" fill="var(--info-text)">Adopt emerging tech deliberately</text>
  <text x="640" y="517.962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.757296" fill="var(--info-text)">Start with a real user problem — not the hype cycle</text>
  <text x="640" y="550.185185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.757296" fill="var(--info-text)">Prototype cheaply, measure impact, ship behind a flag</text>
  <text x="640" y="582.407407" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.757296" fill="var(--info-text)">Be ready to roll back; most experiments will not ship wide</text>
  <text x="640" y="611.407407" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.649111" fill="var(--info-text)">And when they do, they become boring infrastructure — that's the goal.</text>
</svg>

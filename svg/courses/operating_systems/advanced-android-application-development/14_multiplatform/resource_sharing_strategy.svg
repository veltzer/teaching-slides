<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.190036" font-weight="bold" fill="var(--text)">Resource sharing strategy — commonMain vs platform source sets</text>

  <!-- Central commonMain box -->
  <rect x="433.103448" y="82.962963" width="413.793103" height="139.62963" rx="8.43274" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="120.555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.081851" font-weight="bold" fill="var(--info-text)">commonMain</text>
  <text x="640" y="152.777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--info-text)">domain models, use cases, networking</text>
  <text x="640" y="176.407407" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--info-text)">serialization, view models, strings</text>
  <text x="640" y="206.481481" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--info-text)">declared via expect — shared once</text>

  <!-- Arrows down to platform source sets -->
  <line x1="236.551724" y1="265.555556" x2="236.551724" y2="306.37037" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="222.592593" x2="640" y2="306.37037" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1043.448276" y1="265.555556" x2="1043.448276" y2="306.37037" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="433.103448" y1="152.777778" x2="246.896552" y2="244.074074" stroke="var(--text-muted)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="846.896552" y1="152.777778" x2="1033.103448" y2="244.074074" stroke="var(--text-muted)" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Three platform source sets -->
  <rect x="81.37931" y="308.518519" width="310.344828" height="171.851852" rx="8.43274" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="236.551724" y="346.111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.973666" font-weight="bold" fill="var(--ok-text)">androidMain</text>
  <text x="236.551724" y="378.333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--ok-text)">res/ drawables, strings XML</text>
  <text x="236.551724" y="403.037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--ok-text)">Context, Intent, Jetpack libs</text>
  <text x="236.551724" y="427.740741" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--ok-text)">SQLDelight Android driver</text>
  <text x="236.551724" y="458.888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--ok-text)">actual impl of expect APIs</text>

  <rect x="484.827586" y="308.518519" width="310.344828" height="171.851852" rx="8.43274" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="346.111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.973666" font-weight="bold" fill="var(--primary-text)">iosMain</text>
  <text x="640" y="378.333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--primary-text)">Assets.xcassets images</text>
  <text x="640" y="403.037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--primary-text)">Localizable.strings</text>
  <text x="640" y="427.740741" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--primary-text)">NSURLSession, Keychain</text>
  <text x="640" y="458.888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--primary-text)">actual impl of expect APIs</text>

  <rect x="888.275862" y="308.518519" width="310.344828" height="171.851852" rx="8.43274" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1043.448276" y="346.111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.973666" font-weight="bold" fill="var(--warn-text)">desktopMain / jsMain</text>
  <text x="1043.448276" y="378.333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--warn-text)">JVM/Node resources</text>
  <text x="1043.448276" y="403.037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--warn-text)">File I/O or web APIs</text>
  <text x="1043.448276" y="427.740741" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--warn-text)">JDBC / IndexedDB drivers</text>
  <text x="1043.448276" y="458.888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--warn-text)">actual impl of expect APIs</text>

  <!-- Bottom rules panel -->
  <rect x="40" y="512.592593" width="1200" height="107.407407" rx="8.43274" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="544.814815" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.865481" font-weight="bold" fill="var(--text)">Sharing rules</text>
  <text x="236.551724" y="579.185185" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--text-muted)">Share logic, keep UI-adjacent assets native</text>
  <text x="640" y="579.185185" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--text-muted)">Use Compose Multiplatform Resources for truly shared images/strings</text>
  <text x="1043.448276" y="579.185185" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--text-muted)">expect/actual bridges platform-only APIs</text>
  <text x="640" y="607.111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203" fill="var(--text-faint)">Rule of thumb: if it calls a platform SDK, put it under the matching sourceSet.</text>
</svg>

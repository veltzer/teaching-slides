<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#4a148c" />
    </marker>
  </defs>
  <rect width="850.8019" height="444.3347" fill="var(--bg)" rx="6" x="40" y="40"/>
  <circle cx="831.2163" cy="370.0617" r="64.0469" fill="url(#grad-primary)" filter="url(#shadow)" />
  <text x="831.2163" y="365.1248" text-anchor="middle" font-family="sans-serif" font-size="15.2147" font-weight="bold" fill="var(--bg)">NORMAL</text>
  <text x="831.2163" y="379.3187" text-anchor="middle" font-family="sans-serif" font-size="15.2147" fill="var(--primary-accent)">MODE</text>
  <text x="831.2163" y="390.4271" text-anchor="middle" font-family="sans-serif" font-size="15.2147" fill="var(--primary-accent)">Default / hub</text>
  <text x="831.2163" y="401.5355" text-anchor="middle" font-family="monospace" font-size="15.2147" fill="var(--primary-accent)">h j k l · dd · yy · p</text>
  <circle cx="552.0469" cy="370.0617" r="57.6423" fill="var(--ok-accent)" filter="url(#shadow)" />
  <text x="552.0469" y="365.1248" text-anchor="middle" font-family="sans-serif" font-size="15.2147" font-weight="bold" fill="var(--bg)">INSERT</text>
  <text x="552.0469" y="377.4674" text-anchor="middle" font-family="sans-serif" font-size="15.2147" fill="var(--ok-accent)">MODE</text>
  <text x="552.0469" y="389.8099" text-anchor="middle" font-family="sans-serif" font-size="15.2147" fill="var(--ok-accent)">Type text freely</text>
  <text x="552.0469" y="402.1525" text-anchor="middle" font-family="monospace" font-size="15.2147" fill="var(--ok-accent)">-- INSERT --</text>
  <circle cx="1110.3856" cy="370.0617" r="57.6423" fill="var(--info-accent)" filter="url(#shadow)" />
  <text x="1110.3856" y="365.1248" text-anchor="middle" font-family="sans-serif" font-size="15.2147" font-weight="bold" fill="var(--bg)">VISUAL</text>
  <text x="1110.3856" y="377.4674" text-anchor="middle" font-family="sans-serif" font-size="15.2147" fill="var(--info-accent)">MODE</text>
  <text x="1110.3856" y="389.8099" text-anchor="middle" font-family="sans-serif" font-size="15.2147" fill="var(--info-accent)">Select text ranges</text>
  <text x="1110.3856" y="402.1525" text-anchor="middle" font-family="monospace" font-size="15.2147" fill="var(--info-accent)">-- VISUAL --</text>
  <circle cx="831.2163" cy="542.8588" r="57.6423" fill="var(--danger-accent)" filter="url(#shadow)" />
  <text x="831.2163" y="537.9216" text-anchor="middle" font-family="sans-serif" font-size="15.2147" font-weight="bold" fill="var(--bg)">COMMAND</text>
  <text x="831.2163" y="550.2641" text-anchor="middle" font-family="sans-serif" font-size="15.2147" fill="var(--danger-accent)">MODE</text>
  <text x="831.2163" y="562.6068" text-anchor="middle" font-family="sans-serif" font-size="15.2147" fill="var(--warn-accent)">:w  :q  :s  :%s</text>
  <text x="831.2163" y="574.9495" text-anchor="middle" font-family="monospace" font-size="15.2147" fill="var(--warn-accent)">Colon prompt at bottom</text>
  <path d="M 764.7475 348.4621 Q 658.3971 314.52 611.869 351.5476" stroke="var(--ok-border)" stroke-width="0.9942" fill="none" marker-end="url(#arrow-ok)" />
  <text x="675.0145" y="323.7769" text-anchor="middle" font-family="monospace" font-size="15.2147" font-weight="bold" fill="var(--ok-accent)">i  a  I  A  o  O</text>
  <text x="675.0145" y="334.2681" text-anchor="middle" font-family="sans-serif" font-size="15.2147" fill="var(--text-muted)">enter insert before/after</text>
  <path d="M 611.869 388.5756 Q 658.3971 425.6036 764.7475 391.6613" stroke="var(--primary-border)" stroke-width="0.9942" fill="none" marker-end="url(#arrow-primary)" />
  <text x="675.0145" y="428.6892" text-anchor="middle" font-family="monospace" font-size="15.2147" font-weight="bold" fill="var(--primary-accent)">Esc</text>
  <text x="675.0145" y="439.1805" text-anchor="middle" font-family="sans-serif" font-size="15.2147" fill="var(--text-muted)">return to normal</text>
  <path d="M 897.6851 348.4621 Q 1004.0354 314.52 1050.5637 351.5476" stroke="var(--info-border)" stroke-width="0.9942" fill="none" marker-end="url(#arrow-purple)" />
  <text x="990.7418" y="323.7769" text-anchor="middle" font-family="monospace" font-size="15.2147" font-weight="bold" fill="var(--info-accent)">v  V  Ctrl+v</text>
  <text x="990.7418" y="334.2681" text-anchor="middle" font-family="sans-serif" font-size="15.2147" fill="var(--text-muted)">char / line / block select</text>
  <path d="M 1050.5637 388.5756 Q 1004.0354 425.6036 897.6851 391.6613" stroke="var(--primary-border)" stroke-width="0.9942" fill="none" marker-end="url(#arrow-primary)" />
  <text x="990.7418" y="428.6892" text-anchor="middle" font-family="monospace" font-size="15.2147" font-weight="bold" fill="var(--primary-accent)">Esc</text>
  <text x="990.7418" y="439.1805" text-anchor="middle" font-family="sans-serif" font-size="15.2147" fill="var(--text-muted)">cancel selection</text>
  <path d="M 797.9818 428.6892 Q 764.7475 478.0598 797.9818 487.3167" stroke="var(--danger-border)" stroke-width="0.9942" fill="none" marker-end="url(#arrow-warn)" />
  <text x="731.5129" y="465.7171" text-anchor="middle" font-family="monospace" font-size="15.2147" font-weight="bold" fill="var(--danger-accent)">:  /  ?  !</text>
  <text x="731.5129" y="476.2083" text-anchor="middle" font-family="sans-serif" font-size="15.2147" fill="var(--text-muted)">colon / search / shell</text>
  <path d="M 864.4507 487.3167 Q 897.6851 478.0598 864.4507 428.6892" stroke="var(--primary-border)" stroke-width="0.9942" fill="none" marker-end="url(#arrow-primary)" />
  <text x="930.9197" y="465.7171" text-anchor="middle" font-family="monospace" font-size="15.2147" font-weight="bold" fill="var(--primary-accent)">Enter / Esc</text>
  <text x="930.9197" y="476.2083" text-anchor="middle" font-family="sans-serif" font-size="15.2147" fill="var(--text-muted)">execute or cancel</text>
  <rect x="422.4327" y="450.2888" width="122.9674" height="169.7112" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="483.5841" y="464.4829" text-anchor="middle" font-family="sans-serif" font-size="15.2147" font-weight="bold" fill="var(--ok-accent)">Enter Insert</text>
  <text x="439.0498" y="478.0598" font-family="monospace" font-size="15.2147" fill="var(--text)">i    before cursor</text>
  <text x="439.0498" y="489.1682" font-family="monospace" font-size="15.2147" fill="var(--text)">a    after cursor</text>
  <text x="439.0498" y="500.2765" font-family="monospace" font-size="15.2147" fill="var(--text)">I    line start</text>
  <text x="439.0498" y="511.3849" font-family="monospace" font-size="15.2147" fill="var(--text)">A    line end</text>
  <text x="439.0498" y="522.4933" font-family="monospace" font-size="15.2147" fill="var(--text)">o    new line below</text>
  <text x="439.0498" y="533.6017" font-family="monospace" font-size="15.2147" fill="var(--text)">O    new line above</text>
  <text x="439.0498" y="544.7101" font-family="monospace" font-size="15.2147" fill="var(--text)">s    sub char</text>
  <text x="439.0498" y="555.8183" font-family="monospace" font-size="15.2147" fill="var(--text)">S    sub line</text>
  <text x="439.0498" y="566.9268" font-family="monospace" font-size="15.2147" fill="var(--text)">R    replace mode</text>
  <text x="439.0498" y="578.035" font-family="monospace" font-size="15.2147" fill="var(--text)">cw   change word</text>
  <text x="439.0498" y="592.2291" font-family="sans-serif" font-size="15.2147" fill="var(--text-muted)">All enter Insert mode</text>
  <text x="439.0498" y="602.7205" font-family="sans-serif" font-size="15.2147" fill="var(--text-muted)">Esc to return</text>
  <rect x="1117.0326" y="450.2888" width="122.9674" height="169.7112" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1178.1838" y="464.4829" text-anchor="middle" font-family="sans-serif" font-size="15.2147" font-weight="bold" fill="var(--danger-accent)">Command Mode</text>
  <text x="1130.3265" y="478.0598" font-family="monospace" font-size="15.2147" fill="var(--text)">:w       save</text>
  <text x="1130.3265" y="489.1682" font-family="monospace" font-size="15.2147" fill="var(--text)">:q!      quit</text>
  <text x="1130.3265" y="500.2765" font-family="monospace" font-size="15.2147" fill="var(--text)">:wq      save+quit</text>
  <text x="1130.3265" y="511.3849" font-family="monospace" font-size="15.2147" fill="var(--text)">:x       save+quit</text>
  <text x="1130.3265" y="522.4933" font-family="monospace" font-size="15.2147" fill="var(--text)">:e file  open</text>
  <text x="1130.3265" y="533.6017" font-family="monospace" font-size="15.2147" fill="var(--text)">:set nu  numbers</text>
  <text x="1130.3265" y="544.7101" font-family="monospace" font-size="15.2147" fill="var(--text)">:10      goto line</text>
  <text x="1130.3265" y="555.8183" font-family="monospace" font-size="15.2147" fill="var(--text)">:%s/a/b  replace</text>
  <text x="1130.3265" y="566.9268" font-family="monospace" font-size="15.2147" fill="var(--text)">/pattern search</text>
  <text x="1130.3265" y="578.035" font-family="monospace" font-size="15.2147" fill="var(--text)">n / N    next/prev</text>
  <text x="1130.3265" y="592.2291" font-family="sans-serif" font-size="15.2147" fill="var(--text-muted)">Enter to execute</text>
  <text x="1130.3265" y="602.7205" font-family="sans-serif" font-size="15.2147" fill="var(--text-muted)">Esc to cancel</text>

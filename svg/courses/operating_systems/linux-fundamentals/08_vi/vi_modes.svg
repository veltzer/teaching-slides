<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- ── INSERT MODE (top-left) ── cx=255 cy=185 -->
  <rect x="40" y="40" width="375" height="206.440678" rx="6.157733"
        fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"
        filter="url(#shadow)"/>
  <text x="227.5" y="118.644068" text-anchor="middle" font-family="sans-serif"
        font-size="36.946398" font-weight="bold" fill="var(--ok-text)">INSERT</text>
  <text x="227.5" y="161.898305" text-anchor="middle" font-family="monospace"
        font-size="22.578354" fill="var(--ok-text)">i a I A o O s cw</text>
  <text x="227.5" y="222.847458" text-anchor="middle" font-family="sans-serif"
        font-size="18.473199" fill="var(--ok-text)">type text freely</text>

  <!-- ── VISUAL MODE (top-right) ── cx=1025 cy=185 -->
  <rect x="865" y="40" width="375" height="206.440678" rx="6.157733"
        fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"
        filter="url(#shadow)"/>
  <text x="1052.5" y="118.644068" text-anchor="middle" font-family="sans-serif"
        font-size="36.946398" font-weight="bold" fill="var(--info-text)">VISUAL</text>
  <text x="1052.5" y="161.898305" text-anchor="middle" font-family="monospace"
        font-size="22.578354" fill="var(--info-text)">v  V  Ctrl+v</text>
  <text x="1052.5" y="222.847458" text-anchor="middle" font-family="sans-serif"
        font-size="18.473199" fill="var(--info-text)">select text ranges</text>

  <!-- ── NORMAL MODE (centre) ── cx=640 cy=390 -->
  <rect x="415" y="202.20339" width="450" height="285.084746" rx="6.157733"
        fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"
        filter="url(#shadow)"/>
  <text x="640" y="285.762712" text-anchor="middle" font-family="sans-serif"
        font-size="43.104131" font-weight="bold" fill="var(--primary-text)">NORMAL</text>
  <text x="640" y="336.881356" text-anchor="middle" font-family="sans-serif"
        font-size="20.525777" fill="var(--primary-text)">default · hub mode</text>
  <text x="640" y="376.20339" text-anchor="middle" font-family="monospace"
        font-size="20.525777" fill="var(--primary-text)">h j k l · dd · yy · p</text>
  <text x="640" y="415.525424" text-anchor="middle" font-family="monospace"
        font-size="20.525777" fill="var(--primary-text)">u · Ctrl+r · gg · G</text>
  <text x="640" y="454.847458" text-anchor="middle" font-family="sans-serif"
        font-size="16.420621" fill="var(--primary-text)">always return here with Esc</text>

  <!-- ── COMMAND MODE (bottom-centre) ── cx=640 cy=585 -->
  <rect x="415" y="521.694915" width="450" height="98.305085" rx="6.157733"
        fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"
        filter="url(#shadow)"/>
  <text x="640" y="568.881356" text-anchor="middle" font-family="sans-serif"
        font-size="32.841243" font-weight="bold" fill="var(--danger-text)">COMMAND</text>
  <text x="640" y="602.305085" text-anchor="middle" font-family="monospace"
        font-size="20.525777" fill="var(--danger-text)">:w  :q  :wq  :%s  /pat</text>

  <!-- ══ NORMAL → INSERT  top lane ══ -->
  <line x1="415" y1="266.101695" x2="416.071429" y2="266.101695"
        stroke="var(--ok-border)" stroke-width="0" marker-end="none"/>
  <path d="M 415 256.271186 Q 340 187.457627 415 143.220339" stroke="var(--ok-border)" stroke-width="2"
        fill="none" marker-end="url(#arrow-ok)"/>
  <text x="307.857143" y="195.322034" text-anchor="middle" font-family="monospace"
        font-size="18.473199" font-weight="bold" fill="var(--ok-accent)">i a o O</text>

  <!-- ══ INSERT → NORMAL  bottom lane ══ -->
  <path d="M 415 221.864407 Q 340 275.932203 415 315.254237" stroke="var(--primary-border)" stroke-width="2"
        fill="none" marker-end="url(#arrow-primary)"/>
  <text x="288.571429" y="275.932203" text-anchor="middle" font-family="monospace"
        font-size="18.473199" font-weight="bold" fill="var(--primary-accent)">Esc</text>

  <!-- ══ NORMAL → VISUAL  top lane ══ -->
  <path d="M 865 256.271186 Q 940 187.457627 865 143.220339" stroke="var(--info-border)" stroke-width="2"
        fill="none" marker-end="url(#arrow-info)"/>
  <text x="972.142857" y="195.322034" text-anchor="middle" font-family="monospace"
        font-size="18.473199" font-weight="bold" fill="var(--info-accent)">v V Ctrl+v</text>

  <!-- ══ VISUAL → NORMAL  bottom lane ══ -->
  <path d="M 865 221.864407 Q 940 275.932203 865 315.254237" stroke="var(--primary-border)" stroke-width="2"
        fill="none" marker-end="url(#arrow-primary)"/>
  <text x="991.428571" y="275.932203" text-anchor="middle" font-family="monospace"
        font-size="18.473199" font-weight="bold" fill="var(--primary-accent)">Esc</text>

  <!-- ══ NORMAL → COMMAND  left lane ══ -->
  <path d="M 575.714286 487.288136 Q 532.857143 506.949153 565 521.694915" stroke="var(--danger-border)" stroke-width="2"
        fill="none" marker-end="url(#arrow-danger)"/>
  <text x="455.714286" y="511.864407" text-anchor="middle" font-family="monospace"
        font-size="18.473199" font-weight="bold" fill="var(--danger-accent)">:  /  ?</text>

  <!-- ══ COMMAND → NORMAL  right lane ══ -->
  <path d="M 715 521.694915 Q 757.857143 506.949153 725.714286 487.288136" stroke="var(--primary-border)" stroke-width="2"
        fill="none" marker-end="url(#arrow-primary)"/>
  <text x="830.714286" y="511.864407" text-anchor="middle" font-family="monospace"
        font-size="18.473199" font-weight="bold" fill="var(--primary-accent)">Enter/Esc</text>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#4a148c" />
    </marker>
  </defs>
  <rect width="844.5361" height="475.0515" fill="var(--bg)" rx="6"/>
  <circle cx="422.268" cy="191.3402" r="65.9794" fill="url(#grad-primary)" filter="url(#shadow)" />
  <text x="422.268" y="186.0619" text-anchor="middle" font-family="sans-serif" font-size="14.5155" font-weight="bold" fill="var(--bg)">NORMAL</text>
  <text x="422.268" y="201.2371" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--primary-accent)">MODE</text>
  <text x="422.268" y="213.1134" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--primary-accent)">Default / hub</text>
  <text x="422.268" y="224.9897" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--primary-accent)">h j k l · dd · yy · p</text>
  <circle cx="145.1546" cy="191.3402" r="59.3814" fill="var(--ok-accent)" filter="url(#shadow)" />
  <text x="145.1546" y="186.0619" text-anchor="middle" font-family="sans-serif" font-size="13.1959" font-weight="bold" fill="var(--bg)">INSERT</text>
  <text x="145.1546" y="199.2577" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--ok-accent)">MODE</text>
  <text x="145.1546" y="212.4536" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--ok-accent)">Type text freely</text>
  <text x="145.1546" y="225.6495" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--ok-accent)">-- INSERT --</text>
  <circle cx="699.3814" cy="191.3402" r="59.3814" fill="var(--info-accent)" filter="url(#shadow)" />
  <text x="699.3814" y="186.0619" text-anchor="middle" font-family="sans-serif" font-size="13.1959" font-weight="bold" fill="var(--bg)">VISUAL</text>
  <text x="699.3814" y="199.2577" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--info-accent)">MODE</text>
  <text x="699.3814" y="212.4536" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--info-accent)">Select text ranges</text>
  <text x="699.3814" y="225.6495" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--info-accent)">-- VISUAL --</text>
  <circle cx="422.268" cy="376.0825" r="59.3814" fill="var(--danger-accent)" filter="url(#shadow)" />
  <text x="422.268" y="370.8041" text-anchor="middle" font-family="sans-serif" font-size="11.8763" font-weight="bold" fill="var(--bg)">COMMAND</text>
  <text x="422.268" y="384" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--danger-accent)">MODE</text>
  <text x="422.268" y="397.1959" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--warn-accent)">:w  :q  :s  :%s</text>
  <text x="422.268" y="410.3918" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--warn-accent)">Colon prompt at bottom</text>
  <path d="M 356.2887 168.2474 Q 250.7216 131.9588 204.5361 171.5464" stroke="var(--ok-border)" stroke-width="1.9794" fill="none" marker-end="url(#arrow-ok)" />
  <text x="267.2165" y="141.8557" text-anchor="middle" font-family="monospace" font-size="10.5567" font-weight="bold" fill="var(--ok-accent)">i  a  I  A  o  O</text>
  <text x="267.2165" y="153.0722" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">enter insert before/after</text>
  <path d="M 204.5361 211.134 Q 250.7216 250.7216 356.2887 214.433" stroke="var(--primary-border)" stroke-width="1.9794" fill="none" marker-end="url(#arrow-primary)" />
  <text x="267.2165" y="254.0206" text-anchor="middle" font-family="monospace" font-size="10.5567" font-weight="bold" fill="var(--primary-accent)">Esc</text>
  <text x="267.2165" y="265.2371" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">return to normal</text>
  <path d="M 488.2474 168.2474 Q 593.8144 131.9588 640 171.5464" stroke="var(--info-border)" stroke-width="1.9794" fill="none" marker-end="url(#arrow-purple)" />
  <text x="580.6186" y="141.8557" text-anchor="middle" font-family="monospace" font-size="10.5567" font-weight="bold" fill="var(--info-accent)">v  V  Ctrl+v</text>
  <text x="580.6186" y="153.0722" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">char / line / block select</text>
  <path d="M 640 211.134 Q 593.8144 250.7216 488.2474 214.433" stroke="var(--primary-border)" stroke-width="1.9794" fill="none" marker-end="url(#arrow-primary)" />
  <text x="580.6186" y="254.0206" text-anchor="middle" font-family="monospace" font-size="10.5567" font-weight="bold" fill="var(--primary-accent)">Esc</text>
  <text x="580.6186" y="265.2371" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">cancel selection</text>
  <path d="M 389.2784 254.0206 Q 356.2887 306.8041 389.2784 316.701" stroke="var(--danger-border)" stroke-width="1.9794" fill="none" marker-end="url(#arrow-warn)" />
  <text x="323.299" y="293.6082" text-anchor="middle" font-family="monospace" font-size="10.5567" font-weight="bold" fill="var(--danger-accent)">:  /  ?  !</text>
  <text x="323.299" y="304.8247" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">colon / search / shell</text>
  <path d="M 455.2577 316.701 Q 488.2474 306.8041 455.2577 254.0206" stroke="var(--primary-border)" stroke-width="1.9794" fill="none" marker-end="url(#arrow-primary)" />
  <text x="521.2371" y="293.6082" text-anchor="middle" font-family="monospace" font-size="10.5567" font-weight="bold" fill="var(--primary-accent)">Enter / Esc</text>
  <text x="521.2371" y="304.8247" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">execute or cancel</text>
  <rect x="16.4948" y="277.1134" width="122.0619" height="181.4433" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="77.1959" y="292.2887" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="var(--ok-accent)">Enter Insert</text>
  <text x="32.9897" y="306.8041" font-family="monospace" font-size="10" fill="var(--text)">i    before cursor</text>
  <text x="32.9897" y="318.6804" font-family="monospace" font-size="10" fill="var(--text)">a    after cursor</text>
  <text x="32.9897" y="330.5567" font-family="monospace" font-size="10" fill="var(--text)">I    line start</text>
  <text x="32.9897" y="342.433" font-family="monospace" font-size="10" fill="var(--text)">A    line end</text>
  <text x="32.9897" y="354.3093" font-family="monospace" font-size="10" fill="var(--text)">o    new line below</text>
  <text x="32.9897" y="366.1856" font-family="monospace" font-size="10" fill="var(--text)">O    new line above</text>
  <text x="32.9897" y="378.0619" font-family="monospace" font-size="10" fill="var(--text)">s    sub char</text>
  <text x="32.9897" y="389.9381" font-family="monospace" font-size="10" fill="var(--text)">S    sub line</text>
  <text x="32.9897" y="401.8144" font-family="monospace" font-size="10" fill="var(--text)">R    replace mode</text>
  <text x="32.9897" y="413.6907" font-family="monospace" font-size="10" fill="var(--text)">cw   change word</text>
  <text x="32.9897" y="428.866" font-family="sans-serif" font-size="10" fill="var(--text-muted)">All enter Insert mode</text>
  <text x="32.9897" y="440.0825" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Esc to return</text>
  <rect x="705.9794" y="277.1134" width="122.0619" height="181.4433" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="766.6804" y="292.2887" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="var(--danger-accent)">Command Mode</text>
  <text x="719.1753" y="306.8041" font-family="monospace" font-size="10" fill="var(--text)">:w       save</text>
  <text x="719.1753" y="318.6804" font-family="monospace" font-size="10" fill="var(--text)">:q!      quit</text>
  <text x="719.1753" y="330.5567" font-family="monospace" font-size="10" fill="var(--text)">:wq      save+quit</text>
  <text x="719.1753" y="342.433" font-family="monospace" font-size="10" fill="var(--text)">:x       save+quit</text>
  <text x="719.1753" y="354.3093" font-family="monospace" font-size="10" fill="var(--text)">:e file  open</text>
  <text x="719.1753" y="366.1856" font-family="monospace" font-size="10" fill="var(--text)">:set nu  numbers</text>
  <text x="719.1753" y="378.0619" font-family="monospace" font-size="10" fill="var(--text)">:10      goto line</text>
  <text x="719.1753" y="389.9381" font-family="monospace" font-size="10" fill="var(--text)">:%s/a/b  replace</text>
  <text x="719.1753" y="401.8144" font-family="monospace" font-size="10" fill="var(--text)">/pattern search</text>
  <text x="719.1753" y="413.6907" font-family="monospace" font-size="10" fill="var(--text)">n / N    next/prev</text>
  <text x="719.1753" y="428.866" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Enter to execute</text>
  <text x="719.1753" y="440.0825" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Esc to cancel</text>
</svg>
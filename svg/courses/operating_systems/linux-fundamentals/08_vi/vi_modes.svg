  <ns0:text x="766.6804" y="292.2887" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#bf360c">Command Mode</ns0:text>
  <ns0:text x="719.1753" y="306.8041" font-family="monospace" font-size="10" fill="#212121">:w       save</ns0:text>
  <ns0:text x="719.1753" y="318.6804" font-family="monospace" font-size="10" fill="#212121">:q!      quit</ns0:text>
  <ns0:text x="719.1753" y="330.5567" font-family="monospace" font-size="10" fill="#212121">:wq      save+quit</ns0:text>
  <ns0:text x="719.1753" y="342.433" font-family="monospace" font-size="10" fill="#212121">:x       save+quit</ns0:text>
  <ns0:text x="719.1753" y="354.3093" font-family="monospace" font-size="10" fill="#212121">:e file  open</ns0:text>
  <ns0:text x="719.1753" y="366.1856" font-family="monospace" font-size="10" fill="#212121">:set nu  numbers</ns0:text>
  <ns0:text x="719.1753" y="378.0619" font-family="monospace" font-size="10" fill="#212121">:10      goto line</ns0:text>
  <ns0:text x="719.1753" y="389.9381" font-family="monospace" font-size="10" fill="#212121">:%s/a/b  replace</ns0:text>
  <ns0:text x="719.1753" y="401.8144" font-family="monospace" font-size="10" fill="#212121">/pattern search</ns0:text>
  <ns0:text x="719.1753" y="413.6907" font-family="monospace" font-size="10" fill="#212121">n / N    next/prev</ns0:text>
  <ns0:text x="719.1753" y="428.866" font-family="sans-serif" font-size="10" fill="#555555">Enter to execute</ns0:text>
  <ns0:text x="719.1753" y="440.0825" font-family="sans-serif" font-size="10" fill="#555555">Esc to cancel</ns0:text>

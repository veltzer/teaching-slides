<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#4a148c" />
    </marker>
  </defs>
  <rect width="654.5223" height="368.1687" fill="var(--bg)" rx="4.65" />
  <circle cx="471.2559" cy="207.1972" r="51.1346" fill="url(#grad-primary)" filter="url(#shadow)" />
  <text x="471.2559" y="203.1065" text-anchor="middle" font-family="sans-serif" font-size="11.2496" font-weight="bold" fill="var(--bg)">NORMAL</text>
  <text x="471.2559" y="214.8674" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--primary-accent)">MODE</text>
  <text x="471.2559" y="224.0716" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--primary-accent)">Default / hub</text>
  <text x="471.2559" y="233.2758" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--primary-accent)">h j k l · dd · yy · p</text>
  <circle cx="256.4909" cy="207.1972" r="46.0211" fill="var(--ok-accent)" filter="url(#shadow)" />
  <text x="256.4909" y="203.1065" text-anchor="middle" font-family="sans-serif" font-size="10.2269" font-weight="bold" fill="var(--bg)">INSERT</text>
  <text x="256.4909" y="213.3333" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--ok-accent)">MODE</text>
  <text x="256.4909" y="223.5602" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--ok-accent)">Type text freely</text>
  <text x="256.4909" y="233.7871" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--ok-accent)">-- INSERT --</text>
  <circle cx="686.021" cy="207.1972" r="46.0211" fill="var(--info-accent)" filter="url(#shadow)" />
  <text x="686.021" y="203.1065" text-anchor="middle" font-family="sans-serif" font-size="10.2269" font-weight="bold" fill="var(--bg)">VISUAL</text>
  <text x="686.021" y="213.3333" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--info-accent)">MODE</text>
  <text x="686.021" y="223.5602" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--info-accent)">Select text ranges</text>
  <text x="686.021" y="233.7871" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--info-accent)">-- VISUAL --</text>
  <circle cx="471.2559" cy="350.374" r="46.0211" fill="var(--danger-accent)" filter="url(#shadow)" />
  <text x="471.2559" y="346.2832" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="var(--bg)">COMMAND</text>
  <text x="471.2559" y="356.5101" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--danger-accent)">MODE</text>
  <text x="471.2559" y="366.737" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--warn-accent)">:w  :q  :s  :%s</text>
  <text x="471.2559" y="376.9639" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--warn-accent)">Colon prompt at bottom</text>
  <path d="M 420.1215 189.3001 Q 338.3061 161.1761 302.5119 191.8568" stroke="var(--ok-border)" stroke-width="1.4575" fill="none" marker-end="url(#arrow-ok)" />
  <text x="351.0898" y="168.8463" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="var(--ok-accent)">i  a  I  A  o  O</text>
  <text x="351.0898" y="177.5392" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">enter insert before/after</text>
  <path d="M 302.5119 222.5375 Q 338.3061 253.2183 420.1215 225.0943" stroke="var(--primary-border)" stroke-width="1.4575" fill="none" marker-end="url(#arrow-primary)" />
  <text x="351.0898" y="255.775" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="var(--primary-accent)">Esc</text>
  <text x="351.0898" y="264.4679" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">return to normal</text>
  <path d="M 522.3905 189.3001 Q 604.2058 161.1761 640 191.8568" stroke="var(--info-border)" stroke-width="1.4575" fill="none" marker-end="url(#arrow-purple)" />
  <text x="593.9789" y="168.8463" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="var(--info-accent)">v  V  Ctrl+v</text>
  <text x="593.9789" y="177.5392" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">char / line / block select</text>
  <path d="M 640 222.5375 Q 604.2058 253.2183 522.3905 225.0943" stroke="var(--primary-border)" stroke-width="1.4575" fill="none" marker-end="url(#arrow-primary)" />
  <text x="593.9789" y="255.775" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="var(--primary-accent)">Esc</text>
  <text x="593.9789" y="264.4679" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">cancel selection</text>
  <path d="M 445.6887 255.775 Q 420.1215 296.6827 445.6887 304.3528" stroke="var(--danger-border)" stroke-width="1.4575" fill="none" marker-end="url(#arrow-warn)" />
  <text x="394.5541" y="286.4557" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="var(--danger-accent)">:  /  ?  !</text>
  <text x="394.5541" y="295.1486" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">colon / search / shell</text>
  <path d="M 496.8232 304.3528 Q 522.3905 296.6827 496.8232 255.775" stroke="var(--primary-border)" stroke-width="1.4575" fill="none" marker-end="url(#arrow-primary)" />
  <text x="547.9578" y="286.4557" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="var(--primary-accent)">Enter / Esc</text>
  <text x="547.9578" y="295.1486" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">execute or cancel</text>
  <rect x="156.7785" y="273.6721" width="94.599" height="140.62" rx="4.65" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.4727" filter="url(#shadow)" />
  <text x="203.8223" y="285.4331" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="var(--ok-accent)">Enter Insert</text>
  <text x="169.5621" y="296.6827" font-family="monospace" font-size="10" fill="var(--text)">i    before cursor</text>
  <text x="169.5621" y="305.8869" font-family="monospace" font-size="10" fill="var(--text)">a    after cursor</text>
  <text x="169.5621" y="315.0911" font-family="monospace" font-size="10" fill="var(--text)">I    line start</text>
  <text x="169.5621" y="324.2953" font-family="monospace" font-size="10" fill="var(--text)">A    line end</text>
  <text x="169.5621" y="333.4995" font-family="monospace" font-size="10" fill="var(--text)">o    new line below</text>
  <text x="169.5621" y="342.7038" font-family="monospace" font-size="10" fill="var(--text)">O    new line above</text>
  <text x="169.5621" y="351.908" font-family="monospace" font-size="10" fill="var(--text)">s    sub char</text>
  <text x="169.5621" y="361.1122" font-family="monospace" font-size="10" fill="var(--text)">S    sub line</text>
  <text x="169.5621" y="370.3164" font-family="monospace" font-size="10" fill="var(--text)">R    replace mode</text>
  <text x="169.5621" y="379.5206" font-family="monospace" font-size="10" fill="var(--text)">cw   change word</text>
  <text x="169.5621" y="391.2816" font-family="sans-serif" font-size="10" fill="var(--text-muted)">All enter Insert mode</text>
  <text x="169.5621" y="399.9745" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Esc to return</text>
  <rect x="691.1346" y="273.6721" width="94.599" height="140.62" rx="4.65" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.4727" filter="url(#shadow)" />
  <text x="738.1783" y="285.4331" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="var(--danger-accent)">Command Mode</text>
  <text x="701.3615" y="296.6827" font-family="monospace" font-size="10" fill="var(--text)">:w       save</text>
  <text x="701.3615" y="305.8869" font-family="monospace" font-size="10" fill="var(--text)">:q!      quit</text>
  <text x="701.3615" y="315.0911" font-family="monospace" font-size="10" fill="var(--text)">:wq      save+quit</text>
  <text x="701.3615" y="324.2953" font-family="monospace" font-size="10" fill="var(--text)">:x       save+quit</text>
  <text x="701.3615" y="333.4995" font-family="monospace" font-size="10" fill="var(--text)">:e file  open</text>
  <text x="701.3615" y="342.7038" font-family="monospace" font-size="10" fill="var(--text)">:set nu  numbers</text>
  <text x="701.3615" y="351.908" font-family="monospace" font-size="10" fill="var(--text)">:10      goto line</text>
  <text x="701.3615" y="361.1122" font-family="monospace" font-size="10" fill="var(--text)">:%s/a/b  replace</text>
  <text x="701.3615" y="370.3164" font-family="monospace" font-size="10" fill="var(--text)">/pattern search</text>
  <text x="701.3615" y="379.5206" font-family="monospace" font-size="10" fill="var(--text)">n / N    next/prev</text>
  <text x="701.3615" y="391.2816" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Enter to execute</text>
  <text x="701.3615" y="399.9745" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Esc to cancel</text>
</svg>
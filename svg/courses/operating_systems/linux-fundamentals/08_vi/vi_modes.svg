  <text x="402.161" y="200.7244" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">enter insert before/after</text>
  <path d="M 362.1703 237.7683 Q 391.637 263.0256 458.9898 239.8731" stroke="var(--primary-border)" stroke-width="0.9942" fill="none" marker-end="url(#arrow-primary)" />
  <text x="402.161" y="265.1303" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="var(--primary-accent)">Esc</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#4a148c" />
    </marker>
  </defs>
  <rect width="888.889" height="500" fill="var(--bg)" rx="6.3151"/>
  <circle cx="639.9999" cy="281.3889" r="69.4445" fill="url(#grad-primary)" filter="url(#shadow)" />
  <text x="639.9999" y="275.8334" text-anchor="middle" font-family="sans-serif" font-size="15.2778" font-weight="bold" fill="var(--bg)">NORMAL</text>
  <text x="639.9999" y="291.8056" text-anchor="middle" font-family="sans-serif" font-size="10.5252" fill="var(--primary-accent)">MODE</text>
  <text x="639.9999" y="304.3056" text-anchor="middle" font-family="sans-serif" font-size="10.5252" fill="var(--primary-accent)">Default / hub</text>
  <text x="639.9999" y="316.8056" text-anchor="middle" font-family="monospace" font-size="10.5252" fill="var(--primary-accent)">h j k l · dd · yy · p</text>
  <circle cx="348.3333" cy="281.3889" r="62.5" fill="var(--ok-accent)" filter="url(#shadow)" />
  <text x="348.3333" y="275.8334" text-anchor="middle" font-family="sans-serif" font-size="13.8889" font-weight="bold" fill="var(--bg)">INSERT</text>
  <text x="348.3333" y="289.7222" text-anchor="middle" font-family="sans-serif" font-size="10.5252" fill="var(--ok-accent)">MODE</text>
  <text x="348.3333" y="303.6111" text-anchor="middle" font-family="sans-serif" font-size="10.5252" fill="var(--ok-accent)">Type text freely</text>
  <text x="348.3333" y="317.5" text-anchor="middle" font-family="monospace" font-size="10.5252" fill="var(--ok-accent)">-- INSERT --</text>
  <circle cx="931.6666" cy="281.3889" r="62.5" fill="var(--info-accent)" filter="url(#shadow)" />
  <text x="931.6666" y="275.8334" text-anchor="middle" font-family="sans-serif" font-size="13.8889" font-weight="bold" fill="var(--bg)">VISUAL</text>
  <text x="931.6666" y="289.7222" text-anchor="middle" font-family="sans-serif" font-size="10.5252" fill="var(--info-accent)">MODE</text>
  <text x="931.6666" y="303.6111" text-anchor="middle" font-family="sans-serif" font-size="10.5252" fill="var(--info-accent)">Select text ranges</text>
  <text x="931.6666" y="317.5" text-anchor="middle" font-family="monospace" font-size="10.5252" fill="var(--info-accent)">-- VISUAL --</text>
  <circle cx="639.9999" cy="475.8334" r="62.5" fill="var(--danger-accent)" filter="url(#shadow)" />
  <text x="639.9999" y="470.2778" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="var(--bg)">COMMAND</text>
  <text x="639.9999" y="484.1667" text-anchor="middle" font-family="sans-serif" font-size="10.5252" fill="var(--danger-accent)">MODE</text>
  <text x="639.9999" y="498.0556" text-anchor="middle" font-family="sans-serif" font-size="10.5252" fill="var(--warn-accent)">:w  :q  :s  :%s</text>
  <text x="639.9999" y="511.9445" text-anchor="middle" font-family="monospace" font-size="10.5252" fill="var(--warn-accent)">Colon prompt at bottom</text>
  <path d="M 570.5556 257.0833 Q 459.4444 218.8889 410.8333 260.5556" stroke="var(--ok-border)" stroke-width="1.9794" fill="none" marker-end="url(#arrow-ok)" />
  <text x="476.8055" y="229.3056" text-anchor="middle" font-family="monospace" font-size="11.1111" font-weight="bold" fill="var(--ok-accent)">i  a  I  A  o  O</text>
  <text x="476.8055" y="241.1112" text-anchor="middle" font-family="sans-serif" font-size="10.5252" fill="var(--text-muted)">enter insert before/after</text>
  <path d="M 410.8333 302.2222 Q 459.4444 343.8889 570.5556 305.6945" stroke="var(--primary-border)" stroke-width="1.9794" fill="none" marker-end="url(#arrow-primary)" />
  <text x="476.8055" y="347.3611" text-anchor="middle" font-family="monospace" font-size="11.1111" font-weight="bold" fill="var(--primary-accent)">Esc</text>
  <text x="476.8055" y="359.1667" text-anchor="middle" font-family="sans-serif" font-size="10.5252" fill="var(--text-muted)">return to normal</text>
  <path d="M 709.4444 257.0833 Q 820.5555 218.8889 869.1667 260.5556" stroke="var(--info-border)" stroke-width="1.9794" fill="none" marker-end="url(#arrow-purple)" />
  <text x="806.6667" y="229.3056" text-anchor="middle" font-family="monospace" font-size="11.1111" font-weight="bold" fill="var(--info-accent)">v  V  Ctrl+v</text>
  <text x="806.6667" y="241.1112" text-anchor="middle" font-family="sans-serif" font-size="10.5252" fill="var(--text-muted)">char / line / block select</text>
  <path d="M 869.1667 302.2222 Q 820.5555 343.8889 709.4444 305.6945" stroke="var(--primary-border)" stroke-width="1.9794" fill="none" marker-end="url(#arrow-primary)" />
  <text x="806.6667" y="347.3611" text-anchor="middle" font-family="monospace" font-size="11.1111" font-weight="bold" fill="var(--primary-accent)">Esc</text>
  <text x="806.6667" y="359.1667" text-anchor="middle" font-family="sans-serif" font-size="10.5252" fill="var(--text-muted)">cancel selection</text>
  <path d="M 605.2778 347.3611 Q 570.5556 402.9167 605.2778 413.3333" stroke="var(--danger-border)" stroke-width="1.9794" fill="none" marker-end="url(#arrow-warn)" />
  <text x="535.8333" y="389.0278" text-anchor="middle" font-family="monospace" font-size="11.1111" font-weight="bold" fill="var(--danger-accent)">:  /  ?  !</text>
  <text x="535.8333" y="400.8333" text-anchor="middle" font-family="sans-serif" font-size="10.5252" fill="var(--text-muted)">colon / search / shell</text>
  <path d="M 674.7222 413.3333 Q 709.4444 402.9167 674.7222 347.3611" stroke="var(--primary-border)" stroke-width="1.9794" fill="none" marker-end="url(#arrow-primary)" />
  <text x="744.1667" y="389.0278" text-anchor="middle" font-family="monospace" font-size="11.1111" font-weight="bold" fill="var(--primary-accent)">Enter / Esc</text>
  <text x="744.1667" y="400.8333" text-anchor="middle" font-family="sans-serif" font-size="10.5252" fill="var(--text-muted)">execute or cancel</text>
  <rect x="212.9166" y="371.6667" width="128.4723" height="190.9722" rx="6.3151" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="276.8055" y="387.639" text-anchor="middle" font-family="sans-serif" font-size="10.5252" font-weight="bold" fill="var(--ok-accent)">Enter Insert</text>
  <text x="230.2777" y="402.9167" font-family="monospace" font-size="10.5252" fill="var(--text)">i    before cursor</text>
  <text x="230.2777" y="415.4167" font-family="monospace" font-size="10.5252" fill="var(--text)">a    after cursor</text>
  <text x="230.2777" y="427.9167" font-family="monospace" font-size="10.5252" fill="var(--text)">I    line start</text>
  <text x="230.2777" y="440.4167" font-family="monospace" font-size="10.5252" fill="var(--text)">A    line end</text>
  <text x="230.2777" y="452.9167" font-family="monospace" font-size="10.5252" fill="var(--text)">o    new line below</text>
  <text x="230.2777" y="465.4167" font-family="monospace" font-size="10.5252" fill="var(--text)">O    new line above</text>
  <text x="230.2777" y="477.9168" font-family="monospace" font-size="10.5252" fill="var(--text)">s    sub char</text>
  <text x="230.2777" y="490.4167" font-family="monospace" font-size="10.5252" fill="var(--text)">S    sub line</text>
  <text x="230.2777" y="502.9167" font-family="monospace" font-size="10.5252" fill="var(--text)">R    replace mode</text>
  <text x="230.2777" y="515.4167" font-family="monospace" font-size="10.5252" fill="var(--text)">cw   change word</text>
  <text x="230.2777" y="531.389" font-family="sans-serif" font-size="10.5252" fill="var(--text-muted)">All enter Insert mode</text>
  <text x="230.2777" y="543.1945" font-family="sans-serif" font-size="10.5252" fill="var(--text-muted)">Esc to return</text>
  <rect x="938.6112" y="371.6667" width="128.4723" height="190.9722" rx="6.3151" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1002.5" y="387.639" text-anchor="middle" font-family="sans-serif" font-size="10.5252" font-weight="bold" fill="var(--danger-accent)">Command Mode</text>
  <text x="952.5001" y="402.9167" font-family="monospace" font-size="10.5252" fill="var(--text)">:w       save</text>
  <text x="952.5001" y="415.4167" font-family="monospace" font-size="10.5252" fill="var(--text)">:q!      quit</text>
  <text x="952.5001" y="427.9167" font-family="monospace" font-size="10.5252" fill="var(--text)">:wq      save+quit</text>
  <text x="952.5001" y="440.4167" font-family="monospace" font-size="10.5252" fill="var(--text)">:x       save+quit</text>
  <text x="952.5001" y="452.9167" font-family="monospace" font-size="10.5252" fill="var(--text)">:e file  open</text>
  <text x="952.5001" y="465.4167" font-family="monospace" font-size="10.5252" fill="var(--text)">:set nu  numbers</text>
  <text x="952.5001" y="477.9168" font-family="monospace" font-size="10.5252" fill="var(--text)">:10      goto line</text>
  <text x="952.5001" y="490.4167" font-family="monospace" font-size="10.5252" fill="var(--text)">:%s/a/b  replace</text>
  <text x="952.5001" y="502.9167" font-family="monospace" font-size="10.5252" fill="var(--text)">/pattern search</text>
  <text x="952.5001" y="515.4167" font-family="monospace" font-size="10.5252" fill="var(--text)">n / N    next/prev</text>
  <text x="952.5001" y="531.389" font-family="sans-serif" font-size="10.5252" fill="var(--text-muted)">Enter to execute</text>
  <text x="952.5001" y="543.1945" font-family="sans-serif" font-size="10.5252" fill="var(--text-muted)">Esc to cancel</text>
</svg>
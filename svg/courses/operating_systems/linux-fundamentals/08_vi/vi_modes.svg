  <path d="M 640 237.7683 Q 610.5332 263.0256 543.1805 239.8731" stroke="var(--primary-border)" stroke-width="0.9942" fill="none" marker-end="url(#arrow-primary)" />
  <text x="602.1142" y="265.1303" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="var(--primary-accent)">Esc</text>
  <text x="602.1142" y="272.2866" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">cancel selection</text>
  <path d="M 480.0374 265.1303 Q 458.9898 298.8067 480.0374 305.121" stroke="var(--danger-border)" stroke-width="0.9942" fill="none" marker-end="url(#arrow-warn)" />
  <text x="437.942" y="290.3876" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="var(--danger-accent)">:  /  ?  !</text>
  <text x="437.942" y="297.5438" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">colon / search / shell</text>
  <path d="M 522.1328 305.121 Q 543.1805 298.8067 522.1328 265.1303" stroke="var(--primary-border)" stroke-width="0.9942" fill="none" marker-end="url(#arrow-primary)" />
  <text x="564.2283" y="290.3876" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="var(--primary-accent)">Enter / Esc</text>
  <text x="564.2283" y="297.5438" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">execute or cancel</text>
  <rect x="242.1984" y="279.8637" width="77.8765" height="115.7624" rx="4.9394" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.3642" filter="url(#shadow)" />
  <text x="280.9262" y="289.5457" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="var(--ok-accent)">Enter Insert</text>
  <text x="252.7222" y="298.8067" font-family="monospace" font-size="10" fill="var(--text)">i    before cursor</text>
  <text x="252.7222" y="306.3839" font-family="monospace" font-size="10" fill="var(--text)">a    after cursor</text>
  <text x="252.7222" y="313.961" font-family="monospace" font-size="10" fill="var(--text)">I    line start</text>
  <text x="252.7222" y="321.5382" font-family="monospace" font-size="10" fill="var(--text)">A    line end</text>
  <text x="252.7222" y="329.1154" font-family="monospace" font-size="10" fill="var(--text)">o    new line below</text>
  <text x="252.7222" y="336.6926" font-family="monospace" font-size="10" fill="var(--text)">O    new line above</text>
  <text x="252.7222" y="344.2698" font-family="monospace" font-size="10" fill="var(--text)">s    sub char</text>
  <text x="252.7222" y="351.8469" font-family="monospace" font-size="10" fill="var(--text)">S    sub line</text>
  <text x="252.7222" y="359.4241" font-family="monospace" font-size="10" fill="var(--text)">R    replace mode</text>
  <text x="252.7222" y="367.0012" font-family="monospace" font-size="10" fill="var(--text)">cw   change word</text>
  <text x="252.7222" y="376.6832" font-family="sans-serif" font-size="10" fill="var(--text-muted)">All enter Insert mode</text>
  <text x="252.7222" y="383.8395" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Esc to return</text>
  <rect x="682.0954" y="279.8637" width="77.8765" height="115.7624" rx="4.9394" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.3642" filter="url(#shadow)" />
  <text x="720.8231" y="289.5457" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="var(--danger-accent)">Command Mode</text>
  <text x="690.5146" y="298.8067" font-family="monospace" font-size="10" fill="var(--text)">:w       save</text>
  <text x="690.5146" y="306.3839" font-family="monospace" font-size="10" fill="var(--text)">:q!      quit</text>
  <text x="690.5146" y="313.961" font-family="monospace" font-size="10" fill="var(--text)">:wq      save+quit</text>
  <text x="690.5146" y="321.5382" font-family="monospace" font-size="10" fill="var(--text)">:x       save+quit</text>
  <text x="690.5146" y="329.1154" font-family="monospace" font-size="10" fill="var(--text)">:e file  open</text>
  <text x="690.5146" y="336.6926" font-family="monospace" font-size="10" fill="var(--text)">:set nu  numbers</text>
  <text x="690.5146" y="344.2698" font-family="monospace" font-size="10" fill="var(--text)">:10      goto line</text>
  <text x="690.5146" y="351.8469" font-family="monospace" font-size="10" fill="var(--text)">:%s/a/b  replace</text>
  <text x="690.5146" y="359.4241" font-family="monospace" font-size="10" fill="var(--text)">/pattern search</text>
  <text x="690.5146" y="367.0012" font-family="monospace" font-size="10" fill="var(--text)">n / N    next/prev</text>
  <text x="690.5146" y="376.6832" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Enter to execute</text>
  <text x="690.5146" y="383.8395" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Esc to cancel</text>

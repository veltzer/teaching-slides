  <text x="677.8858" y="230.1912" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--info-accent)">MODE</text>
  <text x="677.8858" y="238.6102" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--info-accent)">Select text ranges</text>
  <text x="677.8858" y="247.0293" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--info-accent)">-- VISUAL --</text>
  <circle cx="501.0851" cy="343.007" r="37.8859" fill="var(--danger-accent)" filter="url(#shadow)" />
  <text x="501.0851" y="339.6393" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="var(--bg)">COMMAND</text>
  <text x="501.0851" y="348.0583" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--danger-accent)">MODE</text>
  <text x="501.0851" y="356.4774" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--warn-accent)">:w  :q  :s  :%s</text>
  <text x="501.0851" y="364.8965" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--warn-accent)">Colon prompt at bottom</text>
  <path d="M 458.9898 210.4063 Q 391.637 187.2539 362.1703 212.511" stroke="var(--ok-border)" stroke-width="0.9942" fill="none" marker-end="url(#arrow-ok)" />

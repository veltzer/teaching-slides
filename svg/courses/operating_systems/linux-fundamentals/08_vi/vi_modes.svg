<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- ── INSERT MODE (top-left) ── cx=255 cy=185 -->
  <rect x="40" y="40" width="375" height="206.440678" rx="6.157733" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="227.5" y="118.644068" text-anchor="middle" font-size="36.946398" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">INSERT</text>
  <text x="227.5" y="161.898305" text-anchor="middle" font-size="22.578354" fill="var(--ok-text)" font-family="Courier New, monospace">i a I A o O s cw</text>
  <text x="227.5" y="222.847458" text-anchor="middle" font-size="18.473199" fill="var(--ok-text)" font-family="Arial, sans-serif">type text freely</text>

  <!-- ── VISUAL MODE (top-right) ── cx=1025 cy=185 -->
  <rect x="865" y="40" width="375" height="206.440678" rx="6.157733" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1052.5" y="118.644068" text-anchor="middle" font-size="36.946398" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">VISUAL</text>
  <text x="1052.5" y="161.898305" text-anchor="middle" font-size="22.578354" fill="var(--info-text)" font-family="Courier New, monospace">v  V  Ctrl+v</text>
  <text x="1052.5" y="222.847458" text-anchor="middle" font-size="18.473199" fill="var(--info-text)" font-family="Arial, sans-serif">select text ranges</text>

  <!-- ── NORMAL MODE (centre) ── cx=640 cy=390 -->
  <rect x="415" y="202.20339" width="450" height="285.084746" rx="6.157733" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="285.762712" text-anchor="middle" font-size="43.104131" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">NORMAL</text>
  <text x="640" y="336.881356" text-anchor="middle" font-size="20.525777" fill="var(--primary-text)" font-family="Arial, sans-serif">default · hub mode</text>
  <text x="640" y="376.20339" text-anchor="middle" font-size="20.525777" fill="var(--primary-text)" font-family="Courier New, monospace">h j k l · dd · yy · p</text>
  <text x="640" y="415.525424" text-anchor="middle" font-size="20.525777" fill="var(--primary-text)" font-family="Courier New, monospace">u · Ctrl+r · gg · G</text>
  <text x="640" y="454.847458" text-anchor="middle" font-size="16.420621" fill="var(--primary-text)" font-family="Arial, sans-serif">always return here with Esc</text>

  <!-- ── COMMAND MODE (bottom-centre) ── cx=640 cy=585 -->
  <rect x="415" y="521.694915" width="450" height="98.305085" rx="6.157733" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="568.881356" text-anchor="middle" font-size="32.841243" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">COMMAND</text>
  <text x="640" y="602.305085" text-anchor="middle" font-size="20.525777" fill="var(--danger-text)" font-family="Courier New, monospace">:w  :q  :wq  :%s  /pat</text>

  <!-- ══ NORMAL → INSERT  top lane ══ -->
  <line x1="415" y1="266.101695" x2="416.071429" y2="266.101695" stroke="var(--ok-border)" stroke-width="0" marker-end="none"/>
  <path d="M 415 256.271186 Q 340 187.457627 415 143.220339" stroke="var(--ok-border)" stroke-width="2" fill="none" marker-end="url(#arrow-ok)"/>
  <text x="307.857143" y="195.322034" text-anchor="middle" font-size="18.473199" font-weight="bold" fill="var(--ok-accent)" font-family="Courier New, monospace">i a o O</text>

  <!-- ══ INSERT → NORMAL  bottom lane ══ -->
  <path d="M 415 221.864407 Q 340 275.932203 415 315.254237" stroke="var(--primary-border)" stroke-width="2" fill="none" marker-end="url(#arrow-primary)"/>
  <text x="288.571429" y="275.932203" text-anchor="middle" font-size="18.473199" font-weight="bold" fill="var(--primary-accent)" font-family="Courier New, monospace">Esc</text>

  <!-- ══ NORMAL → VISUAL  top lane ══ -->
  <path d="M 865 256.271186 Q 940 187.457627 865 143.220339" stroke="var(--info-border)" stroke-width="2" fill="none" marker-end="url(#arrow-info)"/>
  <text x="972.142857" y="195.322034" text-anchor="middle" font-size="18.473199" font-weight="bold" fill="var(--info-accent)" font-family="Courier New, monospace">v V Ctrl+v</text>

  <!-- ══ VISUAL → NORMAL  bottom lane ══ -->
  <path d="M 865 221.864407 Q 940 275.932203 865 315.254237" stroke="var(--primary-border)" stroke-width="2" fill="none" marker-end="url(#arrow-primary)"/>
  <text x="991.428571" y="275.932203" text-anchor="middle" font-size="18.473199" font-weight="bold" fill="var(--primary-accent)" font-family="Courier New, monospace">Esc</text>

  <!-- ══ NORMAL → COMMAND  left lane ══ -->
  <path d="M 575.714286 487.288136 Q 532.857143 506.949153 565 521.694915" stroke="var(--danger-border)" stroke-width="2" fill="none" marker-end="url(#arrow-danger)"/>
  <text x="455.714286" y="511.864407" text-anchor="middle" font-size="18.473199" font-weight="bold" fill="var(--danger-accent)" font-family="Courier New, monospace">:  /  ?</text>

  <!-- ══ COMMAND → NORMAL  right lane ══ -->
  <path d="M 715 521.694915 Q 757.857143 506.949153 725.714286 487.288136" stroke="var(--primary-border)" stroke-width="2" fill="none" marker-end="url(#arrow-primary)"/>
  <text x="830.714286" y="511.864407" text-anchor="middle" font-size="18.473199" font-weight="bold" fill="var(--primary-accent)" font-family="Courier New, monospace">Enter/Esc</text>

</svg>

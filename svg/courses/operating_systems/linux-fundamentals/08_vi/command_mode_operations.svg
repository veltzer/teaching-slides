<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="79.2" text-anchor="middle" font-size="27.7333" font-weight="bold" fill="#333">Command Mode (ex commands)</text>
  <rect x="64" y="144" width="341.3333" height="198" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="234.6667" y="216" text-anchor="middle" font-size="23.4667" font-weight="bold">Save/Quit</text>
  <text x="234.6667" y="280.8" text-anchor="middle" font-size="21.3333" font-family="monospace">:w :q :wq :q!</text>
  <rect x="469.3333" y="144" width="341.3333" height="198" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="216" text-anchor="middle" font-size="23.4667" font-weight="bold">Search/Replace</text>
  <text x="640" y="280.8" text-anchor="middle" font-size="21.3333" font-family="monospace">:%s/old/new/g</text>
  <rect x="874.6667" y="144" width="341.3333" height="198" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1045.3333" y="216" text-anchor="middle" font-size="23.4667" font-weight="bold">Settings</text>
  <text x="1045.3333" y="280.8" text-anchor="middle" font-size="21.3333" font-family="monospace">:set nu :set ai</text>
  <rect x="64" y="414" width="341.3333" height="198" fill="#fff3e0" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="234.6667" y="486" text-anchor="middle" font-size="23.4667" font-weight="bold">File Ops</text>
  <text x="234.6667" y="550.8" text-anchor="middle" font-size="21.3333" font-family="monospace">:e file :r file</text>
  <rect x="469.3333" y="414" width="341.3333" height="198" fill="#ffebee" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="486" text-anchor="middle" font-size="23.4667" font-weight="bold">External</text>
  <text x="640" y="550.8" text-anchor="middle" font-size="21.3333" font-family="monospace">:!command</text>
  <rect x="874.6667" y="414" width="341.3333" height="198" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1045.3333" y="486" text-anchor="middle" font-size="23.4667" font-weight="bold">Help</text>
  <text x="1045.3333" y="550.8" text-anchor="middle" font-size="21.3333" font-family="monospace">:help topic</text>
</svg>
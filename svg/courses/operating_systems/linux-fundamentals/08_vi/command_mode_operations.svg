<svg width="600" height="200" xmlns="http://www.w3.org/2000/svg">
  <text x="300" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Command Mode (ex commands)</text>
  <rect x="30" y="40" width="160" height="55" fill="#e3f2fd" stroke="#333" stroke-width="2" rx="5"/>
  <text x="110" y="60" text-anchor="middle" font-size="11" font-weight="bold">Save/Quit</text>
  <text x="110" y="78" text-anchor="middle" font-size="10" font-family="monospace">:w :q :wq :q!</text>
  <rect x="220" y="40" width="160" height="55" fill="#f3e5f5" stroke="#333" stroke-width="2" rx="5"/>
  <text x="300" y="60" text-anchor="middle" font-size="11" font-weight="bold">Search/Replace</text>
  <text x="300" y="78" text-anchor="middle" font-size="10" font-family="monospace">:%s/old/new/g</text>
  <rect x="410" y="40" width="160" height="55" fill="#e8f5e9" stroke="#333" stroke-width="2" rx="5"/>
  <text x="490" y="60" text-anchor="middle" font-size="11" font-weight="bold">Settings</text>
  <text x="490" y="78" text-anchor="middle" font-size="10" font-family="monospace">:set nu :set ai</text>
  <rect x="30" y="115" width="160" height="55" fill="#fff3e0" stroke="#333" stroke-width="2" rx="5"/>
  <text x="110" y="135" text-anchor="middle" font-size="11" font-weight="bold">File Ops</text>
  <text x="110" y="153" text-anchor="middle" font-size="10" font-family="monospace">:e file :r file</text>
  <rect x="220" y="115" width="160" height="55" fill="#ffebee" stroke="#333" stroke-width="2" rx="5"/>
  <text x="300" y="135" text-anchor="middle" font-size="11" font-weight="bold">External</text>
  <text x="300" y="153" text-anchor="middle" font-size="10" font-family="monospace">:!command</text>
  <rect x="410" y="115" width="160" height="55" fill="#e3f2fd" stroke="#333" stroke-width="2" rx="5"/>
  <text x="490" y="135" text-anchor="middle" font-size="11" font-weight="bold">Help</text>
  <text x="490" y="153" text-anchor="middle" font-size="10" font-family="monospace">:help topic</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="29.0458" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Visual Mode: Select Then Act</text>
  <rect x="40" y="108.2353" width="377.7778" height="246.4052" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="228.8889" y="184.0523" text-anchor="middle" font-size="24.5773" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">v (character)</text>
  <text x="228.8889" y="252.2876" text-anchor="middle" font-size="22.3429" font-family="Arial, sans-serif" fill="var(--primary-text)">select individual</text>
  <text x="228.8889" y="309.1503" text-anchor="middle" font-size="22.3429" font-family="Arial, sans-serif" fill="var(--primary-text)">characters</text>
  <rect x="451.1111" y="108.2353" width="377.7778" height="246.4052" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="184.0523" text-anchor="middle" font-size="24.5773" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">V (line)</text>
  <text x="640" y="252.2876" text-anchor="middle" font-size="22.3429" font-family="Arial, sans-serif" fill="var(--info-text)">select whole</text>
  <text x="640" y="309.1503" text-anchor="middle" font-size="22.3429" font-family="Arial, sans-serif" fill="var(--info-text)">lines</text>
  <rect x="862.2222" y="108.2353" width="377.7778" height="246.4052" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1051.1111" y="184.0523" text-anchor="middle" font-size="24.5773" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Ctrl-v (block)</text>
  <text x="1051.1111" y="252.2876" text-anchor="middle" font-size="22.3429" font-family="Arial, sans-serif" fill="var(--ok-text)">select rectangular</text>
  <text x="1051.1111" y="309.1503" text-anchor="middle" font-size="22.3429" font-family="Arial, sans-serif" fill="var(--ok-text)">block</text>
  <rect x="151.1111" y="411.5033" width="977.7778" height="208.4967" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="487.3203" text-anchor="middle" font-size="24.5773" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">After selecting, apply action:</text>
  <text x="640" y="563.1373" text-anchor="middle" font-size="22.3429" font-family="Courier New, monospace" fill="var(--warn-text)">d = delete | y = yank | c = change | &gt; = indent | = = auto-indent</text>
</svg>

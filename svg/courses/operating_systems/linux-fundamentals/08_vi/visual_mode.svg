<svg width="600" height="200" xmlns="http://www.w3.org/2000/svg">
  <text x="300" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Visual Mode: Select Then Act</text>
  <rect x="30" y="40" width="170" height="65" fill="#e3f2fd" stroke="#333" stroke-width="2" rx="5"/>
  <text x="115" y="60" text-anchor="middle" font-size="11" font-weight="bold">v (character)</text>
  <text x="115" y="78" text-anchor="middle" font-size="10">select individual</text>
  <text x="115" y="93" text-anchor="middle" font-size="10">characters</text>
  <rect x="215" y="40" width="170" height="65" fill="#f3e5f5" stroke="#333" stroke-width="2" rx="5"/>
  <text x="300" y="60" text-anchor="middle" font-size="11" font-weight="bold">V (line)</text>
  <text x="300" y="78" text-anchor="middle" font-size="10">select whole</text>
  <text x="300" y="93" text-anchor="middle" font-size="10">lines</text>
  <rect x="400" y="40" width="170" height="65" fill="#e8f5e9" stroke="#333" stroke-width="2" rx="5"/>
  <text x="485" y="60" text-anchor="middle" font-size="11" font-weight="bold">Ctrl-v (block)</text>
  <text x="485" y="78" text-anchor="middle" font-size="10">select rectangular</text>
  <text x="485" y="93" text-anchor="middle" font-size="10">block</text>
  <rect x="80" y="120" width="440" height="55" fill="#fff3e0" stroke="#333" stroke-width="1.5" rx="5"/>
  <text x="300" y="140" text-anchor="middle" font-size="11" font-weight="bold">After selecting, apply action:</text>
  <text x="300" y="160" text-anchor="middle" font-size="10" font-family="monospace">d = delete | y = yank | c = change | > = indent | = = auto-indent</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="90" text-anchor="middle" font-size="27.7333" font-weight="bold" fill="#333">vi: The Universal UNIX Editor</text>
  <rect x="64" y="162" width="341.3333" height="180" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="234.6667" y="241.2" text-anchor="middle" font-size="23.4667" font-weight="bold">Available</text>
  <text x="234.6667" y="298.8" text-anchor="middle" font-size="21.3333">on ALL UNIX systems</text>
  <rect x="469.3333" y="162" width="341.3333" height="180" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="241.2" text-anchor="middle" font-size="23.4667" font-weight="bold">Efficient</text>
  <text x="640" y="298.8" text-anchor="middle" font-size="21.3333">keyboard-only editing</text>
  <rect x="874.6667" y="162" width="341.3333" height="180" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1045.3333" y="241.2" text-anchor="middle" font-size="23.4667" font-weight="bold">Powerful</text>
  <text x="1045.3333" y="298.8" text-anchor="middle" font-size="21.3333">macros, regex, scripting</text>
  <rect x="213.3333" y="414" width="853.3333" height="198" fill="#fff3e0" stroke="#333" stroke-width="3.2" rx="10.6667" />
  <text x="640" y="493.2" text-anchor="middle" font-size="23.4667" font-weight="bold">vi vs vim</text>
  <text x="640" y="558" text-anchor="middle" font-size="21.3333">vim = "vi improved" -- most systems alias vi to vim</text>
</svg>
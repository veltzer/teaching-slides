<svg width="600" height="200" xmlns="http://www.w3.org/2000/svg">
  <text x="300" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">vi: The Universal UNIX Editor</text>
  <rect x="30" y="45" width="160" height="50" fill="#e3f2fd" stroke="#333" stroke-width="2" rx="5"/>
  <text x="110" y="67" text-anchor="middle" font-size="11" font-weight="bold">Available</text>
  <text x="110" y="83" text-anchor="middle" font-size="10">on ALL UNIX systems</text>
  <rect x="220" y="45" width="160" height="50" fill="#e8f5e9" stroke="#333" stroke-width="2" rx="5"/>
  <text x="300" y="67" text-anchor="middle" font-size="11" font-weight="bold">Efficient</text>
  <text x="300" y="83" text-anchor="middle" font-size="10">keyboard-only editing</text>
  <rect x="410" y="45" width="160" height="50" fill="#f3e5f5" stroke="#333" stroke-width="2" rx="5"/>
  <text x="490" y="67" text-anchor="middle" font-size="11" font-weight="bold">Powerful</text>
  <text x="490" y="83" text-anchor="middle" font-size="10">macros, regex, scripting</text>
  <rect x="100" y="115" width="400" height="55" fill="#fff3e0" stroke="#333" stroke-width="1.5" rx="5"/>
  <text x="300" y="137" text-anchor="middle" font-size="11" font-weight="bold">vi vs vim</text>
  <text x="300" y="155" text-anchor="middle" font-size="10">vim = "vi improved" -- most systems alias vi to vim</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="353.0435" y="40" width="782.6086" height="372.857142857143" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.272388201573" opacity="0.3" filter="url(#shadow)"/>
  <rect x="418.2608" y="185.000054642852" width="104.3478" height="144.999945357148" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.272388201573" filter="url(#shadow)"/>
  <text x="470.4348" y="280.285714285714" text-anchor="middle" font-size="32.89898973666" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">h</text>
  <text x="470.4348" y="392.14291178571" text-anchor="middle" font-size="25.306891057476" fill="var(--text-muted)" font-family="Arial, sans-serif">left</text>
  <rect x="561.7391" y="185.000054642852" width="104.3478" height="144.999945357148" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.272388201573" filter="url(#shadow)"/>
  <text x="613.913" y="280.285714285714" text-anchor="middle" font-size="32.89898973666" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">j</text>
  <text x="613.913" y="392.14291178571" text-anchor="middle" font-size="25.306891057476" fill="var(--text-muted)" font-family="Arial, sans-serif">down</text>
  <rect x="705.2173" y="185.000054642852" width="104.3478" height="144.999945357148" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.272388201573" filter="url(#shadow)"/>
  <text x="757.3913" y="280.285714285714" text-anchor="middle" font-size="32.89898973666" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">k</text>
  <text x="757.3913" y="392.14291178571" text-anchor="middle" font-size="25.306891057476" fill="var(--text-muted)" font-family="Arial, sans-serif">up</text>
  <rect x="848.6956" y="185.000054642852" width="104.3478" height="144.999945357148" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.272388201573" filter="url(#shadow)"/>
  <text x="900.8695" y="280.285714285714" text-anchor="middle" font-size="32.89898973666" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">l</text>
  <text x="900.8695" y="392.14291178571" text-anchor="middle" font-size="25.306891057476" fill="var(--text-muted)" font-family="Arial, sans-serif">right</text>
  <rect x="40" y="475.000054642852" width="208.6957" height="144.999945357148" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.272388201573" filter="url(#shadow)"/>
  <text x="144.3478" y="537.142857142857" text-anchor="middle" font-size="27.837695157008" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">w</text>
  <text x="144.3478" y="591.000054642852" text-anchor="middle" font-size="25.306891057476" font-family="Arial, sans-serif" fill="var(--primary-text)">next word</text>
  <rect x="287.8261" y="475.000054642852" width="208.6957" height="144.999945357148" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.272388201573" filter="url(#shadow)"/>
  <text x="392.1739" y="537.142857142857" text-anchor="middle" font-size="27.837695157008" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">b</text>
  <text x="392.1739" y="591.000054642852" text-anchor="middle" font-size="25.306891057476" font-family="Arial, sans-serif" fill="var(--info-text)">prev word</text>
  <rect x="535.6521" y="475.000054642852" width="208.6957" height="144.999945357148" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.272388201573" filter="url(#shadow)"/>
  <text x="640" y="537.142857142857" text-anchor="middle" font-size="27.837695157008" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">0 / $</text>
  <text x="640" y="591.000054642852" text-anchor="middle" font-size="25.306891057476" font-family="Arial, sans-serif" fill="var(--ok-text)">line start/end</text>
  <rect x="783.4782" y="475.000054642852" width="208.6957" height="144.999945357148" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.272388201573" filter="url(#shadow)"/>
  <text x="887.826" y="537.142857142857" text-anchor="middle" font-size="27.837695157008" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">gg / G</text>
  <text x="887.826" y="591.000054642852" text-anchor="middle" font-size="25.306891057476" font-family="Arial, sans-serif" fill="var(--warn-text)">file start/end</text>
  <rect x="1031.3043" y="475.000054642852" width="208.6957" height="144.999945357148" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.272388201573" filter="url(#shadow)"/>
  <text x="1135.6521" y="537.142857142857" text-anchor="middle" font-size="27.837695157008" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Ctrl-f/b</text>
  <text x="1135.6521" y="591.000054642852" text-anchor="middle" font-size="25.306891057476" font-family="Arial, sans-serif" fill="var(--danger-text)">page fwd/bk</text>
  <text x="744.3478" y="102.14291178571" text-anchor="middle" font-size="25.306891057476" fill="var(--text-muted)" font-family="Arial, sans-serif">Character movement (home row)</text>
</svg>

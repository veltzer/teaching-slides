<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="744.3478" y="40" text-anchor="middle" font-size="31.4703" font-weight="bold" fill="var(--text)">vi Navigation Keys</text>
  <rect x="353.0435" y="89.281" width="782.6086" height="341.1765" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" opacity="0.3" />
  <rect x="418.2608" y="221.9608" width="104.3478" height="132.6797" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="470.4348" y="309.1503" text-anchor="middle" font-size="31.4703" font-weight="bold">h</text>
  <text x="470.4348" y="411.5033" text-anchor="middle" font-size="24.2079" fill="var(--text-muted)">left</text>
  <rect x="561.7391" y="221.9608" width="104.3478" height="132.6797" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="613.913" y="309.1503" text-anchor="middle" font-size="31.4703" font-weight="bold">j</text>
  <text x="613.913" y="411.5033" text-anchor="middle" font-size="24.2079" fill="var(--text-muted)">down</text>
  <rect x="705.2173" y="221.9608" width="104.3478" height="132.6797" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="757.3913" y="309.1503" text-anchor="middle" font-size="31.4703" font-weight="bold">k</text>
  <text x="757.3913" y="411.5033" text-anchor="middle" font-size="24.2079" fill="var(--text-muted)">up</text>
  <rect x="848.6956" y="221.9608" width="104.3478" height="132.6797" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="900.8695" y="309.1503" text-anchor="middle" font-size="31.4703" font-weight="bold">l</text>
  <text x="900.8695" y="411.5033" text-anchor="middle" font-size="24.2079" fill="var(--text-muted)">right</text>
  <rect x="40" y="487.3203" width="208.6957" height="132.6797" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="144.3478" y="544.183" text-anchor="middle" font-size="26.6288" font-weight="bold">w</text>
  <text x="144.3478" y="593.4641" text-anchor="middle" font-size="24.2079">next word</text>
  <rect x="287.8261" y="487.3203" width="208.6957" height="132.6797" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="392.1739" y="544.183" text-anchor="middle" font-size="26.6288" font-weight="bold">b</text>
  <text x="392.1739" y="593.4641" text-anchor="middle" font-size="24.2079">prev word</text>
  <rect x="535.6521" y="487.3203" width="208.6957" height="132.6797" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="640" y="544.183" text-anchor="middle" font-size="26.6288" font-weight="bold">0 / $</text>
  <text x="640" y="593.4641" text-anchor="middle" font-size="24.2079">line start/end</text>
  <rect x="783.4782" y="487.3203" width="208.6957" height="132.6797" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="887.826" y="544.183" text-anchor="middle" font-size="26.6288" font-weight="bold">gg / G</text>
  <text x="887.826" y="593.4641" text-anchor="middle" font-size="24.2079">file start/end</text>
  <rect x="1031.3043" y="487.3203" width="208.6957" height="132.6797" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="1135.6521" y="544.183" text-anchor="middle" font-size="26.6288" font-weight="bold">Ctrl-f/b</text>
  <text x="1135.6521" y="593.4641" text-anchor="middle" font-size="24.2079">page fwd/bk</text>
  <text x="744.3478" y="146.1438" text-anchor="middle" font-size="24.2079" fill="var(--text-muted)">Character movement (home row)</text>
</svg>
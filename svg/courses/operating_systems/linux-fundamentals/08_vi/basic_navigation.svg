<svg width="600" height="200" xmlns="http://www.w3.org/2000/svg">
  <text x="300" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">vi Navigation Keys</text>
  <rect x="150" y="35" width="300" height="90" fill="#e3f2fd" stroke="#333" stroke-width="1" rx="5" opacity="0.3"/>
  <!-- h j k l keys -->
  <rect x="175" y="70" width="40" height="35" fill="#e3f2fd" stroke="#333" stroke-width="2" rx="4"/>
  <text x="195" y="93" text-anchor="middle" font-size="13" font-weight="bold">h</text>
  <text x="195" y="120" text-anchor="middle" font-size="10" fill="#666">left</text>
  <rect x="230" y="70" width="40" height="35" fill="#f3e5f5" stroke="#333" stroke-width="2" rx="4"/>
  <text x="250" y="93" text-anchor="middle" font-size="13" font-weight="bold">j</text>
  <text x="250" y="120" text-anchor="middle" font-size="10" fill="#666">down</text>
  <rect x="285" y="70" width="40" height="35" fill="#e8f5e9" stroke="#333" stroke-width="2" rx="4"/>
  <text x="305" y="93" text-anchor="middle" font-size="13" font-weight="bold">k</text>
  <text x="305" y="120" text-anchor="middle" font-size="10" fill="#666">up</text>
  <rect x="340" y="70" width="40" height="35" fill="#fff3e0" stroke="#333" stroke-width="2" rx="4"/>
  <text x="360" y="93" text-anchor="middle" font-size="13" font-weight="bold">l</text>
  <text x="360" y="120" text-anchor="middle" font-size="10" fill="#666">right</text>
  <!-- Word movement -->
  <rect x="30" y="140" width="80" height="35" fill="#e3f2fd" stroke="#333" stroke-width="1.5" rx="4"/>
  <text x="70" y="155" text-anchor="middle" font-size="11" font-weight="bold">w</text>
  <text x="70" y="168" text-anchor="middle" font-size="9">next word</text>
  <rect x="125" y="140" width="80" height="35" fill="#f3e5f5" stroke="#333" stroke-width="1.5" rx="4"/>
  <text x="165" y="155" text-anchor="middle" font-size="11" font-weight="bold">b</text>
  <text x="165" y="168" text-anchor="middle" font-size="9">prev word</text>
  <rect x="220" y="140" width="80" height="35" fill="#e8f5e9" stroke="#333" stroke-width="1.5" rx="4"/>
  <text x="260" y="155" text-anchor="middle" font-size="11" font-weight="bold">0 / $</text>
  <text x="260" y="168" text-anchor="middle" font-size="9">line start/end</text>
  <rect x="315" y="140" width="80" height="35" fill="#fff3e0" stroke="#333" stroke-width="1.5" rx="4"/>
  <text x="355" y="155" text-anchor="middle" font-size="11" font-weight="bold">gg / G</text>
  <text x="355" y="168" text-anchor="middle" font-size="9">file start/end</text>
  <rect x="410" y="140" width="80" height="35" fill="#ffebee" stroke="#333" stroke-width="1.5" rx="4"/>
  <text x="450" y="155" text-anchor="middle" font-size="11" font-weight="bold">Ctrl-f/b</text>
  <text x="450" y="168" text-anchor="middle" font-size="9">page fwd/bk</text>
  <text x="300" y="50" text-anchor="middle" font-size="10" fill="#666">Character movement (home row)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="632.0988" y="78.2222" text-anchor="middle" font-size="27.3909" font-weight="bold" fill="var(--text)">Copy, Cut, Paste: Register Model</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowreg" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="63.2099" y="142.2222" width="358.1893" height="248.8889" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="242.3045" y="213.3333" text-anchor="middle" font-size="23.177" font-weight="bold">Yank (copy)</text>
  <text x="242.3045" y="277.3333" text-anchor="middle" font-size="21.0699" font-family="monospace">yy  (line)</text>
  <text x="242.3045" y="330.6667" text-anchor="middle" font-size="21.0699" font-family="monospace">yw  (word)</text>
  <line x1="421.3992" y1="266.6667" x2="484.6091" y2="266.6667" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowreg)" />
  <rect x="484.6091" y="142.2222" width="294.9795" height="248.8889" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="632.0988" y="213.3333" text-anchor="middle" font-size="23.177" font-weight="bold">Register</text>
  <text x="632.0988" y="277.3333" text-anchor="middle" font-size="21.0699">"" (default)</text>
  <text x="632.0988" y="330.6667" text-anchor="middle" font-size="21.0699">"a-z (named)</text>
  <line x1="779.5884" y1="266.6667" x2="842.7983" y2="266.6667" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowreg)" />
  <rect x="842.7983" y="142.2222" width="358.1893" height="248.8889" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1021.893" y="213.3333" text-anchor="middle" font-size="23.177" font-weight="bold">Put (paste)</text>
  <text x="1021.893" y="277.3333" text-anchor="middle" font-size="21.0699" font-family="monospace">p  (after)</text>
  <text x="1021.893" y="330.6667" text-anchor="middle" font-size="21.0699" font-family="monospace">P  (before)</text>
  <rect x="63.2099" y="462.2222" width="358.1893" height="177.7778" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="242.3045" y="533.3333" text-anchor="middle" font-size="23.177" font-weight="bold">Delete (cut)</text>
  <text x="242.3045" y="597.3333" text-anchor="middle" font-size="21.0699" font-family="monospace">dd (line) dw (word)</text>
  <line x1="421.3992" y1="551.1111" x2="484.6091" y2="373.3333" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowreg)" />
  <rect x="484.6091" y="462.2222" width="716.3786" height="177.7778" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" opacity="0.7" />
  <text x="842.7983" y="533.3333" text-anchor="middle" font-size="21.0699">Delete also copies to register -- so dd + p = cut + paste</text>
  <text x="842.7983" y="597.3333" text-anchor="middle" font-size="21.0699" font-family="monospace">"ayy = yank to reg a | "ap = paste from reg a</text>
</svg>
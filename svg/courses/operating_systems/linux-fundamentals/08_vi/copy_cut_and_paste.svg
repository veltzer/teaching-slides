<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="79.2" text-anchor="middle" font-size="27.7333" font-weight="bold" fill="#333">Copy, Cut, Paste: Register Model</text>
  <defs>
    <marker id="arrowreg" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="64" y="144" width="362.6667" height="252" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="245.3333" y="216" text-anchor="middle" font-size="23.4667" font-weight="bold">Yank (copy)</text>
  <text x="245.3333" y="280.8" text-anchor="middle" font-size="21.3333" font-family="monospace">yy  (line)</text>
  <text x="245.3333" y="334.8" text-anchor="middle" font-size="21.3333" font-family="monospace">yw  (word)</text>
  <line x1="426.6667" y1="270" x2="490.6667" y2="270" stroke="#333" stroke-width="3.2" marker-end="url(#arrowreg)" />
  <rect x="490.6667" y="144" width="298.6667" height="252" fill="#fff3e0" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="216" text-anchor="middle" font-size="23.4667" font-weight="bold">Register</text>
  <text x="640" y="280.8" text-anchor="middle" font-size="21.3333">"" (default)</text>
  <text x="640" y="334.8" text-anchor="middle" font-size="21.3333">"a-z (named)</text>
  <line x1="789.3333" y1="270" x2="853.3333" y2="270" stroke="#333" stroke-width="3.2" marker-end="url(#arrowreg)" />
  <rect x="853.3333" y="144" width="362.6667" height="252" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1034.6667" y="216" text-anchor="middle" font-size="23.4667" font-weight="bold">Put (paste)</text>
  <text x="1034.6667" y="280.8" text-anchor="middle" font-size="21.3333" font-family="monospace">p  (after)</text>
  <text x="1034.6667" y="334.8" text-anchor="middle" font-size="21.3333" font-family="monospace">P  (before)</text>
  <rect x="64" y="468" width="362.6667" height="180" fill="#ffebee" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="245.3333" y="540" text-anchor="middle" font-size="23.4667" font-weight="bold">Delete (cut)</text>
  <text x="245.3333" y="604.8" text-anchor="middle" font-size="21.3333" font-family="monospace">dd (line) dw (word)</text>
  <line x1="426.6667" y1="558" x2="490.6667" y2="378" stroke="#333" stroke-width="3.2" marker-end="url(#arrowreg)" />
  <rect x="490.6667" y="468" width="725.3333" height="180" fill="#f3e5f5" stroke="#333" stroke-width="2.1333" rx="10.6667" opacity="0.7" />
  <text x="853.3333" y="540" text-anchor="middle" font-size="21.3333">Delete also copies to register -- so dd + p = cut + paste</text>
  <text x="853.3333" y="604.8" text-anchor="middle" font-size="21.3333" font-family="monospace">"ayy = yank to reg a | "ap = paste from reg a</text>
</svg>
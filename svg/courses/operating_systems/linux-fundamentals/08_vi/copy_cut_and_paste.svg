<svg width="600" height="200" xmlns="http://www.w3.org/2000/svg">
  <text x="300" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Copy, Cut, Paste: Register Model</text>
  <defs>
    <marker id="arrowreg" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
  <rect x="30" y="40" width="170" height="70" fill="#e3f2fd" stroke="#333" stroke-width="2" rx="5"/>
  <text x="115" y="60" text-anchor="middle" font-size="11" font-weight="bold">Yank (copy)</text>
  <text x="115" y="78" text-anchor="middle" font-size="10" font-family="monospace">yy  (line)</text>
  <text x="115" y="93" text-anchor="middle" font-size="10" font-family="monospace">yw  (word)</text>
  <line x1="200" y1="75" x2="230" y2="75" stroke="#333" stroke-width="1.5" marker-end="url(#arrowreg)"/>
  <rect x="230" y="40" width="140" height="70" fill="#fff3e0" stroke="#333" stroke-width="2" rx="5"/>
  <text x="300" y="60" text-anchor="middle" font-size="11" font-weight="bold">Register</text>
  <text x="300" y="78" text-anchor="middle" font-size="10">"" (default)</text>
  <text x="300" y="93" text-anchor="middle" font-size="10">"a-z (named)</text>
  <line x1="370" y1="75" x2="400" y2="75" stroke="#333" stroke-width="1.5" marker-end="url(#arrowreg)"/>
  <rect x="400" y="40" width="170" height="70" fill="#e8f5e9" stroke="#333" stroke-width="2" rx="5"/>
  <text x="485" y="60" text-anchor="middle" font-size="11" font-weight="bold">Put (paste)</text>
  <text x="485" y="78" text-anchor="middle" font-size="10" font-family="monospace">p  (after)</text>
  <text x="485" y="93" text-anchor="middle" font-size="10" font-family="monospace">P  (before)</text>
  <rect x="30" y="130" width="170" height="50" fill="#ffebee" stroke="#333" stroke-width="2" rx="5"/>
  <text x="115" y="150" text-anchor="middle" font-size="11" font-weight="bold">Delete (cut)</text>
  <text x="115" y="168" text-anchor="middle" font-size="10" font-family="monospace">dd (line) dw (word)</text>
  <line x1="200" y1="155" x2="230" y2="105" stroke="#333" stroke-width="1.5" marker-end="url(#arrowreg)"/>
  <rect x="230" y="130" width="340" height="50" fill="#f3e5f5" stroke="#333" stroke-width="1" rx="5" opacity="0.7"/>
  <text x="400" y="150" text-anchor="middle" font-size="10">Delete also copies to register -- so dd + p = cut + paste</text>
  <text x="400" y="168" text-anchor="middle" font-size="10" font-family="monospace">"ayy = yank to reg a | "ap = paste from reg a</text>
</svg>

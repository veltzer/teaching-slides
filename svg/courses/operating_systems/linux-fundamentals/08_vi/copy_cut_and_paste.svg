<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="377.7778" height="289.999943571434" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.374054245598" filter="url(#shadow)"/>
  <text x="228.8888" y="122.85722346938" text-anchor="middle" font-size="25.693069024344" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Yank (copy)</text>
  <text x="228.8888" y="197.428589163264" text-anchor="middle" font-size="23.357190611807" font-family="Courier New, monospace" fill="var(--primary-text)">yy  (line)</text>
  <text x="228.8888" y="259.571563193865" text-anchor="middle" font-size="23.357190611807" font-family="Courier New, monospace" fill="var(--primary-text)">yw  (word)</text>
  <line x1="417.7778" y1="185.000084642849" x2="484.4445" y2="185.000084642849" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="484.4445" y="40" width="311.1112" height="289.999943571434" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.374054245598" filter="url(#shadow)"/>
  <text x="640" y="122.85722346938" text-anchor="middle" font-size="25.693069024344" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Register</text>
  <text x="640" y="197.428589163264" text-anchor="middle" font-size="23.357190611807" font-family="Arial, sans-serif" fill="var(--warn-text)">"" (default)</text>
  <text x="640" y="259.571563193865" text-anchor="middle" font-size="23.357190611807" font-family="Arial, sans-serif" fill="var(--warn-text)">"a-z (named)</text>
  <line x1="795.5554" y1="185.000084642849" x2="862.2221" y2="185.000084642849" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="862.2221" y="40" width="377.7778" height="289.999943571434" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.374054245598" filter="url(#shadow)"/>
  <text x="1051.1111" y="122.85722346938" text-anchor="middle" font-size="25.693069024344" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Put (paste)</text>
  <text x="1051.1111" y="197.428589163264" text-anchor="middle" font-size="23.357190611807" font-family="Courier New, monospace" fill="var(--ok-text)">p  (after)</text>
  <text x="1051.1111" y="259.571563193865" text-anchor="middle" font-size="23.357190611807" font-family="Courier New, monospace" fill="var(--ok-text)">P  (before)</text>
  <rect x="40" y="412.857167040814" width="377.7778" height="207.142832959186" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.374054245598" filter="url(#shadow)"/>
  <text x="228.8888" y="495.714277653062" text-anchor="middle" font-size="25.693069024344" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Delete (cut)</text>
  <text x="228.8888" y="570.285643346946" text-anchor="middle" font-size="23.357190611807" font-family="Courier New, monospace" fill="var(--danger-text)">dd (line) dw (word)</text>
  <line x1="417.7778" y1="516.428527091841" x2="484.4445" y2="309.285694132655" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="484.4445" y="412.857167040814" width="755.5555" height="207.142832959186" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.374054245598" opacity="0.7" filter="url(#shadow)"/>
  <text x="862.2221" y="495.714277653062" text-anchor="middle" font-size="23.357190611807" font-family="Arial, sans-serif" fill="var(--info-text)">Delete also copies to register -- so dd + p = cut + paste</text>
  <text x="862.2221" y="570.285643346946" text-anchor="middle" font-size="23.357190611807" font-family="Courier New, monospace" fill="var(--info-text)">"ayy = yank to reg a | "ap = paste from reg a</text>
</svg>

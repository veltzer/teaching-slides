<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:text x="632.0988" y="78.2222" text-anchor="middle" font-size="27.3909" font-weight="bold" fill="#333">Copy, Cut, Paste: Register Model</ns0:text>
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arrowreg" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <ns0:path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect x="63.2099" y="142.2222" width="358.1893" height="248.8889" fill="#e3f2fd" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="242.3045" y="213.3333" text-anchor="middle" font-size="23.177" font-weight="bold">Yank (copy)</ns0:text>
  <ns0:text x="242.3045" y="277.3333" text-anchor="middle" font-size="21.0699" font-family="monospace">yy  (line)</ns0:text>
  <ns0:text x="242.3045" y="330.6667" text-anchor="middle" font-size="21.0699" font-family="monospace">yw  (word)</ns0:text>
  <ns0:line x1="421.3992" y1="266.6667" x2="484.6091" y2="266.6667" stroke="#333" stroke-width="3.1605" marker-end="url(#arrowreg)" />
  <ns0:rect x="484.6091" y="142.2222" width="294.9795" height="248.8889" fill="#fff3e0" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="632.0988" y="213.3333" text-anchor="middle" font-size="23.177" font-weight="bold">Register</ns0:text>
  <ns0:text x="632.0988" y="277.3333" text-anchor="middle" font-size="21.0699">"" (default)</ns0:text>
  <ns0:text x="632.0988" y="330.6667" text-anchor="middle" font-size="21.0699">"a-z (named)</ns0:text>
  <ns0:line x1="779.5884" y1="266.6667" x2="842.7983" y2="266.6667" stroke="#333" stroke-width="3.1605" marker-end="url(#arrowreg)" />
  <ns0:rect x="842.7983" y="142.2222" width="358.1893" height="248.8889" fill="#e8f5e9" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="1021.893" y="213.3333" text-anchor="middle" font-size="23.177" font-weight="bold">Put (paste)</ns0:text>
  <ns0:text x="1021.893" y="277.3333" text-anchor="middle" font-size="21.0699" font-family="monospace">p  (after)</ns0:text>
  <ns0:text x="1021.893" y="330.6667" text-anchor="middle" font-size="21.0699" font-family="monospace">P  (before)</ns0:text>
  <ns0:rect x="63.2099" y="462.2222" width="358.1893" height="177.7778" fill="#ffebee" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="242.3045" y="533.3333" text-anchor="middle" font-size="23.177" font-weight="bold">Delete (cut)</ns0:text>
  <ns0:text x="242.3045" y="597.3333" text-anchor="middle" font-size="21.0699" font-family="monospace">dd (line) dw (word)</ns0:text>
  <ns0:line x1="421.3992" y1="551.1111" x2="484.6091" y2="373.3333" stroke="#333" stroke-width="3.1605" marker-end="url(#arrowreg)" />
  <ns0:rect x="484.6091" y="462.2222" width="716.3786" height="177.7778" fill="#f3e5f5" stroke="#333" stroke-width="2.107" rx="10.535" opacity="0.7" />
  <ns0:text x="842.7983" y="533.3333" text-anchor="middle" font-size="21.0699">Delete also copies to register -- so dd + p = cut + paste</ns0:text>
  <ns0:text x="842.7983" y="597.3333" text-anchor="middle" font-size="21.0699" font-family="monospace">"ayy = yank to reg a | "ap = paste from reg a</ns0:text>
</ns0:svg>
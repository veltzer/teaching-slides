<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="79.2" text-anchor="middle" font-size="27.7333" font-weight="bold" fill="#333">Common vi Workflows</text>
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arrowtask" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="64" y="144" width="362.6667" height="198" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="245.3333" y="216" text-anchor="middle" font-size="21.3333" font-weight="bold">Edit config file</text>
  <text x="245.3333" y="280.8" text-anchor="middle" font-size="21.3333" font-family="monospace">vi /etc/conf -&gt; i -&gt; edit -&gt; :wq</text>
  <line x1="426.6667" y1="241.2" x2="458.6667" y2="241.2" stroke="#333" stroke-width="3.2" marker-end="url(#arrowtask)" />
  <rect x="458.6667" y="144" width="362.6667" height="198" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="216" text-anchor="middle" font-size="21.3333" font-weight="bold">Search and replace</text>
  <text x="640" y="280.8" text-anchor="middle" font-size="21.3333" font-family="monospace">:%s/old/new/gc</text>
  <line x1="821.3333" y1="241.2" x2="853.3333" y2="241.2" stroke="#333" stroke-width="3.2" marker-end="url(#arrowtask)" />
  <rect x="853.3333" y="144" width="362.6667" height="198" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1034.6667" y="216" text-anchor="middle" font-size="21.3333" font-weight="bold">Move lines</text>
  <text x="1034.6667" y="280.8" text-anchor="middle" font-size="21.3333" font-family="monospace">dd -&gt; move -&gt; p</text>
  <rect x="64" y="414" width="554.6667" height="216" fill="#fff3e0" stroke="#333" stroke-width="3.2" rx="10.6667" />
  <text x="341.3333" y="486" text-anchor="middle" font-size="21.3333" font-weight="bold">Recommended .vimrc settings</text>
  <text x="341.3333" y="547.2" text-anchor="middle" font-size="21.3333" font-family="monospace">set number ignorecase hlsearch</text>
  <text x="341.3333" y="594" text-anchor="middle" font-size="21.3333" font-family="monospace">set tabstop=4 expandtab autoindent</text>
  <rect x="661.3333" y="414" width="554.6667" height="216" fill="#ffebee" stroke="#333" stroke-width="3.2" rx="10.6667" />
  <text x="938.6667" y="486" text-anchor="middle" font-size="21.3333" font-weight="bold">Undo / Redo</text>
  <text x="938.6667" y="547.2" text-anchor="middle" font-size="21.3333" font-family="monospace">u = undo   Ctrl-r = redo</text>
  <text x="938.6667" y="594" text-anchor="middle" font-size="21.3333" font-family="monospace">. = repeat last change</text>
</svg>
<svg width="600" height="200" xmlns="http://www.w3.org/2000/svg">
  <text x="300" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Common vi Workflows</text>
  <defs>
    <marker id="arrowtask" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
  <rect x="30" y="40" width="170" height="55" fill="#e3f2fd" stroke="#333" stroke-width="2" rx="5"/>
  <text x="115" y="60" text-anchor="middle" font-size="10" font-weight="bold">Edit config file</text>
  <text x="115" y="78" text-anchor="middle" font-size="9" font-family="monospace">vi /etc/conf -> i -> edit -> :wq</text>
  <line x1="200" y1="67" x2="215" y2="67" stroke="#333" stroke-width="1.5" marker-end="url(#arrowtask)"/>
  <rect x="215" y="40" width="170" height="55" fill="#f3e5f5" stroke="#333" stroke-width="2" rx="5"/>
  <text x="300" y="60" text-anchor="middle" font-size="10" font-weight="bold">Search and replace</text>
  <text x="300" y="78" text-anchor="middle" font-size="9" font-family="monospace">:%s/old/new/gc</text>
  <line x1="385" y1="67" x2="400" y2="67" stroke="#333" stroke-width="1.5" marker-end="url(#arrowtask)"/>
  <rect x="400" y="40" width="170" height="55" fill="#e8f5e9" stroke="#333" stroke-width="2" rx="5"/>
  <text x="485" y="60" text-anchor="middle" font-size="10" font-weight="bold">Move lines</text>
  <text x="485" y="78" text-anchor="middle" font-size="9" font-family="monospace">dd -> move -> p</text>
  <rect x="30" y="115" width="260" height="60" fill="#fff3e0" stroke="#333" stroke-width="1.5" rx="5"/>
  <text x="160" y="135" text-anchor="middle" font-size="10" font-weight="bold">Recommended .vimrc settings</text>
  <text x="160" y="152" text-anchor="middle" font-size="9" font-family="monospace">set number ignorecase hlsearch</text>
  <text x="160" y="165" text-anchor="middle" font-size="9" font-family="monospace">set tabstop=4 expandtab autoindent</text>
  <rect x="310" y="115" width="260" height="60" fill="#ffebee" stroke="#333" stroke-width="1.5" rx="5"/>
  <text x="440" y="135" text-anchor="middle" font-size="10" font-weight="bold">Undo / Redo</text>
  <text x="440" y="152" text-anchor="middle" font-size="10" font-family="monospace">u = undo   Ctrl-r = redo</text>
  <text x="440" y="165" text-anchor="middle" font-size="10" font-family="monospace">. = repeat last change</text>
</svg>

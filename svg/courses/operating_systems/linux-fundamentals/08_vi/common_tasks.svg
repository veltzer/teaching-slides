<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <text x="640" y="40" text-anchor="middle" font-size="29.0458" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Common vi Workflows</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="108.2353" width="377.7778" height="208.4967" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="228.8889" y="184.0523" text-anchor="middle" font-size="22.3429" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Edit config file</text>
  <text x="228.8889" y="252.2876" text-anchor="middle" font-size="22.3429" font-family="Courier New, monospace" fill="var(--primary-text)">vi /etc/conf -&gt; i -&gt; edit -&gt; :wq</text>
  <line x1="417.7778" y1="210.5882" x2="451.1111" y2="210.5882" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="451.1111" y="108.2353" width="377.7778" height="208.4967" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="184.0523" text-anchor="middle" font-size="22.3429" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Search and replace</text>
  <text x="640" y="252.2876" text-anchor="middle" font-size="22.3429" font-family="Courier New, monospace" fill="var(--info-text)">:%s/old/new/gc</text>
  <line x1="828.8889" y1="210.5882" x2="862.2222" y2="210.5882" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="862.2222" y="108.2353" width="377.7778" height="208.4967" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1051.1111" y="184.0523" text-anchor="middle" font-size="22.3429" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Move lines</text>
  <text x="1051.1111" y="252.2876" text-anchor="middle" font-size="22.3429" font-family="Courier New, monospace" fill="var(--ok-text)">dd -&gt; move -&gt; p</text>
  <rect x="40" y="392.549" width="577.7778" height="227.451" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="328.8889" y="468.366" text-anchor="middle" font-size="22.3429" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Recommended .vimrc settings</text>
  <text x="328.8889" y="532.8105" text-anchor="middle" font-size="22.3429" font-family="Courier New, monospace" fill="var(--warn-text)">set number ignorecase hlsearch</text>
  <text x="328.8889" y="582.0915" text-anchor="middle" font-size="22.3429" font-family="Courier New, monospace" fill="var(--warn-text)">set tabstop=4 expandtab autoindent</text>
  <rect x="662.2222" y="392.549" width="577.7778" height="227.451" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="951.1111" y="468.366" text-anchor="middle" font-size="22.3429" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Undo / Redo</text>
  <text x="951.1111" y="532.8105" text-anchor="middle" font-size="22.3429" font-family="Courier New, monospace" fill="var(--danger-text)">u = undo   Ctrl-r = redo</text>
  <text x="951.1111" y="582.0915" text-anchor="middle" font-size="22.3429" font-family="Courier New, monospace" fill="var(--danger-text)">. = repeat last change</text>
</svg>

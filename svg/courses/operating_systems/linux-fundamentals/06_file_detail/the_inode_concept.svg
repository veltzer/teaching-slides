<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <text x="629.0909" y="40" text-anchor="middle" font-size="27.8837" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Inode Structure</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="86.2577" width="436.3636" height="533.7423" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="258.1818" y="157.4234" text-anchor="middle" font-size="23.594" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Inode #12345</text>
  <line x1="61.8182" y1="182.3313" x2="454.5454" y2="182.3313" stroke="var(--text)" stroke-width="2"/>
  <text x="72.7273" y="239.2638" font-size="21.449" font-family="Arial, sans-serif" fill="var(--primary-text)">Type: regular file</text>
  <text x="72.7273" y="292.638" font-size="21.449" font-family="Arial, sans-serif" fill="var(--primary-text)">Perms: rwxr-xr--</text>
  <text x="72.7273" y="346.0123" font-size="21.449" font-family="Arial, sans-serif" fill="var(--primary-text)">Owner: uid=1000</text>
  <text x="72.7273" y="399.3865" font-size="21.449" font-family="Arial, sans-serif" fill="var(--primary-text)">Size: 4096 bytes</text>
  <text x="72.7273" y="452.7607" font-size="21.449" font-family="Arial, sans-serif" fill="var(--primary-text)">Links: 2</text>
  <text x="72.7273" y="506.135" font-size="21.449" font-family="Arial, sans-serif" fill="var(--primary-text)">Timestamps: amc</text>
  <text x="72.7273" y="566.6258" font-size="21.449" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Block ptrs ---&gt;</text>
  <line x1="476.3636" y1="548.8343" x2="585.4545" y2="246.3804" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="476.3636" y1="548.8343" x2="585.4545" y2="388.7116" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="476.3636" y1="548.8343" x2="585.4545" y2="531.0429" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="585.4545" y="175.2148" width="283.6363" height="106.7485" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="727.2727" y="246.3804" text-anchor="middle" font-size="21.449" font-family="Arial, sans-serif" fill="var(--ok-text)">Data Block 0</text>
  <rect x="585.4545" y="317.546" width="283.6363" height="106.7485" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="727.2727" y="388.7116" text-anchor="middle" font-size="21.449" font-family="Arial, sans-serif" fill="var(--ok-text)">Data Block 1</text>
  <rect x="585.4545" y="459.8773" width="283.6363" height="106.7485" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="727.2727" y="531.0429" text-anchor="middle" font-size="21.449" font-family="Arial, sans-serif" fill="var(--ok-text)">Data Block 2</text>
  <rect x="934.5455" y="157.4234" width="305.4545" height="462.5766" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" opacity="0.7" filter="url(#shadow)"/>
  <text x="1087.2726" y="239.2638" text-anchor="middle" font-size="21.449" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Note:</text>
  <text x="1087.2726" y="303.3129" text-anchor="middle" font-size="21.449" font-family="Arial, sans-serif" fill="var(--warn-text)">Filename is NOT</text>
  <text x="1087.2726" y="360.2454" text-anchor="middle" font-size="21.449" font-family="Arial, sans-serif" fill="var(--warn-text)">stored in inode.</text>
  <text x="1087.2726" y="431.411" text-anchor="middle" font-size="21.449" font-family="Arial, sans-serif" fill="var(--warn-text)">It lives in the</text>
  <text x="1087.2726" y="488.3436" text-anchor="middle" font-size="21.449" font-family="Arial, sans-serif" fill="var(--warn-text)">parent directory</text>
  <text x="1087.2726" y="545.2761" text-anchor="middle" font-size="21.449" font-family="Arial, sans-serif" fill="var(--warn-text)">entry.</text>
</svg>

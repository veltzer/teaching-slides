<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="629.0909" y="40" text-anchor="middle" font-size="27.8837" font-weight="bold" fill="var(--text)">Inode Structure</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowinode" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="40" y="86.2577" width="436.3636" height="533.7423" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="258.1818" y="157.4234" text-anchor="middle" font-size="23.594" font-weight="bold">Inode #12345</text>
  <line x1="61.8182" y1="182.3313" x2="454.5454" y2="182.3313" stroke="var(--text)" stroke-width="2" />
  <text x="72.7273" y="239.2638" font-size="21.449">Type: regular file</text>
  <text x="72.7273" y="292.638" font-size="21.449">Perms: rwxr-xr--</text>
  <text x="72.7273" y="346.0123" font-size="21.449">Owner: uid=1000</text>
  <text x="72.7273" y="399.3865" font-size="21.449">Size: 4096 bytes</text>
  <text x="72.7273" y="452.7607" font-size="21.449">Links: 2</text>
  <text x="72.7273" y="506.135" font-size="21.449">Timestamps: amc</text>
  <text x="72.7273" y="566.6258" font-size="21.449" font-weight="bold">Block ptrs ---&gt;</text>
  <line x1="476.3636" y1="548.8343" x2="585.4545" y2="246.3804" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowinode)" />
  <line x1="476.3636" y1="548.8343" x2="585.4545" y2="388.7116" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowinode)" />
  <line x1="476.3636" y1="548.8343" x2="585.4545" y2="531.0429" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowinode)" />
  <rect x="585.4545" y="175.2148" width="283.6363" height="106.7485" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="727.2727" y="246.3804" text-anchor="middle" font-size="21.449">Data Block 0</text>
  <rect x="585.4545" y="317.546" width="283.6363" height="106.7485" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="727.2727" y="388.7116" text-anchor="middle" font-size="21.449">Data Block 1</text>
  <rect x="585.4545" y="459.8773" width="283.6363" height="106.7485" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="727.2727" y="531.0429" text-anchor="middle" font-size="21.449">Data Block 2</text>
  <rect x="934.5455" y="157.4234" width="305.4545" height="462.5766" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" opacity="0.7" />
  <text x="1087.2726" y="239.2638" text-anchor="middle" font-size="21.449" font-weight="bold">Note:</text>
  <text x="1087.2726" y="303.3129" text-anchor="middle" font-size="21.449">Filename is NOT</text>
  <text x="1087.2726" y="360.2454" text-anchor="middle" font-size="21.449">stored in inode.</text>
  <text x="1087.2726" y="431.411" text-anchor="middle" font-size="21.449">It lives in the</text>
  <text x="1087.2726" y="488.3436" text-anchor="middle" font-size="21.449">parent directory</text>
  <text x="1087.2726" y="545.2761" text-anchor="middle" font-size="21.449">entry.</text>
</svg>
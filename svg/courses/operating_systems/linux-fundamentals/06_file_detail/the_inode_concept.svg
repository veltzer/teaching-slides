<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="615.015" y="76.1081" text-anchor="middle" font-size="26.6506" font-weight="bold" fill="var(--text)">Inode Structure</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowinode" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="61.5015" y="121.0811" width="410.01" height="518.9189" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="266.5065" y="190.2703" text-anchor="middle" font-size="22.5506" font-weight="bold">Inode #12345</text>
  <line x1="82.002" y1="214.4865" x2="451.011" y2="214.4865" stroke="var(--text)" stroke-width="2" />
  <text x="92.2523" y="269.8378" font-size="20.5005">Type: regular file</text>
  <text x="92.2523" y="321.7297" font-size="20.5005">Perms: rwxr-xr--</text>
  <text x="92.2523" y="373.6216" font-size="20.5005">Owner: uid=1000</text>
  <text x="92.2523" y="425.5135" font-size="20.5005">Size: 4096 bytes</text>
  <text x="92.2523" y="477.4054" font-size="20.5005">Links: 2</text>
  <text x="92.2523" y="529.2973" font-size="20.5005">Timestamps: amc</text>
  <text x="92.2523" y="588.1081" font-size="20.5005" font-weight="bold">Block ptrs ---&gt;</text>
  <line x1="471.5115" y1="570.8108" x2="574.014" y2="276.7568" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowinode)" />
  <line x1="471.5115" y1="570.8108" x2="574.014" y2="415.1351" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowinode)" />
  <line x1="471.5115" y1="570.8108" x2="574.014" y2="553.5135" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowinode)" />
  <rect x="574.014" y="207.5676" width="266.5065" height="103.7838" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="707.2673" y="276.7568" text-anchor="middle" font-size="20.5005">Data Block 0</text>
  <rect x="574.014" y="345.9459" width="266.5065" height="103.7838" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="707.2673" y="415.1351" text-anchor="middle" font-size="20.5005">Data Block 1</text>
  <rect x="574.014" y="484.3243" width="266.5065" height="103.7838" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="707.2673" y="553.5135" text-anchor="middle" font-size="20.5005">Data Block 2</text>
  <rect x="902.0221" y="190.2703" width="287.007" height="449.7297" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" opacity="0.7" />
  <text x="1045.5255" y="269.8378" text-anchor="middle" font-size="20.5005" font-weight="bold">Note:</text>
  <text x="1045.5255" y="332.1081" text-anchor="middle" font-size="20.5005">Filename is NOT</text>
  <text x="1045.5255" y="387.4595" text-anchor="middle" font-size="20.5005">stored in inode.</text>
  <text x="1045.5255" y="456.6486" text-anchor="middle" font-size="20.5005">It lives in the</text>
  <text x="1045.5255" y="512" text-anchor="middle" font-size="20.5005">parent directory</text>
  <text x="1045.5255" y="567.3514" text-anchor="middle" font-size="20.5005">entry.</text>
</svg>
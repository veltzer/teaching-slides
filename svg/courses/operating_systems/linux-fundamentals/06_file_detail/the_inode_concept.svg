<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="436.3636" height="580" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.254598491769" filter="url(#shadow)"/>
  <text x="258.1818" y="117.333398533337" text-anchor="middle" font-size="24.5951661358" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Inode #12345</text>
  <line x1="61.8182" y1="144.399984786666" x2="454.5454" y2="144.399984786666" stroke="var(--text)" stroke-width="2"/>
  <text x="72.7273" y="206.266638413332" font-size="22.359147174993" font-family="Arial, sans-serif" fill="var(--primary-text)">Type: regular file</text>
  <text x="72.7273" y="264.26660581333" font-size="22.359147174993" font-family="Arial, sans-serif" fill="var(--primary-text)">Perms: rwxr-xr--</text>
  <text x="72.7273" y="322.266681880001" font-size="22.359147174993" font-family="Arial, sans-serif" fill="var(--primary-text)">Owner: uid=1000</text>
  <text x="72.7273" y="380.266649279999" font-size="22.359147174993" font-family="Arial, sans-serif" fill="var(--primary-text)">Size: 4096 bytes</text>
  <text x="72.7273" y="438.266616679997" font-size="22.359147174993" font-family="Arial, sans-serif" fill="var(--primary-text)">Links: 2</text>
  <text x="72.7273" y="496.266692746668" font-size="22.359147174993" font-family="Arial, sans-serif" fill="var(--primary-text)">Timestamps: amc</text>
  <text x="72.7273" y="562.000032600002" font-size="22.359147174993" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Block ptrs ---&gt;</text>
  <line x1="476.3636" y1="542.666601466663" x2="585.4545" y2="214.000010866667" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="476.3636" y1="542.666601466663" x2="585.4545" y2="368.666590599996" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="476.3636" y1="542.666601466663" x2="585.4545" y2="523.333278999997" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="585.4545" y="136.666721000003" width="283.6363" height="116.000043466669" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.254598491769" filter="url(#shadow)"/>
  <text x="727.2727" y="214.000010866667" text-anchor="middle" font-size="22.359147174993" font-family="Arial, sans-serif" fill="var(--ok-text)">Data Block 0</text>
  <rect x="585.4545" y="291.333300733331" width="283.6363" height="116.000043466669" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.254598491769" filter="url(#shadow)"/>
  <text x="727.2727" y="368.666590599996" text-anchor="middle" font-size="22.359147174993" font-family="Arial, sans-serif" fill="var(--ok-text)">Data Block 1</text>
  <rect x="585.4545" y="445.999989133333" width="283.6363" height="116.000043466669" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.254598491769" filter="url(#shadow)"/>
  <text x="727.2727" y="523.333278999997" text-anchor="middle" font-size="22.359147174993" font-family="Arial, sans-serif" fill="var(--ok-text)">Data Block 2</text>
  <rect x="934.5455" y="117.333398533337" width="305.4545" height="502.666601466663" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.254598491769" opacity="0.7" filter="url(#shadow)"/>
  <text x="1087.2726" y="206.266638413332" text-anchor="middle" font-size="22.359147174993" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Note:</text>
  <text x="1087.2726" y="275.866664493333" text-anchor="middle" font-size="22.359147174993" font-family="Arial, sans-serif" fill="var(--warn-text)">Filename is NOT</text>
  <text x="1087.2726" y="337.733318119999" text-anchor="middle" font-size="22.359147174993" font-family="Arial, sans-serif" fill="var(--warn-text)">stored in inode.</text>
  <text x="1087.2726" y="415.066607986663" text-anchor="middle" font-size="22.359147174993" font-family="Arial, sans-serif" fill="var(--warn-text)">It lives in the</text>
  <text x="1087.2726" y="476.933370280002" text-anchor="middle" font-size="22.359147174993" font-family="Arial, sans-serif" fill="var(--warn-text)">parent directory</text>
  <text x="1087.2726" y="538.800023906668" text-anchor="middle" font-size="22.359147174993" font-family="Arial, sans-serif" fill="var(--warn-text)">entry.</text>
</svg>

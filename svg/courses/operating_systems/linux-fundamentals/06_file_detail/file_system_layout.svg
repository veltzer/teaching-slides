<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="29.5028" font-weight="bold" fill="var(--text)">Filesystem Layout on Disk</text>
  <rect x="40" y="113.007" width="171.4286" height="243.3566" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="125.7143" y="214.4056" text-anchor="middle" font-size="22.6945" font-weight="bold">Boot</text>
  <text x="125.7143" y="275.2448" text-anchor="middle" font-size="22.6945">Block</text>
  <rect x="232.8572" y="113.007" width="214.2857" height="243.3566" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="339.9999" y="214.4056" text-anchor="middle" font-size="22.6945" font-weight="bold">Superblock</text>
  <text x="339.9999" y="275.2448" text-anchor="middle" font-size="22.6945">FS metadata</text>
  <rect x="468.5714" y="113.007" width="278.5714" height="243.3566" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="607.8571" y="214.4056" text-anchor="middle" font-size="22.6945" font-weight="bold">Inode Table</text>
  <text x="607.8571" y="275.2448" text-anchor="middle" font-size="22.6945">file metadata</text>
  <rect x="768.5714" y="113.007" width="471.4286" height="243.3566" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1004.2858" y="214.4056" text-anchor="middle" font-size="22.6945" font-weight="bold">Data Blocks</text>
  <text x="1004.2858" y="275.2448" text-anchor="middle" font-size="22.6945">actual file content</text>
  <rect x="232.8572" y="437.4825" width="214.2857" height="182.5175" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" opacity="0.7" filter="url(#shadow)"/>
  <text x="339.9999" y="510.4895" text-anchor="middle" font-size="22.6945">block size, count</text>
  <text x="339.9999" y="571.3287" text-anchor="middle" font-size="22.6945">free blocks/inodes</text>
  <rect x="468.5714" y="437.4825" width="278.5714" height="182.5175" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" opacity="0.7" filter="url(#shadow)"/>
  <text x="607.8571" y="510.4895" text-anchor="middle" font-size="22.6945">perms, owner, size</text>
  <text x="607.8571" y="571.3287" text-anchor="middle" font-size="22.6945">timestamps, ptrs</text>
  <rect x="768.5714" y="437.4825" width="471.4286" height="182.5175" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" opacity="0.7" filter="url(#shadow)"/>
  <text x="1004.2858" y="510.4895" text-anchor="middle" font-size="22.6945">file bytes stored in</text>
  <text x="1004.2858" y="571.3287" text-anchor="middle" font-size="22.6945">fixed-size blocks (4K typical)</text>
  <line x1="339.9999" y1="356.3636" x2="339.9999" y2="437.4825" stroke="var(--text)" stroke-width="2" stroke-dasharray="6.4 6.4" />
  <line x1="607.8571" y1="356.3636" x2="607.8571" y2="437.4825" stroke="var(--text)" stroke-width="2" stroke-dasharray="6.4 6.4" />
  <line x1="1004.2858" y1="356.3636" x2="1004.2858" y2="437.4825" stroke="var(--text)" stroke-width="2" stroke-dasharray="6.4 6.4" />
</svg>
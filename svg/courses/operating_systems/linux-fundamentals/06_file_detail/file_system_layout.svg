<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="171.4286" height="278.399954239999" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.417476183677" filter="url(#shadow)"/>
  <text x="125.7143" y="156" text-anchor="middle" font-size="24.273568875074" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Boot</text>
  <text x="125.7143" y="225.600045760001" text-anchor="middle" font-size="24.273568875074" font-family="Arial, sans-serif" fill="var(--danger-text)">Block</text>
  <rect x="232.8572" y="40" width="214.2857" height="278.399954239999" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.417476183677" filter="url(#shadow)"/>
  <text x="339.9999" y="156" text-anchor="middle" font-size="24.273568875074" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Superblock</text>
  <text x="339.9999" y="225.600045760001" text-anchor="middle" font-size="24.273568875074" font-family="Arial, sans-serif" fill="var(--info-text)">FS metadata</text>
  <rect x="468.5714" y="40" width="278.5714" height="278.399954239999" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.417476183677" filter="url(#shadow)"/>
  <text x="607.8571" y="156" text-anchor="middle" font-size="24.273568875074" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Inode Table</text>
  <text x="607.8571" y="225.600045760001" text-anchor="middle" font-size="24.273568875074" font-family="Arial, sans-serif" fill="var(--primary-text)">file metadata</text>
  <rect x="768.5714" y="40" width="471.4286" height="278.399954239999" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.417476183677" filter="url(#shadow)"/>
  <text x="1004.2858" y="156" text-anchor="middle" font-size="24.273568875074" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Data Blocks</text>
  <text x="1004.2858" y="225.600045760001" text-anchor="middle" font-size="24.273568875074" font-family="Arial, sans-serif" fill="var(--ok-text)">actual file content</text>
  <rect x="232.8572" y="411.19997712" width="214.2857" height="208.80002288" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.417476183677" opacity="0.7" filter="url(#shadow)"/>
  <text x="339.9999" y="494.719986272" text-anchor="middle" font-size="24.273568875074" font-family="Arial, sans-serif" fill="var(--info-text)">block size, count</text>
  <text x="339.9999" y="564.320032032001" text-anchor="middle" font-size="24.273568875074" font-family="Arial, sans-serif" fill="var(--info-text)">free blocks/inodes</text>
  <rect x="468.5714" y="411.19997712" width="278.5714" height="208.80002288" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.417476183677" opacity="0.7" filter="url(#shadow)"/>
  <text x="607.8571" y="494.719986272" text-anchor="middle" font-size="24.273568875074" font-family="Arial, sans-serif" fill="var(--primary-text)">perms, owner, size</text>
  <text x="607.8571" y="564.320032032001" text-anchor="middle" font-size="24.273568875074" font-family="Arial, sans-serif" fill="var(--primary-text)">timestamps, ptrs</text>
  <rect x="768.5714" y="411.19997712" width="471.4286" height="208.80002288" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.417476183677" opacity="0.7" filter="url(#shadow)"/>
  <text x="1004.2858" y="494.719986272" text-anchor="middle" font-size="24.273568875074" font-family="Arial, sans-serif" fill="var(--ok-text)">file bytes stored in</text>
  <text x="1004.2858" y="564.320032032001" text-anchor="middle" font-size="24.273568875074" font-family="Arial, sans-serif" fill="var(--ok-text)">fixed-size blocks (4K typical)</text>
  <line x1="339.9999" y1="318.399954239999" x2="339.9999" y2="411.19997712" stroke="var(--text)" stroke-width="2" stroke-dasharray="6.4 6.4"/>
  <line x1="607.8571" y1="318.399954239999" x2="607.8571" y2="411.19997712" stroke="var(--text)" stroke-width="2" stroke-dasharray="6.4 6.4"/>
  <line x1="1004.2858" y1="318.399954239999" x2="1004.2858" y2="411.19997712" stroke="var(--text)" stroke-width="2" stroke-dasharray="6.4 6.4"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <text x="640" y="79.2" text-anchor="middle" font-size="27.7333" font-weight="bold" fill="#333">Filesystem Layout on Disk</text>
  <rect x="42.6667" y="144" width="170.6667" height="216" fill="#ffebee" stroke="#333" stroke-width="4.2667" rx="6.4" />
  <text x="128" y="234" text-anchor="middle" font-size="21.3333" font-weight="bold">Boot</text>
  <text x="128" y="288" text-anchor="middle" font-size="21.3333">Block</text>
  <rect x="234.6667" y="144" width="213.3333" height="216" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="6.4" />
  <text x="341.3333" y="234" text-anchor="middle" font-size="21.3333" font-weight="bold">Superblock</text>
  <text x="341.3333" y="288" text-anchor="middle" font-size="21.3333">FS metadata</text>
  <rect x="469.3333" y="144" width="277.3333" height="216" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="6.4" />
  <text x="608" y="234" text-anchor="middle" font-size="21.3333" font-weight="bold">Inode Table</text>
  <text x="608" y="288" text-anchor="middle" font-size="21.3333">file metadata</text>
  <rect x="768" y="144" width="469.3333" height="216" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="6.4" />
  <text x="1002.6667" y="234" text-anchor="middle" font-size="21.3333" font-weight="bold">Data Blocks</text>
  <text x="1002.6667" y="288" text-anchor="middle" font-size="21.3333">actual file content</text>
  <rect x="234.6667" y="432" width="213.3333" height="162" fill="#f3e5f5" stroke="#333" stroke-width="2.1333" rx="6.4" opacity="0.7" />
  <text x="341.3333" y="496.8" text-anchor="middle" font-size="21.3333">block size, count</text>
  <text x="341.3333" y="550.8" text-anchor="middle" font-size="21.3333">free blocks/inodes</text>
  <rect x="469.3333" y="432" width="277.3333" height="162" fill="#e3f2fd" stroke="#333" stroke-width="2.1333" rx="6.4" opacity="0.7" />
  <text x="608" y="496.8" text-anchor="middle" font-size="21.3333">perms, owner, size</text>
  <text x="608" y="550.8" text-anchor="middle" font-size="21.3333">timestamps, ptrs</text>
  <rect x="768" y="432" width="469.3333" height="162" fill="#e8f5e9" stroke="#333" stroke-width="2.1333" rx="6.4" opacity="0.7" />
  <text x="1002.6667" y="496.8" text-anchor="middle" font-size="21.3333">file bytes stored in</text>
  <text x="1002.6667" y="550.8" text-anchor="middle" font-size="21.3333">fixed-size blocks (4K typical)</text>
  <line x1="341.3333" y1="360" x2="341.3333" y2="432" stroke="#333" stroke-width="2.1333" stroke-dasharray="6.4 6.4" />
  <line x1="608" y1="360" x2="608" y2="432" stroke="#333" stroke-width="2.1333" stroke-dasharray="6.4 6.4" />
  <line x1="1002.6667" y1="360" x2="1002.6667" y2="432" stroke="#333" stroke-width="2.1333" stroke-dasharray="6.4 6.4" />
</svg>
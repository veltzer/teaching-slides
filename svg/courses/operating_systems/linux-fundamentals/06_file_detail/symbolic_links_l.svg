<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="79.2" text-anchor="middle" font-size="27.7333" font-weight="bold" fill="#333">Symbolic Link Structure</text>
  <defs>
    <marker id="arrowsym" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="64" y="198" width="320" height="180" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="224" y="270" text-anchor="middle" font-size="23.4667" font-weight="bold">link.txt</text>
  <text x="224" y="331.2" text-anchor="middle" font-size="21.3333">(symlink inode)</text>
  <line x1="384" y1="288" x2="490.6667" y2="288" stroke="#333" stroke-width="4.2667" stroke-dasharray="12.8 6.4" marker-end="url(#arrowsym)" />
  <text x="437.3333" y="259.2" text-anchor="middle" font-size="21.3333">points to</text>
  <rect x="490.6667" y="198" width="320" height="180" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="650.6667" y="270" text-anchor="middle" font-size="23.4667" font-weight="bold">target.txt</text>
  <text x="650.6667" y="331.2" text-anchor="middle" font-size="21.3333">(path string)</text>
  <line x1="810.6667" y1="288" x2="917.3333" y2="288" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowsym)" />
  <text x="864" y="259.2" text-anchor="middle" font-size="21.3333">resolves</text>
  <rect x="917.3333" y="198" width="320" height="180" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1077.3333" y="270" text-anchor="middle" font-size="23.4667" font-weight="bold">data blocks</text>
  <text x="1077.3333" y="331.2" text-anchor="middle" font-size="21.3333">(actual content)</text>
  <rect x="64" y="468" width="533.3333" height="180" fill="#ffebee" stroke="#333" stroke-width="2.1333" rx="8.5333" opacity="0.7" />
  <text x="330.6667" y="540" text-anchor="middle" font-size="21.3333" font-weight="bold">If target is deleted:</text>
  <text x="330.6667" y="601.2" text-anchor="middle" font-size="21.3333">symlink becomes broken (dangling)</text>
  <rect x="682.6667" y="468" width="554.6667" height="180" fill="#fff3e0" stroke="#333" stroke-width="2.1333" rx="8.5333" opacity="0.7" />
  <text x="960" y="540" text-anchor="middle" font-size="21.3333" font-weight="bold">Can cross filesystems</text>
  <text x="960" y="601.2" text-anchor="middle" font-size="21.3333">Stores path, not inode number</text>
</svg>
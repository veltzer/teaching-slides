<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="632.0988" y="78.2222" text-anchor="middle" font-size="27.3909" font-weight="bold" fill="var(--text)">Symbolic Link Structure</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowsym" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="63.2099" y="195.5556" width="316.0494" height="177.7778" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="221.2346" y="266.6667" text-anchor="middle" font-size="23.177" font-weight="bold">link.txt</text>
  <text x="221.2346" y="327.1111" text-anchor="middle" font-size="21.0699">(symlink inode)</text>
  <line x1="379.2593" y1="284.4444" x2="484.6091" y2="284.4444" stroke="var(--text)" stroke-width="2" stroke-dasharray="12.642 6.321" marker-end="url(#arrowsym)" />
  <text x="431.9341" y="256" text-anchor="middle" font-size="21.0699">points to</text>
  <rect x="484.6091" y="195.5556" width="316.0494" height="177.7778" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="642.6338" y="266.6667" text-anchor="middle" font-size="23.177" font-weight="bold">target.txt</text>
  <text x="642.6338" y="327.1111" text-anchor="middle" font-size="21.0699">(path string)</text>
  <line x1="800.6585" y1="284.4444" x2="906.0082" y2="284.4444" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowsym)" />
  <text x="853.3333" y="256" text-anchor="middle" font-size="21.0699">resolves</text>
  <rect x="906.0082" y="195.5556" width="316.0494" height="177.7778" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1064.0329" y="266.6667" text-anchor="middle" font-size="23.177" font-weight="bold">data blocks</text>
  <text x="1064.0329" y="327.1111" text-anchor="middle" font-size="21.0699">(actual content)</text>
  <rect x="63.2099" y="462.2222" width="526.7489" height="177.7778" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" opacity="0.7" />
  <text x="326.5844" y="533.3333" text-anchor="middle" font-size="21.0699" font-weight="bold">If target is deleted:</text>
  <text x="326.5844" y="593.7778" text-anchor="middle" font-size="21.0699">symlink becomes broken (dangling)</text>
  <rect x="674.2387" y="462.2222" width="547.819" height="177.7778" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" opacity="0.7" />
  <text x="948.1481" y="533.3333" text-anchor="middle" font-size="21.0699" font-weight="bold">Can cross filesystems</text>
  <text x="948.1481" y="593.7778" text-anchor="middle" font-size="21.0699">Stores path, not inode number</text>
</svg>
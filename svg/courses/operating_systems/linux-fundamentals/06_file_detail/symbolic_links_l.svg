<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:text x="632.0988" y="78.2222" text-anchor="middle" font-size="27.3909" font-weight="bold" fill="#333">Symbolic Link Structure</ns0:text>
  <ns0:defs>
    <ns0:marker id="arrowsym" markerWidth="21.0699" markerHeight="35.5556" refX="18.963" refY="10.6667" orient="auto">
      <ns0:path d="M 0 0 L 0 21.3333 L 18.963 10.6667 z" fill="#333" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect x="63.2099" y="195.5556" width="316.0494" height="177.7778" fill="#e3f2fd" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="221.2346" y="266.6667" text-anchor="middle" font-size="23.177" font-weight="bold">link.txt</ns0:text>
  <ns0:text x="221.2346" y="327.1111" text-anchor="middle" font-size="21.0699">(symlink inode)</ns0:text>
  <ns0:line x1="379.2593" y1="284.4444" x2="484.6091" y2="284.4444" stroke="#333" stroke-width="4.214" stroke-dasharray="12.642 6.321" marker-end="url(#arrowsym)" />
  <ns0:text x="431.9341" y="256" text-anchor="middle" font-size="21.0699">points to</ns0:text>
  <ns0:rect x="484.6091" y="195.5556" width="316.0494" height="177.7778" fill="#f3e5f5" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="642.6338" y="266.6667" text-anchor="middle" font-size="23.177" font-weight="bold">target.txt</ns0:text>
  <ns0:text x="642.6338" y="327.1111" text-anchor="middle" font-size="21.0699">(path string)</ns0:text>
  <ns0:line x1="800.6585" y1="284.4444" x2="906.0082" y2="284.4444" stroke="#333" stroke-width="4.214" marker-end="url(#arrowsym)" />
  <ns0:text x="853.3333" y="256" text-anchor="middle" font-size="21.0699">resolves</ns0:text>
  <ns0:rect x="906.0082" y="195.5556" width="316.0494" height="177.7778" fill="#e8f5e9" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="1064.0329" y="266.6667" text-anchor="middle" font-size="23.177" font-weight="bold">data blocks</ns0:text>
  <ns0:text x="1064.0329" y="327.1111" text-anchor="middle" font-size="21.0699">(actual content)</ns0:text>
  <ns0:rect x="63.2099" y="462.2222" width="526.7489" height="177.7778" fill="#ffebee" stroke="#333" stroke-width="2.107" rx="8.428" opacity="0.7" />
  <ns0:text x="326.5844" y="533.3333" text-anchor="middle" font-size="21.0699" font-weight="bold">If target is deleted:</ns0:text>
  <ns0:text x="326.5844" y="593.7778" text-anchor="middle" font-size="21.0699">symlink becomes broken (dangling)</ns0:text>
  <ns0:rect x="674.2387" y="462.2222" width="547.819" height="177.7778" fill="#fff3e0" stroke="#333" stroke-width="2.107" rx="8.428" opacity="0.7" />
  <ns0:text x="948.1481" y="533.3333" text-anchor="middle" font-size="21.0699" font-weight="bold">Can cross filesystems</ns0:text>
  <ns0:text x="948.1481" y="593.7778" text-anchor="middle" font-size="21.0699">Stores path, not inode number</ns0:text>
</ns0:svg>
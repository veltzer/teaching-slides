<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="598.8304" y="67.3684" text-anchor="middle" font-size="25.9493" font-weight="bold" fill="var(--text)">Hard Links vs Symbolic Links</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowlinks" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="299.4152" y="141.4737" text-anchor="middle" font-size="21.9571" font-weight="bold" fill="var(--text)">Hard Link</text>
  <rect x="59.883" y="168.4211" width="199.6101" height="101.0526" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="159.6881" y="235.7895" text-anchor="middle" font-size="19.961">file.txt</text>
  <rect x="319.3762" y="168.4211" width="199.6101" height="101.0526" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="419.1813" y="235.7895" text-anchor="middle" font-size="19.961">hardlink.txt</text>
  <line x1="159.6881" y1="269.4737" x2="289.4347" y2="370.5263" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowlinks)" />
  <line x1="419.1813" y1="269.4737" x2="289.4347" y2="370.5263" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowlinks)" />
  <rect x="189.6297" y="370.5263" width="199.6101" height="101.0526" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="289.4347" y="437.8947" text-anchor="middle" font-size="19.961" font-weight="bold">Inode #12345</text>
  <line x1="289.4347" y1="471.5789" x2="289.4347" y2="538.9474" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowlinks)" />
  <rect x="189.6297" y="538.9474" width="199.6101" height="84.2105" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="289.4347" y="596.2105" text-anchor="middle" font-size="19.961">Data Blocks</text>
  <text x="898.2456" y="141.4737" text-anchor="middle" font-size="21.9571" font-weight="bold" fill="var(--text)">Symbolic Link</text>
  <rect x="678.6744" y="168.4211" width="199.6101" height="101.0526" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="778.4795" y="235.7895" text-anchor="middle" font-size="19.961">symlink.txt</text>
  <line x1="878.2846" y1="218.9474" x2="938.1677" y2="218.9474" stroke="var(--text)" stroke-width="2" stroke-dasharray="9.9805 5.9883" marker-end="url(#arrowlinks)" />
  <rect x="938.1677" y="168.4211" width="199.6101" height="101.0526" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="1037.9727" y="235.7895" text-anchor="middle" font-size="19.961">target.txt</text>
  <line x1="1037.9727" y1="269.4737" x2="1037.9727" y2="370.5263" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowlinks)" />
  <rect x="938.1677" y="370.5263" width="199.6101" height="101.0526" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1037.9727" y="437.8947" text-anchor="middle" font-size="19.961" font-weight="bold">Inode #67890</text>
  <line x1="1037.9727" y1="471.5789" x2="1037.9727" y2="538.9474" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowlinks)" />
  <rect x="938.1677" y="538.9474" width="199.6101" height="84.2105" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="1037.9727" y="596.2105" text-anchor="middle" font-size="19.961">Data Blocks</text>
  <line x1="598.8304" y1="117.8947" x2="598.8304" y2="640" stroke="var(--text-faint)" stroke-width="1.9961" stroke-dasharray="5.9883 5.9883" />
</svg>
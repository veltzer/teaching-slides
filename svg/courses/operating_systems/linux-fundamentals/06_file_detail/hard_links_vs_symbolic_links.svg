<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640" y="40" text-anchor="middle" font-size="27.5553" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Hard Links vs Symbolic Links</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <text x="306.6667" y="115.0589" text-anchor="middle" font-size="23.316" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Hard Link</text>
  <rect x="40" y="142.353" width="222.2222" height="102.3529" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="151.1111" y="210.5883" text-anchor="middle" font-size="21.1963" font-family="Arial, sans-serif" fill="var(--primary-text)">file.txt</text>
  <rect x="328.8889" y="142.353" width="222.2222" height="102.3529" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="440" y="210.5883" text-anchor="middle" font-size="21.1963" font-family="Arial, sans-serif" fill="var(--primary-text)">hardlink.txt</text>
  <line x1="151.1111" y1="244.7059" x2="295.5556" y2="347.0588" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="440" y1="244.7059" x2="295.5556" y2="347.0588" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="184.4446" y="347.0588" width="222.2222" height="102.3529" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="295.5556" y="415.2941" text-anchor="middle" font-size="21.1963" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Inode #12345</text>
  <line x1="295.5556" y1="449.4117" x2="295.5556" y2="517.6471" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="184.4446" y="517.6471" width="222.2222" height="85.2941" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="295.5556" y="575.647" text-anchor="middle" font-size="21.1963" font-family="Arial, sans-serif" fill="var(--warn-text)">Data Blocks</text>
  <text x="973.3333" y="115.0589" text-anchor="middle" font-size="23.316" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Symbolic Link</text>
  <rect x="728.8888" y="142.353" width="222.2222" height="102.3529" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="840" y="210.5883" text-anchor="middle" font-size="21.1963" font-family="Arial, sans-serif" fill="var(--info-text)">symlink.txt</text>
  <line x1="951.1111" y1="193.5295" x2="1017.7778" y2="193.5295" stroke="var(--text)" stroke-width="2" stroke-dasharray="9.9805 5.9883" marker-end="url(#arrow)" />
  <rect x="1017.7778" y="142.353" width="222.2222" height="102.3529" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1128.8889" y="210.5883" text-anchor="middle" font-size="21.1963" font-family="Arial, sans-serif" fill="var(--primary-text)">target.txt</text>
  <line x1="1128.8889" y1="244.7059" x2="1128.8889" y2="347.0588" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="1017.7778" y="347.0588" width="222.2222" height="102.3529" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1128.8889" y="415.2941" text-anchor="middle" font-size="21.1963" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Inode #67890</text>
  <line x1="1128.8889" y1="449.4117" x2="1128.8889" y2="517.6471" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="1017.7778" y="517.6471" width="222.2222" height="85.2941" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1128.8889" y="575.647" text-anchor="middle" font-size="21.1963" font-family="Arial, sans-serif" fill="var(--warn-text)">Data Blocks</text>
  <line x1="640" y1="91.1765" x2="640" y2="620" stroke="var(--text-faint)" stroke-width="1.9961" stroke-dasharray="5.9883 5.9883" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640" y="40" text-anchor="middle" font-size="27.5553" font-weight="bold" fill="var(--text)">Hard Links vs Symbolic Links</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowlinks" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="306.6667" y="115.0589" text-anchor="middle" font-size="23.316" font-weight="bold" fill="var(--text)">Hard Link</text>
  <rect x="40" y="142.353" width="222.2222" height="102.3529" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="151.1111" y="210.5883" text-anchor="middle" font-size="21.1963">file.txt</text>
  <rect x="328.8889" y="142.353" width="222.2222" height="102.3529" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="440" y="210.5883" text-anchor="middle" font-size="21.1963">hardlink.txt</text>
  <line x1="151.1111" y1="244.7059" x2="295.5556" y2="347.0588" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowlinks)" />
  <line x1="440" y1="244.7059" x2="295.5556" y2="347.0588" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowlinks)" />
  <rect x="184.4446" y="347.0588" width="222.2222" height="102.3529" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="295.5556" y="415.2941" text-anchor="middle" font-size="21.1963" font-weight="bold">Inode #12345</text>
  <line x1="295.5556" y1="449.4117" x2="295.5556" y2="517.6471" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowlinks)" />
  <rect x="184.4446" y="517.6471" width="222.2222" height="85.2941" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="295.5556" y="575.647" text-anchor="middle" font-size="21.1963">Data Blocks</text>
  <text x="973.3333" y="115.0589" text-anchor="middle" font-size="23.316" font-weight="bold" fill="var(--text)">Symbolic Link</text>
  <rect x="728.8888" y="142.353" width="222.2222" height="102.3529" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="840" y="210.5883" text-anchor="middle" font-size="21.1963">symlink.txt</text>
  <line x1="951.1111" y1="193.5295" x2="1017.7778" y2="193.5295" stroke="var(--text)" stroke-width="2" stroke-dasharray="9.9805 5.9883" marker-end="url(#arrowlinks)" />
  <rect x="1017.7778" y="142.353" width="222.2222" height="102.3529" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="1128.8889" y="210.5883" text-anchor="middle" font-size="21.1963">target.txt</text>
  <line x1="1128.8889" y1="244.7059" x2="1128.8889" y2="347.0588" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowlinks)" />
  <rect x="1017.7778" y="347.0588" width="222.2222" height="102.3529" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1128.8889" y="415.2941" text-anchor="middle" font-size="21.1963" font-weight="bold">Inode #67890</text>
  <line x1="1128.8889" y1="449.4117" x2="1128.8889" y2="517.6471" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowlinks)" />
  <rect x="1017.7778" y="517.6471" width="222.2222" height="85.2941" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="1128.8889" y="575.647" text-anchor="middle" font-size="21.1963">Data Blocks</text>
  <line x1="640" y1="91.1765" x2="640" y2="620" stroke="var(--text-faint)" stroke-width="1.9961" stroke-dasharray="5.9883 5.9883" />
</svg>
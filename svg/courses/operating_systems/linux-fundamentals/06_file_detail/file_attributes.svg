<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" />
  <rect x="22.2222" y="22.2222" width="1093.3333" height="71.1111" rx="8.8889" fill="var(--text)" filter="url(#shadow)" />
  <text x="568.8889" y="48.8889" text-anchor="middle" font-family="monospace" font-size="11.5556" fill="var(--text-faint)">$ ls -la /home/alice/report.txt</text>
  <text x="568.8889" y="80" text-anchor="middle" font-family="monospace" font-size="21.3333" font-weight="bold" fill="var(--bg)">-rw-r--r--  1  alice  staff  4096  Nov 19 14:30  report.txt</text>
  <line x1="137.7778" y1="93.3333" x2="137.7778" y2="146.6667" stroke="var(--primary-dk)" stroke-width="1.7778" />
  <line x1="302.2222" y1="93.3333" x2="302.2222" y2="191.1111" stroke="var(--ok-dk)" stroke-width="1.7778" />
  <line x1="391.1111" y1="93.3333" x2="391.1111" y2="235.5556" stroke="var(--warn-dk)" stroke-width="1.7778" />
  <line x1="480" y1="93.3333" x2="480" y2="280" stroke="var(--danger-pink)" stroke-width="1.7778" />
  <line x1="604.4444" y1="93.3333" x2="604.4444" y2="324.4444" stroke="var(--primary-deep)" stroke-width="1.7778" />
  <line x1="728.8889" y1="93.3333" x2="728.8889" y2="368.8889" stroke="var(--info-deep)" stroke-width="1.7778" />
  <line x1="915.5556" y1="93.3333" x2="915.5556" y2="413.3333" stroke="var(--text-muted)" stroke-width="1.7778" />
  <rect x="22.2222" y="149.3333" width="346.6667" height="142.2222" rx="8.8889" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="1.7778" filter="url(#shadow)" />
  <text x="44.4444" y="171.5556" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--primary-dk)">-rw-r--r--</text>
  <text x="44.4444" y="191.1111" font-family="sans-serif" font-size="11.5556" font-weight="bold" fill="var(--text)">File type + permissions (10 chars)</text>
  <text x="44.4444" y="211.5556" font-family="monospace" font-size="11.5556" fill="var(--text)">-         regular file</text>
  <text x="44.4444" y="227.5556" font-family="monospace" font-size="11.5556" fill="var(--text)">rw-       owner: read+write</text>
  <text x="44.4444" y="243.5556" font-family="monospace" font-size="11.5556" fill="var(--text)">r--       group: read only</text>
  <text x="44.4444" y="259.5556" font-family="monospace" font-size="11.5556" fill="var(--text)">r--       others: read only</text>
  <text x="44.4444" y="279.1111" font-family="sans-serif" font-size="10" fill="var(--text-faint)">d=dir  l=link  c=char  b=block  s=socket  p=pipe</text>
  <rect x="240" y="193.7778" width="213.3333" height="97.7778" rx="8.8889" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="1.7778" filter="url(#shadow)" />
  <text x="262.2222" y="216" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--ok-dk)">1</text>
  <text x="262.2222" y="235.5556" font-family="sans-serif" font-size="11.5556" font-weight="bold" fill="var(--text)">Hard link count</text>
  <text x="262.2222" y="253.3333" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">Number of directory entries</text>
  <text x="262.2222" y="269.3333" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">pointing to this inode.</text>
  <text x="262.2222" y="284.4444" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">Dirs always ≥ 2 (. and ..)</text>
  <rect x="280" y="238.2222" width="195.5556" height="88.8889" rx="8.8889" fill="var(--warn-pale)" stroke="var(--warn-dk)" stroke-width="1.7778" filter="url(#shadow)" />
  <text x="302.2222" y="260.4444" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--warn-dk)">alice</text>
  <text x="302.2222" y="280" font-family="sans-serif" font-size="11.5556" font-weight="bold" fill="var(--text)">Owner (user)</text>
  <text x="302.2222" y="297.7778" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">Checked first for access</text>
  <text x="302.2222" y="313.7778" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">chown user file</text>
  <rect x="368.8889" y="282.6667" width="195.5556" height="88.8889" rx="8.8889" fill="var(--danger-pale3)" stroke="var(--danger-pink)" stroke-width="1.7778" filter="url(#shadow)" />
  <text x="391.1111" y="304.8889" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--danger-pink)">staff</text>
  <text x="391.1111" y="324.4444" font-family="sans-serif" font-size="11.5556" font-weight="bold" fill="var(--text)">Owning group</text>
  <text x="391.1111" y="342.2222" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">Group permission applies to</text>
  <text x="391.1111" y="358.2222" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">all members of "staff"</text>
  <rect x="497.7778" y="327.1111" width="204.4444" height="88.8889" rx="8.8889" fill="var(--primary-pale3)" stroke="var(--primary-deep)" stroke-width="1.7778" filter="url(#shadow)" />
  <text x="520" y="349.3333" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--primary-deep)">4096</text>
  <text x="520" y="368.8889" font-family="sans-serif" font-size="11.5556" font-weight="bold" fill="var(--text)">Size in bytes</text>
  <text x="520" y="386.6667" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">ls -lh shows human units</text>
  <text x="520" y="402.6667" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">(KB, MB, GB)</text>
  <rect x="604.4444" y="371.5556" width="240" height="88.8889" rx="8.8889" fill="var(--info-indigo-lt)" stroke="var(--info-deep)" stroke-width="1.7778" filter="url(#shadow)" />
  <text x="626.6667" y="393.7778" font-family="monospace" font-size="13.3333" font-weight="bold" fill="var(--info-deep)">Nov 19 14:30</text>
  <text x="626.6667" y="413.3333" font-family="sans-serif" font-size="11.5556" font-weight="bold" fill="var(--text)">Modification time (mtime)</text>
  <text x="626.6667" y="431.1111" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">Three timestamps per file:</text>
  <text x="626.6667" y="447.1111" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">atime (access) · mtime · ctime</text>
  <rect x="755.5556" y="416" width="204.4444" height="88.8889" rx="8.8889" fill="var(--surface-dark)" stroke="var(--text-muted)" stroke-width="1.7778" filter="url(#shadow)" />
  <text x="777.7778" y="438.2222" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--text)">report.txt</text>
  <text x="777.7778" y="457.7778" font-family="sans-serif" font-size="11.5556" font-weight="bold" fill="var(--text)">Filename</text>
  <text x="777.7778" y="475.5556" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">Stored in directory entry</text>
  <text x="777.7778" y="491.5556" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">not in the inode itself</text>
  <rect x="22.2222" y="524.4444" width="1093.3333" height="97.7778" rx="8.8889" fill="var(--text)" filter="url(#shadow)" />
  <text x="44.4444" y="549.3333" font-family="monospace" font-size="12.4444" fill="var(--ok-tint)">Permission bits:   r=4   w=2   x=1</text>
  <text x="44.4444" y="570.6667" font-family="monospace" font-size="12.4444" fill="var(--bg)">chmod 644 file  →  rw-r--r--   (owner: 6=r+w, group: 4=r, others: 4=r)</text>
  <text x="44.4444" y="592" font-family="monospace" font-size="12.4444" fill="var(--bg)">chmod 755 file  →  rwxr-xr-x   (owner: 7=r+w+x, group: 5=r+x, others: 5=r+x)</text>
  <text x="44.4444" y="613.3333" font-family="monospace" font-size="12.4444" fill="var(--bg)">chmod 700 file  →  rwx------   (owner only, group and others: no access)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="63.4375" y="60.1389" width="1153.1249" height="64.4444" rx="6" fill="var(--text)" filter="url(#shadow)" />
  <text x="640" y="84.3056" text-anchor="middle" font-family="monospace" font-size="11.2974" fill="var(--text-faint)">$ ls -la /home/alice/report.txt</text>
  <text x="640" y="112.5" text-anchor="middle" font-family="monospace" font-size="20.8566" font-weight="bold" fill="var(--bg)">-rw-r--r--  1  alice  staff  4096  Nov 19 14:30  report.txt</text>
  <line x1="185.3125" y1="124.5833" x2="185.3125" y2="172.9167" stroke="var(--primary-border)" stroke-width="1.7778" />
  <line x1="358.75" y1="124.5833" x2="358.75" y2="213.1944" stroke="var(--ok-border)" stroke-width="1.7778" />
  <line x1="452.5" y1="124.5833" x2="452.5" y2="253.4723" stroke="var(--warn-border)" stroke-width="1.7778" />
  <line x1="546.25" y1="124.5833" x2="546.25" y2="293.75" stroke="var(--danger-border)" stroke-width="1.7778" />
  <line x1="677.4999" y1="124.5833" x2="677.4999" y2="334.0277" stroke="var(--primary-border)" stroke-width="1.7778" />
  <line x1="808.75" y1="124.5833" x2="808.75" y2="374.3056" stroke="var(--info-border)" stroke-width="1.7778" />
  <line x1="1005.625" y1="124.5833" x2="1005.625" y2="414.5833" stroke="var(--text-muted)" stroke-width="1.7778" />
  <rect x="63.4375" y="175.3333" width="365.625" height="128.8889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="86.875" y="195.4723" font-family="monospace" font-size="13.9044" font-weight="bold" fill="var(--primary-accent)">-rw-r--r--</text>
  <text x="86.875" y="213.1944" font-family="sans-serif" font-size="11.2974" font-weight="bold" fill="var(--text)">File type + permissions (10 chars)</text>
  <text x="86.875" y="231.7223" font-family="monospace" font-size="11.2974" fill="var(--text)">-         regular file</text>
  <text x="86.875" y="246.2223" font-family="monospace" font-size="11.2974" fill="var(--text)">rw-       owner: read+write</text>
  <text x="86.875" y="260.7223" font-family="monospace" font-size="11.2974" fill="var(--text)">r--       group: read only</text>
  <text x="86.875" y="275.2223" font-family="monospace" font-size="11.2974" fill="var(--text)">r--       others: read only</text>
  <text x="86.875" y="292.9444" font-family="sans-serif" font-size="10" fill="var(--text-faint)">d=dir  l=link  c=char  b=block  s=socket  p=pipe</text>
  <rect x="293.125" y="215.6111" width="225" height="88.6111" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="316.5625" y="235.75" font-family="monospace" font-size="13.9044" font-weight="bold" fill="var(--ok-accent)">1</text>
  <text x="316.5625" y="253.4723" font-family="sans-serif" font-size="11.2974" font-weight="bold" fill="var(--text)">Hard link count</text>
  <text x="316.5625" y="269.5833" font-family="sans-serif" font-size="10.4284" fill="var(--text-muted)">Number of directory entries</text>
  <text x="316.5625" y="284.0833" font-family="sans-serif" font-size="10.4284" fill="var(--text-muted)">pointing to this inode.</text>
  <text x="316.5625" y="297.7777" font-family="sans-serif" font-size="10.4284" fill="var(--text-muted)">Dirs always ≥ 2 (. and ..)</text>
  <rect x="335.3125" y="255.8889" width="206.25" height="80.5556" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="358.75" y="276.0277" font-family="monospace" font-size="13.9044" font-weight="bold" fill="var(--warn-accent)">alice</text>
  <text x="358.75" y="293.75" font-family="sans-serif" font-size="11.2974" font-weight="bold" fill="var(--text)">Owner (user)</text>
  <text x="358.75" y="309.8611" font-family="sans-serif" font-size="10.4284" fill="var(--text-muted)">Checked first for access</text>
  <text x="358.75" y="324.3611" font-family="sans-serif" font-size="10.4284" fill="var(--text-muted)">chown user file</text>
  <rect x="429.0625" y="296.1667" width="206.25" height="80.5556" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="452.5" y="316.3056" font-family="monospace" font-size="13.9044" font-weight="bold" fill="var(--danger-accent)">staff</text>
  <text x="452.5" y="334.0277" font-family="sans-serif" font-size="11.2974" font-weight="bold" fill="var(--text)">Owning group</text>
  <text x="452.5" y="350.1389" font-family="sans-serif" font-size="10.4284" fill="var(--text-muted)">Group permission applies to</text>
  <text x="452.5" y="364.6389" font-family="sans-serif" font-size="10.4284" fill="var(--text-muted)">all members of "staff"</text>
  <rect x="565" y="336.4444" width="215.6249" height="80.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="588.4375" y="356.5833" font-family="monospace" font-size="13.9044" font-weight="bold" fill="var(--primary-accent)">4096</text>
  <text x="588.4375" y="374.3056" font-family="sans-serif" font-size="11.2974" font-weight="bold" fill="var(--text)">Size in bytes</text>
  <text x="588.4375" y="390.4167" font-family="sans-serif" font-size="10.4284" fill="var(--text-muted)">ls -lh shows human units</text>
  <text x="588.4375" y="404.9167" font-family="sans-serif" font-size="10.4284" fill="var(--text-muted)">(KB, MB, GB)</text>
  <rect x="677.4999" y="376.7223" width="253.125" height="80.5556" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="700.9375" y="396.8611" font-family="monospace" font-size="13.0354" font-weight="bold" fill="var(--info-accent)">Nov 19 14:30</text>
  <text x="700.9375" y="414.5833" font-family="sans-serif" font-size="11.2974" font-weight="bold" fill="var(--text)">Modification time (mtime)</text>
  <text x="700.9375" y="430.6944" font-family="sans-serif" font-size="10.4284" fill="var(--text-muted)">Three timestamps per file:</text>
  <text x="700.9375" y="445.1944" font-family="sans-serif" font-size="10.4284" fill="var(--text-muted)">atime (access) · mtime · ctime</text>
  <rect x="836.875" y="417" width="215.6249" height="80.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="860.3125" y="437.1389" font-family="monospace" font-size="13.9044" font-weight="bold" fill="var(--text)">report.txt</text>
  <text x="860.3125" y="454.8611" font-family="sans-serif" font-size="11.2974" font-weight="bold" fill="var(--text)">Filename</text>
  <text x="860.3125" y="470.9723" font-family="sans-serif" font-size="10.4284" fill="var(--text-muted)">Stored in directory entry</text>
  <text x="860.3125" y="485.4723" font-family="sans-serif" font-size="10.4284" fill="var(--text-muted)">not in the inode itself</text>
  <rect x="63.4375" y="515.2777" width="1153.1249" height="88.6111" rx="6" fill="var(--text)" filter="url(#shadow)" />
  <text x="86.875" y="537.8333" font-family="monospace" font-size="12.1663" fill="var(--ok-accent)">Permission bits:   r=4   w=2   x=1</text>
  <text x="86.875" y="557.1667" font-family="monospace" font-size="12.1663" fill="var(--bg)">chmod 644 file  →  rw-r--r--   (owner: 6=r+w, group: 4=r, others: 4=r)</text>
  <text x="86.875" y="576.5" font-family="monospace" font-size="12.1663" fill="var(--bg)">chmod 755 file  →  rwxr-xr-x   (owner: 7=r+w+x, group: 5=r+x, others: 5=r+x)</text>
  <text x="86.875" y="595.8333" font-family="monospace" font-size="12.1663" fill="var(--bg)">chmod 700 file  →  rwx------   (owner only, group and others: no access)</text>
</svg>
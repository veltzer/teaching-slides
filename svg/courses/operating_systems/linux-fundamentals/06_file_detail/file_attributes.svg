  <ns0:text x="44.4444" y="570.6667" font-family="monospace" font-size="12.4444" fill="#ffffff">chmod 644 file  →  rw-r--r--   (owner: 6=r+w, group: 4=r, others: 4=r)</ns0:text>
  <ns0:text x="44.4444" y="592" font-family="monospace" font-size="12.4444" fill="#ffffff">chmod 755 file  →  rwxr-xr-x   (owner: 7=r+w+x, group: 5=r+x, others: 5=r+x)</ns0:text>
  <ns0:text x="44.4444" y="613.3333" font-family="monospace" font-size="12.4444" fill="#ffffff">chmod 700 file  →  rwx------   (owner only, group and others: no access)</ns0:text>

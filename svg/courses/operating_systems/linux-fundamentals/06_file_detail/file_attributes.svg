<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Header: ls -la output line -->
  <rect x="25" y="25" width="1230" height="80" rx="10" fill="#212121" filter="url(#shadow)"/>
  <text x="640" y="55" text-anchor="middle" font-family="monospace" font-size="13" fill="#888888">$ ls -la /home/alice/report.txt</text>
  <text x="640" y="90" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#ffffff">-rw-r--r--  1  alice  staff  4096  Nov 19 14:30  report.txt</text>

  <!-- Annotation arrows pointing up to the ls output line -->
  <!-- Segment positions (approximate centers of each field) -->
  <!-- permissions: ~120-280, links: ~340, owner: ~420, group: ~520, size: ~640, date: ~770-870, name: ~980+ -->

  <!-- Permission field annotation -->
  <line x1="155" y1="105" x2="155" y2="165" stroke="#1565c0" stroke-width="2"/>

  <!-- Links annotation -->
  <line x1="340" y1="105" x2="340" y2="215" stroke="#2e7d32" stroke-width="2"/>

  <!-- Owner annotation -->
  <line x1="440" y1="105" x2="440" y2="265" stroke="#e65100" stroke-width="2"/>

  <!-- Group annotation -->
  <line x1="540" y1="105" x2="540" y2="315" stroke="#880e4f" stroke-width="2"/>

  <!-- Size annotation -->
  <line x1="680" y1="105" x2="680" y2="365" stroke="#006064" stroke-width="2"/>

  <!-- Date annotation -->
  <line x1="820" y1="105" x2="820" y2="415" stroke="#4527a0" stroke-width="2"/>

  <!-- Name annotation -->
  <line x1="1030" y1="105" x2="1030" y2="465" stroke="#555555" stroke-width="2"/>

  <!-- Detail cards staggered -->
  <!-- Permissions card -->
  <rect x="25" y="168" width="390" height="160" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="50" y="193" font-family="monospace" font-size="16" font-weight="bold" fill="#1565c0">-rw-r--r--</text>
  <text x="50" y="215" font-family="sans-serif" font-size="13" font-weight="bold" fill="#212121">File type + permissions (10 chars)</text>
  <text x="50" y="238" font-family="monospace" font-size="13" fill="#212121">-         regular file</text>
  <text x="50" y="256" font-family="monospace" font-size="13" fill="#212121">rw-       owner: read+write</text>
  <text x="50" y="274" font-family="monospace" font-size="13" fill="#212121">r--       group: read only</text>
  <text x="50" y="292" font-family="monospace" font-size="13" fill="#212121">r--       others: read only</text>
  <text x="50" y="314" font-family="sans-serif" font-size="11" fill="#888888">d=dir  l=link  c=char  b=block  s=socket  p=pipe</text>

  <!-- Links card -->
  <rect x="270" y="218" width="240" height="110" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" filter="url(#shadow)"/>
  <text x="295" y="243" font-family="monospace" font-size="16" font-weight="bold" fill="#2e7d32">1</text>
  <text x="295" y="265" font-family="sans-serif" font-size="13" font-weight="bold" fill="#212121">Hard link count</text>
  <text x="295" y="285" font-family="sans-serif" font-size="12" fill="#555555">Number of directory entries</text>
  <text x="295" y="303" font-family="sans-serif" font-size="12" fill="#555555">pointing to this inode.</text>
  <text x="295" y="320" font-family="sans-serif" font-size="12" fill="#555555">Dirs always ≥ 2 (. and ..)</text>

  <!-- Owner card -->
  <rect x="315" y="268" width="220" height="100" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="293" font-family="monospace" font-size="16" font-weight="bold" fill="#e65100">alice</text>
  <text x="340" y="315" font-family="sans-serif" font-size="13" font-weight="bold" fill="#212121">Owner (user)</text>
  <text x="340" y="335" font-family="sans-serif" font-size="12" fill="#555555">Checked first for access</text>
  <text x="340" y="353" font-family="sans-serif" font-size="12" fill="#555555">chown user file</text>

  <!-- Group card -->
  <rect x="415" y="318" width="220" height="100" rx="10" fill="#fce4ec" stroke="#880e4f" stroke-width="2" filter="url(#shadow)"/>
  <text x="440" y="343" font-family="monospace" font-size="16" font-weight="bold" fill="#880e4f">staff</text>
  <text x="440" y="365" font-family="sans-serif" font-size="13" font-weight="bold" fill="#212121">Owning group</text>
  <text x="440" y="385" font-family="sans-serif" font-size="12" fill="#555555">Group permission applies to</text>
  <text x="440" y="403" font-family="sans-serif" font-size="12" fill="#555555">all members of "staff"</text>

  <!-- Size card -->
  <rect x="560" y="368" width="230" height="100" rx="10" fill="#e0f7fa" stroke="#006064" stroke-width="2" filter="url(#shadow)"/>
  <text x="585" y="393" font-family="monospace" font-size="16" font-weight="bold" fill="#006064">4096</text>
  <text x="585" y="415" font-family="sans-serif" font-size="13" font-weight="bold" fill="#212121">Size in bytes</text>
  <text x="585" y="435" font-family="sans-serif" font-size="12" fill="#555555">ls -lh shows human units</text>
  <text x="585" y="453" font-family="sans-serif" font-size="12" fill="#555555">(KB, MB, GB)</text>

  <!-- Date card -->
  <rect x="680" y="418" width="270" height="100" rx="10" fill="#ede7f6" stroke="#4527a0" stroke-width="2" filter="url(#shadow)"/>
  <text x="705" y="443" font-family="monospace" font-size="15" font-weight="bold" fill="#4527a0">Nov 19 14:30</text>
  <text x="705" y="465" font-family="sans-serif" font-size="13" font-weight="bold" fill="#212121">Modification time (mtime)</text>
  <text x="705" y="485" font-family="sans-serif" font-size="12" fill="#555555">Three timestamps per file:</text>
  <text x="705" y="503" font-family="sans-serif" font-size="12" fill="#555555">atime (access) · mtime · ctime</text>

  <!-- Name card -->
  <rect x="850" y="468" width="230" height="100" rx="10" fill="#f2f2f2" stroke="#555555" stroke-width="2" filter="url(#shadow)"/>
  <text x="875" y="493" font-family="monospace" font-size="16" font-weight="bold" fill="#212121">report.txt</text>
  <text x="875" y="515" font-family="sans-serif" font-size="13" font-weight="bold" fill="#212121">Filename</text>
  <text x="875" y="535" font-family="sans-serif" font-size="12" fill="#555555">Stored in directory entry</text>
  <text x="875" y="553" font-family="sans-serif" font-size="12" fill="#555555">not in the inode itself</text>

  <!-- Permission bit decoder at bottom -->
  <rect x="25" y="590" width="1230" height="110" rx="10" fill="#212121" filter="url(#shadow)"/>
  <text x="50" y="618" font-family="monospace" font-size="14" fill="#80cbc4">Permission bits:   r=4   w=2   x=1</text>
  <text x="50" y="642" font-family="monospace" font-size="14" fill="#ffffff">chmod 644 file  →  rw-r--r--   (owner: 6=r+w, group: 4=r, others: 4=r)</text>
  <text x="50" y="666" font-family="monospace" font-size="14" fill="#ffffff">chmod 755 file  →  rwxr-xr-x   (owner: 7=r+w+x, group: 5=r+x, others: 5=r+x)</text>
  <text x="50" y="690" font-family="monospace" font-size="14" fill="#ffffff">chmod 700 file  →  rwx------   (owner only, group and others: no access)</text>
</svg>

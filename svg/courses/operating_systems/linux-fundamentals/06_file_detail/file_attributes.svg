<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#c4cdd6"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bd7d75"/><stop offset="100%" stop-color="#7d3f38"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#555555"/></marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/></marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/></marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/></marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/></marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/></marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/></marker>
  </defs>

  <rect x="40" y="40" width="1200" height="71.228070175439" rx="6.052402741669" fill="var(--code-bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="75.614035087719" text-anchor="middle" font-family="Courier New, monospace" font-size="20.174675805565" font-weight="bold" fill="var(--primary-text)">-rw-r--r--  1  alice  staff  4096  Nov 19  report.txt</text>

  <rect x="40" y="141.754385964912" width="375" height="203.508771929825" rx="6.052402741669" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="228" y="177.368421052632" text-anchor="middle" font-family="Courier New, monospace" font-size="18.157208225008" font-weight="bold" fill="var(--primary-text)">-rw-r--r--</text>
  <text x="228" y="207.894736842105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" font-weight="bold" fill="var(--primary-text)">Type + permissions</text>
  <text x="60" y="238.421052631579" font-family="Courier New, monospace" font-size="13.113539273617" fill="var(--primary-text)">- regular</text>
  <text x="60" y="263.859649122807" font-family="Courier New, monospace" font-size="13.113539273617" fill="var(--primary-text)">rw- owner</text>
  <text x="60" y="289.298245614035" font-family="Courier New, monospace" font-size="13.113539273617" fill="var(--primary-text)">r-- group</text>
  <text x="60" y="314.736842105263" font-family="Courier New, monospace" font-size="13.113539273617" fill="var(--primary-text)">r-- others</text>

  <rect x="425" y="141.754385964912" width="260" height="203.508771929825" rx="6.052402741669" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="555" y="177.368421052632" text-anchor="middle" font-family="Courier New, monospace" font-size="20.174675805565" font-weight="bold" fill="var(--ok-text)">1</text>
  <text x="555" y="207.894736842105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" font-weight="bold" fill="var(--ok-text)">Hard link count</text>
  <text x="555" y="243.508771929825" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--ok-text)">entries for inode</text>
  <text x="555" y="274.035087719298" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--ok-text)">dirs: ≥ 2</text>

  <rect x="695" y="141.754385964912" width="260" height="203.508771929825" rx="6.052402741669" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="825" y="177.368421052632" text-anchor="middle" font-family="Courier New, monospace" font-size="18.157208225008" font-weight="bold" fill="var(--warn-text)">alice</text>
  <text x="825" y="207.894736842105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" font-weight="bold" fill="var(--warn-text)">Owner</text>
  <text x="825" y="243.508771929825" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--warn-text)">checked first</text>
  <text x="825" y="274.035087719298" text-anchor="middle" font-family="Courier New, monospace" font-size="13.113539273617" fill="var(--warn-text)">chown user file</text>

  <rect x="965" y="141.754385964912" width="275" height="203.508771929825" rx="6.052402741669" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1102" y="177.368421052632" text-anchor="middle" font-family="Courier New, monospace" font-size="18.157208225008" font-weight="bold" fill="var(--danger-text)">staff</text>
  <text x="1102" y="207.894736842105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" font-weight="bold" fill="var(--danger-text)">Owning group</text>
  <text x="1102" y="243.508771929825" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--danger-text)">group perms</text>
  <text x="1102" y="274.035087719298" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--danger-text)">apply to members</text>

  <rect x="40" y="365.614035087719" width="375" height="183.157894736842" rx="6.052402741669" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="228" y="401.228070175439" text-anchor="middle" font-family="Courier New, monospace" font-size="20.174675805565" font-weight="bold" fill="var(--primary-text)">4096</text>
  <text x="228" y="431.754385964912" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" font-weight="bold" fill="var(--primary-text)">Size (bytes)</text>
  <text x="228" y="467.368421052632" text-anchor="middle" font-family="Courier New, monospace" font-size="13.113539273617" fill="var(--primary-text)">ls -lh for KB/MB</text>

  <rect x="425" y="365.614035087719" width="400" height="183.157894736842" rx="6.052402741669" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="625" y="401.228070175439" text-anchor="middle" font-family="Courier New, monospace" font-size="18.157208225008" font-weight="bold" fill="var(--info-text)">Nov 19 14:30</text>
  <text x="625" y="431.754385964912" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" font-weight="bold" fill="var(--info-text)">mtime</text>
  <text x="625" y="467.368421052632" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--info-text)">atime / mtime / ctime</text>

  <rect x="835" y="365.614035087719" width="405" height="183.157894736842" rx="6.052402741669" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1037" y="401.228070175439" text-anchor="middle" font-family="Courier New, monospace" font-size="18.157208225008" font-weight="bold" fill="var(--text)">report.txt</text>
  <text x="1037" y="431.754385964912" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" font-weight="bold" fill="var(--text)">Filename</text>
  <text x="1037" y="467.368421052632" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--text-muted)">in directory entry</text>

  <rect x="40" y="564.035087719298" width="1200" height="55.964912280702" rx="6.052402741669" fill="var(--code-bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="65" y="589.473684210526" font-family="Courier New, monospace" font-size="14.122273063895" fill="var(--ok-accent)">Bits: r=4 w=2 x=1</text>
  <text x="65" y="611.859649122807" font-family="Courier New, monospace" font-size="14.122273063895" fill="var(--primary-text)">chmod 644 = rw-r--r--    chmod 755 = rwxr-xr-x    chmod 700 = rwx------</text>
</svg>

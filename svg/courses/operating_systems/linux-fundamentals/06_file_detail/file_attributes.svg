<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="68.740706" rx="6.32147" fill="var(--text)" />
  <text x="640.000052" y="65.777818" text-anchor="middle" font-family="monospace" font-size="11.902696" fill="var(--text-faint)">$ ls -la /home/alice/report.txt</text>
  <text x="640.000052" y="95.85185" text-anchor="middle" font-family="monospace" font-size="21.974063" font-weight="bold" fill="var(--bg)">-rw-r--r--  1  alice  staff  4096  Nov 19 14:30  report.txt</text>
  <line x1="166.829279" y1="108.740706" x2="166.829279" y2="160.296342" stroke="var(--primary-border)" stroke-width="1.7778" />
  <line x1="347.3171" y1="108.740706" x2="347.3171" y2="203.25923" stroke="var(--ok-border)" stroke-width="1.7778" />
  <line x1="444.878084" y1="108.740706" x2="444.878084" y2="246.222331" stroke="var(--warn-border)" stroke-width="1.7778" />
  <line x1="542.439068" y1="108.740706" x2="542.439068" y2="289.185219" stroke="var(--danger-border)" stroke-width="1.7778" />
  <line x1="679.024342" y1="108.740706" x2="679.024342" y2="332.148107" stroke="var(--primary-border)" stroke-width="1.7778" />
  <line x1="815.609823" y1="108.740706" x2="815.609823" y2="375.111208" stroke="var(--info-border)" stroke-width="1.7778" />
  <line x1="1020.48789" y1="108.740706" x2="1020.48789" y2="418.074096" stroke="var(--text-muted)" stroke-width="1.7778" />
  <rect x="40" y="162.874049" width="380.487838" height="137.481519" rx="6.32147" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="64.390246" y="184.355653" font-family="monospace" font-size="14.649375" font-weight="bold" fill="var(--primary-accent)">-rw-r--r--</text>
  <text x="64.390246" y="203.25923" font-family="sans-serif" font-size="11.902696" font-weight="bold" fill="var(--text)">File type + permissions (10 chars)</text>
  <text x="64.390246" y="223.022327" font-family="monospace" font-size="11.902696" fill="var(--text)">-         regular file</text>
  <text x="64.390246" y="238.488997" font-family="monospace" font-size="11.902696" fill="var(--text)">rw-       owner: read+write</text>
  <text x="64.390246" y="253.955666" font-family="monospace" font-size="11.902696" fill="var(--text)">r--       group: read only</text>
  <text x="64.390246" y="269.422336" font-family="monospace" font-size="11.902696" fill="var(--text)">r--       others: read only</text>
  <text x="64.390246" y="288.325912" font-family="sans-serif" font-size="10.535784" fill="var(--text-faint)">d=dir  l=link  c=char  b=block  s=socket  p=pipe</text>
  <rect x="279.024411" y="205.837044" width="234.146362" height="94.518524" rx="6.32147" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="303.414657" y="227.318541" font-family="monospace" font-size="14.649375" font-weight="bold" fill="var(--ok-accent)">1</text>
  <text x="303.414657" y="246.222331" font-family="sans-serif" font-size="11.902696" font-weight="bold" fill="var(--text)">Hard link count</text>
  <text x="303.414657" y="263.407401" font-family="sans-serif" font-size="10.987137" fill="var(--text-muted)">Number of directory entries</text>
  <text x="303.414657" y="278.874071" font-family="sans-serif" font-size="10.987137" fill="var(--text-muted)">pointing to this inode.</text>
  <text x="303.414657" y="293.481433" font-family="sans-serif" font-size="10.987137" fill="var(--text-muted)">Dirs always ≥ 2 (. and ..)</text>
  <rect x="322.926854" y="248.800038" width="214.634165" height="85.925989" rx="6.32147" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="347.3171" y="270.281429" font-family="monospace" font-size="14.649375" font-weight="bold" fill="var(--warn-accent)">alice</text>
  <text x="347.3171" y="289.185219" font-family="sans-serif" font-size="11.902696" font-weight="bold" fill="var(--text)">Owner (user)</text>
  <text x="347.3171" y="306.370396" font-family="sans-serif" font-size="10.987137" fill="var(--text-muted)">Checked first for access</text>
  <text x="347.3171" y="321.837065" font-family="sans-serif" font-size="10.987137" fill="var(--text-muted)">chown user file</text>
  <rect x="420.487838" y="291.763033" width="214.634165" height="85.925989" rx="6.32147" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="444.878084" y="313.24453" font-family="monospace" font-size="14.649375" font-weight="bold" fill="var(--danger-accent)">staff</text>
  <text x="444.878084" y="332.148107" font-family="sans-serif" font-size="11.902696" font-weight="bold" fill="var(--text)">Owning group</text>
  <text x="444.878084" y="349.33339" font-family="sans-serif" font-size="10.987137" fill="var(--text-muted)">Group permission applies to</text>
  <text x="444.878084" y="364.80006" font-family="sans-serif" font-size="10.987137" fill="var(--text-muted)">all members of "staff"</text>
  <rect x="561.951265" y="334.725921" width="224.390159" height="85.925989" rx="6.32147" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="586.341511" y="356.207418" font-family="monospace" font-size="14.649375" font-weight="bold" fill="var(--primary-accent)">4096</text>
  <text x="586.341511" y="375.111208" font-family="sans-serif" font-size="11.902696" font-weight="bold" fill="var(--text)">Size in bytes</text>
  <text x="586.341511" y="392.296385" font-family="sans-serif" font-size="10.987137" fill="var(--text-muted)">ls -lh shows human units</text>
  <text x="586.341511" y="407.763054" font-family="sans-serif" font-size="10.987137" fill="var(--text-muted)">(KB, MB, GB)</text>
  <rect x="679.024342" y="377.689022" width="263.414657" height="85.925989" rx="6.32147" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="703.414692" y="399.170413" font-family="monospace" font-size="13.733816" font-weight="bold" fill="var(--info-accent)">Nov 19 14:30</text>
  <text x="703.414692" y="418.074096" font-family="sans-serif" font-size="11.902696" font-weight="bold" fill="var(--text)">Modification time (mtime)</text>
  <text x="703.414692" y="435.259273" font-family="sans-serif" font-size="10.987137" fill="var(--text-muted)">Three timestamps per file:</text>
  <text x="703.414692" y="450.725942" font-family="sans-serif" font-size="10.987137" fill="var(--text-muted)">atime (access) · mtime · ctime</text>
  <rect x="844.878119" y="420.65191" width="224.390159" height="85.925989" rx="6.32147" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="869.268365" y="442.133407" font-family="monospace" font-size="14.649375" font-weight="bold" fill="var(--text)">report.txt</text>
  <text x="869.268365" y="461.037091" font-family="sans-serif" font-size="11.902696" font-weight="bold" fill="var(--text)">Filename</text>
  <text x="869.268365" y="478.222374" font-family="sans-serif" font-size="10.987137" fill="var(--text-muted)">Stored in directory entry</text>
  <text x="869.268365" y="493.689043" font-family="sans-serif" font-size="10.987137" fill="var(--text-muted)">not in the inode itself</text>
  <rect x="40" y="525.481476" width="1200" height="94.518524" rx="6.32147" fill="var(--text)" />
  <text x="64.390246" y="549.540787" font-family="monospace" font-size="12.818151" fill="var(--ok-accent)">Permission bits:   r=4   w=2   x=1</text>
  <text x="64.390246" y="570.163084" font-family="monospace" font-size="12.818151" fill="var(--bg)">chmod 644 file  →  rw-r--r--   (owner: 6=r+w, group: 4=r, others: 4=r)</text>
  <text x="64.390246" y="590.785275" font-family="monospace" font-size="12.818151" fill="var(--bg)">chmod 755 file  →  rwxr-xr-x   (owner: 7=r+w+x, group: 5=r+x, others: 5=r+x)</text>
  <text x="64.390246" y="611.407465" font-family="monospace" font-size="12.818151" fill="var(--bg)">chmod 700 file  →  rwx------   (owner only, group and others: no access)</text>
</svg>
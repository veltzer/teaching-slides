<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="634.8719" y="40" text-anchor="middle" font-size="27.4612" font-weight="bold" fill="var(--text)">Seven UNIX File Types</text>
  <rect x="40" y="87.7215" width="153.8462" height="165.1899" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="115.8975" y="161.1393" text-anchor="middle" font-size="21.1239" font-weight="bold">- regular</text>
  <text x="115.8975" y="216.2026" text-anchor="middle" font-size="21.1239">file</text>
  <rect x="214.359" y="87.7215" width="153.8462" height="165.1899" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="290.2565" y="161.1393" text-anchor="middle" font-size="21.1239" font-weight="bold">d directory</text>
  <text x="290.2565" y="216.2026" text-anchor="middle" font-size="21.1239">folder</text>
  <rect x="388.718" y="87.7215" width="153.8462" height="165.1899" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="464.6154" y="161.1393" text-anchor="middle" font-size="21.1239" font-weight="bold">l symlink</text>
  <text x="464.6154" y="216.2026" text-anchor="middle" font-size="21.1239">pointer</text>
  <rect x="563.077" y="87.7215" width="153.8462" height="165.1899" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="638.9745" y="161.1393" text-anchor="middle" font-size="21.1239" font-weight="bold">c char dev</text>
  <text x="638.9745" y="216.2026" text-anchor="middle" font-size="21.1239">serial</text>
  <rect x="737.436" y="87.7215" width="153.8462" height="165.1899" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="813.3334" y="161.1393" text-anchor="middle" font-size="21.1239" font-weight="bold">b block dev</text>
  <text x="813.3334" y="216.2026" text-anchor="middle" font-size="21.1239">disk</text>
  <rect x="911.7949" y="87.7215" width="153.8462" height="165.1899" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="987.6923" y="161.1393" text-anchor="middle" font-size="21.1239" font-weight="bold">s socket</text>
  <text x="987.6923" y="216.2026" text-anchor="middle" font-size="21.1239">IPC</text>
  <rect x="1086.1538" y="87.7215" width="153.8462" height="165.1899" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1162.0513" y="161.1393" text-anchor="middle" font-size="21.1239" font-weight="bold">p pipe</text>
  <text x="1162.0513" y="216.2026" text-anchor="middle" font-size="21.1239">FIFO</text>
  <text x="634.8719" y="363.038" text-anchor="middle" font-size="23.2364" fill="var(--text)">Identified by first character in ls -l output</text>
  <rect x="183.5898" y="418.1012" width="902.5641" height="201.8988" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" opacity="0.5" filter="url(#shadow)"/>
  <text x="634.8719" y="498.8608" text-anchor="middle" font-size="21.1239" font-family="monospace">-rw-r--r--  drwxr-xr-x  lrwxrwxrwx  crw-rw-rw-</text>
  <text x="634.8719" y="575.9493" text-anchor="middle" font-size="21.1239" font-family="monospace">brw-rw-rw-  srwxrwxrwx  prw-r--r--</text>
</svg>
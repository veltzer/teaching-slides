<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="632.0988" y="78.2222" text-anchor="middle" font-size="27.3909" font-weight="bold" fill="var(--text)">Seven UNIX File Types</text>
  <rect x="21.0699" y="124.4444" width="158.0247" height="160" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="99.0288" y="195.5556" text-anchor="middle" font-size="21.0699" font-weight="bold">- regular</text>
  <text x="99.0288" y="248.8889" text-anchor="middle" font-size="21.0699">file</text>
  <rect x="200.1646" y="124.4444" width="158.0247" height="160" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="278.1235" y="195.5556" text-anchor="middle" font-size="21.0699" font-weight="bold">d directory</text>
  <text x="278.1235" y="248.8889" text-anchor="middle" font-size="21.0699">folder</text>
  <rect x="379.2593" y="124.4444" width="158.0247" height="160" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="457.2181" y="195.5556" text-anchor="middle" font-size="21.0699" font-weight="bold">l symlink</text>
  <text x="457.2181" y="248.8889" text-anchor="middle" font-size="21.0699">pointer</text>
  <rect x="558.3539" y="124.4444" width="158.0247" height="160" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="636.3128" y="195.5556" text-anchor="middle" font-size="21.0699" font-weight="bold">c char dev</text>
  <text x="636.3128" y="248.8889" text-anchor="middle" font-size="21.0699">serial</text>
  <rect x="737.4486" y="124.4444" width="158.0247" height="160" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="815.4074" y="195.5556" text-anchor="middle" font-size="21.0699" font-weight="bold">b block dev</text>
  <text x="815.4074" y="248.8889" text-anchor="middle" font-size="21.0699">disk</text>
  <rect x="916.5432" y="124.4444" width="158.0247" height="160" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="994.502" y="195.5556" text-anchor="middle" font-size="21.0699" font-weight="bold">s socket</text>
  <text x="994.502" y="248.8889" text-anchor="middle" font-size="21.0699">IPC</text>
  <rect x="1095.6378" y="124.4444" width="158.0247" height="160" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="1173.5967" y="195.5556" text-anchor="middle" font-size="21.0699" font-weight="bold">p pipe</text>
  <text x="1173.5967" y="248.8889" text-anchor="middle" font-size="21.0699">FIFO</text>
  <text x="632.0988" y="391.1111" text-anchor="middle" font-size="23.177" fill="var(--text)">Identified by first character in ls -l output</text>
  <rect x="168.5597" y="444.4444" width="927.0782" height="195.5556" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" opacity="0.5" />
  <text x="632.0988" y="522.6667" text-anchor="middle" font-size="21.0699" font-family="monospace">-rw-r--r--  drwxr-xr-x  lrwxrwxrwx  crw-rw-rw-</text>
  <text x="632.0988" y="597.3333" text-anchor="middle" font-size="21.0699" font-family="monospace">brw-rw-rw-  srwxrwxrwx  prw-r--r--</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="153.8462" height="180.000022544589" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.263192860481" filter="url(#shadow)"/>
  <text x="115.8975" y="120.000082663493" text-anchor="middle" font-size="22.050509944252" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">- regular</text>
  <text x="115.8975" y="180.000090178356" text-anchor="middle" font-size="22.050509944252" font-family="Arial, sans-serif" fill="var(--primary-text)">file</text>
  <rect x="214.359" y="40" width="153.8462" height="180.000022544589" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.263192860481" filter="url(#shadow)"/>
  <text x="290.2565" y="120.000082663493" text-anchor="middle" font-size="22.050509944252" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">d directory</text>
  <text x="290.2565" y="180.000090178356" text-anchor="middle" font-size="22.050509944252" font-family="Arial, sans-serif" fill="var(--info-text)">folder</text>
  <rect x="388.718" y="40" width="153.8462" height="180.000022544589" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.263192860481" filter="url(#shadow)"/>
  <text x="464.6154" y="120.000082663493" text-anchor="middle" font-size="22.050509944252" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">l symlink</text>
  <text x="464.6154" y="180.000090178356" text-anchor="middle" font-size="22.050509944252" font-family="Arial, sans-serif" fill="var(--ok-text)">pointer</text>
  <rect x="563.077" y="40" width="153.8462" height="180.000022544589" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.263192860481" filter="url(#shadow)"/>
  <text x="638.9745" y="120.000082663493" text-anchor="middle" font-size="22.050509944252" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">c char dev</text>
  <text x="638.9745" y="180.000090178356" text-anchor="middle" font-size="22.050509944252" font-family="Arial, sans-serif" fill="var(--warn-text)">serial</text>
  <rect x="737.436" y="40" width="153.8462" height="180.000022544589" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.263192860481" filter="url(#shadow)"/>
  <text x="813.3334" y="120.000082663493" text-anchor="middle" font-size="22.050509944252" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">b block dev</text>
  <text x="813.3334" y="180.000090178356" text-anchor="middle" font-size="22.050509944252" font-family="Arial, sans-serif" fill="var(--danger-text)">disk</text>
  <rect x="911.7949" y="40" width="153.8462" height="180.000022544589" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.263192860481" filter="url(#shadow)"/>
  <text x="987.6923" y="120.000082663493" text-anchor="middle" font-size="22.050509944252" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">s socket</text>
  <text x="987.6923" y="180.000090178356" text-anchor="middle" font-size="22.050509944252" font-family="Arial, sans-serif" fill="var(--primary-text)">IPC</text>
  <rect x="1086.1538" y="40" width="153.8462" height="180.000022544589" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.263192860481" filter="url(#shadow)"/>
  <text x="1162.0513" y="120.000082663493" text-anchor="middle" font-size="22.050509944252" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">p pipe</text>
  <text x="1162.0513" y="180.000090178356" text-anchor="middle" font-size="22.050509944252" font-family="Arial, sans-serif" fill="var(--info-text)">FIFO</text>
  <text x="634.8719" y="340.000037574315" text-anchor="middle" font-size="24.255675763879" fill="var(--text)" font-family="Arial, sans-serif">Identified by first character in ls -l output</text>
  <rect x="183.5898" y="399.999936123665" width="902.5641" height="220.000063876335" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.263192860481" opacity="0.5" filter="url(#shadow)"/>
  <text x="634.8719" y="488.000048846609" text-anchor="middle" font-size="22.050509944252" font-family="Courier New, monospace" fill="var(--ok-text)">-rw-r--r--  drwxr-xr-x  lrwxrwxrwx  crw-rw-rw-</text>
  <text x="634.8719" y="571.999928608802" text-anchor="middle" font-size="22.050509944252" font-family="Courier New, monospace" fill="var(--ok-text)">brw-rw-rw-  srwxrwxrwx  prw-r--r--</text>
</svg>

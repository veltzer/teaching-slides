  <text x="640" y="396" text-anchor="middle" font-size="23.4667" fill="#333">Identified by first character in ls -l output</text>
  <rect x="170.6667" y="450" width="938.6667" height="198" fill="#e8f5e9" stroke="#333" stroke-width="2.1333" rx="10.6667" opacity="0.5" />

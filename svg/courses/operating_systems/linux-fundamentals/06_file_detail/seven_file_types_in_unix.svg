<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="79.2" text-anchor="middle" font-size="27.7333" font-weight="bold" fill="#333">Seven UNIX File Types</text>
  <rect x="21.3333" y="126" width="160" height="162" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="8.5333" />
  <text x="100.2667" y="198" text-anchor="middle" font-size="21.3333" font-weight="bold">- regular</text>
  <text x="100.2667" y="252" text-anchor="middle" font-size="21.3333">file</text>
  <rect x="202.6667" y="126" width="160" height="162" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="8.5333" />
  <text x="281.6" y="198" text-anchor="middle" font-size="21.3333" font-weight="bold">d directory</text>
  <text x="281.6" y="252" text-anchor="middle" font-size="21.3333">folder</text>
  <rect x="384" y="126" width="160" height="162" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="8.5333" />
  <text x="462.9333" y="198" text-anchor="middle" font-size="21.3333" font-weight="bold">l symlink</text>
  <text x="462.9333" y="252" text-anchor="middle" font-size="21.3333">pointer</text>
  <rect x="565.3333" y="126" width="160" height="162" fill="#fff3e0" stroke="#333" stroke-width="4.2667" rx="8.5333" />
  <text x="644.2667" y="198" text-anchor="middle" font-size="21.3333" font-weight="bold">c char dev</text>
  <text x="644.2667" y="252" text-anchor="middle" font-size="21.3333">serial</text>
  <rect x="746.6667" y="126" width="160" height="162" fill="#ffebee" stroke="#333" stroke-width="4.2667" rx="8.5333" />
  <text x="825.6" y="198" text-anchor="middle" font-size="21.3333" font-weight="bold">b block dev</text>
  <text x="825.6" y="252" text-anchor="middle" font-size="21.3333">disk</text>
  <rect x="928" y="126" width="160" height="162" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="8.5333" />
  <text x="1006.9333" y="198" text-anchor="middle" font-size="21.3333" font-weight="bold">s socket</text>
  <text x="1006.9333" y="252" text-anchor="middle" font-size="21.3333">IPC</text>
  <rect x="1109.3333" y="126" width="160" height="162" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="8.5333" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="99.8051" y="33.6842" width="199.6101" height="134.7368" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="199.6101" y="117.8947" text-anchor="middle" font-size="21.9571" font-weight="bold">Ctrl+C</text>
  <rect x="339.3373" y="33.6842" width="199.6101" height="134.7368" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="439.1423" y="117.8947" text-anchor="middle" font-size="21.9571" font-weight="bold">Ctrl+Z</text>
  <rect x="578.8694" y="33.6842" width="199.6101" height="134.7368" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="678.6744" y="117.8947" text-anchor="middle" font-size="21.9571" font-weight="bold">Ctrl+D</text>
  <rect x="818.4016" y="33.6842" width="199.6101" height="134.7368" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="918.2066" y="117.8947" text-anchor="middle" font-size="21.9571" font-weight="bold">Ctrl+L</text>
  <text x="199.6101" y="235.7895" text-anchor="middle" font-size="19.961">SIGINT</text>
  <text x="199.6101" y="279.5789" text-anchor="middle" font-size="19.961" fill="var(--text-muted)">Kill process</text>
  <text x="439.1423" y="235.7895" text-anchor="middle" font-size="19.961">SIGTSTP</text>
  <text x="439.1423" y="279.5789" text-anchor="middle" font-size="19.961" fill="var(--text-muted)">Suspend</text>
  <text x="678.6744" y="235.7895" text-anchor="middle" font-size="19.961">EOF</text>
  <text x="678.6744" y="279.5789" text-anchor="middle" font-size="19.961" fill="var(--text-muted)">End input</text>
  <text x="918.2066" y="235.7895" text-anchor="middle" font-size="19.961">Clear</text>
  <text x="918.2066" y="279.5789" text-anchor="middle" font-size="19.961" fill="var(--text-muted)">Redraw screen</text>
  <rect x="99.8051" y="336.8421" width="918.2066" height="134.7368" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="558.9084" y="397.4737" text-anchor="middle" font-size="19.961" font-weight="bold">Signal Flow: Keyboard -&gt; Terminal Driver -&gt; Kernel -&gt; Process</text>
  <text x="558.9084" y="448" text-anchor="middle" font-size="19.961" fill="var(--text-muted)">Ctrl+R: reverse history search  |  Ctrl+\: SIGQUIT (core dump)</text>
  <rect x="99.8051" y="522.1053" width="459.1033" height="117.8947" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="329.3567" y="596.2105" text-anchor="middle" font-size="19.961">stty -a : view terminal settings</text>
  <rect x="598.8304" y="522.1053" width="419.1813" height="117.8947" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="808.4211" y="596.2105" text-anchor="middle" font-size="19.961">stty intr ^X : remap Ctrl+X</text>
</svg>
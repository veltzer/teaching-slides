<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="26.6667" y="26.6667" width="426.6667" height="551.1111" rx="10.6667" fill="#f9f9f9" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:rect x="26.6667" y="26.6667" width="426.6667" height="42.6667" rx="10.6667" fill="url(#grad-primary)" />
  <ns0:rect x="26.6667" y="53.3333" width="426.6667" height="16" fill="url(#grad-primary)" />
  <ns0:text x="240" y="55.1111" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#ffffff">Directory Tree</ns0:text>
  <ns0:text x="71.1111" y="104.8889" font-family="monospace" font-size="17.7778" fill="#1565c0" font-weight="bold">/</ns0:text>
  <ns0:line x1="88.8889" y1="108.4444" x2="88.8889" y2="515.5556" stroke="#bdbdbd" stroke-width="1.3333" />
  <ns0:line x1="88.8889" y1="149.3333" x2="115.5556" y2="149.3333" stroke="#bdbdbd" stroke-width="1.3333" />
  <ns0:text x="122.6667" y="154.6667" font-family="monospace" font-size="16" fill="#212121">home/</ns0:text>
  <ns0:line x1="131.5556" y1="156.4444" x2="131.5556" y2="275.5556" stroke="#bdbdbd" stroke-width="1.3333" />
  <ns0:line x1="131.5556" y1="191.1111" x2="158.2222" y2="191.1111" stroke="#bdbdbd" stroke-width="1.3333" />
  <ns0:text x="165.3333" y="196.4444" font-family="monospace" font-size="15.1111" fill="#212121">alice/</ns0:text>
  <ns0:line x1="174.2222" y1="198.2222" x2="174.2222" y2="273.7778" stroke="#bdbdbd" stroke-width="1.3333" />
  <ns0:line x1="174.2222" y1="228.4444" x2="200.8889" y2="228.4444" stroke="#bdbdbd" stroke-width="1.3333" />
  <ns0:text x="208" y="233.7778" font-family="monospace" font-size="14.2222" fill="#212121">documents/</ns0:text>
  <ns0:line x1="216.8889" y1="235.5556" x2="216.8889" y2="272.8889" stroke="#bdbdbd" stroke-width="1.3333" />
  <ns0:line x1="216.8889" y1="260.4444" x2="243.5556" y2="260.4444" stroke="#bdbdbd" stroke-width="1.3333" />
  <ns0:text x="250.6667" y="265.7778" font-family="monospace" font-size="13.3333" fill="#555555">report.txt</ns0:text>
  <ns0:line x1="174.2222" y1="272.8889" x2="200.8889" y2="272.8889" stroke="#bdbdbd" stroke-width="1.3333" />
  <ns0:text x="208" y="278.2222" font-family="monospace" font-size="14.2222" fill="#212121">downloads/</ns0:text>
  <ns0:line x1="131.5556" y1="313.7778" x2="158.2222" y2="313.7778" stroke="#bdbdbd" stroke-width="1.3333" />
  <ns0:text x="165.3333" y="319.1111" font-family="monospace" font-size="15.1111" fill="#212121">bob/</ns0:text>
  <ns0:line x1="88.8889" y1="353.7778" x2="115.5556" y2="353.7778" stroke="#bdbdbd" stroke-width="1.3333" />
  <ns0:text x="122.6667" y="359.1111" font-family="monospace" font-size="16" fill="#212121">usr/</ns0:text>
  <ns0:line x1="88.8889" y1="393.7778" x2="115.5556" y2="393.7778" stroke="#bdbdbd" stroke-width="1.3333" />
  <ns0:text x="122.6667" y="399.1111" font-family="monospace" font-size="16" fill="#212121">etc/</ns0:text>
  <ns0:line x1="88.8889" y1="433.7778" x2="115.5556" y2="433.7778" stroke="#bdbdbd" stroke-width="1.3333" />
  <ns0:text x="122.6667" y="439.1111" font-family="monospace" font-size="16" fill="#212121">var/</ns0:text>
  <ns0:line x1="88.8889" y1="473.7778" x2="115.5556" y2="473.7778" stroke="#bdbdbd" stroke-width="1.3333" />
  <ns0:text x="122.6667" y="479.1111" font-family="monospace" font-size="16" fill="#212121">tmp/</ns0:text>
  <ns0:rect x="497.7778" y="26.6667" width="613.3333" height="551.1111" rx="10.6667" fill="#f9f9f9" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:rect x="497.7778" y="26.6667" width="613.3333" height="42.6667" rx="10.6667" fill="url(#grad-primary)" />
  <ns0:rect x="497.7778" y="53.3333" width="613.3333" height="16" fill="url(#grad-primary)" />
  <ns0:text x="804.4444" y="55.1111" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#ffffff">Navigation Commands</ns0:text>
  <ns0:rect x="524.4444" y="81.7778" width="560" height="80" rx="7.1111" fill="#e3f2fd" stroke="#90caf9" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="551.1111" y="104.8889" font-family="monospace" font-size="17.7778" font-weight="bold" fill="#1565c0">pwd</ns0:text>
  <ns0:text x="551.1111" y="124.4444" font-family="monospace" font-size="12.4444" fill="#555555">Print Working Directory — shows current location</ns0:text>
  <ns0:text x="551.1111" y="140.4444" font-family="monospace" font-size="13.3333" fill="#212121">$ pwd  →  /home/alice/documents</ns0:text>
  <ns0:text x="551.1111" y="155.5556" font-family="monospace" font-size="10.6667" fill="#888888">No arguments needed</ns0:text>
  <ns0:rect x="524.4444" y="177.7778" width="560" height="115.5556" rx="7.1111" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="551.1111" y="200.8889" font-family="monospace" font-size="17.7778" font-weight="bold" fill="#2e7d32">ls</ns0:text>
  <ns0:text x="551.1111" y="220.4444" font-family="monospace" font-size="12.4444" fill="#555555">List directory contents</ns0:text>
  <ns0:text x="551.1111" y="240" font-family="monospace" font-size="13.3333" fill="#212121">$ ls              → file1.txt  dir1/  report.pdf</ns0:text>
  <ns0:text x="551.1111" y="257.7778" font-family="monospace" font-size="13.3333" fill="#212121">$ ls -l           → long format with permissions</ns0:text>
  <ns0:text x="551.1111" y="275.5556" font-family="monospace" font-size="13.3333" fill="#212121">$ ls -la          → include hidden files (dot files)</ns0:text>
  <ns0:text x="551.1111" y="291.5556" font-family="monospace" font-size="10.6667" fill="#888888">Flags: -l (long)  -a (all)  -h (human sizes)  -R (recursive)</ns0:text>
  <ns0:rect x="524.4444" y="309.3333" width="560" height="155.5556" rx="7.1111" fill="#fff3e0" stroke="#ffcc80" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="551.1111" y="332.4444" font-family="monospace" font-size="17.7778" font-weight="bold" fill="#e65100">cd</ns0:text>
  <ns0:text x="551.1111" y="352" font-family="monospace" font-size="12.4444" fill="#555555">Change Directory — move around the tree</ns0:text>
  <ns0:text x="551.1111" y="373.3333" font-family="monospace" font-size="13.3333" fill="#212121">$ cd /home/alice/documents   → absolute path</ns0:text>
  <ns0:text x="551.1111" y="392.8889" font-family="monospace" font-size="13.3333" fill="#212121">$ cd documents               → relative path</ns0:text>
  <ns0:text x="551.1111" y="412.4444" font-family="monospace" font-size="13.3333" fill="#212121">$ cd ..                      → go up one level</ns0:text>
  <ns0:text x="551.1111" y="432" font-family="monospace" font-size="13.3333" fill="#212121">$ cd ~                       → go to home dir</ns0:text>
  <ns0:text x="551.1111" y="451.5556" font-family="monospace" font-size="13.3333" fill="#212121">$ cd -                       → previous directory</ns0:text>
  <ns0:rect x="524.4444" y="480" width="560" height="71.1111" rx="7.1111" fill="#f3e5f5" stroke="#ce93d8" stroke-width="1.3333" />
  <ns0:text x="551.1111" y="502.2222" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="#6a1b9a">Tip: Tab completion</ns0:text>
  <ns0:text x="551.1111" y="521.7778" font-family="monospace" font-size="12.4444" fill="#555555">Type the first letters of a path then press TAB →</ns0:text>
  <ns0:text x="551.1111" y="539.5556" font-family="monospace" font-size="12.4444" fill="#555555">the shell auto-completes file and directory names.</ns0:text>
</ns0:svg>
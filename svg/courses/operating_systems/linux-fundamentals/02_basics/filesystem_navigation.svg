<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="68.125" y="64.1667" width="450" height="499.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="68.125" y="64.1667" width="450" height="38.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="68.125" y="88.3333" width="450" height="14.5" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="293.125" y="89.9444" text-anchor="middle" font-family="monospace" font-size="15.6425" font-weight="bold" fill="var(--bg)">Directory Tree</text>
  <text x="115" y="135.0556" font-family="monospace" font-size="17.3806" fill="var(--primary-accent)" font-weight="bold">/</text>
  <line x1="133.75" y1="138.2777" x2="133.75" y2="507.2223" stroke="var(--border)" stroke-width="1.3333" />
  <line x1="133.75" y1="175.3333" x2="161.875" y2="175.3333" stroke="var(--border)" stroke-width="1.3333" />
  <text x="169.375" y="180.1667" font-family="monospace" font-size="15.6425" fill="var(--text)">home/</text>
  <line x1="178.75" y1="181.7777" x2="178.75" y2="289.7223" stroke="var(--border)" stroke-width="1.3333" />
  <line x1="178.75" y1="213.1944" x2="206.875" y2="213.1944" stroke="var(--border)" stroke-width="1.3333" />
  <text x="214.375" y="218.0277" font-family="monospace" font-size="14.7735" fill="var(--text)">alice/</text>
  <line x1="223.75" y1="219.6389" x2="223.75" y2="288.1111" stroke="var(--border)" stroke-width="1.3333" />
  <line x1="223.75" y1="247.0277" x2="251.875" y2="247.0277" stroke="var(--border)" stroke-width="1.3333" />
  <text x="259.375" y="251.8611" font-family="monospace" font-size="13.9044" fill="var(--text)">documents/</text>
  <line x1="268.75" y1="253.4723" x2="268.75" y2="287.3056" stroke="var(--border)" stroke-width="1.3333" />
  <line x1="268.75" y1="276.0277" x2="296.875" y2="276.0277" stroke="var(--border)" stroke-width="1.3333" />
  <text x="304.375" y="280.8611" font-family="monospace" font-size="13.0354" fill="var(--text-muted)">report.txt</text>
  <line x1="223.75" y1="287.3056" x2="251.875" y2="287.3056" stroke="var(--border)" stroke-width="1.3333" />
  <text x="259.375" y="292.1389" font-family="monospace" font-size="13.9044" fill="var(--text)">downloads/</text>
  <line x1="178.75" y1="324.3611" x2="206.875" y2="324.3611" stroke="var(--border)" stroke-width="1.3333" />
  <text x="214.375" y="329.1944" font-family="monospace" font-size="14.7735" fill="var(--text)">bob/</text>
  <line x1="133.75" y1="360.6111" x2="161.875" y2="360.6111" stroke="var(--border)" stroke-width="1.3333" />
  <text x="169.375" y="365.4444" font-family="monospace" font-size="15.6425" fill="var(--text)">usr/</text>
  <line x1="133.75" y1="396.8611" x2="161.875" y2="396.8611" stroke="var(--border)" stroke-width="1.3333" />
  <text x="169.375" y="401.6944" font-family="monospace" font-size="15.6425" fill="var(--text)">etc/</text>
  <line x1="133.75" y1="433.1111" x2="161.875" y2="433.1111" stroke="var(--border)" stroke-width="1.3333" />
  <text x="169.375" y="437.9444" font-family="monospace" font-size="15.6425" fill="var(--text)">var/</text>
  <line x1="133.75" y1="469.3611" x2="161.875" y2="469.3611" stroke="var(--border)" stroke-width="1.3333" />
  <text x="169.375" y="474.1944" font-family="monospace" font-size="15.6425" fill="var(--text)">tmp/</text>
  <rect x="565" y="64.1667" width="646.875" height="499.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="565" y="64.1667" width="646.875" height="38.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="565" y="88.3333" width="646.875" height="14.5" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="888.4374" y="89.9444" text-anchor="middle" font-family="monospace" font-size="15.6425" font-weight="bold" fill="var(--bg)">Navigation Commands</text>
  <rect x="593.1249" y="114.1111" width="590.625" height="72.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="621.25" y="135.0556" font-family="monospace" font-size="17.3806" font-weight="bold" fill="var(--primary-accent)">pwd</text>
  <text x="621.25" y="152.7777" font-family="monospace" font-size="12.1663" fill="var(--text-muted)">Print Working Directory — shows current location</text>
  <text x="621.25" y="167.2777" font-family="monospace" font-size="13.0354" fill="var(--text)">$ pwd  →  /home/alice/documents</text>
  <text x="621.25" y="180.9723" font-family="monospace" font-size="10.4284" fill="var(--text-faint)">No arguments needed</text>
  <rect x="593.1249" y="201.1111" width="590.625" height="104.7223" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="621.25" y="222.0556" font-family="monospace" font-size="17.3806" font-weight="bold" fill="var(--ok-accent)">ls</text>
  <text x="621.25" y="239.7777" font-family="monospace" font-size="12.1663" fill="var(--text-muted)">List directory contents</text>
  <text x="621.25" y="257.5" font-family="monospace" font-size="13.0354" fill="var(--text)">$ ls              → file1.txt  dir1/  report.pdf</text>
  <text x="621.25" y="273.6111" font-family="monospace" font-size="13.0354" fill="var(--text)">$ ls -l           → long format with permissions</text>
  <text x="621.25" y="289.7223" font-family="monospace" font-size="13.0354" fill="var(--text)">$ ls -la          → include hidden files (dot files)</text>
  <text x="621.25" y="304.2223" font-family="monospace" font-size="10.4284" fill="var(--text-faint)">Flags: -l (long)  -a (all)  -h (human sizes)  -R (recursive)</text>
  <rect x="593.1249" y="320.3333" width="590.625" height="140.9723" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="621.25" y="341.2777" font-family="monospace" font-size="17.3806" font-weight="bold" fill="var(--warn-accent)">cd</text>
  <text x="621.25" y="359" font-family="monospace" font-size="12.1663" fill="var(--text-muted)">Change Directory — move around the tree</text>
  <text x="621.25" y="378.3333" font-family="monospace" font-size="13.0354" fill="var(--text)">$ cd /home/alice/documents   → absolute path</text>
  <text x="621.25" y="396.0556" font-family="monospace" font-size="13.0354" fill="var(--text)">$ cd documents               → relative path</text>
  <text x="621.25" y="413.7777" font-family="monospace" font-size="13.0354" fill="var(--text)">$ cd ..                      → go up one level</text>
  <text x="621.25" y="431.5" font-family="monospace" font-size="13.0354" fill="var(--text)">$ cd ~                       → go to home dir</text>
  <text x="621.25" y="449.2223" font-family="monospace" font-size="13.0354" fill="var(--text)">$ cd -                       → previous directory</text>
  <rect x="593.1249" y="475" width="590.625" height="64.4444" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="621.25" y="495.1389" font-family="sans-serif" font-size="13.0354" font-weight="bold" fill="var(--info-accent)">Tip: Tab completion</text>
  <text x="621.25" y="512.8611" font-family="monospace" font-size="12.1663" fill="var(--text-muted)">Type the first letters of a path then press TAB →</text>
  <text x="621.25" y="528.9723" font-family="monospace" font-size="12.1663" fill="var(--text-muted)">the shell auto-completes file and directory names.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="26.6667" y="26.6667" width="426.6667" height="551.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="26.6667" y="26.6667" width="426.6667" height="42.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="26.6667" y="53.3333" width="426.6667" height="16" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="240" y="55.1111" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="var(--bg)">Directory Tree</text>
  <text x="71.1111" y="104.8889" font-family="monospace" font-size="17.7778" fill="var(--primary-accent)" font-weight="bold">/</text>
  <line x1="88.8889" y1="108.4444" x2="88.8889" y2="515.5556" stroke="var(--border)" stroke-width="1.3333" />
  <line x1="88.8889" y1="149.3333" x2="115.5556" y2="149.3333" stroke="var(--border)" stroke-width="1.3333" />
  <text x="122.6667" y="154.6667" font-family="monospace" font-size="16" fill="var(--text)">home/</text>
  <line x1="131.5556" y1="156.4444" x2="131.5556" y2="275.5556" stroke="var(--border)" stroke-width="1.3333" />
  <line x1="131.5556" y1="191.1111" x2="158.2222" y2="191.1111" stroke="var(--border)" stroke-width="1.3333" />
  <text x="165.3333" y="196.4444" font-family="monospace" font-size="15.1111" fill="var(--text)">alice/</text>
  <line x1="174.2222" y1="198.2222" x2="174.2222" y2="273.7778" stroke="var(--border)" stroke-width="1.3333" />
  <line x1="174.2222" y1="228.4444" x2="200.8889" y2="228.4444" stroke="var(--border)" stroke-width="1.3333" />
  <text x="208" y="233.7778" font-family="monospace" font-size="14.2222" fill="var(--text)">documents/</text>
  <line x1="216.8889" y1="235.5556" x2="216.8889" y2="272.8889" stroke="var(--border)" stroke-width="1.3333" />
  <line x1="216.8889" y1="260.4444" x2="243.5556" y2="260.4444" stroke="var(--border)" stroke-width="1.3333" />
  <text x="250.6667" y="265.7778" font-family="monospace" font-size="13.3333" fill="var(--text-muted)">report.txt</text>
  <line x1="174.2222" y1="272.8889" x2="200.8889" y2="272.8889" stroke="var(--border)" stroke-width="1.3333" />
  <text x="208" y="278.2222" font-family="monospace" font-size="14.2222" fill="var(--text)">downloads/</text>
  <line x1="131.5556" y1="313.7778" x2="158.2222" y2="313.7778" stroke="var(--border)" stroke-width="1.3333" />
  <text x="165.3333" y="319.1111" font-family="monospace" font-size="15.1111" fill="var(--text)">bob/</text>
  <line x1="88.8889" y1="353.7778" x2="115.5556" y2="353.7778" stroke="var(--border)" stroke-width="1.3333" />
  <text x="122.6667" y="359.1111" font-family="monospace" font-size="16" fill="var(--text)">usr/</text>
  <line x1="88.8889" y1="393.7778" x2="115.5556" y2="393.7778" stroke="var(--border)" stroke-width="1.3333" />
  <text x="122.6667" y="399.1111" font-family="monospace" font-size="16" fill="var(--text)">etc/</text>
  <line x1="88.8889" y1="433.7778" x2="115.5556" y2="433.7778" stroke="var(--border)" stroke-width="1.3333" />
  <text x="122.6667" y="439.1111" font-family="monospace" font-size="16" fill="var(--text)">var/</text>
  <line x1="88.8889" y1="473.7778" x2="115.5556" y2="473.7778" stroke="var(--border)" stroke-width="1.3333" />
  <text x="122.6667" y="479.1111" font-family="monospace" font-size="16" fill="var(--text)">tmp/</text>
  <rect x="497.7778" y="26.6667" width="613.3333" height="551.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="497.7778" y="26.6667" width="613.3333" height="42.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="497.7778" y="53.3333" width="613.3333" height="16" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="804.4444" y="55.1111" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="var(--bg)">Navigation Commands</text>
  <rect x="524.4444" y="81.7778" width="560" height="80" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="551.1111" y="104.8889" font-family="monospace" font-size="17.7778" font-weight="bold" fill="var(--primary-accent)">pwd</text>
  <text x="551.1111" y="124.4444" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">Print Working Directory — shows current location</text>
  <text x="551.1111" y="140.4444" font-family="monospace" font-size="13.3333" fill="var(--text)">$ pwd  →  /home/alice/documents</text>
  <text x="551.1111" y="155.5556" font-family="monospace" font-size="10.6667" fill="var(--text-faint)">No arguments needed</text>
  <rect x="524.4444" y="177.7778" width="560" height="115.5556" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="551.1111" y="200.8889" font-family="monospace" font-size="17.7778" font-weight="bold" fill="var(--ok-accent)">ls</text>
  <text x="551.1111" y="220.4444" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">List directory contents</text>
  <text x="551.1111" y="240" font-family="monospace" font-size="13.3333" fill="var(--text)">$ ls              → file1.txt  dir1/  report.pdf</text>
  <text x="551.1111" y="257.7778" font-family="monospace" font-size="13.3333" fill="var(--text)">$ ls -l           → long format with permissions</text>
  <text x="551.1111" y="275.5556" font-family="monospace" font-size="13.3333" fill="var(--text)">$ ls -la          → include hidden files (dot files)</text>
  <text x="551.1111" y="291.5556" font-family="monospace" font-size="10.6667" fill="var(--text-faint)">Flags: -l (long)  -a (all)  -h (human sizes)  -R (recursive)</text>
  <rect x="524.4444" y="309.3333" width="560" height="155.5556" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="551.1111" y="332.4444" font-family="monospace" font-size="17.7778" font-weight="bold" fill="var(--warn-accent)">cd</text>
  <text x="551.1111" y="352" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">Change Directory — move around the tree</text>
  <text x="551.1111" y="373.3333" font-family="monospace" font-size="13.3333" fill="var(--text)">$ cd /home/alice/documents   → absolute path</text>
  <text x="551.1111" y="392.8889" font-family="monospace" font-size="13.3333" fill="var(--text)">$ cd documents               → relative path</text>
  <text x="551.1111" y="412.4444" font-family="monospace" font-size="13.3333" fill="var(--text)">$ cd ..                      → go up one level</text>
  <text x="551.1111" y="432" font-family="monospace" font-size="13.3333" fill="var(--text)">$ cd ~                       → go to home dir</text>
  <text x="551.1111" y="451.5556" font-family="monospace" font-size="13.3333" fill="var(--text)">$ cd -                       → previous directory</text>
  <rect x="524.4444" y="480" width="560" height="71.1111" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="551.1111" y="502.2222" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--info-accent)">Tip: Tab completion</text>
  <text x="551.1111" y="521.7778" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">Type the first letters of a path then press TAB →</text>
  <text x="551.1111" y="539.5556" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">the shell auto-completes file and directory names.</text>
</svg>
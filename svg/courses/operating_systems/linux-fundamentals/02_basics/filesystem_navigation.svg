<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="470" height="580" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="40" y="40" width="470" height="50" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="275" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">Directory Tree</text>

  <text x="90" y="130" font-family="Courier New, monospace" font-size="20" font-weight="bold" fill="var(--primary-accent)">/</text>
  <line x1="110" y1="135" x2="110" y2="510" stroke="var(--border)" stroke-width="1.5"/>

  <line x1="110" y1="170" x2="140" y2="170" stroke="var(--border)" stroke-width="1.5"/>
  <text x="150" y="177" font-family="Courier New, monospace" font-size="17" fill="var(--text)">home/</text>
  <line x1="160" y1="180" x2="160" y2="300" stroke="var(--border)" stroke-width="1.5"/>

  <line x1="160" y1="215" x2="190" y2="215" stroke="var(--border)" stroke-width="1.5"/>
  <text x="200" y="222" font-family="Courier New, monospace" font-size="16" fill="var(--text)">alice/</text>
  <line x1="210" y1="225" x2="210" y2="290" stroke="var(--border)" stroke-width="1.5"/>
  <line x1="210" y1="255" x2="240" y2="255" stroke="var(--border)" stroke-width="1.5"/>
  <text x="250" y="262" font-family="Courier New, monospace" font-size="15" fill="var(--text)">documents/</text>
  <line x1="210" y1="290" x2="240" y2="290" stroke="var(--border)" stroke-width="1.5"/>
  <text x="250" y="297" font-family="Courier New, monospace" font-size="15" fill="var(--text)">downloads/</text>

  <line x1="160" y1="335" x2="190" y2="335" stroke="var(--border)" stroke-width="1.5"/>
  <text x="200" y="342" font-family="Courier New, monospace" font-size="16" fill="var(--text)">bob/</text>

  <line x1="110" y1="385" x2="140" y2="385" stroke="var(--border)" stroke-width="1.5"/>
  <text x="150" y="392" font-family="Courier New, monospace" font-size="17" fill="var(--text)">usr/</text>

  <line x1="110" y1="425" x2="140" y2="425" stroke="var(--border)" stroke-width="1.5"/>
  <text x="150" y="432" font-family="Courier New, monospace" font-size="17" fill="var(--text)">etc/</text>

  <line x1="110" y1="465" x2="140" y2="465" stroke="var(--border)" stroke-width="1.5"/>
  <text x="150" y="472" font-family="Courier New, monospace" font-size="17" fill="var(--text)">var/</text>

  <line x1="110" y1="505" x2="140" y2="505" stroke="var(--border)" stroke-width="1.5"/>
  <text x="150" y="512" font-family="Courier New, monospace" font-size="17" fill="var(--text)">tmp/</text>

  <rect x="560" y="40" width="680" height="580" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="560" y="40" width="680" height="50" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="900" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">Navigation Commands</text>

  <rect x="585" y="105" width="630" height="90" rx="8" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="615" y="135" font-family="Courier New, monospace" font-size="20" font-weight="bold" fill="var(--primary-text)">pwd</text>
  <text x="615" y="158" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">Print working directory</text>
  <text x="615" y="180" font-family="Courier New, monospace" font-size="14" fill="var(--primary-text)">$ pwd → /home/alice</text>

  <rect x="585" y="210" width="630" height="130" rx="8" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="615" y="240" font-family="Courier New, monospace" font-size="20" font-weight="bold" fill="var(--ok-text)">ls</text>
  <text x="615" y="263" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">List contents</text>
  <text x="615" y="285" font-family="Courier New, monospace" font-size="14" fill="var(--ok-text)">$ ls -l   long format</text>
  <text x="615" y="305" font-family="Courier New, monospace" font-size="14" fill="var(--ok-text)">$ ls -la  include hidden</text>
  <text x="615" y="328" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">Flags: -l -a -h -R</text>

  <rect x="585" y="355" width="630" height="170" rx="8" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="615" y="385" font-family="Courier New, monospace" font-size="20" font-weight="bold" fill="var(--warn-text)">cd</text>
  <text x="615" y="408" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">Change directory</text>
  <text x="615" y="432" font-family="Courier New, monospace" font-size="14" fill="var(--warn-text)">$ cd /home/alice   absolute</text>
  <text x="615" y="454" font-family="Courier New, monospace" font-size="14" fill="var(--warn-text)">$ cd ..            up one</text>
  <text x="615" y="476" font-family="Courier New, monospace" font-size="14" fill="var(--warn-text)">$ cd ~             home</text>
  <text x="615" y="498" font-family="Courier New, monospace" font-size="14" fill="var(--warn-text)">$ cd -             previous</text>

  <rect x="585" y="540" width="630" height="65" rx="8" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="615" y="567" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--info-text)">Tip: Tab completion</text>
  <text x="615" y="590" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">Press TAB to auto-complete paths</text>
</svg>

<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:rect x="102.5025" y="51.8919" width="307.5075" height="138.3784" fill="#e3f2fd" stroke="#333" stroke-width="4.1001" rx="10.2503" />

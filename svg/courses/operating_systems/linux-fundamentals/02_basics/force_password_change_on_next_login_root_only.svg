<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="106.6667" y="54" width="320" height="144" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="266.6667" y="144" text-anchor="middle" font-size="23.4667" font-weight="bold">/etc/passwd</text>
  <rect x="480" y="54" width="320" height="144" fill="#ffebee" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="144" text-anchor="middle" font-size="23.4667" font-weight="bold">/etc/shadow</text>
  <rect x="853.3333" y="54" width="320" height="144" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1013.3333" y="144" text-anchor="middle" font-size="23.4667" font-weight="bold">PAM</text>
  <line x1="426.6667" y1="126" x2="480" y2="126" stroke="#333" stroke-width="4.2667" marker-end="url(#arr_pw)" />
  <line x1="800" y1="126" x2="853.3333" y2="126" stroke="#333" stroke-width="4.2667" marker-end="url(#arr_pw)" />
  <rect x="213.3333" y="270" width="853.3333" height="180" fill="#fff3e0" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="640" y="342" text-anchor="middle" font-size="21.3333" font-weight="bold">Password Storage Flow</text>
  <text x="640" y="406.8" text-anchor="middle" font-size="21.3333">passwd cmd -&gt; PAM -&gt; hash in /etc/shadow -&gt; chage policy</text>
  <rect x="320" y="522" width="640" height="144" fill="#e8f5e9" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="640" y="583.2" text-anchor="middle" font-size="21.3333">Hash algorithms: $6$ (SHA-512), $5$ (SHA-256)</text>
  <text x="640" y="640.8" text-anchor="middle" font-size="21.3333" fill="#666">passwd -S shows password status</text>
  <defs>

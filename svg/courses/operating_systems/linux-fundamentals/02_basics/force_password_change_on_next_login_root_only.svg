  <ns0:rect x="461.2613" y="51.8919" width="307.5075" height="138.3784" fill="#ffebee" stroke="#333" stroke-width="4.1001" rx="10.2503" />
  <ns0:text x="615.015" y="138.3784" text-anchor="middle" font-size="22.5506" font-weight="bold">/etc/shadow</ns0:text>
  <ns0:rect x="820.02" y="51.8919" width="307.5075" height="138.3784" fill="#f3e5f5" stroke="#333" stroke-width="4.1001" rx="10.2503" />
  <ns0:text x="973.7737" y="138.3784" text-anchor="middle" font-size="22.5506" font-weight="bold">PAM</ns0:text>
  <ns0:line x1="410.01" y1="121.0811" x2="461.2613" y2="121.0811" stroke="#333" stroke-width="4.1001" marker-end="url(#arr_pw)" />
  <ns0:line x1="768.7688" y1="121.0811" x2="820.02" y2="121.0811" stroke="#333" stroke-width="4.1001" marker-end="url(#arr_pw)" />
  <ns0:rect x="205.005" y="259.4595" width="820.02" height="172.973" fill="#fff3e0" stroke="#333" stroke-width="2.05" rx="6.1502" />
  <ns0:text x="615.015" y="328.6486" text-anchor="middle" font-size="20.5005" font-weight="bold">Password Storage Flow</ns0:text>
  <ns0:text x="615.015" y="390.9189" text-anchor="middle" font-size="20.5005">passwd cmd -&gt; PAM -&gt; hash in /etc/shadow -&gt; chage policy</ns0:text>
  <ns0:rect x="307.5075" y="501.6216" width="615.015" height="138.3784" fill="#e8f5e9" stroke="#333" stroke-width="2.05" rx="6.1502" />
  <ns0:text x="615.015" y="560.4324" text-anchor="middle" font-size="20.5005">Hash algorithms: $6$ (SHA-512), $5$ (SHA-256)</ns0:text>
  <ns0:text x="615.015" y="615.7838" text-anchor="middle" font-size="20.5005" fill="#666">passwd -S shows password status</ns0:text>
  <ns0:defs>


<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:rect x="102.5025" y="34.5946" width="328.008" height="190.2703" fill="#ffebee" stroke="#333" stroke-width="4.1001" rx="10.2503" />
  <ns0:text x="266.5065" y="103.7838" text-anchor="middle" font-size="20.5005" font-weight="bold">Permission denied</ns0:text>
  <ns0:text x="266.5065" y="172.973" text-anchor="middle" font-size="20.5005" fill="#666">sudo command</ns0:text>
  <ns0:rect x="451.011" y="34.5946" width="328.008" height="190.2703" fill="#fff3e0" stroke="#333" stroke-width="4.1001" rx="10.2503" />
  <ns0:text x="615.015" y="103.7838" text-anchor="middle" font-size="20.5005" font-weight="bold">Command not found</ns0:text>
  <ns0:text x="615.015" y="172.973" text-anchor="middle" font-size="20.5005" fill="#666">check $PATH</ns0:text>
  <ns0:rect x="799.5195" y="34.5946" width="328.008" height="190.2703" fill="#e3f2fd" stroke="#333" stroke-width="4.1001" rx="10.2503" />
  <ns0:text x="963.5236" y="103.7838" text-anchor="middle" font-size="20.5005" font-weight="bold">File not found</ns0:text>
  <ns0:text x="963.5236" y="172.973" text-anchor="middle" font-size="20.5005" fill="#666">check pwd, ls -la</ns0:text>
  <ns0:rect x="102.5025" y="276.7568" width="1025.0251" height="172.973" fill="#e8f5e9" stroke="#333" stroke-width="4.1001" rx="10.2503" />
  <ns0:text x="615.015" y="345.9459" text-anchor="middle" font-size="22.5506" font-weight="bold">Debugging Approach</ns0:text>
  <ns0:text x="615.015" y="408.2162" text-anchor="middle" font-size="20.5005">1. Read the error  2. Check path/perms  3. Use which/type  4. Check man page</ns0:text>
  <ns0:rect x="102.5025" y="501.6216" width="1025.0251" height="138.3784" fill="#f3e5f5" stroke="#333" stroke-width="2.05" rx="6.1502" />
  <ns0:text x="615.015" y="560.4324" text-anchor="middle" font-size="20.5005">Tip: use Tab completion to avoid typos, up-arrow for history</ns0:text>
  <ns0:text x="615.015" y="615.7838" text-anchor="middle" font-size="20.5005" fill="#666">echo $? shows exit code of last command (0=success)</ns0:text>
</ns0:svg>
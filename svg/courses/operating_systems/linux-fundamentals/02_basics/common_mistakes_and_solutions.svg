  <ns0:text x="615.015" y="560.4324" text-anchor="middle" font-size="20.5005">Tip: use Tab completion to avoid typos, up-arrow for history</ns0:text>
  <ns0:text x="615.015" y="615.7838" text-anchor="middle" font-size="20.5005" fill="#666">echo $? shows exit code of last command (0=success)</ns0:text>

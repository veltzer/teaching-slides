<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="106.6667" y="36" width="341.3333" height="198" fill="#ffebee" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="277.3333" y="108" text-anchor="middle" font-size="21.3333" font-weight="bold">Permission denied</text>
  <text x="277.3333" y="180" text-anchor="middle" font-size="21.3333" fill="#666">sudo command</text>
  <rect x="469.3333" y="36" width="341.3333" height="198" fill="#fff3e0" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="108" text-anchor="middle" font-size="21.3333" font-weight="bold">Command not found</text>
  <text x="640" y="180" text-anchor="middle" font-size="21.3333" fill="#666">check $PATH</text>
  <rect x="832" y="36" width="341.3333" height="198" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1002.6667" y="108" text-anchor="middle" font-size="21.3333" font-weight="bold">File not found</text>
  <text x="1002.6667" y="180" text-anchor="middle" font-size="21.3333" fill="#666">check pwd, ls -la</text>
  <rect x="106.6667" y="288" width="1066.6667" height="180" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="360" text-anchor="middle" font-size="23.4667" font-weight="bold">Debugging Approach</text>
  <text x="640" y="424.8" text-anchor="middle" font-size="21.3333">1. Read the error  2. Check path/perms  3. Use which/type  4. Check man page</text>
  <rect x="106.6667" y="522" width="1066.6667" height="144" fill="#f3e5f5" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="640" y="583.2" text-anchor="middle" font-size="21.3333">Tip: use Tab completion to avoid typos, up-arrow for history</text>
  <text x="640" y="640.8" text-anchor="middle" font-size="21.3333" fill="#666">echo $? shows exit code of last command (0=success)</text>
</svg>
  <ns0:text x="615.015" y="345.9459" text-anchor="middle" font-size="22.5506" font-weight="bold">Debugging Approach</ns0:text>
  <ns0:text x="615.015" y="408.2162" text-anchor="middle" font-size="20.5005">1. Read the error  2. Check path/perms  3. Use which/type  4. Check man page</ns0:text>

  <ns0:text x="338.2583" y="588.1081" text-anchor="middle" font-size="20.5005">logout | exit | Ctrl+D</ns0:text>
  <ns0:rect x="758.5185" y="449.7297" width="369.009" height="190.2703" fill="#ffebee" stroke="#333" stroke-width="2.05" rx="6.1502" />
  <ns0:text x="943.023" y="518.9189" text-anchor="middle" font-size="20.5005" font-weight="bold">Session Types</ns0:text>
  <ns0:text x="943.023" y="588.1081" text-anchor="middle" font-size="20.5005">console / SSH / GUI terminal</ns0:text>

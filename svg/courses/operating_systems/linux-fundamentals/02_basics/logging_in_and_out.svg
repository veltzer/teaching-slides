<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="102.5025" y="51.8919" width="287.007" height="155.6757" fill="var(--primary-pale)" stroke="var(--text-dark)" stroke-width="4.1001" rx="10.2503" />
  <text x="246.006" y="121.0811" text-anchor="middle" font-size="22.5506" font-weight="bold">User Terminal</text>
  <text x="246.006" y="172.973" text-anchor="middle" font-size="20.5005">username + password</text>
  <rect x="840.5206" y="51.8919" width="287.007" height="155.6757" fill="var(--ok-pale)" stroke="var(--text-dark)" stroke-width="4.1001" rx="10.2503" />
  <text x="984.024" y="121.0811" text-anchor="middle" font-size="22.5506" font-weight="bold">Login Shell</text>
  <text x="984.024" y="172.973" text-anchor="middle" font-size="20.5005">/bin/bash</text>
  <line x1="389.5095" y1="128" x2="840.5206" y2="128" stroke="var(--text-dark)" stroke-width="4.1001" marker-end="url(#arr_login)" />
  <text x="615.015" y="103.7838" text-anchor="middle" font-size="20.5005">login credentials</text>
  <rect x="287.007" y="276.7568" width="656.016" height="121.0811" fill="var(--warn-pale)" stroke="var(--text-dark)" stroke-width="2.05" rx="6.1502" />
  <text x="615.015" y="352.8649" text-anchor="middle" font-size="20.5005">/etc/passwd validates user, loads shell and HOME</text>
  <rect x="205.005" y="449.7297" width="266.5065" height="190.2703" fill="var(--info-pale)" stroke="var(--text-dark)" stroke-width="2.05" rx="6.1502" />
  <text x="338.2583" y="518.9189" text-anchor="middle" font-size="20.5005" font-weight="bold">Exit Methods</text>
  <text x="338.2583" y="588.1081" text-anchor="middle" font-size="20.5005">logout | exit | Ctrl+D</text>
  <rect x="758.5185" y="449.7297" width="369.009" height="190.2703" fill="var(--danger-pale)" stroke="var(--text-dark)" stroke-width="2.05" rx="6.1502" />
  <text x="943.023" y="518.9189" text-anchor="middle" font-size="20.5005" font-weight="bold">Session Types</text>
  <text x="943.023" y="588.1081" text-anchor="middle" font-size="20.5005">console / SSH / GUI terminal</text>

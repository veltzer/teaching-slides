<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:rect x="102.5025" y="51.8919" width="287.007" height="155.6757" fill="#e3f2fd" stroke="#333" stroke-width="4.1001" rx="10.2503" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <rect x="106.6667" y="36" width="1066.6667" height="126" fill="#fff3e0" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="118.8" text-anchor="middle" font-family="monospace" font-size="25.6">$ echo "hello world" | grep "hello"_</text>
  <text x="106.6667" y="241.2" font-size="21.3333" fill="#666">Cursor movement:</text>
  <rect x="106.6667" y="270" width="170.6667" height="100.8" fill="#e3f2fd" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="192" y="338.4" text-anchor="middle" font-size="21.3333">Ctrl+A</text>
  <rect x="298.6667" y="270" width="170.6667" height="100.8" fill="#e3f2fd" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="384" y="338.4" text-anchor="middle" font-size="21.3333">Ctrl+E</text>
  <rect x="490.6667" y="270" width="170.6667" height="100.8" fill="#f3e5f5" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="576" y="338.4" text-anchor="middle" font-size="21.3333">Alt+B</text>
  <rect x="682.6667" y="270" width="170.6667" height="100.8" fill="#f3e5f5" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="768" y="338.4" text-anchor="middle" font-size="21.3333">Alt+F</text>
  <text x="106.6667" y="450" font-size="21.3333" fill="#666">Editing:</text>
  <rect x="106.6667" y="478.8" width="170.6667" height="100.8" fill="#e8f5e9" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="192" y="547.2" text-anchor="middle" font-size="21.3333">Ctrl+U</text>
  <rect x="298.6667" y="478.8" width="170.6667" height="100.8" fill="#e8f5e9" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="384" y="547.2" text-anchor="middle" font-size="21.3333">Ctrl+K</text>
  <rect x="490.6667" y="478.8" width="170.6667" height="100.8" fill="#ffebee" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="576" y="547.2" text-anchor="middle" font-size="21.3333">Ctrl+W</text>
  <rect x="682.6667" y="478.8" width="170.6667" height="100.8" fill="#ffebee" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="768" y="547.2" text-anchor="middle" font-size="21.3333">Ctrl+Y</text>
  <text x="192" y="633.6" text-anchor="middle" font-size="21.3333" fill="#666">start of line</text>
  <text x="384" y="633.6" text-anchor="middle" font-size="21.3333" fill="#666">end of line</text>
  <text x="576" y="633.6" text-anchor="middle" font-size="21.3333" fill="#666">back word</text>
  <text x="768" y="633.6" text-anchor="middle" font-size="21.3333" fill="#666">fwd word</text>
</svg>
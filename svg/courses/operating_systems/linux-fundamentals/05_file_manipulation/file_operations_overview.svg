<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bd7d75"/><stop offset="100%" stop-color="#7d3f38"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/></marker>
  </defs>

  <!-- Stage 1: Input -->
  <rect x="40" y="40" width="230" height="200" rx="8" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="155" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">1. Input</text>
  <text x="60" y="110" font-family="Courier New, monospace" font-size="14" fill="var(--bg)">cat</text>
  <text x="60" y="140" font-family="Courier New, monospace" font-size="14" fill="var(--bg)">head / tail</text>
  <text x="60" y="170" font-family="Courier New, monospace" font-size="14" fill="var(--bg)">less</text>
  <text x="60" y="200" font-family="Courier New, monospace" font-size="14" fill="var(--bg)">find</text>

  <line x1="270" y1="140" x2="310" y2="140" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>

  <!-- Stage 2: Filter -->
  <rect x="310" y="40" width="230" height="200" rx="8" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="425" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">2. Filter</text>
  <text x="330" y="110" font-family="Courier New, monospace" font-size="14" fill="var(--bg)">grep</text>
  <text x="330" y="140" font-family="Courier New, monospace" font-size="14" fill="var(--bg)">sed</text>
  <text x="330" y="170" font-family="Courier New, monospace" font-size="14" fill="var(--bg)">awk</text>
  <text x="330" y="200" font-family="Courier New, monospace" font-size="14" fill="var(--bg)">cut / tr</text>

  <line x1="540" y1="140" x2="580" y2="140" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>

  <!-- Stage 3: Order -->
  <rect x="580" y="40" width="230" height="200" rx="8" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="695" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">3. Order</text>
  <text x="600" y="110" font-family="Courier New, monospace" font-size="14" fill="var(--bg)">sort</text>
  <text x="600" y="140" font-family="Courier New, monospace" font-size="14" fill="var(--bg)">uniq</text>
  <text x="600" y="170" font-family="Courier New, monospace" font-size="14" fill="var(--bg)">tee</text>
  <text x="600" y="200" font-family="Courier New, monospace" font-size="14" fill="var(--bg)">paste / join</text>

  <line x1="810" y1="140" x2="850" y2="140" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>

  <!-- Stage 4: Count -->
  <rect x="850" y="40" width="230" height="200" rx="8" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="965" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">4. Count</text>
  <text x="870" y="110" font-family="Courier New, monospace" font-size="14" fill="var(--bg)">wc</text>
  <text x="870" y="140" font-family="Courier New, monospace" font-size="14" fill="var(--bg)">awk (END)</text>
  <text x="870" y="170" font-family="Courier New, monospace" font-size="14" fill="var(--bg)">bc</text>
  <text x="870" y="200" font-family="Courier New, monospace" font-size="14" fill="var(--bg)">head -n1</text>

  <line x1="1080" y1="140" x2="1120" y2="140" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>

  <rect x="1120" y="80" width="120" height="120" rx="8" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1180" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">stdout</text>
  <text x="1180" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">or file</text>

  <!-- Real example code block -->
  <rect x="40" y="270" width="1200" height="180" rx="8" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--bg)">Top 5 log errors</text>
  <text x="70" y="335" font-family="Courier New, monospace" font-size="14" fill="var(--bg)">find /var/log -name "*.log" \</text>
  <text x="70" y="360" font-family="Courier New, monospace" font-size="14" fill="var(--bg)">  | xargs grep -i "error" \</text>
  <text x="70" y="385" font-family="Courier New, monospace" font-size="14" fill="var(--bg)">  | sort | uniq -c | sort -rn \</text>
  <text x="70" y="410" font-family="Courier New, monospace" font-size="14" fill="var(--bg)">  | head -n 5</text>

  <!-- Quick reference -->
  <rect x="40" y="470" width="1200" height="150" rx="8" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--bg)">Quick reference</text>
  <text x="70" y="535" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">grep -r "pat" dir/</text>
  <text x="70" y="560" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">sed 's/old/new/g' file</text>
  <text x="70" y="585" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">awk '{print $2}' file</text>
  <text x="670" y="535" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">sort -k2 -n file</text>
  <text x="670" y="560" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">cut -d: -f1 /etc/passwd</text>
  <text x="670" y="585" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">tr 'a-z' 'A-Z'</text>
</svg>

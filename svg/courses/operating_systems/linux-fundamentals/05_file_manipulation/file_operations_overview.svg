    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="var(--bg)" />
  <ns0:text x="568.8889" y="35.5556" text-anchor="middle" font-family="sans-serif" font-size="19.5556" font-weight="bold" fill="var(--primary-dk)">Text Processing Pipeline</ns0:text>
  <ns0:text x="568.8889" y="55.1111" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Data flows left to right through pipes ( | ), each tool transforming the stream</ns0:text>
  <ns0:rect x="22.2222" y="80" width="213.3333" height="177.7778" rx="8.8889" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:rect x="22.2222" y="80" width="213.3333" height="35.5556" rx="8.8889" fill="url(#grad-primary)" />
  <ns0:rect x="22.2222" y="102.2222" width="213.3333" height="13.3333" fill="url(#grad-primary)" />
  <ns0:text x="128.8889" y="103.1111" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--bg)">Stage 1: Input</ns0:text>
  <ns0:text x="48.8889" y="135.1111" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--primary-dk)">cat</ns0:text>
  <ns0:text x="48.8889" y="151.1111" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">Output whole file</ns0:text>
  <ns0:text x="48.8889" y="171.5556" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--primary-dk)">head / tail</ns0:text>
  <ns0:text x="48.8889" y="187.5556" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">First / last N lines</ns0:text>
  <ns0:text x="48.8889" y="208" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--primary-dk)">less</ns0:text>
  <ns0:text x="48.8889" y="224" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">Interactive pager</ns0:text>
  <ns0:text x="48.8889" y="244.4444" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--primary-dk)">find</ns0:text>
  <ns0:text x="48.8889" y="260.4444" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">Locate files by attr</ns0:text>
  <ns0:line x1="235.5556" y1="168.8889" x2="271.1111" y2="168.8889" stroke="var(--primary-dk)" stroke-width="2.6667" marker-end="url(#arrow-primary)" />
  <ns0:text x="253.3333" y="162.6667" text-anchor="middle" font-family="monospace" font-size="10.6667" fill="var(--primary-dk)">|</ns0:text>
  <ns0:rect x="271.1111" y="80" width="213.3333" height="177.7778" rx="8.8889" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:rect x="271.1111" y="80" width="213.3333" height="35.5556" rx="8.8889" fill="var(--ok-mid)" />
  <ns0:rect x="271.1111" y="102.2222" width="213.3333" height="13.3333" fill="var(--ok-mid)" />
  <ns0:text x="377.7778" y="103.1111" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--bg)">Stage 2: Filter</ns0:text>
  <ns0:text x="297.7778" y="135.1111" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--ok-deep)">grep</ns0:text>
  <ns0:text x="297.7778" y="151.1111" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">Match patterns (regex)</ns0:text>
  <ns0:text x="297.7778" y="171.5556" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--ok-deep)">sed</ns0:text>
  <ns0:text x="297.7778" y="187.5556" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">Stream edit / substitute</ns0:text>
  <ns0:text x="297.7778" y="208" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--ok-deep)">awk</ns0:text>
  <ns0:text x="297.7778" y="224" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">Field processing language</ns0:text>
  <ns0:text x="297.7778" y="244.4444" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--ok-deep)">cut / tr</ns0:text>
  <ns0:text x="297.7778" y="260.4444" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">Extract fields / translate</ns0:text>
  <ns0:line x1="484.4444" y1="168.8889" x2="520" y2="168.8889" stroke="var(--primary-dk)" stroke-width="2.6667" marker-end="url(#arrow-primary)" />
  <ns0:text x="502.2222" y="162.6667" text-anchor="middle" font-family="monospace" font-size="10.6667" fill="var(--primary-dk)">|</ns0:text>
  <ns0:rect x="520" y="80" width="213.3333" height="177.7778" rx="8.8889" fill="var(--warn-pale)" stroke="var(--warn-dk)" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:rect x="520" y="80" width="213.3333" height="35.5556" rx="8.8889" fill="var(--warn-mid)" />
  <ns0:rect x="520" y="102.2222" width="213.3333" height="13.3333" fill="var(--warn-mid)" />
  <ns0:text x="626.6667" y="103.1111" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--bg)">Stage 3: Order</ns0:text>
  <ns0:text x="546.6667" y="135.1111" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--danger-deeper)">sort</ns0:text>
  <ns0:text x="546.6667" y="151.1111" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">Alphabetical / numeric</ns0:text>
  <ns0:text x="546.6667" y="171.5556" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--danger-deeper)">uniq</ns0:text>
  <ns0:text x="546.6667" y="187.5556" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">Remove / count dups</ns0:text>
  <ns0:text x="546.6667" y="208" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--danger-deeper)">tee</ns0:text>
  <ns0:text x="546.6667" y="224" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">Split stream to file+pipe</ns0:text>
  <ns0:text x="546.6667" y="244.4444" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--danger-deeper)">paste / join</ns0:text>
  <ns0:text x="546.6667" y="260.4444" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">Merge lines / files</ns0:text>
  <ns0:line x1="733.3333" y1="168.8889" x2="768.8889" y2="168.8889" stroke="var(--primary-dk)" stroke-width="2.6667" marker-end="url(#arrow-primary)" />
  <ns0:text x="751.1111" y="162.6667" text-anchor="middle" font-family="monospace" font-size="10.6667" fill="var(--primary-dk)">|</ns0:text>
  <ns0:rect x="768.8889" y="80" width="213.3333" height="177.7778" rx="8.8889" fill="var(--info-pale)" stroke="var(--info-dk)" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:rect x="768.8889" y="80" width="213.3333" height="35.5556" rx="8.8889" fill="var(--info-mid)" />
  <ns0:rect x="768.8889" y="102.2222" width="213.3333" height="13.3333" fill="var(--info-mid)" />
  <ns0:text x="875.5556" y="103.1111" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--bg)">Stage 4: Count</ns0:text>
  <ns0:text x="795.5556" y="135.1111" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--info-deep)">wc</ns0:text>
  <ns0:text x="795.5556" y="151.1111" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">Word / line / byte count</ns0:text>
  <ns0:text x="795.5556" y="171.5556" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--info-deep)">awk (END)</ns0:text>
  <ns0:text x="795.5556" y="187.5556" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">Summarize / aggregate</ns0:text>
  <ns0:text x="795.5556" y="208" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--info-deep)">bc / expr</ns0:text>
  <ns0:text x="795.5556" y="224" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">Arithmetic on stream</ns0:text>
  <ns0:text x="795.5556" y="244.4444" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--info-deep)">head -n1</ns0:text>
  <ns0:text x="795.5556" y="260.4444" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">Top result only</ns0:text>
  <ns0:line x1="982.2222" y1="168.8889" x2="1017.7778" y2="168.8889" stroke="var(--primary-dk)" stroke-width="2.6667" marker-end="url(#arrow-primary)" />
  <ns0:rect x="1017.7778" y="106.6667" width="97.7778" height="124.4444" rx="8.8889" fill="url(#grad-surface)" stroke="var(--border-strong)" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="1066.6667" y="137.7778" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">stdout</ns0:text>
  <ns0:text x="1066.6667" y="155.5556" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">file</ns0:text>
  <ns0:text x="1066.6667" y="173.3333" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">or</ns0:text>
  <ns0:text x="1066.6667" y="191.1111" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">next</ns0:text>
  <ns0:text x="1066.6667" y="208.8889" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">command</ns0:text>
  <ns0:rect x="22.2222" y="280" width="1093.3333" height="177.7778" rx="10.6667" fill="var(--text)" filter="url(#shadow)" />
  <ns0:text x="44.4444" y="305.7778" font-family="monospace" font-size="11.5556" fill="var(--text-faint)"># Real-world example: find the 5 most common error messages in logs</ns0:text>
  <ns0:text x="44.4444" y="327.1111" font-family="monospace" font-size="13.3333" fill="var(--ok-tint)">find</ns0:text>
  <ns0:text x="97.7778" y="327.1111" font-family="monospace" font-size="13.3333" fill="var(--bg)">/var/log -name "*.log" \</ns0:text>
  <ns0:text x="44.4444" y="349.3333" font-family="monospace" font-size="13.3333" fill="var(--ok-tint)">  | xargs grep</ns0:text>
  <ns0:text x="177.7778" y="349.3333" font-family="monospace" font-size="13.3333" fill="var(--warn-tint)">-i "error"</ns0:text>
  <ns0:text x="44.4444" y="371.5556" font-family="monospace" font-size="13.3333" fill="var(--ok-tint)">  | grep</ns0:text>
  <ns0:text x="115.5556" y="371.5556" font-family="monospace" font-size="13.3333" fill="var(--warn-tint)">-oP '(?&lt;=\] ).*'</ns0:text>
  <ns0:text x="44.4444" y="393.7778" font-family="monospace" font-size="13.3333" fill="var(--ok-tint)">  | sort | uniq -c | sort</ns0:text>
  <ns0:text x="302.2222" y="393.7778" font-family="monospace" font-size="13.3333" fill="var(--warn-tint)">-rn</ns0:text>
  <ns0:text x="44.4444" y="416" font-family="monospace" font-size="13.3333" fill="var(--ok-tint)">  | head</ns0:text>
  <ns0:text x="115.5556" y="416" font-family="monospace" font-size="13.3333" fill="var(--warn-tint)">-n 5</ns0:text>
  <ns0:text x="44.4444" y="438.2222" font-family="monospace" font-size="13.3333" fill="var(--text-faint)"># Output: count + error message, sorted by frequency</ns0:text>
  <ns0:rect x="22.2222" y="475.5556" width="1093.3333" height="133.3333" rx="10.6667" fill="var(--surface-light)" stroke="var(--border)" stroke-width="1.3333" />
  <ns0:text x="44.4444" y="499.5556" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--primary-dk)">Quick Reference</ns0:text>
  <ns0:text x="44.4444" y="522.6667" font-family="monospace" font-size="11.5556" fill="var(--text)">grep -r "pattern" dir/     </ns0:text>
  <ns0:text x="297.7778" y="522.6667" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">recursive search</ns0:text>
  <ns0:text x="44.4444" y="542.2222" font-family="monospace" font-size="11.5556" fill="var(--text)">sed 's/old/new/g' file     </ns0:text>
  <ns0:text x="297.7778" y="542.2222" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">global substitution</ns0:text>
  <ns0:text x="44.4444" y="561.7778" font-family="monospace" font-size="11.5556" fill="var(--text)">awk '{print $2}' file      </ns0:text>
  <ns0:text x="297.7778" y="561.7778" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">print second field</ns0:text>
  <ns0:text x="44.4444" y="581.3333" font-family="monospace" font-size="11.5556" fill="var(--text)">sort -k2 -n file           </ns0:text>
  <ns0:text x="297.7778" y="581.3333" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">sort by 2nd field numerically</ns0:text>
  <ns0:text x="604.4444" y="522.6667" font-family="monospace" font-size="11.5556" fill="var(--text)">wc -l file                 </ns0:text>
  <ns0:text x="728.8889" y="522.6667" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">count lines</ns0:text>
  <ns0:text x="604.4444" y="542.2222" font-family="monospace" font-size="11.5556" fill="var(--text)">cut -d: -f1 /etc/passwd    </ns0:text>
  <ns0:text x="862.2222" y="542.2222" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">extract field from colon-delimited file</ns0:text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <text x="640" y="72.2223" text-anchor="middle" font-family="sans-serif" font-size="19.1186" font-weight="bold" fill="var(--primary-accent)">Text Processing Pipeline</text>
  <text x="640" y="89.9444" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">Data flows left to right through pipes ( | ), each tool transforming the stream</text>
  <rect x="63.4375" y="112.5" width="225" height="161.1111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="63.4375" y="112.5" width="225" height="32.2223" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="63.4375" y="132.6389" width="225" height="12.0833" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="175.9375" y="133.4444" text-anchor="middle" font-family="sans-serif" font-size="13.0354" font-weight="bold" fill="var(--bg)">Stage 1: Input</text>
  <text x="91.5625" y="162.4444" font-family="monospace" font-size="13.9044" font-weight="bold" fill="var(--primary-accent)">cat</text>
  <text x="91.5625" y="176.9444" font-family="sans-serif" font-size="10.4284" fill="var(--text-muted)">Output whole file</text>
  <text x="91.5625" y="195.4723" font-family="monospace" font-size="13.9044" font-weight="bold" fill="var(--primary-accent)">head / tail</text>
  <text x="91.5625" y="209.9723" font-family="sans-serif" font-size="10.4284" fill="var(--text-muted)">First / last N lines</text>
  <text x="91.5625" y="228.5" font-family="monospace" font-size="13.9044" font-weight="bold" fill="var(--primary-accent)">less</text>
  <text x="91.5625" y="243" font-family="sans-serif" font-size="10.4284" fill="var(--text-muted)">Interactive pager</text>
  <text x="91.5625" y="261.5277" font-family="monospace" font-size="13.9044" font-weight="bold" fill="var(--primary-accent)">find</text>
  <text x="91.5625" y="276.0277" font-family="sans-serif" font-size="10.4284" fill="var(--text-muted)">Locate files by attr</text>
  <line x1="288.4375" y1="193.0556" x2="325.9375" y2="193.0556" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="307.1875" y="187.4167" text-anchor="middle" font-family="monospace" font-size="10.4284" fill="var(--primary-accent)">|</text>
  <rect x="325.9375" y="112.5" width="225" height="161.1111" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="325.9375" y="112.5" width="225" height="32.2223" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="325.9375" y="132.6389" width="225" height="12.0833" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="438.4375" y="133.4444" text-anchor="middle" font-family="sans-serif" font-size="13.0354" font-weight="bold" fill="var(--bg)">Stage 2: Filter</text>
  <text x="354.0625" y="162.4444" font-family="monospace" font-size="13.9044" font-weight="bold" fill="var(--ok-accent)">grep</text>
  <text x="354.0625" y="176.9444" font-family="sans-serif" font-size="10.4284" fill="var(--text-muted)">Match patterns (regex)</text>
  <text x="354.0625" y="195.4723" font-family="monospace" font-size="13.9044" font-weight="bold" fill="var(--ok-accent)">sed</text>
  <text x="354.0625" y="209.9723" font-family="sans-serif" font-size="10.4284" fill="var(--text-muted)">Stream edit / substitute</text>
  <text x="354.0625" y="228.5" font-family="monospace" font-size="13.9044" font-weight="bold" fill="var(--ok-accent)">awk</text>
  <text x="354.0625" y="243" font-family="sans-serif" font-size="10.4284" fill="var(--text-muted)">Field processing language</text>
  <text x="354.0625" y="261.5277" font-family="monospace" font-size="13.9044" font-weight="bold" fill="var(--ok-accent)">cut / tr</text>
  <text x="354.0625" y="276.0277" font-family="sans-serif" font-size="10.4284" fill="var(--text-muted)">Extract fields / translate</text>
  <line x1="550.9374" y1="193.0556" x2="588.4375" y2="193.0556" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="569.6875" y="187.4167" text-anchor="middle" font-family="monospace" font-size="10.4284" fill="var(--primary-accent)">|</text>
  <rect x="588.4375" y="112.5" width="225" height="161.1111" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="588.4375" y="112.5" width="225" height="32.2223" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="588.4375" y="132.6389" width="225" height="12.0833" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="700.9375" y="133.4444" text-anchor="middle" font-family="sans-serif" font-size="13.0354" font-weight="bold" fill="var(--bg)">Stage 3: Order</text>
  <text x="616.5625" y="162.4444" font-family="monospace" font-size="13.9044" font-weight="bold" fill="var(--danger-accent)">sort</text>
  <text x="616.5625" y="176.9444" font-family="sans-serif" font-size="10.4284" fill="var(--text-muted)">Alphabetical / numeric</text>
  <text x="616.5625" y="195.4723" font-family="monospace" font-size="13.9044" font-weight="bold" fill="var(--danger-accent)">uniq</text>
  <text x="616.5625" y="209.9723" font-family="sans-serif" font-size="10.4284" fill="var(--text-muted)">Remove / count dups</text>
  <text x="616.5625" y="228.5" font-family="monospace" font-size="13.9044" font-weight="bold" fill="var(--danger-accent)">tee</text>
  <text x="616.5625" y="243" font-family="sans-serif" font-size="10.4284" fill="var(--text-muted)">Split stream to file+pipe</text>
  <text x="616.5625" y="261.5277" font-family="monospace" font-size="13.9044" font-weight="bold" fill="var(--danger-accent)">paste / join</text>
  <text x="616.5625" y="276.0277" font-family="sans-serif" font-size="10.4284" fill="var(--text-muted)">Merge lines / files</text>
  <line x1="813.4374" y1="193.0556" x2="850.9375" y2="193.0556" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="832.1875" y="187.4167" text-anchor="middle" font-family="monospace" font-size="10.4284" fill="var(--primary-accent)">|</text>
  <rect x="850.9375" y="112.5" width="225" height="161.1111" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="850.9375" y="112.5" width="225" height="32.2223" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="850.9375" y="132.6389" width="225" height="12.0833" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="963.4375" y="133.4444" text-anchor="middle" font-family="sans-serif" font-size="13.0354" font-weight="bold" fill="var(--bg)">Stage 4: Count</text>
  <text x="879.0625" y="162.4444" font-family="monospace" font-size="13.9044" font-weight="bold" fill="var(--info-accent)">wc</text>
  <text x="879.0625" y="176.9444" font-family="sans-serif" font-size="10.4284" fill="var(--text-muted)">Word / line / byte count</text>
  <text x="879.0625" y="195.4723" font-family="monospace" font-size="13.9044" font-weight="bold" fill="var(--info-accent)">awk (END)</text>
  <text x="879.0625" y="209.9723" font-family="sans-serif" font-size="10.4284" fill="var(--text-muted)">Summarize / aggregate</text>
  <text x="879.0625" y="228.5" font-family="monospace" font-size="13.9044" font-weight="bold" fill="var(--info-accent)">bc / expr</text>
  <text x="879.0625" y="243" font-family="sans-serif" font-size="10.4284" fill="var(--text-muted)">Arithmetic on stream</text>
  <text x="879.0625" y="261.5277" font-family="monospace" font-size="13.9044" font-weight="bold" fill="var(--info-accent)">head -n1</text>
  <text x="879.0625" y="276.0277" font-family="sans-serif" font-size="10.4284" fill="var(--text-muted)">Top result only</text>
  <line x1="1075.9375" y1="193.0556" x2="1113.4375" y2="193.0556" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="1113.4375" y="136.6667" width="103.125" height="112.7777" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1165" y="164.8611" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">stdout</text>
  <text x="1165" y="180.9723" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">file</text>
  <text x="1165" y="197.0833" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">or</text>
  <text x="1165" y="213.1944" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">next</text>
  <text x="1165" y="229.3056" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">command</text>
  <rect x="63.4375" y="293.75" width="1153.1249" height="161.1111" rx="6" fill="var(--text)" filter="url(#shadow)" />
  <text x="86.875" y="317.1111" font-family="monospace" font-size="11.2974" fill="var(--text-faint)"># Real-world example: find the 5 most common error messages in logs</text>
  <text x="86.875" y="336.4444" font-family="monospace" font-size="13.0354" fill="var(--ok-accent)">find</text>
  <text x="143.125" y="336.4444" font-family="monospace" font-size="13.0354" fill="var(--bg)">/var/log -name "*.log" \</text>
  <text x="86.875" y="356.5833" font-family="monospace" font-size="13.0354" fill="var(--ok-accent)">  | xargs grep</text>
  <text x="227.5" y="356.5833" font-family="monospace" font-size="13.0354" fill="var(--warn-accent)">-i "error"</text>
  <text x="86.875" y="376.7223" font-family="monospace" font-size="13.0354" fill="var(--ok-accent)">  | grep</text>
  <text x="161.875" y="376.7223" font-family="monospace" font-size="13.0354" fill="var(--warn-accent)">-oP '(?&lt;=\] ).*'</text>
  <text x="86.875" y="396.8611" font-family="monospace" font-size="13.0354" fill="var(--ok-accent)">  | sort | uniq -c | sort</text>
  <text x="358.75" y="396.8611" font-family="monospace" font-size="13.0354" fill="var(--warn-accent)">-rn</text>
  <text x="86.875" y="417" font-family="monospace" font-size="13.0354" fill="var(--ok-accent)">  | head</text>
  <text x="161.875" y="417" font-family="monospace" font-size="13.0354" fill="var(--warn-accent)">-n 5</text>
  <text x="86.875" y="437.1389" font-family="monospace" font-size="13.0354" fill="var(--text-faint)"># Output: count + error message, sorted by frequency</text>
  <rect x="63.4375" y="470.9723" width="1153.1249" height="120.8333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="86.875" y="492.7223" font-family="sans-serif" font-size="13.0354" font-weight="bold" fill="var(--primary-accent)">Quick Reference</text>
  <text x="86.875" y="513.6667" font-family="monospace" font-size="11.2974" fill="var(--text)">grep -r "pattern" dir/     </text>
  <text x="354.0625" y="513.6667" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">recursive search</text>
  <text x="86.875" y="531.3889" font-family="monospace" font-size="11.2974" fill="var(--text)">sed 's/old/new/g' file     </text>
  <text x="354.0625" y="531.3889" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">global substitution</text>
  <text x="86.875" y="549.1111" font-family="monospace" font-size="11.2974" fill="var(--text)">awk '{print $2}' file      </text>
  <text x="354.0625" y="549.1111" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">print second field</text>
  <text x="86.875" y="566.8333" font-family="monospace" font-size="11.2974" fill="var(--text)">sort -k2 -n file           </text>
  <text x="354.0625" y="566.8333" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">sort by 2nd field numerically</text>
  <text x="677.4999" y="513.6667" font-family="monospace" font-size="11.2974" fill="var(--text)">wc -l file                 </text>
  <text x="808.75" y="513.6667" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">count lines</text>
  <text x="677.4999" y="531.3889" font-family="monospace" font-size="11.2974" fill="var(--text)">cut -d: -f1 /etc/passwd    </text>
  <text x="949.375" y="531.3889" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">extract field from colon-delimited file</text>
  <text x="677.4999" y="549.1111" font-family="monospace" font-size="11.2974" fill="var(--text)">uniq -c | sort -rn         </text>
  <text x="949.375" y="549.1111" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">frequency count, most common first</text>
  <text x="677.4999" y="566.8333" font-family="monospace" font-size="11.2974" fill="var(--text)">tr 'a-z' 'A-Z'             </text>
  <text x="808.75" y="566.8333" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">uppercase conversion</text>
</svg>
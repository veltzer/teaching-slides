<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <text x="568.8889" y="35.5556" text-anchor="middle" font-family="sans-serif" font-size="19.5556" font-weight="bold" fill="var(--primary-accent)">Text Processing Pipeline</text>
  <text x="568.8889" y="55.1111" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Data flows left to right through pipes ( | ), each tool transforming the stream</text>
  <rect x="22.2222" y="80" width="213.3333" height="177.7778" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="22.2222" y="80" width="213.3333" height="35.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="22.2222" y="102.2222" width="213.3333" height="13.3333" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="128.8889" y="103.1111" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--bg)">Stage 1: Input</text>
  <text x="48.8889" y="135.1111" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--primary-accent)">cat</text>
  <text x="48.8889" y="151.1111" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">Output whole file</text>
  <text x="48.8889" y="171.5556" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--primary-accent)">head / tail</text>
  <text x="48.8889" y="187.5556" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">First / last N lines</text>
  <text x="48.8889" y="208" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--primary-accent)">less</text>
  <text x="48.8889" y="224" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">Interactive pager</text>
  <text x="48.8889" y="244.4444" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--primary-accent)">find</text>
  <text x="48.8889" y="260.4444" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">Locate files by attr</text>
  <line x1="235.5556" y1="168.8889" x2="271.1111" y2="168.8889" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="253.3333" y="162.6667" text-anchor="middle" font-family="monospace" font-size="10.6667" fill="var(--primary-accent)">|</text>
  <rect x="271.1111" y="80" width="213.3333" height="177.7778" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="271.1111" y="80" width="213.3333" height="35.5556" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="271.1111" y="102.2222" width="213.3333" height="13.3333" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="377.7778" y="103.1111" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--bg)">Stage 2: Filter</text>
  <text x="297.7778" y="135.1111" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--ok-accent)">grep</text>
  <text x="297.7778" y="151.1111" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">Match patterns (regex)</text>
  <text x="297.7778" y="171.5556" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--ok-accent)">sed</text>
  <text x="297.7778" y="187.5556" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">Stream edit / substitute</text>
  <text x="297.7778" y="208" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--ok-accent)">awk</text>
  <text x="297.7778" y="224" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">Field processing language</text>
  <text x="297.7778" y="244.4444" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--ok-accent)">cut / tr</text>
  <text x="297.7778" y="260.4444" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">Extract fields / translate</text>
  <line x1="484.4444" y1="168.8889" x2="520" y2="168.8889" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="502.2222" y="162.6667" text-anchor="middle" font-family="monospace" font-size="10.6667" fill="var(--primary-accent)">|</text>
  <rect x="520" y="80" width="213.3333" height="177.7778" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="520" y="80" width="213.3333" height="35.5556" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="520" y="102.2222" width="213.3333" height="13.3333" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="626.6667" y="103.1111" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--bg)">Stage 3: Order</text>
  <text x="546.6667" y="135.1111" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--danger-accent)">sort</text>
  <text x="546.6667" y="151.1111" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">Alphabetical / numeric</text>
  <text x="546.6667" y="171.5556" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--danger-accent)">uniq</text>
  <text x="546.6667" y="187.5556" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">Remove / count dups</text>
  <text x="546.6667" y="208" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--danger-accent)">tee</text>
  <text x="546.6667" y="224" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">Split stream to file+pipe</text>
  <text x="546.6667" y="244.4444" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--danger-accent)">paste / join</text>
  <text x="546.6667" y="260.4444" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">Merge lines / files</text>
  <line x1="733.3333" y1="168.8889" x2="768.8889" y2="168.8889" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="751.1111" y="162.6667" text-anchor="middle" font-family="monospace" font-size="10.6667" fill="var(--primary-accent)">|</text>
  <rect x="768.8889" y="80" width="213.3333" height="177.7778" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="768.8889" y="80" width="213.3333" height="35.5556" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="768.8889" y="102.2222" width="213.3333" height="13.3333" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="875.5556" y="103.1111" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--bg)">Stage 4: Count</text>
  <text x="795.5556" y="135.1111" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--info-accent)">wc</text>
  <text x="795.5556" y="151.1111" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">Word / line / byte count</text>
  <text x="795.5556" y="171.5556" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--info-accent)">awk (END)</text>
  <text x="795.5556" y="187.5556" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">Summarize / aggregate</text>
  <text x="795.5556" y="208" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--info-accent)">bc / expr</text>
  <text x="795.5556" y="224" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">Arithmetic on stream</text>
  <text x="795.5556" y="244.4444" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--info-accent)">head -n1</text>
  <text x="795.5556" y="260.4444" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">Top result only</text>
  <line x1="982.2222" y1="168.8889" x2="1017.7778" y2="168.8889" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="1017.7778" y="106.6667" width="97.7778" height="124.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1066.6667" y="137.7778" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">stdout</text>
  <text x="1066.6667" y="155.5556" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">file</text>
  <text x="1066.6667" y="173.3333" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">or</text>
  <text x="1066.6667" y="191.1111" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">next</text>
  <text x="1066.6667" y="208.8889" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">command</text>
  <rect x="22.2222" y="280" width="1093.3333" height="177.7778" rx="6" fill="var(--text)" filter="url(#shadow)" />
  <text x="44.4444" y="305.7778" font-family="monospace" font-size="11.5556" fill="var(--text-faint)"># Real-world example: find the 5 most common error messages in logs</text>
  <text x="44.4444" y="327.1111" font-family="monospace" font-size="13.3333" fill="var(--ok-accent)">find</text>
  <text x="97.7778" y="327.1111" font-family="monospace" font-size="13.3333" fill="var(--bg)">/var/log -name "*.log" \</text>
  <text x="44.4444" y="349.3333" font-family="monospace" font-size="13.3333" fill="var(--ok-accent)">  | xargs grep</text>
  <text x="177.7778" y="349.3333" font-family="monospace" font-size="13.3333" fill="var(--warn-accent)">-i "error"</text>
  <text x="44.4444" y="371.5556" font-family="monospace" font-size="13.3333" fill="var(--ok-accent)">  | grep</text>
  <text x="115.5556" y="371.5556" font-family="monospace" font-size="13.3333" fill="var(--warn-accent)">-oP '(?&lt;=\] ).*'</text>
  <text x="44.4444" y="393.7778" font-family="monospace" font-size="13.3333" fill="var(--ok-accent)">  | sort | uniq -c | sort</text>
  <text x="302.2222" y="393.7778" font-family="monospace" font-size="13.3333" fill="var(--warn-accent)">-rn</text>
  <text x="44.4444" y="416" font-family="monospace" font-size="13.3333" fill="var(--ok-accent)">  | head</text>
  <text x="115.5556" y="416" font-family="monospace" font-size="13.3333" fill="var(--warn-accent)">-n 5</text>
  <text x="44.4444" y="438.2222" font-family="monospace" font-size="13.3333" fill="var(--text-faint)"># Output: count + error message, sorted by frequency</text>
  <rect x="22.2222" y="475.5556" width="1093.3333" height="133.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="44.4444" y="499.5556" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--primary-accent)">Quick Reference</text>
  <text x="44.4444" y="522.6667" font-family="monospace" font-size="11.5556" fill="var(--text)">grep -r "pattern" dir/     </text>
  <text x="297.7778" y="522.6667" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">recursive search</text>
  <text x="44.4444" y="542.2222" font-family="monospace" font-size="11.5556" fill="var(--text)">sed 's/old/new/g' file     </text>
  <text x="297.7778" y="542.2222" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">global substitution</text>
  <text x="44.4444" y="561.7778" font-family="monospace" font-size="11.5556" fill="var(--text)">awk '{print $2}' file      </text>
  <text x="297.7778" y="561.7778" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">print second field</text>
  <text x="44.4444" y="581.3333" font-family="monospace" font-size="11.5556" fill="var(--text)">sort -k2 -n file           </text>
  <text x="297.7778" y="581.3333" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">sort by 2nd field numerically</text>
  <text x="604.4444" y="522.6667" font-family="monospace" font-size="11.5556" fill="var(--text)">wc -l file                 </text>
  <text x="728.8889" y="522.6667" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">count lines</text>
  <text x="604.4444" y="542.2222" font-family="monospace" font-size="11.5556" fill="var(--text)">cut -d: -f1 /etc/passwd    </text>
  <text x="862.2222" y="542.2222" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">extract field from colon-delimited file</text>
  <text x="604.4444" y="561.7778" font-family="monospace" font-size="11.5556" fill="var(--text)">uniq -c | sort -rn         </text>
  <text x="862.2222" y="561.7778" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">frequency count, most common first</text>
  <text x="604.4444" y="581.3333" font-family="monospace" font-size="11.5556" fill="var(--text)">tr 'a-z' 'A-Z'             </text>
  <text x="728.8889" y="581.3333" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">uppercase conversion</text>
</svg>
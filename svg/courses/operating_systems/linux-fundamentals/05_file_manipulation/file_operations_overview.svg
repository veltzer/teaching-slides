<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Pipeline title -->
  <text x="640" y="40" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#1565c0">Text Processing Pipeline</text>
  <text x="640" y="62" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555555">Data flows left to right through pipes ( | ), each tool transforming the stream</text>

  <!-- Stage 1: Input commands -->
  <rect x="25" y="90" width="240" height="200" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <rect x="25" y="90" width="240" height="40" rx="10" fill="url(#grad-accent)"/>
  <rect x="25" y="115" width="240" height="15" fill="url(#grad-accent)"/>
  <text x="145" y="116" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Stage 1: Input</text>
  <text x="55" y="152" font-family="monospace" font-size="16" font-weight="bold" fill="#1565c0">cat</text>
  <text x="55" y="170" font-family="sans-serif" font-size="12" fill="#555555">Output whole file</text>
  <text x="55" y="193" font-family="monospace" font-size="16" font-weight="bold" fill="#1565c0">head / tail</text>
  <text x="55" y="211" font-family="sans-serif" font-size="12" fill="#555555">First / last N lines</text>
  <text x="55" y="234" font-family="monospace" font-size="16" font-weight="bold" fill="#1565c0">less</text>
  <text x="55" y="252" font-family="sans-serif" font-size="12" fill="#555555">Interactive pager</text>
  <text x="55" y="275" font-family="monospace" font-size="16" font-weight="bold" fill="#1565c0">find</text>
  <text x="55" y="293" font-family="sans-serif" font-size="12" fill="#555555">Locate files by attr</text>

  <!-- Arrow 1→2 -->
  <line x1="265" y1="190" x2="305" y2="190" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow-accent)"/>
  <text x="285" y="183" text-anchor="middle" font-family="monospace" font-size="12" fill="#1565c0">|</text>

  <!-- Stage 2: Filter -->
  <rect x="305" y="90" width="240" height="200" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" filter="url(#shadow)"/>
  <rect x="305" y="90" width="240" height="40" rx="10" fill="#388e3c"/>
  <rect x="305" y="115" width="240" height="15" fill="#388e3c"/>
  <text x="425" y="116" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Stage 2: Filter</text>
  <text x="335" y="152" font-family="monospace" font-size="16" font-weight="bold" fill="#1b5e20">grep</text>
  <text x="335" y="170" font-family="sans-serif" font-size="12" fill="#555555">Match patterns (regex)</text>
  <text x="335" y="193" font-family="monospace" font-size="16" font-weight="bold" fill="#1b5e20">sed</text>
  <text x="335" y="211" font-family="sans-serif" font-size="12" fill="#555555">Stream edit / substitute</text>
  <text x="335" y="234" font-family="monospace" font-size="16" font-weight="bold" fill="#1b5e20">awk</text>
  <text x="335" y="252" font-family="sans-serif" font-size="12" fill="#555555">Field processing language</text>
  <text x="335" y="275" font-family="monospace" font-size="16" font-weight="bold" fill="#1b5e20">cut / tr</text>
  <text x="335" y="293" font-family="sans-serif" font-size="12" fill="#555555">Extract fields / translate</text>

  <!-- Arrow 2→3 -->
  <line x1="545" y1="190" x2="585" y2="190" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow-accent)"/>
  <text x="565" y="183" text-anchor="middle" font-family="monospace" font-size="12" fill="#1565c0">|</text>

  <!-- Stage 3: Sort/Unique -->
  <rect x="585" y="90" width="240" height="200" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="2" filter="url(#shadow)"/>
  <rect x="585" y="90" width="240" height="40" rx="10" fill="#f57c00"/>
  <rect x="585" y="115" width="240" height="15" fill="#f57c00"/>
  <text x="705" y="116" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Stage 3: Order</text>
  <text x="615" y="152" font-family="monospace" font-size="16" font-weight="bold" fill="#bf360c">sort</text>
  <text x="615" y="170" font-family="sans-serif" font-size="12" fill="#555555">Alphabetical / numeric</text>
  <text x="615" y="193" font-family="monospace" font-size="16" font-weight="bold" fill="#bf360c">uniq</text>
  <text x="615" y="211" font-family="sans-serif" font-size="12" fill="#555555">Remove / count dups</text>
  <text x="615" y="234" font-family="monospace" font-size="16" font-weight="bold" fill="#bf360c">tee</text>
  <text x="615" y="252" font-family="sans-serif" font-size="12" fill="#555555">Split stream to file+pipe</text>
  <text x="615" y="275" font-family="monospace" font-size="16" font-weight="bold" fill="#bf360c">paste / join</text>
  <text x="615" y="293" font-family="sans-serif" font-size="12" fill="#555555">Merge lines / files</text>

  <!-- Arrow 3→4 -->
  <line x1="825" y1="190" x2="865" y2="190" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow-accent)"/>
  <text x="845" y="183" text-anchor="middle" font-family="monospace" font-size="12" fill="#1565c0">|</text>

  <!-- Stage 4: Aggregate -->
  <rect x="865" y="90" width="240" height="200" rx="10" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2" filter="url(#shadow)"/>
  <rect x="865" y="90" width="240" height="40" rx="10" fill="#7b1fa2"/>
  <rect x="865" y="115" width="240" height="15" fill="#7b1fa2"/>
  <text x="985" y="116" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Stage 4: Count</text>
  <text x="895" y="152" font-family="monospace" font-size="16" font-weight="bold" fill="#4a148c">wc</text>
  <text x="895" y="170" font-family="sans-serif" font-size="12" fill="#555555">Word / line / byte count</text>
  <text x="895" y="193" font-family="monospace" font-size="16" font-weight="bold" fill="#4a148c">awk (END)</text>
  <text x="895" y="211" font-family="sans-serif" font-size="12" fill="#555555">Summarize / aggregate</text>
  <text x="895" y="234" font-family="monospace" font-size="16" font-weight="bold" fill="#4a148c">bc / expr</text>
  <text x="895" y="252" font-family="sans-serif" font-size="12" fill="#555555">Arithmetic on stream</text>
  <text x="895" y="275" font-family="monospace" font-size="16" font-weight="bold" fill="#4a148c">head -n1</text>
  <text x="895" y="293" font-family="sans-serif" font-size="12" fill="#555555">Top result only</text>

  <!-- Arrow 4→output -->
  <line x1="1105" y1="190" x2="1145" y2="190" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow-accent)"/>

  <!-- Output box -->
  <rect x="1145" y="120" width="110" height="140" rx="10" fill="url(#grad-surface)" stroke="#bdbdbd" stroke-width="2" filter="url(#shadow)"/>
  <text x="1200" y="155" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555555">stdout</text>
  <text x="1200" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555555">file</text>
  <text x="1200" y="195" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555555">or</text>
  <text x="1200" y="215" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555555">next</text>
  <text x="1200" y="235" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555555">command</text>

  <!-- Example pipeline -->
  <rect x="25" y="315" width="1230" height="200" rx="12" fill="#212121" filter="url(#shadow)"/>
  <text x="50" y="344" font-family="monospace" font-size="13" fill="#888888"># Real-world example: find the 5 most common error messages in logs</text>
  <text x="50" y="368" font-family="monospace" font-size="15" fill="#80cbc4">find</text>
  <text x="110" y="368" font-family="monospace" font-size="15" fill="#ffffff">/var/log -name "*.log" \</text>
  <text x="50" y="393" font-family="monospace" font-size="15" fill="#aed581">  | xargs grep</text>
  <text x="200" y="393" font-family="monospace" font-size="15" fill="#ffcc80">-i "error"</text>
  <text x="50" y="418" font-family="monospace" font-size="15" fill="#aed581">  | grep</text>
  <text x="130" y="418" font-family="monospace" font-size="15" fill="#ffcc80">-oP '(?&lt;=\] ).*'</text>
  <text x="50" y="443" font-family="monospace" font-size="15" fill="#aed581">  | sort | uniq -c | sort</text>
  <text x="340" y="443" font-family="monospace" font-size="15" fill="#ffcc80">-rn</text>
  <text x="50" y="468" font-family="monospace" font-size="15" fill="#aed581">  | head</text>
  <text x="130" y="468" font-family="monospace" font-size="15" fill="#ffcc80">-n 5</text>
  <text x="50" y="493" font-family="monospace" font-size="15" fill="#888888"># Output: count + error message, sorted by frequency</text>

  <!-- Quick reference row -->
  <rect x="25" y="535" width="1230" height="150" rx="12" fill="#f8f9fa" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="50" y="562" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1565c0">Quick Reference</text>
  <text x="50" y="588" font-family="monospace" font-size="13" fill="#212121">grep -r "pattern" dir/     </text><text x="335" y="588" font-family="sans-serif" font-size="13" fill="#555555">recursive search</text>
  <text x="50" y="610" font-family="monospace" font-size="13" fill="#212121">sed 's/old/new/g' file     </text><text x="335" y="610" font-family="sans-serif" font-size="13" fill="#555555">global substitution</text>
  <text x="50" y="632" font-family="monospace" font-size="13" fill="#212121">awk '{print $2}' file      </text><text x="335" y="632" font-family="sans-serif" font-size="13" fill="#555555">print second field</text>
  <text x="50" y="654" font-family="monospace" font-size="13" fill="#212121">sort -k2 -n file           </text><text x="335" y="654" font-family="sans-serif" font-size="13" fill="#555555">sort by 2nd field numerically</text>

  <text x="680" y="588" font-family="monospace" font-size="13" fill="#212121">wc -l file                 </text><text x="820" y="588" font-family="sans-serif" font-size="13" fill="#555555">count lines</text>
  <text x="680" y="610" font-family="monospace" font-size="13" fill="#212121">cut -d: -f1 /etc/passwd    </text><text x="970" y="610" font-family="sans-serif" font-size="13" fill="#555555">extract field from colon-delimited file</text>
  <text x="680" y="632" font-family="monospace" font-size="13" fill="#212121">uniq -c | sort -rn         </text><text x="970" y="632" font-family="sans-serif" font-size="13" fill="#555555">frequency count, most common first</text>
  <text x="680" y="654" font-family="monospace" font-size="13" fill="#212121">tr 'a-z' 'A-Z'             </text><text x="820" y="654" font-family="sans-serif" font-size="13" fill="#555555">uppercase conversion</text>
</svg>

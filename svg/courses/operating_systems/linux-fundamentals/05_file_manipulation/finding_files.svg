      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="469.3333" y="144" width="341.3333" height="126" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="226.8" text-anchor="middle" font-size="23.4667" font-weight="bold">find /path</text>
  <line x1="554.6667" y1="270" x2="256" y2="378" stroke="#333" stroke-width="3.2" marker-end="url(#arrowfind)" />
  <line x1="640" y1="270" x2="640" y2="378" stroke="#333" stroke-width="3.2" marker-end="url(#arrowfind)" />
  <line x1="725.3333" y1="270" x2="1024" y2="378" stroke="#333" stroke-width="3.2" marker-end="url(#arrowfind)" />
  <rect x="85.3333" y="378" width="320" height="126" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="245.3333" y="457.2" text-anchor="middle" font-size="21.3333">-name "*.log"</text>
  <rect x="469.3333" y="378" width="341.3333" height="126" fill="#fff3e0" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="457.2" text-anchor="middle" font-size="21.3333">-type f -size +1M</text>
  <rect x="874.6667" y="378" width="320" height="126" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1034.6667" y="457.2" text-anchor="middle" font-size="21.3333">-mtime -7</text>
  <line x1="245.3333" y1="504" x2="469.3333" y2="594" stroke="#333" stroke-width="3.2" marker-end="url(#arrowfind)" />
  <line x1="640" y1="504" x2="640" y2="576" stroke="#333" stroke-width="3.2" marker-end="url(#arrowfind)" />
  <line x1="1034.6667" y1="504" x2="810.6667" y2="594" stroke="#333" stroke-width="3.2" marker-end="url(#arrowfind)" />
  <rect x="426.6667" y="576" width="426.6667" height="108" fill="#ffebee" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="648" text-anchor="middle" font-size="23.4667" font-weight="bold">-exec command {} \;</text>

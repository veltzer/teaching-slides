<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="90" text-anchor="middle" font-size="27.7333" font-weight="bold" fill="#333">find Command: Search the File Tree</text>
  <defs>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <text x="640" y="90" text-anchor="middle" font-size="27.7333" font-weight="bold" fill="#333">File Viewing Tools</text>
  <rect x="64" y="162" width="213.3333" height="198" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="170.6667" y="241.2" text-anchor="middle" font-size="23.4667" font-weight="bold">cat</text>
  <text x="170.6667" y="295.2" text-anchor="middle" font-size="21.3333">entire file</text>
  <rect x="330.6667" y="162" width="213.3333" height="198" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="437.3333" y="241.2" text-anchor="middle" font-size="23.4667" font-weight="bold">less/more</text>
  <text x="437.3333" y="295.2" text-anchor="middle" font-size="21.3333">paged view</text>
  <rect x="597.3333" y="162" width="213.3333" height="198" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="704" y="241.2" text-anchor="middle" font-size="23.4667" font-weight="bold">head</text>
  <text x="704" y="295.2" text-anchor="middle" font-size="21.3333">first N lines</text>
  <rect x="864" y="162" width="213.3333" height="198" fill="#fff3e0" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="970.6667" y="241.2" text-anchor="middle" font-size="23.4667" font-weight="bold">tail</text>
  <text x="970.6667" y="295.2" text-anchor="middle" font-size="21.3333">last N lines</text>
  <rect x="64" y="432" width="1013.3333" height="144" fill="#ffebee" stroke="#333" stroke-width="2.1333" rx="10.6667" opacity="0.7" />
  <text x="569.6" y="493.2" text-anchor="middle" font-size="23.4667" font-weight="bold">tail -f logfile.txt</text>
  <text x="569.6" y="547.2" text-anchor="middle" font-size="21.3333">Follow mode: watch file updates in real time</text>
  <line x1="970.6667" y1="360" x2="970.6667" y2="432" stroke="#333" stroke-width="3.2" stroke-dasharray="8.5333 6.4" />
</svg>
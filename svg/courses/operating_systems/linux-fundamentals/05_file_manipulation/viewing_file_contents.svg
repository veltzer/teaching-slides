<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="711.3306" y="80" text-anchor="middle" font-size="28.5322" font-weight="bold" fill="var(--text)">File Viewing Tools</text>
  <rect x="118.738" y="154.0741" width="219.4787" height="203.7037" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6.1728" />
  <text x="228.4774" y="235.5556" text-anchor="middle" font-size="24.1427" font-weight="bold">cat</text>
  <text x="228.4774" y="291.1111" text-anchor="middle" font-size="21.9478">entire file</text>
  <rect x="393.0865" y="154.0741" width="219.4787" height="203.7037" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6.1728" />
  <text x="502.8258" y="235.5556" text-anchor="middle" font-size="24.1427" font-weight="bold">less/more</text>
  <text x="502.8258" y="291.1111" text-anchor="middle" font-size="21.9478">paged view</text>
  <rect x="667.4348" y="154.0741" width="219.4787" height="203.7037" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6.1728" />
  <text x="777.1742" y="235.5556" text-anchor="middle" font-size="24.1427" font-weight="bold">head</text>
  <text x="777.1742" y="291.1111" text-anchor="middle" font-size="21.9478">first N lines</text>
  <rect x="941.7833" y="154.0741" width="219.4787" height="203.7037" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6.1728" />
  <text x="1051.5227" y="235.5556" text-anchor="middle" font-size="24.1427" font-weight="bold">tail</text>
  <text x="1051.5227" y="291.1111" text-anchor="middle" font-size="21.9478">last N lines</text>
  <rect x="118.738" y="431.8519" width="1042.524" height="148.1481" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6.1728" opacity="0.7" />
  <text x="638.9026" y="494.8148" text-anchor="middle" font-size="24.1427" font-weight="bold">tail -f logfile.txt</text>
  <text x="638.9026" y="550.3704" text-anchor="middle" font-size="21.9478">Follow mode: watch file updates in real time</text>
  <line x1="1051.5227" y1="357.7778" x2="1051.5227" y2="431.8519" stroke="var(--text)" stroke-width="2" stroke-dasharray="8.5333 6.4" />
</svg>
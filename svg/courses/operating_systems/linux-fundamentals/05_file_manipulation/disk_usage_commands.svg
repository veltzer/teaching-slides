<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="507.6923" height="580" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.44503365266" filter="url(#shadow)"/>
  <text x="293.8462" y="151.538492603548" text-anchor="middle" font-size="29.640817185812" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">df -h (filesystem)</text>
  <rect x="86.1539" y="205.076950591714" width="415.3846" height="89.230724852074" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.44503365266" filter="url(#shadow)"/>
  <text x="293.8462" y="267.538446449705" text-anchor="middle" font-size="24.700698891048" font-family="Arial, sans-serif" fill="var(--warn-text)">/dev/sda1  50G  30G  20G  60%</text>
  <rect x="86.1539" y="321.076904437871" width="415.3846" height="89.230724852074" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.44503365266" filter="url(#shadow)"/>
  <text x="293.8462" y="383.53851568047" text-anchor="middle" font-size="24.700698891048" font-family="Arial, sans-serif" fill="var(--warn-text)">/dev/sdb1 100G  80G  20G  80%</text>
  <rect x="86.1539" y="437.076973668636" width="415.3846" height="89.230724852074" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.44503365266" filter="url(#shadow)"/>
  <text x="293.8462" y="499.538469526627" text-anchor="middle" font-size="24.700698891048" font-family="Arial, sans-serif" fill="var(--danger-text)">tmpfs       4G   1G   3G  25%</text>
  <rect x="732.3077" y="40" width="507.6923" height="580" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.44503365266" filter="url(#shadow)"/>
  <text x="986.1539" y="151.538492603548" text-anchor="middle" font-size="29.640817185812" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">du -sh (directory)</text>
  <rect x="778.4616" y="205.076950591714" width="415.3846" height="89.230724852074" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.44503365266" filter="url(#shadow)"/>
  <text x="986.1539" y="267.538446449705" text-anchor="middle" font-size="24.700698891048" font-family="Arial, sans-serif" fill="var(--info-text)">2.1G  /home/user/docs</text>
  <rect x="778.4616" y="321.076904437871" width="415.3846" height="89.230724852074" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.44503365266" filter="url(#shadow)"/>
  <text x="986.1539" y="383.53851568047" text-anchor="middle" font-size="24.700698891048" font-family="Arial, sans-serif" fill="var(--info-text)">500M  /home/user/src</text>
  <rect x="778.4616" y="437.076973668636" width="415.3846" height="89.230724852074" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.44503365266" filter="url(#shadow)"/>
  <text x="986.1539" y="499.538469526627" text-anchor="middle" font-size="24.700698891048" font-family="Arial, sans-serif" fill="var(--info-text)">50M   /home/user/tmp</text>
</svg>

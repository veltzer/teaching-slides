<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <text x="640" y="90" text-anchor="middle" font-size="27.7333" font-weight="bold" fill="#333">Disk Usage: df vs du</text>
  <rect x="85.3333" y="162" width="469.3333" height="468" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="320" y="252" text-anchor="middle" font-size="25.6" font-weight="bold">df -h (filesystem)</text>
  <rect x="128" y="295.2" width="384" height="72" fill="#fff3e0" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="320" y="345.6" text-anchor="middle" font-size="21.3333">/dev/sda1  50G  30G  20G  60%</text>
  <rect x="128" y="388.8" width="384" height="72" fill="#fff3e0" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="320" y="439.2" text-anchor="middle" font-size="21.3333">/dev/sdb1 100G  80G  20G  80%</text>
  <rect x="128" y="482.4" width="384" height="72" fill="#ffebee" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="320" y="532.8" text-anchor="middle" font-size="21.3333">tmpfs       4G   1G   3G  25%</text>
  <rect x="725.3333" y="162" width="469.3333" height="468" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="960" y="252" text-anchor="middle" font-size="25.6" font-weight="bold">du -sh (directory)</text>
  <rect x="768" y="295.2" width="384" height="72" fill="#f3e5f5" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="960" y="345.6" text-anchor="middle" font-size="21.3333">2.1G  /home/user/docs</text>
  <rect x="768" y="388.8" width="384" height="72" fill="#f3e5f5" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="960" y="439.2" text-anchor="middle" font-size="21.3333">500M  /home/user/src</text>
  <rect x="768" y="482.4" width="384" height="72" fill="#f3e5f5" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="960" y="532.8" text-anchor="middle" font-size="21.3333">50M   /home/user/tmp</text>
</svg>
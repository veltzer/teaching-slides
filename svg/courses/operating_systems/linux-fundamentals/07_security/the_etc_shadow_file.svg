<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="79.2" text-anchor="middle" font-size="27.7333" font-weight="bold" fill="#333">/etc/shadow: Password Storage</text>
  <rect x="64" y="144" width="1152" height="144" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="205.2" text-anchor="middle" font-size="21.3333" font-family="monospace">john:$6$salt$hash...:18900:0:99999:7:::</text>
  <text x="640" y="259.2" text-anchor="middle" font-size="21.3333" fill="#666">username : hashed_password : last_change : min : max : warn : inactive : expire</text>
  <rect x="64" y="342" width="256" height="144" fill="#e3f2fd" stroke="#333" stroke-width="3.2" rx="8.5333" />
  <text x="192" y="403.2" text-anchor="middle" font-size="21.3333" font-weight="bold">$1$</text>
  <text x="192" y="457.2" text-anchor="middle" font-size="21.3333">MD5 (weak)</text>
  <rect x="362.6667" y="342" width="256" height="144" fill="#fff3e0" stroke="#333" stroke-width="3.2" rx="8.5333" />
  <text x="490.6667" y="403.2" text-anchor="middle" font-size="21.3333" font-weight="bold">$5$</text>
  <text x="490.6667" y="457.2" text-anchor="middle" font-size="21.3333">SHA-256</text>
  <rect x="661.3333" y="342" width="256" height="144" fill="#e8f5e9" stroke="#333" stroke-width="3.2" rx="8.5333" />
  <text x="789.3333" y="403.2" text-anchor="middle" font-size="21.3333" font-weight="bold">$6$</text>
  <text x="789.3333" y="457.2" text-anchor="middle" font-size="21.3333">SHA-512 (best)</text>
  <rect x="960" y="342" width="256" height="144" fill="#ffebee" stroke="#333" stroke-width="3.2" rx="8.5333" />
  <text x="1088" y="403.2" text-anchor="middle" font-size="21.3333" font-weight="bold">$y$</text>
  <text x="1088" y="457.2" text-anchor="middle" font-size="21.3333">yescrypt (new)</text>
  <rect x="64" y="540" width="1152" height="126" fill="#ffebee" stroke="#333" stroke-width="2.1333" rx="8.5333" opacity="0.5" />
  <text x="640" y="619.2" text-anchor="middle" font-size="21.3333">Only root can read /etc/shadow (permissions: 640, owner root:shadow)</text>
</svg>
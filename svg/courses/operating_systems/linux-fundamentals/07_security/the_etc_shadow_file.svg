<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="615.015" y="76.1081" text-anchor="middle" font-size="26.6506" font-weight="bold" fill="var(--text)">/etc/shadow: Password Storage</text>
  <rect x="61.5015" y="138.3784" width="1107.027" height="138.3784" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="615.015" y="197.1892" text-anchor="middle" font-size="20.5005" font-family="monospace">john:$6$salt$hash...:18900:0:99999:7:::</text>
  <text x="615.015" y="249.0811" text-anchor="middle" font-size="20.5005" fill="var(--text-muted)">username : hashed_password : last_change : min : max : warn : inactive : expire</text>
  <rect x="61.5015" y="328.6486" width="246.006" height="138.3784" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="184.5045" y="387.4595" text-anchor="middle" font-size="20.5005" font-weight="bold">$1$</text>
  <text x="184.5045" y="439.3514" text-anchor="middle" font-size="20.5005">MD5 (weak)</text>
  <rect x="348.5085" y="328.6486" width="246.006" height="138.3784" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="471.5115" y="387.4595" text-anchor="middle" font-size="20.5005" font-weight="bold">$5$</text>
  <text x="471.5115" y="439.3514" text-anchor="middle" font-size="20.5005">SHA-256</text>
  <rect x="635.5155" y="328.6486" width="246.006" height="138.3784" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="758.5185" y="387.4595" text-anchor="middle" font-size="20.5005" font-weight="bold">$6$</text>
  <text x="758.5185" y="439.3514" text-anchor="middle" font-size="20.5005">SHA-512 (best)</text>
  <rect x="922.5225" y="328.6486" width="246.006" height="138.3784" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="1045.5255" y="387.4595" text-anchor="middle" font-size="20.5005" font-weight="bold">$y$</text>
  <text x="1045.5255" y="439.3514" text-anchor="middle" font-size="20.5005">yescrypt (new)</text>
  <rect x="61.5015" y="518.9189" width="1107.027" height="121.0811" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" opacity="0.5" />
  <text x="615.015" y="595.027" text-anchor="middle" font-size="20.5005">Only root can read /etc/shadow (permissions: 640, owner root:shadow)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="28.1407" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">/etc/shadow: Password Storage</text>
  <rect x="40" y="104.0491" width="1200" height="142.3313" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="164.5399" text-anchor="middle" font-size="21.6467" font-family="Courier New, monospace" fill="var(--info-text)">john:$6$salt$hash...:18900:0:99999:7:::</text>
  <text x="640" y="217.9141" text-anchor="middle" font-size="21.6467" fill="var(--text-muted)" font-family="Arial, sans-serif">username : hashed_password : last_change : min : max : warn : inactive : expire</text>
  <rect x="40" y="299.7546" width="266.6667" height="142.3313" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="173.3333" y="360.2454" text-anchor="middle" font-size="21.6467" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">$1$</text>
  <text x="173.3333" y="413.6197" text-anchor="middle" font-size="21.6467" font-family="Arial, sans-serif" fill="var(--primary-text)">MD5 (weak)</text>
  <rect x="351.1111" y="299.7546" width="266.6667" height="142.3313" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="484.4444" y="360.2454" text-anchor="middle" font-size="21.6467" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">$5$</text>
  <text x="484.4444" y="413.6197" text-anchor="middle" font-size="21.6467" font-family="Arial, sans-serif" fill="var(--warn-text)">SHA-256</text>
  <rect x="662.2222" y="299.7546" width="266.6667" height="142.3313" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="795.5556" y="360.2454" text-anchor="middle" font-size="21.6467" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">$6$</text>
  <text x="795.5556" y="413.6197" text-anchor="middle" font-size="21.6467" font-family="Arial, sans-serif" fill="var(--ok-text)">SHA-512 (best)</text>
  <rect x="973.3333" y="299.7546" width="266.6667" height="142.3313" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1106.6667" y="360.2454" text-anchor="middle" font-size="21.6467" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">$y$</text>
  <text x="1106.6667" y="413.6197" text-anchor="middle" font-size="21.6467" font-family="Arial, sans-serif" fill="var(--danger-text)">yescrypt (new)</text>
  <rect x="40" y="495.4601" width="1200" height="124.5399" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" opacity="0.5" filter="url(#shadow)"/>
  <text x="640" y="573.7423" text-anchor="middle" font-size="21.6467" font-family="Arial, sans-serif" fill="var(--danger-text)">Only root can read /etc/shadow (permissions: 640, owner root:shadow)</text>
</svg>

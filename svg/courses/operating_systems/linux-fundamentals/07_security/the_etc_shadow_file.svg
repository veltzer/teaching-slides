<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:text x="615.015" y="76.1081" text-anchor="middle" font-size="26.6506" font-weight="bold" fill="#333">/etc/shadow: Password Storage</ns0:text>
  <ns0:rect x="61.5015" y="138.3784" width="1107.027" height="138.3784" fill="#f3e5f5" stroke="#333" stroke-width="4.1001" rx="10.2503" />
  <ns0:text x="615.015" y="197.1892" text-anchor="middle" font-size="20.5005" font-family="monospace">john:$6$salt$hash...:18900:0:99999:7:::</ns0:text>
  <ns0:text x="615.015" y="249.0811" text-anchor="middle" font-size="20.5005" fill="#666">username : hashed_password : last_change : min : max : warn : inactive : expire</ns0:text>
  <ns0:rect x="61.5015" y="328.6486" width="246.006" height="138.3784" fill="#e3f2fd" stroke="#333" stroke-width="3.0751" rx="8.2002" />
  <ns0:text x="184.5045" y="387.4595" text-anchor="middle" font-size="20.5005" font-weight="bold">$1$</ns0:text>
  <ns0:text x="184.5045" y="439.3514" text-anchor="middle" font-size="20.5005">MD5 (weak)</ns0:text>
  <ns0:rect x="348.5085" y="328.6486" width="246.006" height="138.3784" fill="#fff3e0" stroke="#333" stroke-width="3.0751" rx="8.2002" />
  <ns0:text x="471.5115" y="387.4595" text-anchor="middle" font-size="20.5005" font-weight="bold">$5$</ns0:text>
  <ns0:text x="471.5115" y="439.3514" text-anchor="middle" font-size="20.5005">SHA-256</ns0:text>
  <ns0:rect x="635.5155" y="328.6486" width="246.006" height="138.3784" fill="#e8f5e9" stroke="#333" stroke-width="3.0751" rx="8.2002" />
  <ns0:text x="758.5185" y="387.4595" text-anchor="middle" font-size="20.5005" font-weight="bold">$6$</ns0:text>
  <ns0:text x="758.5185" y="439.3514" text-anchor="middle" font-size="20.5005">SHA-512 (best)</ns0:text>
  <ns0:rect x="922.5225" y="328.6486" width="246.006" height="138.3784" fill="#ffebee" stroke="#333" stroke-width="3.0751" rx="8.2002" />
  <ns0:text x="1045.5255" y="387.4595" text-anchor="middle" font-size="20.5005" font-weight="bold">$y$</ns0:text>
  <ns0:text x="1045.5255" y="439.3514" text-anchor="middle" font-size="20.5005">yescrypt (new)</ns0:text>
  <ns0:rect x="61.5015" y="518.9189" width="1107.027" height="121.0811" fill="#ffebee" stroke="#333" stroke-width="2.05" rx="8.2002" opacity="0.5" />
  <ns0:text x="615.015" y="595.027" text-anchor="middle" font-size="20.5005">Only root can read /etc/shadow (permissions: 640, owner root:shadow)</ns0:text>
</ns0:svg>
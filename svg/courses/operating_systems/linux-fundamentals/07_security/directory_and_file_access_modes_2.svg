  <line x1="95.814" y1="94.375" x2="95.814" y2="221.25" stroke="var(--primary-border)" stroke-width="1.9394"/>
  <line x1="95.814" y1="221.25" x2="1224.4962" y2="221.25" stroke="var(--primary-border)" stroke-width="1.9394"/>
  <text x="1240" y="233.3333" font-size="31.3204" fill="var(--primary-accent)" font-family="Arial, sans-serif">User: read</text>

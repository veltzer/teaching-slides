  <text x="1240" y="571.6666" font-size="31.3204" fill="var(--warn-accent)" font-family="Arial, sans-serif">Others: no write</text>
  <line x1="988.8372" y1="94.375" x2="988.8372" y2="607.9166" stroke="var(--warn-border)" stroke-width="1.9394"/>

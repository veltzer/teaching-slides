  <line x1="207.4419" y1="269.5833" x2="1224.4962" y2="269.5833" stroke="var(--primary-border)" stroke-width="1.9394"/>
  <text x="1240" y="281.6666" font-size="31.3204" fill="var(--primary-accent)" font-family="Arial, sans-serif">User: write</text>

<svg xmlns="http://www.w3.org/2000/svg" width="660" height="270" font-family="monospace">
  <!-- Permission string at top -->
  <text x="20" y="40" font-size="28" font-weight="bold" fill="#222" letter-spacing="6">rwxr-xr--</text>
  <!-- bit cells with colour groups -->
  <!-- user: rwx -->
  <rect x="18"  y="50" width="36" height="8" fill="#e3f2fd" stroke="none"/>
  <rect x="54"  y="50" width="36" height="8" fill="#e3f2fd" stroke="none"/>
  <rect x="90"  y="50" width="36" height="8" fill="#e3f2fd" stroke="none"/>
  <!-- group: r-x -->
  <rect x="126" y="50" width="36" height="8" fill="#e8f5e9" stroke="none"/>
  <rect x="162" y="50" width="36" height="8" fill="#e8f5e9" stroke="none"/>
  <rect x="198" y="50" width="36" height="8" fill="#e8f5e9" stroke="none"/>
  <!-- others: r-- -->
  <rect x="234" y="50" width="36" height="8" fill="#fff3e0" stroke="none"/>
  <rect x="270" y="50" width="36" height="8" fill="#fff3e0" stroke="none"/>
  <rect x="306" y="50" width="36" height="8" fill="#fff3e0" stroke="none"/>
  <!-- labels for groups -->
  <text x="54"  y="78" font-size="13" font-weight="bold" fill="#1565c0" text-anchor="middle" font-family="sans-serif">User</text>
  <text x="180" y="78" font-size="13" font-weight="bold" fill="#2e7d32" text-anchor="middle" font-family="sans-serif">Group</text>
  <text x="306" y="78" font-size="13" font-weight="bold" fill="#e65100" text-anchor="middle" font-family="sans-serif">Others</text>
  <!-- annotation lines -->
  <!-- r (user, pos 0) -->
  <line x1="36" y1="58" x2="36" y2="100" stroke="#1565c0" stroke-width="1"/>
  <line x1="36" y1="100" x2="400" y2="100" stroke="#1565c0" stroke-width="1"/>
  <text x="405" y="104" font-size="12" fill="#1565c0" font-family="sans-serif">User: read</text>
  <!-- w (user, pos 1) -->
  <line x1="72" y1="58" x2="72" y2="116" stroke="#1565c0" stroke-width="1"/>
  <line x1="72" y1="116" x2="400" y2="116" stroke="#1565c0" stroke-width="1"/>
  <text x="405" y="120" font-size="12" fill="#1565c0" font-family="sans-serif">User: write</text>
  <!-- x (user, pos 2) -->
  <line x1="108" y1="58" x2="108" y2="132" stroke="#1565c0" stroke-width="1"/>
  <line x1="108" y1="132" x2="400" y2="132" stroke="#1565c0" stroke-width="1"/>
  <text x="405" y="136" font-size="12" fill="#1565c0" font-family="sans-serif">User: execute</text>
  <!-- r (group, pos 3) -->
  <line x1="144" y1="58" x2="144" y2="148" stroke="#2e7d32" stroke-width="1"/>
  <line x1="144" y1="148" x2="400" y2="148" stroke="#2e7d32" stroke-width="1"/>
  <text x="405" y="152" font-size="12" fill="#2e7d32" font-family="sans-serif">Group: read</text>
  <!-- - (group, pos 4) -->
  <line x1="180" y1="58" x2="180" y2="164" stroke="#2e7d32" stroke-width="1"/>
  <line x1="180" y1="164" x2="400" y2="164" stroke="#2e7d32" stroke-width="1"/>
  <text x="405" y="168" font-size="12" fill="#2e7d32" font-family="sans-serif">Group: no write</text>
  <!-- x (group, pos 5) -->
  <line x1="216" y1="58" x2="216" y2="180" stroke="#2e7d32" stroke-width="1"/>
  <line x1="216" y1="180" x2="400" y2="180" stroke="#2e7d32" stroke-width="1"/>
  <text x="405" y="184" font-size="12" fill="#2e7d32" font-family="sans-serif">Group: no execute</text>
  <!-- r (others, pos 6) -->
  <line x1="252" y1="58" x2="252" y2="196" stroke="#e65100" stroke-width="1"/>
  <line x1="252" y1="196" x2="400" y2="196" stroke="#e65100" stroke-width="1"/>
  <text x="405" y="200" font-size="12" fill="#e65100" font-family="sans-serif">Others: read</text>
  <!-- - (others, pos 7) -->
  <line x1="288" y1="58" x2="288" y2="212" stroke="#e65100" stroke-width="1"/>
  <line x1="288" y1="212" x2="400" y2="212" stroke="#e65100" stroke-width="1"/>
  <text x="405" y="216" font-size="12" fill="#e65100" font-family="sans-serif">Others: no write</text>
  <!-- - (others, pos 8) -->
  <line x1="324" y1="58" x2="324" y2="228" stroke="#e65100" stroke-width="1"/>
  <line x1="324" y1="228" x2="400" y2="228" stroke="#e65100" stroke-width="1"/>
  <text x="405" y="232" font-size="12" fill="#e65100" font-family="sans-serif">Others: no execute</text>
</svg>

  <line x1="319.0697" y1="317.9166" x2="1224.4962" y2="317.9166" stroke="var(--primary-border)" stroke-width="1.9394"/>
  <text x="1240" y="330" font-size="31.3204" fill="var(--primary-accent)" font-family="Arial, sans-serif">User: execute</text>
  <line x1="430.6976" y1="94.375" x2="430.6976" y2="366.25" stroke="var(--ok-border)" stroke-width="1.9394"/>

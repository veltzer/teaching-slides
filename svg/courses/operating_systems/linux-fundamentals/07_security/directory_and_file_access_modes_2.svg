  <text x="1240" y="378.3333" font-size="31.3204" fill="var(--ok-accent)" font-family="Arial, sans-serif">Group: read</text>
  <line x1="542.3256" y1="94.375" x2="542.3256" y2="414.5833" stroke="var(--ok-border)" stroke-width="1.9394"/>
  <line x1="542.3256" y1="414.5833" x2="1224.4962" y2="414.5833" stroke="var(--ok-border)" stroke-width="1.9394"/>
  <text x="1240" y="426.6666" font-size="31.3204" fill="var(--ok-accent)" font-family="Arial, sans-serif">Group: no write</text>

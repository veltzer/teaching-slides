<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="382.8571" y="40" width="457.1428" height="154.666688400001" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.254598491769"/>
  <text x="611.4285" y="136.666721000003" text-anchor="middle" font-size="27.462378327736" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">root (UID 0)</text>
  <line x1="611.4285" y1="194.666688400001" x2="268.5714" y2="291.333300733331" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="611.4285" y1="194.666688400001" x2="954.2857" y2="291.333300733331" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="291.333300733331" width="457.1428" height="154.666688400001" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.254598491769"/>
  <text x="268.5714" y="360.933326813333" text-anchor="middle" font-size="25.173924982905" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Regular Users (UID 1000+)</text>
  <rect x="725.7143" y="291.333300733331" width="457.1428" height="154.666688400001" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.254598491769"/>
  <text x="954.2857" y="360.933326813333" text-anchor="middle" font-size="25.173924982905" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">System Users (UID 1-999)</text>
  <rect x="40" y="503.999956533331" width="297.1428" height="116.000043466669" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.254598491769"/>
  <text x="188.5714" y="577.466560173327" text-anchor="middle" font-size="22.885367394767" font-family="Arial, sans-serif" fill="var(--ok-text)">john (1000)</text>
  <rect x="371.4286" y="503.999956533331" width="297.1428" height="116.000043466669" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.254598491769"/>
  <text x="520" y="577.466560173327" text-anchor="middle" font-size="22.885367394767" font-family="Arial, sans-serif" fill="var(--ok-text)">alice (1001)</text>
  <rect x="725.7143" y="503.999956533331" width="297.1428" height="116.000043466669" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.254598491769"/>
  <text x="874.2856" y="577.466560173327" text-anchor="middle" font-size="22.885367394767" font-family="Arial, sans-serif" fill="var(--warn-text)">nginx (998)</text>
  <rect x="1057.1429" y="503.999956533331" width="182.8571" height="116.000043466669" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.254598491769"/>
  <text x="1148.5713" y="577.466560173327" text-anchor="middle" font-size="22.885367394767" font-family="Arial, sans-serif" fill="var(--warn-text)">mysql (27)</text>
</svg>

  <ns0:text x="632.0988" y="78.2222" text-anchor="middle" font-size="27.3909" font-weight="bold" fill="#333">Advanced Security: ACLs and Beyond</ns0:text>
  <ns0:defs>
    <ns0:marker id="arrowadv" markerWidth="21.0699" markerHeight="35.5556" refX="18.963" refY="10.6667" orient="auto">
      <ns0:path d="M 0 0 L 0 21.3333 L 18.963 10.6667 z" fill="#333" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect x="63.2099" y="142.2222" width="337.1193" height="231.1111" fill="#e3f2fd" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="231.7696" y="213.3333" text-anchor="middle" font-size="23.177" font-weight="bold">Traditional</ns0:text>
  <ns0:text x="231.7696" y="270.2222" text-anchor="middle" font-size="21.0699">owner/group/other</ns0:text>
  <ns0:text x="231.7696" y="327.1111" text-anchor="middle" font-size="21.0699">rwx bits only</ns0:text>
  <ns0:line x1="400.3292" y1="256" x2="463.5391" y2="256" stroke="#333" stroke-width="4.214" marker-end="url(#arrowadv)" />
  <ns0:rect x="463.5391" y="142.2222" width="337.1193" height="231.1111" fill="#f3e5f5" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="632.0988" y="213.3333" text-anchor="middle" font-size="23.177" font-weight="bold">POSIX ACLs</ns0:text>
  <ns0:text x="632.0988" y="270.2222" text-anchor="middle" font-size="21.0699">setfacl / getfacl</ns0:text>
  <ns0:text x="632.0988" y="327.1111" text-anchor="middle" font-size="21.0699">per-user/group rules</ns0:text>
  <ns0:line x1="800.6585" y1="256" x2="863.8683" y2="256" stroke="#333" stroke-width="4.214" marker-end="url(#arrowadv)" />

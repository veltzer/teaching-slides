<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="79.2" text-anchor="middle" font-size="27.7333" font-weight="bold" fill="#333">Advanced Security: ACLs and Beyond</text>
  <defs>
    <marker id="arrowadv" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="64" y="144" width="341.3333" height="234" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="234.6667" y="216" text-anchor="middle" font-size="23.4667" font-weight="bold">Traditional</text>
  <text x="234.6667" y="273.6" text-anchor="middle" font-size="21.3333">owner/group/other</text>
  <text x="234.6667" y="331.2" text-anchor="middle" font-size="21.3333">rwx bits only</text>
  <line x1="405.3333" y1="259.2" x2="469.3333" y2="259.2" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowadv)" />
  <rect x="469.3333" y="144" width="341.3333" height="234" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="216" text-anchor="middle" font-size="23.4667" font-weight="bold">POSIX ACLs</text>
  <text x="640" y="273.6" text-anchor="middle" font-size="21.3333">setfacl / getfacl</text>
  <text x="640" y="331.2" text-anchor="middle" font-size="21.3333">per-user/group rules</text>
  <line x1="810.6667" y1="259.2" x2="874.6667" y2="259.2" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowadv)" />
  <rect x="874.6667" y="144" width="352" height="234" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1049.6" y="216" text-anchor="middle" font-size="23.4667" font-weight="bold">SELinux/AppArmor</text>
  <text x="1049.6" y="273.6" text-anchor="middle" font-size="21.3333">Mandatory Access</text>
  <text x="1049.6" y="331.2" text-anchor="middle" font-size="21.3333">Control (MAC)</text>
  <rect x="64" y="450" width="1162.6667" height="198" fill="#fff3e0" stroke="#333" stroke-width="2.1333" rx="10.6667" opacity="0.7" />
  <text x="640" y="522" text-anchor="middle" font-size="21.3333" font-family="monospace">setfacl -m u:john:rx file.txt    # grant john read+execute</text>
  <text x="640" y="583.2" text-anchor="middle" font-size="21.3333" font-family="monospace">getfacl file.txt                 # view all ACL entries</text>
</svg>
  <ns0:text x="1036.642" y="213.3333" text-anchor="middle" font-size="23.177" font-weight="bold">SELinux/AppArmor</ns0:text>
  <ns0:text x="1036.642" y="270.2222" text-anchor="middle" font-size="21.0699">Mandatory Access</ns0:text>
  <ns0:text x="1036.642" y="327.1111" text-anchor="middle" font-size="21.0699">Control (MAC)</ns0:text>
  <ns0:rect x="63.2099" y="444.4444" width="1148.3128" height="195.5556" fill="#fff3e0" stroke="#333" stroke-width="2.107" rx="10.535" opacity="0.7" />
  <ns0:text x="632.0988" y="515.5556" text-anchor="middle" font-size="21.0699" font-family="monospace">setfacl -m u:john:rx file.txt    # grant john read+execute</ns0:text>
  <ns0:text x="632.0988" y="576" text-anchor="middle" font-size="21.0699" font-family="monospace">getfacl file.txt                 # view all ACL entries</ns0:text>

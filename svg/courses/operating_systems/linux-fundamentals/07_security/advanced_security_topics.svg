<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="634.4954" y="40" text-anchor="middle" font-size="28.4511" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Advanced Security: ACLs and Beyond</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="106.0759" width="352.2935" height="238.6076" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="216.1468" y="179.4937" text-anchor="middle" font-size="24.0741" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Traditional</text>
  <text x="216.1468" y="238.2278" text-anchor="middle" font-size="21.8854" font-family="Arial, sans-serif" fill="var(--primary-text)">owner/group/other</text>
  <text x="216.1468" y="296.962" text-anchor="middle" font-size="21.8854" font-family="Arial, sans-serif" fill="var(--primary-text)">rwx bits only</text>
  <line x1="392.2935" y1="223.5443" x2="458.3486" y2="223.5443" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="458.3486" y="106.0759" width="352.2935" height="238.6076" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="634.4954" y="179.4937" text-anchor="middle" font-size="24.0741" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">POSIX ACLs</text>
  <text x="634.4954" y="238.2278" text-anchor="middle" font-size="21.8854" font-family="Arial, sans-serif" fill="var(--info-text)">setfacl / getfacl</text>
  <text x="634.4954" y="296.962" text-anchor="middle" font-size="21.8854" font-family="Arial, sans-serif" fill="var(--info-text)">per-user/group rules</text>
  <line x1="810.6422" y1="223.5443" x2="876.6972" y2="223.5443" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="876.6972" y="106.0759" width="363.3027" height="238.6076" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1057.2477" y="179.4937" text-anchor="middle" font-size="24.0741" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">SELinux/AppArmor</text>
  <text x="1057.2477" y="238.2278" text-anchor="middle" font-size="21.8854" font-family="Arial, sans-serif" fill="var(--ok-text)">Mandatory Access</text>
  <text x="1057.2477" y="296.962" text-anchor="middle" font-size="21.8854" font-family="Arial, sans-serif" fill="var(--ok-text)">Control (MAC)</text>
  <rect x="40" y="418.1012" width="1200" height="201.8988" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" opacity="0.7" filter="url(#shadow)"/>
  <text x="634.4954" y="491.519" text-anchor="middle" font-size="21.8854" font-family="Courier New, monospace" fill="var(--warn-text)">setfacl -m u:john:rx file.txt    # grant john read+execute</text>
  <text x="634.4954" y="553.9241" text-anchor="middle" font-size="21.8854" font-family="Courier New, monospace" fill="var(--warn-text)">getfacl file.txt                 # view all ACL entries</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="385.7143" height="360.000015505351" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.361522388957" filter="url(#shadow)"/>
  <text x="232.8571" y="127.999993797859" text-anchor="middle" font-size="24.791276851259" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">SUID (4xxx)</text>
  <text x="232.8571" y="191.999979067776" text-anchor="middle" font-size="22.537495494224" font-family="Arial, sans-serif" fill="var(--danger-text)">Run as file owner</text>
  <text x="232.8571" y="259.999984494649" text-anchor="middle" font-size="22.537495494224" font-family="Courier New, monospace" fill="var(--danger-text)">-rwsr-xr-x</text>
  <text x="232.8571" y="351.999998449465" text-anchor="middle" font-size="22.537495494224" fill="var(--text-muted)" font-family="Arial, sans-serif">e.g. /usr/bin/passwd</text>
  <rect x="447.1428" y="40" width="385.7143" height="360.000015505351" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.361522388957" filter="url(#shadow)"/>
  <text x="639.9999" y="127.999993797859" text-anchor="middle" font-size="24.791276851259" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">SGID (2xxx)</text>
  <text x="639.9999" y="191.999979067776" text-anchor="middle" font-size="22.537495494224" font-family="Arial, sans-serif" fill="var(--warn-text)">Run as file group</text>
  <text x="639.9999" y="259.999984494649" text-anchor="middle" font-size="22.537495494224" font-family="Courier New, monospace" fill="var(--warn-text)">-rwxr-sr-x</text>
  <text x="639.9999" y="351.999998449465" text-anchor="middle" font-size="22.537495494224" fill="var(--text-muted)" font-family="Arial, sans-serif">Dir: inherit group</text>
  <rect x="854.2856" y="40" width="385.7143" height="360.000015505351" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.361522388957" filter="url(#shadow)"/>
  <text x="1047.1428" y="127.999993797859" text-anchor="middle" font-size="24.791276851259" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Sticky (1xxx)</text>
  <text x="1047.1428" y="191.999979067776" text-anchor="middle" font-size="22.537495494224" font-family="Arial, sans-serif" fill="var(--ok-text)">Only owner deletes</text>
  <text x="1047.1428" y="259.999984494649" text-anchor="middle" font-size="22.537495494224" font-family="Courier New, monospace" fill="var(--ok-text)">drwxrwxrwt</text>
  <text x="1047.1428" y="351.999998449465" text-anchor="middle" font-size="22.537495494224" fill="var(--text-muted)" font-family="Arial, sans-serif">e.g. /tmp</text>
  <rect x="40" y="479.999968989297" width="1200" height="140.000031010703" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.361522388957" opacity="0.6" filter="url(#shadow)"/>
  <text x="639.9999" y="551.999994573127" text-anchor="middle" font-size="22.537495494224" font-family="Courier New, monospace" fill="var(--primary-text)">chmod 4755 file  |  chmod 2755 dir  |  chmod 1777 /tmp</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="79.2" text-anchor="middle" font-size="27.7333" font-weight="bold" fill="#333">Special Permission Bits</text>
  <rect x="42.6667" y="144" width="384" height="324" fill="#ffebee" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="234.6667" y="223.2" text-anchor="middle" font-size="23.4667" font-weight="bold">SUID (4xxx)</text>
  <text x="234.6667" y="280.8" text-anchor="middle" font-size="21.3333">Run as file owner</text>
  <text x="234.6667" y="342" text-anchor="middle" font-size="21.3333" font-family="monospace">-rwsr-xr-x</text>
  <text x="234.6667" y="424.8" text-anchor="middle" font-size="21.3333" fill="#666">e.g. /usr/bin/passwd</text>
  <rect x="448" y="144" width="384" height="324" fill="#fff3e0" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="223.2" text-anchor="middle" font-size="23.4667" font-weight="bold">SGID (2xxx)</text>
  <text x="640" y="280.8" text-anchor="middle" font-size="21.3333">Run as file group</text>
  <text x="640" y="342" text-anchor="middle" font-size="21.3333" font-family="monospace">-rwxr-sr-x</text>
  <text x="640" y="424.8" text-anchor="middle" font-size="21.3333" fill="#666">Dir: inherit group</text>
  <rect x="853.3333" y="144" width="384" height="324" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1045.3333" y="223.2" text-anchor="middle" font-size="23.4667" font-weight="bold">Sticky (1xxx)</text>
  <text x="1045.3333" y="280.8" text-anchor="middle" font-size="21.3333">Only owner deletes</text>
  <text x="1045.3333" y="342" text-anchor="middle" font-size="21.3333" font-family="monospace">drwxrwxrwt</text>
  <text x="1045.3333" y="424.8" text-anchor="middle" font-size="21.3333" fill="#666">e.g. /tmp</text>
  <rect x="42.6667" y="540" width="1194.6667" height="126" fill="#e3f2fd" stroke="#333" stroke-width="2.1333" rx="8.5333" opacity="0.6" />
  <text x="640" y="604.8" text-anchor="middle" font-size="21.3333" font-family="monospace">chmod 4755 file  |  chmod 2755 dir  |  chmod 1777 /tmp</text>
</svg>
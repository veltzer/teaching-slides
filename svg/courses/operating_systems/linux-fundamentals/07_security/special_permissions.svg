<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:text x="615.015" y="76.1081" text-anchor="middle" font-size="26.6506" font-weight="bold" fill="#333">Special Permission Bits</ns0:text>
  <ns0:rect x="41.001" y="138.3784" width="369.009" height="311.3514" fill="#ffebee" stroke="#333" stroke-width="4.1001" rx="10.2503" />
  <ns0:text x="225.5055" y="214.4865" text-anchor="middle" font-size="22.5506" font-weight="bold">SUID (4xxx)</ns0:text>
  <ns0:text x="225.5055" y="269.8378" text-anchor="middle" font-size="20.5005">Run as file owner</ns0:text>
  <ns0:text x="225.5055" y="328.6486" text-anchor="middle" font-size="20.5005" font-family="monospace">-rwsr-xr-x</ns0:text>
  <ns0:text x="225.5055" y="408.2162" text-anchor="middle" font-size="20.5005" fill="#666">e.g. /usr/bin/passwd</ns0:text>
  <ns0:rect x="430.5105" y="138.3784" width="369.009" height="311.3514" fill="#fff3e0" stroke="#333" stroke-width="4.1001" rx="10.2503" />
  <ns0:text x="615.015" y="214.4865" text-anchor="middle" font-size="22.5506" font-weight="bold">SGID (2xxx)</ns0:text>
  <ns0:text x="615.015" y="269.8378" text-anchor="middle" font-size="20.5005">Run as file group</ns0:text>
  <ns0:text x="615.015" y="328.6486" text-anchor="middle" font-size="20.5005" font-family="monospace">-rwxr-sr-x</ns0:text>
  <ns0:text x="615.015" y="408.2162" text-anchor="middle" font-size="20.5005" fill="#666">Dir: inherit group</ns0:text>
  <ns0:rect x="820.02" y="138.3784" width="369.009" height="311.3514" fill="#e8f5e9" stroke="#333" stroke-width="4.1001" rx="10.2503" />
  <ns0:text x="1004.5245" y="214.4865" text-anchor="middle" font-size="22.5506" font-weight="bold">Sticky (1xxx)</ns0:text>
  <ns0:text x="1004.5245" y="269.8378" text-anchor="middle" font-size="20.5005">Only owner deletes</ns0:text>
  <ns0:text x="1004.5245" y="328.6486" text-anchor="middle" font-size="20.5005" font-family="monospace">drwxrwxrwt</ns0:text>
  <ns0:text x="1004.5245" y="408.2162" text-anchor="middle" font-size="20.5005" fill="#666">e.g. /tmp</ns0:text>
  <ns0:rect x="41.001" y="518.9189" width="1148.0281" height="121.0811" fill="#e3f2fd" stroke="#333" stroke-width="2.05" rx="8.2002" opacity="0.6" />
  <ns0:text x="615.015" y="581.1892" text-anchor="middle" font-size="20.5005" font-family="monospace">chmod 4755 file  |  chmod 2755 dir  |  chmod 1777 /tmp</ns0:text>
</ns0:svg>
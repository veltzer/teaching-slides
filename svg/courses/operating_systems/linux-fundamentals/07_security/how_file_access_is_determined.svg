<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="598.8304" y="74.1053" text-anchor="middle" font-size="25.9493" font-weight="bold" fill="var(--text)">File Access Decision Flow</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowaccess" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="59.883" y="134.7368" width="259.4931" height="117.8947" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="189.6297" y="212.2105" text-anchor="middle" font-size="21.9571" font-weight="bold">Process (UID)</text>
  <line x1="319.3762" y1="192" x2="379.2592" y2="192" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowaccess)" />
  <rect x="379.2592" y="134.7368" width="259.4931" height="117.8947" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="509.0058" y="208.8421" text-anchor="middle" font-size="19.961">Is owner?</text>
  <line x1="509.0058" y1="252.6316" x2="509.0058" y2="336.8421" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowaccess)" />
  <text x="485.0526" y="309.8947" font-size="19.961" fill="var(--danger-accent)">No</text>
  <rect x="379.2592" y="336.8421" width="259.4931" height="117.8947" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="509.0058" y="410.9474" text-anchor="middle" font-size="19.961">In group?</text>
  <line x1="509.0058" y1="454.7368" x2="509.0058" y2="538.9474" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowaccess)" />
  <text x="485.0526" y="512" font-size="19.961" fill="var(--danger-accent)">No</text>
  <rect x="379.2592" y="538.9474" width="259.4931" height="101.0526" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="509.0058" y="606.3158" text-anchor="middle" font-size="19.961">Use "other" perms</text>
  <line x1="638.7525" y1="192" x2="778.4795" y2="192" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowaccess)" />
  <text x="698.6355" y="168.4211" font-size="19.961" fill="var(--ok-accent)">Yes</text>
  <rect x="778.4795" y="134.7368" width="339.3373" height="117.8947" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="948.1481" y="208.8421" text-anchor="middle" font-size="19.961">Use "owner" perms</text>
  <line x1="638.7525" y1="394.1053" x2="778.4795" y2="394.1053" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowaccess)" />
  <text x="698.6355" y="370.5263" font-size="19.961" fill="var(--ok-accent)">Yes</text>
  <rect x="778.4795" y="336.8421" width="339.3373" height="117.8947" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="948.1481" y="410.9474" text-anchor="middle" font-size="19.961">Use "group" perms</text>
</svg>
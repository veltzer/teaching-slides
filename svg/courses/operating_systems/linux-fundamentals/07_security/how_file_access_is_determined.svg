<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="651.3207" y="40" text-anchor="middle" font-size="27.9791" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">File Access Decision Flow</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <rect x="40" y="102.1428" width="294.3395" height="120.8333" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="187.1699" y="181.5476" text-anchor="middle" font-size="23.6746" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Process (UID)</text>
  <line x1="334.3396" y1="160.8333" x2="402.2641" y2="160.8333" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="402.2641" y="102.1428" width="294.3395" height="120.8333" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="549.4339" y="178.0952" text-anchor="middle" font-size="21.5224" font-family="Arial, sans-serif" fill="var(--warn-text)">Is owner?</text>
  <line x1="549.4339" y1="222.9762" x2="549.4339" y2="309.2857" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="522.2641" y="281.6666" font-size="21.5224" fill="var(--danger-accent)" font-family="Arial, sans-serif">No</text>
  <rect x="402.2641" y="309.2857" width="294.3395" height="120.8333" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="549.4339" y="385.2381" text-anchor="middle" font-size="21.5224" font-family="Arial, sans-serif" fill="var(--warn-text)">In group?</text>
  <line x1="549.4339" y1="430.119" x2="549.4339" y2="516.4286" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="522.2641" y="488.8095" font-size="21.5224" fill="var(--danger-accent)" font-family="Arial, sans-serif">No</text>
  <rect x="402.2641" y="516.4286" width="294.3395" height="103.5714" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="549.4339" y="585.4762" text-anchor="middle" font-size="21.5224" font-family="Arial, sans-serif" fill="var(--info-text)">Use "other" perms</text>
  <line x1="696.6038" y1="160.8333" x2="855.0943" y2="160.8333" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="764.5283" y="136.6667" font-size="21.5224" fill="var(--ok-accent)" font-family="Arial, sans-serif">Yes</text>
  <rect x="855.0943" y="102.1428" width="384.9057" height="120.8333" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1047.5471" y="178.0952" text-anchor="middle" font-size="21.5224" font-family="Arial, sans-serif" fill="var(--ok-text)">Use "owner" perms</text>
  <line x1="696.6038" y1="367.9762" x2="855.0943" y2="367.9762" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="764.5283" y="343.8095" font-size="21.5224" fill="var(--ok-accent)" font-family="Arial, sans-serif">Yes</text>
  <rect x="855.0943" y="309.2857" width="384.9057" height="120.8333" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1047.5471" y="385.2381" text-anchor="middle" font-size="21.5224" font-family="Arial, sans-serif" fill="var(--ok-text)">Use "group" perms</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="355.5555" height="160.000019381689" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.361522388957" filter="url(#shadow)"/>
  <text x="217.7778" y="140.00005426873" text-anchor="middle" font-size="25.246125702069" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Default: 0666/0777</text>
  <line x1="395.5555" y1="120.000065897743" x2="484.4444" y2="120.000065897743" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="440" y="88.000017055887" text-anchor="middle" font-size="22.950994449506" font-family="Arial, sans-serif" fill="var(--text)">minus</text>
  <rect x="484.4444" y="40" width="311.1111" height="160.000019381689" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.361522388957" filter="url(#shadow)"/>
  <text x="639.9999" y="140.00005426873" text-anchor="middle" font-size="25.246125702069" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">umask: 022</text>
  <line x1="795.5555" y1="120.000065897743" x2="884.4445" y2="120.000065897743" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="839.9999" y="88.000017055887" text-anchor="middle" font-size="22.950994449506" font-family="Arial, sans-serif" fill="var(--text)">equals</text>
  <rect x="884.4445" y="40" width="355.5555" height="160.000019381689" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.361522388957" filter="url(#shadow)"/>
  <text x="1062.2221" y="140.00005426873" text-anchor="middle" font-size="25.246125702069" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Result: 0644/0755</text>
  <rect x="40" y="279.999972865635" width="577.7777" height="140.000031010703" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.361522388957" filter="url(#shadow)"/>
  <text x="328.8889" y="339.999937978594" text-anchor="middle" font-size="22.950994449506" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">umask 022 (common)</text>
  <text x="328.8889" y="391.999975191438" text-anchor="middle" font-size="22.950994449506" font-family="Arial, sans-serif" fill="var(--warn-text)">files: rw-r--r-- dirs: rwxr-xr-x</text>
  <rect x="662.2222" y="279.999972865635" width="577.7777" height="140.000031010703" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.361522388957" filter="url(#shadow)"/>
  <text x="951.1111" y="339.999937978594" text-anchor="middle" font-size="22.950994449506" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">umask 077 (strict)</text>
  <text x="951.1111" y="391.999975191438" text-anchor="middle" font-size="22.950994449506" font-family="Arial, sans-serif" fill="var(--info-text)">files: rw------- dirs: rwx------</text>
  <rect x="40" y="499.999957360284" width="1199.9999" height="120.000042639716" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.361522388957" opacity="0.5" filter="url(#shadow)"/>
  <text x="639.9999" y="580.000023258027" text-anchor="middle" font-size="22.950994449506" font-family="Arial, sans-serif" fill="var(--primary-text)">umask bits are removed from default permissions when creating new files/dirs</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <!-- /etc/passwd -->
  <rect x="40" y="40" width="390" height="229.811320754717" rx="8.368855109814" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="78.301886792453" text-anchor="middle" font-family="Courier New, monospace" font-size="20.922137774534" font-weight="bold" fill="var(--bg)">/etc/passwd</text>
  <text x="235" y="111.132075471698" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--bg)">World-readable accounts</text>
  <text x="60" y="154.905660377358" font-family="Courier New, monospace" font-size="12.55328266472" fill="var(--bg)">user:x:UID:GID:name:home:shell</text>
  <text x="60" y="187.735849056604" font-family="Courier New, monospace" font-size="12.55328266472" fill="var(--bg)">alice:x:1000:1000::/home/alice:/bin/bash</text>
  <text x="235" y="231.509433962264" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--bg)">x = see shadow</text>

  <!-- /etc/shadow -->
  <rect x="445" y="40" width="390" height="229.811320754717" rx="8.368855109814" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="78.301886792453" text-anchor="middle" font-family="Courier New, monospace" font-size="20.922137774534" font-weight="bold" fill="var(--bg)">/etc/shadow</text>
  <text x="640" y="111.132075471698" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--bg)">Root-only hashes</text>
  <text x="465" y="154.905660377358" font-family="Courier New, monospace" font-size="12.55328266472" fill="var(--bg)">alice:$6$salt$hash:19600:0:99999:7:::</text>
  <text x="640" y="193.207547169811" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--bg)">$6 = SHA-512 + salt</text>
  <text x="640" y="231.509433962264" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--bg)">Fields track expiry</text>

  <!-- /etc/group -->
  <rect x="850" y="40" width="390" height="229.811320754717" rx="8.368855109814" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="78.301886792453" text-anchor="middle" font-family="Courier New, monospace" font-size="20.922137774534" font-weight="bold" fill="var(--bg)">/etc/group</text>
  <text x="1045" y="111.132075471698" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--bg)">Group memberships</text>
  <text x="870" y="154.905660377358" font-family="Courier New, monospace" font-size="12.55328266472" fill="var(--bg)">staff:x:50:alice,bob</text>
  <text x="870" y="187.735849056604" font-family="Courier New, monospace" font-size="12.55328266472" fill="var(--bg)">docker:x:998:alice,bob</text>
  <text x="1045" y="231.509433962264" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--bg)">Primary + secondary</text>

  <!-- sudo flow -->
  <text x="640" y="313.584905660377" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.922137774534" font-weight="bold" fill="var(--primary-accent)">sudo Elevation</text>
  <rect x="60" y="335.471698113207" width="200" height="76.603773584906" rx="8.368855109814" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="368.301886792453" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" font-weight="bold" fill="var(--bg)">user runs sudo</text>
  <text x="160" y="392.377358490566" text-anchor="middle" font-family="Courier New, monospace" font-size="12.55328266472" fill="var(--bg)">UID 1000</text>
  <line x1="265" y1="373.77358490566" x2="315" y2="373.77358490566" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="320" y="335.471698113207" width="210" height="76.603773584906" rx="8.368855109814" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="425" y="368.301886792453" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" font-weight="bold" fill="var(--bg)">check sudoers</text>
  <text x="425" y="392.377358490566" text-anchor="middle" font-family="Courier New, monospace" font-size="12.55328266472" fill="var(--bg)">visudo</text>
  <line x1="535" y1="373.77358490566" x2="585" y2="373.77358490566" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="590" y="335.471698113207" width="210" height="76.603773584906" rx="8.368855109814" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="695" y="368.301886792453" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" font-weight="bold" fill="var(--bg)">prompt password</text>
  <text x="695" y="392.377358490566" text-anchor="middle" font-family="Courier New, monospace" font-size="12.55328266472" fill="var(--bg)">(user's own)</text>
  <line x1="805" y1="373.77358490566" x2="855" y2="373.77358490566" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="860" y="335.471698113207" width="200" height="76.603773584906" rx="8.368855109814" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="368.301886792453" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" font-weight="bold" fill="var(--bg)">exec as root</text>
  <text x="960" y="392.377358490566" text-anchor="middle" font-family="Courier New, monospace" font-size="12.55328266472" fill="var(--bg)">UID 0</text>

  <!-- commands cheatsheet -->
  <rect x="40" y="450.377358490566" width="1200" height="169.622641509434" rx="8.368855109814" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="483.207547169812" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.829923997081" font-weight="bold" fill="var(--text)">Commands</text>
  <text x="70" y="516.037735849057" font-family="Courier New, monospace" font-size="14.645496442174" fill="var(--primary-accent)">useradd -m -s /bin/bash alice</text>
  <text x="70" y="543.396226415094" font-family="Courier New, monospace" font-size="14.645496442174" fill="var(--primary-accent)">passwd alice</text>
  <text x="70" y="570.754716981132" font-family="Courier New, monospace" font-size="14.645496442174" fill="var(--primary-accent)">usermod -aG sudo alice</text>
  <text x="70" y="598.11320754717" font-family="Courier New, monospace" font-size="14.645496442174" fill="var(--primary-accent)">userdel -r alice</text>
  <text x="680" y="516.037735849057" font-family="Courier New, monospace" font-size="14.645496442174" fill="var(--ok-accent)">groupadd developers</text>
  <text x="680" y="543.396226415094" font-family="Courier New, monospace" font-size="14.645496442174" fill="var(--ok-accent)">groups alice</text>
  <text x="680" y="570.754716981132" font-family="Courier New, monospace" font-size="14.645496442174" fill="var(--ok-accent)">chage -l alice</text>
  <text x="680" y="598.11320754717" font-family="Courier New, monospace" font-size="14.645496442174" fill="var(--ok-accent)">id alice</text>
</svg>

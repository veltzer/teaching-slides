<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="22.2222" y="22.2222" width="328.8889" height="302.2222" rx="6" fill="var(--text)" filter="url(#shadow)" />
  <rect x="22.2222" y="22.2222" width="328.8889" height="35.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="22.2222" y="44.4444" width="328.8889" height="13.3333" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="186.6667" y="47.1111" text-anchor="middle" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--bg)">/etc/passwd</text>
  <text x="40" y="80" font-family="monospace" font-size="10" fill="var(--text-faint)"># user:x:UID:GID:comment:home:shell</text>
  <text x="40" y="102.2222" font-family="monospace" font-size="11.5556" fill="var(--ok-accent)">root</text>
  <text x="97.7778" y="102.2222" font-family="monospace" font-size="11.5556" fill="var(--bg)">:x:0:0:root:/root:/bin/bash</text>
  <text x="40" y="121.7778" font-family="monospace" font-size="11.5556" fill="var(--ok-accent)">alice</text>
  <text x="97.7778" y="121.7778" font-family="monospace" font-size="11.5556" fill="var(--bg)">:x:1000:1000:Alice:/home/alice:/bin/bash</text>
  <text x="40" y="141.3333" font-family="monospace" font-size="11.5556" fill="var(--ok-accent)">bob</text>
  <text x="97.7778" y="141.3333" font-family="monospace" font-size="11.5556" fill="var(--bg)">:x:1001:1001:Bob:/home/bob:/bin/zsh</text>
  <text x="40" y="160.8889" font-family="monospace" font-size="11.5556" fill="var(--ok-accent)">nginx</text>
  <text x="97.7778" y="160.8889" font-family="monospace" font-size="11.5556" fill="var(--bg)">:x:998:998:nginx:/var/www:/sbin/nologin</text>
  <line x1="40" y1="177.7778" x2="333.3333" y2="177.7778" stroke="var(--text)" stroke-width="0.8889" />
  <text x="40" y="195.5556" font-family="sans-serif" font-size="10" fill="var(--ok-accent)">Field breakdown:</text>
  <text x="40" y="211.5556" font-family="monospace" font-size="10" fill="var(--text-faint)">user   — login name</text>
  <text x="40" y="226.6667" font-family="monospace" font-size="10" fill="var(--text-faint)">x      — password (→ /etc/shadow)</text>
  <text x="40" y="241.7778" font-family="monospace" font-size="10" fill="var(--text-faint)">UID    — numeric user ID</text>
  <text x="40" y="256.8889" font-family="monospace" font-size="10" fill="var(--text-faint)">GID    — primary group ID</text>
  <text x="40" y="272" font-family="monospace" font-size="10" fill="var(--text-faint)">home   — home directory</text>
  <text x="40" y="287.1111" font-family="monospace" font-size="10" fill="var(--text-faint)">shell  — login shell</text>
  <text x="40" y="304" font-family="monospace" font-size="10" fill="var(--text-muted)">World readable; passwords NOT stored here</text>
  <rect x="22.2222" y="342.2222" width="328.8889" height="262.2222" rx="6" fill="var(--text)" filter="url(#shadow)" />
  <rect x="22.2222" y="342.2222" width="328.8889" height="35.5556" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="22.2222" y="364.4444" width="328.8889" height="13.3333" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="186.6667" y="367.1111" text-anchor="middle" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--bg)">/etc/shadow</text>
  <text x="40" y="400" font-family="monospace" font-size="10" fill="var(--text-faint)"># user:hash:lastchg:min:max:warn:inactive:expire</text>
  <text x="40" y="420.4444" font-family="monospace" font-size="10.6667" fill="var(--info-accent)">alice</text>
  <text x="88.8889" y="420.4444" font-family="monospace" font-size="10.6667" fill="var(--bg)">:$6$salt$hashXYZ...:19600:0:99999:7:::</text>
  <text x="40" y="440" font-family="monospace" font-size="10.6667" fill="var(--info-accent)">bob</text>
  <text x="88.8889" y="440" font-family="monospace" font-size="10.6667" fill="var(--bg)">:$6$salt$hashABC...:19580:0:99999:7:::</text>
  <line x1="40" y1="456" x2="333.3333" y2="456" stroke="var(--text)" stroke-width="0.8889" />
  <text x="40" y="473.7778" font-family="sans-serif" font-size="10" fill="var(--info-accent)">Security features:</text>
  <text x="40" y="489.7778" font-family="monospace" font-size="10" fill="var(--text-faint)">$6$  — SHA-512 hash algorithm</text>
  <text x="40" y="504.8889" font-family="monospace" font-size="10" fill="var(--text-faint)">salt — prevents rainbow tables</text>
  <text x="40" y="520" font-family="monospace" font-size="10" fill="var(--text-faint)">19600 — days since epoch (lastchange)</text>
  <text x="40" y="535.1111" font-family="monospace" font-size="10" fill="var(--text-faint)">99999 — max days before forced change</text>
  <text x="40" y="550.2222" font-family="monospace" font-size="10" fill="var(--text-faint)">7     — warn days before expiry</text>
  <text x="40" y="571.5556" font-family="monospace" font-size="10" fill="var(--text-muted)">Root-only read access (mode 000 or 640)</text>
  <text x="40" y="587.5556" font-family="monospace" font-size="10" fill="var(--text-muted)">passwd command updates this file safely</text>
  <rect x="382.2222" y="22.2222" width="328.8889" height="302.2222" rx="6" fill="var(--text)" filter="url(#shadow)" />
  <rect x="382.2222" y="22.2222" width="328.8889" height="35.5556" rx="6" fill="var(--ok-accent)" />
  <rect x="382.2222" y="44.4444" width="328.8889" height="13.3333" fill="var(--ok-accent)" rx="6"/>
  <text x="546.6667" y="47.1111" text-anchor="middle" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--bg)">/etc/group</text>
  <text x="400" y="80" font-family="monospace" font-size="10" fill="var(--text-faint)"># name:x:GID:members</text>
  <text x="400" y="100.4444" font-family="monospace" font-size="11.5556" fill="var(--ok-accent)">root</text>
  <text x="453.3333" y="100.4444" font-family="monospace" font-size="11.5556" fill="var(--bg)">:x:0:</text>
  <text x="400" y="120" font-family="monospace" font-size="11.5556" fill="var(--ok-accent)">staff</text>
  <text x="453.3333" y="120" font-family="monospace" font-size="11.5556" fill="var(--bg)">:x:50:alice,bob</text>
  <text x="400" y="139.5556" font-family="monospace" font-size="11.5556" fill="var(--ok-accent)">developers</text>
  <text x="497.7778" y="139.5556" font-family="monospace" font-size="11.5556" fill="var(--bg)">:x:200:alice</text>
  <text x="400" y="159.1111" font-family="monospace" font-size="11.5556" fill="var(--ok-accent)">docker</text>
  <text x="453.3333" y="159.1111" font-family="monospace" font-size="11.5556" fill="var(--bg)">:x:998:alice,bob</text>
  <line x1="400" y1="176" x2="693.3333" y2="176" stroke="var(--text)" stroke-width="0.8889" />
  <text x="400" y="193.7778" font-family="sans-serif" font-size="10" fill="var(--ok-accent)">Group membership commands:</text>
  <text x="400" y="210.6667" font-family="monospace" font-size="10.6667" fill="var(--bg)">groupadd developers</text>
  <text x="400" y="228.4444" font-family="monospace" font-size="10.6667" fill="var(--bg)">usermod -aG developers alice</text>
  <text x="400" y="246.2222" font-family="monospace" font-size="10.6667" fill="var(--bg)">groups alice</text>
  <text x="400" y="264" font-family="monospace" font-size="10.6667" fill="var(--bg)">id alice</text>
  <text x="400" y="304" font-family="monospace" font-size="10" fill="var(--text-muted)">A user has one primary group (in passwd) + supplementary groups (here)</text>
  <rect x="382.2222" y="342.2222" width="728.8889" height="262.2222" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="382.2222" y="342.2222" width="728.8889" height="35.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="382.2222" y="364.4444" width="728.8889" height="13.3333" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="746.6667" y="367.1111" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="var(--bg)">sudo Elevation Flow</text>
  <rect x="408.8889" y="391.1111" width="142.2222" height="57.7778" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="480" y="414.2222" text-anchor="middle" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="var(--primary-accent)">alice (user)</text>
  <text x="480" y="430.2222" text-anchor="middle" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">UID 1000</text>
  <text x="480" y="443.5556" text-anchor="middle" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">sudo command</text>
  <line x1="551.1111" y1="419.5556" x2="595.5556" y2="419.5556" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="595.5556" y="391.1111" width="177.7778" height="57.7778" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="684.4444" y="409.7778" text-anchor="middle" font-family="sans-serif" font-size="11.5556" font-weight="bold" fill="var(--warn-accent)">sudo checks</text>
  <text x="684.4444" y="425.7778" font-family="monospace" font-size="10" fill="var(--text-muted)">  /etc/sudoers</text>
  <text x="684.4444" y="440.8889" font-family="monospace" font-size="10" fill="var(--text-muted)">  /etc/sudoers.d/*</text>
  <line x1="773.3333" y1="419.5556" x2="817.7778" y2="419.5556" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="817.7778" y="391.1111" width="155.5556" height="57.7778" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="896" y="409.7778" text-anchor="middle" font-family="sans-serif" font-size="11.5556" font-weight="bold" fill="var(--ok-accent)">Auth prompt</text>
  <text x="896" y="425.7778" text-anchor="middle" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">alice's password</text>
  <text x="896" y="441.7778" text-anchor="middle" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">(not root password)</text>
  <line x1="973.3333" y1="419.5556" x2="1017.7778" y2="419.5556" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="1017.7778" y="391.1111" width="71.1111" height="57.7778" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="1053.3333" y="409.7778" text-anchor="middle" font-family="sans-serif" font-size="11.5556" font-weight="bold" fill="var(--info-accent)">root</text>
  <text x="1053.3333" y="425.7778" text-anchor="middle" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">UID 0</text>
  <text x="1053.3333" y="441.7778" text-anchor="middle" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">executes</text>
  <rect x="408.8889" y="466.6667" width="684.4444" height="120" rx="6" fill="var(--text)" />
  <text x="426.6667" y="488.8889" font-family="monospace" font-size="10.6667" fill="var(--text-faint)"># /etc/sudoers  (edit with: visudo)</text>
  <text x="426.6667" y="508.4444" font-family="monospace" font-size="11.5556" fill="var(--ok-accent)">alice</text>
  <text x="484.4444" y="508.4444" font-family="monospace" font-size="11.5556" fill="var(--bg)">ALL=(ALL:ALL) ALL</text>
  <text x="675.5556" y="508.4444" font-family="monospace" font-size="10" fill="var(--text-faint)"># full sudo access</text>
  <text x="426.6667" y="528" font-family="monospace" font-size="11.5556" fill="var(--ok-accent)">%developers</text>
  <text x="524.4444" y="528" font-family="monospace" font-size="11.5556" fill="var(--bg)">ALL=(ALL) NOPASSWD: /sbin/reboot</text>
  <text x="426.6667" y="547.5556" font-family="monospace" font-size="11.5556" fill="var(--ok-accent)">bob</text>
  <text x="484.4444" y="547.5556" font-family="monospace" font-size="11.5556" fill="var(--bg)">ALL=(ALL) /usr/bin/apt, /usr/bin/systemctl</text>
  <text x="426.6667" y="567.1111" font-family="monospace" font-size="10" fill="var(--text-faint)"># bob can only use apt and systemctl, with password</text>
  <text x="426.6667" y="582.2222" font-family="monospace" font-size="10" fill="var(--text-muted)">Format:  WHO  WHERE=(AS_WHOM)  COMMAND</text>
  <line x1="186.6667" y1="151.1111" x2="382.2222" y2="120" stroke="var(--text-faint)" stroke-width="1.3333" stroke-dasharray="5.3333 2.6667" marker-end="url(#arrow)" />
  <text x="284.4444" y="128.8889" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-faint)">UID links</text>
  <text x="284.4444" y="140.4444" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-faint)">accounts</text>
  <line x1="186.6667" y1="400" x2="382.2222" y2="137.7778" stroke="var(--text-faint)" stroke-width="1.3333" stroke-dasharray="5.3333 2.6667" marker-end="url(#arrow)" />
  <rect x="737.7778" y="22.2222" width="373.3333" height="302.2222" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="737.7778" y="22.2222" width="373.3333" height="35.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="737.7778" y="44.4444" width="373.3333" height="13.3333" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="924.4444" y="47.1111" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--bg)">User Management Commands</text>
  <text x="755.5556" y="80" font-family="monospace" font-size="11.5556" fill="var(--primary-accent)">useradd -m -s /bin/bash alice</text>
  <text x="755.5556" y="96" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Create user with home dir and bash shell</text>
  <text x="755.5556" y="115.5556" font-family="monospace" font-size="11.5556" fill="var(--primary-accent)">passwd alice</text>
  <text x="755.5556" y="131.5556" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Set/change alice's password</text>
  <text x="755.5556" y="151.1111" font-family="monospace" font-size="11.5556" fill="var(--primary-accent)">usermod -aG sudo alice</text>
  <text x="755.5556" y="167.1111" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Add alice to sudo group</text>
  <text x="755.5556" y="186.6667" font-family="monospace" font-size="11.5556" fill="var(--primary-accent)">userdel -r alice</text>
  <text x="755.5556" y="202.6667" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Delete user and remove home directory</text>
  <text x="755.5556" y="222.2222" font-family="monospace" font-size="11.5556" fill="var(--primary-accent)">chage -l alice</text>
  <text x="755.5556" y="238.2222" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Show password expiry information</text>
  <text x="755.5556" y="257.7778" font-family="monospace" font-size="11.5556" fill="var(--primary-accent)">who / w / last</text>
  <text x="755.5556" y="273.7778" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Show logged-in users / login history</text>
  <text x="755.5556" y="293.3333" font-family="monospace" font-size="11.5556" fill="var(--primary-accent)">id alice</text>
  <text x="755.5556" y="309.3333" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Show UID, GID, and group memberships</text>
</svg>
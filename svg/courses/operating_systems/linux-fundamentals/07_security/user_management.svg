<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="63.4375" y="60.1389" width="346.875" height="273.8889" rx="6" fill="var(--text)" filter="url(#shadow)" />
  <rect x="63.4375" y="60.1389" width="346.875" height="32.2223" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="63.4375" y="80.2777" width="346.875" height="12.0833" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="236.875" y="82.6944" text-anchor="middle" font-family="monospace" font-size="13.9044" font-weight="bold" fill="var(--bg)">/etc/passwd</text>
  <text x="82.1875" y="112.5" font-family="monospace" font-size="10" fill="var(--text-faint)"># user:x:UID:GID:comment:home:shell</text>
  <text x="82.1875" y="132.6389" font-family="monospace" font-size="11.2974" fill="var(--ok-accent)">root</text>
  <text x="143.125" y="132.6389" font-family="monospace" font-size="11.2974" fill="var(--bg)">:x:0:0:root:/root:/bin/bash</text>
  <text x="82.1875" y="150.3611" font-family="monospace" font-size="11.2974" fill="var(--ok-accent)">alice</text>
  <text x="143.125" y="150.3611" font-family="monospace" font-size="11.2974" fill="var(--bg)">:x:1000:1000:Alice:/home/alice:/bin/bash</text>
  <text x="82.1875" y="168.0833" font-family="monospace" font-size="11.2974" fill="var(--ok-accent)">bob</text>
  <text x="143.125" y="168.0833" font-family="monospace" font-size="11.2974" fill="var(--bg)">:x:1001:1001:Bob:/home/bob:/bin/zsh</text>
  <text x="82.1875" y="185.8056" font-family="monospace" font-size="11.2974" fill="var(--ok-accent)">nginx</text>
  <text x="143.125" y="185.8056" font-family="monospace" font-size="11.2974" fill="var(--bg)">:x:998:998:nginx:/var/www:/sbin/nologin</text>
  <line x1="82.1875" y1="201.1111" x2="391.5625" y2="201.1111" stroke="var(--text)" stroke-width="0.8889" />
  <text x="82.1875" y="217.2223" font-family="sans-serif" font-size="10" fill="var(--ok-accent)">Field breakdown:</text>
  <text x="82.1875" y="231.7223" font-family="monospace" font-size="10" fill="var(--text-faint)">user   — login name</text>
  <text x="82.1875" y="245.4167" font-family="monospace" font-size="10" fill="var(--text-faint)">x      — password (→ /etc/shadow)</text>
  <text x="82.1875" y="259.1111" font-family="monospace" font-size="10" fill="var(--text-faint)">UID    — numeric user ID</text>
  <text x="82.1875" y="272.8056" font-family="monospace" font-size="10" fill="var(--text-faint)">GID    — primary group ID</text>
  <text x="82.1875" y="286.5" font-family="monospace" font-size="10" fill="var(--text-faint)">home   — home directory</text>
  <text x="82.1875" y="300.1944" font-family="monospace" font-size="10" fill="var(--text-faint)">shell  — login shell</text>
  <text x="82.1875" y="315.5" font-family="monospace" font-size="10" fill="var(--text-muted)">World readable; passwords NOT stored here</text>
  <rect x="63.4375" y="350.1389" width="346.875" height="237.6389" rx="6" fill="var(--text)" filter="url(#shadow)" />
  <rect x="63.4375" y="350.1389" width="346.875" height="32.2223" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="63.4375" y="370.2777" width="346.875" height="12.0833" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="236.875" y="372.6944" text-anchor="middle" font-family="monospace" font-size="13.9044" font-weight="bold" fill="var(--bg)">/etc/shadow</text>
  <text x="82.1875" y="402.5" font-family="monospace" font-size="10" fill="var(--text-faint)"># user:hash:lastchg:min:max:warn:inactive:expire</text>
  <text x="82.1875" y="421.0277" font-family="monospace" font-size="10.4284" fill="var(--info-accent)">alice</text>
  <text x="133.75" y="421.0277" font-family="monospace" font-size="10.4284" fill="var(--bg)">:$6$salt$hashXYZ...:19600:0:99999:7:::</text>
  <text x="82.1875" y="438.75" font-family="monospace" font-size="10.4284" fill="var(--info-accent)">bob</text>
  <text x="133.75" y="438.75" font-family="monospace" font-size="10.4284" fill="var(--bg)">:$6$salt$hashABC...:19580:0:99999:7:::</text>
  <line x1="82.1875" y1="453.25" x2="391.5625" y2="453.25" stroke="var(--text)" stroke-width="0.8889" />
  <text x="82.1875" y="469.3611" font-family="sans-serif" font-size="10" fill="var(--info-accent)">Security features:</text>
  <text x="82.1875" y="483.8611" font-family="monospace" font-size="10" fill="var(--text-faint)">$6$  — SHA-512 hash algorithm</text>
  <text x="82.1875" y="497.5556" font-family="monospace" font-size="10" fill="var(--text-faint)">salt — prevents rainbow tables</text>
  <text x="82.1875" y="511.25" font-family="monospace" font-size="10" fill="var(--text-faint)">19600 — days since epoch (lastchange)</text>
  <text x="82.1875" y="524.9444" font-family="monospace" font-size="10" fill="var(--text-faint)">99999 — max days before forced change</text>
  <text x="82.1875" y="538.6389" font-family="monospace" font-size="10" fill="var(--text-faint)">7     — warn days before expiry</text>
  <text x="82.1875" y="557.9723" font-family="monospace" font-size="10" fill="var(--text-muted)">Root-only read access (mode 000 or 640)</text>
  <text x="82.1875" y="572.4723" font-family="monospace" font-size="10" fill="var(--text-muted)">passwd command updates this file safely</text>
  <rect x="443.125" y="60.1389" width="346.875" height="273.8889" rx="6" fill="var(--text)" filter="url(#shadow)" />
  <rect x="443.125" y="60.1389" width="346.875" height="32.2223" rx="6" fill="var(--ok-accent)" />
  <rect x="443.125" y="80.2777" width="346.875" height="12.0833" fill="var(--ok-accent)" rx="6"/>
  <text x="616.5625" y="82.6944" text-anchor="middle" font-family="monospace" font-size="13.9044" font-weight="bold" fill="var(--bg)">/etc/group</text>
  <text x="461.875" y="112.5" font-family="monospace" font-size="10" fill="var(--text-faint)"># name:x:GID:members</text>
  <text x="461.875" y="131.0277" font-family="monospace" font-size="11.2974" fill="var(--ok-accent)">root</text>
  <text x="518.125" y="131.0277" font-family="monospace" font-size="11.2974" fill="var(--bg)">:x:0:</text>
  <text x="461.875" y="148.75" font-family="monospace" font-size="11.2974" fill="var(--ok-accent)">staff</text>
  <text x="518.125" y="148.75" font-family="monospace" font-size="11.2974" fill="var(--bg)">:x:50:alice,bob</text>
  <text x="461.875" y="166.4723" font-family="monospace" font-size="11.2974" fill="var(--ok-accent)">developers</text>
  <text x="565" y="166.4723" font-family="monospace" font-size="11.2974" fill="var(--bg)">:x:200:alice</text>
  <text x="461.875" y="184.1944" font-family="monospace" font-size="11.2974" fill="var(--ok-accent)">docker</text>
  <text x="518.125" y="184.1944" font-family="monospace" font-size="11.2974" fill="var(--bg)">:x:998:alice,bob</text>
  <line x1="461.875" y1="199.5" x2="771.25" y2="199.5" stroke="var(--text)" stroke-width="0.8889" />
  <text x="461.875" y="215.6111" font-family="sans-serif" font-size="10" fill="var(--ok-accent)">Group membership commands:</text>
  <text x="461.875" y="230.9167" font-family="monospace" font-size="10.4284" fill="var(--bg)">groupadd developers</text>
  <text x="461.875" y="247.0277" font-family="monospace" font-size="10.4284" fill="var(--bg)">usermod -aG developers alice</text>
  <text x="461.875" y="263.1389" font-family="monospace" font-size="10.4284" fill="var(--bg)">groups alice</text>
  <text x="461.875" y="279.25" font-family="monospace" font-size="10.4284" fill="var(--bg)">id alice</text>
  <text x="461.875" y="315.5" font-family="monospace" font-size="10" fill="var(--text-muted)">A user has one primary group (in passwd) + supplementary groups (here)</text>
  <rect x="443.125" y="350.1389" width="768.75" height="237.6389" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="443.125" y="350.1389" width="768.75" height="32.2223" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="443.125" y="370.2777" width="768.75" height="12.0833" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="827.5" y="372.6944" text-anchor="middle" font-family="sans-serif" font-size="13.9044" font-weight="bold" fill="var(--bg)">sudo Elevation Flow</text>
  <rect x="471.25" y="394.4444" width="150" height="52.3611" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="546.25" y="415.3889" text-anchor="middle" font-family="sans-serif" font-size="12.1663" font-weight="bold" fill="var(--primary-accent)">alice (user)</text>
  <text x="546.25" y="429.8889" text-anchor="middle" font-family="sans-serif" font-size="10.4284" fill="var(--text-muted)">UID 1000</text>
  <text x="546.25" y="441.9723" text-anchor="middle" font-family="monospace" font-size="10.4284" fill="var(--text-muted)">sudo command</text>
  <line x1="621.25" y1="420.2223" x2="668.125" y2="420.2223" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="668.125" y="394.4444" width="187.5" height="52.3611" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="761.8749" y="411.3611" text-anchor="middle" font-family="sans-serif" font-size="11.2974" font-weight="bold" fill="var(--warn-accent)">sudo checks</text>
  <text x="761.8749" y="425.8611" font-family="monospace" font-size="10" fill="var(--text-muted)">  /etc/sudoers</text>
  <text x="761.8749" y="439.5556" font-family="monospace" font-size="10" fill="var(--text-muted)">  /etc/sudoers.d/*</text>
  <line x1="855.6249" y1="420.2223" x2="902.5" y2="420.2223" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="902.5" y="394.4444" width="164.0625" height="52.3611" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="985" y="411.3611" text-anchor="middle" font-family="sans-serif" font-size="11.2974" font-weight="bold" fill="var(--ok-accent)">Auth prompt</text>
  <text x="985" y="425.8611" text-anchor="middle" font-family="sans-serif" font-size="10.4284" fill="var(--text-muted)">alice's password</text>
  <text x="985" y="440.3611" text-anchor="middle" font-family="sans-serif" font-size="10.4284" fill="var(--text-muted)">(not root password)</text>
  <line x1="1066.5624" y1="420.2223" x2="1113.4375" y2="420.2223" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="1113.4375" y="394.4444" width="75" height="52.3611" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="1150.9374" y="411.3611" text-anchor="middle" font-family="sans-serif" font-size="11.2974" font-weight="bold" fill="var(--info-accent)">root</text>
  <text x="1150.9374" y="425.8611" text-anchor="middle" font-family="sans-serif" font-size="10.4284" fill="var(--text-muted)">UID 0</text>
  <text x="1150.9374" y="440.3611" text-anchor="middle" font-family="sans-serif" font-size="10.4284" fill="var(--text-muted)">executes</text>
  <rect x="471.25" y="462.9167" width="721.8749" height="108.75" rx="6" fill="var(--text)" />
  <text x="490" y="483.0556" font-family="monospace" font-size="10.4284" fill="var(--text-faint)"># /etc/sudoers  (edit with: visudo)</text>
  <text x="490" y="500.7777" font-family="monospace" font-size="11.2974" fill="var(--ok-accent)">alice</text>
  <text x="550.9374" y="500.7777" font-family="monospace" font-size="11.2974" fill="var(--bg)">ALL=(ALL:ALL) ALL</text>
  <text x="752.5" y="500.7777" font-family="monospace" font-size="10" fill="var(--text-faint)"># full sudo access</text>
  <text x="490" y="518.5" font-family="monospace" font-size="11.2974" fill="var(--ok-accent)">%developers</text>
  <text x="593.1249" y="518.5" font-family="monospace" font-size="11.2974" fill="var(--bg)">ALL=(ALL) NOPASSWD: /sbin/reboot</text>
  <text x="490" y="536.2223" font-family="monospace" font-size="11.2974" fill="var(--ok-accent)">bob</text>
  <text x="550.9374" y="536.2223" font-family="monospace" font-size="11.2974" fill="var(--bg)">ALL=(ALL) /usr/bin/apt, /usr/bin/systemctl</text>
  <text x="490" y="553.9444" font-family="monospace" font-size="10" fill="var(--text-faint)"># bob can only use apt and systemctl, with password</text>
  <text x="490" y="567.6389" font-family="monospace" font-size="10" fill="var(--text-muted)">Format:  WHO  WHERE=(AS_WHOM)  COMMAND</text>
  <line x1="236.875" y1="176.9444" x2="443.125" y2="148.75" stroke="var(--text-faint)" stroke-width="1.3333" stroke-dasharray="5.3333 2.6667" marker-end="url(#arrow)" />
  <text x="339.9999" y="156.8056" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-faint)">UID links</text>
  <text x="339.9999" y="167.2777" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-faint)">accounts</text>
  <line x1="236.875" y1="402.5" x2="443.125" y2="164.8611" stroke="var(--text-faint)" stroke-width="1.3333" stroke-dasharray="5.3333 2.6667" marker-end="url(#arrow)" />
  <rect x="818.125" y="60.1389" width="393.75" height="273.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="818.125" y="60.1389" width="393.75" height="32.2223" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="818.125" y="80.2777" width="393.75" height="12.0833" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1014.9999" y="82.6944" text-anchor="middle" font-family="sans-serif" font-size="13.0354" font-weight="bold" fill="var(--bg)">User Management Commands</text>
  <text x="836.875" y="112.5" font-family="monospace" font-size="11.2974" fill="var(--primary-accent)">useradd -m -s /bin/bash alice</text>
  <text x="836.875" y="127" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Create user with home dir and bash shell</text>
  <text x="836.875" y="144.7223" font-family="monospace" font-size="11.2974" fill="var(--primary-accent)">passwd alice</text>
  <text x="836.875" y="159.2223" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Set/change alice's password</text>
  <text x="836.875" y="176.9444" font-family="monospace" font-size="11.2974" fill="var(--primary-accent)">usermod -aG sudo alice</text>
  <text x="836.875" y="191.4444" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Add alice to sudo group</text>
  <text x="836.875" y="209.1667" font-family="monospace" font-size="11.2974" fill="var(--primary-accent)">userdel -r alice</text>
  <text x="836.875" y="223.6667" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Delete user and remove home directory</text>
  <text x="836.875" y="241.3889" font-family="monospace" font-size="11.2974" fill="var(--primary-accent)">chage -l alice</text>
  <text x="836.875" y="255.8889" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Show password expiry information</text>
  <text x="836.875" y="273.6111" font-family="monospace" font-size="11.2974" fill="var(--primary-accent)">who / w / last</text>
  <text x="836.875" y="288.1111" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Show logged-in users / login history</text>
  <text x="836.875" y="305.8333" font-family="monospace" font-size="11.2974" fill="var(--primary-accent)">id alice</text>
  <text x="836.875" y="320.3333" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Show UID, GID, and group memberships</text>
</svg>
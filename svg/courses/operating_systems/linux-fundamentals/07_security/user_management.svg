<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.342871951533" font-weight="bold" fill="var(--primary-accent)">Linux User Management</text>

  <!-- /etc/passwd -->
  <rect x="40" y="75.929203539823" width="390" height="215.575221238938" rx="8.10549906201" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="111.858407079646" text-anchor="middle" font-family="Courier New, monospace" font-size="20.263747655025" font-weight="bold" fill="var(--bg)">/etc/passwd</text>
  <text x="235" y="142.654867256637" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--bg)">World-readable accounts</text>
  <text x="60" y="183.716814159292" font-family="Courier New, monospace" font-size="12.158248593015" fill="var(--bg)">user:x:UID:GID:name:home:shell</text>
  <text x="60" y="214.513274336283" font-family="Courier New, monospace" font-size="12.158248593015" fill="var(--bg)">alice:x:1000:1000::/home/alice:/bin/bash</text>
  <text x="235" y="255.575221238938" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--bg)">x = see shadow</text>

  <!-- /etc/shadow -->
  <rect x="445" y="75.929203539823" width="390" height="215.575221238938" rx="8.10549906201" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="111.858407079646" text-anchor="middle" font-family="Courier New, monospace" font-size="20.263747655025" font-weight="bold" fill="var(--bg)">/etc/shadow</text>
  <text x="640" y="142.654867256637" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--bg)">Root-only hashes</text>
  <text x="465" y="183.716814159292" font-family="Courier New, monospace" font-size="12.158248593015" fill="var(--bg)">alice:$6$salt$hash:19600:0:99999:7:::</text>
  <text x="640" y="219.646017699115" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--bg)">$6 = SHA-512 + salt</text>
  <text x="640" y="255.575221238938" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--bg)">Fields track expiry</text>

  <!-- /etc/group -->
  <rect x="850" y="75.929203539823" width="390" height="215.575221238938" rx="8.10549906201" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="111.858407079646" text-anchor="middle" font-family="Courier New, monospace" font-size="20.263747655025" font-weight="bold" fill="var(--bg)">/etc/group</text>
  <text x="1045" y="142.654867256637" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--bg)">Group memberships</text>
  <text x="870" y="183.716814159292" font-family="Courier New, monospace" font-size="12.158248593015" fill="var(--bg)">staff:x:50:alice,bob</text>
  <text x="870" y="214.513274336283" font-family="Courier New, monospace" font-size="12.158248593015" fill="var(--bg)">docker:x:998:alice,bob</text>
  <text x="1045" y="255.575221238938" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--bg)">Primary + secondary</text>

  <!-- sudo flow -->
  <text x="640" y="332.566371681416" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.263747655025" font-weight="bold" fill="var(--primary-accent)">sudo Elevation</text>
  <rect x="60" y="353.097345132743" width="200" height="71.858407079646" rx="8.10549906201" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="383.893805309735" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" font-weight="bold" fill="var(--bg)">user runs sudo</text>
  <text x="160" y="406.477876106195" text-anchor="middle" font-family="Courier New, monospace" font-size="12.158248593015" fill="var(--bg)">UID 1000</text>
  <line x1="265" y1="389.026548672566" x2="315" y2="389.026548672566" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="320" y="353.097345132743" width="210" height="71.858407079646" rx="8.10549906201" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="425" y="383.893805309735" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" font-weight="bold" fill="var(--bg)">check sudoers</text>
  <text x="425" y="406.477876106195" text-anchor="middle" font-family="Courier New, monospace" font-size="12.158248593015" fill="var(--bg)">visudo</text>
  <line x1="535" y1="389.026548672566" x2="585" y2="389.026548672566" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="590" y="353.097345132743" width="210" height="71.858407079646" rx="8.10549906201" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="695" y="383.893805309735" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" font-weight="bold" fill="var(--bg)">prompt password</text>
  <text x="695" y="406.477876106195" text-anchor="middle" font-family="Courier New, monospace" font-size="12.158248593015" fill="var(--bg)">(user's own)</text>
  <line x1="805" y1="389.026548672566" x2="855" y2="389.026548672566" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="860" y="353.097345132743" width="200" height="71.858407079646" rx="8.10549906201" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="383.893805309735" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" font-weight="bold" fill="var(--bg)">exec as root</text>
  <text x="960" y="406.477876106195" text-anchor="middle" font-family="Courier New, monospace" font-size="12.158248593015" fill="var(--bg)">UID 0</text>

  <!-- commands cheatsheet -->
  <rect x="40" y="460.884955752212" width="1200" height="159.115044247788" rx="8.10549906201" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="491.681415929204" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.237372889523" font-weight="bold" fill="var(--text)">Commands</text>
  <text x="70" y="522.477876106195" font-family="Courier New, monospace" font-size="14.184623358518" fill="var(--primary-accent)">useradd -m -s /bin/bash alice</text>
  <text x="70" y="548.141592920354" font-family="Courier New, monospace" font-size="14.184623358518" fill="var(--primary-accent)">passwd alice</text>
  <text x="70" y="573.805309734513" font-family="Courier New, monospace" font-size="14.184623358518" fill="var(--primary-accent)">usermod -aG sudo alice</text>
  <text x="70" y="599.469026548673" font-family="Courier New, monospace" font-size="14.184623358518" fill="var(--primary-accent)">userdel -r alice</text>
  <text x="680" y="522.477876106195" font-family="Courier New, monospace" font-size="14.184623358518" fill="var(--ok-accent)">groupadd developers</text>
  <text x="680" y="548.141592920354" font-family="Courier New, monospace" font-size="14.184623358518" fill="var(--ok-accent)">groups alice</text>
  <text x="680" y="573.805309734513" font-family="Courier New, monospace" font-size="14.184623358518" fill="var(--ok-accent)">chage -l alice</text>
  <text x="680" y="599.469026548673" font-family="Courier New, monospace" font-size="14.184623358518" fill="var(--ok-accent)">id alice</text>
</svg>

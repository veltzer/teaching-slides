<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#ffffff" />
      <ns0:stop offset="100%" stop-color="#f2f2f2" />
    </ns0:linearGradient>
    <ns0:filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <ns0:feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </ns0:filter>
    <ns0:marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </ns0:marker>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="22.2222" y="22.2222" width="328.8889" height="302.2222" rx="8.8889" fill="#212121" filter="url(#shadow)" />
  <ns0:rect x="22.2222" y="22.2222" width="328.8889" height="35.5556" rx="8.8889" fill="url(#grad-accent)" />
  <ns0:rect x="22.2222" y="44.4444" width="328.8889" height="13.3333" fill="url(#grad-accent)" />
  <ns0:text x="186.6667" y="47.1111" text-anchor="middle" font-family="monospace" font-size="14.2222" font-weight="bold" fill="#ffffff">/etc/passwd</ns0:text>
  <ns0:text x="40" y="80" font-family="monospace" font-size="10" fill="#888888"># user:x:UID:GID:comment:home:shell</ns0:text>
  <ns0:text x="40" y="102.2222" font-family="monospace" font-size="11.5556" fill="#80cbc4">root</ns0:text>
  <ns0:text x="97.7778" y="102.2222" font-family="monospace" font-size="11.5556" fill="#ffffff">:x:0:0:root:/root:/bin/bash</ns0:text>
  <ns0:text x="40" y="121.7778" font-family="monospace" font-size="11.5556" fill="#80cbc4">alice</ns0:text>
  <ns0:text x="97.7778" y="121.7778" font-family="monospace" font-size="11.5556" fill="#ffffff">:x:1000:1000:Alice:/home/alice:/bin/bash</ns0:text>
  <ns0:text x="40" y="141.3333" font-family="monospace" font-size="11.5556" fill="#80cbc4">bob</ns0:text>
  <ns0:text x="97.7778" y="141.3333" font-family="monospace" font-size="11.5556" fill="#ffffff">:x:1001:1001:Bob:/home/bob:/bin/zsh</ns0:text>
  <ns0:text x="40" y="160.8889" font-family="monospace" font-size="11.5556" fill="#80cbc4">nginx</ns0:text>
  <ns0:text x="97.7778" y="160.8889" font-family="monospace" font-size="11.5556" fill="#ffffff">:x:998:998:nginx:/var/www:/sbin/nologin</ns0:text>
  <ns0:line x1="40" y1="177.7778" x2="333.3333" y2="177.7778" stroke="#444" stroke-width="0.8889" />
  <ns0:text x="40" y="195.5556" font-family="sans-serif" font-size="10" fill="#aed581">Field breakdown:</ns0:text>
  <ns0:text x="40" y="211.5556" font-family="monospace" font-size="10" fill="#888888">user   — login name</ns0:text>
  <ns0:text x="40" y="226.6667" font-family="monospace" font-size="10" fill="#888888">x      — password (→ /etc/shadow)</ns0:text>
  <ns0:text x="40" y="241.7778" font-family="monospace" font-size="10" fill="#888888">UID    — numeric user ID</ns0:text>
  <ns0:text x="40" y="256.8889" font-family="monospace" font-size="10" fill="#888888">GID    — primary group ID</ns0:text>
  <ns0:text x="40" y="272" font-family="monospace" font-size="10" fill="#888888">home   — home directory</ns0:text>
  <ns0:text x="40" y="287.1111" font-family="monospace" font-size="10" fill="#888888">shell  — login shell</ns0:text>
  <ns0:text x="40" y="304" font-family="monospace" font-size="10" fill="#555555">World readable; passwords NOT stored here</ns0:text>
  <ns0:rect x="22.2222" y="342.2222" width="328.8889" height="262.2222" rx="8.8889" fill="#212121" filter="url(#shadow)" />
  <ns0:rect x="22.2222" y="342.2222" width="328.8889" height="35.5556" rx="8.8889" fill="#880e4f" />
  <ns0:rect x="22.2222" y="364.4444" width="328.8889" height="13.3333" fill="#880e4f" />
  <ns0:text x="186.6667" y="367.1111" text-anchor="middle" font-family="monospace" font-size="14.2222" font-weight="bold" fill="#ffffff">/etc/shadow</ns0:text>
  <ns0:text x="40" y="400" font-family="monospace" font-size="10" fill="#888888"># user:hash:lastchg:min:max:warn:inactive:expire</ns0:text>
  <ns0:text x="40" y="420.4444" font-family="monospace" font-size="10.6667" fill="#f48fb1">alice</ns0:text>
  <ns0:text x="88.8889" y="420.4444" font-family="monospace" font-size="10.6667" fill="#ffffff">:$6$salt$hashXYZ...:19600:0:99999:7:::</ns0:text>
  <ns0:text x="40" y="440" font-family="monospace" font-size="10.6667" fill="#f48fb1">bob</ns0:text>
  <ns0:text x="88.8889" y="440" font-family="monospace" font-size="10.6667" fill="#ffffff">:$6$salt$hashABC...:19580:0:99999:7:::</ns0:text>
  <ns0:line x1="40" y1="456" x2="333.3333" y2="456" stroke="#444" stroke-width="0.8889" />
  <ns0:text x="40" y="473.7778" font-family="sans-serif" font-size="10" fill="#f48fb1">Security features:</ns0:text>
  <ns0:text x="40" y="489.7778" font-family="monospace" font-size="10" fill="#888888">$6$  — SHA-512 hash algorithm</ns0:text>
  <ns0:text x="40" y="504.8889" font-family="monospace" font-size="10" fill="#888888">salt — prevents rainbow tables</ns0:text>
  <ns0:text x="40" y="520" font-family="monospace" font-size="10" fill="#888888">19600 — days since epoch (lastchange)</ns0:text>
  <ns0:text x="40" y="535.1111" font-family="monospace" font-size="10" fill="#888888">99999 — max days before forced change</ns0:text>
  <ns0:text x="40" y="550.2222" font-family="monospace" font-size="10" fill="#888888">7     — warn days before expiry</ns0:text>
  <ns0:text x="40" y="571.5556" font-family="monospace" font-size="10" fill="#555555">Root-only read access (mode 000 or 640)</ns0:text>
  <ns0:text x="40" y="587.5556" font-family="monospace" font-size="10" fill="#555555">passwd command updates this file safely</ns0:text>
  <ns0:rect x="382.2222" y="22.2222" width="328.8889" height="302.2222" rx="8.8889" fill="#212121" filter="url(#shadow)" />
  <ns0:rect x="382.2222" y="22.2222" width="328.8889" height="35.5556" rx="8.8889" fill="#1b5e20" />
  <ns0:rect x="382.2222" y="44.4444" width="328.8889" height="13.3333" fill="#1b5e20" />
  <ns0:text x="546.6667" y="47.1111" text-anchor="middle" font-family="monospace" font-size="14.2222" font-weight="bold" fill="#ffffff">/etc/group</ns0:text>
  <ns0:text x="400" y="80" font-family="monospace" font-size="10" fill="#888888"># name:x:GID:members</ns0:text>
  <ns0:text x="400" y="100.4444" font-family="monospace" font-size="11.5556" fill="#a5d6a7">root</ns0:text>
  <ns0:text x="453.3333" y="100.4444" font-family="monospace" font-size="11.5556" fill="#ffffff">:x:0:</ns0:text>
  <ns0:text x="400" y="120" font-family="monospace" font-size="11.5556" fill="#a5d6a7">staff</ns0:text>
  <ns0:text x="453.3333" y="120" font-family="monospace" font-size="11.5556" fill="#ffffff">:x:50:alice,bob</ns0:text>
  <ns0:text x="400" y="139.5556" font-family="monospace" font-size="11.5556" fill="#a5d6a7">developers</ns0:text>
  <ns0:text x="497.7778" y="139.5556" font-family="monospace" font-size="11.5556" fill="#ffffff">:x:200:alice</ns0:text>
  <ns0:text x="400" y="159.1111" font-family="monospace" font-size="11.5556" fill="#a5d6a7">docker</ns0:text>
  <ns0:text x="453.3333" y="159.1111" font-family="monospace" font-size="11.5556" fill="#ffffff">:x:998:alice,bob</ns0:text>
  <ns0:line x1="400" y1="176" x2="693.3333" y2="176" stroke="#444" stroke-width="0.8889" />
  <ns0:text x="400" y="193.7778" font-family="sans-serif" font-size="10" fill="#a5d6a7">Group membership commands:</ns0:text>
  <ns0:text x="400" y="210.6667" font-family="monospace" font-size="10.6667" fill="#ffffff">groupadd developers</ns0:text>
  <ns0:text x="400" y="228.4444" font-family="monospace" font-size="10.6667" fill="#ffffff">usermod -aG developers alice</ns0:text>
  <ns0:text x="400" y="246.2222" font-family="monospace" font-size="10.6667" fill="#ffffff">groups alice</ns0:text>
  <ns0:text x="400" y="264" font-family="monospace" font-size="10.6667" fill="#ffffff">id alice</ns0:text>
  <ns0:text x="400" y="304" font-family="monospace" font-size="10" fill="#555555">A user has one primary group (in passwd) + supplementary groups (here)</ns0:text>
  <ns0:rect x="382.2222" y="342.2222" width="728.8889" height="262.2222" rx="8.8889" fill="#f8f9fa" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:rect x="382.2222" y="342.2222" width="728.8889" height="35.5556" rx="8.8889" fill="url(#grad-accent)" />
  <ns0:rect x="382.2222" y="364.4444" width="728.8889" height="13.3333" fill="url(#grad-accent)" />
  <ns0:text x="746.6667" y="367.1111" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="#ffffff">sudo Elevation Flow</ns0:text>
  <ns0:rect x="408.8889" y="391.1111" width="142.2222" height="57.7778" rx="7.1111" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.7778" />
  <ns0:text x="480" y="414.2222" text-anchor="middle" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="#1565c0">alice (user)</ns0:text>
  <ns0:text x="480" y="430.2222" text-anchor="middle" font-family="sans-serif" font-size="10.6667" fill="#555555">UID 1000</ns0:text>
  <ns0:text x="480" y="443.5556" text-anchor="middle" font-family="monospace" font-size="10.6667" fill="#555555">sudo command</ns0:text>
  <ns0:line x1="551.1111" y1="419.5556" x2="595.5556" y2="419.5556" stroke="#1565c0" stroke-width="1.7778" marker-end="url(#arrow-accent)" />
  <ns0:rect x="595.5556" y="391.1111" width="177.7778" height="57.7778" rx="7.1111" fill="#fff3e0" stroke="#e65100" stroke-width="1.7778" />
  <ns0:text x="684.4444" y="409.7778" text-anchor="middle" font-family="sans-serif" font-size="11.5556" font-weight="bold" fill="#e65100">sudo checks</ns0:text>
  <ns0:text x="684.4444" y="425.7778" font-family="monospace" font-size="10" fill="#555555">  /etc/sudoers</ns0:text>
  <ns0:text x="684.4444" y="440.8889" font-family="monospace" font-size="10" fill="#555555">  /etc/sudoers.d/*</ns0:text>
  <ns0:line x1="773.3333" y1="419.5556" x2="817.7778" y2="419.5556" stroke="#1565c0" stroke-width="1.7778" marker-end="url(#arrow-accent)" />
  <ns0:rect x="817.7778" y="391.1111" width="155.5556" height="57.7778" rx="7.1111" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.7778" />
  <ns0:text x="896" y="409.7778" text-anchor="middle" font-family="sans-serif" font-size="11.5556" font-weight="bold" fill="#2e7d32">Auth prompt</ns0:text>
  <ns0:text x="896" y="425.7778" text-anchor="middle" font-family="sans-serif" font-size="10.6667" fill="#555555">alice's password</ns0:text>
  <ns0:text x="896" y="441.7778" text-anchor="middle" font-family="sans-serif" font-size="10.6667" fill="#555555">(not root password)</ns0:text>
  <ns0:line x1="973.3333" y1="419.5556" x2="1017.7778" y2="419.5556" stroke="#1565c0" stroke-width="1.7778" marker-end="url(#arrow-accent)" />
  <ns0:rect x="1017.7778" y="391.1111" width="71.1111" height="57.7778" rx="7.1111" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.7778" />
  <ns0:text x="1053.3333" y="409.7778" text-anchor="middle" font-family="sans-serif" font-size="11.5556" font-weight="bold" fill="#6a1b9a">root</ns0:text>
  <ns0:text x="1053.3333" y="425.7778" text-anchor="middle" font-family="sans-serif" font-size="10.6667" fill="#555555">UID 0</ns0:text>
  <ns0:text x="1053.3333" y="441.7778" text-anchor="middle" font-family="sans-serif" font-size="10.6667" fill="#555555">executes</ns0:text>
  <ns0:rect x="408.8889" y="466.6667" width="684.4444" height="120" rx="7.1111" fill="#212121" />
  <ns0:text x="426.6667" y="488.8889" font-family="monospace" font-size="10.6667" fill="#888888"># /etc/sudoers  (edit with: visudo)</ns0:text>
  <ns0:text x="426.6667" y="508.4444" font-family="monospace" font-size="11.5556" fill="#aed581">alice</ns0:text>
  <ns0:text x="484.4444" y="508.4444" font-family="monospace" font-size="11.5556" fill="#ffffff">ALL=(ALL:ALL) ALL</ns0:text>
  <ns0:text x="675.5556" y="508.4444" font-family="monospace" font-size="10" fill="#888888"># full sudo access</ns0:text>
  <ns0:text x="426.6667" y="528" font-family="monospace" font-size="11.5556" fill="#aed581">%developers</ns0:text>
  <ns0:text x="524.4444" y="528" font-family="monospace" font-size="11.5556" fill="#ffffff">ALL=(ALL) NOPASSWD: /sbin/reboot</ns0:text>
  <ns0:text x="426.6667" y="547.5556" font-family="monospace" font-size="11.5556" fill="#aed581">bob</ns0:text>
  <ns0:text x="484.4444" y="547.5556" font-family="monospace" font-size="11.5556" fill="#ffffff">ALL=(ALL) /usr/bin/apt, /usr/bin/systemctl</ns0:text>
  <ns0:text x="426.6667" y="567.1111" font-family="monospace" font-size="10" fill="#888888"># bob can only use apt and systemctl, with password</ns0:text>
  <ns0:text x="426.6667" y="582.2222" font-family="monospace" font-size="10" fill="#555555">Format:  WHO  WHERE=(AS_WHOM)  COMMAND</ns0:text>
  <ns0:line x1="186.6667" y1="151.1111" x2="382.2222" y2="120" stroke="#888" stroke-width="1.3333" stroke-dasharray="5.3333 2.6667" marker-end="url(#arrow)" />
  <ns0:text x="284.4444" y="128.8889" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#888888">UID links</ns0:text>
  <ns0:text x="284.4444" y="140.4444" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#888888">accounts</ns0:text>
  <ns0:line x1="186.6667" y1="400" x2="382.2222" y2="137.7778" stroke="#888" stroke-width="1.3333" stroke-dasharray="5.3333 2.6667" marker-end="url(#arrow)" />
  <ns0:rect x="737.7778" y="22.2222" width="373.3333" height="302.2222" rx="8.8889" fill="#f8f9fa" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:rect x="737.7778" y="22.2222" width="373.3333" height="35.5556" rx="8.8889" fill="url(#grad-accent)" />
  <ns0:rect x="737.7778" y="44.4444" width="373.3333" height="13.3333" fill="url(#grad-accent)" />
  <ns0:text x="924.4444" y="47.1111" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="#ffffff">User Management Commands</ns0:text>
  <ns0:text x="755.5556" y="80" font-family="monospace" font-size="11.5556" fill="#1565c0">useradd -m -s /bin/bash alice</ns0:text>
  <ns0:text x="755.5556" y="96" font-family="sans-serif" font-size="10" fill="#555555">Create user with home dir and bash shell</ns0:text>
  <ns0:text x="755.5556" y="115.5556" font-family="monospace" font-size="11.5556" fill="#1565c0">passwd alice</ns0:text>
  <ns0:text x="755.5556" y="131.5556" font-family="sans-serif" font-size="10" fill="#555555">Set/change alice's password</ns0:text>
  <ns0:text x="755.5556" y="151.1111" font-family="monospace" font-size="11.5556" fill="#1565c0">usermod -aG sudo alice</ns0:text>
  <ns0:text x="755.5556" y="167.1111" font-family="sans-serif" font-size="10" fill="#555555">Add alice to sudo group</ns0:text>
  <ns0:text x="755.5556" y="186.6667" font-family="monospace" font-size="11.5556" fill="#1565c0">userdel -r alice</ns0:text>
  <ns0:text x="755.5556" y="202.6667" font-family="sans-serif" font-size="10" fill="#555555">Delete user and remove home directory</ns0:text>
  <ns0:text x="755.5556" y="222.2222" font-family="monospace" font-size="11.5556" fill="#1565c0">chage -l alice</ns0:text>
  <ns0:text x="755.5556" y="238.2222" font-family="sans-serif" font-size="10" fill="#555555">Show password expiry information</ns0:text>
  <ns0:text x="755.5556" y="257.7778" font-family="monospace" font-size="11.5556" fill="#1565c0">who / w / last</ns0:text>
  <ns0:text x="755.5556" y="273.7778" font-family="sans-serif" font-size="10" fill="#555555">Show logged-in users / login history</ns0:text>
  <ns0:text x="755.5556" y="293.3333" font-family="monospace" font-size="11.5556" fill="#1565c0">id alice</ns0:text>
  <ns0:text x="755.5556" y="309.3333" font-family="sans-serif" font-size="10" fill="#555555">Show UID, GID, and group memberships</ns0:text>
</ns0:svg>
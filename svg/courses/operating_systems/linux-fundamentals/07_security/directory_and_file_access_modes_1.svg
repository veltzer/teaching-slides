<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="79.2" text-anchor="middle" font-size="27.7333" font-weight="bold" fill="#333">Permission Bits: Owner / Group / Others</text>
  <rect x="106.6667" y="126" width="1066.6667" height="198" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="205.2" text-anchor="middle" font-size="27.7333" font-family="monospace" font-weight="bold">r w x   r w x   r w x</text>
  <text x="640" y="280.8" text-anchor="middle" font-size="23.4667" font-family="monospace" fill="#666">owner   group   others</text>
  <rect x="106.6667" y="378" width="341.3333" height="144" fill="#e8f5e9" stroke="#333" stroke-width="3.2" rx="8.5333" />
  <text x="277.3333" y="439.2" text-anchor="middle" font-size="23.4667" font-weight="bold">r = 4 (read)</text>
  <text x="277.3333" y="493.2" text-anchor="middle" font-size="21.3333">view contents</text>
  <rect x="469.3333" y="378" width="341.3333" height="144" fill="#fff3e0" stroke="#333" stroke-width="3.2" rx="8.5333" />
  <text x="640" y="439.2" text-anchor="middle" font-size="23.4667" font-weight="bold">w = 2 (write)</text>
  <text x="640" y="493.2" text-anchor="middle" font-size="21.3333">modify contents</text>
  <rect x="832" y="378" width="341.3333" height="144" fill="#ffebee" stroke="#333" stroke-width="3.2" rx="8.5333" />
  <text x="1002.6667" y="439.2" text-anchor="middle" font-size="23.4667" font-weight="bold">x = 1 (execute)</text>
  <text x="1002.6667" y="493.2" text-anchor="middle" font-size="21.3333">run / traverse</text>
  <rect x="106.6667" y="576" width="1066.6667" height="108" fill="#f3e5f5" stroke="#333" stroke-width="2.1333" rx="8.5333" opacity="0.7" />
  <text x="640" y="648" text-anchor="middle" font-size="23.4667" font-family="monospace">chmod 754 = rwxr-xr-- (7=rwx, 5=r-x, 4=r--)</text>
</svg>
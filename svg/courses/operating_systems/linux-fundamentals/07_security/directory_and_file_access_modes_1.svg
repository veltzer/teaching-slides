<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:text x="598.8304" y="74.1053" text-anchor="middle" font-size="25.9493" font-weight="bold" fill="#333">Permission Bits: Owner / Group / Others</ns0:text>
  <ns0:rect x="99.8051" y="117.8947" width="998.0507" height="185.2632" fill="#e3f2fd" stroke="#333" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="598.8304" y="192" text-anchor="middle" font-size="25.9493" font-family="monospace" font-weight="bold">r w x   r w x   r w x</ns0:text>
  <ns0:text x="598.8304" y="262.7368" text-anchor="middle" font-size="21.9571" font-family="monospace" fill="#666">owner   group   others</ns0:text>
  <ns0:rect x="99.8051" y="353.6842" width="319.3762" height="134.7368" fill="#e8f5e9" stroke="#333" stroke-width="2.9942" rx="7.9844" />
  <ns0:text x="259.4931" y="410.9474" text-anchor="middle" font-size="21.9571" font-weight="bold">r = 4 (read)</ns0:text>
  <ns0:text x="259.4931" y="461.4737" text-anchor="middle" font-size="19.961">view contents</ns0:text>
  <ns0:rect x="439.1423" y="353.6842" width="319.3762" height="134.7368" fill="#fff3e0" stroke="#333" stroke-width="2.9942" rx="7.9844" />
  <ns0:text x="598.8304" y="410.9474" text-anchor="middle" font-size="21.9571" font-weight="bold">w = 2 (write)</ns0:text>
  <ns0:text x="598.8304" y="461.4737" text-anchor="middle" font-size="19.961">modify contents</ns0:text>
  <ns0:rect x="778.4795" y="353.6842" width="319.3762" height="134.7368" fill="#ffebee" stroke="#333" stroke-width="2.9942" rx="7.9844" />
  <ns0:text x="938.1677" y="410.9474" text-anchor="middle" font-size="21.9571" font-weight="bold">x = 1 (execute)</ns0:text>
  <ns0:text x="938.1677" y="461.4737" text-anchor="middle" font-size="19.961">run / traverse</ns0:text>
  <ns0:rect x="99.8051" y="538.9474" width="998.0507" height="101.0526" fill="#f3e5f5" stroke="#333" stroke-width="1.9961" rx="7.9844" opacity="0.7" />
  <ns0:text x="598.8304" y="606.3158" text-anchor="middle" font-size="21.9571" font-family="monospace">chmod 754 = rwxr-xr-- (7=rwx, 5=r-x, 4=r--)</ns0:text>
</ns0:svg>
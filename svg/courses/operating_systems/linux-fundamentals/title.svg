<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="bg" x1="0" y1="0" x2="1.6" y2="1.8">
      <stop offset="0%" stop-color="#1a1a2e" />
      <stop offset="100%" stop-color="#1a1a2e" />
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="url(#bg)" rx="6" x="40" y="40"/>
  <rect x="339.9999" y="127" width="600" height="406" rx="6" fill="var(--black)" stroke="var(--text)" stroke-width="2.8444" />
  <rect x="339.9999" y="127" width="600" height="43.5" rx="6" fill="var(--text)" />
  <rect x="339.9999" y="156" width="600" height="14.5" fill="var(--text)" rx="6"/>
  <circle cx="370" cy="148.75" r="8.3426" fill="var(--danger-fill)" />
  <circle cx="400" cy="148.75" r="8.3426" fill="var(--warn-fill)" />
  <circle cx="430" cy="148.75" r="8.3426" fill="var(--ok-fill)" />
  <text x="640" y="154.55" text-anchor="middle" font-size="16.6854" fill="var(--text-faint)" font-family="Arial, sans-serif">Terminal</text>
  <text x="370" y="206.75" font-size="18.0758" fill="var(--ok-accent)" font-family="Courier New, monospace">$ ls -la /home</text>
  <text x="370" y="235.75" font-size="18.0758" fill="var(--border)" font-family="Courier New, monospace">drwxr-xr-x 3 user user</text>
  <text x="370" y="272" font-size="18.0758" fill="var(--ok-accent)" font-family="Courier New, monospace">$ cat /etc/os-release</text>
  <text x="370" y="301" font-size="18.0758" fill="var(--border)" font-family="Courier New, monospace">NAME="Linux"</text>
  <text x="370" y="337.25" font-size="18.0758" fill="var(--ok-accent)" font-family="Courier New, monospace">$ chmod +x script.sh</text>
  <text x="370" y="373.5" font-size="18.0758" fill="var(--ok-accent)" font-family="Courier New, monospace">$ ps aux | grep nginx</text>
  <text x="370" y="402.5" font-size="18.0758" fill="var(--border)" font-family="Courier New, monospace">root 1234 0.0 nginx</text>
  <text x="370" y="438.75" font-size="18.0758" fill="var(--ok-accent)" font-family="Courier New, monospace">$ df -h</text>
  <text x="370" y="467.75" font-size="18.0758" fill="var(--border)" font-family="Courier New, monospace">/dev/sda1 50G 12G 38G</text>
  <text x="370" y="504" font-size="18.0758" fill="var(--ok-accent)" font-family="Courier New, monospace">$ _</text>
  <rect x="145" y="214" width="120" height="87" rx="6" fill="none" stroke="var(--border)" stroke-width="1" opacity="0.5" />
  <text x="204.9999" y="250.25" text-anchor="middle" font-size="13.9044" fill="var(--primary-accent)" font-family="Arial, sans-serif">Files</text>
  <text x="204.9999" y="279.25" text-anchor="middle" font-size="27.8088" fill="var(--primary-accent)" opacity="0.7" font-family="Arial, sans-serif">📁</text>
  <rect x="145" y="344.5" width="120" height="87" rx="6" fill="none" stroke="var(--border)" stroke-width="1" opacity="0.5" />
  <text x="204.9999" y="380.75" text-anchor="middle" font-size="13.9044" fill="var(--primary-accent)" font-family="Arial, sans-serif">Process</text>
  <text x="204.9999" y="414.1" text-anchor="middle" font-size="27.8088" fill="var(--primary-accent)" opacity="0.7" font-family="Arial, sans-serif">⚙</text>
  <rect x="1014.9999" y="214" width="120" height="87" rx="6" fill="none" stroke="var(--border)" stroke-width="1" opacity="0.5" />
  <text x="1074.9999" y="250.25" text-anchor="middle" font-size="13.9044" fill="var(--primary-accent)" font-family="Arial, sans-serif">Network</text>
  <text x="1074.9999" y="279.25" text-anchor="middle" font-size="27.8088" fill="var(--primary-accent)" opacity="0.7" font-family="Arial, sans-serif">🌐</text>
  <rect x="1014.9999" y="344.5" width="120" height="87" rx="6" fill="none" stroke="var(--border)" stroke-width="1" opacity="0.5" />
  <text x="1074.9999" y="380.75" text-anchor="middle" font-size="13.9044" fill="var(--primary-accent)" font-family="Arial, sans-serif">Users</text>
  <text x="1074.9999" y="414.1" text-anchor="middle" font-size="27.8088" fill="var(--primary-accent)" opacity="0.7" font-family="Arial, sans-serif">👤</text>
</svg>
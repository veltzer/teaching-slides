<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="bg" x1="0" y1="0" x2="1.6" y2="1.8">
      <stop offset="0%" stop-color="#1a1a2e" />
      <stop offset="100%" stop-color="#1a1a2e" />
    </linearGradient>
  </defs>
  <rect width="1137.7778" height="640" fill="url(#bg)" rx="6"/>
  <rect x="284.4444" y="96" width="568.8889" height="448" rx="6" fill="var(--black)" stroke="var(--text)" stroke-width="2.8444" />
  <rect x="284.4444" y="96" width="568.8889" height="48" rx="6" fill="var(--text)" />
  <rect x="284.4444" y="128" width="568.8889" height="16" fill="var(--text)" rx="6"/>
  <circle cx="312.8889" cy="120" r="8.5333" fill="var(--danger-fill)" />
  <circle cx="341.3333" cy="120" r="8.5333" fill="var(--warn-fill)" />
  <circle cx="369.7778" cy="120" r="8.5333" fill="var(--ok-fill)" />
  <text x="568.8889" y="126.4" text-anchor="middle" font-size="17.0667" fill="var(--text-faint)">Terminal</text>
  <text x="312.8889" y="184" font-size="18.4889" fill="var(--ok-accent)" font-family="monospace">$ ls -la /home</text>
  <text x="312.8889" y="216" font-size="18.4889" fill="var(--border)" font-family="monospace">drwxr-xr-x 3 user user</text>
  <text x="312.8889" y="256" font-size="18.4889" fill="var(--ok-accent)" font-family="monospace">$ cat /etc/os-release</text>
  <text x="312.8889" y="288" font-size="18.4889" fill="var(--border)" font-family="monospace">NAME="Linux"</text>
  <text x="312.8889" y="328" font-size="18.4889" fill="var(--ok-accent)" font-family="monospace">$ chmod +x script.sh</text>
  <text x="312.8889" y="368" font-size="18.4889" fill="var(--ok-accent)" font-family="monospace">$ ps aux | grep nginx</text>
  <text x="312.8889" y="400" font-size="18.4889" fill="var(--border)" font-family="monospace">root 1234 0.0 nginx</text>
  <text x="312.8889" y="440" font-size="18.4889" fill="var(--ok-accent)" font-family="monospace">$ df -h</text>
  <text x="312.8889" y="472" font-size="18.4889" fill="var(--border)" font-family="monospace">/dev/sda1 50G 12G 38G</text>
  <text x="312.8889" y="512" font-size="18.4889" fill="var(--ok-accent)" font-family="monospace">$ _</text>
  <rect x="99.5556" y="192" width="113.7778" height="96" rx="6" fill="none" stroke="var(--border)" stroke-width="1" opacity="0.5" />
  <text x="156.4444" y="232" text-anchor="middle" font-size="14.2222" fill="var(--primary-accent)">Files</text>
  <text x="156.4444" y="264" text-anchor="middle" font-size="28.4444" fill="var(--primary-accent)" opacity="0.7">📁</text>
  <rect x="99.5556" y="336" width="113.7778" height="96" rx="6" fill="none" stroke="var(--border)" stroke-width="1" opacity="0.5" />
  <text x="156.4444" y="376" text-anchor="middle" font-size="14.2222" fill="var(--primary-accent)">Process</text>
  <text x="156.4444" y="412.8" text-anchor="middle" font-size="28.4444" fill="var(--primary-accent)" opacity="0.7">⚙</text>
  <rect x="924.4444" y="192" width="113.7778" height="96" rx="6" fill="none" stroke="var(--border)" stroke-width="1" opacity="0.5" />
  <text x="981.3333" y="232" text-anchor="middle" font-size="14.2222" fill="var(--primary-accent)">Network</text>
  <text x="981.3333" y="264" text-anchor="middle" font-size="28.4444" fill="var(--primary-accent)" opacity="0.7">🌐</text>
  <rect x="924.4444" y="336" width="113.7778" height="96" rx="6" fill="none" stroke="var(--border)" stroke-width="1" opacity="0.5" />
  <text x="981.3333" y="376" text-anchor="middle" font-size="14.2222" fill="var(--primary-accent)">Users</text>
  <text x="981.3333" y="412.8" text-anchor="middle" font-size="28.4444" fill="var(--primary-accent)" opacity="0.7">👤</text>
</svg>
<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Terminal window -->
  <rect x="200" y="60" width="400" height="280" rx="10" fill="#0c0c0c" stroke="#444" stroke-width="2"/>
  <!-- Title bar -->
  <rect x="200" y="60" width="400" height="30" rx="10" fill="#333"/>
  <rect x="200" y="80" width="400" height="10" fill="#333"/>
  <circle cx="220" cy="75" r="6" fill="#ff5f56"/>
  <circle cx="240" cy="75" r="6" fill="#ffbd2e"/>
  <circle cx="260" cy="75" r="6" fill="#27c93f"/>
  <text x="400" y="79" text-anchor="middle" font-size="12" fill="#aaa">Terminal</text>
  <!-- Terminal content -->
  <text x="220" y="115" font-size="13" fill="#27c93f" font-family="monospace">$ ls -la /home</text>
  <text x="220" y="135" font-size="13" fill="#ccc" font-family="monospace">drwxr-xr-x 3 user user</text>
  <text x="220" y="160" font-size="13" fill="#27c93f" font-family="monospace">$ cat /etc/os-release</text>
  <text x="220" y="180" font-size="13" fill="#ccc" font-family="monospace">NAME="Linux"</text>
  <text x="220" y="205" font-size="13" fill="#27c93f" font-family="monospace">$ chmod +x script.sh</text>
  <text x="220" y="230" font-size="13" fill="#27c93f" font-family="monospace">$ ps aux | grep nginx</text>
  <text x="220" y="250" font-size="13" fill="#ccc" font-family="monospace">root 1234 0.0 nginx</text>
  <text x="220" y="275" font-size="13" fill="#27c93f" font-family="monospace">$ df -h</text>
  <text x="220" y="295" font-size="13" fill="#ccc" font-family="monospace">/dev/sda1 50G 12G 38G</text>
  <text x="220" y="320" font-size="13" fill="#27c93f" font-family="monospace">$ _</text>
  <!-- Decorative elements -->
  <rect x="70" y="120" width="80" height="60" rx="5" fill="none" stroke="#0f3460" stroke-width="1.5" opacity="0.5"/>
  <text x="110" y="145" text-anchor="middle" font-size="10" fill="#0f3460">Files</text>
  <text x="110" y="165" text-anchor="middle" font-size="20" fill="#53a8b6" opacity="0.7">&#128193;</text>
  <rect x="70" y="210" width="80" height="60" rx="5" fill="none" stroke="#0f3460" stroke-width="1.5" opacity="0.5"/>
  <text x="110" y="235" text-anchor="middle" font-size="10" fill="#0f3460">Process</text>
  <text x="110" y="258" text-anchor="middle" font-size="20" fill="#53a8b6" opacity="0.7">&#9881;</text>
  <rect x="650" y="120" width="80" height="60" rx="5" fill="none" stroke="#0f3460" stroke-width="1.5" opacity="0.5"/>
  <text x="690" y="145" text-anchor="middle" font-size="10" fill="#0f3460">Network</text>
  <text x="690" y="165" text-anchor="middle" font-size="20" fill="#53a8b6" opacity="0.7">&#127760;</text>
  <rect x="650" y="210" width="80" height="60" rx="5" fill="none" stroke="#0f3460" stroke-width="1.5" opacity="0.5"/>
  <text x="690" y="235" text-anchor="middle" font-size="10" fill="#0f3460">Users</text>
  <text x="690" y="258" text-anchor="middle" font-size="20" fill="#53a8b6" opacity="0.7">&#128100;</text>
</svg>

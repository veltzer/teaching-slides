<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="576" height="253.749979843751" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.220932312148"/>
  <text x="328" y="112.500040312499" text-anchor="middle" font-size="22.705884528314" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Shell (local) Variable</text>
  <text x="328" y="177.749958343751" text-anchor="middle" font-size="22.705884528314" font-family="Courier New, monospace" fill="var(--primary-text)">name="John"</text>
  <text x="328" y="242.999983875001" text-anchor="middle" font-size="22.705884528314" fill="var(--text-muted)" font-family="Arial, sans-serif">Only in current shell</text>
  <rect x="663.9999" y="40" width="576" height="253.749979843751" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.220932312148"/>
  <text x="952" y="112.500040312499" text-anchor="middle" font-size="22.705884528314" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Environment Variable</text>
  <text x="952" y="177.749958343751" text-anchor="middle" font-size="22.705884528314" font-family="Courier New, monospace" fill="var(--ok-text)">export PATH=...</text>
  <text x="952" y="242.999983875001" text-anchor="middle" font-size="22.705884528314" fill="var(--text-muted)" font-family="Arial, sans-serif">Inherited by child processes</text>
  <rect x="40" y="348.124983203126" width="1200" height="108.75000671875" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.220932312148"/>
  <text x="639.9999" y="420.624916015628" text-anchor="middle" font-size="22.705884528314" font-family="Arial, sans-serif" fill="var(--warn-text)">Parent Shell --fork/exec--&gt; Child Shell (inherits exported vars only)</text>
  <rect x="40" y="493.125063828123" width="1200" height="126.874936171877" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.220932312148"/>
  <text x="639.9999" y="547.500067187498" text-anchor="middle" font-size="22.705884528314" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Key env vars: PATH, HOME, USER, SHELL, LANG, PS1, TERM</text>
  <text x="639.9999" y="601.874963046876" text-anchor="middle" font-size="22.705884528314" fill="var(--text-muted)" font-family="Arial, sans-serif">View all: env | sort   or   printenv</text>
</svg>

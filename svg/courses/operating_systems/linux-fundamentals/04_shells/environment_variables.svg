<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="64.8" text-anchor="middle" font-size="23.4667" font-weight="bold">Variable Scope: Local vs Environment</text>
  <rect x="106.6667" y="108" width="512" height="252" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="362.6667" y="180" text-anchor="middle" font-size="21.3333" font-weight="bold">Shell (local) Variable</text>
  <text x="362.6667" y="244.8" text-anchor="middle" font-family="monospace" font-size="21.3333">name="John"</text>
  <text x="362.6667" y="309.6" text-anchor="middle" font-size="21.3333" fill="#666">Only in current shell</text>
  <rect x="661.3333" y="108" width="512" height="252" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="917.3333" y="180" text-anchor="middle" font-size="21.3333" font-weight="bold">Environment Variable</text>
  <text x="917.3333" y="244.8" text-anchor="middle" font-family="monospace" font-size="21.3333">export PATH=...</text>
  <text x="917.3333" y="309.6" text-anchor="middle" font-size="21.3333" fill="#666">Inherited by child processes</text>
  <rect x="106.6667" y="414" width="1066.6667" height="108" fill="#fff3e0" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="640" y="486" text-anchor="middle" font-size="21.3333">Parent Shell --fork/exec--&gt; Child Shell (inherits exported vars only)</text>
  <rect x="106.6667" y="558" width="1066.6667" height="126" fill="#f3e5f5" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="640" y="612" text-anchor="middle" font-size="21.3333" font-weight="bold">Key env vars: PATH, HOME, USER, SHELL, LANG, PS1, TERM</text>
  <text x="640" y="666" text-anchor="middle" font-size="21.3333" fill="#666">View all: env | sort   or   printenv</text>
</svg>
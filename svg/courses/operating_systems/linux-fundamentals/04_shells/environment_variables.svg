<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:text x="598.8304" y="60.6316" text-anchor="middle" font-size="21.9571" font-weight="bold">Variable Scope: Local vs Environment</ns0:text>
  <ns0:rect x="99.8051" y="101.0526" width="479.0643" height="235.7895" fill="#e3f2fd" stroke="#333" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="339.3373" y="168.4211" text-anchor="middle" font-size="19.961" font-weight="bold">Shell (local) Variable</ns0:text>
  <ns0:text x="339.3373" y="229.0526" text-anchor="middle" font-family="monospace" font-size="19.961">name="John"</ns0:text>
  <ns0:text x="339.3373" y="289.6842" text-anchor="middle" font-size="19.961" fill="#666">Only in current shell</ns0:text>
  <ns0:rect x="618.7914" y="101.0526" width="479.0643" height="235.7895" fill="#e8f5e9" stroke="#333" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="858.3236" y="168.4211" text-anchor="middle" font-size="19.961" font-weight="bold">Environment Variable</ns0:text>
  <ns0:text x="858.3236" y="229.0526" text-anchor="middle" font-family="monospace" font-size="19.961">export PATH=...</ns0:text>
  <ns0:text x="858.3236" y="289.6842" text-anchor="middle" font-size="19.961" fill="#666">Inherited by child processes</ns0:text>
  <ns0:rect x="99.8051" y="387.3684" width="998.0507" height="101.0526" fill="#fff3e0" stroke="#333" stroke-width="1.9961" rx="5.9883" />
  <ns0:text x="598.8304" y="454.7368" text-anchor="middle" font-size="19.961">Parent Shell --fork/exec--&gt; Child Shell (inherits exported vars only)</ns0:text>
  <ns0:rect x="99.8051" y="522.1053" width="998.0507" height="117.8947" fill="#f3e5f5" stroke="#333" stroke-width="1.9961" rx="5.9883" />
  <ns0:text x="598.8304" y="572.6316" text-anchor="middle" font-size="19.961" font-weight="bold">Key env vars: PATH, HOME, USER, SHELL, LANG, PS1, TERM</ns0:text>
  <ns0:text x="598.8304" y="623.1579" text-anchor="middle" font-size="19.961" fill="#666">View all: env | sort   or   printenv</ns0:text>
</ns0:svg>
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="598.8304" y="60.6316" text-anchor="middle" font-size="21.9571" font-weight="bold">Pipeline: stdout of one -&gt; stdin of next</text>
  <rect x="59.883" y="101.0526" width="219.5712" height="151.5789" fill="var(--primary-pale)" stroke="var(--text-dark)" stroke-width="3.9922" rx="9.9805" />
  <text x="169.6686" y="161.6842" text-anchor="middle" font-size="19.961" font-weight="bold">ps aux</text>
  <text x="169.6686" y="218.9474" text-anchor="middle" font-size="19.961" fill="var(--text-mid)">stdout</text>
  <rect x="349.3177" y="128" width="59.883" height="94.3158" fill="var(--warn-pale)" stroke="var(--text-dark)" stroke-width="3.9922" rx="5.9883" />
  <text x="379.2592" y="192" text-anchor="middle" font-size="25.9493" font-weight="bold">|</text>
  <rect x="479.0643" y="101.0526" width="219.5712" height="151.5789" fill="var(--info-pale)" stroke="var(--text-dark)" stroke-width="3.9922" rx="9.9805" />
  <text x="588.8499" y="161.6842" text-anchor="middle" font-size="19.961" font-weight="bold">grep nginx</text>
  <text x="588.8499" y="218.9474" text-anchor="middle" font-size="19.961" fill="var(--text-mid)">filter</text>
  <rect x="768.499" y="128" width="59.883" height="94.3158" fill="var(--warn-pale)" stroke="var(--text-dark)" stroke-width="3.9922" rx="5.9883" />
  <text x="798.4405" y="192" text-anchor="middle" font-size="25.9493" font-weight="bold">|</text>
  <rect x="898.2456" y="101.0526" width="219.5712" height="151.5789" fill="var(--ok-pale)" stroke="var(--text-dark)" stroke-width="3.9922" rx="9.9805" />
  <text x="1008.0312" y="161.6842" text-anchor="middle" font-size="19.961" font-weight="bold">wc -l</text>
  <text x="1008.0312" y="218.9474" text-anchor="middle" font-size="19.961" fill="var(--text-mid)">count</text>
  <line x1="279.4542" y1="175.1579" x2="349.3177" y2="175.1579" stroke="var(--text-dark)" stroke-width="3.9922" marker-end="url(#arr_pipe)" />
  <line x1="698.6355" y1="175.1579" x2="768.499" y2="175.1579" stroke="var(--text-dark)" stroke-width="3.9922" marker-end="url(#arr_pipe)" />
  <rect x="99.8051" y="303.1579" width="998.0507" height="151.5789" fill="var(--danger-pale)" stroke="var(--text-dark)" stroke-width="1.9961" rx="5.9883" />
  <text x="598.8304" y="360.4211" text-anchor="middle" font-size="19.961" font-weight="bold">All processes in pipeline run concurrently</text>
  <text x="598.8304" y="421.0526" text-anchor="middle" font-size="19.961">Kernel buffers data between them (4KB pipe buffer)</text>
  <rect x="99.8051" y="488.4211" width="998.0507" height="151.5789" fill="var(--warn-pale)" stroke="var(--text-dark)" stroke-width="1.9961" rx="5.9883" />
  <text x="598.8304" y="545.6842" text-anchor="middle" font-size="19.961">tee: split output    |   xargs: build command from stdin</text>
  <text x="598.8304" y="606.3158" text-anchor="middle" font-family="monospace" font-size="19.961">cmd | tee log.txt | next_cmd    find . | xargs grep pat</text>

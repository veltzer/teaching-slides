<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="64.8" text-anchor="middle" font-size="23.4667" font-weight="bold">Pipeline: stdout of one -&gt; stdin of next</text>
  <rect x="64" y="108" width="234.6667" height="162" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="181.3333" y="172.8" text-anchor="middle" font-size="21.3333" font-weight="bold">ps aux</text>
  <text x="181.3333" y="234" text-anchor="middle" font-size="21.3333" fill="#666">stdout</text>
  <rect x="373.3333" y="136.8" width="64" height="100.8" fill="#fff3e0" stroke="#333" stroke-width="4.2667" rx="6.4" />
  <text x="405.3333" y="205.2" text-anchor="middle" font-size="27.7333" font-weight="bold">|</text>
  <rect x="512" y="108" width="234.6667" height="162" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="629.3333" y="172.8" text-anchor="middle" font-size="21.3333" font-weight="bold">grep nginx</text>
  <text x="629.3333" y="234" text-anchor="middle" font-size="21.3333" fill="#666">filter</text>
  <rect x="821.3333" y="136.8" width="64" height="100.8" fill="#fff3e0" stroke="#333" stroke-width="4.2667" rx="6.4" />
  <text x="853.3333" y="205.2" text-anchor="middle" font-size="27.7333" font-weight="bold">|</text>
  <rect x="960" y="108" width="234.6667" height="162" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1077.3333" y="172.8" text-anchor="middle" font-size="21.3333" font-weight="bold">wc -l</text>
  <text x="1077.3333" y="234" text-anchor="middle" font-size="21.3333" fill="#666">count</text>
  <line x1="298.6667" y1="187.2" x2="373.3333" y2="187.2" stroke="#333" stroke-width="4.2667" marker-end="url(#arr_pipe)" />
  <line x1="746.6667" y1="187.2" x2="821.3333" y2="187.2" stroke="#333" stroke-width="4.2667" marker-end="url(#arr_pipe)" />
  <rect x="106.6667" y="324" width="1066.6667" height="162" fill="#ffebee" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="640" y="385.2" text-anchor="middle" font-size="21.3333" font-weight="bold">All processes in pipeline run concurrently</text>
  <text x="640" y="450" text-anchor="middle" font-size="21.3333">Kernel buffers data between them (4KB pipe buffer)</text>
  <rect x="106.6667" y="522" width="1066.6667" height="162" fill="#fff3e0" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="640" y="583.2" text-anchor="middle" font-size="21.3333">tee: split output    |   xargs: build command from stdin</text>
  <text x="640" y="648" text-anchor="middle" font-family="monospace" font-size="21.3333">cmd | tee log.txt | next_cmd    find . | xargs grep pat</text>
  <defs>
    <marker id="arr_pipe" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
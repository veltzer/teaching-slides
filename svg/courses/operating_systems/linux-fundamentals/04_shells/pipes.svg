<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="651.3207" y="40" text-anchor="middle" font-size="23.3977" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Pipeline: stdout of one -&gt; stdin of next</text>
  <rect x="40" y="80.4651" width="249.0566" height="151.7441" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="164.5283" y="141.1628" text-anchor="middle" font-size="21.2706" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">ps aux</text>
  <text x="164.5283" y="198.4884" text-anchor="middle" font-size="21.2706" fill="var(--text-muted)" font-family="Arial, sans-serif">stdout</text>
  <rect x="368.3019" y="107.4418" width="67.9245" height="94.4186" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="402.2641" y="171.5116" text-anchor="middle" font-size="27.6518" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">|</text>
  <rect x="515.4717" y="80.4651" width="249.0566" height="151.7441" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="141.1628" text-anchor="middle" font-size="21.2706" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">grep nginx</text>
  <text x="640" y="198.4884" text-anchor="middle" font-size="21.2706" fill="var(--text-muted)" font-family="Arial, sans-serif">filter</text>
  <rect x="843.7735" y="107.4418" width="67.9245" height="94.4186" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="877.7358" y="171.5116" text-anchor="middle" font-size="27.6518" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">|</text>
  <rect x="990.9434" y="80.4651" width="249.0566" height="151.7441" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1115.4717" y="141.1628" text-anchor="middle" font-size="21.2706" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">wc -l</text>
  <text x="1115.4717" y="198.4884" text-anchor="middle" font-size="21.2706" fill="var(--text-muted)" font-family="Arial, sans-serif">count</text>
  <line x1="289.0566" y1="154.6512" x2="368.3019" y2="154.6512" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="764.5283" y1="154.6512" x2="843.7735" y2="154.6512" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="85.2831" y="282.7907" width="1132.0754" height="151.7441" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="651.3207" y="340.1163" text-anchor="middle" font-size="21.2706" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">All processes in pipeline run concurrently</text>
  <text x="651.3207" y="400.8139" text-anchor="middle" font-size="21.2706" font-family="Arial, sans-serif" fill="var(--danger-text)">Kernel buffers data between them (4KB pipe buffer)</text>
  <rect x="85.2831" y="468.2559" width="1132.0754" height="151.7441" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="651.3207" y="525.5814" text-anchor="middle" font-size="21.2706" font-family="Arial, sans-serif" fill="var(--warn-text)">tee: split output    |   xargs: build command from stdin</text>
  <text x="651.3207" y="586.2791" text-anchor="middle" font-size="21.2706" font-family="Courier New, monospace" fill="var(--warn-text)">cmd | tee log.txt | next_cmd    find . | xargs grep pat</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
</svg>
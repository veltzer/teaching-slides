<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="598.8304" y="60.6316" text-anchor="middle" font-size="21.9571" font-weight="bold">Pipeline: stdout of one -&gt; stdin of next</text>
  <rect x="59.883" y="101.0526" width="219.5712" height="151.5789" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="169.6686" y="161.6842" text-anchor="middle" font-size="19.961" font-weight="bold">ps aux</text>
  <text x="169.6686" y="218.9474" text-anchor="middle" font-size="19.961" fill="var(--text-muted)">stdout</text>
  <rect x="349.3177" y="128" width="59.883" height="94.3158" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="379.2592" y="192" text-anchor="middle" font-size="25.9493" font-weight="bold">|</text>
  <rect x="479.0643" y="101.0526" width="219.5712" height="151.5789" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="588.8499" y="161.6842" text-anchor="middle" font-size="19.961" font-weight="bold">grep nginx</text>
  <text x="588.8499" y="218.9474" text-anchor="middle" font-size="19.961" fill="var(--text-muted)">filter</text>
  <rect x="768.499" y="128" width="59.883" height="94.3158" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="798.4405" y="192" text-anchor="middle" font-size="25.9493" font-weight="bold">|</text>
  <rect x="898.2456" y="101.0526" width="219.5712" height="151.5789" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1008.0312" y="161.6842" text-anchor="middle" font-size="19.961" font-weight="bold">wc -l</text>
  <text x="1008.0312" y="218.9474" text-anchor="middle" font-size="19.961" fill="var(--text-muted)">count</text>
  <line x1="279.4542" y1="175.1579" x2="349.3177" y2="175.1579" stroke="var(--text)" stroke-width="2" marker-end="url(#arr_pipe)" />
  <line x1="698.6355" y1="175.1579" x2="768.499" y2="175.1579" stroke="var(--text)" stroke-width="2" marker-end="url(#arr_pipe)" />
  <rect x="99.8051" y="303.1579" width="998.0507" height="151.5789" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="598.8304" y="360.4211" text-anchor="middle" font-size="19.961" font-weight="bold">All processes in pipeline run concurrently</text>
  <text x="598.8304" y="421.0526" text-anchor="middle" font-size="19.961">Kernel buffers data between them (4KB pipe buffer)</text>
  <rect x="99.8051" y="488.4211" width="998.0507" height="151.5789" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="598.8304" y="545.6842" text-anchor="middle" font-size="19.961">tee: split output    |   xargs: build command from stdin</text>
  <text x="598.8304" y="606.3158" text-anchor="middle" font-family="monospace" font-size="19.961">cmd | tee log.txt | next_cmd    find . | xargs grep pat</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr_pipe" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
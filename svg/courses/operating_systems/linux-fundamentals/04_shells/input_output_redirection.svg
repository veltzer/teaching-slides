<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="598.8304" y="60.6316" text-anchor="middle" font-size="21.9571" font-weight="bold">I/O Redirection: File Descriptors 0, 1, 2</text>
  <rect x="99.8051" y="101.0526" width="199.6101" height="202.1053" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="199.6101" y="168.4211" text-anchor="middle" font-size="19.961" font-weight="bold">stdin (0)</text>
  <text x="199.6101" y="235.7895" text-anchor="middle" font-size="19.961">keyboard</text>
  <text x="199.6101" y="276.2105" text-anchor="middle" font-size="19.961" fill="var(--text-muted)">&lt; file</text>
  <rect x="499.0253" y="101.0526" width="199.6101" height="202.1053" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="598.8304" y="168.4211" text-anchor="middle" font-size="19.961" font-weight="bold">stdout (1)</text>
  <text x="598.8304" y="235.7895" text-anchor="middle" font-size="19.961">terminal</text>
  <text x="598.8304" y="276.2105" text-anchor="middle" font-size="19.961" fill="var(--text-muted)">&gt; file</text>
  <rect x="898.2456" y="101.0526" width="199.6101" height="202.1053" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="998.0507" y="168.4211" text-anchor="middle" font-size="19.961" font-weight="bold">stderr (2)</text>
  <text x="998.0507" y="235.7895" text-anchor="middle" font-size="19.961">terminal</text>
  <text x="998.0507" y="276.2105" text-anchor="middle" font-size="19.961" fill="var(--text-muted)">2&gt; file</text>
  <line x1="299.4152" y1="202.1053" x2="499.0253" y2="202.1053" stroke="var(--text)" stroke-width="2" marker-end="url(#arr_io)" />
  <rect x="339.3373" y="161.6842" width="119.7661" height="60.6316" fill="var(--warn-fill)" stroke="var(--warn-border)" rx="6" stroke-width="2"/>
  <text x="399.2203" y="205.4737" text-anchor="middle" font-size="19.961">Process</text>
  <rect x="99.8051" y="353.6842" width="998.0507" height="117.8947" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="598.8304" y="397.4737" text-anchor="middle" font-family="monospace" font-size="19.961">cmd &gt; out.txt 2&gt; err.txt     cmd &gt;&gt; append.txt</text>
  <text x="598.8304" y="448" text-anchor="middle" font-family="monospace" font-size="19.961">cmd &gt; file 2&gt;&amp;1              cmd &amp;&gt; both.txt</text>
  <rect x="99.8051" y="505.2632" width="998.0507" height="134.7368" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="598.8304" y="555.7895" text-anchor="middle" font-size="19.961" font-weight="bold">Here document:  cmd &lt;&lt; EOF ... EOF</text>
  <text x="598.8304" y="613.0526" text-anchor="middle" font-size="19.961">Here string:  cmd &lt;&lt;&lt; "text"   |   /dev/null: discard output</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr_io" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
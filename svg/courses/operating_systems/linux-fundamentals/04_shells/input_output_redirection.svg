<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="240" height="217.5000134375" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.220932312148"/>
  <text x="159.9999" y="112.500040312499" text-anchor="middle" font-size="22.705884528314" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">stdin (0)</text>
  <text x="159.9999" y="184.999973125001" text-anchor="middle" font-size="22.705884528314" font-family="Arial, sans-serif" fill="var(--primary-text)">keyboard</text>
  <text x="159.9999" y="228.499954312501" text-anchor="middle" font-size="22.705884528314" fill="var(--text-muted)" font-family="Arial, sans-serif">&lt; file</text>
  <rect x="519.9999" y="40" width="240" height="217.5000134375" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.220932312148"/>
  <text x="639.9999" y="112.500040312499" text-anchor="middle" font-size="22.705884528314" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">stdout (1)</text>
  <text x="639.9999" y="184.999973125001" text-anchor="middle" font-size="22.705884528314" font-family="Arial, sans-serif" fill="var(--ok-text)">terminal</text>
  <text x="639.9999" y="228.499954312501" text-anchor="middle" font-size="22.705884528314" fill="var(--text-muted)" font-family="Arial, sans-serif">&gt; file</text>
  <rect x="999.9999" y="40" width="240" height="217.5000134375" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.220932312148"/>
  <text x="1120" y="112.500040312499" text-anchor="middle" font-size="22.705884528314" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">stderr (2)</text>
  <text x="1120" y="184.999973125001" text-anchor="middle" font-size="22.705884528314" font-family="Arial, sans-serif" fill="var(--danger-text)">terminal</text>
  <text x="1120" y="228.499954312501" text-anchor="middle" font-size="22.705884528314" fill="var(--text-muted)" font-family="Arial, sans-serif">2&gt; file</text>
  <line x1="280" y1="148.75000671875" x2="519.9999" y2="148.75000671875" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="328" y="105.250025531249" width="144" height="65.250025531249" fill="url(#grad-warn)" stroke="var(--warn-border)" rx="6.220932312148" stroke-width="2"/>
  <text x="400" y="152.375014109375" text-anchor="middle" font-size="22.705884528314" font-family="Arial, sans-serif" fill="var(--warn-text)">Process</text>
  <rect x="40" y="311.875016796874" width="1200" height="126.874936171877" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.220932312148"/>
  <text x="639.9999" y="359.000005375" text-anchor="middle" font-size="22.705884528314" font-family="Courier New, monospace" fill="var(--warn-text)">cmd &gt; out.txt 2&gt; err.txt     cmd &gt;&gt; append.txt</text>
  <text x="639.9999" y="413.375008734375" text-anchor="middle" font-size="22.705884528314" font-family="Courier New, monospace" fill="var(--warn-text)">cmd &gt; file 2&gt;&amp;1              cmd &amp;&gt; both.txt</text>
  <rect x="40" y="475.000026874999" width="1200" height="144.999973125001" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.220932312148"/>
  <text x="639.9999" y="529.375030234374" text-anchor="middle" font-size="22.705884528314" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Here document:  cmd &lt;&lt; EOF ... EOF</text>
  <text x="639.9999" y="590.999940875002" text-anchor="middle" font-size="22.705884528314" font-family="Arial, sans-serif" fill="var(--info-text)">Here string:  cmd &lt;&lt;&lt; "text"   |   /dev/null: discard output</text>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
</svg>

<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:text x="598.8304" y="60.6316" text-anchor="middle" font-size="21.9571" font-weight="bold">I/O Redirection: File Descriptors 0, 1, 2</ns0:text>
  <ns0:rect x="99.8051" y="101.0526" width="199.6101" height="202.1053" fill="#e3f2fd" stroke="#333" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="199.6101" y="168.4211" text-anchor="middle" font-size="19.961" font-weight="bold">stdin (0)</ns0:text>
  <ns0:text x="199.6101" y="235.7895" text-anchor="middle" font-size="19.961">keyboard</ns0:text>
  <ns0:text x="199.6101" y="276.2105" text-anchor="middle" font-size="19.961" fill="#666">&lt; file</ns0:text>
  <ns0:rect x="499.0253" y="101.0526" width="199.6101" height="202.1053" fill="#e8f5e9" stroke="#333" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="598.8304" y="168.4211" text-anchor="middle" font-size="19.961" font-weight="bold">stdout (1)</ns0:text>
  <ns0:text x="598.8304" y="235.7895" text-anchor="middle" font-size="19.961">terminal</ns0:text>
  <ns0:text x="598.8304" y="276.2105" text-anchor="middle" font-size="19.961" fill="#666">&gt; file</ns0:text>
  <ns0:rect x="898.2456" y="101.0526" width="199.6101" height="202.1053" fill="#ffebee" stroke="#333" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="998.0507" y="168.4211" text-anchor="middle" font-size="19.961" font-weight="bold">stderr (2)</ns0:text>
  <ns0:text x="998.0507" y="235.7895" text-anchor="middle" font-size="19.961">terminal</ns0:text>
  <ns0:text x="998.0507" y="276.2105" text-anchor="middle" font-size="19.961" fill="#666">2&gt; file</ns0:text>
  <ns0:line x1="299.4152" y1="202.1053" x2="499.0253" y2="202.1053" stroke="#333" stroke-width="3.9922" marker-end="url(#arr_io)" />
  <ns0:rect x="339.3373" y="161.6842" width="119.7661" height="60.6316" fill="#fff3e0" stroke="none" />
  <ns0:text x="399.2203" y="205.4737" text-anchor="middle" font-size="19.961">Process</ns0:text>
  <ns0:rect x="99.8051" y="353.6842" width="998.0507" height="117.8947" fill="#fff3e0" stroke="#333" stroke-width="1.9961" rx="5.9883" />
  <ns0:text x="598.8304" y="397.4737" text-anchor="middle" font-family="monospace" font-size="19.961">cmd &gt; out.txt 2&gt; err.txt     cmd &gt;&gt; append.txt</ns0:text>
  <ns0:text x="598.8304" y="448" text-anchor="middle" font-family="monospace" font-size="19.961">cmd &gt; file 2&gt;&amp;1              cmd &amp;&gt; both.txt</ns0:text>
  <ns0:rect x="99.8051" y="505.2632" width="998.0507" height="134.7368" fill="#f3e5f5" stroke="#333" stroke-width="1.9961" rx="5.9883" />
  <ns0:text x="598.8304" y="555.7895" text-anchor="middle" font-size="19.961" font-weight="bold">Here document:  cmd &lt;&lt; EOF ... EOF</ns0:text>
  <ns0:text x="598.8304" y="613.0526" text-anchor="middle" font-size="19.961">Here string:  cmd &lt;&lt;&lt; "text"   |   /dev/null: discard output</ns0:text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="64.8" text-anchor="middle" font-size="23.4667" font-weight="bold">I/O Redirection: File Descriptors 0, 1, 2</text>
  <rect x="106.6667" y="108" width="213.3333" height="216" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="213.3333" y="180" text-anchor="middle" font-size="21.3333" font-weight="bold">stdin (0)</text>
  <text x="213.3333" y="252" text-anchor="middle" font-size="21.3333">keyboard</text>
  <text x="213.3333" y="295.2" text-anchor="middle" font-size="21.3333" fill="#666">&lt; file</text>
  <rect x="533.3333" y="108" width="213.3333" height="216" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="180" text-anchor="middle" font-size="21.3333" font-weight="bold">stdout (1)</text>
  <text x="640" y="252" text-anchor="middle" font-size="21.3333">terminal</text>
  <text x="640" y="295.2" text-anchor="middle" font-size="21.3333" fill="#666">&gt; file</text>
  <rect x="960" y="108" width="213.3333" height="216" fill="#ffebee" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1066.6667" y="180" text-anchor="middle" font-size="21.3333" font-weight="bold">stderr (2)</text>
  <text x="1066.6667" y="252" text-anchor="middle" font-size="21.3333">terminal</text>
  <text x="1066.6667" y="295.2" text-anchor="middle" font-size="21.3333" fill="#666">2&gt; file</text>
  <line x1="320" y1="216" x2="533.3333" y2="216" stroke="#333" stroke-width="4.2667" marker-end="url(#arr_io)" />
  <rect x="362.6667" y="172.8" width="128" height="64.8" fill="#fff3e0" stroke="none" />
  <text x="426.6667" y="219.6" text-anchor="middle" font-size="21.3333">Process</text>
  <rect x="106.6667" y="378" width="1066.6667" height="126" fill="#fff3e0" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="640" y="424.8" text-anchor="middle" font-family="monospace" font-size="21.3333">cmd &gt; out.txt 2&gt; err.txt     cmd &gt;&gt; append.txt</text>
  <text x="640" y="478.8" text-anchor="middle" font-family="monospace" font-size="21.3333">cmd &gt; file 2&gt;&amp;1              cmd &amp;&gt; both.txt</text>
  <rect x="106.6667" y="540" width="1066.6667" height="144" fill="#f3e5f5" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="640" y="594" text-anchor="middle" font-size="21.3333" font-weight="bold">Here document:  cmd &lt;&lt; EOF ... EOF</text>
  <text x="640" y="655.2" text-anchor="middle" font-size="21.3333">Here string:  cmd &lt;&lt;&lt; "text"   |   /dev/null: discard output</text>
  <defs>
    <marker id="arr_io" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
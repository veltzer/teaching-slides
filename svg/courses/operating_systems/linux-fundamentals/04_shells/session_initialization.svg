<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <text x="639.9999" y="40" text-anchor="middle" font-size="24.4474" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Bash Startup File Load Order</text>
  <rect x="40" y="74.7305" width="384" height="121.5569" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="232" y="151.1377" text-anchor="middle" font-size="22.2249" font-family="Arial, sans-serif" fill="var(--primary-text)">/etc/profile</text>
  <line x1="424" y1="133.7725" x2="483.9999" y2="133.7725" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="483.9999" y="74.7305" width="384" height="121.5569" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="676" y="151.1377" text-anchor="middle" font-size="22.2249" font-family="Arial, sans-serif" fill="var(--info-text)">~/.bash_profile</text>
  <line x1="868" y1="133.7725" x2="927.9999" y2="133.7725" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="927.9999" y="74.7305" width="312" height="121.5569" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1084" y="151.1377" text-anchor="middle" font-size="22.2249" font-family="Arial, sans-serif" fill="var(--ok-text)">~/.bashrc</text>
  <rect x="40" y="248.3832" width="599.9999" height="121.5569" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="339.9999" y="307.4251" text-anchor="middle" font-size="22.2249" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Login Shell (ssh, console)</text>
  <text x="339.9999" y="352.5748" text-anchor="middle" font-size="22.2249" font-family="Arial, sans-serif" fill="var(--warn-text)">/etc/profile -&gt; ~/.bash_profile</text>
  <rect x="687.9999" y="248.3832" width="551.9999" height="121.5569" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="964" y="307.4251" text-anchor="middle" font-size="22.2249" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Interactive (terminal)</text>
  <text x="964" y="352.5748" text-anchor="middle" font-size="22.2249" font-family="Arial, sans-serif" fill="var(--danger-text)">~/.bashrc only</text>
  <rect x="40" y="411.6167" width="1200" height="208.3833" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="470.6586" text-anchor="middle" font-size="22.2249" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Common Pattern: ~/.bash_profile sources ~/.bashrc</text>
  <text x="639.9999" y="533.1736" text-anchor="middle" font-size="22.2249" font-family="Courier New, monospace" fill="var(--ok-text)">[ -f ~/.bashrc ] &amp;&amp; source ~/.bashrc</text>
  <text x="639.9999" y="595.6886" text-anchor="middle" font-size="22.2249" fill="var(--text-muted)" font-family="Arial, sans-serif">Logout: ~/.bash_logout  |  Non-interactive: $BASH_ENV</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

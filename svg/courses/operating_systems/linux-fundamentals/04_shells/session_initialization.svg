<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:text x="615.015" y="62.2703" text-anchor="middle" font-size="22.5506" font-weight="bold">Bash Startup File Load Order</ns0:text>
  <ns0:rect x="102.5025" y="96.8649" width="328.008" height="121.0811" fill="#e3f2fd" stroke="#333" stroke-width="4.1001" rx="10.2503" />
  <ns0:text x="266.5065" y="172.973" text-anchor="middle" font-size="20.5005">/etc/profile</ns0:text>
  <ns0:line x1="430.5105" y1="155.6757" x2="481.7617" y2="155.6757" stroke="#333" stroke-width="2.05" marker-end="url(#arr_init)" />
  <ns0:rect x="481.7617" y="96.8649" width="328.008" height="121.0811" fill="#f3e5f5" stroke="#333" stroke-width="2.05" rx="10.2503" />
  <ns0:text x="645.7658" y="172.973" text-anchor="middle" font-size="20.5005">~/.bash_profile</ns0:text>
  <ns0:line x1="809.7698" y1="155.6757" x2="861.021" y2="155.6757" stroke="#333" stroke-width="2.05" marker-end="url(#arr_init)" />
  <ns0:rect x="861.021" y="96.8649" width="266.5065" height="121.0811" fill="#e8f5e9" stroke="#333" stroke-width="2.05" rx="10.2503" />
  <ns0:text x="994.2743" y="172.973" text-anchor="middle" font-size="20.5005">~/.bashrc</ns0:text>
  <ns0:rect x="102.5025" y="269.8378" width="512.5125" height="121.0811" fill="#fff3e0" stroke="#333" stroke-width="2.05" rx="6.1502" />
  <ns0:text x="358.7587" y="328.6486" text-anchor="middle" font-size="20.5005" font-weight="bold">Login Shell (ssh, console)</ns0:text>
  <ns0:text x="358.7587" y="373.6216" text-anchor="middle" font-size="20.5005">/etc/profile -&gt; ~/.bash_profile</ns0:text>
  <ns0:rect x="656.016" y="269.8378" width="471.5115" height="121.0811" fill="#ffebee" stroke="#333" stroke-width="2.05" rx="6.1502" />
  <ns0:text x="891.7718" y="328.6486" text-anchor="middle" font-size="20.5005" font-weight="bold">Interactive (terminal)</ns0:text>
  <ns0:text x="891.7718" y="373.6216" text-anchor="middle" font-size="20.5005">~/.bashrc only</ns0:text>
  <ns0:rect x="102.5025" y="432.4324" width="1025.0251" height="207.5676" fill="#e8f5e9" stroke="#333" stroke-width="2.05" rx="6.1502" />
  <ns0:text x="615.015" y="491.2432" text-anchor="middle" font-size="20.5005" font-weight="bold">Common Pattern: ~/.bash_profile sources ~/.bashrc</ns0:text>
  <ns0:text x="615.015" y="553.5135" text-anchor="middle" font-family="monospace" font-size="20.5005">[ -f ~/.bashrc ] &amp;&amp; source ~/.bashrc</ns0:text>
  <ns0:text x="615.015" y="615.7838" text-anchor="middle" font-size="20.5005" fill="#666">Logout: ~/.bash_logout  |  Non-interactive: $BASH_ENV</ns0:text>
  <ns0:defs>
    <ns0:marker id="arr_init" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <ns0:path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </ns0:marker>
  </ns0:defs>
</ns0:svg>
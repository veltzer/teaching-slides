<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="64.8" text-anchor="middle" font-size="23.4667" font-weight="bold">Bash Startup File Load Order</text>
  <rect x="106.6667" y="100.8" width="341.3333" height="126" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="277.3333" y="180" text-anchor="middle" font-size="21.3333">/etc/profile</text>
  <line x1="448" y1="162" x2="501.3333" y2="162" stroke="#333" stroke-width="2.1333" marker-end="url(#arr_init)" />
  <rect x="501.3333" y="100.8" width="341.3333" height="126" fill="#f3e5f5" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="672" y="180" text-anchor="middle" font-size="21.3333">~/.bash_profile</text>
  <line x1="842.6667" y1="162" x2="896" y2="162" stroke="#333" stroke-width="2.1333" marker-end="url(#arr_init)" />
  <rect x="896" y="100.8" width="277.3333" height="126" fill="#e8f5e9" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="1034.6667" y="180" text-anchor="middle" font-size="21.3333">~/.bashrc</text>
  <rect x="106.6667" y="280.8" width="533.3333" height="126" fill="#fff3e0" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="373.3333" y="342" text-anchor="middle" font-size="21.3333" font-weight="bold">Login Shell (ssh, console)</text>
  <text x="373.3333" y="388.8" text-anchor="middle" font-size="21.3333">/etc/profile -&gt; ~/.bash_profile</text>
  <rect x="682.6667" y="280.8" width="490.6667" height="126" fill="#ffebee" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="928" y="342" text-anchor="middle" font-size="21.3333" font-weight="bold">Interactive (terminal)</text>
  <text x="928" y="388.8" text-anchor="middle" font-size="21.3333">~/.bashrc only</text>
  <rect x="106.6667" y="450" width="1066.6667" height="216" fill="#e8f5e9" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="640" y="511.2" text-anchor="middle" font-size="21.3333" font-weight="bold">Common Pattern: ~/.bash_profile sources ~/.bashrc</text>
  <text x="640" y="576" text-anchor="middle" font-family="monospace" font-size="21.3333">[ -f ~/.bashrc ] &amp;&amp; source ~/.bashrc</text>
  <text x="640" y="640.8" text-anchor="middle" font-size="21.3333" fill="#666">Logout: ~/.bash_logout  |  Non-interactive: $BASH_ENV</text>
  <defs>
    <marker id="arr_init" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
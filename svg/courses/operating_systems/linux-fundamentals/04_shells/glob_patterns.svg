<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="64.8" text-anchor="middle" font-size="23.4667" font-weight="bold">Glob Pattern Expansion (by the shell, not the command)</text>
  <rect x="106.6667" y="108" width="256" height="180" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="234.6667" y="172.8" text-anchor="middle" font-size="23.4667" font-weight="bold">*</text>
  <text x="234.6667" y="244.8" text-anchor="middle" font-size="21.3333">any string</text>
  <rect x="405.3333" y="108" width="256" height="180" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="533.3333" y="172.8" text-anchor="middle" font-size="23.4667" font-weight="bold">?</text>
  <text x="533.3333" y="244.8" text-anchor="middle" font-size="21.3333">single char</text>
  <rect x="704" y="108" width="256" height="180" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="832" y="172.8" text-anchor="middle" font-size="23.4667" font-weight="bold">[abc]</text>
  <text x="832" y="244.8" text-anchor="middle" font-size="21.3333">char class</text>
  <rect x="1002.6667" y="108" width="192" height="180" fill="#fff3e0" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1098.6667" y="172.8" text-anchor="middle" font-size="23.4667" font-weight="bold">{a,b}</text>
  <text x="1098.6667" y="244.8" text-anchor="middle" font-size="21.3333">brace exp</text>
  <rect x="106.6667" y="342" width="1066.6667" height="144" fill="#ffebee" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="640" y="388.8" text-anchor="middle" font-family="monospace" font-size="21.3333">ls *.txt  -&gt;  ls file1.txt file2.txt notes.txt</text>
  <text x="640" y="450" text-anchor="middle" font-size="21.3333" fill="#666">Shell expands globs BEFORE passing to command</text>
  <rect x="106.6667" y="540" width="1066.6667" height="144" fill="#fff3e0" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="640" y="594" text-anchor="middle" font-size="21.3333">Extended: **/ (recursive), !(pat) (negate), +(pat) (one or more)</text>
  <text x="640" y="655.2" text-anchor="middle" font-size="21.3333" fill="#666">Enable: shopt -s extglob globstar</text>
</svg>
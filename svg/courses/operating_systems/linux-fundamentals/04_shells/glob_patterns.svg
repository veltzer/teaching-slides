  <ns0:text x="598.8304" y="60.6316" text-anchor="middle" font-size="21.9571" font-weight="bold">Glob Pattern Expansion (by the shell, not the command)</ns0:text>
  <ns0:rect x="99.8051" y="101.0526" width="239.5322" height="168.4211" fill="#e3f2fd" stroke="#333" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="219.5712" y="161.6842" text-anchor="middle" font-size="21.9571" font-weight="bold">*</ns0:text>
  <ns0:text x="219.5712" y="229.0526" text-anchor="middle" font-size="19.961">any string</ns0:text>
  <ns0:rect x="379.2592" y="101.0526" width="239.5322" height="168.4211" fill="#f3e5f5" stroke="#333" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="499.0253" y="161.6842" text-anchor="middle" font-size="21.9571" font-weight="bold">?</ns0:text>
  <ns0:text x="499.0253" y="229.0526" text-anchor="middle" font-size="19.961">single char</ns0:text>
  <ns0:rect x="658.7135" y="101.0526" width="239.5322" height="168.4211" fill="#e8f5e9" stroke="#333" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="778.4795" y="161.6842" text-anchor="middle" font-size="21.9571" font-weight="bold">[abc]</ns0:text>
  <ns0:text x="778.4795" y="229.0526" text-anchor="middle" font-size="19.961">char class</ns0:text>
  <ns0:rect x="938.1677" y="101.0526" width="179.6491" height="168.4211" fill="#fff3e0" stroke="#333" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="1027.9922" y="161.6842" text-anchor="middle" font-size="21.9571" font-weight="bold">{a,b}</ns0:text>
  <ns0:text x="1027.9922" y="229.0526" text-anchor="middle" font-size="19.961">brace exp</ns0:text>
  <ns0:rect x="99.8051" y="320" width="998.0507" height="134.7368" fill="#ffebee" stroke="#333" stroke-width="1.9961" rx="5.9883" />
  <ns0:text x="598.8304" y="363.7895" text-anchor="middle" font-family="monospace" font-size="19.961">ls *.txt  -&gt;  ls file1.txt file2.txt notes.txt</ns0:text>
  <ns0:text x="598.8304" y="421.0526" text-anchor="middle" font-size="19.961" fill="#666">Shell expands globs BEFORE passing to command</ns0:text>
  <ns0:rect x="99.8051" y="505.2632" width="998.0507" height="134.7368" fill="#fff3e0" stroke="#333" stroke-width="1.9961" rx="5.9883" />
  <ns0:text x="598.8304" y="555.7895" text-anchor="middle" font-size="19.961">Extended: **/ (recursive), !(pat) (negate), +(pat) (one or more)</ns0:text>
  <ns0:text x="598.8304" y="613.0526" text-anchor="middle" font-size="19.961" fill="#666">Enable: shopt -s extglob globstar</ns0:text>
</ns0:svg>
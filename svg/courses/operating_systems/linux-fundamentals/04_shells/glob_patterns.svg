<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="282.353" height="181.250047031249" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.220932312148" filter="url(#shadow)"/>
  <text x="181.1765" y="105.250025531249" text-anchor="middle" font-size="24.730383267098" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">*</text>
  <text x="181.1765" y="177.749958343751" text-anchor="middle" font-size="22.482138329487" font-family="Arial, sans-serif" fill="var(--primary-text)">any string</text>
  <rect x="369.4117" y="40" width="282.353" height="181.250047031249" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.220932312148" filter="url(#shadow)"/>
  <text x="510.5881" y="105.250025531249" text-anchor="middle" font-size="24.730383267098" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">?</text>
  <text x="510.5881" y="177.749958343751" text-anchor="middle" font-size="22.482138329487" font-family="Arial, sans-serif" fill="var(--info-text)">single char</text>
  <rect x="698.8235" y="40" width="282.353" height="181.250047031249" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.220932312148" filter="url(#shadow)"/>
  <text x="839.9999" y="105.250025531249" text-anchor="middle" font-size="24.730383267098" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">[abc]</text>
  <text x="839.9999" y="177.749958343751" text-anchor="middle" font-size="22.482138329487" font-family="Arial, sans-serif" fill="var(--ok-text)">char class</text>
  <rect x="1028.2353" y="40" width="211.7647" height="181.250047031249" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.220932312148" filter="url(#shadow)"/>
  <text x="1134.1176" y="105.250025531249" text-anchor="middle" font-size="24.730383267098" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">{a,b}</text>
  <text x="1134.1176" y="177.749958343751" text-anchor="middle" font-size="22.482138329487" font-family="Arial, sans-serif" fill="var(--warn-text)">brace exp</text>
  <rect x="40" y="275.625050390624" width="1176.4706" height="144.999973125001" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.220932312148" filter="url(#shadow)"/>
  <text x="628.2352" y="322.750038968749" text-anchor="middle" font-size="22.482138329487" font-family="Courier New, monospace" fill="var(--danger-text)">ls *.txt  -&gt;  ls file1.txt file2.txt notes.txt</text>
  <text x="628.2352" y="384.374949609377" text-anchor="middle" font-size="22.482138329487" fill="var(--text-muted)" font-family="Arial, sans-serif">Shell expands globs BEFORE passing to command</text>
  <rect x="40" y="475.000026874999" width="1176.4706" height="144.999973125001" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.220932312148" filter="url(#shadow)"/>
  <text x="628.2352" y="529.375030234374" text-anchor="middle" font-size="22.482138329487" font-family="Arial, sans-serif" fill="var(--warn-text)">Extended: **/ (recursive), !(pat) (negate), +(pat) (one or more)</text>
  <text x="628.2352" y="590.999940875002" text-anchor="middle" font-size="22.482138329487" fill="var(--text-muted)" font-family="Arial, sans-serif">Enable: shopt -s extglob globstar</text>
</svg>

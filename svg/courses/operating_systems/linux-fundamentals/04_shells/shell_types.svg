<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="540" y="40" width="200" height="61.052631578947" rx="6.052402741669" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="70.526315789474" text-anchor="middle" font-family="Courier New, monospace" font-size="18.157208225008" font-weight="bold" fill="var(--primary-text)">Thompson sh</text>
  <text x="640" y="90.877192982456" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805483339" fill="var(--primary-text)">1971</text>

  <line x1="640" y1="101.052631578947" x2="320" y2="162.105263157895" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="640" y1="101.052631578947" x2="960" y2="162.105263157895" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="200" y="167.19298245614" width="260" height="61.052631578947" rx="6.052402741669" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="330" y="197.719298245614" text-anchor="middle" font-family="Courier New, monospace" font-size="18.157208225008" font-weight="bold" fill="var(--text)">Bourne sh</text>
  <text x="330" y="218.070175438596" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805483339" fill="var(--text-muted)">AT&amp;T, 1979</text>

  <rect x="820" y="167.19298245614" width="260" height="61.052631578947" rx="6.052402741669" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="950" y="197.719298245614" text-anchor="middle" font-family="Courier New, monospace" font-size="18.157208225008" font-weight="bold" fill="var(--text)">C shell (csh)</text>
  <text x="950" y="218.070175438596" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805483339" fill="var(--text-muted)">BSD, 1978</text>

  <rect x="40" y="258.771929824561" width="200" height="81.40350877193" rx="6.052402741669" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="294.385964912281" text-anchor="middle" font-family="Courier New, monospace" font-size="18.157208225008" font-weight="bold" fill="var(--primary-text)">bash</text>
  <text x="140" y="319.824561403509" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805483339" fill="var(--primary-text)">GNU default</text>

  <rect x="250" y="258.771929824561" width="200" height="81.40350877193" rx="6.052402741669" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="350" y="294.385964912281" text-anchor="middle" font-family="Courier New, monospace" font-size="18.157208225008" font-weight="bold" fill="var(--ok-text)">dash</text>
  <text x="350" y="319.824561403509" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805483339" fill="var(--ok-text)">fast POSIX</text>

  <rect x="460" y="258.771929824561" width="200" height="81.40350877193" rx="6.052402741669" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="560" y="294.385964912281" text-anchor="middle" font-family="Courier New, monospace" font-size="18.157208225008" font-weight="bold" fill="var(--warn-text)">ksh</text>
  <text x="560" y="319.824561403509" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805483339" fill="var(--warn-text)">KornShell, 1983</text>

  <rect x="670" y="258.771929824561" width="200" height="81.40350877193" rx="6.052402741669" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="770" y="294.385964912281" text-anchor="middle" font-family="Courier New, monospace" font-size="18.157208225008" font-weight="bold" fill="var(--danger-text)">tcsh</text>
  <text x="770" y="319.824561403509" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805483339" fill="var(--danger-text)">TENEX csh</text>

  <rect x="880" y="258.771929824561" width="170" height="81.40350877193" rx="6.052402741669" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="965" y="294.385964912281" text-anchor="middle" font-family="Courier New, monospace" font-size="18.157208225008" font-weight="bold" fill="var(--info-text)">zsh</text>
  <text x="965" y="319.824561403509" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805483339" fill="var(--info-text)">macOS default</text>

  <rect x="1060" y="258.771929824561" width="180" height="81.40350877193" rx="6.052402741669" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1150" y="294.385964912281" text-anchor="middle" font-family="Courier New, monospace" font-size="18.157208225008" font-weight="bold" fill="var(--primary-text)">fish</text>
  <text x="1150" y="319.824561403509" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805483339" fill="var(--primary-text)">auto-suggest</text>

  <rect x="40" y="365.614035087719" width="1200" height="254.385964912281" rx="6.052402741669" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="401.228070175439" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208225008" font-weight="bold" fill="var(--text)">Picking a shell</text>
  <text x="640" y="447.017543859649" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139740644452" fill="var(--text-muted)">bash: scripts, portable</text>
  <text x="640" y="482.631578947368" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139740644452" fill="var(--text-muted)">dash: fast POSIX sh</text>
  <text x="640" y="518.245614035088" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139740644452" fill="var(--text-muted)">zsh, fish: interactive</text>
  <text x="640" y="579.298245614035" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131006854174" font-style="italic" fill="var(--text-faint)">tcsh: legacy; avoid for scripts</text>
</svg>

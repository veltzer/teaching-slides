  <rect x="841.619433" y="157.579382" width="252.631579" height="50.892674" rx="6.375119" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="967.935223" y="180.39347" text-anchor="middle" font-size="17.543796" font-weight="bold" fill="var(--warn-accent)" font-family="Courier New, monospace">C shell (csh)</text>
  <text x="967.935223" y="198.820025" text-anchor="middle" font-size="12.003711" fill="var(--text-muted)" font-family="Arial, sans-serif">BSD, C-like syntax (1978)</text>
  <line x1="268.340081" y1="208.472055" x2="142.024291" y2="290.953233" stroke="var(--text-faint)" stroke-width="1.3333" marker-end="url(#arrow)" />

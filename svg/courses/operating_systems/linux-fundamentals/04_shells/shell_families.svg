<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="663.0769" y="40" text-anchor="middle" font-size="25.769" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Shell Family Tree</text>
  <rect x="490" y="63.6046" width="346.1538" height="101.1628" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="663.0769" y="131.0464" text-anchor="middle" font-size="21.4742" font-family="Arial, sans-serif" fill="var(--warn-text)">Thompson Shell (1971)</text>
  <line x1="524.6154" y1="164.7675" x2="270.7692" y2="232.2093" stroke="var(--text)" stroke-width="1.9961" />
  <line x1="801.5385" y1="164.7675" x2="1055.3846" y2="232.2093" stroke="var(--text)" stroke-width="1.9961" />
  <rect x="86.1539" y="232.2093" width="369.2307" height="101.1628" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="270.7692" y="299.6512" text-anchor="middle" font-size="21.4742" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Bourne sh (1977)</text>
  <rect x="870.7692" y="232.2093" width="369.2307" height="101.1628" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1055.3846" y="299.6512" text-anchor="middle" font-size="21.4742" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">C Shell csh (1978)</text>
  <line x1="155.3846" y1="333.3721" x2="155.3846" y2="400.8139" stroke="var(--text)" stroke-width="1.9961" />
  <line x1="270.7692" y1="333.3721" x2="432.3077" y2="400.8139" stroke="var(--text)" stroke-width="1.9961" />
  <line x1="386.1538" y1="333.3721" x2="732.3077" y2="400.8139" stroke="var(--text)" stroke-width="1.9961" />
  <line x1="1055.3846" y1="333.3721" x2="1055.3846" y2="400.8139" stroke="var(--text)" stroke-width="1.9961" />
  <rect x="40" y="400.8139" width="230.7692" height="94.4186" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="155.3846" y="464.8837" text-anchor="middle" font-size="21.4742" font-family="Arial, sans-serif" fill="var(--ok-text)">ksh (1983)</text>
  <rect x="316.9231" y="400.8139" width="230.7692" height="94.4186" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="432.3077" y="464.8837" text-anchor="middle" font-size="21.4742" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">bash (1989)</text>
  <rect x="616.9231" y="400.8139" width="230.7692" height="94.4186" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="732.3077" y="464.8837" text-anchor="middle" font-size="21.4742" font-family="Arial, sans-serif" fill="var(--ok-text)">zsh (1990)</text>
  <rect x="940" y="400.8139" width="230.7692" height="94.4186" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1055.3846" y="464.8837" text-anchor="middle" font-size="21.4742" font-family="Arial, sans-serif" fill="var(--info-text)">tcsh</text>
  <rect x="86.1539" y="535.6977" width="1153.8461" height="84.3023" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="663.0769" y="593.0232" text-anchor="middle" font-size="21.4742" font-family="Arial, sans-serif" fill="var(--danger-text)">Default shell set in /etc/passwd  |  Change with: chsh -s /bin/zsh</text>
</svg>
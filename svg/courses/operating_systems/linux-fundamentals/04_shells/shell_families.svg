<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="598.8304" y="60.6316" text-anchor="middle" font-size="23.9532" font-weight="bold">Shell Family Tree</text>
  <rect x="449.1228" y="84.2105" width="299.4152" height="101.0526" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="598.8304" y="151.5789" text-anchor="middle" font-size="19.961">Thompson Shell (1971)</text>
  <line x1="479.0643" y1="185.2632" x2="259.4931" y2="252.6316" stroke="var(--text)" stroke-width="1.9961" />
  <line x1="718.5965" y1="185.2632" x2="938.1677" y2="252.6316" stroke="var(--text)" stroke-width="1.9961" />
  <rect x="99.8051" y="252.6316" width="319.3762" height="101.0526" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="259.4931" y="320" text-anchor="middle" font-size="19.961" font-weight="bold">Bourne sh (1977)</text>
  <rect x="778.4795" y="252.6316" width="319.3762" height="101.0526" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="938.1677" y="320" text-anchor="middle" font-size="19.961" font-weight="bold">C Shell csh (1978)</text>
  <line x1="159.6881" y1="353.6842" x2="159.6881" y2="421.0526" stroke="var(--text)" stroke-width="1.9961" />
  <line x1="259.4931" y1="353.6842" x2="399.2203" y2="421.0526" stroke="var(--text)" stroke-width="1.9961" />
  <line x1="359.2982" y1="353.6842" x2="658.7135" y2="421.0526" stroke="var(--text)" stroke-width="1.9961" />
  <line x1="938.1677" y1="353.6842" x2="938.1677" y2="421.0526" stroke="var(--text)" stroke-width="1.9961" />
  <rect x="59.883" y="421.0526" width="199.6101" height="94.3158" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="159.6881" y="485.0526" text-anchor="middle" font-size="19.961">ksh (1983)</text>
  <rect x="299.4152" y="421.0526" width="199.6101" height="94.3158" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="399.2203" y="485.0526" text-anchor="middle" font-size="19.961" font-weight="bold">bash (1989)</text>
  <rect x="558.9084" y="421.0526" width="199.6101" height="94.3158" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="658.7135" y="485.0526" text-anchor="middle" font-size="19.961">zsh (1990)</text>
  <rect x="838.3626" y="421.0526" width="199.6101" height="94.3158" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="938.1677" y="485.0526" text-anchor="middle" font-size="19.961">tcsh</text>
  <rect x="99.8051" y="555.7895" width="998.0507" height="84.2105" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="598.8304" y="613.0526" text-anchor="middle" font-size="19.961">Default shell set in /etc/passwd  |  Change with: chsh -s /bin/zsh</text>
</svg>
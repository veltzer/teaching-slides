<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="663.0769" y="40" text-anchor="middle" font-size="25.769" font-weight="bold">Shell Family Tree</text>
  <rect x="490" y="63.6046" width="346.1538" height="101.1628" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="663.0769" y="131.0464" text-anchor="middle" font-size="21.4742">Thompson Shell (1971)</text>
  <line x1="524.6154" y1="164.7675" x2="270.7692" y2="232.2093" stroke="var(--text)" stroke-width="1.9961" />
  <line x1="801.5385" y1="164.7675" x2="1055.3846" y2="232.2093" stroke="var(--text)" stroke-width="1.9961" />
  <rect x="86.1539" y="232.2093" width="369.2307" height="101.1628" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="270.7692" y="299.6512" text-anchor="middle" font-size="21.4742" font-weight="bold">Bourne sh (1977)</text>
  <rect x="870.7692" y="232.2093" width="369.2307" height="101.1628" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1055.3846" y="299.6512" text-anchor="middle" font-size="21.4742" font-weight="bold">C Shell csh (1978)</text>
  <line x1="155.3846" y1="333.3721" x2="155.3846" y2="400.8139" stroke="var(--text)" stroke-width="1.9961" />
  <line x1="270.7692" y1="333.3721" x2="432.3077" y2="400.8139" stroke="var(--text)" stroke-width="1.9961" />
  <line x1="386.1538" y1="333.3721" x2="732.3077" y2="400.8139" stroke="var(--text)" stroke-width="1.9961" />
  <line x1="1055.3846" y1="333.3721" x2="1055.3846" y2="400.8139" stroke="var(--text)" stroke-width="1.9961" />
  <rect x="40" y="400.8139" width="230.7692" height="94.4186" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="155.3846" y="464.8837" text-anchor="middle" font-size="21.4742">ksh (1983)</text>
  <rect x="316.9231" y="400.8139" width="230.7692" height="94.4186" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="432.3077" y="464.8837" text-anchor="middle" font-size="21.4742" font-weight="bold">bash (1989)</text>
  <rect x="616.9231" y="400.8139" width="230.7692" height="94.4186" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="732.3077" y="464.8837" text-anchor="middle" font-size="21.4742">zsh (1990)</text>
  <rect x="940" y="400.8139" width="230.7692" height="94.4186" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1055.3846" y="464.8837" text-anchor="middle" font-size="21.4742">tcsh</text>
  <rect x="86.1539" y="535.6977" width="1153.8461" height="84.3023" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="663.0769" y="593.0232" text-anchor="middle" font-size="21.4742">Default shell set in /etc/passwd  |  Change with: chsh -s /bin/zsh</text>
</svg>
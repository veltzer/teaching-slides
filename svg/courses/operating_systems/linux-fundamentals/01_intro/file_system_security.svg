<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:rect x="102.5025" y="34.5946" width="1025.0251" height="190.2703" fill="#fff3e0" stroke="#333" stroke-width="4.1001" rx="10.2503" />
  <ns0:text x="615.015" y="103.7838" text-anchor="middle" font-size="22.5506" font-weight="bold">Permission Check Flow</ns0:text>
  <ns0:text x="615.015" y="172.973" text-anchor="middle" font-size="20.5005">-rwxr-xr-- 1 alice devs 4096 file.txt</ns0:text>
  <ns0:rect x="123.003" y="276.7568" width="266.5065" height="138.3784" fill="#e3f2fd" stroke="#333" stroke-width="2.05" rx="6.1502" />
  <ns0:text x="256.2563" y="328.6486" text-anchor="middle" font-size="20.5005">Owner: alice</ns0:text>
  <ns0:text x="256.2563" y="380.5405" text-anchor="middle" font-size="20.5005" fill="#666">rwx (7)</ns0:text>
  <ns0:rect x="481.7617" y="276.7568" width="266.5065" height="138.3784" fill="#f3e5f5" stroke="#333" stroke-width="2.05" rx="6.1502" />
  <ns0:text x="615.015" y="328.6486" text-anchor="middle" font-size="20.5005">Group: devs</ns0:text>
  <ns0:text x="615.015" y="380.5405" text-anchor="middle" font-size="20.5005" fill="#666">r-x (5)</ns0:text>
  <ns0:rect x="840.5206" y="276.7568" width="266.5065" height="138.3784" fill="#e8f5e9" stroke="#333" stroke-width="2.05" rx="6.1502" />
  <ns0:text x="973.7737" y="328.6486" text-anchor="middle" font-size="20.5005">Others</ns0:text>
  <ns0:text x="973.7737" y="380.5405" text-anchor="middle" font-size="20.5005" fill="#666">r-- (4)</ns0:text>
  <ns0:rect x="205.005" y="484.3243" width="820.02" height="155.6757" fill="#ffebee" stroke="#333" stroke-width="4.1001" rx="10.2503" />
  <ns0:text x="615.015" y="546.5946" text-anchor="middle" font-size="20.5005">chmod 754 file.txt   |   chown alice:devs file.txt</ns0:text>
  <ns0:text x="615.015" y="605.4054" text-anchor="middle" font-size="20.5005" fill="#666">Numeric (octal) mode   |   Change owner and group</ns0:text>
</ns0:svg>
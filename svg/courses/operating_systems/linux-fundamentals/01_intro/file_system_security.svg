<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="106.6667" y="36" width="1066.6667" height="198" fill="#fff3e0" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="108" text-anchor="middle" font-size="23.4667" font-weight="bold">Permission Check Flow</text>
  <text x="640" y="180" text-anchor="middle" font-size="21.3333">-rwxr-xr-- 1 alice devs 4096 file.txt</text>
  <rect x="128" y="288" width="277.3333" height="144" fill="#e3f2fd" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="266.6667" y="342" text-anchor="middle" font-size="21.3333">Owner: alice</text>
  <text x="266.6667" y="396" text-anchor="middle" font-size="21.3333" fill="#666">rwx (7)</text>
  <rect x="501.3333" y="288" width="277.3333" height="144" fill="#f3e5f5" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="640" y="342" text-anchor="middle" font-size="21.3333">Group: devs</text>
  <text x="640" y="396" text-anchor="middle" font-size="21.3333" fill="#666">r-x (5)</text>
  <rect x="874.6667" y="288" width="277.3333" height="144" fill="#e8f5e9" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="1013.3333" y="342" text-anchor="middle" font-size="21.3333">Others</text>
  <text x="1013.3333" y="396" text-anchor="middle" font-size="21.3333" fill="#666">r-- (4)</text>
  <rect x="213.3333" y="504" width="853.3333" height="162" fill="#ffebee" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="568.8" text-anchor="middle" font-size="21.3333">chmod 754 file.txt   |   chown alice:devs file.txt</text>
  <text x="640" y="630" text-anchor="middle" font-size="21.3333" fill="#666">Numeric (octal) mode   |   Change owner and group</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="563.077" y="40" width="246.154" height="71.5069" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="686.154" y="71.7808" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6779" font-weight="bold" fill="var(--primary-text)">UNIX</text>
  <text x="686.154" y="95.6164" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8982" fill="var(--primary-text)">AT&amp;T Bell Labs, 1969</text>
  <line x1="624.6155" y1="111.5068" x2="332.3077" y2="175.0685" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="209.2309" y="175.0685" width="246.154" height="71.5069" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="332.3077" y="206.8493" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6779" font-weight="bold" fill="var(--primary-text)">BSD</text>
  <text x="332.3077" y="230.6849" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8982" fill="var(--primary-text)">UC Berkeley, 1977</text>
  <line x1="747.6923" y1="111.5068" x2="1040.0001" y2="175.0685" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="916.9232" y="175.0685" width="246.154" height="71.5069" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1040.0001" y="206.8493" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6779" font-weight="bold" fill="var(--primary-text)">System V</text>
  <text x="1040.0001" y="230.6849" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8982" fill="var(--primary-text)">AT&amp;T, 1983</text>
  <line x1="270.7694" y1="246.5753" x2="147.6924" y2="318.0821" stroke="var(--text-muted)" stroke-width="1.9701" marker-end="url(#arrow)"/>
  <rect x="40" y="318.0821" width="215.3847" height="63.5616" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="147.6924" y="357.8082" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.2879" fill="var(--primary-text)">FreeBSD</text>
  <line x1="332.3077" y1="246.5753" x2="332.3077" y2="318.0821" stroke="var(--text-muted)" stroke-width="1.9701" marker-end="url(#arrow)"/>
  <rect x="224.6155" y="318.0821" width="215.3847" height="63.5616" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="332.3077" y="357.8082" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.2879" fill="var(--primary-text)">OpenBSD</text>
  <line x1="393.8461" y1="246.5753" x2="516.9231" y2="318.0821" stroke="var(--text-muted)" stroke-width="1.9701" marker-end="url(#arrow)"/>
  <rect x="409.2308" y="318.0821" width="215.3847" height="63.5616" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="516.9231" y="357.8082" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.2879" fill="var(--primary-text)">macOS / Darwin</text>
  <line x1="978.4616" y1="246.5753" x2="855.3847" y2="318.0821" stroke="var(--text-muted)" stroke-width="1.9701" marker-end="url(#arrow)"/>
  <rect x="747.6923" y="318.0821" width="215.3847" height="63.5616" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="855.3847" y="357.8082" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.2879" fill="var(--primary-text)">Solaris</text>
  <line x1="1101.5385" y1="246.5753" x2="1132.3077" y2="318.0821" stroke="var(--text-muted)" stroke-width="1.9701" marker-end="url(#arrow)"/>
  <rect x="1024.6153" y="318.0821" width="215.3847" height="63.5616" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1132.3077" y="357.8082" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.2879" fill="var(--primary-text)">AIX / HP-UX</text>
  <line x1="686.154" y1="111.5068" x2="686.154" y2="318.0821" stroke="var(--text-muted)" stroke-width="1.9701" marker-end="url(#arrow)"/>
  <rect x="578.4616" y="318.0821" width="215.3847" height="63.5616" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="686.154" y="357.8082" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.2879" fill="var(--warn-text)">MINIX (1987)</text>
  <line x1="686.154" y1="381.6439" x2="686.154" y2="453.1506" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="547.6924" y="453.1506" width="276.9231" height="79.4521" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="686.154" y="488.1096" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.0677" font-weight="bold" fill="var(--ok-accent)">Linux</text>
  <text x="686.154" y="516.7124" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8982" fill="var(--ok-text)">Linus Torvalds, 1991</text>
  <line x1="624.6155" y1="532.6027" x2="332.3077" y2="588.2191" stroke="var(--text-muted)" stroke-width="1.9701" marker-end="url(#arrow)"/>
  <text x="332.3077" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8982" fill="var(--text-faint)">Debian / Ubuntu</text>
  <line x1="686.154" y1="532.6027" x2="686.154" y2="588.2191" stroke="var(--text-muted)" stroke-width="1.9701" marker-end="url(#arrow)"/>
  <text x="686.154" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8982" fill="var(--text-faint)">Red Hat / Fedora</text>
  <line x1="747.6923" y1="532.6027" x2="1040.0001" y2="588.2191" stroke="var(--text-muted)" stroke-width="1.9701" marker-end="url(#arrow)"/>
  <text x="1040.0001" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8982" fill="var(--text-faint)">Android</text>
</svg>

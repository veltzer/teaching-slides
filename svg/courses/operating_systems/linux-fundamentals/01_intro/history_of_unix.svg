<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.9778,0" fill="#666" />
    </marker>
  </defs>
  <rect x="459.7082" y="33.2468" width="210.1524" height="74.8052" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="564.7844" y="66.4935" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.7615" font-weight="bold">UNIX</text>
  <text x="564.7844" y="91.4286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.1345">AT&amp;T Bell Labs, 1969</text>
  <line x1="512.2463" y1="108.0519" x2="262.6904" y2="174.5455" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="157.6143" y="174.5455" width="210.1524" height="74.8052" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="262.6904" y="207.7922" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.7615" font-weight="bold">BSD</text>
  <text x="262.6904" y="232.7273" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.1345">UC Berkeley, 1977</text>
  <line x1="617.3224" y1="108.0519" x2="866.8783" y2="174.5455" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="761.8022" y="174.5455" width="210.1524" height="74.8052" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="866.8783" y="207.7922" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.7615" font-weight="bold">System V</text>
  <text x="866.8783" y="232.7273" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.1345">AT&amp;T, 1983</text>
  <line x1="210.1524" y1="249.3506" x2="105.0762" y2="324.1558" stroke="var(--text-muted)" stroke-width="1.9701" marker-end="url(#arrow)" />
  <rect x="13.1345" y="324.1558" width="183.8833" height="66.4935" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="105.0762" y="365.7143" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.4479">FreeBSD</text>
  <line x1="262.6904" y1="249.3506" x2="262.6904" y2="324.1558" stroke="var(--text-muted)" stroke-width="1.9701" marker-end="url(#arrow)" />
  <rect x="170.7488" y="324.1558" width="183.8833" height="66.4935" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="262.6904" y="365.7143" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.4479">OpenBSD</text>
  <line x1="315.2284" y1="249.3506" x2="420.3046" y2="324.1558" stroke="var(--text-muted)" stroke-width="1.9701" marker-end="url(#arrow)" />
  <rect x="328.363" y="324.1558" width="183.8833" height="66.4935" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="420.3046" y="365.7143" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.4479">macOS / Darwin</text>
  <line x1="814.3402" y1="249.3506" x2="709.2641" y2="324.1558" stroke="var(--text-muted)" stroke-width="1.9701" marker-end="url(#arrow)" />
  <rect x="617.3224" y="324.1558" width="183.8833" height="66.4935" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="709.2641" y="365.7143" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.4479">Solaris</text>
  <line x1="919.4164" y1="249.3506" x2="945.6854" y2="324.1558" stroke="var(--text-muted)" stroke-width="1.9701" marker-end="url(#arrow)" />
  <rect x="853.7437" y="324.1558" width="183.8833" height="66.4935" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="945.6854" y="365.7143" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.4479">AIX / HP-UX</text>
  <line x1="564.7844" y1="108.0519" x2="564.7844" y2="324.1558" stroke="var(--text-muted)" stroke-width="1.9701" marker-end="url(#arrow)" />
  <rect x="472.8427" y="324.1558" width="183.8833" height="66.4935" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="564.7844" y="365.7143" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.4479">MINIX (1987)</text>
  <line x1="564.7844" y1="390.6494" x2="564.7844" y2="465.4545" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="446.5737" y="465.4545" width="236.4214" height="83.1169" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="564.7844" y="502.026" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.0749" font-weight="bold" fill="var(--ok-accent)">Linux</text>
  <text x="564.7844" y="531.9481" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.1345">Linus Torvalds, 1991</text>
  <line x1="512.2463" y1="548.5714" x2="262.6904" y2="606.7532" stroke="var(--text-muted)" stroke-width="1.9701" marker-end="url(#arrow)" />
  <text x="262.6904" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.1345" fill="var(--text-faint)">Debian / Ubuntu</text>
  <line x1="564.7844" y1="548.5714" x2="564.7844" y2="606.7532" stroke="var(--text-muted)" stroke-width="1.9701" marker-end="url(#arrow)" />
  <text x="564.7844" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.1345" fill="var(--text-faint)">Red Hat / Fedora</text>
  <line x1="617.3224" y1="548.5714" x2="866.8783" y2="606.7532" stroke="var(--text-muted)" stroke-width="1.9701" marker-end="url(#arrow)" />
  <text x="866.8783" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.1345" fill="var(--text-faint)">Android</text>
</svg>
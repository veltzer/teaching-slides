<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.9778,0" fill="#666" />
    </marker>
  </defs>
  <rect x="563.077" y="40" width="246.154" height="71.5069" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="686.154" y="71.7808" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6779" font-weight="bold">UNIX</text>
  <text x="686.154" y="95.6164" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8982">AT&amp;T Bell Labs, 1969</text>
  <line x1="624.6155" y1="111.5068" x2="332.3077" y2="175.0685" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="209.2309" y="175.0685" width="246.154" height="71.5069" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="332.3077" y="206.8493" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6779" font-weight="bold">BSD</text>
  <text x="332.3077" y="230.6849" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8982">UC Berkeley, 1977</text>
  <line x1="747.6923" y1="111.5068" x2="1040.0001" y2="175.0685" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="916.9232" y="175.0685" width="246.154" height="71.5069" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1040.0001" y="206.8493" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6779" font-weight="bold">System V</text>
  <text x="1040.0001" y="230.6849" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8982">AT&amp;T, 1983</text>
  <line x1="270.7694" y1="246.5753" x2="147.6924" y2="318.0821" stroke="var(--text-muted)" stroke-width="1.9701" marker-end="url(#arrow)" />
  <rect x="40" y="318.0821" width="215.3847" height="63.5616" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="147.6924" y="357.8082" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.2879">FreeBSD</text>
  <line x1="332.3077" y1="246.5753" x2="332.3077" y2="318.0821" stroke="var(--text-muted)" stroke-width="1.9701" marker-end="url(#arrow)" />
  <rect x="224.6155" y="318.0821" width="215.3847" height="63.5616" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="332.3077" y="357.8082" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.2879">OpenBSD</text>
  <line x1="393.8461" y1="246.5753" x2="516.9231" y2="318.0821" stroke="var(--text-muted)" stroke-width="1.9701" marker-end="url(#arrow)" />
  <rect x="409.2308" y="318.0821" width="215.3847" height="63.5616" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="516.9231" y="357.8082" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.2879">macOS / Darwin</text>
  <line x1="978.4616" y1="246.5753" x2="855.3847" y2="318.0821" stroke="var(--text-muted)" stroke-width="1.9701" marker-end="url(#arrow)" />
  <rect x="747.6923" y="318.0821" width="215.3847" height="63.5616" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="855.3847" y="357.8082" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.2879">Solaris</text>
  <line x1="1101.5385" y1="246.5753" x2="1132.3077" y2="318.0821" stroke="var(--text-muted)" stroke-width="1.9701" marker-end="url(#arrow)" />
  <rect x="1024.6153" y="318.0821" width="215.3847" height="63.5616" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1132.3077" y="357.8082" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.2879">AIX / HP-UX</text>
  <line x1="686.154" y1="111.5068" x2="686.154" y2="318.0821" stroke="var(--text-muted)" stroke-width="1.9701" marker-end="url(#arrow)" />
  <rect x="578.4616" y="318.0821" width="215.3847" height="63.5616" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="686.154" y="357.8082" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.2879">MINIX (1987)</text>
  <line x1="686.154" y1="381.6439" x2="686.154" y2="453.1506" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="547.6924" y="453.1506" width="276.9231" height="79.4521" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="686.154" y="488.1096" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.0677" font-weight="bold" fill="var(--ok-accent)">Linux</text>
  <text x="686.154" y="516.7124" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8982">Linus Torvalds, 1991</text>
  <line x1="624.6155" y1="532.6027" x2="332.3077" y2="588.2191" stroke="var(--text-muted)" stroke-width="1.9701" marker-end="url(#arrow)" />
  <text x="332.3077" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8982" fill="var(--text-faint)">Debian / Ubuntu</text>
  <line x1="686.154" y1="532.6027" x2="686.154" y2="588.2191" stroke="var(--text-muted)" stroke-width="1.9701" marker-end="url(#arrow)" />
  <text x="686.154" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8982" fill="var(--text-faint)">Red Hat / Fedora</text>
  <line x1="747.6923" y1="532.6027" x2="1040.0001" y2="588.2191" stroke="var(--text-muted)" stroke-width="1.9701" marker-end="url(#arrow)" />
  <text x="1040.0001" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8982" fill="var(--text-faint)">Android</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,21.8182 4.9778,0" fill="#666" />
    </marker>
  </defs>
  <rect x="41.7186" y="234.6667" width="166.8741" height="106.6667" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="125.1556" y="298.6666" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6874" font-weight="bold">Created</text>
  <text x="125.1556" y="384.0001" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.9062" fill="var(--text-faint)">fork()</text>
  <line x1="208.5926" y1="288.0001" x2="292.0297" y2="288.0001" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="305.9358" y="234.6667" width="166.8741" height="106.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="389.3729" y="298.6666" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6874" font-weight="bold">Ready</text>
  <line x1="472.81" y1="266.6667" x2="584.0593" y2="266.6667" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="528.4346" y="249.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.9062" fill="var(--text-faint)">scheduled</text>
  <rect x="597.9655" y="234.6667" width="166.8741" height="106.6667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="681.4025" y="298.6666" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6874" font-weight="bold">Running</text>
  <line x1="681.4025" y1="341.3334" x2="681.4025" y2="416" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="681.4025" y1="416" x2="389.3729" y2="416" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="389.3729" y1="416" x2="389.3729" y2="352" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="535.3877" y="448" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.9062" fill="var(--text-faint)">preempted</text>
  <line x1="764.8395" y1="288.0001" x2="848.2767" y2="288.0001" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="806.5581" y="270.9333" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.9062" fill="var(--text-faint)">I/O wait</text>
  <rect x="862.1828" y="234.6667" width="166.8741" height="106.6667" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="945.6198" y="298.6666" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6874" font-weight="bold">Blocked</text>
  <line x1="945.6198" y1="234.6667" x2="945.6198" y2="128" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="945.6198" y1="128" x2="389.3729" y2="128" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="389.3729" y1="128" x2="389.3729" y2="224" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="667.4964" y="110.9333" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.9062" fill="var(--text-faint)">I/O complete</text>
  <line x1="681.4025" y1="341.3334" x2="681.4025" y2="522.6668" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="709.2148" y="490.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.9062" fill="var(--text-faint)">exit()</text>
  <rect x="597.9655" y="533.3333" width="166.8741" height="106.6667" rx="6" fill="var(--border)" stroke="var(--text-muted)" stroke-width="2.7812" />
  <text x="681.4025" y="597.3334" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6874" font-weight="bold">Zombie</text>
  <line x1="764.8395" y1="586.6667" x2="848.2767" y2="586.6667" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="806.5581" y="569.6001" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.9062" fill="var(--text-faint)">wait()</text>
  <rect x="862.1828" y="533.3333" width="166.8741" height="106.6667" rx="6" fill="var(--border)" stroke="var(--text-muted)" stroke-width="2.7812" />
  <text x="945.6198" y="597.3334" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6874" font-weight="bold">Terminated</text>
</svg>
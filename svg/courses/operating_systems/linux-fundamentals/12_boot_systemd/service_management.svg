<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="471.5115" y="34.5946" width="287.007" height="121.0811" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="615.015" y="114.1622" text-anchor="middle" font-size="22.5506" font-weight="bold">Active (running)</text>
  <rect x="61.5015" y="276.7568" width="205.005" height="121.0811" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="164.004" y="356.3243" text-anchor="middle" font-size="20.5005" font-weight="bold">Inactive</text>
  <rect x="963.5236" y="276.7568" width="205.005" height="121.0811" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="1066.026" y="356.3243" text-anchor="middle" font-size="20.5005" font-weight="bold">Failed</text>
  <rect x="471.5115" y="276.7568" width="287.007" height="121.0811" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="615.015" y="356.3243" text-anchor="middle" font-size="20.5005" font-weight="bold">Reloading</text>
  <line x1="266.5065" y1="335.5676" x2="471.5115" y2="103.7838" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowd4_11_boot_systemd)" />
  <text x="317.7578" y="190.2703" text-anchor="middle" font-size="20.5005" fill="var(--ok-accent)">start</text>
  <line x1="471.5115" y1="103.7838" x2="266.5065" y2="335.5676" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="8.2002 6.1502" marker-end="url(#arrowd4_11_boot_systemd)" />
  <text x="420.2602" y="259.4595" text-anchor="middle" font-size="20.5005" fill="var(--danger-accent)">stop</text>
  <line x1="758.5185" y1="93.4054" x2="963.5236" y2="311.3514" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="8.2002 6.1502" />
  <text x="912.2722" y="190.2703" text-anchor="middle" font-size="20.5005" fill="var(--danger-accent)">error</text>
  <line x1="615.015" y1="155.6757" x2="615.015" y2="276.7568" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd4_11_boot_systemd)" />
  <text x="676.5165" y="224.8649" text-anchor="middle" font-size="20.5005">reload</text>
  <rect x="307.5075" y="501.6216" width="615.015" height="138.3784" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="615.015" y="560.4324" text-anchor="middle" font-size="20.5005" font-weight="bold">restart = stop + start</text>
  <text x="615.015" y="615.7838" text-anchor="middle" font-size="20.5005">journalctl -u service = view logs</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd4_11_boot_systemd" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
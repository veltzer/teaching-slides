<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="447.5471" y="40" width="452.8301" height="132.5715" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="673.9622" y="122.8572" text-anchor="middle" font-size="25.305" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">systemd (PID 1)</text>
  <rect x="40" y="272" width="249.0566" height="149.1429" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="164.5283" y="331.6571" text-anchor="middle" font-size="21.0875" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">systemctl</text>
  <text x="164.5283" y="384.6857" text-anchor="middle" font-size="21.0875" font-family="Arial, sans-serif" fill="var(--primary-text)">Service mgmt</text>
  <rect x="323.0188" y="272" width="249.0566" height="149.1429" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="447.5471" y="331.6571" text-anchor="middle" font-size="21.0875" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">journald</text>
  <text x="447.5471" y="384.6857" text-anchor="middle" font-size="21.0875" font-family="Arial, sans-serif" fill="var(--info-text)">Logging</text>
  <rect x="606.0377" y="272" width="249.0566" height="149.1429" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="730.5659" y="331.6571" text-anchor="middle" font-size="21.0875" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">cgroups</text>
  <text x="730.5659" y="384.6857" text-anchor="middle" font-size="21.0875" font-family="Arial, sans-serif" fill="var(--warn-text)">Resource ctrl</text>
  <rect x="889.0566" y="272" width="249.0566" height="149.1429" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1013.5848" y="331.6571" text-anchor="middle" font-size="21.0875" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">socket act.</text>
  <text x="1013.5848" y="384.6857" text-anchor="middle" font-size="21.0875" font-family="Arial, sans-serif" fill="var(--danger-text)">On-demand</text>
  <line x1="447.5471" y1="172.5715" x2="164.5283" y2="272" stroke="var(--text)" stroke-width="2"/>
  <line x1="560.7547" y1="172.5715" x2="447.5471" y2="272" stroke="var(--text)" stroke-width="2"/>
  <line x1="787.1697" y1="172.5715" x2="730.5659" y2="272" stroke="var(--text)" stroke-width="2"/>
  <line x1="900.3773" y1="172.5715" x2="1013.5848" y2="272" stroke="var(--text)" stroke-width="2"/>
  <rect x="107.9245" y="504" width="1132.0755" height="116" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="673.9622" y="576.9143" text-anchor="middle" font-size="21.0875" font-family="Arial, sans-serif" fill="var(--ok-text)">Parallel startup | Dependency resolution | Declarative config</text>
</svg>

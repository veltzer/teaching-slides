<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="364.2857" height="272.9412" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="222.1428" y="108.2353" text-anchor="middle" font-size="22.8959" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">[Unit]</text>
  <text x="222.1428" y="169.6471" text-anchor="middle" font-size="20.8144" font-family="Arial, sans-serif" fill="var(--primary-text)">Description=</text>
  <text x="222.1428" y="217.4117" text-anchor="middle" font-size="20.8144" font-family="Arial, sans-serif" fill="var(--primary-text)">After=network.target</text>
  <text x="222.1428" y="265.1764" text-anchor="middle" font-size="20.8144" font-family="Arial, sans-serif" fill="var(--primary-text)">Requires= / Wants=</text>
  <rect x="457.8571" y="40" width="364.2857" height="272.9412" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6"/>
  <text x="640" y="108.2353" text-anchor="middle" font-size="22.8959" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">[Service]</text>
  <text x="640" y="169.6471" text-anchor="middle" font-size="20.8144" font-family="Arial, sans-serif" fill="var(--info-text)">Type=simple|forking</text>
  <text x="640" y="217.4117" text-anchor="middle" font-size="20.8144" font-family="Arial, sans-serif" fill="var(--info-text)">ExecStart=/usr/bin/app</text>
  <text x="640" y="265.1764" text-anchor="middle" font-size="20.8144" font-family="Arial, sans-serif" fill="var(--info-text)">Restart=always</text>
  <rect x="875.7143" y="40" width="364.2857" height="272.9412" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="1057.8572" y="108.2353" text-anchor="middle" font-size="22.8959" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">[Install]</text>
  <text x="1057.8572" y="169.6471" text-anchor="middle" font-size="20.8144" font-family="Arial, sans-serif" fill="var(--ok-text)">WantedBy=</text>
  <text x="1057.8572" y="217.4117" text-anchor="middle" font-size="20.8144" font-family="Arial, sans-serif" fill="var(--ok-text)">multi-user.target</text>
  <text x="1057.8572" y="265.1764" text-anchor="middle" font-size="20.8144" font-family="Arial, sans-serif" fill="var(--ok-text)">(enable/disable)</text>
  <line x1="404.2856" y1="176.4706" x2="457.8571" y2="176.4706" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="822.1428" y1="176.4706" x2="875.7143" y2="176.4706" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="104.2856" y="398.2353" width="1071.4287" height="221.7647" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6"/>
  <text x="640" y="466.4706" text-anchor="middle" font-size="20.8144" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Service File: /etc/systemd/system/myservice.service</text>
  <text x="640" y="527.8823" text-anchor="middle" font-size="20.8144" font-family="Arial, sans-serif" fill="var(--warn-text)">[Unit] = metadata + dependencies | [Service] = how to run | [Install] = when to enable</text>
  <text x="640" y="579.0588" text-anchor="middle" font-size="20.8144" font-family="Arial, sans-serif" fill="var(--warn-text)">After editing: systemctl daemon-reload</text>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
</svg>

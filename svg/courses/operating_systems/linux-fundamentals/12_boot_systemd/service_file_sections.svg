  <ns0:rect x="105.3498" y="408.8889" width="1053.498" height="231.1111" fill="#fff3e0" stroke="#333" stroke-width="2.107" rx="10.535" />
  <ns0:text x="632.0988" y="480" text-anchor="middle" font-size="21.0699" font-weight="bold">Service File: /etc/systemd/system/myservice.service</ns0:text>
  <ns0:text x="632.0988" y="544" text-anchor="middle" font-size="21.0699">[Unit] = metadata + dependencies | [Service] = how to run | [Install] = when to enable</ns0:text>
  <ns0:text x="632.0988" y="597.3333" text-anchor="middle" font-size="21.0699">After editing: systemctl daemon-reload</ns0:text>

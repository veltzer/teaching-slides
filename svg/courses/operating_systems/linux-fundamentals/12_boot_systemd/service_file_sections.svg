  <ns0:text x="221.2346" y="106.6667" text-anchor="middle" font-size="23.177" font-weight="bold">[Unit]</ns0:text>
  <ns0:text x="221.2346" y="170.6667" text-anchor="middle" font-size="21.0699">Description=</ns0:text>
  <ns0:text x="221.2346" y="220.4444" text-anchor="middle" font-size="21.0699">After=network.target</ns0:text>
  <ns0:text x="221.2346" y="270.2222" text-anchor="middle" font-size="21.0699">Requires= / Wants=</ns0:text>
  <ns0:rect x="453.0041" y="35.5556" width="358.1893" height="284.4444" fill="#f3e5f5" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="632.0988" y="106.6667" text-anchor="middle" font-size="23.177" font-weight="bold">[Service]</ns0:text>
  <ns0:text x="632.0988" y="170.6667" text-anchor="middle" font-size="21.0699">Type=simple|forking</ns0:text>
  <ns0:text x="632.0988" y="220.4444" text-anchor="middle" font-size="21.0699">ExecStart=/usr/bin/app</ns0:text>
  <ns0:text x="632.0988" y="270.2222" text-anchor="middle" font-size="21.0699">Restart=always</ns0:text>
  <ns0:rect x="863.8683" y="35.5556" width="358.1893" height="284.4444" fill="#e8f5e9" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="1042.963" y="106.6667" text-anchor="middle" font-size="23.177" font-weight="bold">[Install]</ns0:text>
  <ns0:text x="1042.963" y="170.6667" text-anchor="middle" font-size="21.0699">WantedBy=</ns0:text>
  <ns0:text x="1042.963" y="220.4444" text-anchor="middle" font-size="21.0699">multi-user.target</ns0:text>
  <ns0:text x="1042.963" y="270.2222" text-anchor="middle" font-size="21.0699">(enable/disable)</ns0:text>
  <ns0:line x1="400.3292" y1="177.7778" x2="453.0041" y2="177.7778" stroke="#333" stroke-width="4.214" marker-end="url(#arrowd5_11_boot_systemd)" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="42.14" y="35.5556" width="358.1893" height="284.4444" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="221.2346" y="106.6667" text-anchor="middle" font-size="23.177" font-weight="bold">[Unit]</text>
  <text x="221.2346" y="170.6667" text-anchor="middle" font-size="21.0699">Description=</text>
  <text x="221.2346" y="220.4444" text-anchor="middle" font-size="21.0699">After=network.target</text>
  <text x="221.2346" y="270.2222" text-anchor="middle" font-size="21.0699">Requires= / Wants=</text>
  <rect x="453.0041" y="35.5556" width="358.1893" height="284.4444" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="632.0988" y="106.6667" text-anchor="middle" font-size="23.177" font-weight="bold">[Service]</text>
  <text x="632.0988" y="170.6667" text-anchor="middle" font-size="21.0699">Type=simple|forking</text>
  <text x="632.0988" y="220.4444" text-anchor="middle" font-size="21.0699">ExecStart=/usr/bin/app</text>
  <text x="632.0988" y="270.2222" text-anchor="middle" font-size="21.0699">Restart=always</text>
  <rect x="863.8683" y="35.5556" width="358.1893" height="284.4444" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1042.963" y="106.6667" text-anchor="middle" font-size="23.177" font-weight="bold">[Install]</text>
  <text x="1042.963" y="170.6667" text-anchor="middle" font-size="21.0699">WantedBy=</text>
  <text x="1042.963" y="220.4444" text-anchor="middle" font-size="21.0699">multi-user.target</text>
  <text x="1042.963" y="270.2222" text-anchor="middle" font-size="21.0699">(enable/disable)</text>
  <line x1="400.3292" y1="177.7778" x2="453.0041" y2="177.7778" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd5_11_boot_systemd)" />
  <line x1="811.1934" y1="177.7778" x2="863.8683" y2="177.7778" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd5_11_boot_systemd)" />
  <rect x="105.3498" y="408.8889" width="1053.498" height="231.1111" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="632.0988" y="480" text-anchor="middle" font-size="21.0699" font-weight="bold">Service File: /etc/systemd/system/myservice.service</text>
  <text x="632.0988" y="544" text-anchor="middle" font-size="21.0699">[Unit] = metadata + dependencies | [Service] = how to run | [Install] = when to enable</text>
  <text x="632.0988" y="597.3333" text-anchor="middle" font-size="21.0699">After editing: systemctl daemon-reload</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd5_11_boot_systemd" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
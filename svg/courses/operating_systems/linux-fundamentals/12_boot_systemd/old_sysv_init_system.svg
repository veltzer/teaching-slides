<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="181.1321" height="136.4706" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="130.566" y="101.4118" text-anchor="middle" font-size="21.3953" font-weight="bold">RL 0</text>
  <text x="130.566" y="149.1764" text-anchor="middle" font-size="21.3953">Halt</text>
  <rect x="243.7735" y="40" width="181.1321" height="136.4706" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="334.3395" y="101.4118" text-anchor="middle" font-size="21.3953" font-weight="bold">RL 1</text>
  <text x="334.3395" y="149.1764" text-anchor="middle" font-size="21.3953">Single User</text>
  <rect x="447.5471" y="40" width="181.1321" height="136.4706" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="538.1131" y="101.4118" text-anchor="middle" font-size="21.3953" font-weight="bold">RL 2</text>
  <text x="538.1131" y="149.1764" text-anchor="middle" font-size="21.3953">Multi (no net)</text>
  <rect x="651.3206" y="40" width="181.1321" height="136.4706" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="741.8866" y="101.4118" text-anchor="middle" font-size="21.3953" font-weight="bold">RL 3</text>
  <text x="741.8866" y="149.1764" text-anchor="middle" font-size="21.3953">Multi-user</text>
  <rect x="855.0943" y="40" width="181.1321" height="136.4706" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="945.6603" y="101.4118" text-anchor="middle" font-size="21.3953" font-weight="bold">RL 5</text>
  <text x="945.6603" y="149.1764" text-anchor="middle" font-size="21.3953">Graphical</text>
  <rect x="1058.8678" y="40" width="181.1321" height="136.4706" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="1149.4338" y="101.4118" text-anchor="middle" font-size="21.3953" font-weight="bold">RL 6</text>
  <text x="1149.4338" y="149.1764" text-anchor="middle" font-size="21.3953">Reboot</text>
  <rect x="40" y="244.7059" width="1200" height="153.5294" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="639.9998" y="306.1176" text-anchor="middle" font-size="23.535" font-weight="bold">SysV Init: /etc/init.d/ + /etc/rc{N}.d/</text>
  <text x="639.9998" y="364.1176" text-anchor="middle" font-size="21.3953">Sequential startup: S01script -&gt; S02script -&gt; S03script...</text>
  <rect x="40" y="449.4117" width="566.0376" height="170.5883" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="323.0188" y="517.647" text-anchor="middle" font-size="21.3953" font-weight="bold">SysV (Legacy)</text>
  <text x="323.0188" y="579.0588" text-anchor="middle" font-size="21.3953">Sequential, slow boot</text>
  <rect x="673.9622" y="449.4117" width="566.0376" height="170.5883" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="956.981" y="517.647" text-anchor="middle" font-size="21.3953" font-weight="bold">systemd (Modern)</text>
  <text x="956.981" y="579.0588" text-anchor="middle" font-size="21.3953">Parallel, dependency-based</text>
  <line x1="606.0376" y1="534.7059" x2="673.9622" y2="534.7059" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd1_11_boot_systemd)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd1_11_boot_systemd" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
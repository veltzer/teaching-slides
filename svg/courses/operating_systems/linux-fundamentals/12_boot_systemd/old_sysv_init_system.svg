<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="181.1321" height="136.4706" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="130.566" y="101.4118" text-anchor="middle" font-size="21.3953" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">RL 0</text>
  <text x="130.566" y="149.1764" text-anchor="middle" font-size="21.3953" font-family="Arial, sans-serif" fill="var(--danger-text)">Halt</text>
  <rect x="243.7735" y="40" width="181.1321" height="136.4706" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="334.3395" y="101.4118" text-anchor="middle" font-size="21.3953" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">RL 1</text>
  <text x="334.3395" y="149.1764" text-anchor="middle" font-size="21.3953" font-family="Arial, sans-serif" fill="var(--warn-text)">Single User</text>
  <rect x="447.5471" y="40" width="181.1321" height="136.4706" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="538.1131" y="101.4118" text-anchor="middle" font-size="21.3953" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">RL 2</text>
  <text x="538.1131" y="149.1764" text-anchor="middle" font-size="21.3953" font-family="Arial, sans-serif" fill="var(--primary-text)">Multi (no net)</text>
  <rect x="651.3206" y="40" width="181.1321" height="136.4706" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="741.8866" y="101.4118" text-anchor="middle" font-size="21.3953" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">RL 3</text>
  <text x="741.8866" y="149.1764" text-anchor="middle" font-size="21.3953" font-family="Arial, sans-serif" fill="var(--ok-text)">Multi-user</text>
  <rect x="855.0943" y="40" width="181.1321" height="136.4706" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="945.6603" y="101.4118" text-anchor="middle" font-size="21.3953" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">RL 5</text>
  <text x="945.6603" y="149.1764" text-anchor="middle" font-size="21.3953" font-family="Arial, sans-serif" fill="var(--info-text)">Graphical</text>
  <rect x="1058.8678" y="40" width="181.1321" height="136.4706" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1149.4338" y="101.4118" text-anchor="middle" font-size="21.3953" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">RL 6</text>
  <text x="1149.4338" y="149.1764" text-anchor="middle" font-size="21.3953" font-family="Arial, sans-serif" fill="var(--danger-text)">Reboot</text>
  <rect x="40" y="244.7059" width="1200" height="153.5294" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9998" y="306.1176" text-anchor="middle" font-size="23.535" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">SysV Init: /etc/init.d/ + /etc/rc{N}.d/</text>
  <text x="639.9998" y="364.1176" text-anchor="middle" font-size="21.3953" font-family="Arial, sans-serif" fill="var(--warn-text)">Sequential startup: S01script -&gt; S02script -&gt; S03script...</text>
  <rect x="40" y="449.4117" width="566.0376" height="170.5883" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="323.0188" y="517.647" text-anchor="middle" font-size="21.3953" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">SysV (Legacy)</text>
  <text x="323.0188" y="579.0588" text-anchor="middle" font-size="21.3953" font-family="Arial, sans-serif" fill="var(--danger-text)">Sequential, slow boot</text>
  <rect x="673.9622" y="449.4117" width="566.0376" height="170.5883" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="956.981" y="517.647" text-anchor="middle" font-size="21.3953" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">systemd (Modern)</text>
  <text x="956.981" y="579.0588" text-anchor="middle" font-size="21.3953" font-family="Arial, sans-serif" fill="var(--ok-text)">Parallel, dependency-based</text>
  <line x1="606.0376" y1="534.7059" x2="673.9622" y2="534.7059" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.579135622711" font-weight="bold" fill="var(--primary-accent)">Linux Boot Process</text>

  <!-- Seven stages in a row -->
  <rect x="40" y="87.027027027027" width="168" height="146.306306306306" rx="10.222744470273" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="124" y="128.828828828829" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.356391152437" font-weight="bold" fill="var(--primary-text)">BIOS/UEFI</text>
  <text x="124" y="165.405405405405" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--primary-text)">POST</text>
  <text x="124" y="191.531531531532" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--primary-text)">hw init</text>
  <text x="124" y="217.657657657658" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--primary-text)">find disk</text>

  <rect x="218" y="87.027027027027" width="168" height="146.306306306306" rx="10.222744470273" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="302" y="128.828828828829" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.356391152437" font-weight="bold" fill="var(--ok-text)">GRUB2</text>
  <text x="302" y="165.405405405405" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--ok-text)">bootloader</text>
  <text x="302" y="191.531531531532" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--ok-text)">pick kernel</text>
  <text x="302" y="217.657657657658" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--ok-text)">load initrd</text>

  <rect x="396" y="87.027027027027" width="168" height="146.306306306306" rx="10.222744470273" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="128.828828828829" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.356391152437" font-weight="bold" fill="var(--warn-text)">Kernel</text>
  <text x="480" y="165.405405405405" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--warn-text)">decompress</text>
  <text x="480" y="191.531531531532" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--warn-text)">init CPU/mem</text>
  <text x="480" y="217.657657657658" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--warn-text)">mount VFS</text>

  <rect x="574" y="87.027027027027" width="168" height="146.306306306306" rx="10.222744470273" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="658" y="128.828828828829" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.356391152437" font-weight="bold" fill="var(--info-text)">initramfs</text>
  <text x="658" y="165.405405405405" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--info-text)">temp root</text>
  <text x="658" y="191.531531531532" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--info-text)">load drivers</text>
  <text x="658" y="217.657657657658" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--info-text)">mount real /</text>

  <rect x="752" y="87.027027027027" width="168" height="146.306306306306" rx="10.222744470273" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="836" y="128.828828828829" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.356391152437" font-weight="bold" fill="var(--danger-text)">systemd</text>
  <text x="836" y="165.405405405405" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--danger-text)">PID 1</text>
  <text x="836" y="191.531531531532" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--danger-text)">read units</text>
  <text x="836" y="217.657657657658" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--danger-text)">parallel start</text>

  <rect x="930" y="87.027027027027" width="150" height="146.306306306306" rx="10.222744470273" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1005" y="128.828828828829" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.356391152437" font-weight="bold" fill="var(--primary-text)">Targets</text>
  <text x="1005" y="165.405405405405" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--primary-text)">multi-user</text>
  <text x="1005" y="191.531531531532" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--primary-text)">graphical</text>

  <rect x="1090" y="87.027027027027" width="150" height="146.306306306306" rx="10.222744470273" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1165" y="128.828828828829" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.356391152437" font-weight="bold" fill="var(--ok-text)">Login</text>
  <text x="1165" y="165.405405405405" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--ok-text)">getty / GDM</text>
  <text x="1165" y="191.531531531532" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--ok-text)">PAM auth</text>

  <line x1="208" y1="160.18018018018" x2="218" y2="160.18018018018" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="386" y1="160.18018018018" x2="396" y2="160.18018018018" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="564" y1="160.18018018018" x2="574" y2="160.18018018018" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="742" y1="160.18018018018" x2="752" y2="160.18018018018" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="920" y1="160.18018018018" x2="930" y2="160.18018018018" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1080" y1="160.18018018018" x2="1090" y2="160.18018018018" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- systemctl commands -->
  <rect x="40" y="275.135135135135" width="600" height="344.864864864865" rx="10.222744470273" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="311.711711711712" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.400940046492" font-weight="bold" fill="var(--primary-text)">systemctl &amp; journalctl</text>
  <text x="60" y="353.513513513514" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--primary-text)">systemctl status sshd</text>
  <text x="60" y="384.864864864865" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--primary-text)">systemctl enable --now nginx</text>
  <text x="60" y="416.216216216216" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--primary-text)">systemctl list-units</text>
  <text x="60" y="447.567567567568" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--primary-text)">systemctl get-default</text>
  <text x="60" y="478.918918918919" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--primary-text)">journalctl -b -p err</text>
  <text x="60" y="510.27027027027" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--primary-text)">journalctl -u sshd -f</text>
  <text x="60" y="541.621621621622" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--primary-text)">systemctl isolate rescue</text>
  <text x="60" y="588.648648648649" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--primary-text)">units in /etc/systemd/system/</text>

  <!-- Debug boot -->
  <rect x="660" y="275.135135135135" width="580" height="344.864864864865" rx="10.222744470273" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="311.711711711712" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.400940046492" font-weight="bold" fill="var(--info-text)">Boot Debug</text>
  <text x="680" y="353.513513513514" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--info-text)">dmesg | head</text>
  <text x="680" y="384.864864864865" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--info-text)">systemctl --failed</text>
  <text x="680" y="416.216216216216" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--info-text)">systemd-analyze blame</text>
  <text x="680" y="447.567567567568" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--info-text)">cat /proc/cmdline</text>
  <text x="680" y="478.918918918919" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--info-text)">uname -r</text>
  <text x="680" y="531.171171171171" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--info-text)">Targets: rescue, emergency</text>
  <text x="680" y="562.522522522523" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--info-text)">reboot, shutdown</text>
  <text x="680" y="593.873873873874" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--info-text)">Boot ~5-30s via parallel start</text>
</svg>

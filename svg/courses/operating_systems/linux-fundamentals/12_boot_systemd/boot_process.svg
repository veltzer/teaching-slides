<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <!-- Seven stages in a row -->
  <rect x="40" y="40" width="168" height="159.215686274509" rx="10.664215404617" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="124" y="85.490196078432" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744647387" font-weight="bold" fill="var(--primary-text)">BIOS/UEFI</text>
  <text x="124" y="125.294117647058" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--primary-text)">POST</text>
  <text x="124" y="153.725490196079" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--primary-text)">hw init</text>
  <text x="124" y="182.156862745098" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--primary-text)">find disk</text>

  <rect x="218" y="40" width="168" height="159.215686274509" rx="10.664215404617" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="302" y="85.490196078432" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744647387" font-weight="bold" fill="var(--ok-text)">GRUB2</text>
  <text x="302" y="125.294117647058" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--ok-text)">bootloader</text>
  <text x="302" y="153.725490196079" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--ok-text)">pick kernel</text>
  <text x="302" y="182.156862745098" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--ok-text)">load initrd</text>

  <rect x="396" y="40" width="168" height="159.215686274509" rx="10.664215404617" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="85.490196078432" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744647387" font-weight="bold" fill="var(--warn-text)">Kernel</text>
  <text x="480" y="125.294117647058" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--warn-text)">decompress</text>
  <text x="480" y="153.725490196079" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--warn-text)">init CPU/mem</text>
  <text x="480" y="182.156862745098" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--warn-text)">mount VFS</text>

  <rect x="574" y="40" width="168" height="159.215686274509" rx="10.664215404617" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="658" y="85.490196078432" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744647387" font-weight="bold" fill="var(--info-text)">initramfs</text>
  <text x="658" y="125.294117647058" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--info-text)">temp root</text>
  <text x="658" y="153.725490196079" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--info-text)">load drivers</text>
  <text x="658" y="182.156862745098" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--info-text)">mount real /</text>

  <rect x="752" y="40" width="168" height="159.215686274509" rx="10.664215404617" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="836" y="85.490196078432" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744647387" font-weight="bold" fill="var(--danger-text)">systemd</text>
  <text x="836" y="125.294117647058" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--danger-text)">PID 1</text>
  <text x="836" y="153.725490196079" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--danger-text)">read units</text>
  <text x="836" y="182.156862745098" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--danger-text)">parallel start</text>

  <rect x="930" y="40" width="150" height="159.215686274509" rx="10.664215404617" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1005" y="85.490196078432" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744647387" font-weight="bold" fill="var(--primary-text)">Targets</text>
  <text x="1005" y="125.294117647058" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--primary-text)">multi-user</text>
  <text x="1005" y="153.725490196079" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--primary-text)">graphical</text>

  <rect x="1090" y="40" width="150" height="159.215686274509" rx="10.664215404617" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1165" y="85.490196078432" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744647387" font-weight="bold" fill="var(--ok-text)">Login</text>
  <text x="1165" y="125.294117647058" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--ok-text)">getty / GDM</text>
  <text x="1165" y="153.725490196079" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--ok-text)">PAM auth</text>

  <line x1="208" y1="119.607843137255" x2="218" y2="119.607843137255" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="386" y1="119.607843137255" x2="396" y2="119.607843137255" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="564" y1="119.607843137255" x2="574" y2="119.607843137255" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="742" y1="119.607843137255" x2="752" y2="119.607843137255" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="920" y1="119.607843137255" x2="930" y2="119.607843137255" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="1080" y1="119.607843137255" x2="1090" y2="119.607843137255" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- systemctl commands -->
  <rect x="40" y="244.705882352941" width="600" height="375.294117647059" rx="10.664215404617" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="284.509803921569" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.195587728311" font-weight="bold" fill="var(--primary-text)">systemctl &amp; journalctl</text>
  <text x="60" y="330.000000000001" font-family="Courier New, monospace" font-size="14.929901566465" fill="var(--primary-text)">systemctl status sshd</text>
  <text x="60" y="364.117647058824" font-family="Courier New, monospace" font-size="14.929901566465" fill="var(--primary-text)">systemctl enable --now nginx</text>
  <text x="60" y="398.235294117647" font-family="Courier New, monospace" font-size="14.929901566465" fill="var(--primary-text)">systemctl list-units</text>
  <text x="60" y="432.352941176471" font-family="Courier New, monospace" font-size="14.929901566465" fill="var(--primary-text)">systemctl get-default</text>
  <text x="60" y="466.470588235294" font-family="Courier New, monospace" font-size="14.929901566465" fill="var(--primary-text)">journalctl -b -p err</text>
  <text x="60" y="500.588235294117" font-family="Courier New, monospace" font-size="14.929901566465" fill="var(--primary-text)">journalctl -u sshd -f</text>
  <text x="60" y="534.705882352942" font-family="Courier New, monospace" font-size="14.929901566465" fill="var(--primary-text)">systemctl isolate rescue</text>
  <text x="60" y="585.882352941177" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--primary-text)">units in /etc/systemd/system/</text>

  <!-- Debug boot -->
  <rect x="660" y="244.705882352941" width="580" height="375.294117647059" rx="10.664215404617" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="284.509803921569" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.195587728311" font-weight="bold" fill="var(--info-text)">Boot Debug</text>
  <text x="680" y="330.000000000001" font-family="Courier New, monospace" font-size="14.929901566465" fill="var(--info-text)">dmesg | head</text>
  <text x="680" y="364.117647058824" font-family="Courier New, monospace" font-size="14.929901566465" fill="var(--info-text)">systemctl --failed</text>
  <text x="680" y="398.235294117647" font-family="Courier New, monospace" font-size="14.929901566465" fill="var(--info-text)">systemd-analyze blame</text>
  <text x="680" y="432.352941176471" font-family="Courier New, monospace" font-size="14.929901566465" fill="var(--info-text)">cat /proc/cmdline</text>
  <text x="680" y="466.470588235294" font-family="Courier New, monospace" font-size="14.929901566465" fill="var(--info-text)">uname -r</text>
  <text x="680" y="523.333333333333" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--info-text)">Targets: rescue, emergency</text>
  <text x="680" y="557.450980392157" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--info-text)">reboot, shutdown</text>
  <text x="680" y="591.568627450981" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--info-text)">Boot ~5-30s via parallel start</text>
</svg>

  <ns0:text x="221.2346" y="163.5556" text-anchor="middle" font-size="21.0699">Daemons, processes</ns0:text>
  <ns0:rect x="453.0041" y="35.5556" width="358.1893" height="160" fill="#f3e5f5" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="632.0988" y="106.6667" text-anchor="middle" font-size="23.177" font-weight="bold">.socket</ns0:text>
  <ns0:text x="632.0988" y="163.5556" text-anchor="middle" font-size="21.0699">IPC / network activation</ns0:text>
  <ns0:rect x="863.8683" y="35.5556" width="358.1893" height="160" fill="#e8f5e9" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="1042.963" y="106.6667" text-anchor="middle" font-size="23.177" font-weight="bold">.target</ns0:text>
  <ns0:text x="1042.963" y="163.5556" text-anchor="middle" font-size="21.0699">Group of units</ns0:text>
  <ns0:rect x="42.14" y="248.8889" width="358.1893" height="160" fill="#fff3e0" stroke="#333" stroke-width="4.214" rx="10.535" />

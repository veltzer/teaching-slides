  <ns0:text x="221.2346" y="376.8889" text-anchor="middle" font-size="21.0699">Filesystem mounts</ns0:text>
  <ns0:rect x="453.0041" y="248.8889" width="358.1893" height="160" fill="#ffebee" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="632.0988" y="320" text-anchor="middle" font-size="23.177" font-weight="bold">.timer</ns0:text>
  <ns0:text x="632.0988" y="376.8889" text-anchor="middle" font-size="21.0699">Scheduled tasks (cron)</ns0:text>
  <ns0:rect x="863.8683" y="248.8889" width="358.1893" height="160" fill="#e3f2fd" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="1042.963" y="320" text-anchor="middle" font-size="23.177" font-weight="bold">.device</ns0:text>
  <ns0:text x="1042.963" y="376.8889" text-anchor="middle" font-size="21.0699">Hardware devices</ns0:text>
  <ns0:rect x="105.3498" y="497.7778" width="1053.498" height="142.2222" fill="#f3e5f5" stroke="#333" stroke-width="2.107" rx="10.535" />
  <ns0:text x="632.0988" y="561.7778" text-anchor="middle" font-size="21.0699" font-weight="bold">Unit files: /etc/systemd/system/ and /lib/systemd/system/</ns0:text>
  <ns0:text x="632.0988" y="611.5556" text-anchor="middle" font-size="21.0699">systemctl list-units --type=service | socket | timer</ns0:text>

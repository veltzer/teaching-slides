  <ns0:text x="632.0988" y="469.3333" text-anchor="middle" font-size="23.177" font-weight="bold">Linux Boot Sequence</ns0:text>
  <ns0:text x="632.0988" y="533.3333" text-anchor="middle" font-size="21.0699">Firmware -&gt; Bootloader -&gt; Kernel -&gt; Init System -&gt; User Space</ns0:text>
  <ns0:text x="632.0988" y="597.3333" text-anchor="middle" font-size="21.0699">Each stage hands control to the next in sequence</ns0:text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="21.0699" y="106.6667" width="200.1646" height="177.7778" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="120.0988" y="184.8889" text-anchor="middle" font-size="21.0699" font-weight="bold">BIOS/UEFI</text>
  <text x="120.0988" y="241.7778" text-anchor="middle" font-size="21.0699">POST, HW init</text>
  <rect x="263.3745" y="106.6667" width="179.0946" height="177.7778" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="351.8683" y="184.8889" text-anchor="middle" font-size="21.0699" font-weight="bold">GRUB</text>
  <text x="351.8683" y="241.7778" text-anchor="middle" font-size="21.0699">Bootloader</text>
  <rect x="484.6091" y="106.6667" width="179.0946" height="177.7778" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="573.1029" y="184.8889" text-anchor="middle" font-size="21.0699" font-weight="bold">Kernel</text>
  <text x="573.1029" y="241.7778" text-anchor="middle" font-size="21.0699">vmlinuz</text>
  <rect x="705.8437" y="106.6667" width="179.0946" height="177.7778" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="794.3375" y="184.8889" text-anchor="middle" font-size="21.0699" font-weight="bold">initramfs</text>
  <text x="794.3375" y="241.7778" text-anchor="middle" font-size="21.0699">Early root</text>
  <rect x="927.0782" y="106.6667" width="179.0946" height="177.7778" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1015.572" y="184.8889" text-anchor="middle" font-size="21.0699" font-weight="bold">systemd</text>
  <text x="1015.572" y="241.7778" text-anchor="middle" font-size="21.0699">PID 1</text>
  <rect x="1148.3128" y="106.6667" width="94.8148" height="177.7778" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1194.6667" y="195.5556" text-anchor="middle" font-size="21.0699" font-weight="bold">Login</text>
  <line x1="221.2346" y1="195.5556" x2="263.3745" y2="195.5556" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd0_11_boot_systemd)" />
  <line x1="442.4691" y1="195.5556" x2="484.6091" y2="195.5556" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd0_11_boot_systemd)" />
  <line x1="663.7037" y1="195.5556" x2="705.8437" y2="195.5556" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd0_11_boot_systemd)" />
  <line x1="884.9383" y1="195.5556" x2="927.0782" y2="195.5556" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd0_11_boot_systemd)" />
  <line x1="1106.1728" y1="195.5556" x2="1148.3128" y2="195.5556" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd0_11_boot_systemd)" />
  <rect x="21.0699" y="391.1111" width="1222.0576" height="248.8889" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="632.0988" y="469.3333" text-anchor="middle" font-size="23.177" font-weight="bold">Linux Boot Sequence</text>
  <text x="632.0988" y="533.3333" text-anchor="middle" font-size="21.0699">Firmware -&gt; Bootloader -&gt; Kernel -&gt; Init System -&gt; User Space</text>
  <text x="632.0988" y="597.3333" text-anchor="middle" font-size="21.0699">Each stage hands control to the next in sequence</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd0_11_boot_systemd" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
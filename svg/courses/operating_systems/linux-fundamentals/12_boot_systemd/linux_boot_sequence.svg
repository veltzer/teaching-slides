<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="196.5517" height="193.3334" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="137.2415" y="125.0666" text-anchor="middle" font-size="21.7732" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">BIOS/UEFI</text>
  <text x="137.2415" y="186.9333" text-anchor="middle" font-size="21.7732" font-family="Arial, sans-serif" fill="var(--danger-text)">POST, HW init</text>
  <rect x="277.9311" y="40" width="175.862" height="193.3334" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="364.8276" y="125.0666" text-anchor="middle" font-size="21.7732" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">GRUB</text>
  <text x="364.8276" y="186.9333" text-anchor="middle" font-size="21.7732" font-family="Arial, sans-serif" fill="var(--warn-text)">Bootloader</text>
  <rect x="495.1725" y="40" width="175.862" height="193.3334" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="582.069" y="125.0666" text-anchor="middle" font-size="21.7732" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Kernel</text>
  <text x="582.069" y="186.9333" text-anchor="middle" font-size="21.7732" font-family="Arial, sans-serif" fill="var(--info-text)">vmlinuz</text>
  <rect x="712.4139" y="40" width="175.862" height="193.3334" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="799.3104" y="125.0666" text-anchor="middle" font-size="21.7732" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">initramfs</text>
  <text x="799.3104" y="186.9333" text-anchor="middle" font-size="21.7732" font-family="Arial, sans-serif" fill="var(--primary-text)">Early root</text>
  <rect x="929.6552" y="40" width="175.862" height="193.3334" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1016.5517" y="125.0666" text-anchor="middle" font-size="21.7732" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">systemd</text>
  <text x="1016.5517" y="186.9333" text-anchor="middle" font-size="21.7732" font-family="Arial, sans-serif" fill="var(--ok-text)">PID 1</text>
  <rect x="1146.8966" y="40" width="93.1034" height="193.3334" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1192.4138" y="136.6667" text-anchor="middle" font-size="21.7732" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Login</text>
  <line x1="236.5518" y1="136.6667" x2="277.9311" y2="136.6667" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="453.7931" y1="136.6667" x2="495.1725" y2="136.6667" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="671.0345" y1="136.6667" x2="712.4139" y2="136.6667" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="888.2759" y1="136.6667" x2="929.6552" y2="136.6667" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1105.5172" y1="136.6667" x2="1146.8966" y2="136.6667" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="349.3333" width="1199.9999" height="270.6667" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="434.4" text-anchor="middle" font-size="23.9506" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Linux Boot Sequence</text>
  <text x="640" y="504" text-anchor="middle" font-size="21.7732" font-family="Arial, sans-serif" fill="var(--warn-text)">Firmware -&gt; Bootloader -&gt; Kernel -&gt; Init System -&gt; User Space</text>
  <text x="640" y="573.6" text-anchor="middle" font-size="21.7732" font-family="Arial, sans-serif" fill="var(--warn-text)">Each stage hands control to the next in sequence</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="41.001" y="34.5946" width="266.5065" height="155.6757" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="174.2542" y="96.8649" text-anchor="middle" font-size="20.5005" font-weight="bold">rescue.target</text>
  <text x="174.2542" y="152.2162" text-anchor="middle" font-size="20.5005">Single user (RL 1)</text>
  <rect x="338.2583" y="34.5946" width="266.5065" height="155.6757" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="471.5115" y="96.8649" text-anchor="middle" font-size="20.5005" font-weight="bold">multi-user</text>
  <text x="471.5115" y="152.2162" text-anchor="middle" font-size="20.5005">CLI mode (RL 3)</text>
  <rect x="635.5155" y="34.5946" width="266.5065" height="155.6757" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="768.7688" y="96.8649" text-anchor="middle" font-size="20.5005" font-weight="bold">graphical</text>
  <text x="768.7688" y="152.2162" text-anchor="middle" font-size="20.5005">GUI mode (RL 5)</text>
  <rect x="932.7728" y="34.5946" width="266.5065" height="155.6757" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="1066.026" y="96.8649" text-anchor="middle" font-size="20.5005" font-weight="bold">reboot.target</text>
  <text x="1066.026" y="152.2162" text-anchor="middle" font-size="20.5005">Reboot (RL 6)</text>
  <line x1="307.5075" y1="110.7027" x2="338.2583" y2="110.7027" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd6_11_boot_systemd)" />
  <line x1="604.7647" y1="110.7027" x2="635.5155" y2="110.7027" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd6_11_boot_systemd)" />
  <rect x="164.004" y="259.4595" width="902.0221" height="155.6757" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="615.015" y="321.7297" text-anchor="middle" font-size="20.5005" font-weight="bold">Targets group units with dependencies (Wants= / Requires=)</text>
  <text x="615.015" y="380.5405" text-anchor="middle" font-size="20.5005">graphical.target depends on multi-user.target depends on basic.target</text>
  <rect x="82.002" y="484.3243" width="512.5125" height="155.6757" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="338.2583" y="546.5946" text-anchor="middle" font-size="20.5005" font-weight="bold">systemctl get-default</text>
  <text x="338.2583" y="605.4054" text-anchor="middle" font-size="20.5005">Show current default target</text>
  <rect x="635.5155" y="484.3243" width="512.5125" height="155.6757" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="891.7718" y="546.5946" text-anchor="middle" font-size="20.5005" font-weight="bold">systemctl isolate</text>
  <text x="891.7718" y="605.4054" text-anchor="middle" font-size="20.5005">Switch to target immediately</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd6_11_boot_systemd" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="276.1062" height="149.1429" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="178.053" y="99.6572" text-anchor="middle" font-size="20.4239" font-weight="bold">rescue.target</text>
  <text x="178.053" y="152.6857" text-anchor="middle" font-size="20.4239">Single user (RL 1)</text>
  <rect x="347.9646" y="40" width="276.1062" height="149.1429" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="486.0177" y="99.6572" text-anchor="middle" font-size="20.4239" font-weight="bold">multi-user</text>
  <text x="486.0177" y="152.6857" text-anchor="middle" font-size="20.4239">CLI mode (RL 3)</text>
  <rect x="655.9292" y="40" width="276.1062" height="149.1429" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="793.9823" y="99.6572" text-anchor="middle" font-size="20.4239" font-weight="bold">graphical</text>
  <text x="793.9823" y="152.6857" text-anchor="middle" font-size="20.4239">GUI mode (RL 5)</text>
  <rect x="963.8938" y="40" width="276.1062" height="149.1429" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="1101.9469" y="99.6572" text-anchor="middle" font-size="20.4239" font-weight="bold">reboot.target</text>
  <text x="1101.9469" y="152.6857" text-anchor="middle" font-size="20.4239">Reboot (RL 6)</text>
  <line x1="316.1062" y1="112.9143" x2="347.9646" y2="112.9143" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd6_11_boot_systemd)" />
  <line x1="624.0707" y1="112.9143" x2="655.9292" y2="112.9143" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd6_11_boot_systemd)" />
  <rect x="167.4336" y="255.4286" width="934.5133" height="149.1429" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="634.6902" y="315.0857" text-anchor="middle" font-size="20.4239" font-weight="bold">Targets group units with dependencies (Wants= / Requires=)</text>
  <text x="634.6902" y="371.4285" text-anchor="middle" font-size="20.4239">graphical.target depends on multi-user.target depends on basic.target</text>
  <rect x="82.4779" y="470.8571" width="530.9734" height="149.1429" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="347.9646" y="530.5143" text-anchor="middle" font-size="20.4239" font-weight="bold">systemctl get-default</text>
  <text x="347.9646" y="586.8571" text-anchor="middle" font-size="20.4239">Show current default target</text>
  <rect x="655.9292" y="470.8571" width="530.9734" height="149.1429" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="921.4159" y="530.5143" text-anchor="middle" font-size="20.4239" font-weight="bold">systemctl isolate</text>
  <text x="921.4159" y="586.8571" text-anchor="middle" font-size="20.4239">Switch to target immediately</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd6_11_boot_systemd" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
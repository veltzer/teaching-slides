  <text x="59.512195" y="495.335392" font-family="monospace" font-size="12.073836" fill="var(--text)">fstab     mount config</text>
  <text x="59.512195" y="511.250027" font-family="monospace" font-size="12.073836" fill="var(--text)">crontab   scheduled tasks</text>

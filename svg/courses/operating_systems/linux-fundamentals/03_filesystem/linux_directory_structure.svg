  <text x="522.926829" y="178.811073" text-anchor="middle" font-size="15.788838" font-weight="bold" fill="var(--primary-accent)" font-family="Courier New, monospace">/etc</text>
  <text x="522.926829" y="195.609794" text-anchor="middle" font-size="10.68727" fill="var(--text-muted)" font-family="Arial, sans-serif">Config files</text>
  <rect x="683.902439" y="158.475571" width="107.317073" height="45.975626" rx="6.412362" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="737.560976" y="178.811073" text-anchor="middle" font-size="15.788838" font-weight="bold" fill="var(--primary-accent)" font-family="Courier New, monospace">/home</text>
  <text x="737.560976" y="195.609794" text-anchor="middle" font-size="10.68727" fill="var(--text-muted)" font-family="Arial, sans-serif">User homes</text>
  <rect x="898.536481" y="158.475571" width="107.317073" height="45.975626" rx="6.412362" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />

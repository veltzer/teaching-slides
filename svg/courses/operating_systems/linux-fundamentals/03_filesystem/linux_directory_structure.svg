  <rect x="40" y="158.475571" width="107.317073" height="45.975626" rx="6.412362" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="93.658537" y="178.811073" text-anchor="middle" font-size="15.788838" font-weight="bold" fill="var(--primary-accent)" font-family="Courier New, monospace">/bin</text>
  <text x="93.658537" y="195.609794" text-anchor="middle" font-size="10.68727" fill="var(--text-muted)" font-family="Arial, sans-serif">Binaries</text>

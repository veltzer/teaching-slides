  <line x1="846.2499" y1="265.5556" x2="846.2499" y2="309.8611" stroke="var(--text-faint)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="1061.875" y1="265.5556" x2="1061.875" y2="309.8611" stroke="var(--text-faint)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="640" y1="120.5556" x2="640" y2="265.5556" stroke="var(--border)" stroke-width="0.8889" stroke-dasharray="3.5556 3.5556" />
  <rect x="166.5625" y="312.2777" width="103.125" height="41.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="218.125" y="330.8056" text-anchor="middle" font-family="monospace" font-size="14.7735" font-weight="bold" fill="var(--primary-accent)">/lib</text>
  <text x="218.125" y="346.1111" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Libraries</text>
  <rect x="372.8125" y="312.2777" width="103.125" height="41.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="424.3749" y="330.8056" text-anchor="middle" font-family="monospace" font-size="14.7735" font-weight="bold" fill="var(--primary-accent)">/dev</text>
  <text x="424.3749" y="346.1111" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Device files</text>
  <rect x="588.4375" y="312.2777" width="103.125" height="41.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="640" y="330.8056" text-anchor="middle" font-family="monospace" font-size="14.7735" font-weight="bold" fill="var(--primary-accent)">/tmp</text>
  <text x="640" y="346.1111" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Temp files</text>
  <rect x="794.6875" y="312.2777" width="103.125" height="41.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="846.2499" y="330.8056" text-anchor="middle" font-family="monospace" font-size="14.7735" font-weight="bold" fill="var(--primary-accent)">/proc</text>
  <text x="846.2499" y="346.1111" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Process info</text>
  <rect x="1010.3125" y="312.2777" width="103.125" height="41.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1061.875" y="330.8056" text-anchor="middle" font-family="monospace" font-size="14.7735" font-weight="bold" fill="var(--primary-accent)">/root</text>
  <text x="1061.875" y="346.1111" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Root home</text>
  <rect x="68.125" y="390.4167" width="253.125" height="145" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="82.1875" y="412.1667" font-family="monospace" font-size="13.9044" font-weight="bold" fill="var(--primary-accent)">/etc  — Configuration</text>
  <text x="82.1875" y="430.6944" font-family="monospace" font-size="11.2974" fill="var(--text)">passwd    user accounts</text>
  <text x="82.1875" y="445.1944" font-family="monospace" font-size="11.2974" fill="var(--text)">shadow    password hashes</text>
  <text x="82.1875" y="459.6944" font-family="monospace" font-size="11.2974" fill="var(--text)">hosts     hostname mapping</text>
  <text x="82.1875" y="474.1944" font-family="monospace" font-size="11.2974" fill="var(--text)">fstab     mount config</text>
  <text x="82.1875" y="488.6944" font-family="monospace" font-size="11.2974" fill="var(--text)">crontab   scheduled tasks</text>
  <text x="82.1875" y="503.1944" font-family="monospace" font-size="11.2974" fill="var(--text)">ssh/      SSH config</text>
  <text x="82.1875" y="523.3333" font-family="sans-serif" font-size="10" fill="var(--text-faint)">Text files, editable by root</text>
  <rect x="349.375" y="390.4167" width="253.125" height="145" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="363.4375" y="412.1667" font-family="monospace" font-size="13.9044" font-weight="bold" fill="var(--warn-accent)">/var  — Variable data</text>
  <text x="363.4375" y="430.6944" font-family="monospace" font-size="11.2974" fill="var(--text)">log/      system log files</text>
  <text x="363.4375" y="445.1944" font-family="monospace" font-size="11.2974" fill="var(--text)">spool/    queues (mail/print)</text>
  <text x="363.4375" y="459.6944" font-family="monospace" font-size="11.2974" fill="var(--text)">cache/    app caches</text>
  <text x="363.4375" y="474.1944" font-family="monospace" font-size="11.2974" fill="var(--text)">lib/      persistent state</text>
  <text x="363.4375" y="488.6944" font-family="monospace" font-size="11.2974" fill="var(--text)">run/      runtime PID files</text>
  <text x="363.4375" y="503.1944" font-family="monospace" font-size="11.2974" fill="var(--text)">www/      web root</text>
  <text x="363.4375" y="523.3333" font-family="sans-serif" font-size="10" fill="var(--text-faint)">Changes during normal operation</text>
  <rect x="630.625" y="390.4167" width="253.125" height="145" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="644.6875" y="412.1667" font-family="monospace" font-size="13.9044" font-weight="bold" fill="var(--ok-accent)">/proc  — Kernel virtual FS</text>
  <text x="644.6875" y="430.6944" font-family="monospace" font-size="11.2974" fill="var(--text)">cpuinfo   CPU details</text>
  <text x="644.6875" y="445.1944" font-family="monospace" font-size="11.2974" fill="var(--text)">meminfo   memory usage</text>
  <text x="644.6875" y="459.6944" font-family="monospace" font-size="11.2974" fill="var(--text)">PID/      per-process info</text>
  <text x="644.6875" y="474.1944" font-family="monospace" font-size="11.2974" fill="var(--text)">net/      network stats</text>
  <text x="644.6875" y="488.6944" font-family="monospace" font-size="11.2974" fill="var(--text)">sys/      kernel params</text>
  <text x="644.6875" y="503.1944" font-family="monospace" font-size="11.2974" fill="var(--text)">mounts    mounted filesystems</text>
  <text x="644.6875" y="523.3333" font-family="sans-serif" font-size="10" fill="var(--text-faint)">Virtual — exists only in RAM</text>
  <rect x="911.875" y="390.4167" width="299.9999" height="145" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="925.9375" y="412.1667" font-family="monospace" font-size="13.9044" font-weight="bold" fill="var(--info-accent)">/usr  — User programs</text>
  <text x="925.9375" y="430.6944" font-family="monospace" font-size="11.2974" fill="var(--text)">bin/      user commands</text>
  <text x="925.9375" y="445.1944" font-family="monospace" font-size="11.2974" fill="var(--text)">sbin/     admin commands</text>
  <text x="925.9375" y="459.6944" font-family="monospace" font-size="11.2974" fill="var(--text)">lib/      shared libraries</text>
  <text x="925.9375" y="474.1944" font-family="monospace" font-size="11.2974" fill="var(--text)">share/    arch-independent data</text>
  <text x="925.9375" y="488.6944" font-family="monospace" font-size="11.2974" fill="var(--text)">local/    locally installed SW</text>
  <text x="925.9375" y="503.1944" font-family="monospace" font-size="11.2974" fill="var(--text)">include/  C header files</text>
  <text x="925.9375" y="523.3333" font-family="sans-serif" font-size="10" fill="var(--text-faint)">Read-only; shared across network</text>
  <text x="640" y="587.7777" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">FHS (Filesystem Hierarchy Standard) defines the layout — every Linux distribution follows this convention.</text>

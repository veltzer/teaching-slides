  <line x1="764.4444" y1="248.8889" x2="764.4444" y2="297.7778" stroke="var(--text-faint)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="968.8889" y1="248.8889" x2="968.8889" y2="297.7778" stroke="var(--text-faint)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="568.8889" y1="88.8889" x2="568.8889" y2="248.8889" stroke="var(--border)" stroke-width="0.8889" stroke-dasharray="3.5556 3.5556" />

  <line x1="1165" y1="120.5556" x2="1165" y2="164.8611" stroke="var(--text-faint)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <rect x="63.4375" y="167.2777" width="103.125" height="41.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="115" y="185.8056" text-anchor="middle" font-family="monospace" font-size="14.7735" font-weight="bold" fill="var(--primary-accent)">/bin</text>
  <text x="115" y="201.1111" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Binaries</text>
  <rect x="269.6875" y="167.2777" width="103.125" height="41.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="321.25" y="185.8056" text-anchor="middle" font-family="monospace" font-size="14.7735" font-weight="bold" fill="var(--primary-accent)">/sbin</text>
  <text x="321.25" y="201.1111" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Sys Binaries</text>
  <rect x="475.9375" y="167.2777" width="103.125" height="41.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="527.5" y="185.8056" text-anchor="middle" font-family="monospace" font-size="14.7735" font-weight="bold" fill="var(--primary-accent)">/etc</text>
  <text x="527.5" y="201.1111" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Config files</text>
  <rect x="682.1875" y="167.2777" width="103.125" height="41.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="733.75" y="185.8056" text-anchor="middle" font-family="monospace" font-size="14.7735" font-weight="bold" fill="var(--primary-accent)">/home</text>
  <text x="733.75" y="201.1111" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">User homes</text>
  <rect x="888.4374" y="167.2777" width="103.125" height="41.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="939.9999" y="185.8056" text-anchor="middle" font-family="monospace" font-size="14.7735" font-weight="bold" fill="var(--primary-accent)">/var</text>
  <text x="939.9999" y="201.1111" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Variable data</text>
  <rect x="1113.4375" y="167.2777" width="103.125" height="41.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1165" y="185.8056" text-anchor="middle" font-family="monospace" font-size="14.7735" font-weight="bold" fill="var(--primary-accent)">/usr</text>
  <text x="1165" y="201.1111" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">User programs</text>
  <line x1="640" y1="104.4444" x2="640" y2="120.5556" stroke="var(--text-faint)" stroke-width="1.3333" />
  <line x1="218.125" y1="265.5556" x2="1061.875" y2="265.5556" stroke="var(--border)" stroke-width="1.3333" />

  <text x="415.609652" y="354.756148" text-anchor="middle" font-size="10.68727" fill="var(--text-muted)" font-family="Arial, sans-serif">Device files</text>
  <rect x="586.341463" y="317.621926" width="107.317073" height="45.975626" rx="6.412362" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="337.957427" text-anchor="middle" font-size="15.788838" font-weight="bold" fill="var(--primary-accent)" font-family="Courier New, monospace">/tmp</text>

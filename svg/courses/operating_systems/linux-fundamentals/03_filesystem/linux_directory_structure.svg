  <line x1="115" y1="120.5556" x2="1165" y2="120.5556" stroke="var(--text-faint)" stroke-width="1.3333" />
  <line x1="115" y1="120.5556" x2="115" y2="164.8611" stroke="var(--text-faint)" stroke-width="1.3333" marker-end="url(#arrow)" />

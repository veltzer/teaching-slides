  <text x="352.195122" y="495.335392" font-family="monospace" font-size="12.073836" fill="var(--text)">lib/      persistent state</text>
  <text x="352.195122" y="511.250027" font-family="monospace" font-size="12.073836" fill="var(--text)">run/      runtime PID files</text>

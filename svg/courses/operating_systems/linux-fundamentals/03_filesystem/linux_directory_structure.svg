  <text x="266.6667" y="160.8889" text-anchor="middle" font-family="monospace" font-size="15.1111" font-weight="bold" fill="var(--primary-accent)">/sbin</text>
  <text x="266.6667" y="177.7778" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Sys Binaries</text>
  <rect x="413.3333" y="140.4444" width="97.7778" height="46.2222" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="462.2222" y="160.8889" text-anchor="middle" font-family="monospace" font-size="15.1111" font-weight="bold" fill="var(--primary-accent)">/etc</text>
  <text x="462.2222" y="177.7778" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Config files</text>
  <rect x="608.8889" y="140.4444" width="97.7778" height="46.2222" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="657.7778" y="160.8889" text-anchor="middle" font-family="monospace" font-size="15.1111" font-weight="bold" fill="var(--primary-accent)">/home</text>
  <text x="657.7778" y="177.7778" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">User homes</text>
  <rect x="804.4444" y="140.4444" width="97.7778" height="46.2222" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="853.3333" y="160.8889" text-anchor="middle" font-family="monospace" font-size="15.1111" font-weight="bold" fill="var(--primary-accent)">/var</text>
  <text x="853.3333" y="177.7778" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Variable data</text>
  <rect x="1017.7778" y="140.4444" width="97.7778" height="46.2222" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1066.6667" y="160.8889" text-anchor="middle" font-family="monospace" font-size="15.1111" font-weight="bold" fill="var(--primary-accent)">/usr</text>

  <ns0:text x="40" y="410.6667" font-family="monospace" font-size="14.2222" font-weight="bold" fill="#1565c0">/etc  — Configuration</ns0:text>
  <ns0:text x="40" y="431.1111" font-family="monospace" font-size="11.5556" fill="#212121">passwd    user accounts</ns0:text>
  <ns0:text x="40" y="447.1111" font-family="monospace" font-size="11.5556" fill="#212121">shadow    password hashes</ns0:text>
  <ns0:text x="40" y="463.1111" font-family="monospace" font-size="11.5556" fill="#212121">hosts     hostname mapping</ns0:text>
  <ns0:text x="40" y="479.1111" font-family="monospace" font-size="11.5556" fill="#212121">fstab     mount config</ns0:text>
  <ns0:text x="40" y="495.1111" font-family="monospace" font-size="11.5556" fill="#212121">crontab   scheduled tasks</ns0:text>
  <ns0:text x="40" y="511.1111" font-family="monospace" font-size="11.5556" fill="#212121">ssh/      SSH config</ns0:text>
  <ns0:text x="40" y="533.3333" font-family="sans-serif" font-size="10" fill="#888888">Text files, editable by root</ns0:text>
  <ns0:rect x="293.3333" y="386.6667" width="240" height="160" rx="8.8889" fill="#fff3e0" stroke="#ffcc80" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="306.6667" y="410.6667" font-family="monospace" font-size="14.2222" font-weight="bold" fill="#e65100">/var  — Variable data</ns0:text>
  <ns0:text x="306.6667" y="431.1111" font-family="monospace" font-size="11.5556" fill="#212121">log/      system log files</ns0:text>
  <ns0:text x="306.6667" y="447.1111" font-family="monospace" font-size="11.5556" fill="#212121">spool/    queues (mail/print)</ns0:text>
  <ns0:text x="306.6667" y="463.1111" font-family="monospace" font-size="11.5556" fill="#212121">cache/    app caches</ns0:text>
  <ns0:text x="306.6667" y="479.1111" font-family="monospace" font-size="11.5556" fill="#212121">lib/      persistent state</ns0:text>
  <ns0:text x="306.6667" y="495.1111" font-family="monospace" font-size="11.5556" fill="#212121">run/      runtime PID files</ns0:text>
  <ns0:text x="306.6667" y="511.1111" font-family="monospace" font-size="11.5556" fill="#212121">www/      web root</ns0:text>
  <ns0:text x="306.6667" y="533.3333" font-family="sans-serif" font-size="10" fill="#888888">Changes during normal operation</ns0:text>
  <ns0:rect x="560" y="386.6667" width="240" height="160" rx="8.8889" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="573.3333" y="410.6667" font-family="monospace" font-size="14.2222" font-weight="bold" fill="#2e7d32">/proc  — Kernel virtual FS</ns0:text>
  <ns0:text x="573.3333" y="431.1111" font-family="monospace" font-size="11.5556" fill="#212121">cpuinfo   CPU details</ns0:text>
  <ns0:text x="573.3333" y="447.1111" font-family="monospace" font-size="11.5556" fill="#212121">meminfo   memory usage</ns0:text>
  <ns0:text x="573.3333" y="463.1111" font-family="monospace" font-size="11.5556" fill="#212121">PID/      per-process info</ns0:text>
  <ns0:text x="573.3333" y="479.1111" font-family="monospace" font-size="11.5556" fill="#212121">net/      network stats</ns0:text>
  <ns0:text x="573.3333" y="495.1111" font-family="monospace" font-size="11.5556" fill="#212121">sys/      kernel params</ns0:text>
  <ns0:text x="573.3333" y="511.1111" font-family="monospace" font-size="11.5556" fill="#212121">mounts    mounted filesystems</ns0:text>
  <ns0:text x="573.3333" y="533.3333" font-family="sans-serif" font-size="10" fill="#888888">Virtual — exists only in RAM</ns0:text>
  <ns0:rect x="826.6667" y="386.6667" width="284.4444" height="160" rx="8.8889" fill="#f3e5f5" stroke="#ce93d8" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="840" y="410.6667" font-family="monospace" font-size="14.2222" font-weight="bold" fill="#6a1b9a">/usr  — User programs</ns0:text>
  <ns0:text x="840" y="431.1111" font-family="monospace" font-size="11.5556" fill="#212121">bin/      user commands</ns0:text>
  <ns0:text x="840" y="447.1111" font-family="monospace" font-size="11.5556" fill="#212121">sbin/     admin commands</ns0:text>
  <ns0:text x="840" y="463.1111" font-family="monospace" font-size="11.5556" fill="#212121">lib/      shared libraries</ns0:text>
  <ns0:text x="840" y="479.1111" font-family="monospace" font-size="11.5556" fill="#212121">share/    arch-independent data</ns0:text>
  <ns0:text x="840" y="495.1111" font-family="monospace" font-size="11.5556" fill="#212121">local/    locally installed SW</ns0:text>
  <ns0:text x="840" y="511.1111" font-family="monospace" font-size="11.5556" fill="#212121">include/  C header files</ns0:text>
  <ns0:text x="840" y="533.3333" font-family="sans-serif" font-size="10" fill="#888888">Read-only; shared across network</ns0:text>
  <ns0:text x="568.8889" y="604.4444" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#555555">FHS (Filesystem Hierarchy Standard) defines the layout — every Linux distribution follows this convention.</ns0:text>

  <text x="352.195122" y="511.250027" font-size="12.073836" fill="var(--text)" font-family="Courier New, monospace">run/      runtime PID files</text>
  <text x="352.195122" y="527.164663" font-size="12.073836" fill="var(--text)" font-family="Courier New, monospace">www/      web root</text>
  <text x="352.195122" y="549.268336" font-size="10.68727" fill="var(--text-faint)" font-family="Arial, sans-serif">Changes during normal operation</text>

  <line x1="93.658537" y1="107.195213" x2="93.658537" y2="155.823205" stroke="var(--text-faint)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="308.292683" y1="107.195213" x2="308.292683" y2="155.823205" stroke="var(--text-faint)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="522.926829" y1="107.195213" x2="522.926829" y2="155.823205" stroke="var(--text-faint)" stroke-width="1.3333" marker-end="url(#arrow)" />

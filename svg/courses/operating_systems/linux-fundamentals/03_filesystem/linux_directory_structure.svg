  <line x1="1066.6667" y1="88.8889" x2="1066.6667" y2="137.7778" stroke="var(--text-faint)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <rect x="22.2222" y="140.4444" width="97.7778" height="46.2222" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="71.1111" y="160.8889" text-anchor="middle" font-family="monospace" font-size="15.1111" font-weight="bold" fill="var(--primary-accent)">/bin</text>
  <text x="71.1111" y="177.7778" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Binaries</text>

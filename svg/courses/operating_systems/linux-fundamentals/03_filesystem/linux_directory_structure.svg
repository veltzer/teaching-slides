  <text x="952.195018" y="195.609794" text-anchor="middle" font-size="10.68727" fill="var(--text-muted)" font-family="Arial, sans-serif">Variable data</text>
  <rect x="1132.682927" y="158.475571" width="107.317073" height="45.975626" rx="6.412362" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />

  <text x="168.8889" y="337.7778" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Libraries</text>
  <rect x="315.5556" y="300.4444" width="97.7778" height="46.2222" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="364.4444" y="320.8889" text-anchor="middle" font-family="monospace" font-size="15.1111" font-weight="bold" fill="var(--primary-accent)">/dev</text>
  <text x="364.4444" y="337.7778" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Device files</text>
  <rect x="520" y="300.4444" width="97.7778" height="46.2222" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="568.8889" y="320.8889" text-anchor="middle" font-family="monospace" font-size="15.1111" font-weight="bold" fill="var(--primary-accent)">/tmp</text>
  <text x="568.8889" y="337.7778" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Temp files</text>
  <rect x="715.5556" y="300.4444" width="97.7778" height="46.2222" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="764.4444" y="320.8889" text-anchor="middle" font-family="monospace" font-size="15.1111" font-weight="bold" fill="var(--primary-accent)">/proc</text>
  <text x="764.4444" y="337.7778" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Process info</text>
  <rect x="920" y="300.4444" width="97.7778" height="46.2222" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="968.8889" y="320.8889" text-anchor="middle" font-family="monospace" font-size="15.1111" font-weight="bold" fill="var(--primary-accent)">/root</text>
  <text x="968.8889" y="337.7778" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Root home</text>
  <rect x="26.6667" y="386.6667" width="240" height="160" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="40" y="410.6667" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--primary-accent)">/etc  — Configuration</text>
  <text x="40" y="431.1111" font-family="monospace" font-size="11.5556" fill="var(--text)">passwd    user accounts</text>
  <text x="40" y="447.1111" font-family="monospace" font-size="11.5556" fill="var(--text)">shadow    password hashes</text>
  <text x="40" y="463.1111" font-family="monospace" font-size="11.5556" fill="var(--text)">hosts     hostname mapping</text>
  <text x="40" y="479.1111" font-family="monospace" font-size="11.5556" fill="var(--text)">fstab     mount config</text>
  <text x="40" y="495.1111" font-family="monospace" font-size="11.5556" fill="var(--text)">crontab   scheduled tasks</text>
  <text x="40" y="511.1111" font-family="monospace" font-size="11.5556" fill="var(--text)">ssh/      SSH config</text>
  <text x="40" y="533.3333" font-family="sans-serif" font-size="10" fill="var(--text-faint)">Text files, editable by root</text>
  <rect x="293.3333" y="386.6667" width="240" height="160" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="306.6667" y="410.6667" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--warn-accent)">/var  — Variable data</text>
  <text x="306.6667" y="431.1111" font-family="monospace" font-size="11.5556" fill="var(--text)">log/      system log files</text>
  <text x="306.6667" y="447.1111" font-family="monospace" font-size="11.5556" fill="var(--text)">spool/    queues (mail/print)</text>
  <text x="306.6667" y="463.1111" font-family="monospace" font-size="11.5556" fill="var(--text)">cache/    app caches</text>
  <text x="306.6667" y="479.1111" font-family="monospace" font-size="11.5556" fill="var(--text)">lib/      persistent state</text>
  <text x="306.6667" y="495.1111" font-family="monospace" font-size="11.5556" fill="var(--text)">run/      runtime PID files</text>
  <text x="306.6667" y="511.1111" font-family="monospace" font-size="11.5556" fill="var(--text)">www/      web root</text>
  <text x="306.6667" y="533.3333" font-family="sans-serif" font-size="10" fill="var(--text-faint)">Changes during normal operation</text>
  <rect x="560" y="386.6667" width="240" height="160" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="573.3333" y="410.6667" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--ok-accent)">/proc  — Kernel virtual FS</text>
  <text x="573.3333" y="431.1111" font-family="monospace" font-size="11.5556" fill="var(--text)">cpuinfo   CPU details</text>
  <text x="573.3333" y="447.1111" font-family="monospace" font-size="11.5556" fill="var(--text)">meminfo   memory usage</text>
  <text x="573.3333" y="463.1111" font-family="monospace" font-size="11.5556" fill="var(--text)">PID/      per-process info</text>
  <text x="573.3333" y="479.1111" font-family="monospace" font-size="11.5556" fill="var(--text)">net/      network stats</text>
  <text x="573.3333" y="495.1111" font-family="monospace" font-size="11.5556" fill="var(--text)">sys/      kernel params</text>
  <text x="573.3333" y="511.1111" font-family="monospace" font-size="11.5556" fill="var(--text)">mounts    mounted filesystems</text>
  <text x="573.3333" y="533.3333" font-family="sans-serif" font-size="10" fill="var(--text-faint)">Virtual — exists only in RAM</text>
  <rect x="826.6667" y="386.6667" width="284.4444" height="160" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="840" y="410.6667" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--info-accent)">/usr  — User programs</text>
  <text x="840" y="431.1111" font-family="monospace" font-size="11.5556" fill="var(--text)">bin/      user commands</text>
  <text x="840" y="447.1111" font-family="monospace" font-size="11.5556" fill="var(--text)">sbin/     admin commands</text>
  <text x="840" y="463.1111" font-family="monospace" font-size="11.5556" fill="var(--text)">lib/      shared libraries</text>
  <text x="840" y="479.1111" font-family="monospace" font-size="11.5556" fill="var(--text)">share/    arch-independent data</text>
  <text x="840" y="495.1111" font-family="monospace" font-size="11.5556" fill="var(--text)">local/    locally installed SW</text>
  <text x="840" y="511.1111" font-family="monospace" font-size="11.5556" fill="var(--text)">include/  C header files</text>
  <text x="840" y="533.3333" font-family="sans-serif" font-size="10" fill="var(--text-faint)">Read-only; shared across network</text>
  <text x="568.8889" y="604.4444" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">FHS (Filesystem Hierarchy Standard) defines the layout — every Linux distribution follows this convention.</text>

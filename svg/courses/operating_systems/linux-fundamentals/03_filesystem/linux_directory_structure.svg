  <text x="59.512195" y="427.256203" font-size="14.860008" font-weight="bold" fill="var(--primary-accent)" font-family="Courier New, monospace">/etc  — Configuration</text>
  <text x="59.512195" y="447.591485" font-size="12.073836" fill="var(--text)" font-family="Courier New, monospace">passwd    user accounts</text>
  <text x="59.512195" y="463.506121" font-size="12.073836" fill="var(--text)" font-family="Courier New, monospace">shadow    password hashes</text>
  <text x="59.512195" y="479.420756" font-size="12.073836" fill="var(--text)" font-family="Courier New, monospace">hosts     hostname mapping</text>
  <text x="59.512195" y="495.335392" font-size="12.073836" fill="var(--text)" font-family="Courier New, monospace">fstab     mount config</text>
  <text x="59.512195" y="511.250027" font-size="12.073836" fill="var(--text)" font-family="Courier New, monospace">crontab   scheduled tasks</text>
  <text x="59.512195" y="527.164663" font-size="12.073836" fill="var(--text)" font-family="Courier New, monospace">ssh/      SSH config</text>
  <text x="59.512195" y="549.268336" font-size="10.68727" fill="var(--text-faint)" font-family="Arial, sans-serif">Text files, editable by root</text>
  <rect x="337.560976" y="403.38425" width="263.414634" height="159.146355" rx="6.412362" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="352.195122" y="427.256203" font-size="14.860008" font-weight="bold" fill="var(--warn-accent)" font-family="Courier New, monospace">/var  — Variable data</text>

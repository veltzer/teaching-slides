<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <text x="640" y="64.8" text-anchor="middle" font-size="23.4667" font-weight="bold">Directory Stack (pushd / popd)</text>
  <rect x="106.6667" y="108" width="256" height="504" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="234.6667" y="180" text-anchor="middle" font-size="21.3333" font-weight="bold">Stack</text>
  <rect x="128" y="208.8" width="213.3333" height="79.2" fill="#fff3e0" stroke="#333" stroke-width="2.1333" rx="4.2667" />
  <text x="234.6667" y="262.8" text-anchor="middle" font-size="21.3333">/home/user</text>
  <rect x="128" y="302.4" width="213.3333" height="79.2" fill="#e8f5e9" stroke="#333" stroke-width="2.1333" rx="4.2667" />
  <text x="234.6667" y="356.4" text-anchor="middle" font-size="21.3333">/var/log</text>
  <rect x="128" y="396" width="213.3333" height="79.2" fill="#f3e5f5" stroke="#333" stroke-width="2.1333" rx="4.2667" />
  <text x="234.6667" y="450" text-anchor="middle" font-size="21.3333">/etc</text>
  <text x="234.6667" y="558" text-anchor="middle" font-size="21.3333" fill="#666">dirs -v</text>
  <rect x="426.6667" y="144" width="384" height="198" fill="#e8f5e9" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="618.6667" y="208.8" text-anchor="middle" font-size="21.3333" font-weight="bold">pushd /var/log</text>
  <text x="618.6667" y="280.8" text-anchor="middle" font-size="21.3333">saves current dir, cd to new</text>
  <rect x="426.6667" y="396" width="384" height="198" fill="#ffebee" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="618.6667" y="460.8" text-anchor="middle" font-size="21.3333" font-weight="bold">popd</text>
  <text x="618.6667" y="532.8" text-anchor="middle" font-size="21.3333">return to previous dir</text>
  <rect x="874.6667" y="144" width="298.6667" height="450" fill="#fff3e0" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="1024" y="208.8" text-anchor="middle" font-size="21.3333" font-weight="bold">Quick Nav</text>
  <text x="1024" y="280.8" text-anchor="middle" font-size="21.3333">cd -    : toggle</text>
  <text x="1024" y="352.8" text-anchor="middle" font-size="21.3333">cd ~    : home</text>
  <text x="1024" y="424.8" text-anchor="middle" font-size="21.3333">cd ..   : parent</text>
  <text x="1024" y="496.8" text-anchor="middle" font-size="21.3333">cd      : home</text>
</svg>
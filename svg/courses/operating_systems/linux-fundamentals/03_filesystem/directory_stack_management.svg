<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="288" height="580" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.251857021007" filter="url(#shadow)"/>
  <text x="184" y="122.857158367348" text-anchor="middle" font-size="24.27356426738" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Stack</text>
  <rect x="64" y="156" width="240" height="91.142895918369" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.251857021007" filter="url(#shadow)"/>
  <text x="184" y="218.142814489794" text-anchor="middle" font-size="24.27356426738" font-family="Arial, sans-serif" fill="var(--warn-text)">/home/user</text>
  <rect x="64" y="263.714262448978" width="240" height="91.142895918369" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.251857021007" filter="url(#shadow)"/>
  <text x="184" y="325.857076938772" text-anchor="middle" font-size="24.27356426738" font-family="Arial, sans-serif" fill="var(--ok-text)">/var/log</text>
  <rect x="64" y="371.428524897957" width="240" height="91.142895918369" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.251857021007" filter="url(#shadow)"/>
  <text x="184" y="433.571447959185" text-anchor="middle" font-size="24.27356426738" font-family="Arial, sans-serif" fill="var(--info-text)">/etc</text>
  <text x="184" y="557.857185510206" text-anchor="middle" font-size="24.27356426738" fill="var(--text-muted)" font-family="Arial, sans-serif">dirs -v</text>
  <rect x="400" y="81.428579183674" width="432" height="227.857131224489" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.251857021007" filter="url(#shadow)"/>
  <text x="616" y="156" text-anchor="middle" font-size="24.27356426738" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">pushd /var/log</text>
  <text x="616" y="238.857158367348" text-anchor="middle" font-size="24.27356426738" font-family="Arial, sans-serif" fill="var(--ok-text)">saves current dir, cd to new</text>
  <rect x="400" y="371.428524897957" width="432" height="227.857131224489" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.251857021007" filter="url(#shadow)"/>
  <text x="616" y="445.999945714283" text-anchor="middle" font-size="24.27356426738" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">popd</text>
  <text x="616" y="528.857104081631" text-anchor="middle" font-size="24.27356426738" font-family="Arial, sans-serif" fill="var(--danger-text)">return to previous dir</text>
  <rect x="904" y="81.428579183674" width="336" height="517.857185510206" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.251857021007" filter="url(#shadow)"/>
  <text x="1071.9999" y="156" text-anchor="middle" font-size="24.27356426738" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Quick Nav</text>
  <text x="1071.9999" y="238.857158367348" text-anchor="middle" font-size="24.27356426738" font-family="Arial, sans-serif" fill="var(--warn-text)">cd -    : toggle</text>
  <text x="1071.9999" y="321.714316734695" text-anchor="middle" font-size="24.27356426738" font-family="Arial, sans-serif" fill="var(--warn-text)">cd ~    : home</text>
  <text x="1071.9999" y="404.571366530609" text-anchor="middle" font-size="24.27356426738" font-family="Arial, sans-serif" fill="var(--warn-text)">cd ..   : parent</text>
  <text x="1071.9999" y="487.428524897957" text-anchor="middle" font-size="24.27356426738" font-family="Arial, sans-serif" fill="var(--warn-text)">cd      : home</text>
</svg>

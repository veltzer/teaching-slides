<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="482.7184" y="40" width="279.6117" height="94.054" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="622.5243" y="102.7027" text-anchor="middle" font-size="24.9675" font-weight="bold">/ (root)</text>
  <line x1="459.4175" y1="134.054" x2="156.5048" y2="196.7568" stroke="var(--text)" stroke-width="1.9961" />
  <line x1="552.6214" y1="134.054" x2="436.1165" y2="196.7568" stroke="var(--text)" stroke-width="1.9961" />
  <line x1="622.5243" y1="134.054" x2="622.5243" y2="196.7568" stroke="var(--text)" stroke-width="1.9961" />
  <line x1="692.4273" y1="134.054" x2="808.9321" y2="196.7568" stroke="var(--text)" stroke-width="1.9961" />
  <line x1="785.6311" y1="134.054" x2="1088.5438" y2="196.7568" stroke="var(--text)" stroke-width="1.9961" />
  <rect x="40" y="196.7568" width="209.7087" height="78.3784" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="144.8544" y="250.054" text-anchor="middle" font-size="20.8062">/bin</text>
  <rect x="331.2621" y="196.7568" width="209.7087" height="78.3784" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="436.1165" y="250.054" text-anchor="middle" font-size="20.8062">/etc</text>
  <rect x="564.2719" y="196.7568" width="209.7087" height="78.3784" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="669.1263" y="250.054" text-anchor="middle" font-size="20.8062">/home</text>
  <rect x="797.2816" y="196.7568" width="209.7087" height="78.3784" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="902.136" y="250.054" text-anchor="middle" font-size="20.8062">/usr</text>
  <rect x="1030.2913" y="196.7568" width="209.7087" height="78.3784" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1135.1457" y="250.054" text-anchor="middle" font-size="20.8062">/var</text>
  <line x1="669.1263" y1="275.1352" x2="552.6214" y2="337.8378" stroke="var(--text)" stroke-width="1.9961" />
  <line x1="669.1263" y1="275.1352" x2="785.6311" y2="337.8378" stroke="var(--text)" stroke-width="1.9961" />
  <rect x="436.1165" y="337.8378" width="233.0097" height="68.973" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="552.6214" y="384.8648" text-anchor="middle" font-size="20.8062">/home/alice</text>
  <rect x="692.4273" y="337.8378" width="233.0097" height="68.973" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="808.9321" y="384.8648" text-anchor="middle" font-size="20.8062">/home/bob</text>
  <rect x="40" y="463.2432" width="1188.3496" height="156.7568" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="622.5243" y="516.5405" text-anchor="middle" font-size="20.8062" font-weight="bold">Filesystem Hierarchy Standard (FHS)</text>
  <text x="622.5243" y="572.973" text-anchor="middle" font-size="20.8062">/bin:cmds  /etc:config  /home:users  /usr:programs  /var:logs,data</text>
</svg>
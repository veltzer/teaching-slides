<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="482.7184" y="40" width="279.6117" height="94.054" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="622.5243" y="102.7027" text-anchor="middle" font-size="24.9675" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">/ (root)</text>
  <line x1="459.4175" y1="134.054" x2="156.5048" y2="196.7568" stroke="var(--text)" stroke-width="1.9961" />
  <line x1="552.6214" y1="134.054" x2="436.1165" y2="196.7568" stroke="var(--text)" stroke-width="1.9961" />
  <line x1="622.5243" y1="134.054" x2="622.5243" y2="196.7568" stroke="var(--text)" stroke-width="1.9961" />
  <line x1="692.4273" y1="134.054" x2="808.9321" y2="196.7568" stroke="var(--text)" stroke-width="1.9961" />
  <line x1="785.6311" y1="134.054" x2="1088.5438" y2="196.7568" stroke="var(--text)" stroke-width="1.9961" />
  <rect x="40" y="196.7568" width="209.7087" height="78.3784" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="144.8544" y="250.054" text-anchor="middle" font-size="20.8062" font-family="Arial, sans-serif" fill="var(--primary-text)">/bin</text>
  <rect x="331.2621" y="196.7568" width="209.7087" height="78.3784" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="436.1165" y="250.054" text-anchor="middle" font-size="20.8062" font-family="Arial, sans-serif" fill="var(--info-text)">/etc</text>
  <rect x="564.2719" y="196.7568" width="209.7087" height="78.3784" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="669.1263" y="250.054" text-anchor="middle" font-size="20.8062" font-family="Arial, sans-serif" fill="var(--ok-text)">/home</text>
  <rect x="797.2816" y="196.7568" width="209.7087" height="78.3784" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="902.136" y="250.054" text-anchor="middle" font-size="20.8062" font-family="Arial, sans-serif" fill="var(--primary-text)">/usr</text>
  <rect x="1030.2913" y="196.7568" width="209.7087" height="78.3784" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1135.1457" y="250.054" text-anchor="middle" font-size="20.8062" font-family="Arial, sans-serif" fill="var(--danger-text)">/var</text>
  <line x1="669.1263" y1="275.1352" x2="552.6214" y2="337.8378" stroke="var(--text)" stroke-width="1.9961" />
  <line x1="669.1263" y1="275.1352" x2="785.6311" y2="337.8378" stroke="var(--text)" stroke-width="1.9961" />
  <rect x="436.1165" y="337.8378" width="233.0097" height="68.973" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="552.6214" y="384.8648" text-anchor="middle" font-size="20.8062" font-family="Arial, sans-serif" fill="var(--ok-text)">/home/alice</text>
  <rect x="692.4273" y="337.8378" width="233.0097" height="68.973" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="808.9321" y="384.8648" text-anchor="middle" font-size="20.8062" font-family="Arial, sans-serif" fill="var(--ok-text)">/home/bob</text>
  <rect x="40" y="463.2432" width="1188.3496" height="156.7568" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="622.5243" y="516.5405" text-anchor="middle" font-size="20.8062" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Filesystem Hierarchy Standard (FHS)</text>
  <text x="622.5243" y="572.973" text-anchor="middle" font-size="20.8062" font-family="Arial, sans-serif" fill="var(--warn-text)">/bin:cmds  /etc:config  /home:users  /usr:programs  /var:logs,data</text>
</svg>
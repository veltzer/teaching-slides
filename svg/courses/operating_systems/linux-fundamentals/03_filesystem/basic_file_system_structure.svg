<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="479.0643" y="16.8421" width="239.5322" height="101.0526" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="598.8304" y="84.2105" text-anchor="middle" font-size="23.9532" font-weight="bold">/ (root)</text>
  <line x1="459.1033" y1="117.8947" x2="199.6101" y2="185.2632" stroke="var(--text)" stroke-width="1.9961" />
  <line x1="538.9474" y1="117.8947" x2="439.1423" y2="185.2632" stroke="var(--text)" stroke-width="1.9961" />
  <line x1="598.8304" y1="117.8947" x2="598.8304" y2="185.2632" stroke="var(--text)" stroke-width="1.9961" />
  <line x1="658.7135" y1="117.8947" x2="758.5185" y2="185.2632" stroke="var(--text)" stroke-width="1.9961" />
  <line x1="738.5575" y1="117.8947" x2="998.0507" y2="185.2632" stroke="var(--text)" stroke-width="1.9961" />
  <rect x="99.8051" y="185.2632" width="179.6491" height="84.2105" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="189.6297" y="242.5263" text-anchor="middle" font-size="19.961">/bin</text>
  <rect x="349.3177" y="185.2632" width="179.6491" height="84.2105" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="439.1423" y="242.5263" text-anchor="middle" font-size="19.961">/etc</text>
  <rect x="548.9279" y="185.2632" width="179.6491" height="84.2105" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="638.7525" y="242.5263" text-anchor="middle" font-size="19.961">/home</text>
  <rect x="748.538" y="185.2632" width="179.6491" height="84.2105" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="838.3626" y="242.5263" text-anchor="middle" font-size="19.961">/usr</text>
  <rect x="948.1481" y="185.2632" width="179.6491" height="84.2105" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="1037.9727" y="242.5263" text-anchor="middle" font-size="19.961">/var</text>
  <line x1="638.7525" y1="269.4737" x2="538.9474" y2="336.8421" stroke="var(--text)" stroke-width="1.9961" />
  <line x1="638.7525" y1="269.4737" x2="738.5575" y2="336.8421" stroke="var(--text)" stroke-width="1.9961" />
  <rect x="439.1423" y="336.8421" width="199.6101" height="74.1053" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="538.9474" y="387.3684" text-anchor="middle" font-size="19.961">/home/alice</text>
  <rect x="658.7135" y="336.8421" width="199.6101" height="74.1053" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="758.5185" y="387.3684" text-anchor="middle" font-size="19.961">/home/bob</text>
  <rect x="99.8051" y="471.5789" width="1018.0117" height="168.4211" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="598.8304" y="528.8421" text-anchor="middle" font-size="19.961" font-weight="bold">Filesystem Hierarchy Standard (FHS)</text>
  <text x="598.8304" y="589.4737" text-anchor="middle" font-size="19.961">/bin:cmds  /etc:config  /home:users  /usr:programs  /var:logs,data</text>
</svg>
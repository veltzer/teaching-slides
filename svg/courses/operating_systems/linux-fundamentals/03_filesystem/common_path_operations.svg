  <ns0:text x="615.015" y="525.8378" text-anchor="middle" font-size="20.5005" font-weight="bold">Path variable manipulation in bash:</ns0:text>
  <ns0:text x="615.015" y="595.027" text-anchor="middle" font-family="monospace" font-size="20.5005">${path%/*} (dirname)  |  ${path##*/} (basename)</ns0:text>

<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:rect x="102.5025" y="34.5946" width="1025.0251" height="138.3784" fill="#e8f5e9" stroke="#333" stroke-width="4.1001" rx="10.2503" />
  <ns0:text x="615.015" y="86.4865" text-anchor="middle" font-size="22.5506" font-weight="bold">Home Directory Structure</ns0:text>
  <ns0:text x="615.015" y="145.2973" text-anchor="middle" font-family="monospace" font-size="20.5005">/home/username  or  ~  or  $HOME</ns0:text>
  <ns0:rect x="102.5025" y="224.8649" width="307.5075" height="138.3784" fill="#e3f2fd" stroke="#333" stroke-width="2.05" rx="6.1502" />
  <ns0:text x="256.2563" y="276.7568" text-anchor="middle" font-size="20.5005" font-weight="bold">~/Documents</ns0:text>
  <ns0:text x="256.2563" y="332.1081" text-anchor="middle" font-size="20.5005" fill="#666">personal files</ns0:text>
  <ns0:rect x="451.011" y="224.8649" width="307.5075" height="138.3784" fill="#f3e5f5" stroke="#333" stroke-width="2.05" rx="6.1502" />
  <ns0:text x="604.7647" y="276.7568" text-anchor="middle" font-size="20.5005" font-weight="bold">~/.bashrc</ns0:text>
  <ns0:text x="604.7647" y="332.1081" text-anchor="middle" font-size="20.5005" fill="#666">shell config (hidden)</ns0:text>
  <ns0:rect x="799.5195" y="224.8649" width="328.008" height="138.3784" fill="#fff3e0" stroke="#333" stroke-width="2.05" rx="6.1502" />
  <ns0:text x="963.5236" y="276.7568" text-anchor="middle" font-size="20.5005" font-weight="bold">~/.ssh/</ns0:text>
  <ns0:text x="963.5236" y="332.1081" text-anchor="middle" font-size="20.5005" fill="#666">SSH keys (mode 700)</ns0:text>
  <ns0:rect x="102.5025" y="415.1351" width="1025.0251" height="224.8649" fill="#ffebee" stroke="#333" stroke-width="2.05" rx="6.1502" />
  <ns0:text x="615.015" y="473.9459" text-anchor="middle" font-size="20.5005" font-weight="bold">Dot Files (Hidden) - shown with ls -a</ns0:text>
  <ns0:text x="615.015" y="536.2162" text-anchor="middle" font-size="20.5005">.profile  .bash_history  .config/  .local/</ns0:text>
  <ns0:text x="615.015" y="598.4865" text-anchor="middle" font-size="20.5005" fill="#666">root's home: /root (not /home/root)</ns0:text>
</ns0:svg>
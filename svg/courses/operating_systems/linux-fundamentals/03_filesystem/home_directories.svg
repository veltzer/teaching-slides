<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="106.6667" y="36" width="1066.6667" height="144" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="90" text-anchor="middle" font-size="23.4667" font-weight="bold">Home Directory Structure</text>
  <text x="640" y="151.2" text-anchor="middle" font-family="monospace" font-size="21.3333">/home/username  or  ~  or  $HOME</text>
  <rect x="106.6667" y="234" width="320" height="144" fill="#e3f2fd" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="266.6667" y="288" text-anchor="middle" font-size="21.3333" font-weight="bold">~/Documents</text>
  <text x="266.6667" y="345.6" text-anchor="middle" font-size="21.3333" fill="#666">personal files</text>
  <rect x="469.3333" y="234" width="320" height="144" fill="#f3e5f5" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="629.3333" y="288" text-anchor="middle" font-size="21.3333" font-weight="bold">~/.bashrc</text>
  <text x="629.3333" y="345.6" text-anchor="middle" font-size="21.3333" fill="#666">shell config (hidden)</text>
  <rect x="832" y="234" width="341.3333" height="144" fill="#fff3e0" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="1002.6667" y="288" text-anchor="middle" font-size="21.3333" font-weight="bold">~/.ssh/</text>
  <text x="1002.6667" y="345.6" text-anchor="middle" font-size="21.3333" fill="#666">SSH keys (mode 700)</text>
  <rect x="106.6667" y="432" width="1066.6667" height="234" fill="#ffebee" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="640" y="493.2" text-anchor="middle" font-size="21.3333" font-weight="bold">Dot Files (Hidden) - shown with ls -a</text>
  <text x="640" y="558" text-anchor="middle" font-size="21.3333">.profile  .bash_history  .config/  .local/</text>
  <text x="640" y="622.8" text-anchor="middle" font-size="21.3333" fill="#666">root's home: /root (not /home/root)</text>
</svg>
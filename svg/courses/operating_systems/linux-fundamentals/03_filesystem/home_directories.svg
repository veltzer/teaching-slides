  <ns0:rect x="102.5025" y="415.1351" width="1025.0251" height="224.8649" fill="#ffebee" stroke="#333" stroke-width="2.05" rx="6.1502" />
  <ns0:text x="615.015" y="473.9459" text-anchor="middle" font-size="20.5005" font-weight="bold">Dot Files (Hidden) - shown with ls -a</ns0:text>

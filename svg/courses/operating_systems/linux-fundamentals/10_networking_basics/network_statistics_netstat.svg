<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="364.2857" height="272.9412" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="222.1428" y="108.2353" text-anchor="middle" font-size="22.8959" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Active Connections</text>
  <text x="222.1428" y="169.6471" text-anchor="middle" font-size="20.8144" font-family="Arial, sans-serif" fill="var(--primary-text)">tcp  0.0.0.0:80  LISTEN</text>
  <text x="222.1428" y="217.4117" text-anchor="middle" font-size="20.8144" font-family="Arial, sans-serif" fill="var(--primary-text)">tcp  :22  ESTABLISHED</text>
  <text x="222.1428" y="265.1764" text-anchor="middle" font-size="20.8144" font-family="Arial, sans-serif" fill="var(--primary-text)">udp  0.0.0.0:53  *</text>
  <rect x="457.8571" y="40" width="364.2857" height="272.9412" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="108.2353" text-anchor="middle" font-size="22.8959" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Routing Table</text>
  <text x="640" y="169.6471" text-anchor="middle" font-size="20.8144" font-family="Arial, sans-serif" fill="var(--info-text)">0.0.0.0 -&gt; 192.168.1.1</text>
  <text x="640" y="217.4117" text-anchor="middle" font-size="20.8144" font-family="Arial, sans-serif" fill="var(--info-text)">192.168.1.0/24 dev eth0</text>
  <text x="640" y="265.1764" text-anchor="middle" font-size="20.8144" font-family="Arial, sans-serif" fill="var(--info-text)">172.17.0.0/16 dev docker0</text>
  <rect x="875.7143" y="40" width="364.2857" height="272.9412" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1057.8572" y="108.2353" text-anchor="middle" font-size="22.8959" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Statistics</text>
  <text x="1057.8572" y="169.6471" text-anchor="middle" font-size="20.8144" font-family="Arial, sans-serif" fill="var(--ok-text)">TCP: 15 active</text>
  <text x="1057.8572" y="217.4117" text-anchor="middle" font-size="20.8144" font-family="Arial, sans-serif" fill="var(--ok-text)">UDP: 3 active</text>
  <text x="1057.8572" y="265.1764" text-anchor="middle" font-size="20.8144" font-family="Arial, sans-serif" fill="var(--ok-text)">ICMP: 0 errors</text>
  <rect x="211.4285" y="415.2941" width="857.1429" height="204.7059" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="490.3529" text-anchor="middle" font-size="24.9774" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">netstat / ss</text>
  <text x="640" y="558.5882" text-anchor="middle" font-size="20.8144" font-family="Arial, sans-serif" fill="var(--warn-text)">-t (TCP) | -u (UDP) | -l (listening) | -r (routes) | -s (stats)</text>
</svg>

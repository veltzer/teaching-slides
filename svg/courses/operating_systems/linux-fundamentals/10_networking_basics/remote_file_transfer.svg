  <text x="164.004" y="214.4865" text-anchor="middle" font-size="22.5506" font-weight="bold">Local Host</text>
  <text x="164.004" y="269.8378" text-anchor="middle" font-size="20.5005">file.txt</text>
  <rect x="492.012" y="51.8919" width="246.006" height="155.6757" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />

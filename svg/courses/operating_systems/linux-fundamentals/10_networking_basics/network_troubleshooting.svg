<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="192.8571" height="181.25" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="136.4286" y="119.75" text-anchor="middle" font-size="21.455" font-weight="bold">Local</text>
  <text x="136.4286" y="170.5" text-anchor="middle" font-size="21.455">ping</text>
  <rect x="286.4285" y="40" width="192.8571" height="181.25" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="382.8571" y="119.75" text-anchor="middle" font-size="21.455" font-weight="bold">Router 1</text>
  <text x="382.8571" y="170.5" text-anchor="middle" font-size="21.455">hop 1</text>
  <rect x="532.857" y="40" width="192.8571" height="181.25" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="629.2857" y="119.75" text-anchor="middle" font-size="21.455" font-weight="bold">Router 2</text>
  <text x="629.2857" y="170.5" text-anchor="middle" font-size="21.455">hop 2</text>
  <rect x="779.2857" y="40" width="192.8571" height="181.25" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="875.7143" y="119.75" text-anchor="middle" font-size="21.455" font-weight="bold">Router 3</text>
  <text x="875.7143" y="170.5" text-anchor="middle" font-size="21.455">hop 3</text>
  <rect x="1025.7143" y="40" width="214.2857" height="181.25" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1132.8572" y="119.75" text-anchor="middle" font-size="21.455" font-weight="bold">Destination</text>
  <text x="1132.8572" y="170.5" text-anchor="middle" font-size="21.455">google.com</text>
  <line x1="232.8571" y1="130.625" x2="286.4285" y2="130.625" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd8_09_networking_basics)" />
  <line x1="479.2857" y1="130.625" x2="532.857" y2="130.625" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd8_09_networking_basics)" />
  <line x1="725.7143" y1="130.625" x2="779.2857" y2="130.625" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd8_09_networking_basics)" />
  <line x1="972.1429" y1="130.625" x2="1025.7143" y2="130.625" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd8_09_networking_basics)" />
  <rect x="104.2856" y="293.75" width="1071.4287" height="108.75" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="366.25" text-anchor="middle" font-size="21.455">traceroute: shows each hop with latency (ms)</text>
  <rect x="104.2856" y="456.875" width="514.2857" height="163.125" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="361.4285" y="529.375" text-anchor="middle" font-size="21.455" font-weight="bold">ping / traceroute</text>
  <text x="361.4285" y="583.75" text-anchor="middle" font-size="21.455">ICMP echo, TTL probing</text>
  <rect x="661.4285" y="456.875" width="514.2857" height="163.125" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="918.5714" y="529.375" text-anchor="middle" font-size="21.455" font-weight="bold">dig / nslookup</text>
  <text x="918.5714" y="583.75" text-anchor="middle" font-size="21.455">DNS resolution debugging</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd8_09_networking_basics" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
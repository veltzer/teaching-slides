  <line x1="231.7696" y1="160" x2="284.4444" y2="160" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd8_09_networking_basics)" />
  <line x1="474.0741" y1="160" x2="526.7489" y2="160" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd8_09_networking_basics)" />
  <line x1="716.3786" y1="160" x2="769.0535" y2="160" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd8_09_networking_basics)" />
  <line x1="958.6832" y1="160" x2="1011.358" y2="160" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd8_09_networking_basics)" />

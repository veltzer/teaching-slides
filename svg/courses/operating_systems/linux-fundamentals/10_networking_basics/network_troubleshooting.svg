<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="192.8571" height="181.25" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="136.4286" y="119.75" text-anchor="middle" font-size="21.455" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Local</text>
  <text x="136.4286" y="170.5" text-anchor="middle" font-size="21.455" font-family="Arial, sans-serif" fill="var(--primary-text)">ping</text>
  <rect x="286.4285" y="40" width="192.8571" height="181.25" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="382.8571" y="119.75" text-anchor="middle" font-size="21.455" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Router 1</text>
  <text x="382.8571" y="170.5" text-anchor="middle" font-size="21.455" font-family="Arial, sans-serif" fill="var(--warn-text)">hop 1</text>
  <rect x="532.857" y="40" width="192.8571" height="181.25" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="629.2857" y="119.75" text-anchor="middle" font-size="21.455" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Router 2</text>
  <text x="629.2857" y="170.5" text-anchor="middle" font-size="21.455" font-family="Arial, sans-serif" fill="var(--info-text)">hop 2</text>
  <rect x="779.2857" y="40" width="192.8571" height="181.25" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="875.7143" y="119.75" text-anchor="middle" font-size="21.455" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Router 3</text>
  <text x="875.7143" y="170.5" text-anchor="middle" font-size="21.455" font-family="Arial, sans-serif" fill="var(--warn-text)">hop 3</text>
  <rect x="1025.7143" y="40" width="214.2857" height="181.25" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1132.8572" y="119.75" text-anchor="middle" font-size="21.455" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Destination</text>
  <text x="1132.8572" y="170.5" text-anchor="middle" font-size="21.455" font-family="Arial, sans-serif" fill="var(--ok-text)">google.com</text>
  <line x1="232.8571" y1="130.625" x2="286.4285" y2="130.625" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="479.2857" y1="130.625" x2="532.857" y2="130.625" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="725.7143" y1="130.625" x2="779.2857" y2="130.625" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="972.1429" y1="130.625" x2="1025.7143" y2="130.625" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="104.2856" y="293.75" width="1071.4287" height="108.75" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="366.25" text-anchor="middle" font-size="21.455" font-family="Arial, sans-serif" fill="var(--info-text)">traceroute: shows each hop with latency (ms)</text>
  <rect x="104.2856" y="456.875" width="514.2857" height="163.125" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="361.4285" y="529.375" text-anchor="middle" font-size="21.455" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">ping / traceroute</text>
  <text x="361.4285" y="583.75" text-anchor="middle" font-size="21.455" font-family="Arial, sans-serif" fill="var(--primary-text)">ICMP echo, TTL probing</text>
  <rect x="661.4285" y="456.875" width="514.2857" height="163.125" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="918.5714" y="529.375" text-anchor="middle" font-size="21.455" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">dig / nslookup</text>
  <text x="918.5714" y="583.75" text-anchor="middle" font-size="21.455" font-family="Arial, sans-serif" fill="var(--ok-text)">DNS resolution debugging</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

  <text x="358.1893" y="604.4444" text-anchor="middle" font-size="21.0699">ICMP echo, TTL probing</text>
  <rect x="653.1687" y="480" width="505.679" height="160" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-up" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="177.7778" y="26.6667" width="577.7778" height="80" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="466.6667" y="55.1111" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--primary-accent)">Socket API (Application Layer)</text>
  <text x="466.6667" y="75.5556" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--text-muted)">socket()  bind()  connect()  send()  recv()  close()</text>
  <text x="466.6667" y="96" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-faint)">User-space boundary — programs call these to use the network</text>
  <line x1="466.6667" y1="106.6667" x2="466.6667" y2="137.7778" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="466.6667" y1="106.6667" x2="466.6667" y2="137.7778" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="0" marker-end="url(#arrow-up)" transform="translate(30,0)" />
  <text x="435.5556" y="126.2222" font-family="sans-serif" font-size="10" fill="var(--text-faint)">syscall</text>
  <rect x="177.7778" y="140.4444" width="577.7778" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="466.6667" y="168.8889" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--ok-accent)">Transport Layer — TCP / UDP</text>
  <text x="337.7778" y="189.3333" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="var(--ok-accent)">TCP: reliable, ordered, connection</text>
  <text x="604.4444" y="189.3333" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="var(--ok-accent)">UDP: fast, stateless, datagram</text>
  <text x="466.6667" y="208.8889" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-faint)">Port numbers (0–65535) · Segments/Datagrams</text>
  <line x1="466.6667" y1="220.4444" x2="466.6667" y2="251.5556" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="493.3333" y1="251.5556" x2="493.3333" y2="220.4444" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-up)" />
  <rect x="177.7778" y="254.2222" width="577.7778" height="80" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="466.6667" y="282.6667" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--warn-accent)">Network Layer — IP</text>
  <text x="466.6667" y="303.1111" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="var(--danger-accent)">IPv4 (32-bit addr)  ·  IPv6 (128-bit addr)</text>
  <text x="466.6667" y="321.7778" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-faint)">Routing · Packets · TTL · Source/Dest IP addresses</text>
  <line x1="466.6667" y1="334.2222" x2="466.6667" y2="365.3333" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="493.3333" y1="365.3333" x2="493.3333" y2="334.2222" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-up)" />
  <rect x="177.7778" y="368" width="577.7778" height="80" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="466.6667" y="396.4444" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--info-accent)">Data Link Layer — Ethernet</text>
  <text x="466.6667" y="416.8889" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="var(--info-accent)">MAC addresses (48-bit)  ·  Frames  ·  ARP</text>
  <text x="466.6667" y="435.5556" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-faint)">eth0 / ens3 / wlan0 — Linux network interface names</text>
  <line x1="466.6667" y1="448" x2="466.6667" y2="479.1111" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="493.3333" y1="479.1111" x2="493.3333" y2="448" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-up)" />
  <rect x="177.7778" y="481.7778" width="577.7778" height="80" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="466.6667" y="510.2222" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--danger-accent)">Physical Layer — NIC / Driver</text>
  <text x="466.6667" y="530.6667" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="var(--text)">Bits on wire (electrical / optical / radio)</text>
  <text x="466.6667" y="549.3333" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-faint)">Network card driver · sk_buff kernel structure · IRQ</text>
  <rect x="782.2222" y="26.6667" width="328.8889" height="535.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="782.2222" y="26.6667" width="328.8889" height="37.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="782.2222" y="48.8889" width="328.8889" height="15.1111" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="946.6667" y="51.5556" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="var(--bg)">Linux Tools per Layer</text>
  <text x="800" y="81.7778" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="var(--primary-accent)">Application / Socket</text>
  <text x="800" y="97.7778" font-family="monospace" font-size="11.5556" fill="var(--text)">nc  curl  wget  ssh  ping</text>
  <text x="800" y="113.7778" font-family="monospace" font-size="11.5556" fill="var(--text)">ss -tlnp   netstat -an</text>
  <line x1="800" y1="124.4444" x2="1093.3333" y2="124.4444" stroke="var(--border)" stroke-width="0.8889" />
  <text x="800" y="144" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="var(--ok-accent)">Transport — TCP/UDP</text>
  <text x="800" y="160" font-family="monospace" font-size="11.5556" fill="var(--text)">ss -s   netstat -s</text>
  <text x="800" y="176" font-family="monospace" font-size="11.5556" fill="var(--text)">iptables  nftables  ufw</text>
  <line x1="800" y1="186.6667" x2="1093.3333" y2="186.6667" stroke="var(--border)" stroke-width="0.8889" />
  <text x="800" y="206.2222" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="var(--warn-accent)">Network — IP</text>
  <text x="800" y="222.2222" font-family="monospace" font-size="11.5556" fill="var(--text)">ip addr   ip route   ping</text>
  <text x="800" y="238.2222" font-family="monospace" font-size="11.5556" fill="var(--text)">traceroute  dig  nslookup</text>
  <line x1="800" y1="248.8889" x2="1093.3333" y2="248.8889" stroke="var(--border)" stroke-width="0.8889" />
  <text x="800" y="268.4444" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="var(--info-accent)">Data Link — Ethernet</text>
  <text x="800" y="284.4444" font-family="monospace" font-size="11.5556" fill="var(--text)">ip link   arp   arping</text>
  <text x="800" y="300.4444" font-family="monospace" font-size="11.5556" fill="var(--text)">bridge   ethtool</text>
  <line x1="800" y1="311.1111" x2="1093.3333" y2="311.1111" stroke="var(--border)" stroke-width="0.8889" />
  <text x="800" y="330.6667" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="var(--danger-accent)">Physical / Driver</text>
  <text x="800" y="346.6667" font-family="monospace" font-size="11.5556" fill="var(--text)">ethtool -i eth0</text>
  <text x="800" y="362.6667" font-family="monospace" font-size="11.5556" fill="var(--text)">lspci | grep -i net</text>
  <text x="800" y="378.6667" font-family="monospace" font-size="11.5556" fill="var(--text)">dmesg | grep eth</text>
  <line x1="800" y1="391.1111" x2="1093.3333" y2="391.1111" stroke="var(--border)" stroke-width="0.8889" />
  <text x="800" y="410.6667" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="var(--primary-accent)">Capture (any layer)</text>
  <text x="800" y="426.6667" font-family="monospace" font-size="11.5556" fill="var(--text)">tcpdump -i eth0</text>
  <text x="800" y="442.6667" font-family="monospace" font-size="11.5556" fill="var(--text)">wireshark</text>
  <text x="800" y="458.6667" font-family="monospace" font-size="11.5556" fill="var(--text)">tshark -i eth0 -f "tcp"</text>
  <line x1="800" y1="471.1111" x2="1093.3333" y2="471.1111" stroke="var(--border)" stroke-width="0.8889" />
  <text x="800" y="490.6667" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="var(--text-muted)">Configuration files</text>
  <text x="800" y="506.6667" font-family="monospace" font-size="10.6667" fill="var(--text)">/etc/network/interfaces</text>
  <text x="800" y="522.6667" font-family="monospace" font-size="10.6667" fill="var(--text)">/etc/netplan/*.yaml</text>
  <text x="800" y="538.6667" font-family="monospace" font-size="10.6667" fill="var(--text)">/etc/resolv.conf  (DNS)</text>
  <text x="800" y="554.6667" font-family="monospace" font-size="10.6667" fill="var(--text)">/etc/hosts  (static names)</text>
  <text x="75.5556" y="57.7778" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)" transform="rotate(-90,85,65)">— User space —</text>
  <text x="75.5556" y="337.7778" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)" transform="rotate(-90,85,380)">— Kernel space —</text>
  <text x="568.8889" y="586.6667" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Data travels DOWN the stack when sending (encapsulation) and UP when receiving (decapsulation).</text>
</svg>
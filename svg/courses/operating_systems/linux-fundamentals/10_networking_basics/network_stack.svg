<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-up" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="227.5" y="64.1667" width="609.375" height="72.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="532.1875" y="89.9444" text-anchor="middle" font-family="sans-serif" font-size="17.3806" font-weight="bold" fill="var(--primary-accent)">Socket API (Application Layer)</text>
  <text x="532.1875" y="108.4723" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--text-muted)">socket()  bind()  connect()  send()  recv()  close()</text>
  <text x="532.1875" y="127" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--text-faint)">User-space boundary — programs call these to use the network</text>
  <line x1="532.1875" y1="136.6667" x2="532.1875" y2="164.8611" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="532.1875" y1="136.6667" x2="532.1875" y2="164.8611" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="0" marker-end="url(#arrow-up)" transform="translate(30,0)" />
  <text x="499.375" y="154.3889" font-family="sans-serif" font-size="10" fill="var(--text-faint)">syscall</text>
  <rect x="227.5" y="167.2777" width="609.375" height="72.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="532.1875" y="193.0556" text-anchor="middle" font-family="sans-serif" font-size="17.3806" font-weight="bold" fill="var(--ok-accent)">Transport Layer — TCP / UDP</text>
  <text x="396.25" y="211.5833" text-anchor="middle" font-family="monospace" font-size="12.1663" fill="var(--ok-accent)">TCP: reliable, ordered, connection</text>
  <text x="677.4999" y="211.5833" text-anchor="middle" font-family="monospace" font-size="12.1663" fill="var(--ok-accent)">UDP: fast, stateless, datagram</text>
  <text x="532.1875" y="229.3056" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--text-faint)">Port numbers (0–65535) · Segments/Datagrams</text>
  <line x1="532.1875" y1="239.7777" x2="532.1875" y2="267.9723" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="560.3125" y1="267.9723" x2="560.3125" y2="239.7777" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-up)" />
  <rect x="227.5" y="270.3889" width="609.375" height="72.5" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="532.1875" y="296.1667" text-anchor="middle" font-family="sans-serif" font-size="17.3806" font-weight="bold" fill="var(--warn-accent)">Network Layer — IP</text>
  <text x="532.1875" y="314.6944" text-anchor="middle" font-family="monospace" font-size="12.1663" fill="var(--danger-accent)">IPv4 (32-bit addr)  ·  IPv6 (128-bit addr)</text>
  <text x="532.1875" y="331.6111" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--text-faint)">Routing · Packets · TTL · Source/Dest IP addresses</text>
  <line x1="532.1875" y1="342.8889" x2="532.1875" y2="371.0833" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="560.3125" y1="371.0833" x2="560.3125" y2="342.8889" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-up)" />
  <rect x="227.5" y="373.5" width="609.375" height="72.5" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="532.1875" y="399.2777" text-anchor="middle" font-family="sans-serif" font-size="17.3806" font-weight="bold" fill="var(--info-accent)">Data Link Layer — Ethernet</text>
  <text x="532.1875" y="417.8056" text-anchor="middle" font-family="monospace" font-size="12.1663" fill="var(--info-accent)">MAC addresses (48-bit)  ·  Frames  ·  ARP</text>
  <text x="532.1875" y="434.7223" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--text-faint)">eth0 / ens3 / wlan0 — Linux network interface names</text>
  <line x1="532.1875" y1="446" x2="532.1875" y2="474.1944" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="560.3125" y1="474.1944" x2="560.3125" y2="446" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-up)" />
  <rect x="227.5" y="476.6111" width="609.375" height="72.5" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="532.1875" y="502.3889" text-anchor="middle" font-family="sans-serif" font-size="17.3806" font-weight="bold" fill="var(--danger-accent)">Physical Layer — NIC / Driver</text>
  <text x="532.1875" y="520.9167" text-anchor="middle" font-family="monospace" font-size="12.1663" fill="var(--text)">Bits on wire (electrical / optical / radio)</text>
  <text x="532.1875" y="537.8333" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--text-faint)">Network card driver · sk_buff kernel structure · IRQ</text>
  <rect x="865" y="64.1667" width="346.875" height="484.9444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="865" y="64.1667" width="346.875" height="33.8333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="865" y="84.3056" width="346.875" height="13.6944" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1038.4375" y="86.7223" text-anchor="middle" font-family="sans-serif" font-size="13.9044" font-weight="bold" fill="var(--bg)">Linux Tools per Layer</text>
  <text x="883.75" y="114.1111" font-family="sans-serif" font-size="12.1663" font-weight="bold" fill="var(--primary-accent)">Application / Socket</text>
  <text x="883.75" y="128.6111" font-family="monospace" font-size="11.2974" fill="var(--text)">nc  curl  wget  ssh  ping</text>
  <text x="883.75" y="143.1111" font-family="monospace" font-size="11.2974" fill="var(--text)">ss -tlnp   netstat -an</text>
  <line x1="883.75" y1="152.7777" x2="1193.1249" y2="152.7777" stroke="var(--border)" stroke-width="0.8889" />
  <text x="883.75" y="170.5" font-family="sans-serif" font-size="12.1663" font-weight="bold" fill="var(--ok-accent)">Transport — TCP/UDP</text>
  <text x="883.75" y="185" font-family="monospace" font-size="11.2974" fill="var(--text)">ss -s   netstat -s</text>
  <text x="883.75" y="199.5" font-family="monospace" font-size="11.2974" fill="var(--text)">iptables  nftables  ufw</text>
  <line x1="883.75" y1="209.1667" x2="1193.1249" y2="209.1667" stroke="var(--border)" stroke-width="0.8889" />
  <text x="883.75" y="226.8889" font-family="sans-serif" font-size="12.1663" font-weight="bold" fill="var(--warn-accent)">Network — IP</text>
  <text x="883.75" y="241.3889" font-family="monospace" font-size="11.2974" fill="var(--text)">ip addr   ip route   ping</text>
  <text x="883.75" y="255.8889" font-family="monospace" font-size="11.2974" fill="var(--text)">traceroute  dig  nslookup</text>
  <line x1="883.75" y1="265.5556" x2="1193.1249" y2="265.5556" stroke="var(--border)" stroke-width="0.8889" />
  <text x="883.75" y="283.2777" font-family="sans-serif" font-size="12.1663" font-weight="bold" fill="var(--info-accent)">Data Link — Ethernet</text>
  <text x="883.75" y="297.7777" font-family="monospace" font-size="11.2974" fill="var(--text)">ip link   arp   arping</text>
  <text x="883.75" y="312.2777" font-family="monospace" font-size="11.2974" fill="var(--text)">bridge   ethtool</text>
  <line x1="883.75" y1="321.9444" x2="1193.1249" y2="321.9444" stroke="var(--border)" stroke-width="0.8889" />
  <text x="883.75" y="339.6667" font-family="sans-serif" font-size="12.1663" font-weight="bold" fill="var(--danger-accent)">Physical / Driver</text>
  <text x="883.75" y="354.1667" font-family="monospace" font-size="11.2974" fill="var(--text)">ethtool -i eth0</text>
  <text x="883.75" y="368.6667" font-family="monospace" font-size="11.2974" fill="var(--text)">lspci | grep -i net</text>
  <text x="883.75" y="383.1667" font-family="monospace" font-size="11.2974" fill="var(--text)">dmesg | grep eth</text>
  <line x1="883.75" y1="394.4444" x2="1193.1249" y2="394.4444" stroke="var(--border)" stroke-width="0.8889" />
  <text x="883.75" y="412.1667" font-family="sans-serif" font-size="12.1663" font-weight="bold" fill="var(--primary-accent)">Capture (any layer)</text>
  <text x="883.75" y="426.6667" font-family="monospace" font-size="11.2974" fill="var(--text)">tcpdump -i eth0</text>
  <text x="883.75" y="441.1667" font-family="monospace" font-size="11.2974" fill="var(--text)">wireshark</text>
  <text x="883.75" y="455.6667" font-family="monospace" font-size="11.2974" fill="var(--text)">tshark -i eth0 -f "tcp"</text>
  <line x1="883.75" y1="466.9444" x2="1193.1249" y2="466.9444" stroke="var(--border)" stroke-width="0.8889" />
  <text x="883.75" y="484.6667" font-family="sans-serif" font-size="12.1663" font-weight="bold" fill="var(--text-muted)">Configuration files</text>
  <text x="883.75" y="499.1667" font-family="monospace" font-size="10.4284" fill="var(--text)">/etc/network/interfaces</text>
  <text x="883.75" y="513.6667" font-family="monospace" font-size="10.4284" fill="var(--text)">/etc/netplan/*.yaml</text>
  <text x="883.75" y="528.1667" font-family="monospace" font-size="10.4284" fill="var(--text)">/etc/resolv.conf  (DNS)</text>
  <text x="883.75" y="542.6667" font-family="monospace" font-size="10.4284" fill="var(--text)">/etc/hosts  (static names)</text>
  <text x="119.6875" y="92.3611" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)" transform="rotate(-90,85,65)">— User space —</text>
  <text x="119.6875" y="346.1111" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)" transform="rotate(-90,85,380)">— Kernel space —</text>
  <text x="640" y="571.6667" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">Data travels DOWN the stack when sending (encapsulation) and UP when receiving (decapsulation).</text>
</svg>
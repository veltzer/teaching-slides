<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-up" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
  </defs>
  <rect x="40" y="40" width="742.857143" height="82.857143" rx="7.082027" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="411.428571" y="69.460229" text-anchor="middle" font-family="sans-serif" font-size="20.514979" font-weight="bold" fill="var(--primary-accent)">Socket API (Application Layer)</text>
  <text x="411.428571" y="90.634971" text-anchor="middle" font-family="monospace" font-size="15.386175" fill="var(--text-muted)">socket()  bind()  connect()  send()  recv()  close()</text>
  <text x="411.428571" y="111.809486" text-anchor="middle" font-family="sans-serif" font-size="13.334748" fill="var(--text-faint)">User-space boundary — programs call these to use the network</text>
  <line x1="411.428571" y1="122.857143" x2="411.428571" y2="155.079314" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="411.428571" y1="122.857143" x2="411.428571" y2="155.079314" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="0" marker-end="url(#arrow-up)" transform="translate(30,0)" />
  <text x="371.428571" y="143.111086" font-family="sans-serif" font-size="11.803378" fill="var(--text-faint)">syscall</text>
  <rect x="40" y="157.841143" width="742.857143" height="82.857143" rx="7.082027" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="411.428571" y="187.3016" text-anchor="middle" font-family="sans-serif" font-size="20.514979" font-weight="bold" fill="var(--ok-accent)">Transport Layer — TCP / UDP</text>
  <text x="245.714286" y="208.476114" text-anchor="middle" font-family="monospace" font-size="14.360344" fill="var(--ok-accent)">TCP: reliable, ordered, connection</text>
  <text x="588.571307" y="208.476114" text-anchor="middle" font-family="monospace" font-size="14.360344" fill="var(--ok-accent)">UDP: fast, stateless, datagram</text>
  <text x="411.428571" y="228.730171" text-anchor="middle" font-family="sans-serif" font-size="13.334748" fill="var(--text-faint)">Port numbers (0–65535) · Segments/Datagrams</text>
  <line x1="411.428571" y1="240.698286" x2="411.428571" y2="272.920686" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="445.714286" y1="272.920686" x2="445.714286" y2="240.698286" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-up)" />
  <rect x="40" y="275.682514" width="742.857143" height="82.857143" rx="7.082027" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="411.428571" y="305.142857" text-anchor="middle" font-family="sans-serif" font-size="20.514979" font-weight="bold" fill="var(--warn-accent)">Network Layer — IP</text>
  <text x="411.428571" y="326.317371" text-anchor="middle" font-family="monospace" font-size="14.360344" fill="var(--danger-accent)">IPv4 (32-bit addr)  ·  IPv6 (128-bit addr)</text>
  <text x="411.428571" y="345.650743" text-anchor="middle" font-family="sans-serif" font-size="13.334748" fill="var(--text-faint)">Routing · Packets · TTL · Source/Dest IP addresses</text>
  <line x1="411.428571" y1="358.539657" x2="411.428571" y2="390.761829" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="445.714286" y1="390.761829" x2="445.714286" y2="358.539657" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-up)" />
  <rect x="40" y="393.523771" width="742.857143" height="82.857143" rx="7.082027" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="411.428571" y="422.984" text-anchor="middle" font-family="sans-serif" font-size="20.514979" font-weight="bold" fill="var(--info-accent)">Data Link Layer — Ethernet</text>
  <text x="411.428571" y="444.158743" text-anchor="middle" font-family="monospace" font-size="14.360344" fill="var(--info-accent)">MAC addresses (48-bit)  ·  Frames  ·  ARP</text>
  <text x="411.428571" y="463.492114" text-anchor="middle" font-family="sans-serif" font-size="13.334748" fill="var(--text-faint)">eth0 / ens3 / wlan0 — Linux network interface names</text>
  <line x1="411.428571" y1="476.380914" x2="411.428571" y2="508.603086" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="445.714286" y1="508.603086" x2="445.714286" y2="476.380914" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-up)" />
  <rect x="40" y="511.365029" width="742.857143" height="82.857143" rx="7.082027" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="411.428571" y="540.825371" text-anchor="middle" font-family="sans-serif" font-size="20.514979" font-weight="bold" fill="var(--danger-accent)">Physical Layer — NIC / Driver</text>
  <text x="411.428571" y="562" text-anchor="middle" font-family="monospace" font-size="14.360344" fill="var(--text)">Bits on wire (electrical / optical / radio)</text>
  <text x="411.428571" y="581.333257" text-anchor="middle" font-family="sans-serif" font-size="13.334748" fill="var(--text-faint)">Network card driver · sk_buff kernel structure · IRQ</text>
  <rect x="817.142857" y="40" width="422.857143" height="554.222171" rx="7.082027" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="817.142857" y="40" width="422.857143" height="38.666629" rx="7.082027" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="817.142857" y="63.015886" width="422.857143" height="15.650743" fill="var(--primary-fill)" rx="7.082027" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1028.571429" y="65.777829" text-anchor="middle" font-family="sans-serif" font-size="16.411889" font-weight="bold" fill="var(--bg)">Linux Tools per Layer</text>
  <text x="840" y="97.079314" font-family="sans-serif" font-size="14.360344" font-weight="bold" fill="var(--primary-accent)">Application / Socket</text>
  <text x="840" y="113.650743" font-family="monospace" font-size="13.334748" fill="var(--text)">nc  curl  wget  ssh  ping</text>
  <text x="840" y="130.222171" font-family="monospace" font-size="13.334748" fill="var(--text)">ss -tlnp   netstat -an</text>
  <line x1="840" y1="141.269714" x2="1217.142735" y2="141.269714" stroke="var(--border)" stroke-width="0.8889" />
  <text x="840" y="161.523771" font-family="sans-serif" font-size="14.360344" font-weight="bold" fill="var(--ok-accent)">Transport — TCP/UDP</text>
  <text x="840" y="178.0952" font-family="monospace" font-size="13.334748" fill="var(--text)">ss -s   netstat -s</text>
  <text x="840" y="194.666629" font-family="monospace" font-size="13.334748" fill="var(--text)">iptables  nftables  ufw</text>
  <line x1="840" y1="205.714286" x2="1217.142735" y2="205.714286" stroke="var(--border)" stroke-width="0.8889" />
  <text x="840" y="225.968229" font-family="sans-serif" font-size="14.360344" font-weight="bold" fill="var(--warn-accent)">Network — IP</text>
  <text x="840" y="242.539657" font-family="monospace" font-size="13.334748" fill="var(--text)">ip addr   ip route   ping</text>
  <text x="840" y="259.111086" font-family="monospace" font-size="13.334748" fill="var(--text)">traceroute  dig  nslookup</text>
  <line x1="840" y1="270.158743" x2="1217.142735" y2="270.158743" stroke="var(--border)" stroke-width="0.8889" />
  <text x="840" y="290.412571" font-family="sans-serif" font-size="14.360344" font-weight="bold" fill="var(--info-accent)">Data Link — Ethernet</text>
  <text x="840" y="306.984" font-family="monospace" font-size="13.334748" fill="var(--text)">ip link   arp   arping</text>
  <text x="840" y="323.555429" font-family="monospace" font-size="13.334748" fill="var(--text)">bridge   ethtool</text>
  <line x1="840" y1="334.603086" x2="1217.142735" y2="334.603086" stroke="var(--border)" stroke-width="0.8889" />
  <text x="840" y="354.857143" font-family="sans-serif" font-size="14.360344" font-weight="bold" fill="var(--danger-accent)">Physical / Driver</text>
  <text x="840" y="371.428571" font-family="monospace" font-size="13.334748" fill="var(--text)">ethtool -i eth0</text>
  <text x="840" y="388" font-family="monospace" font-size="13.334748" fill="var(--text)">lspci | grep -i net</text>
  <text x="840" y="404.571429" font-family="monospace" font-size="13.334748" fill="var(--text)">dmesg | grep eth</text>
  <line x1="840" y1="417.460229" x2="1217.142735" y2="417.460229" stroke="var(--border)" stroke-width="0.8889" />
  <text x="840" y="437.714286" font-family="sans-serif" font-size="14.360344" font-weight="bold" fill="var(--primary-accent)">Capture (any layer)</text>
  <text x="840" y="454.285714" font-family="monospace" font-size="13.334748" fill="var(--text)">tcpdump -i eth0</text>
  <text x="840" y="470.857143" font-family="monospace" font-size="13.334748" fill="var(--text)">wireshark</text>
  <text x="840" y="487.428571" font-family="monospace" font-size="13.334748" fill="var(--text)">tshark -i eth0 -f "tcp"</text>
  <line x1="840" y1="500.317371" x2="1217.142735" y2="500.317371" stroke="var(--border)" stroke-width="0.8889" />
  <text x="840" y="520.571429" font-family="sans-serif" font-size="14.360344" font-weight="bold" fill="var(--text-muted)">Configuration files</text>
  <text x="840" y="537.142857" font-family="monospace" font-size="12.309035" fill="var(--text)">/etc/network/interfaces</text>
  <text x="840" y="553.714286" font-family="monospace" font-size="12.309035" fill="var(--text)">/etc/netplan/*.yaml</text>
  <text x="840" y="570.285714" font-family="monospace" font-size="12.309035" fill="var(--text)">/etc/resolv.conf  (DNS)</text>
  <text x="840" y="586.857143" font-family="monospace" font-size="12.309035" fill="var(--text)">/etc/hosts  (static names)</text>
  <text x="119.6875" y="92.3611" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)" transform="rotate(-90,85,65)">— User space —</text>
  <text x="119.6875" y="346.1111" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)" transform="rotate(-90,85,380)">— Kernel space —</text>
  <text x="542.857143" y="620" text-anchor="middle" font-family="sans-serif" font-size="14.360344" fill="var(--text-muted)">Data travels DOWN the stack when sending (encapsulation) and UP when receiving (decapsulation).</text>
</svg>
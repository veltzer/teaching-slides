<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
    <ns0:marker id="arrow-up" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="var(--bg)" />
  <ns0:rect x="177.7778" y="26.6667" width="577.7778" height="80" rx="8.8889" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="2.6667" filter="url(#shadow)" />
  <ns0:text x="466.6667" y="55.1111" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--primary-dk)">Socket API (Application Layer)</ns0:text>
  <ns0:text x="466.6667" y="75.5556" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--text-muted)">socket()  bind()  connect()  send()  recv()  close()</ns0:text>
  <ns0:text x="466.6667" y="96" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-faint)">User-space boundary — programs call these to use the network</ns0:text>
  <ns0:line x1="466.6667" y1="106.6667" x2="466.6667" y2="137.7778" stroke="var(--primary-dk)" stroke-width="2.2222" marker-end="url(#arrow-primary)" />
  <ns0:line x1="466.6667" y1="106.6667" x2="466.6667" y2="137.7778" stroke="var(--ok-dk)" stroke-width="2.2222" stroke-dasharray="0" marker-end="url(#arrow-up)" transform="translate(30,0)" />
  <ns0:text x="435.5556" y="126.2222" font-family="sans-serif" font-size="10" fill="var(--text-faint)">syscall</ns0:text>
  <ns0:rect x="177.7778" y="140.4444" width="577.7778" height="80" rx="8.8889" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="2.6667" filter="url(#shadow)" />
  <ns0:text x="466.6667" y="168.8889" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--ok-dk)">Transport Layer — TCP / UDP</ns0:text>
  <ns0:text x="337.7778" y="189.3333" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="var(--ok-deep)">TCP: reliable, ordered, connection</ns0:text>
  <ns0:text x="604.4444" y="189.3333" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="var(--ok-deep)">UDP: fast, stateless, datagram</ns0:text>
  <ns0:text x="466.6667" y="208.8889" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-faint)">Port numbers (0–65535) · Segments/Datagrams</ns0:text>
  <ns0:line x1="466.6667" y1="220.4444" x2="466.6667" y2="251.5556" stroke="var(--primary-dk)" stroke-width="2.2222" marker-end="url(#arrow-primary)" />
  <ns0:line x1="493.3333" y1="251.5556" x2="493.3333" y2="220.4444" stroke="var(--ok-dk)" stroke-width="2.2222" marker-end="url(#arrow-up)" />
  <ns0:rect x="177.7778" y="254.2222" width="577.7778" height="80" rx="8.8889" fill="var(--warn-pale)" stroke="var(--warn-dk)" stroke-width="2.6667" filter="url(#shadow)" />
  <ns0:text x="466.6667" y="282.6667" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--warn-dk)">Network Layer — IP</ns0:text>
  <ns0:text x="466.6667" y="303.1111" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="var(--danger-deeper)">IPv4 (32-bit addr)  ·  IPv6 (128-bit addr)</ns0:text>
  <ns0:text x="466.6667" y="321.7778" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-faint)">Routing · Packets · TTL · Source/Dest IP addresses</ns0:text>
  <ns0:line x1="466.6667" y1="334.2222" x2="466.6667" y2="365.3333" stroke="var(--primary-dk)" stroke-width="2.2222" marker-end="url(#arrow-primary)" />
  <ns0:line x1="493.3333" y1="365.3333" x2="493.3333" y2="334.2222" stroke="var(--ok-dk)" stroke-width="2.2222" marker-end="url(#arrow-up)" />
  <ns0:rect x="177.7778" y="368" width="577.7778" height="80" rx="8.8889" fill="var(--info-pale)" stroke="var(--info-dk)" stroke-width="2.6667" filter="url(#shadow)" />
  <ns0:text x="466.6667" y="396.4444" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--info-dk)">Data Link Layer — Ethernet</ns0:text>
  <ns0:text x="466.6667" y="416.8889" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="var(--info-deep)">MAC addresses (48-bit)  ·  Frames  ·  ARP</ns0:text>
  <ns0:text x="466.6667" y="435.5556" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-faint)">eth0 / ens3 / wlan0 — Linux network interface names</ns0:text>
  <ns0:line x1="466.6667" y1="448" x2="466.6667" y2="479.1111" stroke="var(--primary-dk)" stroke-width="2.2222" marker-end="url(#arrow-primary)" />
  <ns0:line x1="493.3333" y1="479.1111" x2="493.3333" y2="448" stroke="var(--ok-dk)" stroke-width="2.2222" marker-end="url(#arrow-up)" />
  <ns0:rect x="177.7778" y="481.7778" width="577.7778" height="80" rx="8.8889" fill="var(--danger-pale3)" stroke="var(--danger-pink)" stroke-width="2.6667" filter="url(#shadow)" />
  <ns0:text x="466.6667" y="510.2222" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--danger-pink)">Physical Layer — NIC / Driver</ns0:text>
  <ns0:text x="466.6667" y="530.6667" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="var(--text-darker)">Bits on wire (electrical / optical / radio)</ns0:text>
  <ns0:text x="466.6667" y="549.3333" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-faint)">Network card driver · sk_buff kernel structure · IRQ</ns0:text>
  <ns0:rect x="782.2222" y="26.6667" width="328.8889" height="535.1111" rx="10.6667" fill="var(--surface-light)" stroke="var(--border)" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:rect x="782.2222" y="26.6667" width="328.8889" height="37.3333" rx="10.6667" fill="url(#grad-primary)" />
  <ns0:rect x="782.2222" y="48.8889" width="328.8889" height="15.1111" fill="url(#grad-primary)" />
  <ns0:text x="946.6667" y="51.5556" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="var(--bg)">Linux Tools per Layer</ns0:text>
  <ns0:text x="800" y="81.7778" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="var(--primary-dk)">Application / Socket</ns0:text>
  <ns0:text x="800" y="97.7778" font-family="monospace" font-size="11.5556" fill="var(--text)">nc  curl  wget  ssh  ping</ns0:text>
  <ns0:text x="800" y="113.7778" font-family="monospace" font-size="11.5556" fill="var(--text)">ss -tlnp   netstat -an</ns0:text>
  <ns0:line x1="800" y1="124.4444" x2="1093.3333" y2="124.4444" stroke="var(--border)" stroke-width="0.8889" />
  <ns0:text x="800" y="144" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="var(--ok-dk)">Transport — TCP/UDP</ns0:text>
  <ns0:text x="800" y="160" font-family="monospace" font-size="11.5556" fill="var(--text)">ss -s   netstat -s</ns0:text>
  <ns0:text x="800" y="176" font-family="monospace" font-size="11.5556" fill="var(--text)">iptables  nftables  ufw</ns0:text>
  <ns0:line x1="800" y1="186.6667" x2="1093.3333" y2="186.6667" stroke="var(--border)" stroke-width="0.8889" />
  <ns0:text x="800" y="206.2222" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="var(--warn-dk)">Network — IP</ns0:text>
  <ns0:text x="800" y="222.2222" font-family="monospace" font-size="11.5556" fill="var(--text)">ip addr   ip route   ping</ns0:text>
  <ns0:text x="800" y="238.2222" font-family="monospace" font-size="11.5556" fill="var(--text)">traceroute  dig  nslookup</ns0:text>
  <ns0:line x1="800" y1="248.8889" x2="1093.3333" y2="248.8889" stroke="var(--border)" stroke-width="0.8889" />
  <ns0:text x="800" y="268.4444" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="var(--info-dk)">Data Link — Ethernet</ns0:text>
  <ns0:text x="800" y="284.4444" font-family="monospace" font-size="11.5556" fill="var(--text)">ip link   arp   arping</ns0:text>
  <ns0:text x="800" y="300.4444" font-family="monospace" font-size="11.5556" fill="var(--text)">bridge   ethtool</ns0:text>
  <ns0:line x1="800" y1="311.1111" x2="1093.3333" y2="311.1111" stroke="var(--border)" stroke-width="0.8889" />
  <ns0:text x="800" y="330.6667" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="var(--danger-pink)">Physical / Driver</ns0:text>
  <ns0:text x="800" y="346.6667" font-family="monospace" font-size="11.5556" fill="var(--text)">ethtool -i eth0</ns0:text>
  <ns0:text x="800" y="362.6667" font-family="monospace" font-size="11.5556" fill="var(--text)">lspci | grep -i net</ns0:text>
  <ns0:text x="800" y="378.6667" font-family="monospace" font-size="11.5556" fill="var(--text)">dmesg | grep eth</ns0:text>
  <ns0:line x1="800" y1="391.1111" x2="1093.3333" y2="391.1111" stroke="var(--border)" stroke-width="0.8889" />
  <ns0:text x="800" y="410.6667" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="var(--primary-dk)">Capture (any layer)</ns0:text>
  <ns0:text x="800" y="426.6667" font-family="monospace" font-size="11.5556" fill="var(--text)">tcpdump -i eth0</ns0:text>
  <ns0:text x="800" y="442.6667" font-family="monospace" font-size="11.5556" fill="var(--text)">wireshark</ns0:text>
  <ns0:text x="800" y="458.6667" font-family="monospace" font-size="11.5556" fill="var(--text)">tshark -i eth0 -f "tcp"</ns0:text>
  <ns0:line x1="800" y1="471.1111" x2="1093.3333" y2="471.1111" stroke="var(--border)" stroke-width="0.8889" />
  <ns0:text x="800" y="490.6667" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="var(--text-muted)">Configuration files</ns0:text>
  <ns0:text x="800" y="506.6667" font-family="monospace" font-size="10.6667" fill="var(--text)">/etc/network/interfaces</ns0:text>
  <ns0:text x="800" y="522.6667" font-family="monospace" font-size="10.6667" fill="var(--text)">/etc/netplan/*.yaml</ns0:text>
  <ns0:text x="800" y="538.6667" font-family="monospace" font-size="10.6667" fill="var(--text)">/etc/resolv.conf  (DNS)</ns0:text>
  <ns0:text x="800" y="554.6667" font-family="monospace" font-size="10.6667" fill="var(--text)">/etc/hosts  (static names)</ns0:text>
  <ns0:text x="75.5556" y="57.7778" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)" transform="rotate(-90,85,65)">— User space —</ns0:text>
  <ns0:text x="75.5556" y="337.7778" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)" transform="rotate(-90,85,380)">— Kernel space —</ns0:text>
  <ns0:text x="568.8889" y="586.6667" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Data travels DOWN the stack when sending (encapsulation) and UP when receiving (decapsulation).</ns0:text>
</ns0:svg>
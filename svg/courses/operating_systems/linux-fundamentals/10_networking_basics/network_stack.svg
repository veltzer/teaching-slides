<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Layer stack (left column) -->
  <rect x="40" y="40" width="732.203389830508" height="107.407407407407" rx="8.360971118323" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="406.101694915254" y="77.592592592593" text-anchor="middle" font-size="20.902427795807" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Socket API</text>
  <text x="406.101694915254" y="109.814814814815" text-anchor="middle" font-size="14.631699457065" fill="var(--primary-text)" font-family="Courier New, monospace">socket bind connect send recv</text>
  <text x="406.101694915254" y="134.518518518519" text-anchor="middle" font-size="12.541456677484" fill="var(--primary-text)" font-family="Arial, sans-serif">User space</text>

  <rect x="40" y="158.148148148148" width="732.203389830508" height="107.407407407407" rx="8.360971118323" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="406.101694915254" y="195.740740740741" text-anchor="middle" font-size="20.902427795807" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Transport: TCP / UDP</text>
  <text x="406.101694915254" y="227.962962962963" text-anchor="middle" font-size="13.586578067275" fill="var(--ok-text)" font-family="Arial, sans-serif">TCP reliable | UDP datagram</text>
  <text x="406.101694915254" y="252.666666666667" text-anchor="middle" font-size="12.541456677484" fill="var(--ok-text)" font-family="Arial, sans-serif">Ports 0-65535</text>

  <rect x="40" y="276.296296296296" width="732.203389830508" height="107.407407407407" rx="8.360971118323" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="406.101694915254" y="313.888888888889" text-anchor="middle" font-size="20.902427795807" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Network: IP</text>
  <text x="406.101694915254" y="346.111111111111" text-anchor="middle" font-size="13.586578067275" fill="var(--warn-text)" font-family="Arial, sans-serif">IPv4 / IPv6</text>
  <text x="406.101694915254" y="370.814814814815" text-anchor="middle" font-size="12.541456677484" fill="var(--warn-text)" font-family="Arial, sans-serif">Routing, TTL</text>

  <rect x="40" y="394.444444444444" width="732.203389830508" height="107.407407407407" rx="8.360971118323" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="406.101694915254" y="432.037037037037" text-anchor="middle" font-size="20.902427795807" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Data Link: Ethernet</text>
  <text x="406.101694915254" y="464.259259259259" text-anchor="middle" font-size="13.586578067275" fill="var(--info-text)" font-family="Arial, sans-serif">MAC, ARP, frames</text>
  <text x="406.101694915254" y="488.962962962963" text-anchor="middle" font-size="12.541456677484" fill="var(--info-text)" font-family="Arial, sans-serif">eth0 / wlan0</text>

  <rect x="40" y="512.592592592593" width="732.203389830508" height="107.407407407407" rx="8.360971118323" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="406.101694915254" y="550.185185185185" text-anchor="middle" font-size="20.902427795807" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Physical: NIC / Driver</text>
  <text x="406.101694915254" y="582.407407407408" text-anchor="middle" font-size="13.586578067275" fill="var(--danger-text)" font-family="Arial, sans-serif">Bits on wire</text>
  <text x="406.101694915254" y="607.111111111111" text-anchor="middle" font-size="12.541456677484" fill="var(--danger-text)" font-family="Arial, sans-serif">sk_buff, IRQ</text>

  <!-- Tools column -->
  <rect x="792.542372881356" y="40" width="447.457627118644" height="580" rx="8.360971118323" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1016.271186440678" y="77.592592592593" text-anchor="middle" font-size="18.812185016227" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Linux Tools</text>

  <text x="812.881355932203" y="115.185185185185" font-size="13.586578067275" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Application</text>
  <text x="812.881355932203" y="136.666666666667" font-size="12.541456677484" fill="var(--text)" font-family="Courier New, monospace">nc curl ssh ping</text>
  <text x="812.881355932203" y="158.148148148148" font-size="12.541456677484" fill="var(--text)" font-family="Courier New, monospace">ss netstat</text>

  <text x="812.881355932203" y="190.37037037037" font-size="13.586578067275" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Transport</text>
  <text x="812.881355932203" y="211.851851851852" font-size="12.541456677484" fill="var(--text)" font-family="Courier New, monospace">iptables nftables</text>

  <text x="812.881355932203" y="244.074074074074" font-size="13.586578067275" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Network</text>
  <text x="812.881355932203" y="265.555555555556" font-size="12.541456677484" fill="var(--text)" font-family="Courier New, monospace">ip addr  ip route</text>
  <text x="812.881355932203" y="287.037037037037" font-size="12.541456677484" fill="var(--text)" font-family="Courier New, monospace">traceroute dig</text>

  <text x="812.881355932203" y="319.259259259259" font-size="13.586578067275" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Data Link</text>
  <text x="812.881355932203" y="340.740740740741" font-size="12.541456677484" fill="var(--text)" font-family="Courier New, monospace">ip link  arp  ethtool</text>

  <text x="812.881355932203" y="372.962962962963" font-size="13.586578067275" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Physical</text>
  <text x="812.881355932203" y="394.444444444444" font-size="12.541456677484" fill="var(--text)" font-family="Courier New, monospace">lspci  dmesg</text>

  <text x="812.881355932203" y="426.666666666667" font-size="13.586578067275" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Capture</text>
  <text x="812.881355932203" y="448.148148148148" font-size="12.541456677484" fill="var(--text)" font-family="Courier New, monospace">tcpdump wireshark</text>

  <text x="812.881355932203" y="480.37037037037" font-size="13.586578067275" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">Config</text>
  <text x="812.881355932203" y="501.851851851852" font-size="11.496335287694" fill="var(--text)" font-family="Courier New, monospace">/etc/netplan/*.yaml</text>
  <text x="812.881355932203" y="523.333333333333" font-size="11.496335287694" fill="var(--text)" font-family="Courier New, monospace">/etc/resolv.conf</text>
  <text x="812.881355932203" y="544.814814814815" font-size="11.496335287694" fill="var(--text)" font-family="Courier New, monospace">/etc/hosts</text>
</svg>

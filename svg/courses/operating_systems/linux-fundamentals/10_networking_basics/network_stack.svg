<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
    <ns0:marker id="arrow-up" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="177.7778" y="26.6667" width="577.7778" height="80" rx="8.8889" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.6667" filter="url(#shadow)" />
  <ns0:text x="466.6667" y="55.1111" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="#1565c0">Socket API (Application Layer)</ns0:text>
  <ns0:text x="466.6667" y="75.5556" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="#555555">socket()  bind()  connect()  send()  recv()  close()</ns0:text>
  <ns0:text x="466.6667" y="96" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="#888888">User-space boundary — programs call these to use the network</ns0:text>
  <ns0:line x1="466.6667" y1="106.6667" x2="466.6667" y2="137.7778" stroke="#1565c0" stroke-width="2.2222" marker-end="url(#arrow-primary)" />
  <ns0:line x1="466.6667" y1="106.6667" x2="466.6667" y2="137.7778" stroke="#2e7d32" stroke-width="2.2222" stroke-dasharray="0" marker-end="url(#arrow-up)" transform="translate(30,0)" />
  <ns0:text x="435.5556" y="126.2222" font-family="sans-serif" font-size="10" fill="#888888">syscall</ns0:text>
  <ns0:rect x="177.7778" y="140.4444" width="577.7778" height="80" rx="8.8889" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.6667" filter="url(#shadow)" />
  <ns0:text x="466.6667" y="168.8889" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="#2e7d32">Transport Layer — TCP / UDP</ns0:text>
  <ns0:text x="337.7778" y="189.3333" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="#1b5e20">TCP: reliable, ordered, connection</ns0:text>
  <ns0:text x="604.4444" y="189.3333" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="#1b5e20">UDP: fast, stateless, datagram</ns0:text>
  <ns0:text x="466.6667" y="208.8889" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="#888888">Port numbers (0–65535) · Segments/Datagrams</ns0:text>
  <ns0:line x1="466.6667" y1="220.4444" x2="466.6667" y2="251.5556" stroke="#1565c0" stroke-width="2.2222" marker-end="url(#arrow-primary)" />
  <ns0:line x1="493.3333" y1="251.5556" x2="493.3333" y2="220.4444" stroke="#2e7d32" stroke-width="2.2222" marker-end="url(#arrow-up)" />
  <ns0:rect x="177.7778" y="254.2222" width="577.7778" height="80" rx="8.8889" fill="#fff3e0" stroke="#e65100" stroke-width="2.6667" filter="url(#shadow)" />
  <ns0:text x="466.6667" y="282.6667" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="#e65100">Network Layer — IP</ns0:text>
  <ns0:text x="466.6667" y="303.1111" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="#bf360c">IPv4 (32-bit addr)  ·  IPv6 (128-bit addr)</ns0:text>
  <ns0:text x="466.6667" y="321.7778" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="#888888">Routing · Packets · TTL · Source/Dest IP addresses</ns0:text>
  <ns0:line x1="466.6667" y1="334.2222" x2="466.6667" y2="365.3333" stroke="#1565c0" stroke-width="2.2222" marker-end="url(#arrow-primary)" />
  <ns0:line x1="493.3333" y1="365.3333" x2="493.3333" y2="334.2222" stroke="#2e7d32" stroke-width="2.2222" marker-end="url(#arrow-up)" />
  <ns0:rect x="177.7778" y="368" width="577.7778" height="80" rx="8.8889" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2.6667" filter="url(#shadow)" />
  <ns0:text x="466.6667" y="396.4444" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="#6a1b9a">Data Link Layer — Ethernet</ns0:text>
  <ns0:text x="466.6667" y="416.8889" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="#4a148c">MAC addresses (48-bit)  ·  Frames  ·  ARP</ns0:text>
  <ns0:text x="466.6667" y="435.5556" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="#888888">eth0 / ens3 / wlan0 — Linux network interface names</ns0:text>
  <ns0:line x1="466.6667" y1="448" x2="466.6667" y2="479.1111" stroke="#1565c0" stroke-width="2.2222" marker-end="url(#arrow-primary)" />
  <ns0:line x1="493.3333" y1="479.1111" x2="493.3333" y2="448" stroke="#2e7d32" stroke-width="2.2222" marker-end="url(#arrow-up)" />
  <ns0:rect x="177.7778" y="481.7778" width="577.7778" height="80" rx="8.8889" fill="#fce4ec" stroke="#c2185b" stroke-width="2.6667" filter="url(#shadow)" />
  <ns0:text x="466.6667" y="510.2222" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="#c2185b">Physical Layer — NIC / Driver</ns0:text>
  <ns0:text x="466.6667" y="530.6667" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="#222222">Bits on wire (electrical / optical / radio)</ns0:text>
  <ns0:text x="466.6667" y="549.3333" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="#888888">Network card driver · sk_buff kernel structure · IRQ</ns0:text>
  <ns0:rect x="782.2222" y="26.6667" width="328.8889" height="535.1111" rx="10.6667" fill="#f9f9f9" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:rect x="782.2222" y="26.6667" width="328.8889" height="37.3333" rx="10.6667" fill="url(#grad-primary)" />
  <ns0:rect x="782.2222" y="48.8889" width="328.8889" height="15.1111" fill="url(#grad-primary)" />
  <ns0:text x="946.6667" y="51.5556" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="#ffffff">Linux Tools per Layer</ns0:text>
  <ns0:text x="800" y="81.7778" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="#1565c0">Application / Socket</ns0:text>
  <ns0:text x="800" y="97.7778" font-family="monospace" font-size="11.5556" fill="#212121">nc  curl  wget  ssh  ping</ns0:text>
  <ns0:text x="800" y="113.7778" font-family="monospace" font-size="11.5556" fill="#212121">ss -tlnp   netstat -an</ns0:text>
  <ns0:line x1="800" y1="124.4444" x2="1093.3333" y2="124.4444" stroke="#e0e0e0" stroke-width="0.8889" />
  <ns0:text x="800" y="144" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="#2e7d32">Transport — TCP/UDP</ns0:text>
  <ns0:text x="800" y="160" font-family="monospace" font-size="11.5556" fill="#212121">ss -s   netstat -s</ns0:text>
  <ns0:text x="800" y="176" font-family="monospace" font-size="11.5556" fill="#212121">iptables  nftables  ufw</ns0:text>
  <ns0:line x1="800" y1="186.6667" x2="1093.3333" y2="186.6667" stroke="#e0e0e0" stroke-width="0.8889" />
  <ns0:text x="800" y="206.2222" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="#e65100">Network — IP</ns0:text>
  <ns0:text x="800" y="222.2222" font-family="monospace" font-size="11.5556" fill="#212121">ip addr   ip route   ping</ns0:text>
  <ns0:text x="800" y="238.2222" font-family="monospace" font-size="11.5556" fill="#212121">traceroute  dig  nslookup</ns0:text>
  <ns0:line x1="800" y1="248.8889" x2="1093.3333" y2="248.8889" stroke="#e0e0e0" stroke-width="0.8889" />
  <ns0:text x="800" y="268.4444" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="#6a1b9a">Data Link — Ethernet</ns0:text>
  <ns0:text x="800" y="284.4444" font-family="monospace" font-size="11.5556" fill="#212121">ip link   arp   arping</ns0:text>
  <ns0:text x="800" y="300.4444" font-family="monospace" font-size="11.5556" fill="#212121">bridge   ethtool</ns0:text>
  <ns0:line x1="800" y1="311.1111" x2="1093.3333" y2="311.1111" stroke="#e0e0e0" stroke-width="0.8889" />
  <ns0:text x="800" y="330.6667" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="#c2185b">Physical / Driver</ns0:text>
  <ns0:text x="800" y="346.6667" font-family="monospace" font-size="11.5556" fill="#212121">ethtool -i eth0</ns0:text>
  <ns0:text x="800" y="362.6667" font-family="monospace" font-size="11.5556" fill="#212121">lspci | grep -i net</ns0:text>
  <ns0:text x="800" y="378.6667" font-family="monospace" font-size="11.5556" fill="#212121">dmesg | grep eth</ns0:text>
  <ns0:line x1="800" y1="391.1111" x2="1093.3333" y2="391.1111" stroke="#e0e0e0" stroke-width="0.8889" />
  <ns0:text x="800" y="410.6667" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="#1565c0">Capture (any layer)</ns0:text>
  <ns0:text x="800" y="426.6667" font-family="monospace" font-size="11.5556" fill="#212121">tcpdump -i eth0</ns0:text>
  <ns0:text x="800" y="442.6667" font-family="monospace" font-size="11.5556" fill="#212121">wireshark</ns0:text>
  <ns0:text x="800" y="458.6667" font-family="monospace" font-size="11.5556" fill="#212121">tshark -i eth0 -f "tcp"</ns0:text>
  <ns0:line x1="800" y1="471.1111" x2="1093.3333" y2="471.1111" stroke="#e0e0e0" stroke-width="0.8889" />
  <ns0:text x="800" y="490.6667" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="#555555">Configuration files</ns0:text>
  <ns0:text x="800" y="506.6667" font-family="monospace" font-size="10.6667" fill="#212121">/etc/network/interfaces</ns0:text>
  <ns0:text x="800" y="522.6667" font-family="monospace" font-size="10.6667" fill="#212121">/etc/netplan/*.yaml</ns0:text>
  <ns0:text x="800" y="538.6667" font-family="monospace" font-size="10.6667" fill="#212121">/etc/resolv.conf  (DNS)</ns0:text>
  <ns0:text x="800" y="554.6667" font-family="monospace" font-size="10.6667" fill="#212121">/etc/hosts  (static names)</ns0:text>
  <ns0:text x="75.5556" y="57.7778" font-family="sans-serif" font-size="11.5556" fill="#555555" transform="rotate(-90,85,65)">— User space —</ns0:text>
  <ns0:text x="75.5556" y="337.7778" font-family="sans-serif" font-size="11.5556" fill="#555555" transform="rotate(-90,85,380)">— Kernel space —</ns0:text>
  <ns0:text x="568.8889" y="586.6667" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#555555">Data travels DOWN the stack when sending (encapsulation) and UP when receiving (decapsulation).</ns0:text>
</ns0:svg>
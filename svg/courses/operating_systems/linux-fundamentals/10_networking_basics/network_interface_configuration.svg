<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="235.7143" height="214.8148" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="157.8571" y="134.5185" text-anchor="middle" font-size="25.693" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">eth0</text>
  <text x="157.8571" y="203.2593" text-anchor="middle" font-size="23.3572" font-family="Arial, sans-serif" fill="var(--primary-text)">192.168.1.10</text>
  <rect x="361.4286" y="40" width="235.7143" height="214.8148" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="479.2857" y="134.5185" text-anchor="middle" font-size="25.693" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">wlan0</text>
  <text x="479.2857" y="203.2593" text-anchor="middle" font-size="23.3572" font-family="Arial, sans-serif" fill="var(--info-text)">192.168.1.20</text>
  <rect x="682.8571" y="40" width="235.7143" height="214.8148" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="800.7142" y="134.5185" text-anchor="middle" font-size="25.693" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">lo</text>
  <text x="800.7142" y="203.2593" text-anchor="middle" font-size="23.3572" font-family="Arial, sans-serif" fill="var(--ok-text)">127.0.0.1</text>
  <rect x="1004.2857" y="40" width="235.7143" height="214.8148" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1122.1428" y="134.5185" text-anchor="middle" font-size="25.693" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">docker0</text>
  <text x="1122.1428" y="203.2593" text-anchor="middle" font-size="23.3572" font-family="Arial, sans-serif" fill="var(--warn-text)">172.17.0.1</text>
  <rect x="211.4285" y="426.6667" width="857.1428" height="193.3333" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="512.5926" text-anchor="middle" font-size="25.693" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Linux Kernel Network Stack</text>
  <text x="639.9999" y="577.037" text-anchor="middle" font-size="23.3572" font-family="Arial, sans-serif" fill="var(--danger-text)">ifconfig / ip addr show</text>
  <line x1="157.8571" y1="254.8148" x2="425.7143" y2="426.6667" stroke="var(--text)" stroke-width="2" />
  <line x1="479.2857" y1="254.8148" x2="586.4286" y2="426.6667" stroke="var(--text)" stroke-width="2" />
  <line x1="800.7142" y1="254.8148" x2="747.1428" y2="426.6667" stroke="var(--text)" stroke-width="2" />
  <line x1="1122.1428" y1="254.8148" x2="907.8571" y2="426.6667" stroke="var(--text)" stroke-width="2" />
</svg>
  <text x="415.0782" y="149.3333" text-anchor="middle" font-size="21.0699">ifdown</text>
  <line x1="769.0535" y1="177.7778" x2="927.0782" y2="177.7778" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrowd2_09_networking_basics)" />
  <text x="847.0123" y="149.3333" text-anchor="middle" font-size="21.0699">ifup</text>

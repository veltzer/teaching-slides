<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="28.5825" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">top: Real-Time Process Monitor</text>
  <rect x="40" y="87.7215" width="1200" height="532.2785" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <rect x="62.2222" y="124.4304" width="1155.5555" height="66.0759" fill="url(#grad-warn)" stroke="var(--warn-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <text x="84.4444" y="172.1519" font-size="21.9865" font-family="Courier New, monospace" fill="var(--warn-text)">top - 14:28:00 up 10 days, load average: 0.15, 0.22, 0.25</text>
  <rect x="62.2222" y="205.1899" width="1155.5555" height="66.0759" fill="url(#grad-ok)" stroke="var(--ok-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <text x="84.4444" y="252.9114" font-size="21.9865" font-family="Courier New, monospace" fill="var(--ok-text)">Tasks: 213 total, 1 running, 212 sleeping, 0 zombie</text>
  <rect x="62.2222" y="285.9493" width="1155.5555" height="66.0759" fill="url(#grad-warn)" stroke="var(--warn-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <text x="84.4444" y="333.6709" font-size="21.9865" font-family="Courier New, monospace" fill="var(--warn-text)">%Cpu: 2.1 us, 1.0 sy, 96.8 id    Mem: 15881M total, 7993M free</text>
  <line x1="62.2222" y1="370.3797" x2="1217.7777" y2="370.3797" stroke="var(--text)" stroke-width="2" />
  <text x="84.4444" y="421.7722" font-size="21.9865" font-weight="bold" font-family="Courier New, monospace" fill="var(--primary-text)">  PID USER  %CPU %MEM  COMMAND</text>
  <text x="84.4444" y="480.5063" font-size="21.9865" font-family="Courier New, monospace" fill="var(--primary-text)"> 1234 root   5.2  2.1  nginx</text>
  <text x="84.4444" y="539.2405" font-size="21.9865" font-family="Courier New, monospace" fill="var(--primary-text)"> 5678 john   3.1  1.5  python3</text>
  <text x="84.4444" y="597.9747" font-size="21.9865" font-family="Courier New, monospace" fill="var(--primary-text)"> 9012 mysql  1.8  8.3  mysqld</text>
  <text x="928.8888" y="480.5063" font-size="21.9865" fill="var(--text)" font-family="Arial, sans-serif">h=help</text>
  <text x="928.8888" y="539.2405" font-size="21.9865" fill="var(--text)" font-family="Arial, sans-serif">k=kill</text>
  <text x="928.8888" y="597.9747" font-size="21.9865" fill="var(--text)" font-family="Arial, sans-serif">q=quit</text>
</svg>
<svg width="600" height="200" xmlns="http://www.w3.org/2000/svg">
  <text x="300" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">top: Real-Time Process Monitor</text>
  <rect x="30" y="35" width="540" height="145" fill="#e3f2fd" stroke="#333" stroke-width="2" rx="5"/>
  <rect x="40" y="45" width="520" height="18" fill="#fff3e0" stroke="none" rx="2"/>
  <text x="50" y="58" font-size="10" font-family="monospace">top - 14:28:00 up 10 days, load average: 0.15, 0.22, 0.25</text>
  <rect x="40" y="67" width="520" height="18" fill="#e8f5e9" stroke="none" rx="2"/>
  <text x="50" y="80" font-size="10" font-family="monospace">Tasks: 213 total, 1 running, 212 sleeping, 0 zombie</text>
  <rect x="40" y="89" width="520" height="18" fill="#fff3e0" stroke="none" rx="2"/>
  <text x="50" y="102" font-size="10" font-family="monospace">%Cpu: 2.1 us, 1.0 sy, 96.8 id    Mem: 15881M total, 7993M free</text>
  <line x1="40" y1="112" x2="560" y2="112" stroke="#333" stroke-width="1"/>
  <text x="50" y="126" font-size="10" font-family="monospace" font-weight="bold">  PID USER  %CPU %MEM  COMMAND</text>
  <text x="50" y="142" font-size="10" font-family="monospace"> 1234 root   5.2  2.1  nginx</text>
  <text x="50" y="158" font-size="10" font-family="monospace"> 5678 john   3.1  1.5  python3</text>
  <text x="50" y="174" font-size="10" font-family="monospace"> 9012 mysql  1.8  8.3  mysqld</text>
  <text x="430" y="142" font-size="10" fill="#333">h=help</text>
  <text x="430" y="158" font-size="10" fill="#333">k=kill</text>
  <text x="430" y="174" font-size="10" fill="#333">q=quit</text>
</svg>

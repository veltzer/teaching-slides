<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="632.0988" y="78.2222" text-anchor="middle" font-size="27.3909" font-weight="bold" fill="var(--text)">top: Real-Time Process Monitor</text>
  <rect x="63.2099" y="124.4444" width="1137.7778" height="515.5556" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <rect x="84.2798" y="160" width="1095.6378" height="64" fill="var(--warn-fill)" stroke="var(--warn-border)" rx="6" stroke-width="2"/>
  <text x="105.3498" y="206.2222" font-size="21.0699" font-family="monospace">top - 14:28:00 up 10 days, load average: 0.15, 0.22, 0.25</text>
  <rect x="84.2798" y="238.2222" width="1095.6378" height="64" fill="var(--ok-fill)" stroke="var(--ok-border)" rx="6" stroke-width="2"/>
  <text x="105.3498" y="284.4444" font-size="21.0699" font-family="monospace">Tasks: 213 total, 1 running, 212 sleeping, 0 zombie</text>
  <rect x="84.2798" y="316.4444" width="1095.6378" height="64" fill="var(--warn-fill)" stroke="var(--warn-border)" rx="6" stroke-width="2"/>
  <text x="105.3498" y="362.6667" font-size="21.0699" font-family="monospace">%Cpu: 2.1 us, 1.0 sy, 96.8 id    Mem: 15881M total, 7993M free</text>
  <line x1="84.2798" y1="398.2222" x2="1179.9177" y2="398.2222" stroke="var(--text)" stroke-width="2" />
  <text x="105.3498" y="448" font-size="21.0699" font-family="monospace" font-weight="bold">  PID USER  %CPU %MEM  COMMAND</text>
  <text x="105.3498" y="504.8889" font-size="21.0699" font-family="monospace"> 1234 root   5.2  2.1  nginx</text>
  <text x="105.3498" y="561.7778" font-size="21.0699" font-family="monospace"> 5678 john   3.1  1.5  python3</text>
  <text x="105.3498" y="618.6667" font-size="21.0699" font-family="monospace"> 9012 mysql  1.8  8.3  mysqld</text>
  <text x="906.0082" y="504.8889" font-size="21.0699" fill="var(--text)">h=help</text>
  <text x="906.0082" y="561.7778" font-size="21.0699" fill="var(--text)">k=kill</text>
  <text x="906.0082" y="618.6667" font-size="21.0699" fill="var(--text)">q=quit</text>
</svg>
  <ns0:text x="593.6232" y="129.8551" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#bf360c">(SLEEPING)</ns0:text>
  <ns0:text x="593.6232" y="140.9855" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#555555">I/O or event</ns0:text>
  <ns0:text x="593.6232" y="150.8792" text-anchor="middle" font-family="monospace" font-size="10" fill="#e65100">S / D state</ns0:text>
  <ns0:circle cx="247.343" cy="302.9952" r="46.3768" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.8551" filter="url(#shadow)" />
  <ns0:text x="247.343" y="299.285" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#6a1b9a">STOPPED</ns0:text>
  <ns0:text x="247.343" y="311.6522" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#555555">SIGSTOP / Ctrl+Z</ns0:text>
  <ns0:text x="247.343" y="321.5459" text-anchor="middle" font-family="monospace" font-size="10" fill="#6a1b9a">T state</ns0:text>
  <ns0:circle cx="593.6232" cy="302.9952" r="46.3768" fill="#fce4ec" stroke="#b71c1c" stroke-width="1.8551" filter="url(#shadow)" />
  <ns0:text x="593.6232" y="299.285" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#b71c1c">ZOMBIE</ns0:text>
  <ns0:text x="593.6232" y="311.6522" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#555555">Terminated,</ns0:text>
  <ns0:text x="593.6232" y="321.5459" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#555555">not reaped</ns0:text>
  <ns0:text x="593.6232" y="332.6763" text-anchor="middle" font-family="monospace" font-size="10" fill="#b71c1c">Z state</ns0:text>
  <ns0:rect x="692.5604" y="284.4444" width="80.3865" height="37.1014" rx="6.1836" fill="#f2f2f2" stroke="#555555" stroke-width="1.2367" />
  <ns0:text x="732.7536" y="301.1401" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#555555">DEAD</ns0:text>
  <ns0:text x="732.7536" y="313.5072" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#888888">Resources freed</ns0:text>
  <ns0:line x1="120.5797" y1="123.6715" x2="200.9662" y2="123.6715" stroke="#2e7d32" stroke-width="1.5459" marker-end="url(#arrow-green)" />
  <ns0:text x="160.7729" y="117.4879" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#2e7d32">admitted</ns0:text>
  <ns0:line x1="293.7198" y1="123.6715" x2="367.9227" y2="123.6715" stroke="#1565c0" stroke-width="1.5459" marker-end="url(#arrow-accent)" />
  <ns0:text x="330.8213" y="116.2512" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1565c0">scheduled</ns0:text>
  <ns0:path d="M 383.3816 102.029 Q 330.8213 80.3865 296.8116 102.029" stroke="#e65100" stroke-width="1.2367" fill="none" marker-end="url(#arrow-orange)" />
  <ns0:text x="340.0966" y="81.6232" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#e65100">preempted</ns0:text>
  <ns0:line x1="473.0435" y1="123.6715" x2="544.1546" y2="123.6715" stroke="#e65100" stroke-width="1.5459" marker-end="url(#arrow-orange)" />
  <ns0:text x="508.2899" y="116.2512" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#e65100">I/O wait</ns0:text>
  <ns0:path d="M 556.5217 160.7729 Q 507.0531 204.058 309.1787 166.9565" stroke="#2e7d32" stroke-width="1.2367" fill="none" marker-end="url(#arrow-green)" />
  <ns0:text x="432.8502" y="207.1498" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#2e7d32">I/O complete / event</ns0:text>
  <ns0:path d="M 395.7488 173.1401 Q 346.2802 234.9758 296.8116 265.8937" stroke="#6a1b9a" stroke-width="1.2367" fill="none" marker-end="url(#arrow-purple)" />
  <ns0:text x="324.6377" y="228.7923" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6a1b9a">SIGSTOP</ns0:text>
  <ns0:path d="M 210.2415 272.0773 Q 185.5072 191.6908 204.058 166.9565" stroke="#2e7d32" stroke-width="1.2367" fill="none" marker-end="url(#arrow-green)" />
  <ns0:text x="171.9034" y="222.6087" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#2e7d32">SIGCONT</ns0:text>
  <ns0:path d="M 460.6763 166.9565 Q 531.7874 234.9758 550.3382 265.8937" stroke="#b71c1c" stroke-width="1.2367" fill="none" marker-end="url(#arrow-red)" />
  <ns0:text x="519.4203" y="227.5556" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#b71c1c">exit()</ns0:text>
  <ns0:line x1="640" y1="302.9952" x2="692.5604" y2="302.9952" stroke="#555555" stroke-width="1.2367" marker-end="url(#arrow)" />
  <ns0:text x="665.971" y="296.8116" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#555555">parent wait()</ns0:text>
  <ns0:path d="M 469.9517 92.7536 Q 593.6232 30.9179 640 256.6184" stroke="#b71c1c" stroke-width="1.2367" stroke-dasharray="3.7101 1.8551" fill="none" marker-end="url(#arrow-red)" />
  <ns0:text x="593.6232" y="49.4686" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#b71c1c">SIGKILL (kill -9)</ns0:text>
  <ns0:defs>
    <ns0:marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#4527a0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect x="15.4589" y="364.8309" width="760.5797" height="68.0193" rx="6.1836" fill="#f8f9fa" stroke="#e0e0e0" stroke-width="0.9275" filter="url(#shadow)" />
  <ns0:text x="30.9179" y="382.1449" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1565c0">Key Signals</ns0:text>
  <ns0:text x="30.9179" y="396.3671" font-family="monospace" font-size="10" fill="#212121">SIGTERM (15)</ns0:text>
  <ns0:text x="111.3043" y="396.3671" font-family="sans-serif" font-size="10" fill="#555555">Graceful terminate (default kill)</ns0:text>
  <ns0:text x="30.9179" y="408.7343" font-family="monospace" font-size="10" fill="#212121">SIGKILL  (9)</ns0:text>
  <ns0:text x="111.3043" y="408.7343" font-family="sans-serif" font-size="10" fill="#555555">Force kill — cannot be caught or ignored</ns0:text>
  <ns0:text x="30.9179" y="421.1014" font-family="monospace" font-size="10" fill="#212121">SIGSTOP (19)</ns0:text>
  <ns0:text x="111.3043" y="421.1014" font-family="sans-serif" font-size="10" fill="#555555">Pause process (cannot be caught)</ns0:text>
  <ns0:text x="309.1787" y="396.3671" font-family="monospace" font-size="10" fill="#212121">SIGCONT (18)</ns0:text>
  <ns0:text x="395.7488" y="396.3671" font-family="sans-serif" font-size="10" fill="#555555">Resume stopped process</ns0:text>
  <ns0:text x="309.1787" y="408.7343" font-family="monospace" font-size="10" fill="#212121">SIGINT   (2)</ns0:text>
  <ns0:text x="395.7488" y="408.7343" font-family="sans-serif" font-size="10" fill="#555555">Interrupt (Ctrl+C)</ns0:text>
  <ns0:text x="309.1787" y="421.1014" font-family="monospace" font-size="10" fill="#212121">SIGCHLD (17)</ns0:text>
  <ns0:text x="395.7488" y="421.1014" font-family="sans-serif" font-size="10" fill="#555555">Child state changed — reap zombie with wait()</ns0:text>
  <ns0:text x="593.6232" y="396.3671" font-family="monospace" font-size="10" fill="#212121">ps STAT codes:</ns0:text>
  <ns0:text x="593.6232" y="408.7343" font-family="monospace" font-size="10" fill="#212121">R=running  S=sleeping  D=uninterruptible</ns0:text>
  <ns0:text x="593.6232" y="421.1014" font-family="monospace" font-size="10" fill="#212121">T=stopped  Z=zombie  X=dead</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#b71c1c" />
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
  </defs>
  <rect width="622.2088" height="349.9924" fill="var(--bg)" rx="4.7167" />
  <circle cx="195.218" cy="153.2189" r="36.4575" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.2985" filter="url(#shadow)" />
  <text x="195.218" y="150.3024" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="var(--primary-accent)">CREATED</text>
  <text x="195.218" y="160.0243" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">fork() called</text>
  <text x="195.218" y="167.8019" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--primary-accent)">S state</text>
  <circle cx="331.3261" cy="153.2189" r="36.4575" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.2985" filter="url(#shadow)" />
  <text x="331.3261" y="150.3024" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="var(--ok-accent)">READY</text>
  <text x="331.3261" y="160.0243" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Waiting for CPU</text>
  <text x="331.3261" y="167.8019" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--ok-accent)">R state</text>
  <circle cx="467.4343" cy="153.2189" r="41.3186" fill="url(#grad-primary)" filter="url(#shadow)" />
  <text x="467.4343" y="149.3301" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="var(--bg)">RUNNING</text>
  <text x="467.4343" y="160.0243" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--primary-accent)">On CPU</text>
  <text x="467.4343" y="168.7741" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--primary-accent)">R state</text>
  <circle cx="603.5425" cy="153.2189" r="38.8881" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.2985" filter="url(#shadow)" />
  <text x="603.5425" y="148.3579" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="var(--warn-accent)">WAITING</text>
  <text x="603.5425" y="158.08" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--danger-accent)">(SLEEPING)</text>
  <text x="603.5425" y="166.8297" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">I/O or event</text>
  <text x="603.5425" y="174.6073" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--warn-accent)">S / D state</text>
  <circle cx="331.3261" cy="294.1881" r="36.4575" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="1.2985" filter="url(#shadow)" />
  <text x="331.3261" y="291.2715" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="var(--info-accent)">STOPPED</text>
  <text x="331.3261" y="300.9935" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">SIGSTOP / Ctrl+Z</text>
  <text x="331.3261" y="308.7711" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--info-accent)">T state</text>
  <circle cx="603.5425" cy="294.1881" r="36.4575" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.2985" filter="url(#shadow)" />
  <text x="603.5425" y="291.2715" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="var(--danger-accent)">ZOMBIE</text>
  <text x="603.5425" y="300.9935" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Terminated,</text>
  <text x="603.5425" y="308.7711" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">not reaped</text>
  <text x="603.5425" y="317.5209" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--danger-accent)">Z state</text>
  <rect x="681.3186" y="279.605" width="63.1931" height="29.166" rx="4.7167" fill="var(--surface)" stroke="var(--border)" stroke-width="0.7" />
  <text x="712.9151" y="292.7297" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="var(--text-muted)">DEAD</text>
  <text x="712.9151" y="302.4518" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-faint)">Resources freed</text>
  <line x1="231.6755" y1="153.2189" x2="294.8686" y2="153.2189" stroke="var(--ok-border)" stroke-width="1.0821" marker-end="url(#arrow-ok)" />
  <text x="263.2721" y="148.3579" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--ok-accent)">admitted</text>
  <line x1="367.7837" y1="153.2189" x2="426.1158" y2="153.2189" stroke="var(--primary-border)" stroke-width="1.0821" marker-end="url(#arrow-primary)" />
  <text x="396.9498" y="147.3857" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--primary-accent)">scheduled</text>
  <path d="M 438.2683 136.2054 Q 396.9498 119.1919 370.2142 136.2054" stroke="var(--warn-border)" stroke-width="0.8657" fill="none" marker-end="url(#arrow-warn)" />
  <text x="404.2413" y="120.1641" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--warn-accent)">preempted</text>
  <line x1="508.7529" y1="153.2189" x2="564.6545" y2="153.2189" stroke="var(--warn-border)" stroke-width="1.0821" marker-end="url(#arrow-warn)" />
  <text x="536.4606" y="147.3857" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--warn-accent)">I/O wait</text>
  <path d="M 574.3764 182.3849 Q 535.4883 216.412 379.9362 187.2459" stroke="var(--ok-border)" stroke-width="0.8657" fill="none" marker-end="url(#arrow-ok)" />
  <text x="477.1563" y="218.8425" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--ok-accent)">I/O complete / event</text>
  <path d="M 447.9903 192.1069 Q 409.1022 240.717 370.2142 265.022" stroke="var(--info-border)" stroke-width="0.8657" fill="none" marker-end="url(#arrow-purple)" />
  <text x="392.0887" y="235.856" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--info-accent)">SIGSTOP</text>
  <path d="M 302.1601 269.8831 Q 282.716 206.6899 297.2992 187.2459" stroke="var(--ok-border)" stroke-width="0.8657" fill="none" marker-end="url(#arrow-ok)" />
  <text x="272.0219" y="230.995" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--ok-accent)">SIGCONT</text>
  <path d="M 499.0308 187.2459 Q 554.9324 240.717 569.5154 265.022" stroke="var(--danger-border)" stroke-width="0.8657" fill="none" marker-end="url(#arrow-danger)" />
  <text x="545.2104" y="234.8838" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--danger-accent)">exit()</text>
  <line x1="640" y1="294.1881" x2="681.3186" y2="294.1881" stroke="var(--text-muted)" stroke-width="0.8657" marker-end="url(#arrow)" />
  <text x="660.4162" y="289.327" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">parent wait()</text>
  <path d="M 506.3224 128.9138 Q 603.5425 80.3039 640 257.7306" stroke="var(--danger-border)" stroke-width="0.8657" stroke-dasharray="2.597 1.2985" fill="none" marker-end="url(#arrow-danger)" />
  <text x="603.5425" y="94.8869" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--danger-accent)">SIGKILL (kill -9)</text>
  <defs>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-deep)" />
    </marker>
  </defs>
  <rect x="149.0384" y="342.7981" width="597.9037" height="53.4711" rx="4.7167" fill="var(--surface)" stroke="var(--border)" stroke-width="0.7" filter="url(#shadow)" />
  <text x="161.191" y="356.4089" font-family="sans-serif" font-size="10" font-weight="bold" fill="var(--primary-accent)">Key Signals</text>
  <text x="161.191" y="367.5892" font-family="monospace" font-size="10" fill="var(--text)">SIGTERM (15)</text>
  <text x="224.384" y="367.5892" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Graceful terminate (default kill)</text>
  <text x="161.191" y="377.3113" font-family="monospace" font-size="10" fill="var(--text)">SIGKILL  (9)</text>
  <text x="224.384" y="377.3113" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Force kill — cannot be caught or ignored</text>
  <text x="161.191" y="387.0332" font-family="monospace" font-size="10" fill="var(--text)">SIGSTOP (19)</text>
  <text x="224.384" y="387.0332" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Pause process (cannot be caught)</text>
  <text x="379.9362" y="367.5892" font-family="monospace" font-size="10" fill="var(--text)">SIGCONT (18)</text>
  <text x="447.9903" y="367.5892" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Resume stopped process</text>
  <text x="379.9362" y="377.3113" font-family="monospace" font-size="10" fill="var(--text)">SIGINT   (2)</text>
  <text x="447.9903" y="377.3113" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Interrupt (Ctrl+C)</text>
  <text x="379.9362" y="387.0332" font-family="monospace" font-size="10" fill="var(--text)">SIGCHLD (17)</text>
  <text x="447.9903" y="387.0332" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Child state changed — reap zombie with wait()</text>
  <text x="603.5425" y="367.5892" font-family="monospace" font-size="10" fill="var(--text)">ps STAT codes:</text>
  <text x="603.5425" y="377.3113" font-family="monospace" font-size="10" fill="var(--text)">R=running  S=sleeping  D=uninterruptible</text>
  <text x="603.5425" y="387.0332" font-family="monospace" font-size="10" fill="var(--text)">T=stopped  Z=zombie  X=dead</text>
</svg>
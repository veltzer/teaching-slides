<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#b71c1c" />
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
  </defs>
  <rect width="847.7963" height="441.6095" fill="var(--bg)" rx="6" x="40" y="40"/>
  <circle cx="488.2433" cy="313.3268" r="47.8029" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="0.8512" filter="url(#shadow)" />
  <text x="488.2433" y="309.6468" text-anchor="middle" font-family="sans-serif" font-size="15.8522" font-weight="bold" fill="var(--primary-accent)">CREATED</text>
  <text x="488.2433" y="321.9137" text-anchor="middle" font-family="sans-serif" font-size="15.8522" fill="var(--text-muted)">fork() called</text>
  <text x="488.2433" y="331.7273" text-anchor="middle" font-family="monospace" font-size="15.8522" fill="var(--primary-accent)">S state</text>
  <circle cx="673.6986" cy="313.3268" r="47.8029" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="0.8512" filter="url(#shadow)" />
  <text x="673.6986" y="309.6468" text-anchor="middle" font-family="sans-serif" font-size="15.8522" font-weight="bold" fill="var(--ok-accent)">READY</text>
  <text x="673.6986" y="321.9137" text-anchor="middle" font-family="sans-serif" font-size="15.8522" fill="var(--text-muted)">Waiting for CPU</text>
  <text x="673.6986" y="331.7273" text-anchor="middle" font-family="monospace" font-size="15.8522" fill="var(--ok-accent)">R state</text>
  <circle cx="859.1541" cy="313.3268" r="54.1767" fill="url(#grad-primary)" filter="url(#shadow)" />
  <text x="859.1541" y="308.42" text-anchor="middle" font-family="sans-serif" font-size="15.8522" font-weight="bold" fill="var(--bg)">RUNNING</text>
  <text x="859.1541" y="321.9137" text-anchor="middle" font-family="sans-serif" font-size="15.8522" fill="var(--primary-accent)">On CPU</text>
  <text x="859.1541" y="332.9539" text-anchor="middle" font-family="monospace" font-size="15.8522" fill="var(--primary-accent)">R state</text>
  <circle cx="1044.6095" cy="313.3268" r="50.9899" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="0.8512" filter="url(#shadow)" />
  <text x="1044.6095" y="307.1934" text-anchor="middle" font-family="sans-serif" font-size="15.8522" font-weight="bold" fill="var(--warn-accent)">WAITING</text>
  <text x="1044.6095" y="319.4604" text-anchor="middle" font-family="sans-serif" font-size="15.8522" fill="var(--danger-accent)">(SLEEPING)</text>
  <text x="1044.6095" y="330.5005" text-anchor="middle" font-family="sans-serif" font-size="15.8522" fill="var(--text-muted)">I/O or event</text>
  <text x="1044.6095" y="340.314" text-anchor="middle" font-family="monospace" font-size="15.8522" fill="var(--warn-accent)">S / D state</text>
  <circle cx="673.6986" cy="491.1973" r="47.8029" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="0.8512" filter="url(#shadow)" />
  <text x="673.6986" y="487.5173" text-anchor="middle" font-family="sans-serif" font-size="15.8522" font-weight="bold" fill="var(--info-accent)">STOPPED</text>
  <text x="673.6986" y="499.7842" text-anchor="middle" font-family="sans-serif" font-size="15.8522" fill="var(--text-muted)">SIGSTOP / Ctrl+Z</text>
  <text x="673.6986" y="509.5978" text-anchor="middle" font-family="monospace" font-size="15.8522" fill="var(--info-accent)">T state</text>
  <circle cx="1044.6095" cy="491.1973" r="47.8029" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="0.8512" filter="url(#shadow)" />
  <text x="1044.6095" y="487.5173" text-anchor="middle" font-family="sans-serif" font-size="15.8522" font-weight="bold" fill="var(--danger-accent)">ZOMBIE</text>
  <text x="1044.6095" y="499.7842" text-anchor="middle" font-family="sans-serif" font-size="15.8522" fill="var(--text-muted)">Terminated,</text>
  <text x="1044.6095" y="509.5978" text-anchor="middle" font-family="sans-serif" font-size="15.8522" fill="var(--text-muted)">not reaped</text>
  <text x="1044.6095" y="520.638" text-anchor="middle" font-family="monospace" font-size="15.8522" fill="var(--danger-accent)">Z state</text>
  <rect x="1150.584" y="472.7968" width="86.1044" height="36.8006" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1193.6362" y="489.3571" text-anchor="middle" font-family="sans-serif" font-size="15.8522" font-weight="bold" fill="var(--text-muted)">DEAD</text>
  <text x="1193.6362" y="501.6243" text-anchor="middle" font-family="sans-serif" font-size="15.8522" fill="var(--text-faint)">Resources freed</text>
  <line x1="537.9187" y1="313.3268" x2="624.023" y2="313.3268" stroke="var(--ok-border)" stroke-width="0.7094" marker-end="url(#arrow-ok)" />
  <text x="580.9709" y="307.1934" text-anchor="middle" font-family="sans-serif" font-size="15.8522" fill="var(--ok-accent)">admitted</text>
  <line x1="723.3742" y1="313.3268" x2="802.8551" y2="313.3268" stroke="var(--primary-border)" stroke-width="0.7094" marker-end="url(#arrow-primary)" />
  <text x="763.1146" y="305.9666" text-anchor="middle" font-family="sans-serif" font-size="15.8522" fill="var(--primary-accent)">scheduled</text>
  <path d="M 819.4136 291.8597 Q 763.1146 270.3926 726.6859 291.8597" stroke="var(--warn-border)" stroke-width="0.5675" fill="none" marker-end="url(#arrow-warn)" />
  <text x="773.0498" y="271.6194" text-anchor="middle" font-family="sans-serif" font-size="15.8522" fill="var(--warn-accent)">preempted</text>
  <line x1="915.453" y1="313.3268" x2="991.6223" y2="313.3268" stroke="var(--warn-border)" stroke-width="0.7094" marker-end="url(#arrow-warn)" />
  <text x="953.2065" y="305.9666" text-anchor="middle" font-family="sans-serif" font-size="15.8522" fill="var(--warn-accent)">I/O wait</text>
  <path d="M 1004.8689 350.1276 Q 951.8817 393.0618 739.9327 356.261" stroke="var(--ok-border)" stroke-width="0.5675" fill="none" marker-end="url(#arrow-ok)" />
  <text x="872.4008" y="396.1286" text-anchor="middle" font-family="sans-serif" font-size="15.8522" fill="var(--ok-accent)">I/O complete / event</text>
  <path d="M 832.6604 362.3945 Q 779.6732 423.7292 726.6859 454.3965" stroke="var(--info-border)" stroke-width="0.5675" fill="none" marker-end="url(#arrow-purple)" />
  <text x="756.4912" y="417.5957" text-anchor="middle" font-family="sans-serif" font-size="15.8522" fill="var(--info-accent)">SIGSTOP</text>
  <path d="M 633.9581 460.5301 Q 607.4644 380.7948 627.3349 356.261" stroke="var(--ok-border)" stroke-width="0.5675" fill="none" marker-end="url(#arrow-ok)" />
  <text x="592.8931" y="411.4623" text-anchor="middle" font-family="sans-serif" font-size="15.8522" fill="var(--ok-accent)">SIGCONT</text>
  <path d="M 902.2061 356.261 Q 978.3754 423.7292 998.2455 454.3965" stroke="var(--danger-border)" stroke-width="0.5675" fill="none" marker-end="url(#arrow-danger)" />
  <text x="965.1286" y="416.3691" text-anchor="middle" font-family="sans-serif" font-size="15.8522" fill="var(--danger-accent)">exit()</text>
  <line x1="1094.285" y1="491.1973" x2="1150.584" y2="491.1973" stroke="var(--text-muted)" stroke-width="0.5675" marker-end="url(#arrow)" />
  <text x="1122.1033" y="485.0637" text-anchor="middle" font-family="sans-serif" font-size="15.8522" fill="var(--text-muted)">parent wait()</text>
  <path d="M 912.1414 282.6595 Q 1044.6095 221.3249 1094.285 445.1964" stroke="var(--danger-border)" stroke-width="0.5675" stroke-dasharray="1.7024 0.8512" fill="none" marker-end="url(#arrow-danger)" />
  <text x="1044.6095" y="239.7254" text-anchor="middle" font-family="sans-serif" font-size="15.8522" fill="var(--danger-accent)">SIGKILL (kill -9)</text>
  <defs>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-deep)" />
    </marker>
  </defs>
  <rect x="425.3207" y="552.5319" width="814.6793" height="67.4681" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="441.8794" y="569.7056" font-family="sans-serif" font-size="15.8522" font-weight="bold" fill="var(--primary-accent)">Key Signals</text>
  <text x="441.8794" y="583.8126" font-family="monospace" font-size="15.8522" fill="var(--text)">SIGTERM (15)</text>
  <text x="527.9837" y="583.8126" font-family="sans-serif" font-size="15.8522" fill="var(--text-muted)">Graceful terminate (default kill)</text>
  <text x="441.8794" y="596.0796" font-family="monospace" font-size="15.8522" fill="var(--text)">SIGKILL  (9)</text>
  <text x="527.9837" y="596.0796" font-family="sans-serif" font-size="15.8522" fill="var(--text-muted)">Force kill — cannot be caught or ignored</text>
  <text x="441.8794" y="608.3464" font-family="monospace" font-size="15.8522" fill="var(--text)">SIGSTOP (19)</text>
  <text x="527.9837" y="608.3464" font-family="sans-serif" font-size="15.8522" fill="var(--text-muted)">Pause process (cannot be caught)</text>
  <text x="739.9327" y="583.8126" font-family="monospace" font-size="15.8522" fill="var(--text)">SIGCONT (18)</text>
  <text x="832.6604" y="583.8126" font-family="sans-serif" font-size="15.8522" fill="var(--text-muted)">Resume stopped process</text>
  <text x="739.9327" y="596.0796" font-family="monospace" font-size="15.8522" fill="var(--text)">SIGINT   (2)</text>
  <text x="832.6604" y="596.0796" font-family="sans-serif" font-size="15.8522" fill="var(--text-muted)">Interrupt (Ctrl+C)</text>
  <text x="739.9327" y="608.3464" font-family="monospace" font-size="15.8522" fill="var(--text)">SIGCHLD (17)</text>
  <text x="832.6604" y="608.3464" font-family="sans-serif" font-size="15.8522" fill="var(--text-muted)">Child state changed — reap zombie with wait()</text>
  <text x="1044.6095" y="583.8126" font-family="monospace" font-size="15.8522" fill="var(--text)">ps STAT codes:</text>
  <text x="1044.6095" y="596.0796" font-family="monospace" font-size="15.8522" fill="var(--text)">R=running  S=sleeping  D=uninterruptible</text>
  <text x="1044.6095" y="608.3464" font-family="monospace" font-size="15.8522" fill="var(--text)">T=stopped  Z=zombie  X=dead</text>
</svg>
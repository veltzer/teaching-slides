  <ns0:text x="247.343" y="299.285" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="var(--info-dk)">STOPPED</ns0:text>
  <ns0:text x="247.343" y="311.6522" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">SIGSTOP / Ctrl+Z</ns0:text>
  <ns0:text x="247.343" y="321.5459" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--info-dk)">T state</ns0:text>

  <ns0:text x="247.343" y="132.3285" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Waiting for CPU</ns0:text>
  <ns0:text x="247.343" y="142.2222" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--ok-dk)">R state</ns0:text>
  <ns0:circle cx="420.4831" cy="123.6715" r="52.5604" fill="url(#grad-primary)" filter="url(#shadow)" />

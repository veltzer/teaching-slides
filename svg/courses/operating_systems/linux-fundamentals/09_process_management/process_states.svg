<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#b71c1c" />
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
  </defs>
  <rect width="514.6518" height="289.4916" fill="var(--bg)" rx="4.9628" />
  <circle cx="272.1045" cy="179.176" r="30.1553" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="0.8512" filter="url(#shadow)" />
  <text x="272.1045" y="176.7636" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="var(--primary-accent)">CREATED</text>
  <text x="272.1045" y="184.805" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">fork() called</text>
  <text x="272.1045" y="191.2382" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--primary-accent)">S state</text>
  <circle cx="384.6845" cy="179.176" r="30.1553" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="0.8512" filter="url(#shadow)" />
  <text x="384.6845" y="176.7636" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="var(--ok-accent)">READY</text>
  <text x="384.6845" y="184.805" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Waiting for CPU</text>
  <text x="384.6845" y="191.2382" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--ok-accent)">R state</text>
  <circle cx="497.2646" cy="179.176" r="34.1761" fill="url(#grad-primary)" filter="url(#shadow)" />
  <text x="497.2646" y="175.9594" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="var(--bg)">RUNNING</text>
  <text x="497.2646" y="184.805" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--primary-accent)">On CPU</text>
  <text x="497.2646" y="192.0423" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--primary-accent)">R state</text>
  <circle cx="609.8447" cy="179.176" r="32.1658" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="0.8512" filter="url(#shadow)" />
  <text x="609.8447" y="175.1553" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="var(--warn-accent)">WAITING</text>
  <text x="609.8447" y="183.1968" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--danger-accent)">(SLEEPING)</text>
  <text x="609.8447" y="190.434" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">I/O or event</text>
  <text x="609.8447" y="196.8671" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--warn-accent)">S / D state</text>
  <circle cx="384.6845" cy="295.7768" r="30.1553" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="0.8512" filter="url(#shadow)" />
  <text x="384.6845" y="293.3644" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="var(--info-accent)">STOPPED</text>
  <text x="384.6845" y="301.4058" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">SIGSTOP / Ctrl+Z</text>
  <text x="384.6845" y="307.839" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--info-accent)">T state</text>
  <circle cx="609.8447" cy="295.7768" r="30.1553" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="0.8512" filter="url(#shadow)" />
  <text x="609.8447" y="293.3644" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="var(--danger-accent)">ZOMBIE</text>
  <text x="609.8447" y="301.4058" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Terminated,</text>
  <text x="609.8447" y="307.839" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">not reaped</text>
  <text x="609.8447" y="315.0763" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--danger-accent)">Z state</text>
  <rect x="674.1761" y="283.7146" width="52.2694" height="24.1242" rx="4.9628" fill="var(--surface)" stroke="var(--border)" stroke-width="0.6555" />
  <text x="700.3108" y="294.5705" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="var(--text-muted)">DEAD</text>
  <text x="700.3108" y="302.6121" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-faint)">Resources freed</text>
  <line x1="302.2598" y1="179.176" x2="354.5291" y2="179.176" stroke="var(--ok-border)" stroke-width="0.7094" marker-end="url(#arrow-ok)" />
  <text x="328.3945" y="175.1553" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--ok-accent)">admitted</text>
  <line x1="414.8399" y1="179.176" x2="463.0885" y2="179.176" stroke="var(--primary-border)" stroke-width="0.7094" marker-end="url(#arrow-primary)" />
  <text x="438.9642" y="174.3511" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--primary-accent)">scheduled</text>
  <path d="M 473.1403 165.1035 Q 438.9642 151.031 416.8503 165.1035" stroke="var(--warn-border)" stroke-width="0.5675" fill="none" marker-end="url(#arrow-warn)" />
  <text x="444.9953" y="151.8352" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--warn-accent)">preempted</text>
  <line x1="531.4407" y1="179.176" x2="577.679" y2="179.176" stroke="var(--warn-border)" stroke-width="0.7094" marker-end="url(#arrow-warn)" />
  <text x="554.3588" y="174.3511" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--warn-accent)">I/O wait</text>
  <path d="M 585.7203 203.3003 Q 553.5546 231.4453 424.8917 207.321" stroke="var(--ok-border)" stroke-width="0.5675" fill="none" marker-end="url(#arrow-ok)" />
  <text x="505.306" y="233.4557" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--ok-accent)">I/O complete / event</text>
  <path d="M 481.1817 211.3417 Q 449.016 251.5489 416.8503 271.6525" stroke="var(--info-border)" stroke-width="0.5675" fill="none" marker-end="url(#arrow-purple)" />
  <text x="434.9435" y="247.5282" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--info-accent)">SIGSTOP</text>
  <path d="M 360.5602 275.6733 Q 344.4773 223.4038 356.5396 207.321" stroke="var(--ok-border)" stroke-width="0.5675" fill="none" marker-end="url(#arrow-ok)" />
  <text x="335.6318" y="243.5075" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--ok-accent)">SIGCONT</text>
  <path d="M 523.3992 207.321 Q 569.6375 251.5489 581.6996 271.6525" stroke="var(--danger-border)" stroke-width="0.5675" fill="none" marker-end="url(#arrow-danger)" />
  <text x="561.5961" y="246.7241" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--danger-accent)">exit()</text>
  <line x1="640" y1="295.7768" x2="674.1761" y2="295.7768" stroke="var(--text-muted)" stroke-width="0.5675" marker-end="url(#arrow)" />
  <text x="656.887" y="291.756" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">parent wait()</text>
  <path d="M 529.4304 159.0724 Q 609.8447 118.8653 640 265.6215" stroke="var(--danger-border)" stroke-width="0.5675" stroke-dasharray="1.7024 0.8512" fill="none" marker-end="url(#arrow-danger)" />
  <text x="609.8447" y="130.9275" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--danger-accent)">SIGKILL (kill -9)</text>
  <defs>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-deep)" />
    </marker>
  </defs>
  <rect x="233.9076" y="335.9839" width="494.5482" height="44.2279" rx="4.9628" fill="var(--surface)" stroke="var(--border)" stroke-width="0.6555" filter="url(#shadow)" />
  <text x="243.9595" y="347.2419" font-family="sans-serif" font-size="10" font-weight="bold" fill="var(--primary-accent)">Key Signals</text>
  <text x="243.9595" y="356.4896" font-family="monospace" font-size="10" fill="var(--text)">SIGTERM (15)</text>
  <text x="296.2288" y="356.4896" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Graceful terminate (default kill)</text>
  <text x="243.9595" y="364.5311" font-family="monospace" font-size="10" fill="var(--text)">SIGKILL  (9)</text>
  <text x="296.2288" y="364.5311" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Force kill — cannot be caught or ignored</text>
  <text x="243.9595" y="372.5724" font-family="monospace" font-size="10" fill="var(--text)">SIGSTOP (19)</text>
  <text x="296.2288" y="372.5724" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Pause process (cannot be caught)</text>
  <text x="424.8917" y="356.4896" font-family="monospace" font-size="10" fill="var(--text)">SIGCONT (18)</text>
  <text x="481.1817" y="356.4896" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Resume stopped process</text>
  <text x="424.8917" y="364.5311" font-family="monospace" font-size="10" fill="var(--text)">SIGINT   (2)</text>
  <text x="481.1817" y="364.5311" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Interrupt (Ctrl+C)</text>
  <text x="424.8917" y="372.5724" font-family="monospace" font-size="10" fill="var(--text)">SIGCHLD (17)</text>
  <text x="481.1817" y="372.5724" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Child state changed — reap zombie with wait()</text>
  <text x="609.8447" y="356.4896" font-family="monospace" font-size="10" fill="var(--text)">ps STAT codes:</text>
  <text x="609.8447" y="364.5311" font-family="monospace" font-size="10" fill="var(--text)">R=running  S=sleeping  D=uninterruptible</text>
  <text x="609.8447" y="372.5724" font-family="monospace" font-size="10" fill="var(--text)">T=stopped  Z=zombie  X=dead</text>
</svg>
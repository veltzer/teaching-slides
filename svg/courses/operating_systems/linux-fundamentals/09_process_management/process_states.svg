<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#b71c1c" />
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
  </defs>
  <rect width="791.4976" height="445.2174" fill="var(--bg)" rx="6"/>
  <circle cx="74.2029" cy="123.6715" r="46.3768" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.8551" filter="url(#shadow)" />
  <text x="74.2029" y="119.9614" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="var(--primary-accent)">CREATED</text>
  <text x="74.2029" y="132.3285" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">fork() called</text>
  <text x="74.2029" y="142.2222" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--primary-accent)">S state</text>
  <circle cx="247.343" cy="123.6715" r="46.3768" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.8551" filter="url(#shadow)" />
  <text x="247.343" y="119.9614" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="var(--ok-accent)">READY</text>
  <text x="247.343" y="132.3285" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Waiting for CPU</text>
  <text x="247.343" y="142.2222" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--ok-accent)">R state</text>
  <circle cx="420.4831" cy="123.6715" r="52.5604" fill="url(#grad-primary)" filter="url(#shadow)" />
  <text x="420.4831" y="118.7246" text-anchor="middle" font-family="sans-serif" font-size="11.1304" font-weight="bold" fill="var(--bg)">RUNNING</text>
  <text x="420.4831" y="132.3285" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--primary-accent)">On CPU</text>
  <text x="420.4831" y="143.4589" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--primary-accent)">R state</text>
  <circle cx="593.6232" cy="123.6715" r="49.4686" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.8551" filter="url(#shadow)" />
  <text x="593.6232" y="117.4879" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="var(--warn-accent)">WAITING</text>
  <text x="593.6232" y="129.8551" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--danger-accent)">(SLEEPING)</text>
  <text x="593.6232" y="140.9855" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">I/O or event</text>
  <text x="593.6232" y="150.8792" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--warn-accent)">S / D state</text>
  <circle cx="247.343" cy="302.9952" r="46.3768" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="1.8551" filter="url(#shadow)" />
  <text x="247.343" y="299.285" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="var(--info-accent)">STOPPED</text>
  <text x="247.343" y="311.6522" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">SIGSTOP / Ctrl+Z</text>
  <text x="247.343" y="321.5459" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--info-accent)">T state</text>
  <circle cx="593.6232" cy="302.9952" r="46.3768" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.8551" filter="url(#shadow)" />
  <text x="593.6232" y="299.285" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="var(--danger-accent)">ZOMBIE</text>
  <text x="593.6232" y="311.6522" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Terminated,</text>
  <text x="593.6232" y="321.5459" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">not reaped</text>
  <text x="593.6232" y="332.6763" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--danger-accent)">Z state</text>
  <rect x="692.5604" y="284.4444" width="80.3865" height="37.1014" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="732.7536" y="301.1401" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="var(--text-muted)">DEAD</text>
  <text x="732.7536" y="313.5072" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-faint)">Resources freed</text>
  <line x1="120.5797" y1="123.6715" x2="200.9662" y2="123.6715" stroke="var(--ok-border)" stroke-width="1.5459" marker-end="url(#arrow-ok)" />
  <text x="160.7729" y="117.4879" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--ok-accent)">admitted</text>
  <line x1="293.7198" y1="123.6715" x2="367.9227" y2="123.6715" stroke="var(--primary-border)" stroke-width="1.5459" marker-end="url(#arrow-primary)" />
  <text x="330.8213" y="116.2512" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--primary-accent)">scheduled</text>
  <path d="M 383.3816 102.029 Q 330.8213 80.3865 296.8116 102.029" stroke="var(--warn-border)" stroke-width="1.2367" fill="none" marker-end="url(#arrow-warn)" />
  <text x="340.0966" y="81.6232" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--warn-accent)">preempted</text>
  <line x1="473.0435" y1="123.6715" x2="544.1546" y2="123.6715" stroke="var(--warn-border)" stroke-width="1.5459" marker-end="url(#arrow-warn)" />
  <text x="508.2899" y="116.2512" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--warn-accent)">I/O wait</text>
  <path d="M 556.5217 160.7729 Q 507.0531 204.058 309.1787 166.9565" stroke="var(--ok-border)" stroke-width="1.2367" fill="none" marker-end="url(#arrow-ok)" />
  <text x="432.8502" y="207.1498" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--ok-accent)">I/O complete / event</text>
  <path d="M 395.7488 173.1401 Q 346.2802 234.9758 296.8116 265.8937" stroke="var(--info-border)" stroke-width="1.2367" fill="none" marker-end="url(#arrow-purple)" />
  <text x="324.6377" y="228.7923" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--info-accent)">SIGSTOP</text>
  <path d="M 210.2415 272.0773 Q 185.5072 191.6908 204.058 166.9565" stroke="var(--ok-border)" stroke-width="1.2367" fill="none" marker-end="url(#arrow-ok)" />
  <text x="171.9034" y="222.6087" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--ok-accent)">SIGCONT</text>
  <path d="M 460.6763 166.9565 Q 531.7874 234.9758 550.3382 265.8937" stroke="var(--danger-border)" stroke-width="1.2367" fill="none" marker-end="url(#arrow-danger)" />
  <text x="519.4203" y="227.5556" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--danger-accent)">exit()</text>
  <line x1="640" y1="302.9952" x2="692.5604" y2="302.9952" stroke="var(--text-muted)" stroke-width="1.2367" marker-end="url(#arrow)" />
  <text x="665.971" y="296.8116" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">parent wait()</text>
  <path d="M 469.9517 92.7536 Q 593.6232 30.9179 640 256.6184" stroke="var(--danger-border)" stroke-width="1.2367" stroke-dasharray="3.7101 1.8551" fill="none" marker-end="url(#arrow-danger)" />
  <text x="593.6232" y="49.4686" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--danger-accent)">SIGKILL (kill -9)</text>
  <defs>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-deep)" />
    </marker>
  </defs>
  <rect x="15.4589" y="364.8309" width="760.5797" height="68.0193" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="30.9179" y="382.1449" font-family="sans-serif" font-size="10" font-weight="bold" fill="var(--primary-accent)">Key Signals</text>
  <text x="30.9179" y="396.3671" font-family="monospace" font-size="10" fill="var(--text)">SIGTERM (15)</text>
  <text x="111.3043" y="396.3671" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Graceful terminate (default kill)</text>
  <text x="30.9179" y="408.7343" font-family="monospace" font-size="10" fill="var(--text)">SIGKILL  (9)</text>
  <text x="111.3043" y="408.7343" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Force kill — cannot be caught or ignored</text>
  <text x="30.9179" y="421.1014" font-family="monospace" font-size="10" fill="var(--text)">SIGSTOP (19)</text>
  <text x="111.3043" y="421.1014" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Pause process (cannot be caught)</text>
  <text x="309.1787" y="396.3671" font-family="monospace" font-size="10" fill="var(--text)">SIGCONT (18)</text>
  <text x="395.7488" y="396.3671" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Resume stopped process</text>
  <text x="309.1787" y="408.7343" font-family="monospace" font-size="10" fill="var(--text)">SIGINT   (2)</text>
  <text x="395.7488" y="408.7343" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Interrupt (Ctrl+C)</text>
  <text x="309.1787" y="421.1014" font-family="monospace" font-size="10" fill="var(--text)">SIGCHLD (17)</text>
  <text x="395.7488" y="421.1014" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Child state changed — reap zombie with wait()</text>
  <text x="593.6232" y="396.3671" font-family="monospace" font-size="10" fill="var(--text)">ps STAT codes:</text>
  <text x="593.6232" y="408.7343" font-family="monospace" font-size="10" fill="var(--text)">R=running  S=sleeping  D=uninterruptible</text>
  <text x="593.6232" y="421.1014" font-family="monospace" font-size="10" fill="var(--text)">T=stopped  Z=zombie  X=dead</text>
</svg>
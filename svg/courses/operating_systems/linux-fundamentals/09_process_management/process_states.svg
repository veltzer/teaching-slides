  <ns0:rect x="15.4589" y="364.8309" width="760.5797" height="68.0193" rx="6.1836" fill="var(--surface-light)" stroke="var(--border)" stroke-width="0.9275" filter="url(#shadow)" />
  <ns0:text x="30.9179" y="382.1449" font-family="sans-serif" font-size="10" font-weight="bold" fill="var(--primary-dk)">Key Signals</ns0:text>
  <ns0:text x="30.9179" y="396.3671" font-family="monospace" font-size="10" fill="var(--text)">SIGTERM (15)</ns0:text>
  <ns0:text x="111.3043" y="396.3671" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Graceful terminate (default kill)</ns0:text>
  <ns0:text x="30.9179" y="408.7343" font-family="monospace" font-size="10" fill="var(--text)">SIGKILL  (9)</ns0:text>
  <ns0:text x="111.3043" y="408.7343" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Force kill — cannot be caught or ignored</ns0:text>
  <ns0:text x="30.9179" y="421.1014" font-family="monospace" font-size="10" fill="var(--text)">SIGSTOP (19)</ns0:text>
  <ns0:text x="111.3043" y="421.1014" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Pause process (cannot be caught)</ns0:text>
  <ns0:text x="309.1787" y="396.3671" font-family="monospace" font-size="10" fill="var(--text)">SIGCONT (18)</ns0:text>
  <ns0:text x="395.7488" y="396.3671" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Resume stopped process</ns0:text>
  <ns0:text x="309.1787" y="408.7343" font-family="monospace" font-size="10" fill="var(--text)">SIGINT   (2)</ns0:text>
  <ns0:text x="395.7488" y="408.7343" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Interrupt (Ctrl+C)</ns0:text>
  <ns0:text x="309.1787" y="421.1014" font-family="monospace" font-size="10" fill="var(--text)">SIGCHLD (17)</ns0:text>
  <ns0:text x="395.7488" y="421.1014" font-family="sans-serif" font-size="10" fill="var(--text-muted)">Child state changed — reap zombie with wait()</ns0:text>
  <ns0:text x="593.6232" y="396.3671" font-family="monospace" font-size="10" fill="var(--text)">ps STAT codes:</ns0:text>
  <ns0:text x="593.6232" y="408.7343" font-family="monospace" font-size="10" fill="var(--text)">R=running  S=sleeping  D=uninterruptible</ns0:text>
  <ns0:text x="593.6232" y="421.1014" font-family="monospace" font-size="10" fill="var(--text)">T=stopped  Z=zombie  X=dead</ns0:text>

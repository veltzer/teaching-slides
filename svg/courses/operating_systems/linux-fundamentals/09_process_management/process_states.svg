<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#b71c1c" />
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
  </defs>
  <rect width="888.8889" height="500" fill="var(--bg)" rx="6.7383"/>
  <circle cx="278.8889" cy="218.8889" r="52.0833" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.8551" filter="url(#shadow)" />
  <text x="278.8889" y="214.7223" text-anchor="middle" font-family="sans-serif" font-size="11.2305" font-weight="bold" fill="var(--primary-accent)">CREATED</text>
  <text x="278.8889" y="228.6111" text-anchor="middle" font-family="sans-serif" font-size="11.2305" fill="var(--text-muted)">fork() called</text>
  <text x="278.8889" y="239.7222" text-anchor="middle" font-family="monospace" font-size="11.2305" fill="var(--primary-accent)">S state</text>
  <circle cx="473.3333" cy="218.8889" r="52.0833" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.8551" filter="url(#shadow)" />
  <text x="473.3333" y="214.7223" text-anchor="middle" font-family="sans-serif" font-size="11.2305" font-weight="bold" fill="var(--ok-accent)">READY</text>
  <text x="473.3333" y="228.6111" text-anchor="middle" font-family="sans-serif" font-size="11.2305" fill="var(--text-muted)">Waiting for CPU</text>
  <text x="473.3333" y="239.7222" text-anchor="middle" font-family="monospace" font-size="11.2305" fill="var(--ok-accent)">R state</text>
  <circle cx="667.7778" cy="218.8889" r="59.0278" fill="url(#grad-primary)" filter="url(#shadow)" />
  <text x="667.7778" y="213.3333" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="var(--bg)">RUNNING</text>
  <text x="667.7778" y="228.6111" text-anchor="middle" font-family="sans-serif" font-size="11.2305" fill="var(--primary-accent)">On CPU</text>
  <text x="667.7778" y="241.1111" text-anchor="middle" font-family="monospace" font-size="11.2305" fill="var(--primary-accent)">R state</text>
  <circle cx="862.2222" cy="218.8889" r="55.5556" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.8551" filter="url(#shadow)" />
  <text x="862.2222" y="211.9444" text-anchor="middle" font-family="sans-serif" font-size="11.2305" font-weight="bold" fill="var(--warn-accent)">WAITING</text>
  <text x="862.2222" y="225.8334" text-anchor="middle" font-family="sans-serif" font-size="11.2305" fill="var(--danger-accent)">(SLEEPING)</text>
  <text x="862.2222" y="238.3333" text-anchor="middle" font-family="sans-serif" font-size="11.2305" fill="var(--text-muted)">I/O or event</text>
  <text x="862.2222" y="249.4444" text-anchor="middle" font-family="monospace" font-size="11.2305" fill="var(--warn-accent)">S / D state</text>
  <circle cx="473.3333" cy="420.2778" r="52.0833" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="1.8551" filter="url(#shadow)" />
  <text x="473.3333" y="416.1111" text-anchor="middle" font-family="sans-serif" font-size="11.2305" font-weight="bold" fill="var(--info-accent)">STOPPED</text>
  <text x="473.3333" y="430" text-anchor="middle" font-family="sans-serif" font-size="11.2305" fill="var(--text-muted)">SIGSTOP / Ctrl+Z</text>
  <text x="473.3333" y="441.1111" text-anchor="middle" font-family="monospace" font-size="11.2305" fill="var(--info-accent)">T state</text>
  <circle cx="862.2222" cy="420.2778" r="52.0833" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.8551" filter="url(#shadow)" />
  <text x="862.2222" y="416.1111" text-anchor="middle" font-family="sans-serif" font-size="11.2305" font-weight="bold" fill="var(--danger-accent)">ZOMBIE</text>
  <text x="862.2222" y="430" text-anchor="middle" font-family="sans-serif" font-size="11.2305" fill="var(--text-muted)">Terminated,</text>
  <text x="862.2222" y="441.1111" text-anchor="middle" font-family="sans-serif" font-size="11.2305" fill="var(--text-muted)">not reaped</text>
  <text x="862.2222" y="453.6111" text-anchor="middle" font-family="monospace" font-size="11.2305" fill="var(--danger-accent)">Z state</text>
  <rect x="973.3333" y="399.4444" width="90.2778" height="41.6666" rx="6.7383" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1018.4722" y="418.1944" text-anchor="middle" font-family="sans-serif" font-size="11.2305" font-weight="bold" fill="var(--text-muted)">DEAD</text>
  <text x="1018.4722" y="432.0833" text-anchor="middle" font-family="sans-serif" font-size="11.2305" fill="var(--text-faint)">Resources freed</text>
  <line x1="330.9722" y1="218.8889" x2="421.25" y2="218.8889" stroke="var(--ok-border)" stroke-width="1.5459" marker-end="url(#arrow-ok)" />
  <text x="376.1111" y="211.9444" text-anchor="middle" font-family="sans-serif" font-size="11.2305" fill="var(--ok-accent)">admitted</text>
  <line x1="525.4167" y1="218.8889" x2="608.75" y2="218.8889" stroke="var(--primary-border)" stroke-width="1.5459" marker-end="url(#arrow-primary)" />
  <text x="567.0834" y="210.5555" text-anchor="middle" font-family="sans-serif" font-size="11.2305" fill="var(--primary-accent)">scheduled</text>
  <path d="M 626.1111 194.5833 Q 567.0834 170.2778 528.8889 194.5833" stroke="var(--warn-border)" stroke-width="1.2367" fill="none" marker-end="url(#arrow-warn)" />
  <text x="577.5" y="171.6667" text-anchor="middle" font-family="sans-serif" font-size="11.2305" fill="var(--warn-accent)">preempted</text>
  <line x1="726.8056" y1="218.8889" x2="806.6667" y2="218.8889" stroke="var(--warn-border)" stroke-width="1.5459" marker-end="url(#arrow-warn)" />
  <text x="766.3889" y="210.5555" text-anchor="middle" font-family="sans-serif" font-size="11.2305" fill="var(--warn-accent)">I/O wait</text>
  <path d="M 820.5555 260.5555 Q 764.9999 309.1667 542.7777 267.5" stroke="var(--ok-border)" stroke-width="1.2367" fill="none" marker-end="url(#arrow-ok)" />
  <text x="681.6666" y="312.6389" text-anchor="middle" font-family="sans-serif" font-size="11.2305" fill="var(--ok-accent)">I/O complete / event</text>
  <path d="M 640 274.4444 Q 584.4444 343.8888 528.8889 378.6111" stroke="var(--info-border)" stroke-width="1.2367" fill="none" marker-end="url(#arrow-purple)" />
  <text x="560.1389" y="336.9445" text-anchor="middle" font-family="sans-serif" font-size="11.2305" fill="var(--info-accent)">SIGSTOP</text>
  <path d="M 431.6666 385.5556 Q 403.8888 295.2777 424.7223 267.5" stroke="var(--ok-border)" stroke-width="1.2367" fill="none" marker-end="url(#arrow-ok)" />
  <text x="388.6111" y="330" text-anchor="middle" font-family="sans-serif" font-size="11.2305" fill="var(--ok-accent)">SIGCONT</text>
  <path d="M 712.9166 267.5 Q 792.7777 343.8888 813.6111 378.6111" stroke="var(--danger-border)" stroke-width="1.2367" fill="none" marker-end="url(#arrow-danger)" />
  <text x="778.8889" y="335.5556" text-anchor="middle" font-family="sans-serif" font-size="11.2305" fill="var(--danger-accent)">exit()</text>
  <line x1="914.3055" y1="420.2778" x2="973.3333" y2="420.2778" stroke="var(--text-muted)" stroke-width="1.2367" marker-end="url(#arrow)" />
  <text x="943.4722" y="413.3333" text-anchor="middle" font-family="sans-serif" font-size="11.2305" fill="var(--text-muted)">parent wait()</text>
  <path d="M 723.3333 184.1666 Q 862.2222 114.7223 914.3055 368.1945" stroke="var(--danger-border)" stroke-width="1.2367" stroke-dasharray="3.7101 1.8551" fill="none" marker-end="url(#arrow-danger)" />
  <text x="862.2222" y="135.5556" text-anchor="middle" font-family="sans-serif" font-size="11.2305" fill="var(--danger-accent)">SIGKILL (kill -9)</text>
  <defs>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-deep)" />
    </marker>
  </defs>
  <rect x="212.9166" y="489.7222" width="854.1666" height="76.3889" rx="6.7383" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="230.2778" y="509.1666" font-family="sans-serif" font-size="11.2305" font-weight="bold" fill="var(--primary-accent)">Key Signals</text>
  <text x="230.2778" y="525.1388" font-family="monospace" font-size="11.2305" fill="var(--text)">SIGTERM (15)</text>
  <text x="320.5555" y="525.1388" font-family="sans-serif" font-size="11.2305" fill="var(--text-muted)">Graceful terminate (default kill)</text>
  <text x="230.2778" y="539.0278" font-family="monospace" font-size="11.2305" fill="var(--text)">SIGKILL  (9)</text>
  <text x="320.5555" y="539.0278" font-family="sans-serif" font-size="11.2305" fill="var(--text-muted)">Force kill — cannot be caught or ignored</text>
  <text x="230.2778" y="552.9166" font-family="monospace" font-size="11.2305" fill="var(--text)">SIGSTOP (19)</text>
  <text x="320.5555" y="552.9166" font-family="sans-serif" font-size="11.2305" fill="var(--text-muted)">Pause process (cannot be caught)</text>
  <text x="542.7777" y="525.1388" font-family="monospace" font-size="11.2305" fill="var(--text)">SIGCONT (18)</text>
  <text x="640" y="525.1388" font-family="sans-serif" font-size="11.2305" fill="var(--text-muted)">Resume stopped process</text>
  <text x="542.7777" y="539.0278" font-family="monospace" font-size="11.2305" fill="var(--text)">SIGINT   (2)</text>
  <text x="640" y="539.0278" font-family="sans-serif" font-size="11.2305" fill="var(--text-muted)">Interrupt (Ctrl+C)</text>
  <text x="542.7777" y="552.9166" font-family="monospace" font-size="11.2305" fill="var(--text)">SIGCHLD (17)</text>
  <text x="640" y="552.9166" font-family="sans-serif" font-size="11.2305" fill="var(--text-muted)">Child state changed — reap zombie with wait()</text>
  <text x="862.2222" y="525.1388" font-family="monospace" font-size="11.2305" fill="var(--text)">ps STAT codes:</text>
  <text x="862.2222" y="539.0278" font-family="monospace" font-size="11.2305" fill="var(--text)">R=running  S=sleeping  D=uninterruptible</text>
  <text x="862.2222" y="552.9166" font-family="monospace" font-size="11.2305" fill="var(--text)">T=stopped  Z=zombie  X=dead</text>
</svg>
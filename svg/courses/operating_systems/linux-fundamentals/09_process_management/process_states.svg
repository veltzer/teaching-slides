<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.579135622711" font-weight="bold" fill="var(--text)">Linux Process States</text>

  <rect x="60" y="154.954954954955" width="140" height="114.954954954955" rx="14.311842258383" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="130" y="196.756756756757" text-anchor="middle" font-size="18.400940046492" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">CREATED</text>
  <text x="130" y="228.108108108108" text-anchor="middle" font-size="14.311842258383" fill="var(--primary-text)" font-family="Courier New, monospace">fork()</text>
  <text x="130" y="254.234234234234" text-anchor="middle" font-size="14.311842258383" fill="var(--primary-text)" font-family="Courier New, monospace">S state</text>

  <rect x="270" y="154.954954954955" width="140" height="114.954954954955" rx="14.311842258383" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="196.756756756757" text-anchor="middle" font-size="18.400940046492" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">READY</text>
  <text x="340" y="228.108108108108" text-anchor="middle" font-size="14.311842258383" fill="var(--ok-text)" font-family="Arial, sans-serif">Wait for CPU</text>
  <text x="340" y="254.234234234234" text-anchor="middle" font-size="14.311842258383" fill="var(--ok-text)" font-family="Courier New, monospace">R state</text>

  <rect x="480" y="154.954954954955" width="140" height="114.954954954955" rx="14.311842258383" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="550" y="196.756756756757" text-anchor="middle" font-size="18.400940046492" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">RUNNING</text>
  <text x="550" y="228.108108108108" text-anchor="middle" font-size="14.311842258383" fill="var(--primary-text)" font-family="Arial, sans-serif">On CPU</text>
  <text x="550" y="254.234234234234" text-anchor="middle" font-size="14.311842258383" fill="var(--primary-text)" font-family="Courier New, monospace">R state</text>

  <rect x="690" y="154.954954954955" width="150" height="114.954954954955" rx="14.311842258383" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="765" y="196.756756756757" text-anchor="middle" font-size="18.400940046492" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">WAITING</text>
  <text x="765" y="228.108108108108" text-anchor="middle" font-size="14.311842258383" fill="var(--warn-text)" font-family="Arial, sans-serif">I/O or event</text>
  <text x="765" y="254.234234234234" text-anchor="middle" font-size="14.311842258383" fill="var(--warn-text)" font-family="Courier New, monospace">S / D state</text>

  <rect x="350" y="363.963963963964" width="140" height="114.954954954955" rx="14.311842258383" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="420" y="405.765765765766" text-anchor="middle" font-size="18.400940046492" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">STOPPED</text>
  <text x="420" y="437.117117117117" text-anchor="middle" font-size="14.311842258383" fill="var(--info-text)" font-family="Arial, sans-serif">Ctrl+Z</text>
  <text x="420" y="463.243243243243" text-anchor="middle" font-size="14.311842258383" fill="var(--info-text)" font-family="Courier New, monospace">T state</text>

  <rect x="690" y="363.963963963964" width="150" height="114.954954954955" rx="14.311842258383" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="765" y="405.765765765766" text-anchor="middle" font-size="18.400940046492" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">ZOMBIE</text>
  <text x="765" y="437.117117117117" text-anchor="middle" font-size="14.311842258383" fill="var(--danger-text)" font-family="Arial, sans-serif">Not reaped</text>
  <text x="765" y="463.243243243243" text-anchor="middle" font-size="14.311842258383" fill="var(--danger-text)" font-family="Courier New, monospace">Z state</text>

  <rect x="900" y="384.864864864865" width="140" height="78.378378378378" rx="8.178195576219" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="970" y="416.216216216216" text-anchor="middle" font-size="16.356391152437" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">DEAD</text>
  <text x="970" y="442.342342342342" text-anchor="middle" font-size="13.289567811355" fill="var(--text-faint)" font-family="Arial, sans-serif">Resources freed</text>

  <line x1="200" y1="212.432432432432" x2="268" y2="212.432432432432" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="410" y1="212.432432432432" x2="478" y2="212.432432432432" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="620" y1="212.432432432432" x2="688" y2="212.432432432432" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <path d="M 690 233.333333333333 Q 550 290.810810810811 420 233.333333333333" stroke="var(--ok-border)" stroke-width="2" fill="none" marker-end="url(#arrow-ok)"/>
  <path d="M 480 249.009009009009 Q 450 311.711711711712 420 361.873873873874" stroke="var(--info-border)" stroke-width="2" fill="none" marker-end="url(#arrow-info)"/>
  <path d="M 620 269.90990990991 Q 700 332.612612612613 760 361.873873873874" stroke="var(--danger-border)" stroke-width="2" fill="none" marker-end="url(#arrow-danger)"/>
  <line x1="840" y1="421.441441441441" x2="898" y2="421.441441441441" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="869" y="414.126126126126" text-anchor="middle" font-size="12.267293364328" fill="var(--text-muted)" font-family="Arial, sans-serif">wait()</text>

  <rect x="40" y="520.720720720721" width="1200" height="99.279279279279" rx="8.178195576219" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="546.846846846847" font-size="15.33411670541" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Signals</text>
  <text x="60" y="572.972972972973" font-size="14.311842258383" fill="var(--text)" font-family="Courier New, monospace">SIGTERM</text>
  <text x="160" y="572.972972972973" font-size="14.311842258383" fill="var(--text-muted)" font-family="Arial, sans-serif">graceful</text>
  <text x="260" y="572.972972972973" font-size="14.311842258383" fill="var(--text)" font-family="Courier New, monospace">SIGKILL</text>
  <text x="350" y="572.972972972973" font-size="14.311842258383" fill="var(--text-muted)" font-family="Arial, sans-serif">force</text>
  <text x="420" y="572.972972972973" font-size="14.311842258383" fill="var(--text)" font-family="Courier New, monospace">SIGSTOP</text>
  <text x="520" y="572.972972972973" font-size="14.311842258383" fill="var(--text-muted)" font-family="Arial, sans-serif">pause</text>
  <text x="60" y="599.099099099099" font-size="14.311842258383" fill="var(--text)" font-family="Courier New, monospace">SIGCONT</text>
  <text x="160" y="599.099099099099" font-size="14.311842258383" fill="var(--text-muted)" font-family="Arial, sans-serif">resume</text>
  <text x="260" y="599.099099099099" font-size="14.311842258383" fill="var(--text)" font-family="Courier New, monospace">SIGINT</text>
  <text x="350" y="599.099099099099" font-size="14.311842258383" fill="var(--text-muted)" font-family="Arial, sans-serif">Ctrl+C</text>
  <text x="420" y="599.099099099099" font-size="14.311842258383" fill="var(--text)" font-family="Courier New, monospace">SIGCHLD</text>
  <text x="520" y="599.099099099099" font-size="14.311842258383" fill="var(--text-muted)" font-family="Arial, sans-serif">reap zombie</text>
  <text x="700" y="572.972972972973" font-size="14.311842258383" fill="var(--text)" font-family="Courier New, monospace">ps STAT</text>
  <text x="700" y="599.099099099099" font-size="14.311842258383" fill="var(--text)" font-family="Courier New, monospace">R S D T Z X</text>
</svg>

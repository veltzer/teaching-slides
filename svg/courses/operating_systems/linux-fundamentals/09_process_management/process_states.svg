      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="791.4976" height="445.2174" fill="var(--bg)" />
  <ns0:circle cx="74.2029" cy="123.6715" r="46.3768" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="1.8551" filter="url(#shadow)" />

  <ns0:rect width="791.4976" height="445.2174" fill="#ffffff" />
  <ns0:circle cx="74.2029" cy="123.6715" r="46.3768" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.8551" filter="url(#shadow)" />
  <ns0:text x="74.2029" y="119.9614" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1565c0">CREATED</ns0:text>
  <ns0:text x="74.2029" y="132.3285" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#555555">fork() called</ns0:text>
  <ns0:text x="74.2029" y="142.2222" text-anchor="middle" font-family="monospace" font-size="10" fill="#1565c0">S state</ns0:text>
  <ns0:circle cx="247.343" cy="123.6715" r="46.3768" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.8551" filter="url(#shadow)" />
  <ns0:text x="247.343" y="119.9614" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#2e7d32">READY</ns0:text>
  <ns0:text x="247.343" y="132.3285" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#555555">Waiting for CPU</ns0:text>
  <ns0:text x="247.343" y="142.2222" text-anchor="middle" font-family="monospace" font-size="10" fill="#2e7d32">R state</ns0:text>
  <ns0:circle cx="420.4831" cy="123.6715" r="52.5604" fill="url(#grad-accent)" filter="url(#shadow)" />
  <ns0:text x="420.4831" y="118.7246" text-anchor="middle" font-family="sans-serif" font-size="11.1304" font-weight="bold" fill="#ffffff">RUNNING</ns0:text>
  <ns0:text x="420.4831" y="132.3285" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#bbdefb">On CPU</ns0:text>
  <ns0:text x="420.4831" y="143.4589" text-anchor="middle" font-family="monospace" font-size="10" fill="#90caf9">R state</ns0:text>
  <ns0:circle cx="593.6232" cy="123.6715" r="49.4686" fill="#fff3e0" stroke="#e65100" stroke-width="1.8551" filter="url(#shadow)" />

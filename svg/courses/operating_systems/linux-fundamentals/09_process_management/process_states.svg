<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect width="847.7963" height="441.6095" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="440.44" y="265.524" width="95.6058" height="95.6058" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="0.8512" filter="url(#shadow)"/>
  <text x="488.2433" y="309.6468" text-anchor="middle" font-size="15.8522" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">CREATED</text>
  <text x="488.2433" y="321.9137" text-anchor="middle" font-size="15.8522" fill="var(--text-muted)" font-family="Arial, sans-serif">fork() called</text>
  <text x="488.2433" y="331.7273" text-anchor="middle" font-size="15.8522" fill="var(--primary-accent)" font-family="Courier New, monospace">S state</text>
  <rect x="625.896" y="265.524" width="95.6058" height="95.6058" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="0.8512" filter="url(#shadow)"/>
  <text x="673.6986" y="309.6468" text-anchor="middle" font-size="15.8522" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">READY</text>
  <text x="673.6986" y="321.9137" text-anchor="middle" font-size="15.8522" fill="var(--text-muted)" font-family="Arial, sans-serif">Waiting for CPU</text>
  <text x="673.6986" y="331.7273" text-anchor="middle" font-size="15.8522" fill="var(--ok-accent)" font-family="Courier New, monospace">R state</text>
  <rect x="804.977" y="259.15" width="108.353" height="108.353" rx="14" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="859.1541" y="308.42" text-anchor="middle" font-size="15.8522" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">RUNNING</text>
  <text x="859.1541" y="321.9137" text-anchor="middle" font-size="15.8522" fill="var(--primary-accent)" font-family="Arial, sans-serif">On CPU</text>
  <text x="859.1541" y="332.9539" text-anchor="middle" font-size="15.8522" fill="var(--primary-accent)" font-family="Courier New, monospace">R state</text>
  <rect x="993.62" y="262.337" width="101.98" height="101.98" rx="14" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="0.8512" filter="url(#shadow)"/>
  <text x="1044.6095" y="307.1934" text-anchor="middle" font-size="15.8522" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">WAITING</text>
  <text x="1044.6095" y="319.4604" text-anchor="middle" font-size="15.8522" fill="var(--danger-accent)" font-family="Arial, sans-serif">(SLEEPING)</text>
  <text x="1044.6095" y="330.5005" text-anchor="middle" font-size="15.8522" fill="var(--text-muted)" font-family="Arial, sans-serif">I/O or event</text>
  <text x="1044.6095" y="340.314" text-anchor="middle" font-size="15.8522" fill="var(--warn-accent)" font-family="Courier New, monospace">S / D state</text>
  <rect x="625.896" y="443.394" width="95.6058" height="95.6058" rx="14" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="0.8512" filter="url(#shadow)"/>
  <text x="673.6986" y="487.5173" text-anchor="middle" font-size="15.8522" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">STOPPED</text>
  <text x="673.6986" y="499.7842" text-anchor="middle" font-size="15.8522" fill="var(--text-muted)" font-family="Arial, sans-serif">SIGSTOP / Ctrl+Z</text>
  <text x="673.6986" y="509.5978" text-anchor="middle" font-size="15.8522" fill="var(--info-accent)" font-family="Courier New, monospace">T state</text>
  <rect x="996.807" y="443.394" width="95.6058" height="95.6058" rx="14" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="0.8512" filter="url(#shadow)"/>
  <text x="1044.6095" y="487.5173" text-anchor="middle" font-size="15.8522" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">ZOMBIE</text>
  <text x="1044.6095" y="499.7842" text-anchor="middle" font-size="15.8522" fill="var(--text-muted)" font-family="Arial, sans-serif">Terminated,</text>
  <text x="1044.6095" y="509.5978" text-anchor="middle" font-size="15.8522" fill="var(--text-muted)" font-family="Arial, sans-serif">not reaped</text>
  <text x="1044.6095" y="520.638" text-anchor="middle" font-size="15.8522" fill="var(--danger-accent)" font-family="Courier New, monospace">Z state</text>
  <rect x="1150.584" y="472.7968" width="86.1044" height="36.8006" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1193.6362" y="489.3571" text-anchor="middle" font-size="15.8522" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">DEAD</text>
  <text x="1193.6362" y="501.6243" text-anchor="middle" font-size="15.8522" fill="var(--text-faint)" font-family="Arial, sans-serif">Resources freed</text>
  <line x1="537.9187" y1="313.3268" x2="624.023" y2="313.3268" stroke="var(--ok-border)" stroke-width="0.7094" marker-end="url(#arrow-ok)" />
  <text x="580.9709" y="307.1934" text-anchor="middle" font-size="15.8522" fill="var(--ok-accent)" font-family="Arial, sans-serif">admitted</text>
  <line x1="723.3742" y1="313.3268" x2="802.8551" y2="313.3268" stroke="var(--primary-border)" stroke-width="0.7094" marker-end="url(#arrow-primary)" />
  <text x="763.1146" y="305.9666" text-anchor="middle" font-size="15.8522" fill="var(--primary-accent)" font-family="Arial, sans-serif">scheduled</text>
  <path d="M 819.4136 291.8597 Q 763.1146 270.3926 726.6859 291.8597" stroke="var(--warn-border)" stroke-width="0.5675" fill="none" marker-end="url(#arrow-warn)" />
  <text x="773.0498" y="271.6194" text-anchor="middle" font-size="15.8522" fill="var(--warn-accent)" font-family="Arial, sans-serif">preempted</text>
  <line x1="915.453" y1="313.3268" x2="991.6223" y2="313.3268" stroke="var(--warn-border)" stroke-width="0.7094" marker-end="url(#arrow-warn)" />
  <text x="953.2065" y="305.9666" text-anchor="middle" font-size="15.8522" fill="var(--warn-accent)" font-family="Arial, sans-serif">I/O wait</text>
  <path d="M 1004.8689 350.1276 Q 951.8817 393.0618 739.9327 356.261" stroke="var(--ok-border)" stroke-width="0.5675" fill="none" marker-end="url(#arrow-ok)" />
  <text x="872.4008" y="396.1286" text-anchor="middle" font-size="15.8522" fill="var(--ok-accent)" font-family="Arial, sans-serif">I/O complete / event</text>
  <path d="M 832.6604 362.3945 Q 779.6732 423.7292 726.6859 454.3965" stroke="var(--info-border)" stroke-width="0.5675" fill="none" marker-end="url(#arrow-info)" />
  <text x="756.4912" y="417.5957" text-anchor="middle" font-size="15.8522" fill="var(--info-accent)" font-family="Arial, sans-serif">SIGSTOP</text>
  <path d="M 633.9581 460.5301 Q 607.4644 380.7948 627.3349 356.261" stroke="var(--ok-border)" stroke-width="0.5675" fill="none" marker-end="url(#arrow-ok)" />
  <text x="592.8931" y="411.4623" text-anchor="middle" font-size="15.8522" fill="var(--ok-accent)" font-family="Arial, sans-serif">SIGCONT</text>
  <path d="M 902.2061 356.261 Q 978.3754 423.7292 998.2455 454.3965" stroke="var(--danger-border)" stroke-width="0.5675" fill="none" marker-end="url(#arrow-danger)" />
  <text x="965.1286" y="416.3691" text-anchor="middle" font-size="15.8522" fill="var(--danger-accent)" font-family="Arial, sans-serif">exit()</text>
  <line x1="1094.285" y1="491.1973" x2="1150.584" y2="491.1973" stroke="var(--text-muted)" stroke-width="0.5675" marker-end="url(#arrow)" />
  <text x="1122.1033" y="485.0637" text-anchor="middle" font-size="15.8522" fill="var(--text-muted)" font-family="Arial, sans-serif">parent wait()</text>
  <path d="M 912.1414 282.6595 Q 1044.6095 221.3249 1094.285 445.1964" stroke="var(--danger-border)" stroke-width="0.5675" stroke-dasharray="1.7024 0.8512" fill="none" marker-end="url(#arrow-danger)" />
  <text x="1044.6095" y="239.7254" text-anchor="middle" font-size="15.8522" fill="var(--danger-accent)" font-family="Arial, sans-serif">SIGKILL (kill -9)</text>
  <defs>
  </defs>
  <rect x="425.3207" y="552.5319" width="814.6793" height="67.4681" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="441.8794" y="569.7056" font-size="15.8522" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Key Signals</text>
  <text x="441.8794" y="583.8126" font-size="15.8522" fill="var(--text)" font-family="Courier New, monospace">SIGTERM (15)</text>
  <text x="527.9837" y="583.8126" font-size="15.8522" fill="var(--text-muted)" font-family="Arial, sans-serif">Graceful terminate (default kill)</text>
  <text x="441.8794" y="596.0796" font-size="15.8522" fill="var(--text)" font-family="Courier New, monospace">SIGKILL  (9)</text>
  <text x="527.9837" y="596.0796" font-size="15.8522" fill="var(--text-muted)" font-family="Arial, sans-serif">Force kill — cannot be caught or ignored</text>
  <text x="441.8794" y="608.3464" font-size="15.8522" fill="var(--text)" font-family="Courier New, monospace">SIGSTOP (19)</text>
  <text x="527.9837" y="608.3464" font-size="15.8522" fill="var(--text-muted)" font-family="Arial, sans-serif">Pause process (cannot be caught)</text>
  <text x="739.9327" y="583.8126" font-size="15.8522" fill="var(--text)" font-family="Courier New, monospace">SIGCONT (18)</text>
  <text x="832.6604" y="583.8126" font-size="15.8522" fill="var(--text-muted)" font-family="Arial, sans-serif">Resume stopped process</text>
  <text x="739.9327" y="596.0796" font-size="15.8522" fill="var(--text)" font-family="Courier New, monospace">SIGINT   (2)</text>
  <text x="832.6604" y="596.0796" font-size="15.8522" fill="var(--text-muted)" font-family="Arial, sans-serif">Interrupt (Ctrl+C)</text>
  <text x="739.9327" y="608.3464" font-size="15.8522" fill="var(--text)" font-family="Courier New, monospace">SIGCHLD (17)</text>
  <text x="832.6604" y="608.3464" font-size="15.8522" fill="var(--text-muted)" font-family="Arial, sans-serif">Child state changed — reap zombie with wait()</text>
  <text x="1044.6095" y="583.8126" font-size="15.8522" fill="var(--text)" font-family="Courier New, monospace">ps STAT codes:</text>
  <text x="1044.6095" y="596.0796" font-size="15.8522" fill="var(--text)" font-family="Courier New, monospace">R=running  S=sleeping  D=uninterruptible</text>
  <text x="1044.6095" y="608.3464" font-size="15.8522" fill="var(--text)" font-family="Courier New, monospace">T=stopped  Z=zombie  X=dead</text>
</svg>
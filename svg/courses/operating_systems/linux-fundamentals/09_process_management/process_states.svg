  <ns0:text x="74.2029" y="132.3285" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">fork() called</ns0:text>
  <ns0:text x="74.2029" y="142.2222" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--primary-dk)">S state</ns0:text>
  <ns0:circle cx="247.343" cy="123.6715" r="46.3768" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="1.8551" filter="url(#shadow)" />

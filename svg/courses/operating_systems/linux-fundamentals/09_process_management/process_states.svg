  <ns0:text x="171.9034" y="222.6087" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--ok-dk)">SIGCONT</ns0:text>
  <ns0:path d="M 460.6763 166.9565 Q 531.7874 234.9758 550.3382 265.8937" stroke="var(--danger-deep)" stroke-width="1.2367" fill="none" marker-end="url(#arrow-danger)" />

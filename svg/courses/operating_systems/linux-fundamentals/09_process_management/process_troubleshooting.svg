<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="79.2" text-anchor="middle" font-size="27.7333" font-weight="bold" fill="#333">Process Troubleshooting Toolkit</text>
  <rect x="64" y="144" width="362.6667" height="198" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="245.3333" y="216" text-anchor="middle" font-size="23.4667" font-weight="bold">CPU issues</text>
  <text x="245.3333" y="280.8" text-anchor="middle" font-size="21.3333" font-family="monospace">pidstat -p PID 1</text>
  <rect x="458.6667" y="144" width="362.6667" height="198" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="216" text-anchor="middle" font-size="23.4667" font-weight="bold">Memory issues</text>
  <text x="640" y="280.8" text-anchor="middle" font-size="21.3333" font-family="monospace">ps -o rss,cmd PID</text>
  <rect x="853.3333" y="144" width="362.6667" height="198" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1034.6667" y="216" text-anchor="middle" font-size="23.4667" font-weight="bold">Process tree</text>
  <text x="1034.6667" y="280.8" text-anchor="middle" font-size="21.3333" font-family="monospace">pstree -p PID</text>
  <rect x="64" y="414" width="362.6667" height="198" fill="#fff3e0" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="245.3333" y="486" text-anchor="middle" font-size="23.4667" font-weight="bold">Open files</text>
  <text x="245.3333" y="550.8" text-anchor="middle" font-size="21.3333" font-family="monospace">lsof -p PID</text>
  <rect x="458.6667" y="414" width="362.6667" height="198" fill="#ffebee" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="486" text-anchor="middle" font-size="23.4667" font-weight="bold">System calls</text>
  <text x="640" y="550.8" text-anchor="middle" font-size="21.3333" font-family="monospace">strace -p PID</text>
  <rect x="853.3333" y="414" width="362.6667" height="198" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1034.6667" y="486" text-anchor="middle" font-size="23.4667" font-weight="bold">I/O activity</text>
  <text x="1034.6667" y="550.8" text-anchor="middle" font-size="21.3333" font-family="monospace">iotop -p PID</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="58.954271058141" width="266.6667" height="151.633951471655" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.249705952902" filter="url(#shadow)"/>
  <text x="173.3333" y="153.725517852109" text-anchor="middle" font-size="24.577176983319" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">kill PID</text>
  <line x1="306.6667" y1="134.771246793968" x2="417.7778" y2="134.771246793968" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="417.7778" y="40" width="444.4444" height="189.542493587937" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.249705952902" filter="url(#shadow)"/>
  <text x="639.9999" y="115.816975735828" text-anchor="middle" font-size="22.342907105157" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Signal Delivery</text>
  <text x="639.9999" y="180.261432235465" text-anchor="middle" font-size="22.342907105157" font-family="Arial, sans-serif" fill="var(--warn-text)">kernel delivers to process</text>
  <line x1="862.2222" y1="134.771246793968" x2="951.1112" y2="134.771246793968" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="951.1112" y="58.954271058141" width="288.8888" height="151.633951471655" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.249705952902" filter="url(#shadow)"/>
  <text x="1095.5555" y="153.725517852109" text-anchor="middle" font-size="24.577176983319" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Process</text>
  <rect x="40" y="286.405198265624" width="266.6667" height="113.725517852109" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.249705952902" filter="url(#shadow)"/>
  <text x="173.3333" y="362.222174001451" text-anchor="middle" font-size="22.342907105157" font-family="Arial, sans-serif" fill="var(--ok-text)">SIGTERM (15)</text>
  <text x="173.3333" y="449.411777470204" text-anchor="middle" font-size="22.342907105157" fill="var(--text-muted)" font-family="Arial, sans-serif">graceful stop</text>
  <rect x="351.1111" y="286.405198265624" width="266.6667" height="113.725517852109" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.249705952902" filter="url(#shadow)"/>
  <text x="484.4444" y="362.222174001451" text-anchor="middle" font-size="22.342907105157" font-family="Arial, sans-serif" fill="var(--danger-text)">SIGKILL (9)</text>
  <text x="484.4444" y="449.411777470204" text-anchor="middle" font-size="22.342907105157" fill="var(--text-muted)" font-family="Arial, sans-serif">force kill</text>
  <rect x="662.2222" y="286.405198265624" width="266.6667" height="113.725517852109" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.249705952902" filter="url(#shadow)"/>
  <text x="795.5556" y="362.222174001451" text-anchor="middle" font-size="22.342907105157" font-family="Arial, sans-serif" fill="var(--info-text)">SIGSTOP (19)</text>
  <text x="795.5556" y="449.411777470204" text-anchor="middle" font-size="22.342907105157" fill="var(--text-muted)" font-family="Arial, sans-serif">pause process</text>
  <rect x="973.3333" y="286.405198265624" width="266.6667" height="113.725517852109" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.249705952902" filter="url(#shadow)"/>
  <text x="1106.6667" y="362.222174001451" text-anchor="middle" font-size="22.342907105157" font-family="Arial, sans-serif" fill="var(--primary-text)">SIGCONT (18)</text>
  <text x="1106.6667" y="449.411777470204" text-anchor="middle" font-size="22.342907105157" fill="var(--text-muted)" font-family="Arial, sans-serif">resume</text>
  <rect x="40" y="513.856233969841" width="1200" height="106.143766030159" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.249705952902" opacity="0.5" filter="url(#shadow)"/>
  <text x="639.9999" y="585.882333794694" text-anchor="middle" font-size="22.342907105157" font-family="Arial, sans-serif" fill="var(--danger-text)">SIGKILL and SIGSTOP cannot be caught or ignored by the process</text>
</svg>

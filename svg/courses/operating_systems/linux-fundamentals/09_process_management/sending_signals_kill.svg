<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="605.2009" y="74.8936" text-anchor="middle" font-size="26.2253" font-weight="bold" fill="var(--text)">Sending Signals to Processes</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowsig" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="60.5201" y="136.1702" width="242.0804" height="136.1702" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="181.5603" y="221.2766" text-anchor="middle" font-size="22.1907" font-weight="bold">kill PID</text>
  <line x1="302.6005" y1="204.2553" x2="403.4673" y2="204.2553" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowsig)" />
  <rect x="403.4673" y="119.1489" width="403.4673" height="170.2128" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="605.2009" y="187.234" text-anchor="middle" font-size="20.1733" font-weight="bold">Signal Delivery</text>
  <text x="605.2009" y="245.1064" text-anchor="middle" font-size="20.1733">kernel delivers to process</text>
  <line x1="806.9346" y1="204.2553" x2="887.6281" y2="204.2553" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowsig)" />
  <rect x="887.6281" y="136.1702" width="262.2537" height="136.1702" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1018.7549" y="221.2766" text-anchor="middle" font-size="22.1907" font-weight="bold">Process</text>
  <rect x="60.5201" y="340.4255" width="242.0804" height="102.1277" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="181.5603" y="408.5106" text-anchor="middle" font-size="20.1733">SIGTERM (15)</text>
  <text x="181.5603" y="486.8085" text-anchor="middle" font-size="20.1733" fill="var(--text-muted)">graceful stop</text>
  <rect x="342.9472" y="340.4255" width="242.0804" height="102.1277" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="463.9874" y="408.5106" text-anchor="middle" font-size="20.1733">SIGKILL (9)</text>
  <text x="463.9874" y="486.8085" text-anchor="middle" font-size="20.1733" fill="var(--text-muted)">force kill</text>
  <rect x="625.3743" y="340.4255" width="242.0804" height="102.1277" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="746.4145" y="408.5106" text-anchor="middle" font-size="20.1733">SIGSTOP (19)</text>
  <text x="746.4145" y="486.8085" text-anchor="middle" font-size="20.1733" fill="var(--text-muted)">pause process</text>
  <rect x="907.8014" y="340.4255" width="242.0804" height="102.1277" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="1028.8416" y="408.5106" text-anchor="middle" font-size="20.1733">SIGCONT (18)</text>
  <text x="1028.8416" y="486.8085" text-anchor="middle" font-size="20.1733" fill="var(--text-muted)">resume</text>
  <rect x="60.5201" y="544.6809" width="1089.3617" height="95.3191" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" opacity="0.5" />
  <text x="605.2009" y="609.3617" text-anchor="middle" font-size="20.1733">SIGKILL and SIGSTOP cannot be caught or ignored by the process</text>
</svg>
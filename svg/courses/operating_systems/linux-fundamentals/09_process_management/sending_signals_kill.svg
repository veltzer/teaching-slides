<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="79.2" text-anchor="middle" font-size="27.7333" font-weight="bold" fill="#333">Sending Signals to Processes</text>
  <defs>
    <marker id="arrowsig" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="64" y="144" width="256" height="144" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="192" y="234" text-anchor="middle" font-size="23.4667" font-weight="bold">kill PID</text>
  <line x1="320" y1="216" x2="426.6667" y2="216" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowsig)" />
  <rect x="426.6667" y="126" width="426.6667" height="180" fill="#fff3e0" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="198" text-anchor="middle" font-size="21.3333" font-weight="bold">Signal Delivery</text>
  <text x="640" y="259.2" text-anchor="middle" font-size="21.3333">kernel delivers to process</text>
  <line x1="853.3333" y1="216" x2="938.6667" y2="216" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowsig)" />
  <rect x="938.6667" y="144" width="277.3333" height="144" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1077.3333" y="234" text-anchor="middle" font-size="23.4667" font-weight="bold">Process</text>
  <rect x="64" y="360" width="256" height="108" fill="#e8f5e9" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="192" y="432" text-anchor="middle" font-size="21.3333">SIGTERM (15)</text>
  <text x="192" y="514.8" text-anchor="middle" font-size="21.3333" fill="#666">graceful stop</text>
  <rect x="362.6667" y="360" width="256" height="108" fill="#ffebee" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="490.6667" y="432" text-anchor="middle" font-size="21.3333">SIGKILL (9)</text>
  <text x="490.6667" y="514.8" text-anchor="middle" font-size="21.3333" fill="#666">force kill</text>
  <rect x="661.3333" y="360" width="256" height="108" fill="#f3e5f5" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="789.3333" y="432" text-anchor="middle" font-size="21.3333">SIGSTOP (19)</text>
  <text x="789.3333" y="514.8" text-anchor="middle" font-size="21.3333" fill="#666">pause process</text>
  <rect x="960" y="360" width="256" height="108" fill="#e3f2fd" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="1088" y="432" text-anchor="middle" font-size="21.3333">SIGCONT (18)</text>
  <text x="1088" y="514.8" text-anchor="middle" font-size="21.3333" fill="#666">resume</text>
  <rect x="64" y="576" width="1152" height="100.8" fill="#ffebee" stroke="#333" stroke-width="2.1333" rx="8.5333" opacity="0.5" />
  <text x="640" y="644.4" text-anchor="middle" font-size="21.3333">SIGKILL and SIGSTOP cannot be caught or ignored by the process</text>
</svg>
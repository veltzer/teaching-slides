<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="639.9999" y="40" text-anchor="middle" font-size="27.8852" font-weight="bold" fill="var(--text)">Sending Signals to Processes</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowsig" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="40" y="102.8916" width="266.6667" height="139.759" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="173.3333" y="190.241" text-anchor="middle" font-size="23.5952" font-weight="bold">kill PID</text>
  <line x1="306.6667" y1="172.7711" x2="417.7778" y2="172.7711" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowsig)" />
  <rect x="417.7778" y="85.4217" width="444.4444" height="174.6988" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="155.3012" text-anchor="middle" font-size="21.4502" font-weight="bold">Signal Delivery</text>
  <text x="639.9999" y="214.6988" text-anchor="middle" font-size="21.4502">kernel delivers to process</text>
  <line x1="862.2222" y1="172.7711" x2="951.1112" y2="172.7711" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowsig)" />
  <rect x="951.1112" y="102.8916" width="288.8888" height="139.759" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1095.5555" y="190.241" text-anchor="middle" font-size="23.5952" font-weight="bold">Process</text>
  <rect x="40" y="312.5301" width="266.6667" height="104.8193" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="173.3333" y="382.4096" text-anchor="middle" font-size="21.4502">SIGTERM (15)</text>
  <text x="173.3333" y="462.7711" text-anchor="middle" font-size="21.4502" fill="var(--text-muted)">graceful stop</text>
  <rect x="351.1111" y="312.5301" width="266.6667" height="104.8193" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="484.4444" y="382.4096" text-anchor="middle" font-size="21.4502">SIGKILL (9)</text>
  <text x="484.4444" y="462.7711" text-anchor="middle" font-size="21.4502" fill="var(--text-muted)">force kill</text>
  <rect x="662.2222" y="312.5301" width="266.6667" height="104.8193" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="795.5556" y="382.4096" text-anchor="middle" font-size="21.4502">SIGSTOP (19)</text>
  <text x="795.5556" y="462.7711" text-anchor="middle" font-size="21.4502" fill="var(--text-muted)">pause process</text>
  <rect x="973.3333" y="312.5301" width="266.6667" height="104.8193" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1106.6667" y="382.4096" text-anchor="middle" font-size="21.4502">SIGCONT (18)</text>
  <text x="1106.6667" y="462.7711" text-anchor="middle" font-size="21.4502" fill="var(--text-muted)">resume</text>
  <rect x="40" y="522.1687" width="1200" height="97.8313" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" opacity="0.5" filter="url(#shadow)"/>
  <text x="639.9999" y="588.5542" text-anchor="middle" font-size="21.4502">SIGKILL and SIGSTOP cannot be caught or ignored by the process</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="639.9999" y="40" text-anchor="middle" font-size="27.8852" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Sending Signals to Processes</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="102.8916" width="266.6667" height="139.759" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="173.3333" y="190.241" text-anchor="middle" font-size="23.5952" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">kill PID</text>
  <line x1="306.6667" y1="172.7711" x2="417.7778" y2="172.7711" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="417.7778" y="85.4217" width="444.4444" height="174.6988" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="155.3012" text-anchor="middle" font-size="21.4502" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Signal Delivery</text>
  <text x="639.9999" y="214.6988" text-anchor="middle" font-size="21.4502" font-family="Arial, sans-serif" fill="var(--warn-text)">kernel delivers to process</text>
  <line x1="862.2222" y1="172.7711" x2="951.1112" y2="172.7711" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="951.1112" y="102.8916" width="288.8888" height="139.759" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1095.5555" y="190.241" text-anchor="middle" font-size="23.5952" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Process</text>
  <rect x="40" y="312.5301" width="266.6667" height="104.8193" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="173.3333" y="382.4096" text-anchor="middle" font-size="21.4502" font-family="Arial, sans-serif" fill="var(--ok-text)">SIGTERM (15)</text>
  <text x="173.3333" y="462.7711" text-anchor="middle" font-size="21.4502" fill="var(--text-muted)" font-family="Arial, sans-serif">graceful stop</text>
  <rect x="351.1111" y="312.5301" width="266.6667" height="104.8193" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="484.4444" y="382.4096" text-anchor="middle" font-size="21.4502" font-family="Arial, sans-serif" fill="var(--danger-text)">SIGKILL (9)</text>
  <text x="484.4444" y="462.7711" text-anchor="middle" font-size="21.4502" fill="var(--text-muted)" font-family="Arial, sans-serif">force kill</text>
  <rect x="662.2222" y="312.5301" width="266.6667" height="104.8193" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="795.5556" y="382.4096" text-anchor="middle" font-size="21.4502" font-family="Arial, sans-serif" fill="var(--info-text)">SIGSTOP (19)</text>
  <text x="795.5556" y="462.7711" text-anchor="middle" font-size="21.4502" fill="var(--text-muted)" font-family="Arial, sans-serif">pause process</text>
  <rect x="973.3333" y="312.5301" width="266.6667" height="104.8193" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1106.6667" y="382.4096" text-anchor="middle" font-size="21.4502" font-family="Arial, sans-serif" fill="var(--primary-text)">SIGCONT (18)</text>
  <text x="1106.6667" y="462.7711" text-anchor="middle" font-size="21.4502" fill="var(--text-muted)" font-family="Arial, sans-serif">resume</text>
  <rect x="40" y="522.1687" width="1200" height="97.8313" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" opacity="0.5" filter="url(#shadow)"/>
  <text x="639.9999" y="588.5542" text-anchor="middle" font-size="21.4502" font-family="Arial, sans-serif" fill="var(--danger-text)">SIGKILL and SIGSTOP cannot be caught or ignored by the process</text>
</svg>

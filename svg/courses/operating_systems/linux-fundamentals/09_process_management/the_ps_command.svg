<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="662.2222" y="40" text-anchor="middle" font-size="27.3153" font-weight="bold" fill="var(--text)">Process Tree: init to User Processes</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowps" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="484.4444" y="83.5838" width="355.5556" height="100.578" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="662.2222" y="150.6358" text-anchor="middle" font-size="23.1129" font-weight="bold">init/systemd (PID 1)</text>
  <line x1="573.3333" y1="184.1618" x2="284.4444" y2="251.2139" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowps)" />
  <line x1="662.2222" y1="184.1618" x2="662.2222" y2="251.2139" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowps)" />
  <line x1="751.111" y1="184.1618" x2="1040" y2="251.2139" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowps)" />
  <rect x="106.6667" y="251.2139" width="355.5556" height="93.8728" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="284.4444" y="314.9133" text-anchor="middle" font-size="21.0118">sshd (service)</text>
  <rect x="484.4444" y="251.2139" width="355.5556" height="93.8728" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="662.2222" y="314.9133" text-anchor="middle" font-size="21.0118">cron (scheduler)</text>
  <rect x="862.2222" y="251.2139" width="355.5556" height="93.8728" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1040" y="314.9133" text-anchor="middle" font-size="21.0118">nginx (web server)</text>
  <line x1="217.7777" y1="345.0867" x2="151.111" y2="412.1387" stroke="var(--text)" stroke-width="1.9449" marker-end="url(#arrowps)" />
  <line x1="351.1111" y1="345.0867" x2="417.7777" y2="412.1387" stroke="var(--text)" stroke-width="1.9449" marker-end="url(#arrowps)" />
  <rect x="40" y="412.1387" width="222.2222" height="83.815" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="151.111" y="469.133" text-anchor="middle" font-size="21.0118">bash (shell)</text>
  <rect x="306.6667" y="412.1387" width="222.2222" height="83.815" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="417.7777" y="469.133" text-anchor="middle" font-size="21.0118">bash (shell)</text>
  <line x1="151.111" y1="495.9538" x2="151.111" y2="546.2428" stroke="var(--text)" stroke-width="1.9449" marker-end="url(#arrowps)" />
  <rect x="40" y="546.2428" width="222.2222" height="73.7572" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="151.111" y="596.5318" text-anchor="middle" font-size="21.0118">vim (user cmd)</text>
  <rect x="662.2222" y="462.4278" width="577.7778" height="134.1041" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" opacity="0.7" filter="url(#shadow)"/>
  <text x="951.1111" y="512.7168" text-anchor="middle" font-size="21.0118" font-weight="bold">ps shows:</text>
  <text x="951.1111" y="563.0058" text-anchor="middle" font-size="21.0118">PID, PPID, USER, STAT, CMD</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="662.2222" y="40" text-anchor="middle" font-size="27.3153" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Process Tree: init to User Processes</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="484.4444" y="83.5838" width="355.5556" height="100.578" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="662.2222" y="150.6358" text-anchor="middle" font-size="23.1129" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">init/systemd (PID 1)</text>
  <line x1="573.3333" y1="184.1618" x2="284.4444" y2="251.2139" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="662.2222" y1="184.1618" x2="662.2222" y2="251.2139" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="751.111" y1="184.1618" x2="1040" y2="251.2139" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="106.6667" y="251.2139" width="355.5556" height="93.8728" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="284.4444" y="314.9133" text-anchor="middle" font-size="21.0118" font-family="Arial, sans-serif" fill="var(--info-text)">sshd (service)</text>
  <rect x="484.4444" y="251.2139" width="355.5556" height="93.8728" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="662.2222" y="314.9133" text-anchor="middle" font-size="21.0118" font-family="Arial, sans-serif" fill="var(--info-text)">cron (scheduler)</text>
  <rect x="862.2222" y="251.2139" width="355.5556" height="93.8728" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1040" y="314.9133" text-anchor="middle" font-size="21.0118" font-family="Arial, sans-serif" fill="var(--info-text)">nginx (web server)</text>
  <line x1="217.7777" y1="345.0867" x2="151.111" y2="412.1387" stroke="var(--text)" stroke-width="1.9449" marker-end="url(#arrow)"/>
  <line x1="351.1111" y1="345.0867" x2="417.7777" y2="412.1387" stroke="var(--text)" stroke-width="1.9449" marker-end="url(#arrow)"/>
  <rect x="40" y="412.1387" width="222.2222" height="83.815" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="151.111" y="469.133" text-anchor="middle" font-size="21.0118" font-family="Arial, sans-serif" fill="var(--primary-text)">bash (shell)</text>
  <rect x="306.6667" y="412.1387" width="222.2222" height="83.815" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="417.7777" y="469.133" text-anchor="middle" font-size="21.0118" font-family="Arial, sans-serif" fill="var(--primary-text)">bash (shell)</text>
  <line x1="151.111" y1="495.9538" x2="151.111" y2="546.2428" stroke="var(--text)" stroke-width="1.9449" marker-end="url(#arrow)"/>
  <rect x="40" y="546.2428" width="222.2222" height="73.7572" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="151.111" y="596.5318" text-anchor="middle" font-size="21.0118" font-family="Arial, sans-serif" fill="var(--ok-text)">vim (user cmd)</text>
  <rect x="662.2222" y="462.4278" width="577.7778" height="134.1041" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" opacity="0.7" filter="url(#shadow)"/>
  <text x="951.1111" y="512.7168" text-anchor="middle" font-size="21.0118" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">ps shows:</text>
  <text x="951.1111" y="563.0058" text-anchor="middle" font-size="21.0118" font-family="Arial, sans-serif" fill="var(--warn-text)">PID, PPID, USER, STAT, CMD</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="484.4444" y="40" width="355.5556" height="108.749959453126" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.238990215526" filter="url(#shadow)"/>
  <text x="662.2222" y="112.499972968751" text-anchor="middle" font-size="24.033526158738" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">init/systemd (PID 1)</text>
  <line x1="573.3333" y1="148.749959453126" x2="284.4444" y2="221.250040546874" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="662.2222" y1="148.749959453126" x2="662.2222" y2="221.250040546874" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="751.111" y1="148.749959453126" x2="1040" y2="221.250040546874" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="106.6667" y="221.250040546874" width="355.5556" height="101.499962156251" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.238990215526" filter="url(#shadow)"/>
  <text x="284.4444" y="290.125014867187" text-anchor="middle" font-size="21.848735768431" font-family="Arial, sans-serif" fill="var(--info-text)">sshd (service)</text>
  <rect x="484.4444" y="221.250040546874" width="355.5556" height="101.499962156251" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.238990215526" filter="url(#shadow)"/>
  <text x="662.2222" y="290.125014867187" text-anchor="middle" font-size="21.848735768431" font-family="Arial, sans-serif" fill="var(--info-text)">cron (scheduler)</text>
  <rect x="862.2222" y="221.250040546874" width="355.5556" height="101.499962156251" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.238990215526" filter="url(#shadow)"/>
  <text x="1040" y="290.125014867187" text-anchor="middle" font-size="21.848735768431" font-family="Arial, sans-serif" fill="var(--info-text)">nginx (web server)</text>
  <line x1="217.7777" y1="322.750002703125" x2="151.111" y2="395.249975671876" stroke="var(--text)" stroke-width="1.9449" marker-end="url(#arrow)"/>
  <line x1="351.1111" y1="322.750002703125" x2="417.7777" y2="395.249975671876" stroke="var(--text)" stroke-width="1.9449" marker-end="url(#arrow)"/>
  <rect x="40" y="395.249975671876" width="222.2222" height="90.624966210938" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.238990215526" filter="url(#shadow)"/>
  <text x="151.111" y="456.875060820311" text-anchor="middle" font-size="21.848735768431" font-family="Arial, sans-serif" fill="var(--primary-text)">bash (shell)</text>
  <rect x="306.6667" y="395.249975671876" width="222.2222" height="90.624966210938" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.238990215526" filter="url(#shadow)"/>
  <text x="417.7777" y="456.875060820311" text-anchor="middle" font-size="21.848735768431" font-family="Arial, sans-serif" fill="var(--primary-text)">bash (shell)</text>
  <line x1="151.111" y1="485.875050007811" x2="151.111" y2="540.250029734374" stroke="var(--text)" stroke-width="1.9449" marker-end="url(#arrow)"/>
  <rect x="40" y="540.250029734374" width="222.2222" height="79.749970265626" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.238990215526" filter="url(#shadow)"/>
  <text x="151.111" y="594.625009460937" text-anchor="middle" font-size="21.848735768431" font-family="Arial, sans-serif" fill="var(--ok-text)">vim (user cmd)</text>
  <rect x="662.2222" y="449.625063523436" width="577.7778" height="145.000054062498" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.238990215526" opacity="0.7" filter="url(#shadow)"/>
  <text x="951.1111" y="504.000043249999" text-anchor="middle" font-size="21.848735768431" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">ps shows:</text>
  <text x="951.1111" y="558.375022976562" text-anchor="middle" font-size="21.848735768431" font-family="Arial, sans-serif" fill="var(--warn-text)">PID, PPID, USER, STAT, CMD</text>
</svg>

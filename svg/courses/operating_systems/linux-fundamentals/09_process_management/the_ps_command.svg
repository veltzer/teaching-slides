<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="583.4758" y="72.2051" text-anchor="middle" font-size="25.2839" font-weight="bold" fill="var(--text)">Process Tree: init to User Processes</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowps" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="427.8822" y="114.8718" width="311.1871" height="98.4615" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="583.4758" y="180.5128" text-anchor="middle" font-size="21.3941" font-weight="bold">init/systemd (PID 1)</text>
  <line x1="505.679" y1="213.3333" x2="252.8395" y2="278.9744" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowps)" />
  <line x1="583.4758" y1="213.3333" x2="583.4758" y2="278.9744" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowps)" />
  <line x1="661.2725" y1="213.3333" x2="914.1121" y2="278.9744" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowps)" />
  <rect x="97.246" y="278.9744" width="311.1871" height="91.8974" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="252.8395" y="341.3333" text-anchor="middle" font-size="19.4492">sshd (service)</text>
  <rect x="427.8822" y="278.9744" width="311.1871" height="91.8974" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="583.4758" y="341.3333" text-anchor="middle" font-size="19.4492">cron (scheduler)</text>
  <rect x="758.5185" y="278.9744" width="311.1871" height="91.8974" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="914.1121" y="341.3333" text-anchor="middle" font-size="19.4492">nginx (web server)</text>
  <line x1="194.4919" y1="370.8718" x2="136.1443" y2="436.5128" stroke="var(--text)" stroke-width="1.9449" marker-end="url(#arrowps)" />
  <line x1="311.1871" y1="370.8718" x2="369.5346" y2="436.5128" stroke="var(--text)" stroke-width="1.9449" marker-end="url(#arrowps)" />
  <rect x="38.8984" y="436.5128" width="194.4919" height="82.0513" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="136.1443" y="492.3077" text-anchor="middle" font-size="19.4492">bash (shell)</text>
  <rect x="272.2887" y="436.5128" width="194.4919" height="82.0513" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="369.5346" y="492.3077" text-anchor="middle" font-size="19.4492">bash (shell)</text>
  <line x1="136.1443" y1="518.5641" x2="136.1443" y2="567.7949" stroke="var(--text)" stroke-width="1.9449" marker-end="url(#arrowps)" />
  <rect x="38.8984" y="567.7949" width="194.4919" height="72.2051" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="136.1443" y="617.0256" text-anchor="middle" font-size="19.4492">vim (user cmd)</text>
  <rect x="583.4758" y="485.7436" width="505.679" height="131.2821" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" opacity="0.7" />
  <text x="836.3153" y="534.9744" text-anchor="middle" font-size="19.4492" font-weight="bold">ps shows:</text>
  <text x="836.3153" y="584.2051" text-anchor="middle" font-size="19.4492">PID, PPID, USER, STAT, CMD</text>
</svg>
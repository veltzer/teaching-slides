<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:text x="632.0988" y="78.2222" text-anchor="middle" font-size="27.3909" font-weight="bold" fill="#333">Zombie Process Lifecycle</ns0:text>
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arrowzomb" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <ns0:path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect x="63.2099" y="142.2222" width="231.7696" height="142.2222" fill="#e3f2fd" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="179.0946" y="231.1111" text-anchor="middle" font-size="21.0699" font-weight="bold">fork()</ns0:text>
  <ns0:line x1="294.9795" y1="213.3333" x2="358.1893" y2="213.3333" stroke="#333" stroke-width="3.1605" marker-end="url(#arrowzomb)" />
  <ns0:rect x="358.1893" y="142.2222" width="231.7696" height="142.2222" fill="#e8f5e9" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="474.0741" y="195.5556" text-anchor="middle" font-size="21.0699" font-weight="bold">Running</ns0:text>
  <ns0:text x="474.0741" y="248.8889" text-anchor="middle" font-size="21.0699">(child process)</ns0:text>
  <ns0:line x1="589.9588" y1="213.3333" x2="653.1687" y2="213.3333" stroke="#333" stroke-width="3.1605" marker-end="url(#arrowzomb)" />
  <ns0:rect x="653.1687" y="142.2222" width="231.7696" height="142.2222" fill="#fff3e0" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="769.0535" y="195.5556" text-anchor="middle" font-size="21.0699" font-weight="bold">Exit</ns0:text>
  <ns0:text x="769.0535" y="248.8889" text-anchor="middle" font-size="21.0699">(child exits)</ns0:text>
  <ns0:line x1="884.9383" y1="213.3333" x2="948.1481" y2="213.3333" stroke="#333" stroke-width="3.1605" marker-end="url(#arrowzomb)" />
  <ns0:rect x="948.1481" y="142.2222" width="273.9094" height="142.2222" fill="#ffebee" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="1085.1029" y="195.5556" text-anchor="middle" font-size="21.0699" font-weight="bold">Zombie (Z)</ns0:text>
  <ns0:text x="1085.1029" y="248.8889" text-anchor="middle" font-size="21.0699">waiting for wait()</ns0:text>
  <ns0:line x1="1085.1029" y1="284.4444" x2="1085.1029" y2="355.5556" stroke="#333" stroke-width="3.1605" marker-end="url(#arrowzomb)" />
  <ns0:rect x="863.8683" y="355.5556" width="358.1893" height="124.4444" fill="#e8f5e9" stroke="#333" stroke-width="4.214" rx="10.535" />
  <ns0:text x="1042.963" y="416" text-anchor="middle" font-size="21.0699" font-weight="bold">Parent calls wait()</ns0:text>
  <ns0:text x="1042.963" y="455.1111" text-anchor="middle" font-size="21.0699">zombie is reaped</ns0:text>
  <ns0:rect x="63.2099" y="355.5556" width="737.4486" height="284.4444" fill="#ffebee" stroke="#333" stroke-width="2.107" rx="10.535" opacity="0.5" />
  <ns0:text x="431.9341" y="426.6667" text-anchor="middle" font-size="21.0699" font-weight="bold">If parent never calls wait():</ns0:text>
  <ns0:text x="431.9341" y="490.6667" text-anchor="middle" font-size="21.0699">Zombie stays in process table (STAT = Z)</ns0:text>
  <ns0:text x="431.9341" y="554.6667" text-anchor="middle" font-size="21.0699">Fix: kill parent, init adopts and reaps</ns0:text>
  <ns0:text x="431.9341" y="604.4444" text-anchor="middle" font-size="21.0699" font-family="monospace">ps aux | grep Z   # find zombies</ns0:text>
</ns0:svg>
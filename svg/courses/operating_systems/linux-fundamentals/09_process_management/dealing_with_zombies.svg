<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="629.0909" y="40" text-anchor="middle" font-size="28.3214" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Zombie Process Lifecycle</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="106.0759" width="240.0001" height="146.8354" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="159.9999" y="197.8481" text-anchor="middle" font-size="21.7857" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">fork()</text>
  <line x1="280.0001" y1="179.4937" x2="345.4545" y2="179.4937" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="345.4545" y="106.0759" width="240.0001" height="146.8354" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="465.4546" y="161.1393" text-anchor="middle" font-size="21.7857" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Running</text>
  <text x="465.4546" y="216.2026" text-anchor="middle" font-size="21.7857" font-family="Arial, sans-serif" fill="var(--ok-text)">(child process)</text>
  <line x1="585.4545" y1="179.4937" x2="650.9091" y2="179.4937" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="650.9091" y="106.0759" width="240.0001" height="146.8354" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="770.9091" y="161.1393" text-anchor="middle" font-size="21.7857" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Exit</text>
  <text x="770.9091" y="216.2026" text-anchor="middle" font-size="21.7857" font-family="Arial, sans-serif" fill="var(--warn-text)">(child exits)</text>
  <line x1="890.9091" y1="179.4937" x2="956.3636" y2="179.4937" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="956.3636" y="106.0759" width="283.6363" height="146.8354" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1098.1818" y="161.1393" text-anchor="middle" font-size="21.7857" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Zombie (Z)</text>
  <text x="1098.1818" y="216.2026" text-anchor="middle" font-size="21.7857" font-family="Arial, sans-serif" fill="var(--danger-text)">waiting for wait()</text>
  <line x1="1098.1818" y1="252.9114" x2="1098.1818" y2="326.3292" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="869.0909" y="326.3292" width="370.9091" height="128.481" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1054.5455" y="388.7342" text-anchor="middle" font-size="21.7857" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Parent calls wait()</text>
  <text x="1054.5455" y="429.1139" text-anchor="middle" font-size="21.7857" font-family="Arial, sans-serif" fill="var(--ok-text)">zombie is reaped</text>
  <rect x="40" y="326.3292" width="763.6364" height="293.6708" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" opacity="0.5" filter="url(#shadow)"/>
  <text x="421.8181" y="399.7469" text-anchor="middle" font-size="21.7857" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">If parent never calls wait():</text>
  <text x="421.8181" y="465.8228" text-anchor="middle" font-size="21.7857" font-family="Arial, sans-serif" fill="var(--danger-text)">Zombie stays in process table (STAT = Z)</text>
  <text x="421.8181" y="531.8988" text-anchor="middle" font-size="21.7857" font-family="Arial, sans-serif" fill="var(--danger-text)">Fix: kill parent, init adopts and reaps</text>
  <text x="421.8181" y="583.2911" text-anchor="middle" font-size="21.7857" font-family="Courier New, monospace" fill="var(--danger-text)">ps aux | grep Z   # find zombies</text>
</svg>

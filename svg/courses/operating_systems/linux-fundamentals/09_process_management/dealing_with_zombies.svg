<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="79.2" text-anchor="middle" font-size="27.7333" font-weight="bold" fill="#333">Zombie Process Lifecycle</text>
  <defs>
    <marker id="arrowzomb" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="64" y="144" width="234.6667" height="144" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="181.3333" y="234" text-anchor="middle" font-size="21.3333" font-weight="bold">fork()</text>
  <line x1="298.6667" y1="216" x2="362.6667" y2="216" stroke="#333" stroke-width="3.2" marker-end="url(#arrowzomb)" />
  <rect x="362.6667" y="144" width="234.6667" height="144" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="480" y="198" text-anchor="middle" font-size="21.3333" font-weight="bold">Running</text>
  <text x="480" y="252" text-anchor="middle" font-size="21.3333">(child process)</text>
  <line x1="597.3333" y1="216" x2="661.3333" y2="216" stroke="#333" stroke-width="3.2" marker-end="url(#arrowzomb)" />
  <rect x="661.3333" y="144" width="234.6667" height="144" fill="#fff3e0" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="778.6667" y="198" text-anchor="middle" font-size="21.3333" font-weight="bold">Exit</text>
  <text x="778.6667" y="252" text-anchor="middle" font-size="21.3333">(child exits)</text>
  <line x1="896" y1="216" x2="960" y2="216" stroke="#333" stroke-width="3.2" marker-end="url(#arrowzomb)" />
  <rect x="960" y="144" width="277.3333" height="144" fill="#ffebee" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1098.6667" y="198" text-anchor="middle" font-size="21.3333" font-weight="bold">Zombie (Z)</text>
  <text x="1098.6667" y="252" text-anchor="middle" font-size="21.3333">waiting for wait()</text>
  <line x1="1098.6667" y1="288" x2="1098.6667" y2="360" stroke="#333" stroke-width="3.2" marker-end="url(#arrowzomb)" />
  <rect x="874.6667" y="360" width="362.6667" height="126" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1056" y="421.2" text-anchor="middle" font-size="21.3333" font-weight="bold">Parent calls wait()</text>
  <text x="1056" y="460.8" text-anchor="middle" font-size="21.3333">zombie is reaped</text>
  <rect x="64" y="360" width="746.6667" height="288" fill="#ffebee" stroke="#333" stroke-width="2.1333" rx="10.6667" opacity="0.5" />
  <text x="437.3333" y="432" text-anchor="middle" font-size="21.3333" font-weight="bold">If parent never calls wait():</text>
  <text x="437.3333" y="496.8" text-anchor="middle" font-size="21.3333">Zombie stays in process table (STAT = Z)</text>
  <text x="437.3333" y="561.6" text-anchor="middle" font-size="21.3333">Fix: kill parent, init adopts and reaps</text>
  <text x="437.3333" y="612" text-anchor="middle" font-size="21.3333" font-family="monospace">ps aux | grep Z   # find zombies</text>
</svg>
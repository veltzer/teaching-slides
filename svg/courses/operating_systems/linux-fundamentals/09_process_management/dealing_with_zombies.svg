<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="629.0909" y="40" text-anchor="middle" font-size="28.3214" font-weight="bold" fill="var(--text)">Zombie Process Lifecycle</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowzomb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="40" y="106.0759" width="240.0001" height="146.8354" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="159.9999" y="197.8481" text-anchor="middle" font-size="21.7857" font-weight="bold">fork()</text>
  <line x1="280.0001" y1="179.4937" x2="345.4545" y2="179.4937" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowzomb)" />
  <rect x="345.4545" y="106.0759" width="240.0001" height="146.8354" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="465.4546" y="161.1393" text-anchor="middle" font-size="21.7857" font-weight="bold">Running</text>
  <text x="465.4546" y="216.2026" text-anchor="middle" font-size="21.7857">(child process)</text>
  <line x1="585.4545" y1="179.4937" x2="650.9091" y2="179.4937" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowzomb)" />
  <rect x="650.9091" y="106.0759" width="240.0001" height="146.8354" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="770.9091" y="161.1393" text-anchor="middle" font-size="21.7857" font-weight="bold">Exit</text>
  <text x="770.9091" y="216.2026" text-anchor="middle" font-size="21.7857">(child exits)</text>
  <line x1="890.9091" y1="179.4937" x2="956.3636" y2="179.4937" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowzomb)" />
  <rect x="956.3636" y="106.0759" width="283.6363" height="146.8354" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1098.1818" y="161.1393" text-anchor="middle" font-size="21.7857" font-weight="bold">Zombie (Z)</text>
  <text x="1098.1818" y="216.2026" text-anchor="middle" font-size="21.7857">waiting for wait()</text>
  <line x1="1098.1818" y1="252.9114" x2="1098.1818" y2="326.3292" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowzomb)" />
  <rect x="869.0909" y="326.3292" width="370.9091" height="128.481" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1054.5455" y="388.7342" text-anchor="middle" font-size="21.7857" font-weight="bold">Parent calls wait()</text>
  <text x="1054.5455" y="429.1139" text-anchor="middle" font-size="21.7857">zombie is reaped</text>
  <rect x="40" y="326.3292" width="763.6364" height="293.6708" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" opacity="0.5" filter="url(#shadow)"/>
  <text x="421.8181" y="399.7469" text-anchor="middle" font-size="21.7857" font-weight="bold">If parent never calls wait():</text>
  <text x="421.8181" y="465.8228" text-anchor="middle" font-size="21.7857">Zombie stays in process table (STAT = Z)</text>
  <text x="421.8181" y="531.8988" text-anchor="middle" font-size="21.7857">Fix: kill parent, init adopts and reaps</text>
  <text x="421.8181" y="583.2911" text-anchor="middle" font-size="21.7857" font-family="monospace">ps aux | grep Z   # find zombies</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="28.5825" font-weight="bold" fill="var(--text)">Process Priority (nice values)</text>
  <rect x="40" y="106.0759" width="1200" height="128.481" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="62.2222" y="186.8354" font-size="21.9865" font-weight="bold">-20</text>
  <text x="584.4444" y="186.8354" text-anchor="middle" font-size="21.9865" font-weight="bold">0</text>
  <text x="1206.6666" y="186.8354" text-anchor="end" font-size="21.9865" font-weight="bold">+19</text>
  <rect x="40" y="252.9114" width="1200" height="55.0633" fill="var(--bg)" stroke="var(--text)" stroke-width="2.107" rx="6" />
  <rect x="40" y="252.9114" width="400" height="55.0633" fill="var(--danger-fill)" stroke="var(--danger-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="439.9999" y="252.9114" width="400" height="55.0633" fill="var(--warn-fill)" stroke="var(--warn-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="840" y="252.9114" width="400" height="55.0633" fill="var(--ok-fill)" stroke="var(--ok-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="293.2912" text-anchor="middle" font-size="21.9865" fill="var(--text)">Higher priority</text>
  <text x="1039.9999" y="293.2912" text-anchor="middle" font-size="21.9865" fill="var(--text)">Lower priority</text>
  <text x="240" y="381.3924" text-anchor="middle" font-size="21.9865" fill="var(--danger-accent)">root only</text>
  <text x="640" y="381.3924" text-anchor="middle" font-size="21.9865">default</text>
  <text x="1039.9999" y="381.3924" text-anchor="middle" font-size="21.9865" fill="var(--ok-accent)">any user</text>
  <rect x="40" y="454.8101" width="577.7778" height="165.1899" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="328.8888" y="520.8861" text-anchor="middle" font-size="21.9865" font-family="monospace">nice -n 10 command</text>
  <text x="328.8888" y="583.2911" text-anchor="middle" font-size="21.9865">start with lower priority</text>
  <rect x="662.2222" y="454.8101" width="577.7778" height="165.1899" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="951.1111" y="520.8861" text-anchor="middle" font-size="21.9865" font-family="monospace">renice -n 5 -p PID</text>
  <text x="951.1111" y="583.2911" text-anchor="middle" font-size="21.9865">change running process priority</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="28.5825" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Process Priority (nice values)</text>
  <rect x="40" y="106.0759" width="1200" height="128.481" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="62.2222" y="186.8354" font-size="21.9865" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">-20</text>
  <text x="584.4444" y="186.8354" text-anchor="middle" font-size="21.9865" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">0</text>
  <text x="1206.6666" y="186.8354" text-anchor="end" font-size="21.9865" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">+19</text>
  <rect x="40" y="252.9114" width="1200" height="55.0633" fill="var(--bg)" stroke="var(--text)" stroke-width="2.107" rx="6" />
  <rect x="40" y="252.9114" width="400" height="55.0633" fill="url(#grad-danger)" stroke="var(--danger-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="439.9999" y="252.9114" width="400" height="55.0633" fill="url(#grad-warn)" stroke="var(--warn-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="840" y="252.9114" width="400" height="55.0633" fill="url(#grad-ok)" stroke="var(--ok-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="293.2912" text-anchor="middle" font-size="21.9865" fill="var(--text)" font-family="Arial, sans-serif">Higher priority</text>
  <text x="1039.9999" y="293.2912" text-anchor="middle" font-size="21.9865" fill="var(--text)" font-family="Arial, sans-serif">Lower priority</text>
  <text x="240" y="381.3924" text-anchor="middle" font-size="21.9865" fill="var(--danger-accent)" font-family="Arial, sans-serif">root only</text>
  <text x="640" y="381.3924" text-anchor="middle" font-size="21.9865" font-family="Arial, sans-serif" fill="var(--text)">default</text>
  <text x="1039.9999" y="381.3924" text-anchor="middle" font-size="21.9865" fill="var(--ok-accent)" font-family="Arial, sans-serif">any user</text>
  <rect x="40" y="454.8101" width="577.7778" height="165.1899" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="328.8888" y="520.8861" text-anchor="middle" font-size="21.9865" font-family="Courier New, monospace" fill="var(--primary-text)">nice -n 10 command</text>
  <text x="328.8888" y="583.2911" text-anchor="middle" font-size="21.9865" font-family="Arial, sans-serif" fill="var(--primary-text)">start with lower priority</text>
  <rect x="662.2222" y="454.8101" width="577.7778" height="165.1899" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="951.1111" y="520.8861" text-anchor="middle" font-size="21.9865" font-family="Courier New, monospace" fill="var(--info-text)">renice -n 5 -p PID</text>
  <text x="951.1111" y="583.2911" text-anchor="middle" font-size="21.9865" font-family="Arial, sans-serif" fill="var(--info-text)">change running process priority</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="629.0909" y="40" text-anchor="middle" font-size="29.7698" font-weight="bold" fill="var(--text)">Shell Job Control</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowjob" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="454.5454" y="92.7273" width="349.0909" height="141.958" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="629.0909" y="186.014" text-anchor="middle" font-size="25.1899" font-weight="bold">Foreground</text>
  <rect x="454.5454" y="478.042" width="349.0909" height="141.958" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="629.0909" y="571.3287" text-anchor="middle" font-size="25.1899" font-weight="bold">Background</text>
  <rect x="1000" y="275.2448" width="240" height="141.958" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1119.9999" y="364.4755" text-anchor="middle" font-size="25.1899" font-weight="bold">Stopped</text>
  <line x1="585.4545" y1="234.6853" x2="585.4545" y2="469.9301" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowjob)" />
  <text x="498.1818" y="376.6434" font-size="22.8999" fill="var(--text)">Ctrl-Z</text>
  <line x1="672.7273" y1="469.9301" x2="672.7273" y2="242.7972" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowjob)" />
  <text x="705.4545" y="376.6434" font-size="22.8999" fill="var(--text)">fg %n</text>
  <line x1="803.6364" y1="194.1259" x2="1000" y2="303.6364" stroke="var(--text)" stroke-width="2" stroke-dasharray="10.6667 6.4" marker-end="url(#arrowjob)" />
  <text x="945.4545" y="202.2378" font-size="22.8999" fill="var(--text-muted)">Ctrl-Z</text>
  <line x1="1000" y1="384.7552" x2="803.6364" y2="530.7692" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowjob)" />
  <text x="945.4545" y="506.4336" font-size="22.8999" fill="var(--text)">bg %n</text>
  <rect x="40" y="275.2448" width="349.0909" height="223.0769" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="214.5455" y="344.1958" text-anchor="middle" font-size="22.8999" font-weight="bold">Start in background:</text>
  <text x="214.5455" y="409.0909" text-anchor="middle" font-size="22.8999" font-family="monospace">command &amp;</text>
  <text x="214.5455" y="469.9301" text-anchor="middle" font-size="22.8999" font-family="monospace">jobs  # list all</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="79.2" text-anchor="middle" font-size="27.7333" font-weight="bold" fill="#333">Shell Job Control</text>
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arrowjob" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="469.3333" y="126" width="341.3333" height="126" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="208.8" text-anchor="middle" font-size="23.4667" font-weight="bold">Foreground</text>
  <rect x="469.3333" y="468" width="341.3333" height="126" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="550.8" text-anchor="middle" font-size="23.4667" font-weight="bold">Background</text>
  <rect x="1002.6667" y="288" width="234.6667" height="126" fill="#ffebee" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1120" y="367.2" text-anchor="middle" font-size="23.4667" font-weight="bold">Stopped</text>
  <line x1="597.3333" y1="252" x2="597.3333" y2="460.8" stroke="#333" stroke-width="3.2" marker-end="url(#arrowjob)" />
  <text x="512" y="378" font-size="21.3333" fill="#333">Ctrl-Z</text>
  <line x1="682.6667" y1="460.8" x2="682.6667" y2="259.2" stroke="#333" stroke-width="3.2" marker-end="url(#arrowjob)" />
  <text x="714.6667" y="378" font-size="21.3333" fill="#333">fg %n</text>
  <line x1="810.6667" y1="216" x2="1002.6667" y2="313.2" stroke="#333" stroke-width="3.2" stroke-dasharray="10.6667 6.4" marker-end="url(#arrowjob)" />
  <text x="949.3333" y="223.2" font-size="21.3333" fill="#666">Ctrl-Z</text>
  <line x1="1002.6667" y1="385.2" x2="810.6667" y2="514.8" stroke="#333" stroke-width="3.2" marker-end="url(#arrowjob)" />
  <text x="949.3333" y="493.2" font-size="21.3333" fill="#333">bg %n</text>
  <rect x="64" y="288" width="341.3333" height="198" fill="#e3f2fd" stroke="#333" stroke-width="2.1333" rx="8.5333" />
  <text x="234.6667" y="349.2" text-anchor="middle" font-size="21.3333" font-weight="bold">Start in background:</text>
  <text x="234.6667" y="406.8" text-anchor="middle" font-size="21.3333" font-family="monospace">command &amp;</text>
  <text x="234.6667" y="460.8" text-anchor="middle" font-size="21.3333" font-family="monospace">jobs  # list all</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="454.5454" y="40" width="349.0909" height="156.153808076921" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.292853251767" filter="url(#shadow)"/>
  <text x="629.0909" y="142.615375307692" text-anchor="middle" font-size="26.419390687781" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Foreground</text>
  <rect x="454.5454" y="463.846191923079" width="349.0909" height="156.153808076921" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.292853251767" filter="url(#shadow)"/>
  <text x="629.0909" y="566.461567230771" text-anchor="middle" font-size="26.419390687781" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Background</text>
  <rect x="1000" y="240.769260384617" width="240" height="156.153808076921" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.292853251767" filter="url(#shadow)"/>
  <text x="1119.9999" y="338.923035461536" text-anchor="middle" font-size="26.419390687781" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Stopped</text>
  <line x1="585.4545" y1="196.153808076921" x2="585.4545" y2="454.92310146154" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="498.1818" y="352.307726153848" font-size="24.017618363357" fill="var(--text)" font-family="Arial, sans-serif">Ctrl-Z</text>
  <line x1="672.7273" y1="454.92310146154" x2="672.7273" y2="205.07689853846" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="705.4545" y="352.307726153848" font-size="24.017618363357" fill="var(--text)" font-family="Arial, sans-serif">fg %n</text>
  <line x1="803.6364" y1="151.538465769231" x2="1000" y2="272.000022000001" stroke="var(--text)" stroke-width="2" stroke-dasharray="10.6667 6.4" marker-end="url(#arrow)"/>
  <text x="945.4545" y="160.46155623077" font-size="24.017618363357" fill="var(--text-muted)" font-family="Arial, sans-serif">Ctrl-Z</text>
  <line x1="1000" y1="361.230706615381" x2="803.6364" y2="521.846114923075" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="945.4545" y="495.076953538463" font-size="24.017618363357" fill="var(--text)" font-family="Arial, sans-serif">bg %n</text>
  <rect x="40" y="240.769260384617" width="349.0909" height="245.384602692307" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.292853251767" filter="url(#shadow)"/>
  <text x="214.5455" y="316.615364307691" text-anchor="middle" font-size="24.017618363357" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Start in background:</text>
  <text x="214.5455" y="387.999977999999" text-anchor="middle" font-size="24.017618363357" font-family="Courier New, monospace" fill="var(--primary-text)">command &amp;</text>
  <text x="214.5455" y="454.92310146154" text-anchor="middle" font-size="24.017618363357" font-family="Courier New, monospace" fill="var(--primary-text)">jobs  # list all</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="79.2" text-anchor="middle" font-size="27.7333" font-weight="bold" fill="#333">Finding Process IDs</text>
  <defs>
    <marker id="arrowpid" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="469.3333" y="126" width="341.3333" height="126" fill="#fff3e0" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="208.8" text-anchor="middle" font-size="23.4667" font-weight="bold">Find PID of "nginx"</text>
  <line x1="533.3333" y1="252" x2="213.3333" y2="342" stroke="#333" stroke-width="3.2" marker-end="url(#arrowpid)" />
  <line x1="640" y1="252" x2="640" y2="342" stroke="#333" stroke-width="3.2" marker-end="url(#arrowpid)" />
  <line x1="746.6667" y1="252" x2="1066.6667" y2="342" stroke="#333" stroke-width="3.2" marker-end="url(#arrowpid)" />
  <rect x="42.6667" y="342" width="341.3333" height="162" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="213.3333" y="406.8" text-anchor="middle" font-size="21.3333" font-weight="bold">ps aux | grep</text>
  <text x="213.3333" y="468" text-anchor="middle" font-size="21.3333">classic, verbose output</text>
  <rect x="469.3333" y="342" width="341.3333" height="162" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="406.8" text-anchor="middle" font-size="21.3333" font-weight="bold">pgrep nginx</text>
  <text x="640" y="468" text-anchor="middle" font-size="21.3333">returns PIDs only</text>
  <rect x="896" y="342" width="341.3333" height="162" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1066.6667" y="406.8" text-anchor="middle" font-size="21.3333" font-weight="bold">pidof nginx</text>
  <text x="1066.6667" y="468" text-anchor="middle" font-size="21.3333">exact name match</text>
  <rect x="213.3333" y="576" width="853.3333" height="108" fill="#ffebee" stroke="#333" stroke-width="2.1333" rx="8.5333" opacity="0.6" />
  <text x="640" y="648" text-anchor="middle" font-size="21.3333">Once you have the PID, use it with kill, top -p, strace, etc.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="639.9999" y="40" text-anchor="middle" font-size="27.2193" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Finding Process IDs</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <rect x="468.5714" y="84.8809" width="342.8571" height="120.8333" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="164.2857" text-anchor="middle" font-size="23.0317" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Find PID of "nginx"</text>
  <line x1="532.857" y1="205.7143" x2="211.4285" y2="292.0238" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="639.9999" y1="205.7143" x2="639.9999" y2="292.0238" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="747.1428" y1="205.7143" x2="1068.5714" y2="292.0238" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="292.0238" width="342.8571" height="155.3571" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="211.4285" y="354.1667" text-anchor="middle" font-size="20.9379" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">ps aux | grep</text>
  <text x="211.4285" y="412.8571" text-anchor="middle" font-size="20.9379" font-family="Arial, sans-serif" fill="var(--primary-text)">classic, verbose output</text>
  <rect x="468.5714" y="292.0238" width="342.8571" height="155.3571" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="354.1667" text-anchor="middle" font-size="20.9379" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">pgrep nginx</text>
  <text x="639.9999" y="412.8571" text-anchor="middle" font-size="20.9379" font-family="Arial, sans-serif" fill="var(--info-text)">returns PIDs only</text>
  <rect x="897.1429" y="292.0238" width="342.8571" height="155.3571" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1068.5714" y="354.1667" text-anchor="middle" font-size="20.9379" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">pidof nginx</text>
  <text x="1068.5714" y="412.8571" text-anchor="middle" font-size="20.9379" font-family="Arial, sans-serif" fill="var(--ok-text)">exact name match</text>
  <rect x="211.4285" y="516.4286" width="857.1429" height="103.5714" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" opacity="0.6" filter="url(#shadow)"/>
  <text x="639.9999" y="585.4762" text-anchor="middle" font-size="20.9379" font-family="Arial, sans-serif" fill="var(--danger-text)">Once you have the PID, use it with kill, top -p, strace, etc.</text>
</svg>
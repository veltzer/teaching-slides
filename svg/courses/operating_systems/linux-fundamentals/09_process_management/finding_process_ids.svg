<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:text x="598.8304" y="74.1053" text-anchor="middle" font-size="25.9493" font-weight="bold" fill="#333">Finding Process IDs</ns0:text>
  <ns0:defs>
    <ns0:marker id="arrowpid" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <ns0:path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect x="439.1423" y="117.8947" width="319.3762" height="117.8947" fill="#fff3e0" stroke="#333" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="598.8304" y="195.3684" text-anchor="middle" font-size="21.9571" font-weight="bold">Find PID of "nginx"</ns0:text>
  <ns0:line x1="499.0253" y1="235.7895" x2="199.6101" y2="320" stroke="#333" stroke-width="2.9942" marker-end="url(#arrowpid)" />
  <ns0:line x1="598.8304" y1="235.7895" x2="598.8304" y2="320" stroke="#333" stroke-width="2.9942" marker-end="url(#arrowpid)" />
  <ns0:line x1="698.6355" y1="235.7895" x2="998.0507" y2="320" stroke="#333" stroke-width="2.9942" marker-end="url(#arrowpid)" />
  <ns0:rect x="39.9221" y="320" width="319.3762" height="151.5789" fill="#e3f2fd" stroke="#333" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="199.6101" y="380.6316" text-anchor="middle" font-size="19.961" font-weight="bold">ps aux | grep</ns0:text>
  <ns0:text x="199.6101" y="437.8947" text-anchor="middle" font-size="19.961">classic, verbose output</ns0:text>
  <ns0:rect x="439.1423" y="320" width="319.3762" height="151.5789" fill="#f3e5f5" stroke="#333" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="598.8304" y="380.6316" text-anchor="middle" font-size="19.961" font-weight="bold">pgrep nginx</ns0:text>
  <ns0:text x="598.8304" y="437.8947" text-anchor="middle" font-size="19.961">returns PIDs only</ns0:text>
  <ns0:rect x="838.3626" y="320" width="319.3762" height="151.5789" fill="#e8f5e9" stroke="#333" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="998.0507" y="380.6316" text-anchor="middle" font-size="19.961" font-weight="bold">pidof nginx</ns0:text>
  <ns0:text x="998.0507" y="437.8947" text-anchor="middle" font-size="19.961">exact name match</ns0:text>
  <ns0:rect x="199.6101" y="538.9474" width="798.4405" height="101.0526" fill="#ffebee" stroke="#333" stroke-width="1.9961" rx="7.9844" opacity="0.6" />
  <ns0:text x="598.8304" y="606.3158" text-anchor="middle" font-size="19.961">Once you have the PID, use it with kill, top -p, strace, etc.</ns0:text>
</ns0:svg>
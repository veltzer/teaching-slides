<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="42.6667" y="54" width="362.6667" height="252" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="224" y="126" text-anchor="middle" font-size="23.4667" font-weight="bold">Local Variables</text>
  <text x="224" y="187.2" text-anchor="middle" font-size="21.3333">name="John"</text>
  <text x="224" y="244.8" text-anchor="middle" font-size="21.3333">age=25</text>
  <rect x="458.6667" y="54" width="362.6667" height="252" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="126" text-anchor="middle" font-size="23.4667" font-weight="bold">Environment Vars</text>
  <text x="640" y="187.2" text-anchor="middle" font-size="21.3333">$HOME, $PATH</text>
  <text x="640" y="244.8" text-anchor="middle" font-size="21.3333">export MY_VAR</text>
  <rect x="874.6667" y="54" width="362.6667" height="252" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1056" y="126" text-anchor="middle" font-size="23.4667" font-weight="bold">Cmd Substitution</text>
  <text x="1056" y="187.2" text-anchor="middle" font-size="21.3333">$(date)</text>
  <text x="1056" y="244.8" text-anchor="middle" font-size="21.3333">`whoami`</text>
  <rect x="170.6667" y="396" width="426.6667" height="198" fill="#fff3e0" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="384" y="475.2" text-anchor="middle" font-size="23.4667" font-weight="bold">Access: $var / ${var}</text>
  <text x="384" y="540" text-anchor="middle" font-size="21.3333">No spaces around = sign</text>
  <rect x="682.6667" y="396" width="426.6667" height="198" fill="#ffebee" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="896" y="475.2" text-anchor="middle" font-size="23.4667" font-weight="bold">Read-only: readonly</text>
  <text x="896" y="540" text-anchor="middle" font-size="21.3333">readonly MAX=100</text>
</svg>
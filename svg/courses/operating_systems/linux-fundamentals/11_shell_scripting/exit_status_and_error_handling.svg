  <text x="640" y="439.2" text-anchor="middle" font-size="23.4667" font-weight="bold">Error Handling Patterns</text>
  <text x="640" y="504" text-anchor="middle" font-size="21.3333">$? = check last exit code | set -e = exit on error</text>
  <text x="640" y="568.8" text-anchor="middle" font-size="21.3333">trap 'cleanup' EXIT | command || { echo "failed"; exit 1; }</text>

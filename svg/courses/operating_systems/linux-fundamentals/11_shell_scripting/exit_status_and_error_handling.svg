<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <rect x="42.6667" y="54" width="256" height="234" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="170.6667" y="126" text-anchor="middle" font-size="23.4667" font-weight="bold">Exit 0</text>
  <text x="170.6667" y="187.2" text-anchor="middle" font-size="21.3333">Success</text>
  <text x="170.6667" y="244.8" text-anchor="middle" font-size="21.3333" fill="#2e7d32">Command OK</text>
  <rect x="341.3333" y="54" width="256" height="234" fill="#ffebee" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="469.3333" y="126" text-anchor="middle" font-size="23.4667" font-weight="bold">Exit 1</text>
  <text x="469.3333" y="187.2" text-anchor="middle" font-size="21.3333">General Error</text>
  <text x="469.3333" y="244.8" text-anchor="middle" font-size="21.3333" fill="#c62828">Catchall</text>
  <rect x="640" y="54" width="256" height="234" fill="#ffebee" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="768" y="126" text-anchor="middle" font-size="23.4667" font-weight="bold">Exit 2</text>
  <text x="768" y="187.2" text-anchor="middle" font-size="21.3333">Misuse</text>
  <text x="768" y="244.8" text-anchor="middle" font-size="21.3333" fill="#c62828">Bad syntax</text>
  <rect x="938.6667" y="54" width="298.6667" height="234" fill="#ffebee" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1088" y="126" text-anchor="middle" font-size="23.4667" font-weight="bold">Exit 126/127</text>
  <text x="1088" y="187.2" text-anchor="middle" font-size="21.3333">Not executable /</text>
  <text x="1088" y="244.8" text-anchor="middle" font-size="21.3333" fill="#c62828">Not found</text>
  <rect x="42.6667" y="360" width="1194.6667" height="270" fill="#fff3e0" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="640" y="439.2" text-anchor="middle" font-size="23.4667" font-weight="bold">Error Handling Patterns</text>
  <text x="640" y="504" text-anchor="middle" font-size="21.3333">$? = check last exit code | set -e = exit on error</text>
  <text x="640" y="568.8" text-anchor="middle" font-size="21.3333">trap 'cleanup' EXIT | command || { echo "failed"; exit 1; }</text>
</svg>
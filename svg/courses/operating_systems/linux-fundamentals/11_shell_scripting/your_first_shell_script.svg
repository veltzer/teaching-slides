<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="42.6667" y="54" width="277.3333" height="198" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="181.3333" y="133.2" text-anchor="middle" font-size="23.4667" font-weight="bold">#!/bin/bash</text>
  <text x="181.3333" y="198" text-anchor="middle" font-size="21.3333">Shebang line</text>
  <rect x="362.6667" y="54" width="277.3333" height="198" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="501.3333" y="133.2" text-anchor="middle" font-size="23.4667" font-weight="bold">chmod +x</text>
  <text x="501.3333" y="198" text-anchor="middle" font-size="21.3333">Make executable</text>
  <rect x="682.6667" y="54" width="277.3333" height="198" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="821.3333" y="133.2" text-anchor="middle" font-size="23.4667" font-weight="bold">./script.sh</text>
  <text x="821.3333" y="198" text-anchor="middle" font-size="21.3333">Execute script</text>
  <rect x="1002.6667" y="54" width="234.6667" height="198" fill="#fff3e0" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1120" y="133.2" text-anchor="middle" font-size="23.4667" font-weight="bold">exit $?</text>
  <text x="1120" y="198" text-anchor="middle" font-size="21.3333">Return status</text>
  <line x1="320" y1="151.2" x2="362.6667" y2="151.2" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowd0_10_shell_scripting)" />
  <line x1="640" y1="151.2" x2="682.6667" y2="151.2" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowd0_10_shell_scripting)" />
  <line x1="960" y1="151.2" x2="1002.6667" y2="151.2" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowd0_10_shell_scripting)" />
  <rect x="106.6667" y="360" width="1066.6667" height="270" fill="#e3f2fd" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="640" y="432" text-anchor="middle" font-size="23.4667" font-weight="bold">Script Execution Flow</text>
  <text x="640" y="504" text-anchor="middle" font-size="21.3333">1. Shell reads shebang -&gt; 2. Loads interpreter -&gt; 3. Executes line by line</text>
  <text x="640" y="568.8" text-anchor="middle" font-size="21.3333">4. Returns exit code (0 = success, non-zero = error)</text>
  <defs>
    <marker id="arrowd0_10_shell_scripting" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:rect x="39.9221" y="33.6842" width="339.3373" height="235.7895" fill="#e3f2fd" stroke="#333" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="209.5906" y="101.0526" text-anchor="middle" font-size="21.9571" font-weight="bold">Numeric Tests</ns0:text>
  <ns0:text x="209.5906" y="161.6842" text-anchor="middle" font-size="19.961">-eq -ne -lt -gt</ns0:text>
  <ns0:text x="209.5906" y="208.8421" text-anchor="middle" font-size="19.961">-le -ge</ns0:text>
  <ns0:rect x="429.1618" y="33.6842" width="339.3373" height="235.7895" fill="#f3e5f5" stroke="#333" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="598.8304" y="101.0526" text-anchor="middle" font-size="21.9571" font-weight="bold">String Tests</ns0:text>
  <ns0:text x="598.8304" y="161.6842" text-anchor="middle" font-size="19.961">= != -z (empty)</ns0:text>
  <ns0:text x="598.8304" y="208.8421" text-anchor="middle" font-size="19.961">-n (non-empty)</ns0:text>
  <ns0:rect x="818.4016" y="33.6842" width="339.3373" height="235.7895" fill="#e8f5e9" stroke="#333" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="988.0702" y="101.0526" text-anchor="middle" font-size="21.9571" font-weight="bold">File Tests</ns0:text>
  <ns0:text x="988.0702" y="161.6842" text-anchor="middle" font-size="19.961">-f (file) -d (dir)</ns0:text>
  <ns0:text x="988.0702" y="208.8421" text-anchor="middle" font-size="19.961">-r -w -x (perms)</ns0:text>
  <ns0:rect x="119.7661" y="336.8421" width="439.1423" height="185.2632" fill="#fff3e0" stroke="#333" stroke-width="1.9961" rx="9.9805" />
  <ns0:text x="339.3373" y="404.2105" text-anchor="middle" font-size="19.961" font-weight="bold">[ ... ] single bracket</ns0:text>
  <ns0:text x="339.3373" y="471.5789" text-anchor="middle" font-size="19.961">POSIX compatible, classic test</ns0:text>
  <ns0:rect x="638.7525" y="336.8421" width="439.1423" height="185.2632" fill="#f3e5f5" stroke="#333" stroke-width="1.9961" rx="9.9805" />
  <ns0:text x="858.3236" y="404.2105" text-anchor="middle" font-size="19.961" font-weight="bold">[[ ... ]] double bracket</ns0:text>
  <ns0:text x="858.3236" y="471.5789" text-anchor="middle" font-size="19.961">Bash extended, regex support</ns0:text>
  <ns0:rect x="119.7661" y="555.7895" width="958.1287" height="84.2105" fill="#ffebee" stroke="#333" stroke-width="1.9961" rx="5.9883" />
  <ns0:text x="598.8304" y="616.4211" text-anchor="middle" font-size="19.961">Logical: &amp;&amp; (AND) | || (OR) | ! (NOT)</ns0:text>
</ns0:svg>
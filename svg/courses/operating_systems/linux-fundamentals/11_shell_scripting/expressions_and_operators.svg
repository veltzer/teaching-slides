  <rect x="128" y="360" width="469.3333" height="198" fill="#fff3e0" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="362.6667" y="432" text-anchor="middle" font-size="21.3333" font-weight="bold">[ ... ] single bracket</text>

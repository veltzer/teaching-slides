  <rect x="874.6667" y="36" width="362.6667" height="252" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1056" y="108" text-anchor="middle" font-size="23.4667" font-weight="bold">File Tests</text>

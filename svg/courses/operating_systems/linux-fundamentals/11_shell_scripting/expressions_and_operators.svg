  <rect x="682.6667" y="360" width="469.3333" height="198" fill="#f3e5f5" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="917.3333" y="432" text-anchor="middle" font-size="21.3333" font-weight="bold">[[ ... ]] double bracket</text>

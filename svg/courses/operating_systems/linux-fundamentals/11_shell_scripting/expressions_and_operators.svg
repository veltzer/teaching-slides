<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="42.6667" y="36" width="362.6667" height="252" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="224" y="108" text-anchor="middle" font-size="23.4667" font-weight="bold">Numeric Tests</text>
  <text x="224" y="172.8" text-anchor="middle" font-size="21.3333">-eq -ne -lt -gt</text>

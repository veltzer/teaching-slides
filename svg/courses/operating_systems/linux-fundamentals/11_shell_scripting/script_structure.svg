<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.579135622711" font-weight="bold" fill="var(--primary-accent)">Shell Script Structure</text>

  <!-- Left: code example -->
  <rect x="40" y="76.576576576577" width="560" height="543.423423423423" rx="10.222744470273" fill="var(--text)"/>
  <text x="60" y="113.153153153153" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--danger-accent)">#!/usr/bin/env bash</text>
  <text x="60" y="149.72972972973" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--text-muted)"># backup.sh</text>
  <text x="60" y="196.756756756757" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--warn-accent)">readonly BACKUP_DIR=/var/bk</text>
  <text x="60" y="228.108108108108" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--warn-accent)">readonly MAX_KEEP=7</text>
  <text x="60" y="275.135135135135" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--bg)">SRC="${1:-/home}"</text>
  <text x="60" y="306.486486486487" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--bg)">TS=$(date +%Y%m%d)</text>
  <text x="60" y="353.513513513514" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--primary-accent)">do_backup() {</text>
  <text x="60" y="384.864864864865" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--bg)">  local src="$1"</text>
  <text x="60" y="416.216216216216" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--bg)">  tar -czf "$BACKUP_DIR/$TS.tgz" "$src"</text>
  <text x="60" y="447.567567567568" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--primary-accent)">}</text>
  <text x="60" y="494.594594594595" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--danger-accent)">for dir in /home /etc; do</text>
  <text x="60" y="525.945945945946" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--bg)">  do_backup "$dir"</text>
  <text x="60" y="557.297297297297" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--danger-accent)">done</text>
  <text x="60" y="599.099099099099" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--danger-accent)">exit 0</text>

  <!-- Right: 5 callout cards -->
  <rect x="620" y="76.576576576577" width="620" height="94.054054054054" rx="8.178195576219" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="105.837837837838" font-family="Arial, sans-serif" font-size="15.33411670541" font-weight="bold" fill="var(--primary-text)">Shebang</text>
  <text x="640" y="134.054054054054" font-family="Courier New, monospace" font-size="13.289567811355" fill="var(--primary-text)">#!/usr/bin/env bash</text>
  <text x="640" y="158.09009009009" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--primary-text)">Must be first line</text>

  <rect x="620" y="181.081081081081" width="620" height="94.054054054054" rx="8.178195576219" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="210.342342342342" font-family="Arial, sans-serif" font-size="15.33411670541" font-weight="bold" fill="var(--warn-text)">Constants</text>
  <text x="640" y="238.558558558559" font-family="Courier New, monospace" font-size="13.289567811355" fill="var(--warn-text)">readonly NAME=value</text>
  <text x="640" y="262.594594594595" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--warn-text)">UPPERCASE convention</text>

  <rect x="620" y="285.585585585586" width="620" height="94.054054054054" rx="8.178195576219" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="314.846846846847" font-family="Arial, sans-serif" font-size="15.33411670541" font-weight="bold" fill="var(--ok-text)">Variables &amp; Args</text>
  <text x="640" y="343.063063063063" font-family="Courier New, monospace" font-size="13.289567811355" fill="var(--ok-text)">$1 $@ $# $? ${VAR:-default}</text>
  <text x="640" y="367.099099099099" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--ok-text)">local limits scope</text>

  <rect x="620" y="390.09009009009" width="620" height="94.054054054054" rx="8.178195576219" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="419.351351351351" font-family="Arial, sans-serif" font-size="15.33411670541" font-weight="bold" fill="var(--info-text)">Functions</text>
  <text x="640" y="447.567567567568" font-family="Courier New, monospace" font-size="13.289567811355" fill="var(--info-text)">name() { ... ; return N ; }</text>
  <text x="640" y="471.603603603604" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--info-text)">Define before use</text>

  <rect x="620" y="494.594594594595" width="620" height="94.054054054054" rx="8.178195576219" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="523.855855855856" font-family="Arial, sans-serif" font-size="15.33411670541" font-weight="bold" fill="var(--danger-text)">Control Flow</text>
  <text x="640" y="552.072072072072" font-family="Courier New, monospace" font-size="13.289567811355" fill="var(--danger-text)">if / for / while / case</text>
  <text x="640" y="576.108108108108" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--danger-text)">exit 0 success, 1-255 error</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="558.367347" height="562.114607" rx="6.306391" fill="var(--text)" />
  <text x="64.489796" y="71.512425" font-size="13.701055" fill="var(--danger-accent)" font-family="Courier New, monospace">#!/usr/bin/env bash</text>
  <text x="64.489796" y="89.397924" font-size="12.787574" fill="var(--text-muted)" font-family="Courier New, monospace"># ===================================</text>
  <text x="64.489796" y="106.431793" font-size="12.787574" fill="var(--text-muted)" font-family="Courier New, monospace"># backup.sh — daily backup script</text>
  <text x="64.489796" y="123.46545" font-size="12.787574" fill="var(--text-muted)" font-family="Courier New, monospace"># ===================================</text>
  <text x="64.489796" y="147.312782" font-size="12.787574" fill="var(--text-muted)" font-family="Courier New, monospace"># Constants</text>
  <text x="64.489796" y="164.346545" font-size="12.787574" fill="var(--danger-accent)" font-family="Courier New, monospace">readonly</text>
  <text x="147.755102" y="164.346545" font-size="12.787574" fill="var(--warn-accent)" font-family="Courier New, monospace">BACKUP_DIR</text>
  <text x="280" y="164.346545" font-size="12.787574" fill="var(--bg)" font-family="Courier New, monospace">="/var/backup"</text>
  <text x="64.489796" y="181.380308" font-size="12.787574" fill="var(--danger-accent)" font-family="Courier New, monospace">readonly</text>
  <text x="147.755102" y="181.380308" font-size="12.787574" fill="var(--warn-accent)" font-family="Courier New, monospace">MAX_KEEP</text>
  <text x="270.204082" y="181.380308" font-size="12.787574" fill="var(--bg)" font-family="Courier New, monospace">=7</text>
  <text x="64.489796" y="205.22764" font-size="12.787574" fill="var(--text-muted)" font-family="Courier New, monospace"># Variables</text>
  <text x="64.489796" y="222.261297" font-size="12.787574" fill="var(--warn-accent)" font-family="Courier New, monospace">SOURCE</text>
  <text x="142.857143" y="222.261297" font-size="12.787574" fill="var(--bg)" font-family="Courier New, monospace">="${1:-/home}"</text>
  <text x="64.489796" y="239.295166" font-size="12.787574" fill="var(--warn-accent)" font-family="Courier New, monospace">TIMESTAMP</text>
  <text x="182.040816" y="239.295166" font-size="12.787574" fill="var(--bg)" font-family="Courier New, monospace">=$(</text>
  <text x="221.22449" y="239.295166" font-size="12.787574" fill="var(--primary-accent)" font-family="Courier New, monospace">date</text>
  <text x="265.306122" y="239.295166" font-size="12.787574" fill="var(--bg)" font-family="Courier New, monospace">+%Y%m%d)</text>
  <text x="64.489796" y="263.142392" font-size="12.787574" fill="var(--text-muted)" font-family="Courier New, monospace"># Function</text>
  <text x="64.489796" y="280.176261" font-size="12.787574" fill="var(--primary-accent)" font-family="Courier New, monospace">do_backup</text>
  <text x="177.142857" y="280.176261" font-size="12.787574" fill="var(--bg)" font-family="Courier New, monospace">() {</text>
  <text x="84.081633" y="297.210024" font-size="12.787574" fill="var(--danger-accent)" font-family="Courier New, monospace">  local</text>
  <text x="142.857143" y="297.210024" font-size="12.787574" fill="var(--warn-accent)" font-family="Courier New, monospace">src</text>
  <text x="177.142857" y="297.210024" font-size="12.787574" fill="var(--bg)" font-family="Courier New, monospace">="$1"</text>
  <text x="84.081633" y="314.243682" font-size="12.787574" fill="var(--danger-accent)" font-family="Courier New, monospace">  if</text>
  <text x="113.469388" y="314.243682" font-size="12.787574" fill="var(--bg)" font-family="Courier New, monospace">[ ! -d "$src" ]; </text>
  <text x="289.795918" y="314.243682" font-size="12.787574" fill="var(--danger-accent)" font-family="Courier New, monospace">then</text>
  <text x="84.081633" y="331.277551" font-size="12.787574" fill="var(--primary-accent)" font-family="Courier New, monospace">    echo</text>
  <text x="142.857143" y="331.277551" font-size="12.787574" fill="var(--ok-accent)" font-family="Courier New, monospace">"Error: $src not found"</text>
  <text x="84.081633" y="348.311314" font-size="12.787574" fill="var(--danger-accent)" font-family="Courier New, monospace">    return</text>
  <text x="167.346939" y="348.311314" font-size="12.787574" fill="var(--warn-accent)" font-family="Courier New, monospace">1</text>
  <text x="64.489796" y="365.345077" font-size="12.787574" fill="var(--danger-accent)" font-family="Courier New, monospace">  fi</text>
  <text x="84.081633" y="382.378946" font-size="12.787574" fill="var(--primary-accent)" font-family="Courier New, monospace">  tar</text>
  <text x="123.265306" y="382.378946" font-size="12.787574" fill="var(--bg)" font-family="Courier New, monospace">-czf "${BACKUP_DIR}/backup_${TIMESTAMP}.tgz" "$src"</text>
  <text x="64.489796" y="399.412603" font-size="12.787574" fill="var(--bg)" font-family="Courier New, monospace">}</text>
  <text x="64.489796" y="423.259935" font-size="12.787574" fill="var(--text-muted)" font-family="Courier New, monospace"># Control flow</text>
  <text x="64.489796" y="440.293698" font-size="12.787574" fill="var(--danger-accent)" font-family="Courier New, monospace">for</text>
  <text x="98.77551" y="440.293698" font-size="12.787574" fill="var(--warn-accent)" font-family="Courier New, monospace">dir</text>
  <text x="128.163265" y="440.293698" font-size="12.787574" fill="var(--danger-accent)" font-family="Courier New, monospace">in</text>
  <text x="152.653061" y="440.293698" font-size="12.787574" fill="var(--bg)" font-family="Courier New, monospace">/home /etc /var; </text>
  <text x="289.795918" y="440.293698" font-size="12.787574" fill="var(--danger-accent)" font-family="Courier New, monospace">do</text>
  <text x="84.081633" y="457.327461" font-size="12.787574" fill="var(--primary-accent)" font-family="Courier New, monospace">  do_backup</text>
  <text x="211.428571" y="457.327461" font-size="12.787574" fill="var(--warn-accent)" font-family="Courier New, monospace">"$dir"</text>
  <text x="64.489796" y="474.36133" font-size="12.787574" fill="var(--danger-accent)" font-family="Courier New, monospace">done</text>
  <text x="64.489796" y="498.208451" font-size="12.787574" fill="var(--text-muted)" font-family="Courier New, monospace"># Exit code</text>
  <text x="64.489796" y="515.24232" font-size="12.787574" fill="var(--danger-accent)" font-family="Courier New, monospace">exit</text>
  <text x="103.673469" y="515.24232" font-size="12.787574" fill="var(--warn-accent)" font-family="Courier New, monospace">0</text>
  <line x1="598.367347" y1="71.512425" x2="652.244898" y2="86.842822" stroke="var(--danger-border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="598.367347" y1="172.011744" x2="652.244898" y2="184.78704" stroke="var(--warn-border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="598.367347" y1="231.629968" x2="652.244898" y2="291.248086" stroke="var(--bg)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="598.367347" y1="333.832652" x2="652.244898" y2="384.933942" stroke="var(--primary-border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="598.367347" y1="453.068994" x2="652.244898" y2="478.619692" stroke="var(--danger-border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="598.367347" y1="515.24232" x2="652.244898" y2="548.458216" stroke="var(--warn-border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <rect x="652.244898" y="45.961727" width="587.755102" height="93.68575" rx="6.306391" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="671.836735" y="67.254063" font-size="13.701055" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Shebang line</text>
  <text x="671.836735" y="85.139456" font-size="11.874304" fill="var(--text)" font-family="Courier New, monospace">#!/usr/bin/env bash</text>
  <text x="671.836735" y="102.17322" font-size="11.874304" fill="var(--text-muted)" font-family="Arial, sans-serif">Tells the kernel which interpreter to use.</text>
  <text x="671.836735" y="118.355353" font-size="11.874304" fill="var(--text-muted)" font-family="Arial, sans-serif">env searches PATH — portable across systems.</text>
  <text x="671.836735" y="131.982384" font-size="10.960928" fill="var(--text-faint)" font-family="Arial, sans-serif">Must be first line, no spaces before #!</text>
  <rect x="652.244898" y="154.977981" width="587.755102" height="89.427283" rx="6.306391" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="671.836735" y="174.566845" font-size="13.701055" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Constants (readonly)</text>
  <text x="671.836735" y="191.600503" font-size="11.874304" fill="var(--text)" font-family="Courier New, monospace">readonly NAME="value"</text>
  <text x="671.836735" y="207.782636" font-size="11.874304" fill="var(--text-muted)" font-family="Arial, sans-serif">Cannot be changed after assignment.</text>
  <text x="671.836735" y="223.964769" font-size="11.874304" fill="var(--text-muted)" font-family="Arial, sans-serif">Convention: UPPERCASE for constants.</text>
  <text x="671.836735" y="238.443431" font-size="10.960928" fill="var(--text-faint)" font-family="Arial, sans-serif">Attempting to reassign causes an error.</text>
  <rect x="652.244898" y="258.884031" width="587.755102" height="89.427283" rx="6.306391" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="671.836735" y="278.47279" font-size="13.701055" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Variables &amp; Args</text>
  <text x="671.836735" y="295.506659" font-size="11.874304" fill="var(--text)" font-family="Courier New, monospace">VAR="value"   $VAR   ${VAR:-default}</text>
  <text x="671.836735" y="311.688686" font-size="11.874304" fill="var(--text)" font-family="Courier New, monospace">$1 $2 $@  — positional args</text>
  <text x="671.836735" y="327.870819" font-size="11.874304" fill="var(--text)" font-family="Courier New, monospace">$# — arg count   $? — last exit code</text>
  <text x="671.836735" y="343.201217" font-size="10.960928" fill="var(--text-faint)" font-family="Arial, sans-serif">local keyword limits scope to function</text>
  <rect x="652.244898" y="362.789976" width="587.755102" height="93.68575" rx="6.306391" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="671.836735" y="382.378946" font-size="13.701055" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Functions</text>
  <text x="671.836735" y="399.412603" font-size="11.874304" fill="var(--text)" font-family="Courier New, monospace">func_name() { ... }</text>
  <text x="671.836735" y="415.594736" font-size="11.874304" fill="var(--text)" font-family="Courier New, monospace">return 0  — success (return N for error)</text>
  <text x="671.836735" y="431.776764" font-size="11.874304" fill="var(--text-muted)" font-family="Arial, sans-serif">Functions must be defined before use.</text>
  <text x="671.836735" y="447.107161" font-size="11.874304" fill="var(--text-muted)" font-family="Arial, sans-serif">Use local to avoid variable collisions.</text>
  <rect x="652.244898" y="471.806229" width="587.755102" height="89.427283" rx="6.306391" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="671.836735" y="491.394988" font-size="13.701055" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Control Flow</text>
  <text x="671.836735" y="508.428751" font-size="11.874304" fill="var(--text)" font-family="Courier New, monospace">if [ cond ]; then ... fi</text>
  <text x="671.836735" y="524.610884" font-size="11.874304" fill="var(--text)" font-family="Courier New, monospace">for x in list; do ... done</text>
  <text x="671.836735" y="540.793017" font-size="11.874304" fill="var(--text)" font-family="Courier New, monospace">while [ cond ]; do ... done</text>
  <text x="671.836735" y="556.123415" font-size="11.874304" fill="var(--text)" font-family="Courier New, monospace">case "$x" in pattern) ... ;; esac</text>
  <rect x="652.244898" y="575.712174" width="587.755102" height="44.287826" rx="6.306391" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="671.836735" y="594.449408" font-size="12.787574" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">Exit codes:</text>
  <text x="789.387755" y="594.449408" font-size="11.874304" fill="var(--text)" font-family="Courier New, monospace">0 = success  ·  1-255 = error  ·  $? gets last code  ·  set -e exits on any error</text>
  <text x="671.836735" y="611.483171" font-size="10.960928" fill="var(--text-faint)" font-family="Arial, sans-serif">Use exit 0 at script end to be explicit. Trap signals with: trap cleanup EXIT INT TERM</text>
</svg>
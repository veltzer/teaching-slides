<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="22.2222" y="22.2222" width="506.6667" height="586.6667" rx="6" fill="var(--text)" filter="url(#shadow)" />
  <text x="44.4444" y="55.1111" font-family="monospace" font-size="13.3333" fill="var(--danger-accent)">#!/usr/bin/env bash</text>
  <text x="44.4444" y="73.7778" font-family="monospace" font-size="12.4444" fill="var(--text-muted)"># ===================================</text>
  <text x="44.4444" y="91.5556" font-family="monospace" font-size="12.4444" fill="var(--text-muted)"># backup.sh — daily backup script</text>
  <text x="44.4444" y="109.3333" font-family="monospace" font-size="12.4444" fill="var(--text-muted)"># ===================================</text>
  <text x="44.4444" y="134.2222" font-family="monospace" font-size="12.4444" fill="var(--text-muted)"># Constants</text>
  <text x="44.4444" y="152" font-family="monospace" font-size="12.4444" fill="var(--danger-accent)">readonly</text>
  <text x="120" y="152" font-family="monospace" font-size="12.4444" fill="var(--warn-accent)">BACKUP_DIR</text>
  <text x="240" y="152" font-family="monospace" font-size="12.4444" fill="var(--bg)">="/var/backup"</text>
  <text x="44.4444" y="169.7778" font-family="monospace" font-size="12.4444" fill="var(--danger-accent)">readonly</text>
  <text x="120" y="169.7778" font-family="monospace" font-size="12.4444" fill="var(--warn-accent)">MAX_KEEP</text>
  <text x="231.1111" y="169.7778" font-family="monospace" font-size="12.4444" fill="var(--bg)">=7</text>
  <text x="44.4444" y="194.6667" font-family="monospace" font-size="12.4444" fill="var(--text-muted)"># Variables</text>
  <text x="44.4444" y="212.4444" font-family="monospace" font-size="12.4444" fill="var(--warn-accent)">SOURCE</text>
  <text x="115.5556" y="212.4444" font-family="monospace" font-size="12.4444" fill="var(--bg)">="${1:-/home}"</text>
  <text x="44.4444" y="230.2222" font-family="monospace" font-size="12.4444" fill="var(--warn-accent)">TIMESTAMP</text>
  <text x="151.1111" y="230.2222" font-family="monospace" font-size="12.4444" fill="var(--bg)">=$(</text>
  <text x="186.6667" y="230.2222" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">date</text>
  <text x="226.6667" y="230.2222" font-family="monospace" font-size="12.4444" fill="var(--bg)">+%Y%m%d)</text>
  <text x="44.4444" y="255.1111" font-family="monospace" font-size="12.4444" fill="var(--text-muted)"># Function</text>
  <text x="44.4444" y="272.8889" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">do_backup</text>
  <text x="146.6667" y="272.8889" font-family="monospace" font-size="12.4444" fill="var(--bg)">() {</text>
  <text x="62.2222" y="290.6667" font-family="monospace" font-size="12.4444" fill="var(--danger-accent)">  local</text>
  <text x="115.5556" y="290.6667" font-family="monospace" font-size="12.4444" fill="var(--warn-accent)">src</text>
  <text x="146.6667" y="290.6667" font-family="monospace" font-size="12.4444" fill="var(--bg)">="$1"</text>
  <text x="62.2222" y="308.4444" font-family="monospace" font-size="12.4444" fill="var(--danger-accent)">  if</text>
  <text x="88.8889" y="308.4444" font-family="monospace" font-size="12.4444" fill="var(--bg)">[ ! -d "$src" ]; </text>
  <text x="248.8889" y="308.4444" font-family="monospace" font-size="12.4444" fill="var(--danger-accent)">then</text>
  <text x="62.2222" y="326.2222" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">    echo</text>
  <text x="115.5556" y="326.2222" font-family="monospace" font-size="12.4444" fill="var(--ok-accent)">"Error: $src not found"</text>
  <text x="62.2222" y="344" font-family="monospace" font-size="12.4444" fill="var(--danger-accent)">    return</text>
  <text x="137.7778" y="344" font-family="monospace" font-size="12.4444" fill="var(--warn-accent)">1</text>
  <text x="44.4444" y="361.7778" font-family="monospace" font-size="12.4444" fill="var(--danger-accent)">  fi</text>
  <text x="62.2222" y="379.5556" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">  tar</text>
  <text x="97.7778" y="379.5556" font-family="monospace" font-size="12.4444" fill="var(--bg)">-czf "${BACKUP_DIR}/backup_${TIMESTAMP}.tgz" "$src"</text>
  <text x="44.4444" y="397.3333" font-family="monospace" font-size="12.4444" fill="var(--bg)">}</text>
  <text x="44.4444" y="422.2222" font-family="monospace" font-size="12.4444" fill="var(--text-muted)"># Control flow</text>
  <text x="44.4444" y="440" font-family="monospace" font-size="12.4444" fill="var(--danger-accent)">for</text>
  <text x="75.5556" y="440" font-family="monospace" font-size="12.4444" fill="var(--warn-accent)">dir</text>
  <text x="102.2222" y="440" font-family="monospace" font-size="12.4444" fill="var(--danger-accent)">in</text>
  <text x="124.4444" y="440" font-family="monospace" font-size="12.4444" fill="var(--bg)">/home /etc /var; </text>
  <text x="248.8889" y="440" font-family="monospace" font-size="12.4444" fill="var(--danger-accent)">do</text>
  <text x="62.2222" y="457.7778" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">  do_backup</text>
  <text x="177.7778" y="457.7778" font-family="monospace" font-size="12.4444" fill="var(--warn-accent)">"$dir"</text>
  <text x="44.4444" y="475.5556" font-family="monospace" font-size="12.4444" fill="var(--danger-accent)">done</text>
  <text x="44.4444" y="500.4444" font-family="monospace" font-size="12.4444" fill="var(--text-muted)"># Exit code</text>
  <text x="44.4444" y="518.2222" font-family="monospace" font-size="12.4444" fill="var(--danger-accent)">exit</text>
  <text x="80" y="518.2222" font-family="monospace" font-size="12.4444" fill="var(--warn-accent)">0</text>
  <line x1="528.8889" y1="55.1111" x2="577.7778" y2="71.1111" stroke="var(--danger-border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="528.8889" y1="160" x2="577.7778" y2="173.3333" stroke="var(--warn-border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="528.8889" y1="222.2222" x2="577.7778" y2="284.4444" stroke="var(--bg)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="528.8889" y1="328.8889" x2="577.7778" y2="382.2222" stroke="var(--primary-border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="528.8889" y1="453.3333" x2="577.7778" y2="480" stroke="var(--danger-border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="528.8889" y1="518.2222" x2="577.7778" y2="552.8889" stroke="var(--warn-border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <rect x="577.7778" y="28.4444" width="533.3333" height="97.7778" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="595.5556" y="50.6667" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--primary-accent)">Shebang line</text>
  <text x="595.5556" y="69.3333" font-family="monospace" font-size="11.5556" fill="var(--text)">#!/usr/bin/env bash</text>
  <text x="595.5556" y="87.1111" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">Tells the kernel which interpreter to use.</text>
  <text x="595.5556" y="104" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">env searches PATH — portable across systems.</text>
  <text x="595.5556" y="118.2222" font-family="sans-serif" font-size="10.6667" fill="var(--text-faint)">Must be first line, no spaces before #!</text>
  <rect x="577.7778" y="142.2222" width="533.3333" height="93.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="595.5556" y="162.6667" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--warn-accent)">Constants (readonly)</text>
  <text x="595.5556" y="180.4444" font-family="monospace" font-size="11.5556" fill="var(--text)">readonly NAME="value"</text>
  <text x="595.5556" y="197.3333" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">Cannot be changed after assignment.</text>
  <text x="595.5556" y="214.2222" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">Convention: UPPERCASE for constants.</text>
  <text x="595.5556" y="229.3333" font-family="sans-serif" font-size="10.6667" fill="var(--text-faint)">Attempting to reassign causes an error.</text>
  <rect x="577.7778" y="250.6667" width="533.3333" height="93.3333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="595.5556" y="271.1111" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--ok-accent)">Variables &amp; Args</text>
  <text x="595.5556" y="288.8889" font-family="monospace" font-size="11.5556" fill="var(--text)">VAR="value"   $VAR   ${VAR:-default}</text>
  <text x="595.5556" y="305.7778" font-family="monospace" font-size="11.5556" fill="var(--text)">$1 $2 $@  — positional args</text>
  <text x="595.5556" y="322.6667" font-family="monospace" font-size="11.5556" fill="var(--text)">$# — arg count   $? — last exit code</text>
  <text x="595.5556" y="338.6667" font-family="sans-serif" font-size="10.6667" fill="var(--text-faint)">local keyword limits scope to function</text>
  <rect x="577.7778" y="359.1111" width="533.3333" height="97.7778" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="595.5556" y="379.5556" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--info-accent)">Functions</text>
  <text x="595.5556" y="397.3333" font-family="monospace" font-size="11.5556" fill="var(--text)">func_name() { ... }</text>
  <text x="595.5556" y="414.2222" font-family="monospace" font-size="11.5556" fill="var(--text)">return 0  — success (return N for error)</text>
  <text x="595.5556" y="431.1111" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">Functions must be defined before use.</text>
  <text x="595.5556" y="447.1111" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">Use local to avoid variable collisions.</text>
  <rect x="577.7778" y="472.8889" width="533.3333" height="93.3333" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="595.5556" y="493.3333" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--danger-accent)">Control Flow</text>
  <text x="595.5556" y="511.1111" font-family="monospace" font-size="11.5556" fill="var(--text)">if [ cond ]; then ... fi</text>
  <text x="595.5556" y="528" font-family="monospace" font-size="11.5556" fill="var(--text)">for x in list; do ... done</text>
  <text x="595.5556" y="544.8889" font-family="monospace" font-size="11.5556" fill="var(--text)">while [ cond ]; do ... done</text>
  <text x="595.5556" y="560.8889" font-family="monospace" font-size="11.5556" fill="var(--text)">case "$x" in pattern) ... ;; esac</text>
  <rect x="577.7778" y="581.3333" width="533.3333" height="46.2222" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="595.5556" y="600.8889" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="var(--text-muted)">Exit codes:</text>
  <text x="702.2222" y="600.8889" font-family="monospace" font-size="11.5556" fill="var(--text)">0 = success  ·  1-255 = error  ·  $? gets last code  ·  set -e exits on any error</text>
  <text x="595.5556" y="618.6667" font-family="sans-serif" font-size="10.6667" fill="var(--text-faint)">Use exit 0 at script end to be explicit. Trap signals with: trap cleanup EXIT INT TERM</text>
</svg>
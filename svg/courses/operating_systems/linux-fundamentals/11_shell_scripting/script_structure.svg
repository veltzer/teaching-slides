<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="558.367347" height="562.114607" rx="6.306391" fill="var(--text)" filter="url(#shadow)" />
  <text x="64.489796" y="71.512425" font-family="monospace" font-size="13.701055" fill="var(--danger-accent)">#!/usr/bin/env bash</text>
  <text x="64.489796" y="89.397924" font-family="monospace" font-size="12.787574" fill="var(--text-muted)"># ===================================</text>
  <text x="64.489796" y="106.431793" font-family="monospace" font-size="12.787574" fill="var(--text-muted)"># backup.sh — daily backup script</text>
  <text x="64.489796" y="123.46545" font-family="monospace" font-size="12.787574" fill="var(--text-muted)"># ===================================</text>
  <text x="64.489796" y="147.312782" font-family="monospace" font-size="12.787574" fill="var(--text-muted)"># Constants</text>
  <text x="64.489796" y="164.346545" font-family="monospace" font-size="12.787574" fill="var(--danger-accent)">readonly</text>
  <text x="147.755102" y="164.346545" font-family="monospace" font-size="12.787574" fill="var(--warn-accent)">BACKUP_DIR</text>
  <text x="280" y="164.346545" font-family="monospace" font-size="12.787574" fill="var(--bg)">="/var/backup"</text>
  <text x="64.489796" y="181.380308" font-family="monospace" font-size="12.787574" fill="var(--danger-accent)">readonly</text>
  <text x="147.755102" y="181.380308" font-family="monospace" font-size="12.787574" fill="var(--warn-accent)">MAX_KEEP</text>
  <text x="270.204082" y="181.380308" font-family="monospace" font-size="12.787574" fill="var(--bg)">=7</text>
  <text x="64.489796" y="205.22764" font-family="monospace" font-size="12.787574" fill="var(--text-muted)"># Variables</text>
  <text x="64.489796" y="222.261297" font-family="monospace" font-size="12.787574" fill="var(--warn-accent)">SOURCE</text>
  <text x="142.857143" y="222.261297" font-family="monospace" font-size="12.787574" fill="var(--bg)">="${1:-/home}"</text>
  <text x="64.489796" y="239.295166" font-family="monospace" font-size="12.787574" fill="var(--warn-accent)">TIMESTAMP</text>
  <text x="182.040816" y="239.295166" font-family="monospace" font-size="12.787574" fill="var(--bg)">=$(</text>
  <text x="221.22449" y="239.295166" font-family="monospace" font-size="12.787574" fill="var(--primary-accent)">date</text>
  <text x="265.306122" y="239.295166" font-family="monospace" font-size="12.787574" fill="var(--bg)">+%Y%m%d)</text>
  <text x="64.489796" y="263.142392" font-family="monospace" font-size="12.787574" fill="var(--text-muted)"># Function</text>
  <text x="64.489796" y="280.176261" font-family="monospace" font-size="12.787574" fill="var(--primary-accent)">do_backup</text>
  <text x="177.142857" y="280.176261" font-family="monospace" font-size="12.787574" fill="var(--bg)">() {</text>
  <text x="84.081633" y="297.210024" font-family="monospace" font-size="12.787574" fill="var(--danger-accent)">  local</text>
  <text x="142.857143" y="297.210024" font-family="monospace" font-size="12.787574" fill="var(--warn-accent)">src</text>
  <text x="177.142857" y="297.210024" font-family="monospace" font-size="12.787574" fill="var(--bg)">="$1"</text>
  <text x="84.081633" y="314.243682" font-family="monospace" font-size="12.787574" fill="var(--danger-accent)">  if</text>
  <text x="113.469388" y="314.243682" font-family="monospace" font-size="12.787574" fill="var(--bg)">[ ! -d "$src" ]; </text>
  <text x="289.795918" y="314.243682" font-family="monospace" font-size="12.787574" fill="var(--danger-accent)">then</text>
  <text x="84.081633" y="331.277551" font-family="monospace" font-size="12.787574" fill="var(--primary-accent)">    echo</text>
  <text x="142.857143" y="331.277551" font-family="monospace" font-size="12.787574" fill="var(--ok-accent)">"Error: $src not found"</text>
  <text x="84.081633" y="348.311314" font-family="monospace" font-size="12.787574" fill="var(--danger-accent)">    return</text>
  <text x="167.346939" y="348.311314" font-family="monospace" font-size="12.787574" fill="var(--warn-accent)">1</text>
  <text x="64.489796" y="365.345077" font-family="monospace" font-size="12.787574" fill="var(--danger-accent)">  fi</text>
  <text x="84.081633" y="382.378946" font-family="monospace" font-size="12.787574" fill="var(--primary-accent)">  tar</text>
  <text x="123.265306" y="382.378946" font-family="monospace" font-size="12.787574" fill="var(--bg)">-czf "${BACKUP_DIR}/backup_${TIMESTAMP}.tgz" "$src"</text>
  <text x="64.489796" y="399.412603" font-family="monospace" font-size="12.787574" fill="var(--bg)">}</text>
  <text x="64.489796" y="423.259935" font-family="monospace" font-size="12.787574" fill="var(--text-muted)"># Control flow</text>
  <text x="64.489796" y="440.293698" font-family="monospace" font-size="12.787574" fill="var(--danger-accent)">for</text>
  <text x="98.77551" y="440.293698" font-family="monospace" font-size="12.787574" fill="var(--warn-accent)">dir</text>
  <text x="128.163265" y="440.293698" font-family="monospace" font-size="12.787574" fill="var(--danger-accent)">in</text>
  <text x="152.653061" y="440.293698" font-family="monospace" font-size="12.787574" fill="var(--bg)">/home /etc /var; </text>
  <text x="289.795918" y="440.293698" font-family="monospace" font-size="12.787574" fill="var(--danger-accent)">do</text>
  <text x="84.081633" y="457.327461" font-family="monospace" font-size="12.787574" fill="var(--primary-accent)">  do_backup</text>
  <text x="211.428571" y="457.327461" font-family="monospace" font-size="12.787574" fill="var(--warn-accent)">"$dir"</text>
  <text x="64.489796" y="474.36133" font-family="monospace" font-size="12.787574" fill="var(--danger-accent)">done</text>
  <text x="64.489796" y="498.208451" font-family="monospace" font-size="12.787574" fill="var(--text-muted)"># Exit code</text>
  <text x="64.489796" y="515.24232" font-family="monospace" font-size="12.787574" fill="var(--danger-accent)">exit</text>
  <text x="103.673469" y="515.24232" font-family="monospace" font-size="12.787574" fill="var(--warn-accent)">0</text>
  <line x1="598.367347" y1="71.512425" x2="652.244898" y2="86.842822" stroke="var(--danger-border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="598.367347" y1="172.011744" x2="652.244898" y2="184.78704" stroke="var(--warn-border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="598.367347" y1="231.629968" x2="652.244898" y2="291.248086" stroke="var(--bg)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="598.367347" y1="333.832652" x2="652.244898" y2="384.933942" stroke="var(--primary-border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="598.367347" y1="453.068994" x2="652.244898" y2="478.619692" stroke="var(--danger-border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="598.367347" y1="515.24232" x2="652.244898" y2="548.458216" stroke="var(--warn-border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <rect x="652.244898" y="45.961727" width="587.755102" height="93.68575" rx="6.306391" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="671.836735" y="67.254063" font-family="sans-serif" font-size="13.701055" font-weight="bold" fill="var(--primary-accent)">Shebang line</text>
  <text x="671.836735" y="85.139456" font-family="monospace" font-size="11.874304" fill="var(--text)">#!/usr/bin/env bash</text>
  <text x="671.836735" y="102.17322" font-family="sans-serif" font-size="11.874304" fill="var(--text-muted)">Tells the kernel which interpreter to use.</text>
  <text x="671.836735" y="118.355353" font-family="sans-serif" font-size="11.874304" fill="var(--text-muted)">env searches PATH — portable across systems.</text>
  <text x="671.836735" y="131.982384" font-family="sans-serif" font-size="10.960928" fill="var(--text-faint)">Must be first line, no spaces before #!</text>
  <rect x="652.244898" y="154.977981" width="587.755102" height="89.427283" rx="6.306391" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="671.836735" y="174.566845" font-family="sans-serif" font-size="13.701055" font-weight="bold" fill="var(--warn-accent)">Constants (readonly)</text>
  <text x="671.836735" y="191.600503" font-family="monospace" font-size="11.874304" fill="var(--text)">readonly NAME="value"</text>
  <text x="671.836735" y="207.782636" font-family="sans-serif" font-size="11.874304" fill="var(--text-muted)">Cannot be changed after assignment.</text>
  <text x="671.836735" y="223.964769" font-family="sans-serif" font-size="11.874304" fill="var(--text-muted)">Convention: UPPERCASE for constants.</text>
  <text x="671.836735" y="238.443431" font-family="sans-serif" font-size="10.960928" fill="var(--text-faint)">Attempting to reassign causes an error.</text>
  <rect x="652.244898" y="258.884031" width="587.755102" height="89.427283" rx="6.306391" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="671.836735" y="278.47279" font-family="sans-serif" font-size="13.701055" font-weight="bold" fill="var(--ok-accent)">Variables &amp; Args</text>
  <text x="671.836735" y="295.506659" font-family="monospace" font-size="11.874304" fill="var(--text)">VAR="value"   $VAR   ${VAR:-default}</text>
  <text x="671.836735" y="311.688686" font-family="monospace" font-size="11.874304" fill="var(--text)">$1 $2 $@  — positional args</text>
  <text x="671.836735" y="327.870819" font-family="monospace" font-size="11.874304" fill="var(--text)">$# — arg count   $? — last exit code</text>
  <text x="671.836735" y="343.201217" font-family="sans-serif" font-size="10.960928" fill="var(--text-faint)">local keyword limits scope to function</text>
  <rect x="652.244898" y="362.789976" width="587.755102" height="93.68575" rx="6.306391" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="671.836735" y="382.378946" font-family="sans-serif" font-size="13.701055" font-weight="bold" fill="var(--info-accent)">Functions</text>
  <text x="671.836735" y="399.412603" font-family="monospace" font-size="11.874304" fill="var(--text)">func_name() { ... }</text>
  <text x="671.836735" y="415.594736" font-family="monospace" font-size="11.874304" fill="var(--text)">return 0  — success (return N for error)</text>
  <text x="671.836735" y="431.776764" font-family="sans-serif" font-size="11.874304" fill="var(--text-muted)">Functions must be defined before use.</text>
  <text x="671.836735" y="447.107161" font-family="sans-serif" font-size="11.874304" fill="var(--text-muted)">Use local to avoid variable collisions.</text>
  <rect x="652.244898" y="471.806229" width="587.755102" height="89.427283" rx="6.306391" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="671.836735" y="491.394988" font-family="sans-serif" font-size="13.701055" font-weight="bold" fill="var(--danger-accent)">Control Flow</text>
  <text x="671.836735" y="508.428751" font-family="monospace" font-size="11.874304" fill="var(--text)">if [ cond ]; then ... fi</text>
  <text x="671.836735" y="524.610884" font-family="monospace" font-size="11.874304" fill="var(--text)">for x in list; do ... done</text>
  <text x="671.836735" y="540.793017" font-family="monospace" font-size="11.874304" fill="var(--text)">while [ cond ]; do ... done</text>
  <text x="671.836735" y="556.123415" font-family="monospace" font-size="11.874304" fill="var(--text)">case "$x" in pattern) ... ;; esac</text>
  <rect x="652.244898" y="575.712174" width="587.755102" height="44.287826" rx="6.306391" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="671.836735" y="594.449408" font-family="sans-serif" font-size="12.787574" font-weight="bold" fill="var(--text-muted)">Exit codes:</text>
  <text x="789.387755" y="594.449408" font-family="monospace" font-size="11.874304" fill="var(--text)">0 = success  ·  1-255 = error  ·  $? gets last code  ·  set -e exits on any error</text>
  <text x="671.836735" y="611.483171" font-family="sans-serif" font-size="10.960928" fill="var(--text-faint)">Use exit 0 at script end to be explicit. Trap signals with: trap cleanup EXIT INT TERM</text>
</svg>
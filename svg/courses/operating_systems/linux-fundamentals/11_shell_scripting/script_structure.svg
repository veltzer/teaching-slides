<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="63.4375" y="60.1389" width="534.375" height="531.6667" rx="6" fill="var(--text)" filter="url(#shadow)" />
  <text x="86.875" y="89.9444" font-family="monospace" font-size="13.0354" fill="var(--danger-accent)">#!/usr/bin/env bash</text>
  <text x="86.875" y="106.8611" font-family="monospace" font-size="12.1663" fill="var(--text-muted)"># ===================================</text>
  <text x="86.875" y="122.9723" font-family="monospace" font-size="12.1663" fill="var(--text-muted)"># backup.sh — daily backup script</text>
  <text x="86.875" y="139.0833" font-family="monospace" font-size="12.1663" fill="var(--text-muted)"># ===================================</text>
  <text x="86.875" y="161.6389" font-family="monospace" font-size="12.1663" fill="var(--text-muted)"># Constants</text>
  <text x="86.875" y="177.75" font-family="monospace" font-size="12.1663" fill="var(--danger-accent)">readonly</text>
  <text x="166.5625" y="177.75" font-family="monospace" font-size="12.1663" fill="var(--warn-accent)">BACKUP_DIR</text>
  <text x="293.125" y="177.75" font-family="monospace" font-size="12.1663" fill="var(--bg)">="/var/backup"</text>
  <text x="86.875" y="193.8611" font-family="monospace" font-size="12.1663" fill="var(--danger-accent)">readonly</text>
  <text x="166.5625" y="193.8611" font-family="monospace" font-size="12.1663" fill="var(--warn-accent)">MAX_KEEP</text>
  <text x="283.75" y="193.8611" font-family="monospace" font-size="12.1663" fill="var(--bg)">=7</text>
  <text x="86.875" y="216.4167" font-family="monospace" font-size="12.1663" fill="var(--text-muted)"># Variables</text>
  <text x="86.875" y="232.5277" font-family="monospace" font-size="12.1663" fill="var(--warn-accent)">SOURCE</text>
  <text x="161.875" y="232.5277" font-family="monospace" font-size="12.1663" fill="var(--bg)">="${1:-/home}"</text>
  <text x="86.875" y="248.6389" font-family="monospace" font-size="12.1663" fill="var(--warn-accent)">TIMESTAMP</text>
  <text x="199.375" y="248.6389" font-family="monospace" font-size="12.1663" fill="var(--bg)">=$(</text>
  <text x="236.875" y="248.6389" font-family="monospace" font-size="12.1663" fill="var(--primary-accent)">date</text>
  <text x="279.0625" y="248.6389" font-family="monospace" font-size="12.1663" fill="var(--bg)">+%Y%m%d)</text>
  <text x="86.875" y="271.1944" font-family="monospace" font-size="12.1663" fill="var(--text-muted)"># Function</text>
  <text x="86.875" y="287.3056" font-family="monospace" font-size="12.1663" fill="var(--primary-accent)">do_backup</text>
  <text x="194.6875" y="287.3056" font-family="monospace" font-size="12.1663" fill="var(--bg)">() {</text>
  <text x="105.625" y="303.4167" font-family="monospace" font-size="12.1663" fill="var(--danger-accent)">  local</text>
  <text x="161.875" y="303.4167" font-family="monospace" font-size="12.1663" fill="var(--warn-accent)">src</text>
  <text x="194.6875" y="303.4167" font-family="monospace" font-size="12.1663" fill="var(--bg)">="$1"</text>
  <text x="105.625" y="319.5277" font-family="monospace" font-size="12.1663" fill="var(--danger-accent)">  if</text>
  <text x="133.75" y="319.5277" font-family="monospace" font-size="12.1663" fill="var(--bg)">[ ! -d "$src" ]; </text>
  <text x="302.5" y="319.5277" font-family="monospace" font-size="12.1663" fill="var(--danger-accent)">then</text>
  <text x="105.625" y="335.6389" font-family="monospace" font-size="12.1663" fill="var(--primary-accent)">    echo</text>
  <text x="161.875" y="335.6389" font-family="monospace" font-size="12.1663" fill="var(--ok-accent)">"Error: $src not found"</text>
  <text x="105.625" y="351.75" font-family="monospace" font-size="12.1663" fill="var(--danger-accent)">    return</text>
  <text x="185.3125" y="351.75" font-family="monospace" font-size="12.1663" fill="var(--warn-accent)">1</text>
  <text x="86.875" y="367.8611" font-family="monospace" font-size="12.1663" fill="var(--danger-accent)">  fi</text>
  <text x="105.625" y="383.9723" font-family="monospace" font-size="12.1663" fill="var(--primary-accent)">  tar</text>
  <text x="143.125" y="383.9723" font-family="monospace" font-size="12.1663" fill="var(--bg)">-czf "${BACKUP_DIR}/backup_${TIMESTAMP}.tgz" "$src"</text>
  <text x="86.875" y="400.0833" font-family="monospace" font-size="12.1663" fill="var(--bg)">}</text>
  <text x="86.875" y="422.6389" font-family="monospace" font-size="12.1663" fill="var(--text-muted)"># Control flow</text>
  <text x="86.875" y="438.75" font-family="monospace" font-size="12.1663" fill="var(--danger-accent)">for</text>
  <text x="119.6875" y="438.75" font-family="monospace" font-size="12.1663" fill="var(--warn-accent)">dir</text>
  <text x="147.8125" y="438.75" font-family="monospace" font-size="12.1663" fill="var(--danger-accent)">in</text>
  <text x="171.25" y="438.75" font-family="monospace" font-size="12.1663" fill="var(--bg)">/home /etc /var; </text>
  <text x="302.5" y="438.75" font-family="monospace" font-size="12.1663" fill="var(--danger-accent)">do</text>
  <text x="105.625" y="454.8611" font-family="monospace" font-size="12.1663" fill="var(--primary-accent)">  do_backup</text>
  <text x="227.5" y="454.8611" font-family="monospace" font-size="12.1663" fill="var(--warn-accent)">"$dir"</text>
  <text x="86.875" y="470.9723" font-family="monospace" font-size="12.1663" fill="var(--danger-accent)">done</text>
  <text x="86.875" y="493.5277" font-family="monospace" font-size="12.1663" fill="var(--text-muted)"># Exit code</text>
  <text x="86.875" y="509.6389" font-family="monospace" font-size="12.1663" fill="var(--danger-accent)">exit</text>
  <text x="124.375" y="509.6389" font-family="monospace" font-size="12.1663" fill="var(--warn-accent)">0</text>
  <line x1="597.8125" y1="89.9444" x2="649.375" y2="104.4444" stroke="var(--danger-border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="597.8125" y1="185" x2="649.375" y2="197.0833" stroke="var(--warn-border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="597.8125" y1="241.3889" x2="649.375" y2="297.7777" stroke="var(--bg)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="597.8125" y1="338.0556" x2="649.375" y2="386.3889" stroke="var(--primary-border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="597.8125" y1="450.8333" x2="649.375" y2="475" stroke="var(--danger-border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="597.8125" y1="509.6389" x2="649.375" y2="541.0556" stroke="var(--warn-border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <rect x="649.375" y="65.7777" width="562.5" height="88.6111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="668.125" y="85.9167" font-family="sans-serif" font-size="13.0354" font-weight="bold" fill="var(--primary-accent)">Shebang line</text>
  <text x="668.125" y="102.8333" font-family="monospace" font-size="11.2974" fill="var(--text)">#!/usr/bin/env bash</text>
  <text x="668.125" y="118.9444" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">Tells the kernel which interpreter to use.</text>
  <text x="668.125" y="134.25" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">env searches PATH — portable across systems.</text>
  <text x="668.125" y="147.1389" font-family="sans-serif" font-size="10.4284" fill="var(--text-faint)">Must be first line, no spaces before #!</text>
  <rect x="649.375" y="168.8889" width="562.5" height="84.5833" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="668.125" y="187.4167" font-family="sans-serif" font-size="13.0354" font-weight="bold" fill="var(--warn-accent)">Constants (readonly)</text>
  <text x="668.125" y="203.5277" font-family="monospace" font-size="11.2974" fill="var(--text)">readonly NAME="value"</text>
  <text x="668.125" y="218.8333" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">Cannot be changed after assignment.</text>
  <text x="668.125" y="234.1389" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">Convention: UPPERCASE for constants.</text>
  <text x="668.125" y="247.8333" font-family="sans-serif" font-size="10.4284" fill="var(--text-faint)">Attempting to reassign causes an error.</text>
  <rect x="649.375" y="267.1667" width="562.5" height="84.5833" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="668.125" y="285.6944" font-family="sans-serif" font-size="13.0354" font-weight="bold" fill="var(--ok-accent)">Variables &amp; Args</text>
  <text x="668.125" y="301.8056" font-family="monospace" font-size="11.2974" fill="var(--text)">VAR="value"   $VAR   ${VAR:-default}</text>
  <text x="668.125" y="317.1111" font-family="monospace" font-size="11.2974" fill="var(--text)">$1 $2 $@  — positional args</text>
  <text x="668.125" y="332.4167" font-family="monospace" font-size="11.2974" fill="var(--text)">$# — arg count   $? — last exit code</text>
  <text x="668.125" y="346.9167" font-family="sans-serif" font-size="10.4284" fill="var(--text-faint)">local keyword limits scope to function</text>
  <rect x="649.375" y="365.4444" width="562.5" height="88.6111" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="668.125" y="383.9723" font-family="sans-serif" font-size="13.0354" font-weight="bold" fill="var(--info-accent)">Functions</text>
  <text x="668.125" y="400.0833" font-family="monospace" font-size="11.2974" fill="var(--text)">func_name() { ... }</text>
  <text x="668.125" y="415.3889" font-family="monospace" font-size="11.2974" fill="var(--text)">return 0  — success (return N for error)</text>
  <text x="668.125" y="430.6944" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">Functions must be defined before use.</text>
  <text x="668.125" y="445.1944" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">Use local to avoid variable collisions.</text>
  <rect x="649.375" y="468.5556" width="562.5" height="84.5833" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="668.125" y="487.0833" font-family="sans-serif" font-size="13.0354" font-weight="bold" fill="var(--danger-accent)">Control Flow</text>
  <text x="668.125" y="503.1944" font-family="monospace" font-size="11.2974" fill="var(--text)">if [ cond ]; then ... fi</text>
  <text x="668.125" y="518.5" font-family="monospace" font-size="11.2974" fill="var(--text)">for x in list; do ... done</text>
  <text x="668.125" y="533.8056" font-family="monospace" font-size="11.2974" fill="var(--text)">while [ cond ]; do ... done</text>
  <text x="668.125" y="548.3056" font-family="monospace" font-size="11.2974" fill="var(--text)">case "$x" in pattern) ... ;; esac</text>
  <rect x="649.375" y="566.8333" width="562.5" height="41.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="668.125" y="584.5556" font-family="sans-serif" font-size="12.1663" font-weight="bold" fill="var(--text-muted)">Exit codes:</text>
  <text x="780.625" y="584.5556" font-family="monospace" font-size="11.2974" fill="var(--text)">0 = success  ·  1-255 = error  ·  $? gets last code  ·  set -e exits on any error</text>
  <text x="668.125" y="600.6667" font-family="sans-serif" font-size="10.4284" fill="var(--text-faint)">Use exit 0 at script end to be explicit. Trap signals with: trap cleanup EXIT INT TERM</text>
</svg>
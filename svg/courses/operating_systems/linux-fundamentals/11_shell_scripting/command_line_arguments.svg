<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="41.001" y="51.8919" width="287.007" height="172.973" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="184.5045" y="121.0811" text-anchor="middle" font-size="20.5005" font-weight="bold">./script.sh</text>
  <text x="184.5045" y="179.8919" text-anchor="middle" font-size="20.5005">arg1 arg2 arg3</text>
  <line x1="328.008" y1="138.3784" x2="389.5095" y2="138.3784" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowd2_10_shell_scripting)" />
  <rect x="389.5095" y="34.5946" width="174.2542" height="103.7838" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="475.6116" y="103.7838" text-anchor="middle" font-size="20.5005">$0</text>
  <rect x="584.2643" y="34.5946" width="174.2542" height="103.7838" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="670.3664" y="103.7838" text-anchor="middle" font-size="20.5005">$1</text>
  <rect x="779.0191" y="34.5946" width="174.2542" height="103.7838" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="865.1212" y="103.7838" text-anchor="middle" font-size="20.5005">$2</text>
  <rect x="973.7737" y="34.5946" width="174.2542" height="103.7838" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="1059.8758" y="103.7838" text-anchor="middle" font-size="20.5005">$3</text>
  <text x="475.6116" y="200.6486" text-anchor="middle" font-size="20.5005" fill="var(--text-muted)">script name</text>
  <text x="670.3664" y="200.6486" text-anchor="middle" font-size="20.5005" fill="var(--text-muted)">arg1</text>
  <text x="865.1212" y="200.6486" text-anchor="middle" font-size="20.5005" fill="var(--text-muted)">arg2</text>
  <text x="1059.8758" y="200.6486" text-anchor="middle" font-size="20.5005" fill="var(--text-muted)">arg3</text>
  <rect x="102.5025" y="276.7568" width="471.5115" height="172.973" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="338.2583" y="345.9459" text-anchor="middle" font-size="20.5005" font-weight="bold">$# = argument count</text>
  <text x="338.2583" y="408.2162" text-anchor="middle" font-size="20.5005">$@ = all args, $* = all as one</text>
  <rect x="635.5155" y="276.7568" width="492.012" height="172.973" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="881.5215" y="345.9459" text-anchor="middle" font-size="20.5005" font-weight="bold">shift = remove $1</text>
  <text x="881.5215" y="408.2162" text-anchor="middle" font-size="20.5005">$2 becomes $1, $3 becomes $2...</text>
  <rect x="205.005" y="518.9189" width="820.02" height="121.0811" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="615.015" y="595.027" text-anchor="middle" font-size="20.5005">$? = exit status of last command (0=success)</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowd2_10_shell_scripting" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
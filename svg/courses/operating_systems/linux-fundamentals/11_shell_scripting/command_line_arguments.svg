<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="56.5714" width="311.1111" height="165.7143" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="195.5556" y="122.8572" text-anchor="middle" font-size="20.8914" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">./script.sh</text>
  <text x="195.5556" y="179.2" text-anchor="middle" font-size="20.8914" font-family="Arial, sans-serif" fill="var(--warn-text)">arg1 arg2 arg3</text>
  <line x1="351.1111" y1="139.4286" x2="417.7778" y2="139.4286" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="417.7778" y="40" width="188.8889" height="99.4286" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="511.1112" y="106.2857" text-anchor="middle" font-size="20.8914" font-family="Arial, sans-serif" fill="var(--primary-text)">$0</text>
  <rect x="628.889" y="40" width="188.8889" height="99.4286" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="722.2223" y="106.2857" text-anchor="middle" font-size="20.8914" font-family="Arial, sans-serif" fill="var(--info-text)">$1</text>
  <rect x="840.0002" y="40" width="188.8889" height="99.4286" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="933.3335" y="106.2857" text-anchor="middle" font-size="20.8914" font-family="Arial, sans-serif" fill="var(--ok-text)">$2</text>
  <rect x="1051.1111" y="40" width="188.8889" height="99.4286" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1144.4445" y="106.2857" text-anchor="middle" font-size="20.8914" font-family="Arial, sans-serif" fill="var(--warn-text)">$3</text>
  <text x="511.1112" y="199.0857" text-anchor="middle" font-size="20.8914" fill="var(--text-muted)" font-family="Arial, sans-serif">script name</text>
  <text x="722.2223" y="199.0857" text-anchor="middle" font-size="20.8914" fill="var(--text-muted)" font-family="Arial, sans-serif">arg1</text>
  <text x="933.3335" y="199.0857" text-anchor="middle" font-size="20.8914" fill="var(--text-muted)" font-family="Arial, sans-serif">arg2</text>
  <text x="1144.4445" y="199.0857" text-anchor="middle" font-size="20.8914" fill="var(--text-muted)" font-family="Arial, sans-serif">arg3</text>
  <rect x="106.6667" y="272" width="511.1112" height="165.7143" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="362.2223" y="338.2857" text-anchor="middle" font-size="20.8914" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">$# = argument count</text>
  <text x="362.2223" y="397.9428" text-anchor="middle" font-size="20.8914" font-family="Arial, sans-serif" fill="var(--primary-text)">$@ = all args, $* = all as one</text>
  <rect x="684.4445" y="272" width="533.3334" height="165.7143" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="951.1112" y="338.2857" text-anchor="middle" font-size="20.8914" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">shift = remove $1</text>
  <text x="951.1112" y="397.9428" text-anchor="middle" font-size="20.8914" font-family="Arial, sans-serif" fill="var(--danger-text)">$2 becomes $1, $3 becomes $2...</text>
  <rect x="217.7778" y="504" width="888.889" height="116" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="662.2223" y="576.9143" text-anchor="middle" font-size="20.8914" font-family="Arial, sans-serif" fill="var(--info-text)">$? = exit status of last command (0=success)</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

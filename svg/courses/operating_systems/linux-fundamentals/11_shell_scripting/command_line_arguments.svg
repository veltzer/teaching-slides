  <ns0:text x="338.2583" y="345.9459" text-anchor="middle" font-size="20.5005" font-weight="bold">$# = argument count</ns0:text>
  <ns0:text x="338.2583" y="408.2162" text-anchor="middle" font-size="20.5005">$@ = all args, $* = all as one</ns0:text>

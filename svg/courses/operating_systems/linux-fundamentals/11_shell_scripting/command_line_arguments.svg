  <text x="352" y="360" text-anchor="middle" font-size="21.3333" font-weight="bold">$# = argument count</text>
  <text x="352" y="424.8" text-anchor="middle" font-size="21.3333">$@ = all args, $* = all as one</text>
  <rect x="661.3333" y="288" width="512" height="180" fill="#ffebee" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="917.3333" y="360" text-anchor="middle" font-size="21.3333" font-weight="bold">shift = remove $1</text>
  <text x="917.3333" y="424.8" text-anchor="middle" font-size="21.3333">$2 becomes $1, $3 becomes $2...</text>

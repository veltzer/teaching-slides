<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="42.6667" y="36" width="362.6667" height="288" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="224" y="108" text-anchor="middle" font-size="23.4667" font-weight="bold">for loop</text>
  <text x="224" y="172.8" text-anchor="middle" font-size="21.3333">for i in list; do</text>
  <text x="224" y="223.2" text-anchor="middle" font-size="21.3333">  commands</text>
  <text x="224" y="273.6" text-anchor="middle" font-size="21.3333">done</text>
  <rect x="458.6667" y="36" width="362.6667" height="288" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="108" text-anchor="middle" font-size="23.4667" font-weight="bold">while loop</text>
  <text x="640" y="172.8" text-anchor="middle" font-size="21.3333">while [ cond ]; do</text>
  <text x="640" y="223.2" text-anchor="middle" font-size="21.3333">  commands</text>
  <text x="640" y="273.6" text-anchor="middle" font-size="21.3333">done</text>
  <rect x="874.6667" y="36" width="362.6667" height="288" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1056" y="108" text-anchor="middle" font-size="23.4667" font-weight="bold">until loop</text>
  <text x="1056" y="172.8" text-anchor="middle" font-size="21.3333">until [ cond ]; do</text>
  <text x="1056" y="223.2" text-anchor="middle" font-size="21.3333">  commands</text>
  <text x="1056" y="273.6" text-anchor="middle" font-size="21.3333">done</text>
  <rect x="106.6667" y="396" width="490.6667" height="144" fill="#fff3e0" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="352" y="460.8" text-anchor="middle" font-size="21.3333" font-weight="bold">break</text>
  <text x="352" y="511.2" text-anchor="middle" font-size="21.3333">Exit loop immediately</text>
  <rect x="661.3333" y="396" width="490.6667" height="144" fill="#ffebee" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="906.6667" y="460.8" text-anchor="middle" font-size="21.3333" font-weight="bold">continue</text>
  <text x="906.6667" y="511.2" text-anchor="middle" font-size="21.3333">Skip to next iteration</text>
  <rect x="213.3333" y="594" width="853.3333" height="90" fill="#f3e5f5" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="640" y="658.8" text-anchor="middle" font-size="21.3333">C-style: for ((i=0; i&lt;10; i++)); do ... done</text>
</svg>
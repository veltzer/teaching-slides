<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="364.2858" height="257.7778" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="222.1427" y="104.4444" text-anchor="middle" font-size="22.2508" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">for loop</text>
  <text x="222.1427" y="162.4444" text-anchor="middle" font-size="20.228" font-family="Arial, sans-serif" fill="var(--primary-text)">for i in list; do</text>
  <text x="222.1427" y="207.5556" text-anchor="middle" font-size="20.228" font-family="Arial, sans-serif" fill="var(--primary-text)">  commands</text>
  <text x="222.1427" y="252.6667" text-anchor="middle" font-size="20.228" font-family="Arial, sans-serif" fill="var(--primary-text)">done</text>
  <rect x="457.8571" y="40" width="364.2858" height="257.7778" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="104.4444" text-anchor="middle" font-size="22.2508" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">while loop</text>
  <text x="639.9999" y="162.4444" text-anchor="middle" font-size="20.228" font-family="Arial, sans-serif" fill="var(--info-text)">while [ cond ]; do</text>
  <text x="639.9999" y="207.5556" text-anchor="middle" font-size="20.228" font-family="Arial, sans-serif" fill="var(--info-text)">  commands</text>
  <text x="639.9999" y="252.6667" text-anchor="middle" font-size="20.228" font-family="Arial, sans-serif" fill="var(--info-text)">done</text>
  <rect x="875.7142" y="40" width="364.2858" height="257.7778" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1057.8571" y="104.4444" text-anchor="middle" font-size="22.2508" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">until loop</text>
  <text x="1057.8571" y="162.4444" text-anchor="middle" font-size="20.228" font-family="Arial, sans-serif" fill="var(--ok-text)">until [ cond ]; do</text>
  <text x="1057.8571" y="207.5556" text-anchor="middle" font-size="20.228" font-family="Arial, sans-serif" fill="var(--ok-text)">  commands</text>
  <text x="1057.8571" y="252.6667" text-anchor="middle" font-size="20.228" font-family="Arial, sans-serif" fill="var(--ok-text)">done</text>
  <rect x="104.2857" y="362.2222" width="492.8571" height="128.8888" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="350.7142" y="420.2222" text-anchor="middle" font-size="20.228" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">break</text>
  <text x="350.7142" y="465.3333" text-anchor="middle" font-size="20.228" font-family="Arial, sans-serif" fill="var(--warn-text)">Exit loop immediately</text>
  <rect x="661.4284" y="362.2222" width="492.8571" height="128.8888" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="907.8571" y="420.2222" text-anchor="middle" font-size="20.228" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">continue</text>
  <text x="907.8571" y="465.3333" text-anchor="middle" font-size="20.228" font-family="Arial, sans-serif" fill="var(--danger-text)">Skip to next iteration</text>
  <rect x="211.4284" y="539.4445" width="857.1428" height="80.5555" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="597.4445" text-anchor="middle" font-size="20.228" font-family="Arial, sans-serif" fill="var(--info-text)">C-style: for ((i=0; i&lt;10; i++)); do ... done</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="39.9221" y="33.6842" width="339.3373" height="269.4737" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="209.5906" y="101.0526" text-anchor="middle" font-size="21.9571" font-weight="bold">for loop</text>
  <text x="209.5906" y="161.6842" text-anchor="middle" font-size="19.961">for i in list; do</text>
  <text x="209.5906" y="208.8421" text-anchor="middle" font-size="19.961">  commands</text>
  <text x="209.5906" y="256" text-anchor="middle" font-size="19.961">done</text>
  <rect x="429.1618" y="33.6842" width="339.3373" height="269.4737" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="598.8304" y="101.0526" text-anchor="middle" font-size="21.9571" font-weight="bold">while loop</text>
  <text x="598.8304" y="161.6842" text-anchor="middle" font-size="19.961">while [ cond ]; do</text>
  <text x="598.8304" y="208.8421" text-anchor="middle" font-size="19.961">  commands</text>
  <text x="598.8304" y="256" text-anchor="middle" font-size="19.961">done</text>
  <rect x="818.4016" y="33.6842" width="339.3373" height="269.4737" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="988.0702" y="101.0526" text-anchor="middle" font-size="21.9571" font-weight="bold">until loop</text>
  <text x="988.0702" y="161.6842" text-anchor="middle" font-size="19.961">until [ cond ]; do</text>
  <text x="988.0702" y="208.8421" text-anchor="middle" font-size="19.961">  commands</text>
  <text x="988.0702" y="256" text-anchor="middle" font-size="19.961">done</text>
  <rect x="99.8051" y="370.5263" width="459.1033" height="134.7368" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="329.3567" y="431.1579" text-anchor="middle" font-size="19.961" font-weight="bold">break</text>
  <text x="329.3567" y="478.3158" text-anchor="middle" font-size="19.961">Exit loop immediately</text>
  <rect x="618.7914" y="370.5263" width="459.1033" height="134.7368" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="848.3431" y="431.1579" text-anchor="middle" font-size="19.961" font-weight="bold">continue</text>
  <text x="848.3431" y="478.3158" text-anchor="middle" font-size="19.961">Skip to next iteration</text>
  <rect x="199.6101" y="555.7895" width="798.4405" height="84.2105" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="598.8304" y="616.4211" text-anchor="middle" font-size="19.961">C-style: for ((i=0; i&lt;10; i++)); do ... done</text>
</svg>
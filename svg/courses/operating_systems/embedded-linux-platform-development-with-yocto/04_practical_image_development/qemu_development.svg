<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <!-- Host resource column (left) -->
  <rect x="40" y="40" width="260" height="492.999999999999" rx="12.041594578792" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="170" y="98.000000000001" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.491508073343" font-weight="bold" fill="var(--info-text)">Host System</text>
  <rect x="70" y="134.25" width="200" height="87.000000000001" rx="9.633275663034" fill="var(--bg)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="170" y="187.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.674870241826" fill="var(--text)">Network</text>
  <rect x="70" y="243.000000000001" width="200" height="87.000000000001" rx="9.633275663034" fill="var(--bg)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="170" y="296.65" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.674870241826" fill="var(--text)">Storage</text>
  <rect x="70" y="351.75" width="200" height="87.000000000001" rx="9.633275663034" fill="var(--bg)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="170" y="405.400000000001" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.674870241826" fill="var(--text)">Display</text>
  <text x="170" y="496.750000000001" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.858232410309" font-style="italic" fill="var(--info-text)">real hardware resources</text>

  <!-- Arrows bridging to QEMU -->
  <line x1="270" y1="177.750000000001" x2="460" y2="243.000000000001" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="270" y1="286.5" x2="460" y2="286.5" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="270" y1="395.25" x2="460" y2="330" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- QEMU + Guest (right) -->
  <rect x="470" y="40" width="770" height="492.999999999999" rx="12.041594578792" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="855" y="98.000000000001" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.491508073343" font-weight="bold" fill="var(--primary-text)">QEMU emulator</text>

  <!-- Guest Linux inside QEMU -->
  <rect x="530" y="141.5" width="650" height="333.5" rx="9.633275663034" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="855" y="199.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.491508073343" font-weight="bold" fill="var(--warn-text)">Guest Linux</text>
  <text x="855" y="264.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.083189157585" fill="var(--warn-text)">ARM / x86 / MIPS / PowerPC</text>
  <text x="855" y="322.750000000001" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.083189157585" fill="var(--warn-text)">your Yocto image</text>
  <text x="855" y="388.000000000001" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.674870241826" fill="var(--warn-text)">kernel + root filesystem</text>
  <text x="855" y="438.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.674870241826" fill="var(--warn-text)">runs as if on real target</text>

  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.674870241826" font-style="italic" fill="var(--text-muted)">QEMU virtualizes the target CPU and maps host resources into the guest — no physical board required.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="327.2728" height="96.6666" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="203.6367" y="96.3887" text-anchor="middle" font-size="21.344" font-family="Arial, sans-serif" fill="var(--danger-text)">Choose Base</text>
  <rect x="476.3636" y="40" width="327.2728" height="96.6666" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640.0001" y="96.3887" text-anchor="middle" font-size="21.344" font-family="Arial, sans-serif" fill="var(--primary-text)">Select Packages</text>
  <rect x="912.7272" y="40" width="327.2728" height="96.6666" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1076.3637" y="96.3887" text-anchor="middle" font-size="21.344" font-family="Arial, sans-serif" fill="var(--primary-text)">Configure Features</text>
  <rect x="40" y="281.6665" width="327.2728" height="96.6666" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="203.6367" y="338.0554" text-anchor="middle" font-size="21.344" font-family="Arial, sans-serif" fill="var(--warn-text)">Customize Rootfs</text>
  <rect x="476.3636" y="281.6665" width="327.2728" height="96.6666" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640.0001" y="338.0554" text-anchor="middle" font-size="21.344" font-family="Arial, sans-serif" fill="var(--info-text)">Build Image</text>
  <rect x="912.7272" y="281.6665" width="327.2728" height="96.6666" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1076.3637" y="338.0554" text-anchor="middle" font-size="21.344" font-family="Arial, sans-serif" fill="var(--primary-text)">Test &amp; Deploy</text>
  <rect x="476.3636" y="523.3334" width="327.2728" height="96.6666" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640.0001" y="579.7222" text-anchor="middle" font-size="21.344" font-family="Arial, sans-serif" fill="var(--ok-text)">Iterate</text>
  <path d="M 367.2728 88.3332 L 476.3636 88.3332" stroke="var(--text)" stroke-width="0.9119" marker-end="url(#arrow)"/>
  <path d="M 803.6366 88.3332 L 912.7272 88.3332" stroke="var(--text)" stroke-width="0.9119" marker-end="url(#arrow)"/>
  <path d="M 1076.3637 136.6666 L 203.6367 281.6665" stroke="var(--text)" stroke-width="0.9119" marker-end="url(#arrow)"/>
  <path d="M 367.2728 338.0554 L 476.3636 338.0554" stroke="var(--text)" stroke-width="0.9119" marker-end="url(#arrow)"/>
  <path d="M 803.6366 338.0554 L 912.7272 338.0554" stroke="var(--text)" stroke-width="0.9119" marker-end="url(#arrow)"/>
  <path d="M 1076.3637 378.3333 L 640.0001 523.3334" stroke="var(--text)" stroke-width="0.9119" marker-end="url(#arrow)"/>
  <path d="M 476.3636 571.6666 L 203.6367 378.3333" stroke="var(--primary-border)" stroke-width="0.9119" marker-end="url(#arrow)"/>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

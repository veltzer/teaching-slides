<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="1200" height="68.235294054787" rx="6.398529361204" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="83.215686270319" text-anchor="middle" font-size="17.062744963212" fill="var(--text-muted)" font-family="Arial, sans-serif">eMMC or SD card: sector 0 holds the partition table (GPT or MBR).</text>

  <rect x="40" y="130.980392429258" width="220" height="489.019607570742" rx="6.398529361204" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="176.470588109573" text-anchor="middle" font-size="19.195588083613" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Boot</text>
  <text x="150" y="221.960784858516" text-anchor="middle" font-size="14.92990184281" fill="var(--primary-text)" font-family="Arial, sans-serif">FAT32, 64 MB</text>
  <text x="150" y="278.823529726067" text-anchor="middle" font-size="14.92990184281" fill="var(--primary-text)" font-family="Arial, sans-serif">U-Boot, MLO</text>
  <text x="150" y="324.313725406382" text-anchor="middle" font-size="14.92990184281" fill="var(--primary-text)" font-family="Arial, sans-serif">uEnv.txt</text>
  <text x="150" y="381.176470273933" text-anchor="middle" font-size="14.92990184281" fill="var(--primary-text)" font-family="Arial, sans-serif">Device tree</text>
  <text x="150" y="426.666667022876" text-anchor="middle" font-size="14.92990184281" fill="var(--primary-text)" font-family="Arial, sans-serif">zImage</text>
  <text x="150" y="494.901961077662" text-anchor="middle" font-size="14.92990184281" fill="var(--primary-text)" font-family="Arial, sans-serif">Read by ROM</text>
  <text x="150" y="551.764705945213" text-anchor="middle" font-size="14.92990184281" fill="var(--primary-text)" font-family="Arial, sans-serif">Rarely modified</text>

  <rect x="280" y="130.980392429258" width="220" height="489.019607570742" rx="6.398529361204" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="390" y="176.470588109573" text-anchor="middle" font-size="19.195588083613" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Rootfs A</text>
  <text x="390" y="221.960784858516" text-anchor="middle" font-size="14.92990184281" fill="var(--ok-text)" font-family="Arial, sans-serif">ext4, ~1 GB</text>
  <text x="390" y="278.823529726067" text-anchor="middle" font-size="14.92990184281" fill="var(--ok-text)" font-family="Arial, sans-serif">Kernel modules</text>
  <text x="390" y="324.313725406382" text-anchor="middle" font-size="14.92990184281" fill="var(--ok-text)" font-family="Arial, sans-serif">systemd, busybox</text>
  <text x="390" y="381.176470273933" text-anchor="middle" font-size="14.92990184281" fill="var(--ok-text)" font-family="Arial, sans-serif">App binaries</text>
  <text x="390" y="438.039216210111" text-anchor="middle" font-size="14.92990184281" fill="var(--ok-text)" font-family="Arial, sans-serif">Mounted read-only</text>
  <text x="390" y="494.901961077662" text-anchor="middle" font-size="14.92990184281" fill="var(--ok-text)" font-family="Arial, sans-serif">Active slot</text>
  <text x="390" y="551.764705945213" text-anchor="middle" font-size="14.92990184281" fill="var(--ok-text)" font-family="Arial, sans-serif">Current release</text>

  <rect x="520" y="130.980392429258" width="220" height="489.019607570742" rx="6.398529361204" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630" y="176.470588109573" text-anchor="middle" font-size="19.195588083613" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Rootfs B</text>
  <text x="630" y="221.960784858516" text-anchor="middle" font-size="14.92990184281" fill="var(--info-text)" font-family="Arial, sans-serif">ext4, ~1 GB</text>
  <text x="630" y="278.823529726067" text-anchor="middle" font-size="14.92990184281" fill="var(--info-text)" font-family="Arial, sans-serif">Standby slot</text>
  <text x="630" y="324.313725406382" text-anchor="middle" font-size="14.92990184281" fill="var(--info-text)" font-family="Arial, sans-serif">Receives updates</text>
  <text x="630" y="381.176470273933" text-anchor="middle" font-size="14.92990184281" fill="var(--info-text)" font-family="Arial, sans-serif">Verified, then swap</text>
  <text x="630" y="438.039216210111" text-anchor="middle" font-size="14.92990184281" fill="var(--info-text)" font-family="Arial, sans-serif">Atomic A/B flip</text>
  <text x="630" y="494.901961077662" text-anchor="middle" font-size="14.92990184281" fill="var(--info-text)" font-family="Arial, sans-serif">Rollback on failure</text>
  <text x="630" y="551.764705945213" text-anchor="middle" font-size="14.92990184281" fill="var(--info-text)" font-family="Arial, sans-serif">mender, swupdate</text>

  <rect x="760" y="130.980392429258" width="220" height="489.019607570742" rx="6.398529361204" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="870" y="176.470588109573" text-anchor="middle" font-size="19.195588083613" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Data</text>
  <text x="870" y="221.960784858516" text-anchor="middle" font-size="14.92990184281" fill="var(--warn-text)" font-family="Arial, sans-serif">ext4, variable</text>
  <text x="870" y="278.823529726067" text-anchor="middle" font-size="14.92990184281" fill="var(--warn-text)" font-family="Arial, sans-serif">/var, /home</text>
  <text x="870" y="324.313725406382" text-anchor="middle" font-size="14.92990184281" fill="var(--warn-text)" font-family="Arial, sans-serif">Logs, databases</text>
  <text x="870" y="381.176470273933" text-anchor="middle" font-size="14.92990184281" fill="var(--warn-text)" font-family="Arial, sans-serif">User settings</text>
  <text x="870" y="438.039216210111" text-anchor="middle" font-size="14.92990184281" fill="var(--warn-text)" font-family="Arial, sans-serif">Survives updates</text>
  <text x="870" y="494.901961077662" text-anchor="middle" font-size="14.92990184281" fill="var(--warn-text)" font-family="Arial, sans-serif">Encrypted if needed</text>
  <text x="870" y="551.764705945213" text-anchor="middle" font-size="14.92990184281" fill="var(--warn-text)" font-family="Arial, sans-serif">Growth planned</text>

  <rect x="1000" y="130.980392429258" width="240" height="489.019607570742" rx="6.398529361204" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="176.470588109573" text-anchor="middle" font-size="19.195588083613" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Recovery</text>
  <text x="1120" y="221.960784858516" text-anchor="middle" font-size="14.92990184281" fill="var(--danger-text)" font-family="Arial, sans-serif">squashfs, 128 MB</text>
  <text x="1120" y="278.823529726067" text-anchor="middle" font-size="14.92990184281" fill="var(--danger-text)" font-family="Arial, sans-serif">Minimal rootfs</text>
  <text x="1120" y="324.313725406382" text-anchor="middle" font-size="14.92990184281" fill="var(--danger-text)" font-family="Arial, sans-serif">Network-capable</text>
  <text x="1120" y="381.176470273933" text-anchor="middle" font-size="14.92990184281" fill="var(--danger-text)" font-family="Arial, sans-serif">Reflash utility</text>
  <text x="1120" y="438.039216210111" text-anchor="middle" font-size="14.92990184281" fill="var(--danger-text)" font-family="Arial, sans-serif">Factory reset</text>
  <text x="1120" y="494.901961077662" text-anchor="middle" font-size="14.92990184281" fill="var(--danger-text)" font-family="Arial, sans-serif">Rescue partition</text>
  <text x="1120" y="551.764705945213" text-anchor="middle" font-size="14.92990184281" fill="var(--danger-text)" font-family="Arial, sans-serif">Signed, immutable</text>
</svg>

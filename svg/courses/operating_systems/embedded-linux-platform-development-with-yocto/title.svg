<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Circuit board traces -->
  <line x1="0" y1="100" x2="200" y2="100" stroke="#2d6a4f" stroke-width="2" opacity="0.4"/>
  <line x1="200" y1="100" x2="200" y2="200" stroke="#2d6a4f" stroke-width="2" opacity="0.4"/>
  <line x1="0" y1="300" x2="150" y2="300" stroke="#2d6a4f" stroke-width="2" opacity="0.4"/>
  <line x1="150" y1="300" x2="150" y2="200" stroke="#2d6a4f" stroke-width="2" opacity="0.4"/>
  <line x1="600" y1="100" x2="800" y2="100" stroke="#2d6a4f" stroke-width="2" opacity="0.4"/>
  <line x1="600" y1="100" x2="600" y2="200" stroke="#2d6a4f" stroke-width="2" opacity="0.4"/>
  <line x1="650" y1="300" x2="800" y2="300" stroke="#2d6a4f" stroke-width="2" opacity="0.4"/>
  <line x1="650" y1="300" x2="650" y2="200" stroke="#2d6a4f" stroke-width="2" opacity="0.4"/>
  <!-- Central chip -->
  <rect x="300" y="130" width="200" height="140" rx="8" fill="#1b4332" stroke="#52b788" stroke-width="2"/>
  <!-- Chip pins -->
  <rect x="320" y="120" width="15" height="15" fill="#52b788"/>
  <rect x="350" y="120" width="15" height="15" fill="#52b788"/>
  <rect x="380" y="120" width="15" height="15" fill="#52b788"/>
  <rect x="410" y="120" width="15" height="15" fill="#52b788"/>
  <rect x="440" y="120" width="15" height="15" fill="#52b788"/>
  <rect x="470" y="120" width="15" height="15" fill="#52b788"/>
  <rect x="320" y="265" width="15" height="15" fill="#52b788"/>
  <rect x="350" y="265" width="15" height="15" fill="#52b788"/>
  <rect x="380" y="265" width="15" height="15" fill="#52b788"/>
  <rect x="410" y="265" width="15" height="15" fill="#52b788"/>
  <rect x="440" y="265" width="15" height="15" fill="#52b788"/>
  <rect x="470" y="265" width="15" height="15" fill="#52b788"/>
  <!-- Chip label -->
  <text x="400" y="190" text-anchor="middle" font-size="16" fill="#b7e4c7" font-family="monospace">YOCTO</text>
  <text x="400" y="215" text-anchor="middle" font-size="12" fill="#74c69d" font-family="monospace">Embedded Linux</text>
  <text x="400" y="245" text-anchor="middle" font-size="11" fill="#52b788" font-family="monospace">BitBake | Poky</text>
  <!-- Build layer stack on left -->
  <rect x="50" y="145" width="120" height="25" rx="3" fill="#40916c" opacity="0.5"/>
  <text x="110" y="162" text-anchor="middle" font-size="10" fill="#d8f3dc">meta-poky</text>
  <rect x="50" y="175" width="120" height="25" rx="3" fill="#52b788" opacity="0.5"/>
  <text x="110" y="192" text-anchor="middle" font-size="10" fill="#d8f3dc">meta-oe</text>
  <rect x="50" y="205" width="120" height="25" rx="3" fill="#74c69d" opacity="0.5"/>
  <text x="110" y="222" text-anchor="middle" font-size="10" fill="#d8f3dc">meta-custom</text>
  <!-- Output images on right -->
  <rect x="630" y="145" width="120" height="25" rx="3" fill="#2d6a4f" opacity="0.6"/>
  <text x="690" y="162" text-anchor="middle" font-size="10" fill="#b7e4c7">rootfs.ext4</text>
  <rect x="630" y="175" width="120" height="25" rx="3" fill="#2d6a4f" opacity="0.6"/>
  <text x="690" y="192" text-anchor="middle" font-size="10" fill="#b7e4c7">zImage</text>
  <rect x="630" y="205" width="120" height="25" rx="3" fill="#2d6a4f" opacity="0.6"/>
  <text x="690" y="222" text-anchor="middle" font-size="10" fill="#b7e4c7">u-boot.bin</text>
  <!-- Arrows -->
  <line x1="170" y1="190" x2="295" y2="190" stroke="#52b788" stroke-width="1.5" opacity="0.6"/>
  <polygon points="295,185 305,190 295,195" fill="#52b788" opacity="0.6"/>
  <line x1="505" y1="190" x2="625" y2="190" stroke="#52b788" stroke-width="1.5" opacity="0.6"/>
  <polygon points="625,185 635,190 625,195" fill="#52b788" opacity="0.6"/>
</svg>

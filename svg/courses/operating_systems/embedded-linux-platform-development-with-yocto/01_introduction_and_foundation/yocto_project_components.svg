  <rect x="490.0001" y="529.3749" width="300" height="90.6251" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="639.9999" y="583.75" text-anchor="middle" font-size="21.6748" font-family="Arial, sans-serif" fill="var(--ok-text)">Build Engine</text>
  <rect x="940" y="529.3749" width="300" height="90.6251" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>

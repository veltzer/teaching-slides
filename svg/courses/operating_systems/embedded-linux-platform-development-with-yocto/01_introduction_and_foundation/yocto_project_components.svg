  <rect x="40" y="311.8749" width="300" height="108.75" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6"/>
  <text x="190" y="375.3125" text-anchor="middle" font-size="25.2874" font-family="Arial, sans-serif" fill="var(--warn-text)">Poky</text>
  <rect x="490.0001" y="311.8749" width="300" height="108.75" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <!-- palette: resources/palette_diagram.yaml -->

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="32.639028" font-weight="bold" fill="var(--text)">Product Lifecycle Management</text>

  <rect x="40" y="146.530612" width="370" height="402.44898" rx="6.527806" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="225" y="211.632653" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.111222" font-weight="bold" fill="var(--bg)">Active Support</text>
  <text x="225" y="253.061224" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.407481" fill="var(--bg)">Years 1 to 3</text>
  <text x="225" y="324.081633" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.319514" fill="var(--bg)">new features shipping</text>
  <text x="225" y="359.591837" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.319514" fill="var(--bg)">regular OTA updates</text>
  <text x="225" y="395.102041" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.319514" fill="var(--bg)">full CVE response</text>
  <text x="225" y="430.612245" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.319514" fill="var(--bg)">active board bring-up</text>
  <text x="225" y="501.632653" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231546" fill="var(--bg)">Yocto release tracked</text>

  <rect x="455" y="146.530612" width="370" height="402.44898" rx="6.527806" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="211.632653" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.111222" font-weight="bold" fill="var(--bg)">Maintenance</text>
  <text x="640" y="253.061224" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.407481" fill="var(--bg)">Years 3 to 5</text>
  <text x="640" y="324.081633" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.319514" fill="var(--bg)">security fixes only</text>
  <text x="640" y="359.591837" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.319514" fill="var(--bg)">backports from LTS</text>
  <text x="640" y="395.102041" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.319514" fill="var(--bg)">no new features</text>
  <text x="640" y="430.612245" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.319514" fill="var(--bg)">fewer, targeted updates</text>
  <text x="640" y="501.632653" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231546" fill="var(--bg)">Frozen feature set</text>

  <rect x="870" y="146.530612" width="370" height="402.44898" rx="6.527806" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1055" y="211.632653" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.111222" font-weight="bold" fill="var(--bg)">End of Life</text>
  <text x="1055" y="253.061224" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.407481" fill="var(--bg)">Year 5 and beyond</text>
  <text x="1055" y="324.081633" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.319514" fill="var(--bg)">no updates published</text>
  <text x="1055" y="359.591837" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.319514" fill="var(--bg)">migration guidance</text>
  <text x="1055" y="395.102041" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.319514" fill="var(--bg)">disposal and recall</text>
  <text x="1055" y="430.612245" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.319514" fill="var(--bg)">sunset communication</text>
  <text x="1055" y="501.632653" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231546" fill="var(--bg)">Field units retired</text>

  <line x1="410" y1="347.755102" x2="455" y2="347.755102" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="825" y1="347.755102" x2="870" y2="347.755102" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.407481" fill="var(--text-muted)">Plan the exit at day one: budget engineering across all three phases.</text>
</svg>

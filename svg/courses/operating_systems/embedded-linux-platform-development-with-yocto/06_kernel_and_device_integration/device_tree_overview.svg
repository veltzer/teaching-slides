<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
      }
    </style>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#212121"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="33.747727" font-weight="bold" fill="var(--primary-accent)">Device Tree: From Source to Kernel</text>

  <!-- DTS -->
  <rect x="40" y="92.727273" width="552" height="179.272727" rx="8.999394" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="3"/>
  <text x="316" y="140.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.24803" font-weight="bold" fill="var(--warn-text)">Device Tree Source</text>
  <text x="316" y="177.090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.373561" fill="var(--warn-text)">.dts, .dtsi (human-readable)</text>
  <text x="316" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.123712" fill="var(--warn-text)">Describes CPUs, memory, buses,</text>
  <text x="316" y="240.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.123712" fill="var(--warn-text)">peripherals, clocks, interrupts</text>

  <!-- Arrow DTS -> DTC -->
  <line x1="592" y1="182.363636" x2="688" y2="182.363636" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="640" y="171.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.748939" fill="var(--text-muted)">compile</text>

  <!-- DTC -->
  <rect x="688" y="92.727273" width="552" height="179.272727" rx="8.999394" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="3"/>
  <text x="964" y="140.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.24803" font-weight="bold" fill="var(--primary-text)">Device Tree Compiler</text>
  <text x="964" y="177.090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.373561" fill="var(--primary-text)">dtc (build tool)</text>
  <text x="964" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.123712" fill="var(--primary-text)">Validates syntax, resolves</text>
  <text x="964" y="240.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.123712" fill="var(--primary-text)">includes, emits binary blob</text>

  <!-- Arrow DTC -> DTB (down) -->
  <line x1="964" y1="272" x2="964" y2="345.818182" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="988" y="314.181818" text-anchor="start" font-family="Arial, sans-serif" font-size="15.748939" fill="var(--text-muted)">emit</text>

  <!-- DTB -->
  <rect x="688" y="356.363636" width="552" height="179.272727" rx="8.999394" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="3"/>
  <text x="964" y="403.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.24803" font-weight="bold" fill="var(--info-text)">Device Tree Blob</text>
  <text x="964" y="440.727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.373561" fill="var(--info-text)">.dtb (binary, compact)</text>
  <text x="964" y="477.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.123712" fill="var(--info-text)">Shipped in boot image,</text>
  <text x="964" y="504" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.123712" fill="var(--info-text)">loaded at boot time</text>

  <!-- Arrow DTB -> Bootloader (left) -->
  <line x1="688" y1="446" x2="592" y2="446" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="640" y="435.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.748939" fill="var(--text-muted)">pass</text>

  <!-- Bootloader / Kernel -->
  <rect x="40" y="356.363636" width="552" height="179.272727" rx="8.999394" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="3"/>
  <text x="316" y="403.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.24803" font-weight="bold" fill="var(--ok-text)">Bootloader / Kernel</text>
  <text x="316" y="440.727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.373561" fill="var(--ok-text)">U-Boot hands DTB to Linux</text>
  <text x="316" y="477.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.123712" fill="var(--ok-text)">Kernel probes drivers based on</text>
  <text x="316" y="504" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.123712" fill="var(--ok-text)">`compatible` strings — no hard-coding</text>

  <!-- Bottom banner -->
  <rect x="40" y="556.727273" width="1200" height="63.272727" rx="6.749545" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="583.090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.248636" font-weight="bold" fill="var(--text)">One generic kernel, many boards</text>
  <text x="640" y="609.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.998788" fill="var(--text-muted)">Hardware description lives in data, not code</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <!-- DTS -->
  <rect x="40" y="40" width="552" height="197.199999802" rx="9.43864405781" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="3" filter="url(#shadow)"/>
  <text x="316" y="92.199999527" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.675592663479" font-weight="bold" fill="var(--warn-text)">Device Tree Source</text>
  <text x="316" y="132.799999648" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.416779899502" fill="var(--warn-text)">.dts, .dtsi (human-readable)</text>
  <text x="316" y="173.399999769" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.057118360645" fill="var(--warn-text)">Describes CPUs, memory, buses,</text>
  <text x="316" y="202.399999384" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.057118360645" fill="var(--warn-text)">peripherals, clocks, interrupts</text>

  <!-- Arrow DTS -> DTC -->
  <line x1="592" y1="138.599999351" x2="688" y2="138.599999351" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="640" y="126.999999945" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.517626576764" fill="var(--text-muted)">compile</text>

  <!-- DTC -->
  <rect x="688" y="40" width="552" height="197.199999802" rx="9.43864405781" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="3" filter="url(#shadow)"/>
  <text x="964" y="92.199999527" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.675592663479" font-weight="bold" fill="var(--primary-text)">Device Tree Compiler</text>
  <text x="964" y="132.799999648" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.416779899502" fill="var(--primary-text)">dtc (build tool)</text>
  <text x="964" y="173.399999769" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.057118360645" fill="var(--primary-text)">Validates syntax, resolves</text>
  <text x="964" y="202.399999384" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.057118360645" fill="var(--primary-text)">includes, emits binary blob</text>

  <!-- Arrow DTC -> DTB (down) -->
  <line x1="964" y1="237.199999802" x2="964" y2="318.400000044" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="988" y="283.599999626" text-anchor="start" font-family="Arial, sans-serif" font-size="16.517626576764" fill="var(--text-muted)">emit</text>

  <!-- DTB -->
  <rect x="688" y="329.99999945" width="552" height="197.199999802" rx="9.43864405781" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="3" filter="url(#shadow)"/>
  <text x="964" y="382.200000077" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.675592663479" font-weight="bold" fill="var(--info-text)">Device Tree Blob</text>
  <text x="964" y="422.800000198" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.416779899502" fill="var(--info-text)">.dtb (binary, compact)</text>
  <text x="964" y="463.400000319" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.057118360645" fill="var(--info-text)">Shipped in boot image,</text>
  <text x="964" y="492.399999934" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.057118360645" fill="var(--info-text)">loaded at boot time</text>

  <!-- Arrow DTB -> Bootloader (left) -->
  <line x1="688" y1="428.599999901" x2="592" y2="428.599999901" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="640" y="416.999999395" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.517626576764" fill="var(--text-muted)">pass</text>

  <!-- Bootloader / Kernel -->
  <rect x="40" y="329.99999945" width="552" height="197.199999802" rx="9.43864405781" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="3" filter="url(#shadow)"/>
  <text x="316" y="382.200000077" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.675592663479" font-weight="bold" fill="var(--ok-text)">Bootloader / Kernel</text>
  <text x="316" y="422.800000198" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.416779899502" fill="var(--ok-text)">U-Boot hands DTB to Linux</text>
  <text x="316" y="463.400000319" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.057118360645" fill="var(--ok-text)">Kernel probes drivers based on</text>
  <text x="316" y="492.399999934" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.057118360645" fill="var(--ok-text)">`compatible` strings — no hard-coding</text>

  <!-- Bottom banner -->
  <rect x="40" y="550.400000264" width="1200" height="69.599999736" rx="7.078982518953" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="579.399999879" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.236948605669" font-weight="bold" fill="var(--text)">One generic kernel, many boards</text>
  <text x="640" y="608.399999494" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.877288115621" fill="var(--text-muted)">Hardware description lives in data, not code</text>
</svg>

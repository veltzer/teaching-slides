<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="480" height="124.285714" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.855844"/>
  <text x="280" y="112.499571" text-anchor="middle" font-size="27.498204" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Kernel Recipe</text>
  <rect x="760" y="40" width="480" height="124.285714" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.855844"/>
  <text x="1000" y="112.499571" text-anchor="middle" font-size="27.498204" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Kernel Config</text>
  <rect x="40" y="247.142571" width="480" height="124.285714" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.855844"/>
  <text x="280" y="319.642571" text-anchor="middle" font-size="27.498204" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Device Trees</text>
  <rect x="760" y="247.142571" width="480" height="124.285714" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.855844"/>
  <text x="1000" y="319.642571" text-anchor="middle" font-size="27.498204" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">BSP Layer</text>
  <rect x="280" y="495.714286" width="720" height="124.285714" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.855844"/>
  <text x="639.99976" y="568.213857" text-anchor="middle" font-size="29.613652" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Bootable Kernel Image</text>
  <path d="M 280 164.285429 L 639.99976 495.714286" stroke="var(--text)" stroke-width="1.1921" marker-end="url(#arrow)"/>
  <path d="M 1000 164.285429 L 639.99976 495.714286" stroke="var(--text)" stroke-width="1.1921" marker-end="url(#arrow)"/>
  <path d="M 280 371.428429 L 520 495.714286" stroke="var(--text)" stroke-width="1.1921" marker-end="url(#arrow)"/>
  <path d="M 1000 371.428429 L 760 495.714286" stroke="var(--text)" stroke-width="1.1921" marker-end="url(#arrow)"/>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
</svg>

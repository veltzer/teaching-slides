<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="260" height="196.981132075472" rx="6.27664133236" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="170" y="83.773584905661" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.922137774535" font-weight="bold" fill="var(--danger-text)">ROM Code</text>
  <text x="170" y="122.075471698113" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--danger-text)">Immutable silicon</text>
  <text x="170" y="154.905660377359" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--danger-text)">Root public key</text>
  <text x="170" y="187.735849056604" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--danger-text)">Verifies SPL</text>
  <text x="170" y="220.56603773585" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.599389553447" fill="var(--danger-text)">Root of trust</text>

  <rect x="350" y="40" width="260" height="196.981132075472" rx="6.27664133236" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="83.773584905661" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.922137774535" font-weight="bold" fill="var(--primary-text)">U-Boot</text>
  <text x="480" y="122.075471698113" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--primary-text)">FIT, x509 keys</text>
  <text x="480" y="154.905660377359" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--primary-text)">Verifies kernel</text>
  <text x="480" y="187.735849056604" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--primary-text)">Halts on bad sig</text>
  <text x="480" y="220.56603773585" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.599389553447" fill="var(--primary-text)">Second stage</text>

  <rect x="660" y="40" width="260" height="196.981132075472" rx="6.27664133236" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="790" y="83.773584905661" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.922137774535" font-weight="bold" fill="var(--primary-text)">Linux Kernel</text>
  <text x="790" y="122.075471698113" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--primary-text)">Signed Image</text>
  <text x="790" y="154.905660377359" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--primary-text)">Checks initramfs</text>
  <text x="790" y="187.735849056604" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--primary-text)">Enables IMA</text>
  <text x="790" y="220.56603773585" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.599389553447" fill="var(--primary-text)">Third stage</text>

  <rect x="970" y="40" width="270" height="196.981132075472" rx="6.27664133236" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1105" y="83.773584905661" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.922137774535" font-weight="bold" fill="var(--info-text)">Runtime</text>
  <text x="1105" y="122.075471698113" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--info-text)">TPM / OP-TEE</text>
  <text x="1105" y="154.905660377359" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--info-text)">Seals to PCR</text>
  <text x="1105" y="187.735849056604" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--info-text)">Remote attest</text>
  <text x="1105" y="220.56603773585" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.599389553447" fill="var(--info-text)">Post-boot</text>

  <line x1="300" y1="138.490566037736" x2="350" y2="138.490566037736" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="610" y1="138.490566037736" x2="660" y2="138.490566037736" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="920" y1="138.490566037736" x2="970" y2="138.490566037736" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>

  <rect x="40" y="291.698113207547" width="390" height="196.981132075472" rx="6.27664133236" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="335.471698113207" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.922137774535" font-weight="bold" fill="var(--warn-text)">RootFS (dm-verity)</text>
  <text x="235" y="379.245283018868" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--warn-text)">Merkle tree of blocks</text>
  <text x="235" y="412.075471698113" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--warn-text)">Root hash signed</text>
  <text x="235" y="444.905660377359" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--warn-text)">Read-only</text>
  <text x="235" y="477.735849056604" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.599389553447" fill="var(--warn-text)">Tamper-evident</text>

  <rect x="445" y="291.698113207547" width="390" height="196.981132075472" rx="6.27664133236" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="335.471698113207" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.922137774535" font-weight="bold" fill="var(--info-text)">Applications</text>
  <text x="640" y="379.245283018868" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--info-text)">IMA measures files</text>
  <text x="640" y="412.075471698113" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--info-text)">Signed via OSTree</text>
  <text x="640" y="444.905660377359" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--info-text)">SELinux / AppArmor</text>
  <text x="640" y="477.735849056604" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.599389553447" fill="var(--info-text)">Accountable userspace</text>

  <rect x="850" y="291.698113207547" width="390" height="196.981132075472" rx="6.27664133236" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="335.471698113207" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.922137774535" font-weight="bold" fill="var(--ok-text)">Update / Recovery</text>
  <text x="1045" y="379.245283018868" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--ok-text)">A/B slots</text>
  <text x="1045" y="412.075471698113" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--ok-text)">Anti-rollback fuses</text>
  <text x="1045" y="444.905660377359" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--ok-text)">Fail: boot old slot</text>
  <text x="1045" y="477.735849056604" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.599389553447" fill="var(--ok-text)">Field-fixable</text>

  <rect x="40" y="532.452830188679" width="1200" height="87.547169811321" rx="6.27664133236" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="570.754716981132" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.783817108355" font-weight="bold" fill="var(--text)">Every stage verifies the next</text>
  <text x="640" y="601.396226415094" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--text-muted)">Break one link, the chain stops</text>
</svg>

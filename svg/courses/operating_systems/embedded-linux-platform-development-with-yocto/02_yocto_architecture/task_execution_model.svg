<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="280" height="130" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-text)">do_fetch</text>
  <text x="180" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">download sources</text>
  <text x="180" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">from SRC_URI</text>

  <rect x="360" y="40" width="280" height="130" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">do_unpack</text>
  <text x="500" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">extract tarballs</text>
  <text x="500" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">into WORKDIR</text>

  <rect x="680" y="40" width="280" height="130" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="820" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">do_patch</text>
  <text x="820" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">apply patches</text>
  <text x="820" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">from recipe</text>

  <rect x="1000" y="40" width="240" height="130" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">do_configure</text>
  <text x="1120" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">autotools,</text>
  <text x="1120" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">cmake, meson</text>

  <line x1="320" y1="105" x2="360" y2="105" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="105" x2="680" y2="105" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="960" y1="105" x2="1000" y2="105" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="1120" y1="170" x2="1120" y2="220" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="1120" y1="220" x2="180" y2="220" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="180" y1="220" x2="180" y2="270" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="300" width="280" height="130" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">do_compile</text>
  <text x="180" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">build binaries</text>
  <text x="180" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">make, ninja</text>

  <rect x="360" y="300" width="280" height="130" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">do_install</text>
  <text x="500" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">stage files</text>
  <text x="500" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">into ${D}</text>

  <rect x="680" y="300" width="280" height="130" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="820" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-text)">do_package</text>
  <text x="820" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">split into</text>
  <text x="820" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">PACKAGES</text>

  <rect x="1000" y="300" width="240" height="130" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">do_package_write</text>
  <text x="1120" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">emit ipk/rpm/deb</text>
  <text x="1120" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">feed</text>

  <line x1="320" y1="365" x2="360" y2="365" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="365" x2="680" y2="365" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="960" y1="365" x2="1000" y2="365" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="465" width="1200" height="155" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="502" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Task execution</text>
  <text x="640" y="538" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Each task has a signature hash; identical inputs reuse sstate-cache output.</text>
  <text x="640" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">BB_NUMBER_THREADS controls parallel tasks; PARALLEL_MAKE sets make -j.</text>
  <text x="640" y="602" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">Override or extend with do_foo_prepend / _append in your recipe.</text>
</svg>

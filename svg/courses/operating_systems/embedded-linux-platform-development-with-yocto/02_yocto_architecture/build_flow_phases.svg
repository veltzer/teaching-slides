<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- palette: resources/palette_diagram.yaml -->

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="31.236212" font-weight="bold" fill="var(--text)">Yocto Build Flow Phases</text>

  <rect x="40" y="94.205607" width="400" height="119.252336" rx="6.247242" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="142.990654" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.906555" font-weight="bold" fill="var(--bg)">Configuration</text>
  <text x="240" y="180.934579" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.618106" fill="var(--bg)">local.conf, bblayers.conf</text>
  <rect x="480" y="94.205607" width="760" height="119.252336" rx="6.247242" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="510" y="137.570093" font-family="Arial, sans-serif" font-size="16.659313" font-weight="bold" fill="var(--text)">Inputs: MACHINE, DISTRO, enabled layers</text>
  <text x="510" y="170.093458" font-family="Arial, sans-serif" font-size="14.576899" fill="var(--text-muted)">BitBake reads conf files and resolves variable overrides.</text>
  <text x="510" y="197.196262" font-family="Arial, sans-serif" font-size="14.576899" fill="var(--text-muted)">Output: a fully expanded datastore for the build.</text>

  <rect x="40" y="229.719626" width="400" height="119.252336" rx="6.247242" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="278.504673" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.906555" font-weight="bold" fill="var(--bg)">Parsing</text>
  <text x="240" y="316.448598" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.618106" fill="var(--bg)">recipes and classes</text>
  <rect x="480" y="229.719626" width="760" height="119.252336" rx="6.247242" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="510" y="273.084112" font-family="Arial, sans-serif" font-size="16.659313" font-weight="bold" fill="var(--text)">Recipe analysis and dependency graph</text>
  <text x="510" y="305.607477" font-family="Arial, sans-serif" font-size="14.576899" fill="var(--text-muted)">All .bb / .bbappend / .bbclass files are parsed once.</text>
  <text x="510" y="332.71028" font-family="Arial, sans-serif" font-size="14.576899" fill="var(--text-muted)">Output: task list ordered by DEPENDS and RDEPENDS.</text>

  <rect x="40" y="365.233645" width="400" height="119.252336" rx="6.247242" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="414.018692" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.906555" font-weight="bold" fill="var(--bg)">Task Execution</text>
  <text x="240" y="451.962617" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.618106" fill="var(--bg)">fetch, configure, compile, install</text>
  <rect x="480" y="365.233645" width="760" height="119.252336" rx="6.247242" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="510" y="408.598131" font-family="Arial, sans-serif" font-size="16.659313" font-weight="bold" fill="var(--text)">Per-recipe task chain runs in parallel</text>
  <text x="510" y="441.121495" font-family="Arial, sans-serif" font-size="14.576899" fill="var(--text-muted)">Sstate cache skips tasks whose inputs have not changed.</text>
  <text x="510" y="468.224299" font-family="Arial, sans-serif" font-size="14.576899" fill="var(--text-muted)">Output: per-package binaries staged into sysroots.</text>

  <rect x="40" y="500.747664" width="400" height="119.252336" rx="6.247242" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="549.53271" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.906555" font-weight="bold" fill="var(--bg)">Image Creation</text>
  <text x="240" y="587.476636" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.618106" fill="var(--bg)">rootfs and bootable media</text>
  <rect x="480" y="500.747664" width="760" height="119.252336" rx="6.247242" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="510" y="544.11215" font-family="Arial, sans-serif" font-size="16.659313" font-weight="bold" fill="var(--text)">Package install into target rootfs</text>
  <text x="510" y="576.635514" font-family="Arial, sans-serif" font-size="14.576899" fill="var(--text-muted)">Assembles bootloader, kernel, and filesystem images.</text>
  <text x="510" y="603.738318" font-family="Arial, sans-serif" font-size="14.576899" fill="var(--text-muted)">Output: flashable artifacts under tmp/deploy/images.</text>
</svg>

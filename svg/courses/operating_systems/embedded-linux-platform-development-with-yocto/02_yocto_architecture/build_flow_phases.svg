<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #c4cdd6; --border: #6b7280; --text: #212121;
        --text-muted: #555555; --text-faint: #888888; --code-bg: #1a1a2e; --shadow: #00000044; --black: #000000;
        --primary-fill: #5a7a9c; --primary-border: #3d5a7d; --primary-text: #ffffff; --primary-accent: #243b59;
        --ok-fill: #7a9a6a; --ok-border: #5a7a4d; --ok-text: #ffffff; --ok-accent: #385030;
        --warn-fill: #c8924a; --warn-border: #9c6e2e; --warn-text: #ffffff; --warn-accent: #5a3f12;
        --danger-fill: #a86058; --danger-border: #7d3f38; --danger-text: #ffffff; --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e; --info-border: #574a68; --info-text: #ffffff; --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#c4cdd6"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bd7d75"/><stop offset="100%" stop-color="#7d3f38"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#555555"/></marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/></marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/></marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/></marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/></marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/></marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/></marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.623684516765" font-weight="bold" fill="var(--text)">Yocto Build Flow</text>

  <rect x="40" y="71.351351351351" width="400" height="125.405405405405" rx="8.178195576219" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="118.378378378378" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.490037834601" font-weight="bold" fill="var(--danger-text)">Configuration</text>
  <text x="240" y="160.18018018018" text-anchor="middle" font-family="Courier New, monospace" font-size="15.33411670541" fill="var(--danger-text)">local.conf, bblayers.conf</text>
  <rect x="480" y="71.351351351351" width="760" height="125.405405405405" rx="8.178195576219" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="510" y="113.153153153153" font-family="Arial, sans-serif" font-size="17.378665599465" font-weight="bold" fill="var(--text)">MACHINE, DISTRO, layers</text>
  <text x="510" y="149.72972972973" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--text-muted)">BitBake reads conf; resolves overrides</text>
  <text x="510" y="181.081081081081" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--text-muted)">Output: expanded datastore</text>

  <rect x="40" y="212.432432432432" width="400" height="125.405405405405" rx="8.178195576219" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="259.459459459459" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.490037834601" font-weight="bold" fill="var(--primary-text)">Parsing</text>
  <text x="240" y="301.261261261261" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.33411670541" fill="var(--primary-text)">recipes and classes</text>
  <rect x="480" y="212.432432432432" width="760" height="125.405405405405" rx="8.178195576219" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="510" y="254.234234234234" font-family="Arial, sans-serif" font-size="17.378665599465" font-weight="bold" fill="var(--text)">Dependency graph</text>
  <text x="510" y="290.810810810811" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--text-muted)">.bb / .bbappend / .bbclass</text>
  <text x="510" y="322.162162162162" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--text-muted)">Output: ordered task list</text>

  <rect x="40" y="353.513513513513" width="400" height="125.405405405405" rx="8.178195576219" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="400.540540540541" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.490037834601" font-weight="bold" fill="var(--primary-text)">Task Execution</text>
  <text x="240" y="442.342342342342" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.33411670541" fill="var(--primary-text)">fetch, compile, install</text>
  <rect x="480" y="353.513513513513" width="760" height="125.405405405405" rx="8.178195576219" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="510" y="395.315315315315" font-family="Arial, sans-serif" font-size="17.378665599465" font-weight="bold" fill="var(--text)">Parallel task chain</text>
  <text x="510" y="431.891891891892" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--text-muted)">Sstate cache skips unchanged</text>
  <text x="510" y="463.243243243243" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--text-muted)">Output: binaries in sysroots</text>

  <rect x="40" y="494.594594594595" width="400" height="125.405405405405" rx="8.178195576219" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="541.621621621622" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.490037834601" font-weight="bold" fill="var(--warn-text)">Image Creation</text>
  <text x="240" y="583.423423423423" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.33411670541" fill="var(--warn-text)">rootfs and media</text>
  <rect x="480" y="494.594594594595" width="760" height="125.405405405405" rx="8.178195576219" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="510" y="536.396396396396" font-family="Arial, sans-serif" font-size="17.378665599465" font-weight="bold" fill="var(--text)">Install into rootfs</text>
  <text x="510" y="572.972972972973" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--text-muted)">Bootloader + kernel + FS</text>
  <text x="510" y="604.324324324324" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--text-muted)">tmp/deploy/images</text>
</svg>

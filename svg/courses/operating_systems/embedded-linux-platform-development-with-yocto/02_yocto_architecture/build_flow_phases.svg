<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="400" height="132.571428571428" rx="8.408612364996" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="89.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.123684003738" font-weight="bold" fill="var(--danger-text)">Configuration</text>
  <text x="240" y="133.904761904762" text-anchor="middle" font-family="Courier New, monospace" font-size="15.766148184367" fill="var(--danger-text)">local.conf, bblayers.conf</text>
  <rect x="480" y="40" width="760" height="132.571428571428" rx="8.408612364996" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="510" y="84.190476190476" font-family="Arial, sans-serif" font-size="17.868301275617" font-weight="bold" fill="var(--text)">MACHINE, DISTRO, layers</text>
  <text x="510" y="122.857142857143" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--text-muted)">BitBake reads conf; resolves overrides</text>
  <text x="510" y="156" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--text-muted)">Output: expanded datastore</text>

  <rect x="40" y="189.142857142857" width="400" height="132.571428571428" rx="8.408612364996" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="238.857142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.123684003738" font-weight="bold" fill="var(--primary-text)">Parsing</text>
  <text x="240" y="283.047619047619" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.766148184367" fill="var(--primary-text)">recipes and classes</text>
  <rect x="480" y="189.142857142857" width="760" height="132.571428571428" rx="8.408612364996" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="510" y="233.333333333333" font-family="Arial, sans-serif" font-size="17.868301275617" font-weight="bold" fill="var(--text)">Dependency graph</text>
  <text x="510" y="272" font-family="Courier New, monospace" font-size="14.715071638743" fill="var(--text-muted)">.bb / .bbappend / .bbclass</text>
  <text x="510" y="305.142857142857" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--text-muted)">Output: ordered task list</text>

  <rect x="40" y="338.285714285714" width="400" height="132.571428571428" rx="8.408612364996" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="388.000000000001" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.123684003738" font-weight="bold" fill="var(--primary-text)">Task Execution</text>
  <text x="240" y="432.190476190476" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.766148184367" fill="var(--primary-text)">fetch, compile, install</text>
  <rect x="480" y="338.285714285714" width="760" height="132.571428571428" rx="8.408612364996" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="510" y="382.47619047619" font-family="Arial, sans-serif" font-size="17.868301275617" font-weight="bold" fill="var(--text)">Parallel task chain</text>
  <text x="510" y="421.142857142857" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--text-muted)">Sstate cache skips unchanged</text>
  <text x="510" y="454.285714285714" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--text-muted)">Output: binaries in sysroots</text>

  <rect x="40" y="487.428571428572" width="400" height="132.571428571428" rx="8.408612364996" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="537.142857142858" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.123684003738" font-weight="bold" fill="var(--warn-text)">Image Creation</text>
  <text x="240" y="581.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.766148184367" fill="var(--warn-text)">rootfs and media</text>
  <rect x="480" y="487.428571428572" width="760" height="132.571428571428" rx="8.408612364996" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="510" y="531.619047619047" font-family="Arial, sans-serif" font-size="17.868301275617" font-weight="bold" fill="var(--text)">Install into rootfs</text>
  <text x="510" y="570.285714285714" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--text-muted)">Bootloader + kernel + FS</text>
  <text x="510" y="603.428571428571" font-family="Courier New, monospace" font-size="14.715071638743" fill="var(--text-muted)">tmp/deploy/images</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="80" y="120" width="373.3333" height="420" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="8.75"/>
  <text x="266.6667" y="183" text-anchor="middle" font-size="26.1333" font-weight="bold">Build Directory</text>
  <rect x="117.3333" y="225" width="298.6667" height="84" fill="var(--bg)" stroke="var(--text)" stroke-width="1.28" rx="8.75"/>
  <text x="266.6667" y="277.5" text-anchor="middle" font-size="22.4">Task Execution</text>
  <rect x="117.3333" y="351" width="298.6667" height="84" fill="var(--bg)" stroke="var(--text)" stroke-width="1.28" rx="8.75"/>
  <text x="266.6667" y="403.5" text-anchor="middle" font-size="22.4">Hash Calculation</text>
  <rect x="826.6667" y="120" width="373.3333" height="420" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="8.75"/>
  <text x="1013.3333" y="183" text-anchor="middle" font-size="26.1333" font-weight="bold">Sstate Cache</text>
  <rect x="864" y="225" width="298.6667" height="84" fill="var(--bg)" stroke="var(--text)" stroke-width="1.28" rx="8.75"/>
  <text x="1013.3333" y="277.5" text-anchor="middle" font-size="22.4">Cached Results</text>
  <rect x="864" y="351" width="298.6667" height="84" fill="var(--bg)" stroke="var(--text)" stroke-width="1.28" rx="8.75"/>
  <text x="1013.3333" y="403.5" text-anchor="middle" font-size="22.4">Hash Index</text>
  <path d="M 453.3333 267 L 826.6667 267" stroke="var(--ok-border)" stroke-width="2.56" marker-end="url(#a3)" />
  <text x="640" y="246" text-anchor="middle" font-size="20.5333">Store</text>
  <path d="M 826.6667 393 L 453.3333 393" stroke="var(--primary-border)" stroke-width="2.56" marker-end="url(#a3)" />
  <text x="640" y="435" text-anchor="middle" font-size="20.5333">Restore</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="a3" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <text x="44.4444" y="71.1111" font-family="sans-serif" font-size="11.5556" fill="var(--danger-accent)" font-weight="bold">Highest</text>
  <text x="44.4444" y="435.5556" font-family="sans-serif" font-size="11.5556" fill="var(--text-faint)">Lowest</text>
  <line x1="80" y1="53.3333" x2="80" y2="453.3333" stroke="var(--border)" stroke-width="1.3333" />
  <polygon points="80,48.8889 76.4444,60.4444 83.5556,60.4444" fill="var(--text-faint)" />
  <rect x="97.7778" y="39.1111" width="746.6667" height="60.4444" rx="6" fill="var(--danger-accent)" filter="url(#shadow)" />
  <text x="471.1111" y="67.5556" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">1. Command-line overrides</text>
  <text x="471.1111" y="88.8889" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--danger-accent)">bitbake -e -v   MACHINE=raspberrypi4 bitbake core-image-minimal</text>
  <rect x="97.7778" y="112" width="746.6667" height="60.4444" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="471.1111" y="140.4444" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">2. local.conf  (build/conf/local.conf)</text>
  <text x="471.1111" y="161.7778" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--primary-accent)">MACHINE = "raspberrypi4"   DISTRO = "poky"   BB_NUMBER_THREADS = "4"</text>
  <rect x="97.7778" y="184.8889" width="746.6667" height="60.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="471.1111" y="213.3333" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--text)">3. distro.conf  (meta-poky/conf/distro/poky.conf)</text>
  <text x="471.1111" y="234.6667" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--text-muted)">DISTRO_FEATURES += "systemd wifi bluetooth"</text>
  <rect x="97.7778" y="257.7778" width="746.6667" height="60.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="471.1111" y="286.2222" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--text)">4. machine.conf  (meta-raspberrypi/conf/machine/)</text>
  <text x="471.1111" y="307.5556" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--text-muted)">KERNEL_IMAGETYPE = "Image"   MACHINE_FEATURES = "usbhost wifi"</text>
  <rect x="97.7778" y="330.6667" width="746.6667" height="60.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="471.1111" y="359.1111" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--text)">5. Recipe  (*.bb / *.bbappend)</text>
  <text x="471.1111" y="380.4444" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--text-muted)">SRC_URI = "git://..."    DEPENDS = "zlib openssl"</text>
  <rect x="97.7778" y="403.5556" width="746.6667" height="48" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="471.1111" y="428.4444" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--text-faint)">6. BitBake built-in defaults</text>
  <text x="471.1111" y="444.4444" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="var(--text-faint)">B = "${WORKDIR}/build"    STAMP = "${STAMPS_DIR}/..."</text>
  <rect x="871.1111" y="39.1111" width="240" height="337.7778" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="991.1111" y="65.7778" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--text)">Override syntax</text>
  <text x="888.8889" y="88.8889" font-family="monospace" font-size="11.5556" fill="var(--primary-accent)">VAR_append = " extra"</text>
  <text x="888.8889" y="106.6667" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">append to value</text>
  <text x="888.8889" y="131.5556" font-family="monospace" font-size="11.5556" fill="var(--primary-accent)">VAR_prepend = "first "</text>
  <text x="888.8889" y="149.3333" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">prepend to value</text>
  <text x="888.8889" y="174.2222" font-family="monospace" font-size="11.5556" fill="var(--primary-accent)">VAR_remove = "item"</text>
  <text x="888.8889" y="192" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">remove from list</text>
  <line x1="888.8889" y1="206.2222" x2="1093.3333" y2="206.2222" stroke="var(--border)" stroke-width="0.8889" />
  <text x="991.1111" y="227.5556" text-anchor="middle" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="var(--text)">Conditional overrides</text>
  <text x="888.8889" y="248.8889" font-family="monospace" font-size="11.5556" fill="var(--primary-accent)">VAR_raspberrypi4</text>
  <text x="888.8889" y="264.8889" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">applies if MACHINE matches</text>
  <text x="888.8889" y="289.7778" font-family="monospace" font-size="11.5556" fill="var(--primary-accent)">VAR_class-target</text>
  <text x="888.8889" y="305.7778" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">applies for target builds</text>
  <text x="888.8889" y="330.6667" font-family="monospace" font-size="11.5556" fill="var(--primary-accent)">VAR_df-systemd</text>
  <text x="888.8889" y="346.6667" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">distro feature conditional</text>
  <rect x="97.7778" y="467.5556" width="746.6667" height="53.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="471.1111" y="492.4444" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="var(--primary-accent)">Debug variable value:</text>
  <text x="471.1111" y="512" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--text)">bitbake -e core-image-minimal | grep ^MACHINE=</text>
</svg>
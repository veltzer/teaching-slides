<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <text x="86.875" y="104.4444" font-family="sans-serif" font-size="11.2974" fill="var(--danger-accent)" font-weight="bold">Highest</text>
  <text x="86.875" y="434.7223" font-family="sans-serif" font-size="11.2974" fill="var(--text-faint)">Lowest</text>
  <line x1="124.375" y1="88.3333" x2="124.375" y2="450.8333" stroke="var(--border)" stroke-width="1.3333" />
  <polygon points="124.375,84.3056 120.625,94.7777 128.125,94.7777" fill="var(--text-faint)" />
  <rect x="143.125" y="75.4444" width="787.5" height="54.7777" rx="6" fill="var(--danger-accent)" filter="url(#shadow)" />
  <text x="536.875" y="101.2223" text-anchor="middle" font-family="sans-serif" font-size="15.6425" font-weight="bold" fill="var(--bg)">1. Command-line overrides</text>
  <text x="536.875" y="120.5556" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--danger-accent)">bitbake -e -v   MACHINE=raspberrypi4 bitbake core-image-minimal</text>
  <rect x="143.125" y="141.5" width="787.5" height="54.7777" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="536.875" y="167.2777" text-anchor="middle" font-family="sans-serif" font-size="15.6425" font-weight="bold" fill="var(--bg)">2. local.conf  (build/conf/local.conf)</text>
  <text x="536.875" y="186.6111" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--primary-accent)">MACHINE = "raspberrypi4"   DISTRO = "poky"   BB_NUMBER_THREADS = "4"</text>
  <rect x="143.125" y="207.5556" width="787.5" height="54.7777" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="536.875" y="233.3333" text-anchor="middle" font-family="sans-serif" font-size="15.6425" font-weight="bold" fill="var(--text)">3. distro.conf  (meta-poky/conf/distro/poky.conf)</text>
  <text x="536.875" y="252.6667" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--text-muted)">DISTRO_FEATURES += "systemd wifi bluetooth"</text>
  <rect x="143.125" y="273.6111" width="787.5" height="54.7777" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="536.875" y="299.3889" text-anchor="middle" font-family="sans-serif" font-size="15.6425" font-weight="bold" fill="var(--text)">4. machine.conf  (meta-raspberrypi/conf/machine/)</text>
  <text x="536.875" y="318.7223" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--text-muted)">KERNEL_IMAGETYPE = "Image"   MACHINE_FEATURES = "usbhost wifi"</text>
  <rect x="143.125" y="339.6667" width="787.5" height="54.7777" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="536.875" y="365.4444" text-anchor="middle" font-family="sans-serif" font-size="15.6425" font-weight="bold" fill="var(--text)">5. Recipe  (*.bb / *.bbappend)</text>
  <text x="536.875" y="384.7777" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--text-muted)">SRC_URI = "git://..."    DEPENDS = "zlib openssl"</text>
  <rect x="143.125" y="405.7223" width="787.5" height="43.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="536.875" y="428.2777" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--text-faint)">6. BitBake built-in defaults</text>
  <text x="536.875" y="442.7777" text-anchor="middle" font-family="monospace" font-size="12.1663" fill="var(--text-faint)">B = "${WORKDIR}/build"    STAMP = "${STAMPS_DIR}/..."</text>
  <rect x="958.75" y="75.4444" width="253.125" height="306.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1085.3125" y="99.6111" text-anchor="middle" font-family="sans-serif" font-size="13.0354" font-weight="bold" fill="var(--text)">Override syntax</text>
  <text x="977.5" y="120.5556" font-family="monospace" font-size="11.2974" fill="var(--primary-accent)">VAR_append = " extra"</text>
  <text x="977.5" y="136.6667" font-family="sans-serif" font-size="10.4284" fill="var(--text-muted)">append to value</text>
  <text x="977.5" y="159.2223" font-family="monospace" font-size="11.2974" fill="var(--primary-accent)">VAR_prepend = "first "</text>
  <text x="977.5" y="175.3333" font-family="sans-serif" font-size="10.4284" fill="var(--text-muted)">prepend to value</text>
  <text x="977.5" y="197.8889" font-family="monospace" font-size="11.2974" fill="var(--primary-accent)">VAR_remove = "item"</text>
  <text x="977.5" y="214" font-family="sans-serif" font-size="10.4284" fill="var(--text-muted)">remove from list</text>
  <line x1="977.5" y1="226.8889" x2="1193.1249" y2="226.8889" stroke="var(--border)" stroke-width="0.8889" />
  <text x="1085.3125" y="246.2223" text-anchor="middle" font-family="sans-serif" font-size="12.1663" font-weight="bold" fill="var(--text)">Conditional overrides</text>
  <text x="977.5" y="265.5556" font-family="monospace" font-size="11.2974" fill="var(--primary-accent)">VAR_raspberrypi4</text>
  <text x="977.5" y="280.0556" font-family="sans-serif" font-size="10.4284" fill="var(--text-muted)">applies if MACHINE matches</text>
  <text x="977.5" y="302.6111" font-family="monospace" font-size="11.2974" fill="var(--primary-accent)">VAR_class-target</text>
  <text x="977.5" y="317.1111" font-family="sans-serif" font-size="10.4284" fill="var(--text-muted)">applies for target builds</text>
  <text x="977.5" y="339.6667" font-family="monospace" font-size="11.2974" fill="var(--primary-accent)">VAR_df-systemd</text>
  <text x="977.5" y="354.1667" font-family="sans-serif" font-size="10.4284" fill="var(--text-muted)">distro feature conditional</text>
  <rect x="143.125" y="463.7223" width="787.5" height="48.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="536.875" y="486.2777" text-anchor="middle" font-family="sans-serif" font-size="13.9044" font-weight="bold" fill="var(--primary-accent)">Debug variable value:</text>
  <text x="536.875" y="504" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--text)">bitbake -e core-image-minimal | grep ^MACHINE=</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <text x="40" y="78.523977" font-size="13.448054" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">Highest</text>
  <text x="40" y="517.269438" font-size="13.448054" fill="var(--text-faint)" font-family="Arial, sans-serif">Lowest</text>
  <line x1="80" y1="57.121782" x2="80" y2="538.6715" stroke="var(--border)" stroke-width="1.3333" />
  <polygon points="80,51.771333 76,65.682607 84,65.682607" fill="var(--text-faint)" />
  <rect x="100" y="40" width="840" height="72.76741" rx="7.142203" fill="var(--danger-accent)" />
  <text x="520" y="74.243698" text-anchor="middle" font-size="18.620318" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">1. Command-line overrides</text>
  <text x="520" y="99.926305" text-anchor="middle" font-size="15.516912" fill="var(--danger-accent)" font-family="Courier New, monospace">bitbake -e -v   MACHINE=raspberrypi4 bitbake core-image-minimal</text>
  <rect x="100" y="127.749119" width="840" height="72.76741" rx="7.142203" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="520" y="161.992551" text-anchor="middle" font-size="18.620318" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">2. local.conf  (build/conf/local.conf)</text>
  <text x="520" y="187.675291" text-anchor="middle" font-size="15.516912" fill="var(--primary-accent)" font-family="Courier New, monospace">MACHINE = "raspberrypi4"   DISTRO = "poky"   BB_NUMBER_THREADS = "4"</text>
  <rect x="100" y="215.498237" width="840" height="72.76741" rx="7.142203" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="520" y="249.741669" text-anchor="middle" font-size="18.620318" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">3. distro.conf  (meta-poky/conf/distro/poky.conf)</text>
  <text x="520" y="275.42441" text-anchor="middle" font-size="15.516912" fill="var(--text-muted)" font-family="Courier New, monospace">DISTRO_FEATURES += "systemd wifi bluetooth"</text>
  <rect x="100" y="303.247223" width="840" height="72.76741" rx="7.142203" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="520" y="337.490788" text-anchor="middle" font-size="18.620318" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">4. machine.conf  (meta-raspberrypi/conf/machine/)</text>
  <text x="520" y="363.173528" text-anchor="middle" font-size="15.516912" fill="var(--text-muted)" font-family="Courier New, monospace">KERNEL_IMAGETYPE = "Image"   MACHINE_FEATURES = "usbhost wifi"</text>
  <rect x="100" y="390.996342" width="840" height="72.76741" rx="7.142203" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="520" y="425.239774" text-anchor="middle" font-size="18.620318" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">5. Recipe  (*.bb / *.bbappend)</text>
  <text x="520" y="450.922381" text-anchor="middle" font-size="15.516912" fill="var(--text-muted)" font-family="Courier New, monospace">SRC_URI = "git://..."    DEPENDS = "zlib openssl"</text>
  <rect x="100" y="478.74546" width="840" height="57.785966" rx="7.142203" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="520" y="508.708347" text-anchor="middle" font-size="16.551341" fill="var(--text-faint)" font-family="Arial, sans-serif">6. BitBake built-in defaults</text>
  <text x="520" y="527.970336" text-anchor="middle" font-size="14.482363" fill="var(--text-faint)" font-family="Courier New, monospace">B = "${WORKDIR}/build"    STAMP = "${STAMPS_DIR}/..."</text>
  <rect x="970" y="40" width="270" height="406.641969" rx="7.142203" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1105" y="72.103359" text-anchor="middle" font-size="15.516912" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Override syntax</text>
  <text x="990" y="99.926305" font-size="13.448054" fill="var(--primary-accent)" font-family="Courier New, monospace">VAR_append = " extra"</text>
  <text x="990" y="121.3285" font-size="12.413624" fill="var(--text-muted)" font-family="Arial, sans-serif">append to value</text>
  <text x="990" y="151.291653" font-size="13.448054" fill="var(--primary-accent)" font-family="Courier New, monospace">VAR_prepend = "first "</text>
  <text x="990" y="172.693715" font-size="12.413624" fill="var(--text-muted)" font-family="Arial, sans-serif">prepend to value</text>
  <text x="990" y="202.656867" font-size="13.448054" fill="var(--primary-accent)" font-family="Courier New, monospace">VAR_remove = "item"</text>
  <text x="990" y="224.059062" font-size="12.413624" fill="var(--text-muted)" font-family="Arial, sans-serif">remove from list</text>
  <line x1="990" y1="241.180845" x2="1219.999893" y2="241.180845" stroke="var(--border)" stroke-width="0.8889" />
  <text x="1105" y="266.863585" text-anchor="middle" font-size="14.482363" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Conditional overrides</text>
  <text x="990" y="292.546192" font-size="13.448054" fill="var(--primary-accent)" font-family="Courier New, monospace">VAR_raspberrypi4</text>
  <text x="990" y="311.808181" font-size="12.413624" fill="var(--text-muted)" font-family="Arial, sans-serif">applies if MACHINE matches</text>
  <text x="990" y="341.771201" font-size="13.448054" fill="var(--primary-accent)" font-family="Courier New, monospace">VAR_class-target</text>
  <text x="990" y="361.033189" font-size="12.413624" fill="var(--text-muted)" font-family="Arial, sans-serif">applies for target builds</text>
  <text x="990" y="390.996342" font-size="13.448054" fill="var(--primary-accent)" font-family="Courier New, monospace">VAR_df-systemd</text>
  <text x="990" y="410.258331" font-size="12.413624" fill="var(--text-muted)" font-family="Arial, sans-serif">distro feature conditional</text>
  <rect x="100" y="555.793415" width="840" height="64.206585" rx="7.142203" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="520" y="585.756302" text-anchor="middle" font-size="16.551341" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Debug variable value:</text>
  <text x="520" y="609.298836" text-anchor="middle" font-size="15.516912" fill="var(--text)" font-family="Courier New, monospace">bitbake -e core-image-minimal | grep ^MACHINE=</text>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:text x="44.4444" y="71.1111" font-family="sans-serif" font-size="11.5556" fill="#c62828" font-weight="bold">Highest</ns0:text>
  <ns0:text x="44.4444" y="435.5556" font-family="sans-serif" font-size="11.5556" fill="#9e9e9e">Lowest</ns0:text>
  <ns0:line x1="80" y1="53.3333" x2="80" y2="453.3333" stroke="#e0e0e0" stroke-width="1.3333" />
  <ns0:polygon points="80,48.8889 76.4444,60.4444 83.5556,60.4444" fill="#aaaaaa" />
  <ns0:rect x="97.7778" y="39.1111" width="746.6667" height="60.4444" rx="5.3333" fill="#c62828" filter="url(#shadow)" />
  <ns0:text x="471.1111" y="67.5556" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">1. Command-line overrides</ns0:text>
  <ns0:text x="471.1111" y="88.8889" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="#ffcdd2">bitbake -e -v   MACHINE=raspberrypi4 bitbake core-image-minimal</ns0:text>
  <ns0:rect x="97.7778" y="112" width="746.6667" height="60.4444" rx="5.3333" fill="url(#grad-primary)" filter="url(#shadow)" />
  <ns0:text x="471.1111" y="140.4444" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">2. local.conf  (build/conf/local.conf)</ns0:text>
  <ns0:text x="471.1111" y="161.7778" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="#bbdefb">MACHINE = "raspberrypi4"   DISTRO = "poky"   BB_NUMBER_THREADS = "4"</ns0:text>
  <ns0:rect x="97.7778" y="184.8889" width="746.6667" height="60.4444" rx="5.3333" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="471.1111" y="213.3333" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#212121">3. distro.conf  (meta-poky/conf/distro/poky.conf)</ns0:text>
  <ns0:text x="471.1111" y="234.6667" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="#555555">DISTRO_FEATURES += "systemd wifi bluetooth"</ns0:text>
  <ns0:rect x="97.7778" y="257.7778" width="746.6667" height="60.4444" rx="5.3333" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="471.1111" y="286.2222" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#212121">4. machine.conf  (meta-raspberrypi/conf/machine/)</ns0:text>
  <ns0:text x="471.1111" y="307.5556" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="#555555">KERNEL_IMAGETYPE = "Image"   MACHINE_FEATURES = "usbhost wifi"</ns0:text>
  <ns0:rect x="97.7778" y="330.6667" width="746.6667" height="60.4444" rx="5.3333" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="471.1111" y="359.1111" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#212121">5. Recipe  (*.bb / *.bbappend)</ns0:text>
  <ns0:text x="471.1111" y="380.4444" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="#555555">SRC_URI = "git://..."    DEPENDS = "zlib openssl"</ns0:text>
  <ns0:rect x="97.7778" y="403.5556" width="746.6667" height="48" rx="5.3333" fill="#f0f0f0" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="471.1111" y="428.4444" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="#9e9e9e">6. BitBake built-in defaults</ns0:text>
  <ns0:text x="471.1111" y="444.4444" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="#9e9e9e">B = "${WORKDIR}/build"    STAMP = "${STAMPS_DIR}/..."</ns0:text>
  <ns0:rect x="871.1111" y="39.1111" width="240" height="337.7778" rx="5.3333" fill="#f0f0f0" stroke="#e0e0e0" stroke-width="1.3333" />
  <ns0:text x="991.1111" y="65.7778" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="#212121">Override syntax</ns0:text>
  <ns0:text x="888.8889" y="88.8889" font-family="monospace" font-size="11.5556" fill="#1565c0">VAR_append = " extra"</ns0:text>
  <ns0:text x="888.8889" y="106.6667" font-family="sans-serif" font-size="10.6667" fill="#555555">append to value</ns0:text>
  <ns0:text x="888.8889" y="131.5556" font-family="monospace" font-size="11.5556" fill="#1565c0">VAR_prepend = "first "</ns0:text>
  <ns0:text x="888.8889" y="149.3333" font-family="sans-serif" font-size="10.6667" fill="#555555">prepend to value</ns0:text>
  <ns0:text x="888.8889" y="174.2222" font-family="monospace" font-size="11.5556" fill="#1565c0">VAR_remove = "item"</ns0:text>
  <ns0:text x="888.8889" y="192" font-family="sans-serif" font-size="10.6667" fill="#555555">remove from list</ns0:text>
  <ns0:line x1="888.8889" y1="206.2222" x2="1093.3333" y2="206.2222" stroke="#e0e0e0" stroke-width="0.8889" />
  <ns0:text x="991.1111" y="227.5556" text-anchor="middle" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="#212121">Conditional overrides</ns0:text>
  <ns0:text x="888.8889" y="248.8889" font-family="monospace" font-size="11.5556" fill="#1565c0">VAR_raspberrypi4</ns0:text>
  <ns0:text x="888.8889" y="264.8889" font-family="sans-serif" font-size="10.6667" fill="#555555">applies if MACHINE matches</ns0:text>
  <ns0:text x="888.8889" y="289.7778" font-family="monospace" font-size="11.5556" fill="#1565c0">VAR_class-target</ns0:text>
  <ns0:text x="888.8889" y="305.7778" font-family="sans-serif" font-size="10.6667" fill="#555555">applies for target builds</ns0:text>
  <ns0:text x="888.8889" y="330.6667" font-family="monospace" font-size="11.5556" fill="#1565c0">VAR_df-systemd</ns0:text>
  <ns0:text x="888.8889" y="346.6667" font-family="sans-serif" font-size="10.6667" fill="#555555">distro feature conditional</ns0:text>
  <ns0:rect x="97.7778" y="467.5556" width="746.6667" height="53.3333" rx="5.3333" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="471.1111" y="492.4444" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="#1565c0">Debug variable value:</ns0:text>
  <ns0:text x="471.1111" y="512" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="#212121">bitbake -e core-image-minimal | grep ^MACHINE=</ns0:text>
</ns0:svg>
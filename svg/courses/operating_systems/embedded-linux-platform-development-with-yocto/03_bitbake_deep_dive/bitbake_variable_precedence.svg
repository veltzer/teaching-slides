<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="40" y="57.058823529412" font-family="Arial, sans-serif" font-size="13.863480026003" font-weight="bold" fill="var(--danger-accent)">Highest</text>
  <text x="40" y="574.509803921569" font-family="Arial, sans-serif" font-size="13.863480026003" fill="var(--text-faint)">Lowest</text>
  <line x1="80" y1="45.686274509804" x2="80" y2="597.254901960784" stroke="var(--border)" stroke-width="1.5"/>

  <rect x="100" y="40" width="840" height="68.235294117647" rx="6.39852924277" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="520" y="76.392156862745" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.195587728311" font-weight="bold" fill="var(--danger-text)">1. Command line</text>
  <text x="520" y="99.137254901961" text-anchor="middle" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--danger-text)">MACHINE=rpi4 bitbake ...</text>

  <rect x="100" y="125.294117647059" width="840" height="68.235294117647" rx="6.39852924277" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="520" y="159.411764705882" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.195587728311" font-weight="bold" fill="var(--primary-text)">2. local.conf</text>
  <text x="520" y="184.43137254902" text-anchor="middle" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--primary-text)">MACHINE = "raspberrypi4"</text>

  <rect x="100" y="210.588235294118" width="840" height="68.235294117647" rx="6.39852924277" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="520" y="244.705882352941" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.195587728311" font-weight="bold" fill="var(--text)">3. distro.conf</text>
  <text x="520" y="269.725490196078" text-anchor="middle" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--text-muted)">DISTRO_FEATURES += ...</text>

  <rect x="100" y="295.882352941176" width="840" height="68.235294117647" rx="6.39852924277" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="520" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.195587728311" font-weight="bold" fill="var(--text)">4. machine.conf</text>
  <text x="520" y="355.019607843137" text-anchor="middle" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--text-muted)">KERNEL_IMAGETYPE = ...</text>

  <rect x="100" y="381.176470588235" width="840" height="68.235294117647" rx="6.39852924277" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="520" y="415.294117647059" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.195587728311" font-weight="bold" fill="var(--text)">5. Recipe</text>
  <text x="520" y="440.313725490196" text-anchor="middle" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--text-muted)">SRC_URI / DEPENDS</text>

  <rect x="100" y="466.470588235294" width="840" height="62.549019607843" rx="6.39852924277" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="520" y="500.588235294118" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744647388" fill="var(--text-faint)">6. BitBake defaults</text>

  <rect x="970" y="40" width="270" height="454.901960784314" rx="6.39852924277" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1105" y="74.117647058824" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.996323106926" font-weight="bold" fill="var(--text)">Override Syntax</text>
  <text x="990" y="108.235294117647" font-family="Courier New, monospace" font-size="13.863480026003" fill="var(--primary-accent)">VAR_append</text>
  <text x="990" y="142.352941176471" font-family="Courier New, monospace" font-size="13.863480026003" fill="var(--primary-accent)">VAR_prepend</text>
  <text x="990" y="176.470588235294" font-family="Courier New, monospace" font-size="13.863480026003" fill="var(--primary-accent)">VAR_remove</text>
  <text x="1105" y="221.960784313725" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901566464" font-weight="bold" fill="var(--text)">Conditionals</text>
  <text x="990" y="256.078431372549" font-family="Courier New, monospace" font-size="13.863480026003" fill="var(--primary-accent)">VAR_rpi4</text>
  <text x="990" y="284.509803921569" font-family="Arial, sans-serif" font-size="12.797058485541" fill="var(--text-muted)">matches MACHINE</text>
  <text x="990" y="318.627450980392" font-family="Courier New, monospace" font-size="13.863480026003" fill="var(--primary-accent)">VAR_class-target</text>
  <text x="990" y="347.058823529412" font-family="Arial, sans-serif" font-size="12.797058485541" fill="var(--text-muted)">target builds</text>
  <text x="990" y="381.176470588235" font-family="Courier New, monospace" font-size="13.863480026003" fill="var(--primary-accent)">VAR_df-systemd</text>
  <text x="990" y="409.607843137255" font-family="Arial, sans-serif" font-size="12.797058485541" fill="var(--text-muted)">distro feature</text>

  <rect x="100" y="551.764705882353" width="840" height="68.235294117647" rx="6.39852924277" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="520" y="580.196078431372" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.996323106926" font-weight="bold" fill="var(--primary-text)">Debug value</text>
  <text x="520" y="608.627450980392" text-anchor="middle" font-family="Courier New, monospace" font-size="13.863480026003" fill="var(--primary-text)">bitbake -e image | grep ^VAR=</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="465.4545" y="39.2727" text-anchor="middle" font-size="18.6182" font-weight="bold">Clock Behavior with NTP Adjustment</text>
  <line x1="116.3636" y1="418.9091" x2="814.5455" y2="418.9091" stroke="var(--text)" stroke-width="2" />
  <line x1="116.3636" y1="418.9091" x2="116.3636" y2="104.7273" stroke="var(--text)" stroke-width="2" />
  <text x="58.1818" y="261.8182" font-size="12.8" transform="rotate(-90, 50, 200)">Time Value</text>
  <text x="465.4545" y="458.1818" text-anchor="middle" font-size="12.8">Real Time →</text>
  <path d="M 116.3636 366.5455 L 290.9091 261.8182 L 290.9091 314.1818 L 465.4545 209.4545 L 640 104.7273" stroke="var(--danger-border)" stroke-width="3.4909" fill="none" />
  <text x="349.0909" y="235.6364" fill="var(--danger-accent)" font-size="12.8">CLOCK_REALTIME</text>
  <text x="290.9091" y="340.3636" fill="var(--danger-accent)" font-size="11.6364">← NTP adjustment</text>
  <path d="M 116.3636 366.5455 L 640 104.7273" stroke="var(--ok-border)" stroke-width="3.4909" fill="none" />
  <text x="523.6364" y="183.2727" fill="var(--ok-accent)" font-size="12.8">CLOCK_MONOTONIC</text>
  <text x="174.5455" y="130.9091" font-size="11.6364">10:00:00</text>
  <text x="640" y="130.9091" font-size="11.6364">10:00:05</text>
  <rect x="174.5455" y="471.2727" width="581.8182" height="39.2727" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="465.4545" y="497.4545" text-anchor="middle" font-size="11.6364">REALTIME: Can jump backward/forward (NTP, user changes)</text>
</svg>
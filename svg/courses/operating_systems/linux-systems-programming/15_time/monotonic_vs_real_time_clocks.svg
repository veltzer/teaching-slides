<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
  </defs>
  <text x="686.1537" y="40" text-anchor="middle" font-size="26.016" font-weight="bold">Clock Behavior with NTP Adjustment</text>
  <line x1="132.3077" y1="507.2222" x2="1240" y2="507.2222" stroke="var(--text)" stroke-width="1.1178" />
  <line x1="132.3077" y1="507.2222" x2="132.3077" y2="120.5557" stroke="var(--text)" stroke-width="1.1178" />
  <text x="40" y="313.8892" font-size="17.8859" transform="rotate(-90, 50, 200)">Time Value</text>
  <text x="686.1537" y="555.5557" text-anchor="middle" font-size="17.8859">Real Time →</text>
  <path d="M 132.3077 442.7779 L 409.2307 313.8892 L 409.2307 378.3334 L 686.1537 249.4444 L 963.077 120.5557" stroke="var(--danger-border)" stroke-width="1.9512" fill="none" />
  <text x="501.5384" y="281.6667" fill="var(--danger-accent)" font-size="17.8859">CLOCK_REALTIME</text>
  <text x="409.2307" y="410.5557" fill="var(--danger-accent)" font-size="17.6167">← NTP adjustment</text>
  <path d="M 132.3077 442.7779 L 963.077 120.5557" stroke="var(--ok-border)" stroke-width="1.9512" fill="none" />
  <text x="778.4616" y="217.2222" fill="var(--ok-accent)" font-size="17.8859">CLOCK_MONOTONIC</text>
  <text x="224.6154" y="152.7779" font-size="17.6167">10:00:00</text>
  <text x="963.077" y="152.7779" font-size="17.6167">10:00:05</text>
  <rect x="224.6154" y="571.6667" width="923.077" height="48.3333" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="686.1537" y="603.8889" text-anchor="middle" font-size="17.6167">REALTIME: Can jump backward/forward (NTP, user changes)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="54" text-anchor="middle" font-size="25.6" font-weight="bold">Clock Behavior with NTP Adjustment</text>
  <line x1="160" y1="576" x2="1120" y2="576" stroke="#333" stroke-width="3.2" />
  <line x1="160" y1="576" x2="160" y2="144" stroke="#333" stroke-width="3.2" />
  <text x="80" y="360" font-size="17.6" transform="rotate(-90, 50, 200)">Time Value</text>
  <text x="640" y="630" text-anchor="middle" font-size="17.6">Real Time →</text>
  <path d="M 160 504 L 400 360 L 400 432 L 640 288 L 880 144" stroke="#E74C3C" stroke-width="4.8" fill="none" />
  <text x="480" y="324" fill="#E74C3C" font-size="17.6">CLOCK_REALTIME</text>
  <text x="400" y="468" fill="#E74C3C" font-size="16">← NTP adjustment</text>
  <path d="M 160 504 L 880 144" stroke="#2ECC71" stroke-width="4.8" fill="none" />
  <text x="720" y="252" fill="#2ECC71" font-size="17.6">CLOCK_MONOTONIC</text>
  <text x="240" y="180" font-size="16">10:00:00</text>
  <text x="880" y="180" font-size="16">10:00:05</text>
  <rect x="240" y="648" width="800" height="54" fill="#ECF0F1" stroke="#333" stroke-width="1.6" />
  <text x="640" y="684" text-anchor="middle" font-size="16">REALTIME: Can jump backward/forward (NTP, user changes)</text>
</svg>
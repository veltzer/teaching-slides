<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="670.8641" y="80" text-anchor="middle" font-size="19.7531" font-weight="bold">Clock Behavior with NTP Adjustment</text>
  <line x1="300.4938" y1="482.7778" x2="1041.2346" y2="482.7778" stroke="var(--text)" stroke-width="2" />
  <line x1="300.4938" y1="482.7778" x2="300.4938" y2="149.4445" stroke="var(--text)" stroke-width="2" />
  <text x="238.7654" y="316.1112" font-size="13.5802" transform="rotate(-90, 50, 200)">Time Value</text>
  <text x="670.8641" y="524.4445" text-anchor="middle" font-size="13.5802">Real Time →</text>
  <path d="M 300.4938 427.2223 L 485.679 316.1112 L 485.679 371.6667 L 670.8641 260.5555 L 856.0494 149.4445" stroke="var(--danger-border)" stroke-width="3.4909" fill="none" />
  <text x="547.4074" y="288.3334" fill="var(--danger-accent)" font-size="13.5802">CLOCK_REALTIME</text>
  <text x="485.679" y="399.4445" fill="var(--danger-accent)" font-size="12.3457">← NTP adjustment</text>
  <path d="M 300.4938 427.2223 L 856.0494 149.4445" stroke="var(--ok-border)" stroke-width="3.4909" fill="none" />
  <text x="732.5926" y="232.7778" fill="var(--ok-accent)" font-size="13.5802">CLOCK_MONOTONIC</text>
  <text x="362.2222" y="177.2223" font-size="12.3457">10:00:00</text>
  <text x="856.0494" y="177.2223" font-size="12.3457">10:00:05</text>
  <rect x="362.2222" y="538.3334" width="617.284" height="41.6666" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.3657"/>
  <text x="670.8641" y="566.1111" text-anchor="middle" font-size="12.3457">REALTIME: Can jump backward/forward (NTP, user changes)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <line x1="40" y1="489.032194380835" x2="1240" y2="489.032194380835" stroke="var(--text)" stroke-width="1.1178"/>
  <line x1="40" y1="489.032194380835" x2="40" y2="40" stroke="var(--text)" stroke-width="1.1178"/>
  <text x="40" y="313.8892" font-size="17.8859" transform="rotate(-90, 50, 200)" font-family="Arial, sans-serif" fill="var(--text)">Time Value</text>
  <text x="639.9998" y="545.161436420438" text-anchor="middle" font-size="20.061412242528" font-family="Arial, sans-serif" fill="var(--text)">Real Time →</text>
  <path d="M 40 414.193630801272 L 339.9999 264.516387513082 L 339.9999 339.354834963579 L 639.9998 189.67724328819 L 940.0001 40" stroke="var(--danger-border)" stroke-width="1.9512" fill="none"/>
  <text x="439.9999" y="227.09669927157" fill="var(--danger-accent)" font-size="20.061412242528" font-family="Arial, sans-serif">CLOCK_REALTIME</text>
  <text x="339.9999" y="376.774290946958" fill="var(--danger-accent)" font-size="19.759459765097" font-family="Arial, sans-serif">← NTP adjustment</text>
  <path d="M 40 414.193630801272 L 940.0001 40" stroke="var(--ok-border)" stroke-width="1.9512" fill="none"/>
  <text x="740.0001" y="152.257903433876" fill="var(--ok-accent)" font-size="20.061412242528" font-family="Arial, sans-serif">CLOCK_MONOTONIC</text>
  <text x="140" y="77.419339854314" font-size="19.759459765097" font-family="Arial, sans-serif" fill="var(--text)">10:00:00</text>
  <text x="940.0001" y="77.419339854314" font-size="19.759459765097" font-family="Arial, sans-serif" fill="var(--text)">10:00:05</text>
  <rect x="140" y="563.870990218529" width="1000.0001" height="56.129009781471" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.465791807951"/>
  <text x="639.9998" y="601.290330072843" text-anchor="middle" font-size="19.759459765097" font-family="Arial, sans-serif" fill="var(--text)">REALTIME: Can jump backward/forward (NTP, user changes)</text>
</svg>

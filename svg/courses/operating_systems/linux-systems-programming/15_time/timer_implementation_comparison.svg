<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <text x="640" y="54" text-anchor="middle" font-size="22.4" font-weight="bold">Timer APIs in Linux</text>
  <rect x="80" y="108" width="240" height="144" fill="#E74C3C" stroke="#333" stroke-width="3.2" />
  <text x="200" y="153" text-anchor="middle" fill="white" font-size="17.6">alarm()</text>
  <text x="200" y="189" text-anchor="middle" fill="white" font-size="16">• One timer only</text>
  <text x="200" y="216" text-anchor="middle" fill="white" font-size="16">• Second precision</text>
  <text x="200" y="243" text-anchor="middle" fill="white" font-size="16">• SIGALRM</text>
  <rect x="352" y="108" width="240" height="144" fill="#F39C12" stroke="#333" stroke-width="3.2" />
  <text x="472" y="153" text-anchor="middle" fill="black" font-size="17.6">setitimer()</text>
  <text x="472" y="189" text-anchor="middle" font-size="16">• Three timers</text>
  <text x="472" y="216" text-anchor="middle" font-size="16">• Microsecond</text>
  <text x="472" y="243" text-anchor="middle" font-size="16">• Signals</text>
  <rect x="624" y="108" width="240" height="144" fill="#3498DB" stroke="#333" stroke-width="3.2" />
  <text x="744" y="153" text-anchor="middle" fill="white" font-size="17.6">timer_create()</text>
  <text x="744" y="189" text-anchor="middle" fill="white" font-size="16">• Multiple timers</text>
  <text x="744" y="216" text-anchor="middle" fill="white" font-size="16">• Nanosecond</text>
  <text x="744" y="243" text-anchor="middle" fill="white" font-size="16">• Flexible notify</text>
  <rect x="896" y="108" width="240" height="144" fill="#2ECC71" stroke="#333" stroke-width="3.2" />
  <text x="1016" y="153" text-anchor="middle" fill="white" font-size="17.6">timerfd_create()</text>
  <text x="1016" y="189" text-anchor="middle" fill="white" font-size="16">• File descriptor</text>
  <text x="1016" y="216" text-anchor="middle" fill="white" font-size="16">• epoll/select</text>
  <text x="1016" y="243" text-anchor="middle" fill="white" font-size="16">• Best for async</text>
  <text x="640" y="324" text-anchor="middle" font-size="17.6">Evolution: Simple → Precise → Flexible → Integrated</text>
</svg>
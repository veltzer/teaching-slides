<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="290" height="540" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="185" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-text)">alarm()</text>
  <text x="185" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">SVR4 / classic Unix</text>
  <text x="185" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">• one timer per process</text>
  <text x="185" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">• second precision</text>
  <text x="185" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">• delivers SIGALRM</text>
  <text x="185" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">• no repeat support</text>
  <text x="185" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">• no per-thread timers</text>
  <text x="185" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">• racy with sleep()</text>
  <text x="185" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">good for: one-shot</text>
  <text x="185" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">timeout guard in a</text>
  <text x="185" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">shell script helper</text>
  <text x="185" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--danger-text)">Verdict:</text>
  <text x="185" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">legacy — avoid in</text>
  <text x="185" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">new code</text>

  <rect x="350" y="40" width="290" height="540" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="495" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">setitimer()</text>
  <text x="495" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">BSD 4.2 interval timer</text>
  <text x="495" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">• three timers</text>
  <text x="495" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">• REAL, VIRTUAL, PROF</text>
  <text x="495" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">• microsecond precision</text>
  <text x="495" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">• periodic via reload</text>
  <text x="495" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">• still signal-based</text>
  <text x="495" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">• process-wide only</text>
  <text x="495" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">good for: profilers,</text>
  <text x="495" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">periodic housekeeping</text>
  <text x="495" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">in single-thread apps</text>
  <text x="495" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-text)">Verdict:</text>
  <text x="495" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">ok for simple cases,</text>
  <text x="495" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">limited semantics</text>

  <rect x="660" y="40" width="290" height="540" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="805" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">timer_create()</text>
  <text x="805" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">POSIX.1-2001</text>
  <text x="805" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">• many per-process timers</text>
  <text x="805" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">• nanosecond precision</text>
  <text x="805" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">• signal OR thread notify</text>
  <text x="805" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">• per-CPU/thread clocks</text>
  <text x="805" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">• overrun counter</text>
  <text x="805" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">• -lrt link</text>
  <text x="805" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">good for: callback-style</text>
  <text x="805" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">timers without tying up</text>
  <text x="805" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">your event loop</text>
  <text x="805" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-text)">Verdict:</text>
  <text x="805" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">precise, flexible —</text>
  <text x="805" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">but still signal-heavy</text>

  <rect x="970" y="40" width="270" height="540" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1105" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">timerfd_create()</text>
  <text x="1105" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">Linux 2.6.25+</text>
  <text x="1105" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">• timer as a file</text>
  <text x="1105" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">descriptor</text>
  <text x="1105" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">• readable on expiry</text>
  <text x="1105" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">• polled with epoll</text>
  <text x="1105" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">• no signal handler</text>
  <text x="1105" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">• nanosecond precision</text>
  <text x="1105" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">• absolute or relative</text>
  <text x="1105" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">good for: integrating</text>
  <text x="1105" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">timers with a network</text>
  <text x="1105" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">event loop</text>
  <text x="1105" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-text)">Verdict:</text>
  <text x="1105" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">the modern default</text>
  <text x="1105" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">for async servers</text>

  <line x1="330" y1="310" x2="348" y2="310" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="310" x2="658" y2="310" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="950" y1="310" x2="968" y2="310" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="640" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Evolution: Simple → Precise → Flexible → Integrated</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="676.3636" y="176.5" text-anchor="middle" font-size="25.4621" font-weight="bold">Timer APIs in Linux</text>
  <rect x="40" y="237.9" width="272.7273" height="163.7334" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6.0018"/>
  <text x="176.3636" y="289.0667" text-anchor="middle" fill="var(--bg)" font-size="20.0059">alarm()</text>
  <text x="176.3636" y="330" text-anchor="middle" fill="var(--bg)" font-size="18.1872">• One timer only</text>
  <text x="176.3636" y="360.7001" text-anchor="middle" fill="var(--bg)" font-size="18.1872">• Second precision</text>
  <text x="176.3636" y="391.4" text-anchor="middle" fill="var(--bg)" font-size="18.1872">• SIGALRM</text>
  <rect x="349.0909" y="237.9" width="272.7273" height="163.7334" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6.0018"/>
  <text x="485.4546" y="289.0667" text-anchor="middle" fill="var(--black)" font-size="20.0059">setitimer()</text>
  <text x="485.4546" y="330" text-anchor="middle" font-size="18.1872">• Three timers</text>
  <text x="485.4546" y="360.7001" text-anchor="middle" font-size="18.1872">• Microsecond</text>
  <text x="485.4546" y="391.4" text-anchor="middle" font-size="18.1872">• Signals</text>
  <rect x="658.1818" y="237.9" width="272.7273" height="163.7334" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6.0018"/>
  <text x="794.5454" y="289.0667" text-anchor="middle" fill="var(--bg)" font-size="20.0059">timer_create()</text>
  <text x="794.5454" y="330" text-anchor="middle" fill="var(--bg)" font-size="18.1872">• Multiple timers</text>
  <text x="794.5454" y="360.7001" text-anchor="middle" fill="var(--bg)" font-size="18.1872">• Nanosecond</text>
  <text x="794.5454" y="391.4" text-anchor="middle" fill="var(--bg)" font-size="18.1872">• Flexible notify</text>
  <rect x="967.2727" y="237.9" width="272.7273" height="163.7334" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6.0018"/>
  <text x="1103.6364" y="289.0667" text-anchor="middle" fill="var(--bg)" font-size="20.0059">timerfd_create()</text>
  <text x="1103.6364" y="330" text-anchor="middle" fill="var(--bg)" font-size="18.1872">• File descriptor</text>
  <text x="1103.6364" y="360.7001" text-anchor="middle" fill="var(--bg)" font-size="18.1872">• epoll/select</text>
  <text x="1103.6364" y="391.4" text-anchor="middle" fill="var(--bg)" font-size="18.1872">• Best for async</text>
  <text x="676.3636" y="483.5" text-anchor="middle" font-size="20.0059">Evolution: Simple → Precise → Flexible → Integrated</text>
</svg>
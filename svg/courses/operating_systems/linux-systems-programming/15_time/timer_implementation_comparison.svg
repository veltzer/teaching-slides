<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="290" height="552.897196261682" rx="10.412070637163" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="83.364485981309" text-anchor="middle" font-family="Courier New, monospace" font-size="22.906555401759" font-weight="bold" fill="var(--danger-text)">alarm()</text>
  <text x="185" y="110.467289719627" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.535691828312" fill="var(--danger-text)">SVR4 Unix</text>
  <text x="185" y="170.093457943925" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--danger-text)">One timer</text>
  <text x="185" y="202.616822429907" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--danger-text)">Second precision</text>
  <text x="185" y="235.140186915888" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--danger-text)">Sends SIGALRM</text>
  <text x="185" y="267.663551401869" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--danger-text)">No repeat</text>
  <text x="185" y="300.186915887851" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--danger-text)">Process-wide</text>
  <text x="185" y="403.177570093458" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" font-weight="bold" fill="var(--danger-text)">Verdict</text>
  <text x="185" y="435.70093457944" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.535691828312" fill="var(--danger-text)">Legacy</text>

  <rect x="345" y="40" width="290" height="552.897196261682" rx="10.412070637163" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="83.364485981309" text-anchor="middle" font-family="Courier New, monospace" font-size="22.906555401759" font-weight="bold" fill="var(--warn-text)">setitimer()</text>
  <text x="490" y="110.467289719627" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.535691828312" fill="var(--warn-text)">BSD 4.2</text>
  <text x="490" y="170.093457943925" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--warn-text)">Three timers</text>
  <text x="490" y="202.616822429907" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--warn-text)">REAL, VIRTUAL, PROF</text>
  <text x="490" y="235.140186915888" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--warn-text)">Microsecond</text>
  <text x="490" y="267.663551401869" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--warn-text)">Periodic reload</text>
  <text x="490" y="300.186915887851" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--warn-text)">Still signals</text>
  <text x="490" y="403.177570093458" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" font-weight="bold" fill="var(--warn-text)">Verdict</text>
  <text x="490" y="435.70093457944" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.535691828312" fill="var(--warn-text)">Simple use only</text>

  <rect x="650" y="40" width="290" height="552.897196261682" rx="10.412070637163" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="795" y="83.364485981309" text-anchor="middle" font-family="Courier New, monospace" font-size="22.906555401759" font-weight="bold" fill="var(--primary-text)">timer_create()</text>
  <text x="795" y="110.467289719627" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.535691828312" fill="var(--primary-text)">POSIX</text>
  <text x="795" y="170.093457943925" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--primary-text)">Many timers</text>
  <text x="795" y="202.616822429907" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--primary-text)">Nanosecond</text>
  <text x="795" y="235.140186915888" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--primary-text)">Signal or thread</text>
  <text x="795" y="267.663551401869" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--primary-text)">Per-thread clocks</text>
  <text x="795" y="300.186915887851" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--primary-text)">Overrun counter</text>
  <text x="795" y="403.177570093458" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" font-weight="bold" fill="var(--primary-text)">Verdict</text>
  <text x="795" y="435.70093457944" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.535691828312" fill="var(--primary-text)">Flexible callbacks</text>

  <rect x="955" y="40" width="285" height="552.897196261682" rx="10.412070637163" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097" y="83.364485981309" text-anchor="middle" font-family="Courier New, monospace" font-size="20.824141274326" font-weight="bold" fill="var(--ok-text)">timerfd_create()</text>
  <text x="1097" y="110.467289719627" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.535691828312" fill="var(--ok-text)">Linux 2.6.25+</text>
  <text x="1097" y="170.093457943925" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--ok-text)">Timer as FD</text>
  <text x="1097" y="202.616822429907" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--ok-text)">Read on expiry</text>
  <text x="1097" y="235.140186915888" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--ok-text)">Works with epoll</text>
  <text x="1097" y="267.663551401869" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--ok-text)">No signals</text>
  <text x="1097" y="300.186915887851" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--ok-text)">Nanosecond</text>
  <text x="1097" y="403.177570093458" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" font-weight="bold" fill="var(--ok-text)">Verdict</text>
  <text x="1097" y="435.70093457944" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.535691828312" fill="var(--ok-text)">Modern default</text>

  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.618105955744" font-weight="bold" fill="var(--text)">Simple to Integrated</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="673.9394" y="186.8182" text-anchor="middle" font-size="23.7576" font-weight="bold">Timer APIs in Linux</text>
  <rect x="80" y="244.0909" width="254.5455" height="152.7273" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6"/>
  <text x="207.2727" y="291.8182" text-anchor="middle" fill="var(--bg)" font-size="18.6667">alarm()</text>
  <text x="207.2727" y="330" text-anchor="middle" fill="var(--bg)" font-size="16.9697">• One timer only</text>
  <text x="207.2727" y="358.6364" text-anchor="middle" fill="var(--bg)" font-size="16.9697">• Second precision</text>
  <text x="207.2727" y="387.2727" text-anchor="middle" fill="var(--bg)" font-size="16.9697">• SIGALRM</text>
  <rect x="368.4848" y="244.0909" width="254.5455" height="152.7273" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6"/>
  <text x="495.7576" y="291.8182" text-anchor="middle" fill="var(--black)" font-size="18.6667">setitimer()</text>
  <text x="495.7576" y="330" text-anchor="middle" font-size="16.9697">• Three timers</text>
  <text x="495.7576" y="358.6364" text-anchor="middle" font-size="16.9697">• Microsecond</text>
  <text x="495.7576" y="387.2727" text-anchor="middle" font-size="16.9697">• Signals</text>
  <rect x="656.9697" y="244.0909" width="254.5455" height="152.7273" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="784.2424" y="291.8182" text-anchor="middle" fill="var(--bg)" font-size="18.6667">timer_create()</text>
  <text x="784.2424" y="330" text-anchor="middle" fill="var(--bg)" font-size="16.9697">• Multiple timers</text>
  <text x="784.2424" y="358.6364" text-anchor="middle" fill="var(--bg)" font-size="16.9697">• Nanosecond</text>
  <text x="784.2424" y="387.2727" text-anchor="middle" fill="var(--bg)" font-size="16.9697">• Flexible notify</text>
  <rect x="945.4545" y="244.0909" width="254.5455" height="152.7273" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="1072.7273" y="291.8182" text-anchor="middle" fill="var(--bg)" font-size="18.6667">timerfd_create()</text>
  <text x="1072.7273" y="330" text-anchor="middle" fill="var(--bg)" font-size="16.9697">• File descriptor</text>
  <text x="1072.7273" y="358.6364" text-anchor="middle" fill="var(--bg)" font-size="16.9697">• epoll/select</text>
  <text x="1072.7273" y="387.2727" text-anchor="middle" fill="var(--bg)" font-size="16.9697">• Best for async</text>
  <text x="673.9394" y="473.1818" text-anchor="middle" font-size="18.6667">Evolution: Simple → Precise → Flexible → Integrated</text>
</svg>
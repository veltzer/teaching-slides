<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="54" text-anchor="middle" font-size="22.4" font-weight="bold">Timer APIs in Linux</text>
  <rect x="80" y="108" width="240" height="144" fill="#E74C3C" stroke="#333" stroke-width="3.2" />
  <text x="200" y="153" text-anchor="middle" fill="white" font-size="17.6">alarm()</text>
  <text x="200" y="189" text-anchor="middle" fill="white" font-size="16">• One timer only</text>
  <text x="200" y="216" text-anchor="middle" fill="white" font-size="16">• Second precision</text>
  <text x="200" y="243" text-anchor="middle" fill="white" font-size="16">• SIGALRM</text>
  <rect x="352" y="108" width="240" height="144" fill="#F39C12" stroke="#333" stroke-width="3.2" />
  <text x="472" y="153" text-anchor="middle" fill="black" font-size="17.6">setitimer()</text>
  <text x="472" y="189" text-anchor="middle" font-size="16">• Three timers</text>
  <text x="472" y="216" text-anchor="middle" font-size="16">• Microsecond</text>
  <text x="472" y="243" text-anchor="middle" font-size="16">• Signals</text>
  <rect x="624" y="108" width="240" height="144" fill="#3498DB" stroke="#333" stroke-width="3.2" />
  <text x="744" y="153" text-anchor="middle" fill="white" font-size="17.6">timer_create()</text>
  <text x="744" y="189" text-anchor="middle" fill="white" font-size="16">• Multiple timers</text>
  <text x="744" y="216" text-anchor="middle" fill="white" font-size="16">• Nanosecond</text>
  <text x="744" y="243" text-anchor="middle" fill="white" font-size="16">• Flexible notify</text>
  <rect x="896" y="108" width="240" height="144" fill="#2ECC71" stroke="#333" stroke-width="3.2" />
  <text x="1016" y="153" text-anchor="middle" fill="white" font-size="17.6">timerfd_create()</text>
  <text x="1016" y="189" text-anchor="middle" fill="white" font-size="16">• File descriptor</text>
  <text x="1016" y="216" text-anchor="middle" fill="white" font-size="16">• epoll/select</text>
  <text x="1016" y="243" text-anchor="middle" fill="white" font-size="16">• Best for async</text>
  <text x="640" y="324" text-anchor="middle" font-size="17.6">Evolution: Simple → Precise → Flexible → Integrated</text>
</svg>
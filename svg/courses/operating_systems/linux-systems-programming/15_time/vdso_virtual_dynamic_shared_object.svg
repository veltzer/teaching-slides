<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="686.1538" y="40" text-anchor="middle" font-size="29.4994" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Getting Time: System Call vs vDSO</text>
  <rect x="40" y="102.1429" width="553.8462" height="310.7143" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="316.9231" y="153.9286" text-anchor="middle" fill="var(--bg)" font-size="22.1245" font-family="Arial, sans-serif">Traditional System Call</text>
  <rect x="76.9231" y="185" width="480" height="62.1429" fill="var(--danger-accent)" rx="6"/>
  <text x="316.9231" y="226.4286" text-anchor="middle" fill="var(--bg)" font-size="18.4371" font-family="Arial, sans-serif">1. User space calls clock_gettime()</text>
  <rect x="76.9231" y="257.5" width="480" height="62.1429" fill="var(--danger-accent)" rx="6"/>
  <text x="316.9231" y="298.9286" text-anchor="middle" fill="var(--bg)" font-size="18.4371" font-family="Arial, sans-serif">2. Context switch to kernel</text>
  <rect x="76.9231" y="330" width="480" height="62.1429" fill="var(--danger-accent)" rx="6"/>
  <text x="316.9231" y="371.4286" text-anchor="middle" fill="var(--bg)" font-size="18.4371" font-family="Arial, sans-serif">3. Kernel reads time, returns</text>
  <rect x="686.1538" y="102.1429" width="553.8462" height="310.7143" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="963.0769" y="153.9286" text-anchor="middle" fill="var(--bg)" font-size="22.1245" font-family="Arial, sans-serif">vDSO Optimization</text>
  <rect x="723.0769" y="185" width="480" height="62.1429" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="963.0769" y="226.4286" text-anchor="middle" fill="var(--bg)" font-size="18.4371" font-family="Arial, sans-serif">1. Kernel maps time page to user</text>
  <rect x="723.0769" y="257.5" width="480" height="62.1429" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="963.0769" y="298.9286" text-anchor="middle" fill="var(--bg)" font-size="18.4371" font-family="Arial, sans-serif">2. User reads directly from memory</text>
  <rect x="723.0769" y="330" width="480" height="62.1429" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="963.0769" y="371.4286" text-anchor="middle" fill="var(--bg)" font-size="18.4371" font-family="Arial, sans-serif">3. No context switch!</text>
  <text x="316.9231" y="475" text-anchor="middle" font-size="20.2808" font-family="Arial, sans-serif" fill="var(--text)">Cost: ~200-300 ns</text>
  <text x="963.0769" y="475" text-anchor="middle" font-size="20.2808" font-family="Arial, sans-serif" fill="var(--text)">Cost: ~20-30 ns</text>
  <text x="686.1538" y="578.5714" text-anchor="middle" font-size="20.2808" font-family="Arial, sans-serif" fill="var(--text)">Check vDSO: ldd /bin/ls | grep vdso</text>
  <text x="686.1538" y="620" text-anchor="middle" font-size="20.2808" font-family="Arial, sans-serif" fill="var(--text)">Functions: clock_gettime(), gettimeofday(), time(), getcpu()</text>
</svg>
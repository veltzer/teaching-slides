<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="54" text-anchor="middle" font-size="25.6" font-weight="bold">Getting Time: System Call vs vDSO</text>
  <rect x="80" y="108" width="480" height="270" fill="#E74C3C" stroke="#333" stroke-width="3.2" />
  <text x="320" y="153" text-anchor="middle" fill="white" font-size="19.2">Traditional System Call</text>
  <rect x="112" y="180" width="416" height="54" fill="#C0392B" />
  <text x="320" y="216" text-anchor="middle" fill="white" font-size="16">1. User space calls clock_gettime()</text>
  <rect x="112" y="243" width="416" height="54" fill="#C0392B" />
  <text x="320" y="279" text-anchor="middle" fill="white" font-size="16">2. Context switch to kernel</text>
  <rect x="112" y="306" width="416" height="54" fill="#C0392B" />
  <text x="320" y="342" text-anchor="middle" fill="white" font-size="16">3. Kernel reads time, returns</text>
  <rect x="640" y="108" width="480" height="270" fill="#2ECC71" stroke="#333" stroke-width="3.2" />
  <text x="880" y="153" text-anchor="middle" fill="white" font-size="19.2">vDSO Optimization</text>
  <rect x="672" y="180" width="416" height="54" fill="#27AE60" />
  <text x="880" y="216" text-anchor="middle" fill="white" font-size="16">1. Kernel maps time page to user</text>
  <rect x="672" y="243" width="416" height="54" fill="#27AE60" />
  <text x="880" y="279" text-anchor="middle" fill="white" font-size="16">2. User reads directly from memory</text>
  <rect x="672" y="306" width="416" height="54" fill="#27AE60" />
  <text x="880" y="342" text-anchor="middle" fill="white" font-size="16">3. No context switch!</text>
  <text x="320" y="432" text-anchor="middle" font-size="17.6">Cost: ~200-300 ns</text>
  <text x="880" y="432" text-anchor="middle" font-size="17.6">Cost: ~20-30 ns</text>
  <text x="640" y="522" text-anchor="middle" font-size="17.6">Check vDSO: ldd /bin/ls | grep vdso</text>
  <text x="640" y="558" text-anchor="middle" font-size="17.6">Functions: clock_gettime(), gettimeofday(), time(), getcpu()</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <text x="640" y="54" text-anchor="middle" font-size="25.6" font-weight="bold">Getting Time: System Call vs vDSO</text>
  <rect x="80" y="108" width="480" height="270" fill="#E74C3C" stroke="#333" stroke-width="3.2" />
  <text x="320" y="153" text-anchor="middle" fill="white" font-size="19.2">Traditional System Call</text>
  <rect x="112" y="180" width="416" height="54" fill="#c62828" />
  <text x="320" y="216" text-anchor="middle" fill="white" font-size="16">1. User space calls clock_gettime()</text>
  <rect x="112" y="243" width="416" height="54" fill="#c62828" />
  <text x="320" y="279" text-anchor="middle" fill="white" font-size="16">2. Context switch to kernel</text>
  <rect x="112" y="306" width="416" height="54" fill="#c62828" />
  <text x="320" y="342" text-anchor="middle" fill="white" font-size="16">3. Kernel reads time, returns</text>
  <rect x="640" y="108" width="480" height="270" fill="#2ECC71" stroke="#333" stroke-width="3.2" />
  <text x="880" y="153" text-anchor="middle" fill="white" font-size="19.2">vDSO Optimization</text>
  <rect x="672" y="180" width="416" height="54" fill="#27AE60" />
  <text x="880" y="216" text-anchor="middle" fill="white" font-size="16">1. Kernel maps time page to user</text>
  <rect x="672" y="243" width="416" height="54" fill="#27AE60" />
  <text x="880" y="279" text-anchor="middle" fill="white" font-size="16">2. User reads directly from memory</text>
  <rect x="672" y="306" width="416" height="54" fill="#27AE60" />
  <text x="880" y="342" text-anchor="middle" fill="white" font-size="16">3. No context switch!</text>
  <text x="320" y="432" text-anchor="middle" font-size="17.6">Cost: ~200-300 ns</text>
  <text x="880" y="432" text-anchor="middle" font-size="17.6">Cost: ~20-30 ns</text>
  <text x="640" y="522" text-anchor="middle" font-size="17.6">Check vDSO: ldd /bin/ls | grep vdso</text>
  <text x="640" y="558" text-anchor="middle" font-size="17.6">Functions: clock_gettime(), gettimeofday(), time(), getcpu()</text>
</svg>
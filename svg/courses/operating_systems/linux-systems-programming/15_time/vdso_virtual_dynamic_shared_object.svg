<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="686.1538" y="40" text-anchor="middle" font-size="29.4994" font-weight="bold">Getting Time: System Call vs vDSO</text>
  <rect x="40" y="102.1429" width="553.8462" height="310.7143" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="316.9231" y="153.9286" text-anchor="middle" fill="var(--bg)" font-size="22.1245">Traditional System Call</text>
  <rect x="76.9231" y="185" width="480" height="62.1429" fill="var(--danger-accent)" rx="6"/>
  <text x="316.9231" y="226.4286" text-anchor="middle" fill="var(--bg)" font-size="18.4371">1. User space calls clock_gettime()</text>
  <rect x="76.9231" y="257.5" width="480" height="62.1429" fill="var(--danger-accent)" rx="6"/>
  <text x="316.9231" y="298.9286" text-anchor="middle" fill="var(--bg)" font-size="18.4371">2. Context switch to kernel</text>
  <rect x="76.9231" y="330" width="480" height="62.1429" fill="var(--danger-accent)" rx="6"/>
  <text x="316.9231" y="371.4286" text-anchor="middle" fill="var(--bg)" font-size="18.4371">3. Kernel reads time, returns</text>
  <rect x="686.1538" y="102.1429" width="553.8462" height="310.7143" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="963.0769" y="153.9286" text-anchor="middle" fill="var(--bg)" font-size="22.1245">vDSO Optimization</text>
  <rect x="723.0769" y="185" width="480" height="62.1429" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="963.0769" y="226.4286" text-anchor="middle" fill="var(--bg)" font-size="18.4371">1. Kernel maps time page to user</text>
  <rect x="723.0769" y="257.5" width="480" height="62.1429" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="963.0769" y="298.9286" text-anchor="middle" fill="var(--bg)" font-size="18.4371">2. User reads directly from memory</text>
  <rect x="723.0769" y="330" width="480" height="62.1429" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="963.0769" y="371.4286" text-anchor="middle" fill="var(--bg)" font-size="18.4371">3. No context switch!</text>
  <text x="316.9231" y="475" text-anchor="middle" font-size="20.2808">Cost: ~200-300 ns</text>
  <text x="963.0769" y="475" text-anchor="middle" font-size="20.2808">Cost: ~20-30 ns</text>
  <text x="686.1538" y="578.5714" text-anchor="middle" font-size="20.2808">Check vDSO: ldd /bin/ls | grep vdso</text>
  <text x="686.1538" y="620" text-anchor="middle" font-size="20.2808">Functions: clock_gettime(), gettimeofday(), time(), getcpu()</text>
</svg>
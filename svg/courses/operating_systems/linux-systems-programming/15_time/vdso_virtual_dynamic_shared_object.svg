<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="553.8462" height="348.000044800004" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.349803409306"/>
  <text x="316.9231" y="97.999988799999" text-anchor="middle" fill="var(--bg)" font-size="23.41437092153" font-family="Arial, sans-serif">Traditional System Call</text>
  <rect x="76.9231" y="132.799959679997" width="480" height="69.600053760004" fill="var(--danger-accent)" rx="6.349803409306"/>
  <text x="316.9231" y="179.19999552" text-anchor="middle" fill="var(--bg)" font-size="19.511993406284" font-family="Arial, sans-serif">1. User space calls clock_gettime()</text>
  <rect x="76.9231" y="213.999966399997" width="480" height="69.600053760004" fill="var(--danger-accent)" rx="6.349803409306"/>
  <text x="316.9231" y="260.40000224" text-anchor="middle" fill="var(--bg)" font-size="19.511993406284" font-family="Arial, sans-serif">2. Context switch to kernel</text>
  <rect x="76.9231" y="295.199973119998" width="480" height="69.600053760004" fill="var(--danger-accent)" rx="6.349803409306"/>
  <text x="316.9231" y="341.600008960001" text-anchor="middle" fill="var(--bg)" font-size="19.511993406284" font-family="Arial, sans-serif">3. Kernel reads time, returns</text>
  <rect x="686.1538" y="40" width="553.8462" height="348.000044800004" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.349803409306"/>
  <text x="963.0769" y="97.999988799999" text-anchor="middle" fill="var(--bg)" font-size="23.41437092153" font-family="Arial, sans-serif">vDSO Optimization</text>
  <rect x="723.0769" y="132.799959679997" width="480" height="69.600053760004" fill="url(#grad-ok)" rx="6.349803409306" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="963.0769" y="179.19999552" text-anchor="middle" fill="var(--bg)" font-size="19.511993406284" font-family="Arial, sans-serif">1. Kernel maps time page to user</text>
  <rect x="723.0769" y="213.999966399997" width="480" height="69.600053760004" fill="url(#grad-ok)" rx="6.349803409306" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="963.0769" y="260.40000224" text-anchor="middle" fill="var(--bg)" font-size="19.511993406284" font-family="Arial, sans-serif">2. User reads directly from memory</text>
  <rect x="723.0769" y="295.199973119998" width="480" height="69.600053760004" fill="url(#grad-ok)" rx="6.349803409306" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="963.0769" y="341.600008960001" text-anchor="middle" fill="var(--bg)" font-size="19.511993406284" font-family="Arial, sans-serif">3. No context switch!</text>
  <text x="316.9231" y="457.599986559999" text-anchor="middle" font-size="21.463182163907" font-family="Arial, sans-serif" fill="var(--text)">Cost: ~200-300 ns</text>
  <text x="963.0769" y="457.599986559999" text-anchor="middle" font-size="21.463182163907" font-family="Arial, sans-serif" fill="var(--text)">Cost: ~20-30 ns</text>
  <text x="686.1538" y="573.599964159997" text-anchor="middle" font-size="21.463182163907" font-family="Arial, sans-serif" fill="var(--text)">Check vDSO: ldd /bin/ls | grep vdso</text>
  <text x="686.1538" y="620" text-anchor="middle" font-size="21.463182163907" font-family="Arial, sans-serif" fill="var(--text)">Functions: clock_gettime(), gettimeofday(), time(), getcpu()</text>
</svg>

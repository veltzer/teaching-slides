<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <!-- palette: resources/palette_diagram.yaml -->

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="31.091264" font-weight="bold" fill="var(--text)">Edge vs Level Triggered</text>

  <rect x="40" y="93.703704" width="1200" height="247.037037" rx="6.218253" fill="var(--surface)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="40" y="93.703704" width="300" height="247.037037" rx="6.218253" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="179.62963" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.018513" font-weight="bold" fill="var(--primary-text)">Level</text>
  <text x="190" y="222.592593" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758" fill="var(--primary-text)">Triggered</text>
  <text x="190" y="276.296296" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--primary-text)">default mode</text>

  <text x="370" y="142.037037" font-family="Arial, sans-serif" font-size="17.618383" font-weight="bold" fill="var(--text)">Data available → notify repeatedly</text>
  <text x="370" y="185" font-family="Arial, sans-serif" font-size="15.545632" fill="var(--text-muted)">Keeps firing as long as the fd is readable.</text>
  <text x="370" y="217.222222" font-family="Arial, sans-serif" font-size="15.545632" fill="var(--text-muted)">Safe with blocking reads and partial drains.</text>
  <text x="370" y="260.185185" font-family="Arial, sans-serif" font-size="15.545632" font-weight="bold" fill="var(--text)">Good for: select, poll, straightforward code</text>
  <text x="370" y="297.777778" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--text-muted)">Cost: may wake you many times per event.</text>

  <rect x="40" y="372.962963" width="1200" height="247.037037" rx="6.218253" fill="var(--surface)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="40" y="372.962963" width="300" height="247.037037" rx="6.218253" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="458.888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.018513" font-weight="bold" fill="var(--ok-text)">Edge</text>
  <text x="190" y="501.851852" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758" fill="var(--ok-text)">Triggered</text>
  <text x="190" y="555.555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--ok-text)">EPOLLET</text>

  <text x="370" y="421.296296" font-family="Arial, sans-serif" font-size="17.618383" font-weight="bold" fill="var(--text)">State change → notify once</text>
  <text x="370" y="464.259259" font-family="Arial, sans-serif" font-size="15.545632" fill="var(--text-muted)">Fires on the transition to ready, then silent.</text>
  <text x="370" y="496.481481" font-family="Arial, sans-serif" font-size="15.545632" fill="var(--text-muted)">Must drain fully with nonblocking I/O.</text>
  <text x="370" y="539.444444" font-family="Arial, sans-serif" font-size="15.545632" font-weight="bold" fill="var(--text)">Good for: epoll at scale, low syscall overhead</text>
  <text x="370" y="577.037037" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--text-muted)">Cost: forget a read loop and events are lost.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="1200" height="272.244898071637" rx="6.527805833922" fill="var(--surface)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="40" y="40" width="300" height="272.244898071637" rx="6.527805833922" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="134.693877685964" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.463092841855" font-weight="bold" fill="var(--primary-text)">Level</text>
  <text x="190" y="182.040816528946" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.583416451985" fill="var(--primary-text)">Triggered</text>
  <text x="190" y="241.224489256143" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231545896037" fill="var(--primary-text)">default mode</text>

  <text x="370" y="93.26530578509" font-family="Arial, sans-serif" font-size="18.495449337889" font-weight="bold" fill="var(--text)">Data available → notify repeatedly</text>
  <text x="370" y="140.612244628072" font-family="Arial, sans-serif" font-size="16.319514059915" fill="var(--text-muted)">Keeps firing as long as the fd is readable.</text>
  <text x="370" y="176.122448484798" font-family="Arial, sans-serif" font-size="16.319514059915" fill="var(--text-muted)">Safe with blocking reads and partial drains.</text>
  <text x="370" y="223.46938732778" font-family="Arial, sans-serif" font-size="16.319514059915" font-weight="bold" fill="var(--text)">Good for: select, poll, straightforward code</text>
  <text x="370" y="264.897959228655" font-family="Arial, sans-serif" font-size="15.231545896037" fill="var(--text-muted)">Cost: may wake you many times per event.</text>

  <rect x="40" y="347.755101928363" width="1200" height="272.244898071637" rx="6.527805833922" fill="var(--surface)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="40" y="347.755101928363" width="300" height="272.244898071637" rx="6.527805833922" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="442.448979614327" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.463092841855" font-weight="bold" fill="var(--ok-text)">Edge</text>
  <text x="190" y="489.795918457309" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.583416451985" fill="var(--ok-text)">Triggered</text>
  <text x="190" y="548.979592286547" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231545896037" fill="var(--ok-text)">EPOLLET</text>

  <text x="370" y="401.020407713453" font-family="Arial, sans-serif" font-size="18.495449337889" font-weight="bold" fill="var(--text)">State change → notify once</text>
  <text x="370" y="448.367346556435" font-family="Arial, sans-serif" font-size="16.319514059915" fill="var(--text-muted)">Fires on the transition to ready, then silent.</text>
  <text x="370" y="483.877550413161" font-family="Arial, sans-serif" font-size="16.319514059915" fill="var(--text-muted)">Must drain fully with nonblocking I/O.</text>
  <text x="370" y="531.224489256143" font-family="Arial, sans-serif" font-size="16.319514059915" font-weight="bold" fill="var(--text)">Good for: epoll at scale, low syscall overhead</text>
  <text x="370" y="572.653061157018" font-family="Arial, sans-serif" font-size="15.231545896037" fill="var(--text-muted)">Cost: forget a read loop and events are lost.</text>
</svg>

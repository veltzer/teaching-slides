<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="380" height="518.297872532368" rx="6.66524772076" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="107.872341229289" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.660991944952" font-weight="bold" fill="var(--bg)">Few connections</text>
  <text x="230" y="157.234043428927" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.773994629968" fill="var(--bg)">up to ~100</text>
  <rect x="70" y="200.425531866908" width="320" height="86.382979131281" rx="6.66524772076" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="230" y="255.957446700543" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.439243412641" font-weight="bold" fill="var(--text)">Blocking I/O</text>
  <text x="230" y="348.510638465822" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.663119832856" fill="var(--bg)">simplest code</text>
  <text x="230" y="385.531915397465" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.663119832856" fill="var(--bg)">one thread per fd</text>
  <text x="230" y="422.553191201449" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.663119832856" fill="var(--bg)">no syscall overhead</text>
  <text x="230" y="459.574468133092" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.663119832856" fill="var(--bg)">limits at thread cost</text>
  <text x="230" y="521.276595600724" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.441371300545" fill="var(--bg)">ssh, small daemons</text>

  <rect x="450" y="40" width="380" height="518.297872532368" rx="6.66524772076" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="107.872341229289" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.660991944952" font-weight="bold" fill="var(--bg)">Moderate load</text>
  <text x="640" y="157.234043428927" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.773994629968" fill="var(--bg)">hundreds of fds</text>
  <rect x="480" y="200.425531866908" width="320" height="86.382979131281" rx="6.66524772076" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="255.957446700543" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.439243412641" font-weight="bold" fill="var(--text)">select / poll</text>
  <text x="640" y="348.510638465822" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.663119832856" fill="var(--bg)">portable everywhere</text>
  <text x="640" y="385.531915397465" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.663119832856" fill="var(--bg)">O(n) scan per call</text>
  <text x="640" y="422.553191201449" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.663119832856" fill="var(--bg)">level-triggered</text>
  <text x="640" y="459.574468133092" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.663119832856" fill="var(--bg)">legacy-compatible</text>
  <text x="640" y="521.276595600724" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.441371300545" fill="var(--bg)">cross-platform tools</text>

  <rect x="860" y="40" width="380" height="518.297872532368" rx="6.66524772076" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="107.872341229289" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.660991944952" font-weight="bold" fill="var(--bg)">High performance</text>
  <text x="1050" y="157.234043428927" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.773994629968" fill="var(--bg)">10k+ connections</text>
  <rect x="890" y="200.425531866908" width="320" height="86.382979131281" rx="6.66524772076" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1050" y="255.957446700543" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.439243412641" font-weight="bold" fill="var(--text)">epoll / io_uring</text>
  <text x="1050" y="348.510638465822" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.663119832856" fill="var(--bg)">O(1) ready set</text>
  <text x="1050" y="385.531915397465" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.663119832856" fill="var(--bg)">edge-triggered mode</text>
  <text x="1050" y="422.553191201449" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.663119832856" fill="var(--bg)">io_uring: zero syscalls</text>
  <text x="1050" y="459.574468133092" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.663119832856" fill="var(--bg)">Linux-specific</text>
  <text x="1050" y="521.276595600724" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.441371300545" fill="var(--bg)">nginx, Redis, databases</text>

  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.773994629968" fill="var(--text-muted)">Start simple. Move right only when measurements justify it.</text>
</svg>

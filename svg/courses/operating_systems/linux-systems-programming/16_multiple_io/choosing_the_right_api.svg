<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <!-- palette: resources/palette_diagram.yaml -->

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="31.383207" font-weight="bold" fill="var(--text)">Choosing the Right I/O API</text>

  <rect x="40" y="105.660377" width="380" height="459.622642" rx="6.276641" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="230" y="165.849057" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.106565" font-weight="bold" fill="var(--bg)">Few connections</text>
  <text x="230" y="209.622642" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.73771" fill="var(--bg)">up to ~100</text>
  <rect x="70" y="247.924528" width="320" height="76.603774" rx="6.276641" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="230" y="297.169811" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.014352" font-weight="bold" fill="var(--text)">Blocking I/O</text>
  <text x="230" y="379.245283" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.691603" fill="var(--bg)">simplest code</text>
  <text x="230" y="412.075472" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.691603" fill="var(--bg)">one thread per fd</text>
  <text x="230" y="444.90566" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.691603" fill="var(--bg)">no syscall overhead</text>
  <text x="230" y="477.735849" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.691603" fill="var(--bg)">limits at thread cost</text>
  <text x="230" y="532.45283" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.59939" fill="var(--bg)">ssh, small daemons</text>

  <rect x="450" y="105.660377" width="380" height="459.622642" rx="6.276641" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="165.849057" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.106565" font-weight="bold" fill="var(--bg)">Moderate load</text>
  <text x="640" y="209.622642" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.73771" fill="var(--bg)">hundreds of fds</text>
  <rect x="480" y="247.924528" width="320" height="76.603774" rx="6.276641" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="297.169811" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.014352" font-weight="bold" fill="var(--text)">select / poll</text>
  <text x="640" y="379.245283" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.691603" fill="var(--bg)">portable everywhere</text>
  <text x="640" y="412.075472" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.691603" fill="var(--bg)">O(n) scan per call</text>
  <text x="640" y="444.90566" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.691603" fill="var(--bg)">level-triggered</text>
  <text x="640" y="477.735849" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.691603" fill="var(--bg)">legacy-compatible</text>
  <text x="640" y="532.45283" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.59939" fill="var(--bg)">cross-platform tools</text>

  <rect x="860" y="105.660377" width="380" height="459.622642" rx="6.276641" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1050" y="165.849057" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.106565" font-weight="bold" fill="var(--bg)">High performance</text>
  <text x="1050" y="209.622642" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.73771" fill="var(--bg)">10k+ connections</text>
  <rect x="890" y="247.924528" width="320" height="76.603774" rx="6.276641" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1050" y="297.169811" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.014352" font-weight="bold" fill="var(--text)">epoll / io_uring</text>
  <text x="1050" y="379.245283" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.691603" fill="var(--bg)">O(1) ready set</text>
  <text x="1050" y="412.075472" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.691603" fill="var(--bg)">edge-triggered mode</text>
  <text x="1050" y="444.90566" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.691603" fill="var(--bg)">io_uring: zero syscalls</text>
  <text x="1050" y="477.735849" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.691603" fill="var(--bg)">Linux-specific</text>
  <text x="1050" y="532.45283" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.59939" fill="var(--bg)">nginx, Redis, databases</text>

  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.73771" fill="var(--text-muted)">Start simple. Move right only when measurements justify it.</text>
</svg>

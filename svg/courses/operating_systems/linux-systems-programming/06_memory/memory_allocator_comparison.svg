<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <line x1="132.3077" y1="504.000093333325" x2="1240" y2="504.000093333325" stroke="var(--text)" stroke-width="2"/>
  <line x1="132.3077" y1="504.000093333325" x2="132.3077" y2="40" stroke="var(--text)" stroke-width="2"/>
  <rect x="224.6154" y="272.000046666663" width="110.7693" height="232.000046666663" fill="url(#grad-primary)" rx="6.480740419066" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="280" y="542.666689999998" text-anchor="middle" font-size="17.811991004781" font-family="Arial, sans-serif" fill="var(--text)">ptmalloc</text>
  <rect x="409.2308" y="175.333438333324" width="110.7693" height="328.666655000001" fill="url(#grad-danger)" rx="6.480740419066" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="464.6154" y="542.666689999998" text-anchor="middle" font-size="17.811991004781" font-family="Arial, sans-serif" fill="var(--text)">tcmalloc</text>
  <rect x="593.8462" y="156.000139999988" width="110.7693" height="347.999953333337" fill="url(#grad-ok)" rx="6.480740419066" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="649.2308" y="542.666689999998" text-anchor="middle" font-size="17.811991004781" font-family="Arial, sans-serif" fill="var(--text)">jemalloc</text>
  <rect x="778.4615" y="117.333426666659" width="110.7693" height="386.666666666667" fill="url(#grad-warn)" rx="6.480740419066" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="833.8462" y="542.666689999998" text-anchor="middle" font-size="17.811991004781" font-family="Arial, sans-serif" fill="var(--text)">mimalloc</text>
  <rect x="963.0769" y="368.666655000001" width="110.7693" height="135.333321666668" fill="url(#grad-info)" rx="6.480740419066" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1018.4616" y="542.666689999998" text-anchor="middle" font-size="17.811991004781" font-family="Arial, sans-serif" fill="var(--text)">custom</text>
  <text x="40" y="272.000046666663" font-size="17.811991004781" font-family="Arial, sans-serif" fill="var(--text)">Speed</text>
  <text x="686.1538" y="620" text-anchor="middle" font-size="19.593114496621" font-family="Arial, sans-serif" fill="var(--text)">Higher is better (relative performance)</text>
</svg>

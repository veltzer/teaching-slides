<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <text x="640" y="54" text-anchor="middle" font-size="25.6" font-weight="bold">Heap Organization</text>
  <rect x="160" y="108" width="960" height="108" fill="#2ECC71" stroke="#333" stroke-width="3.2" />
  <text x="640" y="171" text-anchor="middle" fill="white" font-size="19.2">Heap Segment</text>
  <rect x="192" y="252" width="160" height="72" fill="#3498DB" stroke="#333" stroke-width="3.2" />
  <text x="272" y="297" text-anchor="middle" fill="white" font-size="16">Chunk 1</text>
  <rect x="192" y="324" width="160" height="36" fill="#E74C3C" stroke="#333" stroke-width="1.6" />
  <text x="272" y="351" text-anchor="middle" fill="white" font-size="16">metadata</text>
  <rect x="384" y="252" width="240" height="72" fill="#3498DB" stroke="#333" stroke-width="3.2" />
  <text x="504" y="297" text-anchor="middle" fill="white" font-size="16">Chunk 2</text>
  <rect x="384" y="324" width="240" height="36" fill="#E74C3C" stroke="#333" stroke-width="1.6" />
  <text x="504" y="351" text-anchor="middle" fill="white" font-size="16">metadata</text>
  <rect x="656" y="252" width="128" height="72" fill="#9e9e9e" stroke="#333" stroke-width="3.2" />
  <text x="720" y="297" text-anchor="middle" fill="white" font-size="16">Free</text>
  <rect x="656" y="324" width="128" height="36" fill="#888888" stroke="#333" stroke-width="1.6" />
  <text x="720" y="351" text-anchor="middle" fill="white" font-size="16">metadata</text>
  <rect x="816" y="252" width="192" height="72" fill="#3498DB" stroke="#333" stroke-width="3.2" />
  <text x="912" y="297" text-anchor="middle" fill="white" font-size="16">Chunk 3</text>
  <rect x="816" y="324" width="192" height="36" fill="#E74C3C" stroke="#333" stroke-width="1.6" />
  <text x="912" y="351" text-anchor="middle" fill="white" font-size="16">metadata</text>
  <text x="640" y="450" text-anchor="middle" font-size="17.6">Each chunk has metadata: size, flags, pointers</text>
  <text x="640" y="486" text-anchor="middle" font-size="17.6">Free chunks linked in bins by size</text>
</svg>
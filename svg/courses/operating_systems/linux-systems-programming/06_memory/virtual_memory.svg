<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.364960155869" font-weight="bold" fill="var(--text)">Process Virtual Memory Layout</text>

  <rect x="361.428571428571" y="86.194690265487" width="557.142857142857" height="82.12389380531" rx="6.292491461972" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="122.12389380531" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.779977231925" font-weight="bold" fill="var(--danger-text)">Stack (grows down)</text>
  <text x="640" y="152.920353982301" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.633731500939" fill="var(--danger-text)">function frames, locals</text>

  <text x="961.428571428571" y="168.318584070796" font-family="Arial, sans-serif" font-size="13.633731500939" font-style="italic" fill="var(--text-muted)">SP grows toward 0</text>

  <rect x="361.428571428571" y="209.380530973451" width="557.142857142857" height="61.592920353982" rx="6.292491461972" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="245.309734513274" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.633731500939" font-style="italic" fill="var(--text-muted)">unmapped gap</text>

  <rect x="361.428571428571" y="291.504424778761" width="557.142857142857" height="82.12389380531" rx="6.292491461972" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="327.433628318584" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.779977231925" font-weight="bold" fill="var(--warn-text)">Heap (grows up)</text>
  <text x="640" y="358.230088495575" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.633731500939" fill="var(--warn-text)">malloc, brk, mmap</text>

  <rect x="361.428571428571" y="394.159292035398" width="557.142857142857" height="61.592920353982" rx="6.292491461972" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="430.088495575221" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.779977231925" font-weight="bold" fill="var(--ok-text)">BSS / Data</text>
  <text x="640" y="450.619469026549" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.584982923944" fill="var(--ok-text)">globals (zeroed / initialized)</text>

  <rect x="361.428571428571" y="476.283185840708" width="557.142857142857" height="61.592920353982" rx="6.292491461972" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="512.212389380531" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.779977231925" font-weight="bold" fill="var(--primary-text)">Text (.text segment)</text>
  <text x="640" y="532.743362831858" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.584982923944" fill="var(--primary-text)">code, read-only, executable</text>

  <text x="61.428571428571" y="106.725663716814" font-family="Arial, sans-serif" font-size="13.633731500939" font-weight="bold" fill="var(--text-muted)">High addr</text>
  <text x="61.428571428571" y="507.079646017699" font-family="Arial, sans-serif" font-size="13.633731500939" font-weight="bold" fill="var(--text-muted)">Low addr</text>

  <rect x="40" y="578.938053097345" width="1200" height="41.061946902655" rx="6.292491461972" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="604.601769911504" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.633731500939" fill="var(--text-muted)">Each process sees its own; MMU translates virtual to physical pages</text>
</svg>

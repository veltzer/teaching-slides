<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="316.0494" y="71.1111" width="632.0988" height="568.8889" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="632.0988" y="42.6667" text-anchor="middle" font-size="22.7556" font-weight="bold">Virtual Address Space (x86_64)</text>
  <rect x="316.0494" y="71.1111" width="632.0988" height="71.1111" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6"/>
  <text x="632.0988" y="113.7778" text-anchor="middle" fill="var(--bg)" font-size="17.0667">Kernel Space (0xFFFF...)</text>
  <rect x="316.0494" y="142.2222" width="632.0988" height="85.3333" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="632.0988" y="192" text-anchor="middle" fill="var(--bg)" font-size="17.0667">Stack (grows ↓)</text>
  <text x="979.7531" y="192" font-size="14.2222">~0x7FFF...</text>
  <rect x="316.0494" y="227.5556" width="632.0988" height="56.8889" fill="var(--text-faint)" stroke="var(--text)" stroke-width="2.8444" rx="6"/>
  <text x="632.0988" y="263.1111" text-anchor="middle" fill="var(--bg)" font-size="17.0667">Memory Mapped Region</text>
  <rect x="316.0494" y="284.4444" width="632.0988" height="56.8889" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6"/>
  <text x="632.0988" y="320" text-anchor="middle" fill="var(--bg)" font-size="17.0667">Shared Libraries</text>
  <rect x="316.0494" y="341.3333" width="632.0988" height="113.7778" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="632.0988" y="405.3333" text-anchor="middle" fill="var(--bg)" font-size="17.0667">Heap (grows ↑)</text>
  <text x="979.7531" y="405.3333" font-size="14.2222">brk</text>
  <rect x="316.0494" y="455.1111" width="632.0988" height="56.8889" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6"/>
  <text x="632.0988" y="490.6667" text-anchor="middle" fill="var(--black)" font-size="17.0667">BSS (uninitialized)</text>
  <rect x="316.0494" y="512" width="632.0988" height="56.8889" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6"/>
  <text x="632.0988" y="547.5556" text-anchor="middle" fill="var(--bg)" font-size="17.0667">Data (initialized)</text>
  <rect x="316.0494" y="568.8889" width="632.0988" height="71.1111" fill="var(--text-muted)" stroke="var(--text)" stroke-width="2.8444" rx="6"/>
  <text x="632.0988" y="611.5556" text-anchor="middle" fill="var(--bg)" font-size="17.0667">Text (code) - 0x400000</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="318" y="67.619" width="613.3335" height="552.381" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="5.9979"/>
  <text x="624.6667" y="40" text-anchor="middle" font-size="22.0877" font-weight="bold">Virtual Address Space (x86_64)</text>
  <rect x="318" y="67.619" width="613.3335" height="69.0476" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="5.9979"/>
  <text x="624.6667" y="109.0476" text-anchor="middle" fill="var(--bg)" font-size="16.5658">Kernel Space (0xFFFF...)</text>
  <rect x="318" y="136.6666" width="613.3335" height="82.8571" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="5.9979"/>
  <text x="624.6667" y="185" text-anchor="middle" fill="var(--bg)" font-size="16.5658">Stack (grows ↓)</text>
  <text x="962" y="185" font-size="13.8047">~0x7FFF...</text>
  <rect x="318" y="219.5238" width="613.3335" height="55.2381" fill="var(--text-faint)" stroke="var(--text)" stroke-width="2.8444" rx="5.9979"/>
  <text x="624.6667" y="254.0476" text-anchor="middle" fill="var(--bg)" font-size="16.5658">Memory Mapped Region</text>
  <rect x="318" y="274.7618" width="613.3335" height="55.2381" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="5.9979"/>
  <text x="624.6667" y="309.2857" text-anchor="middle" fill="var(--bg)" font-size="16.5658">Shared Libraries</text>
  <rect x="318" y="330" width="613.3335" height="110.4762" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="5.9979"/>
  <text x="624.6667" y="392.1428" text-anchor="middle" fill="var(--bg)" font-size="16.5658">Heap (grows ↑)</text>
  <text x="962" y="392.1428" font-size="13.8047">brk</text>
  <rect x="318" y="440.4762" width="613.3335" height="55.2381" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="5.9979"/>
  <text x="624.6667" y="475" text-anchor="middle" fill="var(--black)" font-size="16.5658">BSS (uninitialized)</text>
  <rect x="318" y="495.7143" width="613.3335" height="55.2381" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="5.9979"/>
  <text x="624.6667" y="530.2381" text-anchor="middle" fill="var(--bg)" font-size="16.5658">Data (initialized)</text>
  <rect x="318" y="550.9524" width="613.3335" height="69.0476" fill="var(--text-muted)" stroke="var(--text)" stroke-width="2.8444" rx="5.9979"/>
  <text x="624.6667" y="592.381" text-anchor="middle" fill="var(--bg)" font-size="16.5658">Text (code) - 0x400000</text>
</svg>
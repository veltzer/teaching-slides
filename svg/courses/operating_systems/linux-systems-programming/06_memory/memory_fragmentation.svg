<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <text x="640" y="72" text-anchor="middle" font-size="22.4" font-weight="bold">External Fragmentation</text>
  <rect x="160" y="144" width="960" height="96" fill="#eeeeee" stroke="#333" stroke-width="3.2" />
  <rect x="160" y="144" width="128" height="96" fill="#3498DB" stroke="#333" stroke-width="3.2" />
  <text x="224" y="204" text-anchor="middle" fill="white" font-size="16">Used</text>
  <rect x="288" y="144" width="64" height="96" fill="#E74C3C" stroke="#333" stroke-width="3.2" />
  <text x="320" y="204" text-anchor="middle" fill="white" font-size="16">Free</text>
  <rect x="352" y="144" width="160" height="96" fill="#3498DB" stroke="#333" stroke-width="3.2" />
  <text x="432" y="204" text-anchor="middle" fill="white" font-size="16">Used</text>
  <rect x="512" y="144" width="96" height="96" fill="#E74C3C" stroke="#333" stroke-width="3.2" />
  <text x="560" y="204" text-anchor="middle" fill="white" font-size="16">Free</text>
  <rect x="608" y="144" width="192" height="96" fill="#3498DB" stroke="#333" stroke-width="3.2" />
  <text x="704" y="204" text-anchor="middle" fill="white" font-size="16">Used</text>
  <rect x="800" y="144" width="80" height="96" fill="#E74C3C" stroke="#333" stroke-width="3.2" />
  <text x="840" y="204" text-anchor="middle" fill="white" font-size="16">Free</text>
  <rect x="880" y="144" width="240" height="96" fill="#3498DB" stroke="#333" stroke-width="3.2" />
  <text x="1000" y="204" text-anchor="middle" fill="white" font-size="16">Used</text>
  <text x="640" y="312" text-anchor="middle" font-size="19.2">Total free: 150 bytes, but largest contiguous: 60 bytes</text>
  <text x="640" y="360" text-anchor="middle" font-size="19.2">Cannot allocate 100 bytes despite having space!</text>
</svg>
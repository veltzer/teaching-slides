<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
  </defs>

  <text x="640" y="70" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--text)">External Fragmentation</text>

  <rect x="40" y="100" width="1200" height="260" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="130" text-anchor="middle" font-size="18" fill="var(--text-muted)">Heap after many allocs and frees</text>

  <rect x="60" y="160" width="160" height="180" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="140" y="260" text-anchor="middle" fill="var(--primary-text)" font-size="20" font-weight="bold">Used 40</text>
  <rect x="220" y="160" width="80" height="180" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="260" y="260" text-anchor="middle" fill="var(--danger-text)" font-size="18">Free 20</text>
  <rect x="300" y="160" width="200" height="180" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="400" y="260" text-anchor="middle" fill="var(--primary-text)" font-size="20" font-weight="bold">Used 50</text>
  <rect x="500" y="160" width="120" height="180" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="560" y="260" text-anchor="middle" fill="var(--danger-text)" font-size="18">Free 30</text>
  <rect x="620" y="160" width="260" height="180" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="750" y="260" text-anchor="middle" fill="var(--primary-text)" font-size="20" font-weight="bold">Used 70</text>
  <rect x="880" y="160" width="100" height="180" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="930" y="260" text-anchor="middle" fill="var(--danger-text)" font-size="18">Free 40</text>
  <rect x="980" y="160" width="240" height="180" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1100" y="260" text-anchor="middle" fill="var(--primary-text)" font-size="20" font-weight="bold">Used 60</text>

  <rect x="40" y="400" width="585" height="210" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="332" y="450" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--warn-text)">Total free: 90 bytes</text>
  <text x="332" y="495" text-anchor="middle" font-size="18" fill="var(--warn-text)">Scattered across 3 holes</text>
  <text x="332" y="535" text-anchor="middle" font-size="18" fill="var(--warn-text)">Largest contiguous: 40 bytes</text>
  <text x="332" y="575" text-anchor="middle" font-size="18" fill="var(--warn-text)">Many tiny gaps remain</text>

  <rect x="655" y="400" width="585" height="210" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="947" y="450" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--danger-text)">malloc(60) fails!</text>
  <text x="947" y="495" text-anchor="middle" font-size="18" fill="var(--danger-text)">Enough bytes free overall</text>
  <text x="947" y="535" text-anchor="middle" font-size="18" fill="var(--danger-text)">No single run is big enough</text>
  <text x="947" y="575" text-anchor="middle" font-size="18" fill="var(--danger-text)">Cure: compaction or slabs</text>
</svg>

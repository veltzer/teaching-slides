<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="1200" height="295.68627411534" rx="6.398529548051" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="74.117646809689" text-anchor="middle" font-size="19.195587615162" fill="var(--text-muted)" font-family="Arial, sans-serif">Heap after many allocs and frees</text>

  <rect x="60" y="108.235294678201" width="160" height="204.705881916955" rx="6.398529548051" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="221.96078439677" text-anchor="middle" fill="var(--primary-text)" font-size="21.328430797845" font-weight="bold" font-family="Arial, sans-serif">Used 40</text>
  <rect x="220" y="108.235294678201" width="80" height="204.705881916955" rx="6.398529548051" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="260" y="221.96078439677" text-anchor="middle" fill="var(--danger-text)" font-size="19.195587615162" font-family="Arial, sans-serif">Free 20</text>
  <rect x="300" y="108.235294678201" width="200" height="204.705881916955" rx="6.398529548051" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="221.96078439677" text-anchor="middle" fill="var(--primary-text)" font-size="21.328430797845" font-weight="bold" font-family="Arial, sans-serif">Used 50</text>
  <rect x="500" y="108.235294678201" width="120" height="204.705881916955" rx="6.398529548051" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="560" y="221.96078439677" text-anchor="middle" fill="var(--danger-text)" font-size="19.195587615162" font-family="Arial, sans-serif">Free 30</text>
  <rect x="620" y="108.235294678201" width="260" height="204.705881916955" rx="6.398529548051" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="750" y="221.96078439677" text-anchor="middle" fill="var(--primary-text)" font-size="21.328430797845" font-weight="bold" font-family="Arial, sans-serif">Used 70</text>
  <rect x="880" y="108.235294678201" width="100" height="204.705881916955" rx="6.398529548051" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="930" y="221.96078439677" text-anchor="middle" fill="var(--danger-text)" font-size="19.195587615162" font-family="Arial, sans-serif">Free 40</text>
  <rect x="980" y="108.235294678201" width="240" height="204.705881916955" rx="6.398529548051" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100" y="221.96078439677" text-anchor="middle" fill="var(--primary-text)" font-size="21.328430797845" font-weight="bold" font-family="Arial, sans-serif">Used 60</text>

  <rect x="40" y="381.176470214533" width="585" height="238.823529785467" rx="6.398529548051" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="332" y="438.03921560323" text-anchor="middle" font-size="23.461273980529" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Total free: 90 bytes</text>
  <text x="332" y="489.215685817762" text-anchor="middle" font-size="19.195587615162" fill="var(--warn-text)" font-family="Arial, sans-serif">Scattered across 3 holes</text>
  <text x="332" y="534.705881916955" text-anchor="middle" font-size="19.195587615162" fill="var(--warn-text)" font-family="Arial, sans-serif">Largest contiguous: 40 bytes</text>
  <text x="332" y="580.196078016148" text-anchor="middle" font-size="19.195587615162" fill="var(--warn-text)" font-family="Arial, sans-serif">Many tiny gaps remain</text>

  <rect x="655" y="381.176470214533" width="585" height="238.823529785467" rx="6.398529548051" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="947" y="438.03921560323" text-anchor="middle" font-size="23.461273980529" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">malloc(60) fails!</text>
  <text x="947" y="489.215685817762" text-anchor="middle" font-size="19.195587615162" fill="var(--danger-text)" font-family="Arial, sans-serif">Enough bytes free overall</text>
  <text x="947" y="534.705881916955" text-anchor="middle" font-size="19.195587615162" fill="var(--danger-text)" font-family="Arial, sans-serif">No single run is big enough</text>
  <text x="947" y="580.196078016148" text-anchor="middle" font-size="19.195587615162" fill="var(--danger-text)" font-family="Arial, sans-serif">Cure: compaction or slabs</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="632.0988" y="53.3333" text-anchor="middle" font-size="25.284" font-weight="bold">Thread Local Storage</text>
  <rect x="79.0123" y="106.6667" width="316.0494" height="533.3333" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="237.037" y="88.8889" text-anchor="middle" font-size="18.963">Thread 1</text>
  <rect x="110.6173" y="142.2222" width="252.8395" height="71.1111" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="237.037" y="186.6667" text-anchor="middle" fill="var(--bg)" font-size="15.8025">Stack</text>
  <rect x="110.6173" y="231.1111" width="252.8395" height="71.1111" fill="var(--primary-accent)" rx="6"/>
  <text x="237.037" y="275.5556" text-anchor="middle" fill="var(--bg)" font-size="15.8025">TLS Block</text>
  <rect x="126.4198" y="248.8889" width="221.2346" height="35.5556" fill="var(--primary-accent)" rx="6"/>
  <text x="237.037" y="275.5556" text-anchor="middle" fill="var(--bg)" font-size="15.8025">tls_counter = 5</text>
  <rect x="474.0741" y="106.6667" width="316.0494" height="533.3333" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6"/>
  <text x="632.0988" y="88.8889" text-anchor="middle" font-size="18.963">Thread 2</text>
  <rect x="505.679" y="142.2222" width="252.8395" height="71.1111" fill="var(--danger-accent)" rx="6"/>
  <text x="632.0988" y="186.6667" text-anchor="middle" fill="var(--bg)" font-size="15.8025">Stack</text>
  <rect x="505.679" y="231.1111" width="252.8395" height="71.1111" fill="var(--danger-accent)" rx="6"/>
  <text x="632.0988" y="275.5556" text-anchor="middle" fill="var(--bg)" font-size="15.8025">TLS Block</text>
  <rect x="521.4815" y="248.8889" width="221.2346" height="35.5556" fill="var(--danger-accent)" rx="6"/>
  <text x="632.0988" y="275.5556" text-anchor="middle" fill="var(--bg)" font-size="15.8025">tls_counter = 10</text>
  <rect x="869.1358" y="106.6667" width="316.0494" height="533.3333" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="1027.1605" y="88.8889" text-anchor="middle" font-size="18.963">Thread 3</text>
  <rect x="900.7407" y="142.2222" width="252.8395" height="71.1111" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1027.1605" y="186.6667" text-anchor="middle" fill="var(--bg)" font-size="15.8025">Stack</text>
  <rect x="900.7407" y="231.1111" width="252.8395" height="71.1111" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1027.1605" y="275.5556" text-anchor="middle" fill="var(--bg)" font-size="15.8025">TLS Block</text>
  <rect x="916.5432" y="248.8889" width="221.2346" height="35.5556" fill="var(--ok-accent)" rx="6"/>
  <text x="1027.1605" y="275.5556" text-anchor="middle" fill="var(--bg)" font-size="15.8025">tls_counter = 3</text>
  <text x="632.0988" y="444.4444" text-anchor="middle" font-size="17.3827">Each thread has independent copy</text>
  <text x="632.0988" y="480" text-anchor="middle" font-size="17.3827">No synchronization needed</text>
</svg>
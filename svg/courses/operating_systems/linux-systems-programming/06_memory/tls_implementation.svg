<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="54" text-anchor="middle" font-size="25.6" font-weight="bold">Thread Local Storage</text>
  <rect x="80" y="108" width="320" height="540" fill="#3498DB" stroke="#333" stroke-width="3.2" />
  <text x="240" y="90" text-anchor="middle" font-size="19.2">Thread 1</text>
  <rect x="112" y="144" width="256" height="72" fill="#2980B9" />
  <text x="240" y="189" text-anchor="middle" fill="white" font-size="16">Stack</text>
  <rect x="112" y="234" width="256" height="72" fill="#2471A3" />
  <text x="240" y="279" text-anchor="middle" fill="white" font-size="16">TLS Block</text>
  <rect x="128" y="252" width="224" height="36" fill="#1F618D" />
  <text x="240" y="279" text-anchor="middle" fill="white" font-size="16">tls_counter = 5</text>
  <rect x="480" y="108" width="320" height="540" fill="#E74C3C" stroke="#333" stroke-width="3.2" />
  <text x="640" y="90" text-anchor="middle" font-size="19.2">Thread 2</text>
  <rect x="512" y="144" width="256" height="72" fill="#C0392B" />
  <text x="640" y="189" text-anchor="middle" fill="white" font-size="16">Stack</text>
  <rect x="512" y="234" width="256" height="72" fill="#A93226" />
  <text x="640" y="279" text-anchor="middle" fill="white" font-size="16">TLS Block</text>
  <rect x="528" y="252" width="224" height="36" fill="#922B21" />
  <text x="640" y="279" text-anchor="middle" fill="white" font-size="16">tls_counter = 10</text>
  <rect x="880" y="108" width="320" height="540" fill="#2ECC71" stroke="#333" stroke-width="3.2" />
  <text x="1040" y="90" text-anchor="middle" font-size="19.2">Thread 3</text>
  <rect x="912" y="144" width="256" height="72" fill="#27AE60" />
  <text x="1040" y="189" text-anchor="middle" fill="white" font-size="16">Stack</text>
  <rect x="912" y="234" width="256" height="72" fill="#229954" />
  <text x="1040" y="279" text-anchor="middle" fill="white" font-size="16">TLS Block</text>
  <rect x="928" y="252" width="224" height="36" fill="#1E8449" />
  <text x="1040" y="279" text-anchor="middle" fill="white" font-size="16">tls_counter = 3</text>
  <text x="640" y="450" text-anchor="middle" font-size="17.6">Each thread has independent copy</text>
  <text x="640" y="486" text-anchor="middle" font-size="17.6">No synchronization needed</text>
</svg>
  <text x="867.5556" y="531.2" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--bg)" opacity="0.6">0</text>
  <rect x="888.8889" y="512" width="28.4444" height="24" rx="6" fill="var(--primary-fill)" opacity="0.4" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="903.1111" y="531.2" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--bg)" opacity="0.6">1</text>

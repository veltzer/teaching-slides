<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <rect x="339.9999" y="98" width="600" height="72.5" rx="6" fill="var(--text)" stroke="var(--primary-border)" stroke-width="2.8444" opacity="0.6" />
  <text x="640" y="144.4" text-anchor="middle" font-size="19.4662" fill="var(--primary-accent)" opacity="0.7" font-family="Courier New, monospace">User Space Application</text>
  <rect x="339.9999" y="199.5" width="600" height="72.5" rx="6" fill="var(--text)" stroke="var(--warn-border)" stroke-width="2.8444" opacity="0.6" />
  <text x="640" y="245.9" text-anchor="middle" font-size="19.4662" fill="var(--warn-accent)" opacity="0.7" font-family="Courier New, monospace">System Call Interface</text>
  <rect x="339.9999" y="301" width="600" height="72.5" rx="6" fill="var(--text)" stroke="var(--ok-border)" stroke-width="2.8444" opacity="0.6" />
  <text x="640" y="347.4" text-anchor="middle" font-size="19.4662" fill="var(--ok-accent)" opacity="0.7" font-family="Courier New, monospace">Linux Kernel</text>
  <rect x="339.9999" y="402.5" width="600" height="72.5" rx="6" fill="var(--text)" stroke="var(--danger-border)" stroke-width="2.8444" opacity="0.6" />
  <text x="640" y="448.9" text-anchor="middle" font-size="19.4662" fill="var(--danger-accent)" opacity="0.7" font-family="Courier New, monospace">Hardware</text>
  <line x1="640" y1="170.5" x2="640" y2="199.5" stroke="var(--border)" stroke-width="2" opacity="0.4" />
  <polygon points="632.5,196.6 640,206.75 647.5,196.6" fill="var(--border)" opacity="0.4" />
  <line x1="640" y1="272" x2="640" y2="301" stroke="var(--border)" stroke-width="2" opacity="0.4" />
  <polygon points="632.5,298.1 640,308.25 647.5,298.1" fill="var(--border)" opacity="0.4" />
  <line x1="640" y1="373.5" x2="640" y2="402.5" stroke="var(--border)" stroke-width="2" opacity="0.4" />
  <polygon points="632.5,399.6 640,409.75 647.5,399.6" fill="var(--border)" opacity="0.4" />
  <text x="160" y="156" font-size="15.2948" fill="var(--info-accent)" opacity="0.5" font-family="Courier New, monospace">fork()</text>
  <text x="160" y="199.5" font-size="15.2948" fill="var(--info-accent)" opacity="0.5" font-family="Courier New, monospace">exec()</text>
  <text x="160" y="243" font-size="15.2948" fill="var(--info-accent)" opacity="0.5" font-family="Courier New, monospace">read()</text>
  <text x="160" y="286.5" font-size="15.2948" fill="var(--info-accent)" opacity="0.5" font-family="Courier New, monospace">write()</text>
  <text x="160" y="330" font-size="15.2948" fill="var(--info-accent)" opacity="0.5" font-family="Courier New, monospace">mmap()</text>
  <text x="160" y="373.5" font-size="15.2948" fill="var(--info-accent)" opacity="0.5" font-family="Courier New, monospace">ioctl()</text>
  <text x="1030" y="156" font-size="15.2948" fill="var(--info-accent)" opacity="0.5" font-family="Courier New, monospace">socket()</text>
  <text x="1030" y="199.5" font-size="15.2948" fill="var(--info-accent)" opacity="0.5" font-family="Courier New, monospace">pipe()</text>
  <text x="1030" y="243" font-size="15.2948" fill="var(--info-accent)" opacity="0.5" font-family="Courier New, monospace">open()</text>
  <text x="1030" y="286.5" font-size="15.2948" fill="var(--info-accent)" opacity="0.5" font-family="Courier New, monospace">close()</text>
  <text x="1030" y="330" font-size="15.2948" fill="var(--info-accent)" opacity="0.5" font-family="Courier New, monospace">signal()</text>
  <text x="1030" y="373.5" font-size="15.2948" fill="var(--info-accent)" opacity="0.5" font-family="Courier New, monospace">pthread()</text>
  <circle cx="265" cy="504" r="16.6854" fill="var(--ok-fill)" opacity="0.4" />
  <circle cx="220" cy="554.75" r="13.9044" fill="var(--ok-fill)" opacity="0.3" />
  <circle cx="310" cy="554.75" r="13.9044" fill="var(--ok-fill)" opacity="0.3" />
  <line x1="257.5" y1="521.4" x2="227.5" y2="540.25" stroke="var(--ok-border)" stroke-width="2" opacity="0.3" />
  <line x1="272.4999" y1="521.4" x2="302.5" y2="540.25" stroke="var(--ok-border)" stroke-width="2" opacity="0.3" />
  <rect x="939.9999" y="504" width="30" height="21.75" rx="6" fill="url(#grad-primary)" opacity="0.4" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="955" y="521.4" text-anchor="middle" font-size="13.9044" fill="var(--bg)" opacity="0.6" font-family="Courier New, monospace">0</text>
  <rect x="977.5" y="504" width="30" height="21.75" rx="6" fill="url(#grad-primary)" opacity="0.4" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="992.5" y="521.4" text-anchor="middle" font-size="13.9044" fill="var(--bg)" opacity="0.6" font-family="Courier New, monospace">1</text>
  <rect x="1014.9999" y="504" width="30" height="21.75" rx="6" fill="url(#grad-primary)" opacity="0.4" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1030" y="521.4" text-anchor="middle" font-size="13.9044" fill="var(--bg)" opacity="0.6" font-family="Courier New, monospace">2</text>
  <rect x="1052.5" y="504" width="30" height="21.75" rx="6" fill="url(#grad-danger)" opacity="0.4" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1067.5" y="521.4" text-anchor="middle" font-size="13.9044" fill="var(--bg)" opacity="0.6" font-family="Courier New, monospace">fd</text>
  <text x="640" y="598.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.028" fill="var(--border)" letter-spacing="3">LINUX SYSTEMS PROGRAMMING</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1137.7778" height="640" fill="var(--code-bg)" rx="6"/>
  <rect x="284.4444" y="64" width="568.8889" height="80" rx="6" fill="var(--text)" stroke="var(--primary-border)" stroke-width="2.8444" opacity="0.6" />
  <text x="568.8889" y="115.2" text-anchor="middle" font-family="monospace" font-size="19.9111" fill="var(--primary-accent)" opacity="0.7">User Space Application</text>
  <rect x="284.4444" y="176" width="568.8889" height="80" rx="6" fill="var(--text)" stroke="var(--warn-border)" stroke-width="2.8444" opacity="0.6" />
  <text x="568.8889" y="227.2" text-anchor="middle" font-family="monospace" font-size="19.9111" fill="var(--warn-accent)" opacity="0.7">System Call Interface</text>
  <rect x="284.4444" y="288" width="568.8889" height="80" rx="6" fill="var(--text)" stroke="var(--ok-border)" stroke-width="2.8444" opacity="0.6" />
  <text x="568.8889" y="339.2" text-anchor="middle" font-family="monospace" font-size="19.9111" fill="var(--ok-accent)" opacity="0.7">Linux Kernel</text>
  <rect x="284.4444" y="400" width="568.8889" height="80" rx="6" fill="var(--text)" stroke="var(--danger-border)" stroke-width="2.8444" opacity="0.6" />
  <text x="568.8889" y="451.2" text-anchor="middle" font-family="monospace" font-size="19.9111" fill="var(--danger-accent)" opacity="0.7">Hardware</text>
  <line x1="568.8889" y1="144" x2="568.8889" y2="176" stroke="var(--border)" stroke-width="2" opacity="0.4" />
  <polygon points="561.7778,172.8 568.8889,184 576,172.8" fill="var(--border)" opacity="0.4" />
  <line x1="568.8889" y1="256" x2="568.8889" y2="288" stroke="var(--border)" stroke-width="2" opacity="0.4" />
  <polygon points="561.7778,284.8 568.8889,296 576,284.8" fill="var(--border)" opacity="0.4" />
  <line x1="568.8889" y1="368" x2="568.8889" y2="400" stroke="var(--border)" stroke-width="2" opacity="0.4" />
  <polygon points="561.7778,396.8 568.8889,408 576,396.8" fill="var(--border)" opacity="0.4" />
  <text x="113.7778" y="128" font-family="monospace" font-size="15.6444" fill="var(--info-accent)" opacity="0.5">fork()</text>
  <text x="113.7778" y="176" font-family="monospace" font-size="15.6444" fill="var(--info-accent)" opacity="0.5">exec()</text>
  <text x="113.7778" y="224" font-family="monospace" font-size="15.6444" fill="var(--info-accent)" opacity="0.5">read()</text>
  <text x="113.7778" y="272" font-family="monospace" font-size="15.6444" fill="var(--info-accent)" opacity="0.5">write()</text>
  <text x="113.7778" y="320" font-family="monospace" font-size="15.6444" fill="var(--info-accent)" opacity="0.5">mmap()</text>
  <text x="113.7778" y="368" font-family="monospace" font-size="15.6444" fill="var(--info-accent)" opacity="0.5">ioctl()</text>
  <text x="938.6667" y="128" font-family="monospace" font-size="15.6444" fill="var(--info-accent)" opacity="0.5">socket()</text>
  <text x="938.6667" y="176" font-family="monospace" font-size="15.6444" fill="var(--info-accent)" opacity="0.5">pipe()</text>
  <text x="938.6667" y="224" font-family="monospace" font-size="15.6444" fill="var(--info-accent)" opacity="0.5">open()</text>
  <text x="938.6667" y="272" font-family="monospace" font-size="15.6444" fill="var(--info-accent)" opacity="0.5">close()</text>
  <text x="938.6667" y="320" font-family="monospace" font-size="15.6444" fill="var(--info-accent)" opacity="0.5">signal()</text>
  <text x="938.6667" y="368" font-family="monospace" font-size="15.6444" fill="var(--info-accent)" opacity="0.5">pthread()</text>

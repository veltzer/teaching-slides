  <text x="974.2222" y="531.2" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--bg)" opacity="0.6">fd</text>
  <text x="568.8889" y="616" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.6" fill="var(--border)" letter-spacing="3">LINUX SYSTEMS PROGRAMMING</text>
</svg>
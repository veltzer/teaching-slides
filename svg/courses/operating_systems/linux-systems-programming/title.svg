  <circle cx="170.6667" cy="568" r="14.2222" fill="var(--ok-fill)" opacity="0.3" />
  <circle cx="256" cy="568" r="14.2222" fill="var(--ok-fill)" opacity="0.3" />
  <line x1="206.2222" y1="531.2" x2="177.7778" y2="552" stroke="var(--ok-border)" stroke-width="2" opacity="0.3" />
  <line x1="220.4444" y1="531.2" x2="248.8889" y2="552" stroke="var(--ok-border)" stroke-width="2" opacity="0.3" />

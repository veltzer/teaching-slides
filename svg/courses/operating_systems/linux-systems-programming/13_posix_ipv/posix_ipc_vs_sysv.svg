<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="26.6667" y="17.7778" width="1084.4444" height="44.4444" rx="6" fill="var(--text-muted)" />
  <text x="568.8889" y="46.2222" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="var(--bg)" text-anchor="middle">POSIX IPC vs System V IPC — Comparison</text>
  <rect x="26.6667" y="78.2222" width="177.7778" height="37.3333" rx="6" fill="var(--text-muted)" />
  <text x="115.5556" y="101.3333" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--bg)" text-anchor="middle">Feature</text>
  <rect x="213.3333" y="78.2222" width="435.5556" height="37.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="431.1111" y="101.3333" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--bg)" text-anchor="middle">POSIX IPC</text>
  <rect x="657.7778" y="78.2222" width="453.3333" height="37.3333" rx="6" fill="var(--text-muted)" />
  <text x="884.4444" y="101.3333" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--bg)" text-anchor="middle">System V IPC</text>
  <rect x="26.6667" y="122.6667" width="177.7778" height="46.2222" rx="6" fill="var(--surface)" />
  <text x="115.5556" y="150.2222" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--text-muted)" text-anchor="middle">Naming</text>
  <rect x="213.3333" y="122.6667" width="435.5556" height="46.2222" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="431.1111" y="141.3333" font-family="monospace" font-size="11.5556" fill="var(--primary-accent)" text-anchor="middle">/name  (e.g., /myqueue)</text>
  <text x="431.1111" y="160" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)" text-anchor="middle">Filesystem-like path in /dev/shm or mqueue</text>
  <rect x="657.7778" y="122.6667" width="453.3333" height="46.2222" rx="6" fill="var(--surface)" />
  <text x="884.4444" y="141.3333" font-family="monospace" font-size="11.5556" fill="var(--text-muted)" text-anchor="middle">Integer key (ftok() or IPC_PRIVATE)</text>
  <text x="884.4444" y="160" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)" text-anchor="middle">Opaque numeric ID, not human-readable</text>
  <rect x="26.6667" y="174.2222" width="177.7778" height="46.2222" rx="6" fill="var(--surface)" />
  <text x="115.5556" y="201.7778" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--text-muted)" text-anchor="middle">Access model</text>
  <rect x="213.3333" y="174.2222" width="435.5556" height="46.2222" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="431.1111" y="192.8889" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--ok-accent)" text-anchor="middle">File descriptor (fd-based)</text>
  <text x="431.1111" y="211.5556" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)" text-anchor="middle">Works with select(), poll(), epoll()</text>
  <rect x="657.7778" y="174.2222" width="453.3333" height="46.2222" rx="6" fill="var(--surface)" />
  <text x="884.4444" y="192.8889" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text-muted)" text-anchor="middle">Integer IPC identifier</text>
  <text x="884.4444" y="211.5556" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)" text-anchor="middle">Cannot use with select/poll/epoll</text>
  <rect x="26.6667" y="225.7778" width="177.7778" height="60.4444" rx="6" fill="var(--surface)" />
  <text x="115.5556" y="248.8889" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--text-muted)" text-anchor="middle">Message</text>
  <text x="115.5556" y="264.8889" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--text-muted)" text-anchor="middle">Queue API</text>
  <rect x="213.3333" y="225.7778" width="435.5556" height="60.4444" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="231.1111" y="246.2222" font-family="monospace" font-size="10.6667" fill="var(--primary-accent)">mq_open("/q", O_RDWR|O_CREAT, 0666, &amp;attr)</text>
  <text x="231.1111" y="264" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">mq_send(fd, buf, len, prio)</text>
  <text x="231.1111" y="280" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">mq_receive(fd, buf, maxlen, &amp;prio)</text>
  <rect x="657.7778" y="225.7778" width="453.3333" height="60.4444" rx="6" fill="var(--surface)" />
  <text x="675.5556" y="246.2222" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">msgget(key, IPC_CREAT|0666)</text>
  <text x="675.5556" y="264" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">msgsnd(id, &amp;msg, size, flags)</text>
  <text x="675.5556" y="280" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">msgrcv(id, &amp;msg, size, type, flags)</text>
  <rect x="26.6667" y="291.5556" width="177.7778" height="60.4444" rx="6" fill="var(--surface)" />
  <text x="115.5556" y="314.6667" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--text-muted)" text-anchor="middle">Semaphore</text>
  <text x="115.5556" y="330.6667" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--text-muted)" text-anchor="middle">API</text>
  <rect x="213.3333" y="291.5556" width="435.5556" height="60.4444" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="231.1111" y="311.1111" font-family="monospace" font-size="10.6667" fill="var(--ok-accent)">sem_open("/sem", O_CREAT, 0666, 1)</text>
  <text x="231.1111" y="328.8889" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">sem_wait(sem)  /  sem_post(sem)</text>
  <text x="231.1111" y="344.8889" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">sem_init(&amp;sem, shared, value)  (unnamed)</text>
  <rect x="657.7778" y="291.5556" width="453.3333" height="60.4444" rx="6" fill="var(--surface)" />
  <text x="675.5556" y="311.1111" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">semget(key, nsems, IPC_CREAT|0666)</text>
  <text x="675.5556" y="328.8889" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">semop(id, &amp;sops, nsops)</text>
  <text x="675.5556" y="344.8889" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">semctl(id, num, SETVAL, 1)</text>
  <rect x="26.6667" y="357.3333" width="177.7778" height="60.4444" rx="6" fill="var(--surface)" />
  <text x="115.5556" y="380.4444" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--text-muted)" text-anchor="middle">Shared</text>
  <text x="115.5556" y="396.4444" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--text-muted)" text-anchor="middle">Memory API</text>
  <rect x="213.3333" y="357.3333" width="435.5556" height="60.4444" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="231.1111" y="376.8889" font-family="monospace" font-size="10.6667" fill="var(--primary-accent)">shm_open("/shm", O_RDWR|O_CREAT, 0666)</text>
  <text x="231.1111" y="394.6667" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">ftruncate(fd, size)</text>
  <text x="231.1111" y="412.4444" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">mmap(NULL, size, PROT_RW, MAP_SHARED, fd, 0)</text>
  <rect x="657.7778" y="357.3333" width="453.3333" height="60.4444" rx="6" fill="var(--surface)" />
  <text x="675.5556" y="376.8889" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">shmget(key, size, IPC_CREAT|0666)</text>
  <text x="675.5556" y="394.6667" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">shmat(id, NULL, 0)  →  ptr</text>
  <text x="675.5556" y="412.4444" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">shmdt(ptr)</text>
  <rect x="26.6667" y="423.1111" width="177.7778" height="46.2222" rx="6" fill="var(--surface)" />
  <text x="115.5556" y="450.6667" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--text-muted)" text-anchor="middle">Cleanup</text>
  <rect x="213.3333" y="423.1111" width="435.5556" height="46.2222" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="231.1111" y="442.6667" font-family="monospace" font-size="10.6667" fill="var(--ok-accent)">mq_unlink("/q")   sem_unlink("/sem")</text>
  <text x="231.1111" y="460.4444" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">shm_unlink("/shm")   munmap(ptr, size)</text>
  <rect x="657.7778" y="423.1111" width="453.3333" height="46.2222" rx="6" fill="var(--surface)" />
  <text x="675.5556" y="442.6667" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">msgctl / semctl / shmctl with IPC_RMID</text>
  <text x="675.5556" y="460.4444" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">ipcrm -q / -s / -m  or  ipcrm --all</text>
  <rect x="26.6667" y="474.6667" width="177.7778" height="46.2222" rx="6" fill="var(--surface)" />
  <text x="115.5556" y="502.2222" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--text-muted)" text-anchor="middle">Verdict</text>
  <rect x="213.3333" y="474.6667" width="435.5556" height="46.2222" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="431.1111" y="493.3333" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Preferred for new code</text>
  <text x="431.1111" y="511.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)" text-anchor="middle">POSIX.1-2001 standard, cleaner API, fd-based</text>
  <rect x="657.7778" y="474.6667" width="453.3333" height="46.2222" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="884.4444" y="493.3333" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Legacy (pre-POSIX)</text>
  <text x="884.4444" y="511.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)" text-anchor="middle">Still widely used, complex semaphore API</text>
  <rect x="26.6667" y="540.4444" width="1084.4444" height="60.4444" rx="6" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2" />
  <text x="568.8889" y="560" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Practical notes for Linux systems programming:</text>
  <text x="568.8889" y="579.5556" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)" text-anchor="middle">Link with -lrt for POSIX IPC (mq_*, shm_*) and -lpthread for sem_*  •  POSIX named objects appear under /dev/shm  •  mq_notify() enables async notification</text>
  <text x="568.8889" y="595.5556" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)" text-anchor="middle">Both survive process death until explicitly deleted — always clean up in signal handlers and at-exit</text>
</svg>
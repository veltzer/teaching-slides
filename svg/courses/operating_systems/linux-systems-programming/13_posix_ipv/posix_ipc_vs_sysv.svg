<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.534586728656" font-weight="bold" fill="var(--primary-accent)">POSIX IPC vs System V IPC</text>

  <!-- Table: header row -->
  <rect x="40" y="76.576576576577" width="260" height="45.981981981982" rx="6.133646682164" fill="var(--text-muted)"/>
  <rect x="300" y="76.576576576577" width="470" height="45.981981981982" rx="6.133646682164" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="770" y="76.576576576577" width="470" height="45.981981981982" rx="6.133646682164" fill="var(--text-muted)"/>
  <text x="170" y="105.837837837838" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.33411670541" font-weight="bold" fill="var(--bg)">Feature</text>
  <text x="535" y="105.837837837838" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.33411670541" font-weight="bold" fill="var(--bg)">POSIX IPC</text>
  <text x="1005" y="105.837837837838" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.33411670541" font-weight="bold" fill="var(--bg)">System V IPC</text>

  <!-- Naming -->
  <text x="170" y="160.18018018018" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" font-weight="bold" fill="var(--text-muted)">Naming</text>
  <text x="535" y="160.18018018018" text-anchor="middle" font-family="Courier New, monospace" font-size="13.289567811355" fill="var(--primary-accent)">/name path</text>
  <text x="1005" y="160.18018018018" text-anchor="middle" font-family="Courier New, monospace" font-size="13.289567811355" fill="var(--text-muted)">integer key, ftok()</text>

  <!-- Access -->
  <text x="170" y="201.981981981982" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" font-weight="bold" fill="var(--text-muted)">Access</text>
  <text x="535" y="201.981981981982" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--ok-accent)">file descriptor</text>
  <text x="1005" y="201.981981981982" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--text-muted)">opaque id</text>

  <!-- Message queue -->
  <text x="170" y="243.783783783784" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" font-weight="bold" fill="var(--text-muted)">Message Q</text>
  <text x="535" y="243.783783783784" text-anchor="middle" font-family="Courier New, monospace" font-size="13.289567811355" fill="var(--primary-accent)">mq_open / mq_send</text>
  <text x="1005" y="243.783783783784" text-anchor="middle" font-family="Courier New, monospace" font-size="13.289567811355" fill="var(--text-muted)">msgget / msgsnd</text>

  <!-- Semaphore -->
  <text x="170" y="285.585585585586" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" font-weight="bold" fill="var(--text-muted)">Semaphore</text>
  <text x="535" y="285.585585585586" text-anchor="middle" font-family="Courier New, monospace" font-size="13.289567811355" fill="var(--ok-accent)">sem_open / sem_wait</text>
  <text x="1005" y="285.585585585586" text-anchor="middle" font-family="Courier New, monospace" font-size="13.289567811355" fill="var(--text-muted)">semget / semop</text>

  <!-- Shared memory -->
  <text x="170" y="327.387387387387" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" font-weight="bold" fill="var(--text-muted)">Shared Mem</text>
  <text x="535" y="327.387387387387" text-anchor="middle" font-family="Courier New, monospace" font-size="13.289567811355" fill="var(--primary-accent)">shm_open / mmap</text>
  <text x="1005" y="327.387387387387" text-anchor="middle" font-family="Courier New, monospace" font-size="13.289567811355" fill="var(--text-muted)">shmget / shmat</text>

  <!-- Cleanup -->
  <text x="170" y="369.189189189189" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" font-weight="bold" fill="var(--text-muted)">Cleanup</text>
  <text x="535" y="369.189189189189" text-anchor="middle" font-family="Courier New, monospace" font-size="13.289567811355" fill="var(--ok-accent)">mq_unlink / shm_unlink</text>
  <text x="1005" y="369.189189189189" text-anchor="middle" font-family="Courier New, monospace" font-size="13.289567811355" fill="var(--text-muted)">ctl IPC_RMID / ipcrm</text>

  <!-- Poll compat -->
  <text x="170" y="410.990990990991" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" font-weight="bold" fill="var(--text-muted)">Poll/Epoll</text>
  <text x="535" y="410.990990990991" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--ok-accent)">yes (fd based)</text>
  <text x="1005" y="410.990990990991" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--danger-accent)">no</text>

  <!-- Verdict row -->
  <rect x="40" y="442.342342342342" width="260" height="52.252252252252" rx="6.133646682164" fill="var(--surface)"/>
  <rect x="300" y="442.342342342342" width="470" height="52.252252252252" rx="6.133646682164" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="770" y="442.342342342342" width="470" height="52.252252252252" rx="6.133646682164" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="170" y="475.783783783784" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" font-weight="bold" fill="var(--text-muted)">Verdict</text>
  <text x="535" y="475.783783783784" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" font-weight="bold" fill="var(--ok-text)">Preferred for new code</text>
  <text x="1005" y="475.783783783784" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" font-weight="bold" fill="var(--warn-text)">Legacy, still common</text>

  <!-- Footer notes -->
  <rect x="40" y="515.495495495495" width="1200" height="104.504504504504" rx="8.178195576219" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="552.072072072072" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.33411670541" font-weight="bold" fill="var(--info-text)">Notes</text>
  <text x="640" y="583.423423423423" text-anchor="middle" font-family="Courier New, monospace" font-size="13.289567811355" fill="var(--info-text)">-lrt for POSIX mq/shm, -lpthread for sem</text>
  <text x="640" y="609.54954954955" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--info-text)">Both persist until unlinked; clean up explicitly</text>
</svg>

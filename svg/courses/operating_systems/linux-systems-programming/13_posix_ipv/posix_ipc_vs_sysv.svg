  <ns0:text x="115.5556" y="264.8889" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--text-muted)" text-anchor="middle">Queue API</ns0:text>
  <ns0:rect x="213.3333" y="225.7778" width="435.5556" height="60.4444" rx="3.5556" fill="var(--primary-pale)" />
  <ns0:text x="231.1111" y="246.2222" font-family="monospace" font-size="10.6667" fill="var(--primary-dk)">mq_open("/q", O_RDWR|O_CREAT, 0666, &amp;attr)</ns0:text>

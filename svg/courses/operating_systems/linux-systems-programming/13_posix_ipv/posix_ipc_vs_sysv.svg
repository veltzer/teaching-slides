  <ns0:text x="115.5556" y="380.4444" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--text-muted)" text-anchor="middle">Shared</ns0:text>
  <ns0:text x="115.5556" y="396.4444" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--text-muted)" text-anchor="middle">Memory API</ns0:text>

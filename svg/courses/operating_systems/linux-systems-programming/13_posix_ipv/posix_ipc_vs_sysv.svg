  <ns0:text x="115.5556" y="330.6667" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--text-muted)" text-anchor="middle">API</ns0:text>
  <ns0:rect x="213.3333" y="291.5556" width="435.5556" height="60.4444" rx="3.5556" fill="var(--ok-pale)" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Header -->
  <rect x="30" y="20" width="1220" height="50" rx="8" fill="#37474f"/>
  <text x="640" y="52" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">POSIX IPC vs System V IPC — Comparison</text>

  <!-- Column headers -->
  <rect x="30" y="88" width="200" height="42" rx="6" fill="#546e7a"/>
  <text x="130" y="114" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Feature</text>

  <rect x="240" y="88" width="490" height="42" rx="6" fill="url(#grad-accent)"/>
  <text x="485" y="114" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">POSIX IPC</text>

  <rect x="740" y="88" width="510" height="42" rx="6" fill="#455a64"/>
  <text x="995" y="114" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">System V IPC</text>

  <!-- Rows -->
  <!-- Naming -->
  <rect x="30" y="138" width="200" height="52" rx="4" fill="#eceff1"/>
  <text x="130" y="169" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#37474f" text-anchor="middle">Naming</text>

  <rect x="240" y="138" width="490" height="52" rx="4" fill="#e3f2fd"/>
  <text x="485" y="159" font-family="monospace" font-size="13" fill="#1565c0" text-anchor="middle">/name  (e.g., /myqueue)</text>
  <text x="485" y="180" font-family="Arial,sans-serif" font-size="12" fill="#555" text-anchor="middle">Filesystem-like path in /dev/shm or mqueue</text>

  <rect x="740" y="138" width="510" height="52" rx="4" fill="#eceff1"/>
  <text x="995" y="159" font-family="monospace" font-size="13" fill="#455a64" text-anchor="middle">Integer key (ftok() or IPC_PRIVATE)</text>
  <text x="995" y="180" font-family="Arial,sans-serif" font-size="12" fill="#555" text-anchor="middle">Opaque numeric ID, not human-readable</text>

  <!-- Access -->
  <rect x="30" y="196" width="200" height="52" rx="4" fill="#f5f5f5"/>
  <text x="130" y="227" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#37474f" text-anchor="middle">Access model</text>

  <rect x="240" y="196" width="490" height="52" rx="4" fill="#e8f5e9"/>
  <text x="485" y="217" font-family="Arial,sans-serif" font-size="13" fill="#2e7d32" text-anchor="middle">File descriptor (fd-based)</text>
  <text x="485" y="238" font-family="Arial,sans-serif" font-size="12" fill="#555" text-anchor="middle">Works with select(), poll(), epoll()</text>

  <rect x="740" y="196" width="510" height="52" rx="4" fill="#f5f5f5"/>
  <text x="995" y="217" font-family="Arial,sans-serif" font-size="13" fill="#455a64" text-anchor="middle">Integer IPC identifier</text>
  <text x="995" y="238" font-family="Arial,sans-serif" font-size="12" fill="#555" text-anchor="middle">Cannot use with select/poll/epoll</text>

  <!-- Message Queue API -->
  <rect x="30" y="254" width="200" height="68" rx="4" fill="#eceff1"/>
  <text x="130" y="280" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#37474f" text-anchor="middle">Message</text>
  <text x="130" y="298" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#37474f" text-anchor="middle">Queue API</text>

  <rect x="240" y="254" width="490" height="68" rx="4" fill="#e3f2fd"/>
  <text x="260" y="277" font-family="monospace" font-size="12" fill="#1565c0">mq_open("/q", O_RDWR|O_CREAT, 0666, &amp;attr)</text>
  <text x="260" y="297" font-family="monospace" font-size="12" fill="#555">mq_send(fd, buf, len, prio)</text>
  <text x="260" y="315" font-family="monospace" font-size="12" fill="#555">mq_receive(fd, buf, maxlen, &amp;prio)</text>

  <rect x="740" y="254" width="510" height="68" rx="4" fill="#eceff1"/>
  <text x="760" y="277" font-family="monospace" font-size="12" fill="#455a64">msgget(key, IPC_CREAT|0666)</text>
  <text x="760" y="297" font-family="monospace" font-size="12" fill="#555">msgsnd(id, &amp;msg, size, flags)</text>
  <text x="760" y="315" font-family="monospace" font-size="12" fill="#555">msgrcv(id, &amp;msg, size, type, flags)</text>

  <!-- Semaphore API -->
  <rect x="30" y="328" width="200" height="68" rx="4" fill="#f5f5f5"/>
  <text x="130" y="354" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#37474f" text-anchor="middle">Semaphore</text>
  <text x="130" y="372" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#37474f" text-anchor="middle">API</text>

  <rect x="240" y="328" width="490" height="68" rx="4" fill="#e8f5e9"/>
  <text x="260" y="350" font-family="monospace" font-size="12" fill="#2e7d32">sem_open("/sem", O_CREAT, 0666, 1)</text>
  <text x="260" y="370" font-family="monospace" font-size="12" fill="#555">sem_wait(sem)  /  sem_post(sem)</text>
  <text x="260" y="388" font-family="monospace" font-size="12" fill="#555">sem_init(&amp;sem, shared, value)  (unnamed)</text>

  <rect x="740" y="328" width="510" height="68" rx="4" fill="#f5f5f5"/>
  <text x="760" y="350" font-family="monospace" font-size="12" fill="#455a64">semget(key, nsems, IPC_CREAT|0666)</text>
  <text x="760" y="370" font-family="monospace" font-size="12" fill="#555">semop(id, &amp;sops, nsops)</text>
  <text x="760" y="388" font-family="monospace" font-size="12" fill="#555">semctl(id, num, SETVAL, 1)</text>

  <!-- Shared Memory API -->
  <rect x="30" y="402" width="200" height="68" rx="4" fill="#eceff1"/>
  <text x="130" y="428" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#37474f" text-anchor="middle">Shared</text>
  <text x="130" y="446" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#37474f" text-anchor="middle">Memory API</text>

  <rect x="240" y="402" width="490" height="68" rx="4" fill="#e3f2fd"/>
  <text x="260" y="424" font-family="monospace" font-size="12" fill="#1565c0">shm_open("/shm", O_RDWR|O_CREAT, 0666)</text>
  <text x="260" y="444" font-family="monospace" font-size="12" fill="#555">ftruncate(fd, size)</text>
  <text x="260" y="464" font-family="monospace" font-size="12" fill="#555">mmap(NULL, size, PROT_RW, MAP_SHARED, fd, 0)</text>

  <rect x="740" y="402" width="510" height="68" rx="4" fill="#eceff1"/>
  <text x="760" y="424" font-family="monospace" font-size="12" fill="#455a64">shmget(key, size, IPC_CREAT|0666)</text>
  <text x="760" y="444" font-family="monospace" font-size="12" fill="#555">shmat(id, NULL, 0)  →  ptr</text>
  <text x="760" y="464" font-family="monospace" font-size="12" fill="#555">shmdt(ptr)</text>

  <!-- Cleanup -->
  <rect x="30" y="476" width="200" height="52" rx="4" fill="#f5f5f5"/>
  <text x="130" y="507" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#37474f" text-anchor="middle">Cleanup</text>

  <rect x="240" y="476" width="490" height="52" rx="4" fill="#e8f5e9"/>
  <text x="260" y="498" font-family="monospace" font-size="12" fill="#2e7d32">mq_unlink("/q")   sem_unlink("/sem")</text>
  <text x="260" y="518" font-family="monospace" font-size="12" fill="#555">shm_unlink("/shm")   munmap(ptr, size)</text>

  <rect x="740" y="476" width="510" height="52" rx="4" fill="#f5f5f5"/>
  <text x="760" y="498" font-family="monospace" font-size="12" fill="#455a64">msgctl / semctl / shmctl with IPC_RMID</text>
  <text x="760" y="518" font-family="monospace" font-size="12" fill="#555">ipcrm -q / -s / -m  or  ipcrm --all</text>

  <!-- Advantages row -->
  <rect x="30" y="534" width="200" height="52" rx="4" fill="#eceff1"/>
  <text x="130" y="565" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#37474f" text-anchor="middle">Verdict</text>

  <rect x="240" y="534" width="490" height="52" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="485" y="555" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#1b5e20" text-anchor="middle">Preferred for new code</text>
  <text x="485" y="575" font-family="Arial,sans-serif" font-size="12" fill="#333" text-anchor="middle">POSIX.1-2001 standard, cleaner API, fd-based</text>

  <rect x="740" y="534" width="510" height="52" rx="4" fill="#fff9c4" stroke="#f9a825" stroke-width="1"/>
  <text x="995" y="555" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#f57f17" text-anchor="middle">Legacy (pre-POSIX)</text>
  <text x="995" y="575" font-family="Arial,sans-serif" font-size="12" fill="#333" text-anchor="middle">Still widely used, complex semaphore API</text>

  <!-- Bottom note -->
  <rect x="30" y="608" width="1220" height="68" rx="8" fill="#e8eaf6" filter="url(#shadow)" stroke="#3949ab" stroke-width="1"/>
  <text x="640" y="630" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#1a237e" text-anchor="middle">Practical notes for Linux systems programming:</text>
  <text x="640" y="652" font-family="Arial,sans-serif" font-size="12" fill="#333" text-anchor="middle">Link with -lrt for POSIX IPC (mq_*, shm_*) and -lpthread for sem_*  •  POSIX named objects appear under /dev/shm  •  mq_notify() enables async notification</text>
  <text x="640" y="670" font-family="Arial,sans-serif" font-size="12" fill="#555" text-anchor="middle">Both survive process death until explicitly deleted — always clean up in signal handlers and at-exit</text>
</svg>

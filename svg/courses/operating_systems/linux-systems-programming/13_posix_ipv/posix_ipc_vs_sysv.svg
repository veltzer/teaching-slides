  <ns0:text x="231.1111" y="412.4444" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">mmap(NULL, size, PROT_RW, MAP_SHARED, fd, 0)</ns0:text>
  <ns0:rect x="657.7778" y="357.3333" width="453.3333" height="60.4444" rx="3.5556" fill="var(--surface-alt)" />
  <ns0:text x="675.5556" y="376.8889" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">shmget(key, size, IPC_CREAT|0666)</ns0:text>
  <ns0:text x="675.5556" y="394.6667" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">shmat(id, NULL, 0)  →  ptr</ns0:text>
  <ns0:text x="675.5556" y="412.4444" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">shmdt(ptr)</ns0:text>
  <ns0:rect x="26.6667" y="423.1111" width="177.7778" height="46.2222" rx="3.5556" fill="var(--surface)" />
  <ns0:text x="115.5556" y="450.6667" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--text-muted)" text-anchor="middle">Cleanup</ns0:text>
  <ns0:rect x="213.3333" y="423.1111" width="435.5556" height="46.2222" rx="3.5556" fill="var(--ok-pale)" />
  <ns0:text x="231.1111" y="442.6667" font-family="monospace" font-size="10.6667" fill="var(--ok-dk)">mq_unlink("/q")   sem_unlink("/sem")</ns0:text>
  <ns0:text x="231.1111" y="460.4444" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">shm_unlink("/shm")   munmap(ptr, size)</ns0:text>
  <ns0:rect x="657.7778" y="423.1111" width="453.3333" height="46.2222" rx="3.5556" fill="var(--surface)" />
  <ns0:text x="675.5556" y="442.6667" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">msgctl / semctl / shmctl with IPC_RMID</ns0:text>
  <ns0:text x="675.5556" y="460.4444" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">ipcrm -q / -s / -m  or  ipcrm --all</ns0:text>
  <ns0:rect x="26.6667" y="474.6667" width="177.7778" height="46.2222" rx="3.5556" fill="var(--surface-alt)" />
  <ns0:text x="115.5556" y="502.2222" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--text-muted)" text-anchor="middle">Verdict</ns0:text>
  <ns0:rect x="213.3333" y="474.6667" width="435.5556" height="46.2222" rx="3.5556" fill="var(--ok-lt)" stroke="var(--ok-dk)" stroke-width="0.8889" />
  <ns0:text x="431.1111" y="493.3333" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--ok-deep)" text-anchor="middle">Preferred for new code</ns0:text>
  <ns0:text x="431.1111" y="511.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-dark)" text-anchor="middle">POSIX.1-2001 standard, cleaner API, fd-based</ns0:text>
  <ns0:rect x="657.7778" y="474.6667" width="453.3333" height="46.2222" rx="3.5556" fill="var(--warn-pale4)" stroke="var(--warn-amber)" stroke-width="0.8889" />
  <ns0:text x="884.4444" y="493.3333" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--warn-mid)" text-anchor="middle">Legacy (pre-POSIX)</ns0:text>
  <ns0:text x="884.4444" y="511.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-dark)" text-anchor="middle">Still widely used, complex semaphore API</ns0:text>
  <ns0:rect x="26.6667" y="540.4444" width="1084.4444" height="60.4444" rx="7.1111" fill="var(--info-indigo-lt)" filter="url(#shadow)" stroke="var(--primary-indigo)" stroke-width="0.8889" />
  <ns0:text x="568.8889" y="560" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--primary-deeper)" text-anchor="middle">Practical notes for Linux systems programming:</ns0:text>
  <ns0:text x="568.8889" y="579.5556" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-dark)" text-anchor="middle">Link with -lrt for POSIX IPC (mq_*, shm_*) and -lpthread for sem_*  •  POSIX named objects appear under /dev/shm  •  mq_notify() enables async notification</ns0:text>
  <ns0:text x="568.8889" y="595.5556" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)" text-anchor="middle">Both survive process death until explicitly deleted — always clean up in signal handlers and at-exit</ns0:text>
</ns0:svg>
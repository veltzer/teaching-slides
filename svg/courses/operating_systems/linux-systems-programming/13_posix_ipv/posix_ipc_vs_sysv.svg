  <ns0:rect width="1137.7778" height="640" fill="var(--bg)" />
  <ns0:rect x="26.6667" y="17.7778" width="1084.4444" height="44.4444" rx="7.1111" fill="var(--text-muted)" />
  <ns0:text x="568.8889" y="46.2222" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="var(--bg)" text-anchor="middle">POSIX IPC vs System V IPC — Comparison</ns0:text>
  <ns0:rect x="26.6667" y="78.2222" width="177.7778" height="37.3333" rx="5.3333" fill="var(--text-mid)" />
  <ns0:text x="115.5556" y="101.3333" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--bg)" text-anchor="middle">Feature</ns0:text>
  <ns0:rect x="213.3333" y="78.2222" width="435.5556" height="37.3333" rx="5.3333" fill="url(#grad-primary)" />
  <ns0:text x="431.1111" y="101.3333" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--bg)" text-anchor="middle">POSIX IPC</ns0:text>
  <ns0:rect x="657.7778" y="78.2222" width="453.3333" height="37.3333" rx="5.3333" fill="var(--text-muted)" />
  <ns0:text x="884.4444" y="101.3333" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--bg)" text-anchor="middle">System V IPC</ns0:text>
  <ns0:rect x="26.6667" y="122.6667" width="177.7778" height="46.2222" rx="3.5556" fill="var(--surface-alt)" />
  <ns0:text x="115.5556" y="150.2222" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--text-muted)" text-anchor="middle">Naming</ns0:text>
  <ns0:rect x="213.3333" y="122.6667" width="435.5556" height="46.2222" rx="3.5556" fill="var(--primary-pale)" />
  <ns0:text x="431.1111" y="141.3333" font-family="monospace" font-size="11.5556" fill="var(--primary-dk)" text-anchor="middle">/name  (e.g., /myqueue)</ns0:text>
  <ns0:text x="431.1111" y="160" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)" text-anchor="middle">Filesystem-like path in /dev/shm or mqueue</ns0:text>
  <ns0:rect x="657.7778" y="122.6667" width="453.3333" height="46.2222" rx="3.5556" fill="var(--surface-alt)" />
  <ns0:text x="884.4444" y="141.3333" font-family="monospace" font-size="11.5556" fill="var(--text-muted)" text-anchor="middle">Integer key (ftok() or IPC_PRIVATE)</ns0:text>
  <ns0:text x="884.4444" y="160" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)" text-anchor="middle">Opaque numeric ID, not human-readable</ns0:text>
  <ns0:rect x="26.6667" y="174.2222" width="177.7778" height="46.2222" rx="3.5556" fill="var(--surface)" />
  <ns0:text x="115.5556" y="201.7778" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--text-muted)" text-anchor="middle">Access model</ns0:text>
  <ns0:rect x="213.3333" y="174.2222" width="435.5556" height="46.2222" rx="3.5556" fill="var(--ok-pale)" />
  <ns0:text x="431.1111" y="192.8889" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--ok-dk)" text-anchor="middle">File descriptor (fd-based)</ns0:text>
  <ns0:text x="431.1111" y="211.5556" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)" text-anchor="middle">Works with select(), poll(), epoll()</ns0:text>
  <ns0:rect x="657.7778" y="174.2222" width="453.3333" height="46.2222" rx="3.5556" fill="var(--surface)" />
  <ns0:text x="884.4444" y="192.8889" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text-muted)" text-anchor="middle">Integer IPC identifier</ns0:text>
  <ns0:text x="884.4444" y="211.5556" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)" text-anchor="middle">Cannot use with select/poll/epoll</ns0:text>
  <ns0:rect x="26.6667" y="225.7778" width="177.7778" height="60.4444" rx="3.5556" fill="var(--surface-alt)" />

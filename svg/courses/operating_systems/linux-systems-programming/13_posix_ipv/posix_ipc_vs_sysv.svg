<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="1199.999895" height="44.207244" rx="6.438589" fill="var(--text-muted)" />
  <text x="640" y="68.292715" font-size="16.785938" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">POSIX IPC vs System V IPC — Comparison</text>
  <rect x="40" y="100.121992" width="196.721311" height="37.13412" rx="6.438589" fill="var(--text-muted)" />
  <text x="138.360656" y="123.109754" font-size="13.055634" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">Feature</text>
  <rect x="246.557377" y="100.121992" width="481.967213" height="37.13412" rx="6.438589" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="487.540984" y="123.109754" font-size="13.055634" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">POSIX IPC</text>
  <rect x="738.360656" y="100.121992" width="501.639344" height="37.13412" rx="6.438589" fill="var(--text-muted)" />
  <text x="989.180223" y="123.109754" font-size="13.055634" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">System V IPC</text>
  <rect x="40" y="144.329346" width="196.721311" height="45.975635" rx="6.438589" fill="var(--surface)" />
  <text x="138.360656" y="171.737865" font-size="12.123219" font-weight="bold" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Naming</text>
  <rect x="246.557377" y="144.329346" width="481.967213" height="45.975635" rx="6.438589" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="487.540984" y="162.896351" font-size="12.123219" fill="var(--primary-accent)" text-anchor="middle" font-family="Courier New, monospace">/name  (e.g., /myqueue)</text>
  <text x="487.540984" y="181.463465" font-size="11.190697" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Filesystem-like path in /dev/shm or mqueue</text>
  <rect x="738.360656" y="144.329346" width="501.639344" height="45.975635" rx="6.438589" fill="var(--surface)" />
  <text x="989.180223" y="162.896351" font-size="12.123219" fill="var(--text-muted)" text-anchor="middle" font-family="Courier New, monospace">Integer key (ftok() or IPC_PRIVATE)</text>
  <text x="989.180223" y="181.463465" font-size="11.190697" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Opaque numeric ID, not human-readable</text>
  <rect x="40" y="195.609823" width="196.721311" height="45.975635" rx="6.438589" fill="var(--surface)" />
  <text x="138.360656" y="223.018343" font-size="12.123219" font-weight="bold" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Access model</text>
  <rect x="246.557377" y="195.609823" width="481.967213" height="45.975635" rx="6.438589" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="487.540984" y="214.176938" font-size="12.123219" fill="var(--ok-accent)" text-anchor="middle" font-family="Arial, sans-serif">File descriptor (fd-based)</text>
  <text x="487.540984" y="232.744053" font-size="11.190697" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Works with select(), poll(), epoll()</text>
  <rect x="738.360656" y="195.609823" width="501.639344" height="45.975635" rx="6.438589" fill="var(--surface)" />
  <text x="989.180223" y="214.176938" font-size="12.123219" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Integer IPC identifier</text>
  <text x="989.180223" y="232.744053" font-size="11.190697" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Cannot use with select/poll/epoll</text>
  <rect x="40" y="246.8903" width="196.721311" height="60.121882" rx="6.438589" fill="var(--surface)" />
  <text x="138.360656" y="269.878173" font-size="12.123219" font-weight="bold" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Message</text>
  <text x="138.360656" y="285.792811" font-size="12.123219" font-weight="bold" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Queue API</text>
  <rect x="246.557377" y="246.8903" width="481.967213" height="60.121882" rx="6.438589" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="266.229508" y="267.225696" font-size="11.190697" fill="var(--primary-accent)" font-family="Courier New, monospace">mq_open("/q", O_RDWR|O_CREAT, 0666, &amp;attr)</text>
  <text x="266.229508" y="284.908616" font-size="11.190697" fill="var(--text-muted)" font-family="Courier New, monospace">mq_send(fd, buf, len, prio)</text>
  <text x="266.229508" y="300.823254" font-size="11.190697" fill="var(--text-muted)" font-family="Courier New, monospace">mq_receive(fd, buf, maxlen, &amp;prio)</text>
  <rect x="738.360656" y="246.8903" width="501.639344" height="60.121882" rx="6.438589" fill="var(--surface)" />
  <text x="758.032787" y="267.225696" font-size="11.190697" fill="var(--text-muted)" font-family="Courier New, monospace">msgget(key, IPC_CREAT|0666)</text>
  <text x="758.032787" y="284.908616" font-size="11.190697" fill="var(--text-muted)" font-family="Courier New, monospace">msgsnd(id, &amp;msg, size, flags)</text>
  <text x="758.032787" y="300.823254" font-size="11.190697" fill="var(--text-muted)" font-family="Courier New, monospace">msgrcv(id, &amp;msg, size, type, flags)</text>
  <rect x="40" y="312.317245" width="196.721311" height="60.121882" rx="6.438589" fill="var(--surface)" />
  <text x="138.360656" y="335.305008" font-size="12.123219" font-weight="bold" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Semaphore</text>
  <text x="138.360656" y="351.219646" font-size="12.123219" font-weight="bold" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">API</text>
  <rect x="246.557377" y="312.317245" width="481.967213" height="60.121882" rx="6.438589" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="266.229508" y="331.768336" font-size="11.190697" fill="var(--ok-accent)" font-family="Courier New, monospace">sem_open("/sem", O_CREAT, 0666, 1)</text>
  <text x="266.229508" y="349.451365" font-size="11.190697" fill="var(--text-muted)" font-family="Courier New, monospace">sem_wait(sem)  /  sem_post(sem)</text>
  <text x="266.229508" y="365.366004" font-size="11.190697" fill="var(--text-muted)" font-family="Courier New, monospace">sem_init(&amp;sem, shared, value)  (unnamed)</text>
  <rect x="738.360656" y="312.317245" width="501.639344" height="60.121882" rx="6.438589" fill="var(--surface)" />
  <text x="758.032787" y="331.768336" font-size="11.190697" fill="var(--text-muted)" font-family="Courier New, monospace">semget(key, nsems, IPC_CREAT|0666)</text>
  <text x="758.032787" y="349.451365" font-size="11.190697" fill="var(--text-muted)" font-family="Courier New, monospace">semop(id, &amp;sops, nsops)</text>
  <text x="758.032787" y="365.366004" font-size="11.190697" fill="var(--text-muted)" font-family="Courier New, monospace">semctl(id, num, SETVAL, 1)</text>
  <rect x="40" y="377.74397" width="196.721311" height="60.121882" rx="6.438589" fill="var(--surface)" />
  <text x="138.360656" y="400.731733" font-size="12.123219" font-weight="bold" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Shared</text>
  <text x="138.360656" y="416.646371" font-size="12.123219" font-weight="bold" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Memory API</text>
  <rect x="246.557377" y="377.74397" width="481.967213" height="60.121882" rx="6.438589" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="266.229508" y="397.195281" font-size="11.190697" fill="var(--primary-accent)" font-family="Courier New, monospace">shm_open("/shm", O_RDWR|O_CREAT, 0666)</text>
  <text x="266.229508" y="414.8782" font-size="11.190697" fill="var(--text-muted)" font-family="Courier New, monospace">ftruncate(fd, size)</text>
  <text x="266.229508" y="432.56101" font-size="11.190697" fill="var(--text-muted)" font-family="Courier New, monospace">mmap(NULL, size, PROT_RW, MAP_SHARED, fd, 0)</text>
  <rect x="738.360656" y="377.74397" width="501.639344" height="60.121882" rx="6.438589" fill="var(--surface)" />
  <text x="758.032787" y="397.195281" font-size="11.190697" fill="var(--text-muted)" font-family="Courier New, monospace">shmget(key, size, IPC_CREAT|0666)</text>
  <text x="758.032787" y="414.8782" font-size="11.190697" fill="var(--text-muted)" font-family="Courier New, monospace">shmat(id, NULL, 0)  →  ptr</text>
  <text x="758.032787" y="432.56101" font-size="11.190697" fill="var(--text-muted)" font-family="Courier New, monospace">shmdt(ptr)</text>
  <rect x="40" y="443.170805" width="196.721311" height="45.975635" rx="6.438589" fill="var(--surface)" />
  <text x="138.360656" y="470.579435" font-size="12.123219" font-weight="bold" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Cleanup</text>
  <rect x="246.557377" y="443.170805" width="481.967213" height="45.975635" rx="6.438589" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="266.229508" y="462.622116" font-size="11.190697" fill="var(--ok-accent)" font-family="Courier New, monospace">mq_unlink("/q")   sem_unlink("/sem")</text>
  <text x="266.229508" y="480.304925" font-size="11.190697" fill="var(--text-muted)" font-family="Courier New, monospace">shm_unlink("/shm")   munmap(ptr, size)</text>
  <rect x="738.360656" y="443.170805" width="501.639344" height="45.975635" rx="6.438589" fill="var(--surface)" />
  <text x="758.032787" y="462.622116" font-size="11.190697" fill="var(--text-muted)" font-family="Courier New, monospace">msgctl / semctl / shmctl with IPC_RMID</text>
  <text x="758.032787" y="480.304925" font-size="11.190697" fill="var(--text-muted)" font-family="Courier New, monospace">ipcrm -q / -s / -m  or  ipcrm --all</text>
  <rect x="40" y="494.451393" width="196.721311" height="45.975635" rx="6.438589" fill="var(--surface)" />
  <text x="138.360656" y="521.859912" font-size="12.123219" font-weight="bold" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Verdict</text>
  <rect x="246.557377" y="494.451393" width="481.967213" height="45.975635" rx="6.438589" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="487.540984" y="513.018398" font-size="12.123219" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle" font-family="Arial, sans-serif">Preferred for new code</text>
  <text x="487.540984" y="530.701317" font-size="11.190697" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">POSIX.1-2001 standard, cleaner API, fd-based</text>
  <rect x="738.360656" y="494.451393" width="501.639344" height="45.975635" rx="6.438589" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="989.180223" y="513.018398" font-size="12.123219" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle" font-family="Arial, sans-serif">Legacy (pre-POSIX)</text>
  <text x="989.180223" y="530.701317" font-size="11.190697" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Still widely used, complex semaphore API</text>
  <rect x="40" y="559.878118" width="1199.999895" height="60.121882" rx="6.438589" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="579.329428" font-size="13.055634" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">Practical notes for Linux systems programming:</text>
  <text x="640" y="598.780738" font-size="11.190697" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Link with -lrt for POSIX IPC (mq_*, shm_*) and -lpthread for sem_*  •  POSIX named objects appear under /dev/shm  •  mq_notify() enables async notification</text>
  <text x="640" y="614.695377" font-size="11.190697" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Both survive process death until explicitly deleted — always clean up in signal handlers and at-exit</text>
</svg>
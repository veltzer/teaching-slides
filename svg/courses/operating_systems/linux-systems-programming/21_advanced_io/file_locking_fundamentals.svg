  <text x="419.6721" y="87.2951" font-size="25.7049" font-weight="bold" text-anchor="middle">File Locking</text>
  <rect x="52.459" y="164.7541" width="146.8852" height="77.459" fill="var(--primary-fill)" stroke="var(--primary-border)" rx="6.3689" stroke-width="1.3115" />
  <text x="125.9016" y="216.3935" font-size="18.3607" text-anchor="middle">Process A</text>
  <rect x="327.8688" y="164.7541" width="183.6066" height="77.459" fill="var(--warn-fill)" stroke="var(--warn-border)" rx="6.3689" stroke-width="1.3115" />
  <text x="419.6721" y="216.3935" font-size="18.3607" text-anchor="middle">Locked File</text>
  <rect x="640" y="164.7541" width="146.8852" height="77.459" fill="var(--danger-fill)" stroke="var(--danger-border)" rx="6.3689" stroke-width="1.3115" />
  <text x="713.4426" y="216.3935" font-size="18.3607" text-anchor="middle">Process B</text>
  <path d="M 199.3443 203.4836 L 327.8688 203.4836" stroke="var(--ok-border)" stroke-width="2.2685" />
  <text x="263.6066" y="190.5738" font-size="18.3607">LOCK</text>
  <path d="M 511.4753 203.4836 L 640 203.4836" stroke="var(--danger-border)" stroke-width="2.2685" stroke-dasharray="5.6712 5.6712" />
  <text x="575.7377" y="190.5738" font-size="18.3607">BLOCKED</text>
  <text x="419.6721" y="345.4918" font-size="22.0329" text-anchor="middle">Advisory vs Mandatory Locking</text>

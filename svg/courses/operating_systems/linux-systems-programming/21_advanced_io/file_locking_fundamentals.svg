<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" font-size="35.84" font-weight="bold" text-anchor="middle">File Locking</text>
  <rect x="128" y="180" width="204.8" height="108" fill="lightblue" stroke="black" />
  <text x="230.4" y="252" font-size="25.6" text-anchor="middle">Process A</text>
  <rect x="512" y="180" width="256" height="108" fill="yellow" stroke="black" />
  <text x="640" y="252" font-size="25.6" text-anchor="middle">Locked File</text>
  <rect x="947.2" y="180" width="204.8" height="108" fill="lightcoral" stroke="black" />
  <text x="1049.6" y="252" font-size="25.6" text-anchor="middle">Process B</text>
  <path d="M 332.8 234 L 512 234" stroke="green" stroke-width="5.12" />
  <text x="422.4" y="216" font-size="25.6">LOCK</text>
  <path d="M 768 234 L 947.2 234" stroke="red" stroke-width="5.12" stroke-dasharray="12.8 12.8" />
  <text x="857.6" y="216" font-size="25.6">BLOCKED</text>
  <text x="640" y="432" font-size="30.72" text-anchor="middle">Advisory vs Mandatory Locking</text>
</svg>
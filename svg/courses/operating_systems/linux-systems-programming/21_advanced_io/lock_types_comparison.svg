<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" font-size="35.84" font-weight="bold" text-anchor="middle">fcntl() vs flock()</text>
  <rect x="128" y="180" width="384" height="432" fill="lightblue" stroke="black" />
  <text x="320" y="252" font-size="30.72" font-weight="bold" text-anchor="middle">fcntl()</text>
  <text x="320" y="324" font-size="25.6" text-anchor="middle">• POSIX standard</text>
  <text x="320" y="378" font-size="25.6" text-anchor="middle">• Record locking</text>
  <text x="320" y="432" font-size="25.6" text-anchor="middle">• Works over NFS</text>
  <text x="320" y="486" font-size="25.6" text-anchor="middle">• More complex</text>
  <text x="320" y="540" font-size="25.6" text-anchor="middle">• Byte-range locks</text>
  <rect x="768" y="180" width="384" height="432" fill="lightgreen" stroke="black" />
  <text x="960" y="252" font-size="30.72" font-weight="bold" text-anchor="middle">flock()</text>
  <text x="960" y="324" font-size="25.6" text-anchor="middle">• BSD style</text>
  <text x="960" y="378" font-size="25.6" text-anchor="middle">• Whole file only</text>
  <text x="960" y="432" font-size="25.6" text-anchor="middle">• Local filesystems</text>
  <text x="960" y="486" font-size="25.6" text-anchor="middle">• Simpler API</text>
  <text x="960" y="540" font-size="25.6" text-anchor="middle">• Process-associated</text>
</svg>
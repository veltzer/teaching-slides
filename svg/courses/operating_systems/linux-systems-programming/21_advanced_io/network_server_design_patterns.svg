<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <text x="640" y="48" font-size="33.6" font-weight="bold" text-anchor="middle">Server Architecture Patterns</text>
  <rect x="128" y="120" width="307.2" height="144" fill="lightblue" stroke="black" />
  <text x="281.6" y="180" font-size="24" text-anchor="middle">Thread-per-</text>
  <text x="281.6" y="216" font-size="24" text-anchor="middle">Connection</text>
  <text x="281.6" y="312" font-size="24" text-anchor="middle">Simple, limited scale</text>
  <rect x="512" y="120" width="307.2" height="144" fill="yellow" stroke="black" />
  <text x="665.6" y="180" font-size="24" text-anchor="middle">Thread Pool</text>
  <text x="665.6" y="216" font-size="24" text-anchor="middle">+ Event Loop</text>
  <text x="665.6" y="312" font-size="24" text-anchor="middle">Good balance</text>
  <rect x="896" y="120" width="307.2" height="144" fill="lightgreen" stroke="black" />
  <text x="1049.6" y="180" font-size="24" text-anchor="middle">Async I/O</text>
  <text x="1049.6" y="216" font-size="24" text-anchor="middle">Single Thread</text>
  <text x="1049.6" y="312" font-size="24" text-anchor="middle">Highest scale</text>
  <rect x="128" y="432" width="307.2" height="144" fill="lightcoral" stroke="black" />
  <text x="281.6" y="492" font-size="24" text-anchor="middle">Process Pool</text>
  <text x="281.6" y="528" font-size="24" text-anchor="middle">(Pre-fork)</text>
  <text x="281.6" y="624" font-size="24" text-anchor="middle">Isolation, overhead</text>
  <rect x="896" y="432" width="307.2" height="144" fill="orange" stroke="black" />
  <text x="1049.6" y="492" font-size="24" text-anchor="middle">Hybrid</text>
  <text x="1049.6" y="528" font-size="24" text-anchor="middle">Multi-threaded</text>
  <text x="1049.6" y="624" font-size="24" text-anchor="middle">Best performance</text>
</svg>
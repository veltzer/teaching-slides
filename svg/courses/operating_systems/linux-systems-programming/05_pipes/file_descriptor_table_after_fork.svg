<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="512" y="43.2" text-anchor="middle" font-size="20.48" font-weight="bold">After pipe() and fork()</text>
  <rect x="64" y="86.4" width="192" height="216" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="160" y="72" text-anchor="middle" font-size="15.36">Parent FD Table</text>
  <text x="76.8" y="122.4" font-size="12.8">0: stdin</text>
  <text x="76.8" y="151.2" font-size="12.8">1: stdout</text>
  <text x="76.8" y="180" font-size="12.8">2: stderr</text>
  <text x="76.8" y="208.8" font-size="12.8">3: pipe_read</text>
  <text x="76.8" y="237.6" font-size="12.8">4: pipe_write</text>
  <rect x="320" y="86.4" width="192" height="216" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6"/>
  <text x="416" y="72" text-anchor="middle" font-size="15.36">Child FD Table</text>
  <text x="332.8" y="122.4" font-size="12.8">0: stdin</text>
  <text x="332.8" y="151.2" font-size="12.8">1: stdout</text>
  <text x="332.8" y="180" font-size="12.8">2: stderr</text>
  <text x="332.8" y="208.8" font-size="12.8">3: pipe_read</text>
  <text x="332.8" y="237.6" font-size="12.8">4: pipe_write</text>
  <rect x="640" y="144" width="153.6" height="115.2" fill="var(--text-faint)" stroke="var(--text)" stroke-width="2.56" rx="6"/>
  <text x="716.8" y="129.6" text-anchor="middle" font-size="15.36">Pipe Object</text>
  <text x="652.8" y="187.2" font-size="12.8">Read end</text>
  <text x="652.8" y="216" font-size="12.8">Write end</text>
  <text x="652.8" y="244.8" font-size="12.8">Buffer</text>
  <path d="M 256 208.8 Q 448 172.8 640 187.2" stroke="var(--text)" stroke-width="1.28" stroke-dasharray="6.4 6.4" />
  <path d="M 256 237.6 Q 448 259.2 640 216" stroke="var(--text)" stroke-width="1.28" stroke-dasharray="6.4 6.4" />
  <path d="M 512 208.8 Q 576 172.8 640 187.2" stroke="var(--text)" stroke-width="1.28" stroke-dasharray="6.4 6.4" />
  <path d="M 512 237.6 Q 576 259.2 640 216" stroke="var(--text)" stroke-width="1.28" stroke-dasharray="6.4 6.4" />
  <text x="512" y="360" text-anchor="middle" font-size="15.36" font-weight="bold">Must close unused ends!</text>
</svg>
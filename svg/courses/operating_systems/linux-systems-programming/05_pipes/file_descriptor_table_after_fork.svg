<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="69.000071500004" width="315.7895" height="434.999862499993" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.292853251767" filter="url(#shadow)"/>
  <text x="197.8947" y="40" text-anchor="middle" font-size="27.954742000325" font-family="Arial, sans-serif" fill="var(--text)">Parent FD Table</text>
  <text x="61.0526" y="141.499975249999" font-size="23.295723214492" font-family="Arial, sans-serif" fill="var(--primary-text)">0: stdin</text>
  <text x="61.0526" y="199.50000825" font-size="23.295723214492" font-family="Arial, sans-serif" fill="var(--primary-text)">1: stdout</text>
  <text x="61.0526" y="257.500041250002" font-size="23.295723214492" font-family="Arial, sans-serif" fill="var(--primary-text)">2: stderr</text>
  <text x="61.0526" y="315.499854249992" font-size="23.295723214492" font-family="Arial, sans-serif" fill="var(--primary-text)">3: pipe_read</text>
  <text x="61.0526" y="373.500107250005" font-size="23.295723214492" font-family="Arial, sans-serif" fill="var(--primary-text)">4: pipe_write</text>
  <rect x="461.0527" y="69.000071500004" width="315.7895" height="434.999862499993" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.292853251767" filter="url(#shadow)"/>
  <text x="618.9474" y="40" text-anchor="middle" font-size="27.954742000325" font-family="Arial, sans-serif" fill="var(--text)">Child FD Table</text>
  <text x="482.1053" y="141.499975249999" font-size="23.295723214492" font-family="Arial, sans-serif" fill="var(--danger-text)">0: stdin</text>
  <text x="482.1053" y="199.50000825" font-size="23.295723214492" font-family="Arial, sans-serif" fill="var(--danger-text)">1: stdout</text>
  <text x="482.1053" y="257.500041250002" font-size="23.295723214492" font-family="Arial, sans-serif" fill="var(--danger-text)">2: stderr</text>
  <text x="482.1053" y="315.499854249992" font-size="23.295723214492" font-family="Arial, sans-serif" fill="var(--danger-text)">3: pipe_read</text>
  <text x="482.1053" y="373.500107250005" font-size="23.295723214492" font-family="Arial, sans-serif" fill="var(--danger-text)">4: pipe_write</text>
  <rect x="987.3684" y="184.999917499996" width="252.6316" height="231.999911999995" fill="var(--text-faint)" stroke="var(--text)" stroke-width="1.1279" rx="6.292853251767"/>
  <text x="1113.6842" y="156.000066000003" text-anchor="middle" font-size="27.954742000325" font-family="Arial, sans-serif" fill="var(--text)">Pipe Object</text>
  <text x="1008.421" y="271.999911999995" font-size="23.295723214492" font-family="Arial, sans-serif" fill="var(--text)">Read end</text>
  <text x="1008.421" y="330.000055000003" font-size="23.295723214492" font-family="Arial, sans-serif" fill="var(--text)">Write end</text>
  <text x="1008.421" y="388.000088000005" font-size="23.295723214492" font-family="Arial, sans-serif" fill="var(--text)">Buffer</text>
  <path d="M 355.7895 315.499854249992 Q 671.5789 242.999950499997 987.3684 271.999911999995" stroke="var(--text)" stroke-width="0.5639" stroke-dasharray="2.8196 2.8196"/>
  <path d="M 355.7895 373.500107250005 Q 671.5789 417.000049500003 987.3684 330.000055000003" stroke="var(--text)" stroke-width="0.5639" stroke-dasharray="2.8196 2.8196"/>
  <path d="M 776.8421 315.499854249992 Q 882.1052 242.999950499997 987.3684 271.999911999995" stroke="var(--text)" stroke-width="0.5639" stroke-dasharray="2.8196 2.8196"/>
  <path d="M 776.8421 373.500107250005 Q 882.1052 417.000049500003 987.3684 330.000055000003" stroke="var(--text)" stroke-width="0.5639" stroke-dasharray="2.8196 2.8196"/>
  <text x="776.8421" y="620" text-anchor="middle" font-size="27.954742000325" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Must close unused ends!</text>
</svg>

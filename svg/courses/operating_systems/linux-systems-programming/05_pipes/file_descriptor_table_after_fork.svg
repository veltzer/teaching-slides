  <path d="M 767.7193 385.2632 Q 865.9649 418.4211 964.2105 352.1053" stroke="var(--text)" stroke-width="1.28" stroke-dasharray="6.4 6.4" />
  <text x="767.7193" y="573.1579" text-anchor="middle" font-size="23.5789" font-weight="bold">Must close unused ends!</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <rect x="40" y="40" width="1200" height="80" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="90" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Anatomy of a Pipe</text>

  <rect x="40" y="150" width="320" height="400" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="200" y="210" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Writer Process</text>
  <text x="200" y="300" text-anchor="middle" font-size="20" fill="var(--primary-text)" font-family="Arial, sans-serif">write(fd[1], buf, n)</text>
  <text x="200" y="370" text-anchor="middle" font-size="17" fill="var(--primary-text)" font-family="Arial, sans-serif">blocks if buffer full</text>
  <text x="200" y="400" text-anchor="middle" font-size="17" fill="var(--primary-text)" font-family="Arial, sans-serif">returns bytes written</text>
  <text x="200" y="470" text-anchor="middle" font-size="15" fill="var(--primary-text)" font-family="Arial, sans-serif">SIGPIPE if reader</text>
  <text x="200" y="495" text-anchor="middle" font-size="15" fill="var(--primary-text)" font-family="Arial, sans-serif">closed its end</text>

  <line x1="370" y1="350" x2="450" y2="350" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="410" y="335" text-anchor="middle" font-size="17" fill="var(--text-muted)" font-family="Arial, sans-serif">fd[1]</text>

  <rect x="460" y="150" width="360" height="400" rx="6" fill="var(--surface)" stroke="var(--text)" stroke-width="2"/>
  <text x="640" y="195" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Kernel Buffer</text>
  <text x="640" y="225" text-anchor="middle" font-size="16" fill="var(--text-muted)" font-family="Arial, sans-serif">64 KB circular ring</text>
  <rect x="500" y="250" width="280" height="50" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="283" text-anchor="middle" font-size="18" fill="var(--danger-text)" font-family="Arial, sans-serif">data</text>
  <rect x="500" y="305" width="280" height="50" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="338" text-anchor="middle" font-size="18" fill="var(--danger-text)" font-family="Arial, sans-serif">data</text>
  <rect x="500" y="360" width="280" height="50" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="393" text-anchor="middle" font-size="18" fill="var(--danger-text)" font-family="Arial, sans-serif">data</text>
  <rect x="500" y="415" width="280" height="100" rx="6" fill="var(--border)"/>
  <text x="640" y="470" text-anchor="middle" font-size="18" fill="var(--text-muted)" font-family="Arial, sans-serif">empty</text>

  <line x1="830" y1="350" x2="910" y2="350" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="870" y="335" text-anchor="middle" font-size="17" fill="var(--text-muted)" font-family="Arial, sans-serif">fd[0]</text>

  <rect x="920" y="150" width="320" height="400" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1080" y="210" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Reader Process</text>
  <text x="1080" y="300" text-anchor="middle" font-size="20" fill="var(--ok-text)" font-family="Arial, sans-serif">read(fd[0], buf, n)</text>
  <text x="1080" y="370" text-anchor="middle" font-size="17" fill="var(--ok-text)" font-family="Arial, sans-serif">blocks if buffer empty</text>
  <text x="1080" y="400" text-anchor="middle" font-size="17" fill="var(--ok-text)" font-family="Arial, sans-serif">returns 0 on EOF</text>
  <text x="1080" y="470" text-anchor="middle" font-size="15" fill="var(--ok-text)" font-family="Arial, sans-serif">EOF fires when</text>
  <text x="1080" y="495" text-anchor="middle" font-size="15" fill="var(--ok-text)" font-family="Arial, sans-serif">all writers close fd[1]</text>

  <rect x="40" y="570" width="1200" height="50" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="600" text-anchor="middle" font-size="17" fill="var(--text-muted)" font-family="Arial, sans-serif">PIPE_BUF (4 KB): writes up to that size are atomic, even with multiple writers.</text>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="80" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="90" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--text)">Anatomy of a Pipe</text>

  <rect x="40" y="150" width="320" height="400" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="200" y="210" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--primary-text)">Writer Process</text>
  <text x="200" y="300" text-anchor="middle" font-size="20" fill="var(--primary-text)">write(fd[1], buf, n)</text>
  <text x="200" y="370" text-anchor="middle" font-size="17" fill="var(--primary-text)">blocks if buffer full</text>
  <text x="200" y="400" text-anchor="middle" font-size="17" fill="var(--primary-text)">returns bytes written</text>
  <text x="200" y="470" text-anchor="middle" font-size="15" fill="var(--primary-text)">SIGPIPE if reader</text>
  <text x="200" y="495" text-anchor="middle" font-size="15" fill="var(--primary-text)">closed its end</text>

  <line x1="370" y1="350" x2="450" y2="350" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="410" y="335" text-anchor="middle" font-size="17" fill="var(--text-muted)">fd[1]</text>

  <rect x="460" y="150" width="360" height="400" rx="6" fill="var(--surface)" stroke="var(--text)" stroke-width="2"/>
  <text x="640" y="195" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--text)">Kernel Buffer</text>
  <text x="640" y="225" text-anchor="middle" font-size="16" fill="var(--text-muted)">64 KB circular ring</text>
  <rect x="500" y="250" width="280" height="50" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="640" y="283" text-anchor="middle" font-size="18" fill="var(--danger-text)">data</text>
  <rect x="500" y="305" width="280" height="50" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="640" y="338" text-anchor="middle" font-size="18" fill="var(--danger-text)">data</text>
  <rect x="500" y="360" width="280" height="50" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="640" y="393" text-anchor="middle" font-size="18" fill="var(--danger-text)">data</text>
  <rect x="500" y="415" width="280" height="100" rx="6" fill="var(--border)"/>
  <text x="640" y="470" text-anchor="middle" font-size="18" fill="var(--text-muted)">empty</text>

  <line x1="830" y1="350" x2="910" y2="350" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="870" y="335" text-anchor="middle" font-size="17" fill="var(--text-muted)">fd[0]</text>

  <rect x="920" y="150" width="320" height="400" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1080" y="210" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--ok-text)">Reader Process</text>
  <text x="1080" y="300" text-anchor="middle" font-size="20" fill="var(--ok-text)">read(fd[0], buf, n)</text>
  <text x="1080" y="370" text-anchor="middle" font-size="17" fill="var(--ok-text)">blocks if buffer empty</text>
  <text x="1080" y="400" text-anchor="middle" font-size="17" fill="var(--ok-text)">returns 0 on EOF</text>
  <text x="1080" y="470" text-anchor="middle" font-size="15" fill="var(--ok-text)">EOF fires when</text>
  <text x="1080" y="495" text-anchor="middle" font-size="15" fill="var(--ok-text)">all writers close fd[1]</text>

  <rect x="40" y="570" width="1200" height="50" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="600" text-anchor="middle" font-size="17" fill="var(--text-muted)">PIPE_BUF (4 KB): writes up to that size are atomic, even with multiple writers.</text>

</svg>

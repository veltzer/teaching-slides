<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="80" y="214.4999" width="280" height="210" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="9.625"/>
  <text x="220.0001" y="172.5" text-anchor="middle" font-size="26.1333" font-weight="bold">Writer Process</text>
  <text x="220.0001" y="319.5" text-anchor="middle" fill="var(--bg)" font-size="22.3999">write(fd[1])</text>
  <rect x="546.6666" y="193.5" width="186.6666" height="252" fill="var(--text-faint)" stroke="var(--text)" stroke-width="2.3273" rx="9.625"/>
  <text x="639.9999" y="151.5" text-anchor="middle" font-size="26.1333" font-weight="bold">Kernel Buffer</text>
  <rect x="565.3333" y="214.4999" width="149.3333" height="42" fill="var(--danger-fill)" rx="9.625" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="639.9999" y="246" text-anchor="middle" fill="var(--bg)" font-size="18.6667">data</text>
  <rect x="565.3333" y="256.5001" width="149.3333" height="42" fill="var(--danger-fill)" rx="9.625" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="639.9999" y="288" text-anchor="middle" fill="var(--bg)" font-size="18.6667">data</text>
  <rect x="565.3333" y="298.5" width="149.3333" height="42" fill="var(--danger-fill)" rx="9.625" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="639.9999" y="329.9999" text-anchor="middle" fill="var(--bg)" font-size="18.6667">data</text>
  <rect x="565.3333" y="340.5" width="149.3333" height="83.9999" fill="var(--surface)" rx="9.625"/>
  <text x="639.9999" y="382.5" text-anchor="middle" font-size="18.6667">empty</text>
  <rect x="920" y="214.4999" width="280" height="210" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="9.625"/>
  <text x="1059.9999" y="172.5" text-anchor="middle" font-size="26.1333" font-weight="bold">Reader Process</text>
  <text x="1059.9999" y="319.5" text-anchor="middle" fill="var(--bg)" font-size="22.3999">read(fd[0])</text>
  <path d="M 360 319.5 L 546.6666 319.5" stroke="var(--text)" stroke-width="3.4909" marker-end="url(#arrow8)" />
  <path d="M 733.3334 319.5 L 920 319.5" stroke="var(--text)" stroke-width="3.4909" marker-end="url(#arrow8)" />
  <text x="453.3333" y="298.5" text-anchor="middle" font-size="20.5333">fd[1]</text>
  <text x="826.6667" y="298.5" text-anchor="middle" font-size="20.5333">fd[0]</text>
  <text x="639.9999" y="508.5" text-anchor="middle" font-size="22.3999">64KB buffer (PIPE_BUF = 4KB atomic)</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow8" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#333" />
    </marker>
  </defs>
</svg>
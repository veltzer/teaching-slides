<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="282.353" height="145.000187499919" fill="url(#grad-primary)" stroke="var(--primary-border)" rx="6.708202486766" stroke-width="2"/>
  <text x="181.1765" y="136.666708333315" font-size="34.82921091804" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--primary-text)">Disk</text>
  <rect x="498.8238" y="40" width="282.353" height="145.000187499919" fill="url(#grad-warn)" stroke="var(--warn-border)" rx="6.708202486766" stroke-width="2"/>
  <text x="640.0001" y="136.666708333315" font-size="34.82921091804" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--warn-text)">Kernel Buffer</text>
  <rect x="957.647" y="40" width="282.353" height="145.000187499919" fill="url(#grad-ok)" stroke="var(--ok-border)" rx="6.708202486766" stroke-width="2"/>
  <text x="1098.8237" y="136.666708333315" font-size="34.82921091804" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--ok-text)">User Buffer</text>
  <rect x="498.8238" y="378.333229166711" width="282.353" height="145.000187499919" fill="url(#grad-warn)" stroke="var(--warn-border)" rx="6.708202486766" stroke-width="2"/>
  <text x="640.0001" y="474.999812500081" font-size="34.82921091804" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--warn-text)">Socket Buffer</text>
  <path d="M 322.353 112.500218749906 L 498.8238 112.500218749906" stroke="var(--danger-border)" stroke-width="1.6662" marker-end="url(#arrow)"/>
  <path d="M 781.1766 112.500218749906 L 957.647 112.500218749906" stroke="var(--danger-border)" stroke-width="1.6662" marker-end="url(#arrow)"/>
  <path d="M 1098.8237 185.000187499919 L 640.0001 378.333229166711" stroke="var(--danger-border)" stroke-width="1.6662" marker-end="url(#arrow)"/>
  <text x="745.8825" y="620" font-size="41.795008380298" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--text)">4 copies, 4 context switches</text>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
</svg>

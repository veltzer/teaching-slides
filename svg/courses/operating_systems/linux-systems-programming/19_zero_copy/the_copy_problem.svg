<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" font-size="35.84" font-weight="bold" text-anchor="middle">Traditional File Transfer</text>
  <rect x="128" y="180" width="204.8" height="108" fill="lightblue" stroke="black" />
  <text x="230.4" y="252" font-size="25.6" text-anchor="middle">Disk</text>
  <rect x="460.8" y="180" width="204.8" height="108" fill="yellow" stroke="black" />
  <text x="563.2" y="252" font-size="25.6" text-anchor="middle">Kernel Buffer</text>
  <rect x="793.6" y="180" width="204.8" height="108" fill="lightgreen" stroke="black" />
  <text x="896" y="252" font-size="25.6" text-anchor="middle">User Buffer</text>
  <rect x="460.8" y="432" width="204.8" height="108" fill="orange" stroke="black" />
  <text x="563.2" y="504" font-size="25.6" text-anchor="middle">Socket Buffer</text>
  <path d="M 332.8 234 L 460.8 234" stroke="red" stroke-width="5.12" marker-end="url(#arrowhead)" />
  <path d="M 665.6 234 L 793.6 234" stroke="red" stroke-width="5.12" marker-end="url(#arrowhead)" />
  <path d="M 896 288 L 563.2 432" stroke="red" stroke-width="5.12" marker-end="url(#arrowhead)" />
  <text x="640" y="612" font-size="30.72" text-anchor="middle">4 copies, 4 context switches</text>
  <defs>
    <marker id="arrowhead" markerWidth="25.6" markerHeight="25.2" refX="0" refY="12.6" orient="auto">
      <polygon points="0,36 8.96,0" fill="black" />
    </marker>
  </defs>
</svg>
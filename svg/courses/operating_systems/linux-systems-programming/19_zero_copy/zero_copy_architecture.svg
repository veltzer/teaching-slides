<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="432.4324" y="32.4324" font-size="22.7027" font-weight="bold" text-anchor="middle">Zero Copy Data Flow</text>
  <rect x="86.4865" y="81.0811" width="138.3784" height="48.6486" fill="var(--primary-fill)" stroke="var(--primary-border)" rx="6" stroke-width="2"/>
  <text x="155.6757" y="113.5135" font-size="16.2162" text-anchor="middle">File</text>
  <rect x="345.9459" y="81.0811" width="172.973" height="48.6486" fill="var(--warn-fill)" stroke="var(--warn-border)" rx="6" stroke-width="2"/>
  <text x="432.4324" y="113.5135" font-size="16.2162" text-anchor="middle">Pipe Buffer</text>
  <rect x="345.9459" y="194.5946" width="172.973" height="48.6486" fill="var(--warn-fill)" stroke="var(--warn-border)" rx="6" stroke-width="2"/>
  <text x="432.4324" y="227.027" font-size="16.2162" text-anchor="middle">Socket Buffer</text>
  <rect x="640" y="194.5946" width="138.3784" height="48.6486" fill="var(--danger-fill)" stroke="var(--danger-border)" rx="6" stroke-width="2"/>
  <text x="709.1892" y="227.027" font-size="16.2162" text-anchor="middle">Network</text>
  <rect x="86.4865" y="324.3243" width="138.3784" height="48.6486" fill="var(--ok-fill)" stroke="var(--ok-border)" rx="6" stroke-width="2"/>
  <text x="155.6757" y="356.7568" font-size="16.2162" text-anchor="middle">User Buffer</text>
  <path d="M 224.8649 105.4054 L 345.9459 105.4054" stroke="var(--ok-border)" stroke-width="3.2432" marker-end="url(#arrow)" />
  <text x="285.4054" y="97.2973" font-size="16.2162">splice()</text>
  <path d="M 432.4324 129.7297 L 432.4324 194.5946" stroke="var(--ok-border)" stroke-width="3.2432" marker-end="url(#arrow)" />
  <text x="449.7297" y="170.2703" font-size="16.2162">splice()</text>
  <path d="M 518.9189 218.9189 L 640 218.9189" stroke="var(--ok-border)" stroke-width="3.2432" marker-end="url(#arrow)" />
  <text x="579.4595" y="210.8108" font-size="16.2162">DMA</text>
  <path d="M 224.8649 348.6486 L 345.9459 129.7297" stroke="var(--primary-border)" stroke-width="3.2432" stroke-dasharray="8.1081 8.1081" marker-end="url(#arrow)" />
  <text x="259.4595" y="291.8919" font-size="16.2162" fill="var(--primary-accent)">vmsplice()</text>
</svg>
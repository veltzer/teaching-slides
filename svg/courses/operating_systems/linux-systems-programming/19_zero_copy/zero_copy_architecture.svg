<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="240.0001" height="96.666530555513" fill="url(#grad-primary)" stroke="var(--primary-border)" rx="6.480741722663" stroke-width="2" filter="url(#shadow)"/>
  <text x="160.0001" y="104.444587037082" font-size="30.103909400666" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--primary-text)">File</text>
  <rect x="489.9999" y="40" width="299.9999" height="96.666530555513" fill="url(#grad-warn)" stroke="var(--warn-border)" rx="6.480741722663" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9998" y="104.444587037082" font-size="30.103909400666" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--warn-text)">Pipe Buffer</text>
  <rect x="489.9999" y="265.555587962973" width="299.9999" height="96.666530555513" fill="url(#grad-warn)" stroke="var(--warn-border)" rx="6.480741722663" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9998" y="329.999941666648" font-size="30.103909400666" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--warn-text)">Socket Buffer</text>
  <rect x="999.9999" y="265.555587962973" width="240.0001" height="96.666530555513" fill="url(#grad-danger)" stroke="var(--danger-border)" rx="6.480741722663" stroke-width="2" filter="url(#shadow)"/>
  <text x="1119.9999" y="329.999941666648" font-size="30.103909400666" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--danger-text)">Network</text>
  <rect x="40" y="523.333469444487" width="240.0001" height="96.666530555513" fill="url(#grad-ok)" stroke="var(--ok-border)" rx="6.480741722663" stroke-width="2" filter="url(#shadow)"/>
  <text x="160.0001" y="587.77805648157" font-size="30.103909400666" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--ok-text)">User Buffer</text>
  <path d="M 280.0001 88.333265277756 L 489.9999 88.333265277756" stroke="var(--ok-border)" stroke-width="1.4883" marker-end="url(#arrow)"/>
  <text x="385" y="72.222176851838" font-size="30.103909400666" font-family="Arial, sans-serif" fill="var(--text)">splice()</text>
  <path d="M 639.9998 136.66676388892 L 639.9998 265.555587962973" stroke="var(--ok-border)" stroke-width="1.4883" marker-end="url(#arrow)"/>
  <text x="670" y="217.222322685217" font-size="30.103909400666" font-family="Arial, sans-serif" fill="var(--text)">splice()</text>
  <path d="M 790 313.888969907433 L 999.9999 313.888969907433" stroke="var(--ok-border)" stroke-width="1.4883" marker-end="url(#arrow)"/>
  <text x="895" y="297.777764814811" font-size="30.103909400666" font-family="Arial, sans-serif" fill="var(--text)">DMA</text>
  <path d="M 280.0001 571.666734722244 L 489.9999 136.66676388892" stroke="var(--primary-border)" stroke-width="1.4883" stroke-dasharray="3.7208 3.7208" marker-end="url(#arrow)"/>
  <text x="339.9999" y="458.888999074109" font-size="30.103909400666" fill="var(--primary-accent)" font-family="Arial, sans-serif">vmsplice()</text>
</svg>

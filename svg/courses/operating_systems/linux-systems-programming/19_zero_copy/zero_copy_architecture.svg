<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.9999" y="80" font-size="33.3333" font-weight="bold" text-anchor="middle">Zero Copy Data Flow</text>
  <rect x="132.0634" y="151.4287" width="203.1747" height="71.4285" fill="var(--primary-fill)" stroke="var(--primary-border)" rx="8.8095" stroke-width="2"/>
  <text x="233.6508" y="199.0477" font-size="23.8095" text-anchor="middle">File</text>
  <rect x="513.0158" y="151.4287" width="253.9683" height="71.4285" fill="var(--warn-fill)" stroke="var(--warn-border)" rx="8.8095" stroke-width="2"/>
  <text x="639.9999" y="199.0477" font-size="23.8095" text-anchor="middle">Pipe Buffer</text>
  <rect x="513.0158" y="318.0953" width="253.9683" height="71.4285" fill="var(--warn-fill)" stroke="var(--warn-border)" rx="8.8095" stroke-width="2"/>
  <text x="639.9999" y="365.7143" font-size="23.8095" text-anchor="middle">Socket Buffer</text>
  <rect x="944.7619" y="318.0953" width="203.1747" height="71.4285" fill="var(--danger-fill)" stroke="var(--danger-border)" rx="8.8095" stroke-width="2"/>
  <text x="1046.3492" y="365.7143" font-size="23.8095" text-anchor="middle">Network</text>
  <rect x="132.0634" y="508.5715" width="203.1747" height="71.4285" fill="var(--ok-fill)" stroke="var(--ok-border)" rx="8.8095" stroke-width="2"/>
  <text x="233.6508" y="556.1906" font-size="23.8095" text-anchor="middle">User Buffer</text>
  <path d="M 335.2381 187.1429 L 513.0158 187.1429" stroke="var(--ok-border)" stroke-width="3.2432" marker-end="url(#arrow)" />
  <text x="424.1269" y="175.2382" font-size="23.8095">splice()</text>
  <path d="M 639.9999 222.8572 L 639.9999 318.0953" stroke="var(--ok-border)" stroke-width="3.2432" marker-end="url(#arrow)" />
  <text x="665.3968" y="282.3811" font-size="23.8095">splice()</text>
  <path d="M 766.9841 353.8096 L 944.7619 353.8096" stroke="var(--ok-border)" stroke-width="3.2432" marker-end="url(#arrow)" />
  <text x="855.8731" y="341.9048" font-size="23.8095">DMA</text>
  <path d="M 335.2381 544.2857 L 513.0158 222.8572" stroke="var(--primary-border)" stroke-width="3.2432" stroke-dasharray="8.1081 8.1081" marker-end="url(#arrow)" />
  <text x="386.0317" y="460.9525" font-size="23.8095" fill="var(--primary-accent)">vmsplice()</text>
</svg>
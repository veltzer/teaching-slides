<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <ellipse cx="171.25" cy="103.937" rx="131.25" ry="63.937" fill="var(--primary-fill)" stroke="var(--text)" stroke-width="0.7548"/>
  <text x="171.25" y="114.2126" text-anchor="middle" fill="var(--bg)" font-size="20.3581" font-family="Arial, sans-serif">NEW</text>
  <ellipse cx="640.0002" cy="103.937" rx="131.25" ry="63.937" fill="var(--ok-fill)" stroke="var(--text)" stroke-width="0.7548"/>
  <text x="640.0002" y="114.2126" text-anchor="middle" fill="var(--bg)" font-size="20.3581" font-family="Arial, sans-serif">RUNNABLE</text>
  <ellipse cx="1108.75" cy="103.937" rx="131.25" ry="63.937" fill="var(--danger-fill)" stroke="var(--text)" stroke-width="0.7548"/>
  <text x="1108.75" y="114.2126" text-anchor="middle" fill="var(--bg)" font-size="20.3581" font-family="Arial, sans-serif">RUNNING</text>
  <ellipse cx="358.7499" cy="412.205" rx="131.25" ry="63.937" fill="var(--warn-fill)" stroke="var(--text)" stroke-width="0.7548"/>
  <text x="358.7499" y="422.4805" text-anchor="middle" fill="var(--bg)" font-size="20.3581" font-family="Arial, sans-serif">SLEEPING</text>
  <ellipse cx="827.5001" cy="412.205" rx="131.25" ry="63.937" fill="var(--info-fill)" stroke="var(--text)" stroke-width="0.7548"/>
  <text x="827.5001" y="422.4805" text-anchor="middle" fill="var(--bg)" font-size="20.3581" font-family="Arial, sans-serif">STOPPED</text>
  <ellipse cx="1108.75" cy="556.063" rx="131.25" ry="63.937" fill="var(--text-faint)" stroke="var(--text)" stroke-width="0.7548"/>
  <text x="1108.75" y="566.3389" text-anchor="middle" fill="var(--bg)" font-size="20.3581" font-family="Arial, sans-serif">ZOMBIE</text>
  <path d="M 302.5 103.937 L 508.7502 103.937" stroke="var(--text)" stroke-width="0.7548" marker-end="url(#arrow)"/>
  <path d="M 771.2498 103.937 L 977.5 103.937" stroke="var(--text)" stroke-width="0.7548" marker-end="url(#arrow)"/>
  <path d="M 1108.75 175.8663 L 1108.75 484.1341" stroke="var(--text)" stroke-width="0.7548" marker-end="url(#arrow)"/>
  <path d="M 1052.4999 145.0395 Q 827.5001 206.6927 696.2501 145.0395" stroke="var(--text)" stroke-width="0.7548" marker-end="url(#arrow)"/>
  <path d="M 583.7501 145.0395 L 415 340.2757" stroke="var(--text)" stroke-width="0.7548" marker-end="url(#arrow)"/>
  <path d="M 415 371.1025 Q 546.25 268.3465 583.7501 145.0395" stroke="var(--text)" stroke-width="0.7548" marker-end="url(#arrow)"/>
  <path d="M 696.2501 145.0395 L 771.2498 340.2757" stroke="var(--text)" stroke-width="0.7548" marker-end="url(#arrow)"/>
  <text x="405.6249" y="83.3858" font-size="18.9815" font-family="Arial, sans-serif" fill="var(--text)">fork/exec</text>
  <text x="874.3751" y="83.3858" font-size="18.9815" font-family="Arial, sans-serif" fill="var(--text)">schedule</text>
  <text x="874.3751" y="186.1416" font-size="18.9815" font-family="Arial, sans-serif" fill="var(--text)">preempt</text>
  <text x="489.9999" y="247.7954" font-size="18.9815" font-family="Arial, sans-serif" fill="var(--text)">sleep</text>
  <text x="489.9999" y="309.449" font-size="18.9815" font-family="Arial, sans-serif" fill="var(--text)">wake</text>
  <text x="1127.5001" y="309.449" font-size="18.9815" font-family="Arial, sans-serif" fill="var(--text)">exit</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

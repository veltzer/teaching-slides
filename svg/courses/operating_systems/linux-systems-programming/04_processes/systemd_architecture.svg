  <text x="784.5161" y="340.1613" text-anchor="middle" fill="var(--bg)" font-size="19.871">systemd-resolved</text>
  <rect x="947.0968" y="289.3548" width="252.9032" height="81.2903" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6.7742"/>
  <text x="1073.5484" y="340.1613" text-anchor="middle" fill="var(--bg)" font-size="19.871">systemd-logind</text>
  <rect x="260.6452" y="492.5806" width="216.7742" height="81.2903" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6.7742"/>
  <text x="369.0323" y="543.3871" text-anchor="middle" fill="var(--bg)" font-size="19.871">Service Units</text>
  <rect x="513.5484" y="492.5806" width="216.7742" height="81.2903" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6.7742"/>
  <text x="621.9355" y="543.3871" text-anchor="middle" fill="var(--bg)" font-size="19.871">Target Units</text>
  <rect x="766.4516" y="492.5806" width="216.7742" height="81.2903" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6.7742"/>
  <text x="874.8387" y="543.3871" text-anchor="middle" fill="var(--bg)" font-size="19.871">Timer Units</text>
  <line x1="712.2581" y1="208.0645" x2="206.4516" y2="289.3548" stroke="var(--text)" stroke-width="1.6" />
  <line x1="712.2581" y1="208.0645" x2="495.4839" y2="289.3548" stroke="var(--text)" stroke-width="1.6" />
  <line x1="712.2581" y1="208.0645" x2="784.5161" y2="289.3548" stroke="var(--text)" stroke-width="1.6" />
  <line x1="712.2581" y1="208.0645" x2="1073.5484" y2="289.3548" stroke="var(--text)" stroke-width="1.6" />
</svg>
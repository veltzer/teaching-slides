<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="608.421052631579" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.635480581883" font-weight="bold" fill="var(--text)">Process Lifecycle</text>

  <rect x="40" y="109.174311926606" width="210.526315789474" height="106.422018348624" rx="10.584100207815" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="145.263157894737" y="151.743119266055" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.051380374068" font-weight="bold" fill="var(--info-text)">fork()</text>
  <text x="145.263157894737" y="183.669724770642" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.75933027016" fill="var(--info-text)">creates child copy</text>

  <path d="M 252.631578947368 162.385321100917 L 368.421052631579 162.385321100917" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="376.842105263158" y="109.174311926606" width="210.526315789474" height="106.422018348624" rx="10.584100207815" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="482.105263157895" y="151.743119266055" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.051380374068" font-weight="bold" fill="var(--warn-text)">exec()</text>
  <text x="482.105263157895" y="183.669724770642" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.75933027016" fill="var(--warn-text)">replaces image</text>

  <path d="M 589.473684210526 162.385321100917 L 705.263157894737 162.385321100917" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="713.684210526316" y="109.174311926606" width="210.526315789474" height="106.422018348624" rx="10.584100207815" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="818.947368421053" y="151.743119266055" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.051380374068" font-weight="bold" fill="var(--ok-text)">wait()</text>
  <text x="818.947368421053" y="183.669724770642" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.75933027016" fill="var(--ok-text)">parent reaps</text>

  <path d="M 926.315789473684 162.385321100917 L 1042.105263157895 162.385321100917" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1050.526315789474" y="109.174311926606" width="189.473684210526" height="106.422018348624" rx="10.584100207815" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1145.263157894737" y="151.743119266055" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.051380374068" font-weight="bold" fill="var(--danger-text)">_exit()</text>
  <text x="1145.263157894737" y="183.669724770642" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.75933027016" fill="var(--danger-text)">child gone</text>

  <rect x="40" y="279.449541284404" width="1136.842105263158" height="340.550458715596" rx="10.584100207815" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="608.421052631579" y="316.697247706422" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.051380374068" font-weight="bold" fill="var(--text)">States</text>
  <text x="61.052631578947" y="353.94495412844" font-family="Arial, sans-serif" font-size="13.75933027016" fill="var(--text)">- R: running on CPU</text>
  <text x="61.052631578947" y="380.550458715596" font-family="Arial, sans-serif" font-size="13.75933027016" fill="var(--text)">- S: sleeping (interruptible)</text>
  <text x="61.052631578947" y="407.155963302752" font-family="Arial, sans-serif" font-size="13.75933027016" fill="var(--text)">- D: uninterruptible (disk I/O)</text>
  <text x="61.052631578947" y="433.761467889908" font-family="Arial, sans-serif" font-size="13.75933027016" fill="var(--text)">- Z: zombie (exited, parent has not waited)</text>
  <text x="61.052631578947" y="460.366972477064" font-family="Arial, sans-serif" font-size="13.75933027016" fill="var(--text)">- T: stopped (signal SIGSTOP)</text>
  <text x="61.052631578947" y="513.577981651376" font-family="Arial, sans-serif" font-size="13.75933027016" font-weight="bold" fill="var(--text)">PID 1 (init) inherits orphans</text>
  <text x="61.052631578947" y="556.146788990826" font-family="Arial, sans-serif" font-size="12.700920249378" font-style="italic" fill="var(--text-muted)">ps, top, /proc/PID/status</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <!-- palette: resources/palette_diagram.yaml -->

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="31.091264" font-weight="bold" fill="var(--text)">Evolution of Linux Init Systems</text>

  <line x1="80" y1="319.259259" x2="1240" y2="319.259259" stroke="var(--text-muted)" stroke-width="2"/>

  <rect x="183.418" y="302.677" width="33.164" height="33.164" rx="14" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="200" y="179.62963" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.873011" font-weight="bold" fill="var(--text)">1983</text>
  <rect x="60" y="201.111111" width="280" height="85.925926" rx="6.218253" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="200" y="233.333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758" font-weight="bold" fill="var(--bg)">SysV Init</text>
  <text x="200" y="265.555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--bg)">Sequential runlevels</text>
  <text x="200" y="394.444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--text-muted)">Shell scripts in /etc/init.d</text>
  <text x="200" y="421.296296" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--text-muted)">Slow cold boot</text>

  <rect x="473.418" y="302.677" width="33.164" height="33.164" rx="14" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="179.62963" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.873011" font-weight="bold" fill="var(--text)">2006</text>
  <rect x="350" y="201.111111" width="280" height="85.925926" rx="6.218253" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="233.333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758" font-weight="bold" fill="var(--bg)">Upstart</text>
  <text x="490" y="265.555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--bg)">Event-based</text>
  <text x="490" y="394.444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--text-muted)">Ubuntu pioneer</text>
  <text x="490" y="421.296296" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--text-muted)">Reacts to events</text>

  <rect x="773.418" y="302.677" width="33.164" height="33.164" rx="14" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="790" y="179.62963" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.873011" font-weight="bold" fill="var(--text)">2010</text>
  <rect x="650" y="201.111111" width="280" height="85.925926" rx="6.218253" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="790" y="233.333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758" font-weight="bold" fill="var(--bg)">systemd</text>
  <text x="790" y="265.555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--bg)">Parallel, unit files</text>
  <text x="790" y="394.444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--text-muted)">Dominant today</text>
  <text x="790" y="421.296296" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--text-muted)">Cgroups, sockets, timers</text>

  <rect x="1073.42" y="302.677" width="33.164" height="33.164" rx="14" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="179.62963" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.873011" font-weight="bold" fill="var(--text)">today</text>
  <rect x="950" y="201.111111" width="280" height="85.925926" rx="6.218253" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="233.333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758" font-weight="bold" fill="var(--bg)">OpenRC / runit</text>
  <text x="1090" y="265.555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--bg)">Minimal alternatives</text>
  <text x="1090" y="394.444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--text-muted)">Alpine, Void, Gentoo</text>
  <text x="1090" y="421.296296" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--text-muted)">Simpler, smaller</text>

  <rect x="40" y="469.62963" width="1200" height="150.37037" rx="6.218253" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="512.592593" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758" font-weight="bold" fill="var(--text)">From shell scripts to a dependency-aware service manager</text>
  <text x="640" y="550.185185" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545632" fill="var(--text-muted)">Each generation traded simplicity for faster, more predictable boot.</text>
  <text x="640" y="587.777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545632" fill="var(--text-muted)">systemd won by owning services, sockets, logging, and cgroups under one PID 1.</text>
</svg>

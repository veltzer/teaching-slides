<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="26.460213" font-weight="bold" fill="var(--text)">Process Components (PCB)</text>
  <rect x="40" y="71.071429" width="1200" height="548.928571" rx="6.106203" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="70" y="96.964286" width="1140" height="82.857143" rx="6.106203" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="146.678571" text-anchor="middle" font-size="22.389411" font-weight="bold" fill="var(--primary-text)">PID, PPID, State</text>
  <rect x="70" y="185" width="1140" height="82.857143" rx="6.106203" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="234.714286" text-anchor="middle" font-size="22.389411" font-weight="bold" fill="var(--danger-text)">Credentials (UID, GID)</text>
  <rect x="70" y="273.035714" width="1140" height="82.857143" rx="6.106203" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="322.75" text-anchor="middle" font-size="22.389411" font-weight="bold" fill="var(--ok-text)">Memory Management Info</text>
  <rect x="70" y="361.071429" width="1140" height="82.857143" rx="6.106203" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="410.785714" text-anchor="middle" font-size="22.389411" font-weight="bold" fill="var(--warn-text)">File Descriptors Table</text>
  <rect x="70" y="449.107143" width="1140" height="82.857143" rx="6.106203" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="498.821429" text-anchor="middle" font-size="22.389411" font-weight="bold" fill="var(--info-text)">Signal Handlers</text>
  <rect x="70" y="537.142857" width="1140" height="82.857143" rx="6.106203" fill="var(--primary-fill)" stroke="var(--primary-accent)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="586.857143" text-anchor="middle" font-size="22.389411" font-weight="bold" fill="var(--primary-text)">CPU Context (Registers)</text>
</svg>

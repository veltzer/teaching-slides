<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="54" text-anchor="middle" font-size="22.4" font-weight="bold">Fork Creates Exact Copy</text>
  <rect x="80" y="108" width="400" height="540" fill="#3498DB" stroke="#333" stroke-width="3.2" />
  <text x="280" y="90" text-anchor="middle" font-size="19.2">Before fork()</text>
  <rect x="112" y="144" width="336" height="54" fill="#2980B9" />
  <text x="280" y="180" text-anchor="middle" fill="white" font-size="16">PID: 1234</text>
  <rect x="112" y="216" width="336" height="54" fill="#2980B9" />
  <text x="280" y="252" text-anchor="middle" fill="white" font-size="16">Memory: Stack, Heap</text>
  <rect x="112" y="288" width="336" height="54" fill="#2980B9" />
  <text x="280" y="324" text-anchor="middle" fill="white" font-size="16">Files: 0,1,2,...</text>
  <rect x="112" y="360" width="336" height="54" fill="#2980B9" />
  <text x="280" y="396" text-anchor="middle" fill="white" font-size="16">Signals: Handlers</text>
  <text x="560" y="360" text-anchor="middle" font-size="32">→</text>
  <rect x="720" y="108" width="240" height="270" fill="#E74C3C" stroke="#333" stroke-width="3.2" />
  <text x="840" y="90" text-anchor="middle" font-size="19.2">Parent After</text>
  <rect x="736" y="144" width="208" height="45" fill="#C0392B" />
  <text x="840" y="176.4" text-anchor="middle" fill="white" font-size="16">PID: 1234</text>
  <rect x="736" y="198" width="208" height="45" fill="#C0392B" />
  <text x="840" y="230.4" text-anchor="middle" fill="white" font-size="16">fork() returns: 1235</text>
  <rect x="736" y="252" width="208" height="45" fill="#C0392B" />
  <text x="840" y="284.4" text-anchor="middle" fill="white" font-size="16">COW Memory</text>
  <rect x="720" y="414" width="240" height="270" fill="#2ECC71" stroke="#333" stroke-width="3.2" />
  <text x="840" y="396" text-anchor="middle" font-size="19.2">Child After</text>
  <rect x="736" y="450" width="208" height="45" fill="#27AE60" />
  <text x="840" y="482.4" text-anchor="middle" fill="white" font-size="16">PID: 1235</text>
  <rect x="736" y="504" width="208" height="45" fill="#27AE60" />
  <text x="840" y="536.4" text-anchor="middle" fill="white" font-size="16">fork() returns: 0</text>
  <rect x="736" y="558" width="208" height="45" fill="#27AE60" />
  <text x="840" y="590.4" text-anchor="middle" fill="white" font-size="16">COW Memory</text>
</svg>
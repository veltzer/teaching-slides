<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="803.6364" y="40" text-anchor="middle" font-size="25.0982" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Fork Creates Exact Copy</text>
  <rect x="40" y="89.7143" width="545.4545" height="497.1429" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="312.7273" y="73.1428" text-anchor="middle" font-size="21.5127" font-family="Arial, sans-serif" fill="var(--text)">Before fork()</text>
  <rect x="83.6363" y="122.8571" width="458.1819" height="49.7143" fill="url(#grad-primary)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="312.7273" y="156.0001" text-anchor="middle" fill="var(--bg)" font-size="17.9273" font-family="Arial, sans-serif">PID: 1234</text>
  <rect x="83.6363" y="189.1429" width="458.1819" height="49.7143" fill="url(#grad-primary)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="312.7273" y="222.2858" text-anchor="middle" fill="var(--bg)" font-size="17.9273" font-family="Arial, sans-serif">Memory: Stack, Heap</text>
  <rect x="83.6363" y="255.4286" width="458.1819" height="49.7143" fill="url(#grad-primary)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="312.7273" y="288.5714" text-anchor="middle" fill="var(--bg)" font-size="17.9273" font-family="Arial, sans-serif">Files: 0,1,2,...</text>
  <rect x="83.6363" y="321.7143" width="458.1819" height="49.7143" fill="url(#grad-primary)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="312.7273" y="354.8571" text-anchor="middle" fill="var(--bg)" font-size="17.9273" font-family="Arial, sans-serif">Signals: Handlers</text>
  <text x="694.5455" y="321.7143" text-anchor="middle" font-size="35.8544" font-family="Arial, sans-serif" fill="var(--text)">→</text>
  <rect x="912.7273" y="89.7143" width="327.2727" height="248.5714" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1076.3636" y="73.1428" text-anchor="middle" font-size="21.5127" font-family="Arial, sans-serif" fill="var(--text)">Parent After</text>
  <rect x="934.5455" y="122.8571" width="283.6364" height="41.4286" fill="var(--danger-accent)" rx="6"/>
  <text x="1076.3636" y="152.6857" text-anchor="middle" fill="var(--bg)" font-size="17.9273" font-family="Arial, sans-serif">PID: 1234</text>
  <rect x="934.5455" y="172.5715" width="283.6364" height="41.4286" fill="var(--danger-accent)" rx="6"/>
  <text x="1076.3636" y="202.4" text-anchor="middle" fill="var(--bg)" font-size="17.9273" font-family="Arial, sans-serif">fork() returns: 1235</text>
  <rect x="934.5455" y="222.2858" width="283.6364" height="41.4286" fill="var(--danger-accent)" rx="6"/>
  <text x="1076.3636" y="252.1143" text-anchor="middle" fill="var(--bg)" font-size="17.9273" font-family="Arial, sans-serif">COW Memory</text>
  <rect x="912.7273" y="371.4286" width="327.2727" height="248.5714" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1076.3636" y="354.8571" text-anchor="middle" font-size="21.5127" font-family="Arial, sans-serif" fill="var(--text)">Child After</text>
  <rect x="934.5455" y="404.5714" width="283.6364" height="41.4286" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1076.3636" y="434.4" text-anchor="middle" fill="var(--bg)" font-size="17.9273" font-family="Arial, sans-serif">PID: 1235</text>
  <rect x="934.5455" y="454.2857" width="283.6364" height="41.4286" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1076.3636" y="484.1143" text-anchor="middle" fill="var(--bg)" font-size="17.9273" font-family="Arial, sans-serif">fork() returns: 0</text>
  <rect x="934.5455" y="504" width="283.6364" height="41.4286" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1076.3636" y="533.8286" text-anchor="middle" fill="var(--bg)" font-size="17.9273" font-family="Arial, sans-serif">COW Memory</text>
</svg>

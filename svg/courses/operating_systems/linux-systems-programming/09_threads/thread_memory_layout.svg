<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
  </defs>
  <text x="640" y="55" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--text)">Thread Memory Layout</text>
  <rect x="40" y="80" width="580" height="540" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="330" y="110" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--text)">Shared (process-wide)</text>
  <rect x="60" y="130" width="540" height="110" rx="6" fill="var(--text-muted)" stroke="var(--text)" stroke-width="2"/>
  <text x="330" y="195" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--bg)">Code Segment</text>
  <rect x="60" y="250" width="540" height="110" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="330" y="315" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--bg)">Data / BSS</text>
  <rect x="60" y="370" width="540" height="110" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="330" y="435" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--bg)">Heap</text>
  <rect x="60" y="490" width="540" height="110" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="330" y="555" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--bg)">File Descriptors</text>
  <rect x="640" y="80" width="600" height="540" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="940" y="110" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--text)">Per-Thread (private)</text>
  <rect x="660" y="130" width="180" height="460" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="750" y="170" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--bg)">Thread 1</text>
  <text x="750" y="340" text-anchor="middle" font-size="16" fill="var(--bg)">Stack</text>
  <text x="750" y="380" text-anchor="middle" font-size="16" fill="var(--bg)">Registers</text>
  <text x="750" y="420" text-anchor="middle" font-size="16" fill="var(--bg)">Signal mask</text>
  <rect x="860" y="130" width="180" height="460" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="950" y="170" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--bg)">Thread 2</text>
  <text x="950" y="340" text-anchor="middle" font-size="16" fill="var(--bg)">Stack</text>
  <text x="950" y="380" text-anchor="middle" font-size="16" fill="var(--bg)">Registers</text>
  <text x="950" y="420" text-anchor="middle" font-size="16" fill="var(--bg)">Signal mask</text>
  <rect x="1060" y="130" width="180" height="460" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1150" y="170" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--bg)">Thread 3</text>
  <text x="1150" y="340" text-anchor="middle" font-size="16" fill="var(--bg)">Stack</text>
  <text x="1150" y="380" text-anchor="middle" font-size="16" fill="var(--bg)">Registers</text>
  <text x="1150" y="420" text-anchor="middle" font-size="16" fill="var(--bg)">Signal mask</text>
</svg>

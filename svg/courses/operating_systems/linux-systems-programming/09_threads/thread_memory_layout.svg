  <ns0:text x="615.015" y="553.5135" text-anchor="middle" font-size="15.3754">Each thread: Own stack, registers, signal mask</ns0:text>
  <ns0:text x="615.015" y="588.1081" text-anchor="middle" font-size="15.3754">Shared: Heap, globals, code, file descriptors</ns0:text>

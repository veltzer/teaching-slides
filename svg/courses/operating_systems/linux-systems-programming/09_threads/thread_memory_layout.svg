<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="580" height="580" rx="6.218252399808" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="330" y="72.22222204784" text-anchor="middle" font-size="20.727509363208" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Shared (process-wide)</text>
  <rect x="60" y="93.7037030643" width="540" height="118.148148206276" rx="6.218252399808" fill="var(--text-muted)" stroke="var(--text)" stroke-width="2"/>
  <text x="330" y="163.518518198817" text-anchor="middle" font-size="22.80025948122" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Code Segment</text>
  <rect x="60" y="222.592592301955" width="540" height="118.148148206276" rx="6.218252399808" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="292.407407436471" text-anchor="middle" font-size="22.80025948122" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Data / BSS</text>
  <rect x="60" y="351.481481539609" width="540" height="118.148148206276" rx="6.218252399808" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="421.296296674126" text-anchor="middle" font-size="22.80025948122" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Heap</text>
  <rect x="60" y="480.370370777263" width="540" height="118.148148206276" rx="6.218252399808" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="550.185184865483" text-anchor="middle" font-size="22.80025948122" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">File Descriptors</text>
  <rect x="640" y="40" width="600" height="580" rx="6.218252399808" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="940" y="72.22222204784" text-anchor="middle" font-size="20.727509363208" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Per-Thread (private)</text>
  <rect x="660" y="93.7037030643" width="180" height="494.074073841564" rx="6.218252399808" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="750" y="136.666666143519" text-anchor="middle" font-size="18.65475822231" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Thread 1</text>
  <text x="750" y="319.25925949177" text-anchor="middle" font-size="16.582007081412" fill="var(--bg)" font-family="Arial, sans-serif">Stack</text>
  <text x="750" y="362.222222570988" text-anchor="middle" font-size="16.582007081412" fill="var(--bg)" font-family="Arial, sans-serif">Registers</text>
  <text x="750" y="405.185184603909" text-anchor="middle" font-size="16.582007081412" fill="var(--bg)" font-family="Arial, sans-serif">Signal mask</text>
  <rect x="860" y="93.7037030643" width="180" height="494.074073841564" rx="6.218252399808" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="136.666666143519" text-anchor="middle" font-size="18.65475822231" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Thread 2</text>
  <text x="950" y="319.25925949177" text-anchor="middle" font-size="16.582007081412" fill="var(--bg)" font-family="Arial, sans-serif">Stack</text>
  <text x="950" y="362.222222570988" text-anchor="middle" font-size="16.582007081412" fill="var(--bg)" font-family="Arial, sans-serif">Registers</text>
  <text x="950" y="405.185184603909" text-anchor="middle" font-size="16.582007081412" fill="var(--bg)" font-family="Arial, sans-serif">Signal mask</text>
  <rect x="1060" y="93.7037030643" width="180" height="494.074073841564" rx="6.218252399808" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1150" y="136.666666143519" text-anchor="middle" font-size="18.65475822231" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Thread 3</text>
  <text x="1150" y="319.25925949177" text-anchor="middle" font-size="16.582007081412" fill="var(--bg)" font-family="Arial, sans-serif">Stack</text>
  <text x="1150" y="362.222222570988" text-anchor="middle" font-size="16.582007081412" fill="var(--bg)" font-family="Arial, sans-serif">Registers</text>
  <text x="1150" y="405.185184603909" text-anchor="middle" font-size="16.582007081412" fill="var(--bg)" font-family="Arial, sans-serif">Signal mask</text>
</svg>

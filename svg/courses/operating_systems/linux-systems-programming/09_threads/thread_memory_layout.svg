  <ns0:text x="615.015" y="354.5946" text-anchor="middle" fill="white" font-size="16.9129">Heap (Shared)</ns0:text>
  <ns0:rect x="338.2583" y="415.1351" width="169.1291" height="86.4865" fill="#3498DB" stroke="#333" stroke-width="3.0751" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="26.342872" font-weight="bold" fill="var(--text)">Thread Memory Layout</text>
  <rect x="40" y="65.663717" width="580" height="554.336283" rx="6.079124" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="330" y="96.460177" text-anchor="middle" font-size="20.263748" font-weight="bold" fill="var(--text)">Shared (process-wide)</text>
  <rect x="60" y="116.99115" width="540" height="112.920354" rx="6.079124" fill="var(--text-muted)" stroke="var(--text)" stroke-width="2"/>
  <text x="330" y="183.716814" text-anchor="middle" font-size="22.290122" font-weight="bold" fill="var(--bg)">Code Segment</text>
  <rect x="60" y="240.176991" width="540" height="112.920354" rx="6.079124" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="306.902655" text-anchor="middle" font-size="22.290122" font-weight="bold" fill="var(--bg)">Data / BSS</text>
  <rect x="60" y="363.362832" width="540" height="112.920354" rx="6.079124" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="430.088496" text-anchor="middle" font-size="22.290122" font-weight="bold" fill="var(--bg)">Heap</text>
  <rect x="60" y="486.548673" width="540" height="112.920354" rx="6.079124" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="553.274336" text-anchor="middle" font-size="22.290122" font-weight="bold" fill="var(--bg)">File Descriptors</text>
  <rect x="640" y="65.663717" width="600" height="554.336283" rx="6.079124" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="940" y="96.460177" text-anchor="middle" font-size="20.263748" font-weight="bold" fill="var(--text)">Per-Thread (private)</text>
  <rect x="660" y="116.99115" width="180" height="472.212389" rx="6.079124" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="750" y="158.053097" text-anchor="middle" font-size="18.237373" font-weight="bold" fill="var(--bg)">Thread 1</text>
  <text x="750" y="332.566372" text-anchor="middle" font-size="16.210998" fill="var(--bg)">Stack</text>
  <text x="750" y="373.628319" text-anchor="middle" font-size="16.210998" fill="var(--bg)">Registers</text>
  <text x="750" y="414.690265" text-anchor="middle" font-size="16.210998" fill="var(--bg)">Signal mask</text>
  <rect x="860" y="116.99115" width="180" height="472.212389" rx="6.079124" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="158.053097" text-anchor="middle" font-size="18.237373" font-weight="bold" fill="var(--bg)">Thread 2</text>
  <text x="950" y="332.566372" text-anchor="middle" font-size="16.210998" fill="var(--bg)">Stack</text>
  <text x="950" y="373.628319" text-anchor="middle" font-size="16.210998" fill="var(--bg)">Registers</text>
  <text x="950" y="414.690265" text-anchor="middle" font-size="16.210998" fill="var(--bg)">Signal mask</text>
  <rect x="1060" y="116.99115" width="180" height="472.212389" rx="6.079124" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1150" y="158.053097" text-anchor="middle" font-size="18.237373" font-weight="bold" fill="var(--bg)">Thread 3</text>
  <text x="1150" y="332.566372" text-anchor="middle" font-size="16.210998" fill="var(--bg)">Stack</text>
  <text x="1150" y="373.628319" text-anchor="middle" font-size="16.210998" fill="var(--bg)">Registers</text>
  <text x="1150" y="414.690265" text-anchor="middle" font-size="16.210998" fill="var(--bg)">Signal mask</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="26.342872" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Thread Memory Layout</text>
  <rect x="40" y="65.663717" width="580" height="554.336283" rx="6.079124" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="330" y="96.460177" text-anchor="middle" font-size="20.263748" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Shared (process-wide)</text>
  <rect x="60" y="116.99115" width="540" height="112.920354" rx="6.079124" fill="var(--text-muted)" stroke="var(--text)" stroke-width="2"/>
  <text x="330" y="183.716814" text-anchor="middle" font-size="22.290122" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Code Segment</text>
  <rect x="60" y="240.176991" width="540" height="112.920354" rx="6.079124" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="306.902655" text-anchor="middle" font-size="22.290122" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Data / BSS</text>
  <rect x="60" y="363.362832" width="540" height="112.920354" rx="6.079124" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="430.088496" text-anchor="middle" font-size="22.290122" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Heap</text>
  <rect x="60" y="486.548673" width="540" height="112.920354" rx="6.079124" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="553.274336" text-anchor="middle" font-size="22.290122" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">File Descriptors</text>
  <rect x="640" y="65.663717" width="600" height="554.336283" rx="6.079124" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="940" y="96.460177" text-anchor="middle" font-size="20.263748" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Per-Thread (private)</text>
  <rect x="660" y="116.99115" width="180" height="472.212389" rx="6.079124" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="750" y="158.053097" text-anchor="middle" font-size="18.237373" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Thread 1</text>
  <text x="750" y="332.566372" text-anchor="middle" font-size="16.210998" fill="var(--bg)" font-family="Arial, sans-serif">Stack</text>
  <text x="750" y="373.628319" text-anchor="middle" font-size="16.210998" fill="var(--bg)" font-family="Arial, sans-serif">Registers</text>
  <text x="750" y="414.690265" text-anchor="middle" font-size="16.210998" fill="var(--bg)" font-family="Arial, sans-serif">Signal mask</text>
  <rect x="860" y="116.99115" width="180" height="472.212389" rx="6.079124" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="158.053097" text-anchor="middle" font-size="18.237373" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Thread 2</text>
  <text x="950" y="332.566372" text-anchor="middle" font-size="16.210998" fill="var(--bg)" font-family="Arial, sans-serif">Stack</text>
  <text x="950" y="373.628319" text-anchor="middle" font-size="16.210998" fill="var(--bg)" font-family="Arial, sans-serif">Registers</text>
  <text x="950" y="414.690265" text-anchor="middle" font-size="16.210998" fill="var(--bg)" font-family="Arial, sans-serif">Signal mask</text>
  <rect x="1060" y="116.99115" width="180" height="472.212389" rx="6.079124" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1150" y="158.053097" text-anchor="middle" font-size="18.237373" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Thread 3</text>
  <text x="1150" y="332.566372" text-anchor="middle" font-size="16.210998" fill="var(--bg)" font-family="Arial, sans-serif">Stack</text>
  <text x="1150" y="373.628319" text-anchor="middle" font-size="16.210998" fill="var(--bg)" font-family="Arial, sans-serif">Registers</text>
  <text x="1150" y="414.690265" text-anchor="middle" font-size="16.210998" fill="var(--bg)" font-family="Arial, sans-serif">Signal mask</text>
</svg>

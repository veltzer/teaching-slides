<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <rect x="80" y="90" width="480" height="540" fill="#3498DB" stroke="#333" stroke-width="3.2" />
  <text x="320" y="54" text-anchor="middle" font-size="22.4" font-weight="bold">Process</text>
  <rect x="112" y="126" width="416" height="72" fill="#1976d2" />
  <text x="320" y="171" text-anchor="middle" fill="white" font-size="17.6">Independent Memory</text>
  <rect x="112" y="216" width="416" height="72" fill="#1976d2" />
  <text x="320" y="261" text-anchor="middle" fill="white" font-size="17.6">Expensive Creation (fork)</text>
  <rect x="112" y="306" width="416" height="72" fill="#1976d2" />
  <text x="320" y="351" text-anchor="middle" fill="white" font-size="17.6">IPC for Communication</text>
  <rect x="112" y="396" width="416" height="72" fill="#1976d2" />
  <text x="320" y="441" text-anchor="middle" fill="white" font-size="17.6">Protected from Each Other</text>
  <rect x="720" y="90" width="480" height="540" fill="#2ECC71" stroke="#333" stroke-width="3.2" />
  <text x="960" y="54" text-anchor="middle" font-size="22.4" font-weight="bold">Threads</text>
  <rect x="752" y="126" width="416" height="72" fill="#27AE60" />
  <text x="960" y="171" text-anchor="middle" fill="white" font-size="17.6">Shared Memory</text>
  <rect x="752" y="216" width="416" height="72" fill="#27AE60" />
  <text x="960" y="261" text-anchor="middle" fill="white" font-size="17.6">Cheap Creation (clone)</text>
  <rect x="752" y="306" width="416" height="72" fill="#27AE60" />
  <text x="960" y="351" text-anchor="middle" fill="white" font-size="17.6">Direct Memory Access</text>
  <rect x="752" y="396" width="416" height="72" fill="#27AE60" />
  <text x="960" y="441" text-anchor="middle" fill="white" font-size="17.6">Need Synchronization</text>
</svg>
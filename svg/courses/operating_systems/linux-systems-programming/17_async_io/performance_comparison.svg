<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <rect x="40" y="40" width="290" height="580" rx="6.106203" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="86.607143" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.389411" font-weight="bold" fill="var(--danger-text)">POSIX AIO</text>
  <text x="185" y="122.857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507" font-weight="bold" fill="var(--danger-text)">Slow — avoid</text>
  <rect x="70" y="148.75" width="230" height="31.071429" rx="4.070802" fill="var(--bg)" stroke="var(--danger-border)"/>
  <rect x="70" y="148.75" width="50" height="31.071429" fill="var(--danger-border)"/>
  <text x="185" y="205.714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--danger-text)">glibc user-space threads</text>
  <text x="185" y="231.607143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--danger-text)">one worker per request</text>
  <text x="185" y="267.857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--danger-text)">kernel bypass gives no</text>
  <text x="185" y="288.571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--danger-text)">real parallelism</text>
  <text x="185" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--danger-text)">high context-switch cost</text>
  <text x="185" y="371.428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--danger-text)">signals for completion</text>
  <text x="185" y="412.857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--danger-text)">limited fd types</text>
  <text x="185" y="454.285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--danger-text)">essentially never used</text>
  <text x="185" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--danger-text)">in modern code</text>
  <text x="185" y="537.142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247807" font-weight="bold" fill="var(--danger-text)">~10k IOPS</text>
  <text x="185" y="578.571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--danger-text)">baseline</text>

  <rect x="340" y="40" width="290" height="580" rx="6.106203" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485" y="86.607143" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.389411" font-weight="bold" fill="var(--warn-text)">Native AIO (libaio)</text>
  <text x="485" y="122.857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507" font-weight="bold" fill="var(--warn-text)">Better for O_DIRECT</text>
  <rect x="370" y="148.75" width="230" height="31.071429" rx="4.070802" fill="var(--bg)" stroke="var(--warn-border)"/>
  <rect x="370" y="148.75" width="110" height="31.071429" fill="var(--warn-border)"/>
  <text x="485" y="205.714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--warn-text)">io_submit / io_getevents</text>
  <text x="485" y="231.607143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--warn-text)">kernel-side queueing</text>
  <text x="485" y="267.857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--warn-text)">requires O_DIRECT for</text>
  <text x="485" y="288.571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--warn-text)">true async behaviour</text>
  <text x="485" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--warn-text)">falls back to sync for</text>
  <text x="485" y="350.714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--warn-text)">buffered I/O</text>
  <text x="485" y="392.142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--warn-text)">niche use in databases</text>
  <text x="485" y="433.571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--warn-text)">two syscalls per I/O</text>
  <text x="485" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--warn-text)">superseded by io_uring</text>
  <text x="485" y="537.142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247807" font-weight="bold" fill="var(--warn-text)">~100k IOPS</text>
  <text x="485" y="578.571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--warn-text)">10× POSIX AIO</text>

  <rect x="640" y="40" width="290" height="580" rx="6.106203" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="785" y="86.607143" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.389411" font-weight="bold" fill="var(--primary-text)">epoll</text>
  <text x="785" y="122.857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507" font-weight="bold" fill="var(--primary-text)">Good for sockets</text>
  <rect x="670" y="148.75" width="230" height="31.071429" rx="4.070802" fill="var(--bg)" stroke="var(--primary-border)"/>
  <rect x="670" y="148.75" width="170" height="31.071429" fill="var(--primary-border)"/>
  <text x="785" y="205.714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--primary-text)">readiness notification</text>
  <text x="785" y="231.607143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--primary-text)">not true async I/O</text>
  <text x="785" y="267.857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--primary-text)">epoll_ctl + epoll_wait</text>
  <text x="785" y="288.571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--primary-text)">edge or level trigger</text>
  <text x="785" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--primary-text)">scales to 100k+ fds</text>
  <text x="785" y="371.428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--primary-text)">still the default for</text>
  <text x="785" y="392.142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--primary-text)">nginx, Redis, Envoy</text>
  <text x="785" y="433.571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--primary-text)">one syscall per batch</text>
  <text x="785" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--primary-text)">network-focused</text>
  <text x="785" y="537.142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247807" font-weight="bold" fill="var(--primary-text)">~1M events/s</text>
  <text x="785" y="578.571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--primary-text)">sockets only</text>

  <rect x="940" y="40" width="300" height="580" rx="6.106203" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="86.607143" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.389411" font-weight="bold" fill="var(--ok-text)">io_uring</text>
  <text x="1090" y="122.857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507" font-weight="bold" fill="var(--ok-text)">Fastest — Linux 5.1+</text>
  <rect x="970" y="148.75" width="240" height="31.071429" rx="4.070802" fill="var(--bg)" stroke="var(--ok-border)"/>
  <rect x="970" y="148.75" width="240" height="31.071429" fill="var(--ok-border)"/>
  <text x="1090" y="205.714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--ok-text)">shared submit/complete</text>
  <text x="1090" y="226.428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--ok-text)">rings in mapped memory</text>
  <text x="1090" y="267.857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--ok-text)">zero-syscall hot path</text>
  <text x="1090" y="288.571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--ok-text)">with SQPOLL kernel thread</text>
  <text x="1090" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--ok-text)">works for files, sockets,</text>
  <text x="1090" y="350.714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--ok-text)">pipes, timers uniformly</text>
  <text x="1090" y="392.142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--ok-text)">linked ops, fixed buffers</text>
  <text x="1090" y="433.571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--ok-text)">used by ScyllaDB, RocksDB</text>
  <text x="1090" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--ok-text)">the new standard</text>
  <text x="1090" y="537.142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247807" font-weight="bold" fill="var(--ok-text)">~2M+ IOPS</text>
  <text x="1090" y="578.571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--ok-text)">20× libaio on NVMe</text>
</svg>

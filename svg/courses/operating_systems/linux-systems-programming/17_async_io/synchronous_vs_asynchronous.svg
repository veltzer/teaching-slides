<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-size="29.018513" font-weight="bold" fill="var(--text)">Synchronous vs Asynchronous I/O</text>

  <!-- Synchronous panel -->
  <rect x="40" y="82.962963" width="580" height="537.037037" rx="8.291004" fill="var(--surface)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="330" y="125.925926" text-anchor="middle" font-size="24.873011" font-weight="bold" fill="var(--danger-accent)">Synchronous</text>

  <rect x="80" y="158.148148" width="500" height="75.185185" rx="6.218253" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="206.481481" text-anchor="middle" font-size="22.80026" font-weight="bold" fill="var(--danger-text)">read(fd, buf, n)</text>

  <rect x="80" y="254.814815" width="500" height="75.185185" rx="6.218253" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="330" y="301" text-anchor="middle" font-size="18.654758" fill="var(--text)">Thread BLOCKS in kernel until data ready</text>

  <rect x="80" y="351.481481" width="500" height="75.185185" rx="6.218253" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="330" y="397.666667" text-anchor="middle" font-size="18.654758" fill="var(--text)">CPU idle while disk / network works</text>

  <rect x="80" y="448.148148" width="500" height="75.185185" rx="6.218253" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="330" y="494.333333" text-anchor="middle" font-size="18.654758" fill="var(--text)">Simple control flow, linear code</text>

  <rect x="80" y="544.814815" width="500" height="59.074074" rx="6.218253" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="583.481481" text-anchor="middle" font-size="18.654758" font-weight="bold" fill="var(--danger-text)">Poor concurrency scaling</text>

  <!-- Asynchronous panel -->
  <rect x="660" y="82.962963" width="580" height="537.037037" rx="8.291004" fill="var(--surface)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="950" y="125.925926" text-anchor="middle" font-size="24.873011" font-weight="bold" fill="var(--ok-accent)">Asynchronous</text>

  <rect x="700" y="158.148148" width="500" height="75.185185" rx="6.218253" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="206.481481" text-anchor="middle" font-size="22.80026" font-weight="bold" fill="var(--ok-text)">aio_read / io_uring_submit</text>

  <rect x="700" y="254.814815" width="500" height="75.185185" rx="6.218253" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="950" y="301" text-anchor="middle" font-size="18.654758" fill="var(--text)">Returns immediately, kernel queues op</text>

  <rect x="700" y="351.481481" width="500" height="75.185185" rx="6.218253" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="950" y="397.666667" text-anchor="middle" font-size="18.654758" fill="var(--text)">Thread does other work in parallel</text>

  <rect x="700" y="448.148148" width="500" height="75.185185" rx="6.218253" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="950" y="494.333333" text-anchor="middle" font-size="18.654758" fill="var(--text)">Completion via callback, signal, or poll</text>

  <rect x="700" y="544.814815" width="500" height="59.074074" rx="6.218253" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="583.481481" text-anchor="middle" font-size="18.654758" font-weight="bold" fill="var(--ok-text)">Scales to many in-flight operations</text>
</svg>

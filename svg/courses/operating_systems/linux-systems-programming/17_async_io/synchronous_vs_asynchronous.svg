<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-size="29.018513" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Synchronous vs Asynchronous I/O</text>

  <!-- Synchronous panel -->
  <rect x="40" y="82.962963" width="580" height="537.037037" rx="8.291004" fill="var(--surface)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="330" y="125.925926" text-anchor="middle" font-size="24.873011" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Synchronous</text>

  <rect x="80" y="158.148148" width="500" height="75.185185" rx="6.218253" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="206.481481" text-anchor="middle" font-size="22.80026" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">read(fd, buf, n)</text>

  <rect x="80" y="254.814815" width="500" height="75.185185" rx="6.218253" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="330" y="301" text-anchor="middle" font-size="18.654758" fill="var(--text)" font-family="Arial, sans-serif">Thread BLOCKS in kernel until data ready</text>

  <rect x="80" y="351.481481" width="500" height="75.185185" rx="6.218253" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="330" y="397.666667" text-anchor="middle" font-size="18.654758" fill="var(--text)" font-family="Arial, sans-serif">CPU idle while disk / network works</text>

  <rect x="80" y="448.148148" width="500" height="75.185185" rx="6.218253" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="330" y="494.333333" text-anchor="middle" font-size="18.654758" fill="var(--text)" font-family="Arial, sans-serif">Simple control flow, linear code</text>

  <rect x="80" y="544.814815" width="500" height="59.074074" rx="6.218253" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="583.481481" text-anchor="middle" font-size="18.654758" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Poor concurrency scaling</text>

  <!-- Asynchronous panel -->
  <rect x="660" y="82.962963" width="580" height="537.037037" rx="8.291004" fill="var(--surface)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="950" y="125.925926" text-anchor="middle" font-size="24.873011" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Asynchronous</text>

  <rect x="700" y="158.148148" width="500" height="75.185185" rx="6.218253" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="206.481481" text-anchor="middle" font-size="22.80026" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">aio_read / io_uring_submit</text>

  <rect x="700" y="254.814815" width="500" height="75.185185" rx="6.218253" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="950" y="301" text-anchor="middle" font-size="18.654758" fill="var(--text)" font-family="Arial, sans-serif">Returns immediately, kernel queues op</text>

  <rect x="700" y="351.481481" width="500" height="75.185185" rx="6.218253" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="950" y="397.666667" text-anchor="middle" font-size="18.654758" fill="var(--text)" font-family="Arial, sans-serif">Thread does other work in parallel</text>

  <rect x="700" y="448.148148" width="500" height="75.185185" rx="6.218253" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="950" y="494.333333" text-anchor="middle" font-size="18.654758" fill="var(--text)" font-family="Arial, sans-serif">Completion via callback, signal, or poll</text>

  <rect x="700" y="544.814815" width="500" height="59.074074" rx="6.218253" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="583.481481" text-anchor="middle" font-size="18.654758" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Scales to many in-flight operations</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="223.3334" y="111.25" width="347.2222" height="468.75" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6.1198"/>

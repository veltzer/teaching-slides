<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="136.1702" y="76.5957" width="340.4255" height="459.5745" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="306.383" y="45.9574" text-anchor="middle" font-size="19.0638" font-weight="bold">Application Layer</text>
  <rect x="163.4043" y="107.234" width="285.9574" height="61.2766" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="306.383" y="145.5319" text-anchor="middle" fill="var(--bg)" font-size="14.9787">User Application</text>
  <rect x="163.4043" y="183.8298" width="285.9574" height="61.2766" fill="var(--primary-accent)" rx="6"/>
  <text x="306.383" y="222.1277" text-anchor="middle" fill="var(--bg)" font-size="14.9787">Socket API</text>
  <rect x="612.766" y="76.5957" width="340.4255" height="459.5745" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="782.9787" y="45.9574" text-anchor="middle" font-size="19.0638" font-weight="bold">Kernel Space</text>
  <rect x="640" y="107.234" width="285.9574" height="61.2766" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="782.9787" y="145.5319" text-anchor="middle" fill="var(--bg)" font-size="14.9787">Socket Layer</text>
  <rect x="640" y="183.8298" width="285.9574" height="61.2766" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="782.9787" y="222.1277" text-anchor="middle" fill="var(--bg)" font-size="14.9787">TCP/UDP Layer</text>
  <rect x="640" y="260.4255" width="285.9574" height="61.2766" fill="var(--ok-accent)" rx="6"/>
  <text x="782.9787" y="298.7234" text-anchor="middle" fill="var(--bg)" font-size="14.9787">IP Layer</text>
  <rect x="640" y="337.0213" width="285.9574" height="61.2766" fill="var(--ok-accent)" rx="6"/>
  <text x="782.9787" y="375.3191" text-anchor="middle" fill="var(--bg)" font-size="14.9787">Network Driver</text>
  <rect x="640" y="413.617" width="285.9574" height="61.2766" fill="var(--ok-accent)" rx="6"/>
  <text x="782.9787" y="451.9149" text-anchor="middle" fill="var(--bg)" font-size="14.9787">Network Hardware</text>
  <path d="M 449.3617 214.4681 L 640 214.4681" stroke="var(--text)" stroke-width="2.7234" marker-end="url(#arrow)" />
  <text x="544.6809" y="199.1489" text-anchor="middle" font-size="13.617">System Calls</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
</svg>
  <text x="396.9445" y="181.5625" text-anchor="middle" fill="var(--bg)" font-size="15.2778">User Application</text>
  <rect x="251.1112" y="220.6251" width="291.6666" height="62.5" fill="var(--primary-accent)" rx="6.1198"/>
  <text x="396.9445" y="259.6876" text-anchor="middle" fill="var(--bg)" font-size="15.2778">Socket API</text>
  <rect x="709.4445" y="111.25" width="347.2222" height="468.75" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6.1198"/>
  <text x="883.0555" y="80" text-anchor="middle" font-size="19.4444" font-weight="bold">Kernel Space</text>
  <rect x="737.2222" y="142.5" width="291.6666" height="62.5" fill="var(--ok-fill)" rx="6.1198" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="883.0555" y="181.5625" text-anchor="middle" fill="var(--bg)" font-size="15.2778">Socket Layer</text>
  <rect x="737.2222" y="220.6251" width="291.6666" height="62.5" fill="var(--ok-fill)" rx="6.1198" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="883.0555" y="259.6876" text-anchor="middle" fill="var(--bg)" font-size="15.2778">TCP/UDP Layer</text>
  <rect x="737.2222" y="298.75" width="291.6666" height="62.5" fill="var(--ok-accent)" rx="6.1198"/>
  <text x="883.0555" y="337.8125" text-anchor="middle" fill="var(--bg)" font-size="15.2778">IP Layer</text>
  <rect x="737.2222" y="376.8751" width="291.6666" height="62.5" fill="var(--ok-accent)" rx="6.1198"/>
  <text x="883.0555" y="415.9375" text-anchor="middle" fill="var(--bg)" font-size="15.2778">Network Driver</text>
  <rect x="737.2222" y="455" width="291.6666" height="62.5" fill="var(--ok-accent)" rx="6.1198"/>
  <text x="883.0555" y="494.0625" text-anchor="middle" fill="var(--bg)" font-size="15.2778">Network Hardware</text>
  <path d="M 542.7778 251.8751 L 737.2222 251.8751" stroke="var(--text)" stroke-width="2.7234" marker-end="url(#arrow)" />
  <text x="640.0001" y="236.25" text-anchor="middle" font-size="13.8889">System Calls</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <ellipse cx="185.4547" cy="92.7272" rx="145.4547" ry="52.7272" fill="var(--primary-fill)" stroke="var(--text)" stroke-width="1.1417"/>
  <text x="185.4547" y="102.6138" text-anchor="middle" fill="var(--bg)" font-size="19.6639" font-family="Arial, sans-serif">CLOSED</text>
  <ellipse cx="639.9999" cy="92.7272" rx="145.4547" ry="52.7272" fill="var(--ok-fill)" stroke="var(--text)" stroke-width="1.1417"/>
  <text x="639.9999" y="102.6138" text-anchor="middle" fill="var(--bg)" font-size="19.6639" font-family="Arial, sans-serif">LISTEN</text>
  <ellipse cx="1094.5453" cy="92.7272" rx="145.4547" ry="52.7272" fill="var(--danger-fill)" stroke="var(--text)" stroke-width="1.1417"/>
  <text x="1094.5453" y="102.6138" text-anchor="middle" fill="var(--bg)" font-size="19.6639" font-family="Arial, sans-serif">SYN_SENT</text>
  <ellipse cx="367.2729" cy="330.0002" rx="145.4547" ry="52.7272" fill="var(--warn-fill)" stroke="var(--text)" stroke-width="1.1417"/>
  <text x="367.2729" y="339.8865" text-anchor="middle" fill="var(--bg)" font-size="19.6639" font-family="Arial, sans-serif">SYN_RCVD</text>
  <ellipse cx="912.7271" cy="330.0002" rx="145.4547" ry="52.7272" fill="var(--info-fill)" stroke="var(--text)" stroke-width="1.1417"/>
  <text x="912.7271" y="339.8865" text-anchor="middle" fill="var(--bg)" font-size="19.6639" font-family="Arial, sans-serif">ESTABLISHED</text>
  <ellipse cx="367.2729" cy="567.2728" rx="145.4547" ry="52.7272" fill="var(--text-muted)" stroke="var(--text)" stroke-width="1.1417"/>
  <text x="367.2729" y="577.1594" text-anchor="middle" fill="var(--bg)" font-size="19.6639" font-family="Arial, sans-serif">FIN_WAIT_1</text>
  <ellipse cx="912.7271" cy="567.2728" rx="145.4547" ry="52.7272" fill="var(--text-faint)" stroke="var(--text)" stroke-width="1.1417"/>
  <text x="912.7271" y="577.1594" text-anchor="middle" fill="var(--bg)" font-size="19.6639" font-family="Arial, sans-serif">CLOSE_WAIT</text>
  <path d="M 330.9091 92.7272 L 494.5454 92.7272" stroke="var(--text)" stroke-width="1.1417" marker-end="url(#arrow)"/>
  <text x="412.7273" y="72.9549" font-size="17.8764" font-family="Arial, sans-serif" fill="var(--text)">listen()</text>
  <path d="M 639.9999 152.0458 L 367.2729 270.6818" stroke="var(--text)" stroke-width="1.1417" marker-end="url(#arrow)"/>
  <text x="494.5454" y="211.3639" font-size="17.8764" font-family="Arial, sans-serif" fill="var(--text)">SYN rcvd</text>
  <path d="M 949.0907 92.7272 L 785.4544 92.7272" stroke="var(--text)" stroke-width="1.1417" marker-end="url(#arrow)"/>
  <text x="867.2725" y="72.9549" font-size="17.8764" font-family="Arial, sans-serif" fill="var(--text)">connect()</text>
  <path d="M 512.7272 330.0002 L 767.2726 330.0002" stroke="var(--text)" stroke-width="1.1417" marker-end="url(#arrow)"/>
  <text x="639.9999" y="310.2274" font-size="17.8764" font-family="Arial, sans-serif" fill="var(--text)">SYN+ACK/ACK</text>
  <path d="M 912.7271 389.3183 L 912.7271 507.9547" stroke="var(--text)" stroke-width="1.1417" marker-end="url(#arrow)"/>
  <text x="930.9089" y="448.6364" font-size="17.8764" font-family="Arial, sans-serif" fill="var(--text)">close()</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

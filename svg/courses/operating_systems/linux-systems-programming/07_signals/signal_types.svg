<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="80" y="90" width="1120" height="576" fill="#ECF0F1" stroke="#333" stroke-width="3.2" />
  <text x="640" y="54" text-anchor="middle" font-size="25.6" font-weight="bold">Linux Signals Categories</text>
  <rect x="112" y="126" width="320" height="108" fill="#E74C3C" stroke="#333" stroke-width="3.2" />
  <text x="272" y="189" text-anchor="middle" fill="white" font-size="19.2">Terminal Signals</text>
  <text x="272" y="216" text-anchor="middle" fill="white" font-size="16">SIGINT, SIGQUIT, SIGTSTP</text>
  <rect x="464" y="126" width="320" height="108" fill="#3498DB" stroke="#333" stroke-width="3.2" />
  <text x="624" y="189" text-anchor="middle" fill="white" font-size="19.2">Error Signals</text>
  <text x="624" y="216" text-anchor="middle" fill="white" font-size="16">SIGSEGV, SIGBUS, SIGFPE</text>
  <rect x="816" y="126" width="320" height="108" fill="#2ECC71" stroke="#333" stroke-width="3.2" />
  <text x="976" y="189" text-anchor="middle" fill="white" font-size="19.2">Job Control</text>
  <text x="976" y="216" text-anchor="middle" fill="white" font-size="16">SIGSTOP, SIGCONT, SIGTTIN</text>
  <rect x="112" y="270" width="320" height="108" fill="#F39C12" stroke="#333" stroke-width="3.2" />
  <text x="272" y="333" text-anchor="middle" fill="white" font-size="19.2">Process Lifecycle</text>
  <text x="272" y="360" text-anchor="middle" fill="white" font-size="16">SIGCHLD, SIGTERM, SIGKILL</text>
  <rect x="464" y="270" width="320" height="108" fill="#9B59B6" stroke="#333" stroke-width="3.2" />
  <text x="624" y="333" text-anchor="middle" fill="white" font-size="19.2">Timer Signals</text>
  <text x="624" y="360" text-anchor="middle" fill="white" font-size="16">SIGALRM, SIGVTALRM, SIGPROF</text>
  <rect x="816" y="270" width="320" height="108" fill="#34495E" stroke="#333" stroke-width="3.2" />
  <text x="976" y="333" text-anchor="middle" fill="white" font-size="19.2">User Defined</text>
  <text x="976" y="360" text-anchor="middle" fill="white" font-size="16">SIGUSR1, SIGUSR2</text>
  <rect x="112" y="414" width="1024" height="216" fill="#95A5A6" stroke="#333" stroke-width="3.2" />
  <text x="624" y="459" text-anchor="middle" fill="white" font-size="19.2">Real-Time Signals</text>
  <text x="624" y="495" text-anchor="middle" fill="white" font-size="16">SIGRTMIN to SIGRTMAX (34-64)</text>
  <text x="624" y="531" text-anchor="middle" fill="white" font-size="16">• Queued delivery</text>
  <text x="624" y="558" text-anchor="middle" fill="white" font-size="16">• Carry data payload</text>
  <text x="624" y="585" text-anchor="middle" fill="white" font-size="16">• Guaranteed order</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="374.999972656249" height="124.285801020419" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.914658948818"/>
  <text x="227.500041015627" y="112.49990892856" text-anchor="middle" fill="var(--bg)" font-size="22.296778757728" font-family="Arial, sans-serif">Terminal Signals</text>
  <text x="227.500041015627" y="143.571419897959" text-anchor="middle" fill="var(--bg)" font-size="18.580610550001" font-family="Arial, sans-serif">SIGINT, SIGQUIT, SIGTSTP</text>
  <rect x="452.500068359379" y="40" width="374.999972656249" height="124.285801020419" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.914658948818"/>
  <text x="640" y="112.49990892856" text-anchor="middle" fill="var(--bg)" font-size="22.296778757728" font-family="Arial, sans-serif">Error Signals</text>
  <text x="640" y="143.571419897959" text-anchor="middle" fill="var(--bg)" font-size="18.580610550001" font-family="Arial, sans-serif">SIGSEGV, SIGBUS, SIGFPE</text>
  <rect x="864.999917968746" y="40" width="374.999972656249" height="124.285801020419" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.914658948818"/>
  <text x="1052.500068359378" y="112.49990892856" text-anchor="middle" fill="var(--bg)" font-size="22.296778757728" font-family="Arial, sans-serif">Job Control</text>
  <text x="1052.500068359378" y="143.571419897959" text-anchor="middle" fill="var(--bg)" font-size="18.580610550001" font-family="Arial, sans-serif">SIGSTOP, SIGCONT, SIGTTIN</text>
  <rect x="40" y="205.714320408168" width="374.999972656249" height="124.285801020419" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.914658948818"/>
  <text x="227.500041015627" y="278.214350765314" text-anchor="middle" fill="var(--bg)" font-size="22.296778757728" font-family="Arial, sans-serif">Process Lifecycle</text>
  <text x="227.500041015627" y="309.285740306127" text-anchor="middle" fill="var(--bg)" font-size="18.580610550001" font-family="Arial, sans-serif">SIGCHLD, SIGTERM, SIGKILL</text>
  <rect x="452.500068359379" y="205.714320408168" width="374.999972656249" height="124.285801020419" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.914658948818"/>
  <text x="640" y="278.214350765314" text-anchor="middle" fill="var(--bg)" font-size="22.296778757728" font-family="Arial, sans-serif">Timer Signals</text>
  <text x="640" y="309.285740306127" text-anchor="middle" fill="var(--bg)" font-size="18.580610550001" font-family="Arial, sans-serif">SIGALRM, SIGVTALRM, SIGPROF</text>
  <rect x="864.999917968746" y="205.714320408168" width="374.999972656249" height="124.285801020419" fill="var(--text-muted)" stroke="var(--text)" stroke-width="3.0751" rx="6.914658948818"/>
  <text x="1052.500068359378" y="278.214350765314" text-anchor="middle" fill="var(--bg)" font-size="22.296778757728" font-family="Arial, sans-serif">User Defined</text>
  <text x="1052.500068359378" y="309.285740306127" text-anchor="middle" fill="var(--bg)" font-size="18.580610550001" font-family="Arial, sans-serif">SIGUSR1, SIGUSR2</text>
  <rect x="40" y="371.428519387749" width="1200" height="248.571480612251" fill="var(--text-faint)" stroke="var(--text)" stroke-width="3.0751" rx="6.914658948818"/>
  <text x="640" y="423.214290051021" text-anchor="middle" fill="var(--bg)" font-size="22.296778757728" font-family="Arial, sans-serif">Real-Time Signals</text>
  <text x="640" y="464.642930867356" text-anchor="middle" fill="var(--bg)" font-size="18.580610550001" font-family="Arial, sans-serif">SIGRTMIN to SIGRTMAX (34-64)</text>
  <text x="640" y="506.071571683692" text-anchor="middle" fill="var(--bg)" font-size="18.580610550001" font-family="Arial, sans-serif">• Queued delivery</text>
  <text x="640" y="537.142839795917" text-anchor="middle" fill="var(--bg)" font-size="18.580610550001" font-family="Arial, sans-serif">• Carry data payload</text>
  <text x="640" y="568.214350765315" text-anchor="middle" fill="var(--bg)" font-size="18.580610550001" font-family="Arial, sans-serif">• Guaranteed order</text>
</svg>

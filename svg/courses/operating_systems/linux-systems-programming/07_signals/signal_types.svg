<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="76.8769" y="86.4865" width="1076.2763" height="553.5135" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="615.015" y="51.8919" text-anchor="middle" font-size="24.6006" font-weight="bold">Linux Signals Categories</text>
  <rect x="107.6276" y="121.0811" width="307.5075" height="103.7838" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6"/>
  <text x="261.3814" y="181.6216" text-anchor="middle" fill="var(--bg)" font-size="18.4505">Terminal Signals</text>
  <text x="261.3814" y="207.5676" text-anchor="middle" fill="var(--bg)" font-size="15.3754">SIGINT, SIGQUIT, SIGTSTP</text>
  <rect x="445.8859" y="121.0811" width="307.5075" height="103.7838" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="599.6396" y="181.6216" text-anchor="middle" fill="var(--bg)" font-size="18.4505">Error Signals</text>
  <text x="599.6396" y="207.5676" text-anchor="middle" fill="var(--bg)" font-size="15.3754">SIGSEGV, SIGBUS, SIGFPE</text>
  <rect x="784.1441" y="121.0811" width="307.5075" height="103.7838" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="937.8979" y="181.6216" text-anchor="middle" fill="var(--bg)" font-size="18.4505">Job Control</text>
  <text x="937.8979" y="207.5676" text-anchor="middle" fill="var(--bg)" font-size="15.3754">SIGSTOP, SIGCONT, SIGTTIN</text>
  <rect x="107.6276" y="259.4595" width="307.5075" height="103.7838" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6"/>
  <text x="261.3814" y="320" text-anchor="middle" fill="var(--bg)" font-size="18.4505">Process Lifecycle</text>
  <text x="261.3814" y="345.9459" text-anchor="middle" fill="var(--bg)" font-size="15.3754">SIGCHLD, SIGTERM, SIGKILL</text>
  <rect x="445.8859" y="259.4595" width="307.5075" height="103.7838" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6"/>
  <text x="599.6396" y="320" text-anchor="middle" fill="var(--bg)" font-size="18.4505">Timer Signals</text>
  <text x="599.6396" y="345.9459" text-anchor="middle" fill="var(--bg)" font-size="15.3754">SIGALRM, SIGVTALRM, SIGPROF</text>
  <rect x="784.1441" y="259.4595" width="307.5075" height="103.7838" fill="var(--text-muted)" stroke="var(--text)" stroke-width="3.0751" rx="6"/>
  <text x="937.8979" y="320" text-anchor="middle" fill="var(--bg)" font-size="18.4505">User Defined</text>
  <text x="937.8979" y="345.9459" text-anchor="middle" fill="var(--bg)" font-size="15.3754">SIGUSR1, SIGUSR2</text>
  <rect x="107.6276" y="397.8378" width="984.024" height="207.5676" fill="var(--text-faint)" stroke="var(--text)" stroke-width="3.0751" rx="6"/>
  <text x="599.6396" y="441.0811" text-anchor="middle" fill="var(--bg)" font-size="18.4505">Real-Time Signals</text>
  <text x="599.6396" y="475.6757" text-anchor="middle" fill="var(--bg)" font-size="15.3754">SIGRTMIN to SIGRTMAX (34-64)</text>
  <text x="599.6396" y="510.2703" text-anchor="middle" fill="var(--bg)" font-size="15.3754">• Queued delivery</text>
  <text x="599.6396" y="536.2162" text-anchor="middle" fill="var(--bg)" font-size="15.3754">• Carry data payload</text>
  <text x="599.6396" y="562.1622" text-anchor="middle" fill="var(--bg)" font-size="15.3754">• Guaranteed order</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="160" y="90" width="960" height="144" fill="#3498DB" stroke="#333" stroke-width="3.2" />
  <text x="640" y="126" text-anchor="middle" fill="white" font-size="19.2">Main Program Execution</text>
  <text x="640" y="171" text-anchor="middle" fill="white" font-size="16">malloc() → strcpy() → printf() → free()</text>
  <rect x="480" y="270" width="320" height="108" fill="#E74C3C" stroke="#333" stroke-width="3.2" />
  <text x="640" y="315" text-anchor="middle" fill="white" font-size="19.2">SIGNAL ARRIVES!</text>
  <text x="640" y="351" text-anchor="middle" fill="white" font-size="16">Interrupts at ANY point</text>
  <rect x="400" y="414" width="480" height="180" fill="#F39C12" stroke="#333" stroke-width="3.2" />
  <text x="640" y="459" text-anchor="middle" fill="black" font-size="19.2">Signal Handler</text>
  <text x="640" y="495" text-anchor="middle" font-size="16">Can't use:</text>
  <text x="640" y="531" text-anchor="middle" font-size="16">• malloc/free (not reentrant)</text>
  <text x="640" y="558" text-anchor="middle" font-size="16">• printf (uses malloc)</text>
  <path d="M 640 198 L 640 270" stroke="#E74C3C" stroke-width="4.8" marker-end="url(#arrow)" />
  <path d="M 640 378 L 640 414" stroke="#E74C3C" stroke-width="4.8" marker-end="url(#arrow)" />
  <defs>
    <marker id="arrow" markerWidth="16" markerHeight="12.6" refX="16" refY="6.3" orient="auto">
      <polygon points="0,18 5.6,0" fill="#E74C3C" />
    </marker>
  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="639.9993" y="40" font-size="41.353783" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--text)">Connection States</text>
  <rect x="40" y="115.18" width="177.230852" height="177.231" rx="13.999994" fill="url(#grad-primary)" stroke="var(--black)" filter="url(#shadow)"/>
  <text x="128.615226" y="217.4445" font-size="29.538388" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--primary-text)">CONNECTED</text>
  <rect x="551.384574" y="115.18" width="177.230852" height="177.231" rx="13.999994" fill="url(#grad-ok)" stroke="var(--black)" filter="url(#shadow)"/>
  <text x="639.9993" y="217.4445" font-size="29.538388" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--ok-text)">READING</text>
  <rect x="1062.769148" y="115.18" width="177.230852" height="177.231" rx="13.999994" fill="url(#grad-warn)" stroke="var(--black)" filter="url(#shadow)"/>
  <text x="1151.383774" y="217.4445" font-size="29.538388" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--warn-text)">WRITING</text>
  <rect x="551.384574" y="442.769" width="177.230852" height="177.231" rx="13.999994" fill="url(#grad-danger)" stroke="var(--black)" filter="url(#shadow)"/>
  <text x="639.9993" y="545.0341" font-size="29.538388" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--danger-text)">CLOSING</text>
  <path d="M 230.892141 203.7951 L 537.722385 203.7951" stroke="var(--black)" marker-end="url(#arrow)"/>
  <path d="M 742.276215 203.7951 L 1049.106859 203.7951" stroke="var(--black)" marker-end="url(#arrow)"/>
  <path d="M 1049.106859 258.3934 L 742.276215 258.3934" stroke="var(--black)" marker-end="url(#arrow)"/>
  <path d="M 639.9993 285.6926 L 639.9993 449.4871" stroke="var(--black)" marker-end="url(#arrow)"/>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

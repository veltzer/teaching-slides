  <text x="640" y="72" font-size="35.84" font-weight="bold" text-anchor="middle">Traditional Approach</text>
  <rect x="128" y="180" width="153.6" height="108" fill="lightblue" stroke="black" />
  <text x="204.8" y="252" font-size="25.6" text-anchor="middle">Thread 1</text>
  <rect x="384" y="180" width="153.6" height="108" fill="lightblue" stroke="black" />
  <text x="460.8" y="252" font-size="25.6" text-anchor="middle">Thread 2</text>
  <rect x="640" y="180" width="153.6" height="108" fill="lightblue" stroke="black" />
  <text x="716.8" y="252" font-size="25.6" text-anchor="middle">Thread 3</text>
  <text x="640" y="396" font-size="30.72" text-anchor="middle">One thread per connection</text>

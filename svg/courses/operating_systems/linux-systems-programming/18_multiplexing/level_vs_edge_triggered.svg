<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <!-- palette: resources/palette_diagram.yaml -->

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="31.091264" font-weight="bold" fill="var(--text)">Level Triggered vs Edge Triggered</text>

  <rect x="40" y="82.962963" width="580" height="537.037037" rx="6.218253" fill="var(--surface)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="40" y="82.962963" width="580" height="64.444444" rx="6.218253" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="125.925926" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.80026" font-weight="bold" fill="var(--primary-text)">Level Triggered (default)</text>

  <text x="70" y="190.37037" font-family="Arial, sans-serif" font-size="17.618383" font-weight="bold" fill="var(--text)">Semantics</text>
  <text x="70" y="222.592593" font-family="Arial, sans-serif" font-size="15.545632" fill="var(--text-muted)">Fires while the condition is true.</text>
  <text x="70" y="254.814815" font-family="Arial, sans-serif" font-size="15.545632" fill="var(--text-muted)">Keeps notifying until drained.</text>

  <text x="70" y="308.518519" font-family="Arial, sans-serif" font-size="17.618383" font-weight="bold" fill="var(--text)">Used by</text>
  <text x="70" y="340.740741" font-family="Arial, sans-serif" font-size="15.545632" fill="var(--text-muted)">select(), poll(), epoll default.</text>

  <text x="70" y="394.444444" font-family="Arial, sans-serif" font-size="17.618383" font-weight="bold" fill="var(--text)">Pros</text>
  <text x="70" y="426.666667" font-family="Arial, sans-serif" font-size="15.545632" fill="var(--text-muted)">Forgiving; partial reads are safe.</text>

  <text x="70" y="480.37037" font-family="Arial, sans-serif" font-size="17.618383" font-weight="bold" fill="var(--text)">Cons</text>
  <text x="70" y="512.592593" font-family="Arial, sans-serif" font-size="15.545632" fill="var(--text-muted)">More wakeups per event.</text>
  <text x="70" y="544.814815" font-family="Arial, sans-serif" font-size="15.545632" fill="var(--text-muted)">Can thundering-herd on accept.</text>

  <rect x="660" y="82.962963" width="580" height="537.037037" rx="6.218253" fill="var(--surface)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="660" y="82.962963" width="580" height="64.444444" rx="6.218253" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="125.925926" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.80026" font-weight="bold" fill="var(--ok-text)">Edge Triggered (EPOLLET)</text>

  <text x="690" y="190.37037" font-family="Arial, sans-serif" font-size="17.618383" font-weight="bold" fill="var(--text)">Semantics</text>
  <text x="690" y="222.592593" font-family="Arial, sans-serif" font-size="15.545632" fill="var(--text-muted)">Fires only on state transition.</text>
  <text x="690" y="254.814815" font-family="Arial, sans-serif" font-size="15.545632" fill="var(--text-muted)">One wakeup per ready edge.</text>

  <text x="690" y="308.518519" font-family="Arial, sans-serif" font-size="17.618383" font-weight="bold" fill="var(--text)">Used by</text>
  <text x="690" y="340.740741" font-family="Arial, sans-serif" font-size="15.545632" fill="var(--text-muted)">epoll with EPOLLET flag.</text>

  <text x="690" y="394.444444" font-family="Arial, sans-serif" font-size="17.618383" font-weight="bold" fill="var(--text)">Pros</text>
  <text x="690" y="426.666667" font-family="Arial, sans-serif" font-size="15.545632" fill="var(--text-muted)">Fewer syscalls; higher throughput.</text>

  <text x="690" y="480.37037" font-family="Arial, sans-serif" font-size="17.618383" font-weight="bold" fill="var(--text)">Cons</text>
  <text x="690" y="512.592593" font-family="Arial, sans-serif" font-size="15.545632" fill="var(--text-muted)">Requires nonblocking and loop</text>
  <text x="690" y="544.814815" font-family="Arial, sans-serif" font-size="15.545632" fill="var(--text-muted)">until EAGAIN, or events stall.</text>
</svg>

  <text x="128" y="403.2" font-size="25.6">• Easier to use</text>
  <text x="128" y="489.6" font-size="30.72" font-weight="bold">Edge Triggered (EPOLLET)</text>
  <rect x="128" y="518.4" width="102.4" height="57.6" fill="lightgreen" stroke="black" />

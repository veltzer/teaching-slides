<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="57.6" font-size="35.84" font-weight="bold" text-anchor="middle">Triggering Modes</text>
  <text x="128" y="144" font-size="30.72" font-weight="bold">Level Triggered (Default)</text>
  <rect x="128" y="172.8" width="512" height="57.6" fill="lightblue" stroke="black" />
  <text x="384" y="216" font-size="25.6" text-anchor="middle">Data Available</text>
  <text x="128" y="288" font-size="25.6">• Notifies while condition is true</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" font-size="35.84" font-weight="bold" text-anchor="middle">poll() vs select()</text>
  <rect x="128" y="180" width="384" height="432" fill="lightcoral" stroke="black" />
  <text x="320" y="252" font-size="30.72" font-weight="bold" text-anchor="middle">select()</text>
  <text x="320" y="324" font-size="25.6" text-anchor="middle">• FD limit (1024)</text>
  <text x="320" y="396" font-size="25.6" text-anchor="middle">• O(n) scan</text>
  <text x="320" y="468" font-size="25.6" text-anchor="middle">• Bit manipulation</text>
  <text x="320" y="540" font-size="25.6" text-anchor="middle">• Portable</text>
  <rect x="768" y="180" width="384" height="432" fill="lightgreen" stroke="black" />
  <text x="960" y="252" font-size="30.72" font-weight="bold" text-anchor="middle">poll()</text>
  <text x="960" y="324" font-size="25.6" text-anchor="middle">• No FD limit</text>
  <text x="960" y="396" font-size="25.6" text-anchor="middle">• O(n) scan</text>
  <text x="960" y="468" font-size="25.6" text-anchor="middle">• Array based</text>
  <text x="960" y="540" font-size="25.6" text-anchor="middle">• Better interface</text>
</svg>
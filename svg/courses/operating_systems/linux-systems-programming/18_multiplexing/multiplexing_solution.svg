<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="457.62934" y="40" width="364.74642" height="254.845267761582" fill="url(#grad-ok)" stroke="var(--ok-border)" rx="6.918359050257" stroke-width="2"/>
  <text x="640.0026" y="199.277976584945" font-size="48.781230133978" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--ok-text)">Single Thread</text>
  <rect x="40" y="479.381071046328" width="105.765441" height="140.618928953672" rx="16.142836246523" fill="url(#grad-warn)" stroke="var(--black)"/>
  <text x="92.88282" y="581.545811750256" font-size="40.651236121142" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--warn-text)">FD1</text>
  <rect x="404.74652" y="479.381071046328" width="105.765441" height="140.618928953672" rx="16.142836246523" fill="url(#grad-warn)" stroke="var(--black)"/>
  <text x="457.62934" y="581.545811750256" font-size="40.651236121142" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--warn-text)">FD2</text>
  <rect x="769.49304" y="479.381071046328" width="105.765441" height="140.618928953672" rx="16.142836246523" fill="url(#grad-warn)" stroke="var(--black)"/>
  <text x="822.37586" y="581.545811750256" font-size="40.651236121142" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--warn-text)">FD3</text>
  <rect x="1134.234559" y="479.381071046328" width="105.765441" height="140.618928953672" rx="16.142836246523" fill="url(#grad-warn)" stroke="var(--black)"/>
  <text x="1187.12218" y="581.545811750256" font-size="40.651236121142" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--warn-text)">FD4</text>
  <path d="M 640.0026 294.844868899211 L 92.88282 454.123244346527" stroke="var(--black)"/>
  <path d="M 640.0026 294.844868899211 L 457.62934 454.123244346527" stroke="var(--black)"/>
  <path d="M 640.0026 294.844868899211 L 822.37586 454.123244346527" stroke="var(--black)"/>
  <path d="M 640.0026 294.844868899211 L 1187.12218 454.123244346527" stroke="var(--black)"/>
</svg>

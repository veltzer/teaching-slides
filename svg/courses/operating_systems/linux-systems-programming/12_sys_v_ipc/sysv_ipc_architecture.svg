<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Kernel IPC namespace — central -->
  <rect x="390" y="260" width="500" height="140" rx="14" fill="#37474f" filter="url(#shadow)"/>
  <text x="640" y="295" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">Kernel IPC Namespace</text>
  <text x="640" y="318" font-family="Arial,sans-serif" font-size="13" fill="#cfd8dc" text-anchor="middle">Global IPC object table — indexed by integer key</text>
  <text x="640" y="340" font-family="monospace" font-size="13" fill="#80cbc4" text-anchor="middle">key_t key = ftok("/tmp/app", 42);</text>
  <text x="640" y="362" font-family="Arial,sans-serif" font-size="12" fill="#aaa" text-anchor="middle">ftok(pathname, proj_id) → deterministic key shared between processes</text>
  <text x="640" y="382" font-family="Arial,sans-serif" font-size="12" fill="#aaa" text-anchor="middle">ipcs -a  shows all IPC objects on the system</text>

  <!-- Process A (left) -->
  <rect x="30" y="280" width="180" height="100" rx="10" fill="#455a64" filter="url(#shadow)"/>
  <text x="120" y="316" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#eceff1" text-anchor="middle">Process A</text>
  <text x="120" y="338" font-family="Arial,sans-serif" font-size="12" fill="#b0bec5" text-anchor="middle">sender / writer</text>
  <text x="120" y="356" font-family="monospace" font-size="11" fill="#80cbc4" text-anchor="middle">ftok() → key</text>
  <line x1="210" y1="330" x2="388" y2="330" stroke="#80cbc4" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Process B (right) -->
  <rect x="1070" y="280" width="180" height="100" rx="10" fill="#455a64" filter="url(#shadow)"/>
  <text x="1160" y="316" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#eceff1" text-anchor="middle">Process B</text>
  <text x="1160" y="338" font-family="Arial,sans-serif" font-size="12" fill="#b0bec5" text-anchor="middle">receiver / reader</text>
  <text x="1160" y="356" font-family="monospace" font-size="11" fill="#80cbc4" text-anchor="middle">ftok() → same key</text>
  <line x1="892" y1="330" x2="1068" y2="330" stroke="#80cbc4" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Three IPC mechanisms below the kernel box -->

  <!-- Message Queue -->
  <rect x="80" y="470" width="330" height="210" rx="10" fill="#e3f2fd" filter="url(#shadow)" stroke="#1565c0" stroke-width="2"/>
  <rect x="80" y="470" width="330" height="38" rx="10" fill="url(#grad-accent)"/>
  <rect x="80" y="496" width="330" height="12" fill="url(#grad-accent)"/>
  <text x="245" y="496" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Message Queues</text>
  <text x="100" y="528" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#1565c0">Create/access:</text>
  <text x="100" y="546" font-family="monospace" font-size="12" fill="#333">msgget(key, IPC_CREAT|0666)</text>
  <text x="100" y="566" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#1565c0">Send / Receive:</text>
  <text x="100" y="584" font-family="monospace" font-size="12" fill="#555">msgsnd(id, &amp;msg, size, 0)</text>
  <text x="100" y="602" font-family="monospace" font-size="12" fill="#555">msgrcv(id, &amp;msg, size, type, 0)</text>
  <text x="100" y="624" font-family="Arial,sans-serif" font-size="12" fill="#555">Typed messages — select by mtype</text>
  <text x="100" y="642" font-family="Arial,sans-serif" font-size="12" fill="#555">Persistent until deleted or reboot</text>
  <text x="100" y="660" font-family="Arial,sans-serif" font-size="12" fill="#c62828">msgctl(id, IPC_RMID, NULL)  — delete</text>
  <line x1="245" y1="470" x2="490" y2="398" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  <!-- Semaphore Sets -->
  <rect x="475" y="470" width="330" height="210" rx="10" fill="#f3e5f5" filter="url(#shadow)" stroke="#7b1fa2" stroke-width="2"/>
  <rect x="475" y="470" width="330" height="38" rx="10" fill="#7b1fa2"/>
  <rect x="475" y="496" width="330" height="12" fill="#7b1fa2"/>
  <text x="640" y="496" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Semaphore Sets</text>
  <text x="495" y="528" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#7b1fa2">Create/access:</text>
  <text x="495" y="546" font-family="monospace" font-size="12" fill="#333">semget(key, nsems, IPC_CREAT|0666)</text>
  <text x="495" y="566" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#7b1fa2">P (wait) / V (signal):</text>
  <text x="495" y="584" font-family="monospace" font-size="12" fill="#555">semop(id, &amp;sops, nsops)</text>
  <text x="495" y="604" font-family="Arial,sans-serif" font-size="12" fill="#555">sem_op = -1  → decrement (lock)</text>
  <text x="495" y="622" font-family="Arial,sans-serif" font-size="12" fill="#555">sem_op = +1  → increment (unlock)</text>
  <text x="495" y="642" font-family="Arial,sans-serif" font-size="12" fill="#555">Atomic across all sems in set</text>
  <text x="495" y="660" font-family="Arial,sans-serif" font-size="12" fill="#c62828">semctl(id, 0, IPC_RMID)  — delete</text>
  <line x1="640" y1="470" x2="640" y2="400" stroke="#7b1fa2" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  <!-- Shared Memory -->
  <rect x="870" y="470" width="330" height="210" rx="10" fill="#e8f5e9" filter="url(#shadow)" stroke="#2e7d32" stroke-width="2"/>
  <rect x="870" y="470" width="330" height="38" rx="10" fill="#2e7d32"/>
  <rect x="870" y="496" width="330" height="12" fill="#2e7d32"/>
  <text x="1035" y="496" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Shared Memory</text>
  <text x="890" y="528" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#2e7d32">Create/access:</text>
  <text x="890" y="546" font-family="monospace" font-size="12" fill="#333">shmget(key, size, IPC_CREAT|0666)</text>
  <text x="890" y="566" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#2e7d32">Attach / Detach:</text>
  <text x="890" y="584" font-family="monospace" font-size="12" fill="#555">shmat(id, NULL, 0)  → ptr</text>
  <text x="890" y="602" font-family="monospace" font-size="12" fill="#555">shmdt(ptr)</text>
  <text x="890" y="622" font-family="Arial,sans-serif" font-size="12" fill="#555">Fastest IPC — zero-copy data sharing</text>
  <text x="890" y="640" font-family="Arial,sans-serif" font-size="12" fill="#555">Combine with semaphores for safety</text>
  <text x="890" y="660" font-family="Arial,sans-serif" font-size="12" fill="#c62828">shmctl(id, IPC_RMID, NULL)  — delete</text>
  <line x1="1035" y1="470" x2="790" y2="400" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  <!-- Top legend -->
  <rect x="30" y="30" width="1220" height="58" rx="8" fill="#eceff1" filter="url(#shadow)" stroke="#b0bec5" stroke-width="1"/>
  <text x="640" y="52" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#37474f" text-anchor="middle">System V IPC — Three Mechanisms, One Namespace</text>
  <text x="640" y="74" font-family="Arial,sans-serif" font-size="12" fill="#555" text-anchor="middle">All objects are kernel-managed and persist until deleted with IPC_RMID or system reboot  •  Identify objects with ipcs -a  •  Remove with ipcrm</text>
</svg>

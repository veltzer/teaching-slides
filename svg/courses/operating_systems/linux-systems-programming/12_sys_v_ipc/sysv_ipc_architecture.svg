<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="405.625" y="249.4444" width="468.7499" height="112.7777" rx="6" fill="var(--text-muted)" filter="url(#shadow)" />
  <text x="640" y="277.6389" font-family="Arial,sans-serif" font-size="15.6425" font-weight="bold" fill="var(--bg)" text-anchor="middle">Kernel IPC Namespace</text>
  <text x="640" y="296.1667" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--border)" text-anchor="middle">Global IPC object table — indexed by integer key</text>
  <text x="640" y="313.8889" font-family="monospace" font-size="11.2974" fill="var(--ok-accent)" text-anchor="middle">key_t key = ftok("/tmp/app", 42);</text>
  <text x="640" y="331.6111" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-faint)" text-anchor="middle">ftok(pathname, proj_id) → deterministic key shared between processes</text>
  <text x="640" y="347.7223" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-faint)" text-anchor="middle">ipcs -a  shows all IPC objects on the system</text>
  <rect x="68.125" y="265.5556" width="168.75" height="80.5556" rx="6" fill="var(--text-muted)" filter="url(#shadow)" />
  <text x="152.5" y="294.5556" font-family="Arial,sans-serif" font-size="13.0354" font-weight="bold" fill="var(--surface)" text-anchor="middle">Process A</text>
  <text x="152.5" y="312.2777" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--border)" text-anchor="middle">sender / writer</text>
  <text x="152.5" y="326.7777" font-family="monospace" font-size="10" fill="var(--ok-accent)" text-anchor="middle">ftok() → key</text>
  <line x1="236.875" y1="305.8333" x2="403.75" y2="305.8333" stroke="var(--ok-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="1043.125" y="265.5556" width="168.75" height="80.5556" rx="6" fill="var(--text-muted)" filter="url(#shadow)" />
  <text x="1127.5" y="294.5556" font-family="Arial,sans-serif" font-size="13.0354" font-weight="bold" fill="var(--surface)" text-anchor="middle">Process B</text>
  <text x="1127.5" y="312.2777" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--border)" text-anchor="middle">receiver / reader</text>
  <text x="1127.5" y="326.7777" font-family="monospace" font-size="10" fill="var(--ok-accent)" text-anchor="middle">ftok() → same key</text>
  <line x1="876.25" y1="305.8333" x2="1041.2499" y2="305.8333" stroke="var(--ok-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="115" y="418.6111" width="309.375" height="169.1667" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="115" y="418.6111" width="309.375" height="30.6111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="115" y="439.5556" width="309.375" height="9.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="269.6875" y="439.5556" font-family="Arial,sans-serif" font-size="13.9044" font-weight="bold" fill="var(--bg)" text-anchor="middle">Message Queues</text>
  <text x="133.75" y="465.3333" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--primary-accent)">Create/access:</text>
  <text x="133.75" y="479.8333" font-family="monospace" font-size="10.4284" fill="var(--text)">msgget(key, IPC_CREAT|0666)</text>
  <text x="133.75" y="495.9444" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--primary-accent)">Send / Receive:</text>
  <text x="133.75" y="510.4444" font-family="monospace" font-size="10.4284" fill="var(--text-muted)">msgsnd(id, &amp;msg, size, 0)</text>
  <text x="133.75" y="524.9444" font-family="monospace" font-size="10.4284" fill="var(--text-muted)">msgrcv(id, &amp;msg, size, type, 0)</text>
  <text x="133.75" y="542.6667" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">Typed messages — select by mtype</text>
  <text x="133.75" y="557.1667" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">Persistent until deleted or reboot</text>
  <text x="133.75" y="571.6667" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--danger-accent)">msgctl(id, IPC_RMID, NULL)  — delete</text>
  <line x1="269.6875" y1="418.6111" x2="499.375" y2="360.6111" stroke="var(--primary-border)" stroke-width="1.3333" stroke-dasharray="4.4444 3.5556" marker-end="url(#arrow)" />
  <rect x="485.3125" y="418.6111" width="309.375" height="169.1667" rx="6" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2" />
  <rect x="485.3125" y="418.6111" width="309.375" height="30.6111" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="485.3125" y="439.5556" width="309.375" height="9.6667" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="439.5556" font-family="Arial,sans-serif" font-size="13.9044" font-weight="bold" fill="var(--bg)" text-anchor="middle">Semaphore Sets</text>
  <text x="504.0625" y="465.3333" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--info-accent)">Create/access:</text>
  <text x="504.0625" y="479.8333" font-family="monospace" font-size="10.4284" fill="var(--text)">semget(key, nsems, IPC_CREAT|0666)</text>
  <text x="504.0625" y="495.9444" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--info-accent)">P (wait) / V (signal):</text>
  <text x="504.0625" y="510.4444" font-family="monospace" font-size="10.4284" fill="var(--text-muted)">semop(id, &amp;sops, nsops)</text>
  <text x="504.0625" y="526.5556" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">sem_op = -1  → decrement (lock)</text>
  <text x="504.0625" y="541.0556" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">sem_op = +1  → increment (unlock)</text>
  <text x="504.0625" y="557.1667" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">Atomic across all sems in set</text>
  <text x="504.0625" y="571.6667" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--danger-accent)">semctl(id, 0, IPC_RMID)  — delete</text>
  <line x1="640" y1="418.6111" x2="640" y2="362.2223" stroke="var(--info-border)" stroke-width="1.3333" stroke-dasharray="4.4444 3.5556" marker-end="url(#arrow)" />
  <rect x="855.6249" y="418.6111" width="309.375" height="169.1667" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="855.6249" y="418.6111" width="309.375" height="30.6111" rx="6" fill="var(--ok-accent)" />
  <rect x="855.6249" y="439.5556" width="309.375" height="9.6667" fill="var(--ok-accent)" rx="6"/>
  <text x="1010.3125" y="439.5556" font-family="Arial,sans-serif" font-size="13.9044" font-weight="bold" fill="var(--bg)" text-anchor="middle">Shared Memory</text>
  <text x="874.375" y="465.3333" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--ok-accent)">Create/access:</text>
  <text x="874.375" y="479.8333" font-family="monospace" font-size="10.4284" fill="var(--text)">shmget(key, size, IPC_CREAT|0666)</text>
  <text x="874.375" y="495.9444" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--ok-accent)">Attach / Detach:</text>
  <text x="874.375" y="510.4444" font-family="monospace" font-size="10.4284" fill="var(--text-muted)">shmat(id, NULL, 0)  → ptr</text>
  <text x="874.375" y="524.9444" font-family="monospace" font-size="10.4284" fill="var(--text-muted)">shmdt(ptr)</text>
  <text x="874.375" y="541.0556" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">Fastest IPC — zero-copy data sharing</text>
  <text x="874.375" y="555.5556" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">Combine with semaphores for safety</text>
  <text x="874.375" y="571.6667" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--danger-accent)">shmctl(id, IPC_RMID, NULL)  — delete</text>
  <line x1="1010.3125" y1="418.6111" x2="780.625" y2="362.2223" stroke="var(--ok-border)" stroke-width="1.3333" stroke-dasharray="4.4444 3.5556" marker-end="url(#arrow)" />
  <rect x="68.125" y="64.1667" width="1143.7499" height="46.7223" rx="6" fill="var(--surface)" filter="url(#shadow)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="81.8889" font-family="Arial,sans-serif" font-size="13.0354" font-weight="bold" fill="var(--text-muted)" text-anchor="middle">System V IPC — Three Mechanisms, One Namespace</text>
  <text x="640" y="99.6111" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)" text-anchor="middle">All objects are kernel-managed and persist until deleted with IPC_RMID or system reboot  •  Identify objects with ipcs -a  •  Remove with ipcrm</text>
</svg>
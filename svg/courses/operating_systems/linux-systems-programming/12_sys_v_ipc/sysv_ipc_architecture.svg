<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="394.098361" y="245.230687" width="491.803174" height="124.922993" rx="6.468237" fill="var(--text-muted)" />
  <text x="640" y="276.461519" font-family="Arial,sans-serif" font-size="16.863232" font-weight="bold" fill="var(--bg)" text-anchor="middle">Kernel IPC Namespace</text>
  <text x="640" y="296.984621" font-family="Arial,sans-serif" font-size="12.179043" fill="var(--border)" text-anchor="middle">Global IPC object table — indexed by integer key</text>
  <text x="640" y="316.615366" font-family="monospace" font-size="12.179043" fill="var(--ok-accent)" text-anchor="middle">key_t key = ftok("/tmp/app", 42);</text>
  <text x="640" y="336.246111" font-family="Arial,sans-serif" font-size="11.242226" fill="var(--text-faint)" text-anchor="middle">ftok(pathname, proj_id) → deterministic key shared between processes</text>
  <text x="640" y="354.092364" font-family="Arial,sans-serif" font-size="11.242226" fill="var(--text-faint)" text-anchor="middle">ipcs -a  shows all IPC objects on the system</text>
  <rect x="40" y="263.07694" width="177.04918" height="89.23082" rx="6.468237" fill="var(--text-muted)" />
  <text x="128.52459" y="295.200018" font-family="Arial,sans-serif" font-size="14.052675" font-weight="bold" fill="var(--surface)" text-anchor="middle">Process A</text>
  <text x="128.52459" y="314.830652" font-family="Arial,sans-serif" font-size="11.242226" fill="var(--border)" text-anchor="middle">sender / writer</text>
  <text x="128.52459" y="330.892191" font-family="monospace" font-size="10.780394" fill="var(--ok-accent)" text-anchor="middle">ftok() → key</text>
  <line x1="217.04918" y1="307.69224" x2="392.131148" y2="307.69224" stroke="var(--ok-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="1062.95082" y="263.07694" width="177.04918" height="89.23082" rx="6.468237" fill="var(--text-muted)" />
  <text x="1151.47541" y="295.200018" font-family="Arial,sans-serif" font-size="14.052675" font-weight="bold" fill="var(--surface)" text-anchor="middle">Process B</text>
  <text x="1151.47541" y="314.830652" font-family="Arial,sans-serif" font-size="11.242226" fill="var(--border)" text-anchor="middle">receiver / reader</text>
  <text x="1151.47541" y="330.892191" font-family="monospace" font-size="10.780394" fill="var(--ok-accent)" text-anchor="middle">ftok() → same key</text>
  <line x1="887.868852" y1="307.69224" x2="1060.983502" y2="307.69224" stroke="var(--ok-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="89.180328" y="432.615344" width="324.590164" height="187.384656" rx="6.468237" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="89.180328" y="432.615344" width="324.590164" height="33.907681" rx="6.468237" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="89.180328" y="455.815406" width="324.590164" height="10.707729" fill="var(--primary-fill)" rx="6.468237" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="251.47541" y="455.815406" font-family="Arial,sans-serif" font-size="14.989491" font-weight="bold" fill="var(--bg)" text-anchor="middle">Message Queues</text>
  <text x="108.852459" y="484.369166" font-family="Arial,sans-serif" font-size="12.179043" font-weight="bold" fill="var(--primary-accent)">Create/access:</text>
  <text x="108.852459" y="500.430705" font-family="monospace" font-size="11.242226" fill="var(--text)">msgget(key, IPC_CREAT|0666)</text>
  <text x="108.852459" y="518.276847" font-family="Arial,sans-serif" font-size="12.179043" font-weight="bold" fill="var(--primary-accent)">Send / Receive:</text>
  <text x="108.852459" y="534.338386" font-family="monospace" font-size="11.242226" fill="var(--text-muted)">msgsnd(id, &amp;msg, size, 0)</text>
  <text x="108.852459" y="550.399925" font-family="monospace" font-size="11.242226" fill="var(--text-muted)">msgrcv(id, &amp;msg, size, type, 0)</text>
  <text x="108.852459" y="570.03078" font-family="Arial,sans-serif" font-size="11.242226" fill="var(--text-muted)">Typed messages — select by mtype</text>
  <text x="108.852459" y="586.092319" font-family="Arial,sans-serif" font-size="11.242226" fill="var(--text-muted)">Persistent until deleted or reboot</text>
  <text x="108.852459" y="602.153858" font-family="Arial,sans-serif" font-size="11.242226" fill="var(--danger-accent)">msgctl(id, IPC_RMID, NULL)  — delete</text>
  <line x1="251.47541" y1="432.615344" x2="492.459016" y2="368.369189" stroke="var(--primary-border)" stroke-width="1.3333" stroke-dasharray="4.4444 3.5556" marker-end="url(#arrow)" />
  <rect x="477.704918" y="432.615344" width="324.590164" height="187.384656" rx="6.468237" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2" />
  <rect x="477.704918" y="432.615344" width="324.590164" height="33.907681" rx="6.468237" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="477.704918" y="455.815406" width="324.590164" height="10.707729" fill="var(--info-fill)" rx="6.468237" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="455.815406" font-family="Arial,sans-serif" font-size="14.989491" font-weight="bold" fill="var(--bg)" text-anchor="middle">Semaphore Sets</text>
  <text x="497.377049" y="484.369166" font-family="Arial,sans-serif" font-size="12.179043" font-weight="bold" fill="var(--info-accent)">Create/access:</text>
  <text x="497.377049" y="500.430705" font-family="monospace" font-size="11.242226" fill="var(--text)">semget(key, nsems, IPC_CREAT|0666)</text>
  <text x="497.377049" y="518.276847" font-family="Arial,sans-serif" font-size="12.179043" font-weight="bold" fill="var(--info-accent)">P (wait) / V (signal):</text>
  <text x="497.377049" y="534.338386" font-family="monospace" font-size="11.242226" fill="var(--text-muted)">semop(id, &amp;sops, nsops)</text>
  <text x="497.377049" y="552.184639" font-family="Arial,sans-serif" font-size="11.242226" fill="var(--text-muted)">sem_op = -1  → decrement (lock)</text>
  <text x="497.377049" y="568.246177" font-family="Arial,sans-serif" font-size="11.242226" fill="var(--text-muted)">sem_op = +1  → increment (unlock)</text>
  <text x="497.377049" y="586.092319" font-family="Arial,sans-serif" font-size="11.242226" fill="var(--text-muted)">Atomic across all sems in set</text>
  <text x="497.377049" y="602.153858" font-family="Arial,sans-serif" font-size="11.242226" fill="var(--danger-accent)">semctl(id, 0, IPC_RMID)  — delete</text>
  <line x1="640" y1="432.615344" x2="640" y2="370.153902" stroke="var(--info-border)" stroke-width="1.3333" stroke-dasharray="4.4444 3.5556" marker-end="url(#arrow)" />
  <rect x="866.229403" y="432.615344" width="324.590164" height="187.384656" rx="6.468237" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="866.229403" y="432.615344" width="324.590164" height="33.907681" rx="6.468237" fill="var(--ok-accent)" />
  <rect x="866.229403" y="455.815406" width="324.590164" height="10.707729" fill="var(--ok-accent)" rx="6.468237"/>
  <text x="1028.52459" y="455.815406" font-family="Arial,sans-serif" font-size="14.989491" font-weight="bold" fill="var(--bg)" text-anchor="middle">Shared Memory</text>
  <text x="885.901639" y="484.369166" font-family="Arial,sans-serif" font-size="12.179043" font-weight="bold" fill="var(--ok-accent)">Create/access:</text>
  <text x="885.901639" y="500.430705" font-family="monospace" font-size="11.242226" fill="var(--text)">shmget(key, size, IPC_CREAT|0666)</text>
  <text x="885.901639" y="518.276847" font-family="Arial,sans-serif" font-size="12.179043" font-weight="bold" fill="var(--ok-accent)">Attach / Detach:</text>
  <text x="885.901639" y="534.338386" font-family="monospace" font-size="11.242226" fill="var(--text-muted)">shmat(id, NULL, 0)  → ptr</text>
  <text x="885.901639" y="550.399925" font-family="monospace" font-size="11.242226" fill="var(--text-muted)">shmdt(ptr)</text>
  <text x="885.901639" y="568.246177" font-family="Arial,sans-serif" font-size="11.242226" fill="var(--text-muted)">Fastest IPC — zero-copy data sharing</text>
  <text x="885.901639" y="584.307716" font-family="Arial,sans-serif" font-size="11.242226" fill="var(--text-muted)">Combine with semaphores for safety</text>
  <text x="885.901639" y="602.153858" font-family="Arial,sans-serif" font-size="11.242226" fill="var(--danger-accent)">shmctl(id, IPC_RMID, NULL)  — delete</text>
  <line x1="1028.52459" y1="432.615344" x2="787.540984" y2="370.153902" stroke="var(--ok-border)" stroke-width="1.3333" stroke-dasharray="4.4444 3.5556" marker-end="url(#arrow)" />
  <rect x="40" y="40" width="1199.999895" height="51.753933" rx="6.468237" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="59.630745" font-family="Arial,sans-serif" font-size="14.052675" font-weight="bold" fill="var(--text-muted)" text-anchor="middle">System V IPC — Three Mechanisms, One Namespace</text>
  <text x="640" y="79.26149" font-family="Arial,sans-serif" font-size="11.242226" fill="var(--text-muted)" text-anchor="middle">All objects are kernel-managed and persist until deleted with IPC_RMID or system reboot  •  Identify objects with ipcs -a  •  Remove with ipcrm</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.592033994309" font-weight="bold" fill="var(--text)">System V IPC Architecture</text>

  <!-- Kernel namespace -->
  <rect x="390" y="87.454545454545" width="500" height="137.090909090909" rx="8.21528508884" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="124.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391449889" font-weight="bold" fill="var(--info-text)">Kernel IPC Namespace</text>
  <text x="640" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838269364" fill="var(--info-text)">Global object table, integer key</text>
  <text x="640" y="182.363636363636" text-anchor="middle" font-family="Courier New, monospace" font-size="13.349838269364" fill="var(--info-text)">key = ftok("/tmp/app", 42)</text>
  <text x="640" y="208.727272727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.322927633259" fill="var(--info-text)">ipcs -a lists objects</text>

  <!-- Processes -->
  <rect x="40" y="119.090909090909" width="170" height="73.818181818182" rx="6.16146381663" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="125" y="150.727272727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" font-weight="bold" fill="var(--text)">Process A</text>
  <text x="125" y="177.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.322927633259" fill="var(--text-muted)">writer</text>

  <rect x="1070" y="119.090909090909" width="170" height="73.818181818182" rx="6.16146381663" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1155" y="150.727272727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" font-weight="bold" fill="var(--text)">Process B</text>
  <text x="1155" y="177.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.322927633259" fill="var(--text-muted)">reader</text>

  <line x1="210" y1="156" x2="388" y2="156" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="890" y1="156" x2="1068" y2="156" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Message Queues -->
  <rect x="60" y="272" width="370" height="316.363636363636" rx="8.21528508884" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="245" y="308.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391449889" font-weight="bold" fill="var(--primary-text)">Message Queues</text>
  <text x="80" y="351.090909090909" font-family="Courier New, monospace" font-size="12.322927633259" fill="var(--primary-text)">msgget(key, IPC_CREAT|0666)</text>
  <text x="80" y="388" font-family="Courier New, monospace" font-size="12.322927633259" fill="var(--primary-text)">msgsnd(id, &amp;msg, size, 0)</text>
  <text x="80" y="414.363636363636" font-family="Courier New, monospace" font-size="12.322927633259" fill="var(--primary-text)">msgrcv(id, &amp;msg, size, type, 0)</text>
  <text x="80" y="456.545454545455" font-family="Arial, sans-serif" font-size="13.349838269364" fill="var(--primary-text)">Typed messages</text>
  <text x="80" y="488.181818181818" font-family="Arial, sans-serif" font-size="13.349838269364" fill="var(--primary-text)">Persistent</text>
  <text x="80" y="535.636363636364" font-family="Courier New, monospace" font-size="12.322927633259" fill="var(--primary-text)">msgctl(id, IPC_RMID, NULL)</text>

  <!-- Semaphores -->
  <rect x="455" y="272" width="370" height="316.363636363636" rx="8.21528508884" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="308.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391449889" font-weight="bold" fill="var(--info-text)">Semaphore Sets</text>
  <text x="475" y="351.090909090909" font-family="Courier New, monospace" font-size="12.322927633259" fill="var(--info-text)">semget(key, nsems, 0666)</text>
  <text x="475" y="388" font-family="Courier New, monospace" font-size="12.322927633259" fill="var(--info-text)">semop(id, &amp;sops, nsops)</text>
  <text x="475" y="424.909090909091" font-family="Arial, sans-serif" font-size="13.349838269364" fill="var(--info-text)">op = -1 → wait</text>
  <text x="475" y="456.545454545455" font-family="Arial, sans-serif" font-size="13.349838269364" fill="var(--info-text)">op = +1 → signal</text>
  <text x="475" y="488.181818181818" font-family="Arial, sans-serif" font-size="13.349838269364" fill="var(--info-text)">Atomic in set</text>
  <text x="475" y="535.636363636364" font-family="Courier New, monospace" font-size="12.322927633259" fill="var(--info-text)">semctl(id, 0, IPC_RMID)</text>

  <!-- Shared Memory -->
  <rect x="850" y="272" width="370" height="316.363636363636" rx="8.21528508884" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1035" y="308.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391449889" font-weight="bold" fill="var(--ok-text)">Shared Memory</text>
  <text x="870" y="351.090909090909" font-family="Courier New, monospace" font-size="12.322927633259" fill="var(--ok-text)">shmget(key, size, 0666)</text>
  <text x="870" y="388" font-family="Courier New, monospace" font-size="12.322927633259" fill="var(--ok-text)">ptr = shmat(id, NULL, 0)</text>
  <text x="870" y="414.363636363636" font-family="Courier New, monospace" font-size="12.322927633259" fill="var(--ok-text)">shmdt(ptr)</text>
  <text x="870" y="456.545454545455" font-family="Arial, sans-serif" font-size="13.349838269364" fill="var(--ok-text)">Zero-copy, fastest</text>
  <text x="870" y="488.181818181818" font-family="Arial, sans-serif" font-size="13.349838269364" fill="var(--ok-text)">Combine with sems</text>
  <text x="870" y="535.636363636364" font-family="Courier New, monospace" font-size="12.322927633259" fill="var(--ok-text)">shmctl(id, IPC_RMID, NULL)</text>

  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838269364" fill="var(--text-muted)">Kernel-managed; persist until IPC_RMID or reboot</text>
</svg>

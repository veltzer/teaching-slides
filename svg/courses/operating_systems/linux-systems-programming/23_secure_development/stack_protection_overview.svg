<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="57.6" font-size="35.84" font-weight="bold" text-anchor="middle">Stack Layout and Protection</text>
  <rect x="384" y="144" width="256" height="86.4" fill="lightblue" stroke="black" />
  <text x="512" y="201.6" font-size="25.6" text-anchor="middle">Return Address</text>
  <rect x="384" y="230.4" width="256" height="86.4" fill="yellow" stroke="black" />
  <text x="512" y="288" font-size="25.6" text-anchor="middle">Stack Canary</text>
  <rect x="384" y="316.8" width="256" height="86.4" fill="lightgreen" stroke="black" />
  <text x="512" y="374.4" font-size="25.6" text-anchor="middle">Local Variables</text>
  <rect x="384" y="403.2" width="256" height="86.4" fill="lightcoral" stroke="black" />
  <text x="512" y="460.8" font-size="25.6" text-anchor="middle">Buffer</text>
  <text x="768" y="288" font-size="25.6">← Stack Canary detects</text>
  <text x="768" y="331.2" font-size="25.6">overflow before return</text>
  <text x="512" y="576" font-size="30.72" text-anchor="middle">Stack grows downward</text>
  <path d="M 512 532.8 L 512 504" stroke="black" marker-end="url(#arrowhead)" />
  <defs>
    <marker id="arrowhead" markerWidth="25.6" markerHeight="20.16" refX="0" refY="10.08" orient="auto">
      <polygon points="0,28.8 8.96,0" fill="black" />
    </marker>
  </defs>
</svg>
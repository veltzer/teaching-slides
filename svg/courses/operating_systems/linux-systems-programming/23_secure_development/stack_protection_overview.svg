<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="646.153846" height="115.99999956" rx="6.941514094379" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="363.076923" y="109.599999736" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.079893360168" font-weight="bold" fill="var(--bg)">Return Address</text>

  <rect x="40" y="167.600000066" width="646.153846" height="115.99999956" rx="6.941514094379" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="363.076923" y="237.199999802" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.079893360168" font-weight="bold" fill="var(--bg)">Stack Canary</text>

  <rect x="40" y="295.200000132" width="646.153846" height="115.99999956" rx="6.941514094379" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="363.076923" y="364.799999868" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.079893360168" font-weight="bold" fill="var(--bg)">Local Variables</text>

  <rect x="40" y="422.800000198" width="646.153846" height="115.99999956" rx="6.941514094379" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="363.076923" y="492.399999934" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.079893360168" font-weight="bold" fill="var(--bg)">Buffer (overflow source)</text>

  <rect x="732.307692" y="167.600000066" width="507.692308" height="232.00000022" rx="6.941514094379" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="986.153846" y="213.99999989" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.824541234329" font-weight="bold" fill="var(--text)">Canary check</text>
  <text x="986.153846" y="260.399999714" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.196866220218" fill="var(--text-muted)">Compiler inserts a random value</text>
  <text x="986.153846" y="295.200000132" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.196866220218" fill="var(--text-muted)">before the saved return address.</text>
  <text x="986.153846" y="341.599999956" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.196866220218" fill="var(--text-muted)">Overflow corrupts the canary;</text>
  <text x="986.153846" y="376.400000374" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.196866220218" fill="var(--text-muted)">mismatch aborts via __stack_chk_fail.</text>

  <text x="363.076923" y="585.199999582" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.824541234329" font-weight="bold" fill="var(--text)">Stack grows downward — overflow climbs up</text>
  <line x1="363.076923" y1="620" x2="363.076923" y2="550.400000264" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

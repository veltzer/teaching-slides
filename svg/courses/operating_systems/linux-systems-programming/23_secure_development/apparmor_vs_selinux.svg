<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" font-size="35.84" font-weight="bold" text-anchor="middle">Mandatory Access Control</text>
  <rect x="128" y="180" width="384" height="432" fill="lightblue" stroke="black" />
  <text x="320" y="252" font-size="30.72" font-weight="bold" text-anchor="middle">AppArmor</text>
  <text x="320" y="324" font-size="25.6" text-anchor="middle">• Path-based</text>
  <text x="320" y="378" font-size="25.6" text-anchor="middle">• Application profiles</text>
  <text x="320" y="432" font-size="25.6" text-anchor="middle">• Easier to configure</text>
  <text x="320" y="486" font-size="25.6" text-anchor="middle">• Ubuntu default</text>
  <text x="320" y="540" font-size="25.6" text-anchor="middle">• Learning mode</text>
  <rect x="768" y="180" width="384" height="432" fill="lightgreen" stroke="black" />
  <text x="960" y="252" font-size="30.72" font-weight="bold" text-anchor="middle">SELinux</text>
  <text x="960" y="324" font-size="25.6" text-anchor="middle">• Label-based</text>
  <text x="960" y="378" font-size="25.6" text-anchor="middle">• Type enforcement</text>
  <text x="960" y="432" font-size="25.6" text-anchor="middle">• More granular</text>
  <text x="960" y="486" font-size="25.6" text-anchor="middle">• RHEL/Fedora default</text>
  <text x="960" y="540" font-size="25.6" text-anchor="middle">• Complex policies</text>
</svg>
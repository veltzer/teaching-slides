<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <style>
    .txt { font-family: sans-serif; font-size: 14px; }
    .arr { stroke: #333; stroke-width: 2; marker-end: url(#arrowhead); }
    .box { fill: #eef; stroke: #99c; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="16" refY="18" markerWidth="19.2" markerHeight="21.6" orient="auto-start-reverse">
      <path d="M 0 0 L 32 18 L 0 36 z" fill="#333" />
    </marker>
  </defs>
  <text x="32" y="90" class="txt">Sender</text>
  <text x="896" y="90" class="txt">Receiver's Pending Signals</text>
  <line x1="320" y1="216" x2="800" y2="216" class="arr" />
  <text x="416" y="198" class="txt">SIGUSR1</text>
  <line x1="320" y1="324" x2="800" y2="324" class="arr" />
  <text x="416" y="306" class="txt">SIGUSR1</text>
  <line x1="320" y1="432" x2="800" y2="432" class="arr" />
  <text x="416" y="414" class="txt">SIGUSR1</text>
  <rect x="896" y="252" width="320" height="180" class="box" />
  <text x="944" y="360" class="txt">SIGUSR1 (x1)</text>
  <text x="32" y="648" class="txt" fill="red">Result: 2 signals were lost.</text>
</svg>
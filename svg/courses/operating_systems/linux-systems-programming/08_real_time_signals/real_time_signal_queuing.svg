<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <style>
    .txt { font-family: sans-serif; font-size: 14px; }
    .arr { stroke: #333; stroke-width: 2; marker-end: url(#arrowhead); }
    .box { fill: #efe; stroke: #9c9; stroke-width: 1; }
    .qitem { fill: #fff; stroke: #9c9; }
  </style>
  <text x="32" y="90" class="txt">Sender</text>
  <text x="896" y="90" class="txt">Receiver's Signal Queue</text>
  <line x1="320" y1="216" x2="800" y2="216" class="arr" />
  <text x="416" y="198" class="txt">SIGRTMIN+1</text>
  <line x1="320" y1="360" x2="800" y2="360" class="arr" />
  <text x="416" y="342" class="txt">SIGRTMIN+1</text>
  <line x1="320" y1="504" x2="800" y2="504" class="arr" />
  <text x="416" y="486" class="txt">SIGRTMIN+1</text>
  <rect x="896" y="144" width="352" height="432" class="box" />
  <rect x="928" y="180" width="288" height="108" class="qitem" />
  <text x="944" y="252" class="txt">SIGRTMIN+1</text>
  <rect x="928" y="324" width="288" height="108" class="qitem" />
  <text x="944" y="396" class="txt">SIGRTMIN+1</text>
  <rect x="928" y="468" width="288" height="108" class="qitem" />
  <text x="944" y="540" class="txt">SIGRTMIN+1</text>
  <text x="32" y="648" class="txt" fill="green">Result: All 3 signals are queued.</text>
</svg>
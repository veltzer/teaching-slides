<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <style>
    .txt { font-family: sans-serif; font-size: 14px; }
    .arr { stroke: #333; stroke-width: 2; marker-end: url(#arrow); }
    .box { fill: #e8f5e9; stroke: #a5d6a7; stroke-width: 1; }
    .qitem { fill: #fff; stroke: #a5d6a7; }
  </style>
  <text x="40" y="40" class="txt" font-family="Arial, sans-serif" fill="var(--text)">Sender</text>
  <text x="892.6316" y="40" class="txt" font-family="Arial, sans-serif" fill="var(--text)">Receiver's Signal Queue</text>
  <line x1="324.2106" y1="170.9677" x2="797.8948" y2="170.9677" class="arr"/>
  <text x="418.9474" y="152.2581" class="txt" font-family="Arial, sans-serif" fill="var(--text)">SIGRTMIN+1</text>
  <line x1="324.2106" y1="320.6452" x2="797.8948" y2="320.6452" class="arr"/>
  <text x="418.9474" y="301.9355" class="txt" font-family="Arial, sans-serif" fill="var(--text)">SIGRTMIN+1</text>
  <line x1="324.2106" y1="470.3226" x2="797.8948" y2="470.3226" class="arr"/>
  <text x="418.9474" y="451.6129" class="txt" font-family="Arial, sans-serif" fill="var(--text)">SIGRTMIN+1</text>
  <rect x="892.6316" y="96.129" width="347.3684" height="449.0323" class="box" rx="6"/>
  <rect x="924.2105" y="133.5484" width="284.2105" height="112.2581" class="qitem" rx="6"/>
  <text x="940" y="208.3871" class="txt" font-family="Arial, sans-serif" fill="var(--text)">SIGRTMIN+1</text>
  <rect x="924.2105" y="283.2258" width="284.2105" height="112.2581" class="qitem" rx="6"/>
  <text x="940" y="358.0645" class="txt" font-family="Arial, sans-serif" fill="var(--text)">SIGRTMIN+1</text>
  <rect x="924.2105" y="432.9032" width="284.2105" height="112.2581" class="qitem" rx="6"/>
  <text x="940" y="507.7419" class="txt" font-family="Arial, sans-serif" fill="var(--text)">SIGRTMIN+1</text>
  <text x="40" y="620" class="txt" fill="var(--ok-accent)" font-family="Arial, sans-serif">Result: All 3 signals are queued.</text>
</svg>

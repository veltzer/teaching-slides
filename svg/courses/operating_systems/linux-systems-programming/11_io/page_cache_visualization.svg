<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <style>
    .txt { font-family: sans-serif; font-size: 12px; text-anchor: middle; }
    .title { font-weight: bold; }
    .box { stroke: #333; stroke-width: 1; fill: #fff; }
    .user { fill: #e8f4f8; }
    .kern { fill: #e8f5e9; }
    .disk { fill: #ffebee; }
    .arr { stroke: #555; stroke-width: 1.5; marker-end: url(#arrow); fill: none; }
  </style>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 32 14.4 L 0 28.8 z" fill="#555" />
    </marker>
  </defs>
  <rect x="181.0628" y="80" width="241.5458" height="173.9131" class="box user" rx="6.1141"/>
  <text x="301.8357" y="177.8261" class="txt">User Process</text>
  <rect x="519.2271" y="80" width="579.7101" height="391.3043" class="box kern" rx="6.1141"/>
  <text x="809.0821" y="123.4783" class="txt title">Kernel Space</text>
  <rect x="567.5362" y="166.9566" width="483.0918" height="260.8695" class="box" rx="6.1141"/>
  <text x="809.0821" y="210.4348" class="txt">Page Cache (RAM)</text>
  <rect x="591.6908" y="243.0435" width="120.7729" height="65.2174" fill="var(--ok-fill)" rx="6.1141" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="652.0772" y="286.5218" class="txt">Clean</text>
  <rect x="736.6183" y="243.0435" width="120.7729" height="65.2174" fill="var(--danger-fill)" rx="6.1141" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="797.0047" y="286.5218" class="txt">Dirty</text>
  <rect x="881.5458" y="243.0435" width="120.7729" height="65.2174" fill="var(--ok-fill)" rx="6.1141" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="941.9324" y="286.5218" class="txt">Clean</text>
  <rect x="519.2271" y="514.7826" width="579.7101" height="65.2174" class="box disk" rx="6.1141"/>
  <text x="809.0821" y="558.2609" class="txt">Disk Hardware</text>
  <path d="M 301.8357 264.7827 L 301.8357 340.8695 L 555.4589 340.8695" class="arr" />
  <text x="398.4541" y="308.2609" class="txt">read()</text>
  <path d="M 688.3092 438.6956 L 688.3092 503.913" class="arr" />
  <text x="640" y="482.1739" class="txt">Disk Read</text>
  <path d="M 809.0821 438.6956 L 809.0821 503.913" class="arr" />
  <text x="857.3913" y="482.1739" class="txt">Disk Write</text>
</svg>
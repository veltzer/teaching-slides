<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <style>
    .txt { font-family: sans-serif; font-size: 12px; text-anchor: middle; }
    .title { font-weight: bold; }
    .box { stroke: #333; stroke-width: 1; fill: #fff; }
    .user { fill: #e8f4f8; }
    .kern { fill: #e8f5e9; }
    .disk { fill: #ffebee; }
    .arr { stroke: #555; stroke-width: 1.5; marker-end: url(#arrow); fill: none; }
  </style>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 32 14.4 L 0 28.8 z" fill="#555" />
    </marker>
  </defs>
  <rect x="143.2243" y="63.2816" width="191.0674" height="137.5686" class="box user" rx="6" />
  <text x="238.758" y="140.664" class="txt">User Process</text>
  <rect x="410.7189" y="63.2816" width="458.5621" height="309.5295" class="box kern" rx="6" />
  <text x="640" y="97.6738" class="txt title">Kernel Space</text>
  <rect x="448.9324" y="132.066" width="382.1351" height="206.353" class="box" rx="6" />
  <text x="640" y="166.4581" class="txt">Page Cache (RAM)</text>
  <rect x="468.0392" y="192.2522" width="95.5338" height="51.5883" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="1.582" />
  <text x="515.806" y="226.6444" class="txt">Clean</text>
  <rect x="582.6797" y="192.2522" width="95.5338" height="51.5883" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="1.582" />
  <text x="630.4465" y="226.6444" class="txt">Dirty</text>
  <rect x="697.3201" y="192.2522" width="95.5338" height="51.5883" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="1.582" />
  <text x="745.0871" y="226.6444" class="txt">Clean</text>
  <rect x="410.7189" y="407.2033" width="458.5621" height="51.5883" class="box disk" rx="6" />
  <text x="640" y="441.5955" class="txt">Disk Hardware</text>
  <path d="M 238.758 209.4484 L 238.758 269.6345 L 439.379 269.6345" class="arr" />
  <text x="315.1851" y="243.8405" class="txt">read()</text>
  <path d="M 544.4662 347.0168 L 544.4662 398.6051" class="arr" />
  <text x="506.2527" y="381.409" class="txt">Disk Read</text>
  <path d="M 640 347.0168 L 640 398.6051" class="arr" />
  <text x="678.2135" y="381.409" class="txt">Disk Write</text>
</svg>
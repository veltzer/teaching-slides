<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <style>
    .txt { font-family: sans-serif; font-size: 12px; text-anchor: middle; }
    .title { font-weight: bold; }
    .box { stroke: #333; stroke-width: 1; fill: #fff; }
    .user { fill: #e8f4f8; }
    .kern { fill: #e8f5e9; }
    .disk { fill: #ffebee; }
    .arr { stroke: #555; stroke-width: 1.5; marker-end: url(#arrow); fill: none; }
  </style>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 32 14.4 L 0 28.8 z" fill="#555" />
    </marker>
  </defs>
  <rect x="40" y="40" width="315.7892" height="201.739" class="box user" rx="6" />
  <text x="197.8946" y="153.4783" class="txt">User Process</text>
  <rect x="482.1053" y="40" width="757.8947" height="453.9129" class="box kern" rx="6" />
  <text x="861.0527" y="90.4348" class="txt title">Kernel Space</text>
  <rect x="545.2632" y="140.8696" width="631.5789" height="302.6086" class="box" rx="6" />
  <text x="861.0527" y="191.3043" class="txt">Page Cache (RAM)</text>
  <rect x="576.8422" y="229.1304" width="157.8948" height="75.6522" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" />
  <text x="655.7894" y="279.5652" class="txt">Clean</text>
  <rect x="766.3158" y="229.1304" width="157.8948" height="75.6522" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2" />
  <text x="845.2631" y="279.5652" class="txt">Dirty</text>
  <rect x="955.7893" y="229.1304" width="157.8948" height="75.6522" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1034.7369" y="279.5652" class="txt">Clean</text>
  <rect x="482.1053" y="544.3478" width="757.8947" height="75.6522" class="box disk" rx="6" />
  <text x="861.0527" y="594.7826" class="txt">Disk Hardware</text>
  <path d="M 197.8946 254.3479 L 197.8946 342.6085 L 529.4737 342.6085" class="arr" />
  <text x="324.2105" y="304.7826" class="txt">read()</text>
  <path d="M 703.158 456.0866 L 703.158 531.7388" class="arr" />
  <text x="640.0001" y="506.5214" class="txt">Disk Read</text>
  <path d="M 861.0527 456.0866 L 861.0527 531.7388" class="arr" />
  <text x="924.2106" y="506.5214" class="txt">Disk Write</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <style>
    .txt { font-family: sans-serif; font-size: 12px; text-anchor: middle; }
    .title { font-weight: bold; }
    .box { stroke: #333; stroke-width: 1; fill: #fff; }
    .user { fill: #eef; }
    .kern { fill: #efe; }
    .disk { fill: #fee; }
    .arr { stroke: #555; stroke-width: 1.5; marker-end: url(#arrowhead); fill: none; }
  </style>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="25.6" refY="14.4" markerWidth="19.2" markerHeight="17.28" orient="auto-start-reverse">
      <path d="M 0 0 L 32 14.4 L 0 28.8 z" fill="#555" />
    </marker>
  </defs>
  <rect x="32" y="28.8" width="320" height="230.4" class="box user" />
  <text x="192" y="158.4" class="txt">User Process</text>
  <rect x="480" y="28.8" width="768" height="518.4" class="box kern" />
  <text x="864" y="86.4" class="txt title">Kernel Space</text>
  <rect x="544" y="144" width="640" height="345.6" class="box" />
  <text x="864" y="201.6" class="txt">Page Cache (RAM)</text>
  <rect x="576" y="244.8" width="160" height="86.4" fill="#cfc" />
  <text x="656" y="302.4" class="txt">Clean</text>
  <rect x="768" y="244.8" width="160" height="86.4" fill="#fcc" />
  <text x="848" y="302.4" class="txt">Dirty</text>
  <rect x="960" y="244.8" width="160" height="86.4" fill="#cfc" />
  <text x="1040" y="302.4" class="txt">Clean</text>
  <rect x="480" y="604.8" width="768" height="86.4" class="box disk" />
  <text x="864" y="662.4" class="txt">Disk Hardware</text>
  <path d="M 192 273.6 L 192 374.4 L 528 374.4" class="arr" />
  <text x="320" y="331.2" class="txt">read()</text>
  <path d="M 704 504 L 704 590.4" class="arr" />
  <text x="640" y="561.6" class="txt">Disk Read</text>
  <path d="M 864 504 L 864 590.4" class="arr" />
  <text x="928" y="561.6" class="txt">Disk Write</text>
</svg>
<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <style>
    .txt { font-family: sans-serif; font-size: 12px; text-anchor: middle; }
    .title { font-weight: bold; }
    .box { stroke: #333; stroke-width: 1; fill: #fff; }
    .user { fill: #eef; }
    .kern { fill: #efe; }
    .disk { fill: #fee; }
    .arr { stroke: #555; stroke-width: 1.5; marker-end: url(#arrowhead); fill: none; }
  </style>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555" /></marker>
  </defs>

  <rect x="10" y="10" width="100" height="80" class="box user" />
  <text x="60" y="55" class="txt">User Process</text>

  <rect x="150" y="10" width="240" height="180" class="box kern" />
  <text x="270" y="30" class="txt title">Kernel Space</text>
  <rect x="170" y="50" width="200" height="120" class="box" />
  <text x="270" y="70" class="txt">Page Cache (RAM)</text>
  <rect x="180" y="85" width="50" height="30" fill="#cfc" /><text x="205" y="105" class="txt">Clean</text>
  <rect x="240" y="85" width="50" height="30" fill="#fcc" /><text x="265" y="105" class="txt">Dirty</text>
  <rect x="300" y="85" width="50" height="30" fill="#cfc" /><text x="325" y="105" class="txt">Clean</text>

  <rect x="150" y="210" width="240" height="30" class="box disk" />
  <text x="270" y="230" class="txt">Disk Hardware</text>

  <path d="M 60 95 L 60 130 L 165 130" class="arr" /><text x="100" y="115" class="txt">read()</text>
  <path d="M 220 175 L 220 205" class="arr" /><text x="200" y="195" class="txt">Disk Read</text>
  <path d="M 270 175 L 270 205" class="arr" /><text x="290" y="195" class="txt">Disk Write</text>
</svg>

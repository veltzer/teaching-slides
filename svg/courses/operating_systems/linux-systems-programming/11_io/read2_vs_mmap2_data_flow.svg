<svg viewBox="0 0 450 250" xmlns="http://www.w3.org/2000/svg">
  <style>
    .txt { font-family: sans-serif; font-size: 12px; text-anchor: middle; }
    .title { font-weight: bold; }
    .box { stroke: #333; stroke-width: 1; fill: #f9f9f9; }
    .arr { stroke: #555; stroke-width: 1.5; marker-end: url(#arrowhead); fill: none; }
  </style>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555" /></marker>
  </defs>

  <text x="100" y="20" class="txt title">read(2)</text>
  <rect x="20" y="30" width="160" height="50" class="box" /><text x="100" y="60" class="txt">User Buffer</text>
  <rect x="20" y="100" width="160" height="50" class="box" /><text x="100" y="130" class="txt">Kernel Page Cache</text>
  <rect x="20" y="170" width="160" height="50" class="box" /><text x="100" y="200" class="txt">Disk</text>
  <path d="M 100 165 L 100 155" class="arr" /><text x="125" y="160" class="txt">DMA</text>
  <path d="M 100 95 L 100 85" class="arr" /><text x="125" y="90" class="txt">CPU Copy</text>

  <text x="350" y="20" class="txt title">mmap(2)</text>
  <rect x="270" y="30" width="160" height="50" class="box" /><text x="350" y="60" class="txt">User Mapping</text>
  <rect x="270" y="100" width="160" height="50" class="box" /><text x="350" y="130" class="txt">Kernel Page Cache</text>
  <rect x="270" y="170" width="160" height="50" class="box" /><text x="350" y="200" class="txt">Disk</text>
  <path d="M 350 165 L 350 155" class="arr" /><text x="375" y="160" class="txt">DMA</text>
  <path d="M 350 100 L 350 80" stroke-dasharray="4" stroke-width="1" /><text x="390" y="90" class="txt">Direct Access</text>
</svg>

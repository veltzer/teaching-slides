<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="450.0001" height="446.153846153846" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.656402354703" filter="url(#shadow)"/>
  <text x="265" y="129.230769230769" font-size="37.021356736307" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--primary-text)">Namespace A</text>
  <rect x="148.287" y="211.737846153846" width="83.4266" height="102.678892307692" rx="15.531605494306" fill="url(#grad-warn)" stroke="var(--black)" filter="url(#shadow)"/>
  <text x="189.9999" y="285.384615384615" font-size="30.851204573616" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--warn-text)">PID 1</text>
  <rect x="298.287" y="211.737846153846" width="83.4266" height="102.678892307692" rx="15.531605494306" fill="url(#grad-warn)" stroke="var(--black)" filter="url(#shadow)"/>
  <text x="340" y="285.384615384615" font-size="30.851204573616" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--warn-text)">PID 2</text>
  <rect x="789.9999" y="40" width="450.0001" height="446.153846153846" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.656402354703" filter="url(#shadow)"/>
  <text x="1014.9999" y="129.230769230769" font-size="37.021356736307" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--ok-text)">Namespace B</text>
  <rect x="898.287" y="211.737846153846" width="83.4266" height="102.678892307692" rx="15.531605494306" fill="url(#grad-warn)" stroke="var(--black)" filter="url(#shadow)"/>
  <text x="940" y="285.384615384615" font-size="30.851204573616" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--warn-text)">PID 1</text>
  <rect x="1048.29" y="211.737846153846" width="83.4266" height="102.678892307692" rx="15.531605494306" fill="url(#grad-warn)" stroke="var(--black)" filter="url(#shadow)"/>
  <text x="1089.9999" y="285.384615384615" font-size="30.851204573616" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--warn-text)">PID 2</text>
  <text x="640" y="620" font-size="30.851204573616" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--text)">Same PID numbers, different processes</text>
</svg>

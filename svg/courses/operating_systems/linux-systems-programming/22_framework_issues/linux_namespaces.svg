<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" font-size="35.84" font-weight="bold" text-anchor="middle">Process Isolation with Namespaces</text>
  <rect x="128" y="180" width="384" height="360" fill="lightblue" stroke="black" stroke-width="5.12" />
  <text x="320" y="252" font-size="30.72" font-weight="bold" text-anchor="middle">Namespace A</text>
  <circle cx="256" cy="360" r="38.4" fill="yellow" stroke="black" />
  <text x="256" y="378" font-size="25.6" text-anchor="middle">PID 1</text>
  <circle cx="384" cy="360" r="38.4" fill="yellow" stroke="black" />
  <text x="384" y="378" font-size="25.6" text-anchor="middle">PID 2</text>
  <rect x="768" y="180" width="384" height="360" fill="lightgreen" stroke="black" stroke-width="5.12" />
  <text x="960" y="252" font-size="30.72" font-weight="bold" text-anchor="middle">Namespace B</text>
  <circle cx="896" cy="360" r="38.4" fill="orange" stroke="black" />
  <text x="896" y="378" font-size="25.6" text-anchor="middle">PID 1</text>
  <circle cx="1024" cy="360" r="38.4" fill="orange" stroke="black" />
  <text x="1024" y="378" font-size="25.6" text-anchor="middle">PID 2</text>
  <text x="640" y="648" font-size="25.6" text-anchor="middle">Same PID numbers, different processes</text>
</svg>
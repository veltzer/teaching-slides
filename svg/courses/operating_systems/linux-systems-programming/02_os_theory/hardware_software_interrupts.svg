<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="681.3793" y="40" text-anchor="middle" font-size="30.7693" font-weight="bold" fill="var(--text)">IDT Entry Structure</text>
  <rect x="40" y="70.13" width="310.3449" height="67.7922" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="195.1723" y="112.3117" text-anchor="middle" font-size="20.5129" fill="var(--text)">Offset 31-16</text>
  <rect x="371.0344" y="70.13" width="310.3449" height="67.7922" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="526.2068" y="112.3117" text-anchor="middle" font-size="20.5129" fill="var(--text)">Offset 63-32</text>
  <rect x="702.069" y="70.13" width="206.8965" height="67.7922" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="805.5172" y="112.3117" text-anchor="middle" font-size="20.5129" fill="var(--text)">Type</text>
  <rect x="929.6552" y="70.13" width="206.8965" height="67.7922" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1033.1034" y="112.3117" text-anchor="middle" font-size="20.5129" fill="var(--text)">DPL</text>
  <rect x="40" y="152.9871" width="310.3449" height="67.7922" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="195.1723" y="195.1689" text-anchor="middle" font-size="20.5129" fill="var(--text)">Selector</text>
  <rect x="371.0344" y="152.9871" width="310.3449" height="67.7922" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="526.2068" y="195.1689" text-anchor="middle" font-size="20.5129" fill="var(--text)">Offset 15-0</text>
  <rect x="702.069" y="152.9871" width="206.8965" height="67.7922" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="805.5172" y="195.1689" text-anchor="middle" font-size="20.5129" fill="var(--text)">IST</text>
  <rect x="929.6552" y="152.9871" width="206.8965" height="67.7922" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1033.1034" y="195.1689" text-anchor="middle" font-size="20.5129" fill="var(--text)">Resv</text>
  <text x="681.3793" y="296.1039" text-anchor="middle" font-size="27.3505" font-weight="bold" fill="var(--text)">Important Vectors</text>
  <rect x="122.7585" y="326.2338" width="1117.2415" height="67.7922" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="164.1378" y="368.4156" font-size="22.2223" fill="var(--text)">0x00-0x1F: CPU Exceptions</text>
  <rect x="122.7585" y="409.0908" width="1117.2415" height="67.7922" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="164.1378" y="451.2727" font-size="22.2223" fill="var(--text)">0x20-0x2F: Hardware IRQs</text>
  <rect x="122.7585" y="491.9481" width="1117.2415" height="67.7922" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="164.1378" y="534.1299" font-size="22.2223" fill="var(--text)">0x30-0xFF: Software Interrupts</text>
  <rect x="122.7585" y="574.8052" width="1117.2415" height="45.1948" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="164.1378" y="606.4415" font-size="22.2223" fill="var(--text)">0x80: Legacy System Call</text>
</svg>
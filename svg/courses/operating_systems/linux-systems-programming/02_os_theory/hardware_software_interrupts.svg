<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="310.3449" height="71.506857984615" rx="6.162192118737" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="195.1723" y="84.493036535908" text-anchor="middle" font-size="21.067405118739" fill="var(--text)" font-family="Arial, sans-serif">Offset 31-16</text>
  <rect x="371.0344" y="40" width="310.3449" height="71.506857984615" rx="6.162192118737" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="526.2068" y="84.493036535908" text-anchor="middle" font-size="21.067405118739" fill="var(--text)" font-family="Arial, sans-serif">Offset 63-32</text>
  <rect x="702.069" y="40" width="206.8965" height="71.506857984615" rx="6.162192118737" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="805.5172" y="84.493036535908" text-anchor="middle" font-size="21.067405118739" fill="var(--text)" font-family="Arial, sans-serif">Type</text>
  <rect x="929.6552" y="40" width="206.8965" height="71.506857984615" rx="6.162192118737" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1033.1034" y="84.493036535908" text-anchor="middle" font-size="21.067405118739" fill="var(--text)" font-family="Arial, sans-serif">DPL</text>
  <rect x="40" y="127.397235710259" width="310.3449" height="71.506857984615" rx="6.162192118737" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="195.1723" y="171.890377725644" text-anchor="middle" font-size="21.067405118739" fill="var(--text)" font-family="Arial, sans-serif">Selector</text>
  <rect x="371.0344" y="127.397235710259" width="310.3449" height="71.506857984615" rx="6.162192118737" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="526.2068" y="171.890377725644" text-anchor="middle" font-size="21.067405118739" fill="var(--text)" font-family="Arial, sans-serif">Offset 15-0</text>
  <rect x="702.069" y="127.397235710259" width="206.8965" height="71.506857984615" rx="6.162192118737" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="805.5172" y="171.890377725644" text-anchor="middle" font-size="21.067405118739" fill="var(--text)" font-family="Arial, sans-serif">IST</text>
  <rect x="929.6552" y="127.397235710259" width="206.8965" height="71.506857984615" rx="6.162192118737" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1033.1034" y="171.890377725644" text-anchor="middle" font-size="21.067405118739" fill="var(--text)" font-family="Arial, sans-serif">Resv</text>
  <text x="681.3793" y="278.356087802572" text-anchor="middle" font-size="28.089839257252" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Important Vectors</text>
  <rect x="122.7585" y="310.136948733337" width="1117.2415" height="71.506857984615" rx="6.162192118737" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="164.1378" y="354.630090748722" font-size="22.823013653367" fill="var(--text)" font-family="Arial, sans-serif">0x00-0x1F: CPU Exceptions</text>
  <rect x="122.7585" y="397.534078964119" width="1117.2415" height="71.506857984615" rx="6.162192118737" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="164.1378" y="442.027326458981" font-size="22.823013653367" fill="var(--text)" font-family="Arial, sans-serif">0x20-0x2F: Hardware IRQs</text>
  <rect x="122.7585" y="484.931525633331" width="1117.2415" height="71.506857984615" rx="6.162192118737" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="164.1378" y="529.424667648717" font-size="22.823013653367" fill="var(--text)" font-family="Arial, sans-serif">0x30-0xFF: Software Interrupts</text>
  <rect x="122.7585" y="572.32876134359" width="1117.2415" height="47.67123865641" rx="6.162192118737" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="164.1378" y="605.698565115391" font-size="22.823013653367" fill="var(--text)" font-family="Arial, sans-serif">0x80: Legacy System Call</text>
</svg>

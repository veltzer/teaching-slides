<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="681.3793" y="40" text-anchor="middle" font-size="30.7693" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">IDT Entry Structure</text>
  <rect x="40" y="70.13" width="310.3449" height="67.7922" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="195.1723" y="112.3117" text-anchor="middle" font-size="20.5129" fill="var(--text)" font-family="Arial, sans-serif">Offset 31-16</text>
  <rect x="371.0344" y="70.13" width="310.3449" height="67.7922" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="526.2068" y="112.3117" text-anchor="middle" font-size="20.5129" fill="var(--text)" font-family="Arial, sans-serif">Offset 63-32</text>
  <rect x="702.069" y="70.13" width="206.8965" height="67.7922" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="805.5172" y="112.3117" text-anchor="middle" font-size="20.5129" fill="var(--text)" font-family="Arial, sans-serif">Type</text>
  <rect x="929.6552" y="70.13" width="206.8965" height="67.7922" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1033.1034" y="112.3117" text-anchor="middle" font-size="20.5129" fill="var(--text)" font-family="Arial, sans-serif">DPL</text>
  <rect x="40" y="152.9871" width="310.3449" height="67.7922" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="195.1723" y="195.1689" text-anchor="middle" font-size="20.5129" fill="var(--text)" font-family="Arial, sans-serif">Selector</text>
  <rect x="371.0344" y="152.9871" width="310.3449" height="67.7922" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="526.2068" y="195.1689" text-anchor="middle" font-size="20.5129" fill="var(--text)" font-family="Arial, sans-serif">Offset 15-0</text>
  <rect x="702.069" y="152.9871" width="206.8965" height="67.7922" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="805.5172" y="195.1689" text-anchor="middle" font-size="20.5129" fill="var(--text)" font-family="Arial, sans-serif">IST</text>
  <rect x="929.6552" y="152.9871" width="206.8965" height="67.7922" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1033.1034" y="195.1689" text-anchor="middle" font-size="20.5129" fill="var(--text)" font-family="Arial, sans-serif">Resv</text>
  <text x="681.3793" y="296.1039" text-anchor="middle" font-size="27.3505" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Important Vectors</text>
  <rect x="122.7585" y="326.2338" width="1117.2415" height="67.7922" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="164.1378" y="368.4156" font-size="22.2223" fill="var(--text)" font-family="Arial, sans-serif">0x00-0x1F: CPU Exceptions</text>
  <rect x="122.7585" y="409.0908" width="1117.2415" height="67.7922" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="164.1378" y="451.2727" font-size="22.2223" fill="var(--text)" font-family="Arial, sans-serif">0x20-0x2F: Hardware IRQs</text>
  <rect x="122.7585" y="491.9481" width="1117.2415" height="67.7922" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="164.1378" y="534.1299" font-size="22.2223" fill="var(--text)" font-family="Arial, sans-serif">0x30-0xFF: Software Interrupts</text>
  <rect x="122.7585" y="574.8052" width="1117.2415" height="45.1948" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="164.1378" y="606.4415" font-size="22.2223" fill="var(--text)" font-family="Arial, sans-serif">0x80: Legacy System Call</text>
</svg>
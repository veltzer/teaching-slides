<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="135" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="80" y="90" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="var(--danger-text)">Ring 0</text>
  <text x="80" y="130" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-text)">Kernel</text>
  <text x="80" y="160" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">All instructions; full hardware access</text>
  <text x="640" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--danger-text)">cli, hlt, lgdt, mov cr3, wrmsr</text>
  <text x="1100" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--danger-text)">highest privilege</text>

  <rect x="40" y="185" width="1200" height="130" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="80" y="235" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="var(--warn-text)">Ring 1</text>
  <text x="80" y="275" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">Drivers (historical)</text>
  <text x="80" y="305" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">OS/2 used it; Linux and Windows do not</text>

  <rect x="40" y="325" width="1200" height="130" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="80" y="375" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="var(--primary-text)">Ring 2</text>
  <text x="80" y="415" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Services (unused)</text>
  <text x="80" y="445" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">x86 defines it; modern kernels skip it</text>

  <rect x="40" y="465" width="1200" height="155" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="80" y="515" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="var(--ok-text)">Ring 3</text>
  <text x="80" y="555" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">User apps</text>
  <text x="80" y="585" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Syscall or int to cross</text>
  <text x="640" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--ok-text)">syscall / sysret</text>
  <text x="1100" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--ok-text)">lowest privilege</text>
</svg>

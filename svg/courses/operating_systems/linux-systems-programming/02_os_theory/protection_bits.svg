<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="600.4939" y="44.4444" text-anchor="middle" font-size="25.6211" font-weight="bold" fill="var(--text-dark)">64-bit PTE Format</text>
  <rect x="32.0263" y="80" width="64.0527" height="80" rx="8.0066" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="3.2026" />
  <text x="64.0527" y="129.7778" text-anchor="middle" font-size="17.6145" fill="var(--text-dark)">NX</text>
  <rect x="104.0856" y="80" width="56.0461" height="80" rx="8.0066" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="3.2026" />
  <text x="131.308" y="129.7778" text-anchor="middle" font-size="17.6145" fill="var(--text-dark)">G</text>
  <rect x="168.1383" y="80" width="56.0461" height="80" rx="8.0066" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="3.2026" />
  <text x="195.3606" y="129.7778" text-anchor="middle" font-size="17.6145" fill="var(--text-dark)">D</text>
  <rect x="232.191" y="80" width="56.0461" height="80" rx="8.0066" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="3.2026" />
  <text x="259.4134" y="129.7778" text-anchor="middle" font-size="17.6145" fill="var(--text-dark)">A</text>
  <rect x="296.2436" y="80" width="64.0527" height="80" rx="8.0066" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="3.2026" />
  <text x="328.27" y="129.7778" text-anchor="middle" font-size="17.6145" fill="var(--text-dark)">CD</text>
  <rect x="368.3029" y="80" width="64.0527" height="80" rx="8.0066" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="3.2026" />
  <text x="400.3293" y="129.7778" text-anchor="middle" font-size="17.6145" fill="var(--text-dark)">WT</text>
  <rect x="440.3621" y="80" width="64.0527" height="80" rx="8.0066" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="3.2026" />
  <text x="472.3886" y="129.7778" text-anchor="middle" font-size="17.6145" fill="var(--text-dark)">U/S</text>
  <rect x="512.4214" y="80" width="64.0527" height="80" rx="8.0066" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="3.2026" />
  <text x="544.4478" y="129.7778" text-anchor="middle" font-size="17.6145" fill="var(--text-dark)">R/W</text>
  <rect x="584.4807" y="80" width="416.3424" height="80" rx="8.0066" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="3.2026" />
  <text x="792.6519" y="129.7778" text-anchor="middle" font-size="19.2158" fill="var(--text-dark)">Physical Page Number (40 bits)</text>
  <rect x="1008.8297" y="80" width="160.1317" height="80" rx="8.0066" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="3.2026" />
  <text x="1088.8955" y="129.7778" text-anchor="middle" font-size="17.6145" fill="var(--text-dark)">Flags (12b)</text>
  <rect x="96.079" y="213.3333" width="992.8165" height="426.6667" rx="8.0066" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.402" />
  <text x="128.1053" y="266.6667" font-size="20.8172" fill="var(--text-dark)">
    <tspan font-weight="bold">P (Present):</tspan> Page in memory</text>
  <text x="128.1053" y="311.1111" font-size="20.8172" fill="var(--text-dark)">
    <tspan font-weight="bold">R/W (Read/Write):</tspan> Write permission</text>
  <text x="128.1053" y="355.5556" font-size="20.8172" fill="var(--text-dark)">
    <tspan font-weight="bold">U/S (User/Super):</tspan> User accessible</text>
  <text x="128.1053" y="400" font-size="20.8172" fill="var(--text-dark)">
    <tspan font-weight="bold">PWT (Write-Through):</tspan> Cache policy</text>
  <text x="128.1053" y="444.4445" font-size="20.8172" fill="var(--text-dark)">
    <tspan font-weight="bold">PCD (Cache Disable):</tspan> No caching</text>
  <text x="128.1053" y="488.8889" font-size="20.8172" fill="var(--text-dark)">
    <tspan font-weight="bold">A (Accessed):</tspan> Page was read</text>
  <text x="128.1053" y="533.3334" font-size="20.8172" fill="var(--text-dark)">
    <tspan font-weight="bold">D (Dirty):</tspan> Page was written</text>
  <text x="128.1053" y="577.7779" font-size="20.8172" fill="var(--text-dark)">
    <tspan font-weight="bold">G (Global):</tspan> Not flushed on context switch</text>
  <text x="128.1053" y="622.2223" font-size="20.8172" fill="var(--text-dark)">
    <tspan font-weight="bold">NX (No Execute):</tspan> Prevent execution</text>
</svg>
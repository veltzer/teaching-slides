<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <!-- PLACEHOLDERSVG — replace with real diagram -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="67.6056" height="82.85721882088" rx="6.187545855644" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="73.8028" y="91.555449206323" text-anchor="middle" font-size="18.416817736267" fill="var(--text)" font-family="Arial, sans-serif">NX</text>
  <rect x="116.0563" y="40" width="59.155" height="82.85721882088" rx="6.187545855644" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="144.7888" y="91.555449206323" text-anchor="middle" font-size="18.416817736267" fill="var(--text)" font-family="Arial, sans-serif">G</text>
  <rect x="183.662" y="40" width="59.155" height="82.85721882088" rx="6.187545855644" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="212.3944" y="91.555449206323" text-anchor="middle" font-size="18.416817736267" fill="var(--text)" font-family="Arial, sans-serif">D</text>
  <rect x="251.2677" y="40" width="59.155" height="82.85721882088" rx="6.187545855644" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="280.0001" y="91.555449206323" text-anchor="middle" font-size="18.416817736267" fill="var(--text)" font-family="Arial, sans-serif">A</text>
  <rect x="318.8732" y="40" width="67.6056" height="82.85721882088" rx="6.187545855644" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="352.6761" y="91.555449206323" text-anchor="middle" font-size="18.416817736267" fill="var(--text)" font-family="Arial, sans-serif">CD</text>
  <rect x="394.9296" y="40" width="67.6056" height="82.85721882088" rx="6.187545855644" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="428.7325" y="91.555449206323" text-anchor="middle" font-size="18.416817736267" fill="var(--text)" font-family="Arial, sans-serif">WT</text>
  <rect x="470.9859" y="40" width="67.6056" height="82.85721882088" rx="6.187545855644" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="504.7888" y="91.555449206323" text-anchor="middle" font-size="18.416817736267" fill="var(--text)" font-family="Arial, sans-serif">U/S</text>
  <rect x="547.0423" y="40" width="67.6056" height="82.85721882088" rx="6.187545855644" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="580.8451" y="91.555449206323" text-anchor="middle" font-size="18.416817736267" fill="var(--text)" font-family="Arial, sans-serif">R/W</text>
  <rect x="623.0986" y="40" width="439.4365" height="82.85721882088" rx="6.187545855644" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="842.8168" y="91.555449206323" text-anchor="middle" font-size="20.09106451904" fill="var(--text)" font-family="Arial, sans-serif">Physical Page Number (40 bits)</text>
  <rect x="1070.9858" y="40" width="169.0142" height="82.85721882088" rx="6.187545855644" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1155.4929" y="91.555449206323" text-anchor="middle" font-size="18.416817736267" fill="var(--text)" font-family="Arial, sans-serif">Flags (12b)</text>
  <rect x="107.6057" y="178.095116553258" width="1047.8872" height="441.904883446742" rx="6.187545855644" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="141.4085" y="233.333439682566" font-size="21.765414427577" fill="var(--text)" font-family="Arial, sans-serif">
    <tspan font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">P (Present):</tspan> Page in memory</text>
  <text x="141.4085" y="279.365003401342" font-size="21.765414427577" fill="var(--text)" font-family="Arial, sans-serif">
    <tspan font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">R/W (Read/Write):</tspan> Write permission</text>
  <text x="141.4085" y="325.396886167815" font-size="21.765414427577" fill="var(--text)" font-family="Arial, sans-serif">
    <tspan font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">U/S (User/Super):</tspan> User accessible</text>
  <text x="141.4085" y="371.428556235824" font-size="21.765414427577" fill="var(--text)" font-family="Arial, sans-serif">
    <tspan font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">PWT (Write-Through):</tspan> Cache policy</text>
  <text x="141.4085" y="417.460332653065" font-size="21.765414427577" fill="var(--text)" font-family="Arial, sans-serif">
    <tspan font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">PCD (Cache Disable):</tspan> No caching</text>
  <text x="141.4085" y="463.492109070306" font-size="21.765414427577" fill="var(--text)" font-family="Arial, sans-serif">
    <tspan font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">A (Accessed):</tspan> Page was read</text>
  <text x="141.4085" y="509.523991836779" font-size="21.765414427577" fill="var(--text)" font-family="Arial, sans-serif">
    <tspan font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">D (Dirty):</tspan> Page was written</text>
  <text x="141.4085" y="555.555661904788" font-size="21.765414427577" fill="var(--text)" font-family="Arial, sans-serif">
    <tspan font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">G (Global):</tspan> Not flushed on context switch</text>
  <text x="141.4085" y="601.587438322029" font-size="21.765414427577" fill="var(--text)" font-family="Arial, sans-serif">
    <tspan font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">NX (No Execute):</tspan> Prevent execution</text>
</svg>

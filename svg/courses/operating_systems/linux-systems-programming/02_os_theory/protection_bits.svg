<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 380" font-family="Arial, sans-serif">
  <text x="375" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">64-bit PTE Format</text>
  <rect x="20" y="45" width="40" height="45" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="40" y="73" text-anchor="middle" font-size="11" fill="#333">NX</text>
  <rect x="65" y="45" width="35" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="82" y="73" text-anchor="middle" font-size="11" fill="#333">G</text>
  <rect x="105" y="45" width="35" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="122" y="73" text-anchor="middle" font-size="11" fill="#333">D</text>
  <rect x="145" y="45" width="35" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="162" y="73" text-anchor="middle" font-size="11" fill="#333">A</text>
  <rect x="185" y="45" width="40" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="205" y="73" text-anchor="middle" font-size="11" fill="#333">CD</text>
  <rect x="230" y="45" width="40" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="250" y="73" text-anchor="middle" font-size="11" fill="#333">WT</text>
  <rect x="275" y="45" width="40" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="295" y="73" text-anchor="middle" font-size="11" fill="#333">U/S</text>
  <rect x="320" y="45" width="40" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="340" y="73" text-anchor="middle" font-size="11" fill="#333">R/W</text>
  <rect x="365" y="45" width="260" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="495" y="73" text-anchor="middle" font-size="12" fill="#333">Physical Page Number (40 bits)</text>
  <rect x="630" y="45" width="100" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="680" y="73" text-anchor="middle" font-size="11" fill="#333">Flags (12b)</text>
  <rect x="60" y="120" width="620" height="240" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="80" y="150" font-size="13" fill="#333"><tspan font-weight="bold">P (Present):</tspan> Page in memory</text>
  <text x="80" y="175" font-size="13" fill="#333"><tspan font-weight="bold">R/W (Read/Write):</tspan> Write permission</text>
  <text x="80" y="200" font-size="13" fill="#333"><tspan font-weight="bold">U/S (User/Super):</tspan> User accessible</text>
  <text x="80" y="225" font-size="13" fill="#333"><tspan font-weight="bold">PWT (Write-Through):</tspan> Cache policy</text>
  <text x="80" y="250" font-size="13" fill="#333"><tspan font-weight="bold">PCD (Cache Disable):</tspan> No caching</text>
  <text x="80" y="275" font-size="13" fill="#333"><tspan font-weight="bold">A (Accessed):</tspan> Page was read</text>
  <text x="80" y="300" font-size="13" fill="#333"><tspan font-weight="bold">D (Dirty):</tspan> Page was written</text>
  <text x="80" y="325" font-size="13" fill="#333"><tspan font-weight="bold">G (Global):</tspan> Not flushed on context switch</text>
  <text x="80" y="350" font-size="13" fill="#333"><tspan font-weight="bold">NX (No Execute):</tspan> Prevent execution</text>
</svg>
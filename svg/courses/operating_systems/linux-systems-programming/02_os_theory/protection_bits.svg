<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="47.3684" text-anchor="middle" font-size="27.3067" font-weight="bold" fill="#333">64-bit PTE Format</text>
  <rect x="34.1333" y="85.2632" width="68.2667" height="85.2632" rx="8.5333" fill="#f8d7da" stroke="#dc3545" stroke-width="3.4133" />
  <text x="68.2667" y="138.3158" text-anchor="middle" font-size="18.7733" fill="#333">NX</text>
  <rect x="110.9333" y="85.2632" width="59.7333" height="85.2632" rx="8.5333" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.4133" />
  <text x="139.9467" y="138.3158" text-anchor="middle" font-size="18.7733" fill="#333">G</text>
  <rect x="179.2" y="85.2632" width="59.7333" height="85.2632" rx="8.5333" fill="#fff3cd" stroke="#ffc107" stroke-width="3.4133" />
  <text x="208.2133" y="138.3158" text-anchor="middle" font-size="18.7733" fill="#333">D</text>
  <rect x="247.4667" y="85.2632" width="59.7333" height="85.2632" rx="8.5333" fill="#d4edda" stroke="#28a745" stroke-width="3.4133" />
  <text x="276.48" y="138.3158" text-anchor="middle" font-size="18.7733" fill="#333">A</text>
  <rect x="315.7333" y="85.2632" width="68.2667" height="85.2632" rx="8.5333" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.4133" />
  <text x="349.8667" y="138.3158" text-anchor="middle" font-size="18.7733" fill="#333">CD</text>
  <rect x="392.5333" y="85.2632" width="68.2667" height="85.2632" rx="8.5333" fill="#fff3cd" stroke="#ffc107" stroke-width="3.4133" />
  <text x="426.6667" y="138.3158" text-anchor="middle" font-size="18.7733" fill="#333">WT</text>
  <rect x="469.3333" y="85.2632" width="68.2667" height="85.2632" rx="8.5333" fill="#d4edda" stroke="#28a745" stroke-width="3.4133" />
  <text x="503.4667" y="138.3158" text-anchor="middle" font-size="18.7733" fill="#333">U/S</text>
  <rect x="546.1333" y="85.2632" width="68.2667" height="85.2632" rx="8.5333" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.4133" />
  <text x="580.2667" y="138.3158" text-anchor="middle" font-size="18.7733" fill="#333">R/W</text>
  <rect x="622.9333" y="85.2632" width="443.7333" height="85.2632" rx="8.5333" fill="#d4edda" stroke="#28a745" stroke-width="3.4133" />
  <text x="844.8" y="138.3158" text-anchor="middle" font-size="20.48" fill="#333">Physical Page Number (40 bits)</text>
  <rect x="1075.2" y="85.2632" width="170.6667" height="85.2632" rx="8.5333" fill="#fff3cd" stroke="#ffc107" stroke-width="3.4133" />
  <text x="1160.5333" y="138.3158" text-anchor="middle" font-size="18.7733" fill="#333">Flags (12b)</text>
  <rect x="102.4" y="227.3684" width="1058.1333" height="454.7368" rx="8.5333" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.56" />
  <text x="136.5333" y="284.2105" font-size="22.1867" fill="#333">
    <tspan font-weight="bold">P (Present):</tspan> Page in memory</text>
  <text x="136.5333" y="331.5789" font-size="22.1867" fill="#333">
    <tspan font-weight="bold">R/W (Read/Write):</tspan> Write permission</text>
  <text x="136.5333" y="378.9474" font-size="22.1867" fill="#333">
    <tspan font-weight="bold">U/S (User/Super):</tspan> User accessible</text>
  <text x="136.5333" y="426.3158" font-size="22.1867" fill="#333">
    <tspan font-weight="bold">PWT (Write-Through):</tspan> Cache policy</text>
  <text x="136.5333" y="473.6842" font-size="22.1867" fill="#333">
    <tspan font-weight="bold">PCD (Cache Disable):</tspan> No caching</text>
  <text x="136.5333" y="521.0526" font-size="22.1867" fill="#333">
    <tspan font-weight="bold">A (Accessed):</tspan> Page was read</text>
  <text x="136.5333" y="568.4211" font-size="22.1867" fill="#333">
    <tspan font-weight="bold">D (Dirty):</tspan> Page was written</text>
  <text x="136.5333" y="615.7895" font-size="22.1867" fill="#333">
    <tspan font-weight="bold">G (Global):</tspan> Not flushed on context switch</text>
  <text x="136.5333" y="663.1579" font-size="22.1867" fill="#333">
    <tspan font-weight="bold">NX (No Execute):</tspan> Prevent execution</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="25.9762" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">64-bit PTE Format</text>
  <rect x="40" y="74.627" width="67.6056" height="77.9105" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="73.8028" y="123.1045" text-anchor="middle" font-size="17.8586" fill="var(--text)" font-family="Arial, sans-serif">NX</text>
  <rect x="116.0563" y="74.627" width="59.155" height="77.9105" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="144.7888" y="123.1045" text-anchor="middle" font-size="17.8586" fill="var(--text)" font-family="Arial, sans-serif">G</text>
  <rect x="183.662" y="74.627" width="59.155" height="77.9105" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="212.3944" y="123.1045" text-anchor="middle" font-size="17.8586" fill="var(--text)" font-family="Arial, sans-serif">D</text>
  <rect x="251.2677" y="74.627" width="59.155" height="77.9105" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="280.0001" y="123.1045" text-anchor="middle" font-size="17.8586" fill="var(--text)" font-family="Arial, sans-serif">A</text>
  <rect x="318.8732" y="74.627" width="67.6056" height="77.9105" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="352.6761" y="123.1045" text-anchor="middle" font-size="17.8586" fill="var(--text)" font-family="Arial, sans-serif">CD</text>
  <rect x="394.9296" y="74.627" width="67.6056" height="77.9105" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="428.7325" y="123.1045" text-anchor="middle" font-size="17.8586" fill="var(--text)" font-family="Arial, sans-serif">WT</text>
  <rect x="470.9859" y="74.627" width="67.6056" height="77.9105" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="504.7888" y="123.1045" text-anchor="middle" font-size="17.8586" fill="var(--text)" font-family="Arial, sans-serif">U/S</text>
  <rect x="547.0423" y="74.627" width="67.6056" height="77.9105" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="580.8451" y="123.1045" text-anchor="middle" font-size="17.8586" fill="var(--text)" font-family="Arial, sans-serif">R/W</text>
  <rect x="623.0986" y="74.627" width="439.4365" height="77.9105" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="842.8168" y="123.1045" text-anchor="middle" font-size="19.4821" fill="var(--text)" font-family="Arial, sans-serif">Physical Page Number (40 bits)</text>
  <rect x="1070.9858" y="74.627" width="169.0142" height="77.9105" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1155.4929" y="123.1045" text-anchor="middle" font-size="17.8586" fill="var(--text)" font-family="Arial, sans-serif">Flags (12b)</text>
  <rect x="107.6057" y="204.4776" width="1047.8872" height="415.5224" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="141.4085" y="256.4181" font-size="21.1057" fill="var(--text)" font-family="Arial, sans-serif">
    <tspan font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">P (Present):</tspan> Page in memory</text>
  <text x="141.4085" y="299.7015" font-size="21.1057" fill="var(--text)" font-family="Arial, sans-serif">
    <tspan font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">R/W (Read/Write):</tspan> Write permission</text>
  <text x="141.4085" y="342.9852" font-size="21.1057" fill="var(--text)" font-family="Arial, sans-serif">
    <tspan font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">U/S (User/Super):</tspan> User accessible</text>
  <text x="141.4085" y="386.2687" font-size="21.1057" fill="var(--text)" font-family="Arial, sans-serif">
    <tspan font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">PWT (Write-Through):</tspan> Cache policy</text>
  <text x="141.4085" y="429.5523" font-size="21.1057" fill="var(--text)" font-family="Arial, sans-serif">
    <tspan font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">PCD (Cache Disable):</tspan> No caching</text>
  <text x="141.4085" y="472.8359" font-size="21.1057" fill="var(--text)" font-family="Arial, sans-serif">
    <tspan font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">A (Accessed):</tspan> Page was read</text>
  <text x="141.4085" y="516.1196" font-size="21.1057" fill="var(--text)" font-family="Arial, sans-serif">
    <tspan font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">D (Dirty):</tspan> Page was written</text>
  <text x="141.4085" y="559.4031" font-size="21.1057" fill="var(--text)" font-family="Arial, sans-serif">
    <tspan font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">G (Global):</tspan> Not flushed on context switch</text>
  <text x="141.4085" y="602.6867" font-size="21.1057" fill="var(--text)" font-family="Arial, sans-serif">
    <tspan font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">NX (No Execute):</tspan> Prevent execution</text>
</svg>
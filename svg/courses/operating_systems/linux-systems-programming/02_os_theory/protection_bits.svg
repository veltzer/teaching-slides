<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="25.9762" font-weight="bold" fill="var(--text)">64-bit PTE Format</text>
  <rect x="40" y="74.627" width="67.6056" height="77.9105" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="73.8028" y="123.1045" text-anchor="middle" font-size="17.8586" fill="var(--text)">NX</text>
  <rect x="116.0563" y="74.627" width="59.155" height="77.9105" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="144.7888" y="123.1045" text-anchor="middle" font-size="17.8586" fill="var(--text)">G</text>
  <rect x="183.662" y="74.627" width="59.155" height="77.9105" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="212.3944" y="123.1045" text-anchor="middle" font-size="17.8586" fill="var(--text)">D</text>
  <rect x="251.2677" y="74.627" width="59.155" height="77.9105" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="280.0001" y="123.1045" text-anchor="middle" font-size="17.8586" fill="var(--text)">A</text>
  <rect x="318.8732" y="74.627" width="67.6056" height="77.9105" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="352.6761" y="123.1045" text-anchor="middle" font-size="17.8586" fill="var(--text)">CD</text>
  <rect x="394.9296" y="74.627" width="67.6056" height="77.9105" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="428.7325" y="123.1045" text-anchor="middle" font-size="17.8586" fill="var(--text)">WT</text>
  <rect x="470.9859" y="74.627" width="67.6056" height="77.9105" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="504.7888" y="123.1045" text-anchor="middle" font-size="17.8586" fill="var(--text)">U/S</text>
  <rect x="547.0423" y="74.627" width="67.6056" height="77.9105" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="580.8451" y="123.1045" text-anchor="middle" font-size="17.8586" fill="var(--text)">R/W</text>
  <rect x="623.0986" y="74.627" width="439.4365" height="77.9105" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="842.8168" y="123.1045" text-anchor="middle" font-size="19.4821" fill="var(--text)">Physical Page Number (40 bits)</text>
  <rect x="1070.9858" y="74.627" width="169.0142" height="77.9105" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1155.4929" y="123.1045" text-anchor="middle" font-size="17.8586" fill="var(--text)">Flags (12b)</text>
  <rect x="107.6057" y="204.4776" width="1047.8872" height="415.5224" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="141.4085" y="256.4181" font-size="21.1057" fill="var(--text)">
    <tspan font-weight="bold">P (Present):</tspan> Page in memory</text>
  <text x="141.4085" y="299.7015" font-size="21.1057" fill="var(--text)">
    <tspan font-weight="bold">R/W (Read/Write):</tspan> Write permission</text>
  <text x="141.4085" y="342.9852" font-size="21.1057" fill="var(--text)">
    <tspan font-weight="bold">U/S (User/Super):</tspan> User accessible</text>
  <text x="141.4085" y="386.2687" font-size="21.1057" fill="var(--text)">
    <tspan font-weight="bold">PWT (Write-Through):</tspan> Cache policy</text>
  <text x="141.4085" y="429.5523" font-size="21.1057" fill="var(--text)">
    <tspan font-weight="bold">PCD (Cache Disable):</tspan> No caching</text>
  <text x="141.4085" y="472.8359" font-size="21.1057" fill="var(--text)">
    <tspan font-weight="bold">A (Accessed):</tspan> Page was read</text>
  <text x="141.4085" y="516.1196" font-size="21.1057" fill="var(--text)">
    <tspan font-weight="bold">D (Dirty):</tspan> Page was written</text>
  <text x="141.4085" y="559.4031" font-size="21.1057" fill="var(--text)">
    <tspan font-weight="bold">G (Global):</tspan> Not flushed on context switch</text>
  <text x="141.4085" y="602.6867" font-size="21.1057" fill="var(--text)">
    <tspan font-weight="bold">NX (No Execute):</tspan> Prevent execution</text>
</svg>
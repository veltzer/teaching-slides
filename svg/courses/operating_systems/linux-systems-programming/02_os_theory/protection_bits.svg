<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:text x="600.4939" y="44.4444" text-anchor="middle" font-size="25.6211" font-weight="bold" fill="#333">64-bit PTE Format</ns0:text>
  <ns0:rect x="32.0263" y="80" width="64.0527" height="80" rx="8.0066" fill="#f8d7da" stroke="#dc3545" stroke-width="3.2026" />
  <ns0:text x="64.0527" y="129.7778" text-anchor="middle" font-size="17.6145" fill="#333">NX</ns0:text>
  <ns0:rect x="104.0856" y="80" width="56.0461" height="80" rx="8.0066" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2026" />
  <ns0:text x="131.308" y="129.7778" text-anchor="middle" font-size="17.6145" fill="#333">G</ns0:text>
  <ns0:rect x="168.1383" y="80" width="56.0461" height="80" rx="8.0066" fill="#fff3cd" stroke="#ffc107" stroke-width="3.2026" />
  <ns0:text x="195.3606" y="129.7778" text-anchor="middle" font-size="17.6145" fill="#333">D</ns0:text>
  <ns0:rect x="232.191" y="80" width="56.0461" height="80" rx="8.0066" fill="#d4edda" stroke="#28a745" stroke-width="3.2026" />
  <ns0:text x="259.4134" y="129.7778" text-anchor="middle" font-size="17.6145" fill="#333">A</ns0:text>
  <ns0:rect x="296.2436" y="80" width="64.0527" height="80" rx="8.0066" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2026" />
  <ns0:text x="328.27" y="129.7778" text-anchor="middle" font-size="17.6145" fill="#333">CD</ns0:text>
  <ns0:rect x="368.3029" y="80" width="64.0527" height="80" rx="8.0066" fill="#fff3cd" stroke="#ffc107" stroke-width="3.2026" />
  <ns0:text x="400.3293" y="129.7778" text-anchor="middle" font-size="17.6145" fill="#333">WT</ns0:text>
  <ns0:rect x="440.3621" y="80" width="64.0527" height="80" rx="8.0066" fill="#d4edda" stroke="#28a745" stroke-width="3.2026" />
  <ns0:text x="472.3886" y="129.7778" text-anchor="middle" font-size="17.6145" fill="#333">U/S</ns0:text>
  <ns0:rect x="512.4214" y="80" width="64.0527" height="80" rx="8.0066" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2026" />
  <ns0:text x="544.4478" y="129.7778" text-anchor="middle" font-size="17.6145" fill="#333">R/W</ns0:text>
  <ns0:rect x="584.4807" y="80" width="416.3424" height="80" rx="8.0066" fill="#d4edda" stroke="#28a745" stroke-width="3.2026" />
  <ns0:text x="792.6519" y="129.7778" text-anchor="middle" font-size="19.2158" fill="#333">Physical Page Number (40 bits)</ns0:text>
  <ns0:rect x="1008.8297" y="80" width="160.1317" height="80" rx="8.0066" fill="#fff3cd" stroke="#ffc107" stroke-width="3.2026" />
  <ns0:text x="1088.8955" y="129.7778" text-anchor="middle" font-size="17.6145" fill="#333">Flags (12b)</ns0:text>
  <ns0:rect x="96.079" y="213.3333" width="992.8165" height="426.6667" rx="8.0066" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.402" />
  <ns0:text x="128.1053" y="266.6667" font-size="20.8172" fill="#333">
    <ns0:tspan font-weight="bold">P (Present):</ns0:tspan> Page in memory</ns0:text>
  <ns0:text x="128.1053" y="311.1111" font-size="20.8172" fill="#333">
    <ns0:tspan font-weight="bold">R/W (Read/Write):</ns0:tspan> Write permission</ns0:text>
  <ns0:text x="128.1053" y="355.5556" font-size="20.8172" fill="#333">
    <ns0:tspan font-weight="bold">U/S (User/Super):</ns0:tspan> User accessible</ns0:text>
  <ns0:text x="128.1053" y="400" font-size="20.8172" fill="#333">
    <ns0:tspan font-weight="bold">PWT (Write-Through):</ns0:tspan> Cache policy</ns0:text>
  <ns0:text x="128.1053" y="444.4445" font-size="20.8172" fill="#333">
    <ns0:tspan font-weight="bold">PCD (Cache Disable):</ns0:tspan> No caching</ns0:text>
  <ns0:text x="128.1053" y="488.8889" font-size="20.8172" fill="#333">
    <ns0:tspan font-weight="bold">A (Accessed):</ns0:tspan> Page was read</ns0:text>
  <ns0:text x="128.1053" y="533.3334" font-size="20.8172" fill="#333">
    <ns0:tspan font-weight="bold">D (Dirty):</ns0:tspan> Page was written</ns0:text>
  <ns0:text x="128.1053" y="577.7779" font-size="20.8172" fill="#333">
    <ns0:tspan font-weight="bold">G (Global):</ns0:tspan> Not flushed on context switch</ns0:text>
  <ns0:text x="128.1053" y="622.2223" font-size="20.8172" fill="#333">
    <ns0:tspan font-weight="bold">NX (No Execute):</ns0:tspan> Prevent execution</ns0:text>
</ns0:svg>
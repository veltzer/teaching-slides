<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="600.4939" y="44.4444" text-anchor="middle" font-size="25.6211" font-weight="bold" fill="var(--text)">64-bit PTE Format</text>
  <rect x="32.0263" y="80" width="64.0527" height="80" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="64.0527" y="129.7778" text-anchor="middle" font-size="17.6145" fill="var(--text)">NX</text>
  <rect x="104.0856" y="80" width="56.0461" height="80" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="131.308" y="129.7778" text-anchor="middle" font-size="17.6145" fill="var(--text)">G</text>
  <rect x="168.1383" y="80" width="56.0461" height="80" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="195.3606" y="129.7778" text-anchor="middle" font-size="17.6145" fill="var(--text)">D</text>
  <rect x="232.191" y="80" width="56.0461" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="259.4134" y="129.7778" text-anchor="middle" font-size="17.6145" fill="var(--text)">A</text>
  <rect x="296.2436" y="80" width="64.0527" height="80" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="328.27" y="129.7778" text-anchor="middle" font-size="17.6145" fill="var(--text)">CD</text>
  <rect x="368.3029" y="80" width="64.0527" height="80" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="400.3293" y="129.7778" text-anchor="middle" font-size="17.6145" fill="var(--text)">WT</text>
  <rect x="440.3621" y="80" width="64.0527" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="472.3886" y="129.7778" text-anchor="middle" font-size="17.6145" fill="var(--text)">U/S</text>
  <rect x="512.4214" y="80" width="64.0527" height="80" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="544.4478" y="129.7778" text-anchor="middle" font-size="17.6145" fill="var(--text)">R/W</text>
  <rect x="584.4807" y="80" width="416.3424" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="792.6519" y="129.7778" text-anchor="middle" font-size="19.2158" fill="var(--text)">Physical Page Number (40 bits)</text>
  <rect x="1008.8297" y="80" width="160.1317" height="80" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1088.8955" y="129.7778" text-anchor="middle" font-size="17.6145" fill="var(--text)">Flags (12b)</text>
  <rect x="96.079" y="213.3333" width="992.8165" height="426.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="128.1053" y="266.6667" font-size="20.8172" fill="var(--text)">
    <tspan font-weight="bold">P (Present):</tspan> Page in memory</text>
  <text x="128.1053" y="311.1111" font-size="20.8172" fill="var(--text)">
    <tspan font-weight="bold">R/W (Read/Write):</tspan> Write permission</text>
  <text x="128.1053" y="355.5556" font-size="20.8172" fill="var(--text)">
    <tspan font-weight="bold">U/S (User/Super):</tspan> User accessible</text>
  <text x="128.1053" y="400" font-size="20.8172" fill="var(--text)">
    <tspan font-weight="bold">PWT (Write-Through):</tspan> Cache policy</text>
  <text x="128.1053" y="444.4445" font-size="20.8172" fill="var(--text)">
    <tspan font-weight="bold">PCD (Cache Disable):</tspan> No caching</text>
  <text x="128.1053" y="488.8889" font-size="20.8172" fill="var(--text)">
    <tspan font-weight="bold">A (Accessed):</tspan> Page was read</text>
  <text x="128.1053" y="533.3334" font-size="20.8172" fill="var(--text)">
    <tspan font-weight="bold">D (Dirty):</tspan> Page was written</text>
  <text x="128.1053" y="577.7779" font-size="20.8172" fill="var(--text)">
    <tspan font-weight="bold">G (Global):</tspan> Not flushed on context switch</text>
  <text x="128.1053" y="622.2223" font-size="20.8172" fill="var(--text)">
    <tspan font-weight="bold">NX (No Execute):</tspan> Prevent execution</text>
</svg>
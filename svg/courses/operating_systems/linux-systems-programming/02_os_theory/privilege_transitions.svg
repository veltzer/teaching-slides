<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="560" height="570" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="320" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--primary-text)">User Mode</text>
  <text x="320" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">ring 3 on x86</text>

  <rect x="80" y="180" width="480" height="100" rx="6" fill="var(--primary-accent)"/>
  <text x="320" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-text)">Application code</text>
  <text x="320" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">own address space, unprivileged CPU</text>
  <text x="320" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">cannot touch hardware directly</text>

  <rect x="80" y="310" width="480" height="100" rx="6" fill="var(--primary-accent)"/>
  <text x="320" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-text)">libc wrappers</text>
  <text x="320" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">read, write, open, mmap...</text>
  <text x="320" y="398" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">marshal args into registers</text>

  <rect x="80" y="440" width="480" height="150" rx="6" fill="var(--primary-accent)"/>
  <text x="320" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-text)">Trap instruction</text>
  <text x="320" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">syscall on x86_64</text>
  <text x="320" y="528" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">svc on arm64</text>
  <text x="320" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">CPU switches rings, jumps to handler</text>

  <rect x="680" y="40" width="560" height="570" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="960" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--danger-text)">Kernel Mode</text>
  <text x="960" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">ring 0 on x86</text>

  <rect x="720" y="180" width="480" height="100" rx="6" fill="var(--danger-accent)"/>
  <text x="960" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--danger-text)">Syscall entry</text>
  <text x="960" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">save user registers, switch stack</text>
  <text x="960" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">dispatch on syscall number</text>

  <rect x="720" y="310" width="480" height="100" rx="6" fill="var(--danger-accent)"/>
  <text x="960" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--danger-text)">Service routine</text>
  <text x="960" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">validates args, walks page tables</text>
  <text x="960" y="398" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">touches hardware, updates state</text>

  <rect x="720" y="440" width="480" height="150" rx="6" fill="var(--danger-accent)"/>
  <text x="960" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--danger-text)">Return path</text>
  <text x="960" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">write result to user registers</text>
  <text x="960" y="528" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">sysret / eret lowers privilege</text>
  <text x="960" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">userspace resumes one instruction later</text>

  <path d="M 600 230 L 680 230" stroke="var(--ok-border)" stroke-width="3" fill="none" marker-end="url(#arrow-ok)"/>
  <text x="640" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-accent)">syscall</text>

  <path d="M 680 515 L 600 515" stroke="var(--info-border)" stroke-width="3" fill="none" marker-end="url(#arrow-info)"/>
  <text x="640" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--info-accent)">return</text>
</svg>

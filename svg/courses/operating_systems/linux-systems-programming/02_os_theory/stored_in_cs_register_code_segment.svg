<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:text x="612.6496" y="61.5385" text-anchor="middle" font-size="30.1612" font-weight="bold" fill="#333">CS Register Structure</ns0:text>
  <ns0:rect x="75.403" y="123.0769" width="377.0152" height="123.0769" rx="9.4254" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.7702" />
  <ns0:text x="263.9106" y="196.9231" text-anchor="middle" font-size="24.506" font-weight="bold" fill="#333">Selector: 16 bits</ns0:text>
  <ns0:rect x="471.2689" y="123.0769" width="377.0152" height="123.0769" rx="9.4254" fill="#d4edda" stroke="#28a745" stroke-width="3.7702" />
  <ns0:text x="659.7765" y="196.9231" text-anchor="middle" font-size="24.506" font-weight="bold" fill="#333">Hidden Descriptor</ns0:text>
  <ns0:line x1="263.9106" y1="246.1539" x2="263.9106" y2="295.3846" stroke="#4a90e2" stroke-width="3.7702" />
  <ns0:rect x="75.403" y="295.3846" width="245.0598" height="86.1538" rx="9.4254" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.8276" />
  <ns0:text x="197.9329" y="352" text-anchor="middle" font-size="22.6209" fill="#333">Index (13 bits)</ns0:text>
  <ns0:rect x="339.3136" y="295.3846" width="301.6121" height="86.1538" rx="9.4254" fill="#fff3cd" stroke="#ffc107" stroke-width="2.8276" />
  <ns0:text x="490.1197" y="352" text-anchor="middle" font-size="22.6209" fill="#333">Table Indicator (1 bit)</ns0:text>
  <ns0:rect x="659.7765" y="295.3846" width="320.4628" height="86.1538" rx="9.4254" fill="#d4edda" stroke="#28a745" stroke-width="2.8276" />
  <ns0:text x="820.0079" y="352" text-anchor="middle" font-size="22.6209" fill="#333">RPL (2 bits) = CPL</ns0:text>
  <ns0:rect x="75.403" y="443.0769" width="1055.6424" height="196.9231" rx="9.4254" fill="#f8d7da" stroke="#dc3545" stroke-width="2.8276" />
  <ns0:text x="113.1045" y="504.6154" font-size="26.391" font-weight="bold" fill="#333">CPL Values:</ns0:text>
  <ns0:text x="113.1045" y="566.1539" font-size="24.506" fill="#333">0 = Kernel mode (highest privilege)</ns0:text>
  <ns0:text x="113.1045" y="615.3846" font-size="24.506" fill="#333">3 = User mode (lowest privilege)</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 280" font-family="Arial, sans-serif">
  <text x="325" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">CS Register Structure</text>
  <rect x="40" y="50" width="200" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="140" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Selector: 16 bits</text>
  <rect x="250" y="50" width="200" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="350" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Hidden Descriptor</text>
  <line x1="140" y1="100" x2="140" y2="120" stroke="#4a90e2" stroke-width="2"/>
  <rect x="40" y="120" width="130" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="105" y="143" text-anchor="middle" font-size="12" fill="#333">Index (13 bits)</text>
  <rect x="180" y="120" width="160" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="260" y="143" text-anchor="middle" font-size="12" fill="#333">Table Indicator (1 bit)</text>
  <rect x="350" y="120" width="170" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="435" y="143" text-anchor="middle" font-size="12" fill="#333">RPL (2 bits) = CPL</text>
  <rect x="40" y="180" width="560" height="80" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="60" y="205" font-size="14" font-weight="bold" fill="#333">CPL Values:</text>
  <text x="60" y="230" font-size="13" fill="#333">0 = Kernel mode (highest privilege)</text>
  <text x="60" y="250" font-size="13" fill="#333">3 = User mode (lowest privilege)</text>
</svg>
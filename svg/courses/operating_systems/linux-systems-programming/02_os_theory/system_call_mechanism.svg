<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="514.2857" height="133.8462" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="297.1429" y="118.0769" text-anchor="middle" fill="var(--bg)" font-size="25.8119" font-family="Arial, sans-serif">User Program</text>
  <rect x="40" y="263.0769" width="514.2857" height="133.8462" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="297.1429" y="341.1538" text-anchor="middle" fill="var(--bg)" font-size="25.8119" font-family="Arial, sans-serif">C Library (glibc)</text>
  <rect x="40" y="486.1538" width="514.2857" height="133.8462" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="297.1429" y="564.2308" text-anchor="middle" fill="var(--bg)" font-size="25.8119" font-family="Arial, sans-serif">Kernel</text>
  <line x1="297.1429" y1="173.8462" x2="297.1429" y2="263.0769" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="382.8571" y="218.4615" font-size="20.2808" font-family="Arial, sans-serif" fill="var(--text)">function call</text>
  <line x1="297.1429" y1="396.9231" x2="297.1429" y2="486.1538" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="382.8571" y="441.5385" font-size="20.2808" font-family="Arial, sans-serif" fill="var(--text)">syscall instruction</text>
  <rect x="725.7143" y="151.5385" width="514.2857" height="446.1538" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="982.8571" y="218.4615" text-anchor="middle" font-size="22.1245" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">System Call Steps:</text>
  <text x="742.8571" y="285.3846" font-size="20.2808" font-family="Arial, sans-serif" fill="var(--text)">1. Load syscall number in RAX</text>
  <text x="742.8571" y="330" font-size="20.2808" font-family="Arial, sans-serif" fill="var(--text)">2. Load arguments in registers</text>
  <text x="742.8571" y="374.6154" font-size="20.2808" font-family="Arial, sans-serif" fill="var(--text)">3. Execute SYSCALL instruction</text>
  <text x="742.8571" y="419.2308" font-size="20.2808" font-family="Arial, sans-serif" fill="var(--text)">4. CPU switches to Ring 0</text>
  <text x="742.8571" y="463.8462" font-size="20.2808" font-family="Arial, sans-serif" fill="var(--text)">5. Kernel handles request</text>
  <text x="742.8571" y="508.4615" font-size="20.2808" font-family="Arial, sans-serif" fill="var(--text)">6. SYSRET back to Ring 3</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
</svg>
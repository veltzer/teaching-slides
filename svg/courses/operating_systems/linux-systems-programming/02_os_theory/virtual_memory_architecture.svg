<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="79.0123" y="71.1111" width="237.037" height="568.8889" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="197.5309" y="42.6667" text-anchor="middle" font-size="19.9111" font-weight="bold">Process A</text>
  <rect x="79.0123" y="71.1111" width="237.037" height="142.2222" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="197.5309" y="142.2222" text-anchor="middle" fill="var(--bg)" font-size="17.0667">Stack</text>
  <rect x="79.0123" y="355.5556" width="237.037" height="142.2222" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="197.5309" y="426.6667" text-anchor="middle" fill="var(--bg)" font-size="17.0667">Heap</text>
  <rect x="79.0123" y="497.7778" width="237.037" height="142.2222" fill="var(--primary-accent)" rx="6"/>
  <text x="197.5309" y="568.8889" text-anchor="middle" fill="var(--bg)" font-size="17.0667">Code</text>
  <rect x="395.0617" y="71.1111" width="237.037" height="568.8889" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6"/>
  <text x="513.5802" y="42.6667" text-anchor="middle" font-size="19.9111" font-weight="bold">Process B</text>
  <rect x="395.0617" y="71.1111" width="237.037" height="142.2222" fill="var(--danger-accent)" rx="6"/>
  <text x="513.5802" y="142.2222" text-anchor="middle" fill="var(--bg)" font-size="17.0667">Stack</text>
  <rect x="395.0617" y="355.5556" width="237.037" height="142.2222" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="513.5802" y="426.6667" text-anchor="middle" fill="var(--bg)" font-size="17.0667">Heap</text>
  <rect x="395.0617" y="497.7778" width="237.037" height="142.2222" fill="var(--danger-accent)" rx="6"/>
  <text x="513.5802" y="568.8889" text-anchor="middle" fill="var(--bg)" font-size="17.0667">Code</text>
  <rect x="790.1235" y="71.1111" width="395.0617" height="568.8889" fill="var(--text-faint)" stroke="var(--text)" stroke-width="2.8444" rx="6"/>
  <text x="987.6543" y="42.6667" text-anchor="middle" font-size="19.9111" font-weight="bold">Physical Memory</text>
  <rect x="790.1235" y="142.2222" width="395.0617" height="71.1111" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="987.6543" y="184.8889" text-anchor="middle" fill="var(--bg)" font-size="15.6444">Process A Page</text>
  <rect x="790.1235" y="284.4444" width="395.0617" height="71.1111" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="987.6543" y="327.1111" text-anchor="middle" fill="var(--bg)" font-size="15.6444">Process B Page</text>
  <rect x="790.1235" y="426.6667" width="395.0617" height="71.1111" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="987.6543" y="469.3333" text-anchor="middle" fill="var(--bg)" font-size="15.6444">Kernel Page</text>
</svg>
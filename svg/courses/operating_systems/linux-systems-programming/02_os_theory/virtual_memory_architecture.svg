<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="67.619" width="257.1428" height="552.381" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="168.5715" y="40" text-anchor="middle" font-size="20.4353" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Process A</text>
  <rect x="40" y="67.619" width="257.1428" height="138.0952" fill="url(#grad-primary)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="168.5715" y="136.6666" text-anchor="middle" fill="var(--bg)" font-size="17.516" font-family="Arial, sans-serif">Stack</text>
  <rect x="40" y="343.8096" width="257.1428" height="138.0952" fill="url(#grad-primary)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="168.5715" y="412.8572" text-anchor="middle" fill="var(--bg)" font-size="17.516" font-family="Arial, sans-serif">Heap</text>
  <rect x="40" y="481.9048" width="257.1428" height="138.0952" fill="var(--primary-accent)" rx="6"/>
  <text x="168.5715" y="550.9524" text-anchor="middle" fill="var(--bg)" font-size="17.516" font-family="Arial, sans-serif">Code</text>
  <rect x="382.8571" y="67.619" width="257.1428" height="552.381" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="511.4285" y="40" text-anchor="middle" font-size="20.4353" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Process B</text>
  <rect x="382.8571" y="67.619" width="257.1428" height="138.0952" fill="var(--danger-accent)" rx="6"/>
  <text x="511.4285" y="136.6666" text-anchor="middle" fill="var(--bg)" font-size="17.516" font-family="Arial, sans-serif">Stack</text>
  <rect x="382.8571" y="343.8096" width="257.1428" height="138.0952" fill="url(#grad-danger)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="511.4285" y="412.8572" text-anchor="middle" fill="var(--bg)" font-size="17.516" font-family="Arial, sans-serif">Heap</text>
  <rect x="382.8571" y="481.9048" width="257.1428" height="138.0952" fill="var(--danger-accent)" rx="6"/>
  <text x="511.4285" y="550.9524" text-anchor="middle" fill="var(--bg)" font-size="17.516" font-family="Arial, sans-serif">Code</text>
  <rect x="811.4286" y="67.619" width="428.5714" height="552.381" fill="var(--text-faint)" stroke="var(--text)" stroke-width="2.8444" rx="6"/>
  <text x="1025.7143" y="40" text-anchor="middle" font-size="20.4353" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Physical Memory</text>
  <rect x="811.4286" y="136.6666" width="428.5714" height="69.0476" fill="url(#grad-primary)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1025.7143" y="178.0952" text-anchor="middle" fill="var(--bg)" font-size="16.0562" font-family="Arial, sans-serif">Process A Page</text>
  <rect x="811.4286" y="274.7618" width="428.5714" height="69.0476" fill="url(#grad-danger)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1025.7143" y="316.1904" text-anchor="middle" fill="var(--bg)" font-size="16.0562" font-family="Arial, sans-serif">Process B Page</text>
  <rect x="811.4286" y="412.8572" width="428.5714" height="69.0476" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1025.7143" y="454.2857" text-anchor="middle" fill="var(--bg)" font-size="16.0562" font-family="Arial, sans-serif">Kernel Page</text>
</svg>
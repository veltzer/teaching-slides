<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="665.4091" y="40" text-anchor="middle" font-size="25.4169" font-weight="bold" fill="var(--text)">x86-64 Memory Layout</text>
  <rect x="411.3182" y="71.7808" width="508.1818" height="95.3425" rx="5.9982" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="665.4091" y="119.4521" text-anchor="middle" font-size="22.2398" font-weight="bold" fill="var(--text)">Kernel Space</text>
  <text x="360.5" y="111.5068" text-anchor="end" font-size="15.8855" fill="var(--text-faint)">0xFFFFFFFFFFFFFFFF</text>
  <text x="360.5" y="159.1781" text-anchor="end" font-size="15.8855" fill="var(--text-faint)">0xFFFF800000000000</text>
  <rect x="411.3182" y="175.0685" width="508.1818" height="79.4521" rx="5.9982" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="665.4091" y="222.7397" text-anchor="middle" font-size="20.6512" fill="var(--text-muted)">(Not mapped)</text>
  <text x="767.0454" y="198.9041" text-anchor="middle" font-size="15.8855" fill="var(--text-faint)">Canonical hole</text>
  <text x="360.5" y="246.5753" text-anchor="end" font-size="15.8855" fill="var(--text-faint)">0x00007FFFFFFFFFFF</text>
  <rect x="411.3182" y="262.4658" width="508.1818" height="95.3425" rx="5.9982" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="665.4091" y="302.1918" text-anchor="middle" font-size="22.2398" font-weight="bold" fill="var(--text)">User Stack</text>
  <text x="665.4091" y="341.9178" text-anchor="middle" font-size="25.4169" fill="var(--primary-accent)">↓</text>
  <rect x="411.3182" y="365.7534" width="508.1818" height="79.4521" rx="5.9982" fill="var(--bg)" stroke="var(--border)" stroke-width="1.6" stroke-dasharray="8 8" />
  <text x="665.4091" y="413.4247" text-anchor="middle" font-size="19.0627" fill="var(--text-faint)">(free space)</text>
  <rect x="411.3182" y="453.1507" width="508.1818" height="79.4521" rx="5.9982" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="665.4091" y="484.9315" text-anchor="middle" font-size="25.4169" fill="var(--ok-accent)">↑</text>
  <text x="665.4091" y="516.7123" text-anchor="middle" font-size="22.2398" font-weight="bold" fill="var(--text)">User Heap</text>
  <rect x="411.3182" y="540.5479" width="508.1818" height="79.4521" rx="5.9982" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="665.4091" y="588.2192" text-anchor="middle" font-size="22.2398" font-weight="bold" fill="var(--text)">User Code</text>
  <text x="360.5" y="620" text-anchor="end" font-size="15.8855" fill="var(--text-faint)">0x0000000000000000</text>
</svg>
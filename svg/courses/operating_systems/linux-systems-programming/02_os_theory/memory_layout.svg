<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="40" text-anchor="middle" font-size="25.6" font-weight="bold" fill="#333">x86-64 Memory Layout</text>
  <rect x="384" y="72" width="512" height="96" rx="8" fill="#f8d7da" stroke="#dc3545" stroke-width="3.2" />
  <text x="640" y="120" text-anchor="middle" font-size="22.4" font-weight="bold" fill="#333">Kernel Space</text>
  <text x="332.8" y="112" text-anchor="end" font-size="16" fill="#888">0xFFFFFFFFFFFFFFFF</text>
  <text x="332.8" y="160" text-anchor="end" font-size="16" fill="#888">0xFFFF800000000000</text>
  <rect x="384" y="176" width="512" height="80" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="2.4" />
  <text x="640" y="224" text-anchor="middle" font-size="20.8" fill="#555">(Not mapped)</text>
  <text x="742.4" y="200" text-anchor="middle" font-size="16" fill="#888">Canonical hole</text>
  <text x="332.8" y="248" text-anchor="end" font-size="16" fill="#888">0x00007FFFFFFFFFFF</text>
  <rect x="384" y="264" width="512" height="96" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="640" y="304" text-anchor="middle" font-size="22.4" font-weight="bold" fill="#333">User Stack</text>
  <text x="640" y="344" text-anchor="middle" font-size="25.6" fill="#4a90e2">↓</text>
  <rect x="384" y="368" width="512" height="80" rx="8" fill="white" stroke="#ccc" stroke-width="1.6" stroke-dasharray="8 8" />
  <text x="640" y="416" text-anchor="middle" font-size="19.2" fill="#999">(free space)</text>
  <rect x="384" y="456" width="512" height="80" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <text x="640" y="488" text-anchor="middle" font-size="25.6" fill="#28a745">↑</text>
  <text x="640" y="520" text-anchor="middle" font-size="22.4" font-weight="bold" fill="#333">User Heap</text>
  <rect x="384" y="544" width="512" height="80" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="640" y="592" text-anchor="middle" font-size="22.4" font-weight="bold" fill="#333">User Code</text>
  <text x="332.8" y="624" text-anchor="end" font-size="16" fill="#888">0x0000000000000000</text>
</svg>
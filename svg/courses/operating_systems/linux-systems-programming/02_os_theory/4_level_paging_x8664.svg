<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="607.1233" y="40" text-anchor="middle" font-size="30.8693" font-weight="bold" fill="var(--text)">Virtual Address (48 bits used of 64)</text>
  <rect x="40" y="108.2353" width="164.3836" height="170.5882" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="122.1918" y="176.4707" text-anchor="middle" font-size="25.0813" font-weight="bold" fill="var(--text)">PML4</text>
  <text x="122.1918" y="234.4706" text-anchor="middle" font-size="21.2226" fill="var(--text-muted)">9 bits</text>
  <rect x="220.822" y="108.2353" width="164.3836" height="170.5882" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="303.0137" y="176.4707" text-anchor="middle" font-size="25.0813" font-weight="bold" fill="var(--text)">PDPT</text>
  <text x="303.0137" y="234.4706" text-anchor="middle" font-size="21.2226" fill="var(--text-muted)">9 bits</text>
  <rect x="401.6439" y="108.2353" width="164.3836" height="170.5882" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="483.8357" y="176.4707" text-anchor="middle" font-size="25.0813" font-weight="bold" fill="var(--text)">PD</text>
  <text x="483.8357" y="234.4706" text-anchor="middle" font-size="21.2226" fill="var(--text-muted)">9 bits</text>
  <rect x="582.4658" y="108.2353" width="164.3836" height="170.5882" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="664.6575" y="176.4707" text-anchor="middle" font-size="25.0813" font-weight="bold" fill="var(--text)">PT</text>
  <text x="664.6575" y="234.4706" text-anchor="middle" font-size="21.2226" fill="var(--text-muted)">9 bits</text>
  <rect x="763.2877" y="108.2353" width="180.8219" height="170.5882" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="853.6987" y="176.4707" text-anchor="middle" font-size="25.0813" font-weight="bold" fill="var(--text)">Offset</text>
  <text x="853.6987" y="234.4706" text-anchor="middle" font-size="21.2226" fill="var(--text-muted)">12 bits</text>
  <rect x="960.5479" y="108.2353" width="180.8219" height="170.5882" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050.9589" y="176.4707" text-anchor="middle" font-size="25.0813" font-weight="bold" fill="var(--text-muted)">Unused</text>
  <text x="1050.9589" y="234.4706" text-anchor="middle" font-size="21.2226" fill="var(--text-muted)">16 bits</text>
  <text x="607.1233" y="432.353" text-anchor="middle" font-size="28.9399" font-weight="bold" fill="var(--primary-accent)">CR3 → PML4 → PDPT → PD → PT → Physical Page</text>
  <rect x="72.8767" y="500.5883" width="98.6301" height="119.4117" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="122.1918" y="579.0587" text-anchor="middle" font-size="21.2226" fill="var(--text)">CR3</text>
  <rect x="253.6987" y="500.5883" width="131.5068" height="119.4117" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="319.4521" y="579.0587" text-anchor="middle" font-size="21.2226" fill="var(--text)">PML4</text>
  <rect x="467.3972" y="500.5883" width="131.5068" height="119.4117" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="533.1507" y="579.0587" text-anchor="middle" font-size="21.2226" fill="var(--text)">PDPT</text>
  <rect x="681.096" y="500.5883" width="131.5068" height="119.4117" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="746.8494" y="579.0587" text-anchor="middle" font-size="21.2226" fill="var(--text)">PD</text>
  <rect x="894.7946" y="500.5883" width="131.5068" height="119.4117" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="960.5479" y="579.0587" text-anchor="middle" font-size="21.2226" fill="var(--text)">PT</text>
  <rect x="1108.4932" y="500.5883" width="131.5068" height="119.4117" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1174.2466" y="579.0587" text-anchor="middle" font-size="21.2226" fill="var(--text)">Page</text>
  <line x1="171.5068" y1="558.5882" x2="253.6987" y2="558.5882" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#ar1)" />
  <line x1="385.2055" y1="558.5882" x2="467.3972" y2="558.5882" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#ar1)" />
  <line x1="598.9042" y1="558.5882" x2="681.096" y2="558.5882" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#ar1)" />
  <line x1="812.6028" y1="558.5882" x2="894.7946" y2="558.5882" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#ar1)" />
  <line x1="1026.3014" y1="558.5882" x2="1108.4932" y2="558.5882" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#ar1)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-forward">
      <path d="M 0 0 L 17.0667 12.8571 L 0 25.7143 z" fill="#4a90e2" />
    </marker>
  </defs>
</svg>
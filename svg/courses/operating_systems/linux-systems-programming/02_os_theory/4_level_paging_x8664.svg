<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 280" font-family="Arial, sans-serif">
  <text x="375" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Virtual Address (48 bits used of 64)</text>
  <rect x="30" y="45" width="100" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="80" y="65" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">PML4</text>
  <text x="80" y="82" text-anchor="middle" font-size="11" fill="#555">9 bits</text>
  <rect x="140" y="45" width="100" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="190" y="65" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">PDPT</text>
  <text x="190" y="82" text-anchor="middle" font-size="11" fill="#555">9 bits</text>
  <rect x="250" y="45" width="100" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="300" y="65" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">PD</text>
  <text x="300" y="82" text-anchor="middle" font-size="11" fill="#555">9 bits</text>
  <rect x="360" y="45" width="100" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="410" y="65" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">PT</text>
  <text x="410" y="82" text-anchor="middle" font-size="11" fill="#555">9 bits</text>
  <rect x="470" y="45" width="110" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="525" y="65" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Offset</text>
  <text x="525" y="82" text-anchor="middle" font-size="11" fill="#555">12 bits</text>
  <rect x="590" y="45" width="110" height="50" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="645" y="65" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">Unused</text>
  <text x="645" y="82" text-anchor="middle" font-size="11" fill="#555">16 bits</text>
  <text x="375" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a90e2">CR3 &#x2192; PML4 &#x2192; PDPT &#x2192; PD &#x2192; PT &#x2192; Physical Page</text>
  <rect x="50" y="160" width="60" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="80" y="183" text-anchor="middle" font-size="11" fill="#333">CR3</text>
  <rect x="160" y="160" width="80" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="200" y="183" text-anchor="middle" font-size="11" fill="#333">PML4</text>
  <rect x="290" y="160" width="80" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="330" y="183" text-anchor="middle" font-size="11" fill="#333">PDPT</text>
  <rect x="420" y="160" width="80" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="460" y="183" text-anchor="middle" font-size="11" fill="#333">PD</text>
  <rect x="550" y="160" width="80" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="590" y="183" text-anchor="middle" font-size="11" fill="#333">PT</text>
  <rect x="680" y="160" width="80" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="720" y="183" text-anchor="middle" font-size="11" fill="#333">Page</text>
  <line x1="110" y1="177" x2="160" y2="177" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#ar1)"/>
  <line x1="240" y1="177" x2="290" y2="177" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#ar1)"/>
  <line x1="370" y1="177" x2="420" y2="177" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#ar1)"/>
  <line x1="500" y1="177" x2="550" y2="177" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#ar1)"/>
  <line x1="630" y1="177" x2="680" y2="177" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#ar1)"/>
  <defs>
    <marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-forward">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a90e2"/>
    </marker>
  </defs>
</svg>
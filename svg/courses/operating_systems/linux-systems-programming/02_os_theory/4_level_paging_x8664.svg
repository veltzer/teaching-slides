<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="631.579" y="63.4398" text-anchor="middle" font-size="26.9474" font-weight="bold" fill="var(--text)">Virtual Address (48 bits used of 64)</text>
  <rect x="50.5263" y="114.1917" width="168.4211" height="126.8797" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="134.7368" y="164.9437" text-anchor="middle" font-size="21.8948" font-weight="bold" fill="var(--text)">PML4</text>
  <text x="134.7368" y="208.0827" text-anchor="middle" font-size="18.5263" fill="var(--text-muted)">9 bits</text>
  <rect x="235.7895" y="114.1917" width="168.4211" height="126.8797" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="320" y="164.9437" text-anchor="middle" font-size="21.8948" font-weight="bold" fill="var(--text)">PDPT</text>
  <text x="320" y="208.0827" text-anchor="middle" font-size="18.5263" fill="var(--text-muted)">9 bits</text>
  <rect x="421.0527" y="114.1917" width="168.4211" height="126.8797" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="505.2632" y="164.9437" text-anchor="middle" font-size="21.8948" font-weight="bold" fill="var(--text)">PD</text>
  <text x="505.2632" y="208.0827" text-anchor="middle" font-size="18.5263" fill="var(--text-muted)">9 bits</text>
  <rect x="606.3158" y="114.1917" width="168.4211" height="126.8797" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="690.5263" y="164.9437" text-anchor="middle" font-size="21.8948" font-weight="bold" fill="var(--text)">PT</text>
  <text x="690.5263" y="208.0827" text-anchor="middle" font-size="18.5263" fill="var(--text-muted)">9 bits</text>
  <rect x="791.579" y="114.1917" width="185.2631" height="126.8797" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="884.2106" y="164.9437" text-anchor="middle" font-size="21.8948" font-weight="bold" fill="var(--text)">Offset</text>
  <text x="884.2106" y="208.0827" text-anchor="middle" font-size="18.5263" fill="var(--text-muted)">12 bits</text>
  <rect x="993.6842" y="114.1917" width="185.2631" height="126.8797" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1086.3158" y="164.9437" text-anchor="middle" font-size="21.8948" font-weight="bold" fill="var(--text-muted)">Unused</text>
  <text x="1086.3158" y="208.0827" text-anchor="middle" font-size="18.5263" fill="var(--text-muted)">16 bits</text>
  <text x="631.579" y="355.2632" text-anchor="middle" font-size="25.2632" font-weight="bold" fill="var(--primary-accent)">CR3 → PML4 → PDPT → PD → PT → Physical Page</text>
  <rect x="84.2105" y="406.0151" width="101.0526" height="88.8158" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="134.7368" y="464.3797" text-anchor="middle" font-size="18.5263" fill="var(--text)">CR3</text>
  <rect x="269.4737" y="406.0151" width="134.7368" height="88.8158" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="336.8421" y="464.3797" text-anchor="middle" font-size="18.5263" fill="var(--text)">PML4</text>
  <rect x="488.421" y="406.0151" width="134.7368" height="88.8158" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="555.7895" y="464.3797" text-anchor="middle" font-size="18.5263" fill="var(--text)">PDPT</text>
  <rect x="707.3685" y="406.0151" width="134.7368" height="88.8158" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="774.7369" y="464.3797" text-anchor="middle" font-size="18.5263" fill="var(--text)">PD</text>
  <rect x="926.3159" y="406.0151" width="134.7368" height="88.8158" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="993.6842" y="464.3797" text-anchor="middle" font-size="18.5263" fill="var(--text)">PT</text>
  <rect x="1145.2632" y="406.0151" width="134.7368" height="88.8158" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1212.6316" y="464.3797" text-anchor="middle" font-size="18.5263" fill="var(--text)">Page</text>
  <line x1="185.2631" y1="449.1542" x2="269.4737" y2="449.1542" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#ar1)" />
  <line x1="404.2105" y1="449.1542" x2="488.421" y2="449.1542" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#ar1)" />
  <line x1="623.158" y1="449.1542" x2="707.3685" y2="449.1542" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#ar1)" />
  <line x1="842.1053" y1="449.1542" x2="926.3159" y2="449.1542" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#ar1)" />
  <line x1="1061.0527" y1="449.1542" x2="1145.2632" y2="449.1542" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#ar1)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-forward">
      <path d="M 0 0 L 17.0667 12.8571 L 0 25.7143 z" fill="#4a90e2" />
    </marker>
  </defs>
</svg>
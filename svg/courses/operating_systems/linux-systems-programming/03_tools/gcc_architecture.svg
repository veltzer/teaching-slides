<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="228.5714" height="105.4545" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="154.2858" y="101.5152" text-anchor="middle" fill="var(--bg)" font-size="24.1507" font-family="Arial, sans-serif">Source Code</text>
  <rect x="363.8095" y="40" width="228.5714" height="105.4545" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="478.0953" y="101.5152" text-anchor="middle" fill="var(--bg)" font-size="24.1507" font-family="Arial, sans-serif">Preprocessor</text>
  <rect x="687.619" y="40" width="228.5714" height="105.4545" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="801.9047" y="101.5152" text-anchor="middle" fill="var(--bg)" font-size="24.1507" font-family="Arial, sans-serif">Compiler</text>
  <rect x="1011.4286" y="40" width="228.5714" height="105.4545" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1125.7142" y="101.5152" text-anchor="middle" fill="var(--bg)" font-size="24.1507" font-family="Arial, sans-serif">Assembler</text>
  <rect x="554.2857" y="303.6364" width="228.5714" height="105.4545" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="668.5714" y="365.1516" text-anchor="middle" fill="var(--bg)" font-size="24.1507" font-family="Arial, sans-serif">Linker</text>
  <rect x="554.2857" y="514.5455" width="228.5714" height="105.4545" fill="var(--text-muted)" stroke="var(--text)" stroke-width="2.9942" rx="6"/>
  <text x="668.5714" y="576.0606" text-anchor="middle" fill="var(--bg)" font-size="24.1507" font-family="Arial, sans-serif">Executable</text>
  <line x1="268.5714" y1="92.7273" x2="363.8095" y2="92.7273" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="592.3809" y1="92.7273" x2="687.619" y2="92.7273" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="916.1905" y1="92.7273" x2="1011.4286" y2="92.7273" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1125.7142" y1="145.4546" x2="668.5714" y2="303.6364" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="668.5714" y1="409.0909" x2="668.5714" y2="514.5455" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="154.2858" y="180.6061" text-anchor="middle" font-size="18.9755" font-family="Arial, sans-serif" fill="var(--text)">.c/.cpp</text>
  <text x="478.0953" y="180.6061" text-anchor="middle" font-size="18.9755" font-family="Arial, sans-serif" fill="var(--text)">.i</text>
  <text x="801.9047" y="180.6061" text-anchor="middle" font-size="18.9755" font-family="Arial, sans-serif" fill="var(--text)">.s</text>
  <text x="1125.7142" y="180.6061" text-anchor="middle" font-size="18.9755" font-family="Arial, sans-serif" fill="var(--text)">.o</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

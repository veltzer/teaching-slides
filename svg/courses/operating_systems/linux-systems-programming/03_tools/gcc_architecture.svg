<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="228.5714" height="105.4545" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="154.2858" y="101.5152" text-anchor="middle" fill="var(--bg)" font-size="24.1507">Source Code</text>
  <rect x="363.8095" y="40" width="228.5714" height="105.4545" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6"/>
  <text x="478.0953" y="101.5152" text-anchor="middle" fill="var(--bg)" font-size="24.1507">Preprocessor</text>
  <rect x="687.619" y="40" width="228.5714" height="105.4545" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6"/>
  <text x="801.9047" y="101.5152" text-anchor="middle" fill="var(--bg)" font-size="24.1507">Compiler</text>
  <rect x="1011.4286" y="40" width="228.5714" height="105.4545" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6"/>
  <text x="1125.7142" y="101.5152" text-anchor="middle" fill="var(--bg)" font-size="24.1507">Assembler</text>
  <rect x="554.2857" y="303.6364" width="228.5714" height="105.4545" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="668.5714" y="365.1516" text-anchor="middle" fill="var(--bg)" font-size="24.1507">Linker</text>
  <rect x="554.2857" y="514.5455" width="228.5714" height="105.4545" fill="var(--text-muted)" stroke="var(--text)" stroke-width="2.9942" rx="6"/>
  <text x="668.5714" y="576.0606" text-anchor="middle" fill="var(--bg)" font-size="24.1507">Executable</text>
  <line x1="268.5714" y1="92.7273" x2="363.8095" y2="92.7273" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="592.3809" y1="92.7273" x2="687.619" y2="92.7273" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="916.1905" y1="92.7273" x2="1011.4286" y2="92.7273" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1125.7142" y1="145.4546" x2="668.5714" y2="303.6364" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="668.5714" y1="409.0909" x2="668.5714" y2="514.5455" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="154.2858" y="180.6061" text-anchor="middle" font-size="18.9755">.c/.cpp</text>
  <text x="478.0953" y="180.6061" text-anchor="middle" font-size="18.9755">.i</text>
  <text x="801.9047" y="180.6061" text-anchor="middle" font-size="18.9755">.s</text>
  <text x="1125.7142" y="180.6061" text-anchor="middle" font-size="18.9755">.o</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow5" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#333" />
    </marker>
  </defs>
</svg>
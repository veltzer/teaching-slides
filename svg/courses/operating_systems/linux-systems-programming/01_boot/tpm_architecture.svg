<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="539.999875" height="115.999999773333" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.745966956509" filter="url(#shadow)"/>
  <text x="309.999875" y="107.666666251111" text-anchor="middle" fill="var(--bg)" font-size="31.986194535807" font-family="Arial, sans-serif">Crypto Engine</text>
  <rect x="699.999875" y="40" width="539.999875" height="115.999999773333" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="7.745966956509" filter="url(#shadow)"/>
  <text x="969.999875" y="107.666666251111" text-anchor="middle" fill="var(--bg)" font-size="31.986194535807" font-family="Arial, sans-serif">Key Generator</text>
  <rect x="40" y="214.000000226667" width="539.999875" height="115.999999773333" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="7.745966956509" filter="url(#shadow)"/>
  <text x="309.999875" y="281.666666477778" text-anchor="middle" fill="var(--bg)" font-size="31.986194535807" font-family="Arial, sans-serif">PCR Registers</text>
  <rect x="699.999875" y="214.000000226667" width="539.999875" height="115.999999773333" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.745966956509" filter="url(#shadow)"/>
  <text x="969.999875" y="281.666666477778" text-anchor="middle" fill="var(--bg)" font-size="31.986194535807" font-family="Arial, sans-serif">NVRAM Storage</text>
  <rect x="40" y="388.000000453333" width="1200" height="115.999999773333" fill="var(--text-muted)" stroke="var(--text)" stroke-width="2.8444" rx="7.745966956509"/>
  <text x="640" y="455.666666704444" text-anchor="middle" fill="var(--bg)" font-size="31.986194535807" font-family="Arial, sans-serif">Random Number Generator</text>
  <rect x="40" y="542.666666817778" width="1200" height="77.333333182222" fill="var(--text-faint)" stroke="var(--text)" stroke-width="2.8444" rx="7.745966956509"/>
  <text x="640" y="591.00000034" text-anchor="middle" fill="var(--bg)" font-size="31.986194535807" font-family="Arial, sans-serif">I/O Interface (LPC/SPI/I2C)</text>
</svg>

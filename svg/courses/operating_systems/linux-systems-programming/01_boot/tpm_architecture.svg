<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="237.037" y="71.1111" width="790.1235" height="568.8889" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="632.0988" y="113.7778" text-anchor="middle" font-size="28.4444" font-weight="bold">TPM Chip</text>
  <rect x="316.0494" y="170.6667" width="284.4444" height="85.3333" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="458.2716" y="220.4444" text-anchor="middle" fill="var(--bg)" font-size="19.9111">Crypto Engine</text>
  <rect x="663.7037" y="170.6667" width="284.4444" height="85.3333" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6"/>
  <text x="805.9259" y="220.4444" text-anchor="middle" fill="var(--bg)" font-size="19.9111">Key Generator</text>
  <rect x="316.0494" y="298.6667" width="284.4444" height="85.3333" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6"/>
  <text x="458.2716" y="348.4444" text-anchor="middle" fill="var(--bg)" font-size="19.9111">PCR Registers</text>
  <rect x="663.7037" y="298.6667" width="284.4444" height="85.3333" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="805.9259" y="348.4444" text-anchor="middle" fill="var(--bg)" font-size="19.9111">NVRAM Storage</text>
  <rect x="316.0494" y="426.6667" width="632.0988" height="85.3333" fill="var(--text-muted)" stroke="var(--text)" stroke-width="2.8444" rx="6"/>
  <text x="632.0988" y="476.4444" text-anchor="middle" fill="var(--bg)" font-size="19.9111">Random Number Generator</text>
  <rect x="316.0494" y="540.4444" width="632.0988" height="56.8889" fill="var(--text-faint)" stroke="var(--text)" stroke-width="2.8444" rx="6"/>
  <text x="632.0988" y="576" text-anchor="middle" fill="var(--bg)" font-size="19.9111">I/O Interface (LPC/SPI/I2C)</text>
</svg>
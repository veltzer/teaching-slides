    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arr" markerWidth="20.6452" markerHeight="63" refX="18.5806" refY="31.5" orient="auto">
      <polygon points="0,90 7.2258,0" fill="#555" />

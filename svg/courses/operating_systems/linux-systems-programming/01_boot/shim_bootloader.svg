  <line x1="491.3548" y1="342" x2="524.3871" y2="342" stroke="#555" stroke-width="3.0968" marker-end="url(#arr)" />
  <rect x="528.5161" y="180" width="268.3871" height="324" fill="#fff3e0" stroke="#333" stroke-width="3.0968" rx="8.2581" />
  <text x="662.7097" y="342" font-size="26.8387" font-weight="bold" fill="#222" text-anchor="middle">GRUB</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="280" height="580" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="90" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--primary-text)">UEFI</text>
  <text x="180" y="320" text-anchor="middle" font-size="18" fill="var(--primary-text)">Firmware</text>
  <text x="180" y="350" text-anchor="middle" font-size="18" fill="var(--primary-text)">verifies Shim</text>
  <text x="180" y="380" text-anchor="middle" font-size="16" fill="var(--primary-text)">Microsoft key</text>

  <rect x="340" y="40" width="280" height="580" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="90" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--ok-text)">Shim</text>
  <text x="480" y="320" text-anchor="middle" font-size="18" fill="var(--ok-text)">MS-signed</text>
  <text x="480" y="350" text-anchor="middle" font-size="18" fill="var(--ok-text)">loads GRUB</text>
  <text x="480" y="380" text-anchor="middle" font-size="16" fill="var(--ok-text)">uses distro key</text>

  <rect x="660" y="40" width="280" height="580" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="90" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--warn-text)">GRUB</text>
  <text x="800" y="320" text-anchor="middle" font-size="18" fill="var(--warn-text)">distro-signed</text>
  <text x="800" y="350" text-anchor="middle" font-size="18" fill="var(--warn-text)">picks kernel</text>
  <text x="800" y="380" text-anchor="middle" font-size="16" fill="var(--warn-text)">verifies kernel</text>

  <rect x="960" y="40" width="280" height="580" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100" y="90" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--danger-text)">Kernel</text>
  <text x="1100" y="320" text-anchor="middle" font-size="18" fill="var(--danger-text)">signed image</text>
  <text x="1100" y="350" text-anchor="middle" font-size="18" fill="var(--danger-text)">boots Linux</text>
  <text x="1100" y="380" text-anchor="middle" font-size="16" fill="var(--danger-text)">Secure Boot OK</text>

  <line x1="320" y1="330" x2="340" y2="330" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="620" y1="330" x2="660" y2="330" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="940" y1="330" x2="960" y2="330" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

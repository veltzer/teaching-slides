  <rect x="20.6452" y="180" width="165.1613" height="324" fill="#e3f2fd" stroke="#333" stroke-width="3.0968" rx="8.2581" />
  <text x="103.2258" y="387" font-size="26.8387" font-weight="bold" fill="#222" text-anchor="middle">UEFI</text>
  <line x1="185.8065" y1="342" x2="218.8387" y2="342" stroke="#555" stroke-width="3.0968" marker-end="url(#arr)" />

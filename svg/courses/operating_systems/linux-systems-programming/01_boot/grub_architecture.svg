<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="94.909091" rx="6.161464" fill="var(--text)" stroke="var(--text)" stroke-width="2"/>
  <text x="640" y="82.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.645855" font-weight="bold" fill="var(--bg)">GRUB — GRand Unified Bootloader</text>
  <text x="640" y="113.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--bg)">multi-stage boot from firmware to kernel</text>

  <rect x="40" y="166.545455" width="285" height="400.727273" rx="6.161464" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="182" y="208.727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538213" font-weight="bold" fill="var(--primary-text)">Stage 1</text>
  <text x="182" y="245.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--primary-text)">boot.img in MBR</text>
  <text x="182" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--primary-text)">or GPT protective MBR</text>
  <text x="182" y="319.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--primary-text)">exactly 446 bytes of code</text>
  <text x="182" y="356.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--primary-text)">BIOS loads first sector</text>
  <text x="182" y="393.272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--primary-text)">jumps to 0x7c00</text>
  <text x="182" y="440.727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--primary-text)">only job: find and</text>
  <text x="182" y="461.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--primary-text)">load Stage 1.5</text>
  <text x="182" y="514.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--primary-text)">no filesystem support</text>
  <text x="182" y="546.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.322928" fill="var(--primary-text)">UEFI skips this stage</text>

  <rect x="345" y="166.545455" width="285" height="400.727273" rx="6.161464" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="487" y="208.727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538213" font-weight="bold" fill="var(--info-text)">Stage 1.5</text>
  <text x="487" y="245.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--info-text)">core.img in MBR gap</text>
  <text x="487" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--info-text)">or EFI partition</text>
  <text x="487" y="319.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--info-text)">filesystem drivers</text>
  <text x="487" y="356.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--info-text)">ext4, xfs, btrfs, fat</text>
  <text x="487" y="393.272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--info-text)">LVM and RAID modules</text>
  <text x="487" y="440.727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--info-text)">mounts /boot by path,</text>
  <text x="487" y="461.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--info-text)">loads Stage 2 files</text>
  <text x="487" y="514.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--info-text)">decompresses modules</text>
  <text x="487" y="546.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.322928" fill="var(--info-text)">hands off to Stage 2</text>

  <rect x="650" y="166.545455" width="285" height="400.727273" rx="6.161464" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="792" y="208.727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538213" font-weight="bold" fill="var(--danger-text)">Stage 2</text>
  <text x="792" y="245.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--danger-text)">/boot/grub/grub.cfg</text>
  <text x="792" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--danger-text)">menu and modules</text>
  <text x="792" y="319.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--danger-text)">interactive menu UI</text>
  <text x="792" y="356.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--danger-text)">keyboard, VGA, serial</text>
  <text x="792" y="393.272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--danger-text)">password and signatures</text>
  <text x="792" y="440.727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--danger-text)">picks kernel + initrd,</text>
  <text x="792" y="461.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--danger-text)">builds cmdline</text>
  <text x="792" y="514.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--danger-text)">scripting via BASH-like</text>
  <text x="792" y="546.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.322928" fill="var(--danger-text)">chain-loads other OSes</text>

  <rect x="955" y="166.545455" width="285" height="400.727273" rx="6.161464" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097" y="208.727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538213" font-weight="bold" fill="var(--ok-text)">Kernel Handoff</text>
  <text x="1097" y="245.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--ok-text)">vmlinuz + initramfs</text>
  <text x="1097" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--ok-text)">into memory</text>
  <text x="1097" y="319.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--ok-text)">decompresses the kernel</text>
  <text x="1097" y="356.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--ok-text)">sets up boot_params</text>
  <text x="1097" y="393.272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--ok-text)">passes cmdline + initrd</text>
  <text x="1097" y="440.727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--ok-text)">jumps to kernel entry</text>
  <text x="1097" y="461.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--ok-text)">at startup_32 / _64</text>
  <text x="1097" y="514.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--ok-text)">kernel takes over</text>
  <text x="1097" y="546.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.322928" fill="var(--ok-text)">GRUB is gone forever</text>

  <line x1="325" y1="366.909091" x2="345" y2="366.909091" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="630" y1="366.909091" x2="650" y2="366.909091" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="935" y1="366.909091" x2="955" y2="366.909091" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text-muted)">Each stage exists only to load the next, until the kernel is running</text>
</svg>

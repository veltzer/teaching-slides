<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="243" width="171.4286" height="116" fill="var(--danger-accent)" stroke="var(--text)" stroke-width="3.2" rx="6.0074"/>
  <text x="125.7143" y="310.6667" text-anchor="middle" fill="var(--bg)" font-size="24.0296">Hardware</text>
  <rect x="297.1429" y="243" width="171.4286" height="116" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6.0074"/>
  <text x="382.8571" y="310.6667" text-anchor="middle" fill="var(--bg)" font-size="24.0296">Firmware</text>
  <rect x="554.2857" y="243" width="171.4286" height="116" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6.0074"/>
  <text x="640" y="310.6667" text-anchor="middle" fill="var(--bg)" font-size="24.0296">Bootloader</text>
  <rect x="811.4286" y="243" width="171.4286" height="116" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6.0074"/>
  <text x="897.1429" y="310.6667" text-anchor="middle" fill="var(--bg)" font-size="24.0296">Kernel</text>
  <rect x="1068.5714" y="243" width="171.4286" height="116" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6.0074"/>
  <text x="1154.2857" y="310.6667" text-anchor="middle" fill="var(--black)" font-size="24.0296">Userspace</text>
  <line x1="211.4286" y1="301" x2="297.1429" y2="301" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="468.5714" y1="301" x2="554.2857" y2="301" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="725.7143" y1="301" x2="811.4286" y2="301" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="982.8571" y1="301" x2="1068.5714" y2="301" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="125.7143" y="417" text-anchor="middle" font-size="20.5968">Root of Trust</text>
  <text x="382.8571" y="417" text-anchor="middle" font-size="20.5968">Verified</text>
  <text x="640" y="417" text-anchor="middle" font-size="20.5968">Signed</text>
  <text x="897.1429" y="417" text-anchor="middle" font-size="20.5968">Signed</text>
  <text x="1154.2857" y="417" text-anchor="middle" font-size="20.5968">Trusted</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#333" />
    </marker>
  </defs>
</svg>
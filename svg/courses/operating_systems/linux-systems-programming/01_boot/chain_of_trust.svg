<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <!-- palette: resources/palette_diagram.yaml -->

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="33.164014" font-weight="bold" fill="var(--text)">Chain of Trust at Boot</text>

  <rect x="40" y="158.148148" width="220" height="279.259259" rx="6.218253" fill="var(--danger-accent)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="150" y="211.851852" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.80026" font-weight="bold" fill="var(--bg)">Hardware</text>
  <text x="150" y="287.037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--bg)">Root of Trust</text>
  <text x="150" y="319.259259" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--bg)">Immutable key</text>
  <text x="150" y="394.444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--bg)">fused in silicon</text>

  <rect x="290" y="158.148148" width="220" height="279.259259" rx="6.218253" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="211.851852" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.80026" font-weight="bold" fill="var(--bg)">Firmware</text>
  <text x="400" y="287.037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--bg)">Verified by HW</text>
  <text x="400" y="319.259259" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--bg)">UEFI / BL1</text>
  <text x="400" y="394.444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--bg)">loads next stage</text>

  <rect x="540" y="158.148148" width="220" height="279.259259" rx="6.218253" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="211.851852" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.80026" font-weight="bold" fill="var(--bg)">Bootloader</text>
  <text x="650" y="287.037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--bg)">Signed binary</text>
  <text x="650" y="319.259259" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--bg)">GRUB / U-Boot</text>
  <text x="650" y="394.444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--bg)">verifies kernel</text>

  <rect x="790" y="158.148148" width="220" height="279.259259" rx="6.218253" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="900" y="211.851852" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.80026" font-weight="bold" fill="var(--bg)">Kernel</text>
  <text x="900" y="287.037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--bg)">Signed image</text>
  <text x="900" y="319.259259" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--bg)">+ initramfs</text>
  <text x="900" y="394.444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--bg)">checks userspace</text>

  <rect x="1040" y="158.148148" width="200" height="279.259259" rx="6.218253" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1140" y="211.851852" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.80026" font-weight="bold" fill="var(--bg)">Userspace</text>
  <text x="1140" y="287.037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--bg)">IMA / dm-verity</text>
  <text x="1140" y="319.259259" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--bg)">measures files</text>
  <text x="1140" y="394.444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--bg)">trusted runtime</text>

  <line x1="260" y1="297.777778" x2="290" y2="297.777778" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="510" y1="297.777778" x2="540" y2="297.777778" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="297.777778" x2="790" y2="297.777778" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1010" y1="297.777778" x2="1040" y2="297.777778" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="480.37037" width="1200" height="139.62963" rx="6.218253" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="523.333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758" font-weight="bold" fill="var(--text)">Each stage verifies the next</text>
  <text x="640" y="560.925926" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545632" fill="var(--text-muted)">Break any link and the chain collapses. Trust flows from silicon upward.</text>
  <text x="640" y="598.518519" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545632" fill="var(--text-muted)">Secure Boot, Measured Boot, and IMA build on this pattern.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="80" y="180" width="160" height="108" fill="#c62828" stroke="#333" stroke-width="3.2" />
  <text x="160" y="243" text-anchor="middle" fill="white" font-size="22.4">Hardware</text>
  <rect x="320" y="180" width="160" height="108" fill="#E74C3C" stroke="#333" stroke-width="3.2" />
  <text x="400" y="243" text-anchor="middle" fill="white" font-size="22.4">Firmware</text>
  <rect x="560" y="180" width="160" height="108" fill="#e74c3c" stroke="#333" stroke-width="3.2" />
  <text x="640" y="243" text-anchor="middle" fill="white" font-size="22.4">Bootloader</text>
  <rect x="800" y="180" width="160" height="108" fill="#ffcc80" stroke="#333" stroke-width="3.2" />
  <text x="880" y="243" text-anchor="middle" fill="white" font-size="22.4">Kernel</text>
  <rect x="1040" y="180" width="160" height="108" fill="#f8d7da" stroke="#333" stroke-width="3.2" />
  <text x="1120" y="243" text-anchor="middle" fill="black" font-size="22.4">Userspace</text>
  <line x1="240" y1="234" x2="320" y2="234" stroke="#333" stroke-width="3.2" marker-end="url(#arrow)" />
  <line x1="480" y1="234" x2="560" y2="234" stroke="#333" stroke-width="3.2" marker-end="url(#arrow)" />
  <line x1="720" y1="234" x2="800" y2="234" stroke="#333" stroke-width="3.2" marker-end="url(#arrow)" />
  <line x1="960" y1="234" x2="1040" y2="234" stroke="#333" stroke-width="3.2" marker-end="url(#arrow)" />
  <text x="160" y="342" text-anchor="middle" font-size="19.2">Root of Trust</text>
  <text x="400" y="342" text-anchor="middle" font-size="19.2">Verified</text>
  <text x="640" y="342" text-anchor="middle" font-size="19.2">Signed</text>
  <text x="880" y="342" text-anchor="middle" font-size="19.2">Signed</text>
  <text x="1120" y="342" text-anchor="middle" font-size="19.2">Trusted</text>
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arrow2" markerWidth="16" markerHeight="12.6" refX="16" refY="6.3" orient="auto">
      <polygon points="0,18 5.6,0" fill="#333" />
    </marker>
  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="220" height="350.69767398053" rx="6.968367396495" fill="var(--danger-accent)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="150" y="107.441860815576" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.550679333182" font-weight="bold" fill="var(--bg)">Hardware</text>
  <text x="150" y="201.860465203894" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.582311936688" fill="var(--bg)">Root of Trust</text>
  <text x="150" y="242.325581190914" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.582311936688" fill="var(--bg)">Immutable key</text>
  <text x="150" y="336.744185579232" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.582311936688" fill="var(--bg)">fused in silicon</text>

  <rect x="290" y="40" width="220" height="350.69767398053" rx="6.968367396495" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="400" y="107.441860815576" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.550679333182" font-weight="bold" fill="var(--bg)">Firmware</text>
  <text x="400" y="201.860465203894" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.582311936688" fill="var(--bg)">Verified by HW</text>
  <text x="400" y="242.325581190914" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.582311936688" fill="var(--bg)">UEFI / BL1</text>
  <text x="400" y="336.744185579232" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.582311936688" fill="var(--bg)">loads next stage</text>

  <rect x="540" y="40" width="220" height="350.69767398053" rx="6.968367396495" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="650" y="107.441860815576" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.550679333182" font-weight="bold" fill="var(--bg)">Bootloader</text>
  <text x="650" y="201.860465203894" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.582311936688" fill="var(--bg)">Signed binary</text>
  <text x="650" y="242.325581190914" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.582311936688" fill="var(--bg)">GRUB / U-Boot</text>
  <text x="650" y="336.744185579232" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.582311936688" fill="var(--bg)">verifies kernel</text>

  <rect x="790" y="40" width="220" height="350.69767398053" rx="6.968367396495" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="900" y="107.441860815576" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.550679333182" font-weight="bold" fill="var(--bg)">Kernel</text>
  <text x="900" y="201.860465203894" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.582311936688" fill="var(--bg)">Signed image</text>
  <text x="900" y="242.325581190914" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.582311936688" fill="var(--bg)">+ initramfs</text>
  <text x="900" y="336.744185579232" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.582311936688" fill="var(--bg)">checks userspace</text>

  <rect x="1040" y="40" width="200" height="350.69767398053" rx="6.968367396495" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1140" y="107.441860815576" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.550679333182" font-weight="bold" fill="var(--bg)">Userspace</text>
  <text x="1140" y="201.860465203894" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.582311936688" fill="var(--bg)">IMA / dm-verity</text>
  <text x="1140" y="242.325581190914" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.582311936688" fill="var(--bg)">measures files</text>
  <text x="1140" y="336.744185579232" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.582311936688" fill="var(--bg)">trusted runtime</text>

  <line x1="260" y1="215.348837618172" x2="290" y2="215.348837618172" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="510" y1="215.348837618172" x2="540" y2="215.348837618172" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="215.348837618172" x2="790" y2="215.348837618172" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1010" y1="215.348837618172" x2="1040" y2="215.348837618172" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="444.651162381828" width="1200" height="175.348837618172" rx="6.968367396495" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="498.604650783126" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.905101068853" font-weight="bold" fill="var(--text)">Each stage verifies the next</text>
  <text x="640" y="545.813953605192" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.420917930921" fill="var(--text-muted)">Break any link and the chain collapses. Trust flows from silicon upward.</text>
  <text x="640" y="593.023256427258" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.420917930921" fill="var(--text-muted)">Secure Boot, Measured Boot, and IMA build on this pattern.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <!-- Stage boxes -->
  <rect x="40" y="40" width="206.896552" height="198.048780166568" rx="9.677733576442" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="143.448276" y="124.878048266508" text-anchor="middle" font-size="26.613768482853" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Hardware</text>
  <text x="143.448276" y="181.463414216538" text-anchor="middle" font-size="16.936034906411" fill="var(--primary-text)" font-family="Arial, sans-serif">Power on, POST</text>
  <text x="143.448276" y="212.58536595003" text-anchor="middle" font-size="16.936034906411" fill="var(--primary-text)" font-family="Arial, sans-serif">CPU reset vector</text>

  <rect x="288.275862" y="40" width="206.896552" height="198.048780166568" rx="9.677733576442" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="391.724138" y="124.878048266508" text-anchor="middle" font-size="26.613768482853" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Firmware</text>
  <text x="391.724138" y="181.463414216538" text-anchor="middle" font-size="16.936034906411" fill="var(--info-text)" font-family="Arial, sans-serif">BIOS or UEFI</text>
  <text x="391.724138" y="212.58536595003" text-anchor="middle" font-size="16.936034906411" fill="var(--info-text)" font-family="Arial, sans-serif">Device init</text>

  <rect x="536.551724" y="40" width="206.896552" height="198.048780166568" rx="9.677733576442" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="124.878048266508" text-anchor="middle" font-size="26.613768482853" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Bootloader</text>
  <text x="640" y="181.463414216538" text-anchor="middle" font-size="16.936034906411" fill="var(--warn-text)" font-family="Arial, sans-serif">GRUB, systemd-boot</text>
  <text x="640" y="212.58536595003" text-anchor="middle" font-size="16.936034906411" fill="var(--warn-text)" font-family="Arial, sans-serif">Loads kernel + initrd</text>

  <rect x="784.827586" y="40" width="206.896552" height="198.048780166568" rx="9.677733576442" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="888.275862" y="124.878048266508" text-anchor="middle" font-size="26.613768482853" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Kernel</text>
  <text x="888.275862" y="181.463414216538" text-anchor="middle" font-size="16.936034906411" fill="var(--danger-text)" font-family="Arial, sans-serif">Decompress, init HW</text>
  <text x="888.275862" y="212.58536595003" text-anchor="middle" font-size="16.936034906411" fill="var(--danger-text)" font-family="Arial, sans-serif">Mount rootfs</text>

  <rect x="1033.103448" y="40" width="206.896552" height="198.048780166568" rx="9.677733576442" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1136.551724" y="124.878048266508" text-anchor="middle" font-size="26.613768482853" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Init / systemd</text>
  <text x="1136.551724" y="181.463414216538" text-anchor="middle" font-size="16.936034906411" fill="var(--ok-text)" font-family="Arial, sans-serif">PID 1 starts</text>
  <text x="1136.551724" y="212.58536595003" text-anchor="middle" font-size="16.936034906411" fill="var(--ok-text)" font-family="Arial, sans-serif">Services, login</text>

  <!-- Arrows between stages -->
  <line x1="246.896552" y1="139.024390083284" x2="288.275862" y2="139.024390083284" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="495.172414" y1="139.024390083284" x2="536.551724" y2="139.024390083284" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="743.448276" y1="139.024390083284" x2="784.827586" y2="139.024390083284" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="991.724138" y1="139.024390083284" x2="1033.103448" y2="139.024390083284" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Timeline -->
  <line x1="40" y1="351.219512066627" x2="1240" y2="351.219512066627" stroke="var(--border)" stroke-width="2"/>
  <text x="143.448276" y="393.658536199881" text-anchor="middle" font-size="16.936034906411" fill="var(--text-muted)" font-family="Arial, sans-serif">t = 0</text>
  <text x="1136.551724" y="393.658536199881" text-anchor="middle" font-size="16.936034906411" fill="var(--text-muted)" font-family="Arial, sans-serif">user login</text>

  <!-- Summary -->
  <rect x="40" y="450.243902149911" width="1200" height="169.756097850089" rx="7.258300182331" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="499.756097850089" text-anchor="middle" font-size="21.774901694632" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Each stage hands control to the next with progressively more capability.</text>
  <text x="640" y="549.268292233195" text-anchor="middle" font-size="19.355468300521" fill="var(--text-muted)" font-family="Arial, sans-serif">Firmware finds a bootable device; the bootloader picks a kernel;</text>
  <text x="640" y="584.634146116597" text-anchor="middle" font-size="19.355468300521" fill="var(--text-muted)" font-family="Arial, sans-serif">the kernel brings up userspace; init starts the system's services.</text>
</svg>

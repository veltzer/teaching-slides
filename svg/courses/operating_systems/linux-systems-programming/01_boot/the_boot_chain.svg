<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto">
      <path d="M1,1 L11,5 L1,9 Z" fill="#555555"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-size="29.514591" font-weight="bold" fill="var(--text)">The Linux Boot Chain</text>

  <!-- Stage boxes -->
  <rect x="40" y="179.62963" width="206.896552" height="150.37037" rx="8.43274" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="143.448276" y="244.074074" text-anchor="middle" font-size="23.190036" font-weight="bold" fill="var(--primary-text)">Hardware</text>
  <text x="143.448276" y="287.037037" text-anchor="middle" font-size="14.757296" fill="var(--primary-text)">Power on, POST</text>
  <text x="143.448276" y="310.666667" text-anchor="middle" font-size="14.757296" fill="var(--primary-text)">CPU reset vector</text>

  <rect x="288.275862" y="179.62963" width="206.896552" height="150.37037" rx="8.43274" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="391.724138" y="244.074074" text-anchor="middle" font-size="23.190036" font-weight="bold" fill="var(--info-text)">Firmware</text>
  <text x="391.724138" y="287.037037" text-anchor="middle" font-size="14.757296" fill="var(--info-text)">BIOS or UEFI</text>
  <text x="391.724138" y="310.666667" text-anchor="middle" font-size="14.757296" fill="var(--info-text)">Device init</text>

  <rect x="536.551724" y="179.62963" width="206.896552" height="150.37037" rx="8.43274" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="244.074074" text-anchor="middle" font-size="23.190036" font-weight="bold" fill="var(--warn-text)">Bootloader</text>
  <text x="640" y="287.037037" text-anchor="middle" font-size="14.757296" fill="var(--warn-text)">GRUB, systemd-boot</text>
  <text x="640" y="310.666667" text-anchor="middle" font-size="14.757296" fill="var(--warn-text)">Loads kernel + initrd</text>

  <rect x="784.827586" y="179.62963" width="206.896552" height="150.37037" rx="8.43274" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="888.275862" y="244.074074" text-anchor="middle" font-size="23.190036" font-weight="bold" fill="var(--danger-text)">Kernel</text>
  <text x="888.275862" y="287.037037" text-anchor="middle" font-size="14.757296" fill="var(--danger-text)">Decompress, init HW</text>
  <text x="888.275862" y="310.666667" text-anchor="middle" font-size="14.757296" fill="var(--danger-text)">Mount rootfs</text>

  <rect x="1033.103448" y="179.62963" width="206.896552" height="150.37037" rx="8.43274" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1136.551724" y="244.074074" text-anchor="middle" font-size="23.190036" font-weight="bold" fill="var(--ok-text)">Init / systemd</text>
  <text x="1136.551724" y="287.037037" text-anchor="middle" font-size="14.757296" fill="var(--ok-text)">PID 1 starts</text>
  <text x="1136.551724" y="310.666667" text-anchor="middle" font-size="14.757296" fill="var(--ok-text)">Services, login</text>

  <!-- Arrows between stages -->
  <line x1="246.896552" y1="254.814815" x2="288.275862" y2="254.814815" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="495.172414" y1="254.814815" x2="536.551724" y2="254.814815" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="743.448276" y1="254.814815" x2="784.827586" y2="254.814815" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="991.724138" y1="254.814815" x2="1033.103448" y2="254.814815" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Timeline -->
  <line x1="40" y1="415.925926" x2="1240" y2="415.925926" stroke="var(--border)" stroke-width="2"/>
  <text x="143.448276" y="448.148148" text-anchor="middle" font-size="14.757296" fill="var(--text-muted)">t = 0</text>
  <text x="1136.551724" y="448.148148" text-anchor="middle" font-size="14.757296" fill="var(--text-muted)">user login</text>

  <!-- Summary -->
  <rect x="40" y="491.111111" width="1200" height="128.888889" rx="6.324555" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="528.703704" text-anchor="middle" font-size="18.973666" font-weight="bold" fill="var(--text)">Each stage hands control to the next with progressively more capability.</text>
  <text x="640" y="566.296296" text-anchor="middle" font-size="16.865481" fill="var(--text-muted)">Firmware finds a bootable device; the bootloader picks a kernel;</text>
  <text x="640" y="593.148148" text-anchor="middle" font-size="16.865481" fill="var(--text-muted)">the kernel brings up userspace; init starts the system's services.</text>
</svg>

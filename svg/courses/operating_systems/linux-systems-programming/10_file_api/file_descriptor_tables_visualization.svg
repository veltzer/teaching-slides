<svg viewBox="0 0 450 280" xmlns="http://www.w3.org/2000/svg">
  <style>
    .txt { font-family: sans-serif; font-size: 12px; }
    .title { font-weight: bold; text-anchor: middle; }
    .box { stroke: #333; stroke-width: 1; fill: #fff; }
    .proc { fill: #eef; }
    .sys { fill: #efe; }
    .inode { fill: #fee; }
    .arr { stroke: #555; stroke-width: 1.5; marker-end: url(#arrowhead); fill: none; }
  </style>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555" />
    </marker>
  </defs>

  <text x="75" y="20" class="title">Process FD Table</text>
  <rect x="10" y="30" width="130" height="230" class="box proc" />
  <text x="20" y="55" class="txt">0 (stdin)</text><path d="M 90 50 L 155 80" class="arr" />
  <text x="20" y="85" class="txt">1 (stdout)</text><path d="M 90 80 L 155 110" class="arr" />
  <text x="20" y="115" class="txt">2 (stderr)</text><path d="M 90 110 L 155 110" class="arr" />
  <text x="20" y="145" class="txt">3</text><path d="M 90 140 L 155 170" class="arr" />
  <text x="20" y="175" class="txt">4</text><path d="M 90 170 L 155 170" class="arr" />
  <text x="20" y="205" class="txt">...</text>

  <text x="235" y="20" class="title">System Open File Table</text>
  <rect x="160" y="30" width="150" height="230" class="box sys" />
  <text x="170" y="85" class="txt">Entry A (tty)</text><path d="M 270 80 L 325 110" class="arr" />
  <text x="170" y="115" class="txt">Entry B (tty)</text><path d="M 270 110 L 325 110" class="arr" />
  <text x="170" y="175" class="txt">Entry C (file.txt)</text><path d="M 270 170 L 325 180" class="arr" />

  <text x="385" y="20" class="title">i-node Table</text>
  <rect x="330" y="30" width="110" height="230" class="box inode" />
  <text x="340" y="115" class="txt">tty i-node</text>
  <text x="340" y="185" class="txt">file.txt i-node</text>
</svg>

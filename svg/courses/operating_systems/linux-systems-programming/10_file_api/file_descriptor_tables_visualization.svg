<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:style>
    .txt { font-family: sans-serif; font-size: 12px; }
    .title { font-weight: bold; text-anchor: middle; }
    .box { stroke: #333; stroke-width: 1; fill: #fff; }
    .proc { fill: #e8f4f8; }
    .sys { fill: #e8f5e9; }
    .inode { fill: #ffebee; }
    .arr { stroke: #555; stroke-width: 1.5; marker-end: url(#arrow); fill: none; }
  </ns0:style>
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arrowhead" viewBox="0 0 10 10" refX="22.7556" refY="12.8571" markerWidth="17.0667" markerHeight="15.4286" orient="auto-start-reverse">
      <ns0:path d="M 0 0 L 28.4444 12.8571 L 0 25.7143 z" fill="#555" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="147.6923" y="35.6044" class="title">Process FD Table</ns0:text>
  <ns0:rect x="19.6923" y="53.4066" width="256" height="409.4506" class="box proc" />
  <ns0:text x="39.3846" y="97.9121" class="txt">0 (stdin)</ns0:text>
  <ns0:path d="M 177.2308 89.011 L 305.2308 142.4176" class="arr" />
  <ns0:text x="39.3846" y="151.3187" class="txt">1 (stdout)</ns0:text>
  <ns0:path d="M 177.2308 142.4176 L 305.2308 195.8242" class="arr" />
  <ns0:text x="39.3846" y="204.7253" class="txt">2 (stderr)</ns0:text>
  <ns0:path d="M 177.2308 195.8242 L 305.2308 195.8242" class="arr" />
  <ns0:text x="39.3846" y="258.1319" class="txt">3</ns0:text>
  <ns0:path d="M 177.2308 249.2308 L 305.2308 302.6374" class="arr" />
  <ns0:text x="39.3846" y="311.5385" class="txt">4</ns0:text>
  <ns0:path d="M 177.2308 302.6374 L 305.2308 302.6374" class="arr" />
  <ns0:text x="39.3846" y="364.9451" class="txt">...</ns0:text>
  <ns0:text x="462.7692" y="35.6044" class="title">System Open File Table</ns0:text>
  <ns0:rect x="315.0769" y="53.4066" width="295.3847" height="409.4506" class="box sys" />
  <ns0:text x="334.7693" y="151.3187" class="txt">Entry A (tty)</ns0:text>
  <ns0:path d="M 531.6923 142.4176 L 640 195.8242" class="arr" />
  <ns0:text x="334.7693" y="204.7253" class="txt">Entry B (tty)</ns0:text>
  <ns0:path d="M 531.6923 195.8242 L 640 195.8242" class="arr" />
  <ns0:text x="334.7693" y="311.5385" class="txt">Entry C (file.txt)</ns0:text>
  <ns0:path d="M 531.6923 302.6374 L 640 320.4395" class="arr" />
  <ns0:text x="758.1539" y="35.6044" class="title">i-node Table</ns0:text>
  <ns0:rect x="649.8462" y="53.4066" width="216.6154" height="409.4506" class="box inode" />
  <ns0:text x="669.5385" y="204.7253" class="txt">tty i-node</ns0:text>
  <ns0:text x="669.5385" y="329.3407" class="txt">file.txt i-node</ns0:text>
</ns0:svg>
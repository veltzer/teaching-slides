<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <style>
    .txt { font-family: sans-serif; font-size: 12px; }
    .title { font-weight: bold; text-anchor: middle; }
    .box { stroke: #333; stroke-width: 1; fill: #fff; }
    .proc { fill: #e8f4f8; }
    .sys { fill: #e8f5e9; }
    .inode { fill: #ffebee; }
    .arr { stroke: #555; stroke-width: 1.5; marker-end: url(#arrow); fill: none; }
  </style>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 28.4444 12.8571 L 0 25.7143 z" fill="#555" />
    </marker>
  </defs>
  <text x="294.321" y="80" class="title">Process FD Table</text>
  <rect x="144.5268" y="100.8333" width="299.5884" height="479.1667" class="box proc" rx="7.0216"/>
  <text x="167.572" y="152.9167" class="txt">0 (stdin)</text>
  <path d="M 328.8889 142.5 L 478.6832 205" class="arr" />
  <text x="167.572" y="215.4167" class="txt">1 (stdout)</text>
  <path d="M 328.8889 205 L 478.6832 267.5" class="arr" />
  <text x="167.572" y="277.9167" class="txt">2 (stderr)</text>
  <path d="M 328.8889 267.5 L 478.6832 267.5" class="arr" />
  <text x="167.572" y="340.4167" class="txt">3</text>
  <path d="M 328.8889 330 L 478.6832 392.5" class="arr" />
  <text x="167.572" y="402.9167" class="txt">4</text>
  <path d="M 328.8889 392.5 L 478.6832 392.5" class="arr" />
  <text x="167.572" y="465.4167" class="txt">...</text>
  <text x="663.0452" y="80" class="title">System Open File Table</text>
  <rect x="490.2057" y="100.8333" width="345.6791" height="479.1667" class="box sys" rx="7.0216"/>
  <text x="513.2511" y="215.4167" class="txt">Entry A (tty)</text>
  <path d="M 743.7037 205 L 870.4526 267.5" class="arr" />
  <text x="513.2511" y="277.9167" class="txt">Entry B (tty)</text>
  <path d="M 743.7037 267.5 L 870.4526 267.5" class="arr" />
  <text x="513.2511" y="402.9167" class="txt">Entry C (file.txt)</text>
  <path d="M 743.7037 392.5 L 870.4526 413.3332" class="arr" />
  <text x="1008.7243" y="80" class="title">i-node Table</text>
  <rect x="881.9753" y="100.8333" width="253.4979" height="479.1667" class="box inode" rx="7.0216"/>
  <text x="905.0206" y="277.9167" class="txt">tty i-node</text>
  <text x="905.0206" y="423.75" class="txt">file.txt i-node</text>
</svg>
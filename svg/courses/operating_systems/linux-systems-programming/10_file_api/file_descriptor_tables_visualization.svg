<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <style>
    .txt { font-family: sans-serif; font-size: 12px; }
    .title { font-weight: bold; text-anchor: middle; }
    .box { stroke: #333; stroke-width: 1; fill: #fff; }
    .proc { fill: #e8f4f8; }
    .sys { fill: #e8f5e9; }
    .inode { fill: #ffebee; }
    .arr { stroke: #555; stroke-width: 1.5; marker-end: url(#arrow); fill: none; }
  </style>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 28.4444 12.8571 L 0 25.7143 z" fill="#555" />
    </marker>
  </defs>
  <text x="147.6923" y="35.6044" class="title">Process FD Table</text>
  <rect x="19.6923" y="53.4066" width="256" height="409.4506" class="box proc" rx="6"/>
  <text x="39.3846" y="97.9121" class="txt">0 (stdin)</text>
  <path d="M 177.2308 89.011 L 305.2308 142.4176" class="arr" />
  <text x="39.3846" y="151.3187" class="txt">1 (stdout)</text>
  <path d="M 177.2308 142.4176 L 305.2308 195.8242" class="arr" />
  <text x="39.3846" y="204.7253" class="txt">2 (stderr)</text>
  <path d="M 177.2308 195.8242 L 305.2308 195.8242" class="arr" />
  <text x="39.3846" y="258.1319" class="txt">3</text>
  <path d="M 177.2308 249.2308 L 305.2308 302.6374" class="arr" />
  <text x="39.3846" y="311.5385" class="txt">4</text>
  <path d="M 177.2308 302.6374 L 305.2308 302.6374" class="arr" />
  <text x="39.3846" y="364.9451" class="txt">...</text>
  <text x="462.7692" y="35.6044" class="title">System Open File Table</text>
  <rect x="315.0769" y="53.4066" width="295.3847" height="409.4506" class="box sys" rx="6"/>
  <text x="334.7693" y="151.3187" class="txt">Entry A (tty)</text>
  <path d="M 531.6923 142.4176 L 640 195.8242" class="arr" />
  <text x="334.7693" y="204.7253" class="txt">Entry B (tty)</text>
  <path d="M 531.6923 195.8242 L 640 195.8242" class="arr" />
  <text x="334.7693" y="311.5385" class="txt">Entry C (file.txt)</text>
  <path d="M 531.6923 302.6374 L 640 320.4395" class="arr" />
  <text x="758.1539" y="35.6044" class="title">i-node Table</text>
  <rect x="649.8462" y="53.4066" width="216.6154" height="409.4506" class="box inode" rx="6"/>
  <text x="669.5385" y="204.7253" class="txt">tty i-node</text>
  <text x="669.5385" y="329.3407" class="txt">file.txt i-node</text>
</svg>
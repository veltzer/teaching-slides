<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="72" font-size="35.84" font-weight="bold" text-anchor="middle">Device Types</text>
  <rect x="128" y="180" width="384" height="288" fill="lightblue" stroke="black" />
  <text x="320" y="252" font-size="30.72" font-weight="bold" text-anchor="middle">Character Devices</text>
  <text x="320" y="324" font-size="25.6" text-anchor="middle">• Stream of bytes</text>
  <text x="320" y="378" font-size="25.6" text-anchor="middle">• No buffering</text>
  <text x="320" y="432" font-size="25.6" text-anchor="middle">• Serial ports, terminals</text>
  <rect x="768" y="180" width="384" height="288" fill="lightgreen" stroke="black" />
  <text x="960" y="252" font-size="30.72" font-weight="bold" text-anchor="middle">Block Devices</text>
  <text x="960" y="324" font-size="25.6" text-anchor="middle">• Fixed-size blocks</text>
  <text x="960" y="378" font-size="25.6" text-anchor="middle">• Random access</text>
  <text x="960" y="432" font-size="25.6" text-anchor="middle">• Disks, filesystems</text>
</svg>
  <text x="189.9999" y="185" font-size="32.6761" text-anchor="middle">User Process</text>
  <rect x="490.0001" y="303.6364" width="299.9999" height="105.4545" fill="var(--warn-fill)" stroke="var(--warn-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>

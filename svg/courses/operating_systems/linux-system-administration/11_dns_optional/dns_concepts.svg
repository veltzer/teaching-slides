  <rect x="925.245979" y="309.767403" width="314.754021" height="310.232597" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="7.952588"/>
  <rect x="925.245979" y="309.767403" width="314.754021" height="67.441767" fill="url(#grad-primary)" rx="7.952588" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="925.245979" y="363.721051" width="314.754021" height="13.488454" fill="url(#grad-primary)" rx="7.952588" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1082.623042" y="352.930255" text-anchor="middle" font-size="20.73306" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Authoritative</text>
  <text x="1082.623042" y="437.907045" text-anchor="middle" font-size="17.277527" fill="var(--text)" font-family="Arial, sans-serif">Zone data owner</text>
  <text x="1082.623042" y="475.674582" text-anchor="middle" font-size="17.277527" fill="var(--text)" font-family="Arial, sans-serif">A, AAAA, MX, CNAME</text>
  <text x="1082.623042" y="532.32572" text-anchor="middle" font-size="14.973928" fill="var(--text-muted)" font-family="Arial, sans-serif">BIND, PowerDNS</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Client -->
  <rect x="20" y="240" width="220" height="230" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="12" filter="url(#shadow)"/>
  <rect x="20" y="240" width="220" height="50" fill="url(#grad-accent)" rx="12"/>
  <rect x="20" y="280" width="220" height="10" fill="url(#grad-accent)"/>
  <text x="130" y="272" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" font-family="sans-serif">Client</text>
  <text x="130" y="335" text-anchor="middle" font-size="15" fill="#333333" font-family="sans-serif">Browser/app</text>
  <text x="130" y="363" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">www.example.com</text>
  <text x="130" y="420" text-anchor="middle" font-size="13" fill="#555555" font-family="sans-serif">getaddrinfo()</text>

  <line x1="240" y1="355" x2="318" y2="355" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>

  <!-- Resolver -->
  <rect x="320" y="240" width="220" height="230" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="12" filter="url(#shadow)"/>
  <rect x="320" y="240" width="220" height="50" fill="url(#grad-accent)" rx="12"/>
  <rect x="320" y="280" width="220" height="10" fill="url(#grad-accent)"/>
  <text x="430" y="272" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" font-family="sans-serif">Resolver</text>
  <text x="430" y="335" text-anchor="middle" font-size="15" fill="#333333" font-family="sans-serif">ISP or local</text>
  <text x="430" y="363" text-anchor="middle" font-size="15" fill="#333333" font-family="sans-serif">Cache results</text>
  <text x="430" y="405" text-anchor="middle" font-size="13" fill="#555555" font-family="sans-serif">Recursive query</text>
  <text x="430" y="430" text-anchor="middle" font-size="13" fill="#555555" font-family="sans-serif">8.8.8.8</text>

  <line x1="540" y1="355" x2="618" y2="355" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>

  <!-- Root DNS -->
  <rect x="620" y="240" width="220" height="230" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="12" filter="url(#shadow)"/>
  <rect x="620" y="240" width="220" height="50" fill="url(#grad-accent)" rx="12"/>
  <rect x="620" y="280" width="220" height="10" fill="url(#grad-accent)"/>
  <text x="730" y="272" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" font-family="sans-serif">Root DNS</text>
  <text x="730" y="335" text-anchor="middle" font-size="15" fill="#333333" font-family="sans-serif">13 root servers</text>
  <text x="730" y="363" text-anchor="middle" font-size="15" fill="#333333" font-family="sans-serif">Refers to TLD</text>
  <text x="730" y="405" text-anchor="middle" font-size="13" fill="#555555" font-family="sans-serif">Anycast</text>

  <!-- TLD DNS (upward) -->
  <rect x="620" y="40" width="220" height="160" fill="url(#grad-surface)" stroke="#64b5f6" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="730" y="130" text-anchor="middle" font-size="18" font-weight="bold" fill="#1565c0" font-family="sans-serif">TLD DNS</text>
  <text x="730" y="160" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">.com, .org, .net</text>
  <line x1="730" y1="240" x2="730" y2="200" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="840" y1="355" x2="918" y2="355" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>

  <!-- Authoritative -->
  <rect x="920" y="240" width="320" height="230" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="12" filter="url(#shadow)"/>
  <rect x="920" y="240" width="320" height="50" fill="url(#grad-accent)" rx="12"/>
  <rect x="920" y="280" width="320" height="10" fill="url(#grad-accent)"/>
  <text x="1080" y="272" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" font-family="sans-serif">Authoritative</text>
  <text x="1080" y="335" text-anchor="middle" font-size="15" fill="#333333" font-family="sans-serif">Zone data owner</text>
  <text x="1080" y="363" text-anchor="middle" font-size="15" fill="#333333" font-family="sans-serif">A, AAAA, MX, CNAME</text>
  <text x="1080" y="405" text-anchor="middle" font-size="13" fill="#555555" font-family="sans-serif">BIND, PowerDNS</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="309.767403" width="216.393462" height="310.232597" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="7.952588"/>
  <rect x="40" y="309.767403" width="216.393462" height="67.441767" fill="url(#grad-primary)" rx="7.952588" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="363.721051" width="216.393462" height="13.488454" fill="url(#grad-primary)" rx="7.952588" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="148.196731" y="352.930255" text-anchor="middle" font-size="20.73306" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Client</text>
  <text x="148.196731" y="437.907045" text-anchor="middle" font-size="17.277527" fill="var(--text)" font-family="Arial, sans-serif">Browser/app</text>
  <text x="148.196731" y="475.674582" text-anchor="middle" font-size="16.125595" fill="var(--text-muted)" font-family="Arial, sans-serif">www.example.com</text>
  <text x="148.196731" y="552.558233" text-anchor="middle" font-size="14.973928" fill="var(--text-muted)" font-family="Arial, sans-serif">getaddrinfo()</text>
  <line x1="256.393462" y1="464.883953" x2="333.11478" y2="464.883953" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="335.081888" y="309.767403" width="216.393462" height="310.232597" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="7.952588"/>
  <rect x="335.081888" y="309.767403" width="216.393462" height="67.441767" fill="url(#grad-primary)" rx="7.952588" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="335.081888" y="363.721051" width="216.393462" height="13.488454" fill="url(#grad-primary)" rx="7.952588" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="443.278724" y="352.930255" text-anchor="middle" font-size="20.73306" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Resolver</text>
  <text x="443.278724" y="437.907045" text-anchor="middle" font-size="17.277527" fill="var(--text)" font-family="Arial, sans-serif">ISP or local</text>
  <text x="443.278724" y="475.674582" text-anchor="middle" font-size="17.277527" fill="var(--text)" font-family="Arial, sans-serif">Cache results</text>
  <text x="443.278724" y="532.32572" text-anchor="middle" font-size="14.973928" fill="var(--text-muted)" font-family="Arial, sans-serif">Recursive query</text>
  <text x="443.278724" y="566.046686" text-anchor="middle" font-size="14.973928" fill="var(--text-muted)" font-family="Arial, sans-serif">8.8.8.8</text>
  <line x1="551.475455" y1="464.883953" x2="628.196773" y2="464.883953" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="630.163986" y="309.767403" width="216.393462" height="310.232597" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="7.952588"/>
  <rect x="630.163986" y="309.767403" width="216.393462" height="67.441767" fill="url(#grad-primary)" rx="7.952588" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="630.163986" y="363.721051" width="216.393462" height="13.488454" fill="url(#grad-primary)" rx="7.952588" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="738.360717" y="352.930255" text-anchor="middle" font-size="20.73306" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Root DNS</text>
  <text x="738.360717" y="437.907045" text-anchor="middle" font-size="17.277527" fill="var(--text)" font-family="Arial, sans-serif">13 root servers</text>
  <text x="738.360717" y="475.674582" text-anchor="middle" font-size="17.277527" fill="var(--text)" font-family="Arial, sans-serif">Refers to TLD</text>
  <text x="738.360717" y="532.32572" text-anchor="middle" font-size="14.973928" fill="var(--text-muted)" font-family="Arial, sans-serif">Anycast</text>
  <rect x="630.163986" y="40" width="216.393462" height="215.814089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="7.952588"/>
  <text x="738.360717" y="161.395416" text-anchor="middle" font-size="20.73306" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">TLD DNS</text>
  <text x="738.360717" y="201.860442" text-anchor="middle" font-size="16.125595" fill="var(--text-muted)" font-family="Arial, sans-serif">.com, .org, .net</text>
  <line x1="738.360717" y1="309.767403" x2="738.360717" y2="255.813922" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>

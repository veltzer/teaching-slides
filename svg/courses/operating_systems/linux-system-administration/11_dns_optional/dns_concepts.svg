<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="309.767403" width="216.393462" height="310.232597" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="7.952588" />
  <rect x="40" y="309.767403" width="216.393462" height="67.441767" fill="var(--primary-fill)" rx="7.952588" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="363.721051" width="216.393462" height="13.488454" fill="var(--primary-fill)" rx="7.952588" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="148.196731" y="352.930255" text-anchor="middle" font-size="20.73306" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Client</text>
  <text x="148.196731" y="437.907045" text-anchor="middle" font-size="17.277527" fill="var(--text)" font-family="sans-serif">Browser/app</text>
  <text x="148.196731" y="475.674582" text-anchor="middle" font-size="16.125595" fill="var(--text-muted)" font-family="sans-serif">www.example.com</text>
  <text x="148.196731" y="552.558233" text-anchor="middle" font-size="14.973928" fill="var(--text-muted)" font-family="sans-serif">getaddrinfo()</text>
  <line x1="256.393462" y1="464.883953" x2="333.11478" y2="464.883953" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="335.081888" y="309.767403" width="216.393462" height="310.232597" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="7.952588" />
  <rect x="335.081888" y="309.767403" width="216.393462" height="67.441767" fill="var(--primary-fill)" rx="7.952588" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="335.081888" y="363.721051" width="216.393462" height="13.488454" fill="var(--primary-fill)" rx="7.952588" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="443.278724" y="352.930255" text-anchor="middle" font-size="20.73306" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Resolver</text>
  <text x="443.278724" y="437.907045" text-anchor="middle" font-size="17.277527" fill="var(--text)" font-family="sans-serif">ISP or local</text>
  <text x="443.278724" y="475.674582" text-anchor="middle" font-size="17.277527" fill="var(--text)" font-family="sans-serif">Cache results</text>
  <text x="443.278724" y="532.32572" text-anchor="middle" font-size="14.973928" fill="var(--text-muted)" font-family="sans-serif">Recursive query</text>
  <text x="443.278724" y="566.046686" text-anchor="middle" font-size="14.973928" fill="var(--text-muted)" font-family="sans-serif">8.8.8.8</text>
  <line x1="551.475455" y1="464.883953" x2="628.196773" y2="464.883953" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="630.163986" y="309.767403" width="216.393462" height="310.232597" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="7.952588" />
  <rect x="630.163986" y="309.767403" width="216.393462" height="67.441767" fill="var(--primary-fill)" rx="7.952588" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="630.163986" y="363.721051" width="216.393462" height="13.488454" fill="var(--primary-fill)" rx="7.952588" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="738.360717" y="352.930255" text-anchor="middle" font-size="20.73306" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Root DNS</text>
  <text x="738.360717" y="437.907045" text-anchor="middle" font-size="17.277527" fill="var(--text)" font-family="sans-serif">13 root servers</text>
  <text x="738.360717" y="475.674582" text-anchor="middle" font-size="17.277527" fill="var(--text)" font-family="sans-serif">Refers to TLD</text>
  <text x="738.360717" y="532.32572" text-anchor="middle" font-size="14.973928" fill="var(--text-muted)" font-family="sans-serif">Anycast</text>
  <rect x="630.163986" y="40" width="216.393462" height="215.814089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="7.952588" />
  <text x="738.360717" y="161.395416" text-anchor="middle" font-size="20.73306" font-weight="bold" fill="var(--primary-accent)" font-family="sans-serif">TLD DNS</text>
  <text x="738.360717" y="201.860442" text-anchor="middle" font-size="16.125595" fill="var(--text-muted)" font-family="sans-serif">.com, .org, .net</text>
  <line x1="738.360717" y1="309.767403" x2="738.360717" y2="255.813922" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="846.557448" y1="464.883953" x2="923.278766" y2="464.883953" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="925.245979" y="309.767403" width="314.754021" height="310.232597" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="7.952588" />
  <rect x="925.245979" y="309.767403" width="314.754021" height="67.441767" fill="var(--primary-fill)" rx="7.952588" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="925.245979" y="363.721051" width="314.754021" height="13.488454" fill="var(--primary-fill)" rx="7.952588" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1082.623042" y="352.930255" text-anchor="middle" font-size="20.73306" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Authoritative</text>
  <text x="1082.623042" y="437.907045" text-anchor="middle" font-size="17.277527" fill="var(--text)" font-family="sans-serif">Zone data owner</text>
  <text x="1082.623042" y="475.674582" text-anchor="middle" font-size="17.277527" fill="var(--text)" font-family="sans-serif">A, AAAA, MX, CNAME</text>
  <text x="1082.623042" y="532.32572" text-anchor="middle" font-size="14.973928" fill="var(--text-muted)" font-family="sans-serif">BIND, PowerDNS</text>
</svg>
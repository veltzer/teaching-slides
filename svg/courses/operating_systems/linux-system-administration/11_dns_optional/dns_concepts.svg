<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="17.7778" y="213.3333" width="195.5556" height="204.4444" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="17.7778" y="213.3333" width="195.5556" height="44.4444" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="17.7778" y="248.8889" width="195.5556" height="8.8889" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="115.5556" y="241.7778" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Client</text>
  <text x="115.5556" y="297.7778" text-anchor="middle" font-size="13.3333" fill="var(--text)" font-family="sans-serif">Browser/app</text>
  <text x="115.5556" y="322.6667" text-anchor="middle" font-size="12.4444" fill="var(--text-muted)" font-family="sans-serif">www.example.com</text>
  <text x="115.5556" y="373.3333" text-anchor="middle" font-size="11.5556" fill="var(--text-muted)" font-family="sans-serif">getaddrinfo()</text>
  <line x1="213.3333" y1="315.5556" x2="282.6667" y2="315.5556" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="284.4444" y="213.3333" width="195.5556" height="204.4444" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="284.4444" y="213.3333" width="195.5556" height="44.4444" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="284.4444" y="248.8889" width="195.5556" height="8.8889" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="382.2222" y="241.7778" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Resolver</text>
  <text x="382.2222" y="297.7778" text-anchor="middle" font-size="13.3333" fill="var(--text)" font-family="sans-serif">ISP or local</text>
  <text x="382.2222" y="322.6667" text-anchor="middle" font-size="13.3333" fill="var(--text)" font-family="sans-serif">Cache results</text>
  <text x="382.2222" y="360" text-anchor="middle" font-size="11.5556" fill="var(--text-muted)" font-family="sans-serif">Recursive query</text>
  <text x="382.2222" y="382.2222" text-anchor="middle" font-size="11.5556" fill="var(--text-muted)" font-family="sans-serif">8.8.8.8</text>
  <line x1="480" y1="315.5556" x2="549.3333" y2="315.5556" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="551.1111" y="213.3333" width="195.5556" height="204.4444" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="551.1111" y="213.3333" width="195.5556" height="44.4444" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="551.1111" y="248.8889" width="195.5556" height="8.8889" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="648.8889" y="241.7778" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Root DNS</text>
  <text x="648.8889" y="297.7778" text-anchor="middle" font-size="13.3333" fill="var(--text)" font-family="sans-serif">13 root servers</text>
  <text x="648.8889" y="322.6667" text-anchor="middle" font-size="13.3333" fill="var(--text)" font-family="sans-serif">Refers to TLD</text>
  <text x="648.8889" y="360" text-anchor="middle" font-size="11.5556" fill="var(--text-muted)" font-family="sans-serif">Anycast</text>
  <rect x="551.1111" y="35.5556" width="195.5556" height="142.2222" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <text x="648.8889" y="115.5556" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--primary-accent)" font-family="sans-serif">TLD DNS</text>
  <text x="648.8889" y="142.2222" text-anchor="middle" font-size="12.4444" fill="var(--text-muted)" font-family="sans-serif">.com, .org, .net</text>
  <line x1="648.8889" y1="213.3333" x2="648.8889" y2="177.7778" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="746.6667" y1="315.5556" x2="816" y2="315.5556" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="817.7778" y="213.3333" width="284.4444" height="204.4444" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="817.7778" y="213.3333" width="284.4444" height="44.4444" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="817.7778" y="248.8889" width="284.4444" height="8.8889" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="960" y="241.7778" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Authoritative</text>
  <text x="960" y="297.7778" text-anchor="middle" font-size="13.3333" fill="var(--text)" font-family="sans-serif">Zone data owner</text>
  <text x="960" y="322.6667" text-anchor="middle" font-size="13.3333" fill="var(--text)" font-family="sans-serif">A, AAAA, MX, CNAME</text>
  <text x="960" y="360" text-anchor="middle" font-size="11.5556" fill="var(--text-muted)" font-family="sans-serif">BIND, PowerDNS</text>
</svg>
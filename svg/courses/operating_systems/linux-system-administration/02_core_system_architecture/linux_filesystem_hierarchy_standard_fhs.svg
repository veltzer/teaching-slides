<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="490" y="56.1111" width="299.9999" height="72.5" fill="var(--primary-fill)" rx="6" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="98" text-anchor="middle" font-size="31.285" font-weight="bold" fill="var(--bg)" font-family="monospace">/</text>
  <rect x="68.125" y="193.0556" width="159.375" height="60.4167" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <text x="147.8125" y="230.1111" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--primary-accent)" font-family="monospace">/bin</text>
  <rect x="246.25" y="193.0556" width="159.375" height="60.4167" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <text x="325.9375" y="230.1111" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--primary-accent)" font-family="monospace">/etc</text>
  <rect x="424.3749" y="193.0556" width="159.375" height="60.4167" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <text x="504.0625" y="230.1111" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--primary-accent)" font-family="monospace">/home</text>
  <rect x="602.5" y="193.0556" width="159.375" height="60.4167" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <text x="682.1875" y="230.1111" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--primary-accent)" font-family="monospace">/var</text>
  <rect x="780.625" y="193.0556" width="159.375" height="60.4167" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <text x="860.3125" y="230.1111" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--primary-accent)" font-family="monospace">/usr</text>
  <rect x="958.75" y="193.0556" width="159.375" height="60.4167" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <text x="1038.4375" y="230.1111" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--primary-accent)" font-family="monospace">/tmp</text>
  <text x="147.8125" y="277.6389" text-anchor="middle" font-size="11.2974" fill="var(--text-muted)" font-family="sans-serif">Essential binaries</text>
  <text x="325.9375" y="277.6389" text-anchor="middle" font-size="11.2974" fill="var(--text-muted)" font-family="sans-serif">Config files</text>
  <text x="504.0625" y="277.6389" text-anchor="middle" font-size="11.2974" fill="var(--text-muted)" font-family="sans-serif">User home dirs</text>
  <text x="682.1875" y="277.6389" text-anchor="middle" font-size="11.2974" fill="var(--text-muted)" font-family="sans-serif">Variable data</text>
  <text x="860.3125" y="277.6389" text-anchor="middle" font-size="11.2974" fill="var(--text-muted)" font-family="sans-serif">User programs</text>
  <text x="1038.4375" y="277.6389" text-anchor="middle" font-size="11.2974" fill="var(--text-muted)" font-family="sans-serif">Temporary files</text>
  <line x1="640" y1="128.6111" x2="147.8125" y2="193.0556" stroke="var(--text-muted)" stroke-width="1.3333" />
  <line x1="640" y1="128.6111" x2="325.9375" y2="193.0556" stroke="var(--text-muted)" stroke-width="1.3333" />
  <line x1="640" y1="128.6111" x2="504.0625" y2="193.0556" stroke="var(--text-muted)" stroke-width="1.3333" />
  <line x1="640" y1="128.6111" x2="682.1875" y2="193.0556" stroke="var(--text-muted)" stroke-width="1.3333" />
  <line x1="640" y1="128.6111" x2="860.3125" y2="193.0556" stroke="var(--text-muted)" stroke-width="1.3333" />
  <line x1="640" y1="128.6111" x2="1038.4375" y2="193.0556" stroke="var(--text-muted)" stroke-width="1.3333" />
  <rect x="68.125" y="346.1111" width="159.375" height="56.3889" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="147.8125" y="379.9444" text-anchor="middle" font-size="13.9044" font-weight="bold" fill="var(--primary-accent)" font-family="monospace">/proc</text>
  <text x="147.8125" y="394.4444" text-anchor="middle" font-size="10.4284" fill="var(--text-muted)" font-family="sans-serif">Kernel info</text>
  <rect x="246.25" y="346.1111" width="159.375" height="56.3889" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="325.9375" y="379.9444" text-anchor="middle" font-size="13.9044" font-weight="bold" fill="var(--primary-accent)" font-family="monospace">/sys</text>
  <text x="325.9375" y="394.4444" text-anchor="middle" font-size="10.4284" fill="var(--text-muted)" font-family="sans-serif">Devices</text>
  <rect x="424.3749" y="346.1111" width="159.375" height="56.3889" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="504.0625" y="379.9444" text-anchor="middle" font-size="13.9044" font-weight="bold" fill="var(--primary-accent)" font-family="monospace">/dev</text>
  <text x="504.0625" y="394.4444" text-anchor="middle" font-size="10.4284" fill="var(--text-muted)" font-family="sans-serif">Device files</text>
  <rect x="602.5" y="346.1111" width="159.375" height="56.3889" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="682.1875" y="379.9444" text-anchor="middle" font-size="13.9044" font-weight="bold" fill="var(--primary-accent)" font-family="monospace">/boot</text>
  <text x="682.1875" y="394.4444" text-anchor="middle" font-size="10.4284" fill="var(--text-muted)" font-family="sans-serif">Boot files</text>
  <rect x="780.625" y="346.1111" width="159.375" height="56.3889" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="860.3125" y="379.9444" text-anchor="middle" font-size="13.9044" font-weight="bold" fill="var(--primary-accent)" font-family="monospace">/lib</text>
  <text x="860.3125" y="394.4444" text-anchor="middle" font-size="10.4284" fill="var(--text-muted)" font-family="sans-serif">Libraries</text>
  <rect x="958.75" y="346.1111" width="159.375" height="56.3889" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="1038.4375" y="379.9444" text-anchor="middle" font-size="13.9044" font-weight="bold" fill="var(--primary-accent)" font-family="monospace">/opt</text>
  <text x="1038.4375" y="394.4444" text-anchor="middle" font-size="10.4284" fill="var(--text-muted)" font-family="sans-serif">Optional pkgs</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Top layer: DM consumers -->
  <rect x="60" y="40" width="210" height="140" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="165" y="118" text-anchor="middle" font-size="20" font-weight="bold" fill="#1565c0" font-family="sans-serif">LVM</text>

  <rect x="335" y="40" width="210" height="140" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="440" y="118" text-anchor="middle" font-size="20" font-weight="bold" fill="#1565c0" font-family="sans-serif">LUKS</text>

  <rect x="610" y="40" width="210" height="140" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="715" y="118" text-anchor="middle" font-size="20" font-weight="bold" fill="#1565c0" font-family="sans-serif">Multipath</text>

  <rect x="885" y="40" width="210" height="140" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="990" y="118" text-anchor="middle" font-size="20" font-weight="bold" fill="#1565c0" font-family="sans-serif">dm-cache</text>

  <!-- Middle: Device Mapper kernel -->
  <rect x="200" y="290" width="740" height="130" fill="url(#grad-accent)" rx="12" filter="url(#shadow)"/>
  <text x="570" y="365" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff" font-family="sans-serif">Device Mapper (kernel)</text>

  <!-- Bottom: Physical block devices -->
  <rect x="200" y="510" width="740" height="110" fill="url(#grad-surface)" stroke="#555555" stroke-width="2" rx="12" filter="url(#shadow)"/>
  <text x="570" y="573" text-anchor="middle" font-size="20" font-weight="bold" fill="#333333" font-family="sans-serif">Physical Block Devices</text>
  <text x="570" y="600" text-anchor="middle" font-size="15" fill="#555555" font-family="sans-serif">/dev/sda, /dev/sdb, ...</text>

  <!-- Lines from top to device mapper -->
  <line x1="165" y1="180" x2="350" y2="290" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="180" x2="470" y2="290" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="715" y1="180" x2="660" y2="290" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="990" y1="180" x2="800" y2="290" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Line from device mapper to physical -->
  <line x1="570" y1="420" x2="570" y2="510" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

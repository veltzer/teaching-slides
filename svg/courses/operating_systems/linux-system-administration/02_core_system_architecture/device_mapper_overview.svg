<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="243.478261" height="139.99994" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="7.434271" />
  <text x="161.73913" y="117.999979" text-anchor="middle" font-size="21.535347" font-weight="bold" fill="var(--primary-accent)" font-family="sans-serif">LVM</text>
  <rect x="358.84058" y="40" width="243.478261" height="139.99994" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="7.434271" />
  <text x="480.57971" y="117.999979" text-anchor="middle" font-size="21.535347" font-weight="bold" fill="var(--primary-accent)" font-family="sans-serif">LUKS</text>
  <rect x="677.681159" y="40" width="243.478261" height="139.99994" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="7.434271" />
  <text x="799.42029" y="117.999979" text-anchor="middle" font-size="21.535347" font-weight="bold" fill="var(--primary-accent)" font-family="sans-serif">Multipath</text>
  <rect x="996.521739" y="40" width="243.478261" height="139.99994" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="7.434271" />
  <text x="1118.26087" y="117.999979" text-anchor="middle" font-size="21.535347" font-weight="bold" fill="var(--primary-accent)" font-family="sans-serif">dm-cache</text>
  <rect x="202.318841" y="289.999955" width="857.971014" height="130.000131" fill="var(--primary-fill)" rx="7.434271" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="631.304348" y="364.999892" text-anchor="middle" font-size="23.688808" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Device Mapper (kernel)</text>
  <rect x="202.318841" y="509.999985" width="857.971014" height="110.000015" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="7.434271" />
  <text x="631.304348" y="573.000001" text-anchor="middle" font-size="21.535347" font-weight="bold" fill="var(--text)" font-family="sans-serif">Physical Block Devices</text>
  <text x="631.304348" y="600.000009" text-anchor="middle" font-size="16.151449" fill="var(--text-muted)" font-family="sans-serif">/dev/sda, /dev/sdb, ...</text>
  <line x1="161.73913" y1="179.99994" x2="376.231884" y2="289.999955" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="480.57971" y1="179.99994" x2="515.362319" y2="289.999955" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="799.42029" y1="179.99994" x2="735.652174" y2="289.999955" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="1118.26087" y1="179.99994" x2="897.971014" y2="289.999955" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="631.304348" y1="419.999961" x2="631.304348" y2="509.999985" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
</svg>
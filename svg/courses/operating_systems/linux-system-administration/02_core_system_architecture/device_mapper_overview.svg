<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="243.478261" height="139.99994" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="7.434271"/>
  <text x="161.73913" y="117.999979" text-anchor="middle" font-size="21.535347" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">LVM</text>
  <rect x="358.84058" y="40" width="243.478261" height="139.99994" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="7.434271"/>
  <text x="480.57971" y="117.999979" text-anchor="middle" font-size="21.535347" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">LUKS</text>
  <rect x="677.681159" y="40" width="243.478261" height="139.99994" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="7.434271"/>
  <text x="799.42029" y="117.999979" text-anchor="middle" font-size="21.535347" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Multipath</text>
  <rect x="996.521739" y="40" width="243.478261" height="139.99994" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="7.434271"/>
  <text x="1118.26087" y="117.999979" text-anchor="middle" font-size="21.535347" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">dm-cache</text>
  <rect x="202.318841" y="289.999955" width="857.971014" height="130.000131" fill="url(#grad-primary)" rx="7.434271" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="631.304348" y="364.999892" text-anchor="middle" font-size="23.688808" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Device Mapper (kernel)</text>
  <rect x="202.318841" y="509.999985" width="857.971014" height="110.000015" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="7.434271"/>
  <text x="631.304348" y="573.000001" text-anchor="middle" font-size="21.535347" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Physical Block Devices</text>
  <text x="631.304348" y="600.000009" text-anchor="middle" font-size="16.151449" fill="var(--text-muted)" font-family="Arial, sans-serif">/dev/sda, /dev/sdb, ...</text>
  <line x1="161.73913" y1="179.99994" x2="376.231884" y2="289.999955" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <line x1="480.57971" y1="179.99994" x2="515.362319" y2="289.999955" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <line x1="799.42029" y1="179.99994" x2="735.652174" y2="289.999955" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <line x1="1118.26087" y1="179.99994" x2="897.971014" y2="289.999955" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <line x1="631.304348" y1="419.999961" x2="631.304348" y2="509.999985" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
</svg>

  <text x="841.619502" y="339.666596" text-anchor="middle" font-size="19.188263" fill="var(--text)" font-family="Arial, sans-serif">Mount real root</text>
  <line x1="943.643699" y1="329.999878" x2="970.850179" y2="329.999878" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="972.793603" y="40" width="267.206397" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.46299"/>
  <rect x="972.793603" y="40" width="267.206397" height="96.666466" fill="url(#grad-primary)" rx="9.46299" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="972.793603" y="117.333028" width="267.206397" height="19.333438" fill="url(#grad-primary)" rx="9.46299" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1105.911023" y="101.86647" text-anchor="middle" font-size="21.929532" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">systemd</text>
  <text x="1105.911023" y="242.999892" text-anchor="middle" font-size="19.188263" fill="var(--text)" font-family="Arial, sans-serif">PID 1</text>
  <text x="1105.911023" y="291.333004" text-anchor="middle" font-size="19.188263" fill="var(--text)" font-family="Arial, sans-serif">Start services</text>
  <text x="1105.911023" y="339.666596" text-anchor="middle" font-size="19.188263" fill="var(--text)" font-family="Arial, sans-serif">Reach target</text>
  <text x="1105.911023" y="387.99995" text-anchor="middle" font-size="19.188263" fill="var(--text)" font-family="Arial, sans-serif">Login prompt</text>
</svg>

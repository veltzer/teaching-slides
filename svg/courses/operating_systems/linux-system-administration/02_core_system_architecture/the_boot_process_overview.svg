<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="17.7778" y="168.8889" width="186.6667" height="266.6667" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="17.7778" y="168.8889" width="186.6667" height="44.4444" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="17.7778" y="204.4444" width="186.6667" height="8.8889" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="111.1111" y="197.3333" text-anchor="middle" font-size="14.2222" font-weight="bold" fill="var(--bg)" font-family="sans-serif">BIOS/UEFI</text>
  <text x="111.1111" y="262.2222" text-anchor="middle" font-size="12.4444" fill="var(--text)" font-family="sans-serif">Power-On</text>
  <text x="111.1111" y="284.4444" text-anchor="middle" font-size="12.4444" fill="var(--text)" font-family="sans-serif">Self-Test</text>
  <text x="111.1111" y="306.6667" text-anchor="middle" font-size="12.4444" fill="var(--text)" font-family="sans-serif">Find bootable</text>
  <text x="111.1111" y="328.8889" text-anchor="middle" font-size="12.4444" fill="var(--text)" font-family="sans-serif">device</text>
  <line x1="204.4444" y1="302.2222" x2="229.3333" y2="302.2222" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="231.1111" y="168.8889" width="186.6667" height="266.6667" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="231.1111" y="168.8889" width="186.6667" height="44.4444" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="231.1111" y="204.4444" width="186.6667" height="8.8889" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="324.4444" y="197.3333" text-anchor="middle" font-size="14.2222" font-weight="bold" fill="var(--bg)" font-family="sans-serif">GRUB</text>
  <text x="324.4444" y="262.2222" text-anchor="middle" font-size="12.4444" fill="var(--text)" font-family="sans-serif">Boot menu</text>
  <text x="324.4444" y="284.4444" text-anchor="middle" font-size="12.4444" fill="var(--text)" font-family="sans-serif">Load kernel</text>
  <text x="324.4444" y="306.6667" text-anchor="middle" font-size="12.4444" fill="var(--text)" font-family="sans-serif">Pass params</text>
  <line x1="417.7778" y1="302.2222" x2="442.6667" y2="302.2222" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="444.4444" y="168.8889" width="186.6667" height="266.6667" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="444.4444" y="168.8889" width="186.6667" height="44.4444" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="444.4444" y="204.4444" width="186.6667" height="8.8889" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="537.7778" y="197.3333" text-anchor="middle" font-size="14.2222" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Kernel</text>
  <text x="537.7778" y="262.2222" text-anchor="middle" font-size="12.4444" fill="var(--text)" font-family="sans-serif">vmlinuz</text>
  <text x="537.7778" y="284.4444" text-anchor="middle" font-size="12.4444" fill="var(--text)" font-family="sans-serif">Hardware init</text>
  <text x="537.7778" y="306.6667" text-anchor="middle" font-size="12.4444" fill="var(--text)" font-family="sans-serif">Mount rootfs</text>
  <line x1="631.1111" y1="302.2222" x2="656" y2="302.2222" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="657.7778" y="168.8889" width="186.6667" height="266.6667" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="657.7778" y="168.8889" width="186.6667" height="44.4444" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="657.7778" y="204.4444" width="186.6667" height="8.8889" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="751.1111" y="197.3333" text-anchor="middle" font-size="14.2222" font-weight="bold" fill="var(--bg)" font-family="sans-serif">initramfs</text>
  <text x="751.1111" y="262.2222" text-anchor="middle" font-size="12.4444" fill="var(--text)" font-family="sans-serif">Temp rootfs</text>
  <text x="751.1111" y="284.4444" text-anchor="middle" font-size="12.4444" fill="var(--text)" font-family="sans-serif">Load drivers</text>
  <text x="751.1111" y="306.6667" text-anchor="middle" font-size="12.4444" fill="var(--text)" font-family="sans-serif">Mount real root</text>
  <line x1="844.4444" y1="302.2222" x2="869.3333" y2="302.2222" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="871.1111" y="168.8889" width="244.4444" height="266.6667" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="871.1111" y="168.8889" width="244.4444" height="44.4444" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="871.1111" y="204.4444" width="244.4444" height="8.8889" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="992.8889" y="197.3333" text-anchor="middle" font-size="14.2222" font-weight="bold" fill="var(--bg)" font-family="sans-serif">systemd</text>
  <text x="992.8889" y="262.2222" text-anchor="middle" font-size="12.4444" fill="var(--text)" font-family="sans-serif">PID 1</text>
  <text x="992.8889" y="284.4444" text-anchor="middle" font-size="12.4444" fill="var(--text)" font-family="sans-serif">Start services</text>
  <text x="992.8889" y="306.6667" text-anchor="middle" font-size="12.4444" fill="var(--text)" font-family="sans-serif">Reach target</text>
  <text x="992.8889" y="328.8889" text-anchor="middle" font-size="12.4444" fill="var(--text)" font-family="sans-serif">Login prompt</text>
</svg>
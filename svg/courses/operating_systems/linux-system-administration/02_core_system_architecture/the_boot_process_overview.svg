<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="204.048601" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.46299" />
  <rect x="40" y="40" width="204.048601" height="96.666466" fill="var(--primary-fill)" rx="9.46299" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="117.333028" width="204.048601" height="19.333438" fill="var(--primary-fill)" rx="9.46299" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="142.0243" y="101.86647" text-anchor="middle" font-size="21.929532" font-weight="bold" fill="var(--bg)" font-family="sans-serif">BIOS/UEFI</text>
  <text x="142.0243" y="242.999892" text-anchor="middle" font-size="19.188263" fill="var(--text)" font-family="sans-serif">Power-On</text>
  <text x="142.0243" y="291.333004" text-anchor="middle" font-size="19.188263" fill="var(--text)" font-family="sans-serif">Self-Test</text>
  <text x="142.0243" y="339.666596" text-anchor="middle" font-size="19.188263" fill="var(--text)" font-family="sans-serif">Find bootable</text>
  <text x="142.0243" y="387.99995" text-anchor="middle" font-size="19.188263" fill="var(--text)" font-family="sans-serif">device</text>
  <line x1="244.048497" y1="329.999878" x2="271.255081" y2="329.999878" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="273.198401" y="40" width="204.048601" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.46299" />
  <rect x="273.198401" y="40" width="204.048601" height="96.666466" fill="var(--primary-fill)" rx="9.46299" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="273.198401" y="117.333028" width="204.048601" height="19.333438" fill="var(--primary-fill)" rx="9.46299" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="375.222597" y="101.86647" text-anchor="middle" font-size="21.929532" font-weight="bold" fill="var(--bg)" font-family="sans-serif">GRUB</text>
  <text x="375.222597" y="242.999892" text-anchor="middle" font-size="19.188263" fill="var(--text)" font-family="sans-serif">Boot menu</text>
  <text x="375.222597" y="291.333004" text-anchor="middle" font-size="19.188263" fill="var(--text)" font-family="sans-serif">Load kernel</text>
  <text x="375.222597" y="339.666596" text-anchor="middle" font-size="19.188263" fill="var(--text)" font-family="sans-serif">Pass params</text>
  <line x1="477.247001" y1="329.999878" x2="504.453481" y2="329.999878" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="506.396698" y="40" width="204.048601" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.46299" />
  <rect x="506.396698" y="40" width="204.048601" height="96.666466" fill="var(--primary-fill)" rx="9.46299" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="506.396698" y="117.333028" width="204.048601" height="19.333438" fill="var(--primary-fill)" rx="9.46299" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="608.421102" y="101.86647" text-anchor="middle" font-size="21.929532" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Kernel</text>
  <text x="608.421102" y="242.999892" text-anchor="middle" font-size="19.188263" fill="var(--text)" font-family="sans-serif">vmlinuz</text>
  <text x="608.421102" y="291.333004" text-anchor="middle" font-size="19.188263" fill="var(--text)" font-family="sans-serif">Hardware init</text>
  <text x="608.421102" y="339.666596" text-anchor="middle" font-size="19.188263" fill="var(--text)" font-family="sans-serif">Mount rootfs</text>
  <line x1="710.445402" y1="329.999878" x2="737.651882" y2="329.999878" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="739.595202" y="40" width="204.048601" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.46299" />
  <rect x="739.595202" y="40" width="204.048601" height="96.666466" fill="var(--primary-fill)" rx="9.46299" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="739.595202" y="117.333028" width="204.048601" height="19.333438" fill="var(--primary-fill)" rx="9.46299" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="841.619502" y="101.86647" text-anchor="middle" font-size="21.929532" font-weight="bold" fill="var(--bg)" font-family="sans-serif">initramfs</text>
  <text x="841.619502" y="242.999892" text-anchor="middle" font-size="19.188263" fill="var(--text)" font-family="sans-serif">Temp rootfs</text>
  <text x="841.619502" y="291.333004" text-anchor="middle" font-size="19.188263" fill="var(--text)" font-family="sans-serif">Load drivers</text>
  <text x="841.619502" y="339.666596" text-anchor="middle" font-size="19.188263" fill="var(--text)" font-family="sans-serif">Mount real root</text>
  <line x1="943.643699" y1="329.999878" x2="970.850179" y2="329.999878" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="972.793603" y="40" width="267.206397" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.46299" />
  <rect x="972.793603" y="40" width="267.206397" height="96.666466" fill="var(--primary-fill)" rx="9.46299" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="972.793603" y="117.333028" width="267.206397" height="19.333438" fill="var(--primary-fill)" rx="9.46299" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1105.911023" y="101.86647" text-anchor="middle" font-size="21.929532" font-weight="bold" fill="var(--bg)" font-family="sans-serif">systemd</text>
  <text x="1105.911023" y="242.999892" text-anchor="middle" font-size="19.188263" fill="var(--text)" font-family="sans-serif">PID 1</text>
  <text x="1105.911023" y="291.333004" text-anchor="middle" font-size="19.188263" fill="var(--text)" font-family="sans-serif">Start services</text>
  <text x="1105.911023" y="339.666596" text-anchor="middle" font-size="19.188263" fill="var(--text)" font-family="sans-serif">Reach target</text>
  <text x="1105.911023" y="387.99995" text-anchor="middle" font-size="19.188263" fill="var(--text)" font-family="sans-serif">Login prompt</text>
</svg>
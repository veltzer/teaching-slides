<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="204.048601" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.46299"/>
  <rect x="40" y="40" width="204.048601" height="96.666466" fill="url(#grad-primary)" rx="9.46299" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="117.333028" width="204.048601" height="19.333438" fill="url(#grad-primary)" rx="9.46299" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="142.0243" y="101.86647" text-anchor="middle" font-size="21.929532" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">BIOS/UEFI</text>
  <text x="142.0243" y="242.999892" text-anchor="middle" font-size="19.188263" fill="var(--text)" font-family="Arial, sans-serif">Power-On</text>
  <text x="142.0243" y="291.333004" text-anchor="middle" font-size="19.188263" fill="var(--text)" font-family="Arial, sans-serif">Self-Test</text>
  <text x="142.0243" y="339.666596" text-anchor="middle" font-size="19.188263" fill="var(--text)" font-family="Arial, sans-serif">Find bootable</text>
  <text x="142.0243" y="387.99995" text-anchor="middle" font-size="19.188263" fill="var(--text)" font-family="Arial, sans-serif">device</text>
  <line x1="244.048497" y1="329.999878" x2="271.255081" y2="329.999878" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="273.198401" y="40" width="204.048601" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.46299"/>
  <rect x="273.198401" y="40" width="204.048601" height="96.666466" fill="url(#grad-primary)" rx="9.46299" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="273.198401" y="117.333028" width="204.048601" height="19.333438" fill="url(#grad-primary)" rx="9.46299" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="375.222597" y="101.86647" text-anchor="middle" font-size="21.929532" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">GRUB</text>
  <text x="375.222597" y="242.999892" text-anchor="middle" font-size="19.188263" fill="var(--text)" font-family="Arial, sans-serif">Boot menu</text>
  <text x="375.222597" y="291.333004" text-anchor="middle" font-size="19.188263" fill="var(--text)" font-family="Arial, sans-serif">Load kernel</text>
  <text x="375.222597" y="339.666596" text-anchor="middle" font-size="19.188263" fill="var(--text)" font-family="Arial, sans-serif">Pass params</text>
  <line x1="477.247001" y1="329.999878" x2="504.453481" y2="329.999878" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="506.396698" y="40" width="204.048601" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.46299"/>
  <rect x="506.396698" y="40" width="204.048601" height="96.666466" fill="url(#grad-primary)" rx="9.46299" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="506.396698" y="117.333028" width="204.048601" height="19.333438" fill="url(#grad-primary)" rx="9.46299" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="608.421102" y="101.86647" text-anchor="middle" font-size="21.929532" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Kernel</text>
  <text x="608.421102" y="242.999892" text-anchor="middle" font-size="19.188263" fill="var(--text)" font-family="Arial, sans-serif">vmlinuz</text>
  <text x="608.421102" y="291.333004" text-anchor="middle" font-size="19.188263" fill="var(--text)" font-family="Arial, sans-serif">Hardware init</text>
  <text x="608.421102" y="339.666596" text-anchor="middle" font-size="19.188263" fill="var(--text)" font-family="Arial, sans-serif">Mount rootfs</text>
  <line x1="710.445402" y1="329.999878" x2="737.651882" y2="329.999878" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="739.595202" y="40" width="204.048601" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.46299"/>
  <rect x="739.595202" y="40" width="204.048601" height="96.666466" fill="url(#grad-primary)" rx="9.46299" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="739.595202" y="117.333028" width="204.048601" height="19.333438" fill="url(#grad-primary)" rx="9.46299" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="841.619502" y="101.86647" text-anchor="middle" font-size="21.929532" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">initramfs</text>

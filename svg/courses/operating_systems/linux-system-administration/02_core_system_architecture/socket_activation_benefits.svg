      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="17.7778" y="177.7778" width="222.2222" height="213.3333" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.7778" rx="10.6667" filter="url(#shadow)" />
  <ns0:rect x="17.7778" y="177.7778" width="222.2222" height="44.4444" fill="url(#grad-accent)" rx="10.6667" />
  <ns0:rect x="17.7778" y="213.3333" width="222.2222" height="8.8889" fill="url(#grad-accent)" />
  <ns0:text x="128.8889" y="206.2222" text-anchor="middle" font-size="15.1111" font-weight="bold" fill="#ffffff" font-family="sans-serif">Client Request</ns0:text>
  <ns0:text x="128.8889" y="275.5556" text-anchor="middle" font-size="14.2222" fill="#333333" font-family="sans-serif">Connects to</ns0:text>
  <ns0:text x="128.8889" y="297.7778" text-anchor="middle" font-size="14.2222" fill="#333333" font-family="sans-serif">port 8080</ns0:text>
  <ns0:text x="128.8889" y="337.7778" text-anchor="middle" font-size="12.4444" fill="#555555" font-family="sans-serif">Service may not</ns0:text>
  <ns0:text x="128.8889" y="355.5556" text-anchor="middle" font-size="12.4444" fill="#555555" font-family="sans-serif">be running yet</ns0:text>
  <ns0:line x1="240" y1="284.4444" x2="318.2222" y2="284.4444" stroke="#1565c0" stroke-width="2.2222" marker-end="url(#arrow-accent)" />
  <ns0:rect x="320" y="177.7778" width="222.2222" height="213.3333" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.7778" rx="10.6667" filter="url(#shadow)" />
  <ns0:rect x="320" y="177.7778" width="222.2222" height="44.4444" fill="url(#grad-accent)" rx="10.6667" />
  <ns0:rect x="320" y="213.3333" width="222.2222" height="8.8889" fill="url(#grad-accent)" />
  <ns0:text x="431.1111" y="206.2222" text-anchor="middle" font-size="15.1111" font-weight="bold" fill="#ffffff" font-family="sans-serif">systemd</ns0:text>
  <ns0:text x="431.1111" y="275.5556" text-anchor="middle" font-size="14.2222" fill="#333333" font-family="sans-serif">Holds socket</ns0:text>
  <ns0:text x="431.1111" y="297.7778" text-anchor="middle" font-size="14.2222" fill="#333333" font-family="sans-serif">Buffers request</ns0:text>
  <ns0:text x="431.1111" y="337.7778" text-anchor="middle" font-size="12.4444" fill="#555555" font-family="sans-serif">No connection</ns0:text>
  <ns0:text x="431.1111" y="355.5556" text-anchor="middle" font-size="12.4444" fill="#555555" font-family="sans-serif">refused</ns0:text>
  <ns0:line x1="542.2222" y1="284.4444" x2="620.4444" y2="284.4444" stroke="#1565c0" stroke-width="2.2222" marker-end="url(#arrow-accent)" />
  <ns0:rect x="622.2222" y="177.7778" width="222.2222" height="213.3333" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.7778" rx="10.6667" filter="url(#shadow)" />
  <ns0:rect x="622.2222" y="177.7778" width="222.2222" height="44.4444" fill="url(#grad-accent)" rx="10.6667" />
  <ns0:rect x="622.2222" y="213.3333" width="222.2222" height="8.8889" fill="url(#grad-accent)" />
  <ns0:text x="733.3333" y="206.2222" text-anchor="middle" font-size="15.1111" font-weight="bold" fill="#ffffff" font-family="sans-serif">Starts Service</ns0:text>
  <ns0:text x="733.3333" y="275.5556" text-anchor="middle" font-size="14.2222" fill="#333333" font-family="sans-serif">On demand</ns0:text>
  <ns0:text x="733.3333" y="297.7778" text-anchor="middle" font-size="14.2222" fill="#333333" font-family="sans-serif">Lazy activation</ns0:text>
  <ns0:text x="733.3333" y="337.7778" text-anchor="middle" font-size="12.4444" fill="#555555" font-family="sans-serif">Saves resources</ns0:text>
  <ns0:text x="733.3333" y="355.5556" text-anchor="middle" font-size="12.4444" fill="#555555" font-family="sans-serif">at boot</ns0:text>
  <ns0:line x1="844.4444" y1="284.4444" x2="922.6667" y2="284.4444" stroke="#1565c0" stroke-width="2.2222" marker-end="url(#arrow-accent)" />
  <ns0:rect x="924.4444" y="177.7778" width="191.1111" height="213.3333" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.7778" rx="10.6667" filter="url(#shadow)" />
  <ns0:rect x="924.4444" y="177.7778" width="191.1111" height="44.4444" fill="url(#grad-accent)" rx="10.6667" />
  <ns0:rect x="924.4444" y="213.3333" width="191.1111" height="8.8889" fill="url(#grad-accent)" />
  <ns0:text x="1019.5556" y="206.2222" text-anchor="middle" font-size="15.1111" font-weight="bold" fill="#ffffff" font-family="sans-serif">Service</ns0:text>
  <ns0:text x="1019.5556" y="275.5556" text-anchor="middle" font-size="14.2222" fill="#333333" font-family="sans-serif">Handles request</ns0:text>
  <ns0:text x="1019.5556" y="297.7778" text-anchor="middle" font-size="14.2222" fill="#333333" font-family="sans-serif">Responds to</ns0:text>
  <ns0:text x="1019.5556" y="320" text-anchor="middle" font-size="14.2222" fill="#333333" font-family="sans-serif">client</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="58.75" y="201.1111" width="234.375" height="193.3333" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="58.75" y="201.1111" width="234.375" height="40.2777" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="58.75" y="233.3333" width="234.375" height="8.0556" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="175.9375" y="226.8889" text-anchor="middle" font-size="14.7735" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Client Request</text>
  <text x="175.9375" y="289.7223" text-anchor="middle" font-size="13.9044" fill="var(--text)" font-family="sans-serif">Connects to</text>
  <text x="175.9375" y="309.8611" text-anchor="middle" font-size="13.9044" fill="var(--text)" font-family="sans-serif">port 8080</text>
  <text x="175.9375" y="346.1111" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)" font-family="sans-serif">Service may not</text>
  <text x="175.9375" y="362.2223" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)" font-family="sans-serif">be running yet</text>
  <line x1="293.125" y1="297.7777" x2="375.625" y2="297.7777" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="377.5" y="201.1111" width="234.375" height="193.3333" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="377.5" y="201.1111" width="234.375" height="40.2777" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="377.5" y="233.3333" width="234.375" height="8.0556" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="494.6875" y="226.8889" text-anchor="middle" font-size="14.7735" font-weight="bold" fill="var(--bg)" font-family="sans-serif">systemd</text>
  <text x="494.6875" y="289.7223" text-anchor="middle" font-size="13.9044" fill="var(--text)" font-family="sans-serif">Holds socket</text>
  <text x="494.6875" y="309.8611" text-anchor="middle" font-size="13.9044" fill="var(--text)" font-family="sans-serif">Buffers request</text>
  <text x="494.6875" y="346.1111" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)" font-family="sans-serif">No connection</text>
  <text x="494.6875" y="362.2223" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)" font-family="sans-serif">refused</text>
  <line x1="611.875" y1="297.7777" x2="694.3749" y2="297.7777" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="696.25" y="201.1111" width="234.375" height="193.3333" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="696.25" y="201.1111" width="234.375" height="40.2777" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="696.25" y="233.3333" width="234.375" height="8.0556" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="813.4374" y="226.8889" text-anchor="middle" font-size="14.7735" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Starts Service</text>
  <text x="813.4374" y="289.7223" text-anchor="middle" font-size="13.9044" fill="var(--text)" font-family="sans-serif">On demand</text>
  <text x="813.4374" y="309.8611" text-anchor="middle" font-size="13.9044" fill="var(--text)" font-family="sans-serif">Lazy activation</text>
  <text x="813.4374" y="346.1111" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)" font-family="sans-serif">Saves resources</text>
  <text x="813.4374" y="362.2223" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)" font-family="sans-serif">at boot</text>
  <line x1="930.6249" y1="297.7777" x2="1013.125" y2="297.7777" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="1014.9999" y="201.1111" width="201.5625" height="193.3333" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="1014.9999" y="201.1111" width="201.5625" height="40.2777" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="1014.9999" y="233.3333" width="201.5625" height="8.0556" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1115.3125" y="226.8889" text-anchor="middle" font-size="14.7735" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Service</text>
  <text x="1115.3125" y="289.7223" text-anchor="middle" font-size="13.9044" fill="var(--text)" font-family="sans-serif">Handles request</text>
  <text x="1115.3125" y="309.8611" text-anchor="middle" font-size="13.9044" fill="var(--text)" font-family="sans-serif">Responds to</text>
  <text x="1115.3125" y="330" text-anchor="middle" font-size="13.9044" fill="var(--text)" font-family="sans-serif">client</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="242.915001" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="10.579946"/>
  <rect x="40" y="40" width="242.915001" height="120.83312" fill="url(#grad-primary)" rx="10.579946" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="136.666616" width="242.915001" height="24.166805" fill="url(#grad-primary)" rx="10.579946" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="161.4575" y="117.333412" text-anchor="middle" font-size="26.050471" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Client Request</text>
  <text x="161.4575" y="305.833645" text-anchor="middle" font-size="24.517966" fill="var(--text)" font-family="Arial, sans-serif">Connects to</text>
  <text x="161.4575" y="366.250054" text-anchor="middle" font-size="24.517966" fill="var(--text)" font-family="Arial, sans-serif">port 8080</text>
  <text x="161.4575" y="475.000075" text-anchor="middle" font-size="21.453133" fill="var(--text-muted)" font-family="Arial, sans-serif">Service may not</text>
  <text x="161.4575" y="523.333682" text-anchor="middle" font-size="21.453133" fill="var(--text-muted)" font-family="Arial, sans-serif">be running yet</text>
  <line x1="282.915001" y1="329.999848" x2="368.421081" y2="329.999848" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="370.364401" y="40" width="242.915001" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="10.579946"/>
  <rect x="370.364401" y="40" width="242.915001" height="120.83312" fill="url(#grad-primary)" rx="10.579946" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="370.364401" y="136.666616" width="242.915001" height="24.166805" fill="url(#grad-primary)" rx="10.579946" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="491.821901" y="117.333412" text-anchor="middle" font-size="26.050471" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">systemd</text>
  <text x="491.821901" y="305.833645" text-anchor="middle" font-size="24.517966" fill="var(--text)" font-family="Arial, sans-serif">Holds socket</text>
  <text x="491.821901" y="366.250054" text-anchor="middle" font-size="24.517966" fill="var(--text)" font-family="Arial, sans-serif">Buffers request</text>
  <text x="491.821901" y="475.000075" text-anchor="middle" font-size="21.453133" fill="var(--text-muted)" font-family="Arial, sans-serif">No connection</text>
  <text x="491.821901" y="523.333682" text-anchor="middle" font-size="21.453133" fill="var(--text-muted)" font-family="Arial, sans-serif">refused</text>
  <line x1="613.279402" y1="329.999848" x2="698.785378" y2="329.999848" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="700.728802" y="40" width="242.915001" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="10.579946"/>
  <rect x="700.728802" y="40" width="242.915001" height="120.83312" fill="url(#grad-primary)" rx="10.579946" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="700.728802" y="136.666616" width="242.915001" height="24.166805" fill="url(#grad-primary)" rx="10.579946" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="822.186199" y="117.333412" text-anchor="middle" font-size="26.050471" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Starts Service</text>
  <text x="822.186199" y="305.833645" text-anchor="middle" font-size="24.517966" fill="var(--text)" font-family="Arial, sans-serif">On demand</text>
  <text x="822.186199" y="366.250054" text-anchor="middle" font-size="24.517966" fill="var(--text)" font-family="Arial, sans-serif">Lazy activation</text>
  <text x="822.186199" y="475.000075" text-anchor="middle" font-size="21.453133" fill="var(--text-muted)" font-family="Arial, sans-serif">Saves resources</text>
  <text x="822.186199" y="523.333682" text-anchor="middle" font-size="21.453133" fill="var(--text-muted)" font-family="Arial, sans-serif">at boot</text>
  <line x1="943.643699" y1="329.999848" x2="1029.149883" y2="329.999848" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="1031.093099" y="40" width="208.906901" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="10.579946"/>
  <rect x="1031.093099" y="40" width="208.906901" height="120.83312" fill="url(#grad-primary)" rx="10.579946" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1031.093099" y="136.666616" width="208.906901" height="24.166805" fill="url(#grad-primary)" rx="10.579946" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1135.060823" y="117.333412" text-anchor="middle" font-size="26.050471" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Service</text>
  <text x="1135.060823" y="305.833645" text-anchor="middle" font-size="24.517966" fill="var(--text)" font-family="Arial, sans-serif">Handles request</text>
  <text x="1135.060823" y="366.250054" text-anchor="middle" font-size="24.517966" fill="var(--text)" font-family="Arial, sans-serif">Responds to</text>
  <text x="1135.060823" y="426.666765" text-anchor="middle" font-size="24.517966" fill="var(--text)" font-family="Arial, sans-serif">client</text>
</svg>

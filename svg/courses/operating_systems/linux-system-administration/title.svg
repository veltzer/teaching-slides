  <circle cx="922.7341" cy="380.3687" r="4.2707" fill="var(--warn-fill)" opacity="0.8"/>
  <line x1="811.4127" y1="380.3687" x2="867.0732" y2="380.3687" stroke="var(--warn-border)" stroke-width="0.7429" opacity="0.4"/>
  <rect x="800.2805" y="412.6266" width="144.7177" height="40.3226" rx="6" fill="var(--text)" stroke="var(--primary-border)" stroke-width="0.5572" opacity="0.7"/>
  <circle cx="922.7341" cy="432.2119" r="4.2707" fill="var(--ok-fill)" opacity="0.8"/>

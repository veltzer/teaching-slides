<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect width="890.5709" height="460.8294" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <rect x="783.5823" y="239.8156" width="178.1141" height="299.539" rx="6" fill="var(--text)" stroke="var(--text-muted)" stroke-width="0.7429" />
  <rect x="800.2805" y="257.0967" width="144.7177" height="40.3226" rx="6" fill="var(--text)" stroke="var(--primary-border)" stroke-width="0.5572" opacity="0.7" />
  <circle cx="922.7341" cy="276.682" r="4.2707" fill="var(--ok-fill)" opacity="0.8" />
  <line x1="811.4127" y1="276.682" x2="867.0732" y2="276.682" stroke="var(--primary-border)" stroke-width="0.7429" opacity="0.4" />
  <rect x="800.2805" y="308.94" width="144.7177" height="40.3226" rx="6" fill="var(--text)" stroke="var(--primary-border)" stroke-width="0.5572" opacity="0.7" />
  <circle cx="922.7341" cy="328.5253" r="4.2707" fill="var(--ok-fill)" opacity="0.8" />
  <line x1="811.4127" y1="328.5253" x2="867.0732" y2="328.5253" stroke="var(--primary-border)" stroke-width="0.7429" opacity="0.4" />
  <rect x="800.2805" y="360.7834" width="144.7177" height="40.3226" rx="6" fill="var(--text)" stroke="var(--warn-border)" stroke-width="0.5572" opacity="0.7" />
  <circle cx="922.7341" cy="380.3687" r="4.2707" fill="var(--warn-fill)" opacity="0.8" />
  <line x1="811.4127" y1="380.3687" x2="867.0732" y2="380.3687" stroke="var(--warn-border)" stroke-width="0.7429" opacity="0.4" />
  <rect x="800.2805" y="412.6266" width="144.7177" height="40.3226" rx="6" fill="var(--text)" stroke="var(--primary-border)" stroke-width="0.5572" opacity="0.7" />
  <circle cx="922.7341" cy="432.2119" r="4.2707" fill="var(--ok-fill)" opacity="0.8" />
  <line x1="811.4127" y1="432.2119" x2="867.0732" y2="432.2119" stroke="var(--primary-border)" stroke-width="0.7429" opacity="0.4" />
  <rect x="800.2805" y="464.4699" width="144.7177" height="40.3226" rx="6" fill="var(--text)" stroke="var(--danger-border)" stroke-width="0.5572" opacity="0.7" />
  <circle cx="922.7341" cy="484.0552" r="4.2707" fill="var(--danger-fill)" opacity="0.8" />
  <line x1="811.4127" y1="484.0552" x2="867.0732" y2="484.0552" stroke="var(--danger-border)" stroke-width="0.7429" opacity="0.4" />
  <line x1="961.6966" y1="276.682" x2="1095.2821" y2="276.682" stroke="var(--primary-border)" stroke-width="0.5572" opacity="0.3" />
  <line x1="961.6966" y1="328.5253" x2="1095.2821" y2="328.5253" stroke="var(--primary-border)" stroke-width="0.5572" opacity="0.3" />
  <line x1="961.6966" y1="432.2119" x2="1095.2821" y2="432.2119" stroke="var(--primary-border)" stroke-width="0.5572" opacity="0.3" />
  <rect x="516.4111" y="285.8987" width="200.3784" height="138.2488" rx="6" fill="var(--text)" stroke="var(--text-muted)" stroke-width="0.5572" />
  <rect x="516.4111" y="285.8987" width="200.3784" height="23.0415" rx="6" fill="var(--text-muted)" />
  <rect x="516.4111" y="303.1797" width="200.3784" height="5.7603" fill="var(--text-muted)" rx="6" />
  <text x="533.1093" y="337.7419" font-size="17.3162" fill="var(--ok-accent)" opacity="0.8" font-family="Courier New, monospace">$ systemctl</text>
  <text x="533.1093" y="357.3272" font-size="17.3162" fill="var(--ok-accent)" opacity="0.8" font-family="Courier New, monospace">$ journalctl</text>
  <text x="533.1093" y="376.9123" font-size="17.3162" fill="var(--ok-accent)" opacity="0.8" font-family="Courier New, monospace">$ firewalld</text>
  <text x="533.1093" y="396.4976" font-size="17.3162" fill="var(--ok-accent)" opacity="0.8" font-family="Courier New, monospace">$ mount /dev</text>
  <rect x="1073.018" y="355.0231" width="166.982" height="92.166" rx="6" fill="var(--text)" stroke="var(--text-muted)" stroke-width="0.5572" opacity="0.6" />

  <rect x="567.7777" y="261.2499" width="144.4444" height="43.75" rx="7.1875" fill="var(--text)" stroke="var(--warn-border)" stroke-width="1.3913" opacity="0.7" />
  <circle cx="690" cy="282.5" r="4.4444" fill="var(--warn-fill)" opacity="0.8" />
  <line x1="578.8889" y1="282.5" x2="634.4444" y2="282.5" stroke="var(--warn-border)" stroke-width="1.8551" opacity="0.4" />
  <rect x="567.7777" y="317.5" width="144.4444" height="43.75" rx="7.1875" fill="var(--text)" stroke="var(--primary-border)" stroke-width="1.3913" opacity="0.7" />
  <circle cx="690" cy="338.75" r="4.4444" fill="var(--ok-fill)" opacity="0.8" />
  <line x1="578.8889" y1="338.75" x2="634.4444" y2="338.75" stroke="var(--primary-border)" stroke-width="1.8551" opacity="0.4" />
  <rect x="567.7777" y="373.75" width="144.4444" height="43.75" rx="7.1875" fill="var(--text)" stroke="var(--danger-border)" stroke-width="1.3913" opacity="0.7" />
  <circle cx="690" cy="395" r="4.4444" fill="var(--danger-fill)" opacity="0.8" />
  <line x1="578.8889" y1="395" x2="634.4444" y2="395" stroke="var(--danger-border)" stroke-width="1.8551" opacity="0.4" />
  <line x1="728.8889" y1="170" x2="862.2222" y2="170" stroke="var(--primary-border)" stroke-width="1.3913" opacity="0.3" />
  <line x1="728.8889" y1="226.2501" x2="862.2222" y2="226.2501" stroke="var(--primary-border)" stroke-width="1.3913" opacity="0.3" />
  <line x1="728.8889" y1="338.75" x2="862.2222" y2="338.75" stroke="var(--primary-border)" stroke-width="1.3913" opacity="0.3" />
  <rect x="284.4444" y="180" width="200" height="150" rx="7.1875" fill="var(--text)" stroke="var(--text-muted)" stroke-width="1.3913" />
  <rect x="284.4444" y="180" width="200" height="25" rx="7.1875" fill="var(--text-muted)" />
  <rect x="284.4444" y="198.75" width="200" height="6.25" fill="var(--text-muted)" rx="7.1875"/>
  <text x="301.111" y="236.25" font-family="monospace" font-size="11.9792" fill="var(--ok-accent)" opacity="0.8">$ systemctl</text>
  <text x="301.111" y="257.5" font-family="monospace" font-size="11.9792" fill="var(--ok-accent)" opacity="0.8">$ journalctl</text>
  <text x="301.111" y="278.7499" font-family="monospace" font-size="11.9792" fill="var(--ok-accent)" opacity="0.8">$ firewalld</text>
  <text x="301.111" y="300" font-family="monospace" font-size="11.9792" fill="var(--ok-accent)" opacity="0.8">$ mount /dev</text>
  <rect x="840" y="255.0001" width="166.6666" height="100" rx="7.1875" fill="var(--text)" stroke="var(--text-muted)" stroke-width="1.3913" opacity="0.6" />

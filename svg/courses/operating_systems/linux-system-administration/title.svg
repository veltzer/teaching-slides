  <line x1="445.2174" y1="75.1304" x2="556.5217" y2="75.1304" stroke="var(--primary-border)" stroke-width="1.3913" opacity="0.3" />
  <line x1="445.2174" y1="122.087" x2="556.5217" y2="122.087" stroke="var(--primary-border)" stroke-width="1.3913" opacity="0.3" />
  <line x1="445.2174" y1="216" x2="556.5217" y2="216" stroke="var(--primary-border)" stroke-width="1.3913" opacity="0.3" />
  <rect x="74.2029" y="83.4783" width="166.9565" height="125.2174" rx="6" fill="var(--text)" stroke="var(--text-muted)" stroke-width="1.3913" />
  <rect x="74.2029" y="83.4783" width="166.9565" height="20.8696" rx="6" fill="var(--text-muted)" />
  <rect x="74.2029" y="99.1304" width="166.9565" height="5.2174" fill="var(--text-muted)" rx="6"/>
  <text x="88.1159" y="130.4348" font-family="monospace" font-size="10" fill="var(--ok-accent)" opacity="0.8">$ systemctl</text>
  <text x="88.1159" y="148.1739" font-family="monospace" font-size="10" fill="var(--ok-accent)" opacity="0.8">$ journalctl</text>
  <text x="88.1159" y="165.913" font-family="monospace" font-size="10" fill="var(--ok-accent)" opacity="0.8">$ firewalld</text>
  <text x="88.1159" y="183.6522" font-family="monospace" font-size="10" fill="var(--ok-accent)" opacity="0.8">$ mount /dev</text>

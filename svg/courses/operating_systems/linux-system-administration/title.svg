<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#1a1a2e"/>
  <!-- Server rack -->
  <rect x="320" y="40" width="160" height="260" rx="8" fill="#2d3436" stroke="#636e72" stroke-width="2"/>
  <!-- Server units -->
  <rect x="335" y="55" width="130" height="35" rx="3" fill="#343a40" stroke="#74c0fc" stroke-width="1.5" opacity="0.7"/>
  <circle cx="445" cy="72" r="4" fill="#69db7c" opacity="0.8"/>
  <line x1="345" y1="72" x2="395" y2="72" stroke="#74c0fc" stroke-width="2" opacity="0.4"/>
  <rect x="335" y="100" width="130" height="35" rx="3" fill="#343a40" stroke="#74c0fc" stroke-width="1.5" opacity="0.7"/>
  <circle cx="445" cy="117" r="4" fill="#69db7c" opacity="0.8"/>
  <line x1="345" y1="117" x2="395" y2="117" stroke="#74c0fc" stroke-width="2" opacity="0.4"/>
  <rect x="335" y="145" width="130" height="35" rx="3" fill="#343a40" stroke="#ffd43b" stroke-width="1.5" opacity="0.7"/>
  <circle cx="445" cy="162" r="4" fill="#ffd43b" opacity="0.8"/>
  <line x1="345" y1="162" x2="395" y2="162" stroke="#ffd43b" stroke-width="2" opacity="0.4"/>
  <rect x="335" y="190" width="130" height="35" rx="3" fill="#343a40" stroke="#74c0fc" stroke-width="1.5" opacity="0.7"/>
  <circle cx="445" cy="207" r="4" fill="#69db7c" opacity="0.8"/>
  <line x1="345" y1="207" x2="395" y2="207" stroke="#74c0fc" stroke-width="2" opacity="0.4"/>
  <rect x="335" y="235" width="130" height="35" rx="3" fill="#343a40" stroke="#ff6b6b" stroke-width="1.5" opacity="0.7"/>
  <circle cx="445" cy="252" r="4" fill="#ff6b6b" opacity="0.8"/>
  <line x1="345" y1="252" x2="395" y2="252" stroke="#ff6b6b" stroke-width="2" opacity="0.4"/>
  <!-- Network connections -->
  <line x1="480" y1="72" x2="600" y2="72" stroke="#74c0fc" stroke-width="1.5" opacity="0.3"/>
  <line x1="480" y1="117" x2="600" y2="117" stroke="#74c0fc" stroke-width="1.5" opacity="0.3"/>
  <line x1="480" y1="207" x2="600" y2="207" stroke="#74c0fc" stroke-width="1.5" opacity="0.3"/>
  <!-- Terminal/CLI -->
  <rect x="80" y="80" width="180" height="120" rx="6" fill="#2d2d2d" stroke="#495057" stroke-width="1.5"/>
  <rect x="80" y="80" width="180" height="20" rx="6" fill="#495057"/>
  <rect x="80" y="95" width="180" height="5" fill="#495057"/>
  <text x="95" y="125" font-family="monospace" font-size="10" fill="#69db7c" opacity="0.8">$ systemctl</text>
  <text x="95" y="142" font-family="monospace" font-size="10" fill="#69db7c" opacity="0.8">$ journalctl</text>
  <text x="95" y="159" font-family="monospace" font-size="10" fill="#69db7c" opacity="0.8">$ firewalld</text>
  <text x="95" y="176" font-family="monospace" font-size="10" fill="#69db7c" opacity="0.8">$ mount /dev</text>
  <!-- Monitoring graph -->
  <rect x="580" y="140" width="150" height="80" rx="4" fill="#343a40" stroke="#495057" stroke-width="1.5" opacity="0.6"/>
  <polyline points="595,200 615,190 635,195 655,170 675,180 695,160 715,165" fill="none" stroke="#69db7c" stroke-width="2" opacity="0.7"/>
  <!-- Shield/security -->
  <path d="M660,40 L690,55 L690,85 Q690,105 660,115 Q630,105 630,85 L630,55 Z" fill="none" stroke="#ffd43b" stroke-width="2" opacity="0.5"/>
  <text x="660" y="85" text-anchor="middle" font-family="Arial" font-size="20" fill="#ffd43b" opacity="0.5">&#10003;</text>
  <!-- Title -->
  <text x="400" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#adb5bd" letter-spacing="3">LINUX SYSTEM ADMINISTRATION</text>
</svg>

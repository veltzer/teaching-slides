  <path d="M 1162.075 239.8156 L 1195.4714 257.0967 L 1195.4714 291.6591 Q 1195.4714 314.7005 1162.075 326.2213 Q 1128.6785 314.7005 1128.6785 291.6591 L 1128.6785 257.0967 Z" fill="none" stroke="var(--warn-border)" stroke-width="0.7429" opacity="0.5"/>

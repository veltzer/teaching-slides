  <circle cx="412.7536" cy="169.0435" r="3.7101" fill="var(--warn-fill)" opacity="0.8" />
  <line x1="320" y1="169.0435" x2="366.3768" y2="169.0435" stroke="var(--warn-border)" stroke-width="1.8551" opacity="0.4" />
  <rect x="310.7246" y="198.2609" width="120.5797" height="36.5217" rx="6" fill="var(--text)" stroke="var(--primary-border)" stroke-width="1.3913" opacity="0.7" />
  <circle cx="412.7536" cy="216" r="3.7101" fill="var(--ok-fill)" opacity="0.8" />
  <line x1="320" y1="216" x2="366.3768" y2="216" stroke="var(--primary-border)" stroke-width="1.8551" opacity="0.4" />
  <rect x="310.7246" y="245.2174" width="120.5797" height="36.5217" rx="6" fill="var(--text)" stroke="var(--danger-border)" stroke-width="1.3913" opacity="0.7" />
  <circle cx="412.7536" cy="262.9565" r="3.7101" fill="var(--danger-fill)" opacity="0.8" />

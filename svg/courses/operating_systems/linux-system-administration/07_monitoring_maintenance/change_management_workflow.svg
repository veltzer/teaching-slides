<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Top row: 4 boxes -->
  <rect x="30" y="40" width="252" height="150" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <rect x="30" y="40" width="252" height="48" fill="url(#grad-accent)" rx="10"/>
  <rect x="30" y="78" width="252" height="10" fill="url(#grad-accent)"/>
  <text x="156" y="72" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff" font-family="sans-serif">Request Change</text>
  <text x="156" y="125" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">RFC ticket created</text>
  <text x="156" y="148" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">Impact assessed</text>

  <line x1="282" y1="115" x2="318" y2="115" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <rect x="320" y="40" width="252" height="150" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <rect x="320" y="40" width="252" height="48" fill="url(#grad-accent)" rx="10"/>
  <rect x="320" y="78" width="252" height="10" fill="url(#grad-accent)"/>
  <text x="446" y="72" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff" font-family="sans-serif">Peer Review</text>
  <text x="446" y="125" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">Technical review</text>
  <text x="446" y="148" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">Risk evaluation</text>

  <line x1="572" y1="115" x2="608" y2="115" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <rect x="610" y="40" width="252" height="150" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <rect x="610" y="40" width="252" height="48" fill="url(#grad-accent)" rx="10"/>
  <rect x="610" y="78" width="252" height="10" fill="url(#grad-accent)"/>
  <text x="736" y="72" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff" font-family="sans-serif">Test in Staging</text>
  <text x="736" y="125" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">Validation</text>
  <text x="736" y="148" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">Rollback tested</text>

  <line x1="862" y1="115" x2="898" y2="115" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <rect x="900" y="40" width="350" height="150" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <rect x="900" y="40" width="350" height="48" fill="url(#grad-accent)" rx="10"/>
  <rect x="900" y="78" width="350" height="10" fill="url(#grad-accent)"/>
  <text x="1075" y="72" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff" font-family="sans-serif">Approve</text>
  <text x="1075" y="125" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">CAB sign-off</text>
  <text x="1075" y="148" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">Schedule window</text>

  <!-- Arrow down from Approve and across to Deploy -->
  <line x1="1075" y1="190" x2="1075" y2="240" stroke="#1565c0" stroke-width="2"/>
  <line x1="1075" y1="240" x2="156" y2="240" stroke="#1565c0" stroke-width="2"/>
  <line x1="156" y1="240" x2="156" y2="280" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <!-- Bottom row: 3 boxes -->
  <rect x="30" y="282" width="252" height="150" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <rect x="30" y="282" width="252" height="48" fill="url(#grad-accent)" rx="10"/>
  <rect x="30" y="320" width="252" height="10" fill="url(#grad-accent)"/>
  <text x="156" y="314" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff" font-family="sans-serif">Deploy to Prod</text>
  <text x="156" y="367" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">Maintenance window</text>
  <text x="156" y="390" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">Rollback ready</text>

  <line x1="282" y1="357" x2="318" y2="357" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <rect x="320" y="282" width="252" height="150" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <rect x="320" y="282" width="252" height="48" fill="url(#grad-accent)" rx="10"/>
  <rect x="320" y="320" width="252" height="10" fill="url(#grad-accent)"/>
  <text x="446" y="314" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff" font-family="sans-serif">Verify &amp; Monitor</text>
  <text x="446" y="367" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">Health checks</text>
  <text x="446" y="390" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">Alerts reviewed</text>

  <line x1="572" y1="357" x2="608" y2="357" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <rect x="610" y="282" width="252" height="150" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <rect x="610" y="282" width="252" height="48" fill="url(#grad-accent)" rx="10"/>
  <rect x="610" y="320" width="252" height="10" fill="url(#grad-accent)"/>
  <text x="736" y="314" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff" font-family="sans-serif">Document</text>
  <text x="736" y="367" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">CMDB update</text>
  <text x="736" y="390" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">Close RFC ticket</text>
</svg>

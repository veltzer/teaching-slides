<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="58.75" y="201.1111" width="225" height="225.5556" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="58.75" y="201.1111" width="225" height="44.3056" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="58.75" y="237.3611" width="225" height="8.0556" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="171.25" y="228.5" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Targets</text>
  <text x="171.25" y="281.6667" text-anchor="middle" font-size="13.0354" fill="var(--text)" font-family="sans-serif">node_exporter</text>
  <text x="171.25" y="304.2223" text-anchor="middle" font-size="13.0354" fill="var(--text)" font-family="sans-serif">app exporters</text>
  <text x="171.25" y="344.5" text-anchor="middle" font-size="11.2974" fill="var(--text-muted)" font-family="sans-serif">Port 9100</text>
  <text x="171.25" y="362.2223" text-anchor="middle" font-size="11.2974" fill="var(--text-muted)" font-family="sans-serif">/metrics endpoint</text>
  <line x1="283.75" y1="313.8889" x2="356.8749" y2="313.8889" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="321.25" y="301.8056" text-anchor="middle" font-size="11.2974" fill="var(--text-muted)" font-family="sans-serif">scrape</text>
  <rect x="358.75" y="201.1111" width="234.375" height="225.5556" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="358.75" y="201.1111" width="234.375" height="44.3056" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="358.75" y="237.3611" width="234.375" height="8.0556" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="475.9375" y="228.5" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Prometheus</text>
  <text x="475.9375" y="281.6667" text-anchor="middle" font-size="13.0354" fill="var(--text)" font-family="sans-serif">Time-series DB</text>
  <text x="475.9375" y="304.2223" text-anchor="middle" font-size="13.0354" fill="var(--text)" font-family="sans-serif">PromQL queries</text>
  <text x="475.9375" y="344.5" text-anchor="middle" font-size="11.2974" fill="var(--text-muted)" font-family="sans-serif">Pull-based scraping</text>
  <text x="475.9375" y="362.2223" text-anchor="middle" font-size="11.2974" fill="var(--text-muted)" font-family="sans-serif">Port 9090</text>
  <line x1="593.1249" y1="313.8889" x2="666.25" y2="313.8889" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="668.125" y="201.1111" width="234.375" height="225.5556" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="668.125" y="201.1111" width="234.375" height="44.3056" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="668.125" y="237.3611" width="234.375" height="8.0556" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="785.3125" y="228.5" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Grafana</text>
  <text x="785.3125" y="281.6667" text-anchor="middle" font-size="13.0354" fill="var(--text)" font-family="sans-serif">Visualization</text>
  <text x="785.3125" y="304.2223" text-anchor="middle" font-size="13.0354" fill="var(--text)" font-family="sans-serif">Dashboards</text>
  <text x="785.3125" y="344.5" text-anchor="middle" font-size="11.2974" fill="var(--text-muted)" font-family="sans-serif">Alert rules</text>
  <text x="785.3125" y="362.2223" text-anchor="middle" font-size="11.2974" fill="var(--text-muted)" font-family="sans-serif">Port 3000</text>
  <rect x="977.5" y="201.1111" width="243.75" height="225.5556" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="977.5" y="201.1111" width="243.75" height="44.3056" fill="var(--danger-accent)" rx="6" />
  <rect x="977.5" y="237.3611" width="243.75" height="8.0556" fill="var(--danger-accent)" rx="6"/>
  <text x="1099.3749" y="228.5" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Alertmanager</text>
  <text x="1099.3749" y="281.6667" text-anchor="middle" font-size="13.0354" fill="var(--text)" font-family="sans-serif">Routes alerts</text>
  <text x="1099.3749" y="304.2223" text-anchor="middle" font-size="13.0354" fill="var(--text)" font-family="sans-serif">Email / Slack / PD</text>
  <text x="1099.3749" y="344.5" text-anchor="middle" font-size="11.2974" fill="var(--text-muted)" font-family="sans-serif">Silencing</text>
  <text x="1099.3749" y="362.2223" text-anchor="middle" font-size="11.2974" fill="var(--text-muted)" font-family="sans-serif">Grouping</text>
  <line x1="593.1249" y1="426.6667" x2="977.5" y2="426.6667" stroke="var(--danger-border)" stroke-width="1.7778" stroke-dasharray="8.8889 4.4444" marker-end="url(#arrow)" />
  <text x="790" y="417" text-anchor="middle" font-size="11.2974" fill="var(--danger-accent)" font-family="sans-serif">fire alerts</text>
</svg>
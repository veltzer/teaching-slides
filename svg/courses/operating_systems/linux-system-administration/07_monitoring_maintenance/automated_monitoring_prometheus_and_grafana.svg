<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Targets -->
  <rect x="20" y="200" width="240" height="280" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="12" filter="url(#shadow)"/>
  <rect x="20" y="200" width="240" height="55" fill="url(#grad-accent)" rx="12"/>
  <rect x="20" y="245" width="240" height="10" fill="url(#grad-accent)"/>
  <text x="140" y="234" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" font-family="sans-serif">Targets</text>
  <text x="140" y="300" text-anchor="middle" font-size="15" fill="#333333" font-family="sans-serif">node_exporter</text>
  <text x="140" y="328" text-anchor="middle" font-size="15" fill="#333333" font-family="sans-serif">app exporters</text>
  <text x="140" y="378" text-anchor="middle" font-size="13" fill="#555555" font-family="sans-serif">Port 9100</text>
  <text x="140" y="400" text-anchor="middle" font-size="13" fill="#555555" font-family="sans-serif">/metrics endpoint</text>

  <line x1="260" y1="340" x2="338" y2="340" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
  <text x="300" y="325" text-anchor="middle" font-size="13" fill="#555555" font-family="sans-serif">scrape</text>

  <!-- Prometheus -->
  <rect x="340" y="200" width="250" height="280" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="12" filter="url(#shadow)"/>
  <rect x="340" y="200" width="250" height="55" fill="url(#grad-accent)" rx="12"/>
  <rect x="340" y="245" width="250" height="10" fill="url(#grad-accent)"/>
  <text x="465" y="234" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" font-family="sans-serif">Prometheus</text>
  <text x="465" y="300" text-anchor="middle" font-size="15" fill="#333333" font-family="sans-serif">Time-series DB</text>
  <text x="465" y="328" text-anchor="middle" font-size="15" fill="#333333" font-family="sans-serif">PromQL queries</text>
  <text x="465" y="378" text-anchor="middle" font-size="13" fill="#555555" font-family="sans-serif">Pull-based scraping</text>
  <text x="465" y="400" text-anchor="middle" font-size="13" fill="#555555" font-family="sans-serif">Port 9090</text>

  <line x1="590" y1="340" x2="668" y2="340" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>

  <!-- Grafana -->
  <rect x="670" y="200" width="250" height="280" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="12" filter="url(#shadow)"/>
  <rect x="670" y="200" width="250" height="55" fill="url(#grad-accent)" rx="12"/>
  <rect x="670" y="245" width="250" height="10" fill="url(#grad-accent)"/>
  <text x="795" y="234" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" font-family="sans-serif">Grafana</text>
  <text x="795" y="300" text-anchor="middle" font-size="15" fill="#333333" font-family="sans-serif">Visualization</text>
  <text x="795" y="328" text-anchor="middle" font-size="15" fill="#333333" font-family="sans-serif">Dashboards</text>
  <text x="795" y="378" text-anchor="middle" font-size="13" fill="#555555" font-family="sans-serif">Alert rules</text>
  <text x="795" y="400" text-anchor="middle" font-size="13" fill="#555555" font-family="sans-serif">Port 3000</text>

  <!-- Alertmanager (dashed from Prometheus) -->
  <rect x="1000" y="200" width="260" height="280" fill="url(#grad-surface)" stroke="#c62828" stroke-width="2" rx="12" filter="url(#shadow)"/>
  <rect x="1000" y="200" width="260" height="55" fill="#c62828" rx="12"/>
  <rect x="1000" y="245" width="260" height="10" fill="#c62828"/>
  <text x="1130" y="234" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" font-family="sans-serif">Alertmanager</text>
  <text x="1130" y="300" text-anchor="middle" font-size="15" fill="#333333" font-family="sans-serif">Routes alerts</text>
  <text x="1130" y="328" text-anchor="middle" font-size="15" fill="#333333" font-family="sans-serif">Email / Slack / PD</text>
  <text x="1130" y="378" text-anchor="middle" font-size="13" fill="#555555" font-family="sans-serif">Silencing</text>
  <text x="1130" y="400" text-anchor="middle" font-size="13" fill="#555555" font-family="sans-serif">Grouping</text>

  <!-- Dashed line from Prometheus to Alertmanager -->
  <line x1="590" y1="480" x2="1000" y2="480" stroke="#c62828" stroke-width="2" stroke-dasharray="10 5" marker-end="url(#arrow)"/>
  <text x="800" y="468" text-anchor="middle" font-size="13" fill="#c62828" font-family="sans-serif">fire alerts</text>
</svg>

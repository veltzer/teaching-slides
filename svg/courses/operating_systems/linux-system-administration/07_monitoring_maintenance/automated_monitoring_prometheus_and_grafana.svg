<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="232.258065" height="579.999998" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.775355" filter="url(#shadow)" />
  <rect x="40" y="40" width="232.258065" height="113.928663" fill="var(--primary-fill)" rx="9.775355" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="40" y="133.214267" width="232.258065" height="20.714396" fill="var(--primary-fill)" rx="9.775355" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="156.129032" y="110.428586" text-anchor="middle" font-size="25.485168" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Targets</text>
  <text x="156.129032" y="247.14293" text-anchor="middle" font-size="21.237613" fill="var(--text)" font-family="sans-serif">node_exporter</text>
  <text x="156.129032" y="305.143033" text-anchor="middle" font-size="21.237613" fill="var(--text)" font-family="sans-serif">app exporters</text>
  <text x="156.129032" y="408.714242" text-anchor="middle" font-size="18.406017" fill="var(--text-muted)" font-family="sans-serif">Port 9100</text>
  <text x="156.129032" y="454.285861" text-anchor="middle" font-size="18.406017" fill="var(--text-muted)" font-family="sans-serif">/metrics endpoint</text>
  <line x1="272.258065" y1="330" x2="347.741832" y2="330" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="310.967742" y="298.928663" text-anchor="middle" font-size="18.406017" fill="var(--text-muted)" font-family="sans-serif">scrape</text>
  <rect x="349.677419" y="40" width="241.935484" height="579.999998" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.775355" filter="url(#shadow)" />
  <rect x="349.677419" y="40" width="241.935484" height="113.928663" fill="var(--primary-fill)" rx="9.775355" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="349.677419" y="133.214267" width="241.935484" height="20.714396" fill="var(--primary-fill)" rx="9.775355" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="470.645161" y="110.428586" text-anchor="middle" font-size="25.485168" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Prometheus</text>
  <text x="470.645161" y="247.14293" text-anchor="middle" font-size="21.237613" fill="var(--text)" font-family="sans-serif">Time-series DB</text>
  <text x="470.645161" y="305.143033" text-anchor="middle" font-size="21.237613" fill="var(--text)" font-family="sans-serif">PromQL queries</text>
  <text x="470.645161" y="408.714242" text-anchor="middle" font-size="18.406017" fill="var(--text-muted)" font-family="sans-serif">Pull-based scraping</text>
  <text x="470.645161" y="454.285861" text-anchor="middle" font-size="18.406017" fill="var(--text-muted)" font-family="sans-serif">Port 9090</text>
  <line x1="591.6128" y1="330" x2="667.096774" y2="330" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="669.032258" y="40" width="241.935484" height="579.999998" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.775355" filter="url(#shadow)" />
  <rect x="669.032258" y="40" width="241.935484" height="113.928663" fill="var(--primary-fill)" rx="9.775355" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="669.032258" y="133.214267" width="241.935484" height="20.714396" fill="var(--primary-fill)" rx="9.775355" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="790" y="110.428586" text-anchor="middle" font-size="25.485168" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Grafana</text>
  <text x="790" y="247.14293" text-anchor="middle" font-size="21.237613" fill="var(--text)" font-family="sans-serif">Visualization</text>
  <text x="790" y="305.143033" text-anchor="middle" font-size="21.237613" fill="var(--text)" font-family="sans-serif">Dashboards</text>
  <text x="790" y="408.714242" text-anchor="middle" font-size="18.406017" fill="var(--text-muted)" font-family="sans-serif">Alert rules</text>
  <text x="790" y="454.285861" text-anchor="middle" font-size="18.406017" fill="var(--text-muted)" font-family="sans-serif">Port 3000</text>
  <rect x="988.387097" y="40" width="251.612903" height="579.999998" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.775355" filter="url(#shadow)" />
  <rect x="988.387097" y="40" width="251.612903" height="113.928663" fill="var(--danger-accent)" rx="9.775355" />
  <rect x="988.387097" y="133.214267" width="251.612903" height="20.714396" fill="var(--danger-accent)" rx="9.775355"/>
  <text x="1114.193445" y="110.428586" text-anchor="middle" font-size="25.485168" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Alertmanager</text>
  <text x="1114.193445" y="247.14293" text-anchor="middle" font-size="21.237613" fill="var(--text)" font-family="sans-serif">Routes alerts</text>
  <text x="1114.193445" y="305.143033" text-anchor="middle" font-size="21.237613" fill="var(--text)" font-family="sans-serif">Email / Slack / PD</text>
  <text x="1114.193445" y="408.714242" text-anchor="middle" font-size="18.406017" fill="var(--text-muted)" font-family="sans-serif">Silencing</text>
  <text x="1114.193445" y="454.285861" text-anchor="middle" font-size="18.406017" fill="var(--text-muted)" font-family="sans-serif">Grouping</text>
  <line x1="591.6128" y1="620" x2="988.387097" y2="620" stroke="var(--danger-border)" stroke-width="1.7778" stroke-dasharray="8.8889 4.4444" marker-end="url(#arrow)" />
  <text x="794.83871" y="595.142777" text-anchor="middle" font-size="18.406017" fill="var(--danger-accent)" font-family="sans-serif">fire alerts</text>
</svg>
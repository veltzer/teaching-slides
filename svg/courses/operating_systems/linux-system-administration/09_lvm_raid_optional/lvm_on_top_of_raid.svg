  <rect x="199.375" y="164.8611" width="768.75" height="72.5" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="199.375" y="164.8611" width="768.75" height="32.2223" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="199.375" y="189.0277" width="768.75" height="8.0556" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="583.75" y="185" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Volume Group (VG)</text>
  <text x="583.75" y="223.6667" text-anchor="middle" font-size="12.1663" fill="var(--text)" font-family="sans-serif">Spans RAID arrays as Physical Volumes</text>
  <line x1="372.8125" y1="132.6389" x2="433.75" y2="164.8611" stroke="var(--text-muted)" stroke-width="1.7778" />

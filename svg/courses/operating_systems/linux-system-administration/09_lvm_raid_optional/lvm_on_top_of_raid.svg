  <rect x="488.8889" y="435.5556" width="155.5556" height="97.7778" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="566.2222" y="487.1111" text-anchor="middle" font-size="13.3333" fill="var(--text)" font-family="monospace">/dev/sdd</text>
  <rect x="675.5556" y="435.5556" width="155.5556" height="97.7778" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="752.8889" y="487.1111" text-anchor="middle" font-size="13.3333" fill="var(--text)" font-family="monospace">/dev/sde</text>
  <line x1="177.7778" y1="368.8889" x2="148.4444" y2="435.5556" stroke="var(--text-muted)" stroke-width="1.3333" />
  <line x1="320" y1="368.8889" x2="335.1111" y2="435.5556" stroke="var(--text-muted)" stroke-width="1.3333" />
  <line x1="613.3333" y1="368.8889" x2="566.2222" y2="435.5556" stroke="var(--text-muted)" stroke-width="1.3333" />
  <line x1="791.1111" y1="368.8889" x2="752.8889" y2="435.5556" stroke="var(--text-muted)" stroke-width="1.3333" />
</svg>
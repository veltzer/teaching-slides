<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- LV layer at top -->
  <rect x="240" y="20" width="230" height="95" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <rect x="240" y="20" width="230" height="38" fill="url(#grad-accent)" rx="10"/>
  <rect x="240" y="48" width="230" height="10" fill="url(#grad-accent)"/>
  <text x="355" y="43" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff" font-family="monospace">LV: /home</text>
  <text x="355" y="90" text-anchor="middle" font-size="13" fill="#555555" font-family="sans-serif">Logical Volume</text>

  <rect x="720" y="20" width="230" height="95" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <rect x="720" y="20" width="230" height="38" fill="url(#grad-accent)" rx="10"/>
  <rect x="720" y="48" width="230" height="10" fill="url(#grad-accent)"/>
  <text x="835" y="43" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff" font-family="monospace">LV: /data</text>
  <text x="835" y="90" text-anchor="middle" font-size="13" fill="#555555" font-family="sans-serif">Logical Volume</text>

  <!-- VG layer -->
  <rect x="170" y="155" width="820" height="90" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="3" rx="12" filter="url(#shadow)"/>
  <rect x="170" y="155" width="820" height="40" fill="url(#grad-accent)" rx="12"/>
  <rect x="170" y="185" width="820" height="10" fill="url(#grad-accent)"/>
  <text x="580" y="180" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" font-family="sans-serif">Volume Group (VG)</text>
  <text x="580" y="228" text-anchor="middle" font-size="14" fill="#333333" font-family="sans-serif">Spans RAID arrays as Physical Volumes</text>

  <!-- Lines LV to VG -->
  <line x1="355" y1="115" x2="420" y2="155" stroke="#555555" stroke-width="2"/>
  <line x1="835" y1="115" x2="760" y2="155" stroke="#555555" stroke-width="2"/>

  <!-- RAID arrays layer -->
  <rect x="120" y="315" width="340" height="100" fill="url(#grad-surface)" stroke="#64b5f6" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="290" y="370" text-anchor="middle" font-size="17" font-weight="bold" fill="#333333" font-family="sans-serif">RAID 1 (/dev/md0)</text>
  <text x="290" y="395" text-anchor="middle" font-size="13" fill="#555555" font-family="sans-serif">Mirror</text>

  <rect x="600" y="315" width="400" height="100" fill="url(#grad-surface)" stroke="#64b5f6" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="800" y="370" text-anchor="middle" font-size="17" font-weight="bold" fill="#333333" font-family="sans-serif">RAID 5 (/dev/md1)</text>
  <text x="800" y="395" text-anchor="middle" font-size="13" fill="#555555" font-family="sans-serif">Parity</text>

  <!-- Lines VG to RAID -->
  <line x1="355" y1="245" x2="290" y2="315" stroke="#555555" stroke-width="2"/>
  <line x1="800" y1="245" x2="800" y2="315" stroke="#555555" stroke-width="2"/>

  <!-- Physical disks -->
  <rect x="80" y="490" width="175" height="110" fill="url(#grad-surface)" stroke="#bbdefb" stroke-width="1.5" rx="8"/>
  <text x="167" y="548" text-anchor="middle" font-size="15" fill="#333333" font-family="monospace">/dev/sdb</text>

  <rect x="290" y="490" width="175" height="110" fill="url(#grad-surface)" stroke="#bbdefb" stroke-width="1.5" rx="8"/>
  <text x="377" y="548" text-anchor="middle" font-size="15" fill="#333333" font-family="monospace">/dev/sdc</text>

  <rect x="550" y="490" width="175" height="110" fill="url(#grad-surface)" stroke="#bbdefb" stroke-width="1.5" rx="8"/>
  <text x="637" y="548" text-anchor="middle" font-size="15" fill="#333333" font-family="monospace">/dev/sdd</text>

  <rect x="760" y="490" width="175" height="110" fill="url(#grad-surface)" stroke="#bbdefb" stroke-width="1.5" rx="8"/>
  <text x="847" y="548" text-anchor="middle" font-size="15" fill="#333333" font-family="monospace">/dev/sde</text>

  <!-- Lines RAID to disks -->
  <line x1="200" y1="415" x2="167" y2="490" stroke="#555555" stroke-width="1.5"/>
  <line x1="360" y1="415" x2="377" y2="490" stroke="#555555" stroke-width="1.5"/>
  <line x1="690" y1="415" x2="637" y2="490" stroke="#555555" stroke-width="1.5"/>
  <line x1="890" y1="415" x2="847" y2="490" stroke="#555555" stroke-width="1.5"/>
</svg>

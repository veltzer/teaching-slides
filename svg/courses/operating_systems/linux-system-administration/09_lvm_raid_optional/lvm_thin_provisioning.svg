<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.623684516765" font-weight="bold" fill="var(--text)">LVM Thin Provisioning</text>
  <rect x="40" y="76.576576576577" width="290" height="543.423423423423" rx="10.222744470273" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="185" y="113.153153153153" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.445488940547" font-weight="bold" fill="var(--info-text)">Concept</text>
  <text x="60" y="154.954954954955" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--info-text)">Thin pool of space</text>
  <text x="60" y="186.306306306306" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--info-text)">Allocate on demand</text>
  <text x="60" y="217.657657657658" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--info-text)">Over provision pool</text>
  <text x="60" y="249.009009009009" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--info-text)">Logical larger sum</text>
  <text x="60" y="280.36036036036" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--info-text)">Storage efficiency</text>
  <rect x="345" y="76.576576576577" width="290" height="543.423423423423" rx="10.222744470273" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="490" y="113.153153153153" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.445488940547" font-weight="bold" fill="var(--primary-text)">Snapshots</text>
  <text x="365" y="154.954954954955" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--primary-text)">Cheap copy on write</text>
  <text x="365" y="186.306306306306" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--primary-text)">Instant backup take</text>
  <text x="365" y="217.657657657658" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--primary-text)">Rollback to snapshot</text>
  <text x="365" y="249.009009009009" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--primary-text)">Test before commit</text>
  <text x="365" y="280.36036036036" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--primary-text)">Many snapshots ok</text>
  <rect x="650" y="76.576576576577" width="290" height="543.423423423423" rx="10.222744470273" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="795" y="113.153153153153" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.445488940547" font-weight="bold" fill="var(--warn-text)">Risks</text>
  <text x="670" y="154.954954954955" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--warn-text)">Pool exhaustion fails</text>
  <text x="670" y="186.306306306306" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--warn-text)">Monitor pool usage</text>
  <text x="670" y="217.657657657658" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--warn-text)">Auto extend setting</text>
  <text x="670" y="249.009009009009" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--warn-text)">Read only on full</text>
  <text x="670" y="280.36036036036" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--warn-text)">Plan capacity early</text>
  <rect x="955" y="76.576576576577" width="285" height="543.423423423423" rx="10.222744470273" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1097" y="113.153153153153" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.445488940547" font-weight="bold" fill="var(--ok-text)">Use Cases</text>
  <text x="975" y="154.954954954955" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--ok-text)">Virtualization stack</text>
  <text x="975" y="186.306306306306" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--ok-text)">Container storage</text>
  <text x="975" y="217.657657657658" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--ok-text)">Test or dev clones</text>
  <text x="975" y="249.009009009009" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--ok-text)">Database backups</text>
  <text x="975" y="280.36036036036" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--ok-text)">Time machine style</text>
</svg>

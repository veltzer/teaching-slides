  <ns0:text x="284.4444" y="66.6667" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="#ffffff" font-family="sans-serif">Need speed? No redundancy</ns0:text>
  <ns0:text x="284.4444" y="142.2222" text-anchor="middle" font-size="53.3333" font-weight="bold" fill="#1565c0" font-family="sans-serif">RAID 0</ns0:text>
  <ns0:text x="284.4444" y="200" text-anchor="middle" font-size="14.2222" fill="#555555" font-family="sans-serif">Striping only — all disks used</ns0:text>
  <ns0:text x="284.4444" y="226.6667" text-anchor="middle" font-size="14.2222" fill="#555555" font-family="sans-serif">Fastest reads/writes, no fault tolerance</ns0:text>
  <ns0:text x="284.4444" y="253.3333" text-anchor="middle" font-size="14.2222" fill="#555555" font-family="sans-serif">Use: temp data, scratch space</ns0:text>
  <ns0:rect x="586.6667" y="35.5556" width="533.3333" height="257.7778" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.7778" rx="10.6667" filter="url(#shadow)" />

<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="17.7778" y="35.5556" width="533.3333" height="257.7778" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.7778" rx="10.6667" filter="url(#shadow)" />
  <ns0:rect x="17.7778" y="35.5556" width="533.3333" height="48.8889" fill="url(#grad-primary)" rx="10.6667" />
  <ns0:rect x="17.7778" y="75.5556" width="533.3333" height="8.8889" fill="url(#grad-primary)" />
  <ns0:text x="284.4444" y="66.6667" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="#ffffff" font-family="sans-serif">Need speed? No redundancy</ns0:text>
  <ns0:text x="284.4444" y="142.2222" text-anchor="middle" font-size="53.3333" font-weight="bold" fill="#1565c0" font-family="sans-serif">RAID 0</ns0:text>
  <ns0:text x="284.4444" y="200" text-anchor="middle" font-size="14.2222" fill="#555555" font-family="sans-serif">Striping only — all disks used</ns0:text>
  <ns0:text x="284.4444" y="226.6667" text-anchor="middle" font-size="14.2222" fill="#555555" font-family="sans-serif">Fastest reads/writes, no fault tolerance</ns0:text>
  <ns0:text x="284.4444" y="253.3333" text-anchor="middle" font-size="14.2222" fill="#555555" font-family="sans-serif">Use: temp data, scratch space</ns0:text>
  <ns0:rect x="586.6667" y="35.5556" width="533.3333" height="257.7778" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.7778" rx="10.6667" filter="url(#shadow)" />
  <ns0:rect x="586.6667" y="35.5556" width="533.3333" height="48.8889" fill="url(#grad-primary)" rx="10.6667" />
  <ns0:rect x="586.6667" y="75.5556" width="533.3333" height="8.8889" fill="url(#grad-primary)" />
  <ns0:text x="853.3333" y="66.6667" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="#ffffff" font-family="sans-serif">Need safety? Simple mirror</ns0:text>
  <ns0:text x="853.3333" y="142.2222" text-anchor="middle" font-size="53.3333" font-weight="bold" fill="#1565c0" font-family="sans-serif">RAID 1</ns0:text>
  <ns0:text x="853.3333" y="200" text-anchor="middle" font-size="14.2222" fill="#555555" font-family="sans-serif">Full mirror — 50% capacity</ns0:text>
  <ns0:text x="853.3333" y="226.6667" text-anchor="middle" font-size="14.2222" fill="#555555" font-family="sans-serif">Survives 1 disk failure</ns0:text>
  <ns0:text x="853.3333" y="253.3333" text-anchor="middle" font-size="14.2222" fill="#555555" font-family="sans-serif">Use: boot, critical data</ns0:text>
  <ns0:rect x="17.7778" y="337.7778" width="533.3333" height="257.7778" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.7778" rx="10.6667" filter="url(#shadow)" />
  <ns0:rect x="17.7778" y="337.7778" width="533.3333" height="48.8889" fill="url(#grad-primary)" rx="10.6667" />
  <ns0:rect x="17.7778" y="377.7778" width="533.3333" height="8.8889" fill="url(#grad-primary)" />
  <ns0:text x="284.4444" y="368.8889" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="#ffffff" font-family="sans-serif">Need both? Best of both worlds</ns0:text>
  <ns0:text x="284.4444" y="444.4444" text-anchor="middle" font-size="53.3333" font-weight="bold" fill="#1565c0" font-family="sans-serif">RAID 10</ns0:text>
  <ns0:text x="284.4444" y="502.2222" text-anchor="middle" font-size="14.2222" fill="#555555" font-family="sans-serif">Mirror + Stripe — 50% capacity</ns0:text>
  <ns0:text x="284.4444" y="528.8889" text-anchor="middle" font-size="14.2222" fill="#555555" font-family="sans-serif">Fast and redundant, min 4 disks</ns0:text>
  <ns0:text x="284.4444" y="555.5556" text-anchor="middle" font-size="14.2222" fill="#555555" font-family="sans-serif">Use: databases, production</ns0:text>
  <ns0:rect x="586.6667" y="337.7778" width="533.3333" height="257.7778" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.7778" rx="10.6667" filter="url(#shadow)" />
  <ns0:rect x="586.6667" y="337.7778" width="533.3333" height="48.8889" fill="url(#grad-primary)" rx="10.6667" />
  <ns0:rect x="586.6667" y="377.7778" width="533.3333" height="8.8889" fill="url(#grad-primary)" />
  <ns0:text x="853.3333" y="368.8889" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="#ffffff" font-family="sans-serif">Need capacity? Parity protection</ns0:text>
  <ns0:text x="853.3333" y="444.4444" text-anchor="middle" font-size="44.4444" font-weight="bold" fill="#1565c0" font-family="sans-serif">RAID 5/6</ns0:text>
  <ns0:text x="853.3333" y="502.2222" text-anchor="middle" font-size="14.2222" fill="#555555" font-family="sans-serif">Parity — one/two disk overhead</ns0:text>
  <ns0:text x="853.3333" y="528.8889" text-anchor="middle" font-size="14.2222" fill="#555555" font-family="sans-serif">Good capacity efficiency, min 3 disks</ns0:text>
  <ns0:text x="853.3333" y="555.5556" text-anchor="middle" font-size="14.2222" fill="#555555" font-family="sans-serif">Use: NAS, file servers</ns0:text>
</ns0:svg>
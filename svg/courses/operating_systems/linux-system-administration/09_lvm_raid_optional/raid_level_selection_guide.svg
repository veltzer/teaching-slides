<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Four quadrant boxes -->
  <rect x="20" y="40" width="600" height="290" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="12" filter="url(#shadow)"/>
  <rect x="20" y="40" width="600" height="55" fill="url(#grad-accent)" rx="12"/>
  <rect x="20" y="85" width="600" height="10" fill="url(#grad-accent)"/>
  <text x="320" y="75" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff" font-family="sans-serif">Need speed? No redundancy</text>
  <text x="320" y="160" text-anchor="middle" font-size="60" font-weight="bold" fill="#1565c0" font-family="sans-serif">RAID 0</text>
  <text x="320" y="225" text-anchor="middle" font-size="16" fill="#555555" font-family="sans-serif">Striping only — all disks used</text>
  <text x="320" y="255" text-anchor="middle" font-size="16" fill="#555555" font-family="sans-serif">Fastest reads/writes, no fault tolerance</text>
  <text x="320" y="285" text-anchor="middle" font-size="16" fill="#555555" font-family="sans-serif">Use: temp data, scratch space</text>

  <rect x="660" y="40" width="600" height="290" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="12" filter="url(#shadow)"/>
  <rect x="660" y="40" width="600" height="55" fill="url(#grad-accent)" rx="12"/>
  <rect x="660" y="85" width="600" height="10" fill="url(#grad-accent)"/>
  <text x="960" y="75" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff" font-family="sans-serif">Need safety? Simple mirror</text>
  <text x="960" y="160" text-anchor="middle" font-size="60" font-weight="bold" fill="#1565c0" font-family="sans-serif">RAID 1</text>
  <text x="960" y="225" text-anchor="middle" font-size="16" fill="#555555" font-family="sans-serif">Full mirror — 50% capacity</text>
  <text x="960" y="255" text-anchor="middle" font-size="16" fill="#555555" font-family="sans-serif">Survives 1 disk failure</text>
  <text x="960" y="285" text-anchor="middle" font-size="16" fill="#555555" font-family="sans-serif">Use: boot, critical data</text>

  <rect x="20" y="380" width="600" height="290" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="12" filter="url(#shadow)"/>
  <rect x="20" y="380" width="600" height="55" fill="url(#grad-accent)" rx="12"/>
  <rect x="20" y="425" width="600" height="10" fill="url(#grad-accent)"/>
  <text x="320" y="415" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff" font-family="sans-serif">Need both? Best of both worlds</text>
  <text x="320" y="500" text-anchor="middle" font-size="60" font-weight="bold" fill="#1565c0" font-family="sans-serif">RAID 10</text>
  <text x="320" y="565" text-anchor="middle" font-size="16" fill="#555555" font-family="sans-serif">Mirror + Stripe — 50% capacity</text>
  <text x="320" y="595" text-anchor="middle" font-size="16" fill="#555555" font-family="sans-serif">Fast and redundant, min 4 disks</text>
  <text x="320" y="625" text-anchor="middle" font-size="16" fill="#555555" font-family="sans-serif">Use: databases, production</text>

  <rect x="660" y="380" width="600" height="290" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="12" filter="url(#shadow)"/>
  <rect x="660" y="380" width="600" height="55" fill="url(#grad-accent)" rx="12"/>
  <rect x="660" y="425" width="600" height="10" fill="url(#grad-accent)"/>
  <text x="960" y="415" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff" font-family="sans-serif">Need capacity? Parity protection</text>
  <text x="960" y="500" text-anchor="middle" font-size="50" font-weight="bold" fill="#1565c0" font-family="sans-serif">RAID 5/6</text>
  <text x="960" y="565" text-anchor="middle" font-size="16" fill="#555555" font-family="sans-serif">Parity — one/two disk overhead</text>
  <text x="960" y="595" text-anchor="middle" font-size="16" fill="#555555" font-family="sans-serif">Good capacity efficiency, min 3 disks</text>
  <text x="960" y="625" text-anchor="middle" font-size="16" fill="#555555" font-family="sans-serif">Use: NAS, file servers</text>
</svg>

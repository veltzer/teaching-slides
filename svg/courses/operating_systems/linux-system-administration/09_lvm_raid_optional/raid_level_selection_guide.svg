<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="580.645161" height="266.984167" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.516905"/>
  <rect x="40" y="40" width="580.645161" height="50.634981" fill="url(#grad-primary)" rx="6.516905" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="81.42858" width="580.645161" height="9.206402" fill="url(#grad-primary)" rx="6.516905" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330.322477" y="72.222178" text-anchor="middle" font-size="18.877954" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Need speed? No redundancy</text>
  <text x="330.322477" y="150.476136" text-anchor="middle" font-size="56.633645" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">RAID 0</text>
  <text x="330.322477" y="210.317405" text-anchor="middle" font-size="15.102276" fill="var(--text-muted)" font-family="Arial, sans-serif">Striping only — all disks used</text>
  <text x="330.322477" y="237.936496" text-anchor="middle" font-size="15.102276" fill="var(--text-muted)" font-family="Arial, sans-serif">Fastest reads/writes, no fault tolerance</text>
  <text x="330.322477" y="265.555473" text-anchor="middle" font-size="15.102276" fill="var(--text-muted)" font-family="Arial, sans-serif">Use: temp data, scratch space</text>
  <rect x="659.354839" y="40" width="580.645161" height="266.984167" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.516905"/>
  <rect x="659.354839" y="40" width="580.645161" height="50.634981" fill="url(#grad-primary)" rx="6.516905" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="659.354839" y="81.42858" width="580.645161" height="9.206402" fill="url(#grad-primary)" rx="6.516905" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="949.677316" y="72.222178" text-anchor="middle" font-size="18.877954" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Need safety? Simple mirror</text>
  <text x="949.677316" y="150.476136" text-anchor="middle" font-size="56.633645" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">RAID 1</text>
  <text x="949.677316" y="210.317405" text-anchor="middle" font-size="15.102276" fill="var(--text-muted)" font-family="Arial, sans-serif">Full mirror — 50% capacity</text>
  <text x="949.677316" y="237.936496" text-anchor="middle" font-size="15.102276" fill="var(--text-muted)" font-family="Arial, sans-serif">Survives 1 disk failure</text>
  <text x="949.677316" y="265.555473" text-anchor="middle" font-size="15.102276" fill="var(--text-muted)" font-family="Arial, sans-serif">Use: boot, critical data</text>
  <rect x="40" y="353.015833" width="580.645161" height="266.984167" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.516905"/>
  <rect x="40" y="353.015833" width="580.645161" height="50.634981" fill="url(#grad-primary)" rx="6.516905" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="394.444413" width="580.645161" height="9.206402" fill="url(#grad-primary)" rx="6.516905" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330.322477" y="385.238125" text-anchor="middle" font-size="18.877954" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Need both? Best of both worlds</text>
  <text x="330.322477" y="463.491969" text-anchor="middle" font-size="56.633645" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">RAID 10</text>
  <text x="330.322477" y="523.333352" text-anchor="middle" font-size="15.102276" fill="var(--text-muted)" font-family="Arial, sans-serif">Mirror + Stripe — 50% capacity</text>
  <text x="330.322477" y="550.952444" text-anchor="middle" font-size="15.102276" fill="var(--text-muted)" font-family="Arial, sans-serif">Fast and redundant, min 4 disks</text>
  <text x="330.322477" y="578.571535" text-anchor="middle" font-size="15.102276" fill="var(--text-muted)" font-family="Arial, sans-serif">Use: databases, production</text>
  <rect x="659.354839" y="353.015833" width="580.645161" height="266.984167" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.516905"/>
  <rect x="659.354839" y="353.015833" width="580.645161" height="50.634981" fill="url(#grad-primary)" rx="6.516905" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="659.354839" y="394.444413" width="580.645161" height="9.206402" fill="url(#grad-primary)" rx="6.516905" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="949.677316" y="385.238125" text-anchor="middle" font-size="18.877954" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Need capacity? Parity protection</text>
  <text x="949.677316" y="463.491969" text-anchor="middle" font-size="47.194668" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">RAID 5/6</text>
  <text x="949.677316" y="523.333352" text-anchor="middle" font-size="15.102276" fill="var(--text-muted)" font-family="Arial, sans-serif">Parity — one/two disk overhead</text>
  <text x="949.677316" y="550.952444" text-anchor="middle" font-size="15.102276" fill="var(--text-muted)" font-family="Arial, sans-serif">Good capacity efficiency, min 3 disks</text>
  <text x="949.677316" y="578.571535" text-anchor="middle" font-size="15.102276" fill="var(--text-muted)" font-family="Arial, sans-serif">Use: NAS, file servers</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="88.8889" y="44.4444" width="240" height="115.5556" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="88.8889" y="44.4444" width="240" height="40" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="88.8889" y="75.5556" width="240" height="8.8889" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="208.8889" y="69.3333" text-anchor="middle" font-size="15.1111" font-weight="bold" fill="var(--bg)" font-family="monospace">LV: /home</text>
  <text x="208.8889" y="115.5556" text-anchor="middle" font-size="13.3333" fill="var(--text)" font-family="sans-serif">Logical Volume</text>
  <text x="208.8889" y="140.4444" text-anchor="middle" font-size="11.5556" fill="var(--text-muted)" font-family="sans-serif">Resize online</text>
  <rect x="382.2222" y="44.4444" width="240" height="115.5556" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="382.2222" y="44.4444" width="240" height="40" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="382.2222" y="75.5556" width="240" height="8.8889" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="502.2222" y="69.3333" text-anchor="middle" font-size="15.1111" font-weight="bold" fill="var(--bg)" font-family="monospace">LV: /data</text>
  <text x="502.2222" y="115.5556" text-anchor="middle" font-size="13.3333" fill="var(--text)" font-family="sans-serif">Logical Volume</text>
  <text x="502.2222" y="140.4444" text-anchor="middle" font-size="11.5556" fill="var(--text-muted)" font-family="sans-serif">Snapshot support</text>
  <line x1="208.8889" y1="160" x2="320" y2="240" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="502.2222" y1="160" x2="480" y2="240" stroke="var(--text-muted)" stroke-width="1.7778" />
  <rect x="168.8889" y="241.7778" width="497.7778" height="115.5556" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="168.8889" y="241.7778" width="497.7778" height="42.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="168.8889" y="275.5556" width="497.7778" height="8.8889" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="417.7778" y="268.4444" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Volume Group (VG)</text>
  <text x="417.7778" y="318.2222" text-anchor="middle" font-size="13.3333" fill="var(--text)" font-family="sans-serif">vg_data — pool of physical extents (PEs)</text>
  <text x="417.7778" y="339.5556" text-anchor="middle" font-size="11.5556" fill="var(--text-muted)" font-family="sans-serif">vgcreate, vgextend, vgreduce</text>
  <line x1="248.8889" y1="357.3333" x2="191.1111" y2="435.5556" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="417.7778" y1="357.3333" x2="417.7778" y2="435.5556" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="586.6667" y1="357.3333" x2="648.8889" y2="435.5556" stroke="var(--text-muted)" stroke-width="1.7778" />
  <rect x="71.1111" y="437.3333" width="213.3333" height="115.5556" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <text x="177.7778" y="493.3333" text-anchor="middle" font-size="15.1111" font-weight="bold" fill="var(--text)" font-family="monospace">/dev/sda1 (PV)</text>
  <text x="177.7778" y="520" text-anchor="middle" font-size="11.5556" fill="var(--text-muted)" font-family="sans-serif">Physical Volume</text>
  <text x="177.7778" y="536" text-anchor="middle" font-size="11.5556" fill="var(--text-muted)" font-family="sans-serif">pvcreate</text>
  <rect x="312.8889" y="437.3333" width="213.3333" height="115.5556" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <text x="419.5556" y="493.3333" text-anchor="middle" font-size="15.1111" font-weight="bold" fill="var(--text)" font-family="monospace">/dev/sdb1 (PV)</text>
  <text x="419.5556" y="520" text-anchor="middle" font-size="11.5556" fill="var(--text-muted)" font-family="sans-serif">Physical Volume</text>
  <rect x="554.6667" y="437.3333" width="213.3333" height="115.5556" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <text x="661.3333" y="493.3333" text-anchor="middle" font-size="15.1111" font-weight="bold" fill="var(--text)" font-family="monospace">/dev/sdc1 (PV)</text>
  <text x="661.3333" y="520" text-anchor="middle" font-size="11.5556" fill="var(--text-muted)" font-family="sans-serif">Physical Volume</text>
</svg>
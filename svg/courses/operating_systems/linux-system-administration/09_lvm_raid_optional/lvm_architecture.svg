<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="70.612245" y="40" width="413.265306" height="131.818245" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="8.601345" />
  <rect x="70.612245" y="40" width="413.265306" height="45.629359" fill="var(--primary-fill)" rx="8.601345" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="70.612245" y="75.489697" width="413.265306" height="10.139913" fill="var(--primary-fill)" rx="8.601345" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="277.244898" y="68.391657" text-anchor="middle" font-size="21.178662" font-weight="bold" fill="var(--bg)" font-family="monospace">LV: /home</text>
  <text x="277.244898" y="121.119055" text-anchor="middle" font-size="18.686996" fill="var(--text)" font-family="sans-serif">Logical Volume</text>
  <text x="277.244898" y="149.51046" text-anchor="middle" font-size="16.195473" fill="var(--text-muted)" font-family="sans-serif">Resize online</text>
  <rect x="575.714286" y="40" width="413.265306" height="131.818245" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="8.601345" />
  <rect x="575.714286" y="40" width="413.265306" height="45.629359" fill="var(--primary-fill)" rx="8.601345" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="575.714286" y="75.489697" width="413.265306" height="10.139913" fill="var(--primary-fill)" rx="8.601345" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="782.346939" y="68.391657" text-anchor="middle" font-size="21.178662" font-weight="bold" fill="var(--bg)" font-family="monospace">LV: /data</text>
  <text x="782.346939" y="121.119055" text-anchor="middle" font-size="18.686996" fill="var(--text)" font-family="sans-serif">Logical Volume</text>
  <text x="782.346939" y="149.51046" text-anchor="middle" font-size="16.195473" fill="var(--text-muted)" font-family="sans-serif">Snapshot support</text>
  <line x1="277.244898" y1="171.818245" x2="468.571429" y2="263.076962" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="782.346939" y1="171.818245" x2="744.081633" y2="263.076962" stroke="var(--text-muted)" stroke-width="1.7778" />
  <rect x="208.367347" y="265.104919" width="857.142857" height="131.818245" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="8.601345" />
  <rect x="208.367347" y="265.104919" width="857.142857" height="48.671358" fill="var(--primary-fill)" rx="8.601345" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="208.367347" y="303.63649" width="857.142857" height="10.139913" fill="var(--primary-fill)" rx="8.601345" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="636.938776" y="295.524408" text-anchor="middle" font-size="24.91609" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Volume Group (VG)</text>
  <text x="636.938776" y="352.307721" text-anchor="middle" font-size="18.686996" fill="var(--text)" font-family="sans-serif">vg_data — pool of physical extents (PEs)</text>
  <text x="636.938776" y="376.643463" text-anchor="middle" font-size="16.195473" fill="var(--text-muted)" font-family="sans-serif">vgcreate, vgextend, vgreduce</text>
  <line x1="346.122449" y1="396.923038" x2="246.632653" y2="486.153924" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="636.938776" y1="396.923038" x2="636.938776" y2="486.153924" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="927.755102" y1="396.923038" x2="1034.897959" y2="486.153924" stroke="var(--text-muted)" stroke-width="1.7778" />
  <rect x="40" y="488.181755" width="367.346939" height="131.818245" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="8.601345" />

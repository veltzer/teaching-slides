  <rect x="872.653061" y="488.181755" width="367.346939" height="131.818245" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="8.601345" />
  <text x="1056.326531" y="552.062857" text-anchor="middle" font-size="21.178662" font-weight="bold" fill="var(--text)" font-family="monospace">/dev/sdc1 (PV)</text>
  <text x="1056.326531" y="582.482471" text-anchor="middle" font-size="16.195473" fill="var(--text-muted)" font-family="sans-serif">Physical Volume</text>
</svg>
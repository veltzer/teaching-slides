<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- LV layer -->
  <rect x="100" y="50" width="270" height="130" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <rect x="100" y="50" width="270" height="45" fill="url(#grad-accent)" rx="10"/>
  <rect x="100" y="85" width="270" height="10" fill="url(#grad-accent)"/>
  <text x="235" y="78" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff" font-family="monospace">LV: /home</text>
  <text x="235" y="130" text-anchor="middle" font-size="15" fill="#333333" font-family="sans-serif">Logical Volume</text>
  <text x="235" y="158" text-anchor="middle" font-size="13" fill="#555555" font-family="sans-serif">Resize online</text>

  <rect x="430" y="50" width="270" height="130" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <rect x="430" y="50" width="270" height="45" fill="url(#grad-accent)" rx="10"/>
  <rect x="430" y="85" width="270" height="10" fill="url(#grad-accent)"/>
  <text x="565" y="78" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff" font-family="monospace">LV: /data</text>
  <text x="565" y="130" text-anchor="middle" font-size="15" fill="#333333" font-family="sans-serif">Logical Volume</text>
  <text x="565" y="158" text-anchor="middle" font-size="13" fill="#555555" font-family="sans-serif">Snapshot support</text>

  <!-- Lines LV to VG -->
  <line x1="235" y1="180" x2="360" y2="270" stroke="#555555" stroke-width="2"/>
  <line x1="565" y1="180" x2="540" y2="270" stroke="#555555" stroke-width="2"/>

  <!-- VG layer -->
  <rect x="190" y="272" width="560" height="130" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="3" rx="12" filter="url(#shadow)"/>
  <rect x="190" y="272" width="560" height="48" fill="url(#grad-accent)" rx="12"/>
  <rect x="190" y="310" width="560" height="10" fill="url(#grad-accent)"/>
  <text x="470" y="302" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff" font-family="sans-serif">Volume Group (VG)</text>
  <text x="470" y="358" text-anchor="middle" font-size="15" fill="#333333" font-family="sans-serif">vg_data — pool of physical extents (PEs)</text>
  <text x="470" y="382" text-anchor="middle" font-size="13" fill="#555555" font-family="sans-serif">vgcreate, vgextend, vgreduce</text>

  <!-- Lines VG to PVs -->
  <line x1="280" y1="402" x2="215" y2="490" stroke="#555555" stroke-width="2"/>
  <line x1="470" y1="402" x2="470" y2="490" stroke="#555555" stroke-width="2"/>
  <line x1="660" y1="402" x2="730" y2="490" stroke="#555555" stroke-width="2"/>

  <!-- PV layer -->
  <rect x="80" y="492" width="240" height="130" fill="url(#grad-surface)" stroke="#64b5f6" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="200" y="555" text-anchor="middle" font-size="17" font-weight="bold" fill="#333333" font-family="monospace">/dev/sda1 (PV)</text>
  <text x="200" y="585" text-anchor="middle" font-size="13" fill="#555555" font-family="sans-serif">Physical Volume</text>
  <text x="200" y="603" text-anchor="middle" font-size="13" fill="#555555" font-family="sans-serif">pvcreate</text>

  <rect x="352" y="492" width="240" height="130" fill="url(#grad-surface)" stroke="#64b5f6" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="472" y="555" text-anchor="middle" font-size="17" font-weight="bold" fill="#333333" font-family="monospace">/dev/sdb1 (PV)</text>
  <text x="472" y="585" text-anchor="middle" font-size="13" fill="#555555" font-family="sans-serif">Physical Volume</text>

  <rect x="624" y="492" width="240" height="130" fill="url(#grad-surface)" stroke="#64b5f6" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="744" y="555" text-anchor="middle" font-size="17" font-weight="bold" fill="#333333" font-family="monospace">/dev/sdc1 (PV)</text>
  <text x="744" y="585" text-anchor="middle" font-size="13" fill="#555555" font-family="sans-serif">Physical Volume</text>
</svg>

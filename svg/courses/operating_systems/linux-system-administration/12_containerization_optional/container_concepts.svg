<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="367.741935" height="240.923036" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.415861" />
  <rect x="40" y="40" width="367.741935" height="44.615291" fill="url(#grad-primary)" rx="6.415861" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="75.692277" width="367.741935" height="8.923125" fill="url(#grad-primary)" rx="6.415861" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="223.870968" y="68.553755" text-anchor="middle" font-size="16.726683" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Container A</text>
  <text x="223.870968" y="131.015295" text-anchor="middle" font-size="14.868116" fill="var(--text)" font-family="Arial, sans-serif">App + Libs</text>
  <text x="223.870968" y="160.461518" text-anchor="middle" font-size="13.009548" fill="var(--text-muted)" font-family="Arial, sans-serif">Own filesystem</text>
  <text x="223.870968" y="184.553822" text-anchor="middle" font-size="13.009548" fill="var(--text-muted)" font-family="Arial, sans-serif">Own network namespace</text>
  <text x="223.870968" y="208.646125" text-anchor="middle" font-size="13.009548" fill="var(--text-muted)" font-family="Arial, sans-serif">PID isolation</text>
  <text x="223.870968" y="255.938376" text-anchor="middle" font-size="12.080424" fill="var(--primary-accent)" font-family="Arial, sans-serif">cgroups + namespaces</text>
  <rect x="456.129032" y="40" width="367.741935" height="240.923036" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.415861" />
  <rect x="456.129032" y="40" width="367.741935" height="44.615291" fill="url(#grad-primary)" rx="6.415861" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="456.129032" y="75.692277" width="367.741935" height="8.923125" fill="url(#grad-primary)" rx="6.415861" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="68.553755" text-anchor="middle" font-size="16.726683" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Container B</text>
  <text x="640" y="131.015295" text-anchor="middle" font-size="14.868116" fill="var(--text)" font-family="Arial, sans-serif">App + Libs</text>
  <text x="640" y="160.461518" text-anchor="middle" font-size="13.009548" fill="var(--text-muted)" font-family="Arial, sans-serif">Own filesystem</text>
  <text x="640" y="184.553822" text-anchor="middle" font-size="13.009548" fill="var(--text-muted)" font-family="Arial, sans-serif">Own network namespace</text>
  <text x="640" y="208.646125" text-anchor="middle" font-size="13.009548" fill="var(--text-muted)" font-family="Arial, sans-serif">PID isolation</text>
  <text x="640" y="255.938376" text-anchor="middle" font-size="12.080424" fill="var(--primary-accent)" font-family="Arial, sans-serif">cgroups + namespaces</text>
  <rect x="872.258065" y="40" width="367.741935" height="240.923036" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.415861" />
  <rect x="872.258065" y="40" width="367.741935" height="44.615291" fill="url(#grad-primary)" rx="6.415861" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="872.258065" y="75.692277" width="367.741935" height="8.923125" fill="url(#grad-primary)" rx="6.415861" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1056.129032" y="68.553755" text-anchor="middle" font-size="16.726683" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Container C</text>
  <text x="1056.129032" y="131.015295" text-anchor="middle" font-size="14.868116" fill="var(--text)" font-family="Arial, sans-serif">App + Libs</text>
  <text x="1056.129032" y="160.461518" text-anchor="middle" font-size="13.009548" fill="var(--text-muted)" font-family="Arial, sans-serif">Own filesystem</text>
  <text x="1056.129032" y="184.553822" text-anchor="middle" font-size="13.009548" fill="var(--text-muted)" font-family="Arial, sans-serif">Own network namespace</text>
  <text x="1056.129032" y="208.646125" text-anchor="middle" font-size="13.009548" fill="var(--text-muted)" font-family="Arial, sans-serif">PID isolation</text>
  <text x="1056.129032" y="255.938376" text-anchor="middle" font-size="12.080424" fill="var(--primary-accent)" font-family="Arial, sans-serif">cgroups + namespaces</text>
  <rect x="40" y="334.461452" width="1200" height="116.000066" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.415861" />
  <rect x="40" y="334.461452" width="1200" height="42.830799" fill="var(--text-muted)" rx="6.415861" />
  <rect x="40" y="368.369126" width="1200" height="8.923125" fill="var(--text-muted)" rx="6.415861"/>
  <text x="640" y="361.230715" text-anchor="middle" font-size="16.726683" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Container Runtime (Docker / Podman)</text>
  <text x="640" y="405.846006" text-anchor="middle" font-size="13.938885" fill="var(--text)" font-family="Arial, sans-serif">Image management · Container lifecycle · Networking · Volumes</text>
  <text x="640" y="432.615269" text-anchor="middle" font-size="13.009548" fill="var(--text-muted)" font-family="Arial, sans-serif">OCI compliant</text>
  <rect x="40" y="503.999934" width="1200" height="116.000066" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.415861" />
  <rect x="40" y="503.999934" width="1200" height="42.830799" fill="url(#grad-primary)" rx="6.415861" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="537.907608" width="1200" height="8.923125" fill="url(#grad-primary)" rx="6.415861" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="530.769197" text-anchor="middle" font-size="16.726683" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Host OS / Kernel</text>
  <text x="640" y="575.384488" text-anchor="middle" font-size="13.938885" fill="var(--text)" font-family="Arial, sans-serif">Shared kernel — no hypervisor overhead — Namespaces + cgroups</text>
</svg>
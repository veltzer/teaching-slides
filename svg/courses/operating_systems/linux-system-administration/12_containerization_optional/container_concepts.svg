<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Three container boxes -->
  <rect x="20" y="30" width="380" height="270" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="12" filter="url(#shadow)"/>
  <rect x="20" y="30" width="380" height="50" fill="url(#grad-accent)" rx="12"/>
  <rect x="20" y="70" width="380" height="10" fill="url(#grad-accent)"/>
  <text x="210" y="62" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" font-family="sans-serif">Container A</text>
  <text x="210" y="132" text-anchor="middle" font-size="16" fill="#333333" font-family="sans-serif">App + Libs</text>
  <text x="210" y="165" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">Own filesystem</text>
  <text x="210" y="192" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">Own network namespace</text>
  <text x="210" y="219" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">PID isolation</text>
  <text x="210" y="272" text-anchor="middle" font-size="13" fill="#1565c0" font-family="sans-serif">cgroups + namespaces</text>

  <rect x="450" y="30" width="380" height="270" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="12" filter="url(#shadow)"/>
  <rect x="450" y="30" width="380" height="50" fill="url(#grad-accent)" rx="12"/>
  <rect x="450" y="70" width="380" height="10" fill="url(#grad-accent)"/>
  <text x="640" y="62" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" font-family="sans-serif">Container B</text>
  <text x="640" y="132" text-anchor="middle" font-size="16" fill="#333333" font-family="sans-serif">App + Libs</text>
  <text x="640" y="165" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">Own filesystem</text>
  <text x="640" y="192" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">Own network namespace</text>
  <text x="640" y="219" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">PID isolation</text>
  <text x="640" y="272" text-anchor="middle" font-size="13" fill="#1565c0" font-family="sans-serif">cgroups + namespaces</text>

  <rect x="880" y="30" width="380" height="270" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="12" filter="url(#shadow)"/>
  <rect x="880" y="30" width="380" height="50" fill="url(#grad-accent)" rx="12"/>
  <rect x="880" y="70" width="380" height="10" fill="url(#grad-accent)"/>
  <text x="1070" y="62" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" font-family="sans-serif">Container C</text>
  <text x="1070" y="132" text-anchor="middle" font-size="16" fill="#333333" font-family="sans-serif">App + Libs</text>
  <text x="1070" y="165" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">Own filesystem</text>
  <text x="1070" y="192" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">Own network namespace</text>
  <text x="1070" y="219" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">PID isolation</text>
  <text x="1070" y="272" text-anchor="middle" font-size="13" fill="#1565c0" font-family="sans-serif">cgroups + namespaces</text>

  <!-- Container Runtime -->
  <rect x="20" y="360" width="1240" height="130" fill="url(#grad-surface)" stroke="#555555" stroke-width="2" rx="12" filter="url(#shadow)"/>
  <rect x="20" y="360" width="1240" height="48" fill="#555555" rx="12"/>
  <rect x="20" y="398" width="1240" height="10" fill="#555555"/>
  <text x="640" y="390" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" font-family="sans-serif">Container Runtime (Docker / Podman)</text>
  <text x="640" y="440" text-anchor="middle" font-size="15" fill="#333333" font-family="sans-serif">Image management · Container lifecycle · Networking · Volumes</text>
  <text x="640" y="470" text-anchor="middle" font-size="14" fill="#555555" font-family="sans-serif">OCI compliant</text>

  <!-- Host OS -->
  <rect x="20" y="550" width="1240" height="130" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="12" filter="url(#shadow)"/>
  <rect x="20" y="550" width="1240" height="48" fill="url(#grad-accent)" rx="12"/>
  <rect x="20" y="588" width="1240" height="10" fill="url(#grad-accent)"/>
  <text x="640" y="580" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" font-family="sans-serif">Host OS / Kernel</text>
  <text x="640" y="630" text-anchor="middle" font-size="15" fill="#333333" font-family="sans-serif">Shared kernel — no hypervisor overhead — Namespaces + cgroups</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="58.75" y="64.1667" width="356.25" height="217.5" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="58.75" y="64.1667" width="356.25" height="40.2777" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="58.75" y="96.3889" width="356.25" height="8.0556" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="236.875" y="89.9444" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Container A</text>
  <text x="236.875" y="146.3333" text-anchor="middle" font-size="13.9044" fill="var(--text)" font-family="sans-serif">App + Libs</text>
  <text x="236.875" y="172.9167" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)" font-family="sans-serif">Own filesystem</text>
  <text x="236.875" y="194.6667" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)" font-family="sans-serif">Own network namespace</text>
  <text x="236.875" y="216.4167" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)" font-family="sans-serif">PID isolation</text>
  <text x="236.875" y="259.1111" text-anchor="middle" font-size="11.2974" fill="var(--primary-accent)" font-family="sans-serif">cgroups + namespaces</text>
  <rect x="461.875" y="64.1667" width="356.25" height="217.5" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="461.875" y="64.1667" width="356.25" height="40.2777" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="461.875" y="96.3889" width="356.25" height="8.0556" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="89.9444" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Container B</text>
  <text x="640" y="146.3333" text-anchor="middle" font-size="13.9044" fill="var(--text)" font-family="sans-serif">App + Libs</text>
  <text x="640" y="172.9167" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)" font-family="sans-serif">Own filesystem</text>
  <text x="640" y="194.6667" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)" font-family="sans-serif">Own network namespace</text>
  <text x="640" y="216.4167" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)" font-family="sans-serif">PID isolation</text>
  <text x="640" y="259.1111" text-anchor="middle" font-size="11.2974" fill="var(--primary-accent)" font-family="sans-serif">cgroups + namespaces</text>
  <rect x="865" y="64.1667" width="356.25" height="217.5" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="865" y="64.1667" width="356.25" height="40.2777" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="865" y="96.3889" width="356.25" height="8.0556" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1043.125" y="89.9444" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Container C</text>
  <text x="1043.125" y="146.3333" text-anchor="middle" font-size="13.9044" fill="var(--text)" font-family="sans-serif">App + Libs</text>
  <text x="1043.125" y="172.9167" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)" font-family="sans-serif">Own filesystem</text>
  <text x="1043.125" y="194.6667" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)" font-family="sans-serif">Own network namespace</text>
  <text x="1043.125" y="216.4167" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)" font-family="sans-serif">PID isolation</text>
  <text x="1043.125" y="259.1111" text-anchor="middle" font-size="11.2974" fill="var(--primary-accent)" font-family="sans-serif">cgroups + namespaces</text>
  <rect x="58.75" y="330" width="1162.5" height="104.7223" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="58.75" y="330" width="1162.5" height="38.6667" fill="var(--text-muted)" rx="6" />
  <rect x="58.75" y="360.6111" width="1162.5" height="8.0556" fill="var(--text-muted)" rx="6"/>
  <text x="640" y="354.1667" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Container Runtime (Docker / Podman)</text>
  <text x="640" y="394.4444" text-anchor="middle" font-size="13.0354" fill="var(--text)" font-family="sans-serif">Image management · Container lifecycle · Networking · Volumes</text>
  <text x="640" y="418.6111" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)" font-family="sans-serif">OCI compliant</text>
  <rect x="58.75" y="483.0556" width="1162.5" height="104.7223" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="58.75" y="483.0556" width="1162.5" height="38.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="58.75" y="513.6667" width="1162.5" height="8.0556" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="507.2223" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Host OS / Kernel</text>
  <text x="640" y="547.5" text-anchor="middle" font-size="13.0354" fill="var(--text)" font-family="sans-serif">Shared kernel — no hypervisor overhead — Namespaces + cgroups</text>
</svg>
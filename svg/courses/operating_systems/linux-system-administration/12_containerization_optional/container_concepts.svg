  <text x="640" y="160.461518" text-anchor="middle" font-size="13.009548" fill="var(--text-muted)" font-family="sans-serif">Own filesystem</text>
  <text x="640" y="184.553822" text-anchor="middle" font-size="13.009548" fill="var(--text-muted)" font-family="sans-serif">Own network namespace</text>
  <text x="640" y="208.646125" text-anchor="middle" font-size="13.009548" fill="var(--text-muted)" font-family="sans-serif">PID isolation</text>
  <text x="640" y="255.938376" text-anchor="middle" font-size="12.080424" fill="var(--primary-accent)" font-family="sans-serif">cgroups + namespaces</text>
  <rect x="872.258065" y="40" width="367.741935" height="240.923036" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.415861" />
  <rect x="872.258065" y="40" width="367.741935" height="44.615291" fill="var(--primary-fill)" rx="6.415861" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="872.258065" y="75.692277" width="367.741935" height="8.923125" fill="var(--primary-fill)" rx="6.415861" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1056.129032" y="68.553755" text-anchor="middle" font-size="16.726683" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Container C</text>
  <text x="1056.129032" y="131.015295" text-anchor="middle" font-size="14.868116" fill="var(--text)" font-family="sans-serif">App + Libs</text>
  <text x="1056.129032" y="160.461518" text-anchor="middle" font-size="13.009548" fill="var(--text-muted)" font-family="sans-serif">Own filesystem</text>
  <text x="1056.129032" y="184.553822" text-anchor="middle" font-size="13.009548" fill="var(--text-muted)" font-family="sans-serif">Own network namespace</text>

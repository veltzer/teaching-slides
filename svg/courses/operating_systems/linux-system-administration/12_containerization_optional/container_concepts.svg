  <text x="640" y="361.230715" text-anchor="middle" font-size="16.726683" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Container Runtime (Docker / Podman)</text>
  <text x="640" y="405.846006" text-anchor="middle" font-size="13.938885" fill="var(--text)" font-family="sans-serif">Image management · Container lifecycle · Networking · Volumes</text>
  <text x="640" y="432.615269" text-anchor="middle" font-size="13.009548" fill="var(--text-muted)" font-family="sans-serif">OCI compliant</text>

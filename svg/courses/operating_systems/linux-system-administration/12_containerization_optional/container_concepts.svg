  <rect x="40" y="537.907608" width="1200" height="8.923125" fill="var(--primary-fill)" rx="6.415861" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="530.769197" text-anchor="middle" font-size="16.726683" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Host OS / Kernel</text>
  <text x="640" y="575.384488" text-anchor="middle" font-size="13.938885" fill="var(--text)" font-family="sans-serif">Shared kernel — no hypervisor overhead — Namespaces + cgroups</text>

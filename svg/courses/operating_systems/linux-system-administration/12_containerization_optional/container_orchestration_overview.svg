<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="58.75" y="64.1667" width="375" height="104.7223" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="58.75" y="64.1667" width="375" height="38.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="58.75" y="94.7777" width="375" height="8.0556" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="246.25" y="89.9444" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Docker Compose</text>
  <text x="246.25" y="135.0556" text-anchor="middle" font-size="13.0354" fill="var(--text)" font-family="sans-serif">Single host, simple apps</text>
  <text x="246.25" y="154.3889" text-anchor="middle" font-size="11.2974" fill="var(--text-muted)" font-family="sans-serif">YAML definition</text>
  <rect x="452.5" y="64.1667" width="375" height="104.7223" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="452.5" y="64.1667" width="375" height="38.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="452.5" y="94.7777" width="375" height="8.0556" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="89.9444" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Docker Swarm</text>
  <text x="640" y="135.0556" text-anchor="middle" font-size="13.0354" fill="var(--text)" font-family="sans-serif">Multi-host, built into Docker</text>
  <text x="640" y="154.3889" text-anchor="middle" font-size="11.2974" fill="var(--text-muted)" font-family="sans-serif">Simple clustering</text>
  <rect x="846.2499" y="64.1667" width="375" height="104.7223" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="846.2499" y="64.1667" width="375" height="38.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="846.2499" y="94.7777" width="375" height="8.0556" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1033.75" y="89.9444" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Kubernetes</text>
  <text x="1033.75" y="135.0556" text-anchor="middle" font-size="13.0354" fill="var(--text)" font-family="sans-serif">Production-grade, complex</text>
  <text x="1033.75" y="154.3889" text-anchor="middle" font-size="11.2974" fill="var(--text-muted)" font-family="sans-serif">CNCF standard</text>
  <line x1="115" y1="241.3889" x2="1165" y2="241.3889" stroke="var(--primary-border)" stroke-width="1.7778" stroke-dasharray="7.1111 3.5556" marker-end="url(#arrow)" />
  <text x="115" y="231.7223" font-size="13.9044" fill="var(--text-muted)" font-family="sans-serif">Simple</text>
  <text x="1071.25" y="231.7223" font-size="13.9044" fill="var(--text-muted)" font-family="sans-serif">Complex</text>
  <rect x="58.75" y="273.6111" width="1162.5" height="249.7223" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="58.75" y="273.6111" width="1162.5" height="40.2777" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="58.75" y="305.8333" width="1162.5" height="8.0556" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="299.3889" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Common Orchestration Features</text>
  <text x="640" y="358.1944" text-anchor="middle" font-size="14.7735" fill="var(--text)" font-family="sans-serif">Service discovery | Load balancing | Rolling updates</text>
  <text x="640" y="386.3889" text-anchor="middle" font-size="14.7735" fill="var(--text)" font-family="sans-serif">Self-healing | Auto-scaling | Secret management</text>
  <text x="640" y="422.6389" text-anchor="middle" font-size="14.7735" fill="var(--text)" font-family="sans-serif">Health checks | Resource limits | Persistent volumes</text>
  <text x="640" y="475" text-anchor="middle" font-size="13.0354" fill="var(--text-muted)" font-family="sans-serif">Choose based on scale, team expertise, and operational requirements</text>
</svg>
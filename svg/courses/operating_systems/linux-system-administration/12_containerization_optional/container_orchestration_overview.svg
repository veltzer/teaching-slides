<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="387.096774" height="132.28079" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.851319"/>
  <rect x="40" y="40" width="387.096774" height="48.842144" fill="url(#grad-primary)" rx="6.851319" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="78.666524" width="387.096774" height="10.175494" fill="url(#grad-primary)" rx="6.851319" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="233.548387" y="72.561303" text-anchor="middle" font-size="19.846673" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Docker Compose</text>
  <text x="233.548387" y="129.543867" text-anchor="middle" font-size="14.884948" fill="var(--text)" font-family="Arial, sans-serif">Single host, simple apps</text>
  <text x="233.548387" y="153.964876" text-anchor="middle" font-size="12.900349" fill="var(--text-muted)" font-family="Arial, sans-serif">YAML definition</text>
  <rect x="446.451613" y="40" width="387.096774" height="132.28079" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.851319"/>
  <rect x="446.451613" y="40" width="387.096774" height="48.842144" fill="url(#grad-primary)" rx="6.851319" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="446.451613" y="78.666524" width="387.096774" height="10.175494" fill="url(#grad-primary)" rx="6.851319" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="72.561303" text-anchor="middle" font-size="19.846673" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Docker Swarm</text>
  <text x="640" y="129.543867" text-anchor="middle" font-size="14.884948" fill="var(--text)" font-family="Arial, sans-serif">Multi-host, built into Docker</text>
  <text x="640" y="153.964876" text-anchor="middle" font-size="12.900349" fill="var(--text-muted)" font-family="Arial, sans-serif">Simple clustering</text>
  <rect x="852.903123" y="40" width="387.096774" height="132.28079" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.851319"/>
  <rect x="852.903123" y="40" width="387.096774" height="48.842144" fill="url(#grad-primary)" rx="6.851319" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="852.903123" y="78.666524" width="387.096774" height="10.175494" fill="url(#grad-primary)" rx="6.851319" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1046.451613" y="72.561303" text-anchor="middle" font-size="19.846673" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Kubernetes</text>
  <text x="1046.451613" y="129.543867" text-anchor="middle" font-size="14.884948" fill="var(--text)" font-family="Arial, sans-serif">Production-grade, complex</text>
  <text x="1046.451613" y="153.964876" text-anchor="middle" font-size="12.900349" fill="var(--text-muted)" font-family="Arial, sans-serif">CNCF standard</text>
  <line x1="98.064516" y1="263.859605" x2="1181.935484" y2="263.859605" stroke="var(--primary-border)" stroke-width="1.7778" stroke-dasharray="7.1111 3.5556" marker-end="url(#arrow)"/>
  <text x="98.064516" y="251.649164" font-size="15.877247" fill="var(--text-muted)" font-family="Arial, sans-serif">Simple</text>
  <text x="1085.16129" y="251.649164" font-size="15.877247" fill="var(--text-muted)" font-family="Arial, sans-serif">Complex</text>
  <rect x="40" y="304.561328" width="1200" height="315.438672" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.851319"/>
  <rect x="40" y="304.561328" width="1200" height="50.877091" fill="url(#grad-primary)" rx="6.851319" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="345.263052" width="1200" height="10.175494" fill="url(#grad-primary)" rx="6.851319" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="337.122757" text-anchor="middle" font-size="17.86196" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Common Orchestration Features</text>
  <text x="640" y="411.403384" text-anchor="middle" font-size="16.869661" fill="var(--text)" font-family="Arial, sans-serif">Service discovery | Load balancing | Rolling updates</text>
  <text x="640" y="447.017486" text-anchor="middle" font-size="16.869661" fill="var(--text)" font-family="Arial, sans-serif">Self-healing | Auto-scaling | Secret management</text>
  <text x="640" y="492.806957" text-anchor="middle" font-size="16.869661" fill="var(--text)" font-family="Arial, sans-serif">Health checks | Resource limits | Persistent volumes</text>
  <text x="640" y="558.947289" text-anchor="middle" font-size="14.884948" fill="var(--text-muted)" font-family="Arial, sans-serif">Choose based on scale, team expertise, and operational requirements</text>
</svg>

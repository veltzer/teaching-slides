<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="17.7778" y="26.6667" width="355.5556" height="115.5556" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="17.7778" y="26.6667" width="355.5556" height="42.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="17.7778" y="60.4444" width="355.5556" height="8.8889" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="195.5556" y="55.1111" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Docker Compose</text>
  <text x="195.5556" y="104.8889" text-anchor="middle" font-size="13.3333" fill="var(--text)" font-family="sans-serif">Single host, simple apps</text>
  <text x="195.5556" y="126.2222" text-anchor="middle" font-size="11.5556" fill="var(--text-muted)" font-family="sans-serif">YAML definition</text>
  <rect x="391.1111" y="26.6667" width="355.5556" height="115.5556" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="391.1111" y="26.6667" width="355.5556" height="42.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="391.1111" y="60.4444" width="355.5556" height="8.8889" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="568.8889" y="55.1111" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Docker Swarm</text>
  <text x="568.8889" y="104.8889" text-anchor="middle" font-size="13.3333" fill="var(--text)" font-family="sans-serif">Multi-host, built into Docker</text>
  <text x="568.8889" y="126.2222" text-anchor="middle" font-size="11.5556" fill="var(--text-muted)" font-family="sans-serif">Simple clustering</text>
  <rect x="764.4444" y="26.6667" width="355.5556" height="115.5556" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="764.4444" y="26.6667" width="355.5556" height="42.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="764.4444" y="60.4444" width="355.5556" height="8.8889" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="942.2222" y="55.1111" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Kubernetes</text>
  <text x="942.2222" y="104.8889" text-anchor="middle" font-size="13.3333" fill="var(--text)" font-family="sans-serif">Production-grade, complex</text>
  <text x="942.2222" y="126.2222" text-anchor="middle" font-size="11.5556" fill="var(--text-muted)" font-family="sans-serif">CNCF standard</text>
  <line x1="71.1111" y1="222.2222" x2="1066.6667" y2="222.2222" stroke="var(--primary-border)" stroke-width="1.7778" stroke-dasharray="7.1111 3.5556" marker-end="url(#arrow)" />
  <text x="71.1111" y="211.5556" font-size="14.2222" fill="var(--text-muted)" font-family="sans-serif">Simple</text>
  <text x="977.7778" y="211.5556" font-size="14.2222" fill="var(--text-muted)" font-family="sans-serif">Complex</text>
  <rect x="17.7778" y="257.7778" width="1102.2222" height="275.5556" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="17.7778" y="257.7778" width="1102.2222" height="44.4444" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="17.7778" y="293.3333" width="1102.2222" height="8.8889" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="568.8889" y="286.2222" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Common Orchestration Features</text>
  <text x="568.8889" y="351.1111" text-anchor="middle" font-size="15.1111" fill="var(--text)" font-family="sans-serif">Service discovery | Load balancing | Rolling updates</text>
  <text x="568.8889" y="382.2222" text-anchor="middle" font-size="15.1111" fill="var(--text)" font-family="sans-serif">Self-healing | Auto-scaling | Secret management</text>
  <text x="568.8889" y="422.2222" text-anchor="middle" font-size="15.1111" fill="var(--text)" font-family="sans-serif">Health checks | Resource limits | Persistent volumes</text>
  <text x="568.8889" y="480" text-anchor="middle" font-size="13.3333" fill="var(--text-muted)" font-family="sans-serif">Choose based on scale, team expertise, and operational requirements</text>
</svg>
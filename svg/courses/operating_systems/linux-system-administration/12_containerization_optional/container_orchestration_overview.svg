<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="387.096774" height="132.28079" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.851319" filter="url(#shadow)" />
  <rect x="40" y="40" width="387.096774" height="48.842144" fill="var(--primary-fill)" rx="6.851319" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="40" y="78.666524" width="387.096774" height="10.175494" fill="var(--primary-fill)" rx="6.851319" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="233.548387" y="72.561303" text-anchor="middle" font-size="19.846673" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Docker Compose</text>
  <text x="233.548387" y="129.543867" text-anchor="middle" font-size="14.884948" fill="var(--text)" font-family="sans-serif">Single host, simple apps</text>
  <text x="233.548387" y="153.964876" text-anchor="middle" font-size="12.900349" fill="var(--text-muted)" font-family="sans-serif">YAML definition</text>
  <rect x="446.451613" y="40" width="387.096774" height="132.28079" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.851319" filter="url(#shadow)" />
  <rect x="446.451613" y="40" width="387.096774" height="48.842144" fill="var(--primary-fill)" rx="6.851319" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="446.451613" y="78.666524" width="387.096774" height="10.175494" fill="var(--primary-fill)" rx="6.851319" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="72.561303" text-anchor="middle" font-size="19.846673" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Docker Swarm</text>
  <text x="640" y="129.543867" text-anchor="middle" font-size="14.884948" fill="var(--text)" font-family="sans-serif">Multi-host, built into Docker</text>
  <text x="640" y="153.964876" text-anchor="middle" font-size="12.900349" fill="var(--text-muted)" font-family="sans-serif">Simple clustering</text>
  <rect x="852.903123" y="40" width="387.096774" height="132.28079" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.851319" filter="url(#shadow)" />
  <rect x="852.903123" y="40" width="387.096774" height="48.842144" fill="var(--primary-fill)" rx="6.851319" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="852.903123" y="78.666524" width="387.096774" height="10.175494" fill="var(--primary-fill)" rx="6.851319" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1046.451613" y="72.561303" text-anchor="middle" font-size="19.846673" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Kubernetes</text>
  <text x="1046.451613" y="129.543867" text-anchor="middle" font-size="14.884948" fill="var(--text)" font-family="sans-serif">Production-grade, complex</text>
  <text x="1046.451613" y="153.964876" text-anchor="middle" font-size="12.900349" fill="var(--text-muted)" font-family="sans-serif">CNCF standard</text>
  <line x1="98.064516" y1="263.859605" x2="1181.935484" y2="263.859605" stroke="var(--primary-border)" stroke-width="1.7778" stroke-dasharray="7.1111 3.5556" marker-end="url(#arrow)" />
  <text x="98.064516" y="251.649164" font-size="15.877247" fill="var(--text-muted)" font-family="sans-serif">Simple</text>
  <text x="1085.16129" y="251.649164" font-size="15.877247" fill="var(--text-muted)" font-family="sans-serif">Complex</text>
  <rect x="40" y="304.561328" width="1200" height="315.438672" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.851319" filter="url(#shadow)" />
  <rect x="40" y="304.561328" width="1200" height="50.877091" fill="var(--primary-fill)" rx="6.851319" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="40" y="345.263052" width="1200" height="10.175494" fill="var(--primary-fill)" rx="6.851319" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="337.122757" text-anchor="middle" font-size="17.86196" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Common Orchestration Features</text>
  <text x="640" y="411.403384" text-anchor="middle" font-size="16.869661" fill="var(--text)" font-family="sans-serif">Service discovery | Load balancing | Rolling updates</text>
  <text x="640" y="447.017486" text-anchor="middle" font-size="16.869661" fill="var(--text)" font-family="sans-serif">Self-healing | Auto-scaling | Secret management</text>
  <text x="640" y="492.806957" text-anchor="middle" font-size="16.869661" fill="var(--text)" font-family="sans-serif">Health checks | Resource limits | Persistent volumes</text>
  <text x="640" y="558.947289" text-anchor="middle" font-size="14.884948" fill="var(--text-muted)" font-family="sans-serif">Choose based on scale, team expertise, and operational requirements</text>
</svg>
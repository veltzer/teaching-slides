<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Application box -->
  <rect x="20" y="220" width="220" height="260" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="12" filter="url(#shadow)"/>
  <rect x="20" y="220" width="220" height="50" fill="url(#grad-accent)" rx="12"/>
  <rect x="20" y="260" width="220" height="10" fill="url(#grad-accent)"/>
  <text x="130" y="252" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" font-family="sans-serif">Application</text>
  <text x="130" y="315" text-anchor="middle" font-size="15" fill="#333333" font-family="sans-serif">getpwnam()</text>
  <text x="130" y="345" text-anchor="middle" font-size="15" fill="#333333" font-family="sans-serif">getgrnam()</text>
  <text x="130" y="395" text-anchor="middle" font-size="13" fill="#555555" font-family="sans-serif">POSIX calls</text>

  <!-- Arrow to NSS -->
  <line x1="240" y1="350" x2="318" y2="350" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>

  <!-- NSS box -->
  <rect x="320" y="220" width="200" height="260" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="12" filter="url(#shadow)"/>
  <rect x="320" y="220" width="200" height="50" fill="url(#grad-accent)" rx="12"/>
  <rect x="320" y="260" width="200" height="10" fill="url(#grad-accent)"/>
  <text x="420" y="252" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" font-family="sans-serif">NSS</text>
  <text x="420" y="315" text-anchor="middle" font-size="15" fill="#333333" font-family="sans-serif">Name Service</text>
  <text x="420" y="340" text-anchor="middle" font-size="15" fill="#333333" font-family="sans-serif">Switch</text>
  <text x="420" y="380" text-anchor="middle" font-size="13" fill="#555555" font-family="sans-serif">nsswitch.conf</text>
  <text x="420" y="405" text-anchor="middle" font-size="13" fill="#555555" font-family="sans-serif">Routes lookups</text>

  <!-- Arrow to /etc/passwd -->
  <line x1="520" y1="300" x2="598" y2="200" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <!-- /etc/passwd box -->
  <rect x="600" y="90" width="280" height="200" fill="url(#grad-surface)" stroke="#64b5f6" stroke-width="2" rx="12" filter="url(#shadow)"/>
  <rect x="600" y="90" width="280" height="50" fill="#64b5f6" rx="12"/>
  <rect x="600" y="130" width="280" height="10" fill="#64b5f6"/>
  <text x="740" y="122" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff" font-family="sans-serif">/etc/passwd</text>
  <text x="740" y="180" text-anchor="middle" font-size="15" fill="#333333" font-family="sans-serif">Local users</text>
  <text x="740" y="208" text-anchor="middle" font-size="13" fill="#555555" font-family="sans-serif">/etc/shadow</text>
  <text x="740" y="228" text-anchor="middle" font-size="13" fill="#555555" font-family="sans-serif">/etc/group</text>
  <text x="740" y="260" text-anchor="middle" font-size="13" fill="#555555" font-family="sans-serif">Traditional files</text>

  <!-- Arrow to LDAP -->
  <line x1="520" y1="420" x2="598" y2="480" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <!-- LDAP Server box -->
  <rect x="600" y="390" width="280" height="200" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="12" filter="url(#shadow)"/>
  <rect x="600" y="390" width="280" height="50" fill="url(#grad-accent)" rx="12"/>
  <rect x="600" y="430" width="280" height="10" fill="url(#grad-accent)"/>
  <text x="740" y="422" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff" font-family="sans-serif">LDAP Server</text>
  <text x="740" y="480" text-anchor="middle" font-size="15" fill="#333333" font-family="sans-serif">Centralized directory</text>
  <text x="740" y="510" text-anchor="middle" font-size="13" fill="#555555" font-family="sans-serif">OpenLDAP / AD</text>
  <text x="740" y="535" text-anchor="middle" font-size="13" fill="#555555" font-family="sans-serif">nss-pam-ldapd</text>
  <text x="740" y="558" text-anchor="middle" font-size="13" fill="#555555" font-family="sans-serif">Scale across hosts</text>
</svg>

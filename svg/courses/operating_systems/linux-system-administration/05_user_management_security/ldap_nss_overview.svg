<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="190.800104" width="306.976744" height="301.599919" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="8.783917" />
  <rect x="40" y="190.800104" width="306.976744" height="57.999885" fill="var(--primary-fill)" rx="8.783917" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="237.199925" width="306.976744" height="11.600063" fill="var(--primary-fill)" rx="8.783917" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="193.488372" y="227.91999" text-anchor="middle" font-size="22.900405" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Application</text>
  <text x="193.488372" y="300.999986" text-anchor="middle" font-size="19.083646" fill="var(--text)" font-family="sans-serif">getpwnam()</text>
  <text x="193.488372" y="335.800032" text-anchor="middle" font-size="19.083646" fill="var(--text)" font-family="sans-serif">getgrnam()</text>
  <text x="193.488372" y="393.799916" text-anchor="middle" font-size="16.539238" fill="var(--text-muted)" font-family="sans-serif">POSIX calls</text>
  <line x1="346.976744" y1="341.599919" x2="455.813953" y2="341.599919" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="458.604502" y="190.800104" width="279.069767" height="301.599919" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="8.783917" />
  <rect x="458.604502" y="190.800104" width="279.069767" height="57.999885" fill="var(--primary-fill)" rx="8.783917" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="458.604502" y="237.199925" width="279.069767" height="11.600063" fill="var(--primary-fill)" rx="8.783917" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="598.139535" y="227.91999" text-anchor="middle" font-size="22.900405" font-weight="bold" fill="var(--bg)" font-family="sans-serif">NSS</text>
  <text x="598.139535" y="300.999986" text-anchor="middle" font-size="19.083646" fill="var(--text)" font-family="sans-serif">Name Service</text>
  <text x="598.139535" y="330" text-anchor="middle" font-size="19.083646" fill="var(--text)" font-family="sans-serif">Switch</text>
  <text x="598.139535" y="376.399965" text-anchor="middle" font-size="16.539238" fill="var(--text-muted)" font-family="sans-serif">nsswitch.conf</text>
  <text x="598.139535" y="405.39998" text-anchor="middle" font-size="16.539238" fill="var(--text-muted)" font-family="sans-serif">Routes lookups</text>
  <line x1="737.674419" y1="283.600035" x2="846.511628" y2="167.599977" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="849.302326" y="40" width="390.697674" height="231.999971" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="8.783917" />
  <rect x="849.302326" y="40" width="390.697674" height="57.999885" fill="var(--primary-fill)" rx="8.783917" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="849.302326" y="86.400109" width="390.697674" height="11.600063" fill="var(--primary-fill)" rx="8.783917" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1044.651163" y="77.119886" text-anchor="middle" font-size="21.628201" font-weight="bold" fill="var(--bg)" font-family="sans-serif">/etc/passwd</text>
  <text x="1044.651163" y="144.399994" text-anchor="middle" font-size="19.083646" fill="var(--text)" font-family="sans-serif">Local users</text>
  <text x="1044.651163" y="176.880056" text-anchor="middle" font-size="16.539238" fill="var(--text-muted)" font-family="sans-serif">/etc/shadow</text>
  <text x="1044.651163" y="200.080039" text-anchor="middle" font-size="16.539238" fill="var(--text-muted)" font-family="sans-serif">/etc/group</text>
  <text x="1044.651163" y="237.199925" text-anchor="middle" font-size="16.539238" fill="var(--text-muted)" font-family="sans-serif">Traditional files</text>
  <line x1="737.674419" y1="422.799931" x2="846.511628" y2="492.400023" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="849.302326" y="388.000029" width="390.697674" height="231.999971" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="8.783917" />
  <rect x="849.302326" y="388.000029" width="390.697674" height="57.999885" fill="var(--primary-fill)" rx="8.783917" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="849.302326" y="434.399994" width="390.697674" height="11.600063" fill="var(--primary-fill)" rx="8.783917" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1044.651163" y="425.119915" text-anchor="middle" font-size="21.628201" font-weight="bold" fill="var(--bg)" font-family="sans-serif">LDAP Server</text>
  <text x="1044.651163" y="492.400023" text-anchor="middle" font-size="19.083646" fill="var(--text)" font-family="sans-serif">Centralized directory</text>
  <text x="1044.651163" y="527.199925" text-anchor="middle" font-size="16.539238" fill="var(--text-muted)" font-family="sans-serif">OpenLDAP / AD</text>
  <text x="1044.651163" y="556.200084" text-anchor="middle" font-size="16.539238" fill="var(--text-muted)" font-family="sans-serif">nss-pam-ldapd</text>
  <text x="1044.651163" y="582.87997" text-anchor="middle" font-size="16.539238" fill="var(--text-muted)" font-family="sans-serif">Scale across hosts</text>
</svg>
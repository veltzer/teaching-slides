<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="58.75" y="217.2223" width="206.25" height="209.4444" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="58.75" y="217.2223" width="206.25" height="40.2777" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="58.75" y="249.4444" width="206.25" height="8.0556" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="161.875" y="243" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Application</text>
  <text x="161.875" y="293.75" text-anchor="middle" font-size="13.0354" fill="var(--text)" font-family="sans-serif">getpwnam()</text>
  <text x="161.875" y="317.9167" text-anchor="middle" font-size="13.0354" fill="var(--text)" font-family="sans-serif">getgrnam()</text>
  <text x="161.875" y="358.1944" text-anchor="middle" font-size="11.2974" fill="var(--text-muted)" font-family="sans-serif">POSIX calls</text>
  <line x1="265" y1="321.9444" x2="338.125" y2="321.9444" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="339.9999" y="217.2223" width="187.5" height="209.4444" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="339.9999" y="217.2223" width="187.5" height="40.2777" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="339.9999" y="249.4444" width="187.5" height="8.0556" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="433.75" y="243" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--bg)" font-family="sans-serif">NSS</text>
  <text x="433.75" y="293.75" text-anchor="middle" font-size="13.0354" fill="var(--text)" font-family="sans-serif">Name Service</text>
  <text x="433.75" y="313.8889" text-anchor="middle" font-size="13.0354" fill="var(--text)" font-family="sans-serif">Switch</text>
  <text x="433.75" y="346.1111" text-anchor="middle" font-size="11.2974" fill="var(--text-muted)" font-family="sans-serif">nsswitch.conf</text>
  <text x="433.75" y="366.25" text-anchor="middle" font-size="11.2974" fill="var(--text-muted)" font-family="sans-serif">Routes lookups</text>
  <line x1="527.5" y1="281.6667" x2="600.625" y2="201.1111" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="602.5" y="112.5" width="262.5" height="161.1111" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="602.5" y="112.5" width="262.5" height="40.2777" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="602.5" y="144.7223" width="262.5" height="8.0556" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="733.75" y="138.2777" text-anchor="middle" font-size="14.7735" font-weight="bold" fill="var(--bg)" font-family="sans-serif">/etc/passwd</text>
  <text x="733.75" y="185" text-anchor="middle" font-size="13.0354" fill="var(--text)" font-family="sans-serif">Local users</text>
  <text x="733.75" y="207.5556" text-anchor="middle" font-size="11.2974" fill="var(--text-muted)" font-family="sans-serif">/etc/shadow</text>
  <text x="733.75" y="223.6667" text-anchor="middle" font-size="11.2974" fill="var(--text-muted)" font-family="sans-serif">/etc/group</text>
  <text x="733.75" y="249.4444" text-anchor="middle" font-size="11.2974" fill="var(--text-muted)" font-family="sans-serif">Traditional files</text>
  <line x1="527.5" y1="378.3333" x2="600.625" y2="426.6667" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="602.5" y="354.1667" width="262.5" height="161.1111" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="602.5" y="354.1667" width="262.5" height="40.2777" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="602.5" y="386.3889" width="262.5" height="8.0556" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="733.75" y="379.9444" text-anchor="middle" font-size="14.7735" font-weight="bold" fill="var(--bg)" font-family="sans-serif">LDAP Server</text>
  <text x="733.75" y="426.6667" text-anchor="middle" font-size="13.0354" fill="var(--text)" font-family="sans-serif">Centralized directory</text>
  <text x="733.75" y="450.8333" text-anchor="middle" font-size="11.2974" fill="var(--text-muted)" font-family="sans-serif">OpenLDAP / AD</text>
  <text x="733.75" y="470.9723" text-anchor="middle" font-size="11.2974" fill="var(--text-muted)" font-family="sans-serif">nss-pam-ldapd</text>
  <text x="733.75" y="489.5" text-anchor="middle" font-size="11.2974" fill="var(--text-muted)" font-family="sans-serif">Scale across hosts</text>
</svg>
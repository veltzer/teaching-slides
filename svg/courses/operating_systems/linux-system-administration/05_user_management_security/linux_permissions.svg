<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Courier New, monospace" font-size="36.968782899778" fill="var(--text)">-rwxr-xr--</text>

  <rect x="80" y="61.090909090909" width="60" height="52.727272727273" rx="8.21528508884" fill="var(--surface)" stroke="var(--border)"/>
  <text x="110" y="98" text-anchor="middle" font-family="Courier New, monospace" font-size="24.645855266519" fill="var(--text-muted)">-</text>
  <text x="110" y="134.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.322927633259" fill="var(--text-muted)">type</text>
  <text x="110" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.322927633259" fill="var(--text-muted)">- file, d dir, l link</text>

  <rect x="180" y="61.090909090909" width="180" height="52.727272727273" rx="8.21528508884" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="270" y="98" text-anchor="middle" font-family="Courier New, monospace" font-size="24.645855266519" font-weight="bold" fill="var(--primary-text)">rwx</text>
  <text x="270" y="134.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838269364" font-weight="bold" fill="var(--text)">Owner</text>
  <text x="270" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.322927633259" fill="var(--text-muted)">read+write+exec</text>

  <rect x="400" y="61.090909090909" width="180" height="52.727272727273" rx="8.21528508884" fill="var(--surface)" stroke="var(--border)"/>
  <text x="490" y="98" text-anchor="middle" font-family="Courier New, monospace" font-size="24.645855266519" font-weight="bold" fill="var(--text)">r-x</text>
  <text x="490" y="134.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838269364" font-weight="bold" fill="var(--text)">Group</text>
  <text x="490" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.322927633259" fill="var(--text-muted)">read+exec</text>

  <rect x="620" y="61.090909090909" width="180" height="52.727272727273" rx="8.21528508884" fill="var(--surface)" stroke="var(--border)"/>
  <text x="710" y="98" text-anchor="middle" font-family="Courier New, monospace" font-size="24.645855266519" font-weight="bold" fill="var(--text-muted)">r--</text>
  <text x="710" y="134.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838269364" font-weight="bold" fill="var(--text)">Other</text>
  <text x="710" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.322927633259" fill="var(--text-muted)">read only</text>

  <rect x="900" y="61.090909090909" width="340" height="147.636363636364" rx="8.21528508884" fill="var(--surface)" stroke="var(--border)"/>
  <text x="1070" y="92.727272727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.403659541574" font-weight="bold" fill="var(--text)">Octal values</text>
  <text x="940" y="124.363636363636" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--text)">r=4  w=2  x=1</text>
  <text x="940" y="156" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--text-muted)">rwx = 7</text>
  <text x="940" y="187.636363636364" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--text-muted)">r-x = 5</text>

  <rect x="40" y="208.727272727273" width="400" height="232" rx="8.21528508884" fill="var(--surface)" stroke="var(--border)"/>
  <text x="240" y="240.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.403659541574" font-weight="bold" fill="var(--text)">chmod octal</text>
  <text x="60" y="277.272727272727" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--text)">chmod 755 file</text>
  <text x="60" y="303.636363636364" font-family="Arial, sans-serif" font-size="12.322927633259" fill="var(--text-muted)">rwx r-x r-x</text>
  <text x="60" y="345.818181818182" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--text)">chmod 644 file</text>
  <text x="60" y="372.181818181818" font-family="Arial, sans-serif" font-size="12.322927633259" fill="var(--text-muted)">rw- r-- r--</text>

  <rect x="460" y="208.727272727273" width="420" height="232" rx="8.21528508884" fill="var(--surface)" stroke="var(--border)"/>
  <text x="670" y="240.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.403659541574" font-weight="bold" fill="var(--text)">chmod symbolic</text>
  <text x="480" y="277.272727272727" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--text)">chmod u+x file</text>
  <text x="480" y="314.181818181818" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--text)">chmod go-w file</text>
  <text x="480" y="351.090909090909" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--text)">chmod a+r file</text>

  <rect x="900" y="229.818181818182" width="340" height="137.090909090909" rx="8.21528508884" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1070" y="261.454545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.403659541574" font-weight="bold" fill="var(--warn-text)">umask 022</text>
  <text x="920" y="293.090909090909" font-family="Arial, sans-serif" font-size="13.349838269364" fill="var(--warn-text)">new files 644</text>
  <text x="920" y="324.727272727273" font-family="Arial, sans-serif" font-size="13.349838269364" fill="var(--warn-text)">new dirs 755</text>

  <rect x="40" y="472.363636363636" width="1200" height="84.363636363636" rx="8.21528508884" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="504" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.403659541574" font-weight="bold" fill="var(--primary-text)">chown</text>
  <text x="640" y="535.636363636364" text-anchor="middle" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--primary-text)">chown alice:devs -R dir</text>

  <rect x="40" y="577.818181818182" width="1200" height="42.181818181818" rx="8.21528508884" fill="var(--surface)" stroke="var(--border)"/>
  <text x="640" y="606.290909090909" text-anchor="middle" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--text)">ls -la   stat file   find / -perm -002</text>
</svg>

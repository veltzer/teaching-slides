<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Permission string breakdown -->
  <text x="640" y="26" text-anchor="middle" font-family="monospace" font-size="40" fill="#212121">-rwxr-xr--</text>

  <!-- Bracket annotations -->
  <!-- Type -->
  <rect x="100" y="40" width="60" height="50" rx="4" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="130" y="70" text-anchor="middle" font-family="monospace" font-size="28" fill="#555555">-</text>
  <line x1="130" y1="92" x2="130" y2="130" stroke="#9e9e9e" stroke-width="1.5"/>
  <text x="130" y="148" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#9e9e9e">type</text>
  <text x="130" y="168" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#9e9e9e">- file  d dir</text>
  <text x="130" y="186" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#9e9e9e">l link</text>

  <!-- Owner rwx -->
  <rect x="200" y="40" width="180" height="50" rx="4" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="290" y="70" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#ffffff">rwx</text>
  <line x1="290" y1="92" x2="290" y2="130" stroke="#1565c0" stroke-width="1.5"/>
  <text x="290" y="148" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1565c0">Owner</text>
  <text x="290" y="170" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555555">read+write+exec</text>

  <!-- Group r-x -->
  <rect x="420" y="40" width="180" height="50" rx="4" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="510" y="70" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#212121">r-x</text>
  <line x1="510" y1="92" x2="510" y2="130" stroke="#555555" stroke-width="1.5"/>
  <text x="510" y="148" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#555555">Group</text>
  <text x="510" y="170" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555555">read+exec (no write)</text>

  <!-- Other r-- -->
  <rect x="640" y="40" width="180" height="50" rx="4" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="730" y="70" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#9e9e9e">r--</text>
  <line x1="730" y1="92" x2="730" y2="130" stroke="#9e9e9e" stroke-width="1.5"/>
  <text x="730" y="148" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#9e9e9e">Other</text>
  <text x="730" y="170" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#9e9e9e">read only</text>

  <!-- Bit values table -->
  <rect x="920" y="20" width="330" height="200" rx="6" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="1085" y="50" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#212121">Octal values</text>
  <text x="960"  y="80" font-family="monospace" font-size="16" fill="#1565c0">r = 4</text>
  <text x="960"  y="106" font-family="monospace" font-size="16" fill="#1565c0">w = 2</text>
  <text x="960"  y="132" font-family="monospace" font-size="16" fill="#1565c0">x = 1</text>
  <text x="960"  y="158" font-family="monospace" font-size="16" fill="#555555">- = 0</text>
  <text x="960"  y="192" font-family="sans-serif" font-size="14" fill="#555555">rwx = 4+2+1 = 7</text>
  <text x="960"  y="212" font-family="sans-serif" font-size="14" fill="#555555">r-x = 4+0+1 = 5</text>

  <!-- chmod examples -->
  <rect x="60" y="220" width="840" height="220" rx="6" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="480" y="250" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#212121">chmod — changing permissions</text>

  <!-- Octal form -->
  <rect x="80"  y="264" width="380" height="150" rx="4" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="270" y="290" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#212121">Octal (absolute)</text>
  <text x="100" y="316" font-family="monospace" font-size="15" fill="#1565c0">chmod 755 file</text>
  <text x="100" y="338" font-family="sans-serif" font-size="13" fill="#555555">owner=rwx(7), group=r-x(5), other=r-x(5)</text>
  <text x="100" y="362" font-family="monospace" font-size="15" fill="#1565c0">chmod 644 file</text>
  <text x="100" y="384" font-family="sans-serif" font-size="13" fill="#555555">owner=rw-(6), group=r--(4), other=r--(4)</text>
  <text x="100" y="406" font-family="sans-serif" font-size="13" fill="#9e9e9e">typical file        typical config</text>

  <!-- Symbolic form -->
  <rect x="480" y="264" width="400" height="150" rx="4" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="680" y="290" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#212121">Symbolic (relative)</text>
  <text x="500" y="316" font-family="monospace" font-size="15" fill="#1565c0">chmod u+x file</text>
  <text x="500" y="338" font-family="sans-serif" font-size="13" fill="#555555">add execute for user (owner)</text>
  <text x="500" y="362" font-family="monospace" font-size="15" fill="#1565c0">chmod go-w file</text>
  <text x="500" y="384" font-family="sans-serif" font-size="13" fill="#555555">remove write from group and other</text>
  <text x="500" y="406" font-family="monospace" font-size="15" fill="#1565c0">chmod a+r file</text>

  <!-- chown -->
  <rect x="60" y="462" width="840" height="80" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="480" y="490" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1565c0">chown — changing ownership</text>
  <text x="80"  y="516" font-family="monospace" font-size="15" fill="#212121">chown alice file        chown alice:devs file        chown -R alice dir/</text>

  <!-- umask note -->
  <rect x="920" y="240" width="330" height="100" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="1085" y="266" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#e65100">umask</text>
  <text x="940"  y="290" font-family="monospace" font-size="14" fill="#555555">umask 022</text>
  <text x="940"  y="312" font-family="sans-serif" font-size="13" fill="#555555">new files: 644</text>
  <text x="940"  y="330" font-family="sans-serif" font-size="13" fill="#555555">new dirs:  755</text>

  <rect x="60" y="570" width="1190" height="42" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="655" y="596" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1565c0">Check permissions: <tspan font-family="monospace">ls -la</tspan> · Check owner: <tspan font-family="monospace">stat file</tspan> · Find world-writable: <tspan font-family="monospace">find / -perm -002</tspan></text>
</svg>

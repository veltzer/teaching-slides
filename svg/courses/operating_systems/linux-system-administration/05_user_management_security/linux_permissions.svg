<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#ffffff" />
      <ns0:stop offset="100%" stop-color="#f2f2f2" />
    </ns0:linearGradient>
    <ns0:filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <ns0:feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </ns0:filter>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:text x="568.8889" y="23.1111" text-anchor="middle" font-family="monospace" font-size="35.5556" fill="#212121">-rwxr-xr--</ns0:text>
  <ns0:rect x="88.8889" y="35.5556" width="53.3333" height="44.4444" rx="3.5556" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.3333" />
  <ns0:text x="115.5556" y="62.2222" text-anchor="middle" font-family="monospace" font-size="24.8889" fill="#555555">-</ns0:text>
  <ns0:line x1="115.5556" y1="81.7778" x2="115.5556" y2="115.5556" stroke="#9e9e9e" stroke-width="1.3333" />
  <ns0:text x="115.5556" y="131.5556" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#9e9e9e">type</ns0:text>
  <ns0:text x="115.5556" y="149.3333" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="#9e9e9e">- file  d dir</ns0:text>
  <ns0:text x="115.5556" y="165.3333" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="#9e9e9e">l link</ns0:text>
  <ns0:rect x="177.7778" y="35.5556" width="160" height="44.4444" rx="3.5556" fill="url(#grad-accent)" filter="url(#shadow)" />
  <ns0:text x="257.7778" y="62.2222" text-anchor="middle" font-family="monospace" font-size="24.8889" font-weight="bold" fill="#ffffff">rwx</ns0:text>
  <ns0:line x1="257.7778" y1="81.7778" x2="257.7778" y2="115.5556" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="257.7778" y="131.5556" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="#1565c0">Owner</ns0:text>
  <ns0:text x="257.7778" y="151.1111" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="#555555">read+write+exec</ns0:text>
  <ns0:rect x="373.3333" y="35.5556" width="160" height="44.4444" rx="3.5556" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="453.3333" y="62.2222" text-anchor="middle" font-family="monospace" font-size="24.8889" font-weight="bold" fill="#212121">r-x</ns0:text>
  <ns0:line x1="453.3333" y1="81.7778" x2="453.3333" y2="115.5556" stroke="#555555" stroke-width="1.3333" />
  <ns0:text x="453.3333" y="131.5556" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="#555555">Group</ns0:text>
  <ns0:text x="453.3333" y="151.1111" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="#555555">read+exec (no write)</ns0:text>
  <ns0:rect x="568.8889" y="35.5556" width="160" height="44.4444" rx="3.5556" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="648.8889" y="62.2222" text-anchor="middle" font-family="monospace" font-size="24.8889" font-weight="bold" fill="#9e9e9e">r--</ns0:text>
  <ns0:line x1="648.8889" y1="81.7778" x2="648.8889" y2="115.5556" stroke="#9e9e9e" stroke-width="1.3333" />
  <ns0:text x="648.8889" y="131.5556" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="#9e9e9e">Other</ns0:text>
  <ns0:text x="648.8889" y="151.1111" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="#9e9e9e">read only</ns0:text>
  <ns0:rect x="817.7778" y="17.7778" width="293.3333" height="177.7778" rx="5.3333" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.3333" />
  <ns0:text x="964.4444" y="44.4444" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="#212121">Octal values</ns0:text>
  <ns0:text x="853.3333" y="71.1111" font-family="monospace" font-size="14.2222" fill="#1565c0">r = 4</ns0:text>
  <ns0:text x="853.3333" y="94.2222" font-family="monospace" font-size="14.2222" fill="#1565c0">w = 2</ns0:text>
  <ns0:text x="853.3333" y="117.3333" font-family="monospace" font-size="14.2222" fill="#1565c0">x = 1</ns0:text>
  <ns0:text x="853.3333" y="140.4444" font-family="monospace" font-size="14.2222" fill="#555555">- = 0</ns0:text>
  <ns0:text x="853.3333" y="170.6667" font-family="sans-serif" font-size="12.4444" fill="#555555">rwx = 4+2+1 = 7</ns0:text>
  <ns0:text x="853.3333" y="188.4444" font-family="sans-serif" font-size="12.4444" fill="#555555">r-x = 4+0+1 = 5</ns0:text>
  <ns0:rect x="53.3333" y="195.5556" width="746.6667" height="195.5556" rx="5.3333" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.3333" />
  <ns0:text x="426.6667" y="222.2222" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="#212121">chmod — changing permissions</ns0:text>
  <ns0:rect x="71.1111" y="234.6667" width="337.7778" height="133.3333" rx="3.5556" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.3333" />
  <ns0:text x="240" y="257.7778" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="#212121">Octal (absolute)</ns0:text>
  <ns0:text x="88.8889" y="280.8889" font-family="monospace" font-size="13.3333" fill="#1565c0">chmod 755 file</ns0:text>
  <ns0:text x="88.8889" y="300.4444" font-family="sans-serif" font-size="11.5556" fill="#555555">owner=rwx(7), group=r-x(5), other=r-x(5)</ns0:text>
  <ns0:text x="88.8889" y="321.7778" font-family="monospace" font-size="13.3333" fill="#1565c0">chmod 644 file</ns0:text>
  <ns0:text x="88.8889" y="341.3333" font-family="sans-serif" font-size="11.5556" fill="#555555">owner=rw-(6), group=r--(4), other=r--(4)</ns0:text>
  <ns0:text x="88.8889" y="360.8889" font-family="sans-serif" font-size="11.5556" fill="#9e9e9e">typical file        typical config</ns0:text>
  <ns0:rect x="426.6667" y="234.6667" width="355.5556" height="133.3333" rx="3.5556" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.3333" />
  <ns0:text x="604.4444" y="257.7778" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="#212121">Symbolic (relative)</ns0:text>
  <ns0:text x="444.4444" y="280.8889" font-family="monospace" font-size="13.3333" fill="#1565c0">chmod u+x file</ns0:text>
  <ns0:text x="444.4444" y="300.4444" font-family="sans-serif" font-size="11.5556" fill="#555555">add execute for user (owner)</ns0:text>
  <ns0:text x="444.4444" y="321.7778" font-family="monospace" font-size="13.3333" fill="#1565c0">chmod go-w file</ns0:text>
  <ns0:text x="444.4444" y="341.3333" font-family="sans-serif" font-size="11.5556" fill="#555555">remove write from group and other</ns0:text>
  <ns0:text x="444.4444" y="360.8889" font-family="monospace" font-size="13.3333" fill="#1565c0">chmod a+r file</ns0:text>
  <ns0:rect x="53.3333" y="410.6667" width="746.6667" height="71.1111" rx="5.3333" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="426.6667" y="435.5556" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="#1565c0">chown — changing ownership</ns0:text>
  <ns0:text x="71.1111" y="458.6667" font-family="monospace" font-size="13.3333" fill="#212121">chown alice file        chown alice:devs file        chown -R alice dir/</ns0:text>
  <ns0:rect x="817.7778" y="213.3333" width="293.3333" height="88.8889" rx="5.3333" fill="#fff3e0" stroke="#e65100" stroke-width="1.3333" />
  <ns0:text x="964.4444" y="236.4444" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="#e65100">umask</ns0:text>
  <ns0:text x="835.5556" y="257.7778" font-family="monospace" font-size="12.4444" fill="#555555">umask 022</ns0:text>
  <ns0:text x="835.5556" y="277.3333" font-family="sans-serif" font-size="11.5556" fill="#555555">new files: 644</ns0:text>
  <ns0:text x="835.5556" y="293.3333" font-family="sans-serif" font-size="11.5556" fill="#555555">new dirs:  755</ns0:text>
  <ns0:rect x="53.3333" y="506.6667" width="1057.7778" height="37.3333" rx="5.3333" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="582.2222" y="529.7778" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="#1565c0">Check permissions: <ns0:tspan font-family="monospace">ls -la</ns0:tspan> · Check owner: <ns0:tspan font-family="monospace">stat file</ns0:tspan> · Find world-writable: <ns0:tspan font-family="monospace">find / -perm -002</ns0:tspan>
  </ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect width="1087.5767" height="474.8286" fill="var(--bg)" rx="5.7089" x="152.4233" y="145.1714"/>
  <text x="696.2116" y="162.3179" text-anchor="middle" font-family="monospace" font-size="29.9425" fill="var(--text)">-rwxr-xr--</text>
  <rect x="237.3901" y="171.5508" width="50.9802" height="32.9741" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="262.8802" y="191.3353" text-anchor="middle" font-family="monospace" font-size="20.9598" fill="var(--text-muted)">-</text>
  <line x1="262.8802" y1="205.8439" x2="262.8802" y2="230.9044" stroke="var(--text-faint)" stroke-width="1.3333" />
  <text x="262.8802" y="242.7751" text-anchor="middle" font-family="sans-serif" font-size="10.4797" fill="var(--text-faint)">type</text>
  <text x="262.8802" y="255.9647" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-faint)">- file  d dir</text>
  <text x="262.8802" y="267.8354" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-faint)">l link</text>
  <rect x="322.3571" y="171.5508" width="152.9405" height="32.9741" rx="5.7089" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="398.8273" y="191.3353" text-anchor="middle" font-family="monospace" font-size="20.9598" font-weight="bold" fill="var(--bg)">rwx</text>
  <line x1="398.8273" y1="205.8439" x2="398.8273" y2="230.9044" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="398.8273" y="242.7751" text-anchor="middle" font-family="sans-serif" font-size="11.2285" font-weight="bold" fill="var(--primary-accent)">Owner</text>
  <text x="398.8273" y="257.2836" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">read+write+exec</text>
  <rect x="509.2844" y="171.5508" width="152.9405" height="32.9741" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="585.7546" y="191.3353" text-anchor="middle" font-family="monospace" font-size="20.9598" font-weight="bold" fill="var(--text)">r-x</text>
  <line x1="585.7546" y1="205.8439" x2="585.7546" y2="230.9044" stroke="var(--text-muted)" stroke-width="1.3333" />
  <text x="585.7546" y="242.7751" text-anchor="middle" font-family="sans-serif" font-size="11.2285" font-weight="bold" fill="var(--text-muted)">Group</text>
  <text x="585.7546" y="257.2836" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)">read+exec (no write)</text>
  <rect x="696.2116" y="171.5508" width="152.9405" height="32.9741" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="772.6819" y="191.3353" text-anchor="middle" font-family="monospace" font-size="20.9598" font-weight="bold" fill="var(--text-faint)">r--</text>
  <line x1="772.6819" y1="205.8439" x2="772.6819" y2="230.9044" stroke="var(--text-faint)" stroke-width="1.3333" />
  <text x="772.6819" y="242.7751" text-anchor="middle" font-family="sans-serif" font-size="11.2285" font-weight="bold" fill="var(--text-faint)">Other</text>
  <text x="772.6819" y="257.2836" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-faint)">read only</text>
  <rect x="934.119" y="158.361" width="280.3909" height="131.8968" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1074.3144" y="178.1455" text-anchor="middle" font-family="sans-serif" font-size="11.9769" font-weight="bold" fill="var(--text)">Octal values</text>
  <text x="968.1056" y="197.9301" font-family="monospace" font-size="11.9769" fill="var(--primary-accent)">r = 4</text>
  <text x="968.1056" y="215.0767" font-family="monospace" font-size="11.9769" fill="var(--primary-accent)">w = 2</text>
  <text x="968.1056" y="232.2232" font-family="monospace" font-size="11.9769" fill="var(--primary-accent)">x = 1</text>
  <text x="968.1056" y="249.3698" font-family="monospace" font-size="11.9769" fill="var(--text-muted)">- = 0</text>
  <text x="968.1056" y="271.7924" font-family="sans-serif" font-size="10.4797" fill="var(--text-muted)">rwx = 4+2+1 = 7</text>
  <text x="968.1056" y="284.9819" font-family="sans-serif" font-size="10.4797" fill="var(--text-muted)">r-x = 4+0+1 = 5</text>
  <rect x="203.4034" y="290.258" width="713.7223" height="145.0866" rx="5.7089" fill="var(--bg)" stroke="var(--border)" stroke-width="1.3333" />
  <text x="560.2645" y="310.0424" text-anchor="middle" font-family="sans-serif" font-size="11.9769" font-weight="bold" fill="var(--text)">chmod — changing permissions</text>
  <rect x="220.3968" y="319.2752" width="322.8744" height="98.9226" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="381.834" y="336.4218" text-anchor="middle" font-family="sans-serif" font-size="11.2285" font-weight="bold" fill="var(--text)">Octal (absolute)</text>
  <text x="237.3901" y="353.5684" font-family="monospace" font-size="11.2285" fill="var(--primary-accent)">chmod 755 file</text>
  <text x="237.3901" y="368.077" font-family="sans-serif" font-size="10" fill="var(--text-muted)">owner=rwx(7), group=r-x(5), other=r-x(5)</text>
  <text x="237.3901" y="383.9046" font-family="monospace" font-size="11.2285" fill="var(--primary-accent)">chmod 644 file</text>
  <text x="237.3901" y="398.4133" font-family="sans-serif" font-size="10" fill="var(--text-muted)">owner=rw-(6), group=r--(4), other=r--(4)</text>
  <text x="237.3901" y="412.922" font-family="sans-serif" font-size="10" fill="var(--text-faint)">typical file        typical config</text>
  <rect x="560.2645" y="319.2752" width="339.8677" height="98.9226" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="730.1983" y="336.4218" text-anchor="middle" font-family="sans-serif" font-size="11.2285" font-weight="bold" fill="var(--text)">Symbolic (relative)</text>
  <text x="577.2578" y="353.5684" font-family="monospace" font-size="11.2285" fill="var(--primary-accent)">chmod u+x file</text>
  <text x="577.2578" y="368.077" font-family="sans-serif" font-size="10" fill="var(--text-muted)">add execute for user (owner)</text>
  <text x="577.2578" y="383.9046" font-family="monospace" font-size="11.2285" fill="var(--primary-accent)">chmod go-w file</text>
  <text x="577.2578" y="398.4133" font-family="sans-serif" font-size="10" fill="var(--text-muted)">remove write from group and other</text>
  <text x="577.2578" y="412.922" font-family="monospace" font-size="11.2285" fill="var(--primary-accent)">chmod a+r file</text>
  <rect x="203.4034" y="449.8531" width="713.7223" height="52.7587" rx="5.7089" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="560.2645" y="468.3187" text-anchor="middle" font-family="sans-serif" font-size="11.2285" font-weight="bold" fill="var(--primary-accent)">chown — changing ownership</text>
  <text x="220.3968" y="485.4652" font-family="monospace" font-size="11.2285" fill="var(--text)">chown alice file        chown alice:devs file        chown -R alice dir/</text>
  <rect x="934.119" y="303.4475" width="280.3909" height="65.9485" rx="5.7089" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1074.3144" y="320.5941" text-anchor="middle" font-family="sans-serif" font-size="11.2285" font-weight="bold" fill="var(--warn-accent)">umask</text>
  <text x="951.1125" y="336.4218" font-family="monospace" font-size="10.4797" fill="var(--text-muted)">umask 022</text>
  <text x="951.1125" y="350.9304" font-family="sans-serif" font-size="10" fill="var(--text-muted)">new files: 644</text>
  <text x="951.1125" y="362.8012" font-family="sans-serif" font-size="10" fill="var(--text-muted)">new dirs:  755</text>
  <rect x="203.4034" y="521.0774" width="1011.1065" height="27.6983" rx="5.7089" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="708.9566" y="538.2239" text-anchor="middle" font-family="sans-serif" font-size="11.9769" fill="var(--primary-accent)">Check permissions: <tspan font-family="monospace">ls -la</tspan> · Check owner: <tspan font-family="monospace">stat file</tspan> · Find world-writable: <tspan font-family="monospace">find / -perm -002</tspan>
  </text>
</svg>
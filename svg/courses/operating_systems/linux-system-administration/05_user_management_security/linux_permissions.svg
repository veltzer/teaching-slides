<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6.6276" x="40" y="40"/>
  <text x="639.9999" y="60.9443" text-anchor="middle" font-family="monospace" font-size="34.7612" fill="var(--text)">-rwxr-xr--</text>
  <rect x="133.7499" y="72.2223" width="56.25" height="40.2776" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="161.8749" y="96.3889" text-anchor="middle" font-family="monospace" font-size="24.3329" fill="var(--text-muted)">-</text>
  <line x1="161.8749" y1="114.1111" x2="161.8749" y2="144.7223" stroke="var(--text-faint)" stroke-width="1.3333" />
  <text x="161.8749" y="159.2223" text-anchor="middle" font-family="sans-serif" font-size="12.1662" fill="var(--text-faint)">type</text>
  <text x="161.8749" y="175.3333" text-anchor="middle" font-family="sans-serif" font-size="11.6093" fill="var(--text-faint)">- file  d dir</text>
  <text x="161.8749" y="189.8333" text-anchor="middle" font-family="sans-serif" font-size="11.6093" fill="var(--text-faint)">l link</text>
  <rect x="227.4999" y="72.2223" width="168.75" height="40.2776" rx="6.6276" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="311.8749" y="96.3889" text-anchor="middle" font-family="monospace" font-size="24.3329" font-weight="bold" fill="var(--bg)">rwx</text>
  <line x1="311.8749" y1="114.1111" x2="311.8749" y2="144.7223" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="311.8749" y="159.2223" text-anchor="middle" font-family="sans-serif" font-size="13.0355" font-weight="bold" fill="var(--primary-accent)">Owner</text>
  <text x="311.8749" y="176.9443" text-anchor="middle" font-family="sans-serif" font-size="11.6093" fill="var(--text-muted)">read+write+exec</text>
  <rect x="433.75" y="72.2223" width="168.75" height="40.2776" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="518.125" y="96.3889" text-anchor="middle" font-family="monospace" font-size="24.3329" font-weight="bold" fill="var(--text)">r-x</text>
  <line x1="518.125" y1="114.1111" x2="518.125" y2="144.7223" stroke="var(--text-muted)" stroke-width="1.3333" />
  <text x="518.125" y="159.2223" text-anchor="middle" font-family="sans-serif" font-size="13.0355" font-weight="bold" fill="var(--text-muted)">Group</text>
  <text x="518.125" y="176.9443" text-anchor="middle" font-family="sans-serif" font-size="11.6093" fill="var(--text-muted)">read+exec (no write)</text>
  <rect x="639.9999" y="72.2223" width="168.75" height="40.2776" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="724.375" y="96.3889" text-anchor="middle" font-family="monospace" font-size="24.3329" font-weight="bold" fill="var(--text-faint)">r--</text>
  <line x1="724.375" y1="114.1111" x2="724.375" y2="144.7223" stroke="var(--text-faint)" stroke-width="1.3333" />
  <text x="724.375" y="159.2223" text-anchor="middle" font-family="sans-serif" font-size="13.0355" font-weight="bold" fill="var(--text-faint)">Other</text>
  <text x="724.375" y="176.9443" text-anchor="middle" font-family="sans-serif" font-size="11.6093" fill="var(--text-faint)">read only</text>
  <rect x="902.4999" y="56.111" width="309.375" height="161.1111" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1057.1874" y="80.2776" text-anchor="middle" font-family="sans-serif" font-size="13.9043" font-weight="bold" fill="var(--text)">Octal values</text>
  <text x="939.9998" y="104.4444" font-family="monospace" font-size="13.9043" fill="var(--primary-accent)">r = 4</text>
  <text x="939.9998" y="125.3889" font-family="monospace" font-size="13.9043" fill="var(--primary-accent)">w = 2</text>
  <text x="939.9998" y="146.3332" font-family="monospace" font-size="13.9043" fill="var(--primary-accent)">x = 1</text>
  <text x="939.9998" y="167.2777" font-family="monospace" font-size="13.9043" fill="var(--text-muted)">- = 0</text>
  <text x="939.9998" y="194.6667" font-family="sans-serif" font-size="12.1662" fill="var(--text-muted)">rwx = 4+2+1 = 7</text>
  <text x="939.9998" y="210.7776" font-family="sans-serif" font-size="12.1662" fill="var(--text-muted)">r-x = 4+0+1 = 5</text>
  <rect x="96.2499" y="217.2223" width="787.5001" height="177.2223" rx="6.6276" fill="var(--bg)" stroke="var(--border)" stroke-width="1.3333" />
  <text x="489.9999" y="241.3888" text-anchor="middle" font-family="sans-serif" font-size="13.9043" font-weight="bold" fill="var(--text)">chmod — changing permissions</text>
  <rect x="115" y="252.6666" width="356.2501" height="120.8333" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="293.125" y="273.6111" text-anchor="middle" font-family="sans-serif" font-size="13.0355" font-weight="bold" fill="var(--text)">Octal (absolute)</text>
  <text x="133.7499" y="294.5556" font-family="monospace" font-size="13.0355" fill="var(--primary-accent)">chmod 755 file</text>
  <text x="133.7499" y="312.2777" font-family="sans-serif" font-size="11.6093" fill="var(--text-muted)">owner=rwx(7), group=r-x(5), other=r-x(5)</text>
  <text x="133.7499" y="331.611" font-family="monospace" font-size="13.0355" fill="var(--primary-accent)">chmod 644 file</text>
  <text x="133.7499" y="349.3333" font-family="sans-serif" font-size="11.6093" fill="var(--text-muted)">owner=rw-(6), group=r--(4), other=r--(4)</text>
  <text x="133.7499" y="367.0556" font-family="sans-serif" font-size="11.6093" fill="var(--text-faint)">typical file        typical config</text>
  <rect x="489.9999" y="252.6666" width="375" height="120.8333" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="677.4999" y="273.6111" text-anchor="middle" font-family="sans-serif" font-size="13.0355" font-weight="bold" fill="var(--text)">Symbolic (relative)</text>
  <text x="508.7498" y="294.5556" font-family="monospace" font-size="13.0355" fill="var(--primary-accent)">chmod u+x file</text>
  <text x="508.7498" y="312.2777" font-family="sans-serif" font-size="11.6093" fill="var(--text-muted)">add execute for user (owner)</text>
  <text x="508.7498" y="331.611" font-family="monospace" font-size="13.0355" fill="var(--primary-accent)">chmod go-w file</text>
  <text x="508.7498" y="349.3333" font-family="sans-serif" font-size="11.6093" fill="var(--text-muted)">remove write from group and other</text>
  <text x="508.7498" y="367.0556" font-family="monospace" font-size="13.0355" fill="var(--primary-accent)">chmod a+r file</text>
  <rect x="96.2499" y="412.1667" width="787.5001" height="64.4444" rx="6.6276" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="489.9999" y="434.7223" text-anchor="middle" font-family="sans-serif" font-size="13.0355" font-weight="bold" fill="var(--primary-accent)">chown — changing ownership</text>
  <text x="115" y="455.6666" font-family="monospace" font-size="13.0355" fill="var(--text)">chown alice file        chown alice:devs file        chown -R alice dir/</text>
  <rect x="902.4999" y="233.3332" width="309.375" height="80.5557" rx="6.6276" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1057.1874" y="254.2777" text-anchor="middle" font-family="sans-serif" font-size="13.0355" font-weight="bold" fill="var(--warn-accent)">umask</text>
  <text x="921.2501" y="273.6111" font-family="monospace" font-size="12.1662" fill="var(--text-muted)">umask 022</text>
  <text x="921.2501" y="291.3333" font-family="sans-serif" font-size="11.6093" fill="var(--text-muted)">new files: 644</text>
  <text x="921.2501" y="305.8334" font-family="sans-serif" font-size="11.6093" fill="var(--text-muted)">new dirs:  755</text>
  <rect x="96.2499" y="499.1667" width="1115.625" height="33.8333" rx="6.6276" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="654.0624" y="520.111" text-anchor="middle" font-family="sans-serif" font-size="13.9043" fill="var(--primary-accent)">Check permissions: <tspan font-family="monospace">ls -la</tspan> · Check owner: <tspan font-family="monospace">stat file</tspan> · Find world-writable: <tspan font-family="monospace">find / -perm -002</tspan>
  </text>
</svg>
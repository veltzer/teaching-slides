<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <text x="568.8889" y="23.1111" text-anchor="middle" font-family="monospace" font-size="35.5556" fill="var(--text)">-rwxr-xr--</text>
  <rect x="88.8889" y="35.5556" width="53.3333" height="44.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="115.5556" y="62.2222" text-anchor="middle" font-family="monospace" font-size="24.8889" fill="var(--text-muted)">-</text>
  <line x1="115.5556" y1="81.7778" x2="115.5556" y2="115.5556" stroke="var(--text-faint)" stroke-width="1.3333" />
  <text x="115.5556" y="131.5556" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">type</text>
  <text x="115.5556" y="149.3333" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-faint)">- file  d dir</text>
  <text x="115.5556" y="165.3333" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-faint)">l link</text>
  <rect x="177.7778" y="35.5556" width="160" height="44.4444" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="257.7778" y="62.2222" text-anchor="middle" font-family="monospace" font-size="24.8889" font-weight="bold" fill="var(--bg)">rwx</text>
  <line x1="257.7778" y1="81.7778" x2="257.7778" y2="115.5556" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="257.7778" y="131.5556" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--primary-accent)">Owner</text>
  <text x="257.7778" y="151.1111" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">read+write+exec</text>
  <rect x="373.3333" y="35.5556" width="160" height="44.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="453.3333" y="62.2222" text-anchor="middle" font-family="monospace" font-size="24.8889" font-weight="bold" fill="var(--text)">r-x</text>
  <line x1="453.3333" y1="81.7778" x2="453.3333" y2="115.5556" stroke="var(--text-muted)" stroke-width="1.3333" />
  <text x="453.3333" y="131.5556" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--text-muted)">Group</text>
  <text x="453.3333" y="151.1111" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">read+exec (no write)</text>
  <rect x="568.8889" y="35.5556" width="160" height="44.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="648.8889" y="62.2222" text-anchor="middle" font-family="monospace" font-size="24.8889" font-weight="bold" fill="var(--text-faint)">r--</text>
  <line x1="648.8889" y1="81.7778" x2="648.8889" y2="115.5556" stroke="var(--text-faint)" stroke-width="1.3333" />
  <text x="648.8889" y="131.5556" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--text-faint)">Other</text>
  <text x="648.8889" y="151.1111" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-faint)">read only</text>
  <rect x="817.7778" y="17.7778" width="293.3333" height="177.7778" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="964.4444" y="44.4444" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="var(--text)">Octal values</text>
  <text x="853.3333" y="71.1111" font-family="monospace" font-size="14.2222" fill="var(--primary-accent)">r = 4</text>
  <text x="853.3333" y="94.2222" font-family="monospace" font-size="14.2222" fill="var(--primary-accent)">w = 2</text>
  <text x="853.3333" y="117.3333" font-family="monospace" font-size="14.2222" fill="var(--primary-accent)">x = 1</text>
  <text x="853.3333" y="140.4444" font-family="monospace" font-size="14.2222" fill="var(--text-muted)">- = 0</text>
  <text x="853.3333" y="170.6667" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">rwx = 4+2+1 = 7</text>
  <text x="853.3333" y="188.4444" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">r-x = 4+0+1 = 5</text>
  <rect x="53.3333" y="195.5556" width="746.6667" height="195.5556" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1.3333" />
  <text x="426.6667" y="222.2222" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="var(--text)">chmod — changing permissions</text>
  <rect x="71.1111" y="234.6667" width="337.7778" height="133.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="240" y="257.7778" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--text)">Octal (absolute)</text>
  <text x="88.8889" y="280.8889" font-family="monospace" font-size="13.3333" fill="var(--primary-accent)">chmod 755 file</text>
  <text x="88.8889" y="300.4444" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">owner=rwx(7), group=r-x(5), other=r-x(5)</text>
  <text x="88.8889" y="321.7778" font-family="monospace" font-size="13.3333" fill="var(--primary-accent)">chmod 644 file</text>
  <text x="88.8889" y="341.3333" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">owner=rw-(6), group=r--(4), other=r--(4)</text>
  <text x="88.8889" y="360.8889" font-family="sans-serif" font-size="11.5556" fill="var(--text-faint)">typical file        typical config</text>
  <rect x="426.6667" y="234.6667" width="355.5556" height="133.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="604.4444" y="257.7778" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--text)">Symbolic (relative)</text>
  <text x="444.4444" y="280.8889" font-family="monospace" font-size="13.3333" fill="var(--primary-accent)">chmod u+x file</text>
  <text x="444.4444" y="300.4444" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">add execute for user (owner)</text>
  <text x="444.4444" y="321.7778" font-family="monospace" font-size="13.3333" fill="var(--primary-accent)">chmod go-w file</text>
  <text x="444.4444" y="341.3333" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">remove write from group and other</text>
  <text x="444.4444" y="360.8889" font-family="monospace" font-size="13.3333" fill="var(--primary-accent)">chmod a+r file</text>
  <rect x="53.3333" y="410.6667" width="746.6667" height="71.1111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="426.6667" y="435.5556" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--primary-accent)">chown — changing ownership</text>
  <text x="71.1111" y="458.6667" font-family="monospace" font-size="13.3333" fill="var(--text)">chown alice file        chown alice:devs file        chown -R alice dir/</text>
  <rect x="817.7778" y="213.3333" width="293.3333" height="88.8889" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="964.4444" y="236.4444" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--warn-accent)">umask</text>
  <text x="835.5556" y="257.7778" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">umask 022</text>
  <text x="835.5556" y="277.3333" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">new files: 644</text>
  <text x="835.5556" y="293.3333" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">new dirs:  755</text>
  <rect x="53.3333" y="506.6667" width="1057.7778" height="37.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="582.2222" y="529.7778" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--primary-accent)">Check permissions: <tspan font-family="monospace">ls -la</tspan> · Check owner: <tspan font-family="monospace">stat file</tspan> · Find world-writable: <tspan font-family="monospace">find / -perm -002</tspan>
  </text>
</svg>
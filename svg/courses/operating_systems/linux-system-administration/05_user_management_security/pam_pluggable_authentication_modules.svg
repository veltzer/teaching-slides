<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="58.75" y="201.1111" width="248.4375" height="225.5556" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="58.75" y="201.1111" width="248.4375" height="44.3056" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="58.75" y="237.3611" width="248.4375" height="8.0556" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="182.5" y="228.5" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Application</text>
  <text x="182.5" y="285.6944" text-anchor="middle" font-size="13.9044" fill="var(--text)" font-family="sans-serif">sshd, sudo,</text>
  <text x="182.5" y="305.8333" text-anchor="middle" font-size="13.9044" fill="var(--text)" font-family="sans-serif">login, su</text>
  <text x="182.5" y="346.1111" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)" font-family="sans-serif">Calls PAM API</text>
  <line x1="307.1875" y1="313.8889" x2="380.3125" y2="313.8889" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="382.1874" y="201.1111" width="248.4375" height="225.5556" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="382.1874" y="201.1111" width="248.4375" height="44.3056" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="382.1874" y="237.3611" width="248.4375" height="8.0556" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="506.875" y="228.5" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--bg)" font-family="sans-serif">PAM API</text>
  <text x="506.875" y="285.6944" text-anchor="middle" font-size="13.9044" fill="var(--text)" font-family="sans-serif">libpam.so</text>
  <text x="506.875" y="309.8611" text-anchor="middle" font-size="13.0354" fill="var(--text-muted)" font-family="sans-serif">/etc/pam.d/</text>
  <text x="506.875" y="330" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)" font-family="sans-serif">Stack of rules</text>
  <text x="506.875" y="350.1389" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)" font-family="sans-serif">required / optional</text>
  <line x1="630.625" y1="313.8889" x2="703.75" y2="313.8889" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="705.625" y="201.1111" width="248.4375" height="225.5556" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="705.625" y="201.1111" width="248.4375" height="44.3056" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="705.625" y="237.3611" width="248.4375" height="8.0556" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="830.3124" y="228.5" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--bg)" font-family="sans-serif">PAM Modules</text>
  <text x="830.3124" y="277.6389" text-anchor="middle" font-size="13.0354" fill="var(--text)" font-family="sans-serif">pam_unix.so</text>
  <text x="830.3124" y="297.7777" text-anchor="middle" font-size="13.0354" fill="var(--text)" font-family="sans-serif">pam_ldap.so</text>
  <text x="830.3124" y="317.9167" text-anchor="middle" font-size="13.0354" fill="var(--text)" font-family="sans-serif">pam_google_auth</text>
  <text x="830.3124" y="346.1111" text-anchor="middle" font-size="11.2974" fill="var(--text-muted)" font-family="sans-serif">Pluggable, stackable</text>
  <line x1="954.0625" y1="313.8889" x2="1027.1875" y2="313.8889" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="1029.0625" y="201.1111" width="187.5" height="225.5556" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="1029.0625" y="201.1111" width="187.5" height="44.3056" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="1029.0625" y="237.3611" width="187.5" height="8.0556" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1122.8125" y="228.5" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Backend</text>
  <text x="1122.8125" y="277.6389" text-anchor="middle" font-size="13.0354" fill="var(--text)" font-family="sans-serif">/etc/shadow</text>
  <text x="1122.8125" y="299.3889" text-anchor="middle" font-size="13.0354" fill="var(--text)" font-family="sans-serif">LDAP</text>
  <text x="1122.8125" y="321.1389" text-anchor="middle" font-size="13.0354" fill="var(--text)" font-family="sans-serif">Kerberos</text>
  <text x="1122.8125" y="342.8889" text-anchor="middle" font-size="13.0354" fill="var(--text)" font-family="sans-serif">RADIUS</text>
</svg>
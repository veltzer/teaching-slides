<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="257.489879" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.795123" filter="url(#shadow)" />
  <rect x="40" y="40" width="257.489879" height="113.928663" fill="var(--primary-fill)" rx="9.795123" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="40" y="133.214269" width="257.489879" height="20.714396" fill="var(--primary-fill)" rx="9.795123" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="168.259109" y="110.428588" text-anchor="middle" font-size="28.374189" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Application</text>
  <text x="168.259109" y="257.499873" text-anchor="middle" font-size="22.699221" fill="var(--text)" font-family="sans-serif">sshd, sudo,</text>
  <text x="168.259109" y="309.285605" text-anchor="middle" font-size="22.699221" fill="var(--text)" font-family="sans-serif">login, su</text>
  <text x="168.259109" y="412.85707" text-anchor="middle" font-size="19.861736" fill="var(--text-muted)" font-family="sans-serif">Calls PAM API</text>
  <line x1="297.489879" y1="330.000001" x2="373.279352" y2="330.000001" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="375.222568" y="40" width="257.489879" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.795123" filter="url(#shadow)" />
  <rect x="375.222568" y="40" width="257.489879" height="113.928663" fill="var(--primary-fill)" rx="9.795123" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="375.222568" y="133.214269" width="257.489879" height="20.714396" fill="var(--primary-fill)" rx="9.795123" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="504.453441" y="110.428588" text-anchor="middle" font-size="28.374189" font-weight="bold" fill="var(--bg)" font-family="sans-serif">PAM API</text>
  <text x="504.453441" y="257.499873" text-anchor="middle" font-size="22.699221" fill="var(--text)" font-family="sans-serif">libpam.so</text>
  <text x="504.453441" y="319.642803" text-anchor="middle" font-size="21.28056" fill="var(--text-muted)" font-family="sans-serif">/etc/pam.d/</text>
  <text x="504.453441" y="371.428536" text-anchor="middle" font-size="19.861736" fill="var(--text-muted)" font-family="sans-serif">Stack of rules</text>
  <text x="504.453441" y="423.214268" text-anchor="middle" font-size="19.861736" fill="var(--text-muted)" font-family="sans-serif">required / optional</text>
  <line x1="632.712551" y1="330.000001" x2="708.502024" y2="330.000001" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="710.445344" y="40" width="257.489879" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.795123" filter="url(#shadow)" />
  <rect x="710.445344" y="40" width="257.489879" height="113.928663" fill="var(--primary-fill)" rx="9.795123" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="710.445344" y="133.214269" width="257.489879" height="20.714396" fill="var(--primary-fill)" rx="9.795123" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="839.67601" y="110.428588" text-anchor="middle" font-size="25.536706" font-weight="bold" fill="var(--bg)" font-family="sans-serif">PAM Modules</text>
  <text x="839.67601" y="236.785734" text-anchor="middle" font-size="21.28056" fill="var(--text)" font-family="sans-serif">pam_unix.so</text>
  <text x="839.67601" y="288.571209" text-anchor="middle" font-size="21.28056" fill="var(--text)" font-family="sans-serif">pam_ldap.so</text>
  <text x="839.67601" y="340.357199" text-anchor="middle" font-size="21.28056" fill="var(--text)" font-family="sans-serif">pam_google_auth</text>
  <text x="839.67601" y="412.85707" text-anchor="middle" font-size="18.443239" fill="var(--text-muted)" font-family="sans-serif">Pluggable, stackable</text>
  <line x1="967.935223" y1="330.000001" x2="1043.724696" y2="330.000001" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="1045.668016" y="40" width="194.331984" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.795123" filter="url(#shadow)" />
  <rect x="1045.668016" y="40" width="194.331984" height="113.928663" fill="var(--primary-fill)" rx="9.795123" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="1045.668016" y="133.214269" width="194.331984" height="20.714396" fill="var(--primary-fill)" rx="9.795123" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1142.834008" y="110.428588" text-anchor="middle" font-size="25.536706" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Backend</text>
  <text x="1142.834008" y="236.785734" text-anchor="middle" font-size="21.28056" fill="var(--text)" font-family="sans-serif">/etc/shadow</text>
  <text x="1142.834008" y="292.714294" text-anchor="middle" font-size="21.28056" fill="var(--text)" font-family="sans-serif">LDAP</text>
  <text x="1142.834008" y="348.642855" text-anchor="middle" font-size="21.28056" fill="var(--text)" font-family="sans-serif">Kerberos</text>
  <text x="1142.834008" y="404.571415" text-anchor="middle" font-size="21.28056" fill="var(--text)" font-family="sans-serif">RADIUS</text>
</svg>
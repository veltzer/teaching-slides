<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="257.489879" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.795123"/>
  <rect x="40" y="40" width="257.489879" height="113.928663" fill="url(#grad-primary)" rx="9.795123" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="133.214269" width="257.489879" height="20.714396" fill="url(#grad-primary)" rx="9.795123" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="168.259109" y="110.428588" text-anchor="middle" font-size="28.374189" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Application</text>
  <text x="168.259109" y="257.499873" text-anchor="middle" font-size="22.699221" fill="var(--text)" font-family="Arial, sans-serif">sshd, sudo,</text>
  <text x="168.259109" y="309.285605" text-anchor="middle" font-size="22.699221" fill="var(--text)" font-family="Arial, sans-serif">login, su</text>
  <text x="168.259109" y="412.85707" text-anchor="middle" font-size="19.861736" fill="var(--text-muted)" font-family="Arial, sans-serif">Calls PAM API</text>
  <line x1="297.489879" y1="330.000001" x2="373.279352" y2="330.000001" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="375.222568" y="40" width="257.489879" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.795123"/>
  <rect x="375.222568" y="40" width="257.489879" height="113.928663" fill="url(#grad-primary)" rx="9.795123" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="375.222568" y="133.214269" width="257.489879" height="20.714396" fill="url(#grad-primary)" rx="9.795123" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="504.453441" y="110.428588" text-anchor="middle" font-size="28.374189" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">PAM API</text>
  <text x="504.453441" y="257.499873" text-anchor="middle" font-size="22.699221" fill="var(--text)" font-family="Arial, sans-serif">libpam.so</text>
  <text x="504.453441" y="319.642803" text-anchor="middle" font-size="21.28056" fill="var(--text-muted)" font-family="Arial, sans-serif">/etc/pam.d/</text>
  <text x="504.453441" y="371.428536" text-anchor="middle" font-size="19.861736" fill="var(--text-muted)" font-family="Arial, sans-serif">Stack of rules</text>
  <text x="504.453441" y="423.214268" text-anchor="middle" font-size="19.861736" fill="var(--text-muted)" font-family="Arial, sans-serif">required / optional</text>
  <line x1="632.712551" y1="330.000001" x2="708.502024" y2="330.000001" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="710.445344" y="40" width="257.489879" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.795123"/>
  <rect x="710.445344" y="40" width="257.489879" height="113.928663" fill="url(#grad-primary)" rx="9.795123" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="710.445344" y="133.214269" width="257.489879" height="20.714396" fill="url(#grad-primary)" rx="9.795123" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="839.67601" y="110.428588" text-anchor="middle" font-size="25.536706" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">PAM Modules</text>
  <text x="839.67601" y="236.785734" text-anchor="middle" font-size="21.28056" fill="var(--text)" font-family="Arial, sans-serif">pam_unix.so</text>
  <text x="839.67601" y="288.571209" text-anchor="middle" font-size="21.28056" fill="var(--text)" font-family="Arial, sans-serif">pam_ldap.so</text>
  <text x="839.67601" y="340.357199" text-anchor="middle" font-size="21.28056" fill="var(--text)" font-family="Arial, sans-serif">pam_google_auth</text>
  <text x="839.67601" y="412.85707" text-anchor="middle" font-size="18.443239" fill="var(--text-muted)" font-family="Arial, sans-serif">Pluggable, stackable</text>
  <line x1="967.935223" y1="330.000001" x2="1043.724696" y2="330.000001" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="1045.668016" y="40" width="194.331984" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.795123"/>
  <rect x="1045.668016" y="40" width="194.331984" height="113.928663" fill="url(#grad-primary)" rx="9.795123" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1045.668016" y="133.214269" width="194.331984" height="20.714396" fill="url(#grad-primary)" rx="9.795123" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1142.834008" y="110.428588" text-anchor="middle" font-size="25.536706" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Backend</text>
  <text x="1142.834008" y="236.785734" text-anchor="middle" font-size="21.28056" fill="var(--text)" font-family="Arial, sans-serif">/etc/shadow</text>
  <text x="1142.834008" y="292.714294" text-anchor="middle" font-size="21.28056" fill="var(--text)" font-family="Arial, sans-serif">LDAP</text>
  <text x="1142.834008" y="348.642855" text-anchor="middle" font-size="21.28056" fill="var(--text)" font-family="Arial, sans-serif">Kerberos</text>
  <text x="1142.834008" y="404.571415" text-anchor="middle" font-size="21.28056" fill="var(--text)" font-family="Arial, sans-serif">RADIUS</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="17.7778" y="177.7778" width="235.5556" height="248.8889" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="17.7778" y="177.7778" width="235.5556" height="48.8889" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="17.7778" y="217.7778" width="235.5556" height="8.8889" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="135.1111" y="208" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Application</text>
  <text x="135.1111" y="271.1111" text-anchor="middle" font-size="14.2222" fill="var(--text)" font-family="sans-serif">sshd, sudo,</text>
  <text x="135.1111" y="293.3333" text-anchor="middle" font-size="14.2222" fill="var(--text)" font-family="sans-serif">login, su</text>
  <text x="135.1111" y="337.7778" text-anchor="middle" font-size="12.4444" fill="var(--text-muted)" font-family="sans-serif">Calls PAM API</text>
  <line x1="253.3333" y1="302.2222" x2="322.6667" y2="302.2222" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="324.4444" y="177.7778" width="235.5556" height="248.8889" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="324.4444" y="177.7778" width="235.5556" height="48.8889" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="324.4444" y="217.7778" width="235.5556" height="8.8889" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="442.6667" y="208" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--bg)" font-family="sans-serif">PAM API</text>
  <text x="442.6667" y="271.1111" text-anchor="middle" font-size="14.2222" fill="var(--text)" font-family="sans-serif">libpam.so</text>
  <text x="442.6667" y="297.7778" text-anchor="middle" font-size="13.3333" fill="var(--text-muted)" font-family="sans-serif">/etc/pam.d/</text>
  <text x="442.6667" y="320" text-anchor="middle" font-size="12.4444" fill="var(--text-muted)" font-family="sans-serif">Stack of rules</text>
  <text x="442.6667" y="342.2222" text-anchor="middle" font-size="12.4444" fill="var(--text-muted)" font-family="sans-serif">required / optional</text>
  <line x1="560" y1="302.2222" x2="629.3333" y2="302.2222" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="631.1111" y="177.7778" width="235.5556" height="248.8889" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="631.1111" y="177.7778" width="235.5556" height="48.8889" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="631.1111" y="217.7778" width="235.5556" height="8.8889" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="749.3333" y="208" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--bg)" font-family="sans-serif">PAM Modules</text>
  <text x="749.3333" y="262.2222" text-anchor="middle" font-size="13.3333" fill="var(--text)" font-family="sans-serif">pam_unix.so</text>
  <text x="749.3333" y="284.4444" text-anchor="middle" font-size="13.3333" fill="var(--text)" font-family="sans-serif">pam_ldap.so</text>
  <text x="749.3333" y="306.6667" text-anchor="middle" font-size="13.3333" fill="var(--text)" font-family="sans-serif">pam_google_auth</text>
  <text x="749.3333" y="337.7778" text-anchor="middle" font-size="11.5556" fill="var(--text-muted)" font-family="sans-serif">Pluggable, stackable</text>
  <line x1="866.6667" y1="302.2222" x2="936" y2="302.2222" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="937.7778" y="177.7778" width="177.7778" height="248.8889" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <rect x="937.7778" y="177.7778" width="177.7778" height="48.8889" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="937.7778" y="217.7778" width="177.7778" height="8.8889" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1026.6667" y="208" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--bg)" font-family="sans-serif">Backend</text>
  <text x="1026.6667" y="262.2222" text-anchor="middle" font-size="13.3333" fill="var(--text)" font-family="sans-serif">/etc/shadow</text>
  <text x="1026.6667" y="286.2222" text-anchor="middle" font-size="13.3333" fill="var(--text)" font-family="sans-serif">LDAP</text>
  <text x="1026.6667" y="310.2222" text-anchor="middle" font-size="13.3333" fill="var(--text)" font-family="sans-serif">Kerberos</text>
  <text x="1026.6667" y="334.2222" text-anchor="middle" font-size="13.3333" fill="var(--text)" font-family="sans-serif">RADIUS</text>
</svg>